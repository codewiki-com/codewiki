name: Content error
description: Report an incorrect, unclear, outdated, or unverified codewiki page.
title: '[Content error]: '
labels:
  - content
body:
  - type: input
    id: url
    attributes:
      label: Page URL
      description: Link to the English or Chinese page where you found the problem.
      placeholder: https://codewiki.com/python/closures/
    validations:
      required: true
  - type: textarea
    id: wrong
    attributes:
      label: What is wrong?
      description: Quote the smallest relevant passage or identify the example and explain the error.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      description: Describe the correction, expected behavior, or source that contradicts the page.
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime or tool version
      description: Include the exact version if this report concerns executable behavior.
      placeholder: Python 3.14.2, Node.js 24.8.0, TypeScript 6.0.1
    validations:
      required: false
