name: ci
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # The OG renderer downloads ~17 MB of TTF/OTF on a cold cache; keyed on the script that
      # names them so a changed font list re-fetches.
      - uses: actions/cache@v4
        with:
          path: .cache/fonts
          key: fonts-${{ hashFiles('scripts/fetch-fonts.mjs') }}
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check:links
      # The remaining steps read `dist`, so they have to follow the build. Only Chromium is
      # installed: `playwright.config.ts` declares that one project, and Lighthouse is pointed at
      # that same pinned browser instead of depending on the runner image's system Chrome.
      - run: |
          pnpm exec playwright install --with-deps chromium
          echo "CHROME_PATH=$(node -e "console.log(require('@playwright/test').chromium.executablePath())")" >> "$GITHUB_ENV"
      - run: pnpm test:e2e
      - run: pnpm exec lhci autorun
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: |
            playwright-report/
            test-results/
            .lighthouseci/
          retention-days: 7
