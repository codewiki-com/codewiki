name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.32.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # Mermaid rendering needs Chromium in both unit tests and the Astro build.
      - run: pnpm exec playwright install --with-deps chromium
      # The OG renderer downloads ~17 MB of TTF/OTF on a cold cache; keyed on the script that
      # names them so a changed font list re-fetches.
      - uses: actions/cache@v4
        with:
          path: .cache/fonts
          key: fonts-${{ hashFiles('scripts/fetch-fonts.mjs') }}
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test
      - name: Build static site
        env:
          # Leave memory for Chromium (Mermaid), Vite workers and the Actions runner.
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          free -m
          df -h .
          while sleep 30; do
            free -m
            ps -eo pid,rss,comm --sort=-rss | head -8
          done &
          build_monitor_pid=$!
          trap 'kill "$build_monitor_pid" 2>/dev/null || true' EXIT
          /usr/bin/time -v pnpm build
      - run: pnpm check:links
      # The remaining steps read `dist`, so they have to follow the build. Only Chromium is
      # installed: `playwright.config.ts` declares that one project, and Lighthouse is pointed at
      # that same pinned browser instead of depending on the runner image's system Chrome.
      - run: |
          echo "CHROME_PATH=$(node -e "console.log(require('@playwright/test').chromium.executablePath())")" >> "$GITHUB_ENV"
      - run: pnpm test:e2e
      - run: pnpm exec lhci autorun
      - name: Deploy to Cloudflare Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Add the CLOUDFLARE_API_TOKEN repository secret with Cloudflare Pages Edit access to the tomchen account."
            exit 1
          fi
          npx --yes wrangler@4.135.0 pages deploy dist --project-name codewiki --branch main --commit-hash "$GITHUB_SHA" --force
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: |
            playwright-report/
            test-results/
            .lighthouseci/
          retention-days: 7
