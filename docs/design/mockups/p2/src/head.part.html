  <script src="./support.js"></script>

<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=Noto+Sans+SC:wght@400;500&amp;display=swap">
  <style>
    body, .cw { /* TOKENS:START light */
      --bg:#f6f7f9; --sur:#ffffff; --sur2:#eef0f4; --line:#e2e5eb; --ink:#15181e; --ink2:#4b5160; --ink3:#7b8190;
      --acc:#3451d1; --acc-h:#2538a8; --acc-ink:#ffffff; --acc-soft:#e9ecfa; --acc2:#3451d1; --acc2-soft:#e9ecfa;
      --ok:#0f8a5f; --ok-soft:#e4f4ec; --warn:#b4540a; --warn-soft:#fdf0e4; --bad:#b3261e; --bad-soft:#fbe9e7;
      --on-bg:#15181e; --on-ink:#ffffff; --glow: 0 30px 60px -36px rgba(21,24,30,0.35);
      --code-bg:#0f1117; --code-line:#1d2130; --code-ink:#c9d1e3; --code-out:#0b0d13; --k:#7aa2f7; --s:#9ece6a; --f:#e0af68; --c:#565f89; --n:#ff9e64; --run-bg:#9ece6a; --run-ink:#0f1117;
    /* TOKENS:END */ }
    body { margin: 0; background: var(--bg); }
    a { color: var(--acc); text-decoration: none; } a:hover { color: var(--acc-h); }
    .cw { --sans:'IBM Plex Sans','Noto Sans SC',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,monospace; font-family: var(--sans); color: var(--ink); background: var(--bg); -webkit-font-smoothing: antialiased; }
    .cw .nav a { color: var(--ink2); font-size: 14px; font-weight: 500; }
    .cw .mono { font-family: var(--mono); }
    .cw .lbl { font-family: var(--mono); font-size: 12px; color: var(--ink3); letter-spacing: 0.02em; }
    .cw h1, .cw h2, .cw h3 { margin: 0; font-weight: 600; letter-spacing: -0.02em; color: var(--ink); }
    .cw p { margin: 0; }
    .cw .panel { background: var(--sur); border: 1px solid var(--line); border-radius: 8px; }
    .cw .tag { font-family: var(--mono); font-size: 11.5px; padding: 2px 6px; border-radius: 4px; background: var(--sur2); color: var(--ink2); white-space: nowrap; }
    .cw .tag.acc { background: var(--acc-soft); color: var(--acc); }
    .cw .tag.acc2 { background: var(--acc2-soft); color: var(--acc2); }
    .cw .tag.ok { background: var(--ok-soft); color: var(--ok); }
    .cw .tag.warn { background: var(--warn-soft); color: var(--warn); }
    .cw .tag.bad { background: var(--bad-soft); color: var(--bad); }
    .cw .zh { font-family: 'Noto Sans SC', var(--sans); }
    .cw .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; padding: 2px; background: var(--sur); gap: 2px; }
    .cw .seg span { font-size: 12.5px; padding: 4px 10px; border-radius: 4px; color: var(--ink3); white-space: nowrap; }
    .cw .seg span.on { background: var(--on-bg); color: var(--on-ink); }
    .cw .search { display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink3); font-size: 13.5px; width: 240px; }
    .cw .kbd { font-family: var(--mono); font-size: 11px; border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; background: var(--sur); color: var(--ink3); }
    .cw .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: 6px; font-size: 14px; font-weight: 500; white-space: nowrap; }
    .cw .btn-p { background: var(--acc); color: var(--acc-ink); } .cw .btn-g { background: var(--sur); border: 1px solid var(--line); color: var(--ink); }
    .cw .btn-ai { background: var(--sur); border: 1px solid var(--acc2); color: var(--acc2); }
    .cw .btn.sm { height: 34px; font-size: 13px; padding: 0 12px; }
    .cw .code { font-family: var(--mono); font-size: 13px; line-height: 1.65; white-space: pre; color: var(--code-ink); }
    .cw .k { color: var(--k); } .cw .s { color: var(--s); } .cw .f { color: var(--f); } .cw .c { color: var(--c); } .cw .n { color: var(--n); }
    .cw .codebox { border-radius: 8px; overflow: hidden; background: var(--code-bg); border: 1px solid var(--code-line); }
    .cw .codehead { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px 8px 14px; border-bottom: 1px solid var(--code-line); }
    .cw .run { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 500; color: var(--run-ink); background: var(--run-bg); border-radius: 4px; padding: 4px 10px; }
    .cw .out { font-family: var(--mono); border-top: 1px solid var(--code-line); padding: 10px 18px; font-size: 12.5px; color: var(--code-ink); background: var(--code-out); display: flex; flex-direction: column; gap: 2px; }
    .cw .toc a { display: block; font-size: 13px; color: var(--ink3); padding: 4px 0 4px 12px; border-left: 2px solid var(--line); }
    .cw .toc a.on { color: var(--acc); border-left-color: var(--acc); }
    .cw .prose p { margin: 0; font-size: 16px; line-height: 1.7; color: var(--ink); }
    .cw .prose p.zh { font-size: 15px; line-height: 1.9; color: var(--ink2); padding-left: 14px; border-left: 2px solid var(--line); }
    .cw .prose h2 { font-size: 26px; margin-top: 10px; }
    .cw .term { border-bottom: 1px dotted var(--acc); }
    .cw .opt { display: flex; align-items: center; gap: 12px; border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; font-family: var(--mono); font-size: 13px; background: var(--sur); color: var(--ink); }
    .cw .opt.sans { font-family: var(--sans); font-size: 14.5px; }
    .cw .opt .r { width: 15px; height: 15px; border-radius: 50%; border: 1.5px solid var(--ink3); flex: none; }
    .cw .opt.ok { border-color: var(--ok); background: var(--ok-soft); } .cw .opt.ok .r { border-color: var(--ok); background: var(--ok); box-shadow: inset 0 0 0 3px var(--ok-soft); }
    .cw .opt.bad { border-color: var(--bad); background: var(--bad-soft); } .cw .opt.bad .r { border-color: var(--bad); background: var(--bad); box-shadow: inset 0 0 0 3px var(--bad-soft); }
    .cw .opt.sel { border-color: var(--acc); box-shadow: 0 0 0 2px var(--acc-soft); } .cw .opt.sel .r { border-color: var(--acc); background: var(--acc); box-shadow: inset 0 0 0 3px var(--sur); }
    .cw .act { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink2); border: 1px solid var(--line); background: var(--sur); border-radius: 6px; padding: 7px 11px; white-space: nowrap; }
    .cw .act.ai { color: var(--acc2); border-color: var(--acc2); }
    .cw .tabs { display: flex; gap: 22px; border-bottom: 1px solid var(--line); }
    .cw .tabs span { font-size: 13.5px; color: var(--ink3); padding: 8px 0 10px; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
    .cw .tabs span.on { color: var(--ink); border-bottom-color: var(--ink); font-weight: 500; }
    .cw .tabs span.ai { color: var(--acc2); }
    .cw .kv { display: grid; grid-template-columns: 90px minmax(0, 1fr); gap: 4px 12px; font-size: 13px; color: var(--ink); }
    .cw .kv .k2 { font-family: var(--mono); color: var(--ink3); font-size: 12px; }
    .cw .item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--sur); font-size: 14.5px; color: var(--ink); }
    .cw .item.cur { border-color: var(--acc); box-shadow: 0 0 0 2px var(--acc-soft); }
    .cw .item .lbl { margin-left: auto; }
    .cw .card { background: var(--sur); border: 1px solid var(--line); border-radius: 8px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }
    .cw .card.ai { border-color: var(--acc2); }
    .cw .card .ttl { font-size: 15px; font-weight: 600; color: var(--ink); line-height: 1.35; }
    .cw .card .sub { font-size: 13.5px; color: var(--ink2); line-height: 1.5; }
    .cw .snip { font-family: var(--mono); font-size: 12px; background: var(--sur2); border-radius: 4px; padding: 2px 6px; color: var(--ink); white-space: nowrap; }
    .cw .code.lines { white-space: normal; }
    .cw .ln > span:last-child { white-space: pre; line-height: 1.65; }
    .cw .ln { display: grid; grid-template-columns: 40px 26px minmax(0, 1fr); align-items: start; padding: 0 14px 0 0; }
    .cw .ln .no { font-family: var(--mono); font-size: 12px; color: var(--c); text-align: right; padding-right: 8px; line-height: 1.65; }
    .cw .ln .mk { width: 12px; height: 12px; border-radius: 3px; border: 1px solid var(--c); margin-top: 5px; }
    .cw .ln.hit { background: color-mix(in srgb, var(--f) 14%, transparent); } .cw .ln.hit .mk { background: var(--f); border-color: var(--f); }
    .cw .ln.miss { background: color-mix(in srgb, var(--n) 14%, transparent); } .cw .ln.miss .mk { border-color: var(--n); border-style: dashed; }
    .cw .note { font-family: var(--sans); font-size: 13px; line-height: 1.5; color: var(--ink); background: var(--sur); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; margin: 4px 14px 8px 66px; white-space: normal; display: flex; gap: 8px; align-items: flex-start; }
    .cw .note.expert { border-color: var(--acc2); }
    .cw .rate { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--sur); font-size: 14px; font-weight: 500; color: var(--ink); }
    .cw .rate .lbl { font-size: 11.5px; }
    .cw .chk { width: 15px; height: 15px; border-radius: 4px; border: 1.5px solid var(--ink3); flex: none; }
    .cw .chk.on { background: var(--acc); border-color: var(--acc); }
    .cw .field { display: flex; align-items: center; gap: 10px; min-height: 38px; padding: 0 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--sur); color: var(--ink3); font-size: 14px; }
    .cw .step { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink3); white-space: nowrap; }
    .cw .step .n { width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--line); display: inline-flex; align-items: center; justify-content: center; font-family: var(--mono); font-size: 11.5px; }
    .cw .step.on { color: var(--ink); } .cw .step.on .n { background: var(--on-bg); color: var(--on-ink); border-color: var(--on-bg); }
    .cw .step.done .n { background: var(--ok-soft); color: var(--ok); border-color: var(--ok); }
    .cw .bar { height: 6px; border-radius: 3px; background: var(--sur2); overflow: hidden; } .cw .bar i { display: block; height: 100%; background: var(--acc); }
    .cw .cheat { display: flex; flex-direction: column; gap: 8px; padding: 14px 16px; }
    .cw .cheat h3 { font-size: 12px; font-family: var(--mono); color: var(--ink3); letter-spacing: 0.06em; text-transform: uppercase; font-weight: 500; }
    .cw .cheat .r2 { display: flex; flex-direction: column; gap: 7px; font-size: 13px; color: var(--ink2); line-height: 1.45; }
    .cw .cheat .cr { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; }
    .cw .cheat .cr .snip { white-space: pre; }
    .cw .cheat .cr .nt { flex: 1; min-width: 110px; }
    .cw .q { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 8px; background: var(--sur); }
    .cw .q .qh { display: flex; align-items: center; gap: 12px; padding: 14px 16px; font-size: 15px; font-weight: 500; color: var(--ink); }
    .cw .q .qh .lbl { margin-left: auto; }
    .cw .q.open { border-color: var(--acc); }
    .cw .q .qa { border-top: 1px solid var(--line); padding: 16px 16px 18px 58px; display: flex; flex-direction: column; gap: 12px; font-size: 15px; line-height: 1.65; color: var(--ink); }
    .cw .ring { width: 64px; height: 64px; flex: none; }
    .cw .stat { display: flex; flex-direction: column; gap: 2px; } .cw .stat b { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; color: var(--ink); } .cw .stat .lbl { font-size: 11.5px; }
    .cw .preview { font-family: var(--mono); font-size: 12.5px; line-height: 1.6; color: var(--code-ink); background: var(--code-bg); border: 1px solid var(--code-line); border-radius: 8px; padding: 16px 18px; white-space: pre-wrap; }
    .cw .preview .h { color: var(--f); } .cw .preview .dim { color: var(--c); }
    .cw .radio { display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--sur); }
    .cw .radio.on { border-color: var(--acc); box-shadow: 0 0 0 2px var(--acc-soft); }
    .cw .radio .r { width: 15px; height: 15px; border-radius: 50%; border: 1.5px solid var(--ink3); flex: none; margin-top: 2px; }
    .cw .radio.on .r { border-color: var(--acc); background: var(--acc); box-shadow: inset 0 0 0 3px var(--sur); }
    .cw .radio .t { font-size: 14px; font-weight: 500; color: var(--ink); } .cw .radio .d { font-size: 12.5px; color: var(--ink3); line-height: 1.45; }
    .cw .vocab { display: flex; flex-wrap: wrap; gap: 6px; }
    .cw .vocab span { font-family: var(--mono); font-size: 12px; padding: 3px 8px; border-radius: 4px; border: 1px solid var(--line); background: var(--sur); color: var(--ink2); }
    .cw .vocab span .zh { color: var(--ink3); margin-left: 6px; }
    .cw .callout { border: 1px solid var(--line); border-left: 3px solid var(--warn); border-radius: 8px; padding: 12px 14px; background: var(--sur); display: flex; flex-direction: column; gap: 6px; }
    .cw .callout .lbl { color: var(--warn); }
  </style>
</helmet>
