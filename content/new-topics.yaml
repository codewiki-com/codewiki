generatedAt: 2026-09-04
tracks:
  ai-era:
    - id: ai-era/agent-context-management
      section: working-with-agents
      title: { en: 'Agent context management', zh: '智能体上下文管理' }
      description: { en: 'Select and refresh repository context so an agent reasons from relevant code, constraints, and current evidence.', zh: '选择并及时更新仓库上下文，让智能体依据相关代码、约束和最新证据进行推理。' }
      difficulty: beginner
      prerequisites: [ai-era/ai-coding-agents]
      why: Agents often act on incomplete, stale, or noisy context and confidently change the wrong code.
    - id: ai-era/agent-task-planning
      section: working-with-agents
      title: { en: 'Agent task planning', zh: '智能体任务规划' }
      description: { en: 'Turn a coding goal into bounded steps, checkpoints, and stopping conditions an agent can execute and you can inspect.', zh: '把编码目标拆成有边界的步骤、检查点和停止条件，便于智能体执行和人工检查。' }
      difficulty: intermediate
      prerequisites: [ai-era/ai-coding-agents]
      why: Agents drift, over-edit, or declare success early when a task has no explicit plan or stopping rule.
    - id: ai-era/agent-instructions-and-mcp
      section: working-with-agents
      title: { en: 'Agent instructions and MCP', zh: '智能体指令与 MCP' }
      description: { en: 'Write AGENTS.md and CLAUDE.md guidance and expose scoped tools through MCP so agents follow repository-specific rules.', zh: '编写 AGENTS.md 和 CLAUDE.md 指引，并通过 MCP 提供受限工具，让智能体遵守仓库规则。' }
      difficulty: intermediate
      prerequisites: [ai-era/agent-context-management]
      why: Agents ignore implicit conventions and misuse broad tools when instructions and tool contracts are not explicit.
    - id: ai-era/unfamiliar-code-reading
      section: reviewing-ai-code
      title: { en: 'Unfamiliar code reading', zh: '陌生代码阅读' }
      description: { en: 'Trace entry points, data flow, side effects, and invariants to build a fast, testable model of unfamiliar code.', zh: '追踪入口、数据流、副作用和不变量，快速建立可验证的陌生代码模型。' }
      difficulty: beginner
      prerequisites: []
      why: Generated explanations can sound coherent while inventing control flow or overlooking hidden state.
    - id: ai-era/generated-change-review
      section: reviewing-ai-code
      title: { en: 'Generated change review', zh: '生成式改动审查' }
      description: { en: 'Review generated diffs across files for correctness, edge cases, maintainability, and unintended behavior.', zh: '跨文件审查生成式差异，判断正确性、边界情况、可维护性和意外行为。' }
      difficulty: intermediate
      prerequisites: [ai-era/unfamiliar-code-reading, foundations/git-deep-dive]
      why: Generated patches are often locally plausible but inconsistent with callers, invariants, or repository conventions.
    - id: ai-era/ai-assisted-debugging
      section: reviewing-ai-code
      title: { en: 'AI-assisted debugging', zh: 'AI 辅助调试' }
      description: { en: 'Use an AI pair to form hypotheses, design discriminating checks, and follow runtime evidence to a root cause.', zh: '借助 AI 结对提出假设、设计有区分度的检查，并沿运行证据定位根因。' }
      difficulty: intermediate
      prerequisites: [ai-era/unfamiliar-code-reading]
      why: AI debuggers tend to guess fixes from symptoms instead of isolating the failing assumption with evidence.
    - id: ai-era/executable-specifications
      section: specs-and-tests
      title: { en: 'Executable specifications', zh: '可执行规格' }
      description: { en: 'Express behavior, boundaries, and acceptance criteria in examples and checks an agent can execute.', zh: '用智能体可执行的示例和检查来表达行为、边界与验收标准。' }
      difficulty: beginner
      prerequisites: [ai-era/agent-task-planning]
      why: Agents fill ambiguous requirements with plausible assumptions that may contradict the intended behavior.
    - id: ai-era/tests-as-agent-guardrails
      section: specs-and-tests
      title: { en: 'Tests as agent guardrails', zh: '作为智能体护栏的测试' }
      description: { en: 'Design focused tests that constrain implementation choices, expose regressions, and make agent work auditable.', zh: '设计聚焦的测试来约束实现选择、暴露回归，并让智能体的工作可审计。' }
      difficulty: intermediate
      prerequisites: [ai-era/executable-specifications]
      why: Agents optimize for visible tests and can preserve the happy path while breaking untested behavior.
    - id: ai-era/llm-application-evals
      section: specs-and-tests
      title: { en: 'LLM application evals', zh: 'LLM 应用评测' }
      description: { en: 'Build representative cases, scoring rules, and regression thresholds for nondeterministic LLM features.', zh: '为具有非确定性的 LLM 功能建立代表性用例、评分规则和回归阈值。' }
      difficulty: advanced
      prerequisites: [ai-era/tests-as-agent-guardrails]
      why: Generated LLM features can pass a few demos while failing real distributions, edge cases, or quality thresholds.
    - id: ai-era/code-prompt-vocabulary
      section: prompting-for-code
      title: { en: 'Code prompt vocabulary', zh: '代码提示词术语' }
      description: { en: 'Name interfaces, invariants, failure modes, and code structures precisely enough to request the intended change.', zh: '准确描述接口、不变量、失败模式和代码结构，从而提出符合意图的改动请求。' }
      difficulty: beginner
      prerequisites: [ai-era/ai-coding-agents]
      why: Vague wording makes agents choose the wrong abstraction while still producing code that looks reasonable.
    - id: ai-era/constraint-rich-prompts
      section: prompting-for-code
      title: { en: 'Constraint-rich prompts', zh: '约束明确的提示词' }
      description: { en: 'State scope, non-goals, compatibility limits, and acceptance commands in prompts that bound generated changes.', zh: '在提示词中写明范围、非目标、兼容性限制和验收命令，约束生成式改动。' }
      difficulty: intermediate
      prerequisites: [ai-era/code-prompt-vocabulary, ai-era/executable-specifications]
      why: Agents routinely expand scope or violate unstated constraints when only the desired feature is described.
    - id: ai-era/examples-and-counterexamples
      section: prompting-for-code
      title: { en: 'Examples and counterexamples', zh: '示例与反例' }
      description: { en: 'Use representative inputs, desired outputs, and counterexamples to disambiguate a coding request.', zh: '用代表性输入、预期输出和反例消除编码请求中的歧义。' }
      difficulty: intermediate
      prerequisites: [ai-era/code-prompt-vocabulary]
      why: Agents overgeneralize from a single happy-path example and silently mishandle nearby cases.
    - id: ai-era/ai-coding-agents
      section: tooling
      title: { en: 'AI coding agents', zh: 'AI 编码智能体' }
      description: { en: 'How coding agents read code, call tools, react to execution results, and stay bounded by permissions and verification evidence.', zh: '理解编码智能体如何读取代码、调用工具、响应执行结果，并用权限边界与验证证据约束其行为。' }
      difficulty: intermediate
      prerequisites: []
      why: Agent loops can amplify a mistaken assumption through repeated tool calls unless users understand their control boundaries.
    - id: ai-era/ai-coding-cli
      section: tooling
      title: { en: 'AI coding CLIs', zh: 'AI 编码命令行工具' }
      description: { en: 'Use Claude Code and Codex CLI with bounded directories, permissions, context, and reproducible verification commands.', zh: '在限定目录、权限和上下文的前提下使用 Claude Code 与 Codex CLI，并通过可复现命令验证结果。' }
      difficulty: intermediate
      prerequisites: [ai-era/ai-coding-agents]
      why: Terminal agents can modify broad system state or report success without leaving reproducible evidence.
    - id: ai-era/ai-ide
      section: tooling
      title: { en: 'AI IDEs', zh: 'AI 集成开发环境' }
      description: { en: 'Use Cursor and GitHub Copilot while controlling editor context, reviewing diffs, and independently verifying changes.', zh: '使用 Cursor 和 GitHub Copilot 时控制编辑器上下文、审查差异，并独立验证改动。' }
      difficulty: intermediate
      prerequisites: [ai-era/ai-coding-agents]
      why: IDE suggestions feel authoritative in context but can omit dependencies, misuse permissions, or hide cross-file effects.
    - id: ai-era/agent-use-boundaries
      section: judgement
      title: { en: 'Agent use boundaries', zh: '智能体使用边界' }
      description: { en: 'Decide when uncertainty, sensitivity, cost, or weak verification makes direct human work or simpler automation safer.', zh: '判断不确定性、敏感性、成本或验证不足何时意味着人工处理或简单自动化更安全。' }
      difficulty: beginner
      prerequisites: [ai-era/ai-coding-agents]
      why: Agents add risk and overhead when a task lacks bounded permissions, reliable feedback, or a checkable outcome.
    - id: ai-era/generated-code-security
      section: judgement
      title: { en: 'Generated code security', zh: '生成代码安全' }
      description: { en: 'Threat-model generated changes and check trust boundaries, secrets, dependencies, input handling, and authorization.', zh: '对生成式改动进行威胁建模，并检查信任边界、密钥、依赖、输入处理和授权。' }
      difficulty: advanced
      prerequisites: [ai-era/generated-change-review]
      why: Models reproduce insecure patterns and rarely recognize the full trust boundary of the system they modify.
    - id: ai-era/code-provenance-and-verification
      section: judgement
      title: { en: 'Code provenance and verification', zh: '代码来源与验证' }
      description: { en: 'Check generated code with independent evidence and trace copied patterns, dependencies, and licenses before shipping.', zh: '发布前用独立证据检查生成代码，并追溯复用模式、依赖和许可证的来源。' }
      difficulty: intermediate
      prerequisites: [ai-era/generated-change-review]
      why: Agents can fabricate validation, obscure borrowed code origins, and introduce dependencies with incompatible licenses.
  foundations:
    - id: foundations/algorithmic-complexity
      section: algorithms
      title: { en: 'Algorithmic complexity', zh: '算法复杂度' }
      description: { en: 'Estimate time and space growth with asymptotic notation and choose implementations that scale for real inputs.', zh: '用渐近记号估算时间与空间增长，并为实际输入选择可扩展的实现。' }
      difficulty: beginner
      prerequisites: []
      why: Complexity gives readers a durable way to compare algorithms beyond one benchmark or machine.
    - id: foundations/sorting-and-searching
      section: algorithms
      title: { en: 'Sorting and searching', zh: '排序与查找' }
      description: { en: 'Choose and implement sorting and searching strategies from data shape, ordering guarantees, and complexity.', zh: '根据数据形态、顺序保证和复杂度选择并实现排序与查找策略。' }
      difficulty: beginner
      prerequisites: [foundations/algorithmic-complexity]
      why: Sorting and searching expose the tradeoffs behind many library operations and application bottlenecks.
    - id: foundations/recursion
      section: algorithms
      title: { en: 'Recursion', zh: '递归' }
      description: { en: 'Define recursive cases, prove termination, trace the call stack, and replace recursion when depth is unsafe.', zh: '定义递归分支、证明终止性、追踪调用栈，并在深度不安全时改用迭代。' }
      difficulty: intermediate
      prerequisites: [foundations/algorithmic-complexity]
      why: Recursion connects inductive reasoning to real stack limits and divide-and-conquer algorithms.
    - id: foundations/arrays-and-linked-lists
      section: data-structures
      title: { en: 'Arrays and linked lists', zh: '数组与链表' }
      description: { en: 'Choose between contiguous arrays and linked nodes by access patterns, mutation costs, locality, and memory overhead.', zh: '依据访问模式、修改成本、局部性和内存开销，在连续数组与链式节点之间取舍。' }
      difficulty: beginner
      prerequisites: [foundations/algorithmic-complexity]
      why: Arrays and lists make the cost of indexing, insertion, allocation, and cache locality concrete.
    - id: foundations/hash-maps
      section: data-structures
      title: { en: 'Hash maps', zh: '哈希表' }
      description: { en: 'Use hashing, collision handling, resizing, and key equality to build and evaluate constant-time lookup tables.', zh: '运用哈希、冲突处理、扩容和键相等规则，构建并评估常数时间查找表。' }
      difficulty: intermediate
      prerequisites: [foundations/arrays-and-linked-lists]
      why: Hash maps hide important correctness and performance behavior behind a familiar key-value interface.
    - id: foundations/trees-and-graphs
      section: data-structures
      title: { en: 'Trees and graphs', zh: '树与图' }
      description: { en: 'Model hierarchical and connected data, then traverse it with depth-first and breadth-first strategies.', zh: '用树和图建模层级与连接关系，并通过深度优先和广度优先策略遍历数据。' }
      difficulty: intermediate
      prerequisites: [foundations/arrays-and-linked-lists, foundations/recursion]
      why: Trees and graphs provide the models behind dependency systems, routes, syntax, and indexes.
    - id: foundations/http-semantics
      section: networking
      title: { en: 'HTTP semantics', zh: 'HTTP 语义' }
      description: { en: 'Design and diagnose HTTP exchanges using methods, status codes, fields, caching, idempotency, and connection boundaries.', zh: '运用方法、状态码、字段、缓存、幂等性和连接边界设计并诊断 HTTP 交互。' }
      difficulty: beginner
      prerequisites: []
      why: HTTP semantics govern browser and API behavior independently of framework syntax or protocol version.
    - id: foundations/network-programming
      section: networking
      title: { en: 'Network programming', zh: '网络编程' }
      description: { en: 'Start with socket, TCP, and UDP semantics, then handle framing, timeouts, shutdown, and backpressure without ambiguous boundaries.', zh: '从套接字、TCP 和 UDP 语义出发，正确处理消息分帧、超时、关闭和背压，避免边界歧义。' }
      difficulty: intermediate
      prerequisites: [foundations/linux]
      why: TCP/IP and sockets explain the byte-stream behavior hidden beneath higher-level clients and servers.
    - id: foundations/dns-resolution
      section: networking
      title: { en: 'DNS resolution', zh: 'DNS 解析' }
      description: { en: 'Trace names through recursive and authoritative DNS, caching, record types, TTLs, and failure modes.', zh: '追踪域名经过递归与权威 DNS 的解析过程，理解缓存、记录类型、TTL 和失败模式。' }
      difficulty: intermediate
      prerequisites: [foundations/network-programming]
      why: DNS failures and stale answers can resemble application or transport bugs unless resolution is understood separately.
    - id: foundations/tls-connections
      section: networking
      title: { en: 'TLS connections', zh: 'TLS 连接' }
      description: { en: 'Verify how certificates, hostnames, trust chains, handshakes, and key agreement protect connections.', zh: '验证证书、主机名、信任链、握手和密钥协商如何保护连接。' }
      difficulty: intermediate
      prerequisites: [foundations/network-programming, foundations/dns-resolution]
      why: TLS failures are easy to bypass unsafely when authentication, encryption, and trust are treated as one black box.
    - id: foundations/linux
      section: operating-systems
      title: { en: 'Linux', zh: 'Linux' }
      description: { en: 'Understand Linux kernel boundaries, files and permissions, processes, descriptors, and signals, then troubleshoot them with verifiable commands.', zh: '理解 Linux 的内核边界、文件与权限、进程、描述符和信号，并使用可验证的命令排查问题。' }
      difficulty: intermediate
      prerequisites: []
      why: Linux makes operating-system abstractions visible through files, system calls, permissions, and diagnostic tools.
    - id: foundations/processes-and-threads
      section: operating-systems
      title: { en: 'Processes and threads', zh: '进程与线程' }
      description: { en: 'Distinguish processes and threads, trace their lifecycle and shared state, and reason about scheduling and synchronization.', zh: '区分进程与线程，追踪其生命周期和共享状态，并分析调度与同步。' }
      difficulty: intermediate
      prerequisites: [foundations/linux]
      why: Process isolation and thread sharing determine the behavior of concurrency, failures, and resource ownership.
    - id: foundations/virtual-memory
      section: operating-systems
      title: { en: 'Virtual memory', zh: '虚拟内存' }
      description: { en: 'Reason about address spaces, pages, allocation, caching, swapping, and memory faults in running programs.', zh: '分析运行中程序的地址空间、分页、分配、缓存、换页和内存故障。' }
      difficulty: intermediate
      prerequisites: [foundations/linux, foundations/processes-and-threads]
      why: Virtual memory explains why program addresses differ from physical storage and why memory failures cross abstraction layers.
    - id: foundations/git-deep-dive
      section: git-shell
      title: { en: "Git's internal model", zh: 'Git 内部模型' }
      description: { en: 'Understand Git through objects, references, the index, and the commit graph, then rebase, undo, and recover work safely.', zh: '从对象、引用、索引和提交图理解 Git，并安全地执行变基、撤销和恢复。' }
      difficulty: intermediate
      prerequisites: [foundations/linux]
      why: Git's object model turns branching, merging, rebasing, undoing, and recovery into predictable graph operations.
    - id: foundations/shell-basics
      section: git-shell
      title: { en: 'Shell basics', zh: 'Shell 基础' }
      description: { en: 'Navigate files, quote arguments, expand variables, inspect exit status, and run commands safely in a shell.', zh: '在 Shell 中安全地浏览文件、引用参数、展开变量、检查退出状态并运行命令。' }
      difficulty: beginner
      prerequisites: [foundations/linux]
      why: Shell parsing and process behavior determine whether a command operates on the intended inputs and paths.
    - id: foundations/pipes-and-redirection
      section: git-shell
      title: { en: 'Pipes and redirection', zh: '管道与重定向' }
      description: { en: 'Compose commands with standard streams, pipelines, redirection, and exit handling without losing errors or data.', zh: '利用标准流、管道、重定向和退出状态组合命令，同时避免丢失错误或数据。' }
      difficulty: intermediate
      prerequisites: [foundations/shell-basics]
      why: Pipelines expose the stream and process model behind reliable command-line automation.
    - id: foundations/unicode-text
      section: text-numbers
      title: { en: 'Unicode text', zh: 'Unicode 文本' }
      description: { en: 'Handle code points, encodings, grapheme clusters, normalization, and text comparison without corrupting user data.', zh: '正确处理码点、编码、字素簇、规范化和文本比较，避免破坏用户数据。' }
      difficulty: intermediate
      prerequisites: []
      why: Unicode separates stored bytes from user-perceived characters in ways every text-processing program must respect.
    - id: foundations/floating-point-arithmetic
      section: text-numbers
      title: { en: 'Floating-point arithmetic', zh: '浮点数运算' }
      description: { en: 'Predict rounding, representation error, overflow, and comparison behavior in binary floating-point calculations.', zh: '预测二进制浮点计算中的舍入、表示误差、溢出和比较行为。' }
      difficulty: intermediate
      prerequisites: []
      why: Floating-point values approximate real numbers, so ordinary-looking arithmetic can violate intuitive equalities.
    - id: foundations/dates-and-time
      section: text-numbers
      title: { en: 'Dates and time', zh: '日期与时间' }
      description: { en: 'Represent instants, civil time, time zones, durations, and calendar arithmetic without ambiguous conversions.', zh: '准确表示时间点、民用时间、时区、时长和日历运算，避免歧义转换。' }
      difficulty: intermediate
      prerequisites: []
      why: Time zones and calendars make timestamps and duration arithmetic context-dependent rather than simple numbers.
    - id: foundations/regular-expressions
      section: text-numbers
      title: { en: 'Regular expressions', zh: '正则表达式' }
      description: { en: 'Build, read, test, and bound regular expressions for validation, search, capture, and replacement tasks.', zh: '为校验、搜索、捕获和替换任务编写、阅读、测试并约束正则表达式。' }
      difficulty: beginner
      prerequisites: [foundations/unicode-text]
      why: Regular expressions are concise text programs whose escaping, matching, and performance traps are easy to miss.
