terms:
  - id: dynamic-array
    en: Dynamic array
    zh: 动态数组
    aliases: [resizable array]
    short:
      en: 'A growable indexed sequence that keeps logical length separate from allocated capacity.'
      zh: '一种可增长的索引序列，分别记录逻辑长度与已分配容量。'
    topics: [foundations/arrays-and-linked-lists]

  - id: linked-list
    en: Linked list
    zh: 链表
    aliases: [linked chain]
    short:
      en: 'A sequence of nodes whose links identify the next node and, optionally, the previous node.'
      zh: '由节点组成的序列；节点链接指向后继节点，也可以同时指向前驱节点。'
    topics: [foundations/arrays-and-linked-lists]

  - id: cache-locality
    en: Cache locality
    zh: 缓存局部性
    aliases: [memory locality, locality of reference]
    short:
      en: 'The tendency of nearby or recently accessed memory to be available in faster processor caches.'
      zh: '相邻或近期访问的内存更可能位于高速处理器缓存中的特性。'
    topics: [foundations/arrays-and-linked-lists]
