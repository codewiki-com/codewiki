terms:
  - id: game-object
    en: GameObject
    zh: 游戏对象
    short:
      en: 'The basic object in a Unity scene; it owns a Transform and any components that provide its data and behavior.'
      zh: 'Unity 场景中的基本对象；它拥有一个 Transform，以及提供数据与行为的其他组件。'

  - id: unity-component
    en: Unity component
    zh: Unity 组件
    short:
      en: 'One attachable piece of data or behavior owned by a GameObject, including built-in types and MonoBehaviour scripts.'
      zh: '挂在 GameObject 上的一块数据或行为，包括内置组件类型与 MonoBehaviour 脚本。'

  - id: serialized-field
    en: Serialized field
    zh: 序列化字段
    short:
      en: 'A script field whose supported value Unity stores in a scene or asset and can expose for Inspector editing.'
      zh: '由 Unity 把受支持的值保存到场景或资源中，并可供 Inspector 编辑的脚本字段。'

  - id: prefab
    en: Prefab
    zh: 预制体
    short:
      en: 'A reusable GameObject hierarchy saved as a Unity asset, from which connected instances can be created.'
      zh: '保存为 Unity 资源的可复用 GameObject 层级，可据此创建仍与来源相连的实例。'
