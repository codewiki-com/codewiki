terms:
  - id: cap-theorem
    en: CAP theorem
    zh: CAP 定理
    short:
      en: An impossibility result relating linearizability, availability, and network partitions in shared-data systems.
      zh: 说明共享数据系统无法在网络分区下同时保证线性一致性与可用性的不可能性结论。
  - id: linearizability
    en: Linearizability
    zh: 线性一致性
    short:
      en: A model where each operation appears atomic between invocation and response and respects real-time order.
      zh: 每个操作看似在调用与返回之间原子发生，并且遵守真实时间顺序的一致性模型。
  - id: network-partition
    en: Network partition
    zh: 网络分区
    short:
      en: A fault in which some nodes remain running but messages between groups are lost or indefinitely delayed.
      zh: 部分节点仍在运行，但节点组之间的消息丢失或无限延迟的网络故障。
  - id: quorum
    en: Quorum
    zh: 法定人数
    short:
      en: A subset of replicas large enough to authorize an operation under a distributed protocol.
      zh: 在分布式协议中，数量足以授权某项操作的一组副本。
  - id: eventual-consistency
    en: Eventual consistency
    zh: 最终一致性
    short:
      en: A guarantee that replicas converge if updates stop and relevant messages are eventually delivered.
      zh: 停止更新且相关消息最终送达后，所有副本会收敛的保证。
  - id: pacelc
    en: PACELC
    zh: PACELC
    short:
      en: A principle adding the healthy-path latency-versus-consistency trade-off to CAP's partition choice.
      zh: 在 CAP 的分区取舍之外，补充正常路径中延迟与一致性取舍的设计原则。
