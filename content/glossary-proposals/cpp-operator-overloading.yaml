terms:
  - id: operator-overloading
    en: Operator overloading
    zh: 运算符重载
    short:
      en: 'Defining how an existing operator behaves when at least one operand has a class or enumeration type.'
      zh: '定义已有运算符在至少一个操作数为类或枚举类型时的行为。'

  - id: operator-function
    en: Operator function
    zh: 运算符函数
    short:
      en: 'A function declared with an operator-function name that implements one of the overloadable C++ operators.'
      zh: '使用运算符函数名声明、用于实现某个可重载 C++ 运算符的函数。'

  - id: overload-resolution
    en: Overload resolution
    zh: 重载决议
    short:
      en: 'The process that selects one best viable function from candidates by comparing argument conversion sequences.'
      zh: '通过比较实参转换序列，从候选中选出唯一最佳可行函数的过程。'

  - id: hidden-friend
    en: Hidden friend
    zh: 隐藏友元
    short:
      en: 'A non-member friend defined in a class and normally found through argument-dependent lookup rather than ordinary lookup.'
      zh: '定义在类中的非成员友元，通常由参数依赖查找而不是普通查找找到。'

  - id: three-way-comparison
    en: Three-way comparison
    zh: 三向比较
    short:
      en: 'A comparison that reports less, equivalent, greater, or, for a partial order, unordered in one result.'
      zh: '一次给出小于、等价、大于，或在偏序中给出无序结果的比较。'
