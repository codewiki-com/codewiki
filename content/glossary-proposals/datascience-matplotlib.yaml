terms:
  - id: matplotlib-figure
    en: Matplotlib Figure
    zh: Matplotlib 图形
    short:
      en: 'The top-level container that owns a plotting canvas, layout, and one or more Axes.'
      zh: '拥有绘图画布、布局以及一个或多个 Axes 的顶层容器。'

  - id: matplotlib-axes
    en: Matplotlib Axes
    zh: Matplotlib 坐标区
    short:
      en: 'One plotting area in a Figure, with data limits, labels, and the methods that add most artists.'
      zh: 'Figure 中的一个绘图区，包含数据范围、标签以及添加大多数图元的方法。'

  - id: matplotlib-artist
    en: Matplotlib Artist
    zh: Matplotlib 图元
    short:
      en: 'A visible or layout element in a Matplotlib figure, such as a line, rectangle, text label, or legend.'
      zh: 'Matplotlib 图形中的可见或布局元素，例如折线、矩形、文字标签或图例。'

  - id: matplotlib-backend
    en: Matplotlib backend
    zh: Matplotlib 后端
    short:
      en: 'The layer that connects a Figure canvas to a renderer and, when needed, a GUI event loop or file format.'
      zh: '把 Figure 画布连接到渲染器，并按需连接 GUI 事件循环或文件格式的层。'

  - id: colormap-normalization
    en: Colormap normalization
    zh: 颜色归一化
    short:
      en: 'The mapping from domain values into the numeric interval consumed by a colormap.'
      zh: '把领域数值映射到 colormap 所使用数值区间的过程。'
