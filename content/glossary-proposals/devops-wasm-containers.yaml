terms:
  - id: webassembly-module
    en: WebAssembly module
    zh: WebAssembly 模块
    short:
      en: 'A validated binary containing Wasm definitions, imports, exports, instructions, and data for a host runtime to instantiate.'
      zh: '由宿主运行时实例化的已验证二进制，包含 Wasm 定义、导入、导出、指令和数据。'

  - id: wasi
    en: WebAssembly System Interface
    zh: WebAssembly 系统接口
    short:
      en: 'A standards-track family of host interfaces that lets Wasm applications use explicitly supplied system capabilities.'
      zh: '一组处于标准化进程中的宿主接口，让 Wasm 应用使用显式提供的系统能力。'

  - id: component-model
    en: WebAssembly Component Model
    zh: WebAssembly 组件模型
    short:
      en: 'A WebAssembly architecture for typed, language-neutral interfaces, composition, and portable application components.'
      zh: '一种支持类型化、语言无关接口、组合与可移植应用组件的 WebAssembly 架构。'

  - id: oci-artifact
    en: OCI artifact
    zh: OCI 制品
    short:
      en: 'Non-container content distributed as a content-addressed graph of OCI descriptors, manifests, configuration, and blobs.'
      zh: '以 OCI 描述符、清单、配置和 blob 组成的内容寻址图分发的非容器内容。'

  - id: runtime-class
    en: RuntimeClass
    zh: RuntimeClass
    short:
      en: 'A Kubernetes resource that selects a configured CRI runtime handler and can add scheduling constraints and Pod overhead.'
      zh: '选择已配置 CRI 运行时 handler，并可添加调度约束与 Pod 开销的 Kubernetes 资源。'

  - id: containerd-shim
    en: containerd shim
    zh: containerd shim
    short:
      en: 'A process that adapts containerd task lifecycle operations to a particular low-level runtime or Wasm host.'
      zh: '把 containerd 任务生命周期操作适配到特定底层运行时或 Wasm 宿主的进程。'
