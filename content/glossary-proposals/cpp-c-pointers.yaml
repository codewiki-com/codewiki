terms:
  - id: object-pointer
    en: Object pointer
    zh: 对象指针
    aliases: []
    short: { en: 'A pointer type whose target is void or an object type, as distinct from a pointer to a function type.', zh: '目标为 void 或对象类型的指针类型，与目标为函数类型的指针相区别。' }
    topics: [cpp/c-pointers]
  - id: null-pointer
    en: Null pointer
    zh: 空指针
    aliases: []
    short: { en: 'A pointer value that is guaranteed not to point to any object or function and must not be dereferenced.', zh: '保证不指向任何对象或函数、不得解引用的特殊指针值。' }
    topics: [cpp/c-pointers]
