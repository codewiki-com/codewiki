terms:
  - id: technical-debt
    en: Technical debt
    zh: 技术债务
    short:
      en: A design or construction choice that makes a future class of software changes more costly than a more suitable choice would.
      zh: 一项设计或构造选择，它使未来某类软件变更比采用更合适的方案成本更高。

  - id: debt-principal
    en: Debt principal
    zh: 债务本金
    short:
      en: The work needed to move an indebted software element from its current state to the chosen target state.
      zh: 把存在债务的软件元素从当前状态改到选定目标状态所需的工作。

  - id: debt-interest
    en: Debt interest
    zh: 债务利息
    short:
      en: The extra work or risk paid when a change touches a software element whose technical debt remains in place.
      zh: 变更触及仍有技术债务的软件元素时，多付出的工作或风险。

  - id: characterization-test
    en: Characterization test
    zh: 特征测试
    short:
      en: A test that records existing observable behavior so structural changes can be separated from intentional behavior changes.
      zh: 记录现有可观察行为的测试，用于把结构修改与有意的行为变更分开。
