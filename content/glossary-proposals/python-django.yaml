terms:
  - id: django
    en: Django
    zh: Django
    short:
      en: 'A Python web framework with integrated routing, models, templates, forms, authentication, and administration.'
      zh: '集成路由、模型、模板、表单、认证和管理后台的 Python Web 框架。'

  - id: urlconf
    en: URLconf
    zh: URL 配置
    short:
      en: 'An ordered set of Django URL patterns that maps request paths to views.'
      zh: '一组有顺序的 Django URL 模式，用于把请求路径映射到视图。'

  - id: middleware
    en: Middleware
    zh: 中间件
    short:
      en: 'A component that wraps Django request and response handling to apply cross-cutting behavior.'
      zh: '包裹 Django 请求与响应处理流程，用于应用横切行为的组件。'

  - id: queryset
    en: QuerySet
    zh: 查询集
    short:
      en: 'A composable, usually lazy description of a database query and its eventual model results.'
      zh: '一种可组合且通常惰性的数据库查询描述，也表示查询最终得到的模型结果。'

  - id: migration
    en: Migration
    zh: 迁移
    short:
      en: 'A versioned Django operation that moves database schema or data from one recorded state to another.'
      zh: '受版本控制的 Django 操作，用于把数据库模式或数据从一个记录状态变到另一个状态。'
