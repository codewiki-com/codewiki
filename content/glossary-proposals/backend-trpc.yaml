terms:
  - id: trpc-router
    en: tRPC router
    zh: tRPC router
    short:
      en: 'A named tree of tRPC procedures whose TypeScript type supplies client paths, inputs, and outputs.'
      zh: '由 tRPC procedure 组成的具名树，其 TypeScript 类型为客户端提供路径、输入与输出。'

  - id: trpc-procedure
    en: tRPC procedure
    zh: tRPC procedure
    short:
      en: 'A callable tRPC pipeline that parses input, runs middleware and a resolver, and may validate output.'
      zh: '一条可调用的 tRPC 管线，依次解析输入、运行中间件与 resolver，并可验证输出。'

  - id: trpc-context
    en: tRPC context
    zh: tRPC 上下文
    short:
      en: 'Request or call state supplied to tRPC procedures, such as identity, services, tracing, and data access.'
      zh: '提供给 tRPC procedure 的请求或调用状态，例如身份、服务、跟踪信息与数据访问对象。'
