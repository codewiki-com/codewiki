terms:
  - id: function-type
    en: Function type
    zh: 函数类型
    short:
      en: 'A type that specifies a callable value through its receiver, parameter types, result type, and optional suspension.'
      zh: '通过接收者、参数类型、结果类型以及是否可挂起来规定可调用值的类型。'

  - id: non-local-return
    en: Non-local return
    zh: 非局部返回
    short:
      en: 'A return inside an inlined lambda that exits the function enclosing the lambda rather than only the lambda call.'
      zh: '位于内联 lambda 中、退出包围该 lambda 的函数，而非只结束本次 lambda 调用的返回。'

  - id: sam-conversion
    en: SAM conversion
    zh: SAM 转换
    short:
      en: 'Conversion of a matching lambda into an instance of an interface whose contract has one abstract method.'
      zh: '把签名匹配的 lambda 转换为只有一个抽象方法的接口实例。'
