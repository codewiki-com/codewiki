terms:
  - id: protocol-requirement
    en: Protocol requirement
    zh: 协议要求
    short:
      en: 'A property, method, initializer, or subscript capability that every conforming type must supply.'
      zh: '每个遵循类型都必须提供的属性、方法、构造器或下标能力。'

  - id: protocol-conformance
    en: Protocol conformance
    zh: 协议遵循
    short:
      en: 'An explicit checked relationship stating that a type supplies every requirement of a named protocol.'
      zh: '一种经过检查的显式关系，表示某类型提供了具名协议的全部要求。'

  - id: existential-type
    en: Existential type
    zh: 存在类型
    short:
      en: 'A type spelled with any that can hold a value of any current concrete type conforming to a protocol.'
      zh: '使用 any 拼写的类型，可保存当前任意一种遵循指定协议的具体类型值。'

  - id: opaque-type
    en: Opaque type
    zh: 不透明类型
    short:
      en: 'A type spelled with some whose fixed concrete identity is chosen and hidden by the implementation.'
      zh: '使用 some 拼写的类型，其固定具体类型由实现选择并对调用方隐藏。'
