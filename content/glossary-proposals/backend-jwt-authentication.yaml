terms:
  - id: json-web-token
    en: JSON Web Token
    zh: JSON Web Token
    short: { en: 'A compact, URL-safe claims format carried in a signed or encrypted JOSE structure.', zh: '一种紧凑且 URL 安全的声明格式，承载于签名或加密的 JOSE 结构中。' }
  - id: claim
    en: Claim
    zh: 声明
    short: { en: 'A name and value asserting a piece of information about a subject.', zh: '由名称和值组成，表示关于某个主体的一项信息。' }
  - id: access-token
    en: Access token
    zh: 访问令牌
    short: { en: 'A credential presented to a resource server to access a protected resource.', zh: '向资源服务器出示，用于访问受保护资源的凭据。' }
  - id: refresh-token
    en: Refresh token
    zh: 刷新令牌
    short: { en: 'A credential sent to an authorization server to obtain new access tokens.', zh: '发送给授权服务器，用于获取新访问令牌的凭据。' }
  - id: token-revocation
    en: Token revocation
    zh: 令牌撤销
    short: { en: 'Invalidating a token or its session before its natural expiration.', zh: '在令牌自然过期前，使令牌或其所属会话失效。' }
