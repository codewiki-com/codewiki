terms:
  - id: prototype-chain
    en: Prototype chain
    zh: 原型链
    short:
      en: 'The linked sequence of prototype objects followed when JavaScript looks up an inherited property.'
      zh: 'JavaScript 查找继承属性时依次访问的一组相连原型对象。'

  - id: private-field
    en: Private field
    zh: 私有字段
    short:
      en: 'A class field with a # name whose access is restricted to its declaring class body and checked by receiver brand.'
      zh: '名称以 # 开头、只能在声明类体内访问，并按接收者标记检查的类字段。'

  - id: derived-class
    en: Derived class
    zh: 派生类
    short:
      en: 'A class declared with extends that inherits public behavior and initializes its instance through a base constructor.'
      zh: '通过 extends 声明、继承公开行为，并经由基类构造函数初始化实例的类。'
