terms:
  - id: generic
    en: Generic
    zh: 泛型
    aliases: [generics]
    short:
      en: 'A declaration that uses type parameters to preserve relationships while accepting more than one concrete type.'
      zh: '使用类型参数保持多个位置的类型关系，同时接受多种具体类型的声明机制。'
    topics: [typescript/generics]

  - id: type-parameter
    en: Type parameter
    zh: 类型参数
    aliases: []
    short:
      en: 'A placeholder type declared by a generic function, class, interface, or type alias.'
      zh: '由泛型函数、类、接口或类型别名声明的占位类型。'
    topics: [typescript/generics]

  - id: generic-constraint
    en: Generic constraint
    zh: 泛型约束
    aliases: [type-parameter-constraint]
    short:
      en: 'A bound that limits which types may replace a type parameter and which members generic code may use.'
      zh: '限制哪些类型可以代入类型参数，并规定泛型代码可使用哪些成员的边界。'
    topics: [typescript/generics]
