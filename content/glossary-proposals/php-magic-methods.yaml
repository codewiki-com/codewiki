terms:
  - id: magic-method
    en: Magic method
    zh: 魔术方法
    short:
      en: 'A specially named method that PHP invokes for a defined object operation such as inaccessible member access or cloning.'
      zh: '由 PHP 在不可访问成员操作、克隆等指定对象操作发生时调用的特殊具名方法。'

  - id: property-overloading
    en: Property overloading
    zh: 属性重载
    short:
      en: 'Dynamic handling of reads, writes, existence checks, and deletion for inaccessible PHP object properties.'
      zh: '对不可访问的 PHP 对象属性动态处理读取、写入、存在性检查和删除。'
