terms:
  - id: iterator
    en: Iterator
    zh: 迭代器
    short:
      en: 'A stateful producer that yields one item per next call and signals temporary or permanent exhaustion with None.'
      zh: '一种有状态的生产者；每次调用 next 产出一项，并用 None 表示暂时或永久没有下一项。'

  - id: iterator-adapter
    en: Iterator adapter
    zh: 迭代器适配器
    short:
      en: 'A usually lazy operation that wraps an iterator and produces another iterator with transformed traversal behavior.'
      zh: '一种通常采用惰性求值的操作；它包装一个迭代器，并生成具有不同遍历行为的新迭代器。'
