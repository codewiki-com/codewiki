terms:
  - id: string-slice
    en: String slice
    zh: 字符串切片
    short:
      en: 'A borrowed or owned view of contiguous valid UTF-8 bytes represented by Rust str.'
      zh: '由 Rust str 表示的一段连续有效 UTF-8 字节视图，可通过借用或拥有型指针使用。'

  - id: unicode-scalar-value
    en: Unicode scalar value
    zh: Unicode 标量值
    short:
      en: 'Any Unicode code point except the surrogate range U+D800 through U+DFFF; represented by Rust char.'
      zh: '除 U+D800 至 U+DFFF 代理项范围外的 Unicode 码点；Rust 使用 char 表示。'

  - id: grapheme-cluster
    en: Grapheme cluster
    zh: 字素簇
    short:
      en: 'A sequence of Unicode scalar values treated as one user-perceived character by text segmentation rules.'
      zh: '按 Unicode 文本分段规则，被用户感知为一个字符的一段 Unicode 标量值序列。'
