terms:
  - id: strict-mode
    en: TypeScript strict mode
    zh: TypeScript 严格模式
    aliases: [strict compiler options]
    short: { en: 'The compiler-option family that enables stricter TypeScript checks through strict: true.', zh: '通过 strict: true 启用 TypeScript 一组更严格静态检查的编译器选项集合。' }
    topics: [typescript/strict-mode]

  - id: implicit-any
    en: Implicit any
    zh: 隐式 any
    aliases: []
    short: { en: 'An any type introduced when TypeScript lacks enough information to infer a more specific type.', zh: 'TypeScript 缺少足够信息来推断更具体类型时产生的 any 类型。' }
    topics: [typescript/strict-mode]

  - id: function-parameter-variance
    en: Function parameter variance
    zh: 函数参数变型
    aliases: [parameter variance]
    short: { en: 'The compatibility rule relating accepted function parameter types to those expected by a caller.', zh: '把函数可接受的参数类型与调用方预期参数类型联系起来的兼容性规则。' }
    topics: [typescript/strict-mode]

  - id: definite-assignment-assertion
    en: Definite assignment assertion
    zh: 明确赋值断言
    aliases: [definite assignment assertion modifier]
    short: { en: 'A ! on a TypeScript field declaration that asks the compiler to trust later initialization it cannot prove.', zh: 'TypeScript 字段声明上的 !，要求编译器相信它无法证明的后续初始化。' }
    topics: [typescript/strict-mode]
