terms:
  - id: definite-assignment
    en: Definite assignment
    zh: 明确赋值
    short:
      en: 'Compile-time control-flow proof that a Java variable has been assigned on every path before it is read.'
      zh: 'Java 在编译期根据控制流证明变量在读取前已于每条可达路径上完成赋值。'

  - id: short-circuit-evaluation
    en: Short-circuit evaluation
    zh: 短路求值
    short:
      en: 'Conditional evaluation in which && or || skips its right operand when the left result already determines the result.'
      zh: '当左侧结果已能决定整体结果时，&& 或 || 跳过右侧操作数的条件求值规则。'
