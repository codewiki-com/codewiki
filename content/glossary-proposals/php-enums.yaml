terms:
  - id: enum-case
    en: Enum case
    zh: 枚举 case
    short:
      en: 'One named singleton value belonging to an enum type.'
      zh: '属于某个枚举类型的一个具名单例值。'

  - id: backed-enum
    en: Backed enum
    zh: 带值枚举
    short:
      en: 'A PHP enum whose cases each have a unique string or integer backing value.'
      zh: '一种 PHP 枚举，其每个 case 都有唯一的字符串或整数 backing value。'
