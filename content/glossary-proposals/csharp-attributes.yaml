terms:
  - id: attribute
    en: Attribute
    zh: 特性
    short:
      en: 'Structured declarative information attached to a program entity and stored in compiled metadata for a consumer to interpret.'
      zh: '附到程序实体并存入编译后元数据的结构化声明信息，由消费者解释其含义。'

  - id: attribute-target
    en: Attribute target
    zh: 特性目标
    short:
      en: 'The metadata entity, such as a type, property, field, parameter, or return value, to which an attribute record is attached.'
      zh: '特性记录所附着的元数据实体，例如类型、属性、字段、参数或返回值。'

  - id: positional-argument
    en: Positional argument
    zh: 位置实参
    short:
      en: 'An argument whose position selects and supplies the corresponding parameter in an ordered parameter list.'
      zh: '通过所在位置匹配并提供有序参数列表中相应参数的实参。'

  - id: named-argument
    en: Named argument
    zh: 命名实参
    short:
      en: 'An argument that explicitly names its destination parameter, field, or property instead of relying only on position.'
      zh: '显式指出目标参数、字段或属性，而不只依赖位置进行匹配的实参。'

  - id: attribute-inheritance
    en: Attribute inheritance
    zh: 特性继承
    short:
      en: 'A retrieval rule that can include attributes declared on base classes or overridden members when an attribute permits it.'
      zh: '在特性允许时，让查询可以包含基类或被重写成员上声明特性的读取规则。'

  - id: reflection
    en: Reflection
    zh: 反射
    short:
      en: 'Runtime APIs for examining assemblies, types, members, and metadata and, when intended, creating or invoking them dynamically.'
      zh: '在运行时检查程序集、类型、成员与元数据，并可按需动态创建或调用它们的 API。'
