terms:
  - id: object-identity
    en: Object identity
    zh: 对象标识
    short:
      {
        en: 'The stable property that distinguishes one object from every other object; Python compares it with is.',
        zh: '用于区分不同对象的稳定属性；Python 使用 is 比较对象标识。',
      }
  - id: object-graph
    en: Object graph
    zh: 对象图
    short:
      {
        en: 'Objects represented as nodes and the references between them represented as directed edges.',
        zh: '把对象表示为节点、对象之间的引用表示为有向边所形成的结构。',
      }
  - id: deep-copy
    en: Deep copy
    zh: 深拷贝
    short:
      {
        en: 'A copy that recursively constructs a corresponding object graph while preserving repeated references and cycles.',
        zh: '递归构造对应对象图，同时保留重复引用和循环的复制操作。',
      }
  - id: memo-dictionary
    en: Memo dictionary
    zh: 备忘字典
    short:
      {
        en: 'The identity map deepcopy uses during one traversal to reuse copied objects and close cycles.',
        zh: 'deepcopy 在一次遍历中用于复用已复制对象并闭合循环的对象标识映射。',
      }
