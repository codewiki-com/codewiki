terms:
  - id: virtual-thread
    en: Virtual thread
    zh: 虚拟线程
    short:
      en: 'A lightweight Java Thread scheduled by the JDK that need not occupy one operating-system thread for its lifetime.'
      zh: '由 JDK 调度的轻量级 Java Thread，无需在整个生命周期中独占一个操作系统线程。'

  - id: carrier-thread
    en: Carrier thread
    zh: 载体线程
    short:
      en: 'A platform thread on which the JDK scheduler mounts a virtual thread while that virtual thread runs Java code.'
      zh: 'JDK 调度器在虚拟线程运行 Java 代码时用来挂载该虚拟线程的平台线程。'

  - id: record-pattern
    en: Record pattern
    zh: 记录模式
    short:
      en: 'A Java pattern that tests a record value and decomposes its components into nested patterns or variables.'
      zh: '检查记录值并把其组件解构到嵌套模式或变量中的 Java 模式。'

  - id: sequenced-collection
    en: Sequenced collection
    zh: 有序集合
    short:
      en: 'A Java collection with a defined encounter order, operations at both ends, and a reverse-ordered view.'
      zh: '具有确定遇见顺序、两端操作和反向顺序视图的 Java 集合。'

  - id: preview-feature
    en: Preview feature
    zh: 预览特性
    short:
      en: 'A fully implemented Java feature offered temporarily for feedback and requiring explicit compile-time and runtime opt-in.'
      zh: '为收集反馈而暂时提供，并要求在编译与运行时显式启用的完整 Java 特性。'
