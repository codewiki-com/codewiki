terms:
  - id: list-comprehension
    en: List comprehension
    zh: 列表推导式
    aliases: []
    short:
      en: 'An expression that transforms and optionally filters an iterable into a new list.'
      zh: '遍历可迭代对象，对元素进行转换和可选筛选，并生成新列表的表达式。'
    topics: [python/list-comprehensions]

  - id: assignment-expression
    en: Assignment expression
    zh: 赋值表达式
    aliases: [named expression, walrus operator]
    short:
      en: 'An expression using := that binds a name while also producing the assigned value.'
      zh: '使用 := 在产生赋值结果的同时绑定名称的表达式。'
    topics: [python/list-comprehensions]
