terms:
  - id: linq
    en: Language Integrated Query
    zh: 语言集成查询
    short:
      en: 'C# language features and operators for composing typed queries over sequences and provider-backed data sources.'
      zh: '用于在序列与提供程序支持的数据源上组合类型化查询的 C# 语言功能和运算符。'

  - id: deferred-execution
    en: Deferred execution
    zh: 延迟执行
    short:
      en: 'Execution that waits until a consumer requests results instead of running when the query is defined.'
      zh: '定义查询时暂不运行，直到消费者请求结果才开始执行的方式。'

  - id: materialization
    en: Materialization
    zh: 物化
    short:
      en: 'Executing a query and storing its results in a concrete container such as a list, array, or dictionary.'
      zh: '执行查询，并把结果存入列表、数组或字典等具体容器。'

  - id: multiple-enumeration
    en: Multiple enumeration
    zh: 重复枚举
    short:
      en: 'Traversing one enumerable more than once, potentially repeating work, effects, I/O, or remote queries.'
      zh: '多次遍历同一可枚举对象，可能重复计算、副作用、I/O 或远程查询。'
