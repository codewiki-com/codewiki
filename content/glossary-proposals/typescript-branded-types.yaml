terms:
  - id: branded-type
    en: Branded type
    zh: 品牌类型
    short:
      en: 'An intersection that adds a type-only marker to distinguish otherwise compatible values.'
      zh: '通过交叉类型添加仅供类型检查的标记，用于区分原本兼容的值。'

  - id: nominal-typing
    en: Nominal typing
    zh: 名义类型
    short:
      en: 'Type compatibility based on declared identity rather than only on the members a value contains.'
      zh: '依据声明身份判断类型兼容性，而不只比较值所包含成员的类型规则。'

  - id: unique-symbol
    en: unique symbol
    zh: 唯一符号
    short:
      en: 'A TypeScript symbol type whose identity belongs to one const declaration or readonly static property.'
      zh: '身份归属于某个 const 声明或只读静态属性的 TypeScript 符号类型。'
