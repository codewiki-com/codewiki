terms:
  - id: grid-container
    en: Grid container
    zh: 网格容器
    short:
      en: 'An element whose grid formatting context lays out its direct child grid items in rows and columns.'
      zh: '建立网格格式化上下文，并把直接子网格项目放入行列的元素。'

  - id: grid-item
    en: Grid item
    zh: 网格项目
    short:
      en: 'A direct child of a grid container that participates in that container''s grid layout.'
      zh: '网格容器的直接子元素，参与该容器的网格布局。'

  - id: grid-track
    en: Grid track
    zh: 网格轨道
    short:
      en: 'The space between two adjacent grid lines, forming one row or one column of a grid.'
      zh: '两条相邻网格线之间的空间，构成网格的一行或一列。'

  - id: explicit-grid
    en: Explicit grid
    zh: 显式网格
    short:
      en: 'The grid tracks and areas declared by grid-template properties rather than created by placement.'
      zh: '由 grid-template 属性声明，而不是因项目放置而创建的网格轨道与区域。'

  - id: implicit-grid
    en: Implicit grid
    zh: 隐式网格
    short:
      en: 'Tracks created outside the explicit grid when auto-placement or positioned items require more grid space.'
      zh: '自动放置或已定位项目需要更多网格空间时，在显式网格之外创建的轨道。'

  - id: subgrid
    en: Subgrid
    zh: 子网格
    short:
      en: 'A nested grid that adopts the parent grid''s track sizing on its rows, columns, or both.'
      zh: '在行轴、列轴或两个轴上采用父网格轨道尺寸的嵌套网格。'
