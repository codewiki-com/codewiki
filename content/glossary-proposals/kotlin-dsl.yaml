terms:
  - id: domain-specific-language
    en: Domain-specific language
    zh: 领域特定语言
    short:
      en: 'A language or API whose vocabulary and constraints are designed for one problem domain.'
      zh: '词汇与约束专门为某个问题领域设计的语言或 API。'

  - id: lambda-with-receiver
    en: Lambda with receiver
    zh: 带接收者的 lambda
    short:
      en: 'A function literal whose body can access members of a designated receiver through this or implicitly.'
      zh: '函数体可通过 this 或隐式方式访问指定接收者成员的函数字面量。'

  - id: dsl-marker
    en: DSL marker
    zh: DSL 标记
    short:
      en: 'A Kotlin marker annotation that restricts simultaneous implicit access to receivers in the same DSL.'
      zh: '限制同时隐式访问同一 DSL 中多个接收者的 Kotlin 标记注解。'

  - id: type-safe-builder
    en: Type-safe builder
    zh: 类型安全构建器
    short:
      en: 'A construction API whose types restrict the structures or call sequences a client can express.'
      zh: '通过类型限制调用方可表达结构或调用顺序的构造 API。'
