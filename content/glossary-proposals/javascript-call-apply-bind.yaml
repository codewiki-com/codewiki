terms:
  - id: explicit-this-binding
    en: Explicit this binding
    zh: 显式 this 绑定
    aliases: [explicit binding]
    short:
      en: 'Supplying the this value for an ordinary function through call, apply, or a bound function.'
      zh: '通过 call、apply 或绑定函数，为普通函数调用明确提供 this 值。'
    topics: [javascript/call-apply-bind]

  - id: array-like-object
    en: Array-like object
    zh: 类数组对象
    aliases: []
    short:
      en: 'An object with a length and indexed properties that can supply an argument list without being an Array.'
      zh: '具有 length 与索引属性，可提供实参列表但不一定是 Array 的对象。'
    topics: [javascript/call-apply-bind]

  - id: callback-identity
    en: Callback identity
    zh: 回调标识
    aliases: [function identity]
    short:
      en: 'The exact function object an API uses to match registration, deduplication, or removal operations.'
      zh: 'API 用来匹配注册、去重或移除操作的准确函数对象标识。'
    topics: [javascript/call-apply-bind]

