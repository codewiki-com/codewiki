terms:
  - id: regular-expression
    en: Regular expression
    zh: 正则表达式
    aliases: [regex, regexp]
    short:
      en: 'A pattern language and matching object used to locate, capture, or transform text according to explicit character and position rules.'
      zh: '按明确的字符与位置规则定位、捕获或转换文本的模式语言与匹配对象。'
    topics: [javascript/regexp]

  - id: capturing-group
    en: Capturing group
    zh: 捕获组
    aliases: [capture group, named capture]
    short:
      en: 'A parenthesized regex subpattern whose matched text is recorded in a numbered or named result slot.'
      zh: '用圆括号组成的正则子模式，其匹配文本会记录到编号或命名结果槽位中。'
    topics: [javascript/regexp]

  - id: backtracking
    en: Backtracking
    zh: 回溯
    aliases: [regex backtracking]
    short:
      en: 'A matching strategy that revisits earlier choices after a later pattern part fails and then tries another available path.'
      zh: '后续模式失败后返回先前选择点，并尝试其他可用路径的匹配策略。'
    topics: [javascript/regexp]
