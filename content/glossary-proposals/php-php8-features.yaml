terms:
  - id: match-expression
    en: Match expression
    zh: match 表达式
    aliases: []
    short:
      en: 'An expression that strictly compares one subject with arms and returns the selected arm value.'
      zh: '把一个主题值与各分支严格比较，并返回所选分支值的表达式。'
    topics: [php/php8-features]

  - id: constructor-property-promotion
    en: Constructor property promotion
    zh: 构造器属性提升
    aliases: []
    short:
      en: 'PHP syntax that declares and initializes a property through a visibility-marked constructor parameter.'
      zh: '通过带可见性修饰符的构造器形参声明并初始化属性的 PHP 语法。'
    topics: [php/php8-features]

  - id: nullsafe-operator
    en: Nullsafe operator
    zh: nullsafe 运算符
    aliases: []
    short:
      en: 'The ?-> operator, which stops a property or method chain and yields null when its left side is null.'
      zh: '左侧为 null 时停止属性或方法链，并返回 null 的 ?-> 运算符。'
    topics: [php/php8-features]
