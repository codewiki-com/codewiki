terms:
  - id: ordered-map
    en: Ordered map
    zh: 有序映射
    short:
      en: 'A key-value container that retains a defined iteration order for its entries.'
      zh: '一种键值容器，会为其中的条目保留有定义的遍历顺序。'

  - id: php-list
    en: PHP list
    zh: PHP 列表
    short:
      en: 'A PHP array whose keys are consecutive integers from zero in iteration order.'
      zh: '键按遍历顺序严格等于从 0 开始的连续整数的 PHP 数组。'

  - id: array-key-normalization
    en: Array-key normalization
    zh: 数组键规范化
    short:
      en: 'PHP conversion of an inserted array key into its final integer or string form.'
      zh: 'PHP 把写入的数组键转换为最终整数或字符串形式的过程。'

  - id: copy-on-write
    en: Copy-on-write
    zh: 写时复制
    short:
      en: 'An implementation strategy that shares storage until one logical copy is modified.'
      zh: '多个逻辑副本先共享存储，直到其中一个被修改时才执行复制的实现策略。'
