terms:
  - id: convention-over-configuration
    en: Convention over configuration
    zh: 约定优于配置
    aliases: [CoC]
    short:
      en: 'A design approach where shared naming and structure supply defaults, leaving configuration for exceptions.'
      zh: '由共同命名与结构提供默认行为，只为例外情况编写配置的设计方式。'
    topics: [backend/ruby-rails]

  - id: active-record
    en: Active Record
    zh: Active Record
    aliases: [Active Record pattern]
    short:
      en: 'A persistence pattern in which an object represents a database row and exposes queries and writes.'
      zh: '用对象表示数据库行，并在对象与类上提供查询和写入操作的持久化模式。'
    topics: [backend/ruby-rails]

  - id: strong-parameters
    en: Strong parameters
    zh: 强参数
    aliases: []
    short:
      en: 'Rails parameters marked with an explicit field allowlist before they may be used for mass assignment.'
      zh: 'Rails 中经过显式字段白名单筛选，才可用于批量赋值的参数。'
    topics: [backend/ruby-rails]

  - id: n-plus-one
    en: N+1 query
    zh: N+1 查询
    aliases: [N plus one]
    short:
      en: 'One query for parent rows followed by one additional related-data query for each parent.'
      zh: '先查询一批父记录，再为每条父记录分别查询一次关联数据的访问模式。'
    topics: [backend/ruby-rails]
