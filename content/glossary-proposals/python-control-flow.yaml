terms:
  - id: truth-value
    en: Truth value testing
    zh: 真值测试
    short:
      en: 'The protocol Python uses to decide whether an object counts as true or false in a condition.'
      zh: 'Python 用于判断对象在条件中应视为真还是假的协议。'

  - id: iterable
    en: Iterable
    zh: 可迭代对象
    short:
      en: 'An object capable of returning an iterator that yields its items one at a time.'
      zh: '能够返回迭代器，由迭代器逐项产出内容的对象。'

  - id: loop-else
    en: Loop else
    zh: 循环 else
    short:
      en: 'An else suite that runs when a for or while loop completes without executing break.'
      zh: 'for 或 while 循环没有执行 break 并正常完成时运行的 else 语句组。'

  - id: structural-pattern-matching
    en: Structural pattern matching
    zh: 结构模式匹配
    short:
      en: 'Branch selection that tests and extracts the shape and contents of one subject value.'
      zh: '检查并提取一个主题值的结构与内容，从而选择分支的机制。'

  - id: guard-clause
    en: Guard clause
    zh: 卫语句
    short:
      en: 'An early check that exits or skips work, leaving the main path at a shallower indentation level.'
      zh: '提前退出或跳过工作的检查，使主要路径保持较浅的缩进层级。'

  - id: match-guard
    en: Match guard
    zh: 匹配守卫
    short:
      en: 'A condition evaluated after a case pattern succeeds and before its branch is selected.'
      zh: 'case 模式成功后、选择其分支前才会求值的条件。'
