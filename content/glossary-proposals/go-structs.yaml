terms:
  - id: struct-tag
    en: Struct tag
    zh: 结构体标签
    short:
      en: 'A string literal attached to a Go struct field for reflection-based packages to interpret by their own conventions.'
      zh: '附在 Go 结构体字段上的字符串字面量，由基于反射的包按各自约定解释。'

  - id: field-promotion
    en: Field promotion
    zh: 字段提升
    short:
      en: 'The selector rule that lets a uniquely reachable field of an embedded Go type be selected through the outer value.'
      zh: 'Go 的选择器规则，允许通过外层值选择嵌入类型中路径唯一的字段。'

  - id: method-set
    en: Method set
    zh: 方法集
    short:
      en: 'The methods associated with a Go type or pointer type, used to decide which interfaces that type implements.'
      zh: '与 Go 类型或指针类型关联的方法集合，用于决定该类型实现哪些接口。'
