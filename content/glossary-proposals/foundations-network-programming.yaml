terms:
  - id: socket
    en: Socket
    zh: 套接字
    short: { en: 'An operating-system communication endpoint associated with an address family, protocol, local address, and optional peer.', zh: '由操作系统管理的通信端点，关联地址族、协议、本地地址及可选对端。' }
    topics: [foundations/network-programming]

  - id: datagram
    en: Datagram
    zh: 数据报
    short: { en: 'One boundary-preserving message sent independently by a datagram transport such as UDP.', zh: '由 UDP 等数据报传输协议独立发送，并在接收 API 中保留边界的一条消息。' }
    topics: [foundations/network-programming]

  - id: message-framing
    en: Message framing
    zh: 消息分帧
    short: { en: 'Rules for finding complete application messages in a byte stream, such as delimiters or length prefixes.', zh: '从字节流中识别完整应用消息的规则，例如分隔符或长度前缀。' }
    topics: [foundations/network-programming]

  - id: network-byte-order
    en: Network byte order
    zh: 网络字节序
    short: { en: 'The big-endian byte order convention used to encode multi-byte integers in many network protocols.', zh: '许多网络协议编码多字节整数时采用的大端序约定。' }
    topics: [foundations/network-programming]

  - id: backpressure
    en: Backpressure
    zh: 背压
    short: { en: 'A capacity signal that makes a producer slow or stop when downstream buffers or consumers cannot keep up.', zh: '下游缓冲区或消费者跟不上时，让生产者减速或停止的容量信号。' }
    topics: [foundations/network-programming]

  - id: half-close
    en: Half-close
    zh: 半关闭
    short: { en: 'Closing one sending direction of a bidirectional connection while leaving the opposite direction available.', zh: '关闭双向连接的一个发送方向，同时保留反向传输能力。' }
    topics: [foundations/network-programming]
