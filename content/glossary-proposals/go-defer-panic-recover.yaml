terms:
  - id: deferred-call
    en: Deferred call
    zh: 延迟调用
    short:
      en: 'A call registered by defer to run in reverse registration order when the surrounding Go function exits.'
      zh: '由 defer 注册，在外围 Go 函数退出时按注册顺序的逆序执行的调用。'

  - id: panic-unwinding
    en: Panic unwinding
    zh: panic 展开
    short:
      en: 'The process of running deferred calls while a Go panic moves up the current goroutine call stack.'
      zh: 'Go 的 panic 沿当前 goroutine 调用栈向上传播并执行各层延迟调用的过程。'

  - id: recovery-boundary
    en: Recovery boundary
    zh: 恢复边界
    short:
      en: 'An explicit goroutine or API boundary that may stop a panic and report the failed unit of work.'
      zh: '可以停止 panic 并报告失败工作单元的明确 goroutine 或 API 边界。'
