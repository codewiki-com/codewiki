terms:
  - id: command-substitution
    en: Command substitution
    zh: 命令替换
    aliases: [subshell substitution, 命令代换]
    short:
      en: 'A shell expansion that replaces $(command) with the command''s standard output after removing trailing newlines.'
      zh: '一种 Shell 展开：用命令的标准输出替换 $(command)，并删除输出末尾的换行符。'
    topics: [foundations/shell-basics]

  - id: exit-status
    en: Exit status
    zh: 退出状态
    aliases: [return status, exit code, 返回状态, 退出码]
    short:
      en: 'An integer result from a completed command, conventionally zero for success and nonzero for another documented outcome.'
      zh: '命令完成后产生的整数结果；按约定，零表示成功，非零表示其他有文档定义的结果。'
    topics: [foundations/shell-basics]

  - id: pathname-expansion
    en: Pathname expansion
    zh: 路径名展开
    aliases: [filename expansion, globbing, 文件名展开, 通配符展开]
    short:
      en: 'The shell stage that replaces an eligible wildcard pattern with matching pathnames from the filesystem.'
      zh: 'Shell 用文件系统中匹配的路径名替换适用通配模式的处理阶段。'
    topics: [foundations/shell-basics]

  - id: word-splitting
    en: Word splitting
    zh: 单词拆分
    aliases: [field splitting, 字段拆分]
    short:
      en: 'The shell stage that divides eligible unquoted expansion results into fields according to IFS.'
      zh: 'Shell 根据 IFS 把符合条件且未引用的展开结果拆分成字段的处理阶段。'
    topics: [foundations/shell-basics]
