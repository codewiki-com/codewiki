terms:
  - id: equality-comparer
    en: Equality comparer
    zh: 相等比较器
    aliases: [equality comparator]
    short:
      {
        en: 'An object that defines equality and matching hash codes for values used by a collection.',
        zh: '为集合中的值定义相等关系以及与之匹配的哈希码的对象。',
      }
    topics: [csharp/collections]

  - id: amortized-complexity
    en: Amortized complexity
    zh: 摊还复杂度
    aliases: [amortized cost]
    short:
      {
        en: 'The average cost per operation over a sequence, accounting for occasional expensive operations such as resizing.',
        zh: '把扩容等偶发高成本操作计入整个操作序列后得到的平均单次成本。',
      }
    topics: [csharp/collections]
