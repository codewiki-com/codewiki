terms:
  - id: associated-type
    en: Associated type
    zh: 关联类型
    aliases: []
    short:
      en: 'A placeholder type declared by a protocol and fixed by each conforming type, letting requirements refer to related types.'
      zh: '由协议声明、由每个遵循类型确定的占位类型，使协议要求能够引用相关类型。'
    topics: [swift/generics]

  - id: primary-associated-type
    en: Primary associated type
    zh: 主关联类型
    aliases: []
    short:
      en: 'An associated type named in a protocol’s angle brackets so opaque and existential uses can constrain it concisely.'
      zh: '列在协议尖括号中的关联类型，便于不透明类型和存在类型用简洁语法约束它。'
    topics: [swift/generics]

  - id: same-type-requirement
    en: Same-type requirement
    zh: 同类型要求
    aliases: []
    short:
      en: 'A generic requirement stating that two type expressions must resolve to exactly the same type.'
      zh: '规定两个类型表达式必须解析为完全相同类型的泛型要求。'
    topics: [swift/generics]
