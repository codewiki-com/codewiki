terms:
  - id: primitive-type
    en: Primitive type
    zh: 基本类型
    short:
      en: 'A built-in Java value type for Boolean, integral, or floating-point values that cannot hold null.'
      zh: 'Java 内建的布尔、整数或浮点值类型，不能保存 null。'

  - id: reference-type
    en: Reference type
    zh: 引用类型
    short:
      en: 'A Java type whose values refer to objects or arrays, or hold the null reference.'
      zh: '值用于引用对象或数组，也可以保存空引用的 Java 类型。'

  - id: autoboxing
    en: Autoboxing
    zh: 自动装箱
    short:
      en: 'An implicit Java conversion from a primitive value to an instance of its corresponding wrapper class.'
      zh: 'Java 将基本类型值隐式转换为对应包装类实例的过程。'

  - id: unboxing
    en: Unboxing
    zh: 拆箱
    short:
      en: 'A Java conversion from a wrapper reference to its primitive value; unboxing null throws NullPointerException.'
      zh: 'Java 从包装类引用取得基本类型值的转换；拆箱 null 会抛出 NullPointerException。'

  - id: numeric-promotion
    en: Numeric promotion
    zh: 数值提升
    short:
      en: 'Java rules that convert numeric operands to the types used to evaluate unary or binary numeric expressions.'
      zh: 'Java 在计算一元或二元数值表达式前转换操作数类型的规则。'

  - id: narrowing-conversion
    en: Narrowing conversion
    zh: 缩小转换
    short:
      en: 'A conversion to a type that cannot represent every source value and may discard range or precision.'
      zh: '转换到无法表示全部源值的类型，可能丢失范围或精度。'
