terms:
  - id: annotation
    en: Annotation
    zh: 注解
    short:
      en: 'Structured metadata attached to a Java declaration or type use for a compiler, processor, tool, or runtime consumer to interpret.'
      zh: '附在 Java 声明或类型使用位置上的结构化元数据，供编译器、处理器、工具或运行时消费者解释。'

  - id: meta-annotation
    en: Meta-annotation
    zh: 元注解
    short:
      en: 'An annotation on an annotation interface that defines rules such as its target, retention, inheritance, or repeatability.'
      zh: '标注注解接口的注解，用于定义目标、保留、继承或可重复性等规则。'

  - id: retention-policy
    en: Retention policy
    zh: 保留策略
    short:
      en: 'The rule that determines whether annotation metadata remains only in source, in class files, or visible to runtime reflection.'
      zh: '决定注解元数据只保留在源码中、进入类文件，还是可供运行时反射读取的规则。'

  - id: repeatable-annotation
    en: Repeatable annotation
    zh: 可重复注解
    short:
      en: 'An annotation type that may occur more than once at one location and is represented through a compatible container annotation.'
      zh: '可以在同一位置出现多次，并通过兼容容器注解表示的注解类型。'

  - id: type-use-annotation
    en: Type-use annotation
    zh: 类型使用注解
    short:
      en: 'A Java annotation targeted at a particular occurrence of a type, including a type argument, cast, bound, or array dimension.'
      zh: '针对某次具体类型出现位置的 Java 注解，例如类型实参、强制转换、边界或数组维度。'

  - id: annotation-processing
    en: Annotation processing
    zh: 注解处理
    short:
      en: 'Compile-time rounds in which processors inspect Java language elements, report diagnostics, and may generate files.'
      zh: '处理器在编译期按轮次检查 Java 语言元素、报告诊断并可生成文件的机制。'
