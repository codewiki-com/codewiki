terms:
  - id: remote-procedure-call
    en: Remote procedure call
    zh: 远程过程调用
    aliases: [RPC]
    short:
      {
        en: 'A call-shaped interface whose implementation runs in another process and therefore has network failure semantics.',
        zh: '一种调用式接口，其实现在另一个进程中运行，因此具有网络故障语义。',
      }
    topics: [backend/grpc]

  - id: protocol-buffers
    en: Protocol Buffers
    zh: Protocol Buffers
    aliases: [protobuf]
    short:
      {
        en: 'A schema language and binary message format built around stable numeric field identifiers.',
        zh: '一种围绕稳定数字字段标识设计的模式语言和二进制消息格式。',
      }
    topics: [backend/grpc]

  - id: deadline
    en: Deadline
    zh: 截止时间
    aliases: []
    short:
      {
        en: 'The point after which an operation should stop waiting and report that its time budget is exhausted.',
        zh: '操作停止等待并报告时间预算已耗尽的时间点。',
      }
    topics: [backend/grpc]
