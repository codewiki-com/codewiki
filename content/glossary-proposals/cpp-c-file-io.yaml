terms:
  - id: file-stream
    en: File stream
    zh: 文件流
    short:
      en: 'A stateful C standard-library connection through which a program transfers data to or from an external object.'
      zh: 'C 标准库中带有状态的连接，程序通过它与外部对象传输数据。'

  - id: end-of-file-indicator
    en: End-of-file indicator
    zh: 文件结束指示器
    short:
      en: 'Sticky stream state set after an input operation cannot obtain more data because it reached the end.'
      zh: '输入操作因到达末尾而无法取得更多数据后设置的粘性流状态。'

  - id: short-count
    en: Short count
    zh: 短计数
    short:
      en: 'A transfer result smaller than the requested element count, requiring EOF or error handling.'
      zh: '传输结果小于请求的元素数，需要继续判断文件结束或错误。'

  - id: object-representation
    en: Object representation
    zh: 对象表示
    short:
      en: 'The bytes that occupy a C or C++ object, including value bits and any padding.'
      zh: '占据 C 或 C++ 对象存储的字节，包括值位以及可能存在的填充。'
