terms:
  - id: content-block
    en: Content block
    zh: 内容块
    short:
      en: 'A typed unit inside a model message, such as text, a tool call, an image, or a tool result.'
      zh: '模型消息中的带类型单元，例如文本、工具调用、图像或工具结果。'
  - id: stop-reason
    en: Stop reason
    zh: 停止原因
    short:
      en: 'The response field that states why a model turn ended and whether the application must continue it.'
      zh: '说明模型轮次为何结束，以及应用是否必须继续处理的响应字段。'
  - id: tool-use
    en: Tool use
    zh: 工具使用
    short:
      en: 'A protocol in which a model requests a named operation and an application or provider executes it.'
      zh: '模型请求具名操作，再由应用或服务商执行该操作的协议。'
  - id: server-sent-events
    en: Server-Sent Events
    zh: 服务器发送事件
    short:
      en: 'An HTTP streaming format in which a server sends a sequence of named events over one response.'
      zh: '服务器通过同一个 HTTP 响应持续发送一系列具名事件的流式格式。'
  - id: idempotency-key
    en: Idempotency key
    zh: 幂等键
    short:
      en: 'A stable operation identifier used to recognize retries and prevent a side effect from being applied twice.'
      zh: '用于识别重试并防止同一副作用重复生效的稳定操作标识符。'
  - id: request-id
    en: Request ID
    zh: 请求 ID
    short:
      en: 'A provider-assigned identifier that correlates one API request with diagnostics and support records.'
      zh: '由服务商分配，用于关联一次 API 请求、诊断信息与支持记录的标识符。'
