terms:
  - id: string-pool
    en: String pool
    zh: 字符串池
    short:
      en: 'The JVM-managed set of canonical String instances used by literals, constant string expressions, and intern().'
      zh: 'JVM 管理的规范 String 实例集合，供字面量、字符串常量表达式与 intern() 使用。'

  - id: utf-16-code-unit
    en: UTF-16 code unit
    zh: UTF-16 代码单元
    short:
      en: 'A 16-bit unit used by Java String indexing; one Unicode code point may require one unit or a surrogate pair.'
      zh: 'Java String 索引使用的 16 位单位；一个 Unicode 码点可能需要一个代码单元或一对代理项。'

  - id: unicode-code-point
    en: Unicode code point
    zh: Unicode 码点
    short:
      en: 'A numbered position in the Unicode codespace, represented in UTF-16 by one code unit or a surrogate pair.'
      zh: 'Unicode 代码空间中的编号位置，在 UTF-16 中由一个代码单元或一对代理项表示。'

  - id: compact-string
    en: Compact String
    zh: 紧凑字符串
    short:
      en: 'An OpenJDK String representation that stores Latin-1 content in a byte array while preserving public UTF-16 semantics.'
      zh: 'OpenJDK 的 String 内部表示，以字节数组存储 Latin-1 内容，同时保持公开的 UTF-16 语义。'
