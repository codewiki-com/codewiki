terms:
  - id: automatic-reference-counting
    en: Automatic reference counting
    zh: 自动引用计数
    short:
      en: 'Swift memory management that inserts retain and release operations according to the lifetime of strong references.'
      zh: 'Swift 根据强引用的生命周期插入保留与释放操作的内存管理机制。'

  - id: strong-reference
    en: Strong reference
    zh: 强引用
    short:
      en: 'An owning reference that keeps a class instance alive while that reference is still needed.'
      zh: '在引用仍被需要期间让类实例保持存活的拥有型引用。'

  - id: weak-reference
    en: Weak reference
    zh: 弱引用
    short:
      en: 'A nonowning optional reference that ARC automatically sets to nil after its target is deallocated.'
      zh: '不拥有目标的可选引用；目标释放后，ARC 会自动把它置为 nil。'

  - id: unowned-reference
    en: Unowned reference
    zh: 无主引用
    short:
      en: 'A nonowning reference whose ordinary form requires the target to remain alive whenever it is accessed.'
      zh: '不拥有目标的引用；普通形式要求每次访问时目标仍然存活。'

  - id: strong-reference-cycle
    en: Strong reference cycle
    zh: 强引用循环
    short:
      en: 'A closed path of owning references that keeps its instances alive after outside ownership disappears.'
      zh: '由拥有型引用组成的闭合路径；外部所有权消失后，其中实例仍无法释放。'

  - id: capture-list
    en: Capture list
    zh: 捕获列表
    short:
      en: 'Swift closure syntax that initializes named captures and can mark class references weak or unowned.'
      zh: 'Swift 闭包中初始化具名捕获，并可把类引用标记为 weak 或 unowned 的语法。'
