terms:
  - id: canonical-constructor
    en: Canonical constructor
    zh: 规范构造器
    short:
      en: 'The record constructor whose parameter types correspond in order to every component in the record header.'
      zh: '参数类型按顺序与记录头部全部组件一一对应的记录构造器。'

  - id: compact-constructor
    en: Compact constructor
    zh: 紧凑构造器
    short:
      en: 'A canonical record constructor that omits its parameter list and receives implicit component parameters.'
      zh: '省略参数列表，并接收隐式组件参数的记录类规范构造器。'

  - id: defensive-copy
    en: Defensive copy
    zh: 防御性复制
    short:
      en: 'A copy made at an ownership boundary so later mutation through another reference cannot alter internal state.'
      zh: '在所有权边界创建副本，避免其他引用的后续修改改变内部状态。'
