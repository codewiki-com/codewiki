terms:
  - id: lvalue-reference
    en: Lvalue reference
    zh: 左值引用
    short:
      en: 'A reference written T& that normally binds to an lvalue and provides access to the same object or function.'
      zh: '写作 T&、通常绑定左值并访问同一对象或函数的引用。'

  - id: reference-collapsing
    en: Reference collapsing
    zh: 引用折叠
    short:
      en: 'The rules that reduce combinations of reference types formed through aliases or deduction to one reference type.'
      zh: '把类型别名或推导形成的引用类型组合化简为一种引用类型的规则。'

  - id: forwarding-reference
    en: Forwarding reference
    zh: 转发引用
    short:
      en: 'An unqualified deduced T&& or corresponding auto&& that can bind to lvalues and rvalues for forwarding.'
      zh: '可绑定左值和右值以进行转发的无 cv 限定推导 T&&，以及相应的 auto&&。'
