terms:
  - id: same-value-zero
    en: SameValueZero
    zh: 同值零相等
    aliases: [samevaluezero]
    short:
      en: 'An equality algorithm like strict equality, except that NaN equals itself and positive zero equals negative zero.'
      zh: '一种类似严格相等的算法，但 NaN 等于自身，正零也等于负零。'
    topics: [javascript/map-set]

  - id: weak-collection
    en: Weak collection
    zh: 弱集合
    aliases: [weak-keyed-collection]
    short:
      en: 'A non-enumerable collection whose presence alone does not keep its garbage-collectable keys or members alive.'
      zh: '一种不可枚举的集合；键或成员不会仅因存在于该集合中而保持可达。'
    topics: [javascript/map-set]
