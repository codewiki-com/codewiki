terms:
  - id: container
    en: Container
    zh: 容器
    short:
      en: 'A runnable image instance with its own process, runtime configuration, writable layer, networks, and mounts.'
      zh: '镜像的可运行实例，拥有自己的进程、运行时配置、可写层、网络与挂载。'

  - id: container-image
    en: Container image
    zh: 容器镜像
    short:
      en: 'A read-only package of filesystem layers and default configuration used to create containers.'
      zh: '由只读文件系统层与默认配置组成、用于创建容器的软件包。'

  - id: image-layer
    en: Image layer
    zh: 镜像层
    short:
      en: 'A content-addressed filesystem change that can be shared by container images.'
      zh: '按内容寻址、可由多个容器镜像共享的一组文件系统变更。'

  - id: build-context
    en: Build context
    zh: 构建上下文
    short:
      en: 'The selected set of local or remote files that a container-image build is allowed to access.'
      zh: '容器镜像构建过程获准访问的一组本地或远程文件。'

  - id: named-volume
    en: Named volume
    zh: 命名卷
    short:
      en: 'A Docker-managed persistent data store whose lifecycle is independent of one container.'
      zh: '由 Docker 管理、生命周期独立于某个容器的持久数据存储。'
