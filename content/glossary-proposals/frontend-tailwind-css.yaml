terms:
  - id: utility-first-css
    en: Utility-first CSS
    zh: 工具优先 CSS
    aliases: [functional CSS]
    short:
      en: 'A styling approach that builds interfaces by composing small, reusable classes around individual declarations.'
      zh: '通过组合围绕单项声明设计的小型可复用类来构建界面的样式方法。'
    topics: [frontend/tailwind-css]

  - id: utility-class
    en: Utility class
    zh: 工具类
    aliases: []
    short:
      en: 'A CSS class with a narrow styling purpose, such as setting padding, display, color, or one conditional state.'
      zh: '用途范围较窄的 CSS 类，例如设置内边距、显示方式、颜色或单个条件状态。'
    topics: [frontend/tailwind-css]

  - id: variant
    en: Tailwind variant
    zh: Tailwind 变体
    aliases: [utility variant]
    short:
      en: 'A prefix that makes a utility conditional on a state, media query, attribute, or structural relationship.'
      zh: '让工具类根据状态、媒体查询、属性或结构关系有条件生效的前缀。'
    topics: [frontend/tailwind-css]

  - id: source-detection
    en: Tailwind source detection
    zh: Tailwind 源码检测
    aliases: [content detection]
    short:
      en: 'The build step that scans source text for complete candidate class names from which Tailwind can generate CSS.'
      zh: '扫描源码文本中的完整候选类名，以便 Tailwind 生成 CSS 的构建步骤。'
    topics: [frontend/tailwind-css]

  - id: theme-variable
    en: Tailwind theme variable
    zh: Tailwind 主题变量
    aliases: [design token variable]
    short:
      en: 'A CSS variable declared with @theme that exposes a design token and controls related Tailwind utilities.'
      zh: '使用 @theme 声明的 CSS 变量，用于公开设计令牌并控制相关 Tailwind 工具。'
    topics: [frontend/tailwind-css]
