terms:
  - id: url-session
    en: URLSession
    zh: URLSession 会话
    aliases: [NSURLSession]
    short:
      {
        en: 'The Foundation object that coordinates a configured group of network transfer tasks on Apple platforms.',
        zh: 'Apple 平台 Foundation 中协调一组已配置网络传输任务的对象。',
      }
    topics: [backend/urlsession]

  - id: url-request
    en: URLRequest
    zh: URL 请求对象
    aliases: [NSURLRequest]
    short:
      {
        en: 'A value describing one URL load, including its method, headers, body, cache policy, and timeout.',
        zh: '描述一次 URL 加载的值，包含方法、请求头、正文、缓存策略和超时。',
      }
    topics: [backend/urlsession]

  - id: cache-policy
    en: Cache policy
    zh: 缓存策略
    aliases: []
    short:
      {
        en: 'Rules that determine whether a request may read a cached response, contact the origin, or accept stale data.',
        zh: '决定请求能否读取缓存响应、访问源站或接受陈旧数据的一组规则。',
      }
    topics: [backend/urlsession]
