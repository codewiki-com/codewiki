terms:
  - id: nested-class
    en: Nested class
    zh: 嵌套类
    aliases: []
    short: { en: 'A class declared inside another class or interface, including member, local, and anonymous classes.', zh: '声明在另一个类或接口内部的类，包括成员类、局部类和匿名类。' }
    topics: [java/inner-classes]

  - id: inner-class
    en: Inner class
    zh: 内部类
    aliases: []
    short: { en: 'A nested class that is not explicitly or implicitly static.', zh: '没有显式或隐式声明为 static 的嵌套类。' }
    topics: [java/inner-classes]

  - id: enclosing-instance
    en: Enclosing instance
    zh: 外围实例
    aliases: [outer instance]
    short: { en: 'An object lexically surrounding an inner object and available through a qualified this expression.', zh: '在词法结构上包围内部对象，并可通过限定 this 表达式访问的对象。' }
    topics: [java/inner-classes]

  - id: effectively-final
    en: Effectively final
    zh: 实际 final
    aliases: []
    short: { en: 'A variable without the final modifier whose assignments still satisfy the rules that final would impose.', zh: '没有 final 修饰符，但赋值方式仍满足 final 变量约束的变量。' }
    topics: [java/inner-classes]

  - id: anonymous-class
    en: Anonymous class
    zh: 匿名类
    aliases: []
    short: { en: 'A nameless inner class declared and instantiated by a class creation expression or an enum constant body.', zh: '通过类创建表达式或枚举常量类体声明并实例化的无名内部类。' }
    topics: [java/inner-classes]
