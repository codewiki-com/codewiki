terms:
  - id: flex-container
    en: Flex container
    zh: Flex 容器
    short:
      en: 'A box that establishes flex layout for its direct children through a computed display value of flex or inline-flex.'
      zh: '计算 display 值为 flex 或 inline-flex，并为直接子元素建立 Flex 布局的盒子。'

  - id: flex-item
    en: Flex item
    zh: Flex 项目
    short:
      en: 'A flex container child whose box participates in that container’s flex formatting context.'
      zh: '盒子参与其父级 Flex 容器格式化上下文的直接子元素。'

  - id: main-axis
    en: Main axis
    zh: 主轴
    short:
      en: 'The primary axis along which a flex container lays out and distributes its items, selected by flex-direction.'
      zh: 'Flex 容器排列并分配项目的主要轴，由 flex-direction 选择。'

  - id: cross-axis
    en: Cross axis
    zh: 交叉轴
    short:
      en: 'The axis perpendicular to a flex container’s main axis, used for item and flex-line alignment.'
      zh: '垂直于 Flex 容器主轴的轴，用于对齐项目和 Flex 行。'

  - id: automatic-minimum-size
    en: Automatic minimum size
    zh: 自动最小尺寸
    short:
      en: 'The content-aware minimum produced by min-width or min-height auto, which can stop a flex item from shrinking.'
      zh: '由 min-width 或 min-height 的 auto 值产生的内容相关下限，可能阻止 Flex 项目继续收缩。'
