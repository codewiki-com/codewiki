terms:
  - id: destructuring-pattern
    en: Destructuring pattern
    zh: 解构模式
    short:
      en: 'A JavaScript pattern that extracts iterable values or object properties into bindings or assignment targets.'
      zh: '一种 JavaScript 模式，用于把可迭代值或对象属性提取到绑定或赋值目标中。'

  - id: rest-element
    en: Rest element
    zh: 剩余元素
    short:
      en: 'The final ... target in a destructuring pattern, collecting remaining values or properties into a new container.'
      zh: '解构模式末尾的 ... 目标，把剩余值或属性收集到新容器中。'
