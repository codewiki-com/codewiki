terms:
  - id: type-inference
    en: Type inference
    zh: 类型推断
    short:
      en: 'The compiler deriving an expression or declaration type from its initializer, arguments, and surrounding expected type.'
      zh: '编译器根据初始化值、实参和周围的预期类型推导表达式或声明类型。'

  - id: nullable-type
    en: Nullable type
    zh: 可空类型
    short:
      en: 'A Kotlin type marked with ? whose set of permitted values includes null.'
      zh: '以 ? 标记、允许值集合中包含 null 的 Kotlin 类型。'

  - id: smart-cast
    en: Smart cast
    zh: 智能转换
    short:
      en: 'A compiler-proven narrowing based on type checks, null checks, and control flow, with no explicit cast in source.'
      zh: '编译器根据类型检查、空值检查与控制流证明的类型收窄，源码无需显式转换。'

  - id: exhaustive-when
    en: Exhaustive when
    zh: 穷尽 when
    short:
      en: 'A when expression whose branches cover every possible value of its subject.'
      zh: '各分支覆盖主题所有可能值的 when 表达式。'
