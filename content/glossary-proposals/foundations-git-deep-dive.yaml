terms:
  - id: git-object
    en: Git object
    zh: Git 对象
    short:
      en: 'An immutable, content-addressed blob, tree, commit, or annotated-tag record in a Git object database.'
      zh: 'Git 对象数据库中不可变、按内容寻址的 blob、tree、commit 或 annotated tag 记录。'

  - id: git-reference
    en: Git reference
    zh: Git 引用
    short:
      en: 'A named pointer to an object ID, used for branches, tags, remote-tracking branches, and other Git state.'
      zh: '指向对象标识的命名指针，用于分支、标签、远程跟踪分支和其他 Git 状态。'

  - id: git-index
    en: Git index
    zh: Git 索引
    short:
      en: 'The data structure that records the path, mode, and object selected for each entry in the proposed next snapshot.'
      zh: '记录下一候选快照中每个条目的路径、模式和所选对象的数据结构。'

  - id: merge-base
    en: Merge base
    zh: 合并基点
    short:
      en: 'A best common ancestor used to compare the independent changes leading to two commit tips.'
      zh: '用于比较通向两个提交端点的独立变化的最佳共同祖先。'

  - id: reflog
    en: Reference log
    zh: 引用日志
    short:
      en: 'A local, expiring log of prior values taken by HEAD or another Git reference.'
      zh: '记录 HEAD 或其他 Git 引用以往取值的本地可过期日志。'
