terms:
  - id: yield-instruction
    en: Yield instruction
    zh: yield 指令
    short:
      en: 'A value yielded by a Unity coroutine that tells the runtime which condition or player-loop point should resume it.'
      zh: 'Unity 协程产出的值，用于告诉运行时应在何种条件或 PlayerLoop 阶段恢复执行。'

  - id: scaled-time
    en: Scaled time
    zh: 缩放时间
    short:
      en: 'Unity game time whose rate follows Time.timeScale, including stopping when that scale is zero.'
      zh: '速率受 Time.timeScale 控制的 Unity 游戏时间；该值为零时，缩放时间停止推进。'
