terms:
  - id: scalar-type
    en: Scalar type
    zh: 标量类型
    short:
      en: 'A PHP type whose value is one Boolean, integer, floating-point number, or string.'
      zh: '值为单个布尔值、整数、浮点数或字符串的 PHP 类型。'

  - id: type-juggling
    en: Type juggling
    zh: 类型杂耍
    short:
      en: 'PHP automatic conversion of a value according to the operation or context using it.'
      zh: 'PHP 根据使用值的运算或上下文自动转换该值的行为。'

  - id: strict-types
    en: Strict types
    zh: 严格类型模式
    short:
      en: 'A per-file PHP mode that disables most scalar coercion for user-defined function calls.'
      zh: '一种 PHP 文件级模式，会为用户定义函数调用禁用大多数标量强制转换。'

  - id: union-type
    en: Union type
    zh: 联合类型
    short:
      en: 'A declaration that accepts a value satisfying at least one of its member types.'
      zh: '接受至少满足一个成员类型的值的类型声明。'

  - id: intersection-type
    en: Intersection type
    zh: 交集类型
    short:
      en: 'A declaration that requires an object to satisfy every member class or interface type.'
      zh: '要求对象同时满足每个成员类或接口类型的类型声明。'
