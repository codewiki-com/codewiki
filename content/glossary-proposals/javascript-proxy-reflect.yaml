terms:
  - id: proxy-trap
    en: Proxy trap
    zh: 代理陷阱
    aliases: [trap]
    short:
      en: 'A handler method that intercepts one fundamental operation performed on a JavaScript Proxy.'
      zh: '在 JavaScript Proxy 上拦截某一种基本操作的 handler 方法。'
    topics: [javascript/proxy-reflect]

  - id: proxy-invariant
    en: Proxy invariant
    zh: 代理不变量
    aliases: [proxy-invariants]
    short:
      en: 'A consistency rule that constrains trap results according to the target object state.'
      zh: '根据目标对象状态约束 trap 结果的一致性规则。'
    topics: [javascript/proxy-reflect]

  - id: internal-slot
    en: Internal slot
    zh: 内部槽
    aliases: [internal-slots]
    short:
      en: 'Specification state stored on an object but unavailable through ordinary JavaScript property access.'
      zh: '对象持有但不能通过普通 JavaScript 属性访问的规范内部状态。'
    topics: [javascript/proxy-reflect]
