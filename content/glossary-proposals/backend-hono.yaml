terms:
  - id: hono-context
    en: Hono Context
    zh: Hono 上下文
    aliases: [Context]
    short: { en: 'The per-request Hono object for reading request data, sharing variables, accessing bindings, and constructing a response.', zh: 'Hono 为每次请求创建的对象，用于读取请求数据、共享变量、访问绑定并构造响应。' }
    topics: [backend/hono]
  - id: hono-rpc
    en: Hono RPC
    zh: Hono RPC
    aliases: []
    short: { en: 'Hono’s typed HTTP client pattern, which derives client paths, inputs, and responses from a server application type.', zh: 'Hono 的类型化 HTTP 客户端模式，从服务端应用类型推导客户端路径、输入与响应。' }
    topics: [backend/hono]
  - id: edge-runtime
    en: Edge runtime
    zh: 边缘运行时
    aliases: []
    short: { en: 'A distributed server runtime near users, usually with constrained process lifetime and platform-specific bindings.', zh: '靠近用户分布式运行的服务端环境，通常限制进程生命周期，并使用平台专用绑定。' }
    topics: [backend/hono, backend/edge-functions]
