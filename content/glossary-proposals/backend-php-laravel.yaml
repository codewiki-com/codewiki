terms:
  - id: service-container
    en: Service container
    zh: 服务容器
    aliases: [IoC container]
    short:
      en: 'A registry and object factory that maps abstractions to implementations and resolves dependency graphs.'
      zh: '把抽象映射到实现，并解析依赖对象图的注册表与对象工厂。'
    topics: [backend/php-laravel]

  - id: route-model-binding
    en: Route model binding
    zh: 路由模型绑定
    aliases: []
    short:
      en: 'Framework resolution of a route parameter into a model instance before the route action runs.'
      zh: '在路由动作执行前，由框架把路由参数解析成模型实例的机制。'
    topics: [backend/php-laravel]

  - id: mass-assignment
    en: Mass assignment
    zh: 批量赋值
    aliases: []
    short:
      en: 'Writing several model attributes from one input map, subject to an explicit allowlist or guard policy.'
      zh: '从一个输入映射写入多个模型属性，并受显式白名单或保护策略约束。'
    topics: [backend/php-laravel]

  - id: eager-loading
    en: Eager loading
    zh: 预加载
    aliases: []
    short:
      en: 'Fetching known related records in planned queries before code traverses those relationships.'
      zh: '在代码遍历关联之前，通过预先规划的查询取得已知关联记录。'
    topics: [backend/php-laravel]
