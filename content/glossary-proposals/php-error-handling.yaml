terms:
  - id: error-level
    en: Error level
    zh: 错误级别
    short:
      en: 'A PHP E_* integer constant that classifies the severity and source of a diagnostic.'
      zh: '一种 PHP E_* 整数常量，用于区分诊断的严重程度与来源。'

  - id: error-handler
    en: Error handler
    zh: 错误处理器
    short:
      en: 'A callback that receives eligible PHP diagnostics and decides whether default handling continues.'
      zh: '接收符合条件的 PHP 诊断，并决定是否继续默认处理的回调。'

  - id: error-suppression
    en: Error suppression
    zh: 错误抑制
    short:
      en: 'Temporary exclusion of a PHP diagnostic from the active reporting mask, commonly through the @ operator.'
      zh: '临时把 PHP 诊断排除在当前报告掩码之外，通常由 @ 运算符触发。'
