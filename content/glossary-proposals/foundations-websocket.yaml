terms:
  - id: websocket-handshake
    en: WebSocket handshake
    zh: WebSocket 握手
    short:
      en: 'The opening exchange that validates WebSocket support and negotiates options before messages flow.'
      zh: '在消息传输前验证 WebSocket 支持并协商选项的开启交换。'
    topics: [foundations/websocket]

  - id: websocket-subprotocol
    en: WebSocket subprotocol
    zh: WebSocket 子协议
    short:
      en: 'An application protocol selected from values offered during the WebSocket handshake.'
      zh: '从 WebSocket 握手所提供的值中选出的应用协议。'
    topics: [foundations/websocket]

  - id: control-frame
    en: Control frame
    zh: 控制帧
    short:
      en: 'A WebSocket frame for connection signaling, including Close, Ping, and Pong, rather than application data.'
      zh: '用于连接信令而非应用数据的 WebSocket 帧，包括 Close、Ping 和 Pong。'
    topics: [foundations/websocket]

  - id: close-code
    en: Close code
    zh: 关闭状态码
    short:
      en: 'A numeric WebSocket status describing why an endpoint started or observed connection closure.'
      zh: '描述 WebSocket 端点为何发起或观察到连接关闭的数字状态。'
    topics: [foundations/websocket]
