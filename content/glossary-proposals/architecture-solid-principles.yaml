terms:
  - id: single-responsibility-principle
    en: Single Responsibility Principle
    zh: 单一职责原则
    short:
      en: A module should be responsible to one actor, grouping behavior that changes for the same reason.
      zh: 一个模块只对一个变更参与者负责，把因同一原因变化的行为放在一起。

  - id: open-closed-principle
    en: Open/Closed Principle
    zh: 开闭原则
    short:
      en: Stable software should accept expected variation through extension without repeated modification of its core policy.
      zh: 稳定软件应通过扩展接纳预期变化，而不反复修改核心策略。

  - id: liskov-substitution-principle
    en: Liskov Substitution Principle
    zh: 里氏替换原则
    short:
      en: A subtype must preserve the behavioral contract and correctness properties expected by callers of its base type.
      zh: 子类型必须保持基类型调用者所期待的行为契约与正确性。

  - id: interface-segregation-principle
    en: Interface Segregation Principle
    zh: 接口隔离原则
    short:
      en: A client should depend only on the cohesive operations required by its role, not unused capabilities.
      zh: 客户端只应依赖其角色所需的内聚操作，而不依赖无关能力。

  - id: dependency-inversion-principle
    en: Dependency Inversion Principle
    zh: 依赖倒置原则
    short:
      en: High-level policy and low-level detail should depend on abstractions owned by the stable policy side.
      zh: 高层策略与低层细节都应依赖由稳定策略一侧拥有的抽象。
