terms:
  - id: natural-language-processing
    en: Natural language processing
    zh: 自然语言处理
    short:
      en: Computing methods that turn human language into representations and outputs for defined tasks.
      zh: 把人类语言转换成面向明确任务的表示与输出的计算方法。
    topics: [ai/nlp]

  - id: tokenization
    en: Tokenization
    zh: 分词
    short:
      en: The rule-driven conversion of text into the token sequence consumed by a model or feature pipeline.
      zh: 按规则把文本转换成模型或特征流水线所使用的词元序列。
    topics: [ai/nlp]

  - id: corpus
    en: Corpus
    zh: 语料库
    short:
      en: A collected body of language data used for analysis, training, or evaluation.
      zh: 为分析、训练或评测收集的一组语言数据。
    topics: [ai/nlp]

  - id: tf-idf
    en: TF-IDF
    zh: 词频-逆文档频率
    short:
      en: A sparse feature weight that combines a term's frequency in one document with its rarity across documents.
      zh: 结合词语在单篇文档中的频率与其跨文档稀有程度的稀疏特征权重。
    topics: [ai/nlp]

  - id: data-leakage
    en: Data leakage
    zh: 数据泄漏
    short:
      en: Use of information unavailable at real inference time while fitting, selecting, or evaluating a model.
      zh: 在拟合、选择或评测模型时使用真实推理阶段无法获得的信息。
    topics: [ai/nlp]
