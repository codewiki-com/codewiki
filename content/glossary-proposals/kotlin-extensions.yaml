terms:
  - id: extension-function
    en: Extension function
    zh: 扩展函数
    short:
      en: 'A function declared outside a type and callable with receiver syntax without adding a real member.'
      zh: '在类型外声明、可用接收者语法调用，但不会给类型增加真实成员的函数。'

  - id: extension-property
    en: Extension property
    zh: 扩展属性
    short:
      en: 'A property-style declaration computed through accessors without adding storage to the receiver.'
      zh: '通过访问器计算、使用属性语法，却不会给接收者增加存储的声明。'

  - id: extension-receiver
    en: Extension receiver
    zh: 扩展接收者
    short:
      en: 'The object an extension is called on, whose declared type participates in extension resolution.'
      zh: '扩展调用所针对的对象；它的声明类型参与扩展解析。'

  - id: dispatch-receiver
    en: Dispatch receiver
    zh: 分派接收者
    short:
      en: 'The instance of a class that owns a member extension and supplies its surrounding object context.'
      zh: '拥有成员扩展并为其提供外围对象上下文的类实例。'

  - id: static-dispatch
    en: Static dispatch
    zh: 静态分派
    short:
      en: 'Selection of a callable from compile-time types and scope rather than the receiver runtime subtype.'
      zh: '根据编译期类型与作用域选择可调用项，而不是依据接收者的运行时子类型。'
