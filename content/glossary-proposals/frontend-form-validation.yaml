terms:
  - id: constraint-validation
    en: Constraint validation
    zh: 约束验证
    short:
      en: 'The browser process that checks form controls against applicable HTML and custom validity rules.'
      zh: '浏览器根据适用的 HTML 约束与自定义有效性规则检查表单控件的过程。'
  - id: validity-state
    en: ValidityState
    zh: 有效性状态
    short:
      en: 'The DOM object whose Boolean flags describe which constraints a form control currently violates.'
      zh: '通过一组布尔标志说明表单控件当前违反哪些约束的 DOM 对象。'
  - id: validation-message
    en: Validation message
    zh: 验证消息
    short:
      en: 'The localized message a form control exposes when its current value fails constraint validation.'
      zh: '表单控件当前值未通过约束验证时所公开的本地化消息。'
