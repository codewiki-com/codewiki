terms:
  - id: code-provenance
    en: Code provenance
    zh: 代码来源
    aliases: [source provenance]
    short:
      en: 'Evidence recording where code or an artifact came from and which transformations produced its current form.'
      zh: '记录代码或产物来自何处，以及哪些转换形成其当前状态的证据。'
    topics: [ai-era/code-provenance-and-verification]

  - id: attestation
    en: Attestation
    zh: 证明
    aliases: [signed attestation]
    short:
      en: 'A statement about a named subject, often signed so a verifier can authenticate its issuer and contents.'
      zh: '关于具名主体的声明，通常带有签名，使验证者能够认证签发者与内容。'
    topics: [ai-era/code-provenance-and-verification]

  - id: software-bill-of-materials
    en: Software bill of materials
    zh: 软件物料清单
    aliases: [SBOM]
    short:
      en: 'A machine-readable inventory of software components and their relationships for a defined artifact or system.'
      zh: '面向指定产物或系统，以机器可读形式列出软件组件及其关系的清单。'
    topics: [ai-era/code-provenance-and-verification]
