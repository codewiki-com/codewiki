terms:
  - id: move-semantics
    en: Move semantics
    zh: 移动语义
    short:
      en: 'Object initialization and assignment that can transfer resources from a source whose old value may be abandoned.'
      zh: '允许从旧值可被放弃的源对象转移资源的对象初始化与赋值语义。'

  - id: rvalue-reference
    en: Rvalue reference
    zh: 右值引用
    short:
      en: 'A reference written T&& that can bind to an rvalue and participate in selecting move-aware overloads.'
      zh: '写作 T&&、可绑定到右值并参与选择移动相关重载的引用。'

  - id: moved-from-state
    en: Moved-from state
    zh: 移动后状态
    short:
      en: 'The state of a source object after an operation has transferred some or all of its resources.'
      zh: '某项操作转移源对象的部分或全部资源后，该源对象所处的状态。'

  - id: copy-elision
    en: Copy elision
    zh: 拷贝消除
    short:
      en: 'Construction rules that omit an otherwise expected copy or move by constructing directly in the result location.'
      zh: '通过直接在结果位置构造对象，省略原本可能发生的复制或移动。'
