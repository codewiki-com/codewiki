terms:
  - id: multipart-form-data
    en: multipart/form-data
    zh: multipart/form-data 表单编码
    aliases: []
    short:
      en: 'An HTTP media type that separates form fields and files into boundary-delimited parts.'
      zh: '用 boundary 分隔表单字段与文件 part 的 HTTP 媒体类型。'
    topics: [backend/file-upload]

  - id: object-key
    en: Object key
    zh: 对象键
    aliases: []
    short:
      en: 'The identifier used by an object store to address one object within a bucket or namespace.'
      zh: '对象存储在 bucket 或命名空间中寻址单个对象所用的标识。'
    topics: [backend/file-upload]

  - id: upload-quarantine
    en: Upload quarantine
    zh: 上传隔离区
    aliases: []
    short:
      en: 'Non-public storage where uploaded bytes remain unavailable until required checks pass.'
      zh: '上传字节通过必要检查前保持不可公开访问的存储区域。'
    topics: [backend/file-upload]

  - id: presigned-url
    en: Presigned URL
    zh: 预签名 URL
    aliases: [pre-signed URL]
    short:
      en: 'A time-limited URL authorizing a specific storage operation under the signer’s permissions.'
      zh: '在签名者权限范围内，限时授权特定存储操作的 URL。'
    topics: [backend/file-upload]
