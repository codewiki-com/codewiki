terms:
  - id: array-buffer
    en: ArrayBuffer
    zh: 数组缓冲区
    aliases: [array buffer]
    short:
      en: 'A byte-addressed binary storage block that views interpret; it may have a fixed or resizable length.'
      zh: '由视图解释的按字节寻址二进制存储区，长度可以固定，也可以调整。'
    topics: [javascript/typed-arrays]

  - id: typed-array
    en: Typed array
    zh: 类型化数组
    aliases: [TypedArray, typed arrays]
    short:
      en: 'A numeric array view with one element type over bytes owned by an ArrayBuffer or SharedArrayBuffer.'
      zh: '在 ArrayBuffer 或 SharedArrayBuffer 字节上使用单一元素类型的数值数组视图。'
    topics: [javascript/typed-arrays]

  - id: data-view
    en: DataView
    zh: 数据视图
    aliases: [data view]
    short:
      en: 'A view that accesses numeric fields at byte offsets and chooses byte order for each multibyte operation.'
      zh: '按字节偏移访问数值字段，并为每次多字节操作选择字节序的视图。'
    topics: [javascript/typed-arrays]

  - id: endianness
    en: Endianness
    zh: 字节序
    aliases: [byte order, big-endian, little-endian]
    short:
      en: 'The order in which a multibyte scalar stores its bytes, commonly big-endian or little-endian.'
      zh: '多字节标量存放各字节的顺序，常见形式是大端序和小端序。'
    topics: [javascript/typed-arrays]
