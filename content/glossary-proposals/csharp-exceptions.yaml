terms:
  - id: exception
    en: Exception
    zh: 异常
    short:
      en: 'An object that reports a failed operation and transfers control from the normal path to a compatible handler.'
      zh: '报告操作失败，并把控制权从正常路径转移到兼容处理器的对象。'

  - id: exception-filter
    en: Exception filter
    zh: 异常筛选器
    short:
      en: 'A C# when condition that decides whether a type-compatible catch clause handles the current exception.'
      zh: '决定类型兼容的 catch 子句是否处理当前异常的 C# when 条件。'

  - id: stack-trace
    en: Stack trace
    zh: 堆栈跟踪
    short:
      en: 'Diagnostic call-path information recorded as an exception propagates from its throw site.'
      zh: '异常从抛出点传播时记录的诊断调用路径信息。'

  - id: inner-exception
    en: Inner exception
    zh: 内部异常
    short:
      en: 'The lower-level exception retained as the cause when another .NET exception wraps a failure.'
      zh: '另一个 .NET 异常包装失败时，作为原因保留的底层异常。'
