terms:
  - id: sealed-class
    en: Sealed class
    zh: 密封类
    short:
      en: 'A Java class or interface whose declaration restricts which types may directly extend or implement it.'
      zh: '在声明中限制哪些类型可以直接继承或实现它的 Java 类或接口。'

  - id: record-class
    en: Record class
    zh: 记录类
    short:
      en: 'A Java class declared from record components, with compiler-derived fields, accessors, construction, and value methods.'
      zh: '由记录组件声明，字段、访问器、构造过程和值方法由编译器派生的 Java 类。'

  - id: pattern-variable
    en: Pattern variable
    zh: 模式变量
    short:
      en: 'A variable introduced by a successful Java pattern match and available only where control flow proves it is bound.'
      zh: 'Java 模式匹配成功后引入，只在控制流能够证明已经绑定的位置可用的变量。'

  - id: text-block
    en: Text block
    zh: 文本块
    short:
      en: 'A multiline Java string literal whose line endings, incidental indentation, and escapes are processed by the compiler.'
      zh: '由编译器处理换行、附带缩进和转义的 Java 多行字符串字面量。'

  - id: switch-expression
    en: Switch expression
    zh: switch 表达式
    short:
      en: 'A Java switch form that exhaustively selects a branch and produces a value.'
      zh: '完整选择一个分支并产生值的 Java switch 形式。'
