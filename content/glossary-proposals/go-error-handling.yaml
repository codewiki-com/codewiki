terms:
  - id: sentinel-error
    en: Sentinel error
    zh: 哨兵错误
    short:
      en: 'A stable error value exposed so callers can recognize a documented failure category with errors.Is.'
      zh: '为调用方公开的稳定错误值，可通过 errors.Is 识别文档约定的失败类别。'

  - id: error-chain
    en: Error chain
    zh: 错误链
    short:
      en: 'An error structure connected through Unwrap methods and traversed by errors.Is and errors.As.'
      zh: '通过 Unwrap 方法连接，并由 errors.Is 和 errors.As 遍历的错误结构。'

  - id: typed-nil
    en: Typed nil
    zh: 带类型的 nil
    short:
      en: 'An interface value with a concrete dynamic type and a nil dynamic pointer, which makes the interface non-nil.'
      zh: '动态类型具体而动态指针为 nil 的接口值；该接口本身并不等于 nil。'
