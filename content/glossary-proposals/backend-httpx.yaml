terms:
  - id: connection-pool
    en: Connection pool
    zh: 连接池
    aliases: []
    short:
      en: 'A managed set of reusable network connections shared by requests to reduce setup work and bound concurrency.'
      zh: '由多个请求共享的可复用网络连接集合，用于减少建立连接的工作并限制并发。'
    topics: [backend/httpx]

  - id: transport
    en: Transport
    zh: 传输层
    aliases: []
    short:
      en: 'The HTTP client boundary that turns a constructed request into a response through network or in-process I/O.'
      zh: '通过网络或进程内 I/O，把构造好的请求转换为响应的 HTTP 客户端边界。'
    topics: [backend/httpx]
