terms:
  - id: api-version
    en: API version
    zh: API 版本
    short:
      en: 'A named set of externally observable API behavior that a provider supports as one compatibility contract.'
      zh: '作为一份兼容性契约，由提供者支持的一组具名、可从外部观察的 API 行为。'

  - id: backward-compatibility
    en: Backward compatibility
    zh: 向后兼容
    short:
      en: 'The ability of a newer provider to keep satisfying interactions that were valid under an older contract.'
      zh: '新提供者仍能满足旧契约下原本有效交互的能力。'

  - id: breaking-change
    en: Breaking change
    zh: 破坏性变更
    short:
      en: 'A change that can make a previously valid consumer interaction fail or acquire different observable meaning.'
      zh: '可能使原本有效的消费者交互失败，或产生不同可观察含义的变更。'

  - id: content-negotiation
    en: Content negotiation
    zh: 内容协商
    short:
      en: 'HTTP mechanisms for selecting a response representation according to information exchanged by client and server.'
      zh: '客户端与服务端根据双方交换的信息选择响应表示的一组 HTTP 机制。'

  - id: deprecation
    en: Deprecation
    zh: 弃用
    short:
      en: 'A lifecycle state that warns consumers to migrate away from a resource without itself changing its behavior.'
      zh: '提醒消费者迁离资源、但本身不改变资源行为的一种生命周期状态。'

  - id: sunset
    en: Sunset
    zh: 日落
    short:
      en: 'The expected time after which an HTTP resource may stop responding, communicated as a lifecycle hint.'
      zh: 'HTTP 资源预计可能停止响应的时间，以生命周期提示的形式传达。'
