terms:
  - id: document-object-model
    en: Document Object Model
    zh: 文档对象模型
    short:
      en: 'A tree-shaped programming interface that represents a document and lets scripts inspect or change its nodes.'
      zh: '以树形编程接口表示文档，使脚本能够检查或修改其中的节点。'

  - id: css-cascade
    en: CSS cascade
    zh: CSS 层叠
    short:
      en: 'The rule set that chooses a winning CSS declaration when several declarations apply to the same property.'
      zh: '多条 CSS 声明作用于同一属性时，用于选出最终声明的一组规则。'

  - id: progressive-enhancement
    en: Progressive enhancement
    zh: 渐进增强
    short:
      en: 'A design approach that starts with a useful baseline and adds capabilities without making enhancement failure destructive.'
      zh: '先建立可用基础层，再添加能力，并避免增强失败破坏基础任务的设计方法。'
