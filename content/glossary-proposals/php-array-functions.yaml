terms:
  - id: callback
    en: Callback
    zh: 回调函数
    short:
      en: 'A function passed into another function so that the receiver can invoke it during an operation.'
      zh: '作为参数传给另一函数、由接收方在执行操作期间调用的函数。'

  - id: stable-sort
    en: Stable sort
    zh: 稳定排序
    short:
      en: 'A sort that preserves the original relative order of elements that compare equal.'
      zh: '比较结果相等时，仍保留各元素原始相对顺序的排序。'
