terms:
  - id: single-dispatch
    en: Single dispatch
    zh: 单分派
    aliases: [single-dispatch]
    short:
      en: 'Runtime selection of one implementation from the type of one designated argument.'
      zh: '根据一个指定实参的运行时类型选择一项实现的机制。'
    topics: [python/singledispatch]

  - id: generic-function
    en: Generic function
    zh: 泛型函数
    aliases: [generic functions]
    short:
      en: 'A callable with registered implementations selected by a dispatch rule at runtime.'
      zh: '在运行时根据分派规则，从多个已注册实现中选择行为的可调用对象。'
    topics: [python/singledispatch]

  - id: method-resolution-order
    en: Method resolution order
    zh: 方法解析顺序
    aliases: [MRO]
    short:
      en: 'The ordered class sequence Python uses to look up attributes and resolve inherited behavior.'
      zh: 'Python 查找属性并解析继承行为时使用的有序类序列。'
    topics: [python/singledispatch]

  - id: abstract-base-class
    en: Abstract base class
    zh: 抽象基类
    aliases: [ABC]
    short:
      en: 'A class that defines a shared interface and can recognize concrete or virtual subclasses.'
      zh: '定义共享接口，并可识别具体子类或虚拟子类的类。'
    topics: [python/singledispatch]
