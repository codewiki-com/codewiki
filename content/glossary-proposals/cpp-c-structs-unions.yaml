terms:
  - id: structure-type
    en: Structure type
    zh: 结构体类型
    short:
      en: 'A C aggregate type whose object contains all named members in declaration order, with implementation-selected padding.'
      zh: '一种 C 聚合类型；对象按声明顺序包含所有具名成员，并可能带有实现选择的填充。'

  - id: c-union
    en: C union
    zh: C 联合体
    short:
      en: 'A C type whose members begin in shared storage, normally representing one valid alternative at a time.'
      zh: '一种 C 类型；各成员从共享存储的同一位置开始，通常一次只表示一种有效形态。'

  - id: c-enumeration
    en: C enumeration
    zh: C 枚举
    short:
      en: 'A distinct C type accompanied by named integer constants and compatible with an implementation-selected integer type.'
      zh: '一种带有具名整数常量的独立 C 类型，与实现选择的某种整数类型兼容。'

  - id: tagged-union
    en: Tagged union
    zh: 带标记联合体
    short:
      en: 'A discriminant paired with a union payload under an invariant that the tag identifies the member currently holding a value.'
      zh: '判别值与联合体载荷的组合，其不变量要求标签指明当前保存值的成员。'

  - id: padding-byte
    en: Padding byte
    zh: 填充字节
    short:
      en: 'Storage inserted by an implementation to satisfy layout requirements but not belonging to the value of a struct member.'
      zh: '实现为满足布局要求而插入的存储字节，不属于任何结构体成员的值。'

  - id: flexible-array-member
    en: Flexible array member
    zh: 柔性数组成员
    short:
      en: 'An incomplete array declared last in a C struct, with element storage supplied beyond the fixed-size portion.'
      zh: '声明在 C 结构体末尾的不完整数组，其元素存储由固定部分之后的额外分配提供。'
