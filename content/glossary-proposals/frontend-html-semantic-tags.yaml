terms:
  - id: semantic-html
    en: Semantic HTML
    zh: 语义化 HTML
    aliases: []
    short:
      en: 'HTML that uses elements according to their defined content and interaction purposes.'
      zh: '按照元素既定的内容与交互用途组织标记的 HTML。'
    topics: [frontend/html-semantic-tags]

  - id: landmark
    en: Landmark
    zh: 地标
    aliases: [landmark-region]
    short:
      en: 'A named page region that assistive technology can expose for direct navigation.'
      zh: '辅助技术可用于直接导航的具名页面区域。'
    topics: [frontend/html-semantic-tags]

  - id: accessible-name
    en: Accessible name
    zh: 可访问名称
    aliases: []
    short:
      en: 'The computed text that identifies an element to accessibility APIs and assistive technology.'
      zh: '向可访问性 API 与辅助技术标识元素的计算文本。'
    topics: [frontend/html-semantic-tags]
