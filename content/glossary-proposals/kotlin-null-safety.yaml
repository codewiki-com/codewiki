terms:
  - id: safe-call
    en: Safe call
    zh: 安全调用
    short:
      en: 'Kotlin’s ?. operator, which accesses a member only for a non-null receiver and otherwise returns null.'
      zh: 'Kotlin 的 ?. 运算符，仅在接收者非空时访问成员，否则返回 null。'

  - id: elvis-operator
    en: Elvis operator
    zh: Elvis 运算符
    short:
      en: 'Kotlin’s ?: operator, which returns its left side when non-null and otherwise evaluates its right side.'
      zh: 'Kotlin 的 ?: 运算符，左侧非空时返回左侧，否则计算并返回右侧。'

  - id: platform-type
    en: Platform type
    zh: 平台类型
    short:
      en: 'A Java-origin type whose nullability Kotlin cannot determine, so callers may use it as nullable or non-null.'
      zh: '源自 Java 且 Kotlin 无法确定可空性的类型，调用方可将其作为可空或非空类型使用。'
