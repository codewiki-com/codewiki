terms:
  - id: smart-pointer
    en: Smart pointer
    zh: 智能指针
    short:
      en: 'A pointer-like type that adds ownership, destruction, or other resource-management behavior.'
      zh: '一种行为类似指针，同时增加所有权、析构或其他资源管理语义的类型。'

  - id: reference-counting
    en: Reference counting
    zh: 引用计数
    short:
      en: 'An ownership strategy that destroys a value when its count of strong owners reaches zero.'
      zh: '一种所有权策略：当值的强所有者计数降到零时将其析构。'

  - id: reference-count-control-block
    en: Reference-count control block
    zh: 引用计数控制块
    short:
      en: 'Metadata associated with a shared allocation that tracks strong and weak pointer lifetimes.'
      zh: '与共享分配关联的元数据，用于跟踪强指针与弱指针的生存期。'
