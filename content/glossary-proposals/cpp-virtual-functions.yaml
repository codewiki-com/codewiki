terms:
  - id: virtual-function
    en: Virtual function
    zh: 虚函数
    short:
      en: 'A non-static member function whose final overrider can be selected from an object’s dynamic type.'
      zh: '可根据对象的动态类型选择最终覆盖函数的非静态成员函数。'
    topics: [cpp/virtual-functions]

  - id: virtual-dispatch
    en: Virtual dispatch
    zh: 虚分派
    short:
      en: 'Runtime selection of a virtual function’s final overrider according to the complete object’s dynamic type.'
      zh: '根据完整对象的动态类型，在运行时选择虚函数最终覆盖实现的过程。'
    topics: [cpp/virtual-functions]

  - id: pure-virtual-function
    en: Pure virtual function
    zh: 纯虚函数
    short:
      en: 'A virtual function declared with = 0 that keeps a class abstract until a concrete final overrider exists.'
      zh: '以 = 0 声明的虚函数；在具体最终覆盖实现出现前，类保持抽象。'
    topics: [cpp/virtual-functions]

  - id: abstract-class
    en: Abstract class
    zh: 抽象类
    short:
      en: 'A class that cannot be instantiated because at least one pure virtual function lacks a concrete final overrider.'
      zh: '至少一个纯虚函数没有具体最终覆盖实现，因而不能直接实例化的类。'
    topics: [cpp/virtual-functions]

  - id: virtual-destructor
    en: Virtual destructor
    zh: 虚析构函数
    short:
      en: 'A destructor that lets deletion through a base pointer begin destruction at the most-derived object.'
      zh: '让通过基类指针的删除从最派生对象开始执行析构的析构函数。'
    topics: [cpp/virtual-functions]

  - id: final-overrider
    en: Final overrider
    zh: 最终覆盖函数
    short:
      en: 'The virtual-function implementation selected for a class after considering all overrides in its inheritance graph.'
      zh: '考虑继承图中的全部重写后，为某个类确定的虚函数实现。'
    topics: [cpp/virtual-functions]
