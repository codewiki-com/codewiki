terms:
  - id: tool-call
    en: Tool call
    zh: 工具调用
    short:
      en: 'A structured request from a model to a host to execute a named operation with supplied arguments.'
      zh: '模型向宿主发出的结构化请求，要求宿主使用给定参数执行具名操作。'

  - id: approval-gate
    en: Approval gate
    zh: 审批门
    short:
      en: 'A policy checkpoint that pauses an agent action until a person or higher-authority rule explicitly allows it.'
      zh: '暂停智能体操作，直到人员或更高权限规则明确允许该操作的策略检查点。'
