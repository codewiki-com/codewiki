terms:
  - id: this-binding
    en: this binding
    zh: this 绑定
    short:
      en: 'The rule that supplies the this value for a JavaScript function call from its function kind and call form.'
      zh: '根据 JavaScript 函数种类与调用形式，为一次函数调用提供 this 值的规则。'
    topics: [javascript/this-binding]

  - id: bound-function
    en: Bound function
    zh: 绑定函数
    short:
      en: 'A function object created by bind that stores a target, a this value, and optional leading arguments.'
      zh: '由 bind 创建的函数对象，保存目标函数、this 值与可选的前置实参。'
    topics: [javascript/this-binding]
