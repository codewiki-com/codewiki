terms:
  - id: quality-attribute
    en: Quality attribute
    zh: 质量属性
    aliases: [non-functional requirement]
    short:
      en: A measurable property of how a system behaves under a stated condition, such as reliability, security, or maintainability.
      zh: 系统在明确条件下怎样运行的一项可度量属性，例如可靠性、安全性或可维护性。
    topics: [architecture/getting-started]

  - id: architecture-boundary
    en: Architecture boundary
    zh: 架构边界
    aliases: []
    short:
      en: An explicit division that confines change, ownership, data access, or failure impact to a defined part of a system.
      zh: 把变化、所有权、数据访问或故障影响限制在系统明确范围内的分界。
    topics: [architecture/getting-started]

  - id: fitness-function
    en: Architecture fitness function
    zh: 架构适应度函数
    aliases: [fitness function]
    short:
      en: A repeatable check that reports whether an implementation still preserves a chosen architecture characteristic.
      zh: 用于报告实现是否仍保持某项既定架构特征的可重复检查。
    topics: [architecture/getting-started]
