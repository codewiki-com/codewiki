terms:
  - id: api-contract
    en: API contract
    zh: API 契约
    short:
      en: 'A versioned statement of the observable requests, responses, and behavior that an API provider promises to consumers.'
      zh: 'API 提供者向消费者承诺的可观察请求、响应与行为的版本化说明。'

  - id: contract-testing
    en: Contract testing
    zh: 契约测试
    short:
      en: 'Testing that an API provider and consumer satisfy an agreed set of observable interactions.'
      zh: '验证 API 提供者与消费者满足双方约定的可观察交互。'
