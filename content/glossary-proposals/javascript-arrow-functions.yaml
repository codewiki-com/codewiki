terms:
  - id: arrow-function
    en: Arrow function
    zh: 箭头函数
    aliases: [arrow function expression]
    short:
      en: 'A function expression written with => that uses lexical this and is not constructible.'
      zh: '使用 => 书写、采用词法 this 且不可构造的函数表达式。'
    topics: [javascript/arrow-functions]

  - id: lexical-this
    en: Lexical this
    zh: 词法 this
    aliases: [lexically bound this]
    short:
      en: 'The rule that an arrow resolves this through its enclosing lexical environment instead of its call form.'
      zh: '箭头函数从外层词法环境解析 this，而不由自身调用形式提供 this 的规则。'
    topics: [javascript/arrow-functions]

  - id: rest-parameter
    en: Rest parameter
    zh: 剩余参数
    aliases: [rest parameters]
    short:
      en: 'A final parameter prefixed by ... that collects remaining call arguments into an Array.'
      zh: '以 ... 开头的末尾形参，用于把调用时余下的实参收集到 Array 中。'
    topics: [javascript/arrow-functions]
