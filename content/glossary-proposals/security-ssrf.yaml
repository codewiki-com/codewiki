terms:
  - id: server-side-request-forgery
    en: Server-Side Request Forgery
    zh: 服务端请求伪造
    short:
      en: A flaw that lets untrusted input influence a network request made with a server's reach, identity, or credentials.
      zh: 不可信输入能够影响服务端网络请求，并借用服务器的网络可达性、身份或凭据的一类漏洞。

  - id: dns-rebinding
    en: DNS rebinding
    zh: DNS 重绑定
    short:
      en: Changing a hostname's DNS answer so validation observes one address while a later connection reaches another.
      zh: 改变主机名的 DNS 答案，使校验看到一个地址，而后续连接到达另一个地址的技术。

  - id: egress-filtering
    en: Egress filtering
    zh: 出站过滤
    short:
      en: Network policy that restricts which destinations, ports, or protocols a workload may reach outbound.
      zh: 限制工作负载可向外访问哪些目标、端口或协议的网络策略。
