terms:
  - id: escaping-closure
    en: Escaping closure
    zh: 逃逸闭包
    short:
      en: 'A closure permitted to outlive the function call that received it, such as one stored for later invocation.'
      zh: '允许比接收它的函数调用活得更久的闭包，例如被存储起来供之后调用的闭包。'

  - id: autoclosure
    en: Autoclosure
    zh: 自动闭包
    short:
      en: 'A parameterless closure Swift creates automatically around an argument expression to delay its evaluation.'
      zh: 'Swift 自动为实参表达式创建的无参数闭包，用于推迟表达式求值。'

  - id: sendable-closure
    en: Sendable closure
    zh: 可发送闭包
    short:
      en: 'A function value marked @Sendable whose captures satisfy the requirements for transfer across concurrency domains.'
      zh: '标记为 @Sendable 且捕获满足跨并发域传递要求的函数值。'
