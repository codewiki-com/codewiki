terms:
  - id: entity-component-system
    en: Entity Component System
    zh: 实体组件系统
    short:
      en: 'An architecture that separates entity identity, component data, and systems that process matching component sets.'
      zh: '把实体标识、组件数据与处理匹配组件集合的系统分离开的架构。'

  - id: ecs-archetype
    en: ECS archetype
    zh: ECS 原型
    short:
      en: 'The unique component-type combination shared by a group of entities in an ECS world.'
      zh: 'ECS World 中一组实体共同拥有的唯一组件类型组合。'

  - id: ecs-chunk
    en: ECS chunk
    zh: ECS 块
    short:
      en: 'A fixed-size memory block holding aligned arrays of entities and their components for one archetype.'
      zh: '为一个原型保存实体及其组件对齐数组的固定大小内存块。'

  - id: structural-change
    en: Structural change
    zh: 结构变更
    short:
      en: 'An ECS operation that changes entity storage shape, such as adding a component or creating an entity.'
      zh: '改变实体存储形状的 ECS 操作，例如添加组件或创建实体。'

  - id: entity-command-buffer
    en: Entity command buffer
    zh: 实体命令缓冲区
    short:
      en: 'A queue that records entity operations for safe playback at a defined point after jobs or iteration.'
      zh: '记录实体操作，并在 Job 或迭代之后的确定时点安全回放的命令队列。'

  - id: burst-compiler
    en: Burst Compiler
    zh: Burst 编译器
    short:
      en: 'Unity compiler that translates compatible High-Performance C# IL into optimized native CPU code.'
      zh: '把兼容的 High-Performance C# IL 转换为优化后原生 CPU 代码的 Unity 编译器。'
