terms:
  - id: memoization
    en: Memoization
    zh: 记忆化
    aliases: [memoize]
    short:
      {
        en: 'Reusing a function result previously stored for the same input key.',
        zh: '复用先前按相同输入键保存的函数结果。',
      }
    topics: [python/lru-cache]

  - id: cache-key
    en: Cache key
    zh: 缓存键
    aliases: []
    short:
      {
        en: 'A hashable identity used to find the cached result for one call or request.',
        zh: '用于查找某次调用或请求缓存结果的可哈希标识。',
      }
    topics: [python/lru-cache]

  - id: cache-invalidation
    en: Cache invalidation
    zh: 缓存失效
    aliases: [invalidate-cache]
    short:
      {
        en: 'Removing or superseding cached data when its validity contract ends.',
        zh: '缓存数据的有效性契约结束时，将其删除或替换。',
      }
    topics: [python/lru-cache]
