terms:
  - id: delegated-property
    en: Delegated property
    zh: 委托属性
    short:
      en: 'A property whose getter and optional setter behavior is supplied by an object named after Kotlin’s by keyword.'
      zh: '通过 Kotlin 的 by 关键字，把 getter 及可选 setter 行为交给另一个对象的属性。'

  - id: property-delegate
    en: Property delegate
    zh: 属性委托
    short:
      en: 'An object that provides getValue and, for mutable properties, setValue for a delegated property.'
      zh: '为委托属性提供 getValue，并在可变属性中提供 setValue 的对象。'

  - id: backing-field
    en: Backing field
    zh: 幕后字段
    short:
      en: 'Compiler-managed storage associated with a property whose accessors need to retain a value.'
      zh: '由编译器管理、与属性关联的存储，供需要保留值的访问器使用。'
