terms:
  - id: namespace
    en: Namespace
    zh: 命名空间
    aliases: []
    short:
      en: 'A hierarchical part of a declared symbol name that separates otherwise colliding classes, functions, or constants.'
      zh: '声明符号名称中的分层部分，用于隔离原本会冲突的类、函数或常量。'
    topics: [php/namespaces]

  - id: fully-qualified-name
    en: Fully qualified name
    zh: 完全限定名称
    aliases: [FQN]
    short:
      en: 'A symbol name written from the namespace root, independent of the current namespace.'
      zh: '从命名空间根部写出的符号名称，不依赖当前命名空间。'
    topics: [php/namespaces]

  - id: namespace-alias
    en: Namespace alias
    zh: 命名空间别名
    aliases: [import alias]
    short:
      en: 'A file-local alternate spelling for an imported namespace or symbol name.'
      zh: '导入命名空间或符号名称在当前文件中的替代拼写。'
    topics: [php/namespaces]

  - id: autoloading
    en: Autoloading
    zh: 自动加载
    aliases: [autoload]
    short:
      en: 'Loading a class-like definition on demand when PHP first needs its resolved name.'
      zh: 'PHP 首次需要已解析的类式名称时，按需载入相应定义。'
    topics: [php/namespaces]

  - id: psr-4
    en: PSR-4
    zh: PSR-4 自动加载规范
    aliases: []
    short:
      en: 'A PHP-FIG convention that maps namespace prefixes and class-name suffixes to filesystem paths.'
      zh: 'PHP-FIG 制定的约定，把命名空间前缀及类名后缀映射到文件系统路径。'
    topics: [php/namespaces]
