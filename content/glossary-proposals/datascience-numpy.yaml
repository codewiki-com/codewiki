terms:
  - id: ndarray
    en: N-dimensional array
    zh: 多维数组
    short:
      en: 'NumPy’s homogeneous multidimensional array, described by a shape, dtype, strides, and a data buffer.'
      zh: 'NumPy 的同质多维数组，由形状、数据类型、步幅和数据缓冲区共同描述。'

  - id: array-shape
    en: Array shape
    zh: 数组形状
    short:
      en: 'A tuple giving the element count along each axis of an array.'
      zh: '由数组各轴元素数量组成的元组。'

  - id: dtype
    en: Data type
    zh: 数据类型
    short:
      en: 'The rule that determines how each array element is stored and interpreted.'
      zh: '决定数组中每个元素如何存储与解释的规则。'

  - id: array-stride
    en: Array stride
    zh: 数组步幅
    short:
      en: 'The byte distance crossed when an array index advances by one position along an axis.'
      zh: '数组索引沿某个轴前进一个位置时跨过的字节数。'

  - id: broadcasting
    en: Broadcasting
    zh: 广播
    short:
      en: 'NumPy’s rules for applying element-wise operations to compatible arrays with different shapes.'
      zh: 'NumPy 对形状不同但兼容的数组执行逐元素运算时使用的规则。'

  - id: vectorization
    en: Vectorization
    zh: 向量化
    short:
      en: 'Expressing a calculation as array operations so iteration occurs inside the array implementation.'
      zh: '把计算表达为数组操作，使迭代在数组实现内部完成。'

  - id: array-view
    en: Array view
    zh: 数组视图
    short:
      en: 'An array object that interprets data owned by another array instead of holding an independent element buffer.'
      zh: '解释另一个数组所拥有数据的数组对象，不持有独立元素缓冲区。'
