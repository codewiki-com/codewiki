terms:
  - id: read-only-collection
    en: Read-only collection
    zh: 只读集合
    short:
      en: 'A collection interface that exposes element access but no mutation operations; its backing object may still be mutable.'
      zh: '只暴露元素读取操作、不暴露修改操作的集合接口；其底层对象仍可能是可变的。'

  - id: collection-pipeline
    en: Collection pipeline
    zh: 集合处理管道
    short:
      en: 'An ordered chain of collection transformations, filters, and aggregations in which each result feeds the next step.'
      zh: '按顺序连接集合转换、过滤与聚合操作，并把每步结果交给下一步的处理链。'

  - id: sequence
    en: Sequence
    zh: 序列
    short:
      en: 'A Kotlin value that produces elements lazily through intermediate operations when a terminal operation consumes it.'
      zh: '一种 Kotlin 值；终结操作消费它时，中间操作才会惰性地产生元素。'

  - id: terminal-operation
    en: Terminal operation
    zh: 终结操作
    short:
      en: "An operation that consumes a sequence and returns a non-sequence result, triggering the sequence's lazy evaluation."
      zh: '消费序列并返回非序列结果的操作；调用它会触发序列的惰性求值。'
