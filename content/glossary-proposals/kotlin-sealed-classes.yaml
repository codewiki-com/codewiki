terms:
  - id: sealed-interface
    en: Sealed interface
    zh: 密封接口
    aliases: []
    short: { en: 'A Kotlin interface whose direct implementations are restricted to named types in the same package and module.', zh: '直接实现被限制为同包同模块中具名类型的 Kotlin 接口。' }
    topics: [kotlin/sealed-classes]
  - id: covariance
    en: Covariance
    zh: 协变
    aliases: []
    short: { en: 'A variance relation where a generic producer of a subtype can be used as a producer of its supertype.', zh: '允许子类型的泛型生产者用作其父类型生产者的型变关系。' }
    topics: [kotlin/sealed-classes]
  - id: bottom-type
    en: Bottom type
    zh: 底类型
    aliases: []
    short: { en: 'A type with no ordinary values that is a subtype of every type; Kotlin uses Nothing for this role.', zh: '没有普通值且是所有类型之子类型的类型；Kotlin 中由 Nothing 承担这一角色。' }
    topics: [kotlin/sealed-classes]
