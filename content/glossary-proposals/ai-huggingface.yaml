terms:
  - id: model-repository
    en: Model repository
    zh: 模型仓库
    short:
      en: 'A versioned repository containing model weights, configuration, processors, metadata, and documentation.'
      zh: '保存模型权重、配置、处理器、元数据与说明文档的版本化仓库。'
  - id: model-card
    en: Model card
    zh: 模型卡
    short:
      en: 'Documentation describing a model’s intended uses, limitations, training context, evaluation, and license.'
      zh: '说明模型预期用途、限制、训练背景、评测结果与许可证的文档。'
  - id: revision
    en: Revision
    zh: 修订版本
    short:
      en: 'A branch, tag, or commit hash that selects one version of files in a repository.'
      zh: '用于选择仓库中某一版文件的分支、标签或提交哈希。'
  - id: safetensors
    en: Safetensors
    zh: Safetensors
    short:
      en: 'A tensor serialization format designed for safe, fast loading without Python pickle objects.'
      zh: '无需 Python pickle 对象即可安全、快速加载张量的序列化格式。'
