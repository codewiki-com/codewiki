terms:
  - id: auto-configuration
    en: Auto-configuration
    zh: 自动配置
    short:
      en: Conditional Spring configuration selected from the application classpath, beans, properties, and runtime type.
      zh: 根据应用类路径、Bean、属性和运行时类型选择的条件化 Spring 配置。
    topics: [backend/spring-boot]

  - id: spring-bean
    en: Spring bean
    zh: Spring Bean
    short:
      en: An object whose construction, dependencies, scope, and lifecycle are managed by a Spring application context.
      zh: 由 Spring 应用上下文管理构造、依赖、作用域和生命周期的对象。
    topics: [backend/spring-boot]

  - id: starter-dependency
    en: Starter dependency
    zh: Starter 依赖
    short:
      en: A curated dependency descriptor that brings together compatible libraries for one Spring Boot capability.
      zh: 为一项 Spring Boot 能力组合一组兼容库的依赖描述。
    topics: [backend/spring-boot]

  - id: externalized-configuration
    en: Externalized configuration
    zh: 外部化配置
    short:
      en: Runtime settings supplied outside application code through ordered property sources such as files and environment variables.
      zh: 通过配置文件、环境变量等有序属性源，在应用代码之外提供的运行时设置。
    topics: [backend/spring-boot]
