terms:
  - id: dev-container
    en: Dev Container
    zh: 开发容器
    short:
      en: 'A container environment enriched with metadata for developing, building, testing, and debugging a codebase.'
      zh: '增加了开发期元数据，用于编写、构建、测试和调试代码库的容器环境。'

  - id: dev-container-feature
    en: Dev Container Feature
    zh: Dev Container Feature
    short:
      en: 'A reusable package of installation code and metadata applied while a development container image is built.'
      zh: '在构建开发容器镜像时应用的一组可复用安装代码与元数据。'

  - id: lifecycle-command
    en: Lifecycle command
    zh: 生命周期命令
    short:
      en: 'A command assigned to a defined host, creation, start, or attachment event in a Dev Container environment.'
      zh: '绑定到开发容器的宿主机、创建、启动或连接事件的命令。'

  - id: remote-user
    en: Remote user
    zh: 远程用户
    short:
      en: 'The container account used for lifecycle scripts and processes launched by a Dev Container supporting tool.'
      zh: 'Dev Container 支持工具运行生命周期脚本和远程进程时使用的容器账户。'
