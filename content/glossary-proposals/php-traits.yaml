terms:
  - id: trait
    en: Trait
    zh: Trait
    aliases: [traits, PHP trait]
    short:
      en: 'A PHP code-reuse unit that composes methods, properties, and constants into classes without becoming an instantiable type.'
      zh: 'PHP 的代码复用单元；它把方法、属性与常量组合进类，但自身不是可实例化类型。'
    topics: [php/traits]
