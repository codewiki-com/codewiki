terms:
  - id: pin
    en: Pin
    zh: 固定指针
    aliases: [pinned pointer]
    short:
      en: 'A pointer wrapper whose safe interface prevents moving an address-sensitive pointee before its destruction completes.'
      zh: '一种指针包装器，其安全接口防止地址敏感目标在析构完成前被移动。'
    topics: [rust/pin]

  - id: unpin
    en: Unpin
    zh: 可解除固定
    aliases: [Unpin auto trait]
    short:
      en: 'An auto trait marking types whose values remain sound to move even after they are placed behind Pin.'
      zh: '一种自动 trait，表示值即使位于 Pin 之后仍可安全移动。'
    topics: [rust/pin]

  - id: pinning-invariant
    en: Pinning invariant
    zh: 固定不变量
    aliases: [pin invariant]
    short:
      en: 'The requirement that an address-sensitive value stays at one valid location until its destruction finishes.'
      zh: '要求地址敏感值留在同一有效位置，直到其析构过程结束。'
    topics: [rust/pin]

  - id: pin-projection
    en: Pin projection
    zh: 固定投影
    aliases: [pinned projection]
    short:
      en: 'Deriving access to a field from a pinned parent while preserving the field’s declared pinning status.'
      zh: '从固定父对象取得字段访问，同时维持该字段声明的固定状态。'
    topics: [rust/pin]
