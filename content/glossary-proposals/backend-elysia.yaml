terms:
  - id: elysia
    en: Elysia
    zh: Elysia
    short:
      en: 'A Bun-first TypeScript web framework that derives runtime validation and static types from route declarations.'
      zh: '面向 Bun 的 TypeScript Web 框架，从路由声明推导运行时验证与静态类型。'

  - id: route-schema
    en: Route schema
    zh: 路由模式
    short:
      en: 'A runtime-validatable declaration of the inputs or per-status outputs attached to an HTTP route.'
      zh: '附加到 HTTP 路由、可在运行时验证其输入或逐状态输出的声明。'

  - id: lifecycle-hook
    en: Lifecycle hook
    zh: 生命周期钩子
    short:
      en: 'A function registered for a defined phase of request parsing, validation, handling, response mapping, or cleanup.'
      zh: '注册在请求解析、验证、处理、响应映射或清理等特定阶段执行的函数。'

  - id: eden-treaty
    en: Eden Treaty
    zh: Eden Treaty
    short:
      en: 'A typed client interface inferred from an Elysia application type without generating client source files.'
      zh: '从 Elysia 应用类型推断的类型化客户端接口，无需生成客户端源文件。'
