terms:
  - id: hash-collision
    en: Hash collision
    zh: 哈希冲突
    aliases: [hash collisions, collision]
    short:
      en: 'The event in which unequal keys produce the same hash or select the same hash-table bucket.'
      zh: '不相等的键产生相同哈希值，或选中同一个哈希表桶的现象。'
    topics: [foundations/hash-maps]

  - id: load-factor
    en: Load factor
    zh: 负载因子
    aliases: [hash-table load factor]
    short:
      en: 'The ratio of stored entries to buckets, used to reason about collision pressure and resizing.'
      zh: '已存条目数与桶数之比，用于判断冲突压力和扩容时机。'
    topics: [foundations/hash-maps]

  - id: separate-chaining
    en: Separate chaining
    zh: 拉链法
    aliases: [chaining, closed addressing]
    short:
      en: 'A collision strategy that keeps all entries selecting one bucket in a per-bucket collection.'
      zh: '一种冲突处理策略，把选中同一个桶的所有条目保存在该桶的集合中。'
    topics: [foundations/hash-maps]
