terms:
  - id: shallow-copy
    en: Shallow copy
    zh: 浅拷贝
    short:
      en: 'A new outer container whose nested objects still share references with the source.'
      zh: '创建新的外层容器，但其中的嵌套对象仍与来源共享引用。'
  - id: sparse-array
    en: Sparse array
    zh: 稀疏数组
    short:
      en: 'An array whose index range contains empty slots where no indexed property exists.'
      zh: '索引范围中含有空槽的数组；这些位置不存在对应的索引属性。'
  - id: comparator
    en: Comparator
    zh: 比较函数
    short:
      en: 'A function that returns a negative, zero, or positive number to define relative ordering.'
      zh: '通过返回负数、0 或正数来定义两个值相对顺序的函数。'
