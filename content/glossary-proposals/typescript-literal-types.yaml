terms:
  - id: literal-type
    en: Literal type
    zh: 字面量类型
    aliases: [literal types]
    short:
      {
        en: 'A type containing one exact string, number, bigint, or Boolean value rather than every value of its primitive type.',
        zh: '只包含一个精确字符串、数字、bigint 或布尔值，而不是包含该原始类型所有值的类型。',
      }
    topics: [typescript/literal-types]

  - id: literal-widening
    en: Literal widening
    zh: 字面量拓宽
    aliases: [widening literal type]
    short:
      {
        en: 'Inference replacing an exact literal with a broader primitive type when a value may need to change.',
        zh: '值可能需要变化时，类型推断把精确字面量替换为更宽原始类型的过程。',
      }
    topics: [typescript/literal-types]

  - id: const-assertion
    en: Const assertion
    zh: const 断言
    aliases: [as const]
    short:
      {
        en: 'The as const assertion that prevents literal widening and gives object and array literals readonly, tuple-like precision.',
        zh: '阻止字面量拓宽，并让对象与数组字面量获得只读、元组式精度的 as const 断言。',
      }
    topics: [typescript/literal-types]
