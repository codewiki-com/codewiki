terms:
  - id: json-text
    en: JSON text
    zh: JSON 文本
    aliases: [JSON document]
    short:
      {
        en: 'A Unicode text that conforms to JSON grammar and represents one JSON value.',
        zh: '符合 JSON 语法并表示一个 JSON 值的 Unicode 文本。',
      }
    topics: [javascript/json]
  - id: serialization
    en: Serialization
    zh: 序列化
    aliases: [encoding]
    short:
      {
        en: 'Converting an in-memory value into a representation suitable for storage or transfer.',
        zh: '把内存中的值转换为适合存储或传输的表示。',
      }
    topics: [javascript/json]
  - id: reviver
    en: Reviver
    zh: 恢复函数
    aliases: [JSON reviver]
    short:
      {
        en: 'A JSON.parse callback that visits parsed properties bottom-up and may replace or delete them.',
        zh: 'JSON.parse 从子级到父级访问解析属性，并可替换或删除属性的回调。',
      }
    topics: [javascript/json]
  - id: replacer
    en: Replacer
    zh: 替换函数
    aliases: [JSON replacer]
    short:
      {
        en: 'A JSON.stringify callback or property list that controls which values enter the JSON output.',
        zh: '控制哪些值进入 JSON 输出的 JSON.stringify 回调或属性列表。',
      }
    topics: [javascript/json]
  - id: safe-integer
    en: Safe integer
    zh: 安全整数
    aliases: [safe JavaScript integer]
    short:
      {
        en: 'An integer that JavaScript Number can represent exactly and compare without rounding ambiguity.',
        zh: 'JavaScript Number 能精确表示，并且比较时没有舍入歧义的整数。',
      }
    topics: [javascript/json]
