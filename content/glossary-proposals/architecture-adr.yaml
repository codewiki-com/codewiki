terms:
  - id: architecture-decision-record
    en: Architecture decision record
    zh: 架构决策记录
    short:
      en: 'A short, versioned record of one significant architecture choice, its context, rationale, and consequences.'
      zh: '对一项重要架构选择及其背景、理由与后果所作的简短、可版本化记录。'

  - id: decision-driver
    en: Decision driver
    zh: 决策驱动因素
    short:
      en: 'A constraint or goal used to distinguish viable options in an architecture decision.'
      zh: '架构决策中用于区分可行选项的约束或目标。'

  - id: decision-log
    en: Decision log
    zh: 决策日志
    short:
      en: 'A versioned collection of decision records whose status and links preserve how design reasoning changed.'
      zh: '由多份决策记录组成的版本化集合，通过状态与链接保留设计推理的变化。'

  - id: supersession
    en: Supersession
    zh: 取代关系
    short:
      en: 'A relation in which a new accepted decision replaces an older one without deleting or rewriting its history.'
      zh: '新接受的决定替代旧决定，同时不删除或重写旧决定历史的关系。'
