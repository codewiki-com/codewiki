terms:
  - id: http2-stream
    en: HTTP/2 stream
    zh: HTTP/2 流
    short:
      en: 'An independent, bidirectional sequence of HTTP/2 frames identified within one connection.'
      zh: '在一条连接中由标识区分的独立双向 HTTP/2 帧序列。'

  - id: http2-frame
    en: HTTP/2 frame
    zh: HTTP/2 帧
    short:
      en: 'The smallest protocol unit in HTTP/2, with a fixed header and a type-specific payload.'
      zh: 'HTTP/2 中最小的协议单元，由固定帧头和特定类型的负载组成。'

  - id: multiplexing
    en: Multiplexing
    zh: 多路复用
    short:
      en: 'Interleaving independent streams over one connection while preserving order within each stream.'
      zh: '在一条连接上交错传输独立的流，同时保持每条流内部的顺序。'

  - id: hpack
    en: HPACK
    zh: HPACK
    short:
      en: 'HTTP/2 field compression using static and connection-scoped dynamic tables.'
      zh: '使用静态表和连接级动态表的 HTTP/2 字段压缩格式。'

  - id: flow-control
    en: Flow control
    zh: 流量控制
    short:
      en: 'Credit-based limits that regulate how much HTTP/2 DATA a peer can send on a stream and connection.'
      zh: '按额度限制对端可在 HTTP/2 流与连接上发送多少 DATA 的机制。'

  - id: head-of-line-blocking
    en: Head-of-line blocking
    zh: 队头阻塞
    short:
      en: 'Delay in which one blocked item prevents independent work queued behind it from advancing.'
      zh: '一个受阻项目使排在其后的独立工作也无法推进的延迟现象。'
