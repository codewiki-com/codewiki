terms:
  - id: zero-value
    en: Zero value
    zh: 零值
    short:
      en: 'The value a Go variable receives when its declaration or allocation supplies no explicit initializer.'
      zh: 'Go 变量在声明或分配时没有显式初始化值，由语言自动提供的值。'

  - id: short-variable-declaration
    en: Short variable declaration
    zh: 短变量声明
    short:
      en: 'A function-local Go declaration using := that infers types and must introduce at least one non-blank name in its block.'
      zh: 'Go 函数内使用 := 并推断类型的声明；它必须在当前代码块引入至少一个非空白名称。'

  - id: untyped-constant
    en: Untyped constant
    zh: 无类型常量
    short:
      en: 'A Go constant with an exact value but no explicit ordinary type until context supplies one or its default type is needed.'
      zh: '具有精确值但尚无普通具体类型的 Go 常量；上下文会提供类型，必要时也可采用默认类型。'

  - id: rune
    en: Rune
    zh: 符文
    short:
      en: 'Go alias for int32, conventionally used for an integer value representing a Unicode code point.'
      zh: 'Go 中 int32 的别名，通常表示一个 Unicode 码点对应的整数值。'
