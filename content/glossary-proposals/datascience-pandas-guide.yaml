terms:
  - id: dataframe
    en: DataFrame
    zh: 数据帧
    short:
      en: 'A two-dimensional labeled table whose columns can have different data types.'
      zh: '一种带行列标签的二维表格，其中各列可以使用不同的数据类型。'

  - id: series
    en: Series
    zh: 序列
    short:
      en: 'A one-dimensional labeled sequence with one data type and an index.'
      zh: '一种带索引且具有单一数据类型的一维值序列。'

  - id: index-alignment
    en: Index alignment
    zh: 索引对齐
    short:
      en: 'The pairing of pandas values by row or column labels before an operation runs.'
      zh: 'pandas 在执行运算前，按行标签或列标签配对值的过程。'

  - id: nullable-dtype
    en: Nullable dtype
    zh: 可空数据类型
    short:
      en: 'A pandas data type that represents missing values without abandoning its domain type.'
      zh: '一种能表示缺失值，同时保留相应领域类型的 pandas 数据类型。'

  - id: groupby
    en: GroupBy
    zh: 分组操作
    short:
      en: 'A split-apply-combine operation that groups rows by keys before aggregation or transformation.'
      zh: '先按键拆分行，再对各组执行聚合或转换并合并结果的操作。'
