terms:
  - id: source-generator
    en: Source generator
    zh: 源生成器
    short:
      en: 'A compiler-loaded component that reads declared build inputs and adds source files or diagnostics to a compilation.'
      zh: '由编译器加载，读取已声明的构建输入，并向编译加入源码文件或诊断信息的组件。'
    topics: [csharp/source-generators]

  - id: incremental-generator
    en: Incremental generator
    zh: 增量生成器
    short:
      en: 'A Roslyn source generator expressed as cached dataflow steps whose unchanged values can stop downstream recomputation.'
      zh: '以可缓存数据流步骤表达的 Roslyn 源生成器，未变化的值可以阻止下游重新计算。'
    topics: [csharp/source-generators]

  - id: syntax-tree
    en: Syntax tree
    zh: 语法树
    short:
      en: 'An immutable tree that represents source structure and retains tokens, trivia, and syntax errors.'
      zh: '表示源码结构并保留标记、附属文本与语法错误的不可变树。'
    topics: [csharp/source-generators]

  - id: semantic-model
    en: Semantic model
    zh: 语义模型
    short:
      en: 'A compilation-bound view that resolves syntax to symbols, types, conversions, and declared meanings.'
      zh: '绑定到一次编译，把语法解析为符号、类型、转换和声明含义的视图。'
    topics: [csharp/source-generators]
