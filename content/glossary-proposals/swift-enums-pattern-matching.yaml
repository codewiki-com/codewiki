terms:
  - id: enumeration
    en: Enumeration
    zh: 枚举
    short:
      en: 'A value type whose instances are exactly one case from a closed set, optionally carrying case-specific data.'
      zh: '一种值类型，其实例只能是封闭集合中的一个 case，并可携带该 case 专属的数据。'

  - id: associated-value
    en: Associated value
    zh: 关联值
    short:
      en: 'Data supplied when an enum case instance is created, with a type and shape chosen by that case.'
      zh: '创建枚举 case 实例时提供的数据，其类型和结构由该 case 决定。'

  - id: raw-value
    en: Raw value
    zh: 原始值
    short:
      en: 'A fixed, unique string, character, integer, or floating-point value declared for an enum case.'
      zh: '在枚举 case 声明中确定的固定且唯一的字符串、字符、整数或浮点值。'

  - id: pattern-matching
    en: Pattern matching
    zh: 模式匹配
    short:
      en: 'Checking a value against a structural pattern and optionally binding the data found inside that structure.'
      zh: '用结构模式检查一个值，并可选择绑定该结构内部的数据。'
