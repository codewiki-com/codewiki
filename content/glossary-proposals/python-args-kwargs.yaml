terms:
  - id: keyword-argument
    en: Keyword argument
    zh: 关键字实参
    aliases: []
    short: { en: 'An argument that selects its destination parameter by name in a function call.', zh: '在函数调用中按名称选择目标形参的实参。' }
    topics: [python/args-kwargs]

  - id: variadic-parameter
    en: Variadic parameter
    zh: 可变形参
    aliases: []
    short: { en: 'A parameter that collects zero or more unmatched positional or keyword arguments.', zh: '收集零个或多个未匹配位置实参或关键字实参的形参。' }
    topics: [python/args-kwargs]

  - id: argument-unpacking
    en: Argument unpacking
    zh: 实参解包
    aliases: []
    short: { en: 'Supplying iterable elements or mapping entries as separate arguments with * or ** at a call site.', zh: '在调用位置用 * 或 ** 把可迭代对象元素或映射条目作为独立实参提供。' }
    topics: [python/args-kwargs]
