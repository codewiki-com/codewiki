terms:
  - id: checked-exception
    en: Checked exception
    zh: 检查型异常
    short:
      en: 'A Throwable type outside the RuntimeException and Error branches that Java requires callers to catch or declare.'
      zh: '位于 RuntimeException 与 Error 分支之外，Java 要求调用方捕获或声明的 Throwable 类型。'

  - id: unchecked-exception
    en: Unchecked exception
    zh: 非检查型异常
    short:
      en: 'A runtime exception or error type that Java does not require a method to catch or declare.'
      zh: 'Java 不要求方法捕获或声明的运行时异常或错误类型。'

  - id: exception-cause
    en: Exception cause
    zh: 异常原因
    short:
      en: 'The lower-level Throwable recorded as the reason another Throwable was created.'
      zh: '作为另一个 Throwable 创建原因而被记录的底层 Throwable。'

  - id: suppressed-exception
    en: Suppressed exception
    zh: 被抑制异常
    short:
      en: 'A secondary Throwable retained while another primary exception continues propagating.'
      zh: '在另一个主异常继续传播时被保留下来的次要 Throwable。'
