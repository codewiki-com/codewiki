terms:
  - id: property-wrapper
    en: Property wrapper
    zh: 属性包装器
    short:
      en: 'A Swift type that supplies reusable storage and access behavior for a wrapped declaration.'
      zh: '为被包装声明提供可复用存储与访问行为的 Swift 类型。'

  - id: wrapped-value
    en: Wrapped value
    zh: 包装值
    short:
      en: 'The value exposed through a wrapped property by the wrapper type’s wrappedValue member.'
      zh: '包装器类型通过 wrappedValue 成员向被包装属性公开的值。'

  - id: projected-value
    en: Projected value
    zh: 投影值
    short:
      en: 'Optional wrapper-defined API exposed through the compiler-synthesized $property name.'
      zh: '包装器选择提供、并通过编译器合成的 $property 名称公开的附加 API。'

  - id: backing-storage
    en: Backing storage
    zh: 后备存储
    short:
      en: 'The private compiler-synthesized _property field that stores a property wrapper instance.'
      zh: '编译器合成的私有 _property 字段，用来保存属性包装器实例。'
