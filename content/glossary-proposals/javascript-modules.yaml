terms:
  - id: module-specifier
    en: Module specifier
    zh: 模块说明符
    aliases: [import specifier]
    short:
      en: 'The string or URL-like value a host resolves to identify the module requested by an import.'
      zh: '宿主为识别导入所请求模块而解析的字符串或类似 URL 的值。'
    topics: [javascript/modules]

  - id: live-binding
    en: Live binding
    zh: 实时绑定
    aliases: [live export binding]
    short:
      en: 'An import connection whose reads reflect later rebinding performed by the exporting module.'
      zh: '一种导入连接，其读取结果会反映导出模块之后执行的重新绑定。'
    topics: [javascript/modules]

  - id: module-namespace-object
    en: Module namespace object
    zh: 模块命名空间对象
    aliases: [module namespace]
    short:
      en: 'An object-like view containing a module export set, with properties that reflect its exported bindings.'
      zh: '包含模块导出集合的类对象视图，其属性会反映对应的导出绑定。'
    topics: [javascript/modules]
