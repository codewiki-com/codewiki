terms:
  - id: translation-unit
    en: Translation unit
    zh: 翻译单元
    short:
      en: 'A C or C++ source file after preprocessing, including the headers and tokens brought into it.'
      zh: 'C 或 C++ 源文件经过预处理后的结果，包括引入的头文件内容和记号。'

  - id: integer-promotion
    en: Integer promotion
    zh: 整数提升
    short:
      en: 'The conversion of a lower-rank integer type to int or unsigned int before many expressions are evaluated.'
      zh: '许多表达式求值前，把较低转换等级的整数类型转换成 int 或 unsigned int 的规则。'
