terms:
  - id: executable-specification
    en: Executable specification
    zh: 可执行规格
    aliases: [executable specifications, executable spec]
    short:
      en: 'A behavior agreement encoded as readable examples or checks that can run against an implementation.'
      zh: '用可读示例或检查编码，并能针对实现运行的行为约定。'
    topics: [ai-era/executable-specifications]

  - id: test-oracle
    en: Test oracle
    zh: 测试预言机
    aliases: [oracle]
    short:
      en: 'A source of expected results or properties that decides whether observed behavior is correct for a test.'
      zh: '提供预期结果或性质，并判断测试观察到的行为是否正确的依据。'
    topics: [ai-era/executable-specifications]

  - id: decision-table
    en: Decision table
    zh: 决策表
    aliases: [decision tables]
    short:
      en: 'A table mapping combinations of conditions to expected actions or outcomes so rules and precedence can be checked.'
      zh: '把条件组合映射到预期动作或结果，以便检查规则和优先级的表格。'
    topics: [ai-era/executable-specifications]
