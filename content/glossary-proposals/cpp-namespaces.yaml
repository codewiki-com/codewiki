terms:
  - id: argument-dependent-lookup
    en: Argument-dependent lookup
    zh: 参数依赖查找
    short:
      en: 'Lookup that adds functions from namespaces and classes associated with an unqualified call argument type.'
      zh: '非限定函数调用中，根据实参类型的关联命名空间和类加入候选函数的查找规则。'

  - id: using-declaration
    en: Using-declaration
    zh: using 声明
    short:
      en: 'A declaration that introduces specified declarations from another scope for name lookup.'
      zh: '把另一个作用域中的指定声明引入当前作用域名称查找的声明。'

  - id: using-directive
    en: Using-directive
    zh: using 指令
    short:
      en: 'A directive that makes unqualified lookup consider names from a nominated namespace.'
      zh: '让非限定名称查找考虑指定命名空间中名称的指令。'

  - id: unnamed-namespace
    en: Unnamed namespace
    zh: 未命名命名空间
    short:
      en: 'A unique namespace within one translation unit whose names have internal linkage.'
      zh: '单个翻译单元内唯一、其中名称具有内部链接的命名空间。'

  - id: inline-namespace
    en: Inline namespace
    zh: 内联命名空间
    short:
      en: 'A namespace whose members are also exposed to lookup through its enclosing namespace.'
      zh: '成员也能通过外层命名空间参与名称查找的命名空间。'
