terms:
  - id: tree
    en: Tree
    zh: 树
    aliases: [rooted tree, tree structure, 有根树, 树形结构]
    short:
      en: 'A connected acyclic graph; a rooted tree gives every non-root node exactly one parent.'
      zh: '连通且无环的图；有根树中的每个非根节点恰好有一个父节点。'
    topics: [foundations/trees-and-graphs]

  - id: graph
    en: Graph
    zh: 图
    aliases: [network, graph structure, 网络, 图结构]
    short:
      en: 'A set of vertices and edges used to model connections, direction, and optional edge weights.'
      zh: '由顶点和边构成的模型，可表达连接、方向和可选的边权重。'
    topics: [foundations/trees-and-graphs]

  - id: adjacency-list
    en: Adjacency list
    zh: 邻接表
    aliases: [adjacency map, neighbors list, 邻接映射, 邻居列表]
    short:
      en: 'A graph representation that stores the outgoing neighbors of each vertex.'
      zh: '一种为每个顶点存储其出边邻居的图表示。'
    topics: [foundations/trees-and-graphs]

  - id: depth-first-search
    en: Depth-first search
    zh: 深度优先搜索
    aliases: [DFS, depth-first traversal, 深搜, 深度优先遍历]
    short:
      en: 'A traversal that follows one branch before returning to explore remaining alternatives.'
      zh: '一种先沿一个分支前进，再返回探索其他选择的遍历策略。'
    topics: [foundations/trees-and-graphs]

  - id: breadth-first-search
    en: Breadth-first search
    zh: 广度优先搜索
    aliases: [BFS, breadth-first traversal, 广搜, 广度优先遍历]
    short:
      en: 'A traversal that visits vertices in increasing edge distance from a chosen start.'
      zh: '一种按顶点与所选起点之间的边数递增访问的遍历策略。'
    topics: [foundations/trees-and-graphs]
