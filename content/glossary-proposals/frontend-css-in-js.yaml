terms:
  - id: css-in-js
    en: CSS-in-JS
    zh: CSS-in-JS
    short:
      en: 'A family of techniques that declare styles in JavaScript or TypeScript and produce CSS rules or class names.'
      zh: '在 JavaScript 或 TypeScript 中声明样式，再生成 CSS 规则或类名的一类技术。'

  - id: style-injection
    en: Style injection
    zh: 样式注入
    short:
      en: 'Adding generated CSS rules to a document stylesheet or to a style collector during server rendering.'
      zh: '把生成的 CSS 规则加入文档样式表，或加入服务端渲染期间的样式收集器。'

  - id: static-extraction
    en: Static extraction
    zh: 静态提取
    short:
      en: 'Producing CSS assets from analyzable source declarations during the build instead of generating those rules in the browser.'
      zh: '在构建期间从可分析的源码声明生成 CSS 资源，而不是在浏览器中生成这些规则。'
