terms:
  - id: content-security-policy
    en: Content Security Policy
    zh: 内容安全策略
    short:
      en: A browser-enforced response policy that restricts resource loading, script execution, framing, form targets, and related behaviors.
      zh: 由浏览器执行的响应策略，用于限制资源加载、脚本执行、页面嵌入、表单目标及相关行为。

  - id: strict-transport-security
    en: HTTP Strict Transport Security
    zh: HTTP 严格传输安全
    short:
      en: A host policy that tells browsers to replace future HTTP connections with HTTPS for a declared lifetime.
      zh: 一项主机策略，要求浏览器在声明的有效期内把后续 HTTP 连接替换为 HTTPS。

  - id: clickjacking
    en: Clickjacking
    zh: 点击劫持
    short:
      en: Deceiving a user into interacting with a concealed or disguised embedded page instead of the interface they perceive.
      zh: 通过隐藏或伪装嵌入页面，诱使用户与其交互，而不是操作用户以为自己看到的界面。

  - id: csp-nonce
    en: CSP nonce
    zh: CSP 随机数
    short:
      en: An unpredictable single-response value that authorizes matching inline script or style elements under a CSP.
      zh: 每次响应使用的不可预测值，用于在 CSP 下授权值相匹配的内联脚本或样式元素。
