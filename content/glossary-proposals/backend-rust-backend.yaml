terms:
  - id: async-runtime
    en: Async runtime
    zh: 异步运行时
    short:
      en: 'An executor plus I/O and timing facilities that polls futures and wakes tasks when asynchronous operations can advance.'
      zh: '轮询 Future，并在异步操作可以推进时唤醒任务的执行器、I/O 与计时设施。'
    topics: [backend/rust-backend]

  - id: request-extractor
    en: Request extractor
    zh: 请求提取器
    short:
      en: 'A typed boundary that constructs a handler argument from an HTTP request or its reusable parts.'
      zh: '从 HTTP 请求或可共享的请求部件构造处理器参数的类型化边界。'
    topics: [backend/rust-backend]

  - id: tower-layer
    en: Tower layer
    zh: Tower 层
    short:
      en: 'A composable wrapper that transforms a Tower service to add cross-cutting request and response behavior.'
      zh: '包装并转换 Tower 服务，以加入横切请求与响应行为的可组合组件。'
    topics: [backend/rust-backend]
