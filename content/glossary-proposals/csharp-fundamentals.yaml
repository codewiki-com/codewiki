terms:
  - id: top-level-statement
    en: Top-level statement
    zh: 顶级语句
    short:
      en: 'An executable C# statement written at file scope for which the compiler generates the application entry point.'
      zh: '直接写在 C# 文件作用域中的可执行语句，编译器会为其生成应用入口点。'

  - id: expression
    en: Expression
    zh: 表达式
    short:
      en: 'A language construct made from values, names, calls, and operators that is evaluated with a type and can produce a value.'
      zh: '由值、名称、调用和运算符组成，求值时具有类型并能产生值的语言构造。'

  - id: statement
    en: Statement
    zh: 语句
    short:
      en: 'A complete unit of execution that declares state, performs an action, controls flow, or transfers control.'
      zh: '用于声明状态、执行动作、控制流程或转移控制权的完整执行单元。'
