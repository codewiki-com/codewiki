terms:
  - id: binding-flags
    en: Binding flags
    zh: 绑定标志
    short:
      en: 'Bitwise options that tell .NET reflection which public, non-public, instance, static, declared, or inherited members to consider.'
      zh: '告诉 .NET 反射应考虑公开、非公开、实例、静态、当前声明或继承成员的一组按位选项。'

  - id: member-info
    en: Member information
    zh: 成员信息
    short:
      en: 'A .NET reflection descriptor for a type member, specialized as metadata objects for methods, constructors, properties, fields, and events.'
      zh: '.NET 反射中的类型成员描述对象，可具体表示方法、构造函数、属性、字段和事件的元数据。'
