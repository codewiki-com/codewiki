terms:
  - id: internationalization
    en: Internationalization
    zh: 国际化
    aliases: [i18n]
    short:
      {
        en: 'Designing software so language, regional formats, and writing direction can change without rewriting business logic.',
        zh: '让语言、区域格式与书写方向可以变化，而不必重写业务逻辑的软件设计过程。',
      }
    topics: [foundations/i18n]

  - id: localization
    en: Localization
    zh: 本地化
    aliases: [l10n]
    short:
      {
        en: 'Adapting and validating messages, formats, and presentation for a particular language, region, or market.',
        zh: '针对特定语言、地区或市场适配并验证消息、格式与呈现的过程。',
      }
    topics: [foundations/i18n]

  - id: locale
    en: Locale
    zh: 区域设置
    aliases: []
    short:
      {
        en: 'A language-and-region convention used to select messages and presentation rules, often represented by a BCP 47 tag.',
        zh: '用于选择消息与展示规则的语言和地区约定，通常以 BCP 47 标签表示。',
      }
    topics: [foundations/i18n]

  - id: plural-category
    en: Plural category
    zh: 复数类别
    aliases: [plural form]
    short:
      {
        en: 'A locale-defined label such as one, few, or other used to select the grammatical message branch for a number.',
        zh: '由区域规则定义的 one、few 或 other 等标签，用于按数字选择语法消息分支。',
      }
    topics: [foundations/i18n]

  - id: pseudo-localization
    en: Pseudo-localization
    zh: 伪本地化
    aliases: [pseudolocalization]
    short:
      {
        en: 'A test transformation that expands and alters source text while preserving placeholders to expose internationalization defects.',
        zh: '在保留占位符的同时扩张并改变源文本，用于暴露国际化缺陷的测试转换。',
      }
    topics: [foundations/i18n]
