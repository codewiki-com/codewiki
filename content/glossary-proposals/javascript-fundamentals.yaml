terms:
  - id: type-coercion
    en: Type coercion
    zh: 类型强制转换
    aliases: [implicit conversion]
    short:
      en: 'Automatic conversion of a value to the type an operation requires.'
      zh: '按照某项操作的要求，自动把值转换成另一种类型。'
    topics: [javascript/fundamentals]

  - id: temporal-dead-zone
    en: Temporal dead zone
    zh: 暂时性死区
    aliases: [TDZ]
    short:
      en: 'The region where a lexical binding exists but cannot be read before its declaration initializes it.'
      zh: '词法绑定已经存在、但在声明完成初始化前不能读取的代码区域。'
    topics: [javascript/fundamentals]

  - id: short-circuiting
    en: Short-circuit evaluation
    zh: 短路求值
    aliases: [short-circuit evaluation]
    short:
      en: 'Evaluation that skips an operand after an earlier operand determines the expression result.'
      zh: '前一个操作数已经决定表达式结果时，跳过后续操作数的求值方式。'
    topics: [javascript/fundamentals]
