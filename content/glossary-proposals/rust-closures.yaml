terms:
  - id: capture-mode
    en: Capture mode
    zh: 捕获方式
    short:
      en: 'How a closure stores an outside place: by shared, unique immutable, or mutable borrow, or by value.'
      zh: '闭包保存外部位置的方式：共享借用、唯一不可变借用、可变借用或按值捕获。'
    topics: [rust/closures]

  - id: closure-call-trait
    en: Closure call trait
    zh: 闭包调用 trait
    short:
      en: 'One of Fn, FnMut, and FnOnce, describing how a closure is received when called and whether repeat calls are supported.'
      zh: 'Fn、FnMut 与 FnOnce 之一，描述调用时如何接收闭包，以及是否支持重复调用。'
    topics: [rust/closures]
