terms:
  - id: garbage-collection
    en: Garbage collection
    zh: 垃圾回收
    aliases: [GC]
    short:
      en: 'Automatic reclamation of storage occupied by objects the runtime determines are no longer reachable.'
      zh: '运行时自动回收已判定为不可达对象所占存储空间的机制。'
    topics: [javascript/memory-management]

  - id: reachability
    en: Reachability
    zh: 可达性
    short:
      en: 'Whether an object can be found by following references from the runtime roots.'
      zh: '能否从运行时根出发沿引用路径找到某个对象。'
    topics: [javascript/memory-management]

  - id: memory-leak
    en: Memory leak
    zh: 内存泄漏
    short:
      en: 'Memory retained by references after the application no longer needs the associated objects.'
      zh: '应用不再需要相关对象后，这些对象仍因引用而被保留的现象。'
    topics: [javascript/memory-management]
