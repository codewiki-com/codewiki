terms:
  - id: exclusive-ownership
    en: Exclusive ownership
    zh: 独占所有权
    aliases: [unique ownership]
    short:
      en: 'An ownership model in which exactly one owner at a time is responsible for an object’s final destruction.'
      zh: '一种所有权模型：同一时刻只有一个所有者负责对象的最终销毁。'
    topics: [cpp/smart-pointers]

  - id: shared-ownership
    en: Shared ownership
    zh: 共享所有权
    aliases: [co-ownership]
    short:
      en: 'An ownership model in which several strong owners keep one object alive until the final owner releases it.'
      zh: '一种所有权模型：多个强所有者共同让对象存活，直到最后一个所有者释放它。'
    topics: [cpp/smart-pointers]
