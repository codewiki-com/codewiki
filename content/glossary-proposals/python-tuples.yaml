terms:
  - id: tuple
    en: Tuple
    zh: 元组
    aliases: []
    short:
      {
        en: 'An ordered Python sequence whose element slots and length cannot change after creation.',
        zh: '一种有顺序的 Python 序列；创建后，其元素槽位与长度不能改变。',
      }
    topics: [python/tuples]

  - id: tuple-packing
    en: Tuple packing
    zh: 元组打包
    aliases: [packing]
    short:
      {
        en: 'The construction of one tuple from a comma-separated expression list.',
        zh: '从逗号分隔的表达式列表构造一个元组的过程。',
      }
    topics: [python/tuples]

  - id: sequence-unpacking
    en: Sequence unpacking
    zh: 序列解包
    aliases: [iterable-unpacking]
    short:
      {
        en: 'Binding values from an iterable to a matching target structure, optionally with one starred target.',
        zh: '把可迭代对象中的值绑定到匹配的目标结构，可包含一个星号目标。',
      }
    topics: [python/tuples]

  - id: named-tuple
    en: Named tuple
    zh: 命名元组
    aliases: [namedtuple]
    short:
      {
        en: 'A tuple subclass whose positional fields also have names for attribute access.',
        zh: '一种元组子类，其位置字段同时具有可供属性访问的名称。',
      }
    topics: [python/tuples]
