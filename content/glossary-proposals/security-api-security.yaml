terms:
  - id: broken-object-level-authorization
    en: Broken Object Level Authorization
    zh: 对象级授权失效
    short:
      en: An API flaw where a caller can act on an object without permission for that specific object and action.
      zh: API 未检查调用方对特定对象与动作的权限，因而允许越权操作对象的缺陷。

  - id: deny-by-default
    en: Deny by default
    zh: 默认拒绝
    short:
      en: An access-control rule that refuses a request unless an explicit allow policy matches it.
      zh: 除非请求明确匹配允许策略，否则一律拒绝的访问控制规则。

  - id: least-privilege
    en: Least privilege
    zh: 最小权限原则
    short:
      en: Granting a principal only the capabilities and data needed for its current task.
      zh: 只向主体授予完成当前任务所需能力与数据的原则。

  - id: rate-limiting
    en: Rate limiting
    zh: 速率限制
    short:
      en: Controlling how much request or work budget an identity may consume during a defined interval.
      zh: 控制某个身份在指定时间段内可以消耗多少请求或工作预算。
