terms:
  - id: value-type
    en: Value type
    zh: 值类型
    short:
      en: 'A type whose variable directly contains its value and whose ordinary assignment copies that value.'
      zh: '变量直接包含值、普通赋值会复制该值的类型。'

  - id: nullable-reference-type
    en: Nullable reference type
    zh: 可空引用类型
    short:
      en: 'A C# reference-type annotation that declares null as an expected value for compiler flow analysis.'
      zh: '在 C# 中声明 null 属于预期值、供编译器进行流分析的引用类型注解。'

  - id: boxing
    en: Boxing
    zh: 装箱
    short:
      en: 'A conversion that represents a value type as object or as an implemented interface, usually by creating an object.'
      zh: '把值类型表示为 object 或其实现接口的转换，通常会创建一个对象。'
