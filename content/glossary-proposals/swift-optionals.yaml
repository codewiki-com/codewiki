terms:
  - id: optional-binding
    en: Optional binding
    zh: 可选绑定
    short:
      en: 'Swift syntax that tests whether an optional contains a value and binds its unwrapped value in one operation.'
      zh: 'Swift 中同时检查可选值是否存在，并把其解包值绑定到名称的语法。'

  - id: optional-chaining
    en: Optional chaining
    zh: 可选链
    short:
      en: 'Conditional member access, method calling, or subscripting that returns nil when an optional receiver is nil.'
      zh: '对可选接收值执行的条件成员访问、方法调用或下标访问；接收值为 nil 时返回 nil。'

  - id: nil-coalescing
    en: Nil coalescing
    zh: 空合并
    short:
      en: 'The Swift ?? operation that unwraps a present optional or lazily evaluates a compatible fallback value.'
      zh: 'Swift 的 ?? 操作：可选值存在时解包，否则惰性计算一个兼容的后备值。'

  - id: force-unwrapping
    en: Force unwrapping
    zh: 强制解包
    short:
      en: 'The postfix Swift ! operation that returns a wrapped value when present and traps when the optional is nil.'
      zh: 'Swift 后缀 ! 操作：值存在时返回包装值，可选值为 nil 时触发运行时错误。'
