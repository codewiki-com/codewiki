terms:
  - id: reverse-mapping
    en: Reverse mapping
    zh: 反向映射
    aliases: []
    short:
      en: 'A runtime mapping from an enum value back to its member name, emitted automatically for numeric TypeScript enums.'
      zh: '从枚举值查回成员名的运行时映射；TypeScript 会为数字枚举自动生成它。'
    topics: [typescript/enums]

  - id: const-enum
    en: Const enum
    zh: 常量枚举
    aliases: []
    short:
      en: 'A TypeScript enum whose constant member accesses can be inlined and whose declaration is removed by default during emit.'
      zh: '一种 TypeScript 枚举；成员访问可被内联，而且默认输出时会移除声明。'
    topics: [typescript/enums]
