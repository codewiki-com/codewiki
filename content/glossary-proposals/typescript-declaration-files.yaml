terms:
  - id: declaration-file
    en: Declaration file
    zh: 声明文件
    short:
      en: 'A type-only file that describes existing JavaScript modules or globals without implementing their runtime values.'
      zh: '一种仅包含类型的文件，用来描述现有 JavaScript 模块或全局名称，不实现对应的运行时值。'

  - id: ambient-declaration
    en: Ambient declaration
    zh: 环境声明
    short:
      en: 'A declaration telling TypeScript that another runtime source supplies the described variable, function, class, or module.'
      zh: '一种告诉 TypeScript 某个变量、函数、类或模块由其他运行时来源提供的声明。'

  - id: declaration-emit
    en: Declaration emit
    zh: 声明输出
    short:
      en: 'Compiler output that derives public .d.ts signatures from TypeScript or typed JavaScript source.'
      zh: '编译器从 TypeScript 或带类型信息的 JavaScript 源码派生公开 .d.ts 签名的输出过程。'
