terms:
  - id: lifetime
    en: Lifetime
    zh: 生命周期
    short:
      en: 'A program region in which a reference is valid and may be used safely.'
      zh: '引用保持有效并可被安全使用的一段程序区域。'
    topics: [rust/lifetime-annotations]

  - id: lifetime-annotation
    en: Lifetime annotation
    zh: 生命周期标注
    short:
      en: 'Rust syntax that names relationships among the valid regions of references in a type or signature.'
      zh: '在 Rust 类型或签名中命名引用有效区域之间关系的语法。'
    topics: [rust/lifetime-annotations]

  - id: lifetime-elision
    en: Lifetime elision
    zh: 生命周期省略
    short:
      en: 'Deterministic rules that infer omitted lifetime parameters in supported Rust signature positions.'
      zh: '在受支持的 Rust 签名位置推断省略生命周期参数的一组确定规则。'
    topics: [rust/lifetime-annotations]

  - id: outlives-bound
    en: Outlives bound
    zh: 长于约束
    short:
      en: 'A bound such as a: b stating that one lifetime or type remains valid for at least another lifetime.'
      zh: '形如 a: b 的边界，表示一个生命周期或类型至少在另一生命周期内保持有效。'
    topics: [rust/lifetime-annotations]

  - id: higher-ranked-trait-bound
    en: Higher-ranked trait bound
    zh: 高阶 trait 约束
    short:
      en: 'A for-lifetime bound requiring a trait relationship to hold for every suitable lifetime.'
      zh: '使用 for 生命周期量化，要求 trait 关系对每个合适生命周期都成立的边界。'
    topics: [rust/lifetime-annotations]

  - id: static-lifetime
    en: Static lifetime
    zh: 静态生命周期
    short:
      en: 'The lifetime spanning a program’s complete execution, used by references to static storage.'
      zh: '覆盖程序完整执行期的生命周期，用于指向静态存储的引用。'
    topics: [rust/lifetime-annotations]
