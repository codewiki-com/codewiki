terms:
  - id: working-directory
    en: Working directory
    zh: 工作目录
    short:
      en: 'The directory a process uses as the base for relative paths and from which many tools discover project configuration.'
      zh: '进程解析相对路径时使用的基准目录，许多工具也从这里发现项目配置。'

  - id: execution-transcript
    en: Execution transcript
    zh: 执行记录
    short:
      en: 'A structured record of invoked tools, approvals, outputs, exit status, and environmental changes from one automated run.'
      zh: '一次自动运行中工具调用、批准、输出、退出状态和环境变化的结构化记录。'
