terms:
  - id: borrowing
    en: Borrowing
    zh: 借用
    short:
      en: 'Temporary access to a value through a reference without taking ownership of that value.'
      zh: '通过引用临时访问值、但不取得该值所有权的机制。'

  - id: shared-reference
    en: Shared reference
    zh: 共享引用
    short:
      en: 'A reference written &T that permits shared observation without ordinary mutation through that reference.'
      zh: '写作 &T，允许多个访问方共享观察，但不能通过该引用直接修改普通数据。'

  - id: mutable-reference
    en: Mutable reference
    zh: 可变引用
    short:
      en: 'A reference written &mut T that grants exclusive access to read and mutate its referenced region.'
      zh: '写作 &mut T，授予对被引用区域进行读取和修改的独占访问权。'

  - id: borrow-checker
    en: Borrow checker
    zh: 借用检查器
    short:
      en: 'The Rust compiler analysis that verifies reference validity and rejects conflicting accesses.'
      zh: '验证引用有效性并拒绝冲突访问的 Rust 编译器分析机制。'

  - id: non-lexical-lifetimes
    en: Non-lexical lifetimes
    zh: 非词法生命周期
    short:
      en: 'Borrow analysis that derives reference-use regions from control flow instead of only lexical block boundaries.'
      zh: '依据控制流推导引用使用区域，而不只依赖词法代码块边界的借用分析方式。'
