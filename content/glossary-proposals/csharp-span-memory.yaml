terms:
  - id: span
    en: Span
    zh: Span 视图
    aliases: []
    short:
      en: 'A stack-only value type that provides a type-safe view over a contiguous region of memory.'
      zh: '只能安全存在于栈上、为连续内存区域提供类型安全视图的值类型。'
    topics: [csharp/span-memory]

  - id: memory
    en: Memory
    zh: Memory 视图
    aliases: []
    short:
      en: 'A storable value type for a contiguous memory region that yields a Span for synchronous access.'
      zh: '表示连续内存区域的可存储值类型，可生成 Span 供同步访问。'
    topics: [csharp/span-memory]

  - id: ref-struct
    en: ref struct
    zh: ref 结构体
    aliases: []
    short:
      en: 'A value type governed by ref-safety rules so its instances cannot escape a valid stack context.'
      zh: '受引用安全规则约束、实例不能逃出有效栈上下文的值类型。'
    topics: [csharp/span-memory]

  - id: stackalloc
    en: stackalloc
    zh: 栈分配表达式
    aliases: []
    short:
      en: 'A C# expression that allocates a contiguous region of memory in the current stack frame.'
      zh: '在当前栈帧中分配一段连续内存区域的 C# 表达式。'
    topics: [csharp/span-memory]
