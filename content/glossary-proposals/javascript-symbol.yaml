terms:
  - id: javascript-symbol
    en: Symbol
    zh: Symbol
    aliases: [symbol-value]
    short:
      en: 'A JavaScript primitive with unique identity that can also serve as an object property key.'
      zh: '具有唯一标识、也可作为对象属性键的 JavaScript 基本值。'
    topics: [javascript/symbol]

  - id: property-key
    en: Property key
    zh: 属性键
    aliases: []
    short:
      en: 'A string or Symbol that identifies a property in the JavaScript object model.'
      zh: '在 JavaScript 对象模型中标识属性的字符串或 Symbol。'
    topics: [javascript/symbol]

  - id: global-symbol-registry
    en: Global symbol registry
    zh: 全局 Symbol 注册表
    aliases: [symbol-registry]
    short:
      en: 'A runtime registry that maps string keys to shared registered Symbol values.'
      zh: '把字符串键映射到共享注册 Symbol 值的运行时注册表。'
    topics: [javascript/symbol]

  - id: well-known-symbol
    en: Well-known symbol
    zh: 内置 Symbol
    aliases: [well-known-symbols]
    short:
      en: 'A specification-defined Symbol used as a property key for a JavaScript protocol hook.'
      zh: '由规范定义、用作 JavaScript 协议钩子属性键的 Symbol。'
    topics: [javascript/symbol]
