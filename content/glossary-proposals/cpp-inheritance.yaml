terms:
  - id: base-class
    en: Base class
    zh: 基类
    short:
      en: "A class named in another class's base-clause, contributing a base subobject and inherited interface."
      zh: '在另一个类的基类列表中命名，为派生对象提供基类子对象和继承接口的类。'
    topics: [cpp/inheritance]

  - id: virtual-inheritance
    en: Virtual inheritance
    zh: 虚继承
    short:
      en: 'Inheritance that lets multiple paths share one virtual-base subobject in the most-derived object.'
      zh: '让多条继承路径在最派生对象中共享一个虚基类子对象的继承形式。'
    topics: [cpp/inheritance]
