terms:
  - id: tls-handshake
    en: TLS handshake
    zh: TLS 握手
    aliases: [transport-layer-security-handshake, TLS 1.3 handshake, 传输层安全握手]
    short:
      en: 'The negotiation that authenticates peers, agrees parameters, and derives traffic secrets before protected application data flows.'
      zh: '在受保护应用数据传输前认证对端、协商参数并派生流量秘密的过程。'
    topics: [foundations/tls-connections]

  - id: certificate-chain
    en: Certificate chain
    zh: 证书链
    aliases: [certification-path, trust-chain, 认证路径, 信任链]
    short:
      en: 'A leaf certificate plus issuer certificates used to build a validated path to a configured trust anchor.'
      zh: '由叶证书和签发者证书组成，用于构建到已配置信任锚的有效路径。'
    topics: [foundations/tls-connections]

  - id: hostname-verification
    en: Hostname verification
    zh: 主机名校验
    aliases: [service-identity-check, reference-identity-check, 服务身份检查]
    short:
      en: 'Checking that a certificate identity covers the service name the client intended to reach.'
      zh: '检查证书身份是否覆盖客户端原本要访问的服务名称。'
    topics: [foundations/tls-connections]

  - id: key-agreement
    en: Key agreement
    zh: 密钥协商
    aliases: [key-exchange, Diffie-Hellman, 密钥交换]
    short:
      en: 'A process in which peers derive the same secret from private inputs and exchanged public values without sending the secret.'
      zh: '双方通过私有输入和交换的公开值派生相同秘密，而不直接发送该秘密的过程。'
    topics: [foundations/tls-connections]

  - id: forward-secrecy
    en: Forward secrecy
    zh: 前向保密
    aliases: [perfect-forward-secrecy, PFS, 完美前向保密]
    short:
      en: 'The property that later compromise of a long-term key alone does not reveal previously established session keys.'
      zh: '以后只有长期密钥泄露时，仍无法还原此前已经建立的会话密钥这一属性。'
    topics: [foundations/tls-connections]
