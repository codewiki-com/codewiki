terms:
  - id: codable
    en: Codable
    zh: Codable
    short:
      en: 'The Swift type alias combining Encodable and Decodable for conversion to and from external representations.'
      zh: 'Swift 中组合 Encodable 与 Decodable 的类型别名，用于在值与外部表示之间双向转换。'

  - id: coding-key
    en: Coding key
    zh: 编码键
    short:
      en: 'A typed key that identifies a field inside a keyed encoding or decoding container.'
      zh: '在键控编码或解码容器中标识字段的带类型键。'

  - id: coding-container
    en: Coding container
    zh: 编码容器
    short:
      en: 'A keyed, unkeyed, or single-value interface through which a Codable implementation reads or writes representation data.'
      zh: 'Codable 实现用来读写表示数据的键控、无键或单值接口。'

  - id: decoding-error
    en: Decoding error
    zh: 解码错误
    short:
      en: 'A structured Swift error for a missing key, absent value, type mismatch, or corrupt representation during decoding.'
      zh: 'Swift 在解码时用来表示缺失键、缺失值、类型不匹配或表示损坏的结构化错误。'
