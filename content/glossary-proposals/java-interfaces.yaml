terms:
  - id: default-method
    en: Default method
    zh: 默认方法
    aliases: [interface default method]
    short:
      en: 'A non-static interface method with a body that implementing classes inherit unless a more specific method overrides it.'
      zh: '接口中带有方法体的非静态方法；实现类会继承它，除非有更具体的方法覆盖该实现。'
    topics: [java/interfaces]

  - id: functional-interface
    en: Functional interface
    zh: 函数式接口
    aliases: [SAM interface, single abstract method interface]
    short:
      en: 'A Java interface whose abstract method set defines one function descriptor, allowing lambdas and method references as instances.'
      zh: '抽象方法集合只定义一个函数描述符的 Java 接口，可由 Lambda 表达式或方法引用创建实例。'
    topics: [java/interfaces]
