terms:
  - id: invariance
    en: Invariance
    zh: 不变性
    aliases: [invariant generic]
    short:
      en: 'A variance rule that does not carry a subtype relation through a generic type constructor.'
      zh: '不会把已有子类型关系自动传递到泛型类型构造器上的型变规则。'
    topics: [java/wildcards-pecs]

  - id: contravariance
    en: Contravariance
    zh: 逆变
    aliases: []
    short:
      en: 'A variance relation that reverses subtype direction, commonly used for values consumed by an API.'
      zh: '反转子类型方向的型变关系，常用于描述由 API 消费的值。'
    topics: [java/wildcards-pecs]

  - id: wildcard-capture
    en: Wildcard capture
    zh: 通配符捕获
    aliases: [capture conversion]
    short:
      en: 'The compiler operation that gives one wildcard expression a fresh internal type for type checking.'
      zh: '编译器为一个通配符表达式引入新内部类型，以便执行类型检查的操作。'
    topics: [java/wildcards-pecs]
