terms:
  - id: parameter
    en: Parameter
    zh: 形参
    short:
      en: 'A named input slot declared by a function definition and bound during a call.'
      zh: '函数定义中声明的具名输入槽，在调用时与实参绑定。'

  - id: argument
    en: Argument
    zh: 实参
    short:
      en: 'A value or expression supplied at a call site for binding to a function parameter.'
      zh: '在调用位置提供、用于绑定到函数形参的值或表达式。'

  - id: function-signature
    en: Function signature
    zh: 函数签名
    short:
      en: 'The callable interface describing parameter names, kinds, defaults, and annotations.'
      zh: '描述形参名称、种类、默认值与注解的可调用接口。'

  - id: first-class-function
    en: First-class function
    zh: 一等函数
    short:
      en: 'A function treated as a value that can be stored, passed as an argument, and returned.'
      zh: '可作为值存储、作为实参传递并作为结果返回的函数。'

  - id: mutable-default-argument
    en: Mutable default argument
    zh: 可变默认实参
    short:
      en: 'A mutable object created as a parameter default and reused by calls that omit that argument.'
      zh: '作为形参默认值创建，并由省略该实参的多次调用复用的可变对象。'
