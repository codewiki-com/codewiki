terms:
  - id: virtual-memory
    en: 'Virtual memory'
    zh: '虚拟内存'
    aliases: [VM]
    short:
      en: 'An address-translation system that gives processes protected virtual spaces backed on demand by RAM, files, or swap.'
      zh: '一种地址转换系统，为进程提供受保护的虚拟空间，并按需由 RAM、文件或交换空间提供后备。'
    topics: [foundations/virtual-memory]
  - id: page-fault
    en: 'Page fault'
    zh: '缺页'
    aliases: ['memory fault']
    short:
      en: 'An exception raised when a virtual-page access needs kernel handling because translation is absent or disallowed.'
      zh: '虚拟页访问因地址转换缺失或权限不允许而需要内核处理时触发的异常。'
    topics: [foundations/virtual-memory]
  - id: resident-set-size
    en: 'Resident set size'
    zh: '驻留集大小'
    aliases: [RSS, 'resident set']
    short:
      en: 'An estimate of a process mapping’s pages currently resident in physical memory, with shared-page accounting caveats.'
      zh: '对进程映射中当前驻留于物理内存的页所作估算，共享页的记账方式需要另行说明。'
    topics: [foundations/virtual-memory]
