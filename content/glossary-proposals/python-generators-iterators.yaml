terms:
  - id: iterator-protocol
    en: Iterator protocol
    zh: 迭代器协议
    aliases: [iteration-protocol]
    short:
      en: 'The Python contract in which iter() obtains an iterator and next() returns items until StopIteration signals exhaustion.'
      zh: 'Python 的逐项读取契约：iter() 取得迭代器，next() 持续返回数据项，直至 StopIteration 表示耗尽。'
    topics: [python/generators-iterators]

  - id: lazy-evaluation
    en: Lazy evaluation
    zh: 惰性求值
    aliases: [deferred-evaluation]
    short:
      en: 'Evaluation delayed until a consumer requests the result, rather than completed when the producer is created.'
      zh: '把计算延后到消费者请求结果时执行，而不是在创建生产者时完成。'
    topics: [python/generators-iterators]

  - id: generator-expression
    en: Generator expression
    zh: 生成器表达式
    aliases: []
    short:
      en: 'A comprehension-like expression in parentheses that creates a lazy, single-pass generator.'
      zh: '一种写在圆括号中的推导式形式，用于创建惰性的单遍生成器。'
    topics: [python/generators-iterators]
