terms:
  - id: rust-module
    en: Rust module
    zh: Rust 模块
    short:
      en: 'A named container of items inside one crate that participates in Rust path resolution and visibility checking.'
      zh: '一个 crate 内的具名 item 容器，参与 Rust 路径解析与可见性检查。'

  - id: crate
    en: Crate
    zh: crate
    short:
      en: 'One Rust compilation unit that produces a library or executable and owns an independent module tree.'
      zh: 'Rust 的一次编译单元，生成库或可执行程序，并拥有独立的模块树。'

  - id: cargo-package
    en: Cargo package
    zh: Cargo package
    short:
      en: 'A bundle described by one Cargo.toml that contains at least one crate and may define several build targets.'
      zh: '由一份 Cargo.toml 描述的交付单元，至少包含一个 crate，并可定义多个构建目标。'

  - id: crate-root
    en: Crate root
    zh: crate 根
    short:
      en: 'The source file where rustc starts a crate and which forms the root module of that crate’s module tree.'
      zh: 'rustc 开始处理一个 crate 的源文件，同时也是该 crate 模块树的根模块。'

  - id: re-export
    en: Re-export
    zh: 重导出
    short:
      en: 'A public use binding that gives an existing item another externally reachable API path without copying it.'
      zh: '通过公开 use 绑定，为已有 item 提供另一条外部可达 API 路径，而不复制其定义。'
