terms:
  - id: reference-identity
    en: Reference identity
    zh: 引用恒等性
    short:
      en: 'The property that two references point to the same class instance, tested in Swift with === or !==.'
      zh: '两个引用指向同一个类实例的关系；Swift 使用 === 或 !== 检查。'

  - id: memberwise-initializer
    en: Memberwise initializer
    zh: 成员初始化器
    short:
      en: 'An initializer Swift can synthesize for a structure with parameters corresponding to its stored properties.'
      zh: 'Swift 可为结构体合成的初始化器，其参数与结构体的存储属性对应。'
