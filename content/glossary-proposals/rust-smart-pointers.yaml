terms:
  - id: deref-coercion
    en: Deref coercion
    zh: 解引用强制转换
    aliases: []
    short:
      en: 'An implicit conversion from a reference to a wrapper into a reference to its Deref target.'
      zh: '把包装器引用隐式转换成其 Deref 目标引用的机制。'
    topics: [rust/smart-pointers]
  - id: drop-trait
    en: Drop trait
    zh: Drop trait
    aliases: []
    short:
      en: 'The Rust trait whose method runs when a value enters destruction.'
      zh: '值进入析构流程时执行其方法的 Rust trait。'
    topics: [rust/smart-pointers]
