terms:
  - id: css-preprocessor
    en: CSS preprocessor
    zh: CSS 预处理器
    aliases: []
    short:
      en: 'A build-time language and compiler that produces CSS from source with additional syntax or evaluation features.'
      zh: '在构建时把带有额外语法或求值能力的源文件转换为 CSS 的语言与编译器。'
    topics: [frontend/sass]

  - id: sass-module
    en: Sass module
    zh: Sass 模块
    aliases: []
    short:
      en: 'A Sass stylesheet loaded once through @use, with public variables, functions, mixins, and emitted CSS.'
      zh: '通过 @use 加载一次，包含公开变量、函数、混入及输出 CSS 的 Sass 样式表。'
    topics: [frontend/sass]

  - id: mixin
    en: Mixin
    zh: 混入
    aliases: []
    short:
      en: 'A named Sass block that accepts arguments and emits declarations or rules at an @include call site.'
      zh: '可接收参数，并在 @include 调用位置输出声明或规则的具名 Sass 代码块。'
    topics: [frontend/sass]

  - id: css-custom-property
    en: CSS custom property
    zh: CSS 自定义属性
    aliases: [CSS variable]
    short:
      en: 'A --prefixed CSS property whose value participates in the cascade and can be referenced with var().'
      zh: '以 -- 开头、值参与层叠，并可通过 var() 引用的 CSS 属性。'
    topics: [frontend/sass]
