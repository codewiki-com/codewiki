terms:
  - id: delegate
    en: Delegate
    zh: 委托
    short:
      en: 'A typed callable object that refers to one or more compatible methods.'
      zh: '引用一个或多个兼容方法、可以调用的类型化对象。'

  - id: method-group
    en: Method group
    zh: 方法组
    short:
      en: 'One or more methods selected by name and converted using a target delegate signature.'
      zh: '按名称选中的一个或多个方法，由目标委托签名决定如何转换。'

  - id: invocation-list
    en: Invocation list
    zh: 调用列表
    short:
      en: 'The ordered sequence of method targets called by a multicast delegate.'
      zh: '多播委托按顺序调用的方法目标序列。'
