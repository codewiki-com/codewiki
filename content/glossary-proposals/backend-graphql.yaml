terms:
  - id: graphql-schema
    en: GraphQL schema
    zh: GraphQL 模式
    short:
      en: 'The type definitions, directives, and root operations that describe a GraphQL service’s available capabilities.'
      zh: '描述 GraphQL 服务可用能力的类型定义、指令与根操作集合。'

  - id: selection-set
    en: Selection set
    zh: 选择集
    short:
      en: 'The fields and nested fields an operation or fragment asks a GraphQL service to include in a result.'
      zh: '操作或片段要求 GraphQL 服务纳入结果的字段与嵌套字段集合。'

  - id: resolver
    en: Resolver
    zh: 解析函数
    short:
      en: 'A function that supplies the value of a GraphQL field from its parent, arguments, request context, and data sources.'
      zh: '根据父值、参数、请求上下文与数据源提供 GraphQL 字段值的函数。'

  - id: null-bubbling
    en: Null bubbling
    zh: 空值传播
    short:
      en: 'Propagation that nulls the nearest nullable parent when a GraphQL Non-Null field fails to produce a value.'
      zh: 'GraphQL 非空字段无法产生值时，把最近的可空父级设为 null 的传播规则。'

  - id: data-loader
    en: Data loader
    zh: 数据加载器
    short:
      en: 'A request-scoped utility that batches keyed reads and memoizes repeated keys during one operation.'
      zh: '在一次操作内合并键读取并记忆重复键的请求级工具。'
