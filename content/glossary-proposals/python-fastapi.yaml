terms:
  - id: fastapi
    en: FastAPI
    zh: FastAPI
    short:
      en: 'A Python ASGI framework that derives API validation, dependencies, and OpenAPI descriptions from typed declarations.'
      zh: '从带类型的声明生成 API 验证、依赖关系和 OpenAPI 描述的 Python ASGI 框架。'

  - id: asgi
    en: ASGI
    zh: 异步服务器网关接口
    short:
      en: 'A Python interface between asynchronous-capable web servers and applications, expressed as event messages.'
      zh: '以事件消息连接支持异步的 Python Web 服务器与应用的接口。'

  - id: dependency-injection
    en: Dependency injection
    zh: 依赖注入
    short:
      en: 'A mechanism that resolves and supplies values a component declares it needs instead of constructing them inline.'
      zh: '解析并提供组件声明所需的值，而不是让组件在内部自行构造这些值的机制。'

  - id: openapi
    en: OpenAPI
    zh: OpenAPI
    short:
      en: 'A machine-readable specification for HTTP API operations, parameters, request bodies, responses, and security schemes.'
      zh: '描述 HTTP API 操作、参数、请求体、响应和安全方案的机器可读规范。'

  - id: response-model
    en: Response model
    zh: 响应模型
    short:
      en: 'A declared public shape used to validate, serialize, document, and filter an API response.'
      zh: '用于验证、序列化、记录并过滤 API 响应的已声明公开结构。'
