terms:
  - id: higher-order-function
    en: Higher-order function
    zh: 高阶函数
    aliases: [higher-order functions]
    short:
      en: 'A function that accepts another function, returns one, or does both.'
      zh: '接收其他函数、返回函数，或同时完成这两种操作的函数。'
    topics: [python/functools]

  - id: partial-application
    en: Partial application
    zh: 偏应用
    aliases: [partially applied function]
    short:
      en: 'Creating a callable by binding some arguments of another callable in advance.'
      zh: '预先绑定另一个可调用对象的部分实参，从而创建新可调用对象的过程。'
    topics: [python/functools]
