terms:
  - id: type-annotation
    en: Type annotation
    zh: 类型注解
    short:
      en: 'Explicit type syntax attached to a declaration, parameter, property, or return value for static checking.'
      zh: '附在声明、参数、属性或返回值上的显式类型语法，供编译器进行静态检查。'

  - id: control-flow-narrowing
    en: Control-flow narrowing
    zh: 控制流收窄
    short:
      en: 'The compiler refining a variable type along reachable paths after checks, assignments, and termination.'
      zh: '编译器根据检查、赋值和控制流终止，在可达路径中把变量类型缩小到更具体的范围。'

  - id: structural-typing
    en: Structural typing
    zh: 结构类型
    short:
      en: 'Compatibility based primarily on the members a value has rather than an explicitly declared type identity.'
      zh: '主要根据值拥有的成员判断兼容性，而不是依赖显式声明的类型身份。'

  - id: type-erasure
    en: Type erasure
    zh: 类型擦除
    short:
      en: 'Removal of type-only syntax during emission so it has no direct representation in the runtime JavaScript.'
      zh: '输出代码时移除仅用于类型检查的语法，使其在运行时 JavaScript 中没有直接表示。'

  - id: type-assertion
    en: Type assertion
    zh: 类型断言
    short:
      en: 'A developer-supplied instruction about a value type that changes static checking without validating or converting the value.'
      zh: '开发者提供的值类型指令，只改变静态检查，不会验证或转换运行时值。'
