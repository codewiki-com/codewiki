terms:
  - id: property-pattern
    en: Property pattern
    zh: 属性模式
    short:
      en: 'A C# pattern that matches readable fields or properties against nested patterns and fails when the required receiver path is null.'
      zh: '把可读字段或属性交给嵌套模式检查，并在所需接收者路径为空时匹配失败的 C# 模式。'

  - id: list-pattern
    en: List pattern
    zh: 列表模式
    short:
      en: 'A C# pattern that tests the length and indexed elements of a countable, indexable input, optionally with one slice.'
      zh: '检查可计数、可索引输入的长度与指定位置元素，并可包含一个切片的 C# 模式。'

  - id: case-guard
    en: Case guard
    zh: 分支守卫
    short:
      en: 'A Boolean condition after when that must be true in addition to an already matching switch pattern.'
      zh: '写在 when 之后的布尔条件；switch 模式已经匹配且该条件为真时，分支才会选中。'
