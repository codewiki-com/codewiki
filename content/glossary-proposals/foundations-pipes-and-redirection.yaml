terms:
  - id: standard-stream
    en: Standard stream
    zh: 标准流
    aliases: [standard streams]
    short:
      en: 'A conventional process input or output channel: standard input, standard output, or standard error.'
      zh: '进程约定的输入或输出通道，包括标准输入、标准输出与标准错误。'
    topics: [foundations/pipes-and-redirection]

  - id: pipeline
    en: Pipeline
    zh: 管道
    aliases: [command pipeline]
    short:
      en: 'A set of commands whose streams are connected so bytes produced by one stage become input to another.'
      zh: '一组通过标准流连接的命令，前一阶段产生的字节会成为后一阶段的输入。'
    topics: [foundations/pipes-and-redirection]

  - id: redirection
    en: I/O redirection
    zh: 输入输出重定向
    aliases: [shell redirection]
    short:
      en: 'A shell operation that changes which file or descriptor supplies or receives a command stream.'
      zh: '改变命令流由哪个文件或描述符提供或接收的 Shell 操作。'
    topics: [foundations/pipes-and-redirection]

  - id: exit-status
    en: Exit status
    zh: 退出状态
    aliases: [return status, exit code]
    short:
      en: 'A small integer returned when a command finishes, conventionally zero for success and nonzero for another outcome.'
      zh: '命令结束时返回的小整数，通常以零表示成功，非零表示其他结果。'
    topics: [foundations/pipes-and-redirection]
