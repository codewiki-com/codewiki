terms:
  - id: property
    en: Property
    zh: 属性
    short:
      en: 'A member that exposes read or assignment behavior through field-like syntax and one or more accessors.'
      zh: '通过字段式语法与一个或多个访问器公开读取或赋值行为的成员。'

  - id: property-accessor
    en: Property accessor
    zh: 属性访问器
    short:
      en: 'A get, set, or init body that implements one permitted operation on a C# property.'
      zh: '实现 C# 属性某一种允许操作的 get、set 或 init 主体。'

  - id: init-accessor
    en: Init accessor
    zh: init 访问器
    short:
      en: 'A C# property accessor that permits assignment during object construction but rejects later ordinary assignment.'
      zh: '允许在对象构造阶段赋值、之后拒绝普通赋值的 C# 属性访问器。'

  - id: required-member
    en: Required member
    zh: 必需成员
    short:
      en: 'A C# field or property that ordinary object-creation expressions must initialize.'
      zh: '普通对象创建表达式必须初始化的 C# 字段或属性。'
