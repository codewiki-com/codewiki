terms:
  - id: multicast-delegate
    en: Multicast delegate
    zh: 多播委托
    short:
      en: 'A delegate whose ordered invocation list can contain one or more handlers.'
      zh: '调用列表按顺序保存一个或多个处理器的委托。'

  - id: event-handler
    en: Event handler
    zh: 事件处理器
    short:
      en: 'A delegate instance registered to run when a publisher raises a particular event.'
      zh: '注册到特定事件、在发布者触发该事件时运行的委托实例。'

  - id: event-accessor
    en: Event accessor
    zh: 事件访问器
    short:
      en: 'An add or remove operation that controls how an event stores and releases handlers.'
      zh: '控制事件如何保存和移除处理器的 add 或 remove 操作。'
