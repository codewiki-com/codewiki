terms:
  - id: generator
    en: Generator
    zh: 生成器
    short:
      en: 'An iterator whose function body can suspend at yield and resume through next, return, or throw.'
      zh: '一种迭代器，其函数体可在 yield 处暂停，并通过 next、return 或 throw 恢复。'
    topics: [javascript/iterators-generators]
  - id: iterator-closing
    en: Iterator closing
    zh: 迭代器关闭
    short:
      en: 'The protocol that calls an unfinished iterator return method when a consumer exits early.'
      zh: '消费方提前退出时调用未完成迭代器 return 方法的协议流程。'
    topics: [javascript/iterators-generators]
