terms:
  - id: conditional-type
    en: Conditional type
    zh: 条件类型
    short:
      en: 'A type expression that selects one result or another by testing assignability with T extends U.'
      zh: '通过 T extends U 测试可赋值关系，并在两个结果中选择其一的类型表达式。'

  - id: distributive-conditional-type
    en: Distributive conditional type
    zh: 分布式条件类型
    short:
      en: 'A conditional over a naked type parameter that evaluates separately for each member of a union.'
      zh: '受检查位置为裸类型参数，并对联合中的每个成员分别计算的条件类型。'

  - id: mapped-type
    en: Mapped type
    zh: 映射类型
    short:
      en: 'An object type constructed by iterating over a union of property keys and computing each property.'
      zh: '遍历属性键联合，并为每个键计算相应属性而构造出的对象类型。'

  - id: template-literal-type
    en: Template literal type
    zh: 模板字面量类型
    short:
      en: 'A type that combines string literal types through template interpolation to produce new string literals.'
      zh: '通过模板插值组合字符串字面量类型，从而产生新字符串字面量的类型。'

  - id: indexed-access-type
    en: Indexed access type
    zh: 索引访问类型
    short:
      en: 'A type expression T[K] that retrieves the property value type associated with key K in type T.'
      zh: '写作 T[K]，用于取得类型 T 中与键 K 对应的属性值类型。'
