terms:
  - id: responsive-web-design
    en: Responsive web design
    zh: 响应式网页设计
    aliases: [RWD, responsive design]
    short: { en: 'An approach that adapts one web document to available space, user preferences, and input capabilities.', zh: '让同一份 Web 文档适应可用空间、用户偏好与输入能力的方法。' }
    topics: [frontend/responsive-design]

  - id: media-query
    en: Media query
    zh: 媒体查询
    aliases: [media queries]
    short: { en: 'A conditional CSS rule selected from media type, viewport, display, input, or user-preference features.', zh: '根据媒体类型、视口、显示、输入或用户偏好特性选择 CSS 规则的条件。' }
    topics: [frontend/responsive-design]

  - id: breakpoint
    en: Breakpoint
    zh: 断点
    aliases: [responsive breakpoint]
    short: { en: 'A condition boundary where a layout changes mode because its content constraints change.', zh: '内容约束发生变化，因而让布局切换模式的条件边界。' }
    topics: [frontend/responsive-design]

  - id: container-query
    en: Container query
    zh: 容器查询
    aliases: [container queries]
    short: { en: 'A CSS condition evaluated against an eligible ancestor query container instead of the viewport.', zh: '针对符合条件的祖先查询容器而非视口求值的 CSS 条件。' }
    topics: [frontend/responsive-design]
