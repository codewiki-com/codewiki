terms:
  - id: throwing-function
    en: Throwing function
    zh: 可抛出函数
    aliases: []
    short:
      en: 'A function whose signature permits it to transfer control to its caller by throwing an error instead of returning normally.'
      zh: '签名允许通过抛出错误把控制权交给调用方，而不是正常返回的函数。'
    topics: [swift/error-handling]

  - id: error-propagation
    en: Error propagation
    zh: 错误传播
    aliases: []
    short:
      en: 'Passing a thrown error outward through calling scopes until code catches and handles it.'
      zh: '让抛出的错误沿调用作用域向外传递，直到某处代码捕获并处理它。'
    topics: [swift/error-handling]

  - id: typed-throws
    en: Typed throws
    zh: 类型化 throws
    aliases: []
    short:
      en: 'Swift syntax that declares one concrete error type a function or closure is allowed to throw.'
      zh: '在 Swift 中声明函数或闭包只允许抛出一种具体错误类型的语法。'
    topics: [swift/error-handling]

  - id: result-type
    en: Result type
    zh: 结果类型
    aliases: []
    short:
      en: 'A type that stores either a successful value or a typed failure value for later inspection.'
      zh: '保存成功值或带类型失败值，供之后检查的一种类型。'
    topics: [swift/error-handling]
