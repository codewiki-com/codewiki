terms:
  - id: quantization
    en: Quantization
    zh: 量化
    short:
      en: 'Representing model data with fewer or lower-precision values to reduce storage and memory, with task-dependent quality trade-offs.'
      zh: '用数量更少或精度更低的值表示模型数据，以减少存储和内存占用，并承担因任务而异的质量取舍。'
  - id: kv-cache
    en: KV cache
    zh: 键值缓存
    short:
      en: 'Runtime attention keys and values retained from prior tokens so decoding can reuse them instead of recomputing the full prefix.'
      zh: '运行时保留先前词元的注意力键和值，让解码能够复用它们，无需重新计算完整前缀。'
  - id: gguf
    en: GGUF
    zh: GGUF
    short:
      en: 'A model file format that stores tensors and standardized metadata for loading by executors such as llama.cpp.'
      zh: '保存张量与标准化元数据的模型文件格式，可由 llama.cpp 等运行器加载。'
