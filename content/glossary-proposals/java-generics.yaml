terms:
  - id: wildcard
    en: Wildcard
    zh: 通配符
    aliases: [generic-wildcard]
    short:
      en: 'A `?` type argument denoting an unknown type, optionally constrained by an upper or lower bound.'
      zh: '用 `?` 表示未知类型的类型实参，可以带上界或下界约束。'
    topics: [java/generics]

  - id: raw-type
    en: Raw type
    zh: 原始类型
    aliases: []
    short:
      en: 'A generic Java class or interface name used without type arguments, bypassing some generic checks.'
      zh: '不带类型实参使用的 Java 泛型类或接口名称，会绕过部分泛型检查。'
    topics: [java/generics]

  - id: reifiable-type
    en: Reifiable type
    zh: 可具体化类型
    aliases: []
    short:
      en: 'A Java type with enough runtime representation for operations such as `instanceof` and array creation.'
      zh: '运行时表示足够完整，可用于 `instanceof` 和数组创建等操作的 Java 类型。'
    topics: [java/generics]

  - id: heap-pollution
    en: Heap pollution
    zh: 堆污染
    aliases: []
    short:
      en: 'A state where a parameterized variable refers to an object that violates its declared element type.'
      zh: '参数化类型变量引用了不符合其声明元素类型的对象这一状态。'
    topics: [java/generics]
