terms:
  - id: expression-tree
    en: Expression tree
    zh: 表达式树
    short:
      en: 'An immutable runtime object graph that represents typed code structure for inspection, rewriting, translation, or compilation.'
      zh: '以不可变运行时对象图表示有类型代码结构，可供检查、改写、翻译或编译。'

  - id: parameter-expression
    en: Parameter expression
    zh: 参数表达式
    short:
      en: 'An expression-tree node whose object identity binds uses of one parameter or local variable.'
      zh: '表达式树中表示一个参数或局部变量的节点，其对象标识决定绑定关系。'

  - id: expression-visitor
    en: Expression visitor
    zh: 表达式访问器
    short:
      en: 'A traversal object that examines expression nodes and can return a rewritten tree.'
      zh: '遍历表达式节点并可返回改写后树结构的对象。'

  - id: query-provider
    en: Query provider
    zh: 查询提供程序
    short:
      en: 'A component that creates or executes queries described by IQueryable expression trees.'
      zh: '根据 IQueryable 表达式树描述创建或执行查询的组件。'
