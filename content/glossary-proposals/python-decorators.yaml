terms:
  - id: decorator
    en: Decorator
    zh: 装饰器
    aliases: []
    short:
      en: 'A callable applied at definition time whose return value replaces the original function or class binding.'
      zh: '在定义时接收函数或类，并用返回值替换原名称绑定的可调用对象。'
    topics: [python/decorators]

  - id: decorator-factory
    en: Decorator factory
    zh: 装饰器工厂
    aliases: []
    short:
      en: 'A callable that accepts decorator configuration and returns the decorator that will receive a function or class.'
      zh: '接收装饰器配置，并返回一个用于接收函数或类的装饰器的可调用对象。'
    topics: [python/decorators]
