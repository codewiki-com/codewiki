terms:
  - id: refutable-pattern
    en: Refutable pattern
    zh: 可反驳模式
    aliases: []
    short:
      {
        en: 'A pattern that can fail for some values of its input type and therefore needs an explicit failure path.',
        zh: '可能无法匹配输入类型某些值的模式，因此需要明确的失败路径。',
      }
    topics: [rust/pattern-matching]

  - id: match-ergonomics
    en: Match ergonomics
    zh: 匹配人体工程学
    aliases: []
    short:
      {
        en: 'Rust rules that auto-dereference reference subjects and adjust pattern binding modes during matching.',
        zh: 'Rust 在匹配时自动解引用引用值，并调整模式绑定方式的一组规则。',
      }
    topics: [rust/pattern-matching]
