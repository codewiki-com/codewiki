terms:
  - id: data-visualization
    en: Data visualization
    zh: 数据可视化
    short:
      en: 'The mapping of data records and fields into graphical marks and visual properties for analysis or communication.'
      zh: '把数据记录与字段映射为图形标记和视觉属性，用于分析或沟通。'

  - id: visual-encoding
    en: Visual encoding
    zh: 视觉编码
    short:
      en: 'A rule that maps a data field to a visual property such as position, length, color, shape, or opacity.'
      zh: '把数据字段映射到位置、长度、颜色、形状或透明度等视觉属性的规则。'

  - id: visual-channel
    en: Visual channel
    zh: 视觉通道
    short:
      en: 'A perceptible graphical property used to carry data, such as position, size, hue, shape, or opacity.'
      zh: '用于承载数据的可感知图形属性，例如位置、大小、色相、形状或透明度。'
