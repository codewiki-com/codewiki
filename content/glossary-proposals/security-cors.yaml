terms:
  - id: cors
    en: Cross-Origin Resource Sharing
    zh: 跨源资源共享
    short:
      en: A browser-enforced HTTP protocol through which a server grants selected origins access to cross-origin responses.
      zh: 服务器借此向选定源开放跨源响应，并由浏览器执行许可检查的一套 HTTP 协议。

  - id: origin
    en: Origin
    zh: 源
    short:
      en: The scheme, host, and port tuple that browsers use as a security boundary for a document or resource.
      zh: 浏览器用作页面或资源安全边界的协议、主机与端口元组。

  - id: same-origin-policy
    en: Same-origin policy
    zh: 同源策略
    short:
      en: A browser security rule that limits how a document or script can interact with resources from another origin.
      zh: 限制文档或脚本与另一个源的资源交互方式的浏览器安全规则。

  - id: preflight-request
    en: Preflight request
    zh: 预检请求
    short:
      en: An automatic OPTIONS request that asks whether a server permits a planned cross-origin method and headers.
      zh: 浏览器自动发送的 OPTIONS 请求，用于询问服务器是否允许计划中的跨源方法与请求头。
