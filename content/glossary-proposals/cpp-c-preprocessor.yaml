terms:
  - id: macro
    en: Macro
    zh: 宏
    aliases: []
    short: { en: 'A named preprocessing replacement that expands to a token sequence, optionally using argument token sequences.', zh: '一种具名的预处理替换，可选择接收实参词元序列，并展开成另一段词元序列。' }
    topics: [cpp/c-preprocessor]
  - id: preprocessing-directive
    en: Preprocessing directive
    zh: 预处理指令
    aliases: []
    short: { en: 'A logical source line introduced by # that controls inclusion, macro definitions, conditionals, or other preprocessing work.', zh: '以 # 引导的逻辑源码行，用于控制包含、宏定义、条件选择或其他预处理工作。' }
    topics: [cpp/c-preprocessor]
  - id: include-guard
    en: Include guard
    zh: 头文件防重复包含
    aliases: [header guard]
    short: { en: 'A conditional macro pattern that prevents one header body from being processed repeatedly within a translation unit.', zh: '一种条件宏模式，用于防止同一头文件正文在一个翻译单元内被重复处理。' }
    topics: [cpp/c-preprocessor]
