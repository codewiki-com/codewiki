terms:
  - id: opaque-type
    en: Opaque type
    zh: 不透明类型
    aliases: [opaque-result-type]
    short:
      en: 'A hidden but fixed concrete type selected by an implementation and exposed through a protocol or other constraints.'
      zh: '由实现方选择、对调用方隐藏但保持固定的具体类型，通过协议或其他约束暴露能力。'
    topics: [swift/protocols-generics]

  - id: existential-type
    en: Existential type
    zh: 存在类型
    aliases: [boxed-protocol-type]
    short:
      en: 'A type-erasing container that can hold a value of any conforming concrete type while exposing the protocol interface.'
      zh: '可保存任意遵循协议的具体值、同时只暴露协议接口的类型擦除容器。'
    topics: [swift/protocols-generics]
