terms:
  - id: class-invariant
    en: Class invariant
    zh: 类不变量
    short:
      en: 'A rule that must hold for every observable state of an object after construction and public operations.'
      zh: '对象完成构造及公开操作后，在每个可观察状态中都必须成立的规则。'

  - id: access-specifier
    en: Access specifier
    zh: 访问说明符
    short:
      en: 'A class label such as public, protected, or private that controls where member names can be used.'
      zh: 'public、protected 或 private 等类标签，用于控制成员名称可在哪些位置使用。'

  - id: member-initializer-list
    en: Member initializer list
    zh: 成员初始化器列表
    short:
      en: 'The part of a constructor that initializes bases and members before the constructor body executes.'
      zh: '构造函数中在函数体执行前初始化基类与成员的部分。'

  - id: special-member-function
    en: Special member function
    zh: 特殊成员函数
    short:
      en: 'One of the constructors, assignment operators, or destructor whose declaration can be governed by special language rules.'
      zh: '声明受专门语言规则控制的构造函数、赋值运算符或析构函数之一。'
