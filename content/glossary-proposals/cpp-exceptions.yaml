terms:
  - id: stack-unwinding
    en: Stack unwinding
    zh: 栈展开
    short:
      en: 'Destroying completed automatic objects as exception handling transfers control outward to a matching handler.'
      zh: '异常处理向外转移控制权并寻找匹配处理器时，销毁已完成构造的自动对象的过程。'

  - id: exception-safety-guarantee
    en: Exception-safety guarantee
    zh: 异常安全保证
    short:
      en: 'A promise about resources, invariants, and observable state when an operation exits by throwing.'
      zh: '操作通过抛出异常退出时，对资源、不变量和可观察状态作出的承诺。'

  - id: object-slicing
    en: Object slicing
    zh: 对象切片
    short:
      en: 'Copying a derived object into a base object and thereby discarding the state and behavior of its derived portion.'
      zh: '把派生对象复制到基类对象中，从而丢弃派生部分状态与行为的现象。'

  - id: raii
    en: Resource Acquisition Is Initialization
    zh: 资源获取即初始化
    short:
      en: 'Binding resource ownership to object lifetime so destruction releases the resource on every scope exit.'
      zh: '把资源所有权绑定到对象生命周期，使每种离开作用域的路径都由析构释放资源。'
