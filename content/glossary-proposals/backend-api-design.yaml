terms:
  - id: resource
    en: Resource
    zh: 资源
    short:
      en: 'A conceptual object or service capability identified by a URI and manipulated through representations.'
      zh: '由 URI 标识，并通过表示进行操作的概念对象或服务能力。'

  - id: representation
    en: Representation
    zh: 表示
    short:
      en: 'A transferable description of a resource state in a selected media type.'
      zh: '以选定媒体类型传输的资源状态描述。'

  - id: idempotency
    en: Idempotency
    zh: 幂等性
    short:
      en: 'The property that repeated identical requests have the same intended server effect as one request.'
      zh: '重复发送相同请求时，服务端预期效果与发送一次相同的性质。'

  - id: problem-details
    en: Problem Details
    zh: 问题详情
    short:
      en: 'The standard HTTP API error document format defined by RFC 9457.'
      zh: 'RFC 9457 定义的标准 HTTP API 错误文档格式。'

  - id: entity-tag
    en: Entity tag
    zh: 实体标签
    short:
      en: 'An opaque validator that distinguishes selected representations of a resource.'
      zh: '用于区分资源不同选定表示的不透明验证器。'
