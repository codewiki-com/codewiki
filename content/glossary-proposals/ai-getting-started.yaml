terms:
  - id: large-language-model
    en: Large language model
    zh: 大语言模型
    aliases: [LLM]
    short:
      en: 'A model trained on language data to predict tokens and generate or transform content from supplied context.'
      zh: '在语言数据上训练，根据给定上下文预测词元并生成或转换内容的模型。'
    topics: [ai/getting-started]

  - id: token
    en: Token
    zh: 词元
    aliases: []
    short:
      en: 'A unit of text or other input produced by a model tokenizer and processed by the model.'
      zh: '由模型分词器从文本或其他输入中产生，并交给模型处理的基本单元。'
    topics: [ai/getting-started]

  - id: context-window
    en: Context window
    zh: 上下文窗口
    aliases: []
    short:
      en: 'The bounded token capacity available to a model for input, conversation state, tool definitions, and generated output.'
      zh: '模型可用于输入、对话状态、工具定义和生成输出的有限词元容量。'
    topics: [ai/getting-started]

  - id: inference
    en: Inference
    zh: 推理
    aliases: []
    short:
      en: 'Running a trained model on supplied input to produce a prediction or generated output.'
      zh: '在给定输入上运行已训练模型，以产生预测或生成结果的过程。'
    topics: [ai/getting-started]

  - id: evaluation-set
    en: Evaluation set
    zh: 评测集
    aliases: [eval set]
    short:
      en: 'A versioned collection of representative cases and criteria used to compare model-application behavior.'
      zh: '用于比较模型应用行为的一组版本化代表案例与评判标准。'
    topics: [ai/getting-started]

  - id: prompt-injection
    en: Prompt injection
    zh: 提示词注入
    aliases: []
    short:
      en: "Untrusted content that attempts to redirect a model away from the application's intended instructions."
      zh: '试图让模型偏离应用预期指令的不可信内容。'
    topics: [ai/getting-started]
