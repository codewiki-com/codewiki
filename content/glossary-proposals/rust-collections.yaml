terms:
  - id: hash-table
    en: Hash table
    zh: 哈希表
    aliases: [hashmap]
    short:
      en: 'An associative structure that uses key hashes and equality to organize lookup, insertion, and removal.'
      zh: '利用键的哈希值与相等关系组织查找、插入和删除的关联式数据结构。'
    topics: [rust/collections]

  - id: b-tree
    en: B-tree
    zh: B 树
    aliases: []
    short:
      en: 'A balanced search tree whose nodes hold multiple ordered keys and children, keeping operations height-bounded.'
      zh: '节点容纳多个有序键和子节点，并通过保持平衡来限制树高的搜索树。'
    topics: [rust/collections]

  - id: entry-api
    en: Entry API
    zh: 条目 API
    aliases: []
    short:
      en: 'A map interface that represents an occupied or vacant key so lookup and conditional update share one state branch.'
      zh: '把键表示为已占用或空缺状态，使查找与条件更新共用一次状态分支的映射接口。'
    topics: [rust/collections]
