terms:
  - id: system-call
    en: System call
    zh: 系统调用
    short:
      {
        en: 'A controlled entry from a user-space process into the kernel to request an operating-system operation.',
        zh: '用户空间进程进入内核并请求操作系统执行操作的受控入口。',
      }
    topics: [foundations/linux]

  - id: file-descriptor
    en: File descriptor
    zh: 文件描述符
    short:
      {
        en: 'A process-local integer handle for an open file, pipe, socket, device, or another kernel-managed object.',
        zh: '进程内用于引用已打开文件、管道、套接字、设备或其他内核对象的整数句柄。',
      }
    topics: [foundations/linux]

  - id: process
    en: Process
    zh: 进程
    short:
      {
        en: 'A running program instance with its own identity, virtual address space, descriptors, and lifecycle state.',
        zh: '具有自身身份、虚拟地址空间、描述符与生命周期状态的程序运行实例。',
      }
    topics: [foundations/linux]

  - id: signal
    en: Signal
    zh: 信号
    short:
      {
        en: 'A kernel-delivered asynchronous notification whose disposition can terminate, stop, ignore, or invoke handling code.',
        zh: '由内核异步传递的通知，可按处置规则终止、停止、忽略或调用处理代码。',
      }
    topics: [foundations/linux]
