terms:
  - id: dynamic-allocation
    en: Dynamic allocation
    zh: 动态内存分配
    aliases: []
    short:
      en: 'Runtime creation of storage whose lifetime ends through an explicit deallocation operation.'
      zh: '在运行时建立存储，并通过显式释放操作结束其生命周期。'
    topics: [cpp/c-memory]

  - id: dangling-pointer
    en: Dangling pointer
    zh: 悬空指针
    aliases: []
    short:
      en: 'A pointer whose referenced object has ended its lifetime, making later use of the saved pointer invalid.'
      zh: '所指对象已经结束生命周期的指针；之后使用保存的指针不再有效。'
    topics: [cpp/c-memory]

  - id: allocation-size-overflow
    en: Allocation-size overflow
    zh: 分配大小溢出
    aliases: []
    short:
      en: 'Integer wraparound while computing allocation bytes, which can produce a block smaller than the intended element range.'
      zh: '计算分配字节数时发生整数回绕，可能得到小于预期元素范围的内存块。'
    topics: [cpp/c-memory]
