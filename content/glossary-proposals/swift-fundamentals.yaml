terms:
  - id: optional-value
    en: Optional value
    zh: 可选值
    aliases: [optional]
    short:
      en: 'A value that either contains one wrapped value of a declared type or represents absence.'
      zh: '要么包含一个声明类型的包装值，要么表示值缺失的一种值。'
    topics: [swift/fundamentals]

  - id: value-semantics
    en: Value semantics
    zh: 值语义
    aliases: []
    short:
      en: 'Semantics in which copying a value creates logically independent state, so later mutation of one copy does not change the other.'
      zh: '复制值会产生逻辑上独立的状态，之后修改一个副本不会改变另一个副本。'
    topics: [swift/fundamentals]
