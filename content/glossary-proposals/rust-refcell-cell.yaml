terms:
  - id: interior-mutability
    en: Interior mutability
    zh: 内部可变性
    aliases: []
    short:
      en: 'A Rust pattern that permits controlled mutation through a shared reference while preserving aliasing rules.'
      zh: '允许通过共享引用受控修改数据，同时维持 Rust 别名规则的模式。'
    topics: [rust/refcell-cell]

  - id: borrow-guard
    en: Borrow guard
    zh: 借用守卫
    aliases: [dynamic borrow guard]
    short:
      en: 'An RAII value that keeps a RefCell shared or exclusive borrow active until the guard is dropped.'
      zh: '一种 RAII 值，在守卫销毁前维持 RefCell 的共享或独占借用。'
    topics: [rust/refcell-cell]

  - id: unsafe-cell
    en: UnsafeCell
    zh: UnsafeCell
    aliases: []
    short:
      en: 'Rust primitive that permits mutation through shared references when unsafe code upholds aliasing and data-race rules.'
      zh: 'Rust 的底层原语；允许通过共享引用修改数据，但 unsafe 代码必须维持别名与数据竞争规则。'
    topics: [rust/refcell-cell]
