terms:
  - id: data-class
    en: Data class
    zh: 数据类
    short:
      en: 'A class whose primary-constructor properties drive compiler-generated value members such as equality, components, and copying.'
      zh: '由主构造函数属性驱动编译器生成相等性、组件函数和复制等值成员的类。'

  - id: structural-equality
    en: Structural equality
    zh: 结构相等性
    short:
      en: 'Equality based on selected content or structure rather than whether two references point to the same object.'
      zh: '根据选定的内容或结构判断相等，而不是判断两个引用是否指向同一对象。'
