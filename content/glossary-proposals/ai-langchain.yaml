terms:
  - id: langchain-expression-language
    en: LangChain Expression Language
    zh: LangChain 表达式语言
    short:
      en: 'LangChain composition syntax that connects runnable components with operators such as the pipe.'
      zh: 'LangChain 用于组合可运行组件的语法，常用管道操作符连接各步骤。'
  - id: runnable
    en: Runnable
    zh: 可运行单元
    short:
      en: 'A LangChain unit with a common interface for invocation, composition, batching, and streaming.'
      zh: '实现统一调用、组合、批处理与流式接口的 LangChain 工作单元。'
  - id: agent-loop
    en: Agent loop
    zh: 智能体循环
    short:
      en: 'The repeated model, tool execution, and state-update cycle that continues until an agent stops.'
      zh: '模型调用、工具执行与状态更新反复进行，直到智能体停止的循环。'
