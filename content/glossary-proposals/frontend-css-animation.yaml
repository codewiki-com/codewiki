terms:
  - id: css-transition
    en: CSS transition
    zh: CSS 过渡
    short:
      en: 'An interpolation generated when a listed CSS property changes between transitionable values.'
      zh: '列出的 CSS 属性在可过渡值之间变化时，由浏览器生成的插值过程。'
  - id: keyframe
    en: Keyframe
    zh: 关键帧
    short:
      en: 'A property-value snapshot at a named percentage within one animation cycle.'
      zh: '在一个动画周期的指定百分比位置定义的属性值快照。'
  - id: timing-function
    en: Timing function
    zh: 缓动函数
    short:
      en: 'A function that maps linear time progress to the progress used for interpolation.'
      zh: '把线性时间进度映射为插值所用进度的函数。'
  - id: reduced-motion
    en: Reduced motion
    zh: 减少动态效果
    short:
      en: 'A user preference requesting that non-essential movement be removed or replaced.'
      zh: '用户要求移除或替换非必要运动效果的偏好。'
