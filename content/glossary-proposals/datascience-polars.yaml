terms:
  - id: lazyframe
    en: LazyFrame
    zh: 惰性数据帧
    short:
      en: 'A deferred Polars query whose transformations form a plan executed by collect or a sink.'
      zh: '一种延迟执行的 Polars 查询，其转换组成查询计划，并由 collect 或 sink 执行。'

  - id: query-plan
    en: Query plan
    zh: 查询计划
    short:
      en: 'A structured description of data operations that an engine can inspect and rewrite before execution.'
      zh: '数据操作的结构化描述，执行引擎可以在运行前检查并改写它。'

  - id: predicate-pushdown
    en: Predicate pushdown
    zh: 谓词下推
    short:
      en: 'An optimization that moves filters toward the data source so irrelevant rows can be skipped earlier.'
      zh: '把过滤条件移近数据源的优化，使无关行可以更早被跳过。'

  - id: projection-pushdown
    en: Projection pushdown
    zh: 投影下推
    short:
      en: 'An optimization that asks a data source for only the columns required by downstream operations.'
      zh: '只向数据源请求下游操作所需列的优化。'
