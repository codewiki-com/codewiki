terms:
  - id: flask
    en: Flask
    zh: Flask
    aliases: []
    short:
      en: 'A lightweight Python WSGI web framework for routing requests to views and producing responses.'
      zh: '一个轻量级 Python WSGI Web 框架，用于把请求路由到视图并生成响应。'
    topics: [backend/flask]

  - id: wsgi
    en: Web Server Gateway Interface
    zh: Web 服务器网关接口
    aliases: [WSGI]
    short:
      en: 'The Python callable protocol between a synchronous web server and a web application.'
      zh: '同步 Web 服务器与 Python Web 应用之间的可调用协议。'
    topics: [backend/flask]

  - id: blueprint
    en: Blueprint
    zh: 蓝图
    aliases: []
    short:
      en: 'A deferred collection of Flask setup operations registered on an application.'
      zh: '一组延迟执行并注册到 Flask 应用上的设置操作。'
    topics: [backend/flask]

  - id: request-context
    en: Request context
    zh: 请求上下文
    aliases: []
    short:
      en: 'The active Flask scope that provides request and session proxies for one request.'
      zh: '为一次请求提供 `request` 与 `session` 代理的有效 Flask 作用域。'
    topics: [backend/flask]

  - id: application-context
    en: Application context
    zh: 应用上下文
    aliases: [app context]
    short:
      en: 'The active Flask scope that provides current_app and g independently of a specific view.'
      zh: '独立于具体视图，为代码提供 `current_app` 与 `g` 的有效 Flask 作用域。'
    topics: [backend/flask]

  - id: application-factory
    en: Application factory
    zh: 应用工厂
    aliases: [app factory]
    short:
      en: 'A function that creates, configures, and returns an application instance.'
      zh: '创建、配置并返回应用实例的函数。'
    topics: [backend/flask]

  - id: context-local
    en: Context local
    zh: 上下文局部对象
    aliases: [context-local proxy]
    short:
      en: 'A proxy that resolves to data associated with the currently active execution context.'
      zh: '解析到当前有效执行上下文所关联数据的代理。'
    topics: [backend/flask]
