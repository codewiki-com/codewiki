terms:
  - id: instant
    en: Instant
    zh: 时间点
    short:
      en: 'A unique point on the time line, independent of how a locale or time zone displays it.'
      zh: '时间线上的唯一位置，不取决于区域设置或时区如何显示它。'

  - id: unix-epoch
    en: Unix epoch
    zh: Unix 纪元
    short:
      en: 'The reference instant 1970-01-01T00:00:00Z from which Unix-style timestamps measure elapsed time.'
      zh: 'Unix 风格时间戳计算经过时间时采用的基准时间点 1970-01-01T00:00:00Z。'

  - id: time-zone
    en: Time zone
    zh: 时区
    short:
      en: 'A set of rules that maps instants to local calendar fields and offsets, often identified by an IANA name.'
      zh: '把时间点映射为本地日历字段与偏移的一组规则，通常用 IANA 名称标识。'

  - id: daylight-saving-time
    en: Daylight saving time
    zh: 夏令时
    short:
      en: 'A seasonal clock adjustment that can create missing or repeated local times and change a zone offset.'
      zh: '按季节调整时钟的制度，可能造成不存在或重复的本地时间，并改变时区偏移。'
