terms:
  - id: type-guard
    en: Type guard
    zh: 类型守卫
    aliases: [type narrowing guard]
    short: { en: 'A runtime condition TypeScript uses to narrow a value along one control-flow path.', zh: 'TypeScript 用来在一条控制流路径上收窄值类型的运行时条件。' }
    topics: [typescript/type-guards]

  - id: type-predicate
    en: Type predicate
    zh: 类型谓词
    aliases: [user-defined type predicate]
    short: { en: 'A parameter is Type return annotation that lets a function communicate narrowing to its caller.', zh: '使用 parameter is Type 返回注解，让函数把收窄结果传达给调用方。' }
    topics: [typescript/type-guards]

  - id: assertion-function
    en: Assertion function
    zh: 断言函数
    aliases: [assertion signature]
    short: { en: 'A function whose asserts return annotation narrows values after the function returns normally.', zh: '使用 asserts 返回注解，并在函数正常返回后收窄值类型的函数。' }
    topics: [typescript/type-guards]
