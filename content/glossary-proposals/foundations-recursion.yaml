terms:
  - id: recursion
    en: 'Recursion'
    zh: '递归'
    aliases: [recursive call, recursive function]
    short:
      en: 'A control technique in which a routine solves a problem by invoking itself on smaller instances.'
      zh: '例程通过调用自身处理规模更小的同类问题的一种控制技术。'
    topics: [foundations/recursion]

  - id: base-case
    en: 'Base case'
    zh: '基本情况'
    aliases: [base cases, recursion base case]
    short:
      en: 'A recursive definition branch that returns an answer without making another recursive call.'
      zh: '递归定义中无需再次递归调用就能返回答案的分支。'
    topics: [foundations/recursion]

  - id: recursive-case
    en: 'Recursive case'
    zh: '递归情况'
    aliases: [recursive step, recursive branch]
    short:
      en: 'A recursive definition branch that reduces the current problem to smaller instances of the same problem.'
      zh: '递归定义中把当前问题缩减为规模更小的同类问题的分支。'
    topics: [foundations/recursion]

  - id: call-stack
    en: 'Call stack'
    zh: '调用栈'
    aliases: [runtime stack, call stacks]
    short:
      en: 'The last-in, first-out runtime structure that tracks active function calls and where each caller resumes.'
      zh: '按后进先出顺序记录活动函数调用及各调用方恢复位置的运行时结构。'
    topics: [foundations/recursion]
