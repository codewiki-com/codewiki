terms:
  - id: response-item
    en: Response item
    zh: 响应项
    short:
      en: 'A typed element in a model response output, such as a message, reasoning item, or tool call.'
      zh: '模型响应输出中的类型化元素，例如消息、推理项或工具调用。'
  - id: conversation-state
    en: Conversation state
    zh: 对话状态
    short:
      en: 'The prior messages and generated items supplied to a model so a later turn can continue their context.'
      zh: '提供给模型的历史消息与生成项，使后续轮次能够延续其上下文。'
