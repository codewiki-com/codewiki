terms:
  - id: swift-extension
    en: Swift extension
    zh: Swift 扩展
    aliases: []
    short:
      en: 'A declaration that adds computed members, initializers, nested types, or conformances outside a Swift type’s original declaration.'
      zh: '在 Swift 类型原始声明之外添加计算成员、构造器、嵌套类型或协议遵循的声明。'
    topics: [swift/extensions]

  - id: conditional-conformance
    en: Conditional conformance
    zh: 条件遵循
    aliases: []
    short:
      en: 'A protocol conformance available to a generic type only when its type arguments satisfy declared constraints.'
      zh: '只有泛型类型的实参满足声明的约束时才成立的协议遵循。'
    topics: [swift/extensions]

  - id: retroactive-conformance
    en: Retroactive conformance
    zh: 追溯遵循
    aliases: []
    short:
      en: 'A conformance declared in a module that owns neither the conforming type nor the adopted protocol.'
      zh: '在既不拥有遵循类型、也不拥有被采纳协议的模块中声明的协议遵循。'
    topics: [swift/extensions]
