terms:
  - id: window-function
    en: Window function
    zh: 窗口函数
    short:
      en: 'A function evaluated over a partition of query rows while preserving one output row per input row.'
      zh: '在查询行的一个分区上求值，同时为每条输入行保留一条输出行的函数。'

  - id: window-frame
    en: Window frame
    zh: 窗口框架
    short:
      en: 'The row, peer-group, or value-range segment used for a window calculation at the current row.'
      zh: '窗口函数为当前行计算时，按行、同值组或数值范围选取的分区片段。'

  - id: common-table-expression
    en: Common table expression
    zh: 公共表表达式
    short:
      en: 'A named query defined by WITH and visible to the single statement that follows it.'
      zh: '由 WITH 定义、只对紧随其后的一条语句可见的命名查询。'

  - id: recursive-cte
    en: Recursive CTE
    zh: 递归 CTE
    short:
      en: 'A CTE whose recursive member repeatedly derives rows from an anchor set until no new round is produced.'
      zh: '从锚集合开始，由递归成员反复推导行，直到新一轮不再产生结果的 CTE。'

  - id: anti-join
    en: Anti-join
    zh: 反连接
    short:
      en: 'A relational operation that keeps left-side rows for which no matching right-side row exists.'
      zh: '保留左侧中不存在任何右侧匹配行的记录的一种关系运算。'
