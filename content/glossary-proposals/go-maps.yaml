terms:
  - id: comparable-type
    en: Comparable type
    zh: 可比较类型
    short:
      en: 'A type whose values support == and !=; every Go map key type must satisfy this rule.'
      zh: '值支持 == 和 != 运算的类型；Go 的每一种 map 键类型都必须满足此规则。'
    topics: [go/maps]

  - id: comma-ok-idiom
    en: Comma-ok idiom
    zh: comma-ok 惯用法
    short:
      en: 'A two-result operation that returns a value and a boolean reporting whether a lookup or assertion succeeded.'
      zh: '一种双结果操作，同时返回值与布尔值，用来报告查找或断言是否成功。'
    topics: [go/maps]
