terms:
  - id: slice-header
    en: Slice header
    zh: 切片头
    short:
      en: 'The value-level descriptor that records a slice start, length, and capacity over backing storage.'
      zh: '记录切片在底层存储中的起点、长度和容量的值级描述信息。'

  - id: backing-array
    en: Backing array
    zh: 底层数组
    short:
      en: 'The array storage whose contiguous elements are exposed through one or more Go slices.'
      zh: '为一个或多个 Go 切片提供连续元素存储的数组。'

  - id: full-slice-expression
    en: Full slice expression
    zh: 完整切片表达式
    short:
      en: 'A three-index slice expression, a[low:high:max], that sets both the length and capacity of the result.'
      zh: '形如 a[low:high:max] 的三索引切片表达式，同时设定结果的长度和容量。'

  - id: nil-slice
    en: Nil slice
    zh: nil 切片
    short:
      en: 'A slice whose value is nil; it has zero length and capacity and can be ranged over or appended to.'
      zh: '值为 nil 的切片；其长度和容量为零，仍可用于 range 与 append。'
