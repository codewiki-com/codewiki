terms:
  - id: reflective-access
    en: Reflective access
    zh: 反射访问
    short:
      en: 'Runtime access to a Java type or member through reflection, subject to language checks and module exports or opens.'
      zh: '通过反射在运行时访问 Java 类型或成员，并受语言访问检查及模块导出或开放关系约束。'

  - id: dynamic-proxy
    en: Dynamic proxy
    zh: 动态代理
    short:
      en: 'A runtime-generated Java object that implements interfaces and dispatches their method calls to an InvocationHandler.'
      zh: '在运行时生成、实现一组 Java 接口，并把方法调用分派给 InvocationHandler 的对象。'

  - id: invocation-target-exception
    en: InvocationTargetException
    zh: 调用目标异常
    short:
      en: 'The reflection wrapper thrown when an invoked constructor or method terminates by throwing an exception.'
      zh: '通过反射调用的构造器或方法以异常终止时，由反射 API 抛出的包装异常。'
