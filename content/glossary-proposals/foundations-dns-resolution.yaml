terms:
  - id: dns-resolver
    en: Recursive DNS resolver
    zh: 递归 DNS 解析器
    aliases: [recursive resolver, recursive DNS server]
    short:
      en: 'A service that answers a client by using cached DNS data or following delegations to authoritative servers.'
      zh: '使用 DNS 缓存数据或沿委派查询权威服务器，从而为客户端返回答案的服务。'
    topics: [foundations/dns-resolution]

  - id: authoritative-dns-server
    en: Authoritative DNS server
    zh: 权威 DNS 服务器
    aliases: [authoritative server, authoritative name server]
    short:
      en: 'A DNS server that answers from authority for a zone it serves rather than recursively resolving arbitrary names.'
      zh: '根据自己负责区域的权威数据回答 DNS 问题，而不递归解析任意名称的服务器。'
    topics: [foundations/dns-resolution]

  - id: dns-resource-record
    en: DNS resource record
    zh: DNS 资源记录
    aliases: [resource record, RR]
    short:
      en: 'A typed DNS data item with an owner name, class, TTL, and type-specific value.'
      zh: '带有所有者名称、类别、TTL 和类型专用值的一项结构化 DNS 数据。'
    topics: [foundations/dns-resolution]

  - id: dns-time-to-live
    en: DNS time to live
    zh: DNS 生存时间
    aliases: [DNS TTL, TTL]
    short:
      en: 'The maximum number of seconds a received DNS record may normally be reused from a cache.'
      zh: '收到的 DNS 记录通常可以从缓存中复用的最长秒数。'
    topics: [foundations/dns-resolution]

  - id: negative-dns-caching
    en: Negative DNS caching
    zh: DNS 否定缓存
    aliases: [DNS negative caching, negative cache]
    short:
      en: 'Caching authoritative evidence that a DNS name or a requested record type does not exist.'
      zh: '缓存 DNS 名称或所请求记录类型不存在的权威证据。'
    topics: [foundations/dns-resolution]
