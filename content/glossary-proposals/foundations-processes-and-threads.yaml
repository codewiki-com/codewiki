terms:
  - id: thread
    en: Thread
    zh: 线程
    aliases: [os-thread, native-thread]
    short: { en: 'A schedulable execution path within a process, with private execution state and access to shared process resources.', zh: '进程内可被调度的执行路径，拥有独立执行状态，并可访问共享的进程资源。' }
    topics: [foundations/processes-and-threads]

  - id: context-switch
    en: Context switch
    zh: 上下文切换
    aliases: [task-switch]
    short: { en: 'The act of saving one execution context and restoring another so a processor can run different work.', zh: '保存一个执行上下文并恢复另一个上下文，使处理器能够运行不同工作的过程。' }
    topics: [foundations/processes-and-threads]

  - id: race-condition
    en: Race condition
    zh: 竞态条件
    aliases: [race]
    short: { en: 'A defect in which correctness depends on an uncontrolled ordering of concurrent events.', zh: '程序正确性依赖并发事件的未受控顺序而产生的缺陷。' }
    topics: [foundations/processes-and-threads]

  - id: mutex
    en: Mutex
    zh: 互斥锁
    aliases: [mutual-exclusion-lock]
    short: { en: 'A synchronization primitive that grants one owner at a time exclusive access to protected state.', zh: '同一时间只允许一个所有者排他访问受保护状态的同步原语。' }
    topics: [foundations/processes-and-threads]
