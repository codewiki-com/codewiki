terms:
  - id: type-set
    en: Type set
    zh: 类型集
    short:
      en: 'The non-interface types represented by an interface and allowed by it when the interface is used as a constraint.'
      zh: '接口所表示的非接口类型集合；该接口用作约束时，集合中的类型可以作为类型实参。'

  - id: underlying-type
    en: Underlying type
    zh: 底层类型
    short:
      en: 'The non-named type reached by recursively following a named type declaration, used by assignability and constraint rules.'
      zh: '从命名类型声明递归追溯得到的非命名类型，用于可赋值性和约束规则。'
