terms:
  - id: name-binding
    en: Name binding
    zh: 名称绑定
    aliases: [binding]
    short: { en: 'The association of a name with an object in a particular Python scope.', zh: '在特定 Python 作用域中，把名称与对象建立关联。' }
    topics: [python/variables-data-types]

  - id: dynamic-typing
    en: Dynamic typing
    zh: 动态类型
    aliases: []
    short: { en: 'A typing model where names have no fixed declared type and operations inspect object types at runtime.', zh: '名称没有固定声明类型、操作在运行时检查对象类型的一种类型模型。' }
    topics: [python/variables-data-types]
