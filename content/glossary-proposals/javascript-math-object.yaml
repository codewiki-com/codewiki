terms:
  - id: binary-floating-point
    en: Binary floating-point
    zh: 二进制浮点数
    short:
      en: 'A finite number format that stores a sign, significand, and base-two exponent, so many decimal fractions are approximate.'
      zh: '用符号、有效数字和二进制指数保存有限数的格式，因此许多十进制小数只能近似表示。'

  - id: half-open-interval
    en: Half-open interval
    zh: 半开区间
    short:
      en: 'An interval that includes one endpoint and excludes the other, such as the [0, 1) range returned by Math.random().'
      zh: '只包含一个端点、排除另一个端点的区间，例如 Math.random() 返回的 [0, 1) 范围。'

  - id: cryptographically-secure-randomness
    en: Cryptographically secure randomness
    zh: 密码学安全随机性
    short:
      en: 'Randomness produced so an attacker cannot feasibly predict future values from observed outputs or practical knowledge of the state.'
      zh: '攻击者无法根据已观察输出或可获得的状态信息，切实预测后续值的随机性。'
