terms:
  - id: coroutine
    en: Coroutine
    zh: 协程
    short: { en: 'A suspendable computation that can yield control while awaiting another operation.', zh: '一种可暂停的计算，会在等待其他操作时交还执行权。' }
  - id: asyncio-task
    en: asyncio task
    zh: asyncio 任务
    short: { en: 'An event-loop object that schedules one coroutine and stores its result, exception, or cancellation state.', zh: '由事件循环调度一个协程，并保存其结果、异常或取消状态的对象。' }
  - id: structured-concurrency
    en: Structured concurrency
    zh: 结构化并发
    short: { en: 'A model that binds child-task lifetimes and failure propagation to a lexical scope.', zh: '把子任务生命周期和失败传播绑定到词法作用域的并发模型。' }
  - id: cancellation
    en: Cancellation
    zh: 取消
    short: { en: 'A cooperative request for asynchronous work to stop at a safe suspension point.', zh: '要求异步工作在安全暂停点停止的一项协作式请求。' }
