terms:
  - id: array-extent
    en: Array extent
    zh: 数组边界
    short:
      en: 'The number of elements in one dimension of an array type.'
      zh: '数组类型某一维中包含的元素数量。'

  - id: array-to-pointer-conversion
    en: Array-to-pointer conversion
    zh: 数组到指针转换
    short:
      en: 'The implicit conversion of an array expression to a pointer to its first element.'
      zh: '把数组表达式隐式转换为指向其首元素的指针。'

  - id: row-major-order
    en: Row-major order
    zh: 行主序
    short:
      en: 'A multidimensional layout in which every row array is stored before the next row.'
      zh: '多维数组中先完整存放一行，再存放下一行的布局顺序。'

  - id: undefined-behavior
    en: Undefined behavior
    zh: 未定义行为
    short:
      en: 'Program behavior for which the C++ standard imposes no requirements.'
      zh: 'C++ 标准不对程序结果施加任何要求的行为。'
