terms:
  - id: encapsulation
    en: Encapsulation
    zh: 封装
    short:
      en: 'Keeping representation behind an API so state changes can preserve the object contract and its invariants.'
      zh: '把内部表示隐藏在 API 之后，使状态修改始终遵守对象契约与不变量。'

  - id: subtype-polymorphism
    en: Subtype polymorphism
    zh: 子类型多态
    short:
      en: 'Calling behavior through a base type while the runtime subtype selects the overriding implementation.'
      zh: '通过基类型调用行为，并由运行时子类型选择覆盖实现。'

  - id: composition
    en: Composition
    zh: 组合
    short:
      en: 'Building an object from collaborators it owns or references instead of inheriting their implementations.'
      zh: '通过持有或引用协作者来构建对象，而不是继承协作者的实现。'
