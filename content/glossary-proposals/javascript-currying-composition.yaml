terms:
  - id: currying
    en: Currying
    zh: 柯里化
    aliases: [curried function]
    short:
      {
        en: 'Transforming a multi-argument function into a sequence of functions that each accept one argument.',
        zh: '把多参数函数转换成一串函数，每个函数只接收一个实参。',
      }
    topics: [javascript/currying-composition]
  - id: function-composition
    en: Function composition
    zh: 函数组合
    aliases: [function pipeline]
    short:
      {
        en: 'Creating a function that passes each stage’s output to the next compatible function.',
        zh: '创建一个函数，把每个阶段的输出传给下一个兼容函数。',
      }
    topics: [javascript/currying-composition]
