<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <title>CodeWiki sandbox</title>
  </head>
  <body>
    <script>
      /*
       * The JavaScript runner's execution frame — spec §5.4.
       *
       * The parent embeds this page in an iframe with sandbox="allow-scripts" and *without*
       * allow-same-origin, so this document runs on an opaque origin: it cannot touch the parent's
       * DOM, cookies, localStorage or Cache. The only channel out is postMessage, and the only
       * channel in is the single { id, code } request the parent posts once the frame has loaded.
       *
       * One frame serves exactly one run, and the parent removes it when the run ends, which is
       * also how a program that never settles is stopped. That is why nothing here tries to reset
       * state. It does not rescue a *synchronous* infinite loop: this frame shares the article's
       * main thread, so `while (true) {}` freezes the tab until it is closed (P2: a Web Worker).
       */
      (function () {
        'use strict';

        /** Set by the first accepted request; every later message is ignored. */
        var runId = null;

        function send(message) {
          // The parent is on a different (real) origin and we are on an opaque one, so "*" is the
          // only target origin available. The parent authenticates us by window identity and by
          // the run id it minted, not by origin.
          parent.postMessage(message, '*');
        }

        /** Renders one console argument the way a terminal would print it. */
        function format(value) {
          if (typeof value === 'string') return value;
          if (typeof value === 'bigint') return String(value) + 'n';
          if (typeof value === 'symbol') return value.toString();
          if (typeof value === 'function') return value.name ? '[Function: ' + value.name + ']' : '[Function]';
          if (value instanceof Error) return value.stack || String(value);
          if (value === null || typeof value !== 'object') return String(value);
          try {
            var seen = new WeakSet();
            var json = JSON.stringify(
              value,
              function (_key, item) {
                if (typeof item === 'bigint') return String(item) + 'n';
                if (item !== null && typeof item === 'object') {
                  if (seen.has(item)) return '[Circular]';
                  seen.add(item);
                }
                return item;
              },
              2,
            );
            return json === undefined ? String(value) : json;
          } catch (error) {
            return String(value);
          }
        }

        function line(args) {
          return Array.prototype.map.call(args, format).join(' ');
        }

        function emit(kind, text) {
          if (runId === null) return;
          send({ id: runId, kind: kind, text: text });
        }

        /*
         * Timer bookkeeping. Node drains pending timers before the process exits, so
         * `setTimeout(() => console.log(2))` still prints; an async function in a browser resolves
         * long before that. Counting outstanding timers lets the run wait for the same quiet point
         * Node would, which is what makes the event-loop example print 1, 4, 3, 2 rather than
         * 1, 4, 3. Intervals are deliberately not counted: they would never drain.
         */
        var nativeSetTimeout = window.setTimeout.bind(window);
        var nativeClearTimeout = window.clearTimeout.bind(window);
        var pending = new Set();

        window.setTimeout = function (handler, delay) {
          if (typeof handler !== 'function') return nativeSetTimeout(handler, delay);
          var extra = Array.prototype.slice.call(arguments, 2);
          var id = nativeSetTimeout(function () {
            pending.delete(id);
            handler.apply(null, extra);
          }, delay);
          pending.add(id);
          return id;
        };

        window.clearTimeout = function (id) {
          pending.delete(id);
          return nativeClearTimeout(id);
        };

        var consoleMap = { log: 'stdout', info: 'stdout', debug: 'stdout', warn: 'stderr', error: 'stderr' };
        Object.keys(consoleMap).forEach(function (name) {
          console[name] = function () {
            emit(consoleMap[name], line(arguments));
          };
        });

        // An error thrown from a timer callback escapes the try/catch around the program, so it is
        // reported here instead of being swallowed by the frame.
        window.addEventListener('error', function (event) {
          emit('stderr', String(event.error || event.message));
        });
        window.addEventListener('unhandledrejection', function (event) {
          emit('stderr', String(event.reason));
        });

        /** Resolves once no counted timer is outstanding, or once the drain budget is spent. */
        function drain(budgetMs) {
          var deadline = Date.now() + budgetMs;
          return new Promise(function (resolve) {
            (function poll() {
              if (pending.size === 0 || Date.now() >= deadline) return resolve();
              nativeSetTimeout(poll, 4);
            })();
          });
        }

        window.addEventListener('message', function (event) {
          var data = event.data;
          if (runId !== null) return;
          if (typeof data !== 'object' || data === null) return;
          if (typeof data.id !== 'string' || data.id === '' || typeof data.code !== 'string') return;

          runId = data.id;
          var budget = typeof data.drainMs === 'number' && data.drainMs > 0 ? data.drainMs : 2000;
          var started = performance.now();

          // Wrapping the program in an async IIFE is what makes top-level `await` work. `new
          // Function` keeps the program out of this scope: it sees globals only, not the closure
          // above, so it cannot reach `runId` or the native timers.
          var program;
          try {
            program = new Function('return (async () => {\n' + data.code + '\n})();');
          } catch (error) {
            send({ id: runId, kind: 'error', text: String(error) });
            return;
          }

          Promise.resolve()
            .then(program)
            .then(function () {
              return drain(budget);
            })
            .then(function () {
              send({ id: runId, kind: 'done', ms: Math.round(performance.now() - started) });
            })
            .catch(function (error) {
              send({ id: runId, kind: 'error', text: String(error) });
            });
        });
      })();
    </script>
  </body>
</html>
