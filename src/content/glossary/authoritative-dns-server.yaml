en: Authoritative DNS server
zh: 权威 DNS 服务器
aliases: [authoritative server, authoritative name server]
short: { en: 'A DNS server that answers from authority for a zone it serves rather than recursively resolving arbitrary names.', zh: '根据自己负责区域的权威数据回答 DNS 问题，而不递归解析任意名称的服务器。' }
topics: [foundations/dns-resolution]
