track: php
items:
  - id: array-functions-map-filter-keys
    question: { en: 'How do array_map() and array_filter() differ in their treatment of keys?', zh: 'array_map() 与 array_filter() 对键的处理有什么不同？' }
    answer:
      en: 'array_filter always preserves the input keys, so filtering an indexed array can leave gaps. That matters when the result is encoded as JSON because a non-list PHP array becomes a JSON object. array_map preserves keys only when it receives exactly one input array. With two or more arrays, it aligns values by iteration position and returns sequential integer keys. I keep business keys through processing and call array_values only at a boundary that explicitly requires a list. If a map callback needs keys, I use a clear foreach or pass keys and values deliberately.'
      zh: 'array_filter 始终保留输入键，因此筛选索引数组后可能留下空档。结果转成 JSON 时，这种非列表 PHP 数组会编码为对象。array_map 只有在恰好传入一个数组时才保留键；传入多个数组后，它按迭代位置对齐值，并返回连续整数键。我通常在处理阶段保留业务键，只在明确要求列表的边界调用 array_values。映射回调需要键时，我会使用清楚的 foreach，或显式传入键和值。'
    topics: [php/array-functions]
    level: intermediate
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [arrays, keys, json]

  - id: array-functions-reduce-initial
    question: { en: 'Why should array_reduce() usually receive an explicit initial value?', zh: '为什么 array_reduce() 通常应该显式接收初始值？' }
    answer:
      en: 'The initial value defines the accumulator before the first item and becomes the result for empty input. In PHP, omitting it means the first callback receives null; PHP does not adopt the first array element the way JavaScript reduce does. An explicit identity also stabilizes the result type: 0 for addition, 1 for multiplication, an empty string for concatenation, or an empty array for grouping. If no meaningful empty result exists, I validate input and throw a domain exception instead of allowing an accidental null to flow through the callback.'
      zh: '初始值定义了处理第一项前的累加器，也是空输入的结果。PHP 省略它时，第一次回调收到 null；它不会像 JavaScript 的 reduce 那样采用数组首项。显式单位值还能稳定结果类型：加法用 0，乘法用 1，字符串拼接用空字符串，分组用空数组。如果不存在合理的空结果，我会先校验输入并抛出领域异常，而不是让意外的 null 流入回调。'
    topics: [php/array-functions]
    level: intermediate
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [array-reduce, accumulator, empty-input]

  - id: array-functions-merge-versus-union
    question: { en: 'When would you use array_merge() instead of the array union operator?', zh: '什么情况下应使用 array_merge()，而不是数组联合运算符？' }
    answer:
      en: 'I use array_merge when later string-keyed configuration should override earlier values or when integer-keyed lists should be concatenated and renumbered. The union operator keeps the left value for every duplicate key and preserves integer keys, so it fits left-biased defaults or maps whose numeric identifiers matter. Neither operation is a universal deep merge. array_merge is shallow, while array_merge_recursive can turn duplicate scalar values into arrays. Before choosing, I state the conflict policy for string keys, integer keys, and nested arrays, then write one test for each case.'
      zh: '后方字符串键配置应覆盖前方值，或需要拼接并重排整数键列表时，我会使用 array_merge。联合运算符对每个重复键保留左侧值，并保留整数键，因此适合左侧优先的默认值，或数字标识有意义的映射。两者都不是通用深合并：array_merge 是浅层操作，而 array_merge_recursive 可能把重复标量变成数组。选择前，我会先说明字符串键、整数键和嵌套数组的冲突政策，再分别写测试。'
    topics: [php/array-functions]
    level: intermediate
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [array-merge, array-union, configuration]

  - id: array-functions-usort-contract
    question: { en: 'What contract must a usort() comparator satisfy, and what else does a caller need to know?', zh: 'usort() 比较函数必须满足什么契约，调用方还需要知道什么？' }
    answer:
      en: 'The comparator returns a negative integer when the left value belongs first, zero when the values are equal for sorting, and a positive integer when the right value belongs first. A spaceship expression usually states that contract cleanly; returning a Boolean cannot represent all three cases. usort modifies the array by reference and replaces all keys with sequential integers, so I copy first if the original order matters or choose uasort when associations must survive. On PHP 8 and later, equal elements retain input order, but deterministic output still needs an explicit tie-breaker when input order is uncertain.'
      zh: '左值应排在前面时，比较函数返回负整数；排序意义上相等时返回 0；右值应排在前面时返回正整数。太空船表达式通常能清楚表达这项契约，布尔值无法覆盖三种情况。usort 通过引用修改数组，并把所有键替换为连续整数；需要保留原顺序时我会先复制，需要保留关联时则考虑 uasort。PHP 8 及以后会保留相等项的输入顺序，但输入顺序不确定时，确定性输出仍需要明确的决胜字段。'
    topics: [php/array-functions]
    level: intermediate
    section: { en: 'Language core', zh: '语言核心' }
    frequency: occasional
    tags: [usort, comparator, stable-sort]

  - id: arrays-list-versus-map
    question: { en: 'How can one PHP array represent both a list and a map?', zh: '同一个 PHP 数组为何既能表示列表，也能表示映射？' }
    answer:
      en: 'A PHP array is an ordered map whose keys are integers or strings. It has list shape only when its keys are consecutive integers from zero in iteration order; array_is_list checks exactly that rule. String keys, a nonzero starting key, or a gap make it a map-shaped array, although its runtime type remains array. The distinction matters at boundaries: json_encode turns lists into JSON arrays and other PHP arrays into JSON objects. I document return shape and reindex with array_values only when keys have no business meaning.'
      zh: 'PHP 数组本质上是键为整数或字符串的有序映射。只有键按遍历顺序严格等于从 0 开始的连续整数时，它才具有列表形状，array_is_list 检查的正是这条规则。字符串键、非零起始键或中间空档都会让它成为映射形状，但运行时类型仍是 array。这项区别会影响边界：json_encode 把列表编码为 JSON 数组，把其他 PHP 数组编码为 JSON 对象。我会明确记录返回形状，并且只在键没有业务含义时使用 array_values 重排。'
    topics: [php/arrays]
    level: beginner
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [arrays, lists, ordered-maps, json]

  - id: arrays-isset-versus-key-exists
    question: { en: 'When should you use array_key_exists() instead of isset()?', zh: '什么情况下应该使用 array_key_exists()，而不是 isset()？' }
    answer:
      en: 'I use array_key_exists when the domain distinguishes a missing key from a key explicitly set to null. It tests only key presence, so both a scalar value and null count as present. isset asks whether the key exists and its value is not null, while the null-coalescing operator follows the same practical distinction. For a patch request, null might mean clear the field and absence might mean leave it unchanged, so array_key_exists is essential. When both states mean use a default, isset or ?? is shorter and accurately states the policy.'
      zh: '领域需要区分键缺失与键明确设为 null 时，我会使用 array_key_exists。它只检查键是否存在，因此普通值与 null 都算存在。isset 要求键存在且值不是 null，空合并运算符也采用相同的实际区分方式。例如在局部更新请求中，null 可能表示清空字段，缺失则表示保持不变，此时必须使用 array_key_exists。如果两种状态都表示采用默认值，isset 或 ?? 更简短，也能准确表达政策。'
    topics: [php/arrays]
    level: beginner
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [arrays, 'null', key-existence]

  - id: arrays-unset-list-shape
    question: { en: 'Why can unset() change the JSON shape of a PHP array?', zh: '为什么 unset() 会改变 PHP 数组的 JSON 形状？' }
    answer:
      en: 'unset removes one key-value pair but does not renumber the remaining integer keys. Deleting the middle of a list therefore leaves a gap, and a later unkeyed append normally continues with the next integer key rather than filling that gap. The value is still a PHP array, but array_is_list now returns false. json_encode represents it as a JSON object because JSON arrays cannot carry those explicit, nonconsecutive keys. If positions are the only meaning, I call array_values at the serialization boundary; if keys are identifiers, I preserve them deliberately.'
      zh: 'unset 会删除一个键值对，但不会重新编号其余整数键。删除列表中间元素后会留下空档，之后的无键追加通常继续使用下一个整数键，而不会回填空档。这个值仍是 PHP 数组，但 array_is_list 已返回 false。由于 JSON 数组无法携带这些显式且不连续的键，json_encode 会把它表示为 JSON 对象。如果键只表示位置，我会在序列化边界调用 array_values；如果键是业务标识，则会有意保留它们。'
    topics: [php/arrays]
    level: intermediate
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [arrays, unset, list-shape, json]

  - id: arrays-copy-and-references
    question: { en: 'What does copying a PHP array copy, and when can changes still be shared?', zh: '复制 PHP 数组会复制什么，哪些修改仍可能共享？' }
    answer:
      en: 'Ordinary assignment gives arrays value semantics: changing keys, scalar elements, or nested arrays in the copy does not change the original. PHP may defer physical duplication through copy-on-write, but that is an implementation optimization rather than aliasing visible to application code. Objects stored as elements are different because the copied arrays retain handles to the same objects unless those objects are cloned. An explicit reference assignment with & also creates shared mutation. I test container independence and object identity separately, and I unset a by-reference foreach variable immediately after its loop.'
      zh: '普通赋值让数组遵循值语义：修改副本的键、标量元素或嵌套数组，不会改变原数组。PHP 可能通过写时复制推迟物理复制，但这只是实现优化，不是应用代码可见的别名。对象元素有所不同，因为除非显式克隆对象，两个数组仍保存指向同一对象的句柄。使用 & 的显式引用赋值也会造成共享修改。我会分别测试容器独立性与对象身份，并在按引用 foreach 后立即 unset 循环变量。'
    topics: [php/arrays]
    level: intermediate
    section: { en: 'Language core', zh: '语言核心' }
    frequency: occasional
    tags: [arrays, copy-on-write, references, objects]

  - id: data-types-runtime-versus-declaration
    question: { en: 'How do PHP runtime value types differ from declaration types?', zh: 'PHP 的运行时值类型与声明类型有什么区别？' }
    answer:
      en: 'A runtime type belongs to the current value, so one variable can hold an int and later a string. Declarations constrain selected positions such as parameters, returns, properties, and class constants. The sets overlap but are not identical. resource is a runtime type that userland declarations cannot name, while iterable describes either an array or a Traversable object rather than a distinct runtime value type. mixed, void, and never also express declaration contracts. I use get_debug_type for diagnostics and is_* functions for deliberate narrowing, not string comparisons against gettype output.'
      zh: '运行时类型属于当前值，因此同一个变量可以先保存 int，再保存 string。类型声明约束参数、返回值、属性与类常量等选定位置，两者的集合有重叠，但并不相同。resource 是用户代码声明无法命名的运行时类型；iterable 描述数组或 Traversable 对象，不是独立的运行时值类型。mixed、void 与 never 也用于表达声明契约。我用 get_debug_type 生成诊断信息，用 is_* 函数执行明确的类型缩小，不会比较 gettype 的字符串结果。'
    topics: [php/data-types]
    level: beginner
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [runtime-types, declarations, narrowing]

  - id: data-types-strict-call-site
    question: { en: 'What does declare(strict_types=1) enforce, and what does it leave untouched?', zh: 'declare(strict_types=1) 会强制什么，又不会处理什么？' }
    answer:
      en: 'It is a file-level rule for scalar declarations. For user-defined function arguments, the relevant setting is in the file that makes the call, not merely the file that defines the function. Strict mode rejects scalar mismatches except that an int may satisfy a float parameter; it also tightens declared return values. It does not parse query strings, validate ranges, inspect array elements, or turn PHP into a statically typed language. I still parse untrusted input at a boundary, then pass narrow, validated values into strictly declared domain functions.'
      zh: '它是针对标量声明的文件级规则。对于用户定义函数的参数，采用调用发生文件中的设置，而不只是函数定义文件中的设置。严格模式会拒绝标量类型不匹配，唯一的放宽是 int 可以满足 float 参数；它也会收紧声明的返回值。严格模式不会解析查询字符串、验证数值范围、检查数组元素，也不会把 PHP 变成静态类型语言。我仍会在边界解析不可信输入，再把窄化且验证过的值传给使用严格声明的领域函数。'
    topics: [php/data-types]
    level: intermediate
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [strict-types, call-site, boundaries]

  - id: data-types-cast-versus-validate
    question: { en: 'Why is casting external input different from validating it?', zh: '为什么对外部输入强制转换不等于验证？' }
    answer:
      en: 'A cast guarantees a result type by applying PHP conversion rules; it does not prove that the source representation was complete or meaningful. An expression such as (int) ($input["quantity"] ?? null) can merge a missing field, malformed text, and a valid zero into the same integer. Validation first defines accepted raw types, syntax, range, and missing-value policy. Conversion happens only after those checks. That preserves useful errors and prevents authorization or pricing logic from acting on a plausible value manufactured from invalid input.'
      zh: '强制转换通过 PHP 转换规则保证结果类型，却不能证明来源表示完整且有意义。像 (int) ($input["quantity"] ?? null) 这样的表达式，可能把字段缺失、格式错误与合法零值合并成同一个整数。验证会先定义允许的原始类型、语法、范围与缺失值政策，只有通过检查后才发生转换。这样既能保留有用错误，也能防止授权或计价逻辑使用由非法输入制造出来的貌似合理值。'
    topics: [php/data-types]
    level: beginner
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [casting, validation, external-input]

  - id: data-types-native-array-limits
    question: { en: 'What does an array type declaration guarantee about its contents?', zh: 'array 类型声明能对数组内容保证什么？' }
    answer:
      en: 'Only that the outer value is an array. Native PHP does not encode list versus map shape, required keys, or element types in an array declaration. PHPDoc can describe forms such as array<string, int> or a named array shape, and a static analyzer can check cooperating code, but those annotations do not validate request data at runtime. At an external boundary I validate keys and values explicitly. For stable domain records, I usually map the validated data into a class with typed properties instead of passing an anonymous array through the application.'
      zh: '它只保证外层值是数组。原生 PHP 的 array 声明不会编码列表或映射形状、必需键与元素类型。PHPDoc 可以描述 array<string, int> 或具名数组形状，静态分析器也能检查配合良好的代码，但这些注解不会在运行时验证请求数据。我会在外部边界显式验证键和值。对于结构稳定的领域记录，我通常把验证后的数据映射到带类型属性的类，而不是让匿名数组贯穿整个应用。'
    topics: [php/data-types]
    level: intermediate
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [arrays, phpdoc, runtime-validation]
