track: php
items:
  - id: array-functions-map-filter-keys
    question: { en: 'How do array_map() and array_filter() differ in their treatment of keys?', zh: 'array_map() 与 array_filter() 对键的处理有什么不同？' }
    answer:
      en: 'array_filter always preserves the input keys, so filtering an indexed array can leave gaps. That matters when the result is encoded as JSON because a non-list PHP array becomes a JSON object. array_map preserves keys only when it receives exactly one input array. With two or more arrays, it aligns values by iteration position and returns sequential integer keys. I keep business keys through processing and call array_values only at a boundary that explicitly requires a list. If a map callback needs keys, I use a clear foreach or pass keys and values deliberately.'
      zh: 'array_filter 始终保留输入键，因此筛选索引数组后可能留下空档。结果转成 JSON 时，这种非列表 PHP 数组会编码为对象。array_map 只有在恰好传入一个数组时才保留键；传入多个数组后，它按迭代位置对齐值，并返回连续整数键。我通常在处理阶段保留业务键，只在明确要求列表的边界调用 array_values。映射回调需要键时，我会使用清楚的 foreach，或显式传入键和值。'
    topics: [php/array-functions]
    level: intermediate
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [arrays, keys, json]

  - id: array-functions-reduce-initial
    question: { en: 'Why should array_reduce() usually receive an explicit initial value?', zh: '为什么 array_reduce() 通常应该显式接收初始值？' }
    answer:
      en: 'The initial value defines the accumulator before the first item and becomes the result for empty input. In PHP, omitting it means the first callback receives null; PHP does not adopt the first array element the way JavaScript reduce does. An explicit identity also stabilizes the result type: 0 for addition, 1 for multiplication, an empty string for concatenation, or an empty array for grouping. If no meaningful empty result exists, I validate input and throw a domain exception instead of allowing an accidental null to flow through the callback.'
      zh: '初始值定义了处理第一项前的累加器，也是空输入的结果。PHP 省略它时，第一次回调收到 null；它不会像 JavaScript 的 reduce 那样采用数组首项。显式单位值还能稳定结果类型：加法用 0，乘法用 1，字符串拼接用空字符串，分组用空数组。如果不存在合理的空结果，我会先校验输入并抛出领域异常，而不是让意外的 null 流入回调。'
    topics: [php/array-functions]
    level: intermediate
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [array-reduce, accumulator, empty-input]

  - id: array-functions-merge-versus-union
    question: { en: 'When would you use array_merge() instead of the array union operator?', zh: '什么情况下应使用 array_merge()，而不是数组联合运算符？' }
    answer:
      en: 'I use array_merge when later string-keyed configuration should override earlier values or when integer-keyed lists should be concatenated and renumbered. The union operator keeps the left value for every duplicate key and preserves integer keys, so it fits left-biased defaults or maps whose numeric identifiers matter. Neither operation is a universal deep merge. array_merge is shallow, while array_merge_recursive can turn duplicate scalar values into arrays. Before choosing, I state the conflict policy for string keys, integer keys, and nested arrays, then write one test for each case.'
      zh: '后方字符串键配置应覆盖前方值，或需要拼接并重排整数键列表时，我会使用 array_merge。联合运算符对每个重复键保留左侧值，并保留整数键，因此适合左侧优先的默认值，或数字标识有意义的映射。两者都不是通用深合并：array_merge 是浅层操作，而 array_merge_recursive 可能把重复标量变成数组。选择前，我会先说明字符串键、整数键和嵌套数组的冲突政策，再分别写测试。'
    topics: [php/array-functions]
    level: intermediate
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [array-merge, array-union, configuration]

  - id: array-functions-usort-contract
    question: { en: 'What contract must a usort() comparator satisfy, and what else does a caller need to know?', zh: 'usort() 比较函数必须满足什么契约，调用方还需要知道什么？' }
    answer:
      en: 'The comparator returns a negative integer when the left value belongs first, zero when the values are equal for sorting, and a positive integer when the right value belongs first. A spaceship expression usually states that contract cleanly; returning a Boolean cannot represent all three cases. usort modifies the array by reference and replaces all keys with sequential integers, so I copy first if the original order matters or choose uasort when associations must survive. On PHP 8 and later, equal elements retain input order, but deterministic output still needs an explicit tie-breaker when input order is uncertain.'
      zh: '左值应排在前面时，比较函数返回负整数；排序意义上相等时返回 0；右值应排在前面时返回正整数。太空船表达式通常能清楚表达这项契约，布尔值无法覆盖三种情况。usort 通过引用修改数组，并把所有键替换为连续整数；需要保留原顺序时我会先复制，需要保留关联时则考虑 uasort。PHP 8 及以后会保留相等项的输入顺序，但输入顺序不确定时，确定性输出仍需要明确的决胜字段。'
    topics: [php/array-functions]
    level: intermediate
    section: { en: 'Language core', zh: '语言核心' }
    frequency: occasional
    tags: [usort, comparator, stable-sort]

  - id: arrays-list-versus-map
    question: { en: 'How can one PHP array represent both a list and a map?', zh: '同一个 PHP 数组为何既能表示列表，也能表示映射？' }
    answer:
      en: 'A PHP array is an ordered map whose keys are integers or strings. It has list shape only when its keys are consecutive integers from zero in iteration order; array_is_list checks exactly that rule. String keys, a nonzero starting key, or a gap make it a map-shaped array, although its runtime type remains array. The distinction matters at boundaries: json_encode turns lists into JSON arrays and other PHP arrays into JSON objects. I document return shape and reindex with array_values only when keys have no business meaning.'
      zh: 'PHP 数组本质上是键为整数或字符串的有序映射。只有键按遍历顺序严格等于从 0 开始的连续整数时，它才具有列表形状，array_is_list 检查的正是这条规则。字符串键、非零起始键或中间空档都会让它成为映射形状，但运行时类型仍是 array。这项区别会影响边界：json_encode 把列表编码为 JSON 数组，把其他 PHP 数组编码为 JSON 对象。我会明确记录返回形状，并且只在键没有业务含义时使用 array_values 重排。'
    topics: [php/arrays]
    level: beginner
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [arrays, lists, ordered-maps, json]

  - id: arrays-isset-versus-key-exists
    question: { en: 'When should you use array_key_exists() instead of isset()?', zh: '什么情况下应该使用 array_key_exists()，而不是 isset()？' }
    answer:
      en: 'I use array_key_exists when the domain distinguishes a missing key from a key explicitly set to null. It tests only key presence, so both a scalar value and null count as present. isset asks whether the key exists and its value is not null, while the null-coalescing operator follows the same practical distinction. For a patch request, null might mean clear the field and absence might mean leave it unchanged, so array_key_exists is essential. When both states mean use a default, isset or ?? is shorter and accurately states the policy.'
      zh: '领域需要区分键缺失与键明确设为 null 时，我会使用 array_key_exists。它只检查键是否存在，因此普通值与 null 都算存在。isset 要求键存在且值不是 null，空合并运算符也采用相同的实际区分方式。例如在局部更新请求中，null 可能表示清空字段，缺失则表示保持不变，此时必须使用 array_key_exists。如果两种状态都表示采用默认值，isset 或 ?? 更简短，也能准确表达政策。'
    topics: [php/arrays]
    level: beginner
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [arrays, 'null', key-existence]

  - id: arrays-unset-list-shape
    question: { en: 'Why can unset() change the JSON shape of a PHP array?', zh: '为什么 unset() 会改变 PHP 数组的 JSON 形状？' }
    answer:
      en: 'unset removes one key-value pair but does not renumber the remaining integer keys. Deleting the middle of a list therefore leaves a gap, and a later unkeyed append normally continues with the next integer key rather than filling that gap. The value is still a PHP array, but array_is_list now returns false. json_encode represents it as a JSON object because JSON arrays cannot carry those explicit, nonconsecutive keys. If positions are the only meaning, I call array_values at the serialization boundary; if keys are identifiers, I preserve them deliberately.'
      zh: 'unset 会删除一个键值对，但不会重新编号其余整数键。删除列表中间元素后会留下空档，之后的无键追加通常继续使用下一个整数键，而不会回填空档。这个值仍是 PHP 数组，但 array_is_list 已返回 false。由于 JSON 数组无法携带这些显式且不连续的键，json_encode 会把它表示为 JSON 对象。如果键只表示位置，我会在序列化边界调用 array_values；如果键是业务标识，则会有意保留它们。'
    topics: [php/arrays]
    level: intermediate
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [arrays, unset, list-shape, json]

  - id: arrays-copy-and-references
    question: { en: 'What does copying a PHP array copy, and when can changes still be shared?', zh: '复制 PHP 数组会复制什么，哪些修改仍可能共享？' }
    answer:
      en: 'Ordinary assignment gives arrays value semantics: changing keys, scalar elements, or nested arrays in the copy does not change the original. PHP may defer physical duplication through copy-on-write, but that is an implementation optimization rather than aliasing visible to application code. Objects stored as elements are different because the copied arrays retain handles to the same objects unless those objects are cloned. An explicit reference assignment with & also creates shared mutation. I test container independence and object identity separately, and I unset a by-reference foreach variable immediately after its loop.'
      zh: '普通赋值让数组遵循值语义：修改副本的键、标量元素或嵌套数组，不会改变原数组。PHP 可能通过写时复制推迟物理复制，但这只是实现优化，不是应用代码可见的别名。对象元素有所不同，因为除非显式克隆对象，两个数组仍保存指向同一对象的句柄。使用 & 的显式引用赋值也会造成共享修改。我会分别测试容器独立性与对象身份，并在按引用 foreach 后立即 unset 循环变量。'
    topics: [php/arrays]
    level: intermediate
    section: { en: 'Language core', zh: '语言核心' }
    frequency: occasional
    tags: [arrays, copy-on-write, references, objects]

  - id: data-types-runtime-versus-declaration
    question: { en: 'How do PHP runtime value types differ from declaration types?', zh: 'PHP 的运行时值类型与声明类型有什么区别？' }
    answer:
      en: 'A runtime type belongs to the current value, so one variable can hold an int and later a string. Declarations constrain selected positions such as parameters, returns, properties, and class constants. The sets overlap but are not identical. resource is a runtime type that userland declarations cannot name, while iterable describes either an array or a Traversable object rather than a distinct runtime value type. mixed, void, and never also express declaration contracts. I use get_debug_type for diagnostics and is_* functions for deliberate narrowing, not string comparisons against gettype output.'
      zh: '运行时类型属于当前值，因此同一个变量可以先保存 int，再保存 string。类型声明约束参数、返回值、属性与类常量等选定位置，两者的集合有重叠，但并不相同。resource 是用户代码声明无法命名的运行时类型；iterable 描述数组或 Traversable 对象，不是独立的运行时值类型。mixed、void 与 never 也用于表达声明契约。我用 get_debug_type 生成诊断信息，用 is_* 函数执行明确的类型缩小，不会比较 gettype 的字符串结果。'
    topics: [php/data-types]
    level: beginner
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [runtime-types, declarations, narrowing]

  - id: data-types-strict-call-site
    question: { en: 'What does declare(strict_types=1) enforce, and what does it leave untouched?', zh: 'declare(strict_types=1) 会强制什么，又不会处理什么？' }
    answer:
      en: 'It is a file-level rule for scalar declarations. For user-defined function arguments, the relevant setting is in the file that makes the call, not merely the file that defines the function. Strict mode rejects scalar mismatches except that an int may satisfy a float parameter; it also tightens declared return values. It does not parse query strings, validate ranges, inspect array elements, or turn PHP into a statically typed language. I still parse untrusted input at a boundary, then pass narrow, validated values into strictly declared domain functions.'
      zh: '它是针对标量声明的文件级规则。对于用户定义函数的参数，采用调用发生文件中的设置，而不只是函数定义文件中的设置。严格模式会拒绝标量类型不匹配，唯一的放宽是 int 可以满足 float 参数；它也会收紧声明的返回值。严格模式不会解析查询字符串、验证数值范围、检查数组元素，也不会把 PHP 变成静态类型语言。我仍会在边界解析不可信输入，再把窄化且验证过的值传给使用严格声明的领域函数。'
    topics: [php/data-types]
    level: intermediate
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [strict-types, call-site, boundaries]

  - id: data-types-cast-versus-validate
    question: { en: 'Why is casting external input different from validating it?', zh: '为什么对外部输入强制转换不等于验证？' }
    answer:
      en: 'A cast guarantees a result type by applying PHP conversion rules; it does not prove that the source representation was complete or meaningful. An expression such as (int) ($input["quantity"] ?? null) can merge a missing field, malformed text, and a valid zero into the same integer. Validation first defines accepted raw types, syntax, range, and missing-value policy. Conversion happens only after those checks. That preserves useful errors and prevents authorization or pricing logic from acting on a plausible value manufactured from invalid input.'
      zh: '强制转换通过 PHP 转换规则保证结果类型，却不能证明来源表示完整且有意义。像 (int) ($input["quantity"] ?? null) 这样的表达式，可能把字段缺失、格式错误与合法零值合并成同一个整数。验证会先定义允许的原始类型、语法、范围与缺失值政策，只有通过检查后才发生转换。这样既能保留有用错误，也能防止授权或计价逻辑使用由非法输入制造出来的貌似合理值。'
    topics: [php/data-types]
    level: beginner
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [casting, validation, external-input]

  - id: data-types-native-array-limits
    question: { en: 'What does an array type declaration guarantee about its contents?', zh: 'array 类型声明能对数组内容保证什么？' }
    answer:
      en: 'Only that the outer value is an array. Native PHP does not encode list versus map shape, required keys, or element types in an array declaration. PHPDoc can describe forms such as array<string, int> or a named array shape, and a static analyzer can check cooperating code, but those annotations do not validate request data at runtime. At an external boundary I validate keys and values explicitly. For stable domain records, I usually map the validated data into a class with typed properties instead of passing an anonymous array through the application.'
      zh: '它只保证外层值是数组。原生 PHP 的 array 声明不会编码列表或映射形状、必需键与元素类型。PHPDoc 可以描述 array<string, int> 或具名数组形状，静态分析器也能检查配合良好的代码，但这些注解不会在运行时验证请求数据。我会在外部边界显式验证键和值。对于结构稳定的领域记录，我通常把验证后的数据映射到带类型属性的类，而不是让匿名数组贯穿整个应用。'
    topics: [php/data-types]
    level: intermediate
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [arrays, phpdoc, runtime-validation]

  - id: enums-pure-versus-backed
    question: { en: 'When would you choose a pure enum instead of a backed enum?', zh: '什么情况下应选择纯枚举，而不是带值枚举？' }
    answer:
      en: 'I choose a pure enum when the cases only need to be distinct inside PHP and no stable scalar representation belongs to the domain. Every case is still a typed singleton with a name, methods, interfaces, and cases(). I choose a backed enum when values must round-trip through a database, JSON API, queue message, or configuration file. The string or integer value then becomes an external contract. I do not add backing values merely for labels or ordering; presentation text and domain order deserve explicit mappings.'
      zh: '如果 case 只需在 PHP 内部彼此区分，而且领域中没有稳定的标量表示，我会选择纯枚举。每个 case 仍是带类型的单例，拥有 name，也能使用方法、接口和 cases()。如果值必须经过数据库、JSON API、队列消息或配置文件往返，我会选择带值枚举；此时字符串或整数值会成为外部契约。我不会只为标签或排序添加 backing value，展示文案与领域顺序应使用显式映射。'
    topics: [php/enums]
    level: beginner
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [enums, pure-enum, backed-enum]

  - id: enums-from-versus-try-from
    question: { en: 'How do from() and tryFrom() differ, and where should each be used?', zh: 'from() 与 tryFrom() 有什么区别，分别适合用在哪里？' }
    answer:
      en: 'Both methods belong to backed enums and look up the backing value, not the case name. from() returns the case or throws ValueError, so it fits an internal invariant such as a database column that is constrained to legal values. tryFrom() returns the case or null, so it fits customer-controlled input where the application must produce a validation response. I still verify the raw type before either call. I also keep missing input separate from an unknown value instead of collapsing both into a default case.'
      zh: '两个方法都属于带值枚举，并且按 backing value 查找，不按 case 名称查找。from() 返回 case，找不到时抛出 ValueError，适合受数据库约束等内部不变量保护的数据。tryFrom() 返回 case 或 null，适合需要生成校验响应的客户输入。我在调用前仍会检查原始类型，也会区分字段缺失与未知值，不会把两者都压成默认 case。'
    topics: [php/enums]
    level: intermediate
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [backed-enum, boundary-parsing, validation]

  - id: enums-match-exhaustiveness
    question: { en: 'Does matching on a PHP enum give compile-time exhaustiveness checking?', zh: '对 PHP 枚举使用 match，能否获得编译时穷尽性检查？' }
    answer:
      en: 'PHP itself does not prove an enum match exhaustive at compile time. If no arm matches and there is no default, execution throws UnhandledMatchError. That runtime failure is useful because adding a case does not silently reuse an unrelated policy, but it appears only when the path runs. I omit default for decisions that require an explicit result per case, run a parameterized test over cases(), and enable a static analyzer that can report omissions earlier. A default remains appropriate only when every future case may safely share it.'
      zh: 'PHP 本身不会在编译时证明枚举 match 已经穷尽。没有分支匹配且不存在 default 时，执行会抛出 UnhandledMatchError。这个运行时失败能避免新增 case 静默复用无关政策，但只有路径实际运行时才会出现。对于每个 case 都必须明确决定结果的逻辑，我会省略 default，让参数化测试遍历 cases()，并启用能更早报告遗漏的静态分析器。只有未来所有 case 都能安全共享同一行为时，default 才合适。'
    topics: [php/enums]
    level: intermediate
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [enums, match, exhaustiveness]

  - id: enums-safe-evolution
    question: { en: 'What can break when an enum case or backing value changes?', zh: '修改枚举 case 或 backing value 时，哪些地方可能出问题？' }
    answer:
      en: 'A backed value may already live in database rows, JSON payloads, messages, cache keys, and fixtures. PHP serialization depends on the enum type and case name instead, so renaming either identifier breaks a different set of data. Adding a case can also break older consumers: tryFrom returns null for the new value, while an uncovered match fails only at runtime. I treat published values as protocol fields. Consumers learn both representations or an explicit unknown-value policy first, stored data is migrated next, and producers stop writing the old form last.'
      zh: 'backing value 可能已经写入数据库行、JSON 载荷、消息、缓存键与测试夹具。PHP 序列化依赖枚举类型和 case 名称，因此重命名这些标识又会破坏另一批数据。新增 case 也可能破坏旧消费者：tryFrom 会对新值返回 null，缺少分支的 match 则只在运行时失败。我会把已发布值当作协议字段，先让消费者理解两种表示或明确未知值政策，再迁移存量数据，最后才让生产者停止写旧格式。'
    topics: [php/enums]
    level: advanced
    section: { en: 'Language core', zh: '语言核心' }
    frequency: occasional
    tags: [enums, serialization, migration, compatibility]

  - id: error-handling-two-channels
    question: { en: 'How do PHP diagnostics differ from Throwable objects?', zh: 'PHP 诊断与 Throwable 对象有什么区别？' }
    answer:
      en: 'PHP diagnostics carry an E_* integer level, message, file, and line. Eligible levels can reach set_error_handler(), whose return value decides whether normal PHP display or logging continues. Throwable is the object hierarchy shared by Exception and Error; it propagates through try/catch and can reach set_exception_handler(). Error is therefore not the same thing as E_ERROR. I classify the failure source first, because an E_ALL mask does not make an error handler catch TypeError, and a catch block does not receive ordinary E_USER_WARNING diagnostics unless code explicitly converts them to ErrorException.'
      zh: 'PHP 诊断携带 E_* 整数级别、消息、文件和行号。符合条件的级别可以进入 set_error_handler()，其返回值决定 PHP 的普通展示或日志是否继续。Throwable 则是 Exception 与 Error 共享的对象层次，通过 try/catch 传播，也可能到达 set_exception_handler()。因此，Error 并不等于 E_ERROR。我会先判断失败来源，因为 E_ALL 掩码不会让错误处理器捕获 TypeError，catch 也不会收到普通 E_USER_WARNING，除非代码显式把它转换为 ErrorException。'
    topics: [php/error-handling]
    level: intermediate
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [diagnostics, throwable, error-levels]

  - id: error-handling-handler-contract
    question: { en: 'What contract should a set_error_handler() callback follow?', zh: 'set_error_handler() 回调应遵守什么契约？' }
    answer:
      en: 'The callback receives severity, message, file, and line for diagnostics eligible under its registration mask. Before converting a diagnostic, it should test error_reporting() & $severity so suppression and the current policy remain meaningful. Returning false delegates to PHP default handling; returning true says the custom path owns display and logging completely. I keep the callback small, avoid dependencies that can fail recursively, and pair temporary registration with restore_error_handler() in finally. In a long-lived worker or Fiber-based application, I also verify that process-global handler state cannot leak across requests or interleaved tasks.'
      zh: '回调会收到注册掩码允许的诊断严重级别、消息、文件和行号。转换前应检查 error_reporting() & $severity，让抑制与当前政策保持有效。返回 false 会交回 PHP 默认处理；返回 true 则表示自定义路径完全接管展示与日志。我会让回调保持短小，避免依赖可能递归失败的组件，并把临时注册与 finally 中的 restore_error_handler() 配对。对于长生命周期工作进程或基于 Fiber 的应用，还要验证进程级处理器状态不会泄漏到其他请求或交错任务。'
    topics: [php/error-handling]
    level: intermediate
    section: { en: 'Runtime behavior', zh: '运行时行为' }
    frequency: common
    tags: [error-handler, suppression, global-state]

  - id: error-handling-production-policy
    question: { en: 'How would you configure and test PHP error reporting in production?', zh: '你会怎样配置并测试 PHP 生产环境的错误报告？' }
    answer:
      en: 'I keep error_reporting at E_ALL so warnings, notices, and deprecations remain observable, set display_errors off so internal detail cannot enter responses, and keep log_errors on with an access-controlled destination. Deployment configuration, not request code alone, owns startup settings. Logs use stable event codes and correlation IDs with an explicit field allowlist; passwords, tokens, cookies, authorization headers, and arbitrary request bodies are excluded. Tests assert effective configuration, sufficient internal context, and the absence of paths, stacks, SQL, and secrets from public responses. I also test failure of the logging destination itself.'
      zh: '我会保留 E_ALL，让警告、通知和弃用信息继续可观测；关闭 display_errors，避免内部细节进入响应；同时打开 log_errors，并使用受访问控制的目标。启动设置应由部署配置负责，不能只依赖请求代码。日志使用稳定事件码、关联 ID 和明确的字段允许列表，排除密码、令牌、Cookie、授权头与任意请求体。测试既要确认实际配置和内部上下文充足，也要确认公开响应不包含路径、堆栈、SQL 与秘密，还要覆盖日志目标自身失败的情况。'
    topics: [php/error-handling]
    level: intermediate
    section: { en: 'Production operations', zh: '生产运维' }
    frequency: common
    tags: [production, logging, redaction, configuration]

  - id: error-handling-shutdown-boundary
    question: { en: 'What can a PHP shutdown handler safely do after a fatal termination?', zh: 'PHP 关闭处理器在致命终止后可以安全地做什么？' }
    answer:
      en: 'A shutdown function runs after normal completion and on many termination paths, so error_get_last() must be checked for null and filtered against an explicit fatal-level allowlist. It can record a small, idempotent event or release simple process resources, but it is not a recovery boundary. Transactions may be incomplete, memory may be exhausted, and output may already have started. I do not continue domain writes, replay payments, or print one universal HTML page into JSON and streaming responses. Retry decisions belong to an external worker or caller that can inspect durable state.'
      zh: '关闭函数会在正常结束和许多终止路径上运行，因此必须先检查 error_get_last() 是否为 null，再用明确的致命级别允许列表筛选。它可以记录小型、幂等的事件，或释放简单进程资源，但不是恢复边界。此时事务可能不完整、内存可能耗尽、输出也可能已经开始。我不会继续领域写入、重新执行支付，也不会把通用 HTML 页面输出到 JSON 或流式响应中。重试应由能检查持久状态的外部工作进程或调用方决定。'
    topics: [php/error-handling]
    level: advanced
    section: { en: 'Runtime behavior', zh: '运行时行为' }
    frequency: occasional
    tags: [shutdown, fatal-error, recovery]

  - id: exceptions-exception-versus-throwable
    question: { en: 'Why can catch (Exception) miss a PHP failure, and when would you catch Throwable?', zh: '为什么 catch (Exception) 可能漏掉 PHP 失败，什么情况下才应捕获 Throwable？' }
    answer:
      en: 'Throwable is the common interface above the Exception and Error branches. An application RuntimeException belongs to Exception, while engine failures such as TypeError belong to Error, so catch (Exception) misses the latter. I keep local catches narrow and name the failures they can actually recover from. I catch Throwable at a transaction, request, job, or CLI boundary when every escaping failure requires the same rollback and termination policy. I do not mechanically replace every Exception catch with Throwable, because that can turn a programming defect into a misleading fallback. Tests send one object from each branch through the boundary.'
      zh: 'Throwable 是 Exception 与 Error 两个分支共同实现的接口。应用抛出的 RuntimeException 属于 Exception，而 TypeError 等引擎失败属于 Error，所以 catch (Exception) 会漏掉后者。我会让局部捕获保持窄小，只列出真正能够恢复的失败。只有在事务、请求、任务或 CLI 边界中，所有逃出的失败都需要同一种回滚与终止政策时，我才捕获 Throwable。我不会机械地把每个 Exception 都改成 Throwable，因为那会把程序缺陷伪装成误导性的后备结果。测试还会让两个分支各有一个对象经过该边界。'
    topics: [php/exceptions]
    level: intermediate
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [throwable, exception, error, catch-scope]

  - id: exceptions-wrapping-boundaries
    question: { en: 'How do you translate an exception across abstraction layers without losing its cause?', zh: '怎样在抽象层之间转换异常，同时不丢失原始原因？' }
    answer:
      en: 'I catch the low-level type at the layer that understands it, add operation context, and pass the original Throwable as the third constructor argument of the new exception. The upper layer then depends on a stable domain type while getPrevious() retains the driver or service cause. The new message describes this layer''s failed operation rather than copying the old message. I normally log the chain once at the outer boundary that owns correlation and redaction context. Logging and rethrowing at every layer creates duplicate events, while omitting $previous leaves only prose and destroys the programmatic cause relationship.'
      zh: '我会在理解底层失败的那一层捕获具体类型，补充当前操作语境，并把原始 Throwable 作为新异常构造器的第三个参数。这样，上层只依赖稳定的领域类型，getPrevious() 仍能保留驱动或服务原因。新消息描述本层失败的操作，不复制旧消息。我通常只在拥有关联与脱敏上下文的最外层记录整条链。每层都记录后再抛出会制造重复事件；遗漏 $previous 则只剩文案，破坏可编程访问的原因关系。'
    topics: [php/exceptions]
    level: intermediate
    section: { en: 'Application design', zh: '应用设计' }
    frequency: common
    tags: [exception-chain, wrapping, previous, boundaries]

  - id: exceptions-finally-contract
    question: { en: 'What does finally guarantee, and what should not be placed inside it?', zh: 'finally 保证什么，其中不应该放什么？' }
    answer:
      en: 'A finally block runs as control leaves its try/catch structure through normal completion, return, a handled exception, or continuing propagation. I use it for bounded cleanup owned by that scope: releasing a lock, closing a stream, rolling back temporary state, or restoring a handler. I do not return from finally because that replaces a pending return value and can suppress an exception. I also avoid large cleanup paths that may fail unpredictably. Acquisition and release stay close together, and tests force failure after acquisition to prove cleanup runs without changing the original result or exception.'
      zh: '控制流通过正常完成、return、已捕获异常或继续传播离开 try/catch 结构时，finally 都会执行。我用它完成本作用域拥有的有限清理，例如释放锁、关闭流、回滚临时状态或恢复处理器。我不会在 finally 中 return，因为它会替换待返回值，还可能吞掉异常。我也会避免放入可能以不可预测方式失败的大段清理逻辑。资源取得与释放应相邻，测试则在取得资源后故意制造失败，证明清理会执行，而且不改变原始结果或异常。'
    topics: [php/exceptions]
    level: intermediate
    section: { en: 'Runtime behavior', zh: '运行时行为' }
    frequency: common
    tags: [finally, cleanup, ownership, control-flow]

  - id: exceptions-public-contract
    question: { en: 'How would you design and test a public exception contract in PHP?', zh: '你会怎样设计并测试 PHP 的公开异常契约？' }
    answer:
      en: 'PHP exceptions are unchecked, so signatures do not force callers to acknowledge them. I document the stable application types a public method may throw, choose types by caller policy rather than message wording, and keep infrastructure classes behind a translation boundary. Tests cover success, every documented failure type, the previous-exception link, and cleanup on each exit path. I do not make clients parse getMessage() or treat Exception::$code as an automatic HTTP status. If callers need structured decisions, the exception exposes a narrow read-only property or subtype, while the public response uses a separate stable error code.'
      zh: 'PHP 异常是非检查型异常，函数签名不会强迫调用方确认它们。我会记录公共方法可能抛出的稳定应用类型，按调用方政策而不是消息文案选择类型，并在转换边界之后隐藏基础设施异常。测试覆盖成功、每种已记录失败类型、前一个异常关系，以及各条退出路径上的清理。我不会让客户端解析 getMessage()，也不会把 Exception::$code 自动当成 HTTP 状态。如果调用方需要结构化决策，异常会提供窄小的只读属性或子类型，而公开响应使用独立的稳定错误码。'
    topics: [php/exceptions]
    level: advanced
    section: { en: 'Application design', zh: '应用设计' }
    frequency: occasional
    tags: [exception-contract, unchecked-exception, testing, api-design]

  - id: fundamentals-expression-versus-statement
    question: { en: 'What is the difference between an expression and a statement in PHP, and why does it matter during review?', zh: 'PHP 中的表达式与语句有什么区别，为什么代码审查需要区分它们？' }
    answer:
      en: 'An expression is evaluated and produces a value; a statement is a complete execution unit such as an assignment statement, return, or function call. The distinction matters because PHP permits side effects inside expressions. Assignment produces the assigned value, so an accidental single equals sign inside if is valid code rather than a syntax error. I keep state changes in separate statements unless a compact form has a clear contract. During review, I expand mixed assignment, comparison, and logic with parentheses, check the resulting type, and test both branches.'
      zh: '表达式经过求值并产生一个值，语句则是完整的执行单位，例如赋值语句、return 或函数调用。区分二者很重要，因为 PHP 允许表达式内部产生副作用。赋值还会产生被赋的值，所以 if 中误写的单个等号是合法代码，不是语法错误。我通常让状态变化单独占一条语句，除非紧凑形式拥有清楚契约。审查时，我会用括号展开混合了赋值、比较与逻辑运算的表达式，确认结果类型，并测试两条分支。'
    topics: [php/fundamentals]
    level: beginner
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [expressions, statements, assignment]

  - id: fundamentals-if-match-switch
    question: { en: 'How do you choose between if, match, and switch in modern PHP?', zh: '现代 PHP 中怎样选择 if、match 与 switch？' }
    answer:
      en: 'I use if for ordered predicates, especially when each branch asks a different question or performs statements. I use match when one subject should produce exactly one value: it compares strictly, returns the selected arm, and never falls through. I keep switch mainly for existing code or deliberate statement-oriented fall-through, remembering that case matching is loose and nonempty cases usually need break. The choice is not cosmetic. I test overlapping predicates in priority order, numeric strings against integers when migrating from switch to match, and the unmatched path when no default arm exists.'
      zh: '各分支提出不同问题或执行多条语句时，我使用 if，并把谓词按优先级排列。一个主题值应该产生唯一结果时，我使用 match；它执行严格比较、返回选中分支的值，而且不会贯穿。我主要在既有代码或故意按语句贯穿时保留 switch，同时记住 case 使用宽松匹配，非空分支通常需要 break。选择并非外观问题。我会测试重叠谓词的顺序、从 switch 迁移到 match 时字符串数字与整数的差别，以及没有 default 时的未匹配路径。'
    topics: [php/fundamentals]
    level: beginner
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [if, match, switch, control-flow]

  - id: fundamentals-precedence-versus-order
    question: { en: 'Why is operator precedence not the same as evaluation order in PHP?', zh: '为什么 PHP 的运算符优先级不等于求值顺序？' }
    answer:
      en: 'Precedence tells the parser how operators and operands group, while associativity resolves nesting between operators at the same precedence. Neither generally promises which subexpression executes first. That matters when calls, increments, assignments, or array updates share one expression: an observed order on one runtime is not a portable contract. I split required side effects into separate named statements. I rely on ordering only where the operator defines conditional evaluation, such as the right side of &&, ||, ??, or the selected branch of a conditional expression, and I still avoid hiding mandatory writes there.'
      zh: '优先级告诉解析器运算符与操作数如何分组，结合方向则处理相同优先级运算符的嵌套。两者通常都不承诺哪个子表达式先执行。当调用、自增、赋值或数组更新挤在同一表达式中时，这项区别会影响正确性；某个运行时上观察到的顺序不是可移植契约。我会把必须排序的副作用拆成有名称的独立语句。只有运算符明确规定条件求值时，我才依赖顺序，例如 &&、||、?? 的右侧或条件表达式选中的分支，而且不会把必须发生的写入藏在那里。'
    topics: [php/fundamentals]
    level: intermediate
    section: { en: 'Runtime behavior', zh: '运行时行为' }
    frequency: occasional
    tags: [operator-precedence, evaluation-order, side-effects]

  - id: fundamentals-entry-function-boundary
    question: { en: 'How would you keep a PHP business function independent of its web or CLI entry point?', zh: '怎样让 PHP 业务函数不依赖 Web 或 CLI 入口？' }
    answer:
      en: 'I let the entry point own protocol details. A web adapter reads selected superglobal fields; a CLI adapter reads argv and chooses exit codes. Each adapter validates and normalizes raw strings before passing ordinary typed values to a business function. The function receives dependencies and data as parameters, returns a stable domain result, and does not read globals, print responses, or terminate the process. Tests then call it without constructing a request or spawning a command. At the outer boundary, the adapter converts domain failures into an HTTP response, stderr message, or nonzero exit code.'
      zh: '我会让入口负责协议细节：Web 适配层读取指定的超全局字段，CLI 适配层读取 argv 并选择退出码。每个适配层先验证和规范化原始字符串，再把普通的带类型值传给业务函数。业务函数通过参数接收依赖与数据，返回含义稳定的领域结果，不读取全局变量、不打印响应，也不终止进程。这样，测试无需构造请求或启动命令就能直接调用它。最外层适配器再把领域失败转换成 HTTP 响应、标准错误消息或非零退出码。'
    topics: [php/fundamentals]
    level: intermediate
    section: { en: 'Application design', zh: '应用设计' }
    frequency: common
    tags: [entry-point, functions, globals, testing]

  - id: namespaces-name-resolution
    question: { en: 'How does PHP resolve unqualified, qualified, and fully qualified names inside a namespace?', zh: 'PHP 怎样在命名空间内解析非限定名称、限定名称与完全限定名称？' }
    answer:
      en: 'I separate static class-like names from functions, constants, and dynamic strings. An unqualified class name first uses a file-local import alias and otherwise belongs to the current namespace. A qualified name can replace an imported first segment; otherwise it is relative to the current namespace. A leading backslash makes a name fully qualified from the global root, while namespace\ is explicitly relative. Unqualified functions and constants may fall back globally when no namespaced definition exists, but classes do not. Dynamic strings bypass these static import rules, so I pass Type::class when a complete runtime name is needed.'
      zh: '我会先区分静态类式名称、函数、常量和动态字符串。非限定类名先使用当前文件的导入别名，否则属于当前命名空间。限定名称的首段可以由导入别名替换，否则相对于当前命名空间。开头反斜杠表示从全局根开始的完全限定名称，namespace\ 则明确表示相对名称。当前命名空间没有同名定义时，非限定函数与常量可以回退到全局空间，类却不能。动态字符串绕过这些静态导入规则，因此运行时需要完整名称时，我会传递 Type::class。'
    topics: [php/namespaces]
    level: intermediate
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [namespaces, name-resolution, fallback]

  - id: namespaces-import-versus-autoload
    question: { en: 'What is the difference between a namespace import and autoloading in PHP?', zh: 'PHP 的命名空间导入与自动加载有什么区别？' }
    answer:
      en: 'A use declaration is compile-time, file-local notation. It tells PHP how a short class, function, or constant name expands, but it does not include a file, install a package, or define the target. After PHP resolves a class-like reference, a registered autoloader may receive that complete name and locate its definition. Composer commonly implements that second step with PSR-4. I debug the phases in order: first print or inspect the exact resolved class name, then derive the expected path from composer.json, regenerate autoload metadata if configuration changed, and exercise the class through vendor/autoload.php.'
      zh: 'use 声明是编译期、文件级的记法。它告诉 PHP 怎样展开类、函数或常量的短名称，但不会包含文件、安装包或定义目标。PHP 解析出类式引用后，已注册的自动加载器才可能收到该完整名称并查找定义，Composer 通常用 PSR-4 完成这一步。排障时我会按顺序检查：先打印或查看准确的解析结果，再按 composer.json 推导预期路径；若配置有变化，就重新生成自动加载元数据，并通过 vendor/autoload.php 实际使用该类。'
    topics: [php/namespaces]
    level: beginner
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [imports, autoloading, composer]

  - id: namespaces-dynamic-class-factory
    question: { en: 'How would you safely build a factory that selects namespaced classes from an external key?', zh: '怎样安全地构建一个根据外部键选择命名空间类的工厂？' }
    answer:
      en: 'I do not concatenate the request value into a class string because imports do not rewrite dynamic strings and autoloading an attacker-influenced name can trigger unintended code. I define a closed map from protocol keys to class constants, such as csv to CsvExporter::class, reject unknown keys before calling class_exists or new, and type the return as a shared interface. Construction may still have side effects, so the allowlist check comes first. Tests cover every accepted key, case variants, separators, empty input, and an unknown key, and they assert that each mapped class loads through Composer and implements the interface.'
      zh: '我不会把请求值拼进类名字符串，因为导入不会改写动态字符串，而且自动加载受攻击者影响的名称可能触发意外代码。我会建立从协议键到类常量的封闭映射，例如把 csv 映射到 CsvExporter::class；在调用 class_exists 或 new 前拒绝未知键，并把返回类型声明为共享接口。构造仍可能产生副作用，所以允许列表检查必须在前。测试覆盖每个允许键、大小写变体、分隔符、空输入与未知键，并断言映射类都能由 Composer 加载且实现该接口。'
    topics: [php/namespaces]
    level: advanced
    section: { en: 'Application design', zh: '应用设计' }
    frequency: occasional
    tags: [dynamic-class-name, allowlist, factory, security]

  - id: namespaces-psr4-debugging
    question: { en: 'A class loads on a developer laptop but fails in Linux CI. How do you investigate its namespace and PSR-4 mapping?', zh: '某个类能在开发者电脑加载，却在 Linux CI 中失败。怎样检查其命名空间与 PSR-4 映射？' }
    answer:
      en: 'I start with the complete class name requested at the failing call, not its local alias. For the matching composer.json prefix, I remove that prefix, convert the remaining namespace separators to directories, and append .php to the class name. I compare every directory, filename, declaration, and reference with exact case because a case-insensitive filesystem can hide drift locally. I also check singular versus plural segments, confirm the entry point loaded the intended vendor/autoload.php, and run composer dump-autoload after configuration changes. Finally, I reproduce through the real autoloader rather than merely linting the target file.'
      zh: '我会从失败调用所请求的完整类名开始，而不是看它的本地别名。找到 composer.json 中匹配的前缀后，我会移除前缀，把余下的命名空间分隔符转换成目录，再给类名添加 .php。目录、文件名、声明和引用的大小写都要逐一精确比较，因为大小写不敏感的文件系统可能在本地掩盖漂移。我还会检查单复数层级，确认入口载入了预期的 vendor/autoload.php，并在配置变化后运行 composer dump-autoload。最后要通过真实自动加载器复现，不能只对目标文件执行语法检查。'
    topics: [php/namespaces]
    level: intermediate
    section: { en: 'Tooling', zh: '工具链' }
    frequency: common
    tags: [psr-4, debugging, case-sensitivity, composer]

  - id: php8-union-types-versus-validation
    question: { en: 'What does a PHP union type guarantee, and what validation still belongs at an application boundary?', zh: 'PHP 联合类型能保证什么，应用边界仍需完成哪些校验？' }
    answer:
      en: 'A union such as int|string guarantees only that the runtime value satisfies at least one declared member under PHP''s call-site typing rules. It does not prove that an integer is positive, a string is a known status, or an array has required keys and element types. I validate shape and domain constraints where HTTP, CLI, database, or message data enters, then normalize it into a narrower internal form. I test every accepted union member, look-alike values such as 1 and "1", boundary values, and types that must be rejected.'
      zh: '像 int|string 这样的联合类型，只保证运行时值按照 PHP 调用点的类型规则满足至少一个已声明成员。它不会证明整数为正、字符串属于已知状态，也不会检查数组的必需键和元素类型。我会在 HTTP、CLI、数据库或消息数据进入系统时校验形状与领域约束，再将其规范化成更窄的内部表示。测试会覆盖每个允许成员、1 与 "1" 这类外观相似的值、边界值，以及必须拒绝的类型。'
    topics: [php/php8-features]
    level: intermediate
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [union-types, validation, boundaries]

  - id: php8-named-argument-compatibility
    question: { en: 'How do named arguments change API compatibility and array unpacking in PHP 8?', zh: '命名实参怎样改变 PHP 8 的 API 兼容性与数组展开行为？' }
    answer:
      en: 'A named call binds the parameter''s textual name, so renaming a public parameter can break callers even when its position and type stay unchanged. Positional arguments must come first, and an unknown or duplicate named binding raises Error. String keys from an unpacked array are treated as argument names, which means forwarding an untrusted payload with ...$payload exposes the call directly to unknown keys and type failures. I project external data through an allowlist before unpacking, keep public parameter names stable, and retain integration tests that call important APIs by name.'
      zh: '命名调用按形参的文本名称绑定，因此即使位置和类型不变，重命名公开形参也可能破坏调用方。位置实参必须在前，未知名称或重复绑定会抛出 Error。展开数组时，字符串键会被视为实参名，所以用 ...$payload 转发不可信载荷，会让调用直接面对未知键与类型失败。我会先通过允许列表投影外部数据，再执行展开；同时保持公开形参名稳定，并保留按名称调用重要 API 的集成测试。'
    topics: [php/php8-features]
    level: intermediate
    section: { en: 'API design', zh: 'API 设计' }
    frequency: common
    tags: [named-arguments, compatibility, unpacking]

  - id: php8-attribute-execution
    question: { en: 'When does a PHP attribute affect program behavior, and when are its errors detected?', zh: 'PHP 特性何时影响程序行为，它的错误又在什么时候被发现？' }
    answer:
      en: 'An attribute is metadata, so writing #[RequiresRole] does not enforce authorization by itself. A consumer must locate it through reflection, decide how repeated entries combine, instantiate it when needed, and apply the policy. getAttributes can return descriptors without running constructors. ReflectionAttribute::newInstance performs instantiation and can expose invalid targets, missing arguments, or a class that is not declared as an attribute. I run a startup or integration test through the real consumer, including absent metadata, repeats, bad arguments, bad targets, and both allowed and denied authorization outcomes.'
      zh: '特性只是元数据，因此写下 #[RequiresRole] 本身不会执行授权。消费者必须通过反射找到它，决定重复项如何组合，在需要时实例化对象，再应用策略。getAttributes 可以只返回描述符而不运行构造器；ReflectionAttribute::newInstance 才会实例化，并可能暴露非法目标、缺少参数或类未声明为特性等问题。我会通过真实消费者执行启动或集成测试，覆盖元数据缺失、重复、错误参数、错误目标，以及授权允许和拒绝两种结果。'
    topics: [php/php8-features]
    level: intermediate
    section: { en: 'Runtime behavior', zh: '运行时行为' }
    frequency: common
    tags: [attributes, reflection, metadata]

  - id: php8-safe-match-nullsafe-migration
    question: { en: 'How would you safely migrate switch statements and nested null checks to PHP 8 syntax?', zh: '怎样把 switch 与嵌套空值检查安全迁移到 PHP 8 语法？' }
    answer:
      en: 'I first characterize old behavior with values of different types, every case, fall-through paths, and the default. match uses strict comparison, returns one expression, and throws UnhandledMatchError when no arm matches, so a mechanical switch replacement can change all three behaviors. For nested null checks, I identify every independently nullable hop and the domain meaning of each absence. Each such hop needs ?->, while ?? supplies a separate fallback policy. I also move required auditing, authorization, and other side effects out of method arguments that a nullsafe chain may skip.'
      zh: '我会先用不同类型的值、每个 case、贯穿路径和 default 固定旧行为。match 使用严格比较，只返回一个分支表达式，而且没有分支匹配时会抛出 UnhandledMatchError，因此机械替换 switch 可能同时改变三种行为。迁移嵌套空值检查时，我会找出每个独立可空步骤，并定义每种缺失的领域含义；这些步骤各自需要 ?->，而 ?? 提供的是另一层后备策略。必须执行的审计、授权和其他副作用，应移出可能被 nullsafe 链跳过的方法实参。'
    topics: [php/php8-features]
    level: advanced
    section: { en: 'Migration', zh: '迁移' }
    frequency: occasional
    tags: [match, nullsafe-operator, migration]
