track: ai-era
items:
  - id: coding-agent-versus-assistant
    question: { en: 'What makes a coding agent different from code completion or a chat assistant?', zh: '编程智能体与代码补全或对话助手有什么区别？' }
    answer:
      en: 'The distinction is the feedback loop, not the user interface. Completion predicts text near a cursor, while chat usually returns an answer for a developer to apply. A coding agent can request tools that inspect or change an environment, receive the resulting files, exit codes, and errors, then choose another action. Its real capability comes from the host that executes those calls. I therefore describe an agent by its available tools, permission policy, workspace, stop conditions, and verifier rather than by the model name or whether it appears in a CLI or IDE.'
      zh: '区别在于反馈循环，而不在于界面。代码补全预测光标附近的文本，对话助手通常返回由开发者应用的答案；编程智能体则能请求工具检查或修改环境，接收文件内容、退出码和错误，再选择下一步。真正的能力来自执行调用的宿主。因此，我会用可用工具、权限策略、工作区、停止条件和验证器描述智能体，而不是只看模型名称，或它出现在 CLI 还是 IDE 中。'
    topics: [ai-era/ai-coding-agents]
    level: beginner
    section: { en: 'Working with agents', zh: '与智能体协作' }
    frequency: common
    tags: [agent-loop, tool-use, feedback]

  - id: coding-agent-safe-tool-boundary
    question: { en: 'How would you design a safe tool boundary for a coding agent?', zh: '怎样为编程智能体设计安全的工具边界？' }
    answer:
      en: 'I keep the model outside the execution boundary. It proposes a typed call, and a host validates the tool name, normalized arguments, working directory, network need, and expected write scope. Policy then allows, denies, or pauses for approval. Unknown tools are denied by default, and sensitive approval covers one exact call or a narrow rule. The executor returns structured status, exit code, stderr, truncation, and changed resources. For file paths I resolve links and prove containment; for commands I prefer argument arrays and purpose-built test or format tools over an unrestricted shell.'
      zh: '我会把模型放在执行边界之外。模型只提出带类型的调用，由宿主验证工具名称、规范化参数、工作目录、网络需求和预期写入范围；策略随后允许、拒绝或暂停等待批准。未知工具默认拒绝，敏感批准只覆盖一次确切调用或一条严格规则。执行器返回结构化状态、退出码、stderr、截断标记和改动资源。文件路径要解析链接并证明仍在范围内；命令优先使用参数数组和专用测试、格式化工具，而不是无限制 shell。'
    topics: [ai-era/ai-coding-agents]
    level: intermediate
    section: { en: 'Tooling', zh: '工具链' }
    frequency: common
    tags: [least-privilege, approval-gate, sandbox]

  - id: coding-agent-completion-evidence
    question: { en: 'What evidence should a coding agent provide before a task is called complete?', zh: '编程智能体在任务完成前应提供哪些证据？' }
    answer:
      en: 'Completion should be derived from acceptance checks, never from the model saying it is done. I want the baseline revision, actual diff, changed-file scope, exact verification commands, their working directories and exit codes, plus any truncated output or skipped check. A bug fix should include a regression test that represents the failure, and broader checks should match the patch risk. Passing unit tests does not prove a data migration or product decision, so the report must separate automated evidence from human judgments and remaining warnings. I rerun critical commands in a clean isolated workspace before merging.'
      zh: '完成状态应由验收检查推导，不能来自模型的自我声明。我需要看到基线版本、实际差异、改动文件范围、确切验证命令、运行目录和退出码，以及任何被截断的输出或跳过的检查。缺陷修复应包含能复现问题的回归测试，更广的检查要与补丁风险匹配。单元测试通过不能证明数据迁移或产品判断正确，因此报告必须区分自动化证据、人工判断和剩余警告。合并前，我会在干净的隔离工作区重跑关键命令。'
    topics: [ai-era/ai-coding-agents]
    level: intermediate
    section: { en: 'Reviewing AI code', zh: '审查 AI 代码' }
    frequency: common
    tags: [verification, evidence, review]

  - id: coding-agent-context-management
    question: { en: 'How should a coding agent manage context in a large repository?', zh: '编程智能体应怎样管理大型仓库的上下文？' }
    answer:
      en: 'I treat context as a temporary, limited view rather than repository truth. The agent starts from project rules, the failing command, and targeted search, then reads the smallest useful files on demand. Build output, dependencies, credentials, and unrelated large data stay out. Before editing, it rereads the target or checks a digest so a stale summary cannot overwrite newer work. If history is compressed, I preserve exact approvals, changed files, failing criteria, and raw tool references. Retrieval quality matters, but authoritative facts still come from fresh file reads and command results.'
      zh: '我把上下文视为临时且有限的视图，而不是仓库真相。智能体从项目规则、失败命令和定向搜索开始，再按需读取最小有用文件集；构建产物、依赖、凭据和无关大文件不应进入上下文。编辑前要重新读取目标或检查摘要，避免旧概括覆盖新修改。压缩历史时，应保留确切批准范围、已改文件、失败条件和原始工具引用。检索质量很重要，但权威事实仍来自新的文件读取与命令结果。'
    topics: [ai-era/ai-coding-agents]
    level: advanced
    section: { en: 'Working with agents', zh: '与智能体协作' }
    frequency: occasional
    tags: [context-window, retrieval, stale-state]

  - id: coding-cli-session-preparation
    question: { en: 'How do you prepare a repository before starting an AI coding CLI?', zh: '启动 AI 编程 CLI 前，怎样准备代码仓库？' }
    answer:
      en: 'I first confirm the working directory, repository root, branch, baseline commit, and existing dirty files. I prefer an isolated branch or worktree so the session has one attributable diff. Then I write a small task contract: desired behavior, minimal reproduction, allowed paths, required commands, and non-goals. I expose only the implementation, tests, and stable project instructions needed to begin, keeping credentials, generated output, and unrelated data outside context. Finally, I check the active permission mode and make sure approval is narrow enough for the first step rather than the entire task.'
      zh: '我会先确认工作目录、仓库根目录、分支、基线提交和已有脏文件，并优先使用隔离分支或工作树，让会话只产生一份可归因差异。然后写一份小型任务合同，明确预期行为、最小复现、允许路径、必需命令和非目标。初始上下文只提供必要的实现、测试与稳定项目规则，凭据、生成物和无关数据留在外部。最后检查当前权限模式，让批准只覆盖第一步所需能力，而不是整个任务。'
    topics: [ai-era/ai-coding-cli]
    level: beginner
    section: { en: 'Tooling', zh: '工具链' }
    frequency: common
    tags: [working-directory, task-contract, worktree]

  - id: coding-cli-non-interactive-automation
    question: { en: 'What makes an AI coding CLI safe enough for non-interactive automation?', zh: 'AI 编程 CLI 满足哪些条件，才适合非交互自动化？' }
    answer:
      en: 'I need a documented machine interface, not merely a prompt flag. The process must have bounded runtime, narrow filesystem and network permissions, a minimal environment, and predictable behavior when authentication, approval, tools, or the model fail. The wrapper uses fixed executable arguments rather than shell interpolation and records its working directory, exit status, stderr, timeout, and truncation state. A separate gate then compares changed paths with the task scope and runs named acceptance checks. If output cannot be parsed or evidence is missing, the job fails closed and produces a review artifact instead of merging or deploying.'
      zh: '我需要文档明确的机器接口，而不只是一个提示参数。进程必须具备有限运行时间、严格的文件系统与网络权限、最小环境，并且在认证、审批、工具或模型失败时有可预测行为。包装器使用固定参数调用程序，不做 shell 字符串拼接，并记录工作目录、退出状态、stderr、超时和截断状态。独立交付门再把修改路径与任务范围比较，并运行指定验收检查。输出无法解析或证据缺失时，任务应失败关闭，只生成待审查产物，不能合并或部署。'
    topics: [ai-era/ai-coding-cli]
    level: intermediate
    section: { en: 'Tooling', zh: '工具链' }
    frequency: common
    tags: [non-interactive, automation, fail-closed]

  - id: coding-cli-completion-signals
    question: { en: 'Why is an AI coding CLI completion message insufficient evidence?', zh: '为什么 AI 编程 CLI 的完成消息不能作为充分证据？' }
    answer:
      en: 'A completion message is model-generated interpretation, while completion is a property of the environment. The command may not have run, may have used the wrong working directory, or may have failed after producing plausible output. I therefore inspect the baseline-to-final diff, changed-file scope, exact verification commands, process exit codes, stderr, and any skipped or truncated checks. For a defect, I also want a regression test that represents the original failure. The wrapper, not the model, derives status from those facts, and an unknown or incomplete result remains a rejection rather than being rounded up to success.'
      zh: '完成消息是模型生成的解释，而完成状态属于真实环境。命令可能没有运行，可能在错误工作目录中运行，也可能在输出看似合理的文字后失败。因此，我会检查从基线到最终状态的差异、修改文件范围、确切验证命令、进程退出码、stderr，以及任何跳过或截断的检查。缺陷修复还应有能代表原问题的回归测试。最终状态由包装器根据这些事实推导，而不是由模型决定；未知或不完整结果必须保持拒绝。'
    topics: [ai-era/ai-coding-cli]
    level: intermediate
    section: { en: 'Reviewing AI code', zh: '审查 AI 代码' }
    frequency: common
    tags: [exit-status, evidence, verification]

  - id: coding-cli-versus-ide
    question: { en: 'When would you choose an AI coding CLI instead of an AI IDE?', zh: '什么情况下会选择 AI 编程 CLI，而不是 AI IDE？' }
    answer:
      en: 'I choose based on the workflow boundary, not presumed model quality. A CLI fits SSH sessions, containers, temporary worktrees, keyboard-driven development, and repeatable tasks where standard streams, exit codes, and logs matter. An IDE is often better when visual navigation, inline diagnostics, or frequent manual editing is central. Neither interface is automatically safer: I compare which files it can read or write, how commands are approved, how context is selected, and what evidence it returns. If the task becomes automated, I also require a supported non-interactive contract rather than scripting an interactive terminal display.'
      zh: '我会根据工作流边界选择，而不是假定某个界面的模型质量更高。CLI 适合 SSH 会话、容器、临时工作树、键盘驱动开发，以及重视标准流、退出码和日志的可重复任务；需要可视化导航、行内诊断或频繁手工编辑时，IDE 往往更合适。两种界面都不会天然更安全，我会比较它们能读写哪些文件、怎样批准命令、怎样选择上下文，以及返回什么证据。若任务要自动化，还必须有受支持的非交互契约，不能直接脚本化交互终端显示。'
    topics: [ai-era/ai-coding-cli]
    level: beginner
    section: { en: 'Working with agents', zh: '与智能体协作' }
    frequency: occasional
    tags: [cli, ide, workflow]

  - id: ai-ide-context-boundary
    question: { en: 'Why is an AI IDE context not the same as the whole repository?', zh: '为什么 AI IDE 的上下文不等于整个代码库？' }
    answer:
      en: 'An IDE owns the repository view, but each model request contains a bounded selection of that state. The current file, selection, diagnostics, explicit attachments, retrieved snippets, instructions, and conversation history compete for one context window. Retrieval may miss an indirect caller or return stale indexed text, and an open tab is not proof that the model received it. I ask the tool to name its source paths and assumptions, explicitly attach authoritative contracts, and reread current files before important edits. Language-service search and repository commands then verify relationships that model context only suggested.'
      zh: 'IDE 拥有代码库视图，但每次模型请求只包含其中有限的一部分。当前文件、选区、诊断、显式附件、检索片段、项目指令与会话历史会共同占用一个上下文窗口。检索可能遗漏间接调用方，也可能返回过期索引；打开标签页并不能证明模型收到了它。我会要求工具列出依据路径与假设，显式附加权威契约，并在重要修改前重新读取当前文件。随后再用语言服务搜索和仓库命令，验证模型上下文只提出、却没有证明的关系。'
    topics: [ai-era/ai-ide]
    level: beginner
    section: { en: 'Tooling', zh: '工具链' }
    frequency: common
    tags: [context-window, retrieval, provenance]

  - id: ai-ide-multifile-review
    question: { en: 'How do you review a multi-file edit produced inside an AI IDE?', zh: '怎样审查 AI IDE 生成的多文件修改？' }
    answer:
      en: 'I begin with the baseline and changed-file list, because a fluent summary can omit configuration, lockfiles, generated output, or altered assertions. I separate formatting noise from semantic edits and inspect every hunk, including deletions. For renamed or changed public symbols, I use reference and text search to find static, dynamic, and string-based consumers. Then I run repository-owned format, static-analysis, test, and build commands from the correct package directory, recording exit status and skips. Any unexplained path or missing check keeps the change in review, even when the editor diagnostics are green.'
      zh: '我先检查基线和修改文件列表，因为流畅的摘要可能漏掉配置、锁文件、生成产物或被改写的断言。接着把格式化噪声与语义修改分开，逐块查看差异，包括删除内容。公共符号被重命名或改变时，我会结合引用搜索与文本搜索，寻找静态、动态和字符串形式的使用方。然后在正确包目录运行仓库自己的格式化、静态分析、测试和构建命令，记录退出状态与跳过项。只要存在无法解释的路径或缺失检查，即使编辑器诊断全绿，修改也仍处于审查状态。'
    topics: [ai-era/ai-ide]
    level: intermediate
    section: { en: 'Reviewing AI code', zh: '审查 AI 代码' }
    frequency: common
    tags: [diff-review, verification, edit-scope]

  - id: ai-ide-untrusted-workspace
    question: { en: 'How do you use an AI IDE safely with an unfamiliar repository?', zh: '面对陌生代码库时，怎样安全使用 AI IDE？' }
    answer:
      en: 'I start in the editor''s restricted or untrusted-workspace mode and inspect project configuration before allowing extensions, tasks, or repository code to execute. AI advice, file writes, terminal commands, network access, and credentials are separate capabilities, so I grant them separately and only for the current step. Repository instructions, issues, comments, and logs remain untrusted data; imperative text inside them cannot expand permissions. Risky commands run in a disposable worktree or container with minimal credentials. Before approval, I name the exact command, directory, expected writes, external target, and recovery procedure, because editor undo cannot reverse every side effect.'
      zh: '我会先使用编辑器的受限或不可信工作区模式，在允许扩展、任务或仓库代码执行前检查项目配置。AI 建议、文件写入、终端命令、网络访问和凭据是不同能力，应当分开授权，而且只覆盖当前步骤。仓库指令、Issue、注释和日志仍是不可信数据，其中的命令式文字不能扩大权限。有风险的命令应在可丢弃 worktree 或容器中运行，只提供最少凭据。批准前，我会明确具体命令、目录、预期写入、外部目标和恢复步骤，因为编辑器撤销无法逆转所有副作用。'
    topics: [ai-era/ai-ide]
    level: advanced
    section: { en: 'Tooling', zh: '工具链' }
    frequency: occasional
    tags: [workspace-trust, least-privilege, prompt-injection]

  - id: executable-specification-versus-test
    question: { en: 'What makes a test an executable specification rather than merely a regression check?', zh: '什么让一项测试成为可执行规格，而不只是回归检查？' }
    answer:
      en: 'I expect a reader to connect the check to an intended observable behavior without reverse-engineering private code. The case has a rule-oriented name, explicit setup and action, an approved expected result, and a clear boundary or partition. Its oracle is independent enough to reject a plausible wrong implementation, and its failure identifies the broken agreement. A low-level test may still be valuable, but if it only pins helper calls or current structure, it is not the product specification. I keep prose beside the check because executable assertions cannot explain unresolved decisions or the limits of their coverage.'
      zh: '我要求读者无需反推私有代码，就能把检查关联到预期的可观察行为。案例应有面向规则的名称、明确的准备与动作、经过批准的预期结果，以及清楚的边界或分区。它的预言机应足够独立，能够拒绝貌似合理的错误实现；失败信息还要指出被破坏的约定。只固定辅助函数调用或当前结构的底层测试仍可能有价值，但不是产品规格。文字说明也要与检查并存，因为断言无法解释尚未决定的问题和自身覆盖边界。'
    topics: [ai-era/executable-specifications]
    level: beginner
    section: { en: 'Specs and tests', zh: '规格与测试' }
    frequency: common
    tags: [executable-specification, observable-behavior, acceptance-criteria]

  - id: executable-specification-boundary-selection
    question: { en: 'How do you choose examples for an ambiguous numeric boundary?', zh: '面对有歧义的数值边界时，怎样选择示例？' }
    answer:
      en: 'I first settle the unit, rounding rule, and comparison operator with the product owner. Then I add adjacent named cases immediately below and at the boundary, and often one representative above it. For a 5,000-cent inclusive threshold, 4,999 must show the old outcome and 5,000 the new one. I also test invalid values and any rule that can override the threshold, such as expedited delivery or destination. This small set distinguishes common wrong implementations better than many distant happy-path values. Any row whose outcome is still disputed remains an explicit open decision rather than an agent-generated expectation.'
      zh: '我会先和产品负责人确定单位、舍入规则与比较运算符，再在边界紧邻下方和边界本身放置具名案例，通常还会选择一个边界以上的代表。对于包含 5,000 分的阈值，4,999 必须显示旧结果，5,000 必须显示新结果。我还会检查无效值，以及可能覆盖阈值的规则，例如加急配送或目的地。这组小案例比大量远离边界的快乐路径更能区分常见错误实现。结果仍有争议的行应明确保留为开放决定，不能交给智能体生成预期。'
    topics: [ai-era/executable-specifications]
    level: beginner
    section: { en: 'Specs and tests', zh: '规格与测试' }
    frequency: common
    tags: [boundary-value, equivalence-partition, counterexample]

  - id: executable-specification-oracle-independence
    question: { en: 'Why must a test oracle be independent of the implementation under test?', zh: '为什么测试预言机必须独立于被测实现？' }
    answer:
      en: 'The oracle is the authority that labels observed behavior correct or incorrect. If expected values come from the same production formula, generated lookup table, database query, or model response as the implementation, the same misunderstanding can appear on both sides and pass. Independence is therefore about data flow, not different filenames. I prefer literal outcomes approved by a policy owner, protocol examples from a pinned standard, or a small reference model built from different primitives. I also mutate a boundary or precedence branch and confirm a relevant check fails. A surviving mutation exposes a weak property or a missing case.'
      zh: '预言机是把观察行为判为正确或错误的权威依据。如果预期值与实现来自同一份生产公式、生成的查找表、数据库查询或模型响应，同一种误解就可能同时出现在两侧并通过检查。因此，独立性是数据流问题，不是文件名是否不同。我优先使用策略负责人批准的字面结果、固定版本标准中的协议示例，或用不同原语构建的小型参考模型。我还会修改边界或优先级分支，并确认相关检查会失败；存活的修改说明性质太弱或案例缺失。'
    topics: [ai-era/executable-specifications]
    level: intermediate
    section: { en: 'Reviewing AI code', zh: '审查 AI 代码' }
    frequency: common
    tags: [test-oracle, independence, mutation]

  - id: executable-specification-completion-evidence
    question: { en: 'What evidence should an agent return after implementing an executable specification?', zh: '智能体实现可执行规格后应返回哪些证据？' }
    answer:
      en: 'I want the exact specification and broader test commands, their working directories, runtime version, exit codes, and named failures or skips. For a changed behavior, I also want the new check to fail on the old or deliberately broken implementation before it passes on the candidate; that red-green sequence shows the check is sensitive to the intended defect. The final diff must stay within scope, and every acceptance criterion should map to a check or an explicit human-review item. A model summary is useful for navigation, but the host-captured process result and reviewed expected values are the actual evidence.'
      zh: '我需要确切的规格检查与更广测试命令、各自工作目录、运行时版本、退出码，以及具名失败或跳过项。行为发生变化时，新检查还应先在旧实现或特意破坏的实现上失败，再在候选实现上通过；这段红绿序列说明检查对目标缺陷确实敏感。最终差异必须保持在范围内，每条验收标准都应映射到检查或明确的人工审查项。模型摘要便于导航，但宿主捕获的进程结果和经过审查的预期值才是真正证据。'
    topics: [ai-era/executable-specifications]
    level: intermediate
    section: { en: 'Reviewing AI code', zh: '审查 AI 代码' }
    frequency: occasional
    tags: [verification-evidence, red-green, traceability]

  - id: agent-context-initial-working-set
    question: { en: 'How do you choose the initial context for a coding agent?', zh: '怎样为编程智能体选择初始上下文？' }
    answer:
      en: 'I begin with the exact task contract: desired behavior, reproducer, allowed paths, required checks, and non-goals. Then I resolve applicable repository instructions and record the repository root, revision, worktree status, package directory, and runtime. The first code set comes from concrete signals such as a failing test, stack frame, named symbol, or diagnostic. I include the relevant implementation, contract, configuration, and closest tests, with a reason for each path. Generated output, dependencies, credentials, and unrelated logs remain excluded until specific evidence makes one necessary.'
      zh: '我先明确任务契约，包括预期行为、复现方法、允许路径、必需检查和非目标。随后解析适用的仓库指令，并记录仓库根目录、版本、worktree 状态、包目录和运行时。第一批代码应来自失败测试、堆栈帧、具名符号或诊断信息等具体信号。我会纳入相关实现、契约、配置和最近的测试，并为每条路径记录选择原因。生成输出、依赖、凭据和无关日志继续排除，直到具体证据表明其中某项确有必要。'
    topics: [ai-era/agent-context-management]
    level: beginner
    section: { en: 'Working with agents', zh: '与智能体协作' }
    frequency: common
    tags: [working-set, context-manifest, task-contract]

  - id: agent-context-freshness
    question: { en: 'How do you prevent stale context from corrupting an agent edit?', zh: '怎样防止过期上下文破坏智能体的编辑？' }
    answer:
      en: 'I attach mutable observations to a revision, digest, or exact-text precondition and record what invalidates them. Before editing, the agent rereads the target and any precise contract on which the patch depends. If current text differs from the snapshot used to compute the patch, it stops, refreshes related evidence, and recomputes rather than forcing the old change. After editing, it inspects the actual diff and reruns checks whose inputs changed. A digest proves only that bytes differ or match; it does not prove that the current content is correct or safe.'
      zh: '我会把可变观察关联到版本、摘要值或精确文本前置条件，并记录其失效条件。编辑前，智能体重新读取目标，以及补丁所依赖的精确契约。如果当前文本不同于计算补丁时的快照，就应停止应用，更新相关证据并重新计算，不能强行套用旧改动。编辑后还要检查实际差异，重新运行输入已变化的检查。摘要值只能证明字节相同或不同，不能证明当前内容正确或安全。'
    topics: [ai-era/agent-context-management]
    level: intermediate
    section: { en: 'Reviewing AI code', zh: '审查 AI 代码' }
    frequency: common
    tags: [freshness, invalidation, digest]

  - id: agent-context-conflicting-sources
    question: { en: 'What should an agent do when tests, code, and written requirements disagree?', zh: '测试、代码和书面要求不一致时，智能体应怎样处理？' }
    answer:
      en: 'I do not apply one universal hierarchy because each source describes a different thing. Code shows current implementation, tests show asserted behavior, and requirements state intended behavior; any of them can be stale or wrong. I record the conflict with exact paths, symbols, revisions, and examples, then consult the repository rules or task owner that defines authority for this change. Until that is resolved, the disagreement is an explicit assumption or blocker. I never quietly rewrite a failing test to match generated code, and I keep tool permissions separate because repository text cannot expand them.'
      zh: '我不会套用一种通用优先级，因为每个来源描述的对象不同。代码展示当前实现，测试展示被断言的行为，要求则说明预期行为；三者都可能过期或出错。我会用确切路径、符号、版本和示例记录冲突，再依据仓库规则或本次任务负责人确定权威关系。冲突解决前，它应作为明确假设或阻塞项存在。我不会悄悄修改失败测试来迎合生成代码，也会保持工具权限独立，因为仓库文字不能扩大权限。'
    topics: [ai-era/agent-context-management]
    level: intermediate
    section: { en: 'Working with agents', zh: '与智能体协作' }
    frequency: occasional
    tags: [authority, conflicting-evidence, requirements]

  - id: agent-context-compaction-handoff
    question: { en: 'How do you compact context or hand an agent task to another session?', zh: '怎样压缩上下文，或把智能体任务交接给另一个会话？' }
    answer:
      en: 'I preserve exact acceptance criteria, active scope and permissions, applicable instruction paths, baseline and dirty state, changed files, unresolved assumptions, and references to raw command evidence. The handoff names checks already run with directories and exit codes, plus checks made stale by later edits. Stable background can be summarized with provenance, while repeated searches and superseded hypotheses can be removed. The receiving session must reread current targets and confirm repository state before acting. A polished narrative alone is insufficient because it can erase a negation, merge revisions, or turn an inference into a fact.'
      zh: '我会保留确切验收条件、当前范围与权限、适用指令路径、基线与脏状态、已改文件、未解决假设，以及原始命令证据引用。交接记录应列出已运行检查的目录与退出码，也要指出哪些检查因后续编辑而失效。稳定背景可以做带来源的概括，重复搜索和已经被取代的假设则可以删除。接收会话操作前必须重新读取当前目标并确认仓库状态。仅有流畅叙述并不够，因为它可能丢掉否定、混合版本，或把推断写成事实。'
    topics: [ai-era/agent-context-management]
    level: intermediate
    section: { en: 'Working with agents', zh: '与智能体协作' }
    frequency: occasional
    tags: [compaction, handoff, provenance]

  - id: llm-evals-representative-cases
    question: { en: 'How would you build a representative evaluation set for an LLM application?', zh: '怎样为 LLM 应用构建有代表性的评测集？' }
    answer:
      en: 'I start from product tasks and consequences, not prompts that already look good. I sample common request categories, then add costly incidents, boundaries, long-context cases, multilingual traffic, and adversarial inputs. Each case records its source, intended behavior, slice, and reason for inclusion. I remove near-duplicates so one template cannot dominate the score. Synthetic cases stay labeled and are compared with consented production patterns. I use a visible development set for iteration and a locked release set, then version both so score changes are never confused with case-set changes.'
      zh: '我会从产品任务和故障后果出发，而不是从已经表现良好的提示词出发。先抽样常见请求类别，再加入高代价事故、边界情况、长上下文、多语言流量和对抗输入。每个用例都记录来源、预期行为、所属切片和纳入原因，并删除近似重复项，避免一种模板支配分数。合成用例要明确标记，并与经过同意的生产模式比较。开发集供日常迭代，锁定的发布集负责交付门，两者都要建立版本。'
    topics: [ai-era/llm-application-evals]
    level: advanced
    section: { en: 'Specs and tests', zh: '规格与测试' }
    frequency: common
    tags: [evaluation-set, sampling, slices]

  - id: llm-evals-scorer-selection
    question: { en: 'How do you choose between deterministic checks, human review, and an LLM judge?', zh: '怎样在确定性检查、人工审查和 LLM 评审器之间选择？' }
    answer:
      en: 'I use the cheapest scorer that can establish the claim. Code should check schemas, identifiers, numeric tolerances, allowed citations, tool arguments, and forbidden secrets. A written rubric is appropriate when several outputs can be correct but quality still has observable criteria. Humans own high-stakes meaning, disputed labels, and calibration. An LLM judge can scale a stable rubric only after comparison with blinded human labels. I version its model and prompt, test order effects and injection resistance, and preserve an unable-to-grade path rather than forcing every row into a score.'
      zh: '我会选择能够证明目标结论的最低成本评分方式。模式、标识符、数值容差、允许引用、工具参数和禁止泄露的机密应由代码检查。多个输出都可能正确，但质量仍有可观察标准时，可以使用书面量表。高风险语义、争议标签和校准由人工负责。LLM 评审器只有在与盲测人工标签比较后，才适合大规模应用稳定量表；它的模型与提示词必须建立版本，还要测试顺序效应、注入抵抗，并保留无法评分状态。'
    topics: [ai-era/llm-application-evals]
    level: advanced
    section: { en: 'Specs and tests', zh: '规格与测试' }
    frequency: common
    tags: [deterministic-grader, llm-judge, grader-calibration]

  - id: llm-evals-regression-gate
    question: { en: 'How would you define a regression gate for nondeterministic LLM behavior?', zh: '怎样为非确定性的 LLM 行为定义回归交付门？' }
    answer:
      en: 'I write the policy before running the candidate. It names an absolute quality floor, the tolerated baseline delta, protected slice limits, minimum sample sizes, and non-compensable hard gates. Baseline and candidate run on identical inputs with symmetric retry rules and enough independent trials for the decision risk. I retain paired, trial-level results and report intervals rather than only point estimates. If an interval spans both allowed and forbidden regions, the result is inconclusive. Safety, privacy, and authorization failures remain outside averages even when the weighted quality score passes.'
      zh: '我会在运行候选版本前写好政策，明确绝对质量下限、相对基线的允许变化、受保护切片限制、最小样本量，以及不可补偿的硬门槛。基线与候选版本处理相同输入，使用对称重试政策，并按决策风险运行足够多的独立试验。我会保留配对的试验级结果，同时报告区间而不只给点估计。区间跨越允许与禁止区域时，结论应为不明确。安全、隐私和授权故障始终位于平均值之外。'
    topics: [ai-era/llm-application-evals]
    level: advanced
    section: { en: 'Reviewing AI code', zh: '审查 AI 代码' }
    frequency: common
    tags: [regression-threshold, hard-gate, uncertainty]

  - id: llm-evals-debug-score-change
    question: { en: 'An aggregate eval score changed after a prompt update. How do you investigate?', zh: '提示词更新后，评测总分发生变化。你会怎样调查？' }
    answer:
      en: 'I first verify that the suite, fixtures, model settings, grader, denominators, and threshold policy stayed fixed. Then I inspect newly failing and newly passing paired rows, grouped by predefined slices, instead of guessing from the mean. I separate application errors, grader errors, timeouts, and missing outputs because each needs different treatment. Tool traces, retrieved documents, citations, and criterion-level reasons help locate the changed component. I reproduce representative regressions with controlled runs, revise the candidate, and rerun the unchanged gate. I do not move thresholds merely because the candidate missed them.'
      zh: '我会先确认套件、夹具、模型设置、评审器、分母和阈值政策都没有变化。然后按预先定义的切片检查新失败与新通过的配对记录，而不是根据平均值猜原因。应用错误、评审器错误、超时和缺失输出要分开，因为处理方式不同。工具轨迹、检索文档、引用和各项标准的理由有助于定位变化组件。我会通过受控运行复现代表性回归，修订候选版本，再运行原封不动的交付门；不能只因候选版本未通过就移动阈值。'
    topics: [ai-era/llm-application-evals]
    level: advanced
    section: { en: 'Reviewing AI code', zh: '审查 AI 代码' }
    frequency: occasional
    tags: [regression-analysis, paired-comparison, evidence]

  - id: generated-review-first-pass
    question: { en: 'What is your first pass over an AI-generated multi-file change?', zh: '你会怎样对 AI 生成的多文件改动进行第一轮审查？' }
    answer:
      en: 'I establish the exact baseline and compare the complete changed-file list with the task scope before reading the author summary. I inspect additions, deletions, renames, tests, configuration, lockfiles, and generated artifacts. Then I rewrite the request as observable acceptance criteria and classify each semantic edit: contract, control flow, mutation, persistence, permissions, or tooling. This exposes unrelated cleanup and missing companion changes early. Only after the scope and intent agree do I inspect each changed function in its full file context and begin tracing its callers and effects.'
      zh: '我会先确定确切基线，把完整改动文件列表与任务范围比较，而不是先看作者摘要。新增、删除、重命名、测试、配置、锁文件和生成产物都要检查。然后把请求改写成可观察的验收条件，并给每项语义修改分类，例如契约、控制流、修改、持久化、权限或工具链。这样能尽早发现无关清理与缺失的配套改动。只有当范围和意图一致后，我才在完整文件上下文中检查函数，并开始追踪调用方与作用。'
    topics: [ai-era/generated-change-review]
    level: intermediate
    section: { en: 'Reviewing AI code', zh: '审查 AI 代码' }
    frequency: common
    tags: [diff-review, task-contract, edit-scope]

  - id: generated-review-impact-cone
    question: { en: 'How do you determine the impact of a generated contract change across a repository?', zh: '怎样判断生成式契约变化在代码库中的影响？' }
    answer:
      en: 'I write the old and new input, output, error, mutation, ordering, and side-effect contracts, then treat each changed definition as the start of an impact cone. Semantic reference search finds typed callers, implementations, and re-exports; text search finds route names, serializers, reflection, dependency-injection keys, fixtures, and scripts. I trace inputs upstream and observable effects downstream until I reach unchanged boundaries whose contracts still hold. External consumers and dynamic links that cannot be searched remain explicit risks, usually covered with contract tests, compatibility adapters, release coordination, or a staged rollout.'
      zh: '我会写出新旧输入、输出、错误、修改、顺序和副作用契约，再把每个改变的定义当作影响锥起点。语义引用搜索用于寻找强类型调用方、实现和再导出；文本搜索用于寻找路由名、序列化器、反射、依赖注入键、夹具和脚本。我向上游追踪输入，向下游追踪可观察作用，直到到达契约仍成立的未修改边界。无法搜索的外部使用方与动态连接必须保留为显式风险，通常用契约测试、兼容适配器、发布协调或分阶段上线来处理。'
    topics: [ai-era/generated-change-review]
    level: advanced
    section: { en: 'Reviewing AI code', zh: '审查 AI 代码' }
    frequency: common
    tags: [impact-cone, api-contract, call-site-audit]

  - id: generated-review-test-independence
    question: { en: 'How do you decide whether generated tests are independent evidence?', zh: '怎样判断生成的测试是否属于独立证据？' }
    answer:
      en: 'I ask where the expected result came from. A requirement, protocol example, production regression, hand-computed invariant, or unchanged characterization test can supply an oracle independent of the implementation. Copying the generated expression into an assertion, blindly updating a snapshot, or mocking away the changed boundary cannot. I also choose observations that cover the whole contract: return value, input mutation, stored state, emitted events, and forbidden side effects on failure. When feasible, I run the new regression test against the baseline; if it already passes, it may not distinguish the claimed fix.'
      zh: '我会先问预期结果来自哪里。需求、协议示例、生产回归案例、手工计算的不变量或未改动的特征测试，都能提供独立于实现的判据。把生成表达式复制进断言、盲目更新快照，或通过模拟绕开变化边界，都不算独立证据。我还会选择覆盖完整契约的观察，包括返回值、输入修改、存储状态、发出事件和失败时禁止出现的副作用。条件允许时，我会在基线上运行新回归测试；如果它原本就通过，可能无法区分声称的修复。'
    topics: [ai-era/generated-change-review]
    level: intermediate
    section: { en: 'Testing and evidence', zh: '测试与证据' }
    frequency: common
    tags: [test-oracle, characterization-test, regression]

  - id: generated-review-maintainability
    question: { en: 'How do you review maintainability without reducing the review to style preferences?', zh: '怎样审查可维护性，同时避免把审查变成风格偏好？' }
    answer:
      en: 'I connect structure to a plausible future defect. Duplicated validation can drift, a hidden mutation can violate ownership, an unnamed Boolean can be inverted by a caller, and a broad catch can erase failure semantics. I search for repository-owned validators, adapters, errors, transaction helpers, and fixtures before accepting a parallel generated abstraction. I also resist speculative generalization when there is only one use case. Blocking comments explain the failure mechanism and violated invariant; optional naming or layout suggestions are labeled separately and come after correctness, security, compatibility, data effects, and verification findings.'
      zh: '我会把结构问题与合理的未来缺陷联系起来。重复验证可能漂移，隐藏修改可能违反所有权，无名称布尔值可能被调用方颠倒，宽泛捕获可能抹掉失败语义。接受生成的平行抽象前，我会搜索代码库已有的验证器、适配器、错误、事务辅助函数和夹具。只有一个用例时，我也会避免推测性泛化。阻塞评论要解释失败机制与被违反的不变量；可选的命名或布局建议应单独标明，并排在正确性、安全、兼容性、数据作用和验证发现之后。'
    topics: [ai-era/generated-change-review]
    level: advanced
    section: { en: 'Reviewing AI code', zh: '审查 AI 代码' }
    frequency: occasional
    tags: [maintainability, invariants, review-priority]

  - id: agent-plan-from-vague-goal
    question: { en: 'How do you turn a vague coding goal into an executable agent plan?', zh: '怎样把模糊的编码目标转换为可执行的智能体计划？' }
    answer:
      en: 'I first rewrite the goal as observable delivery behavior, then record the repository baseline, allowed write scope, non-goals, and required acceptance checks. The first step is bounded exploration when ownership is unknown. Later steps follow evidence boundaries: reproduce the current behavior, make the narrowest implementation change, run the focused check, run broader risk-matched checks, and inspect the final diff. Each step names its dependencies, expected observation, and failure policy. I also define distinct complete, paused, failed, cancelled, and budget-exhausted states before execution begins.'
      zh: '我先把目标改写成可观察的交付行为，再记录代码库基线、允许写入范围、非目标和必需验收检查。如果行为所有者未知，第一步就是有边界的探索。后续步骤沿证据边界展开：复现当前行为、做最小实现改动、运行聚焦检查、执行与风险匹配的更广检查，最后检查完整差异。每个步骤都说明依赖关系、预期观察结果和失败策略。执行开始前，我还会区分完成、暂停、失败、取消和预算耗尽状态。'
    topics: [ai-era/agent-task-planning]
    level: intermediate
    section: { en: 'Working with agents', zh: '与智能体协作' }
    frequency: common
    tags: [task-contract, task-decomposition, checkpoint]

  - id: agent-plan-checkpoint-design
    question: { en: 'What makes a checkpoint strong enough to control an agent plan?', zh: '什么样的检查点足以控制智能体计划？' }
    answer:
      en: 'A checkpoint names the observation source and the acceptance rule. For a command I want the exact arguments, working directory, expected exit status, relevant output, timeout, and truncation state. Expected failure must be specific: a regression test failing with the known wrong value is evidence, while a crash or unrelated import error is not. The controller evaluates this evidence outside the model and unlocks dependents only after it matches. I also bind the result to a baseline, because a later edit can make an earlier green check stale.'
      zh: '检查点要同时说明观察来源和接受规则。对于命令，我需要确切参数、工作目录、预期退出状态、相关输出、超时和截断状态。预期失败必须具体：回归测试以已知错误值失败可以作为证据，崩溃或无关导入错误则不行。控制器应在模型之外求值这些证据，只有匹配后才解锁依赖步骤。结果还要绑定基线，因为后续编辑可能使先前的绿灯检查过时。'
    topics: [ai-era/agent-task-planning]
    level: intermediate
    section: { en: 'Testing and evidence', zh: '测试与证据' }
    frequency: common
    tags: [checkpoint, evidence, baseline]

  - id: agent-plan-replanning-authority
    question: { en: 'How should an agent replan when repository evidence contradicts its original plan?', zh: '代码库证据与原计划冲突时，智能体应怎样重新规划？' }
    answer:
      en: 'I preserve the task contract and revise the route. The new plan version records the triggering observation, changed steps, and checkpoints made stale. If the discovery only corrects file ownership inside the authorized scope, the agent can refine the next steps and continue. If progress needs another path, dependency, migration, credential, network target, or product decision, it pauses with the smallest proposed expansion and supporting evidence. Replanning never grants authority by itself. After approval or rejection, the controller resumes from a valid checkpoint or ends in a distinct terminal state.'
      zh: '我会保留任务合同，只修改执行路线。新计划版本要记录触发变化的观察结果、改动的步骤，以及因此过时的检查点。如果新发现只是纠正授权范围内的文件所有权，智能体可以细化后续步骤并继续。若推进需要其他路径、依赖、迁移、凭据、网络目标或产品决定，就应带着证据和最小范围扩展提议暂停。重新规划本身不会授予权限。批准或拒绝后，控制器应从仍有效的检查点恢复，或进入明确的终止状态。'
    topics: [ai-era/agent-task-planning]
    level: advanced
    section: { en: 'Working with agents', zh: '与智能体协作' }
    frequency: common
    tags: [replanning, approval-gate, scope]

  - id: agent-plan-stopping-policy
    question: { en: 'Which stopping conditions do you define for a coding agent, and why?', zh: '你会为编程智能体定义哪些停止条件，为什么？' }
    answer:
      en: 'I define verified completion, scope or authority violation, denied approval, cancellation, hard time or cost limits, maximum repair attempts, and repeated failure without new evidence. The controller evaluates them in a documented order, with scope checks before completion, so green tests cannot hide an unauthorized edit. No-progress detection compares observable fingerprints such as the failing check, normalized error, changed paths, and proposed next action rather than comparing prose. Every terminal state retains its reason, open checkpoints, and last useful evidence. Budget exhaustion is never rounded up to success.'
      zh: '我会定义验证完成、范围或权限违规、批准被拒、取消、时间或成本硬限制、最大修复次数，以及没有新证据的重复失败。控制器按文档规定的顺序求值，并把范围检查放在完成之前，使绿灯测试不能掩盖未授权编辑。无进展判定比较失败检查、规范化错误、修改路径和拟议操作等可观察指纹，而不是比较措辞。每种终止状态都保留原因、未通过检查点和最后一份有用证据；预算耗尽绝不能被向上取整为成功。'
    topics: [ai-era/agent-task-planning]
    level: advanced
    section: { en: 'Reliability', zh: '可靠性' }
    frequency: common
    tags: [stopping-condition, no-progress, budget]

  - id: ai-debugging-evidence-loop
    question: { en: 'How do you use an AI assistant without letting it guess its way through a bug?', zh: '怎样使用 AI 助手调试，同时避免它靠猜测推进？' }
    answer:
      en: 'I begin with an exact reproduction, expected and actual behavior, runtime version, and unedited failure output. I ask the assistant for a small set of competing hypotheses, each with a mechanism, predicted observation, and result that would refute it. We then choose the cheapest safe check that separates those predictions and run it against the real program. I keep observations distinct from inference in an evidence ledger. I request a fix only after one explanation accounts for the failing and passing cases, then require a regression check to fail before the edit and pass afterward.'
      zh: '我会先准备准确复现、期望与实际行为、运行时版本，以及未经编辑的失败输出。接着要求助手给出少量竞争假设，每项都包含作用机制、预期观察和能否定它的结果。然后选择成本最低且安全、能区分这些预测的检查，并在真实程序上运行。我会在证据账本中分开记录观察与推断。只有一个解释同时覆盖失败与通过用例后，才请求修复；回归检查还必须在编辑前失败、编辑后通过。'
    topics: [ai-era/ai-assisted-debugging]
    level: intermediate
    section: { en: 'Reviewing AI code', zh: '审查 AI 代码' }
    frequency: common
    tags: [debugging, hypotheses, runtime-evidence]

  - id: ai-debugging-discriminating-check
    question: { en: 'What makes a debugging check discriminating?', zh: '什么样的调试检查才有区分度？' }
    answer:
      en: 'A discriminating check makes the leading hypotheses predict different observations. I hold most conditions constant and vary one disputed factor, such as status code on both sides of the same retry boundary. Before running it, I write what each outcome would imply; otherwise it is easy to reinterpret any result as support. Boundary checks are especially useful: compare a value before and after parsing, at caller and callee, or at cache lookup and return. If every hypothesis predicts the same result, the check may collect data, but it will not narrow the causal search.'
      zh: '有区分度的检查会让领先假设预测出不同观察。我会保持大多数条件不变，只改变一个有争议的因素，例如在同一重试边界两侧改变状态码。执行前先写出每种结果意味着什么，否则很容易事后把任何输出解释成支持。边界检查尤其有效，可以比较解析前后、调用方与被调用方，或缓存查询与返回处的值。如果所有假设预测同一结果，这项检查或许能收集数据，却不能缩小因果搜索范围。'
    topics: [ai-era/ai-assisted-debugging]
    level: intermediate
    section: { en: 'Testing and evidence', zh: '测试与证据' }
    frequency: common
    tags: [discriminating-check, counterexample, fault-localization]

  - id: ai-debugging-diagnostic-patch
    question: { en: 'How do you review an AI-generated diagnostic patch?', zh: '怎样审查 AI 生成的诊断补丁？' }
    answer:
      en: 'I first verify that the patch observes behavior rather than changing it. Generated diagnostics often add retries, broad catches, defaults, or sleeps, which can hide the original failure. For every probe I check the exact boundary, fields collected, volume, cardinality, destination, retention, and timing effect. Tokens, bodies, and customer data stay out or are redacted. I also look for getters, iterators, and serialization that may have side effects. After evidence collection, temporary probes are removed systematically; anything retained becomes normal production observability with ownership, stable fields, tests, and bounded cost.'
      zh: '我先确认补丁只观察行为，没有改变行为。生成式诊断常加入重试、宽泛捕获、默认值或休眠，这些改动会隐藏原始故障。对每个探针，我都会检查准确边界、收集字段、数据量、基数、去向、保留期和时序影响。令牌、正文与客户数据必须排除或脱敏。我还会检查访问器、迭代器和序列化是否产生副作用。证据收集结束后，要系统删除临时探针；有意保留的部分则应按生产观察设施管理，具备所有者、稳定字段、测试与有界成本。'
    topics: [ai-era/ai-assisted-debugging]
    level: advanced
    section: { en: 'Reviewing AI code', zh: '审查 AI 代码' }
    frequency: occasional
    tags: [instrumentation, probe-effect, data-safety]

  - id: ai-debugging-nondeterministic-failure
    question: { en: 'How would you investigate an intermittent failure with an AI pair?', zh: '怎样与 AI 结对调查间歇性故障？' }
    answer:
      en: 'I record the seed, concurrency level, scheduler controls, resource limits, probe configuration, and occurrence count over a stated number of trials. A run where the symptom does not appear is not a fix. I ask the AI to propose a contested ordering or lifecycle event, then replace arbitrary sleeps with barriers, fake clocks, controlled dependency responses, or resource ownership markers. Traces need request or task identifiers because collector arrival order may not be causal order. After isolating the mechanism, the regression test should force that ordering deterministically and verify both the failure behavior and cleanup path.'
      zh: '我会记录随机种子、并发级别、调度控制、资源限制、探针配置，以及明确试验次数中的出现次数。某次没有出现症状不能算修复。我会让 AI 提出有争议的事件顺序或生命周期节点，再用屏障、伪时钟、受控依赖响应或资源所有权标记替代任意休眠。跟踪记录需要请求或任务标识，因为到达收集器的顺序未必是因果顺序。机制隔离后，回归测试应确定性地强制该顺序，并验证失败行为与清理路径。'
    topics: [ai-era/ai-assisted-debugging]
    level: advanced
    section: { en: 'Testing and evidence', zh: '测试与证据' }
    frequency: occasional
    tags: [nondeterminism, concurrency, regression]

  - id: agent-guardrail-risk-selection
    question: { en: 'How do you choose guardrail tests for an agent task?', zh: '怎样为智能体任务选择护栏测试？' }
    answer:
      en: 'I start from credible failure modes in the requested change, not from a target coverage percentage. For each risk I name the stable observation and choose the narrowest honest test layer. A boundary edit gets values below, at, and above the threshold; authorization gets a second identity; a write path gets collaborator failure and a no-side-effect assertion. I keep implementation choices open unless an internal property is itself contractual. Finally, I record the focused command and the broader suite that must pass, while listing product or operational claims the tests cannot establish.'
      zh: '我会从改动的可信失败模式出发，而不是先定一个覆盖率目标。每项风险都要对应稳定的观察，并选择能够如实验证它的最窄测试层级。边界改动应检查阈值下方、恰好等于和上方；授权规则应加入第二个身份；写入路径应模拟协作者失败，并断言没有副作用。除非内部属性本身属于契约，否则要给实现选择留出空间。最后，我会记录必须通过的聚焦命令和更广测试套件，同时列出测试无法证明的产品或运维声明。'
    topics: [ai-era/tests-as-agent-guardrails]
    level: intermediate
    section: { en: 'Testing and evidence', zh: '测试与证据' }
    frequency: common
    tags: [risk-based-testing, boundary-value, negative-assertion]

  - id: agent-guardrail-red-green-proof
    question: { en: 'How do you prove that a regression test actually guards a defect?', zh: '怎样证明一项回归测试确实约束了缺陷？' }
    answer:
      en: 'I run the focused test against the uncorrected baseline and expect it to fail at the assertion that represents the defect. Then I apply the fix and require the same test to pass before running the surrounding suite. If the baseline is hard to restore safely, I introduce a small deliberate fault, such as reversing the relevant comparison or removing validation, and confirm the test rejects it. I inspect the failure cause because a broken fixture or import proves nothing. This red-green evidence connects the test to the claimed correction instead of merely showing that new test code executes.'
      zh: '我会先在未修正的基线上运行聚焦测试，并要求它在代表缺陷的断言处失败。随后应用修复，让同一测试通过，再运行周边测试套件。如果难以安全恢复基线，我会加入一个很小的刻意缺陷，例如反转相关比较或删除校验，并确认测试会拒绝它。我还会检查具体失败原因，因为损坏的夹具或导入错误不能证明任何行为。这样的红绿证据把测试与声称的修正连接起来，而不是只说明新增测试代码得到执行。'
    topics: [ai-era/tests-as-agent-guardrails]
    level: intermediate
    section: { en: 'Testing and evidence', zh: '测试与证据' }
    frequency: common
    tags: [regression-test, red-green, counterfactual]

  - id: agent-guardrail-test-integrity
    question: { en: 'How do you stop an agent from weakening tests to make a patch pass?', zh: '怎样防止智能体通过削弱测试来让补丁通过？' }
    answer:
      en: 'I treat test changes as security-sensitive evidence changes, not as an automatic part of implementation work. The task names which test files may change and why. During review I inspect deleted assertions, changed expected values, snapshot updates, broader mocks, new skips, discovery configuration, and test counts separately from source edits. Critical acceptance tests can live behind ownership rules or in a gate the task cannot modify. After the final edit, an independent runner executes fixed commands and records the revision, working directory, exit code, skipped tests, and truncated output. Any unexplained weakening keeps the patch unaccepted.'
      zh: '我把测试改动视为对敏感证据的修改，而不是实现工作自动附带的一部分。任务应写明哪些测试文件可以改，以及原因。审查时，我会把删除断言、修改预期值、更新快照、放宽模拟对象、新增跳过、改变发现配置和测试数量，与源码改动分开检查。关键验收测试可以受所有权规则保护，或放进任务无法修改的交付门。最终编辑完成后，独立运行器执行固定命令，并记录修订版本、工作目录、退出码、跳过测试和截断输出。任何无法解释的削弱都会阻止补丁获得验收。'
    topics: [ai-era/tests-as-agent-guardrails]
    level: advanced
    section: { en: 'Reviewing AI code', zh: '审查 AI 代码' }
    frequency: common
    tags: [test-integrity, independent-verification, audit-evidence]

  - id: agent-guardrail-layer-choice
    question: { en: 'When is a unit test too narrow to serve as an agent guardrail?', zh: '什么情况下，单元测试过于狭窄，无法充当智能体护栏？' }
    answer:
      en: 'A unit test is too narrow when the credible fault lives beyond the isolated decision it observes. Serialization shape, database collation, transaction rollback, dependency wiring, queue delivery, browser behavior, and provider protocol rules require a component, contract, or integration boundary. I still keep unit tests for fast feedback around pure decisions, then add the smallest wider test that exercises the real risk. Test doubles must faithfully model the property under review; a permissive mock can erase the contract. The completion report names which environments ran and keeps untested production assumptions as explicit residual risks.'
      zh: '如果可信缺陷位于单元测试所观察的孤立决策之外，它就过于狭窄。序列化形状、数据库排序规则、事务回滚、依赖装配、队列投递、浏览器行为和提供方协议，都需要组件、契约或集成边界。我仍会保留单元测试，为纯决策提供快速反馈，再增加能够覆盖真实风险的最小范围测试。测试替身必须忠实模拟审查中的属性；过于宽松的模拟对象会抹除契约。完成报告应说明运行了哪些环境，并把未经测试的生产假设保留为显式剩余风险。'
    topics: [ai-era/tests-as-agent-guardrails]
    level: advanced
    section: { en: 'Testing and evidence', zh: '测试与证据' }
    frequency: occasional
    tags: [test-layer, contract-testing, residual-risk]

  - id: code-prompt-observable-contract
    question: { en: 'How do you turn a vague coding request into an observable change contract?', zh: '怎样把含糊的代码请求变成可观察的改动契约？' }
    answer:
      en: 'I first name the exact symbol or consumer boundary instead of saying “this code.” Then I describe one current observation and the desired replacement: accepted inputs, return shape, error channel, side effects, and ordering where relevant. I add invariants and compatibility dimensions that must survive, plus explicit non-goals. Negative examples expose ambiguity that a happy path hides. Finally, I attach evidence to each important claim: a focused test, a broader command, a call-site search, or a manual review item. The agent may choose implementation details inside that frame, but it must report unresolved product assumptions.'
      zh: '我会先明确具体符号或使用方边界，不说「这段代码」之类的模糊指代。随后写出一项当前观察和期望替代结果，包括接受的输入、返回结构、错误通道、副作用，以及必要的顺序；再补充必须保持的不变量、兼容维度与明确非目标。成功路径会隐藏歧义，所以还要加入反例。最后给每项重要主张对应证据，例如聚焦测试、更广命令、调用位置搜索或人工审查项。智能体可以在这个框架内选择实现细节，但必须报告未解决的产品假设。'
    topics: [ai-era/code-prompt-vocabulary]
    level: beginner
    section: { en: 'Prompting for code', zh: '面向代码的提示词' }
    frequency: common
    tags: [observable-behavior, acceptance-criteria, prompt-scope]

  - id: code-prompt-parameter-argument
    question: { en: 'Why does the distinction between a parameter and an argument matter in a code prompt?', zh: '为什么在代码提示词中要区分形参与实参？' }
    answer:
      en: 'A parameter is the named input slot declared by a function; an argument is the value or expression supplied at a call site. The distinction tells the agent whether to edit the definition, one caller, or both. Renaming a parameter can be harmless for positional calls and breaking for keyword calls. Changing one argument may instead fix only a particular data flow. I would say “keep the timeout parameter and pass the request deadline as its argument at these two call sites,” then require a search for dynamic and keyword consumers before claiming compatibility.'
      zh: '形参是函数定义中声明的具名输入槽，实参是调用位置提供的值或表达式。这一区别告诉智能体应修改定义、某个调用方，还是两者都改。形参改名对位置调用可能无害，对关键字调用却可能是破坏性变更；修改一个实参则可能只修正一条数据流。我会写成「保留 timeout 形参，在这两个调用位置把请求截止时间作为实参传入」，并要求搜索动态调用方与关键字调用方后，才能声称保持兼容。'
    topics: [ai-era/code-prompt-vocabulary]
    level: beginner
    section: { en: 'Prompting for code', zh: '面向代码的提示词' }
    frequency: common
    tags: [function-signature, parameter, argument]

  - id: code-prompt-failure-semantics
    question: { en: 'What should a prompt specify about a failure mode?', zh: '提示词应当说明失败模式的哪些内容？' }
    answer:
      en: 'I name the trigger, the channel that carries failure, a stable error identifier, and the state visible when it occurs. I also state whether the caller may retry, whether the operation is idempotent, and which side effects may already have committed. Expected domain outcomes, invalid programmer input, dependency failure, timeout, and cancellation should not be collapsed unless the boundary deliberately owns that translation. For a reservation, I might require an INSUFFICIENT_SEATS tagged result, unchanged inventory, and no confirmation message. That is reviewable; “handle errors gracefully” gives no caller-visible contract.'
      zh: '我会说明触发条件、传递失败的通道、稳定错误标识，以及失败出现时可观察的状态。还要写明调用方能否重试、操作是否幂等，以及哪些副作用可能已经提交。除非边界明确负责翻译，否则不应把预期领域结果、无效的程序员输入、依赖失败、超时与取消合并。对于预订，可以要求返回带 `INSUFFICIENT_SEATS` 标签的结果，保持库存不变，并且不发送确认消息。这些内容可以审查，而「妥善处理错误」没有给出调用方可见契约。'
    topics: [ai-era/code-prompt-vocabulary]
    level: intermediate
    section: { en: 'Reviewing AI code', zh: '审查 AI 代码' }
    frequency: common
    tags: [failure-mode, error-channel, side-effect]

  - id: code-prompt-structural-constraint
    question: { en: 'When should a code prompt require a structural pattern?', zh: '代码提示词应在什么时候强制要求结构模式？' }
    answer:
      en: 'I require structure when it carries an evidenced design constraint: ownership, dependency direction, a security boundary, test substitution, measured performance, or an established repository convention. I describe the reason and the boundary, such as keeping network delivery behind an injected callable while deterministic policy stays in a pure helper. I do not request a class, factory, adapter, or repository merely because the term sounds architectural. If only observable behavior matters, I leave internals open. During review I check imports, side-effect traces, and consumers to prove the requested boundary exists without unnecessary layers.'
      zh: '只有结构承载了有证据支持的设计约束时，我才会强制指定模式，例如所有权、依赖方向、安全边界、测试替换、实测性能或既有仓库约定。我会同时说明理由与边界，例如让网络发送留在注入的可调用对象之后，把确定性策略放进纯函数辅助单元。我不会因为类、工厂、适配器或仓库听起来像架构术语就要求使用它们。如果只有可观察行为重要，就给内部实现留出选择空间。审查时再通过导入关系、副作用轨迹与使用方，证明所需边界存在且没有多余层次。'
    topics: [ai-era/code-prompt-vocabulary]
    level: advanced
    section: { en: 'Architecture and boundaries', zh: '架构与边界' }
    frequency: occasional
    tags: [architecture-boundary, dependency-seam, pure-function]

  - id: agent-instructions-content
    question: { en: 'What belongs in AGENTS.md or CLAUDE.md?', zh: '哪些内容适合写进 AGENTS.md 或 CLAUDE.md？' }
    answer:
      en: 'I put stable repository facts there: package boundaries, canonical commands and their working directories, generated paths, naming rules, and verification evidence expected before delivery. Each instruction has a clear scope and is concrete enough to review. A temporary ticket goal, a long tutorial, or information already obvious from code stays out because persistent text consumes context and becomes stale. I also record which agent hosts the repository supports. Shared guidance can remain canonical in AGENTS.md, while a small CLAUDE.md imports it and adds only Claude-specific behavior supported by current documentation.'
      zh: '我会写入稳定的仓库事实，包括软件包边界、权威命令及其工作目录、生成路径、命名规则，以及交付前需要的验证证据。每条指令都应范围清楚，并且具体到可以审查。临时工单目标、长篇教程和代码中已经显而易见的信息不应放入，因为持久文本会占用上下文并逐渐过期。我还会记录仓库支持哪些智能体宿主。共享指引可以集中保存在 AGENTS.md，再由简短的 CLAUDE.md 导入，只补充当前文档支持的 Claude 专用行为。'
    topics: [ai-era/agent-instructions-and-mcp]
    level: beginner
    section: { en: 'Working with agents', zh: '与智能体协作' }
    frequency: common
    tags: [repository-instructions, scope, context-window]

  - id: agent-instructions-versus-permissions
    question: { en: 'Why can an instruction file not secure an MCP tool?', zh: '为什么指令文件无法保护 MCP 工具的安全？' }
    answer:
      en: 'An instruction file is text in the model context. It can make a safe request more likely, but it cannot revoke credentials, block a network route, or stop a different client from calling the same server. MCP defines how tools are discovered and called; it does not turn descriptions or schemas into authorization. I enforce the boundary in deterministic code: expose only needed tools, validate arguments, authorize the current caller and resource on every call, limit output and runtime, and pause sensitive operations for scoped approval. The forbidden call must fail even when the model confidently asks for it.'
      zh: '指令文件只是模型上下文中的文本。它能提高模型提出安全请求的概率，却无法撤销凭据、阻断网络路径，也无法阻止另一个客户端调用同一服务器。MCP 定义工具怎样发现和调用，但不会把描述或模式自动变成授权。我会在确定性代码中强制边界：只提供必要工具，验证参数，每次调用都授权当前调用方和资源，限制输出与运行时间，并让敏感操作暂停等待范围明确的批准。即使模型非常自信地请求禁止操作，该调用也必须失败。'
    topics: [ai-era/agent-instructions-and-mcp]
    level: intermediate
    section: { en: 'Tooling', zh: '工具链' }
    frequency: common
    tags: [mcp, authorization, least-privilege]

  - id: agent-instructions-mcp-tool-contract
    question: { en: 'How would you design a scoped MCP tool for repository access?', zh: '怎样设计一个访问仓库的受限 MCP 工具？' }
    answer:
      en: 'I start from the domain action, such as read_source or run_payment_tests, instead of exposing a shell or arbitrary file reader. The input schema rejects unknown fields and bounds primitive values; the output schema keeps status and metadata stable. Inside the handler I validate again, normalize paths, resolve links, prove containment, authorize the caller against the specific resource, and enforce byte and time limits. Results distinguish protocol failure from a tool-level error and mark truncation. The process identity has only the required mounts and credentials. Mutating calls also need scoped approval, idempotency, and an auditable resource version.'
      zh: '我会从领域操作出发，例如 read_source 或 run_payment_tests，而不是提供 shell 或任意文件读取器。输入模式拒绝未知字段并限制基本值，输出模式保持状态和元数据稳定。处理器内部仍要再次验证，规范化路径、解析链接、证明包含关系、针对具体资源授权调用方，并强制字节数和时间上限。结果要区分协议故障与工具级错误，并标记截断。进程身份只拥有必要挂载和凭据。修改类调用还需要范围明确的批准、幂等控制和可审计的资源版本。'
    topics: [ai-era/agent-instructions-and-mcp]
    level: intermediate
    section: { en: 'Tooling', zh: '工具链' }
    frequency: common
    tags: [mcp-tools, api-contract, bounded-output]

  - id: agent-instructions-resolution-test
    question: { en: 'How do you verify instruction discovery in a monorepo?', zh: '怎样验证单体仓库中的指令发现行为？' }
    answer:
      en: 'I treat discovery as a versioned product contract. A fixture repository contains a broad root rule, a harmless conflicting subtree rule, and both ordinary and override filenames where the host supports them. From representative working directories, automation asks the agent or host to report loaded sources and asserts their order and scope. I repeat the test for files opened below the launch directory because some hosts load subtree guidance on demand. The test runs during agent upgrades. I also execute every command named by the active guide in a clean checkout, since discovering a stale instruction correctly is still a repository failure.'
      zh: '我把发现行为当作版本化的产品契约。夹具仓库包含一条宽泛根规则、一条无害但有冲突的子树规则，以及宿主支持的普通文件名和覆盖文件名。自动化从有代表性的工作目录启动，要求智能体或宿主报告已加载来源，并断言顺序与范围。部分宿主按需加载启动目录以下的子树指引，因此还要对打开这些文件的情况重复测试。智能体升级时应运行这套测试。我也会在干净检出中执行活跃指引列出的每条命令，因为正确发现一条过期指令仍属于仓库故障。'
    topics: [ai-era/agent-instructions-and-mcp]
    level: advanced
    section: { en: 'Testing and evidence', zh: '测试与证据' }
    frequency: occasional
    tags: [instruction-discovery, monorepo, compatibility-test]

  - id: unfamiliar-code-first-pass
    question: { en: 'How do you begin reading an unfamiliar codebase for a specific change?', zh: '为一项具体改动阅读陌生代码库时，你会怎样开始？' }
    answer:
      en: 'I turn the change into one observable question, then establish the repository, package, runtime, working directory, and current diff. I search for route strings, event names, command names, or failing-test text to find an executable entry point. From there I follow one call path, recording only branch-driving data, concrete dependency bindings, side effects, and enforced invariants. Each important claim gets a source location or focused observation, while uncertain edges stay labelled. I stop expanding when the model can predict the behavior and the failure case relevant to the change.'
      zh: '我会先把改动转成一个可观察问题，再确定代码库、软件包、运行时、工作目录和当前差异。接着搜索路由字符串、事件名称、命令名称或失败测试文字，以找到可执行入口。从入口沿一条调用路径追踪，只记录驱动分支的数据、具体依赖绑定、副作用和真正得到保障的不变量。每项重要判断都要有源码位置或聚焦观察作为证据，不确定的边继续明确标注。当模型能够预测与改动相关的行为和失败情形时，就停止扩展。'
    topics: [ai-era/unfamiliar-code-reading]
    level: beginner
    section: { en: 'Reviewing AI code', zh: '审查 AI 代码' }
    frequency: common
    tags: [entry-point, scoped-model, evidence]

  - id: unfamiliar-code-entry-point-proof
    question: { en: 'How do you prove that an implementation is on the active production path?', zh: '怎样证明某个实现位于当前生产运行路径上？' }
    answer:
      en: 'A matching filename or symbol definition is only a candidate. I find the executable registration, such as the route table, command map, event subscription, or framework configuration, then follow wrappers and middleware to the handler. For an interface or injected dependency, I inspect the production construction root that chooses the concrete implementation. I also check feature flags, environment-specific configuration, and the active build target. A focused trace can confirm the edge at runtime. Tests help explain construction, but a fake or bypassed middleware means their path alone does not prove production wiring.'
      zh: '同名文件或符号定义只能提供候选实现。我会找到路由表、命令映射、事件订阅或框架配置等可执行注册位置，再沿包装器与中间件到达处理器。遇到接口或注入依赖时，还要检查生产组合根实际选择的具体实现。同时核对功能开关、环境专用配置和当前构建目标。聚焦跟踪可以在运行时确认这条边。测试有助于理解构造方式，但伪造依赖或被绕过的中间件意味着测试路径本身不能证明生产接线关系。'
    topics: [ai-era/unfamiliar-code-reading]
    level: intermediate
    section: { en: 'Architecture and flow', zh: '架构与流程' }
    frequency: common
    tags: [production-wiring, construction-root, dynamic-dispatch]

  - id: unfamiliar-code-effect-inventory
    question: { en: 'How do you trace side effects in code you do not yet understand?', zh: '面对尚未理解的代码，怎样追踪副作用？' }
    answer:
      en: 'I start from the behavior’s entry point and list storage, network, event, cache, filesystem, log, metric, clock, random, and mutable module-state access in execution order. Dependency names are not enough, so I resolve each interface to the concrete adapter selected in the active configuration. For every effect I record its payload, earlier completed effects, and what happens if it fails. Then I run a narrow test with recording fakes and one injected failure. This exposes partial states, duplicate-work risks, and hidden retry assumptions that a successful return value or fluent generated summary can conceal.'
      zh: '我从行为入口出发，按执行顺序列出存储、网络、事件、缓存、文件系统、日志、指标、时钟、随机数和可变模块状态访问。依赖名称本身不够，因此还要把每个接口解析到当前配置选择的具体适配器。对于每项副作用，我会记录载荷、此前已经完成的副作用，以及它失败时会发生什么。随后使用可记录的伪实现运行窄范围测试，并注入一次失败。这样可以暴露局部状态、重复工作风险和隐藏的重试假设，而成功返回值或流畅的生成式摘要常会掩盖这些问题。'
    topics: [ai-era/unfamiliar-code-reading]
    level: intermediate
    section: { en: 'Reviewing AI code', zh: '审查 AI 代码' }
    frequency: common
    tags: [side-effects, failure-boundary, effect-order]

  - id: unfamiliar-code-characterization-scope
    question: { en: 'When should a discovery become a characterization test?', zh: '阅读代码时的发现应在何时变成特征测试？' }
    answer:
      en: 'I add a characterization test when current behavior matters to the planned change and existing evidence does not protect it. The test uses the public or stable boundary, exercises a distinguishing input, and observes state plus relevant effects. I avoid asserting helper order, log text, object identity, or other incidental details unless callers truly depend on them. Characterization records what exists; it does not automatically approve a defect as the future contract. If current behavior conflicts with requirements, I preserve the conflict as an explicit decision, obtain the intended result, and then write the acceptance test for that result.'
      zh: '当当前行为与计划改动有关，而已有证据尚未保护它时，我会增加特征测试。测试通过公开或稳定边界运行，使用能区分实现的输入，并同时观察状态与相关副作用。除非调用方确实依赖，否则不应断言辅助函数顺序、日志文字、对象标识等偶然细节。特征测试记录现状，并不会自动把缺陷批准为未来契约。若当前行为与需求冲突，应把冲突保留为明确决策，先确认预期结果，再为该结果编写验收测试。'
    topics: [ai-era/unfamiliar-code-reading]
    level: intermediate
    section: { en: 'Testing and evidence', zh: '测试与证据' }
    frequency: occasional
    tags: [characterization-test, test-scope, current-behavior]

  - id: examples-counterexample-quality
    question: { en: 'What makes a counterexample useful in a coding request?', zh: '什么样的反例对编码请求有用？' }
    answer:
      en: 'A useful counterexample targets a plausible wrong rule rather than merely looking unusual. I first state the generalization an implementer might make, then choose the smallest valid case where that rule and the intended rule produce different observable results. I keep unrelated fields fixed, name the distinction, and provide a literal expected value, stable failure, or forbidden side effect. For a threshold, equality or an adjacent value is usually decisive. For permissions, I combine rules to expose precedence. The case is successful when its failure explains which misunderstanding occurred.'
      zh: '有效反例针对一条可能出现的错误规则，而不只是选择看起来特殊的数据。我会先写明实现者可能作出的归纳，再选择一个最小有效案例，使错误规则与预期规则产生不同的可观察结果。无关字段保持不变，案例名称说明差异，并给出字面预期值、稳定失败或禁止副作用。阈值规则通常用相等值或相邻值判别；权限规则则组合多个条件以暴露优先级。案例失败时如果能直接说明发生了哪种误解，它就发挥了作用。'
    topics: [ai-era/examples-and-counterexamples]
    level: beginner
    section: { en: 'Prompting for code', zh: '代码提示' }
    frequency: common
    tags: [counterexample, controlled-contrast, prompt-contract]

  - id: examples-minimal-distinguishing-set
    question: { en: 'How do you build a small but discriminating set of examples?', zh: '怎样构建精简但有判别力的示例集？' }
    answer:
      en: 'I begin with one representative case for each required behavior, then list credible alternatives such as a strict instead of inclusive boundary, a hard-coded constant, ignored state, or reversed precedence. For each alternative I add one case on which it disagrees with the intended rule. Boundary pairs, category changes, and one overlapping decision-table row usually remove more ambiguity than many random samples. I also cover the approved failure channel and forbidden effects. Every case needs a named purpose; if removing a row leaves no meaningful wrong interpretation alive, that row may be redundant.'
      zh: '我先为每项必需行为选择一个代表性案例，再列出可信的替代解释，例如用严格边界代替包含等号的边界、硬编码常量、忽略状态或颠倒优先级。针对每种替代解释，加入一个会与预期规则产生不同结果的案例。边界对、类别变化和一个规则重叠的决策表行，通常比许多随机样本更能减少歧义。我还会覆盖已批准的失败通道与禁止副作用。每个案例都要有具名用途；若删除某行后没有任何有意义的错误解释重新成立，该行可能是重复的。'
    topics: [ai-era/examples-and-counterexamples]
    level: intermediate
    section: { en: 'Prompting for code', zh: '代码提示' }
    frequency: common
    tags: [distinguishing-set, boundary-value, decision-table]

  - id: examples-invalid-versus-counterexample
    question: { en: 'How does a counterexample differ from an invalid-input case?', zh: '反例与无效输入案例有什么区别？' }
    answer:
      en: 'A counterexample disproves an overly broad interpretation and can be fully valid input. An active item exactly at its threshold may disprove a strict comparison; an archived administrator may disprove unconditional edit access. An invalid-input case instead sits outside the accepted domain and specifies rejection behavior. I label the categories separately because they constrain different things. Valid counterexamples refine the business rule, while invalid cases define validation, error type or code, state preservation, and forbidden effects. Mixing them can leave a valid boundary wrong even though malformed values are rejected correctly.'
      zh: '反例用于推翻过宽解释，本身完全可以是有效输入。活跃商品恰好位于阈值时，可以推翻严格比较；管理员访问归档记录时，可以推翻无条件编辑权。无效输入案例位于接受域以外，规定的是拒绝行为。我会分别标注两类案例，因为它们约束的内容不同：有效反例收窄业务规则，无效案例则定义验证、错误类型或代码、状态保持与禁止副作用。把两者混在一起，可能出现格式错误值已被正确拒绝，但有效边界仍然处理错误的情况。'
    topics: [ai-era/examples-and-counterexamples]
    level: intermediate
    section: { en: 'API contracts', zh: 'API 契约' }
    frequency: occasional
    tags: [input-domain, failure-contract, counterexample]

  - id: examples-review-generated-cases
    question: { en: 'How do you review examples and tests generated by the same coding agent?', zh: '怎样审查同一个编码智能体生成的示例与测试？' }
    answer:
      en: 'I trace each expected result to an independent product rule, protocol, reviewed fixture, or invariant; production code cannot be its own oracle. I group cases by input partition and check exact boundaries, rule interactions, missing values, repeated actions, and forbidden effects. Then I name a defect each case claims to catch and run it against the pre-change or deliberately altered implementation. A boundary test that stays green after changing <= to < is not discriminating. I also inspect whether the agent changed old expectations, because coordinated edits can erase regression evidence while leaving every generated check green.'
      zh: '我会把每个预期结果追溯到独立的产品规则、协议、已审查夹具或不变量，生产代码不能担任自己的预言机。我按输入分区整理案例，并检查精确边界、规则交互、缺失值、重复操作与禁止副作用。然后为每个案例指明它声称捕获的缺陷，并针对改动前实现或故意改变的实现运行。若把 <= 改成 < 后边界测试仍然通过，它就没有判别力。我还会检查智能体是否修改了旧预期，因为配套修改可能抹去回归证据，同时让所有生成检查保持绿色。'
    topics: [ai-era/examples-and-counterexamples]
    level: intermediate
    section: { en: 'Testing and evidence', zh: '测试与证据' }
    frequency: common
    tags: [test-oracle, red-green-proof, generated-tests]

  - id: agent-boundary-human-led-signals
    question: { en: 'When should a coding task remain human-led rather than be delegated to an agent?', zh: '什么情况下，编程任务应保持人工主导，而不是委托给智能体？' }
    answer:
      en: 'I keep a task human-led when the desired outcome is disputed, the required action exposes sensitive data or has an irreversible external effect, the run has no credible cost ceiling, or nobody can verify the result independently. These are task properties, not judgments about whether the model sounds capable. I first try to split the work: an agent may perform read-only investigation or prepare a candidate diff, while an accountable person settles policy and performs the consequential action. Delegation becomes reasonable only after intent, permission scope, stop conditions, and completion evidence are explicit.'
      zh: '当预期结果仍有争议、所需操作会暴露敏感数据或产生不可逆的外部效果、运行没有可信的成本上限，或者无人能够独立验证结果时，我会保持人工主导。这些都是任务属性，与模型说话听起来多么能干无关。我会先尝试拆分工作：智能体可以执行只读调查或准备候选差异，负责任的人负责确定策略并执行后果重大的操作。只有意图、权限范围、停止条件和完成证据都明确后，委托才是合理选择。'
    topics: [ai-era/agent-use-boundaries]
    level: beginner
    section: { en: 'Working with agents', zh: '与智能体协作' }
    frequency: common
    tags: [human-led, sensitivity, verification]

  - id: agent-boundary-route-versus-outcome
    question: { en: 'How do route uncertainty and outcome uncertainty affect agent use differently?', zh: '路径不确定性与结果不确定性会怎样以不同方式影响智能体使用？' }
    answer:
      en: 'Route uncertainty means the destination is agreed but the implementation path is unknown. A reproducible failure with approved expected behavior is a good example: an agent can search callers, inspect configuration, edit code, and react to tests. Outcome uncertainty means reasonable owners may disagree about what success should be, such as whether a customer tier bypasses a limit. Search cannot grant product authority, so a model must not turn that gap into an implementation. I ask an accountable person to approve concrete examples and boundary cases first, then delegate the now-settled implementation route.'
      zh: '路径不确定性表示目的地已经达成共识，但实现路线未知。带有获准预期行为的可复现故障就是典型例子：智能体可以搜索调用方、检查配置、修改代码并根据测试反馈纠错。结果不确定性表示负责任的各方可能对成功标准持不同意见，例如某类客户是否能绕过限额。搜索无法赋予产品决策权，所以模型不能把这个空缺直接变成实现。我会先请负责任的人批准具体示例和边界案例，再委托已经确定结果的实现路线。'
    topics: [ai-era/agent-use-boundaries]
    level: beginner
    section: { en: 'Working with agents', zh: '与智能体协作' }
    frequency: common
    tags: [route-uncertainty, outcome-uncertainty, product-authority]

  - id: agent-boundary-simple-automation
    question: { en: 'Why can simple automation be safer than an agent for a large task?', zh: '为什么面对大型任务时，简单自动化可能比智能体更安全？' }
    answer:
      en: 'Task size alone does not justify an agent. If every branch follows a stable rule over structured inputs, a deterministic script or codemod gives the same result on every run, admits exact input-output tests, and avoids an adaptive search loop. That makes cost, permissions, and review scope easier to bound even across thousands of files. I may use an agent to draft the script, but I review that artifact and run it as ordinary automation. An agent becomes useful when the route genuinely requires bounded search and correction from environmental feedback, not merely because there are many items.'
      zh: '任务规模本身不能成为使用智能体的理由。如果所有分支都对结构化输入执行稳定规则，确定性脚本或代码修改器每次运行都会给出相同结果，可以使用精确的输入输出测试，也不需要自适应搜索循环。即使涉及数千个文件，成本、权限和审查范围仍更容易限制。我可以让智能体协助起草脚本，但会审查这份制品，并把它当作普通自动化运行。只有实现路线确实需要受限搜索和环境反馈纠错时，智能体才有价值；条目多并不是理由。'
    topics: [ai-era/agent-use-boundaries]
    level: beginner
    section: { en: 'Automation design', zh: '自动化设计' }
    frequency: occasional
    tags: [simple-automation, deterministic, task-selection]

  - id: agent-boundary-mid-run-escalation
    question: { en: 'What should happen when an agent crosses a boundary during a run?', zh: '智能体在运行中越过边界时，应当怎样处理？' }
    answer:
      en: 'The controller should stop at a predefined trigger rather than let the model improvise broader authority. Triggers include discovering sensitive data, requesting an out-of-scope resource, needing an irreversible effect, finding contradictory tests, or reaching a time, step, or spend limit. The handoff should preserve the exact observation, denied call, inspected paths, candidate diff, completed effects, and smallest unresolved decision. A person can then narrow the task, grant one scoped approval, or keep the step human-led. After that decision, I classify the remaining work again instead of silently resuming under the original assumptions.'
      zh: '控制器应在预定义触发点停止，不能让模型临时扩大自己的权限。触发条件包括发现敏感数据、请求范围外资源、需要不可逆效果、发现相互矛盾的测试，或达到时间、步骤和费用上限。交接内容应保留确切观察、被拒绝调用、已检查路径、候选差异、已经发生的效果，以及最小的未决问题。随后由人缩小任务、只授予一次范围明确的审批，或让该步骤保持人工主导。决策完成后，我会重新分类剩余工作，而不是沿用原假设悄悄恢复运行。'
    topics: [ai-era/agent-use-boundaries]
    level: intermediate
    section: { en: 'Safety and control', zh: '安全与控制' }
    frequency: common
    tags: [escalation, stop-condition, approval-gate]

  - id: constraint-prompt-change-contract
    question: { en: 'How do you turn a feature request into a constraint-rich coding prompt?', zh: '怎样把功能请求改写成约束明确的编程提示词？' }
    answer:
      en: 'I start with one observable outcome and name the caller or user who needs it. Then I cite the current behavior and relevant repository locations, set a narrow write scope, and list nearby changes that are explicitly out of scope. I identify compatibility by dimension, such as signature, error type, data shape, runtime, or side-effect order, instead of saying “do not break anything.” Finally I give exact test, lint, build, and diff commands with success conditions. If investigation proves another file or product decision is required, the prompt tells the agent to stop and report the evidence.'
      zh: '我会先写出一个可观察结果，并指出需要它的调用方或用户。接着给出当前行为和相关仓库位置，设置狭窄的修改范围，并列出明确不属于当前范围的相邻改动。兼容性要按签名、错误类型、数据形状、运行时或副作用顺序等维度说明，不能只说「不要破坏任何内容」。最后给出确切的测试、代码检查、构建和差异命令以及成功条件。如果调查证明还需要其他文件或产品决策，提示词应要求智能体停止并报告证据。'
    topics: [ai-era/constraint-rich-prompts]
    level: intermediate
    section: { en: 'Prompt design', zh: '提示词设计' }
    frequency: common
    tags: [write-scope, non-goal, acceptance-command]

  - id: constraint-prompt-nongoal-versus-test
    question: { en: 'How does a non-goal differ from a negative acceptance case?', zh: '非目标与负向验收案例有什么区别？' }
    answer:
      en: 'A non-goal limits the project outcome or patch surface: for example, this change must not upgrade dependencies or migrate stored records. A negative acceptance case limits observable runtime behavior: an empty identifier must throw TypeError and perform no write. They need different evidence. The changed-file and manifest diff can verify the first, while a focused test with a recording fake can verify the second. Mixing them leaves gaps because a runtime test usually cannot detect unrelated formatting, and a path allowlist cannot prove failure semantics. I write both when scope and behavior each have a realistic failure mode.'
      zh: '非目标限制项目结果或补丁表面，例如本次改动不得升级依赖或迁移存储记录。负向验收案例限制可观察的运行时行为，例如空标识符必须抛出 TypeError，并且不能写入。两者需要不同证据：已修改文件与清单差异可以验证前者，配合可记录伪实现的聚焦测试可以验证后者。混用会留下缺口，因为运行时测试通常发现不了无关格式化，路径允许列表也无法证明失败语义。当范围和行为各自存在真实失败模式时，我会同时写明两者。'
    topics: [ai-era/constraint-rich-prompts]
    level: intermediate
    section: { en: 'Prompt design', zh: '提示词设计' }
    frequency: common
    tags: [non-goal, negative-case, evidence]

  - id: constraint-prompt-compatibility-matrix
    question: { en: 'How do you express compatibility constraints without making an impossible promise?', zh: '怎样表达兼容性限制，又不作出无法兑现的承诺？' }
    answer:
      en: 'I define the protected consumer set and the observations each consumer relies on. For a function, that may include call shape, omitted and zero inputs, returned fields, exception classes, side effects, and async timing. I search call sites and use existing tests, schemas, fixtures, and automation to build a small matrix of old behavior, intended behavior, and evidence. Intentional changes get their own rows. Unknown plugins or external callers remain labelled as uncertainty, so I do not claim universal backward compatibility. If two required rows conflict, I escalate the smallest contradiction before editing rather than choosing one silently.'
      zh: '我会定义受保护的使用者集合，以及每个使用者依赖的观察结果。对于函数，这可能包括调用形状、省略值与零值输入、返回字段、异常类、副作用和异步时序。我会搜索调用点，并利用现有测试、模式、夹具和自动化建立一张小型矩阵，记录旧行为、预期行为和证据；有意变化要单列。未知插件或外部调用方继续标为不确定性，因此不能声称普遍向后兼容。如果两个必需行彼此冲突，我会在编辑前升级最小矛盾，而不是默默选择其中一个。'
    topics: [ai-era/constraint-rich-prompts]
    level: advanced
    section: { en: 'Compatibility', zh: '兼容性' }
    frequency: occasional
    tags: [backward-compatibility, consumer-set, decision-table]

  - id: constraint-prompt-acceptance-blocker
    question: { en: 'What should an agent do when a required acceptance command fails or cannot run?', zh: '必需的验收命令失败或无法运行时，智能体应该怎样处理？' }
    answer:
      en: 'It should not convert missing evidence into a pass. The report needs the exact command, working directory when relevant, exit code, concise output, and whether the failure existed before the patch. If the cause is inside the authorized scope, the agent can fix it and rerun every affected check. If resolution needs credentials, a product choice, an unsafe action, or a write outside scope, the stop condition applies. The agent should preserve the current diff and present the smallest evidence-backed decision needed. Substituting a weaker command requires explicit revision of the acceptance contract, not a quiet judgment in the completion summary.'
      zh: '智能体不能把缺失证据解释为通过。报告应包含确切命令、必要的工作目录、退出码、简短输出，以及该失败是否在补丁前就存在。如果原因位于已授权范围内，智能体可以修复并重新运行所有受影响检查。如果解决问题需要凭据、产品选择、不安全操作或范围外写入，就应触发停止条件。智能体应保留当前差异，并给出继续所需的最小、有证据支持的决策。若要换用更弱命令，必须显式修改验收契约，不能在完成摘要中悄悄替换。'
    topics: [ai-era/constraint-rich-prompts]
    level: intermediate
    section: { en: 'Verification and handoff', zh: '验证与交接' }
    frequency: common
    tags: [acceptance-command, blocked-check, stop-condition]

  - id: code-provenance-separate-claims
    question: { en: 'How do provenance, integrity, authenticity, and correctness differ?', zh: '来源、完整性、真实性与正确性有什么区别？' }
    answer:
      en: 'I treat them as separate release claims. Provenance describes where material came from and how it changed. Integrity says the bytes match a recorded digest. Authenticity connects a signed statement to an identity that policy trusts for a particular subject. Correctness says observable behavior satisfies requirements or invariants. None implies the others: a trusted builder can sign vulnerable code, and correct code can have unresolved origin. I give each claim its own evidence and decision, then require all release-critical decisions to pass instead of letting one green signature or test approve the whole artifact.'
      zh: '我会把它们视为独立的发布声明。来源描述材料从哪里来、怎样发生变化；完整性表示字节与记录摘要一致；真实性把签名声明关联到政策针对特定主体所信任的身份；正确性表示可观察行为满足需求或不变量。任一项都不能推出其他项：可信构建者可能签署有漏洞的代码，正确代码也可能来源不明。我会为每项声明分别设置证据与决定，并要求所有发布关键决定都通过，而不是用一个绿色签名或测试批准整个产物。'
    topics: [ai-era/code-provenance-and-verification]
    level: beginner
    section: { en: 'Reviewing AI code', zh: '审查 AI 代码' }
    frequency: common
    tags: [code-provenance, integrity, authenticity]

  - id: code-provenance-independent-evidence
    question: { en: 'How would you independently verify an agent claim that generated code passes?', zh: '怎样独立验证智能体关于生成代码已经通过检查的声明？' }
    answer:
      en: 'I identify the delivered revision, runtime, working directory, exact command, inputs, and expected observation. Then I derive the oracle from a reviewed requirement, established repository behavior, or trusted specification rather than the candidate or its generated tests. I rerun the command in a clean environment with frozen dependencies and record exit status plus fresh output. At least one boundary or malformed input should distinguish the implementation from its likely mistake. Finally I inspect whether the test copied constants or branches from the candidate, and I report skipped checks and residual uncertainty instead of translating missing evidence into a pass.'
      zh: '我会先确定交付修订版本、运行时、工作目录、确切命令、输入和预期观察。随后根据已审查需求、既有仓库行为或可信规范建立预言机，而不依赖候选实现及其生成测试。我会在冻结依赖的干净环境中重新运行命令，记录退出状态与最新输出。至少加入一个边界或畸形输入，用于区分实现与其潜在错误。最后检查测试是否复制了候选实现的常量或分支，并如实报告跳过项与剩余不确定性，不能把缺失证据解释为通过。'
    topics: [ai-era/code-provenance-and-verification]
    level: intermediate
    section: { en: 'Testing and evidence', zh: '测试与证据' }
    frequency: common
    tags: [independent-verification, test-oracle, counterexample]

  - id: code-provenance-dependency-review
    question: { en: 'What do you inspect when generated code adds a dependency?', zh: '生成代码添加依赖时，你会检查什么？' }
    answer:
      en: 'I begin with intent: which direct package the task authorized and why existing code is insufficient. Then I diff the manifest and frozen lockfile, inspect resolved versions, sources, integrity values, install scripts, and the transitive, optional, and platform-specific closure. I compare that graph with package contents and an artifact-linked SBOM, investigating discrepancies. License identifiers are normalized, but an allowlist only triages; reviewed policy still decides compatibility, notices, patents, and distribution obligations. I also run the repository install and verification commands from a clean cache and record any network downloads or components not captured by the resolver.'
      zh: '我会先确认意图：任务授权了哪个直接软件包，以及现有代码为何不足。随后比较清单与冻结锁文件，检查解析版本、来源、完整性值、安装脚本，以及传递、可选和平台专用依赖闭包。我还会把这张依赖图与软件包内容和关联产物的 SBOM 比较，并调查差异。许可证标识符需要规范化，但允许列表只能用于分类；兼容性、通知、专利和分发义务仍由已审查政策决定。我也会从干净缓存运行仓库安装与验证命令，记录解析器没有捕获的网络下载或组件。'
    topics: [ai-era/code-provenance-and-verification]
    level: intermediate
    section: { en: 'Supply chain and releases', zh: '供应链与发布' }
    frequency: common
    tags: [dependency-closure, lockfile, license-policy]

  - id: code-provenance-attestation-policy
    question: { en: 'What must a verifier check beyond a valid provenance-attestation signature?', zh: '除来源证明签名有效外，验证器还必须检查什么？' }
    answer:
      en: 'A valid signature only proves that one key or certificate signed the envelope. I also require the expected predicate type, an issuer and workload identity authorized for this repository, the approved workflow and source branch, and a subject digest equal to the artifact being released. Depending on policy, I check certificate freshness, transparency-log inclusion, parameters, and input materials. The evidence should come from a protected builder, not a JSON file the same workspace can rewrite. I test rejection by changing the digest and identity, and I keep behavioral, vulnerability, and license review as separate gates because attestation does not prove them.'
      zh: '有效签名只证明某个密钥或证书签署了封装。我还会要求预期的谓词类型、对当前仓库获得授权的签发者与工作负载身份、批准的工作流和源码分支，以及与实际发布产物相等的主体摘要。根据政策，还要检查证书新鲜度、透明日志收录、参数与输入材料。证据应来自受保护构建者，而不是同一工作区可以重写的 JSON 文件。我会改动摘要和身份来测试拒绝路径，并让行为、漏洞与许可证审查保持独立，因为证明并不能证明这些性质。'
    topics: [ai-era/code-provenance-and-verification]
    level: advanced
    section: { en: 'Supply chain and releases', zh: '供应链与发布' }
    frequency: occasional
    tags: [attestation, subject-digest, trust-policy]

  - id: generated-security-delta-threat-model
    question: { en: 'How do you threat-model a generated change without modeling the entire system?', zh: '怎样对生成式改动进行威胁建模，又不把整个系统都纳入范围？' }
    answer:
      en: 'I compare the proposed system with the pre-change system and ask what becomes newly reachable, trusted, or privileged. I name the assets, capable actors, entry points, identity source, trust-boundary crossings, privileged effects, and likely abuse cases introduced by that delta. Then I trace only the controls and consumers needed to establish the affected invariants. Each invariant becomes a denial or containment claim with evidence. Removed checks, broader defaults, retries, logs, and dependencies count as changes to the attack surface. Unknown production configuration stays explicit residual risk rather than becoming an inferred control.'
      zh: '我会把提议系统与改动前系统比较，检查哪些内容变得新近可达、新近受信任或权限更高。接着列出这项增量引入的资产、具备相应能力的参与者、入口、身份来源、信任边界跨越、特权效果和可能的滥用用例。随后只追踪证明受影响不变量所需的控制与使用方。每项不变量都转成带证据的拒绝或约束主张。删除检查、放宽默认值、增加重试、日志或依赖也会改变攻击面。未知生产配置必须作为剩余风险明确保留，不能被推测为已有控制。'
    topics: [ai-era/generated-code-security]
    level: advanced
    section: { en: 'Reviewing AI code', zh: '审查 AI 代码' }
    frequency: common
    tags: [threat-modeling, trust-boundary, attack-surface]

  - id: generated-security-validation-authorization
    question: { en: 'Why is input validation not an authorization control?', zh: '为什么输入验证不是授权控制？' }
    answer:
      en: 'Validation decides whether a value has an accepted type, size, grammar, encoding, or canonical form. Authorization decides whether a verified principal may perform one action on one resource in the current context. A perfectly formed invoice ID may still identify another tenant’s invoice. I derive tenant and user scope from the authenticated principal where possible, query within that scope, and enforce action policy at a stable server-side point. Tests use a valid cross-tenant ID, a principal missing the action scope, an inactive resource, and an unknown resource, while checking that denied requests produce no protected effect.'
      zh: '输入验证决定值是否符合接受的类型、大小、语法、编码或规范形式；授权决定经过验证的主体能否在当前上下文中对某个资源执行一项操作。格式完全正确的发票 ID 仍可能指向其他租户的发票。我会尽量从认证主体推导租户与用户范围，在该范围内查询，并在稳定的服务端位置强制操作策略。测试要使用有效的跨租户 ID、缺少操作权限的主体、非活跃资源与未知资源，同时检查被拒绝请求不会产生受保护效果。'
    topics: [ai-era/generated-code-security]
    level: intermediate
    section: { en: 'Security and authorization', zh: '安全与授权' }
    frequency: common
    tags: [input-validation, object-level-authorization, tenant-isolation]

  - id: generated-security-secret-trace
    question: { en: 'How do you review generated code for secret exposure?', zh: '怎样审查生成代码中的密钥暴露风险？' }
    answer:
      en: 'I inventory secret sources such as environment variables, mounted files, CI stores, metadata services, and injected tokens. I then trace transformations and sinks: logs, exceptions, telemetry, prompts, snapshots, caches, process arguments and environments, generated artifacts, responses, and outbound requests. I prefer allowlisted structured fields over post-formatting string redaction. Scanners provide one signal, so I also place a sentinel secret into failure paths and assert it never appears. If a real credential entered a model, log, artifact, or history, deletion is insufficient; I follow the system’s retention model, revoke or rotate it, and inspect downstream use.'
      zh: '我会先盘点密钥来源，例如环境变量、挂载文件、CI 存储、元数据服务和注入令牌，再追踪转换与接收点，包括日志、异常、遥测、提示词、快照、缓存、进程参数与环境、生成制品、响应和出站请求。我优先为结构化字段使用允许列表，而不是在格式化后做字符串脱敏。扫描器只能提供一类信号，所以还会把哨兵密钥放入失败路径，并断言它从不出现。如果真实凭据进入模型、日志、制品或历史，删除并不充分；我会依据系统保留模型撤销或轮换凭据，并检查下游使用。'
    topics: [ai-era/generated-code-security]
    level: advanced
    section: { en: 'Security and authorization', zh: '安全与授权' }
    frequency: common
    tags: [secrets, data-flow, credential-rotation]

  - id: generated-security-dependency-admission
    question: { en: 'What security evidence do you require when generated code adds or updates a dependency?', zh: '生成代码新增或更新依赖时，需要哪些安全证据？' }
    answer:
      en: 'I first establish why the dependency is needed and whether the task authorized it. I review the manifest and lockfile together, including the resolved registry, exact version, integrity or provenance material, transitive changes, optional and platform packages, and lifecycle scripts. Vulnerability and license scans inform the decision but do not prove publisher identity, necessity, or acceptable authority. I regenerate locks only with the pinned toolchain and run installation or build in a disposable, least-privileged environment without production credentials. Missing lock or provenance information fails admission closed, and any exception records a scoped owner and review date.'
      zh: '我先确认为什么需要该依赖，以及任务是否授权引入它。清单与锁文件必须一起审查，包括解析注册表、确切版本、完整性或来源材料、传递变动、可选与平台软件包，以及生命周期脚本。漏洞与许可证扫描只能辅助决定，不能证明发布者身份、引入必要性或权限可以接受。我只用固定工具链重新生成锁文件，并在不含生产凭据、遵循最小权限的一次性环境中执行安装或构建。锁定或来源信息缺失时，准入应失败关闭；任何例外都要记录范围明确的所有者与复查日期。'
    topics: [ai-era/generated-code-security]
    level: advanced
    section: { en: 'Supply chain and releases', zh: '供应链与发布' }
    frequency: occasional
    tags: [dependency-provenance, lockfile, least-privilege]
