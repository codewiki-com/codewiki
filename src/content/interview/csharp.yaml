track: csharp
items:
  - id: value-versus-reference-copy-semantics
    question: { en: 'How do value types and reference types differ in C#?', zh: 'C# 中的值类型与引用类型有什么区别？' }
    answer:
      en: >-
        A value-type variable contains its value, so ordinary assignment and by-value argument passing copy that value. A reference-type variable contains a reference; copying it can leave two variables pointing to one mutable object. This is a statement about observable semantics, not a rule that structs always live on the stack and classes always live on the heap. Value-type fields can be inline inside heap objects, and boxing creates an object for a value. A struct can also contain reference fields, so copying it is only a field-by-field copy, not a recursive copy of referenced objects.
      zh: >-
        值类型变量直接包含值，因此普通赋值与按值传参会复制该值。引用类型变量包含引用，复制后两个变量可能指向同一个可变对象。这描述的是可观察语义，并不表示结构体永远在栈上、类永远在堆上。值类型字段可以内联在堆对象中，装箱也会为值创建对象。结构体还可以包含引用字段，所以复制结构体只是逐字段复制，不会递归复制字段指向的对象。
    topics: [csharp/data-types]
    level: beginner
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [value-types, reference-types, copying]

  - id: two-meanings-of-nullable
    question: { en: 'How does T? differ for value types and reference types?', zh: 'T? 用于值类型和引用类型时有什么不同？' }
    answer:
      en: >-
        For a non-nullable value type T, T? is shorthand for Nullable<T>, a value that records whether an underlying T is present. For a reference type, T? is a nullable annotation on the same runtime reference type. It tells the compiler that null is expected and participates in null-state analysis, but it doesn't wrap the object or add a runtime check. The null-forgiving operator suppresses a warning only. Code must still validate values arriving through deserialization, reflection, older assemblies, or disabled nullable contexts, because those paths can violate the annotated intent.
      zh: >-
        对非可空值类型 T，T? 是 Nullable<T> 的简写，它记录是否存在底层 T 值。对引用类型，T? 是同一个运行时引用类型上的可空注解，用于告诉编译器 null 属于预期状态，并参与空状态分析；它不会包装对象，也不会添加运行时检查。空包容运算符只会抑制警告。反序列化、反射、旧程序集或禁用可空上下文的代码仍可能违反注解表达的意图，因此边界处依然需要验证。
    topics: [csharp/data-types]
    level: intermediate
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [nullable-value-types, nullable-reference-types]

  - id: safe-numeric-conversions
    question: { en: 'How do you make numeric conversions and arithmetic fail safely?', zh: '怎样让数值转换与算术运算安全失败？' }
    answer:
      en: >-
        Start by identifying the type of every intermediate expression. A wider destination doesn't prevent earlier overflow: two int operands still multiply as int before assignment to long. Widen an operand before the operation and put the complete expression in a checked context when overflow must be rejected. Explicit casts can narrow range, while implicit integer-to-floating conversions can still lose precision. For external text, use TryParse with an explicit culture and format policy rather than a cast or exception-driven parsing. Boundary tests should cover malformed input, extrema, combined maxima, signs, and any required decimal scale or rounding rule.
      zh: >-
        首先确定每个中间表达式的类型。更宽的目标变量不能阻止先前溢出：两个 int 操作数仍会先按 int 相乘，再赋给 long。需要拒绝溢出时，应在运算前扩大一个操作数，并让 checked 覆盖完整表达式。显式强制转换可能缩小范围，整数到浮点数的隐式转换也可能丢失精度。外部文本应使用带明确区域性与格式策略的 TryParse，而不是强制转换或异常驱动的解析。边界测试要覆盖格式错误、极值、组合最大值、符号以及小数位和舍入规则。
    topics: [csharp/data-types]
    level: intermediate
    section: { en: 'Numbers and conversions', zh: '数值与转换' }
    frequency: common
    tags: [numeric-conversions, overflow, parsing]

  - id: boxing-and-exact-unboxing
    question: { en: 'What are boxing and unboxing, and why must unboxing use the exact type?', zh: '什么是装箱与拆箱，为什么拆箱必须使用准确类型？' }
    answer:
      en: >-
        Boxing converts a value type to object or to an implemented interface and usually creates an object containing a copy of the value. Unboxing checks the boxed runtime value type and extracts that value. The check requires an exact match: an int boxed as object can't be unboxed directly as long even though an unboxed int can widen to long. First unbox as int, then perform the numeric conversion. Repeated boxing adds allocations and type checks, so generic collections such as List<int> are preferable to object-based containers. Generic code can still box when it explicitly converts T to object or an interface.
      zh: >-
        装箱把值类型转换成 object 或它实现的接口，通常会创建一个包含值副本的对象。拆箱检查箱中值的运行时类型并提取该值，而且要求类型准确匹配：装箱为 object 的 int 不能直接拆成 long，尽管拆箱后的 int 可以扩大为 long。正确顺序是先拆成 int，再执行数值转换。重复装箱会增加分配与类型检查，因此 List<int> 等泛型集合通常优于基于 object 的容器。泛型代码显式把 T 转成 object 或接口时仍可能装箱。
    topics: [csharp/data-types]
    level: intermediate
    section: { en: 'Runtime behavior', zh: '运行时行为' }
    frequency: occasional
    tags: [boxing, unboxing, generics]

  - id: event-versus-public-delegate
    question: { en: 'How does a C# event differ from exposing a public delegate field?', zh: 'C# 事件与公开委托字段有什么区别？' }
    answer:
      en: >-
        An event has a delegate type but restricts how outside code can use the member. Subscribers can add and remove handlers with += and -=; they cannot replace the whole invocation list, clear it, or raise the event. The declaring type retains those operations and therefore controls when notification occurs. A public delegate field exposes all delegate operations, so any caller can overwrite other registrations or invoke the callbacks with arbitrary arguments. Field-like events use compiler-provided storage and add/remove accessors, while explicit event accessors let a type control or forward subscription storage.
      zh: >-
        事件具有委托类型，但会限制外部代码使用该成员的方式。订阅者可以通过 += 和 -= 添加、移除处理器，却不能替换整个调用列表、将其清空或触发事件；这些操作留在声明类型内部，因此发布者控制通知时机。公开委托字段会暴露全部委托操作，任何调用方都能覆盖其他注册项，或使用任意参数执行回调。字段式事件由编译器提供存储与 add、remove 访问器；显式事件访问器则允许类型控制或转发订阅存储。
    topics: [csharp/events]
    level: intermediate
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [events, delegates, encapsulation]

  - id: multicast-event-handler-failure
    question: { en: 'What happens when one handler of a multicast C# event throws?', zh: 'C# 多播事件的某个处理器抛出异常时会发生什么？' }
    answer:
      en: >-
        Handlers run synchronously in invocation-list order by default. If one throws, that exception returns to the code that raised the event, and handlers later in the list do not run. Catching around the event invocation receives the failure but does not resume the skipped handlers. If the API contract requires every handler to be attempted, the publisher must snapshot the invocation list, invoke entries individually, and define how it records or aggregates failures. Required invariant updates and cleanup should stay in publisher code, with cleanup protected by finally, rather than relying on a final subscriber.
      zh: >-
        默认情况下，处理器会按调用列表顺序同步运行。某个处理器抛出异常后，异常会返回触发事件的代码，列表中排在后面的处理器不会执行。在事件调用外层捕获异常只能接住失败，无法让已跳过的处理器恢复运行。如果 API 契约要求尝试每个处理器，发布者必须先取得调用列表快照，再逐个调用，并明确记录或聚合失败的方式。维护不变量的必做更新与清理应留在发布者内部，清理还要由 finally 保护，不能依赖最后一个订阅者。
    topics: [csharp/events]
    level: intermediate
    section: { en: 'Runtime behavior', zh: '运行时行为' }
    frequency: common
    tags: [multicast-delegate, exceptions, invocation-order]

  - id: event-subscription-retention
    question: { en: 'When can an event subscription keep a subscriber alive, and how do you prevent it?', zh: '事件订阅何时会让订阅者持续存活，怎样避免？' }
    answer:
      en: >-
        A delegate for an instance method holds a strong reference to its target. While a reachable publisher keeps that delegate in its event invocation list, the subscriber remains reachable too. This matters when a static event, singleton, or other long-lived publisher outlives a page, request object, or temporary service. Put removal at the same ownership boundary that created the subscription, often in Dispose or a framework unload hook, and remove the exact named method or stored delegate instance. A newly written equivalent lambda does not identify the original registration. Tests should raise after cleanup and can use a weak reference to check collection.
      zh: >-
        实例方法委托会强引用其目标对象。只要可达的发布者仍把这个委托保存在事件调用列表中，订阅者也会保持可达。当静态事件、单例或其他长期发布者比页面、请求对象或临时服务活得更久时，这个问题尤其明显。应在创建订阅的同一所有权边界执行移除，常见位置是 Dispose 或框架卸载钩子，并移除准确的命名方法或已保存委托实例。重新写一个等价 lambda 无法标识原注册项。测试应在清理后再次触发，也可以用弱引用检查对象能否回收。
    topics: [csharp/events]
    level: intermediate
    section: { en: 'Object lifetime', zh: '对象生命周期' }
    frequency: common
    tags: [lifetime, strong-reference, unsubscribe]

  - id: async-event-handler-contract
    question: { en: 'Why is an async lambda attached to EventHandler risky, and what should an awaitable design specify?', zh: '为什么把异步 lambda 注册到 EventHandler 有风险，可等待设计应规定什么？' }
    answer:
      en: >-
        EventHandler returns void, so an async lambda assigned to it becomes async void. The publisher cannot await its completion, observe cancellation through a returned task, or catch exceptions thrown after an incomplete await through the raising call. If the publisher needs those guarantees, use an explicit delegate returning Task or expose an async method. The contract must state whether handlers run sequentially or concurrently, which CancellationToken applies, whether one failure stops or cancels others, and how multiple errors are reported. Merely naming the raising method RaiseAsync or wrapping handlers in Task.Run does not create these semantics.
      zh: >-
        EventHandler 返回 void，因此注册到它的异步 lambda 会变成 async void。发布者无法等待处理器完成，不能通过返回任务观察取消，也无法在触发调用中捕获发生在未完成 await 之后的异常。若发布者需要这些保证，应使用返回 Task 的明确委托，或者公开异步方法。契约必须说明处理器顺序执行还是并发执行、使用哪个 CancellationToken、一次失败是否停止或取消其他处理器，以及怎样报告多个错误。仅把触发方法命名为 RaiseAsync，或用 Task.Run 包装处理器，并不会产生这些语义。
    topics: [csharp/events]
    level: advanced
    section: { en: 'Concurrency', zh: '并发' }
    frequency: occasional
    tags: [async-void, task, exceptions, cancellation]

  - id: exception-handler-selection
    question: { en: 'How does C# choose a catch clause, and when should you use an exception filter?', zh: 'C# 如何选择 catch 子句，何时应该使用异常筛选器？' }
    answer:
      en: >-
        The runtime searches outward from the throw site and tests catch clauses in source order. A clause is eligible when the thrown object is assignment-compatible with its declared exception type. Its when filter, if present, must also return true; false continues the search. Put derived types before base types, because a general handler would otherwise make a later specific handler unreachable. Use filters for stable properties that decide recoverability, such as a parameter name or status code. Keep them fast and side-effect free because they run before the corresponding stack unwind; a filter that throws is treated as false.
      zh: >-
        运行时从抛出点沿调用栈向外搜索，并按源码顺序检查 catch 子句。抛出的对象与声明的异常类型赋值兼容时，子句才有资格处理；如果还有 when 筛选器，它也必须返回 true，返回 false 会继续搜索。派生类型要放在基类型之前，否则后面的具体处理器无法到达。筛选器适合检查决定能否恢复的稳定属性，例如参数名或状态码。它在对应的堆栈展开前运行，因此应保持快速且无副作用；筛选器抛出的异常会被视为 false。
    topics: [csharp/exceptions]
    level: intermediate
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [catch, exception-filter, stack-unwinding]

  - id: preserve-exception-diagnostics
    question: { en: 'What is the difference between throw;, throw ex;, and wrapping an exception?', zh: 'throw;、throw ex; 与包装异常有什么区别？' }
    answer:
      en: >-
        Inside a catch, throw; continues the current exception and preserves its existing stack information. throw ex; performs a new throw of the caught object, resetting the stack's starting point and obscuring the original propagation path. Wrapping creates a new exception to express the current abstraction; pass the caught exception as InnerException so diagnostics retain the lower-level type, message, and stack. Wrap only when you add stable context or change the error contract, not at every method. If propagation must resume later outside the catch, ExceptionDispatchInfo captures the exception with its propagation information and can rethrow it from another execution point.
      zh: >-
        在 catch 中，throw; 会继续传播当前异常并保留已有堆栈信息。throw ex; 则会重新抛出已捕获对象，把堆栈起点重置到当前位置，从而遮蔽原传播路径。包装异常用于表达当前抽象层的错误语义；应把已捕获异常作为 InnerException 传入，以保留底层类型、消息和堆栈。只有补充稳定上下文或改变错误契约时才包装，不要每个方法都包一层。若必须离开 catch 后再传播，可用 ExceptionDispatchInfo 连同传播信息一起捕获并在另一执行点抛出。
    topics: [csharp/exceptions]
    level: intermediate
    section: { en: 'Diagnostics', zh: '诊断' }
    frequency: common
    tags: [rethrow, inner-exception, stack-trace]

  - id: exceptions-versus-result-values
    question: { en: 'When should a C# API return a result instead of throwing an exception?', zh: 'C# API 何时应返回结果而不是抛出异常？' }
    answer:
      en: >-
        Return a value when the outcome is expected and callers routinely branch on it. TryParse and TryGetValue are good examples: malformed user input and a missing dictionary key can be normal states, so exceptions would make the ordinary path harder to read and diagnose. Throw when the method cannot fulfill its stated contract and the caller needs failure propagation, such as an invalid public argument or unavailable required storage. The choice belongs to the API contract, not a blanket performance rule. Preserve every state the caller must distinguish, but avoid a large result wrapper that merely recreates an exception hierarchy with strings.
      zh: >-
        当某个结果属于预期状态，而且调用方会经常据此分支时，应返回值。TryParse 与 TryGetValue 就是典型例子：用户输入格式错误、字典键缺失都可能是正常状态，用异常表达反而让普通路径更难阅读和诊断。方法无法履行明确契约，而且失败需要向上传播时再抛出，例如公开参数无效或必需存储不可用。这个选择属于 API 契约，不是笼统的性能规则。返回类型要保留调用方必须区分的状态，但不要用字符串堆出一个只是重复异常层次的大型结果包装器。
    topics: [csharp/exceptions]
    level: intermediate
    section: { en: 'API design', zh: 'API 设计' }
    frequency: common
    tags: [try-pattern, api-contract, control-flow]

  - id: async-exceptions-whenall-cancellation
    question: { en: 'How do exceptions and cancellation propagate through async methods and Task.WhenAll?', zh: '异常与取消如何通过异步方法和 Task.WhenAll 传播？' }
    answer:
      en: >-
        An async method returning Task normally stores an unhandled exception in that task, and await rethrows it in the waiting control flow. OperationCanceledException associated with the operation's token produces cancellation semantics, which should remain distinct from a fault. Task.WhenAll completes after every input task completes; it faults if any input faults, and its AggregateException retains all input failures. Awaiting the combined task throws one exception, so retain the Task.WhenAll result and inspect its Exception when every failure matters. When no task faults but at least one is canceled, the combined task is canceled. Avoid async void outside event-handler contracts because callers cannot await or inspect it.
      zh: >-
        返回 Task 的 async 方法通常会把未处理异常存入任务，await 再在等待方的控制流中重新抛出。与操作令牌关联的 OperationCanceledException 表示取消，不能和普通故障混为一谈。Task.WhenAll 会等所有输入任务结束；只要任一任务失败，组合任务就进入 Faulted，其 AggregateException 保留全部输入失败。await 组合任务时只会抛出其中一个异常，因此需要全部失败时要保留 Task.WhenAll 的结果并检查 Exception。没有失败但至少一个任务取消时，组合任务会取消。事件处理器契约之外应避免 async void，因为调用方无法等待或检查它。
    topics: [csharp/exceptions]
    level: advanced
    section: { en: 'Concurrency', zh: '并发' }
    frequency: occasional
    tags: [async, task-whenall, cancellation, aggregate-exception]

  - id: expressions-statements-and-types
    question: { en: 'How do expressions and statements relate to C#’s static type system?', zh: '表达式和语句与 C# 的静态类型系统有什么关系？' }
    answer:
      en: >-
        An expression is evaluated, has a compile-time type, and usually produces a value. A statement performs an action such as declaring a variable, assigning a value, calling a method, choosing a branch, or returning. Statements often contain nested expressions. The compiler types each inner expression before checking how the surrounding statement uses its result. That is why a double destination cannot retroactively change integer division on its right-hand side: the int division result already exists before assignment conversion. During review, annotate intermediate expression types rather than looking only at the final variable declaration.
      zh: >-
        表达式会被求值，具有编译时类型，并且通常产生一个值。语句执行声明变量、赋值、调用方法、选择分支或返回等动作，内部经常包含嵌套表达式。编译器先确定每个内层表达式的类型，再检查外层语句怎样使用结果。因此，double 目标变量不能反过来改变右侧的整数除法：赋值转换发生前，int 除法结果已经产生。审查时应标注中间表达式类型，不能只看最终变量声明。
    topics: [csharp/fundamentals]
    level: beginner
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [expressions, statements, static-types]

  - id: var-and-static-typing
    question: { en: 'Does var make a C# local variable dynamically typed?', zh: 'var 会让 C# 局部变量变成动态类型吗？' }
    answer:
      en: >-
        No. var asks the compiler to infer one static type from the initializer, and that type is fixed for the variable. For example, var amount = 12.5m infers decimal because of the m suffix; assigning a string later is a compile error. var changes what the source spells, not the runtime representation or available operations. It works best when the type is obvious from construction or awkward to repeat. Write the explicit type when it communicates domain meaning or prevents a surprising inference, and inspect the initializer whenever generated code uses var around numeric literals.
      zh: >-
        不会。var 只是让编译器根据初始化表达式推断一个静态类型，该变量的类型随后保持不变。例如，var amount = 12.5m 会因为 m 后缀推断成 decimal，之后赋字符串会产生编译错误。var 改变的是源码写法，不会改变运行时表示或可用操作。构造式已清楚表明类型，或类型名称很难重复时，var 很合适；领域含义更重要或推断可能意外时应写出类型。生成代码在数值字面量附近使用 var 时，要检查初始化表达式。
    topics: [csharp/fundamentals]
    level: beginner
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [var, type-inference, static-types]

  - id: reviewing-control-flow-paths
    question: { en: 'How do you review a loop or branch for control-flow bugs?', zh: '怎样审查循环或分支中的控制流错误？' }
    answer:
      en: >-
        Enumerate paths instead of following only the sample input. For a loop, trace zero, one, and several iterations; identify the first and last accessed element, the termination condition, and whether every continuing path advances state. For branches, include every else, switch fallback, early return, continue, break, and thrown exception. Record where each variable becomes definitely assigned and which invariants hold afterward. Then build boundary tests for empty input, one item, malformed values, limits, and unknown cases. This catches off-by-one errors, skipped updates, unreachable handling, and values used after failed parsing.
      zh: >-
        不要只沿示例输入执行一次，而要枚举路径。对循环分别推演零次、一次和多次迭代，确认第一个与最后一个访问元素、终止条件，以及每条继续路径是否推进状态。对分支要覆盖所有 else、switch 兜底、提前 return、continue、break 和抛出异常。记录每个变量在哪里完成明确赋值，以及后续成立哪些不变量。然后为输入为空、单项、格式错误、边界值和未知情况编写测试。这能发现差一错误、遗漏更新、不可达处理和解析失败后继续使用值等问题。
    topics: [csharp/fundamentals]
    level: intermediate
    section: { en: 'Control flow', zh: '控制流' }
    frequency: common
    tags: [branches, loops, boundaries, review]

  - id: method-signature-as-contract
    question: { en: 'What parts of a method contract can a C# signature express?', zh: 'C# 方法签名可以表达契约的哪些部分？' }
    answer:
      en: >-
        A signature expresses the method name, parameter types and passing modes, return type, generic parameters, and accessibility. Those choices let the compiler reject many invalid calls and tell callers which values must be supplied. A narrow type is preferable to object when the method needs a specific value. The signature cannot usually express every range, format, cross-parameter relationship, side effect, or failure policy, so the method validates remaining preconditions at its boundary and documents observable behavior. Avoid Boolean mode flags when named methods or an enum make valid choices clearer, and preserve every result state callers must distinguish.
      zh: >-
        方法签名能表达名称、参数类型与传递方式、返回类型、泛型参数和可访问性。编译器据此拒绝许多无效调用，调用方也能知道必须提供哪些值。方法需要具体值时，窄类型通常优于 object。签名一般无法表达所有范围、格式、参数间关系、副作用或失败策略，因此方法还要在边界验证剩余前置条件，并说明可观察行为。行为模式有名称时，应使用独立方法或枚举，而不是布尔开关；返回类型则要保留调用方必须区分的每种状态。
    topics: [csharp/fundamentals]
    level: intermediate
    section: { en: 'API design', zh: 'API 设计' }
    frequency: common
    tags: [methods, contracts, api-design]

  - id: property-versus-field
    question: { en: 'How does a C# property differ from a field, and when do you need a backing field?', zh: 'C# 属性与字段有什么区别，什么时候需要幕后字段？' }
    answer:
      en: >-
        A field is storage, while a property is a member whose get, set, or init accessors define read and assignment behavior. Callers use field-like syntax, but access still invokes those accessors. An auto-property is the default for simple storage because the compiler supplies its backing field. Declare a field explicitly when an accessor needs coordinated state, validation that is clearer without C# 14's field keyword, or storage shared with other behavior. Keep compiler-generated field names out of contracts because reflection-based dependencies on them are brittle.
      zh: >-
        字段是存储位置，属性则是通过 get、set 或 init 访问器定义读取与赋值行为的成员。调用方虽然使用字段式语法，实际仍会执行这些访问器。只需简单保存值时，自动属性通常是默认选择，幕后字段由编译器生成。访问器需要协调状态、验证逻辑不适合 C# 14 的 field 写法，或存储还要被其他行为共享时，再显式声明字段。编译器生成的字段名属于实现细节，不应成为反射契约。
    topics: [csharp/properties]
    level: beginner
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [properties, fields, accessors, backing-fields]

  - id: init-private-set-required
    question: { en: 'How do get-only, private set, init, and required properties differ?', zh: '只有 get、private set、init 与 required 属性有什么区别？' }
    answer:
      en: >-
        A get-only property can be initialized by its declaration or by a constructor but has no setter for later assignment. A private setter permits the declaring type to assign the property even after construction while rejecting external assignment. An init accessor lets callers assign during object construction and rejects ordinary later assignment. Required answers a different question: creation code must initialize the member unless the selected constructor declares that it already did. It can accompany set or init, performs no domain validation, and doesn't make referenced objects deeply immutable.
      zh: >-
        只有 get 的属性可以在声明处或构造函数中初始化，但没有供之后赋值的 setter。private set 允许声明类型在构造后继续赋值，同时拒绝外部赋值。init 允许调用方在对象构造阶段赋值，之后拒绝普通赋值。required 回答的是另一个问题：除非所选构造函数声明已经完成初始化，否则创建代码必须设置该成员。它可以配合 set 或 init，既不执行领域验证，也不会让引用对象深度不可变。
    topics: [csharp/properties]
    level: intermediate
    section: { en: 'Initialization', zh: '初始化' }
    frequency: common
    tags: [init, required, accessibility, immutability]

  - id: required-members-runtime-boundary
    question: { en: 'Why are required members not a runtime validation boundary?', zh: '为什么必需成员不能充当运行时验证边界？' }
    answer:
      en: >-
        Required members are primarily a compile-time protocol for C# object-creation expressions. An explicit assignment of null still counts as assigning the member, though nullable analysis can issue a separate warning. Reflection, some serializers, and code built with older compilers don't necessarily follow the same creation check. In addition, SetsRequiredMembers tells the compiler to trust a constructor without verifying its body. Validate nullness, formats, ranges, and cross-field rules inside the trusted model boundary, and test the actual serializer or framework construction path end to end.
      zh: >-
        必需成员主要是面向 C# 对象创建表达式的编译时协议。显式写入 null 仍算已经设置成员，可空分析只会另外给出警告。反射、某些序列化器以及旧编译器生成的代码也不一定经过同一项创建检查。此外，SetsRequiredMembers 会让编译器信任构造函数，却不验证函数体。空值、格式、范围和跨字段规则仍要在可信模型边界执行运行时验证，并针对实际序列化器或框架构造路径做端到端测试。
    topics: [csharp/properties]
    level: intermediate
    section: { en: 'Initialization', zh: '初始化' }
    frequency: common
    tags: [required, nullable, validation, sets-required-members]

  - id: property-mutable-ownership
    question: { en: 'What should you review when a property exposes a mutable object or collection?', zh: '属性公开可变对象或集合时应该审查什么？' }
    answer:
      en: >-
        First separate assignment mutability from object mutability. A get-only, private-set, or init property can still return a List, array, or mutable child that callers modify directly. Decide whether callers need a live view, an immutable value, or a snapshot. Keep mutable storage private and expose an immutable collection or read-only wrapper, then inspect whether elements themselves remain mutable. Also check equality and hash code: changing a property used for identity after insertion into a Dictionary or HashSet can make the object unreachable through its original key or bucket.
      zh: >-
        首先要区分属性赋值能力与对象本身的可变性。只有 get、private set 或 init 的属性仍可能返回 List、数组或可变子对象，调用方可以直接修改。应明确调用方需要实时视图、不可变值还是快照。把可变存储留在类型内部，对外提供不可变集合或只读包装，同时继续检查元素本身是否可变。还要检查相等性与哈希：对象进入 Dictionary 或 HashSet 后，如果参与身份的属性发生变化，集合可能无法再从原键或桶中找到它。
    topics: [csharp/properties]
    level: intermediate
    section: { en: 'API design', zh: 'API 设计' }
    frequency: occasional
    tags: [collections, ownership, mutability, hashing]

  - id: attributes-metadata-and-behavior
    question: { en: 'What is a C# attribute, and why does applying one not necessarily change program behavior?', zh: '什么是 C# 特性，为什么应用特性不一定会改变程序行为？' }
    answer:
      en: >-
        An attribute is structured declarative information attached to an assembly, type, member, parameter, return value, or another supported entity. The compiler encodes its constructor and arguments in assembly metadata. That record does nothing on its own. A consumer must interpret it: the C# compiler recognizes attributes such as Obsolete, while a test runner, serializer, web framework, analyzer, or application scanner recognizes its own types. When reviewing an unfamiliar attribute, identify its fully qualified type, exact target, consuming API, and execution phase. If no consumer reads it, the code has metadata but no implemented behavior.
      zh: >-
        特性是附到程序集、类型、成员、参数、返回值或其他受支持实体上的结构化声明信息。编译器把它的构造函数与实参编码进程序集元数据，但这条记录本身不会执行任何行为。消费者必须解释它：C# 编译器认识 Obsolete 等特性，测试运行器、序列化器、Web 框架、分析器或应用扫描器则认识各自的类型。审查陌生特性时，要确认完整类型名、准确目标、消费 API 与执行阶段。如果没有消费者读取它，代码只有元数据，没有实现相应功能。
    topics: [csharp/attributes]
    level: beginner
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [attributes, metadata, consumers]

  - id: designing-custom-attribute-contracts
    question: { en: 'How should you design the contract of a custom C# attribute?', zh: '应该怎样设计自定义 C# 特性的契约？' }
    answer:
      en: >-
        Derive a usually sealed class from System.Attribute and use AttributeUsage to state the smallest valid target set, whether multiple instances are meaningful, and whether inheritance is intended. Put required, ordered data in public constructor parameters. Put genuinely optional data in public writable fields or properties for named arguments, with explicit defaults. Attribute arguments must use metadata-compatible compile-time values such as strings, numbers, enums, Type values, or permitted one-dimensional arrays. Keep constructors and setters deterministic and free of I/O. Document how the consumer validates duplicates, conflicts, unknown values, and version changes, because the attribute class is a metadata protocol.
      zh: >-
        自定义特性类继承 System.Attribute，通常应声明为 sealed，并用 AttributeUsage 指定最小目标集合、能否出现多个实例以及是否参与继承。必需且有顺序的数据放在公开构造函数参数中，真正可选的数据放在公开可写字段或属性中作为命名实参，并给出明确默认值。实参必须是字符串、数值、枚举、Type 或允许的一维数组等可写入元数据的编译时值。构造函数与 setter 应保持确定且不执行 I/O。还要说明消费者如何处理重复、冲突、未知值与版本变化，因为特性类本质上是一份元数据协议。
    topics: [csharp/attributes]
    level: intermediate
    section: { en: 'API design', zh: 'API 设计' }
    frequency: common
    tags: [attribute-usage, arguments, api-contract]

  - id: attribute-instance-versus-data
    question: { en: 'When should a consumer use GetCustomAttributes, and when should it use CustomAttributeData?', zh: '消费者什么时候应使用 GetCustomAttributes，什么时候应使用 CustomAttributeData？' }
    answer:
      en: >-
        GetCustomAttribute and GetCustomAttributes create attribute instances, so they are convenient when trusted application code wants strongly typed properties. Construction invokes the attribute constructor and applies named field or property assignments; those operations can throw or produce side effects. CustomAttributeData instead exposes the constructor, positional arguments, and named arguments as metadata without creating the attribute object. It suits analyzers, documentation tools, plugin catalogs, and other discovery code that should not execute inspected attribute code. Use the plural instance API for multi-use attributes, define inheritance explicitly, validate every value, and cache a normal immutable descriptor when discovery feeds repeated runtime work.
      zh: >-
        GetCustomAttribute 与 GetCustomAttributes 会创建特性实例，适合可信应用代码需要强类型属性的场景。构造过程会调用特性构造函数，并执行命名字段或属性赋值，这些操作可能抛出异常或产生副作用。CustomAttributeData 则把构造函数、位置实参与命名实参作为元数据公开，不创建特性对象，适合分析器、文档工具、插件目录以及不应执行被检查代码的发现流程。多用特性要使用复数实例 API，继承策略要显式定义，所有值都要验证；发现结果会被重复使用时，应转换并缓存为普通不可变描述对象。
    topics: [csharp/attributes]
    level: intermediate
    section: { en: 'Reflection', zh: '反射' }
    frequency: common
    tags: [reflection, custom-attribute-data, instantiation]

  - id: attribute-targets-and-inheritance
    question: { en: 'What makes attribute targets and inheritance tricky in reflection-based frameworks?', zh: '为什么特性目标与继承会让反射框架容易出错？' }
    answer:
      en: >-
        One source declaration can correspond to several metadata entities. An auto-property has property metadata, accessor methods, and a generated backing field, so property:, method:, field:, param:, and return: can lead scanners to different places. Inheritance is a query policy, not copied metadata: the reflection entry point, its inherit argument, the attribute’s Inherited setting, and the member kind all matter. Interface implementation is not class inheritance and needs explicit interface mapping. A framework should document exactly which entities it scans, use plural retrieval for multi-use attributes, and test direct, overridden, interface, missing, and duplicate declarations separately.
      zh: >-
        一处源码声明可能对应多个元数据实体。自动属性同时涉及属性元数据、访问器方法和生成的幕后字段，因此 property:、method:、field:、param: 与 return: 会让扫描器到不同位置查找。继承是一项查询策略，不是复制后的元数据；反射入口、inherit 实参、特性的 Inherited 设置以及成员种类都会影响结果。接口实现也不属于类继承，需要显式处理接口映射。框架应说明具体扫描哪些实体，对多用特性使用复数读取，并分别测试直接声明、重写、接口、缺失与重复场景。
    topics: [csharp/attributes]
    level: advanced
    section: { en: 'Reflection', zh: '反射' }
    frequency: occasional
    tags: [attribute-targets, inheritance, interfaces, reflection]

  - id: choose-core-generic-collection
    question: { en: 'How do you choose among List<T>, Dictionary<TKey,TValue>, and HashSet<T>?', zh: '怎样在 List<T>、Dictionary<TKey,TValue> 与 HashSet<T> 之间选择？' }
    answer:
      en: >-
        Start from the dominant access pattern, not the item type. Use List<T> when position, sequential traversal, and append-at-end are central. Use Dictionary<TKey,TValue> when each value has a unique lookup key and callers retrieve by that key. Use HashSet<T> when uniqueness, membership tests, or set operations are the contract and values need no associated payload. Then state equality and ordering requirements explicitly. Dictionary and HashSet need stable key equality, while neither should be chosen for an accidental enumeration order. Capacity, mutation ownership, and concurrent access can change the final choice.
      zh: >-
        先看主要访问模式，不要只看元素类型。位置、顺序遍历和尾部追加最重要时使用 List<T>；每个值都有唯一查找键，而且调用方按键取值时使用 Dictionary<TKey,TValue>；契约强调唯一性、成员测试或集合运算，而且值不需要关联数据时使用 HashSet<T>。之后还要明确相等性与顺序要求。Dictionary 和 HashSet 都要求键的相等性稳定，也不应因为偶然的枚举顺序而被选中。容量、修改所有权与并发访问还可能改变最终选择。
    topics: [csharp/collections]
    level: beginner
    section: { en: 'Collections', zh: '集合' }
    frequency: common
    tags: [list, dictionary, hashset, access-pattern]

  - id: dictionary-key-equality-contract
    question: { en: 'What equality contract must a Dictionary key satisfy?', zh: 'Dictionary 键必须满足怎样的相等性契约？' }
    answer:
      en: >-
        A dictionary uses its IEqualityComparer<TKey> both to hash keys and to confirm equality. If two keys are equal, they must produce the same hash code, although unequal keys may collide. The fields involved in both operations must remain stable while the key is stored. Mutating such a field can leave the object in a bucket selected by its old hash, so lookup and removal may fail. Prefer immutable identifiers or value objects, and pass an explicit comparer when domain identity differs from EqualityComparer<TKey>.Default, such as ordinal case-insensitive SKU matching.
      zh: >-
        字典通过 IEqualityComparer<TKey> 计算键的哈希，并最终确认相等性。两个键相等时必须产生相同哈希码，但不相等的键可以发生碰撞。参与这两项操作的字段在键存入期间必须保持稳定；修改这些字段后，对象仍在旧哈希选择的桶中，查找和删除却可能失败。应优先使用不可变标识或值对象。领域身份不同于 EqualityComparer<TKey>.Default 时，要传入明确比较器，例如对 SKU 使用 ordinal 的不区分大小写匹配。
    topics: [csharp/collections]
    level: intermediate
    section: { en: 'Equality and hashing', zh: '相等性与哈希' }
    frequency: common
    tags: [dictionary, equality-comparer, hash-code, immutable-key]

  - id: readonly-view-versus-immutable-snapshot
    question: { en: 'How does a read-only collection view differ from an immutable snapshot?', zh: '只读集合视图与不可变快照有什么区别？' }
    answer:
      en: >-
        A read-only interface or wrapper prevents mutation through that particular reference, but it can still expose a mutable backing collection. The owner or another alias may change the data, and a caller can observe those changes. A snapshot copies the container state at one point, so later structural changes to the source are not visible. An immutable collection additionally exposes updates as operations that return new collection values. None of these choices automatically makes mutable elements deeply immutable. An API should say whether it returns a live view, shallow snapshot, or immutable value and define cross-thread visibility separately.
      zh: >-
        只读接口或包装器只会阻止调用方通过这条引用修改集合，背后的集合仍可能可变。拥有者或其他别名可以修改数据，调用方也会观察到这些变化。快照复制某个时点的容器状态，因此源集合之后的结构变化不会出现其中。不可变集合还会把更新表达为返回新集合值的操作。这些选择都不会自动让可变元素深度不可变。API 应说明返回的是实时视图、浅快照还是不可变值，并单独定义跨线程可见性。
    topics: [csharp/collections]
    level: intermediate
    section: { en: 'API design', zh: 'API 设计' }
    frequency: common
    tags: [read-only-view, snapshot, immutable-collection, ownership]

  - id: concurrent-dictionary-atomic-boundaries
    question: { en: 'What does ConcurrentDictionary make atomic, and why can GetOrAdd still repeat work?', zh: 'ConcurrentDictionary 保证哪些原子边界，为什么 GetOrAdd 仍可能重复工作？' }
    answer:
      en: >-
        ConcurrentDictionary keeps its documented member operations safe under concurrent calls and offers conditional single-key operations such as TryAdd and TryUpdate. It does not combine arbitrary sequences of calls into one transaction or protect invariants spanning several keys. GetOrAdd and AddOrUpdate invoke user delegates outside internal locks, so competing callers may execute a factory more than once even though only one value wins for a key. Factories should therefore be pure or safely repeatable. Irreversible effects and cross-key rules need a separate lock, transaction, idempotency mechanism, or coordinator whose boundary matches the business operation.
      zh: >-
        ConcurrentDictionary 保证文档列出的成员在并发调用下安全，并提供 TryAdd、TryUpdate 等针对单个键的条件操作。它不会把任意多次调用合并成事务，也不会保护跨多个键的不变量。GetOrAdd 与 AddOrUpdate 会在内部锁之外调用用户委托，因此竞争调用方可能多次执行工厂，尽管某个键最终只有一个值胜出。工厂应保持纯净或可安全重复执行。不可逆副作用与跨键规则需要另外使用锁、事务、幂等机制或专用协调对象，而且边界必须匹配业务操作。
    topics: [csharp/collections]
    level: advanced
    section: { en: 'Concurrency', zh: '并发' }
    frequency: occasional
    tags: [concurrent-dictionary, atomicity, value-factory, idempotency]

  - id: delegate-call-contract
    question: { en: 'What is a C# delegate, and when would you define a custom delegate instead of using Func or Action?', zh: '什么是 C# 委托，什么时候应自定义委托而不是使用 Func 或 Action？' }
    answer:
      en: >-
        A delegate is a reference type whose signature defines which methods it can invoke. A value can hold a static method, an instance method plus its target, a lambda, or an ordered invocation list. I use Func for value-returning callbacks and Action for void callbacks when the signature itself explains the contract. I define a custom delegate when the name carries domain meaning, when parameters need ref, in, out, or params modifiers, or when the public API needs its own documented contract. Two custom delegate types remain distinct even if their signatures match.
      zh: >-
        委托是一种引用类型，其签名决定它可以调用哪些方法。委托值可以保存静态方法、实例方法及其目标、lambda，也可以保存有序调用列表。只要签名足以解释契约，有返回值的回调通常用 Func，无返回值的回调用 Action。名称需要表达领域含义、参数需要 ref、in、out 或 params 修饰符，或者公开 API 需要独立文档契约时，我会自定义委托。两个自定义委托即使签名相同，仍是不同类型。
    topics: [csharp/delegates-events]
    level: intermediate
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [delegates, func, action, callbacks]

  - id: multicast-invocation-semantics
    question: { en: 'How does a multicast delegate handle order, return values, and exceptions?', zh: '多播委托怎样处理顺序、返回值与异常？' }
    answer:
      en: >-
        Direct invocation calls entries synchronously in invocation-list order. For a void delegate, each normally completing entry simply hands control to the next. For a returning delegate, all reached entries run, but the call expression receives only the last normally completed entry's result; earlier results are discarded. If an entry throws, invocation stops immediately and later entries do not run. There is no automatic error aggregation. When a contract requires every result or every attempt, I take a GetInvocationList snapshot, invoke entries individually, and define ordering, partial side effects, cancellation, and failure reporting explicitly.
      zh: >-
        直接调用会按调用列表顺序同步执行各项目。对于返回 void 的委托，正常完成的项目会把控制权交给下一项；对于有返回值的委托，所有执行到的项目都会运行，但调用表达式只得到最后一个正常完成项目的结果，前面结果会被丢弃。某个项目抛出异常后，调用立即停止，后续项目不会运行，也不会自动聚合错误。契约要求收集每个结果或尝试每个项目时，我会取得 GetInvocationList 快照，逐项调用，并明确规定顺序、部分副作用、取消与失败报告。
    topics: [csharp/delegates-events]
    level: intermediate
    section: { en: 'Runtime behavior', zh: '运行时行为' }
    frequency: common
    tags: [multicast-delegate, invocation-list, exceptions]

  - id: delegate-identity-removal
    question: { en: 'Why can an identical-looking lambda fail to remove an event handler?', zh: '为什么看起来相同的 lambda 可能无法移除事件处理器？' }
    answer:
      en: >-
        Removal is based on delegate equality, not source-text similarity. A delegate entry includes a method and, for an instance or capturing lambda, a target object. Writing another lambda can create another compiler-generated method or another captured target, so it does not reliably equal the registered delegate. I store the original delegate in a field or local, or subscribe and unsubscribe the same named method. I also place removal at the ownership boundary that created the subscription. A test should raise after cleanup; merely seeing that the -= expression compiles proves nothing about removal.
      zh: >-
        移除依据委托相等性，不依据源码是否相似。一个委托项目包含方法；对于实例方法或捕获型 lambda，它还包含目标对象。重新写一段 lambda 可能产生另一个编译器生成方法或捕获目标，因此不能可靠匹配原注册项。我会保存原委托实例，或者添加、移除同一个命名方法，并在创建订阅关系的所有权边界执行清理。测试应在清理后再次触发；`-=` 能通过编译，并不能证明处理器已经移除。
    topics: [csharp/delegates-events]
    level: intermediate
    section: { en: 'Object lifetime', zh: '对象生命周期' }
    frequency: common
    tags: [delegate-identity, lambda, unsubscribe, lifetime]

  - id: awaitable-delegate-contract
    question: { en: 'How should you design a callback contract when the caller must await every asynchronous handler?', zh: '调用方必须等待每个异步处理器时，应该怎样设计回调契约？' }
    answer:
      en: >-
        I avoid Action and EventHandler because an async lambda converted to either becomes async void. A Task-returning delegate such as Func<CancellationToken, Task> provides a completion signal, but direct multicast invocation still returns only the last handler's Task. The publisher must snapshot and cast the invocation list, then choose sequential awaits or collect all tasks for Task.WhenAll. Its contract states where cancellation comes from, whether one failure stops or cancels other handlers, how synchronous throws are handled, and how multiple failures are reported. If one result drives the request, a normal async method is often clearer.
      zh: >-
        我不会使用 Action 或 EventHandler，因为异步 lambda 转换到这两种类型后会成为 async void。Func<CancellationToken, Task> 等返回 Task 的委托能提供完成信号，但直接调用多播委托仍只返回最后一个处理器的 Task。发布方必须取得并转换调用列表快照，再选择顺序等待，或者收集全部任务交给 Task.WhenAll。契约还要说明取消来源、一次失败是否停止或取消其他处理器、怎样处理同步抛出，以及怎样报告多个失败。若一个结果会决定请求成败，普通异步方法往往更清楚。
    topics: [csharp/delegates-events]
    level: advanced
    section: { en: 'Async contracts', zh: '异步契约' }
    frequency: occasional
    tags: [async, task, multicast-delegate, cancellation]

  - id: expression-tree-versus-delegate
    question: { en: 'How does an expression tree differ from a delegate, and when do you choose each?', zh: '表达式树与委托有什么区别，应该怎样选择？' }
    answer:
      en: >-
        A delegate is typed executable behavior: callers can invoke it, but they cannot recover a supported, portable representation of its body. An Expression<TDelegate> is an immutable, typed object graph describing a lambda. A consumer can inspect or rewrite that graph, translate it through a query provider, or compile it into a delegate. I choose a delegate for callbacks and in-process execution. I choose an expression tree only when another component must understand the structure, and I document that consumer’s supported nodes because valid C# and valid expression trees can still be untranslatable.
      zh: >-
        委托是有类型的可执行行为：调用方可以调用它，却无法从中恢复受支持、可移植的函数体表示。Expression<TDelegate> 则是描述 lambda 的不可变、有类型对象图。消费者可以检查或改写这棵树，通过查询提供程序翻译它，也可以把它编译成委托。回调和进程内执行应选择委托；只有另一组件必须理解代码结构时才选择表达式树，并明确该消费者支持哪些节点，因为合法 C# 和合法表达式树仍可能无法翻译。
    topics: [csharp/expression-trees]
    level: intermediate
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [expression-tree, delegate, compilation, translation]

  - id: compose-expression-predicates
    question: { en: 'How do you safely combine two `Expression<Func<T, bool>>` predicates?', zh: '怎样安全组合两个 `Expression<Func<T, bool>>` 谓词？' }
    answer:
      en: >-
        Parameter binding uses ParameterExpression object identity, not the displayed name. Two independently created predicates therefore have distinct parameter objects even when both are named x. I create one canonical parameter, visit each body, and replace its original parameter with that instance before joining the bodies with AndAlso or OrElse. The resulting lambda binds only the canonical parameter. I avoid Expression.Invoke unless the target provider explicitly supports InvocationExpression. A reusable visitor must also respect nested lambda scopes so it does not replace a parameter declaration that shadows the outer one.
      zh: >-
        参数绑定依据 ParameterExpression 对象标识，而不是显示名称。因此，两个独立谓词即使都把参数叫作 x，仍拥有不同参数对象。我会创建一个规范参数，遍历两个函数体，把各自原参数替换成该实例，再用 AndAlso 或 OrElse 连接函数体；最终 lambda 只绑定规范参数。除非目标提供程序明确支持 InvocationExpression，否则不使用 Expression.Invoke。通用访问器还必须尊重嵌套 lambda 的作用域，避免替换遮蔽外层参数的内部声明。
    topics: [csharp/expression-trees]
    level: advanced
    section: { en: 'Tree rewriting', zh: '树改写' }
    frequency: common
    tags: [parameter-identity, expression-visitor, predicate-composition]

  - id: query-provider-translation-boundary
    question: { en: 'Where is the translation boundary in an `IQueryable<T>` pipeline?', zh: '`IQueryable<T>` 管道中的翻译边界在哪里？' }
    answer:
      en: >-
        Queryable operators accept expression trees and extend the query description held by the source’s IQueryProvider. Translation and remote execution usually happen only when enumeration or a terminal operator demands a result. Compile converts a predicate to a delegate, while AsEnumerable changes subsequent operator binding to Enumerable; either step moves later work to ordinary in-process execution. AsQueryable on an in-memory sequence does not recreate a database provider. I inspect every materialization and type-boundary call, then test supported nodes, null semantics, parameterization, results, and query count against the actual provider rather than List<T>.AsQueryable().
      zh: >-
        Queryable 运算符接收表达式树，并扩展由源 IQueryProvider 保存的查询描述。翻译与远程执行通常推迟到枚举或终结运算符要求结果时。Compile 会把谓词转成委托，AsEnumerable 则让后续运算符绑定到 Enumerable；两者都会使后续工作变为普通进程内执行。对内存序列调用 AsQueryable 不会重新产生数据库提供程序。我会检查每个物化和类型边界调用，再用真实提供程序验证支持节点、空值语义、参数化、结果与查询次数，而不是只测 List<T>.AsQueryable()。
    topics: [csharp/expression-trees]
    level: advanced
    section: { en: 'LINQ providers', zh: 'LINQ 提供程序' }
    frequency: common
    tags: [iqueryable, iqueryprovider, deferred-execution, client-evaluation]

  - id: review-dynamic-expression-builder
    question: { en: 'What do you review in a dynamic expression builder fed by client input?', zh: '审查接收客户端输入的动态表达式构建器时要看什么？' }
    answer:
      en: >-
        I treat the builder as a small input language. External names map to an explicit property and operator allowlist rather than every member reflection can find. Values are parsed with a documented culture, enum, and nullable policy, then represented with the exact operand type. I bound tree depth and collection sizes, reject unsupported nodes before provider execution, and pass values as provider parameters instead of target-language text. Tests cover forbidden and missing members, invalid and null values, provider translation, authorization, and in-memory parity. Any cache also needs structural keys, capacity, invalidation, and capture-lifetime checks.
      zh: >-
        我会把构建器视为一种小型输入语言。外部名称必须映射到明确的属性和操作符白名单，而不是反射能够找到的所有成员。值要按已说明的区域、枚举与可空策略解析，再用准确的操作数类型表示。我会限制树深与集合大小，在提供程序执行前拒绝不支持的节点，并把值作为提供程序参数而不是目标语言文本传入。测试要覆盖禁止和缺失成员、无效与空值、提供程序翻译、授权和内存语义一致性。缓存还需要结构键、容量、失效与捕获对象生命周期检查。
    topics: [csharp/expression-trees]
    level: advanced
    section: { en: 'API design', zh: 'API 设计' }
    frequency: occasional
    tags: [dynamic-filter, allowlist, type-conversion, resource-limits]

  - id: generics-versus-object
    question: { en: 'What does a generic API preserve that an object-based API loses?', zh: '泛型 API 保留了哪些基于 object 的 API 会丢失的信息？' }
    answer:
      en: >-
        A generic signature preserves relationships between argument, storage, and result types. For example, T Find<T>(IEnumerable<T>) states that a successful result has the sequence element type, while an object-based version makes the caller cast and moves a mismatch to runtime. Generic collections also store value types without converting every element through object, avoiding that boxing path. I still choose constraints deliberately: an unconstrained T does not promise comparison or arithmetic. Equality uses EqualityComparer<T>.Default or an injected comparer, and business validation remains a separate runtime responsibility.
      zh: >-
        泛型签名会保留实参、存储与结果类型之间的关系。例如，T Find<T>(IEnumerable<T>) 表明成功结果与序列元素类型相同；基于 object 的版本则要求调用方强制转换，并把类型不匹配推迟到运行时。泛型集合存储值类型时也不必让每个元素都经过 object，从而避开这条装箱路径。不过，约束仍要有意选择：无约束的 T 不保证比较或算术能力。相等判断应使用 EqualityComparer<T>.Default 或传入的比较器，业务验证仍是独立的运行时责任。
    topics: [csharp/generics]
    level: beginner
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [generics, type-safety, boxing, type-relationships]

  - id: minimal-generic-constraints
    question: { en: 'How do you choose constraints for a public generic method?', zh: '怎样为公开泛型方法选择约束？' }
    answer:
      en: >-
        I start from operations in the implementation and map each one to the narrowest protocol. Equality usually needs an IEqualityComparer<T>, ordering can accept IComparer<T>, and static arithmetic can use operator interfaces or INumber<T>. I add new() only when the generic code owns parameterless construction and an empty instance is valid. Every unused constraint excludes legitimate types and becomes an API compatibility boundary. Constraints describe type capabilities; they do not validate null values, ranges, authorization, or domain invariants, so those checks still belong at runtime boundaries.
      zh: >-
        我会从实现中的具体操作出发，把每项操作映射到最窄的协议。相等判断通常需要 IEqualityComparer<T>，排序可以接收 IComparer<T>，静态算术可使用运算符接口或 INumber<T>。只有泛型代码负责无参创建，而且空实例本身有效时，我才添加 new()。每个未使用的约束都会排除合法类型，并成为 API 兼容性边界。约束描述类型能力，不会验证 null 值、范围、授权或领域不变量；这些检查仍应放在运行时边界。
    topics: [csharp/generics]
    level: intermediate
    section: { en: 'API design', zh: 'API 设计' }
    frequency: common
    tags: [generic-constraints, api-design, runtime-validation]

  - id: generic-variance-directions
    question: { en: 'Why is IEnumerable<Dog> assignable to IEnumerable<Animal>, while List<Dog> is not assignable to List<Animal>?', zh: '为什么 IEnumerable<Dog> 可以赋给 IEnumerable<Animal>，而 List<Dog> 不能赋给 List<Animal>？' }
    answer:
      en: >-
        IEnumerable<out T> is covariant because its contract produces T values without accepting them for mutation. An existing Dog-to-Animal reference conversion can therefore propagate through the interface. List<T> both reads and writes T and is invariant. If List<Dog> became List<Animal>, a caller could insert a Cat and corrupt the original dog list. Variance annotations exist only on interface and delegate type parameters, and their conversions require reference-type arguments. Thus IEnumerable<int> does not become IEnumerable<object>; int-to-object is boxing, not an implicit reference conversion.
      zh: >-
        IEnumerable<out T> 是协变接口，因为它的契约只产生 T，不接收 T 进行修改。因此，已有的 Dog 到 Animal 引用转换可以沿接口传播。List<T> 同时读取和写入 T，所以保持不变。如果 List<Dog> 能变成 List<Animal>，调用方就能插入 Cat，破坏原来的狗列表。只有接口和委托的类型参数可以声明变体，而且转换要求引用类型实参。因此，IEnumerable<int> 不会变成 IEnumerable<object>；int 到 object 是装箱，不是隐式引用转换。
    topics: [csharp/generics]
    level: intermediate
    section: { en: 'Type relationships', zh: '类型关系' }
    frequency: common
    tags: [variance, covariance, invariance, reference-conversion]

  - id: generic-runtime-identity
    question: { en: 'What generic type information does the .NET runtime retain?', zh: '.NET 运行时会保留哪些泛型类型信息？' }
    answer:
      en: >-
        Closed constructed types retain their type arguments, so reflection distinguishes List<int> from List<string> and can recover int or string. Both point back to the List<> generic type definition. Static fields also belong to each closed constructed type, which makes per-type caches possible but can multiply long-lived state. Runtime code generation may share implementation code across reference-type arguments and specialize value-type constructions; that implementation detail does not erase type identity. Reflection factories must distinguish open definitions from closed types and handle arity and constraint failures from MakeGenericType.
      zh: >-
        封闭构造类型会保留类型实参，因此反射能区分 List<int> 与 List<string>，也能取回 int 或 string；两者都指向 List<> 泛型类型定义。静态字段同样归每个封闭构造类型所有，这让按类型缓存成为可能，也可能成倍增加长期状态。运行时生成代码时可以让多个引用类型实参共享实现，并为值类型构造生成专门代码；这种实现细节不会擦除类型身份。反射工厂必须区分开放定义与封闭类型，并处理 MakeGenericType 的参数个数和约束失败。
    topics: [csharp/generics]
    level: advanced
    section: { en: 'Runtime behavior', zh: '运行时行为' }
    frequency: occasional
    tags: [constructed-type, reflection, static-fields, runtime]

  - id: linq-deferred-execution-boundary
    question: { en: 'What does deferred execution mean in LINQ, and when would you materialize a query?', zh: 'LINQ 的延迟执行是什么意思，什么时候应该物化查询？' }
    answer:
      en: >-
        Deferred execution means a sequence-returning query usually records operations and does not read its source until enumeration. Each new enumeration can rerun filters, selectors, I/O, or a provider query and can observe changed source data. I materialize with ToList or ToArray when the contract needs a stable membership snapshot, repeated reads of one result, or data that must outlive a resource scope. Materialization copies the outer container, not the referenced objects. I keep a query deferred when composition or short-circuiting matters and the source remains valid through consumption.
      zh: >-
        延迟执行表示返回序列的查询通常只记录操作，直到枚举时才读取数据源。每次重新枚举都可能再次执行筛选、投影、I/O 或提供程序查询，也可能看到已经变化的源数据。契约需要稳定成员快照、需要重复读取同一结果，或者数据必须离开资源作用域时，我会用 ToList 或 ToArray 物化。物化只复制外层容器，不复制其中引用的对象。需要继续组合或短路，而且数据源在消费期间保持有效时，则保留延迟查询。
    topics: [csharp/linq]
    level: intermediate
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [linq, deferred-execution, materialization]

  - id: linq-element-operator-cardinality
    question: { en: 'How do you choose among First, FirstOrDefault, Single, and SingleOrDefault?', zh: '怎样在 First、FirstOrDefault、Single 与 SingleOrDefault 之间选择？' }
    answer:
      en: >-
        I choose from the domain cardinality, not from which operator avoids an exception. First requires at least one result but permits more. Single asserts exactly one and exposes duplicates as a failure. Their OrDefault variants allow no result, but SingleOrDefault still rejects multiple results. A default value can itself be valid, such as zero for int, so a bare return value may not represent presence clearly. I test zero, one, and multiple matches separately and use a nullable or explicit result type when missing must remain distinguishable.
      zh: >-
        我会根据领域基数选择，而不是看哪个运算符能避免异常。First 要求至少一项，但允许更多项；Single 断言恰好一项，并把重复数据暴露为失败。两者的 OrDefault 版本允许没有结果，但 SingleOrDefault 仍会拒绝多项。默认值本身可能是合法数据，例如 int 的零，所以裸返回值未必能清楚表达是否存在。我会分别测试零项、一项与多项；必须区分缺失时，改用可空类型或明确的结果类型。
    topics: [csharp/linq]
    level: intermediate
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [linq, cardinality, element-operators]

  - id: linq-multiple-enumeration-review
    question: { en: 'Why is multiple enumeration of IEnumerable<T> risky, and how do you review it?', zh: '为什么重复枚举 IEnumerable<T> 有风险，应该怎样审查？' }
    answer:
      en: >-
        IEnumerable<T> promises traversal, not cached data or repeatability. Calling Any or Count and then iterating can run an iterator twice, issue two remote queries, repeat side effects, or observe different source states. I mark every consumer, including string.Join, aggregates, serializers, and logging helpers, then identify the concrete source. If the operation needs one stable set, I materialize once and use the collection. If it is intentionally streaming, I design one-pass control flow and avoid an emptiness probe. Tests use a source that counts or rejects a second enumeration.
      zh: >-
        IEnumerable<T> 只承诺可以遍历，不承诺已经缓存数据，也不承诺能够重复消费。先调用 Any 或 Count 再遍历，可能让迭代器运行两遍、发起两次远程查询、重复副作用，或看到不同的数据源状态。我会标出 string.Join、聚合、序列化器和日志辅助方法等每个消费点，再确认具体源类型。操作需要一组稳定数据时，只物化一次并使用集合；刻意流式处理时，则设计单遍控制流，不预先探测是否为空。测试会使用统计枚举次数或拒绝第二次枚举的数据源。
    topics: [csharp/linq]
    level: intermediate
    section: { en: 'Runtime behavior', zh: '运行时行为' }
    frequency: common
    tags: [linq, multiple-enumeration, side-effects]

  - id: linq-enumerable-queryable-boundary
    question: { en: 'What changes when a LINQ pipeline crosses from IQueryable<T> to IEnumerable<T>?', zh: 'LINQ 管道从 IQueryable<T> 跨到 IEnumerable<T> 时会发生什么变化？' }
    answer:
      en: >-
        Queryable operators build expression-tree descriptions for the source provider, while Enumerable operators accept delegates and execute ordinary .NET logic. AsEnumerable does not fetch data by itself, but it makes later extension calls bind to Enumerable; ToList both executes and materializes. I keep translatable filters, projections, ordering, and limits before that boundary so remote work stays remote. Then I inspect the real provider's generated query, parameters, null and collation behavior, result size, and round trips. Testing only List<T>.AsQueryable proves an in-memory path, not production translation.
      zh: >-
        Queryable 运算符为数据源提供程序构建表达式树描述，Enumerable 运算符则接收委托并执行普通 .NET 逻辑。AsEnumerable 本身不会取回数据，但会让后续扩展调用绑定到 Enumerable；ToList 会同时执行查询并物化结果。我会把可翻译的筛选、投影、排序和限制留在边界之前，让远程工作继续在远端完成。随后还要检查真实提供程序生成的查询、参数、空值与排序规则、结果规模和往返次数。只测试 List<T>.AsQueryable 只能证明内存路径，不能证明生产环境的翻译。
    topics: [csharp/linq]
    level: advanced
    section: { en: 'LINQ providers', zh: 'LINQ 提供程序' }
    frequency: common
    tags: [linq, iqueryable, query-provider, translation-boundary]

  - id: pattern-switch-arm-selection
    question: { en: 'How does C# choose an arm in a pattern-based switch expression?', zh: 'C# 怎样选择基于模式的 switch 表达式分支？' }
    answer:
      en: >-
        C# evaluates switch-expression arms in text order and selects the first arm whose pattern matches and whose optional when guard is true. That makes ordering part of the contract: narrow constants, types, and ranges normally precede broader patterns. The compiler rejects a later arm when preceding unguarded patterns provably subsume it, but it cannot infer arbitrary relationships between guard methods. I keep guards side-effect free, put a deliberate catch-all last when the boundary accepts unknown values, and test an overlapping input that could satisfy more than one arm to prove the intended priority.
      zh: >-
        C# 按文本顺序检查 switch 表达式分支，选择第一个模式匹配且可选 when 守卫为真的分支。因此，顺序就是契约的一部分：窄常量、具体类型和小范围通常位于宽模式之前。若前面的无守卫模式能够证明涵盖后续分支，编译器会拒绝代码，但它无法推断任意守卫方法之间的关系。我会让守卫保持无副作用，在边界允许未知值时把明确兜底放到最后，并用能同时满足多个模式的重叠输入验证优先级。
    topics: [csharp/pattern-matching]
    level: intermediate
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [switch-expression, arm-order, case-guard, subsumption]

  - id: pattern-null-and-recursion
    question: { en: 'How do type and property patterns behave with null?', zh: '类型模式与属性模式遇到 null 时怎样工作？' }
    answer:
      en: >-
        A declaration or type pattern never matches null, so value is string text proves both runtime compatibility and a non-null text variable. A property pattern also requires a non-null input. If an intermediate receiver in an extended property path is null, the pattern fails instead of throwing NullReferenceException. I use the null constant pattern for null, is not null for a direct non-null test, and remember that var other still matches null. These checks narrow only the facts expressed by the pattern; omitted fields and external business invariants still need validation.
      zh: >-
        声明模式或类型模式不会匹配 null，因此 value is string text 同时证明运行时类型兼容，而且 text 非空。属性模式也要求输入非空；扩展属性路径中的中间接收者为空时，模式会失败，而不是抛出 NullReferenceException。我用 null 常量模式检查空值，用 is not null 直接检查非空，并记住 var other 仍会匹配 null。这些检查只收窄模式明确表达的事实，未出现的字段和外部业务不变量仍需单独验证。
    topics: [csharp/pattern-matching]
    level: intermediate
    section: { en: 'Nullability and flow', zh: '可空性与控制流' }
    frequency: common
    tags: [type-pattern, property-pattern, 'null', definite-assignment]

  - id: pattern-switch-exhaustiveness
    question: { en: 'What does exhaustiveness mean for a switch expression, and what can still go wrong?', zh: 'switch 表达式的穷尽性是什么意思，仍有哪些失败边界？' }
    answer:
      en: >-
        A switch expression is exhaustive when some arm applies to every possible input. A final discard supplies that syntactic catch-all, but its business meaning may be wrong if it silently treats new input as success. Without a matching arm, modern .NET throws SwitchExpressionException, and the compiler usually warns about incomplete coverage. I still test null, unknown derived types, and enum values created by casting undefined underlying numbers. List patterns need extra care because the compiler does not warn that sequence lengths or shapes are incompletely covered. The failure policy should be explicit rather than warning-driven.
      zh: >-
        某个分支能处理每种可能输入时，switch 表达式才是穷尽的。最后的弃元模式能提供语法兜底，但若它把新输入静默当成成功，业务含义仍然错误。没有分支匹配时，现代 .NET 会抛出 SwitchExpressionException，编译器通常也会警告覆盖不完整。我仍会测试 null、未知派生类型，以及由未定义底层数值强制转换出的枚举值。列表模式还需额外小心，因为编译器不会警告序列长度或形状覆盖不完整。失败策略应由契约明确规定，不能只依赖警告。
    topics: [csharp/pattern-matching]
    level: advanced
    section: { en: 'Exhaustiveness', zh: '穷尽性' }
    frequency: common
    tags: [exhaustiveness, discard-pattern, enum, failure-contract]

  - id: pattern-list-input-protocol
    question: { en: 'What input can a C# list pattern match, and how does a slice change the requirement?', zh: 'C# 列表模式能匹配什么输入，切片会怎样改变要求？' }
    answer:
      en: >-
        List-pattern compatibility is structural. The static input type must be countable through an accessible Length or Count and indexable through an Index or int indexer; IEnumerable<T> alone is insufficient. A bare slice such as .. only adjusts the length and positions used by other subpatterns. Capturing or testing the middle with .. var middle also requires slicing support through a Range indexer or suitable Slice method, with language-defined handling for arrays and strings. I use list patterns for short positional shapes, not arbitrary stream search, and bound any stream before materializing it.
      zh: >-
        列表模式按结构判断兼容性。输入的静态类型必须能通过可访问的 Length 或 Count 计数，并能通过 Index 或 int 索引器读取；只有 IEnumerable<T> 不够。单独的 .. 只会调整长度与其他子模式使用的位置。用 .. var middle 捕获或检查中间部分时，还需要 Range 索引器或合适的 Slice 方法；数组和字符串由语言规定处理方式。我会把列表模式用于短小的位置形状，而不是任意流搜索；需要物化流时，先限制其大小。
    topics: [csharp/pattern-matching]
    level: advanced
    section: { en: 'Sequence patterns', zh: '序列模式' }
    frequency: occasional
    tags: [list-pattern, slice-pattern, indexing, ienumerable]
