track: csharp
items:
  - id: value-versus-reference-copy-semantics
    question: { en: 'How do value types and reference types differ in C#?', zh: 'C# 中的值类型与引用类型有什么区别？' }
    answer:
      en: >-
        A value-type variable contains its value, so ordinary assignment and by-value argument passing copy that value. A reference-type variable contains a reference; copying it can leave two variables pointing to one mutable object. This is a statement about observable semantics, not a rule that structs always live on the stack and classes always live on the heap. Value-type fields can be inline inside heap objects, and boxing creates an object for a value. A struct can also contain reference fields, so copying it is only a field-by-field copy, not a recursive copy of referenced objects.
      zh: >-
        值类型变量直接包含值，因此普通赋值与按值传参会复制该值。引用类型变量包含引用，复制后两个变量可能指向同一个可变对象。这描述的是可观察语义，并不表示结构体永远在栈上、类永远在堆上。值类型字段可以内联在堆对象中，装箱也会为值创建对象。结构体还可以包含引用字段，所以复制结构体只是逐字段复制，不会递归复制字段指向的对象。
    topics: [csharp/data-types]
    level: beginner
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [value-types, reference-types, copying]

  - id: two-meanings-of-nullable
    question: { en: 'How does T? differ for value types and reference types?', zh: 'T? 用于值类型和引用类型时有什么不同？' }
    answer:
      en: >-
        For a non-nullable value type T, T? is shorthand for Nullable<T>, a value that records whether an underlying T is present. For a reference type, T? is a nullable annotation on the same runtime reference type. It tells the compiler that null is expected and participates in null-state analysis, but it doesn't wrap the object or add a runtime check. The null-forgiving operator suppresses a warning only. Code must still validate values arriving through deserialization, reflection, older assemblies, or disabled nullable contexts, because those paths can violate the annotated intent.
      zh: >-
        对非可空值类型 T，T? 是 Nullable<T> 的简写，它记录是否存在底层 T 值。对引用类型，T? 是同一个运行时引用类型上的可空注解，用于告诉编译器 null 属于预期状态，并参与空状态分析；它不会包装对象，也不会添加运行时检查。空包容运算符只会抑制警告。反序列化、反射、旧程序集或禁用可空上下文的代码仍可能违反注解表达的意图，因此边界处依然需要验证。
    topics: [csharp/data-types]
    level: intermediate
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [nullable-value-types, nullable-reference-types]

  - id: safe-numeric-conversions
    question: { en: 'How do you make numeric conversions and arithmetic fail safely?', zh: '怎样让数值转换与算术运算安全失败？' }
    answer:
      en: >-
        Start by identifying the type of every intermediate expression. A wider destination doesn't prevent earlier overflow: two int operands still multiply as int before assignment to long. Widen an operand before the operation and put the complete expression in a checked context when overflow must be rejected. Explicit casts can narrow range, while implicit integer-to-floating conversions can still lose precision. For external text, use TryParse with an explicit culture and format policy rather than a cast or exception-driven parsing. Boundary tests should cover malformed input, extrema, combined maxima, signs, and any required decimal scale or rounding rule.
      zh: >-
        首先确定每个中间表达式的类型。更宽的目标变量不能阻止先前溢出：两个 int 操作数仍会先按 int 相乘，再赋给 long。需要拒绝溢出时，应在运算前扩大一个操作数，并让 checked 覆盖完整表达式。显式强制转换可能缩小范围，整数到浮点数的隐式转换也可能丢失精度。外部文本应使用带明确区域性与格式策略的 TryParse，而不是强制转换或异常驱动的解析。边界测试要覆盖格式错误、极值、组合最大值、符号以及小数位和舍入规则。
    topics: [csharp/data-types]
    level: intermediate
    section: { en: 'Numbers and conversions', zh: '数值与转换' }
    frequency: common
    tags: [numeric-conversions, overflow, parsing]

  - id: boxing-and-exact-unboxing
    question: { en: 'What are boxing and unboxing, and why must unboxing use the exact type?', zh: '什么是装箱与拆箱，为什么拆箱必须使用准确类型？' }
    answer:
      en: >-
        Boxing converts a value type to object or to an implemented interface and usually creates an object containing a copy of the value. Unboxing checks the boxed runtime value type and extracts that value. The check requires an exact match: an int boxed as object can't be unboxed directly as long even though an unboxed int can widen to long. First unbox as int, then perform the numeric conversion. Repeated boxing adds allocations and type checks, so generic collections such as List<int> are preferable to object-based containers. Generic code can still box when it explicitly converts T to object or an interface.
      zh: >-
        装箱把值类型转换成 object 或它实现的接口，通常会创建一个包含值副本的对象。拆箱检查箱中值的运行时类型并提取该值，而且要求类型准确匹配：装箱为 object 的 int 不能直接拆成 long，尽管拆箱后的 int 可以扩大为 long。正确顺序是先拆成 int，再执行数值转换。重复装箱会增加分配与类型检查，因此 List<int> 等泛型集合通常优于基于 object 的容器。泛型代码显式把 T 转成 object 或接口时仍可能装箱。
    topics: [csharp/data-types]
    level: intermediate
    section: { en: 'Runtime behavior', zh: '运行时行为' }
    frequency: occasional
    tags: [boxing, unboxing, generics]

  - id: event-versus-public-delegate
    question: { en: 'How does a C# event differ from exposing a public delegate field?', zh: 'C# 事件与公开委托字段有什么区别？' }
    answer:
      en: >-
        An event has a delegate type but restricts how outside code can use the member. Subscribers can add and remove handlers with += and -=; they cannot replace the whole invocation list, clear it, or raise the event. The declaring type retains those operations and therefore controls when notification occurs. A public delegate field exposes all delegate operations, so any caller can overwrite other registrations or invoke the callbacks with arbitrary arguments. Field-like events use compiler-provided storage and add/remove accessors, while explicit event accessors let a type control or forward subscription storage.
      zh: >-
        事件具有委托类型，但会限制外部代码使用该成员的方式。订阅者可以通过 += 和 -= 添加、移除处理器，却不能替换整个调用列表、将其清空或触发事件；这些操作留在声明类型内部，因此发布者控制通知时机。公开委托字段会暴露全部委托操作，任何调用方都能覆盖其他注册项，或使用任意参数执行回调。字段式事件由编译器提供存储与 add、remove 访问器；显式事件访问器则允许类型控制或转发订阅存储。
    topics: [csharp/events]
    level: intermediate
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [events, delegates, encapsulation]

  - id: multicast-event-handler-failure
    question: { en: 'What happens when one handler of a multicast C# event throws?', zh: 'C# 多播事件的某个处理器抛出异常时会发生什么？' }
    answer:
      en: >-
        Handlers run synchronously in invocation-list order by default. If one throws, that exception returns to the code that raised the event, and handlers later in the list do not run. Catching around the event invocation receives the failure but does not resume the skipped handlers. If the API contract requires every handler to be attempted, the publisher must snapshot the invocation list, invoke entries individually, and define how it records or aggregates failures. Required invariant updates and cleanup should stay in publisher code, with cleanup protected by finally, rather than relying on a final subscriber.
      zh: >-
        默认情况下，处理器会按调用列表顺序同步运行。某个处理器抛出异常后，异常会返回触发事件的代码，列表中排在后面的处理器不会执行。在事件调用外层捕获异常只能接住失败，无法让已跳过的处理器恢复运行。如果 API 契约要求尝试每个处理器，发布者必须先取得调用列表快照，再逐个调用，并明确记录或聚合失败的方式。维护不变量的必做更新与清理应留在发布者内部，清理还要由 finally 保护，不能依赖最后一个订阅者。
    topics: [csharp/events]
    level: intermediate
    section: { en: 'Runtime behavior', zh: '运行时行为' }
    frequency: common
    tags: [multicast-delegate, exceptions, invocation-order]

  - id: event-subscription-retention
    question: { en: 'When can an event subscription keep a subscriber alive, and how do you prevent it?', zh: '事件订阅何时会让订阅者持续存活，怎样避免？' }
    answer:
      en: >-
        A delegate for an instance method holds a strong reference to its target. While a reachable publisher keeps that delegate in its event invocation list, the subscriber remains reachable too. This matters when a static event, singleton, or other long-lived publisher outlives a page, request object, or temporary service. Put removal at the same ownership boundary that created the subscription, often in Dispose or a framework unload hook, and remove the exact named method or stored delegate instance. A newly written equivalent lambda does not identify the original registration. Tests should raise after cleanup and can use a weak reference to check collection.
      zh: >-
        实例方法委托会强引用其目标对象。只要可达的发布者仍把这个委托保存在事件调用列表中，订阅者也会保持可达。当静态事件、单例或其他长期发布者比页面、请求对象或临时服务活得更久时，这个问题尤其明显。应在创建订阅的同一所有权边界执行移除，常见位置是 Dispose 或框架卸载钩子，并移除准确的命名方法或已保存委托实例。重新写一个等价 lambda 无法标识原注册项。测试应在清理后再次触发，也可以用弱引用检查对象能否回收。
    topics: [csharp/events]
    level: intermediate
    section: { en: 'Object lifetime', zh: '对象生命周期' }
    frequency: common
    tags: [lifetime, strong-reference, unsubscribe]

  - id: async-event-handler-contract
    question: { en: 'Why is an async lambda attached to EventHandler risky, and what should an awaitable design specify?', zh: '为什么把异步 lambda 注册到 EventHandler 有风险，可等待设计应规定什么？' }
    answer:
      en: >-
        EventHandler returns void, so an async lambda assigned to it becomes async void. The publisher cannot await its completion, observe cancellation through a returned task, or catch exceptions thrown after an incomplete await through the raising call. If the publisher needs those guarantees, use an explicit delegate returning Task or expose an async method. The contract must state whether handlers run sequentially or concurrently, which CancellationToken applies, whether one failure stops or cancels others, and how multiple errors are reported. Merely naming the raising method RaiseAsync or wrapping handlers in Task.Run does not create these semantics.
      zh: >-
        EventHandler 返回 void，因此注册到它的异步 lambda 会变成 async void。发布者无法等待处理器完成，不能通过返回任务观察取消，也无法在触发调用中捕获发生在未完成 await 之后的异常。若发布者需要这些保证，应使用返回 Task 的明确委托，或者公开异步方法。契约必须说明处理器顺序执行还是并发执行、使用哪个 CancellationToken、一次失败是否停止或取消其他处理器，以及怎样报告多个错误。仅把触发方法命名为 RaiseAsync，或用 Task.Run 包装处理器，并不会产生这些语义。
    topics: [csharp/events]
    level: advanced
    section: { en: 'Concurrency', zh: '并发' }
    frequency: occasional
    tags: [async-void, task, exceptions, cancellation]

  - id: exception-handler-selection
    question: { en: 'How does C# choose a catch clause, and when should you use an exception filter?', zh: 'C# 如何选择 catch 子句，何时应该使用异常筛选器？' }
    answer:
      en: >-
        The runtime searches outward from the throw site and tests catch clauses in source order. A clause is eligible when the thrown object is assignment-compatible with its declared exception type. Its when filter, if present, must also return true; false continues the search. Put derived types before base types, because a general handler would otherwise make a later specific handler unreachable. Use filters for stable properties that decide recoverability, such as a parameter name or status code. Keep them fast and side-effect free because they run before the corresponding stack unwind; a filter that throws is treated as false.
      zh: >-
        运行时从抛出点沿调用栈向外搜索，并按源码顺序检查 catch 子句。抛出的对象与声明的异常类型赋值兼容时，子句才有资格处理；如果还有 when 筛选器，它也必须返回 true，返回 false 会继续搜索。派生类型要放在基类型之前，否则后面的具体处理器无法到达。筛选器适合检查决定能否恢复的稳定属性，例如参数名或状态码。它在对应的堆栈展开前运行，因此应保持快速且无副作用；筛选器抛出的异常会被视为 false。
    topics: [csharp/exceptions]
    level: intermediate
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [catch, exception-filter, stack-unwinding]

  - id: preserve-exception-diagnostics
    question: { en: 'What is the difference between throw;, throw ex;, and wrapping an exception?', zh: 'throw;、throw ex; 与包装异常有什么区别？' }
    answer:
      en: >-
        Inside a catch, throw; continues the current exception and preserves its existing stack information. throw ex; performs a new throw of the caught object, resetting the stack's starting point and obscuring the original propagation path. Wrapping creates a new exception to express the current abstraction; pass the caught exception as InnerException so diagnostics retain the lower-level type, message, and stack. Wrap only when you add stable context or change the error contract, not at every method. If propagation must resume later outside the catch, ExceptionDispatchInfo captures the exception with its propagation information and can rethrow it from another execution point.
      zh: >-
        在 catch 中，throw; 会继续传播当前异常并保留已有堆栈信息。throw ex; 则会重新抛出已捕获对象，把堆栈起点重置到当前位置，从而遮蔽原传播路径。包装异常用于表达当前抽象层的错误语义；应把已捕获异常作为 InnerException 传入，以保留底层类型、消息和堆栈。只有补充稳定上下文或改变错误契约时才包装，不要每个方法都包一层。若必须离开 catch 后再传播，可用 ExceptionDispatchInfo 连同传播信息一起捕获并在另一执行点抛出。
    topics: [csharp/exceptions]
    level: intermediate
    section: { en: 'Diagnostics', zh: '诊断' }
    frequency: common
    tags: [rethrow, inner-exception, stack-trace]

  - id: exceptions-versus-result-values
    question: { en: 'When should a C# API return a result instead of throwing an exception?', zh: 'C# API 何时应返回结果而不是抛出异常？' }
    answer:
      en: >-
        Return a value when the outcome is expected and callers routinely branch on it. TryParse and TryGetValue are good examples: malformed user input and a missing dictionary key can be normal states, so exceptions would make the ordinary path harder to read and diagnose. Throw when the method cannot fulfill its stated contract and the caller needs failure propagation, such as an invalid public argument or unavailable required storage. The choice belongs to the API contract, not a blanket performance rule. Preserve every state the caller must distinguish, but avoid a large result wrapper that merely recreates an exception hierarchy with strings.
      zh: >-
        当某个结果属于预期状态，而且调用方会经常据此分支时，应返回值。TryParse 与 TryGetValue 就是典型例子：用户输入格式错误、字典键缺失都可能是正常状态，用异常表达反而让普通路径更难阅读和诊断。方法无法履行明确契约，而且失败需要向上传播时再抛出，例如公开参数无效或必需存储不可用。这个选择属于 API 契约，不是笼统的性能规则。返回类型要保留调用方必须区分的状态，但不要用字符串堆出一个只是重复异常层次的大型结果包装器。
    topics: [csharp/exceptions]
    level: intermediate
    section: { en: 'API design', zh: 'API 设计' }
    frequency: common
    tags: [try-pattern, api-contract, control-flow]

  - id: async-exceptions-whenall-cancellation
    question: { en: 'How do exceptions and cancellation propagate through async methods and Task.WhenAll?', zh: '异常与取消如何通过异步方法和 Task.WhenAll 传播？' }
    answer:
      en: >-
        An async method returning Task normally stores an unhandled exception in that task, and await rethrows it in the waiting control flow. OperationCanceledException associated with the operation's token produces cancellation semantics, which should remain distinct from a fault. Task.WhenAll completes after every input task completes; it faults if any input faults, and its AggregateException retains all input failures. Awaiting the combined task throws one exception, so retain the Task.WhenAll result and inspect its Exception when every failure matters. When no task faults but at least one is canceled, the combined task is canceled. Avoid async void outside event-handler contracts because callers cannot await or inspect it.
      zh: >-
        返回 Task 的 async 方法通常会把未处理异常存入任务，await 再在等待方的控制流中重新抛出。与操作令牌关联的 OperationCanceledException 表示取消，不能和普通故障混为一谈。Task.WhenAll 会等所有输入任务结束；只要任一任务失败，组合任务就进入 Faulted，其 AggregateException 保留全部输入失败。await 组合任务时只会抛出其中一个异常，因此需要全部失败时要保留 Task.WhenAll 的结果并检查 Exception。没有失败但至少一个任务取消时，组合任务会取消。事件处理器契约之外应避免 async void，因为调用方无法等待或检查它。
    topics: [csharp/exceptions]
    level: advanced
    section: { en: 'Concurrency', zh: '并发' }
    frequency: occasional
    tags: [async, task-whenall, cancellation, aggregate-exception]
