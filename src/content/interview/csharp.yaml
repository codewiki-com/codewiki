  - id: value-versus-reference-copy-semantics
    question: { en: 'How do value types and reference types differ in C#?', zh: 'C# 中的值类型与引用类型有什么区别？' }
    answer:
      en: >-
        A value-type variable contains its value, so ordinary assignment and by-value argument passing copy that value. A reference-type variable contains a reference; copying it can leave two variables pointing to one mutable object. This is a statement about observable semantics, not a rule that structs always live on the stack and classes always live on the heap. Value-type fields can be inline inside heap objects, and boxing creates an object for a value. A struct can also contain reference fields, so copying it is only a field-by-field copy, not a recursive copy of referenced objects.
      zh: >-
        值类型变量直接包含值，因此普通赋值与按值传参会复制该值。引用类型变量包含引用，复制后两个变量可能指向同一个可变对象。这描述的是可观察语义，并不表示结构体永远在栈上、类永远在堆上。值类型字段可以内联在堆对象中，装箱也会为值创建对象。结构体还可以包含引用字段，所以复制结构体只是逐字段复制，不会递归复制字段指向的对象。
    topics: [csharp/data-types]
    level: beginner
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [value-types, reference-types, copying]

  - id: two-meanings-of-nullable
    question: { en: 'How does T? differ for value types and reference types?', zh: 'T? 用于值类型和引用类型时有什么不同？' }
    answer:
      en: >-
        For a non-nullable value type T, T? is shorthand for Nullable<T>, a value that records whether an underlying T is present. For a reference type, T? is a nullable annotation on the same runtime reference type. It tells the compiler that null is expected and participates in null-state analysis, but it doesn't wrap the object or add a runtime check. The null-forgiving operator suppresses a warning only. Code must still validate values arriving through deserialization, reflection, older assemblies, or disabled nullable contexts, because those paths can violate the annotated intent.
      zh: >-
        对非可空值类型 T，T? 是 Nullable<T> 的简写，它记录是否存在底层 T 值。对引用类型，T? 是同一个运行时引用类型上的可空注解，用于告诉编译器 null 属于预期状态，并参与空状态分析；它不会包装对象，也不会添加运行时检查。空包容运算符只会抑制警告。反序列化、反射、旧程序集或禁用可空上下文的代码仍可能违反注解表达的意图，因此边界处依然需要验证。
    topics: [csharp/data-types]
    level: intermediate
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [nullable-value-types, nullable-reference-types]

  - id: safe-numeric-conversions
    question: { en: 'How do you make numeric conversions and arithmetic fail safely?', zh: '怎样让数值转换与算术运算安全失败？' }
    answer:
      en: >-
        Start by identifying the type of every intermediate expression. A wider destination doesn't prevent earlier overflow: two int operands still multiply as int before assignment to long. Widen an operand before the operation and put the complete expression in a checked context when overflow must be rejected. Explicit casts can narrow range, while implicit integer-to-floating conversions can still lose precision. For external text, use TryParse with an explicit culture and format policy rather than a cast or exception-driven parsing. Boundary tests should cover malformed input, extrema, combined maxima, signs, and any required decimal scale or rounding rule.
      zh: >-
        首先确定每个中间表达式的类型。更宽的目标变量不能阻止先前溢出：两个 int 操作数仍会先按 int 相乘，再赋给 long。需要拒绝溢出时，应在运算前扩大一个操作数，并让 checked 覆盖完整表达式。显式强制转换可能缩小范围，整数到浮点数的隐式转换也可能丢失精度。外部文本应使用带明确区域性与格式策略的 TryParse，而不是强制转换或异常驱动的解析。边界测试要覆盖格式错误、极值、组合最大值、符号以及小数位和舍入规则。
    topics: [csharp/data-types]
    level: intermediate
    section: { en: 'Numbers and conversions', zh: '数值与转换' }
    frequency: common
    tags: [numeric-conversions, overflow, parsing]

  - id: boxing-and-exact-unboxing
    question: { en: 'What are boxing and unboxing, and why must unboxing use the exact type?', zh: '什么是装箱与拆箱，为什么拆箱必须使用准确类型？' }
    answer:
      en: >-
        Boxing converts a value type to object or to an implemented interface and usually creates an object containing a copy of the value. Unboxing checks the boxed runtime value type and extracts that value. The check requires an exact match: an int boxed as object can't be unboxed directly as long even though an unboxed int can widen to long. First unbox as int, then perform the numeric conversion. Repeated boxing adds allocations and type checks, so generic collections such as List<int> are preferable to object-based containers. Generic code can still box when it explicitly converts T to object or an interface.
      zh: >-
        装箱把值类型转换成 object 或它实现的接口，通常会创建一个包含值副本的对象。拆箱检查箱中值的运行时类型并提取该值，而且要求类型准确匹配：装箱为 object 的 int 不能直接拆成 long，尽管拆箱后的 int 可以扩大为 long。正确顺序是先拆成 int，再执行数值转换。重复装箱会增加分配与类型检查，因此 List<int> 等泛型集合通常优于基于 object 的容器。泛型代码显式把 T 转成 object 或接口时仍可能装箱。
    topics: [csharp/data-types]
    level: intermediate
    section: { en: 'Runtime behavior', zh: '运行时行为' }
    frequency: occasional
    tags: [boxing, unboxing, generics]
