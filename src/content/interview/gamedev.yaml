track: gamedev
items:
  - id: unity-coroutine-execution-model
    question: { en: 'How does a Unity coroutine differ from both a normal method and a background thread?', zh: 'Unity 协程与普通方法和后台线程分别有什么区别？' }
    answer:
      en: 'A normal method runs until it returns, while a coroutine can suspend at yield return and continue during a later player-loop step. The C# compiler represents that method as an IEnumerator state machine, so its position and live locals survive between resumptions. This does not create a worker thread. Each synchronous segment still runs on Unity''s main thread and must finish before control returns. A blocking read, Thread.Sleep, or expensive loop inside a coroutine therefore stalls the frame just as it would inside Update.'
      zh: '普通方法会一直执行到返回，协程则能在 yield return 处暂停，并在之后的 PlayerLoop 阶段继续。C# 编译器把这种方法改写为 IEnumerator 状态机，因此执行位置和仍然存活的局部变量可以跨恢复点保存。这不会创建工作线程；每个同步片段仍在 Unity 主线程上执行，而且必须先结束才能交还控制权。所以，把阻塞读取、Thread.Sleep 或昂贵循环放入协程，仍会像放在 Update 中一样卡住当前帧。'
    topics: [gamedev/unity-coroutines]
    level: beginner
    section: { en: 'Unity scripting', zh: 'Unity 脚本' }
    frequency: common
    tags: [coroutine, main-thread, iterator]

  - id: unity-coroutine-time-source
    question: { en: 'How do you choose between WaitForSeconds and WaitForSecondsRealtime?', zh: '如何在 WaitForSeconds 与 WaitForSecondsRealtime 之间选择？' }
    answer:
      en: 'Choose from the clock named by the requirement. WaitForSeconds follows scaled game time, so changing Time.timeScale changes its progress and a zero time scale suspends it. That suits gameplay delays that should pause with the simulation. WaitForSecondsRealtime follows unscaled time, so it suits pause-menu notices and real-world timeouts. Neither is an exact wall-clock alarm: resumption happens on an eligible frame after the duration. For deadlines or countdown displays, retain a target time and recompute the remainder instead of decrementing once per wait.'
      zh: '应根据需求指定的时钟来选择。WaitForSeconds 跟随缩放后的游戏时间，因此 Time.timeScale 会改变等待进度，零时间缩放会让它停住；这适合随游戏模拟一起暂停的延迟。WaitForSecondsRealtime 使用未缩放时间，适合暂停菜单提示和现实时间超时。两者都不是精确的墙钟闹钟，因为协程只能在时长过去后的可用帧恢复。实现截止时间或倒计时显示时，应保存目标时刻并重新计算剩余量，不要每次等待后简单减一。'
    topics: [gamedev/unity-coroutines]
    level: intermediate
    section: { en: 'Timing and player loop', zh: '计时与 PlayerLoop' }
    frequency: common
    tags: [scaled-time, unscaled-time, wait-for-seconds]

  - id: unity-coroutine-ownership
    question: { en: 'What ownership rules make a Unity coroutine safe to stop and restart?', zh: '哪些所有权规则能让 Unity 协程安全地停止和重新启动？' }
    answer:
      en: 'Let the component that owns the affected state also own the running Coroutine handle. Decide whether a repeated request is ignored, queued, run in parallel, or replaces the current run. For replacement, stop the saved handle before starting another and clear the field on completion and lifecycle shutdown. Do not create a fresh IEnumerator and expect it to identify the running instance. Also encode lifecycle policy explicitly: disabling a MonoBehaviour does not stop its coroutines, while deactivating its GameObject does, and reactivation does not resume a stopped iterator.'
      zh: '应让拥有被修改状态的组件同时拥有正在运行的 Coroutine 句柄，并明确重复请求是忽略、排队、并行还是替换。采用替换策略时，启动新实例前先停止已保存的句柄，并在正常结束和生命周期关闭时清空字段。不要重新创建一个 IEnumerator，再期待它能标识正在运行的实例。生命周期策略也要明确：禁用 MonoBehaviour 不会停止其协程，把所属 GameObject 设为非活动状态则会停止，而且重新激活不会恢复已停止的迭代器。'
    topics: [gamedev/unity-coroutines]
    level: intermediate
    section: { en: 'Lifecycle and ownership', zh: '生命周期与所有权' }
    frequency: common
    tags: [ownership, cancellation, monobehaviour]

  - id: unity-coroutine-versus-awaitable-jobs
    question: { en: 'When should you use a coroutine, Awaitable, or the C# Job System in Unity?', zh: '在 Unity 中，何时应使用协程、Awaitable 或 C# Job System？' }
    answer:
      en: 'Use a coroutine for a short main-thread flow organized around frames, Unity yield instructions, and scene-object changes. Awaitable is often clearer when callers need return values, normal async composition, exception propagation, or cancellation across I/O and Unity asynchronous APIs. Use the Job System, often with Burst, when the goal is parallel CPU work over data. None of these choices makes arbitrary synchronous code non-blocking. Before selecting one, state which thread performs the work, who owns cancellation, and how completion or failure reaches the caller.'
      zh: '短小流程若围绕帧、Unity yield 指令和场景对象修改展开，适合使用协程。调用方需要返回值、常规 async 组合、异常传播或跨 I/O 与 Unity 异步 API 的取消时，Awaitable 通常更清楚。目标是对数据执行并行 CPU 计算时，应使用 Job System，并按需要配合 Burst。这些工具都不会自动让任意同步代码变成非阻塞代码。选择前先说明工作在哪个线程执行、谁拥有取消权，以及完成或失败如何到达调用方。'
    topics: [gamedev/unity-coroutines]
    level: advanced
    section: { en: 'Asynchronous design', zh: '异步设计' }
    frequency: occasional
    tags: [awaitable, job-system, api-choice]

  - id: unity-dots-archetypes-and-chunks
    question: { en: 'How do archetypes and chunks affect component design in Unity Entities?', zh: '原型与 chunk 如何影响 Unity Entities 的组件设计？' }
    answer:
      en: 'An archetype is the exact set of component types on an entity. Entities with one archetype are stored in 16 KiB chunks containing one packed array per component type. Systems query matching archetypes and traverse those arrays. Component boundaries therefore affect chunk capacity and memory traffic: a large rarely read field inside a hot component is carried through the hot path. Adding or removing a component moves the entity to another archetype, and too many tag combinations can multiply archetypes. I design around measured access patterns, then inspect chunk occupancy and structural changes rather than assuming smaller components are always better.'
      zh: '原型由实体拥有的完整组件类型集合决定。同一原型的实体存放在 16 KiB chunk 中，每种组件类型对应一个紧密数组，系统查询匹配原型后遍历这些数组。因此，组件边界会影响 chunk 容量与内存流量：把很少读取的大字段放进热组件，会让热路径携带无关数据。添加或移除组件还会把实体搬到另一原型，标签组合过多则可能扩大原型数量。我会先根据实际访问模式设计，再检查 chunk 占用与结构变更，而不是假定组件越小越好。'
    topics: [gamedev/unity-dots]
    level: advanced
    section: { en: 'Unity DOTS', zh: 'Unity DOTS' }
    frequency: common
    tags: [ecs, archetype, chunk, component-design]

  - id: unity-dots-job-dependency
    question: { en: 'What contract does state.Dependency represent in an ISystem?', zh: 'ISystem 中的 state.Dependency 表示什么契约？' }
    answer:
      en: 'state.Dependency carries the JobHandles that this system must respect because earlier work has overlapping component access. A scheduled job should normally receive that handle, and its returned handle must be assigned back so later systems can observe the new dependency. Passing only one side is incomplete: omitting the input can race earlier work, while discarding the output hides this job from later work. Complete is reserved for a boundary where synchronous code immediately consumes the result. Calling it after every schedule is correct only by accident and serializes work that the scheduler could otherwise overlap.'
      zh: 'state.Dependency 携带当前系统必须遵守的 JobHandle，因为此前工作可能访问了相同组件。调度新 Job 时通常要传入这个句柄，并把返回句柄写回，让后续系统看到新增依赖。只做一半并不完整：省略输入可能与前序工作竞态，丢弃输出则会向后续工作隐藏本 Job。只有同步代码马上消费结果时才应 Complete。每次调度后都完成虽然可能暂时避开报错，却会把原本能够重叠的工作串行化。'
    topics: [gamedev/unity-dots]
    level: advanced
    section: { en: 'Concurrency and jobs', zh: '并发与 Job' }
    frequency: common
    tags: [job-system, dependency, synchronization]

  - id: unity-dots-ecb-or-enableable
    question: { en: 'When should you use an EntityCommandBuffer instead of an enableable component?', zh: '何时应使用 EntityCommandBuffer，而不是可启用组件？' }
    answer:
      en: 'Use an EntityCommandBuffer when the operation genuinely changes storage shape, such as creating an entity or adding and removing a component, and the decision occurs inside a job or query iteration. The buffer records now and mutates storage at its playback point. Use an enableable component when the component type and storage should remain present but a frequently changing state should affect query matching. Toggling its enabled bit avoids moving the entity between archetypes. The choices are not equivalent: ECB playback has visibility timing, while enableable data still occupies chunk space and can create dependency-related sync points.'
      zh: '当操作确实改变存储形状，例如创建实体、添加或移除组件，而且决策发生在 Job 或查询迭代中时，应使用 EntityCommandBuffer。它先记录命令，再在回放点修改存储。若组件类型与存储应继续存在，只是一个频繁变化的状态需要影响查询匹配，则使用可启用组件；切换启用位不会让实体跨原型搬移。两者并不等价：ECB 有结果何时可见的问题，可启用组件仍占据 chunk 空间，也可能因依赖关系产生同步点。'
    topics: [gamedev/unity-dots]
    level: intermediate
    section: { en: 'Structural changes', zh: '结构变更' }
    frequency: common
    tags: [entity-command-buffer, enableable-component, structural-change]

  - id: unity-dots-verify-performance
    question: { en: 'How do you verify that a DOTS rewrite is actually faster?', zh: '如何验证一次 DOTS 重写确实更快？' }
    answer:
      en: 'Start with a Profiler capture that names the original bottleneck. Compare equivalent behavior under fixed scene input, target device, Player build settings, frame-rate policy, and sampling interval. Record main-thread time, worker time, waits, allocations, structural changes, and entity count. Confirm in the Burst Inspector and build logs that the intended jobs were Burst compiled; Play mode can execute managed fallback code while Burst compiles. Warm up one-time compilation and loading costs before measuring steady state. If the original limit is GPU, rendering, network, or disk work, an ECS rewrite may not improve frame time.'
      zh: '先用 Profiler 捕获明确原实现的瓶颈。比较时固定场景输入、目标设备、Player 构建设置、帧率策略和采样区间，并确保两边行为等价。记录主线程时间、工作线程时间、等待、分配、结构变更与实体数量。还要通过 Burst Inspector 和构建日志确认目标 Job 确实经过 Burst 编译，因为播放模式可能在 Burst 编译期间执行托管回退代码。测量稳定阶段前应预热一次性编译与加载成本。若原瓶颈在 GPU、渲染、网络或磁盘，ECS 重写未必改善帧时间。'
    topics: [gamedev/unity-dots]
    level: advanced
    section: { en: 'Performance analysis', zh: '性能分析' }
    frequency: occasional
    tags: [profiling, burst, benchmarking]

  - id: unity-gameobject-component-composition
    question: { en: 'How do GameObjects and components divide responsibility in Unity?', zh: 'Unity 中的 GameObject 与组件如何划分职责？' }
    answer:
      en: 'A GameObject provides identity, activation state, hierarchy membership, tags, layers, and ownership of components. Its components provide capabilities: Transform supplies spatial state, renderers draw, colliders participate in physics queries, and MonoBehaviour scripts add project behavior. I prefer several focused components over a deep inheritance tree because each dependency remains visible in the Inspector and can be tested separately. A required same-object dependency belongs in RequireComponent plus startup validation; a reference to another object should be wired or registered explicitly rather than rediscovered by name every frame.'
      zh: 'GameObject 提供标识、活动状态、层级关系、标签、层以及组件所有权；具体能力由组件提供。Transform 保存空间状态，Renderer 负责绘制，Collider 参与物理查询，MonoBehaviour 脚本加入项目行为。我倾向于组合多个职责集中的组件，而不是建立很深的继承树，因为这样每项依赖都能在 Inspector 中看见，也能单独测试。同对象的必需依赖应使用 RequireComponent 并在启动时验证；跨对象引用则应显式连接或注册，不要每帧按名称重新查找。'
    topics: [gamedev/unity-fundamentals]
    level: beginner
    section: { en: 'Unity object model', zh: 'Unity 对象模型' }
    frequency: common
    tags: [gameobject, components, composition]

  - id: unity-serialized-field-defaults
    question: { en: 'Why can changing a C# field initializer fail to change an existing Unity component?', zh: '为什么修改 C# 字段初始值后，现有 Unity 组件的值可能不变？' }
    answer:
      en: 'The initializer supplies a starting value when a component is created, but a scene or Prefab then stores its own serialized value. On loading, that authoring data takes precedence, so an existing speed of 3 can remain 3 after the initializer becomes 5. I inspect the component and Prefab overrides before blaming compilation. If all existing assets need the new value, that is a data migration, not a default change. I also use private serialized fields for Inspector input and reserve public members for intentional runtime APIs.'
      zh: '字段初始值只在创建组件时提供起点，之后场景或 Prefab 会保存自己的序列化值。加载时编辑数据优先，所以初始值从 3 改成 5 后，现有组件仍可能保持 3。我会先检查组件值与 Prefab override，而不是怀疑编译失败。若所有现有资源都需要新值，这属于数据迁移，不只是修改默认值。我还会用私有序列化字段接收 Inspector 输入，把公开成员留给有意设计的运行时 API。'
    topics: [gamedev/unity-fundamentals]
    level: intermediate
    section: { en: 'Serialization and Inspector', zh: '序列化与 Inspector' }
    frequency: common
    tags: [serialization, inspector, migration]

  - id: unity-awake-start-order
    question: { en: 'What initialization ordering can you safely assume around Awake, OnEnable, and Start?', zh: 'Awake、OnEnable 与 Start 周围有哪些初始化顺序可以安全依赖？' }
    answer:
      en: 'For one initially active, enabled instance, Awake runs before OnEnable and Start runs before its first frame update. OnEnable may repeat after disable-enable cycles, while Start runs once in that instance lifetime. An inactive scene object delays Awake until activation. I do not assume an order between Awake calls on different GameObjects unless the project configures one. Same-object references can be established in Awake; cross-object readiness needs an explicit bootstrap phase, event, or documented execution-order rule. OnEnable subscriptions should always have matching OnDisable unsubscriptions.'
      zh: '对于一个初始活动且已启用的实例，Awake 先于 OnEnable，Start 则在首次帧更新前执行。禁用后重新启用会再次触发 OnEnable，而 Start 在该实例生命周期内只执行一次。场景中初始非活动的对象会把 Awake 推迟到激活时。除非项目明确配置，否则我不会假定不同 GameObject 的 Awake 顺序。同对象引用可在 Awake 建立；跨对象就绪应使用显式引导阶段、事件或有文档的执行顺序规则。OnEnable 中的订阅还必须在 OnDisable 中对应取消。'
    topics: [gamedev/unity-fundamentals]
    level: intermediate
    section: { en: 'MonoBehaviour lifecycle', zh: 'MonoBehaviour 生命周期' }
    frequency: common
    tags: [awake, start, lifecycle]

  - id: unity-prefab-asset-instance-override
    question: { en: 'What is the difference between a Prefab asset, a Prefab instance, and an override?', zh: 'Prefab 资源、Prefab 实例与 override 有什么区别？' }
    answer:
      en: 'The Prefab asset is the reusable source hierarchy stored in the project. A scene or runtime instance is an object created from that source. A scene instance can record overrides relative to the asset, so later asset changes flow only into properties the instance has not overridden. Apply moves selected instance overrides back to the asset; Revert discards them from the instance. Runtime edits normally change only the clone and disappear when Play mode ends. I diagnose setup bugs by inspecting all three layers, because the script alone does not reveal serialized references or hidden overrides.'
      zh: 'Prefab 资源是保存在项目中的可复用来源层级，场景实例或运行时实例则是从该来源创建的对象。场景实例可以记录相对资源的 override，因此资源后续变更只会进入实例未覆盖的属性。Apply 把选定的实例 override 写回资源，Revert 则从实例丢弃这些差异。运行时编辑通常只改变克隆，并在播放模式结束时消失。排查配置错误时，我会同时检查这三层，因为只看脚本无法知道序列化引用和被遮住的 override。'
    topics: [gamedev/unity-fundamentals]
    level: beginner
    section: { en: 'Prefab workflow', zh: 'Prefab 工作流' }
    frequency: common
    tags: [prefab, instance, overrides]

  - id: monobehaviour-order-boundaries
    question: { en: 'Which ordering guarantees around Awake, OnEnable, and Start are safe to design against?', zh: '围绕 Awake、OnEnable 和 Start，哪些执行顺序保证可以用于设计？' }
    answer:
      en: 'For one initially active and enabled instance, Awake precedes OnEnable, and Start runs once before that instance receives its first frame update. OnEnable can repeat after every disable-enable cycle, while Awake and Start do not. For scene objects already active at startup, their Awake calls finish before any Start call, but Unity does not define the relative Awake order of different GameObjects by default. Runtime instantiation also introduces new Awake calls later. I keep self-setup in Awake and represent cross-object readiness with a bootstrap, registration event, or narrowly documented Script Execution Order rule.'
      zh: '对于一个初始活动且已启用的实例，Awake 先于 OnEnable，Start 则只运行一次，并位于该实例首次帧更新之前。每次禁用后重新启用都会再次调用 OnEnable，Awake 与 Start 不会重复。场景启动时已经活动的对象会在任何 Start 之前完成 Awake，但 Unity 默认不规定不同 GameObject 的 Awake 相对顺序；运行时实例化还会在以后产生新的 Awake。我把自身初始化放在 Awake，并用 bootstrap、注册事件或范围很小且有文档的 Script Execution Order 规则表达跨对象就绪。'
    topics: [gamedev/unity-monobehaviour]
    level: intermediate
    section: { en: 'MonoBehaviour lifecycle', zh: 'MonoBehaviour 生命周期' }
    frequency: common
    tags: [awake, start, execution-order]

  - id: monobehaviour-subscription-lifetime
    question: { en: 'How do you choose lifecycle callbacks for an event subscription?', zh: '如何为事件订阅选择合适的生命周期回调？' }
    answer:
      en: 'First decide whether the listener should receive events only while active or for the whole component lifetime. Active-period ownership maps cleanly to subscribe in OnEnable and unsubscribe in OnDisable; both callbacks can repeat, so the pair remains symmetric after re-enable. Subscribing in Start and removing in OnDisable is broken because Start runs only once. If a disabled component must keep listening, use a longer explicit ownership boundary and make destruction and never-activated objects part of the policy. I prefer a named handler over matching lambda expressions because removing a newly created lambda does not remove the delegate that was originally registered.'
      zh: '先确定监听器只在活动期间接收事件，还是覆盖组件的整个实例生命周期。活动期所有权适合在 OnEnable 订阅、在 OnDisable 取消；两个回调都可重复，因此重新启用后仍保持对称。在 Start 订阅、OnDisable 取消是错误组合，因为 Start 只运行一次。若组件禁用时仍要监听，就应使用更长且明确的所有权边界，并把销毁与从未激活的对象纳入策略。我倾向于使用命名处理器，而不是两段看似相同的 lambda，因为新建 lambda 无法移除最初注册的委托实例。'
    topics: [gamedev/unity-monobehaviour]
    level: intermediate
    section: { en: 'Lifecycle and ownership', zh: '生命周期与所有权' }
    frequency: common
    tags: [events, ownership, enable-disable]

  - id: monobehaviour-update-phases
    question: { en: 'How do Update, FixedUpdate, and LateUpdate divide responsibilities?', zh: 'Update、FixedUpdate 与 LateUpdate 应如何划分职责？' }
    answer:
      en: 'Update follows rendered frames and is the usual place to sample input, advance non-physics state, and use Time.deltaTime. FixedUpdate follows the physics timestep; a rendered frame can have zero or several fixed steps, so Rigidbody forces and physics-state writes belong there. Carry continuous input as the latest value and buffer one-shot actions until a fixed step consumes them. LateUpdate runs after the normal Update phase and suits consumers such as a camera that reads a target pose changed earlier in the frame. It supplies an ordering boundary, not automatic smoothing or a guaranteed order among every LateUpdate instance.'
      zh: 'Update 跟随渲染帧，通常用于采样输入、推进非物理状态，并配合 Time.deltaTime。FixedUpdate 跟随物理时间步；一个渲染帧可能没有固定步，也可能包含多个，因此 Rigidbody 施力和物理状态写入应放在这里。持续输入保存最新值，一次性动作则缓冲到某个固定步消费。LateUpdate 位于常规 Update 阶段之后，适合相机这类需要读取本帧已更新目标姿态的使用方。它只提供阶段边界，不会自动实现平滑，也不保证所有 LateUpdate 实例之间的顺序。'
    topics: [gamedev/unity-monobehaviour]
    level: intermediate
    section: { en: 'Timing and player loop', zh: '计时与 PlayerLoop' }
    frequency: common
    tags: [update, fixed-update, late-update]

  - id: monobehaviour-missing-message
    question: { en: 'A lifecycle method compiles but never runs. How do you diagnose it?', zh: '一个生命周期方法能够编译，却从不运行。你会如何诊断？' }
    answer:
      en: 'I first compare the exact method name, return type, and parameters with the current Unity message signature. Awake and Update are engine messages, not virtual MonoBehaviour methods, so an invented override, OnEnabled spelling, or extra parameter is wrong even when the method looks plausible. Next I inspect the GameObject active state, the Behaviour enabled state, and whether an initially inactive object has ever activated. Then I reproduce one transition with a minimal probe or Play Mode test. Script Execution Order cannot make an unrecognized method run; it only orders recognized callbacks for configured script classes.'
      zh: '我会先把方法名称、返回类型和参数与当前 Unity 消息签名逐项比较。Awake 与 Update 是引擎消息，不是 MonoBehaviour 的虚方法，因此虚构的 override、拼成 OnEnabled 或增加额外参数，即使看起来合理也不正确。随后检查 GameObject 的活动状态、Behaviour 的启用状态，以及初始非活动对象是否曾经激活。最后用最小探针或 Play Mode 测试复现一次状态转换。Script Execution Order 无法让未识别的方法运行，它只能为配置过的脚本类排列已经识别的回调。'
    topics: [gamedev/unity-monobehaviour]
    level: intermediate
    section: { en: 'Debugging Unity scripts', zh: 'Unity 脚本调试' }
    frequency: occasional
    tags: [messages, signatures, debugging]
