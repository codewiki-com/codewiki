track: gamedev
items:
  - id: unity-coroutine-execution-model
    question: { en: 'How does a Unity coroutine differ from both a normal method and a background thread?', zh: 'Unity 协程与普通方法和后台线程分别有什么区别？' }
    answer:
      en: 'A normal method runs until it returns, while a coroutine can suspend at yield return and continue during a later player-loop step. The C# compiler represents that method as an IEnumerator state machine, so its position and live locals survive between resumptions. This does not create a worker thread. Each synchronous segment still runs on Unity''s main thread and must finish before control returns. A blocking read, Thread.Sleep, or expensive loop inside a coroutine therefore stalls the frame just as it would inside Update.'
      zh: '普通方法会一直执行到返回，协程则能在 yield return 处暂停，并在之后的 PlayerLoop 阶段继续。C# 编译器把这种方法改写为 IEnumerator 状态机，因此执行位置和仍然存活的局部变量可以跨恢复点保存。这不会创建工作线程；每个同步片段仍在 Unity 主线程上执行，而且必须先结束才能交还控制权。所以，把阻塞读取、Thread.Sleep 或昂贵循环放入协程，仍会像放在 Update 中一样卡住当前帧。'
    topics: [gamedev/unity-coroutines]
    level: beginner
    section: { en: 'Unity scripting', zh: 'Unity 脚本' }
    frequency: common
    tags: [coroutine, main-thread, iterator]

  - id: unity-coroutine-time-source
    question: { en: 'How do you choose between WaitForSeconds and WaitForSecondsRealtime?', zh: '如何在 WaitForSeconds 与 WaitForSecondsRealtime 之间选择？' }
    answer:
      en: 'Choose from the clock named by the requirement. WaitForSeconds follows scaled game time, so changing Time.timeScale changes its progress and a zero time scale suspends it. That suits gameplay delays that should pause with the simulation. WaitForSecondsRealtime follows unscaled time, so it suits pause-menu notices and real-world timeouts. Neither is an exact wall-clock alarm: resumption happens on an eligible frame after the duration. For deadlines or countdown displays, retain a target time and recompute the remainder instead of decrementing once per wait.'
      zh: '应根据需求指定的时钟来选择。WaitForSeconds 跟随缩放后的游戏时间，因此 Time.timeScale 会改变等待进度，零时间缩放会让它停住；这适合随游戏模拟一起暂停的延迟。WaitForSecondsRealtime 使用未缩放时间，适合暂停菜单提示和现实时间超时。两者都不是精确的墙钟闹钟，因为协程只能在时长过去后的可用帧恢复。实现截止时间或倒计时显示时，应保存目标时刻并重新计算剩余量，不要每次等待后简单减一。'
    topics: [gamedev/unity-coroutines]
    level: intermediate
    section: { en: 'Timing and player loop', zh: '计时与 PlayerLoop' }
    frequency: common
    tags: [scaled-time, unscaled-time, wait-for-seconds]

  - id: unity-coroutine-ownership
    question: { en: 'What ownership rules make a Unity coroutine safe to stop and restart?', zh: '哪些所有权规则能让 Unity 协程安全地停止和重新启动？' }
    answer:
      en: 'Let the component that owns the affected state also own the running Coroutine handle. Decide whether a repeated request is ignored, queued, run in parallel, or replaces the current run. For replacement, stop the saved handle before starting another and clear the field on completion and lifecycle shutdown. Do not create a fresh IEnumerator and expect it to identify the running instance. Also encode lifecycle policy explicitly: disabling a MonoBehaviour does not stop its coroutines, while deactivating its GameObject does, and reactivation does not resume a stopped iterator.'
      zh: '应让拥有被修改状态的组件同时拥有正在运行的 Coroutine 句柄，并明确重复请求是忽略、排队、并行还是替换。采用替换策略时，启动新实例前先停止已保存的句柄，并在正常结束和生命周期关闭时清空字段。不要重新创建一个 IEnumerator，再期待它能标识正在运行的实例。生命周期策略也要明确：禁用 MonoBehaviour 不会停止其协程，把所属 GameObject 设为非活动状态则会停止，而且重新激活不会恢复已停止的迭代器。'
    topics: [gamedev/unity-coroutines]
    level: intermediate
    section: { en: 'Lifecycle and ownership', zh: '生命周期与所有权' }
    frequency: common
    tags: [ownership, cancellation, monobehaviour]

  - id: unity-coroutine-versus-awaitable-jobs
    question: { en: 'When should you use a coroutine, Awaitable, or the C# Job System in Unity?', zh: '在 Unity 中，何时应使用协程、Awaitable 或 C# Job System？' }
    answer:
      en: 'Use a coroutine for a short main-thread flow organized around frames, Unity yield instructions, and scene-object changes. Awaitable is often clearer when callers need return values, normal async composition, exception propagation, or cancellation across I/O and Unity asynchronous APIs. Use the Job System, often with Burst, when the goal is parallel CPU work over data. None of these choices makes arbitrary synchronous code non-blocking. Before selecting one, state which thread performs the work, who owns cancellation, and how completion or failure reaches the caller.'
      zh: '短小流程若围绕帧、Unity yield 指令和场景对象修改展开，适合使用协程。调用方需要返回值、常规 async 组合、异常传播或跨 I/O 与 Unity 异步 API 的取消时，Awaitable 通常更清楚。目标是对数据执行并行 CPU 计算时，应使用 Job System，并按需要配合 Burst。这些工具都不会自动让任意同步代码变成非阻塞代码。选择前先说明工作在哪个线程执行、谁拥有取消权，以及完成或失败如何到达调用方。'
    topics: [gamedev/unity-coroutines]
    level: advanced
    section: { en: 'Asynchronous design', zh: '异步设计' }
    frequency: occasional
    tags: [awaitable, job-system, api-choice]
