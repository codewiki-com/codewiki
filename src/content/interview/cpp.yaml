track: cpp
items:
  - id: move-cast-versus-operation
    question: { en: 'What does std::move do, and when does a move actually happen?', zh: 'std::move 做了什么，真正的移动何时发生？' }
    answer:
      en: 'std::move is a cast that turns its argument into an xvalue while preserving its type qualifiers. It does not transfer a buffer or change the source by itself. A move happens only if the following initialization, assignment, or call selects an operation that takes an rvalue and that operation actually transfers state. If no usable move overload exists, a copy can still be selected. Also, a named rvalue-reference parameter is an lvalue expression, so a move constructor normally uses std::move on the source members it intends to transfer.'
      zh: 'std::move 是一次类型转换：它把参数表达成 xvalue，同时保留类型限定。它本身不会转移缓冲区，也不会修改源对象。只有后续初始化、赋值或函数调用选择了接收右值的操作，而且该操作确实转移状态时，移动才会发生。若没有可用的移动重载，代码仍可能选择复制。有名字的右值引用参数也是左值表达式，因此移动构造函数通常要对准备转移的源成员使用 std::move。'
    topics: [cpp/move-semantics]
    section: { en: 'Language core', zh: '语言核心' }
    level: intermediate
    frequency: common
    tags: [std-move, value-category]

  - id: moved-from-guarantees
    question: { en: 'What may code safely do with a moved-from object?', zh: '代码可以对移动后的对象安全地做什么？' }
    answer:
      en: 'For standard-library types, unless a component gives a stronger postcondition, the object is valid but its value is unspecified. It can be destroyed or assigned a new value, and operations without violated preconditions may be called. That does not make indexing a moved-from vector safe, because its size is unknown. A particular type can document a stronger state: a moved-from unique_ptr is empty. For custom types, the class must define and preserve its own invariant, especially when a pointer is paired with a size or ownership flag.'
      zh: '对于标准库类型，如果组件没有给出更强的后置条件，移动后的对象有效，但值未指定。它可以析构、重新赋值，也可以调用当前状态满足其前置条件的操作。这不表示可以安全索引移动后的 vector，因为它的大小未知。某些类型会规定更强状态，例如移动后的 unique_ptr 为空。自定义类型则必须定义并保持自己的不变量，尤其要同步处理指针、长度和所有权标志。'
    topics: [cpp/move-semantics]
    section: { en: 'Resource ownership', zh: '资源所有权' }
    level: intermediate
    frequency: common
    tags: [moved-from-state, invariants]

  - id: noexcept-relocation
    question: { en: 'Why does noexcept matter for a move constructor used by containers?', zh: '为什么容器使用的移动构造函数需要关注 noexcept？' }
    answer:
      en: 'During reallocation, a container may need to preserve its original elements if constructing the new storage fails. A non-throwing move provides a safe transfer path. If moving may throw and copying is available, facilities such as std::move_if_noexcept can select the const-reference path so the source stays unchanged on failure. If the type is move-only, the container may have to use the throwing move and offer a weaker guarantee for that operation. The noexcept annotation must be truthful; an escaping exception from a noexcept move calls std::terminate.'
      zh: '容器重分配时，如果新存储中的构造失败，可能需要保留原元素。不抛异常的移动提供了安全转移路径。若移动可能抛异常且复制可用，std::move_if_noexcept 等设施可以选择 const 引用路径，使失败时源对象保持不变。若类型只能移动，容器可能只能尝试会抛异常的移动，并为该操作提供较弱保证。noexcept 必须真实；异常若逃出 noexcept 移动操作，程序会调用 std::terminate。'
    topics: [cpp/move-semantics]
    section: { en: 'Standard library', zh: '标准库' }
    level: advanced
    frequency: occasional
    tags: [noexcept, exception-safety]

  - id: rule-zero-versus-five
    question: { en: 'How do the Rule of Zero and Rule of Five guide a movable class design?', zh: '零法则和五法则如何指导可移动类的设计？' }
    answer:
      en: 'The Rule of Zero is the preferred design: put ownership in members such as vector, string, or unique_ptr and let their special members compose. This removes duplicated lifetime code and usually gives correct conditional noexcept behavior. The Rule of Five is a warning for classes that customize destruction, copying, or moving: treat the destructor, copy constructor, copy assignment, move constructor, and move assignment as one semantic set. Decide explicitly whether each is defaulted, deleted, or custom, then test source and target invariants, self-assignment, base classes, and destruction.'
      zh: '零法则是首选设计：把所有权放进 vector、string 或 unique_ptr 等成员，让它们的特殊成员函数组合出类的行为。这样能减少重复的生命周期代码，通常也能得到正确的条件 noexcept。五法则则提醒已经自定义析构、复制或移动的类，要把析构、复制构造、复制赋值、移动构造和移动赋值视为一组语义。应明确决定每项是默认、删除还是自定义，并测试源与目标不变量、自赋值、基类和析构。'
    topics: [cpp/move-semantics]
    section: { en: 'Class design', zh: '类设计' }
    level: intermediate
    frequency: common
    tags: [rule-of-zero, rule-of-five]

  - id: array-versus-pointer
    question: { en: 'How does a built-in array differ from a pointer, and when does it convert to one?', zh: '内置数组与指针有什么区别，数组何时会转换成指针？' }
    answer:
      en: 'A built-in array is an object containing a fixed number of contiguous elements, and its extent is part of its type. A pointer is a separate scalar object containing an address; its type carries no element count. An array lvalue converts to a pointer to its first element in most value-taking expressions, including ordinary by-value auto deduction. The conversion does not occur for operations such as sizeof, unary address-of on the array, decltype, or binding an array reference. After conversion, the original extent cannot be recovered from the pointer alone.'
      zh: '内置数组是包含固定数量连续元素的对象，边界属于其类型。指针则是保存地址的独立标量对象，类型中没有元素数量。数组左值在多数取值表达式中会转换为首元素指针，普通的按值 auto 推导也会触发转换。sizeof、对数组使用一元取地址、decltype 以及绑定数组引用时不会发生这种转换。转换完成后，仅凭指针无法恢复原来的数组边界，接口必须另行传递数量或终止条件。'
    topics: [cpp/c-arrays]
    section: { en: 'Language core', zh: '语言核心' }
    level: intermediate
    frequency: common
    tags: [arrays, pointers, array-decay]

  - id: preserve-array-extent-parameter
    question: { en: 'How can a C++ function receive an array without losing its extent?', zh: 'C++ 函数如何接收数组而不丢失边界？' }
    answer:
      en: 'Array-looking parameters such as int values[8] are adjusted to int*, so that spelling does not preserve or enforce eight elements. A reference parameter such as const int (&values)[8] preserves an exact extent. A template const T (&values)[N] can deduce both element type and extent. For most application interfaces, std::span<const T> is more flexible because it carries a runtime count and accepts arrays and other contiguous ranges. Use std::span<T, N> when the fixed extent is itself a contract, while remembering that every span remains non-owning.'
      zh: 'int values[8] 这样的数组形参会调整成 int*，因此既不保留也不强制 8 个元素。const int (&values)[8] 这样的引用形参能够保留精确边界；模板 const T (&values)[N] 还能推导元素类型和边界。大多数应用接口使用 std::span<const T> 更灵活，因为它携带运行时数量，也能接收其他连续范围。固定边界本身就是契约时可用 std::span<T, N>，但任何 span 都不拥有底层元素。'
    topics: [cpp/c-arrays]
    section: { en: 'API design', zh: 'API 设计' }
    level: intermediate
    frequency: common
    tags: [array-reference, span, bounds]

  - id: multidimensional-array-pointer
    question: { en: 'Why can an int[Rows][Cols] array not be passed as int**?', zh: '为什么 int[Rows][Cols] 数组不能按 int** 传递？' }
    answer:
      en: 'A two-dimensional built-in array is an array of row arrays. After the outer array converts, the result points to one complete row, so int grid[2][3] becomes int (*)[3]. The column extent is needed for pointer arithmetic to reach the next row. By contrast, int** points to an int* object and commonly represents a separate table of row pointers. The built-in array contains element rows directly and has no row-pointer objects. A cast cannot create that missing indirection; dereferencing through int** would interpret integer storage as pointers and produces undefined behavior.'
      zh: '二维内置数组是“行数组的数组”。外层数组转换后，结果指向一整行，因此 int grid[2][3] 会变成 int (*)[3]；指针运算需要列边界才能找到下一行。int** 则指向一个 int* 对象，通常表示另一张独立的行指针表。二维内置数组直接包含各行元素，并不存在这些行指针对象。强制类型转换不会创造缺失的间接层，按 int** 解引用会把整数存储误解为指针，从而产生未定义行为。'
    topics: [cpp/c-arrays]
    section: { en: 'Memory layout', zh: '内存布局' }
    level: intermediate
    frequency: occasional
    tags: [multidimensional-arrays, pointer-to-array, row-major]

  - id: choose-array-container-view
    question: { en: 'When should code use a built-in array, std::array, std::span, or std::vector?', zh: '代码应在何时选择内置数组、std::array、std::span 或 std::vector？' }
    answer:
      en: 'Use a built-in array when language-level layout or C interoperability requires it, or for very local fixed storage where it never crosses an interface. Prefer std::array<T, N> when fixed-size storage needs ordinary value semantics such as assignment and return by value. Use std::span<T> or std::span<const T> to borrow an existing contiguous sequence while carrying its length; a span does not extend lifetime. Use std::vector<T> when the length is chosen at runtime or changes. The decision starts with ownership and bounds, not with which bracket syntax looks shortest.'
      zh: '语言级布局或 C 互操作明确要求时，可以使用内置数组；它也适合完全不跨接口的局部定长存储。固定长度还需要赋值、按值返回等普通值语义时，优先使用 std::array<T, N>。借用已有连续序列并携带长度时使用 std::span<T> 或 std::span<const T>，但 span 不会延长生命周期。长度在运行时确定或发生变化时使用 std::vector<T>。选择应先回答所有权和边界问题，而不是比较哪种方括号写法最短。'
    topics: [cpp/c-arrays]
    section: { en: 'Library design', zh: '库设计' }
    level: beginner
    frequency: common
    tags: [std-array, span, vector, ownership]

  - id: c-declaration-definition-linking
    question: { en: 'How do a declaration, a definition, and linking differ in C?', zh: 'C 中的声明、定义和链接有什么区别？' }
    answer:
      en: 'A declaration introduces a name and its type so the compiler can check later uses. A definition is the declaration that also supplies a function body or storage for an object. A header normally carries declarations shared by translation units, while one source file supplies each required external definition. Compilation checks each translation unit separately. Linking then resolves external references between object files and libraries. Compatible repeated declarations are expected; missing definitions cause unresolved references, while multiple external definitions of the same object or function violate the program contract and commonly produce a linker error.'
      zh: '声明引入名称及其类型，让编译器能够检查后续使用。定义还会提供函数体，或为对象提供存储。头文件通常保存多个翻译单元共享的声明，而某个源文件为每个需要的外部实体提供定义。编译阶段分别检查各翻译单元，链接阶段再解析目标文件和库之间的外部引用。兼容声明可以重复；缺少定义通常导致未解析引用，同一对象或函数出现多个外部定义则违反程序约束，并且常被链接器报错。'
    topics: [cpp/c-basics]
    section: { en: 'Compilation model', zh: '编译模型' }
    level: beginner
    frequency: common
    tags: [declarations, definitions, linkage]

  - id: c-usual-arithmetic-conversions
    question: { en: 'Why can comparing a negative int with size_t give an unexpected result?', zh: '为什么负 int 与 size_t 比较可能得到意外结果？' }
    answer:
      en: 'size_t is an unsigned integer type. Before a mixed arithmetic comparison, integer promotions and the usual arithmetic conversions choose a common type. Depending on the types and their ranks, the negative int can convert to an unsigned type, where it becomes a large value modulo that type’s range. The comparison then operates on those converted values, not on the mathematical integers suggested by the source. Keep one signedness within a value domain, check a signed error result before conversion, and prove range validity before converting it to size_t.'
      zh: 'size_t 是无符号整数类型。混合算术比较开始前，整数提升和通常算术转换会选出共同类型。根据类型及其转换等级，负 int 可能被转换为无符号类型，并按该类型的范围变成一个很大的值。比较针对转换后的值，而不是源码看起来表达的数学整数。同一取值域应尽量保持一致的符号性；先检查有符号错误结果，再转换有效值，并在转换成 size_t 前证明其范围有效。'
    topics: [cpp/c-basics]
    section: { en: 'Types and conversions', zh: '类型与转换' }
    level: intermediate
    frequency: common
    tags: [integer-promotion, signedness, size-t]

  - id: c-undefined-behavior-optimization
    question: { en: 'What is undefined behavior, and why can optimization change how a bug appears?', zh: '什么是未定义行为，为什么优化会改变缺陷的表现？' }
    answer:
      en: 'Undefined behavior is behavior for which the C standard imposes no requirements. Examples include signed integer overflow, out-of-bounds access, and conflicting unsequenced modifications. It is not a portable error value or a guaranteed crash. An optimizer may assume that a valid execution never reaches undefined behavior and simplify code using that premise, so a defect can disappear, move, or produce a different result under optimization. Prevent it with explicit contracts and bounds, then use strict warnings, focused tests, AddressSanitizer, and UndefinedBehaviorSanitizer to catch violations on exercised paths.'
      zh: '未定义行为是 C 标准不对结果施加任何要求的行为，例如有符号整数溢出、越界访问，以及彼此无序且冲突的修改。它不是可移植的错误值，也不保证程序崩溃。优化器可以假定合法执行不会到达未定义行为，并据此简化代码，所以缺陷在优化后可能消失、换位置或产生不同结果。应先用明确契约和边界设计避免它，再通过严格警告、针对性测试、AddressSanitizer 和 UndefinedBehaviorSanitizer 检查实际执行路径中的违规。'
    topics: [cpp/c-basics]
    section: { en: 'Correctness', zh: '正确性' }
    level: intermediate
    frequency: common
    tags: [undefined-behavior, optimization, sanitizers]

  - id: c-pass-by-value-pointers
    question: { en: 'Does C pass arguments by reference when a function receives a pointer?', zh: '函数接收指针时，C 是按引用传参吗？' }
    answer:
      en: 'No. C always passes each argument by value. For an int parameter, the callee receives a copy of the integer; for an int* parameter, it receives a copy of the pointer value. Dereferencing that copied pointer can modify the caller’s pointed-to object, which creates reference-like behavior, but assigning a different address to the local pointer does not change the caller’s pointer. To replace the caller’s pointer, pass its address as a pointer to pointer. The interface must also define whether null is accepted and how long the pointed-to object remains valid.'
      zh: '不是。C 始终按值传递每个实参。int 形参接收整数副本，int* 形参接收指针值的副本。函数解引用这个指针副本时，可以修改调用方被指向的对象，于是表现得类似按引用；但给局部指针改存另一个地址，不会改变调用方的指针。若要替换调用方的指针，需要把其地址作为二级指针传入。接口还必须说明是否允许空指针，以及被指向对象需要保持有效多久。'
    topics: [cpp/c-basics]
    section: { en: 'Functions', zh: '函数' }
    level: beginner
    frequency: common
    tags: [pass-by-value, pointers, parameters]

  - id: c-file-io-eof-versus-error
    question: { en: 'How should a C input loop distinguish end of file from an I/O error, and why does fgetc return int?', zh: 'C 输入循环应如何区分文件结束与 I/O 错误，为什么 fgetc 返回 int？' }
    answer:
      en: 'The read operation must drive the loop: test the return from fgetc, fgets, or fread instead of checking feof first. After EOF, NULL, or a short fread count, feof reports that no more input was available, while ferror reports an I/O failure. These indicators describe a read that already happened. fgetc returns int so it can represent every unsigned-char value plus the distinct EOF sentinel. Store its result in int, compare it with EOF, and only then convert or pass the successful character value onward.'
      zh: '循环必须由读取操作的返回值驱动：检查 fgetc、fgets 或 fread 的结果，而不是预先检查 feof。读取返回 EOF、NULL 或短计数后，feof 表示没有更多输入，ferror 表示发生 I/O 错误；这些指示器描述的是已经发生的读取。fgetc 返回 int，才能同时表示所有 unsigned char 值和独立的 EOF 哨兵。应先用 int 保存结果并与 EOF 比较，确认成功后再转换或传递字符值。'
    topics: [cpp/c-file-io]
    section: { en: 'Standard I/O', zh: '标准 I/O' }
    level: intermediate
    frequency: common
    tags: [stdio, eof, error-handling]

  - id: c-file-io-short-counts
    question: { en: 'What do fread and fwrite return, and how should code handle a short count?', zh: 'fread 和 fwrite 返回什么，代码应如何处理短计数？' }
    answer:
      en: 'Both functions return the number of complete elements transferred, not the number of bytes, unless the element size argument is one. A short fread count can mean ordinary end of file or a read error, so code processes the elements received and then queries feof and ferror when the count is below the request. A short fwrite count means the output is incomplete. A byte-oriented write helper advances its pointer by the accepted count and handles the remainder or fails explicitly. Final fflush and fclose errors must still affect the overall result.'
      zh: '两个函数都返回完整传输的元素数；只有元素大小参数为 1 时，该值才直接等于字节数。fread 的短计数可能表示正常到达文件末尾，也可能表示读取错误，因此代码先处理已经取得的元素，再在数量不足时查询 feof 和 ferror。fwrite 的短计数表示输出不完整。面向字节的写入辅助函数应按已接受数量推进指针，继续处理剩余部分或明确失败。最终 fflush 和 fclose 的错误仍必须影响整体结果。'
    topics: [cpp/c-file-io]
    section: { en: 'Standard I/O', zh: '标准 I/O' }
    level: intermediate
    frequency: common
    tags: [fread, fwrite, short-write]

  - id: c-file-io-update-stream-switching
    question: { en: 'What sequencing rules apply when switching between input and output on an update stream?', zh: '更新流在输入与输出之间切换时要遵守哪些顺序规则？' }
    answer:
      en: 'An update mode such as r+, w+, or a+ permits both directions, but it does not make arbitrary switching valid. Before input directly follows output, code must successfully call fflush or a file-positioning function. Before output directly follows input, it normally needs a successful positioning call; the exception is when the input operation encountered end of file. An explicit checked fseek at a phase boundary makes both the intended position and direction transition visible. When phases are independent, closing and reopening with narrower modes can produce a simpler contract.'
      zh: 'r+、w+ 或 a+ 等更新模式允许两个方向，但不代表可以任意切换。输出后直接开始输入前，代码必须成功调用 fflush 或文件定位函数；输入后直接开始输出前，通常需要成功的定位调用，例外是前一次输入操作已经遇到文件结束。在阶段边界显式检查 fseek，能同时表达预期位置和方向转换。若两个阶段彼此独立，关闭后用更窄的模式重新打开，往往可以得到更简单的契约。'
    topics: [cpp/c-file-io]
    section: { en: 'Stream state', zh: '流状态' }
    level: advanced
    frequency: occasional
    tags: [update-stream, fseek, fflush]

  - id: c-file-io-raw-struct-format
    question: { en: 'Why is writing a structure with fwrite usually not a portable file format?', zh: '为什么用 fwrite 直接写结构体通常不是可移植文件格式？' }
    answer:
      en: 'fwrite writes the structure’s object representation for the current implementation. That representation can contain padding bytes, native byte order, implementation-specific type widths, and floating-point encodings. Padding can also contain indeterminate process data that should not be disclosed. A stable format defines a magic value, version, field widths, byte order, length bounds, and validation rules independently of the in-memory type. Encode and decode each field, reject truncated or inconsistent input before allocation, and use raw layouts only for deliberately local files constrained to one ABI and controlled lifetime.'
      zh: 'fwrite 写出的是当前实现中的结构体对象表示，其中可能包含填充字节、本机字节序、实现相关的类型宽度和浮点编码。填充还可能带出不应泄露的进程旧数据。稳定格式应独立于内存类型，明确规定魔数、版本、字段宽度、字节序、长度上限和验证规则。代码要逐字段编码与解码，并在分配内存前拒绝截断或自相矛盾的输入。只有文件明确限制在同一 ABI 和受控生命周期内时，才考虑原始布局。'
    topics: [cpp/c-file-io]
    section: { en: 'Data formats', zh: '数据格式' }
    level: intermediate
    frequency: common
    tags: [binary-format, object-representation, portability]

  - id: c-function-pointer-declaration
    question: { en: 'How do you read int (*handler)(int, int), and why are the parentheses necessary?', zh: '如何理解 int (*handler)(int, int)，其中的括号为什么不可省略？' }
    answer:
      en: 'Start at handler and read outward. The leading star, grouped by parentheses, makes handler a pointer. The following parameter list says the pointed-to entity is a function taking two int arguments, and the initial int is that function’s return type. Function and array postfix operators bind more tightly than prefix star. Without the parentheses, int *handler(int, int) declares handler as a function that takes two ints and returns int*. A typedef can name either the pointer type or the underlying function type when a public signature becomes hard to scan.'
      zh: '从 handler 开始向外读。括号内的星号先与 handler 组合，所以 handler 是指针；随后的参数列表说明它指向接收两个 int 的函数，最前面的 int 则是函数返回类型。函数与数组后缀比前缀星号绑定得更紧，因此括号不能省略。若写成 int *handler(int, int)，handler 就成了一个接收两个 int、返回 int* 的函数。公共签名太长时，可以用 typedef 给指针类型或底层函数类型命名。'
    topics: [cpp/c-function-pointers]
    section: { en: 'Language core', zh: '语言核心' }
    level: beginner
    frequency: common
    tags: [function-pointers, declarations]

  - id: c-function-pointer-compatibility
    question: { en: 'Why does casting an incompatible function pointer not make the call safe?', zh: '为什么强转不兼容的函数指针不能让调用变得安全？' }
    answer:
      en: 'A cast changes the pointer expression’s static type, but it does not change the target function’s actual parameter and return conventions. At the call, C requires the function type used by the call to be compatible with the definition of the target. Otherwise behavior is undefined: arguments or results may be interpreted incorrectly, and a successful build proves nothing. C does allow conversion between function-pointer types and guarantees equality after converting back to the original type. That round-trip guarantee is about preserving the pointer value, not permission to call through the intermediate type.'
      zh: '强制转换只改变指针表达式的静态类型，不会改变目标函数实际接收参数和返回结果的约定。调用发生时，C 要求调用所用函数类型与目标函数定义兼容，否则行为未定义；参数或结果可能被错误解释，成功编译也不能证明安全。C 确实允许不同函数指针类型之间转换，并保证转回原类型后与原值相等。但这个往返保证只说明指针值能恢复，不代表可以通过中间类型调用。正确做法是修改原型或编写真正匹配签名的适配器。'
    topics: [cpp/c-function-pointers]
    section: { en: 'Type safety', zh: '类型安全' }
    level: intermediate
    frequency: common
    tags: [function-types, casts, undefined-behavior]

  - id: c-callback-context-lifetime
    question: { en: 'What contract must accompany a callback that takes a void* context?', zh: '接收 void* 上下文的回调必须附带哪些契约？' }
    answer:
      en: 'The signature alone does not say what object context points to, who owns it, or how long it remains valid. The API must state whether invocation is synchronous or retained, when unregistration completes, which thread calls, whether calls can overlap or reenter, and who releases storage. The callback must convert context back to the same object-pointer type that originally produced it. A stack address works for a synchronous traversal but dangles if retained beyond the call. For persistent registration, the owner must keep storage alive until no in-progress or future callback can access it.'
      zh: '签名本身不会说明 context 指向什么对象、由谁拥有，也不会说明它保持有效多久。API 必须规定调用是同步还是会被保留、注销何时完成、由哪个线程调用、调用能否重叠或重入，以及谁释放存储。回调必须把 context 转回最初产生该指针的同一种对象指针类型。栈地址可用于同步遍历，但若被保留到调用结束后就会悬空。长期注册时，拥有者必须让存储存活到所有进行中和未来回调都不再访问它。'
    topics: [cpp/c-function-pointers]
    section: { en: 'Callbacks and ownership', zh: '回调与所有权' }
    level: intermediate
    frequency: common
    tags: [callbacks, context, lifetime]

  - id: c-qsort-comparator-contract
    question: { en: 'What makes a correct qsort comparator, and why is subtraction risky?', zh: '正确的 qsort 比较函数要满足什么条件，为什么直接相减有风险？' }
    answer:
      en: 'qsort passes pointers to two elements as const void*. The comparator converts them to pointers to the actual element type and returns a negative value, zero, or a positive value for less than, equivalent, or greater than. It must provide a consistent ordering and should not mutate elements or depend on invocation order. Returning left->key - right->key is risky because signed integer overflow is undefined behavior. Build the sign from relational comparisons or explicit branches instead. Equal results do not imply stable output order, because qsort does not promise stability.'
      zh: 'qsort 把两个元素的地址作为 const void* 传给比较函数。比较函数把它们转换为实际元素类型的指针，并用负数、0 或正数表示小于、等价或大于。它必须给出一致顺序，不应修改元素，也不能依赖调用顺序。直接返回 left->key - right->key 有风险，因为有符号整数溢出属于未定义行为。应使用两个关系比较组成符号，或写明确分支。比较结果相等也不表示输出保持原相对顺序，因为 qsort 不保证稳定性。'
    topics: [cpp/c-function-pointers]
    section: { en: 'Standard library', zh: '标准库' }
    level: intermediate
    frequency: occasional
    tags: [qsort, comparator, ordering]

  - id: c-struct-layout-contract
    question: { en: 'What determines a C struct’s size and member offsets?', zh: '哪些因素决定 C 结构体的大小和成员偏移？' }
    answer:
      en: 'Members appear in declaration order and later ordinary members have higher addresses, but the implementation may insert padding between members and after the last member to satisfy alignment. The first member starts at the struct address. sizeof includes tail padding so adjacent array elements are correctly aligned; offsetof reports a particular member offset, and alignof reports the type’s alignment requirement. Exact results depend on the target ABI, compiler options, member types, and packing settings. I verify required layouts with static assertions on every supported target instead of treating one x86-64 observation as portable C.'
      zh: '普通成员按声明顺序排列，后声明成员的地址更高，但实现可以在成员之间及末尾插入填充，以满足对齐要求。第一个成员从结构体地址开始。sizeof 包含尾部填充，使数组中的相邻元素正确对齐；offsetof 给出特定成员偏移，alignof 给出类型的对齐要求。精确结果取决于目标 ABI、编译器选项、成员类型和打包设置。若接口要求固定布局，我会在每个受支持目标上使用静态断言验证，而不会把一次 x86-64 观察当成可移植 C 规则。'
    topics: [cpp/c-structs-unions]
    section: { en: 'Language core', zh: '语言核心' }
    level: intermediate
    frequency: common
    tags: [struct, layout, alignment, padding]

  - id: c-tagged-union-invariant
    question: { en: 'How do you design a safe tagged union in C?', zh: '如何在 C 中设计安全的带标记联合体？' }
    answer:
      en: 'Place an enum discriminant and a union payload in one struct, then define an invariant mapping each tag to exactly one member. Constructor and mutator functions update them together. Every reader, copier, serializer, and destructor switches on the tag before touching the payload and rejects unknown values at external boundaries. If members own resources, switching alternatives first releases the old member, and cloning performs a deep copy where ownership requires it. Internal switches can omit default under exhaustive-enum warnings, while boundary code validates raw integers before calling that internal logic.'
      zh: '把枚举判别值和联合体载荷放进同一个结构体，并建立每个标签只对应一个成员的不变量。构造函数和修改函数同时更新二者；读取、复制、序列化和销毁函数都先检查标签，再访问载荷，并在外部边界拒绝未知值。若成员拥有资源，切换形态前要按旧标签释放旧成员，克隆时则按所有权要求执行深拷贝。内部 switch 可以配合枚举穷举警告省略 default，边界代码则应先验证原始整数，再调用内部逻辑。'
    topics: [cpp/c-structs-unions]
    section: { en: 'Type design', zh: '类型设计' }
    level: intermediate
    frequency: common
    tags: [union, enum, discriminant, invariants]

  - id: c-struct-copy-ownership
    question: { en: 'What happens when you assign a struct that contains a pointer?', zh: '对包含指针的结构体执行赋值时会发生什么？' }
    answer:
      en: 'Struct assignment copies every member value. An array member is copied as part of the struct, but a pointer member contributes only its address, so source and destination then refer to the same pointed-to object. That is safe for an explicitly borrowed immutable object with a sufficient lifetime. It is dangerous for ownership: two apparent owners may double-free, or one release may leave the other dangling. An owning type needs documented initialization, clone, transfer, and destruction operations. Its clone allocates independent storage and must clean up partial work while leaving the source valid if allocation fails.'
      zh: '结构体赋值会复制每个成员的值。数组成员作为结构体的一部分被复制，指针成员却只复制地址，因此来源和目标随后指向同一个对象。若它明确表示借用的不可变对象，而且生命周期足够长，这样做可以安全；若指针表示所有权，两个表面上的拥有者可能重复释放，或一方释放后让另一方悬空。拥有型类型需要记录初始化、克隆、转交和销毁操作。克隆函数应分配独立存储；若分配失败，还要清理已经完成的部分并保持来源有效。'
    topics: [cpp/c-structs-unions]
    section: { en: 'Memory ownership', zh: '内存所有权' }
    level: intermediate
    frequency: common
    tags: [struct, shallow-copy, ownership, pointers]

  - id: c-bit-field-portability
    question: { en: 'Why are C bit fields a poor default for network packets and hardware registers?', zh: '为什么 C 位域不适合作为网络包和硬件寄存器的默认表示？' }
    answer:
      en: 'A bit-field width limits the value bits available to a member, but the implementation controls important layout details such as allocation units, ordering within a unit, and whether fields cross unit boundaries. Packing and byte order add further target-specific assumptions. You also cannot take a bit field’s address, and an ordinary read-modify-write is not automatically atomic. For a portable external format, I load bytes into an unsigned integer of known width, apply explicit masks and shifts, and handle byte order separately. A bit-field mapping is acceptable only under a documented, tested compiler and ABI contract.'
      zh: '位域宽度会限制成员可用的值位，但分配单元、单元内排列顺序以及字段能否跨单元等关键布局细节由实现控制，打包和字节序还会增加目标相关假设。位域不能取地址，普通读改写也不会自动成为原子操作。处理可移植外部格式时，我会先把字节装入已知宽度的无符号整数，再使用明确的掩码和移位，并单独处理字节序。只有编译器与 ABI 契约已经记录并经过测试时，才适合采用位域映射。'
    topics: [cpp/c-structs-unions]
    section: { en: 'Portability', zh: '可移植性' }
    level: advanced
    frequency: occasional
    tags: [bit-fields, portability, byte-order]

  - id: classes-class-versus-struct
    question: { en: 'How do class and struct differ in C++, and how do you choose between them?', zh: 'C++ 中的 class 与 struct 有何区别，应如何选择？' }
    answer:
      en: >-
        Both keywords define class types and support data members, member functions, constructors, templates, and inheritance. The language differences are their defaults: class makes members and bases private, while struct makes them public. I use struct for an open record whose fields callers may combine directly. I use class when changes must pass through operations that preserve an invariant. That convention communicates intent but does not change the formal type rules. Aggregate status is separate, so changing class to struct does not automatically make a type an aggregate.
      zh: >-
        两个关键字都定义类类型，也都支持数据成员、成员函数、构造函数、模板和继承。语言层面的区别是默认访问：class 的成员与基类默认是 private，struct 则默认是 public。我通常用 struct 表示调用者可以直接组合字段的开放记录，用 class 表示必须通过操作维护不变量的类型。这种选择表达接口意图，但不会改变正式的类型规则。聚合类型还有独立条件，因此把 class 改成 struct 不会自动让类型成为聚合。
    topics: [cpp/classes]
    section: { en: 'Language core', zh: '语言核心' }
    level: beginner
    frequency: common
    tags: [class, struct, access-control]

  - id: classes-initialization-order
    question: { en: 'In what order does a C++ constructor initialize an object, and why does that order matter?', zh: 'C++ 构造函数按什么顺序初始化对象，这个顺序为什么重要？' }
    answer:
      en: >-
        For a complete object, virtual bases initialize first, then direct bases, then non-static data members in declaration order, and finally the constructor body runs. The written order of the member initializer list cannot change that sequence. This matters when one member's initializer reads another member: the dependency must already be initialized according to declaration order. I keep declarations and initializers in matching order and enable reorder warnings. Destruction reverses construction. If construction throws, completed bases and members are destroyed, but the unfinished outer object's destructor does not run.
      zh: >-
        对完整对象而言，虚基类最先初始化，然后是直接基类，再按声明顺序初始化非静态数据成员，最后才执行构造函数体。成员初始化器列表的书写顺序不能改变这个过程。若一个成员的初始化表达式读取另一个成员，后者必须已经按声明顺序完成初始化。我会让声明与初始化器保持相同顺序，并启用重排警告。析构顺序与构造相反。构造抛出异常时，已完成的基类与成员会销毁，但未完成的外层对象不会执行自己的析构函数。
    topics: [cpp/classes]
    section: { en: 'Object lifetime', zh: '对象生命周期' }
    level: intermediate
    frequency: common
    tags: [constructors, initialization-order, destruction]

  - id: classes-rule-of-zero
    question: { en: 'What does the Rule of Zero mean for class design?', zh: '零法则对类设计意味着什么？' }
    answer:
      en: >-
        The Rule of Zero says that a class should avoid declaring its own destructor, copy operations, or move operations when its members already model ownership correctly. Members such as string, vector, and smart pointers compose their behavior into the outer class. That removes duplicated lifetime code and lets the type system delete copying when a member is noncopyable. I still verify the resulting semantics: memberwise copying must match the domain, references and non-owning views need lifetime rules, and a user-declared constructor or destructor can change which special member functions are generated.
      zh: >-
        零法则主张：如果成员已经正确表达所有权，外层类就不要自行声明析构、复制或移动操作。string、vector 和智能指针等成员会把自身行为组合到外层类中，从而减少重复的生命周期代码；某个成员不可复制时，类型系统也会相应删除外层复制。不过我仍会验证最终语义：逐成员复制必须符合领域含义，引用与非拥有视图需要生命周期规则，用户声明的构造函数或析构函数也可能改变特殊成员函数的生成结果。
    topics: [cpp/classes]
    section: { en: 'Class design', zh: '类设计' }
    level: intermediate
    frequency: common
    tags: [rule-of-zero, special-member-functions, ownership]

  - id: classes-const-member-function
    question: { en: 'What does trailing const on a member function guarantee, and what does it not guarantee?', zh: '成员函数末尾的 const 保证什么，又不保证什么？' }
    answer:
      en: >-
        A trailing const qualifies the current object for that call. The function can be invoked through a const object or const reference, and ordinary member access cannot modify non-mutable data through this. It does not make returned references outlive the object, guarantee thread safety, or make the function a compile-time computation. Mutable members and objects reached through pointers can still change, so const is not deep immutability. I mark observers const, test them through const references, and document the lifetime of any reference, pointer, span, or iterator they return.
      zh: >-
        末尾的 const 会限定本次调用中的当前对象。函数可以通过 const 对象或 const 引用调用，也不能通过普通成员访问修改非 mutable 数据。它不保证返回引用比对象活得更久，不保证线程安全，也不会让函数自动变成编译期计算。mutable 成员以及通过指针间接访问的对象仍可能变化，因此 const 不是深层不可变。我会把观察函数标为 const，通过 const 引用编译测试，并说明它返回的引用、指针、span 或迭代器的生命周期。
    topics: [cpp/classes]
    section: { en: 'API design', zh: 'API 设计' }
    level: beginner
    frequency: common
    tags: [const, member-functions, api-design]

  - id: exceptions-stack-unwinding
    question: { en: 'What happens from a throw expression until a matching catch begins?', zh: '从执行 throw 表达式到进入匹配的 catch 之间会发生什么？' }
    answer:
      en: >-
        The throw operand initializes a separate exception object, and the runtime searches dynamically enclosing handlers in source order. A compatible type, accessible unambiguous base, certain pointer conversion, or catch-all can match. As the search leaves scopes, fully constructed automatic objects are destroyed in reverse construction order. This is stack unwinding and is why resources need RAII owners. Once a handler matches, its parameter is initialized and its body runs. If no handler matches, or an exception crosses a noexcept boundary, the program ultimately calls std::terminate.
      zh: >-
        throw 的操作数会初始化一个独立异常对象，运行时再按源码顺序搜索动态包围抛出点的处理器。相同类型、可访问且无歧义的基类、部分指针转换或兜底处理器可以匹配。搜索离开作用域时，已完成构造的自动对象按构造的逆序销毁，这就是栈展开，也是资源需要 RAII 所有者的原因。匹配后，程序初始化 catch 参数并执行处理器。若没有匹配项，或异常越过 noexcept 边界，程序最终会调用 std::terminate。
    topics: [cpp/exceptions]
    section: { en: 'Language core', zh: '语言核心' }
    level: intermediate
    frequency: common
    tags: [exceptions, stack-unwinding, handler-matching]

  - id: exceptions-safety-guarantees
    question: { en: 'How do the basic, strong, and no-throw exception guarantees differ?', zh: '基本、强和不抛出异常安全保证有何区别？' }
    answer:
      en: >-
        The basic guarantee says failure leaks no resources and leaves every affected object valid, though values may have changed. The strong guarantee adds that observable state is unchanged, as if the operation never happened. The no-throw guarantee says the operation does not fail by propagating an exception. I prove these against each potentially throwing step, not by counting try blocks. RAII establishes resource cleanup, while prepare-then-commit or copy-and-swap can establish the strong guarantee when the final commit cannot throw. The documented scope must say which objects or external transaction the guarantee covers.
      zh: >-
        基本保证表示失败不会泄漏资源，而且每个受影响对象仍然有效，但值可能已经改变。强保证进一步要求可观察状态不变，就像操作从未发生。不抛出保证则表示操作不会通过传播异常而失败。我会逐项检查每个可能抛出的步骤，而不是统计 try 块。RAII 用于保证资源清理；如果最终提交不会抛出，先准备后提交或复制后交换可以建立强保证。文档还必须说明保证覆盖哪些对象或外部事务。
    topics: [cpp/exceptions]
    section: { en: 'Exception safety', zh: '异常安全' }
    level: intermediate
    frequency: common
    tags: [basic-guarantee, strong-guarantee, no-throw-guarantee]

  - id: exceptions-noexcept-contract
    question: { en: 'What does noexcept promise, and why can an incorrect annotation be dangerous?', zh: 'noexcept 承诺什么，错误标注为什么危险？' }
    answer:
      en: >-
        noexcept promises that an exception will not leave the function. It does not prevent code in the body from throwing; if an exception does cross that boundary, std::terminate is called and an outer catch cannot recover it. The annotation therefore changes failure semantics rather than merely suggesting optimization. It also participates in type properties and can influence whether generic code such as std::move_if_noexcept selects copying or moving. I derive the specification from base and member operations, callbacks, allocation, and logging, then verify generic cases with nothrow type traits instead of adding noexcept mechanically.
      zh: >-
        noexcept 承诺异常不会离开函数，但不会阻止函数体中的代码抛出。异常一旦越过这条边界，程序会调用 std::terminate，外层 catch 无法恢复。因此，这项标注改变的是失败语义，不只是优化提示。它还参与类型属性，并可能影响 std::move_if_noexcept 等泛型代码选择复制还是移动。我会根据基类与成员操作、回调、分配和日志行为推导异常规范，再用不抛出类型特征验证泛型情况，而不会机械添加 noexcept。
    topics: [cpp/exceptions]
    section: { en: 'API contracts', zh: 'API 契约' }
    level: advanced
    frequency: common
    tags: [noexcept, terminate, type-traits]

  - id: exceptions-catch-and-rethrow
    question: { en: 'How should C++ code catch and rethrow exceptions without losing their dynamic type?', zh: 'C++ 代码应如何捕获并重新抛出异常，才不会丢失动态类型？' }
    answer:
      en: >-
        Throw complete objects by value and normally catch polymorphic exceptions by const reference. A catch parameter declared by value creates a base object when the handler type is a base, slicing off derived state. Inside a handler, bare throw; rethrows the currently handled exception object and preserves its dynamic type. Writing throw error; starts a new throw from the parameter expression and can slice again. I catch only where the layer can recover, add policy, or translate types. When translating, I copy stable context into a domain exception or structured cause instead of depending on what() text parsing.
      zh: >-
        应按值抛出完整对象，并通常通过 const 引用捕获多态异常。若处理器类型是基类，按值声明 catch 参数会创建一个基类对象，切掉派生状态。处理器中的裸 throw; 会重新抛出当前异常对象并保留动态类型；写成 throw error; 则会从参数表达式开始新的抛出，可能再次发生切片。我只在当前层能够恢复、执行策略或转换类型时捕获。转换时把稳定上下文复制进领域异常或结构化原因，而不是依赖解析 what() 文本。
    topics: [cpp/exceptions]
    section: { en: 'Exception design', zh: '异常设计' }
    level: intermediate
    frequency: common
    tags: [catch-by-reference, rethrow, object-slicing]

  - id: inheritance-public-contract
    question: { en: 'When is public inheritance the right relationship in C++?', zh: 'C++ 中什么时候适合使用公有继承？' }
    answer:
      en: >-
        Public inheritance is appropriate when every derived object can stand in for a base object without surprising code that follows the base contract. The derived class must accept the base's valid inputs, preserve its postconditions and invariants, and avoid exposing operations that become meaningless. Reusing a few members is not enough. I test the decision by writing callers against Base references and running the same contract tests over each derived type. If the relationship is really has-a, or the derived type must restrict base behavior, I prefer composition or a separate interface.
      zh: >-
        公有继承适用于派生对象能够替换基类对象，而且不会让遵守基类契约的调用代码产生意外的情况。派生类必须接受基类允许的输入，保持其后置条件和不变量，也不能让已有操作失去含义。只想复用几个成员并不是充分理由。我会让调用者只依赖 Base 引用，再对每个派生类型运行同一组契约测试。如果真实关系是「有一个」，或派生类型必须限制基类行为，我会改用组合或单独的接口。
    topics: [cpp/inheritance]
    section: { en: 'Type design', zh: '类型设计' }
    level: intermediate
    frequency: common
    tags: [public-inheritance, substitutability, liskov-substitution]

  - id: inheritance-object-slicing
    question: { en: 'What is object slicing, and where do you look for it in an API?', zh: '什么是对象切片，在 API 中应去哪里查找它？' }
    answer:
      en: >-
        Object slicing happens when a derived object initializes or assigns a base object by value. Only the base subobject is copied, so derived state and the original dynamic type disappear. Virtual functions cannot recover what was never stored. I search for polymorphic bases used as parameters, return values, catch parameters, data members, and container element types. Non-owning APIs normally take Base& or const Base&. Heterogeneous owners commonly store unique_ptr<Base>. If callers need value semantics, the hierarchy needs an explicit cloning design, or the model may be clearer as a closed variant.
      zh: >-
        对象切片发生在派生对象按值初始化基类对象或赋给基类对象时。操作只复制基类子对象，派生状态和原来的动态类型都会消失；虚函数无法恢复从未保存的部分。我会检查多态基类是否按值出现在参数、返回值、catch 参数、数据成员和容器元素中。不转移所有权的 API 通常接收 Base& 或 const Base&，异构拥有者通常保存 unique_ptr<Base>。如果调用者需要值语义，类层次就要提供明确的克隆设计，或者改成封闭的 variant 表示。
    topics: [cpp/inheritance]
    section: { en: 'Object model', zh: '对象模型' }
    level: intermediate
    frequency: common
    tags: [object-slicing, references, polymorphism]

  - id: inheritance-destructor-policy
    question: { en: 'What destructor policy should a C++ base class use?', zh: 'C++ 基类应采用什么析构策略？' }
    answer:
      en: >-
        The policy follows how the interface permits destruction. If clients may own a derived object through Base* or unique_ptr<Base>, Base needs a public virtual destructor so deletion reaches the most-derived destructor before destroying base parts. A public non-virtual destructor makes that deletion undefined behavior. If the design forbids deletion through the base interface, a protected non-virtual destructor can enforce the restriction while derived objects remain directly destructible. I check factories, containers, callbacks, and ownership aliases rather than inferring the policy only from whether another virtual function happens to exist.
      zh: >-
        析构策略取决于接口允许怎样销毁对象。如果调用者可以通过 Base* 或 unique_ptr<Base> 拥有派生对象，Base 就需要公有虚析构函数，使删除过程先执行最派生类析构，再销毁基类部分。公有非虚析构会让这种删除产生未定义行为。如果设计禁止通过基类接口删除，可以用受保护的非虚析构强制执行，同时允许直接销毁派生对象。我会检查工厂、容器、回调和所有权别名，而不是只根据类中是否碰巧有其他虚函数来判断。
    topics: [cpp/inheritance]
    section: { en: 'Object lifetime', zh: '对象生命周期' }
    level: intermediate
    frequency: common
    tags: [virtual-destructor, ownership, undefined-behavior]

  - id: inheritance-virtual-diamond
    question: { en: 'How does virtual inheritance change a diamond hierarchy?', zh: '虚继承会怎样改变菱形类层次？' }
    answer:
      en: >-
        Without virtual inheritance, each path through a diamond contributes its own common-base subobject. State, member lookup, and conversion to that common base can therefore be duplicated or ambiguous. When both intermediate classes virtually inherit the common base, the most-derived object contains one shared virtual-base subobject. The most-derived constructor, not an arbitrary intermediate constructor, initializes it. I use this only when both paths represent one shared identity. If each role should own separate base state, ordinary multiple inheritance is correct. I also avoid depending on compiler-specific offsets or hidden-table layouts.
      zh: >-
        没有虚继承时，菱形中的每条路径都会带来一份共同基类子对象，因此状态、成员查找以及到共同基类的转换可能重复或产生歧义。两个中间类都虚继承共同基类后，最派生对象只包含一份共享虚基类子对象，并由最派生类构造函数负责初始化，而不是任意中间类决定。我只在两条路径确实表示同一身份时这样设计；若每个角色都应拥有独立基类状态，普通多重继承反而正确。同时，我不会依赖特定编译器的偏移或隐藏表布局。
    topics: [cpp/inheritance]
    section: { en: 'Multiple inheritance', zh: '多重继承' }
    level: advanced
    frequency: occasional
    tags: [multiple-inheritance, virtual-inheritance, construction-order]

  - id: namespaces-versus-class-and-module
    question: { en: 'How does a namespace differ from a class and a C++20 module?', zh: '命名空间与类、C++20 模块有什么区别？' }
    answer:
      en: >-
        A namespace is an open declarative region for organizing names and participating in lookup. It has no instances, inheritance, or public and private member access, and separate files can extend it. A class defines a type whose objects hold state and whose access specifiers enforce member access rules. A module controls declaration visibility and export across module units and can reduce dependence on textual inclusion. Modules and namespaces are complementary: exported declarations still belong to namespaces. I choose a namespace for ownership of names, a class for an object contract, and a module for a distribution and visibility boundary.
      zh: >-
        命名空间是用于组织名称并参与查找的开放声明区域，可以由多个文件继续定义，但不能实例化、继承，也没有 public 或 private 成员访问控制。类会定义一种类型，对象可以保存状态，访问说明符还能强制限制成员访问。C++20 模块控制声明在模块单元之间的可见性与导出，并减少对文本包含的依赖。三者不是互斥选择：导出的声明仍可属于命名空间。我用命名空间表达名称所有权，用类表达对象契约，用模块建立分发与可见性边界。
    topics: [cpp/namespaces]
    section: { en: 'Language core', zh: '语言核心' }
    level: beginner
    frequency: common
    tags: [namespaces, classes, modules]

  - id: namespaces-using-declaration-directive
    question: { en: 'How do a using-declaration and a using-directive affect name lookup?', zh: 'using 声明和 using 指令如何影响名称查找？' }
    answer:
      en: >-
        A using-declaration names specific declarations, such as using std::string, and makes those declarations available in its scope. That keeps the imported name and its owner visible in one line. A using-directive, such as using namespace std, makes unqualified lookup consider names from the nominated namespace without declaring local copies. Its candidate set can change as headers or the namespace evolve, so it can introduce distant ambiguities. I avoid directives in headers, qualify public signatures, and use narrow block-scope declarations when repetition obscures the code. Neither form changes an entity's identity or linkage.
      zh: >-
        using 声明会指定具体声明，例如 using std::string，并让当前作用域可以查找到它；引入了什么以及名称属于谁，都集中在一行中。using 指令写作 using namespace std，让非限定查找考虑指定命名空间里的名称，但不会逐个创建本地副本。随着头文件或命名空间增加声明，候选集合也可能变化，并在远处制造歧义。我不会在头文件中使用指令，公共签名保持限定；实现代码重复过多时，只在较小块作用域中引入单个名称。两种写法都不改变实体身份或链接。
    topics: [cpp/namespaces]
    section: { en: 'Name lookup', zh: '名称查找' }
    level: intermediate
    frequency: common
    tags: [using-declaration, using-directive, headers]

  - id: namespaces-adl-customization
    question: { en: 'What is argument-dependent lookup, and why does generic C++ code rely on it?', zh: '什么是参数依赖查找，为什么泛型 C++ 代码会依赖它？' }
    answer:
      en: >-
        For an unqualified function call, argument-dependent lookup adds candidates from namespaces and classes associated with the argument types. That lets an operation placed beside a user-defined type participate without a global using-directive. Operators, hidden friends, and protocols such as the classic swap pattern use this behavior. Generic swap code first introduces std::swap as a fallback and then calls swap unqualified, allowing ADL to select a type-specific overload. I separate ordinary lookup from ADL when diagnosing ambiguity. I also avoid qualifying a deliberate customization call, because qualification disables this candidate-adding step, while ordinary business calls can often stay explicitly qualified.
      zh: >-
        对非限定函数调用，参数依赖查找会从实参类型的关联命名空间和关联类中加入候选。这样，用户定义类型旁边的操作无需全局 using 指令也能参与调用。运算符、隐藏友元和经典 swap 协议都依赖这项规则；泛型交换先引入 std::swap 作为后备，再非限定调用 swap，让 ADL 有机会选择类型专用重载。排查歧义时，我会分别列出普通查找与 ADL 候选。明确设计为定制点的调用不能随意加限定，因为限定会关闭这一步；普通业务调用通常可以显式限定。
    topics: [cpp/namespaces]
    section: { en: 'Generic programming', zh: '泛型编程' }
    level: advanced
    frequency: common
    tags: [adl, customization-point, overload-resolution]

  - id: namespaces-unnamed-inline
    question: { en: 'What problems do unnamed and inline namespaces solve, and what do they not guarantee?', zh: '未命名命名空间与内联命名空间分别解决什么问题，又不保证什么？' }
    answer:
      en: >-
        An unnamed namespace gives its names internal linkage within one translation unit, which suits helpers and implementation types in a source file. In a header, however, each translation unit gets separate entities, so state can split unexpectedly. An inline namespace exposes its members through the enclosing namespace's lookup and is commonly used to select a default API version while retaining explicit version names. It does not mean function inlining, and switching versions does not guarantee ABI compatibility. I use unnamed namespaces for source-local ownership and inline namespaces only with an explicit versioning and binary-compatibility policy.
      zh: >-
        未命名命名空间让其中名称在单个翻译单元内具有内部链接，适合源文件中的辅助函数与实现类型。但它若出现在头文件中，每个翻译单元都会得到独立实体，状态可能意外分裂。内联命名空间让成员也能通过外层命名空间查找，常用于选择默认 API 版本，同时保留明确的版本名称。这里的 inline 不是函数内联，也不保证切换版本后 ABI 兼容。我用未命名命名空间表达源文件局部所有权，只在已有明确版本与二进制兼容策略时采用内联命名空间。
    topics: [cpp/namespaces]
    section: { en: 'Library design', zh: '库设计' }
    level: intermediate
    frequency: occasional
    tags: [unnamed-namespace, inline-namespace, linkage, abi]

  - id: operator-member-or-nonmember
    question: { en: 'How do you choose between a member and non-member operator overload?', zh: '如何在成员与非成员运算符重载之间选择？' }
    answer:
      en: >-
        Start with the language constraints: assignment, subscript, function call, and arrow operators must be members. A mutating operation such as += also naturally belongs to the left object. For symmetric binary operations, I usually use a non-member, often a hidden friend, because both operands then participate in conversion matching the same way. Stream insertion is non-member because std::ostream is the left operand and I cannot add members to it. friend is only an access choice, not what makes a function non-member. I test both operand orders whenever the domain claims symmetry.
      zh: >-
        先看语言限制：赋值、下标、函数调用和箭头运算符必须是成员。+= 这类修改操作也自然属于左侧对象。对称二元运算通常适合非成员函数，常用隐藏友元，因为两个操作数能以相同方式参与转换匹配。流插入必须是非成员函数，因为左操作数是 std::ostream，类型作者不能向它添加成员。friend 只决定私有访问权限，不是函数成为非成员的原因。只要领域声称运算对称，我就会测试两种操作数顺序。
    topics: [cpp/operator-overloading]
    section: { en: 'Language core', zh: '语言核心' }
    level: intermediate
    frequency: common
    tags: [member-operator, non-member-operator, hidden-friend, conversions]

  - id: operator-return-contracts
    question: { en: 'What return types do arithmetic, compound assignment, increment, subscript, and stream operators normally use?', zh: '算术、复合赋值、自增、下标与流运算符通常应返回什么类型？' }
    answer:
      en: >-
        Binary arithmetic normally returns a new T by value, while compound assignment changes the left operand and returns T& so chaining keeps operating on that object. Prefix increment commonly returns T& after mutation; postfix increment takes a dummy int and returns the old value by value. A container-like subscript usually has T& and const T& overloads for writable and read-only objects. Stream insertion returns std::ostream& to preserve the original stream and permit chaining. These are semantic conventions rather than universal syntax rules, so I verify each type's stated contract and the lifetime of every returned reference.
      zh: >-
        二元算术通常按值返回新的 T；复合赋值修改左操作数并返回 T&，使链式调用继续操作同一对象。前缀自增一般在修改后返回 T&，后缀自增带一个占位 int 形参，并按值返回旧值。容器式下标通常为可写与只读对象分别提供 T& 和 const T& 重载。流插入返回 std::ostream&，从而保留原流并支持链接。这些是语义约定，不是适用于所有类型的语法硬规则，因此还要检查具体契约和每个返回引用的生命周期。
    topics: [cpp/operator-overloading]
    section: { en: 'Operator contracts', zh: '运算符契约' }
    level: intermediate
    frequency: common
    tags: [return-type, references, compound-assignment, const-correctness]

  - id: defaulted-spaceship-contract
    question: { en: 'What does a defaulted three-way comparison generate, and when is it the wrong choice?', zh: '默认三向比较会生成什么，什么时候不适合使用？' }
    answer:
      en: >-
        A defaulted operator<=> compares base subobjects and non-static data members in declaration order. Relational operators can use it through rewritten candidates. If the class declares no member or friend named operator==, the defaulted three-way comparison also causes a matching defaulted equality operator to be declared. Its result category is derived from subobject comparisons, so a floating member can produce partial ordering. Defaulting is wrong when stored fields do not all belong to value identity, such as caches, debug counters, or surrogate keys. I define the semantic fields first, then test equality, ordering equivalence, NaN behavior, and transitivity.
      zh: >-
        默认 operator<=> 会按声明顺序比较基类子对象和非静态数据成员，关系运算符可以通过改写候选使用它。若类中没有声明名为 operator== 的成员或友元，默认三向比较还会促使编译器声明匹配的默认相等运算符。返回类别来自各子对象的比较，浮点成员可能带来偏序。如果缓存、调试计数或代理键等存储字段不属于值身份，就不适合直接默认比较。我会先定义参与语义的字段，再测试相等、排序等价、NaN 行为与传递性。
    topics: [cpp/operator-overloading]
    section: { en: 'Comparisons', zh: '比较' }
    level: advanced
    frequency: common
    tags: [three-way-comparison, rewritten-candidate, comparison-category]

  - id: review-generated-operator-set
    question: { en: 'How do you review an AI-generated set of operator overloads?', zh: '怎样审查 AI 生成的一组运算符重载？' }
    answer:
      en: >-
        I begin with a contract table: operand types, mutation, result category, equality fields, boundaries, and failure behavior. Then I ask the compiler which member, non-member, built-in, and rewritten candidates exist for representative expressions. Tests cover both operand orders, const objects, chained assignment, invalid conversions, and returned-reference identity. Comparisons need law-based cases rather than six copied functions; floating values add NaN and signed zero. For subscripts I verify writable and const overloads plus the bounds policy. I reject overloaded && or || when correctness depends on short-circuiting, and I inspect every implicit conversion added merely to silence a diagnostic.
      zh: >-
        我先建立契约表，写清操作数类型、是否修改、结果类别、相等字段、边界与失败行为。随后让编译器列出代表性表达式中的成员、非成员、内置和改写候选。测试要覆盖两种操作数顺序、const 对象、链式赋值、非法转换和返回引用身份。比较不能只验证六个复制出来的函数，还要检查关系性质；浮点值需加入 NaN 与带符号零。下标要核对可写与 const 重载及边界策略。若正确性依赖短路，我会拒绝重载 && 或 ||，并检查所有仅为消除诊断而加入的隐式转换。
    topics: [cpp/operator-overloading]
    section: { en: 'Generated code review', zh: '生成代码审查' }
    level: advanced
    frequency: occasional
    tags: [code-review, ai-generated-code, overload-resolution, operator-contract]

  - id: raii-lifetime-not-stack
    question: { en: 'What does RAII guarantee, and why is it not synonymous with stack allocation?', zh: 'RAII 保证什么，为什么它不等同于栈分配？' }
    answer:
      en: >-
        RAII binds release responsibility to the lifetime of an owning object. After acquisition succeeds, the resource immediately enters an object whose destructor performs the paired release, so normal return, early return, and exception unwinding use the same cleanup path. Stack allocation is only one way to manage the owner. An RAII object can be a data member, an element of a container, or dynamically allocated under a smart pointer. The real contract is ownership plus deterministic destruction when that owner's lifetime ends. RAII does not promise cleanup after abort, power loss, or every process-termination API.
      zh: >-
        RAII 把释放责任绑定到所有者对象的生命周期。获取成功后，资源立即进入由析构函数执行配对释放的对象，因此正常返回、提前返回和异常栈展开共用同一条清理路径。栈分配只是管理所有者的一种方式；RAII 对象也可以是数据成员、容器元素，或由智能指针管理的动态对象。真正的契约是所有权，以及所有者生命周期结束时的确定性析构。RAII 不保证在 abort、断电或所有进程终止 API 之后仍能执行清理。
    topics: [cpp/raii]
    section: { en: 'Resource ownership', zh: '资源所有权' }
    level: intermediate
    frequency: common
    tags: [raii, deterministic-destruction, lifetime]

  - id: raii-construction-failure
    question: { en: 'How should an RAII class handle a resource when its constructor can fail after acquisition?', zh: 'RAII 类在取得资源后构造仍可能失败时，应怎样管理该资源？' }
    answer:
      en: >-
        The complete object's destructor does not run when its constructor throws, so storing a raw handle in a plain integer or pointer member is unsafe if later initialization can fail. Already-constructed base and member subobjects are destroyed in reverse order. I therefore put the handle in a dedicated RAII member that acquires or adopts it before later fallible work. Another option is a factory that first creates a temporary owner, completes configuration, and only then moves the owner into the returned object. Acquisition failure should leave no apparently usable object unless an invalid state is an explicit part of the type's contract.
      zh: >-
        构造函数抛出时，完整对象的析构函数不会执行。因此，若后续初始化仍可能失败，把裸句柄存进普通整数或指针成员并不安全。已经完成构造的基类和成员子对象会按逆序销毁，所以我会让专用 RAII 成员先取得或接管句柄，再执行可能失败的工作。另一种做法是让工厂先建立临时所有者，完成全部配置后再移动进返回对象。除非无效状态本来就是类型契约的一部分，否则获取失败不应留下一个看似可用的对象。
    topics: [cpp/raii]
    section: { en: 'Construction and destruction', zh: '构造与析构' }
    level: advanced
    frequency: occasional
    tags: [construction-failure, member-lifetime, ownership]

  - id: raii-destructor-failure
    question: { en: 'How do you design RAII cleanup when closing or committing can fail?', zh: '关闭或提交可能失败时，怎样设计 RAII 清理？' }
    answer:
      en: >-
        I separate reportable completion from fallback destruction. A normal close, finish, or commit method returns status or throws while the caller can still apply policy; after success it marks the object empty or complete. The destructor handles objects that were not explicitly completed, but its cleanup path does not let exceptions escape. Transaction guards commonly roll back by default rather than commit, because scope exit does not prove the operation succeeded. If rollback itself can fail, the destructor can record a best-effort diagnostic or invalidate the connection, while an outer recovery mechanism verifies external state. RAII cannot make an inherently fallible operation infallible.
      zh: >-
        我会把需要报告结果的完成操作与析构兜底分开。普通 `close`、`finish` 或 `commit` 在调用方仍能执行策略时返回状态或抛出，成功后把对象标为空或已完成。析构函数处理没有显式完成的对象，但不让清理异常逃出。事务守卫通常默认回滚而不是提交，因为离开作用域不能证明操作成功。若回滚本身也可能失败，析构函数可以尽力记录诊断或让连接失效，再由外层恢复机制确认外部状态。RAII 无法把本来会失败的操作变成绝不失败。
    topics: [cpp/raii]
    section: { en: 'Failure contracts', zh: '失败契约' }
    level: advanced
    frequency: common
    tags: [destructor, no-throw, explicit-close, transaction]

  - id: virtual-static-dynamic-type
    question: { en: 'How do static type and dynamic type participate in a virtual function call?', zh: '静态类型与动态类型如何共同参与虚函数调用？' }
    answer:
      en: >-
        The static type controls name lookup, access checking, overload resolution, and default arguments. If that process selects a virtual member and the call is not explicitly qualified, the complete object's dynamic type then selects the final overrider. For a Derived object observed through Base&, Base defines which signature is called, while Derived can supply the body. Non-virtual members remain selected from Base. I test this distinction through a base reference, because a direct call on Derived can hide a signature mismatch or name-hiding bug that production code will expose.
      zh: >-
        静态类型控制名字查找、访问检查、重载决议和默认实参。若这个阶段选中虚成员，而且调用没有显式限定，完整对象的动态类型再选择最终覆盖函数。通过 Base& 观察 Derived 对象时，Base 决定调用哪个签名，Derived 可以提供函数体；非虚成员仍按 Base 选择。我会通过基类引用测试，因为直接调用 Derived 可能掩盖签名不匹配或名字隐藏，而生产代码会暴露这些问题。
    topics: [cpp/virtual-functions]
    section: { en: 'Object model', zh: '对象模型' }
    level: intermediate
    frequency: common
    tags: [static-type, dynamic-type, virtual-dispatch, final-overrider]

  - id: virtual-override-matching
    question: { en: 'What must match for a derived member to override a base virtual function?', zh: '派生成员要重写基类虚函数，哪些部分必须匹配？' }
    answer:
      en: >-
        The parameter list and the member function's cv- and reference-qualifiers must satisfy the override rules. A trailing const or an & qualifier is therefore not cosmetic. Return types are normally identical, with a limited covariance rule for pointers or references to class types. Access level does not determine overriding, so a private base virtual can still be overridden. I put override on every intended derived implementation: it does not create an override, but makes the compiler reject a mismatch. I also enable hidden-virtual warnings because same-named overloads can disappear from lookup without being overrides.
      zh: >-
        形参列表以及成员函数的 cv 限定符和引用限定符必须满足重写规则，所以末尾的 const 或 & 不是装饰。返回类型通常相同，指向类的指针或引用可在受限条件下使用协变返回。访问级别不决定重写，因此基类私有虚函数也能被重写。我会为每个预期派生实现写 override；它不会创造重写关系，却会让编译器拒绝不匹配。同时还要开启隐藏虚函数警告，因为同名重载可能从查找中消失，却没有形成重写。
    topics: [cpp/virtual-functions]
    section: { en: 'Language core', zh: '语言核心' }
    level: intermediate
    frequency: common
    tags: [override, cv-qualifier, reference-qualifier, name-hiding]

  - id: virtual-construction-destruction
    question: { en: 'What happens to virtual dispatch inside constructors and destructors?', zh: '构造函数和析构函数中的虚分派会发生什么？' }
    answer:
      en: >-
        While a Base constructor runs for a Derived object, virtual calls on that object dispatch no further than Base and its already constructed bases. The Derived lifetime has not begun. Destruction mirrors this: once execution reaches Base's destructor, the Derived portion has ended its lifetime, so dispatch does not return to it. A virtual call that reaches a pure virtual function during construction or destruction has undefined behavior. I avoid overridable initialization hooks in constructors; a factory can finish construction first, then call an explicit virtual step on the complete object.
      zh: >-
        为 Derived 对象执行 Base 构造函数时，通过该对象发出的虚调用最多进入 Base 及已经构造的基类，不会进入生命周期尚未开始的 Derived。析构过程与之对称：执行到 Base 析构函数时，Derived 部分的生命周期已经结束，分派不会返回那里。构造或析构期间的虚调用若命中纯虚函数，行为未定义。我会避免在构造函数中使用可重写初始化钩子，改由工厂先完成构造，再对完整对象调用显式虚步骤。
    topics: [cpp/virtual-functions]
    section: { en: 'Object lifetime', zh: '对象生命周期' }
    level: intermediate
    frequency: common
    tags: [construction, destruction, lifetime, pure-virtual]

  - id: virtual-pure-interface-design
    question: { en: 'How do pure virtual functions and virtual destructors shape an interface class?', zh: '纯虚函数与虚析构函数如何塑造接口类？' }
    answer:
      en: >-
        A pure virtual function declares a required operation with = 0 and keeps the class abstract until a concrete final overrider exists. It may still have an out-of-class definition that an override calls with explicit qualification. A pure virtual destructor also needs a definition because base destruction still runs. Destruction policy follows ownership: an interface deleted through Base* needs a public virtual destructor; an interface that forbids such deletion can use a protected non-virtual one. I keep data out of narrow interfaces, state preconditions explicitly, and test every implementation through the base contract.
      zh: >-
        纯虚函数以 = 0 声明必需操作，并让类保持抽象，直到出现具体最终覆盖实现。它仍可在类外提供定义，重写函数可通过显式限定调用该定义。纯虚析构函数也必须有定义，因为基类析构阶段仍会执行。析构策略取决于所有权：经 Base* 删除的接口需要公有虚析构；禁止这种删除时可用受保护非虚析构。我会让窄接口不保存数据，明确写出前置条件，并通过基类契约测试每个实现。
    topics: [cpp/virtual-functions]
    section: { en: 'Interface design', zh: '接口设计' }
    level: advanced
    frequency: occasional
    tags: [pure-virtual, abstract-class, virtual-destructor, interface]

  - id: c-memory-storage-lifetime-ownership
    question: { en: 'How do storage duration, object lifetime, and ownership differ in C?', zh: 'C 中的存储期、对象生命周期与所有权有什么区别？' }
    answer:
      en: >-
        Storage duration is a language category that says how long storage is reserved: static, thread, automatic, or allocated. Lifetime is the execution interval during which a particular object exists in that storage and may be accessed. Ownership is an API convention identifying who must end an allocated lifetime with the matching release operation. Copying a pointer creates an alias, not another allocation or another safe owner. I document whether each pointer is owning or borrowed, carry its accessible length, and ensure no borrow crosses free or a successful realloc. “Stack versus heap” alone does not express those obligations.
      zh: >-
        存储期是语言规定的存储保留类别，包括静态、线程、自动和已分配存储期。生命周期表示某个具体对象在这段存储中存在并可被访问的执行区间。所有权则是 API 约定，用来确定谁必须通过配对释放操作结束已分配对象的生命周期。复制指针只会产生别名，不会产生新分配或新的安全所有者。我会说明每个指针是拥有还是借用，同时传递可访问长度，并确保借用不跨过 free 或成功的 realloc。「栈与堆」本身不足以表达这些责任。
    topics: [cpp/c-memory]
    section: { en: 'Memory model', zh: '内存模型' }
    level: intermediate
    frequency: common
    tags: [storage-duration, lifetime, ownership, borrowing]

  - id: c-memory-realloc-contract
    question: { en: 'What is the failure-safe way to use realloc?', zh: '怎样以失败安全的方式使用 realloc？' }
    answer:
      en: >-
        I first reject zero under the API's policy and prove the requested byte count cannot overflow size_t. I call realloc into a temporary pointer, leaving the owning pointer unchanged. A null result for a valid nonzero request means the old object and contents remain valid, so the caller can continue or free them. A non-null result is the only new base address; the old object's lifetime ended even if the address compares numerically equal. I then initialize added bytes and commit pointer, length, and capacity together. Every interior pointer is recomputed from the returned base.
      zh: >-
        我先按 API 策略拒绝零大小，并证明请求字节数不会使 size_t 溢出。随后用临时指针接收 realloc，保持拥有型指针不变。对有效非零请求返回 NULL 时，旧对象及其内容仍然有效，调用方可以继续使用或释放它。返回非空时，该结果是唯一的新基址；即使地址数值相同，旧对象的生命周期也已经结束。最后初始化新增字节，再一起提交指针、长度和容量，并从新基址重新计算所有内部指针。
    topics: [cpp/c-memory]
    section: { en: 'Allocation APIs', zh: '分配 API' }
    level: intermediate
    frequency: common
    tags: [realloc, failure-atomicity, dangling-pointer]

  - id: c-memory-allocation-size-proof
    question: { en: 'How do you prevent an allocation-size overflow in C?', zh: '怎样防止 C 的分配大小溢出？' }
    answer:
      en: >-
        The check must happen before multiplication because size_t arithmetic wraps before malloc sees the request. For count elements I reject count greater than SIZE_MAX divided by sizeof *pointer, then compute the product. Multidimensional sizes need one checked step per multiplication, with zero divisors handled by the API's empty-input policy. C23 calloc rejects a count-times-size product that would wrap, but it cannot enforce a business maximum. I still validate external counts and distinguish invalid size from allocation failure when callers need different recovery. A non-null result is never a substitute for this proof or for later bounds checks.
      zh: >-
        检查必须发生在乘法之前，因为 size_t 算术会先回绕，malloc 只能看到错误结果。分配 count 个元素时，我先拒绝大于 SIZE_MAX / sizeof *pointer 的 count，再计算乘积。多维大小需要逐次检查每个乘法，并按空输入策略处理零除数。C23 的 calloc 会拒绝元素数与大小乘积回绕，但无法执行业务上限。我仍会验证外部数量；调用方需要不同恢复方式时，还要区分大小非法与分配失败。非空结果不能替代这个证明或后续边界检查。
    topics: [cpp/c-memory]
    section: { en: 'Bounds and security', zh: '边界与安全' }
    level: advanced
    frequency: common
    tags: [size-t, integer-overflow, allocation-size-overflow]

  - id: c-memory-cleanup-review
    question: { en: 'How do you review cleanup in a C function that acquires several resources?', zh: '怎样审查一个获取多项资源的 C 函数的清理逻辑？' }
    answer:
      en: >-
        I list acquisitions in order and inspect every return, goto, and transfer point. At each exit, every resource still owned by the function must release exactly once, while resources never acquired must remain safe to ignore. Initializing handles to a documented empty state makes one reverse-order cleanup block practical because free accepts NULL. Ownership transfer needs an explicit commit point: before it, the function cleans up; after it, the recipient does. I then inject failure at each acquisition in turn and run the matrix under sanitizers. Fallible completion such as flush or commit should be reported separately from fallback release.
      zh: >-
        我会按顺序列出资源获取，并检查每个 return、goto 和所有权转移点。每个出口都必须恰好释放一次仍由当前函数拥有的资源，尚未取得的资源则应能安全忽略。先把句柄初始化为有文档的空状态，就能利用 free(NULL) 建立逆序统一清理块。所有权转移要有明确提交点：提交前由当前函数清理，提交后由接收方清理。随后让每次获取依次失败，并在 sanitizer 下运行整个矩阵。刷新或提交等可能失败的完成操作应与最终兜底释放分开报告。
    topics: [cpp/c-memory]
    section: { en: 'Failure handling', zh: '失败处理' }
    level: advanced
    frequency: occasional
    tags: [cleanup, ownership-transfer, fault-injection, sanitizer]

  - id: c-pointers-pointer-versus-pointee-const
    question: { en: 'How do const int * and int *const differ?', zh: 'const int * 与 int *const 有什么区别？' }
    answer:
      en: >-
        In const int *view, const qualifies the pointed-to int. I may assign view another address, but I may not modify the target through view. In int *const fixed, const qualifies the pointer object: fixed keeps one address, while *fixed remains writable. const int *const combines both restrictions. Adding pointee constness when converting int * to const int * is normally safe. Casting it away does not make an object defined as const writable; modifying that object still has undefined behavior. I read declarations outward from the variable name and review each indirection level separately.
      zh: >-
        在 const int *view 中，const 限定所指向的 int：view 可以改指向，但不能经 view 修改目标。在 int *const fixed 中，const 限定指针对象：fixed 必须保留原地址，*fixed 仍可写。const int *const 同时施加两项限制。把 int * 转换为 const int * 通常是安全的限定增加；强制去掉限定不会让实际定义为 const 的对象变得可写，修改它仍产生未定义行为。我会从变量名向外读声明，并分别审查每一层间接访问。
    topics: [cpp/c-pointers]
    section: { en: 'Language core', zh: '语言核心' }
    level: beginner
    frequency: common
    tags: [pointers, const, qualifiers, pointee]

  - id: c-pointers-arithmetic-range
    question: { en: 'When are pointer arithmetic, subtraction, and ordering valid in C?', zh: 'C 中的指针运算、相减和顺序比较何时有效？' }
    answer:
      en: >-
        Pointer addition and subtraction are defined around one array object. Starting from an element pointer, the result may designate another element or exactly one past the array; the one-past value is an end sentinel and cannot be dereferenced. Subtracting or ordering two pointers requires them to belong to that same array range. The difference is measured in elements, not bytes. Two separately declared objects do not become an array merely because their addresses are adjacent. I prefer half-open ranges, carry the end or count explicitly, and prove every dereference occurs before the one-past position.
      zh: >-
        指针加减围绕同一个数组对象定义。从元素指针出发，结果可以指向另一个元素或恰好指向数组尾后位置；尾后值只能作结束哨兵，不能解引用。两个指针相减或做顺序比较时，必须属于这个相同数组范围，所得差值以元素数而不是字节数计。两个独立声明的对象即使地址相邻，也不会因此组成数组。我优先使用半开区间，显式携带结束指针或数量，并证明每次解引用都发生在尾后位置之前。
    topics: [cpp/c-pointers]
    section: { en: 'Bounds and lifetime', zh: '边界与生命周期' }
    level: intermediate
    frequency: common
    tags: [pointer-arithmetic, one-past, bounds, arrays]

  - id: c-pointers-nonnull-validity
    question: { en: 'Why does a non-null check not prove that a C pointer is safe to dereference?', zh: '为什么非空检查不能证明 C 指针可以安全解引用？' }
    answer:
      en: >-
        Null is only one unusable pointer state. A non-null value can be uninitialized, one past an array, outside its range, misaligned for the target type, or dangling because the object was returned from a local scope, freed, or replaced by realloc. A cast can hide a type diagnostic but cannot restore those facts. Before dereferencing, I trace the pointer to a live object, prove the requested element lies in its accessible range, confirm the target type and mutability, and check any documented nullability rule. Sanitizers help test paths, but they do not establish the whole contract.
      zh: >-
        空值只是一种不可用状态。非空值仍可能未初始化、位于数组尾后或范围之外、没有满足目标类型的对齐要求，也可能因为局部作用域返回、free 或 realloc 替换而悬空。强制转换可以隐藏类型诊断，却不能恢复这些事实。解引用前，我会把指针追溯到仍存活的对象，证明所需元素落在可访问范围内，确认目标类型与可变性，并检查接口规定的可空规则。sanitizer 能帮助测试已执行路径，但不能证明完整契约。
    topics: [cpp/c-pointers]
    section: { en: 'Bounds and lifetime', zh: '边界与生命周期' }
    level: intermediate
    frequency: common
    tags: [null-pointer, dangling-pointer, alignment, sanitizers]

  - id: c-pointers-double-pointer-contract
    question: { en: 'When should a C API use a pointer-to-pointer output parameter?', zh: 'C API 应在何时使用二级指针输出形参？' }
    answer:
      en: >-
        A single T * lets a function modify a T object. To replace the T * value stored by the caller, the function needs access to that pointer object, commonly through T **out and an &pointer argument. The extra level does not by itself mean allocation or ownership transfer. The API must say whether the result is borrowed or owning, who releases it, and what happens to the old pointer. I prefer failure-atomic output: validate and prepare first, then assign *out once on success so failure preserves the caller’s old value and no partially initialized pointer escapes.
      zh: >-
        单个 T * 让函数修改 T 对象。函数若要替换调用方保存的 T * 值，就需要访问那个指针对象，常见形式是 T **out，调用处传入 &pointer。增加一层间接访问本身不代表发生分配或所有权转移；API 仍须说明结果是借用还是拥有、由谁释放，以及旧指针如何处理。我倾向于让输出具有失败原子性：先验证并准备完整结果，只在成功时一次写入 *out，使失败保留调用方旧值，也不泄露部分初始化的指针。
    topics: [cpp/c-pointers]
    section: { en: 'API design', zh: 'API 设计' }
    level: intermediate
    frequency: occasional
    tags: [double-pointer, output-parameter, ownership, failure-atomicity]
