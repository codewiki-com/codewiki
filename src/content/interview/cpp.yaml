track: cpp
items:
  - id: move-cast-versus-operation
    question: { en: 'What does std::move do, and when does a move actually happen?', zh: 'std::move 做了什么，真正的移动何时发生？' }
    answer:
      en: 'std::move is a cast that turns its argument into an xvalue while preserving its type qualifiers. It does not transfer a buffer or change the source by itself. A move happens only if the following initialization, assignment, or call selects an operation that takes an rvalue and that operation actually transfers state. If no usable move overload exists, a copy can still be selected. Also, a named rvalue-reference parameter is an lvalue expression, so a move constructor normally uses std::move on the source members it intends to transfer.'
      zh: 'std::move 是一次类型转换：它把参数表达成 xvalue，同时保留类型限定。它本身不会转移缓冲区，也不会修改源对象。只有后续初始化、赋值或函数调用选择了接收右值的操作，而且该操作确实转移状态时，移动才会发生。若没有可用的移动重载，代码仍可能选择复制。有名字的右值引用参数也是左值表达式，因此移动构造函数通常要对准备转移的源成员使用 std::move。'
    topics: [cpp/move-semantics]
    section: { en: 'Language core', zh: '语言核心' }
    level: intermediate
    frequency: common
    tags: [std-move, value-category]

  - id: moved-from-guarantees
    question: { en: 'What may code safely do with a moved-from object?', zh: '代码可以对移动后的对象安全地做什么？' }
    answer:
      en: 'For standard-library types, unless a component gives a stronger postcondition, the object is valid but its value is unspecified. It can be destroyed or assigned a new value, and operations without violated preconditions may be called. That does not make indexing a moved-from vector safe, because its size is unknown. A particular type can document a stronger state: a moved-from unique_ptr is empty. For custom types, the class must define and preserve its own invariant, especially when a pointer is paired with a size or ownership flag.'
      zh: '对于标准库类型，如果组件没有给出更强的后置条件，移动后的对象有效，但值未指定。它可以析构、重新赋值，也可以调用当前状态满足其前置条件的操作。这不表示可以安全索引移动后的 vector，因为它的大小未知。某些类型会规定更强状态，例如移动后的 unique_ptr 为空。自定义类型则必须定义并保持自己的不变量，尤其要同步处理指针、长度和所有权标志。'
    topics: [cpp/move-semantics]
    section: { en: 'Resource ownership', zh: '资源所有权' }
    level: intermediate
    frequency: common
    tags: [moved-from-state, invariants]

  - id: noexcept-relocation
    question: { en: 'Why does noexcept matter for a move constructor used by containers?', zh: '为什么容器使用的移动构造函数需要关注 noexcept？' }
    answer:
      en: 'During reallocation, a container may need to preserve its original elements if constructing the new storage fails. A non-throwing move provides a safe transfer path. If moving may throw and copying is available, facilities such as std::move_if_noexcept can select the const-reference path so the source stays unchanged on failure. If the type is move-only, the container may have to use the throwing move and offer a weaker guarantee for that operation. The noexcept annotation must be truthful; an escaping exception from a noexcept move calls std::terminate.'
      zh: '容器重分配时，如果新存储中的构造失败，可能需要保留原元素。不抛异常的移动提供了安全转移路径。若移动可能抛异常且复制可用，std::move_if_noexcept 等设施可以选择 const 引用路径，使失败时源对象保持不变。若类型只能移动，容器可能只能尝试会抛异常的移动，并为该操作提供较弱保证。noexcept 必须真实；异常若逃出 noexcept 移动操作，程序会调用 std::terminate。'
    topics: [cpp/move-semantics]
    section: { en: 'Standard library', zh: '标准库' }
    level: advanced
    frequency: occasional
    tags: [noexcept, exception-safety]

  - id: rule-zero-versus-five
    question: { en: 'How do the Rule of Zero and Rule of Five guide a movable class design?', zh: '零法则和五法则如何指导可移动类的设计？' }
    answer:
      en: 'The Rule of Zero is the preferred design: put ownership in members such as vector, string, or unique_ptr and let their special members compose. This removes duplicated lifetime code and usually gives correct conditional noexcept behavior. The Rule of Five is a warning for classes that customize destruction, copying, or moving: treat the destructor, copy constructor, copy assignment, move constructor, and move assignment as one semantic set. Decide explicitly whether each is defaulted, deleted, or custom, then test source and target invariants, self-assignment, base classes, and destruction.'
      zh: '零法则是首选设计：把所有权放进 vector、string 或 unique_ptr 等成员，让它们的特殊成员函数组合出类的行为。这样能减少重复的生命周期代码，通常也能得到正确的条件 noexcept。五法则则提醒已经自定义析构、复制或移动的类，要把析构、复制构造、复制赋值、移动构造和移动赋值视为一组语义。应明确决定每项是默认、删除还是自定义，并测试源与目标不变量、自赋值、基类和析构。'
    topics: [cpp/move-semantics]
    section: { en: 'Class design', zh: '类设计' }
    level: intermediate
    frequency: common
    tags: [rule-of-zero, rule-of-five]

  - id: array-versus-pointer
    question: { en: 'How does a built-in array differ from a pointer, and when does it convert to one?', zh: '内置数组与指针有什么区别，数组何时会转换成指针？' }
    answer:
      en: 'A built-in array is an object containing a fixed number of contiguous elements, and its extent is part of its type. A pointer is a separate scalar object containing an address; its type carries no element count. An array lvalue converts to a pointer to its first element in most value-taking expressions, including ordinary by-value auto deduction. The conversion does not occur for operations such as sizeof, unary address-of on the array, decltype, or binding an array reference. After conversion, the original extent cannot be recovered from the pointer alone.'
      zh: '内置数组是包含固定数量连续元素的对象，边界属于其类型。指针则是保存地址的独立标量对象，类型中没有元素数量。数组左值在多数取值表达式中会转换为首元素指针，普通的按值 auto 推导也会触发转换。sizeof、对数组使用一元取地址、decltype 以及绑定数组引用时不会发生这种转换。转换完成后，仅凭指针无法恢复原来的数组边界，接口必须另行传递数量或终止条件。'
    topics: [cpp/c-arrays]
    section: { en: 'Language core', zh: '语言核心' }
    level: intermediate
    frequency: common
    tags: [arrays, pointers, array-decay]

  - id: preserve-array-extent-parameter
    question: { en: 'How can a C++ function receive an array without losing its extent?', zh: 'C++ 函数如何接收数组而不丢失边界？' }
    answer:
      en: 'Array-looking parameters such as int values[8] are adjusted to int*, so that spelling does not preserve or enforce eight elements. A reference parameter such as const int (&values)[8] preserves an exact extent. A template const T (&values)[N] can deduce both element type and extent. For most application interfaces, std::span<const T> is more flexible because it carries a runtime count and accepts arrays and other contiguous ranges. Use std::span<T, N> when the fixed extent is itself a contract, while remembering that every span remains non-owning.'
      zh: 'int values[8] 这样的数组形参会调整成 int*，因此既不保留也不强制 8 个元素。const int (&values)[8] 这样的引用形参能够保留精确边界；模板 const T (&values)[N] 还能推导元素类型和边界。大多数应用接口使用 std::span<const T> 更灵活，因为它携带运行时数量，也能接收其他连续范围。固定边界本身就是契约时可用 std::span<T, N>，但任何 span 都不拥有底层元素。'
    topics: [cpp/c-arrays]
    section: { en: 'API design', zh: 'API 设计' }
    level: intermediate
    frequency: common
    tags: [array-reference, span, bounds]

  - id: multidimensional-array-pointer
    question: { en: 'Why can an int[Rows][Cols] array not be passed as int**?', zh: '为什么 int[Rows][Cols] 数组不能按 int** 传递？' }
    answer:
      en: 'A two-dimensional built-in array is an array of row arrays. After the outer array converts, the result points to one complete row, so int grid[2][3] becomes int (*)[3]. The column extent is needed for pointer arithmetic to reach the next row. By contrast, int** points to an int* object and commonly represents a separate table of row pointers. The built-in array contains element rows directly and has no row-pointer objects. A cast cannot create that missing indirection; dereferencing through int** would interpret integer storage as pointers and produces undefined behavior.'
      zh: '二维内置数组是“行数组的数组”。外层数组转换后，结果指向一整行，因此 int grid[2][3] 会变成 int (*)[3]；指针运算需要列边界才能找到下一行。int** 则指向一个 int* 对象，通常表示另一张独立的行指针表。二维内置数组直接包含各行元素，并不存在这些行指针对象。强制类型转换不会创造缺失的间接层，按 int** 解引用会把整数存储误解为指针，从而产生未定义行为。'
    topics: [cpp/c-arrays]
    section: { en: 'Memory layout', zh: '内存布局' }
    level: intermediate
    frequency: occasional
    tags: [multidimensional-arrays, pointer-to-array, row-major]

  - id: choose-array-container-view
    question: { en: 'When should code use a built-in array, std::array, std::span, or std::vector?', zh: '代码应在何时选择内置数组、std::array、std::span 或 std::vector？' }
    answer:
      en: 'Use a built-in array when language-level layout or C interoperability requires it, or for very local fixed storage where it never crosses an interface. Prefer std::array<T, N> when fixed-size storage needs ordinary value semantics such as assignment and return by value. Use std::span<T> or std::span<const T> to borrow an existing contiguous sequence while carrying its length; a span does not extend lifetime. Use std::vector<T> when the length is chosen at runtime or changes. The decision starts with ownership and bounds, not with which bracket syntax looks shortest.'
      zh: '语言级布局或 C 互操作明确要求时，可以使用内置数组；它也适合完全不跨接口的局部定长存储。固定长度还需要赋值、按值返回等普通值语义时，优先使用 std::array<T, N>。借用已有连续序列并携带长度时使用 std::span<T> 或 std::span<const T>，但 span 不会延长生命周期。长度在运行时确定或发生变化时使用 std::vector<T>。选择应先回答所有权和边界问题，而不是比较哪种方括号写法最短。'
    topics: [cpp/c-arrays]
    section: { en: 'Library design', zh: '库设计' }
    level: beginner
    frequency: common
    tags: [std-array, span, vector, ownership]

  - id: c-declaration-definition-linking
    question: { en: 'How do a declaration, a definition, and linking differ in C?', zh: 'C 中的声明、定义和链接有什么区别？' }
    answer:
      en: 'A declaration introduces a name and its type so the compiler can check later uses. A definition is the declaration that also supplies a function body or storage for an object. A header normally carries declarations shared by translation units, while one source file supplies each required external definition. Compilation checks each translation unit separately. Linking then resolves external references between object files and libraries. Compatible repeated declarations are expected; missing definitions cause unresolved references, while multiple external definitions of the same object or function violate the program contract and commonly produce a linker error.'
      zh: '声明引入名称及其类型，让编译器能够检查后续使用。定义还会提供函数体，或为对象提供存储。头文件通常保存多个翻译单元共享的声明，而某个源文件为每个需要的外部实体提供定义。编译阶段分别检查各翻译单元，链接阶段再解析目标文件和库之间的外部引用。兼容声明可以重复；缺少定义通常导致未解析引用，同一对象或函数出现多个外部定义则违反程序约束，并且常被链接器报错。'
    topics: [cpp/c-basics]
    section: { en: 'Compilation model', zh: '编译模型' }
    level: beginner
    frequency: common
    tags: [declarations, definitions, linkage]

  - id: c-usual-arithmetic-conversions
    question: { en: 'Why can comparing a negative int with size_t give an unexpected result?', zh: '为什么负 int 与 size_t 比较可能得到意外结果？' }
    answer:
      en: 'size_t is an unsigned integer type. Before a mixed arithmetic comparison, integer promotions and the usual arithmetic conversions choose a common type. Depending on the types and their ranks, the negative int can convert to an unsigned type, where it becomes a large value modulo that type’s range. The comparison then operates on those converted values, not on the mathematical integers suggested by the source. Keep one signedness within a value domain, check a signed error result before conversion, and prove range validity before converting it to size_t.'
      zh: 'size_t 是无符号整数类型。混合算术比较开始前，整数提升和通常算术转换会选出共同类型。根据类型及其转换等级，负 int 可能被转换为无符号类型，并按该类型的范围变成一个很大的值。比较针对转换后的值，而不是源码看起来表达的数学整数。同一取值域应尽量保持一致的符号性；先检查有符号错误结果，再转换有效值，并在转换成 size_t 前证明其范围有效。'
    topics: [cpp/c-basics]
    section: { en: 'Types and conversions', zh: '类型与转换' }
    level: intermediate
    frequency: common
    tags: [integer-promotion, signedness, size-t]

  - id: c-undefined-behavior-optimization
    question: { en: 'What is undefined behavior, and why can optimization change how a bug appears?', zh: '什么是未定义行为，为什么优化会改变缺陷的表现？' }
    answer:
      en: 'Undefined behavior is behavior for which the C standard imposes no requirements. Examples include signed integer overflow, out-of-bounds access, and conflicting unsequenced modifications. It is not a portable error value or a guaranteed crash. An optimizer may assume that a valid execution never reaches undefined behavior and simplify code using that premise, so a defect can disappear, move, or produce a different result under optimization. Prevent it with explicit contracts and bounds, then use strict warnings, focused tests, AddressSanitizer, and UndefinedBehaviorSanitizer to catch violations on exercised paths.'
      zh: '未定义行为是 C 标准不对结果施加任何要求的行为，例如有符号整数溢出、越界访问，以及彼此无序且冲突的修改。它不是可移植的错误值，也不保证程序崩溃。优化器可以假定合法执行不会到达未定义行为，并据此简化代码，所以缺陷在优化后可能消失、换位置或产生不同结果。应先用明确契约和边界设计避免它，再通过严格警告、针对性测试、AddressSanitizer 和 UndefinedBehaviorSanitizer 检查实际执行路径中的违规。'
    topics: [cpp/c-basics]
    section: { en: 'Correctness', zh: '正确性' }
    level: intermediate
    frequency: common
    tags: [undefined-behavior, optimization, sanitizers]

  - id: c-pass-by-value-pointers
    question: { en: 'Does C pass arguments by reference when a function receives a pointer?', zh: '函数接收指针时，C 是按引用传参吗？' }
    answer:
      en: 'No. C always passes each argument by value. For an int parameter, the callee receives a copy of the integer; for an int* parameter, it receives a copy of the pointer value. Dereferencing that copied pointer can modify the caller’s pointed-to object, which creates reference-like behavior, but assigning a different address to the local pointer does not change the caller’s pointer. To replace the caller’s pointer, pass its address as a pointer to pointer. The interface must also define whether null is accepted and how long the pointed-to object remains valid.'
      zh: '不是。C 始终按值传递每个实参。int 形参接收整数副本，int* 形参接收指针值的副本。函数解引用这个指针副本时，可以修改调用方被指向的对象，于是表现得类似按引用；但给局部指针改存另一个地址，不会改变调用方的指针。若要替换调用方的指针，需要把其地址作为二级指针传入。接口还必须说明是否允许空指针，以及被指向对象需要保持有效多久。'
    topics: [cpp/c-basics]
    section: { en: 'Functions', zh: '函数' }
    level: beginner
    frequency: common
    tags: [pass-by-value, pointers, parameters]

  - id: c-file-io-eof-versus-error
    question: { en: 'How should a C input loop distinguish end of file from an I/O error, and why does fgetc return int?', zh: 'C 输入循环应如何区分文件结束与 I/O 错误，为什么 fgetc 返回 int？' }
    answer:
      en: 'The read operation must drive the loop: test the return from fgetc, fgets, or fread instead of checking feof first. After EOF, NULL, or a short fread count, feof reports that no more input was available, while ferror reports an I/O failure. These indicators describe a read that already happened. fgetc returns int so it can represent every unsigned-char value plus the distinct EOF sentinel. Store its result in int, compare it with EOF, and only then convert or pass the successful character value onward.'
      zh: '循环必须由读取操作的返回值驱动：检查 fgetc、fgets 或 fread 的结果，而不是预先检查 feof。读取返回 EOF、NULL 或短计数后，feof 表示没有更多输入，ferror 表示发生 I/O 错误；这些指示器描述的是已经发生的读取。fgetc 返回 int，才能同时表示所有 unsigned char 值和独立的 EOF 哨兵。应先用 int 保存结果并与 EOF 比较，确认成功后再转换或传递字符值。'
    topics: [cpp/c-file-io]
    section: { en: 'Standard I/O', zh: '标准 I/O' }
    level: intermediate
    frequency: common
    tags: [stdio, eof, error-handling]

  - id: c-file-io-short-counts
    question: { en: 'What do fread and fwrite return, and how should code handle a short count?', zh: 'fread 和 fwrite 返回什么，代码应如何处理短计数？' }
    answer:
      en: 'Both functions return the number of complete elements transferred, not the number of bytes, unless the element size argument is one. A short fread count can mean ordinary end of file or a read error, so code processes the elements received and then queries feof and ferror when the count is below the request. A short fwrite count means the output is incomplete. A byte-oriented write helper advances its pointer by the accepted count and handles the remainder or fails explicitly. Final fflush and fclose errors must still affect the overall result.'
      zh: '两个函数都返回完整传输的元素数；只有元素大小参数为 1 时，该值才直接等于字节数。fread 的短计数可能表示正常到达文件末尾，也可能表示读取错误，因此代码先处理已经取得的元素，再在数量不足时查询 feof 和 ferror。fwrite 的短计数表示输出不完整。面向字节的写入辅助函数应按已接受数量推进指针，继续处理剩余部分或明确失败。最终 fflush 和 fclose 的错误仍必须影响整体结果。'
    topics: [cpp/c-file-io]
    section: { en: 'Standard I/O', zh: '标准 I/O' }
    level: intermediate
    frequency: common
    tags: [fread, fwrite, short-write]

  - id: c-file-io-update-stream-switching
    question: { en: 'What sequencing rules apply when switching between input and output on an update stream?', zh: '更新流在输入与输出之间切换时要遵守哪些顺序规则？' }
    answer:
      en: 'An update mode such as r+, w+, or a+ permits both directions, but it does not make arbitrary switching valid. Before input directly follows output, code must successfully call fflush or a file-positioning function. Before output directly follows input, it normally needs a successful positioning call; the exception is when the input operation encountered end of file. An explicit checked fseek at a phase boundary makes both the intended position and direction transition visible. When phases are independent, closing and reopening with narrower modes can produce a simpler contract.'
      zh: 'r+、w+ 或 a+ 等更新模式允许两个方向，但不代表可以任意切换。输出后直接开始输入前，代码必须成功调用 fflush 或文件定位函数；输入后直接开始输出前，通常需要成功的定位调用，例外是前一次输入操作已经遇到文件结束。在阶段边界显式检查 fseek，能同时表达预期位置和方向转换。若两个阶段彼此独立，关闭后用更窄的模式重新打开，往往可以得到更简单的契约。'
    topics: [cpp/c-file-io]
    section: { en: 'Stream state', zh: '流状态' }
    level: advanced
    frequency: occasional
    tags: [update-stream, fseek, fflush]

  - id: c-file-io-raw-struct-format
    question: { en: 'Why is writing a structure with fwrite usually not a portable file format?', zh: '为什么用 fwrite 直接写结构体通常不是可移植文件格式？' }
    answer:
      en: 'fwrite writes the structure’s object representation for the current implementation. That representation can contain padding bytes, native byte order, implementation-specific type widths, and floating-point encodings. Padding can also contain indeterminate process data that should not be disclosed. A stable format defines a magic value, version, field widths, byte order, length bounds, and validation rules independently of the in-memory type. Encode and decode each field, reject truncated or inconsistent input before allocation, and use raw layouts only for deliberately local files constrained to one ABI and controlled lifetime.'
      zh: 'fwrite 写出的是当前实现中的结构体对象表示，其中可能包含填充字节、本机字节序、实现相关的类型宽度和浮点编码。填充还可能带出不应泄露的进程旧数据。稳定格式应独立于内存类型，明确规定魔数、版本、字段宽度、字节序、长度上限和验证规则。代码要逐字段编码与解码，并在分配内存前拒绝截断或自相矛盾的输入。只有文件明确限制在同一 ABI 和受控生命周期内时，才考虑原始布局。'
    topics: [cpp/c-file-io]
    section: { en: 'Data formats', zh: '数据格式' }
    level: intermediate
    frequency: common
    tags: [binary-format, object-representation, portability]

  - id: c-function-pointer-declaration
    question: { en: 'How do you read int (*handler)(int, int), and why are the parentheses necessary?', zh: '如何理解 int (*handler)(int, int)，其中的括号为什么不可省略？' }
    answer:
      en: 'Start at handler and read outward. The leading star, grouped by parentheses, makes handler a pointer. The following parameter list says the pointed-to entity is a function taking two int arguments, and the initial int is that function’s return type. Function and array postfix operators bind more tightly than prefix star. Without the parentheses, int *handler(int, int) declares handler as a function that takes two ints and returns int*. A typedef can name either the pointer type or the underlying function type when a public signature becomes hard to scan.'
      zh: '从 handler 开始向外读。括号内的星号先与 handler 组合，所以 handler 是指针；随后的参数列表说明它指向接收两个 int 的函数，最前面的 int 则是函数返回类型。函数与数组后缀比前缀星号绑定得更紧，因此括号不能省略。若写成 int *handler(int, int)，handler 就成了一个接收两个 int、返回 int* 的函数。公共签名太长时，可以用 typedef 给指针类型或底层函数类型命名。'
    topics: [cpp/c-function-pointers]
    section: { en: 'Language core', zh: '语言核心' }
    level: beginner
    frequency: common
    tags: [function-pointers, declarations]

  - id: c-function-pointer-compatibility
    question: { en: 'Why does casting an incompatible function pointer not make the call safe?', zh: '为什么强转不兼容的函数指针不能让调用变得安全？' }
    answer:
      en: 'A cast changes the pointer expression’s static type, but it does not change the target function’s actual parameter and return conventions. At the call, C requires the function type used by the call to be compatible with the definition of the target. Otherwise behavior is undefined: arguments or results may be interpreted incorrectly, and a successful build proves nothing. C does allow conversion between function-pointer types and guarantees equality after converting back to the original type. That round-trip guarantee is about preserving the pointer value, not permission to call through the intermediate type.'
      zh: '强制转换只改变指针表达式的静态类型，不会改变目标函数实际接收参数和返回结果的约定。调用发生时，C 要求调用所用函数类型与目标函数定义兼容，否则行为未定义；参数或结果可能被错误解释，成功编译也不能证明安全。C 确实允许不同函数指针类型之间转换，并保证转回原类型后与原值相等。但这个往返保证只说明指针值能恢复，不代表可以通过中间类型调用。正确做法是修改原型或编写真正匹配签名的适配器。'
    topics: [cpp/c-function-pointers]
    section: { en: 'Type safety', zh: '类型安全' }
    level: intermediate
    frequency: common
    tags: [function-types, casts, undefined-behavior]

  - id: c-callback-context-lifetime
    question: { en: 'What contract must accompany a callback that takes a void* context?', zh: '接收 void* 上下文的回调必须附带哪些契约？' }
    answer:
      en: 'The signature alone does not say what object context points to, who owns it, or how long it remains valid. The API must state whether invocation is synchronous or retained, when unregistration completes, which thread calls, whether calls can overlap or reenter, and who releases storage. The callback must convert context back to the same object-pointer type that originally produced it. A stack address works for a synchronous traversal but dangles if retained beyond the call. For persistent registration, the owner must keep storage alive until no in-progress or future callback can access it.'
      zh: '签名本身不会说明 context 指向什么对象、由谁拥有，也不会说明它保持有效多久。API 必须规定调用是同步还是会被保留、注销何时完成、由哪个线程调用、调用能否重叠或重入，以及谁释放存储。回调必须把 context 转回最初产生该指针的同一种对象指针类型。栈地址可用于同步遍历，但若被保留到调用结束后就会悬空。长期注册时，拥有者必须让存储存活到所有进行中和未来回调都不再访问它。'
    topics: [cpp/c-function-pointers]
    section: { en: 'Callbacks and ownership', zh: '回调与所有权' }
    level: intermediate
    frequency: common
    tags: [callbacks, context, lifetime]

  - id: c-qsort-comparator-contract
    question: { en: 'What makes a correct qsort comparator, and why is subtraction risky?', zh: '正确的 qsort 比较函数要满足什么条件，为什么直接相减有风险？' }
    answer:
      en: 'qsort passes pointers to two elements as const void*. The comparator converts them to pointers to the actual element type and returns a negative value, zero, or a positive value for less than, equivalent, or greater than. It must provide a consistent ordering and should not mutate elements or depend on invocation order. Returning left->key - right->key is risky because signed integer overflow is undefined behavior. Build the sign from relational comparisons or explicit branches instead. Equal results do not imply stable output order, because qsort does not promise stability.'
      zh: 'qsort 把两个元素的地址作为 const void* 传给比较函数。比较函数把它们转换为实际元素类型的指针，并用负数、0 或正数表示小于、等价或大于。它必须给出一致顺序，不应修改元素，也不能依赖调用顺序。直接返回 left->key - right->key 有风险，因为有符号整数溢出属于未定义行为。应使用两个关系比较组成符号，或写明确分支。比较结果相等也不表示输出保持原相对顺序，因为 qsort 不保证稳定性。'
    topics: [cpp/c-function-pointers]
    section: { en: 'Standard library', zh: '标准库' }
    level: intermediate
    frequency: occasional
    tags: [qsort, comparator, ordering]
