track: go
items:
  - id: defer-evaluation-and-order
    question: { en: 'When are a deferred call and its arguments evaluated, and in what order do deferred calls run?', zh: '延迟调用及其实参何时求值，多个延迟调用按什么顺序执行？' }
    answer:
      en: 'Executing a defer statement immediately evaluates and saves the function value, method receiver, and arguments. The call itself waits until the surrounding function exits. Calls registered by that function run in reverse registration order, including on a panic path. A deferred closure is slightly different from passing a value as an argument: its body reads captured variables when it runs. On a normal return, result parameters are assigned before deferred calls execute, so a deferred closure can inspect or modify named results.'
      zh: '执行 defer 语句时，函数值、方法接收者和实参都会立即求值并保存，真正的调用则等到外围函数退出。该函数注册的延迟调用按注册顺序的逆序执行，panic 路径也一样。延迟闭包与直接传值略有不同：闭包体在实际运行时读取捕获的变量。正常返回时，结果参数先完成赋值，随后才执行延迟调用，因此延迟闭包可以检查或修改命名结果。'
    topics: [go/defer-panic-recover]
    level: beginner
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [defer, evaluation, lifo]

  - id: panic-versus-error
    question: { en: 'When should Go code return an error, and when is panic appropriate?', zh: 'Go 代码何时应返回 error，何时适合 panic？' }
    answer:
      en: 'Return an error for failures the caller can reasonably expect and handle, such as invalid input, a missing file, or a network timeout. Panic is for a broken assumption that makes the current control flow unsafe, including runtime faults and deliberately enforced internal invariants. A Must-style helper may panic when its name and contract make that behavior explicit. Even if a package uses a private panic internally to unwind recursive code, its public API should normally convert that known value to an error and re-panic unexpected values.'
      zh: '对于调用者可以合理预期并处理的失败，应返回 error，例如无效输入、文件不存在或网络超时。panic 适合表示已破坏的假设，使当前控制流无法安全继续，包括运行时故障和程序主动检查的内部不变量。名称和契约明确说明行为的 Must 风格辅助函数也可以 panic。即使包内部用私有 panic 展开递归代码，公开 API 通常也应把已知值转成 error，并让未知值继续 panic。'
    topics: [go/defer-panic-recover]
    level: intermediate
    section: { en: 'Error handling', zh: '错误处理' }
    frequency: common
    tags: [panic, error, api-design]

  - id: recover-conditions-and-control-flow
    question: { en: 'What conditions make recover effective, and where does execution continue afterward?', zh: 'recover 生效需要哪些条件，恢复后从哪里继续执行？' }
    answer:
      en: 'Recover is effective only when called directly by a function that is currently running as a deferred call, while the same goroutine is panicking. An ordinary helper call, a parent goroutine, or a deferred function running on a normal return sees nil. Successful recovery stops unwinding, but it does not resume at the panic site. The intermediate frames have been discarded. Remaining deferred calls in the function that installed the boundary run in reverse order, that function returns, and execution continues in its caller.'
      zh: 'recover 只有在同一个 goroutine 正在 panicking，而且当前作为延迟调用运行的函数直接调用它时才生效。普通辅助函数、父 goroutine，或正常返回路径上的延迟函数只会得到 nil。成功恢复会停止展开，但不会回到 panic 位置继续；中间栈帧已经丢弃。安装边界的函数中尚未执行的延迟调用继续按逆序运行，随后该函数返回，控制流从它的调用者继续。'
    topics: [go/defer-panic-recover]
    level: intermediate
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [recover, panic-unwinding, control-flow]

  - id: production-recovery-boundary
    question: { en: 'What should a production recovery boundary do besides calling recover?', zh: '生产环境的恢复边界除了调用 recover，还应做什么？' }
    answer:
      en: 'A recovery boundary must define the disposable unit of work and decide whether shared state is still trustworthy. It should capture the panic value and stack, attach a request or task identifier, report failure to the owner, and release resources without depending on damaged state. For goroutine isolation, the boundary belongs inside the new goroutine and must signal completion exactly once. It also needs a policy for unknown panic values: many boundaries should re-panic rather than disguise a programming defect as a routine error.'
      zh: '恢复边界必须定义可丢弃的工作单元，并判断共享状态是否仍然可信。它应记录 panic 值和栈，附上请求或任务标识，向所有者报告失败，并在不依赖损坏状态的前提下释放资源。要隔离 goroutine，边界必须位于新 goroutine 内，而且只能发出一次完成信号。它还需要规定如何处理未知 panic 值：许多边界应再次 panic，而不是把编程缺陷伪装成普通错误。'
    topics: [go/defer-panic-recover]
    level: advanced
    section: { en: 'Production boundaries', zh: '生产边界' }
    frequency: occasional
    tags: [recover, observability, goroutine]

  - id: error-contract-selection
    question: { en: 'How do you choose between an opaque error, a sentinel, a custom error type, and a predicate?', zh: '怎样在不透明错误、哨兵错误、自定义错误类型和判断函数之间选择？' }
    answer:
      en: 'Start with the weakest contract that supports a real caller decision. A non-nil error is enough when callers only stop or report. Use a sentinel for a small stable category that callers test with errors.Is. Use a custom type when they need documented fields through errors.As. A predicate can expose classification while hiding representation. Every exported value, type, field, or matching behavior becomes API surface. Avoid exposing a dependency error unless callers should rely on it after wrappers and future implementation changes.'
      zh: '从足以支持实际调用决策的最弱契约开始。如果调用方只需停止或报告，非 nil 错误已经足够。对于调用方需要通过 errors.Is 检查的少量稳定类别，使用哨兵错误；需要通过 errors.As 读取文档字段时，使用自定义类型。判断函数可以公开分类，同时隐藏具体表示。每个导出的值、类型、字段或匹配行为都会成为 API。除非调用方在包装和未来实现变更后仍应依赖某个依赖错误，否则不要公开它。'
    topics: [go/error-handling]
    level: intermediate
    section: { en: 'Error handling', zh: '错误处理' }
    frequency: common
    tags: [error-contract, sentinel, custom-error]

  - id: errors-is-versus-as
    question: { en: 'What is the difference between errors.Is and errors.As, and why are they preferable to equality or type assertions?', zh: 'errors.Is 与 errors.As 有什么区别，为什么它们优于直接相等比较或类型断言？' }
    answer:
      en: 'errors.Is answers whether an error tree contains a target value or matches a target through a custom Is method. errors.As finds a value assignable to a requested error type and stores it in the supplied target slot. Both traverse wrappers and joined errors. Direct equality and a type assertion inspect only the outer error, so they fail after contextual wrapping. Use Is when control flow depends on a category and As when code needs structured fields. Neither requires parsing the human-readable Error string.'
      zh: 'errors.Is 用来判断错误树是否包含目标值，或是否通过自定义 Is 方法匹配目标。errors.As 会查找能赋给指定错误类型的值，并把它保存到传入的目标槽位中。两者都会遍历包装错误和合并错误。直接相等比较与类型断言只检查最外层错误，因此添加上下文包装后就会失效。控制流依赖错误类别时使用 Is，需要读取结构化字段时使用 As。两者都不需要解析供人阅读的 Error 字符串。'
    topics: [go/error-handling]
    level: intermediate
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [errors-is, errors-as, wrapping]

  - id: typed-nil-error-interface
    question: { en: 'How can a nil pointer become a non-nil error interface, and how do you prevent that bug?', zh: 'nil 指针怎样会变成非 nil 的 error 接口，应该如何避免这个问题？' }
    answer:
      en: 'An interface equals nil only when it has neither a dynamic type nor a dynamic value. Converting a nil *MyError to error records *MyError as the dynamic type, so the interface is non-nil even though its stored pointer is nil. This often happens when a function returns a pointer accumulator directly on its success path. Return a literal nil on success and create the concrete error only for failures. Add a success-path test that checks err == nil; failure-only tests do not expose the bug.'
      zh: '接口只有在动态类型和动态值都不存在时才等于 nil。把 nil 的 *MyError 转换成 error 后，接口会把 *MyError 记录为动态类型，所以即使其中保存的指针是 nil，接口仍然非 nil。函数在成功路径直接返回指针形式的错误累积器时，经常出现这个问题。成功时应返回字面值 nil，只在失败时创建具体错误。还要添加断言 err == nil 的成功路径测试；只测试失败路径发现不了这个缺陷。'
    topics: [go/error-handling]
    level: intermediate
    section: { en: 'Language core', zh: '语言核心' }
    frequency: occasional
    tags: [interface, typed-nil, testing]

  - id: error-reporting-boundary
    question: { en: 'Where should a Go program log an error, and what should intermediate layers do instead?', zh: 'Go 程序应在哪里记录错误，中间层又该怎样处理？' }
    answer:
      en: 'Log at the boundary that owns the outcome, such as an HTTP request, command, queue worker, or process entry point. That layer knows the request identifier, severity, response, and redaction policy. Intermediate libraries should usually add concise operation context and return the error with its intended chain intact. Logging and returning at every layer produces duplicate events and may expose credentials or payloads through ad hoc messages. A layer may consume an error without returning it only when it completes the handling decision, for example by applying a documented fallback.'
      zh: '应在拥有处理结果的边界记录错误，例如 HTTP 请求、命令、队列 worker 或进程入口。该层知道请求标识、严重程度、响应方式和脱敏策略。中间库通常只应添加简洁的操作上下文，并在保留预期错误链的前提下返回错误。每一层都记录后再返回，会产生重复事件，还可能通过临时消息泄露凭据或载荷。只有真正完成处理决策时，一层才可以消费错误而不再返回，例如采用有文档说明的回退方案。'
    topics: [go/error-handling]
    level: intermediate
    section: { en: 'Production boundaries', zh: '生产边界' }
    frequency: common
    tags: [logging, wrapping, observability]

  - id: percent-w-error-contract
    question: { en: 'How does `%w` differ from `%v` in fmt.Errorf, and why is that an API decision?', zh: 'fmt.Errorf 中的 `%w` 与 `%v` 有什么区别，为什么这是一项 API 决策？' }
    answer:
      en: 'Both verbs include the operand in the formatted message, but only `%w` makes the returned error unwrap to that operand. That lets errors.Is and errors.As discover the cause through later wrappers. Once an exported function wraps a sentinel or concrete dependency error, callers can build control flow around that match, so changing the wrapped cause may break them. Use `%w` for causes you intend to expose. Use deliberate translation when callers should depend on your domain error instead of a database, filesystem, or SDK representation.'
      zh: '`%v` 和 `%w` 都会把操作数写入格式化消息，但只有 `%w` 会让返回错误解包到该操作数，因此 errors.Is 和 errors.As 能穿过后续包装找到原因。导出函数一旦包装某个哨兵错误或依赖库的具体错误，调用方就可能围绕该匹配编写控制流，之后更换原因便可能破坏兼容性。希望公开原因时使用 `%w`；如果调用方应该依赖领域错误，而不是数据库、文件系统或 SDK 的表示，就应有意转换错误。'
    topics: [go/error-wrapping]
    level: intermediate
    section: { en: 'Error handling', zh: '错误处理' }
    frequency: common
    tags: [wrapping, api-contract, fmt-errorf]

  - id: error-tree-traversal-order
    question: { en: 'How do errors.Is and errors.As traverse wrappers and joined errors?', zh: 'errors.Is 和 errors.As 怎样遍历包装错误与合并错误？' }
    answer:
      en: 'They treat the supplied error as the root of a tree and walk it in pre-order, depth-first order. Each function examines the current error before visiting children returned by Unwrap() error or Unwrap() []error. Is checks equality and a shallow custom Is method; As checks assignability and a custom As method. This matters when several nodes could match: the outer or earlier branch wins. A custom Is method should not traverse children itself, because the standard algorithm already does that and would repeat the work after a miss.'
      zh: '它们把传入错误视为树根，并按前序深度优先顺序遍历。两个函数都会先检查当前错误，再访问 Unwrap() error 或 Unwrap() []error 返回的子节点。Is 检查相等性和浅层自定义 Is 方法；As 检查可赋值性和自定义 As 方法。多个节点都能匹配时，外层或更早的分支先胜出。自定义 Is 不应自行遍历子节点，因为标准算法已经负责遍历，匹配失败后再做一次只会重复工作。'
    topics: [go/error-wrapping]
    level: advanced
    section: { en: 'Language core', zh: '语言核心' }
    frequency: occasional
    tags: [errors-is, errors-as, traversal]

  - id: joined-errors-and-unwrap
    question: { en: 'What does errors.Join return, and why does errors.Unwrap not enumerate its children?', zh: 'errors.Join 返回什么，为什么 errors.Unwrap 不会枚举它的子错误？' }
    answer:
      en: 'errors.Join discards nil operands and returns nil if none remain. Otherwise it returns one error whose Unwrap() []error method exposes every remaining child, so errors.Is and errors.As can match any branch. The convenience function errors.Unwrap predates multi-error trees and calls only Unwrap() error; it returns nil for a joined value. Code that only needs classification should call Is or As. Diagnostic tooling that truly needs every node must type-check both unwrap interfaces and recurse without treating display order as business priority.'
      zh: 'errors.Join 会丢弃 nil 操作数；没有错误剩余时返回 nil，否则返回一个通过 Unwrap() []error 公开全部子错误的值，因此 errors.Is 和 errors.As 可以匹配任意分支。便利函数 errors.Unwrap 早于多错误树，只会调用 Unwrap() error，所以对合并值返回 nil。只需分类的代码应调用 Is 或 As。确实需要全部节点的诊断工具必须分别判断两种解包接口并递归遍历，而且不能把显示顺序当作业务优先级。'
    topics: [go/error-wrapping]
    level: intermediate
    section: { en: 'Error handling', zh: '错误处理' }
    frequency: occasional
    tags: [errors-join, unwrap, error-tree]

  - id: test-wrapping-contract
    question: { en: 'How would you test that refactoring has not broken a Go error-wrapping contract?', zh: '怎样测试重构没有破坏 Go 的错误包装契约？' }
    answer:
      en: 'Test from the exported boundary and trigger each documented failure through at least one real wrapper. Use errors.Is for promised sentinel categories and errors.As for promised concrete types, then inspect only documented fields. Include a negative target so an overly broad custom Is implementation cannot pass unnoticed. For joined errors, assert every expected branch and the all-success nil case. Do not rely on exact Error text unless that text is public output. A boundary test catches an accidental `%w` to `%v` change that a low-level unit test would miss.'
      zh: '应从导出边界触发每种有文档说明的失败，并让错误至少经过一层真实包装。对承诺的哨兵类别使用 errors.Is，对承诺的具体类型使用 errors.As，随后只检查公开字段。还要加入不应匹配的目标，避免过宽的自定义 Is 悄悄通过。对于合并错误，应断言每个预期分支以及全部成功时返回 nil。除非错误文本本身是公开输出，否则不要精确比较 Error 文本。边界测试能发现底层单元测试遗漏的 `%w` 到 `%v` 误改。'
    topics: [go/error-wrapping]
    level: intermediate
    section: { en: 'Testing', zh: '测试' }
    frequency: common
    tags: [testing, wrapping, error-contract]

  - id: go-declaration-forms
    question: { en: 'How do var, :=, and const differ in Go, and when would you choose each?', zh: 'Go 中的 var、:= 和 const 有什么区别，应该在何时选择它们？' }
    answer:
      en: 'Use var when a declaration needs package scope, an explicit type, or a useful zero value without an initializer. Use := for concise local declaration and inference inside a function; it must introduce at least one new non-blank name in the current block. Use const for values computable at compile time that must not vary. An untyped constant can adapt to a compatible target type, while a variable always has a concrete static type. The choice communicates lifetime and intent, not merely shorter syntax, so I also inspect the surrounding block for accidental shadowing.'
      zh: '需要包级作用域、显式类型，或希望直接使用零值而不写初始化表达式时，应使用 var。函数内需要简洁声明和类型推断时使用 :=；它必须在当前代码块中引入至少一个新的非空白名称。const 用于编译期可计算且不会变化的值。无类型常量可以适配兼容的目标类型，变量则始终具有具体静态类型。选择声明形式是在表达生命周期和意图，不只是比较语法长短，因此还要检查周围代码块是否发生意外遮蔽。'
    topics: [go/fundamentals]
    level: beginner
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [declarations, zero-value, constants]

  - id: go-string-bytes-and-runes
    question: { en: 'What do len, indexing, and range mean for a Go string containing UTF-8 text?', zh: '对于包含 UTF-8 文本的 Go 字符串，len、索引和 range 分别表示什么？' }
    answer:
      en: 'A Go string is an immutable byte sequence, not a character array. len returns its byte count, and indexing returns the byte at that offset. A range loop decodes UTF-8: its first value is the starting byte offset and its second value is the decoded rune. Invalid encodings produce the replacement rune while advancing according to the language rules. If a task needs code-point counts, use range or unicode/utf8. If it needs user-perceived characters, rune counting is still insufficient because one grapheme can contain several code points.'
      zh: 'Go 字符串是不可变的字节序列，不是字符数组。len 返回字节数，索引返回该偏移位置的字节。range 循环会解码 UTF-8：第一个值是码点起始处的字节偏移，第二个值是解码后的 rune。无效编码会产生替换 rune，并按语言规则前进。任务需要码点数量时，应使用 range 或 unicode/utf8；需要用户看到的字符时，仅统计 rune 仍然不够，因为一个字形簇可能包含多个码点。'
    topics: [go/fundamentals]
    level: intermediate
    section: { en: 'Text and values', zh: '文本与值' }
    frequency: common
    tags: [strings, utf-8, rune]

  - id: go-short-declaration-shadowing
    question: { en: 'How can := accidentally shadow a variable, and how do you prevent that bug?', zh: ':= 怎样意外遮蔽变量，应该如何防止这种缺陷？' }
    answer:
      en: 'A short declaration works within the current block. Inside a nested if or for block, a same-spelled name can therefore be new even when an outer variable already exists. A common bug writes result, err := call() in the inner block, validates err there, then returns the unchanged outer result. Prevent it by declaring values in the scope that owns them and using = when the purpose is assignment. Distinct temporary names can make validation clearer. I also test the successful custom-input path, because default-value tests often miss the shadowed update.'
      zh: '短变量声明以当前代码块为边界。在嵌套的 if 或 for 块中，即使外层已有同名变量，该名称在内层仍可能是新变量。常见缺陷是在内层写 result, err := call() 并检查 err，最后却返回未更新的外层 result。应在拥有这些值的作用域中先声明变量，需要赋值时使用 =；校验阶段也可以使用不同的临时名称。还应测试成功的自定义输入路径，因为只测试默认值往往发现不了被遮蔽的更新。'
    topics: [go/fundamentals]
    level: intermediate
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [short-declaration, shadowing, scope]

  - id: go-untyped-constant-context
    question: { en: 'What is an untyped constant in Go, and how does context determine whether it can be used?', zh: 'Go 的无类型常量是什么，上下文怎样决定它能否使用？' }
    answer:
      en: 'An untyped constant has an exact constant value but no ordinary fixed type yet. Assignment, conversion, or a typed operand can supply a target type, and the compiler checks whether the value is representable by that type. If no more specific type is available, the constant takes its category default, such as int for an integer constant or float64 for a floating-point constant. This explains why constant 255 can initialize uint8 while 256 cannot. It does not make runtime conversion lossless; converting an already typed variable follows conversion rules and can discard information.'
      zh: '无类型常量具有精确的常量值，但尚未取得普通的固定类型。赋值、转换或带类型操作数可以提供目标类型，编译器会检查该值能否由目标类型表示。如果没有更具体的类型，常量会采用所属类别的默认类型，例如整数常量采用 int，浮点常量采用 float64。因此常量 255 可以初始化 uint8，而 256 不可以。这并不表示运行时转换无损；已经带类型的变量会遵循转换规则，仍可能丢失信息。'
    topics: [go/fundamentals]
    level: intermediate
    section: { en: 'Types and values', zh: '类型与值' }
    frequency: occasional
    tags: [untyped-constant, representability, conversion]

  - id: slice-value-and-aliasing
    question: { en: 'What is copied when a Go slice is passed to a function, and what can the function change?', zh: 'Go 切片传给函数时复制了什么，函数又能修改什么？' }
    answer:
      en: 'Go passes the slice value, which describes a start in backing storage together with a length and capacity. The function receives its own copy of that descriptor, so reslicing it or assigning an append result changes only the local descriptor. Existing elements may still belong to the same backing array, so assigning s[i] is visible through aliases. If the caller must observe a new length, return the resulting slice and assign it. If elements must be independent too, clone or copy them, while remembering that copying pointer-bearing elements is still shallow.'
      zh: 'Go 传递的是切片值，其中描述了底层存储的起点、长度和容量。函数得到这份描述的副本，因此重新切片或把 append 结果赋给它，只会改变局部描述。现有元素仍可能属于同一个底层数组，所以对 s[i] 赋值可通过别名观察到。如果调用方必须看到新长度，函数应返回结果切片，并由调用方接收。若元素也必须独立，则需克隆或复制；但元素包含指针时，这种复制仍然是浅拷贝。'
    topics: [go/slices]
    level: beginner
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [slice-header, aliasing, parameters]

  - id: append-reuse-and-return
    question: { en: 'Why must callers use the slice returned by append, and what does capacity change?', zh: '为什么调用方必须使用 append 返回的切片，容量会改变什么？' }
    answer:
      en: 'Append always returns a slice with the resulting length. When existing capacity is sufficient, it can reuse the backing array, so aliases may observe writes beyond their own visible ranges if later resliced. When capacity is insufficient, append allocates a sufficiently large array and copies existing elements, so the result no longer shares that array. The specification does not promise a fixed growth factor. Code should assign the result, avoid using capacity as an ownership guarantee, and test both len equals cap and len below cap because an ignored result leaves different evidence on those paths.'
      zh: 'append 始终返回带有结果长度的切片。现有容量足够时，它可以复用底层数组；其他别名若之后重新切片，可能观察到自身可见范围之外的写入。容量不足时，append 会分配足够大的数组并复制现有元素，因此结果不再共享原数组。语言规范不保证固定扩容倍率。代码应接收返回值，不把容量当作所有权保证，并同时测试 len 等于 cap 与 len 小于 cap 的情况，因为丢弃返回值后，两条路径留下的现象不同。'
    topics: [go/slices]
    level: intermediate
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [append, capacity, backing-array]

  - id: nil-versus-empty-slice-contract
    question: { en: 'When does the difference between a nil slice and a non-nil empty slice matter?', zh: 'nil 切片与非 nil 空切片的区别在什么时候重要？' }
    answer:
      en: 'Both have length zero, range over no elements, and can be appended to, so most internal algorithms should test len(s) == 0 rather than nilness. The difference matters when an API exposes it. A nil slice compares equal to nil, while an empty literal does not, and encoding/json emits null for the nil form but [] for the non-nil empty form. Reflection, database drivers, or custom serializers may distinguish them too. Define the boundary contract, construct the required form there, and test the zero-result encoding instead of letting incidental refactors decide it.'
      zh: '两者长度都为零，range 都不会执行循环体，也都可以 append，所以多数内部算法应检查 len(s) == 0，而不是检查是否为 nil。API 暴露这种差别时，它才重要：nil 切片与 nil 比较为 true，空字面量则不是；encoding/json 会把前者编码成 null，把后者编码成 []。反射、数据库驱动或自定义序列化器也可能区分两者。应定义边界契约，在边界构造所需形式，并测试零结果编码，不要让偶然的重构决定输出。'
    topics: [go/slices]
    level: intermediate
    section: { en: 'API contracts', zh: 'API 契约' }
    frequency: common
    tags: [nil-slice, json, api-contract]

  - id: subslice-retention-fix
    question: { en: 'How can a small subslice retain too much memory, and why does slices.Clip not fix it?', zh: '小子切片为什么会保留过多内存，slices.Clip 又为何不能解决？' }
    answer:
      en: 'A subslice still points into its backing array, so keeping a tiny result alive can keep a much larger allocation reachable. This often appears when code caches a short token taken from a large file or network buffer. slices.Clip only limits capacity to length; it is equivalent to a full slice expression and does not copy or detach the array. Clone the long-lived portion when releasing the large buffer matters, then confirm the benefit with a memory profile. For pointer-bearing slices, clear discarded tail slots or use current deletion helpers that clear them.'
      zh: '子切片仍然指向底层数组，所以让很小的结果长期存活，也可能让大得多的分配保持可达。代码从大文件或网络缓冲区截取短 token 后长期缓存时，经常出现这种情况。slices.Clip 只把容量限制到长度，它等价于完整切片表达式，不会复制或解除数组引用。若释放大缓冲区很重要，应克隆需要长期保存的部分，再用内存剖析确认收益。对于包含指针的切片，还应清理废弃的尾部槽位，或使用会执行清理的当前删除助手。'
    topics: [go/slices]
    level: advanced
    section: { en: 'Memory and ownership', zh: '内存与所有权' }
    frequency: occasional
    tags: [memory-retention, subslice, slices-clip]

  - id: struct-copy-and-shared-fields
    question: { en: 'What exactly is copied when a Go struct is assigned or passed by value?', zh: 'Go 结构体在赋值或按值传递时，究竟复制了什么？' }
    answer:
      en: 'Go copies the value of every field into a new outer struct. Integers, booleans, strings, and arrays follow their own value semantics, but a copied slice still describes the same backing array, a copied map still names the same map, and a copied pointer still names the same target. Interface fields carry the same dynamic value, which may also refer to mutable data. I define ownership field by field, clone only what must be independent, and use a mutation test to prove that the source does not change.'
      zh: 'Go 会把每个字段的值复制到新的外层结构体中。整数、布尔值、字符串和数组遵循各自的值语义，但复制后的切片仍描述同一底层数组，复制后的 map 仍指向同一张 map，复制后的指针也仍指向同一目标。接口字段携带相同的动态值，其中也可能引用可变数据。我会逐字段定义所有权，只克隆必须独立的部分，再用变异测试证明修改副本不会改变来源。'
    topics: [go/structs]
    level: intermediate
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [struct-copy, shallow-copy, ownership]

  - id: struct-comparability-and-interface-panic
    question: { en: 'When is a Go struct comparable, and why can an interface field still make comparison panic?', zh: 'Go 结构体何时可比较，为什么接口字段仍可能让比较发生 panic？' }
    answer:
      en: 'A struct is comparable when every field type is comparable. Equality then compares corresponding non-blank fields, and the struct may be used as a map key. Slices, maps, and functions make a containing struct non-comparable at compile time. An interface type is itself comparable, so a struct with an any field passes that static rule. At runtime, however, comparing two interface values whose identical dynamic type is non-comparable, such as []int, panics. Stable key types should contain explicit comparable fields rather than arbitrary dynamic values.'
      zh: '只有所有字段类型都可比较时，结构体才可比较。相等运算会比较对应的非空白字段，这种结构体也能作为 map 键。切片、map 和函数会让包含它们的结构体在编译期不可比较。接口类型本身可比较，所以带 any 字段的结构体能通过静态规则；但两个接口持有相同且不可比较的动态类型，例如 []int 时，运行时比较仍会 panic。稳定的键类型应使用明确可比较的字段，不应隐藏任意动态值。'
    topics: [go/structs]
    level: intermediate
    section: { en: 'Types and values', zh: '类型与值' }
    frequency: occasional
    tags: [comparability, interface, map-key]

  - id: embedding-versus-inheritance
    question: { en: 'How does Go struct embedding differ from inheritance, and what does promotion actually do?', zh: 'Go 结构体嵌入与继承有什么不同，提升实际做了什么？' }
    answer:
      en: 'Embedding stores a real field whose name is its unqualified type name. Promotion lets the outer value use a shorter selector for a uniquely reachable field or method, but the data remains inside that embedded field and the outer type is not assignable to the inner type. Candidates at the same shallowest depth make the selector ambiguous. Promoted methods can affect the outer method set and therefore interface implementation, with different results for embedding T versus *T. I use explicit paths when ownership or name conflicts matter.'
      zh: '嵌入会保存一个真实字段，其名称是未限定的类型名。提升只允许外层值用较短的选择器访问路径唯一的字段或方法；数据仍位于嵌入字段中，外层类型也不能赋给内层类型。同一最浅深度存在多个候选时，选择器会产生歧义。提升方法会影响外层方法集，从而影响接口实现，而且嵌入 T 与 *T 的结果不同。所有权或名称冲突重要时，我会使用显式路径。'
    topics: [go/structs]
    level: intermediate
    section: { en: 'Types and interfaces', zh: '类型与接口' }
    frequency: common
    tags: [embedding, promotion, method-set]

  - id: struct-receiver-choice-with-locks
    question: { en: 'How do you choose between value and pointer receivers for a struct that may own mutable state or a mutex?', zh: '结构体可能拥有可变状态或互斥锁时，怎样选择值接收器与指针接收器？' }
    answer:
      en: 'Use a pointer receiver when the method mutates the receiver, the value has identity, copying would be misleading, or the struct contains a field such as sync.Mutex that must not be copied after first use. A value receiver suits a small value whose methods observe or derive results without changing shared state. Receiver choice also changes method sets: T has value-receiver methods, while *T has both value- and pointer-receiver methods. I run go vet for copied locks and verify interface assignments for both T and *T.'
      zh: '方法需要修改接收者、值具有身份、复制会造成误解，或结构体包含 sync.Mutex 这类首次使用后不得复制的字段时，应使用指针接收器。小型值的方法只观察状态或派生结果，而且不会修改共享状态时，值接收器更合适。接收者选择还会改变方法集：T 只有值接收器方法，*T 同时拥有值与指针接收器方法。我会运行 go vet 检查锁复制，并分别验证 T 与 *T 的接口赋值。'
    topics: [go/structs]
    level: intermediate
    section: { en: 'API design', zh: 'API 设计' }
    frequency: common
    tags: [receiver, mutex, method-set]

  - id: generics-versus-interface-values
    question: { en: 'How do type parameters differ from interface values, and when would you choose each?', zh: '类型参数与接口值有什么区别，应该在何时选择它们？' }
    answer:
      en: 'A type parameter preserves one concrete static type within an instantiation and can relate that type across inputs, callbacks, and results. An interface value packages a dynamic concrete type behind a method set, so different concrete values can flow through the same variable at runtime. I choose generics for containers and algorithms whose signature must preserve type relationships. I choose an ordinary interface when the implementation only needs behavior such as Read or String and runtime substitution is the point. A type parameter used once under any often adds no information, while an interface containing type terms is constraint-only and cannot hold ordinary values.'
      zh: '类型参数会在一次实例化中保留同一个具体静态类型，并能把该类型连接到输入、回调和返回值。接口值则把动态具体类型封装在方法集之后，因此同一变量可在运行时接收不同具体值。容器和算法需要在签名中保留类型关系时，我会选择泛型；实现只依赖 Read 或 String 等行为，而且本来就需要运行时替换时，我会选择普通接口。只在一个位置出现且约束为 any 的类型参数通常没有增加信息；包含 type term 的接口则只能用作约束，不能保存普通值。'
    topics: [go/generics]
    level: intermediate
    section: { en: 'Types and interfaces', zh: '类型与接口' }
    frequency: common
    tags: [generics, interface, static-type]

  - id: generics-type-set-tilde
    question: { en: 'What do type sets, unions, and the tilde mean in a Go constraint?', zh: 'Go 约束中的类型集、union 和波浪号分别表示什么？' }
    answer:
      en: 'A constraint interface represents a type set, and a type argument must belong to that set. Terms separated by a vertical bar form a union, so matching any term is enough for that element; separate interface elements intersect, so all of them must be satisfied. The term int contains only the predeclared type int, while ~int also contains named types whose underlying type is int. The tilde does not convert values at runtime. I use it only when the algorithm is valid for every named type with that representation, then compile a domain type such as Score to prove the boundary.'
      zh: '约束接口表示一个类型集，类型实参必须属于该集合。竖线分隔的 type term 构成 union，因此匹配其中任一项即可满足该元素；接口中的不同元素则取交集，必须全部满足。term int 只包含预声明类型 int，~int 还包含底层类型为 int 的命名类型。波浪号不会在运行时转换值。只有当算法对这种表示的所有命名类型都成立时，我才使用它，并会编译 Score 这样的领域类型来证明边界。'
    topics: [go/generics]
    level: intermediate
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [type-set, union, underlying-type]

  - id: generics-inference-limits
    question: { en: 'How does generic function type inference work, and where does it stop helping?', zh: '泛型函数的类型推断如何工作，它在哪些地方不再有帮助？' }
    answer:
      en: 'The compiler unifies types appearing in function parameters with the argument types at a call and also uses relationships expressed by constraints. That often lets Map infer both its input and output element types. Inference fails when the available positions imply incompatible types or provide no information, such as a type parameter that appears only in the result. Generic type literals also require explicit instantiation; Stack[string]{} cannot normally become Stack{} merely because a field suggests string. I test the exact public call forms with named types, function values, nil arguments, and untyped constants because those cases expose inference assumptions hidden by simple literals.'
      zh: '编译器会在调用点统一函数形参中出现的类型与实参类型，也会利用约束表达的关系，因此 Map 往往能推断输入和输出元素类型。可用位置给出不兼容答案，或类型参数只出现在返回值中而没有提供信息时，推断会失败。泛型类型字面量也需要显式实例化；不能仅因字段暗示 string，就把 Stack[string]{} 简写成 Stack{}。我会使用命名类型、函数值、nil 实参和未类型化常量编译公开文档中的原始调用形式，因为这些情况能暴露简单字面量隐藏的推断假设。'
    topics: [go/generics]
    level: intermediate
    section: { en: 'Language core', zh: '语言核心' }
    frequency: occasional
    tags: [type-inference, type-argument, instantiation]

  - id: generics-api-design-choice
    question: { en: 'When does a Go API benefit from generics, and what signs suggest it is over-generalized?', zh: 'Go API 何时能从泛型中受益，哪些迹象表明它被过度泛化？' }
    answer:
      en: 'A generic API earns its complexity when a type parameter preserves a useful relationship or lets one data structure implement the same semantics for several element types. Map connects slice elements to a callback, and a Stack returns the element type used to instantiate it. Warning signs include a parameter that appears only once under any, a large union unrelated to operations in the body, type switches that reimplement dynamic dispatch, or conversions that erase named domain types. I start from concrete call sites, derive the smallest constraint from required operations, and compare the result with an ordinary interface or two explicit implementations.'
      zh: '当类型参数保留了有用关系，或让一个数据结构以相同语义支持多种元素类型时，泛型 API 的复杂度才有回报。Map 把切片元素连接到回调，Stack 则返回实例化时使用的元素类型。警示信号包括：参数只在一个位置出现且约束为 any；巨大 union 与函数体操作无关；用 type switch 重新实现动态分派；通过转换抹掉命名领域类型。我会从具体调用点出发，按所需操作推导最小约束，再与普通接口或两个明确实现比较。'
    topics: [go/generics]
    level: advanced
    section: { en: 'API design', zh: 'API 设计' }
    frequency: occasional
    tags: [api-design, constraint, over-generalization]

  - id: interfaces-implicit-satisfaction
    question: { en: 'How does implicit interface satisfaction affect package and API design in Go?', zh: '隐式接口满足会怎样影响 Go 的包设计与 API 设计？' }
    answer:
      en: 'Go checks whether a type has the required methods when a value is assigned, passed, or returned as an interface. The implementing package does not declare the relationship or import the consumer. That lets a consuming package define a narrow interface around the methods it actually calls, and existing types can satisfy it without modification. I start from a concrete call site rather than publishing an interface beside every implementation. I also add a compile-time assignment near important implementations so a later receiver or signature change fails close to the intended contract.'
      zh: 'Go 会在值作为接口被赋值、传参或返回时，检查其类型是否拥有要求的方法。实现包不用声明这种关系，也不用导入使用方。使用包因此可以根据实际调用的方法定义窄接口，已有类型无须修改便能满足它。我会从具体调用点出发，而不是在每个实现旁预先发布接口。对于重要实现，我还会在附近加入编译期赋值断言，让以后对接收者或签名的修改在契约旁立即失败。'
    topics: [go/interfaces]
    level: beginner
    section: { en: 'Types and interfaces', zh: '类型与接口' }
    frequency: common
    tags: [implicit-satisfaction, consumer-interface, api-design]

  - id: interfaces-method-set-pointer
    question: { en: 'Why can x.M() compile while assigning x to an interface that requires M does not?', zh: '为什么 x.M() 可以编译，而把 x 赋给要求 M 的接口却不能编译？' }
    answer:
      en: 'Method-call syntax has an addressability convenience: if x is addressable and *T has M, the compiler may treat x.M() as (&x).M(). Interface satisfaction uses method sets without that rewrite. For a defined type T, value-receiver methods belong to both T and *T method sets, while pointer-receiver methods belong only to *T. Thus a value can make a convenient call yet fail an interface assignment. I decide receiver semantics first, then compile assertions for T, *T, or both. Map elements deserve extra care because they are generally not addressable.'
      zh: '方法调用语法有一条可寻址性便利规则：如果 x 可寻址且 *T 拥有 M，编译器可以把 x.M() 解释为 (&x).M()。接口满足只看方法集，不会采用这种改写。对已定义类型 T，值接收者方法同时属于 T 和 *T 的方法集，指针接收者方法只属于 *T。因此，值可以方便地调用方法，却不能通过接口赋值。我会先确定接收者语义，再分别为 T、*T 或两者编写编译期断言。map 元素通常不可寻址，需要额外小心。'
    topics: [go/interfaces]
    level: intermediate
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [method-set, pointer-receiver, addressability]

  - id: interfaces-typed-nil
    question: { en: 'Why can an error containing a nil pointer compare unequal to nil, and how do you prevent it?', zh: '为什么包含 nil 指针的 error 不等于 nil，应该怎样避免？' }
    answer:
      en: 'An interface value is nil only when it has neither a dynamic type nor a dynamic value. Converting a nil *ParseError to error records *ParseError as the dynamic type, so the interface is non-nil even though its dynamic pointer is nil. Callers enter error handling, and formatting may panic if Error dereferences its receiver. On a successful path, return the literal nil directly. Construct and return *ParseError only on failure. I test the public return value with err == nil and also exercise logging or formatting for every concrete error type.'
      zh: '接口值只有在动态类型和动态值都不存在时才等于 nil。把 nil 的 *ParseError 转换为 error 后，接口会记录动态类型 *ParseError，所以即使动态指针为 nil，接口仍非 nil。调用方会进入错误处理；如果 Error 解引用接收者，格式化还可能 panic。成功路径应直接返回字面值 nil，只在失败时构造并返回 *ParseError。我会用 err == nil 测试公开返回值，并对每种具体错误类型实际执行日志记录或格式化。'
    topics: [go/interfaces]
    level: intermediate
    section: { en: 'Errors and boundaries', zh: '错误与边界' }
    frequency: common
    tags: [interface-value, typed-nil, error]

  - id: interfaces-equality-panic
    question: { en: 'When can comparing two interface values panic?', zh: '比较两个接口值时，什么情况下会发生 panic？' }
    answer:
      en: 'Interface types are comparable, but a particular comparison also depends on the dynamic values. Two interface values are unequal when their dynamic types differ. When the dynamic types are identical, Go compares their dynamic values; if that dynamic type is not comparable, such as []int or map[string]int, the comparison panics. The same rule affects interfaces used as map keys because hashing needs a comparable dynamic type. I avoid arbitrary any keys, choose an explicit comparable representation, and test boundary values whose dynamic types include slices, maps, functions, and nil pointers.'
      zh: '接口类型本身可比较，但某次比较还取决于动态值。两个接口的动态类型不同时，结果是不相等；动态类型相同时，Go 会继续比较动态值。如果该动态类型不可比较，例如 []int 或 map[string]int，比较就会 panic。接口作为 map 键时也受同一规则约束，因为求哈希要求动态类型可比较。我不会使用任意 any 值作为键，而会选择明确可比较的表示，并用切片、map、函数和 nil 指针等动态类型测试边界。'
    topics: [go/interfaces]
    level: advanced
    section: { en: 'Runtime behavior', zh: '运行时行为' }
    frequency: occasional
    tags: [interface-equality, comparability, map-key]

  - id: map-zero-value-and-presence
    question: { en: 'What operations are safe on a nil map, and how do you distinguish a missing key from a stored zero value?', zh: '哪些操作可以安全用于 nil map，怎样区分缺失键与保存的零值？' }
    answer:
      en: "A nil map has length zero. Lookup returns the element type's zero value, range performs no iterations, and delete and clear are safe no-ops. Assigning an entry panics, so a write path must initialize the map with make or a literal. A single-value lookup cannot distinguish absence from a stored zero. Use value, ok := m[key] when presence affects behavior; ok is true for an existing key even when value is 0, false, an empty string, or nil. Test both cases because positive-only fixtures hide the distinction."
      zh: 'nil map 的长度为零；读取会返回元素类型的零值，range 不执行循环，delete 和 clear 也是安全的空操作。给条目赋值会 panic，因此写路径必须先用 make 或字面量初始化。单值读取无法区分缺失与保存的零值。存在性会影响行为时，应使用 value, ok := m[key]；即使值为 0、false、空字符串或 nil，只要键存在，ok 仍为 true。测试必须同时覆盖两种情况，因为只有正值的夹具会掩盖差异。'
    topics: [go/maps]
    level: beginner
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [nil-map, zero-value, comma-ok]

  - id: map-key-comparability
    question: { en: 'Which Go types can be map keys, and why can map[any]V still panic?', zh: '哪些 Go 类型可以作为 map 键，为什么 map[any]V 仍可能 panic？' }
    answer:
      en: 'A map key type must support == and !=. Booleans, numbers, strings, pointers, channels, and interfaces are comparable. Arrays are comparable when their element type is, and structs are comparable when every field is. Slices, maps, and functions cannot be keys. An interface type is comparable statically, but its dynamic value may not be. Inserting an any value that contains []int, another map, or a function causes a runtime panic when hashing or comparing the key. Prefer a concrete key type that expresses the domain and preserves this check at compile time.'
      zh: 'map 键类型必须支持 == 和 !=。布尔、数字、字符串、指针、channel 和接口可比较；数组要在元素类型可比较时才可比较，结构体则要求每个字段都可比较。slice、map 和函数不能作为键。接口类型在静态上可比较，但其中的动态值可能不可比较。把包含 []int、另一个 map 或函数的 any 值插入 map 时，求哈希或比较键会在运行时 panic。最好选择表达领域含义的具体键类型，把检查保留在编译期。'
    topics: [go/maps]
    level: intermediate
    section: { en: 'Types and values', zh: '类型与值' }
    frequency: common
    tags: [comparability, interface, map-key]

  - id: map-copy-and-snapshot
    question: { en: 'What is copied when a Go map is assigned, passed to a function, or cloned with maps.Clone?', zh: 'Go map 在赋值、传给函数或使用 maps.Clone 时分别复制了什么？' }
    answer:
      en: 'Assignment and parameter passing copy the map value, which still refers to the same implementation-managed entry data. A function can therefore update entries visible to its caller, and backup := source is not a snapshot. maps.Clone creates a new top-level map and copies keys and values with ordinary assignment. That clone is shallow: slice, map, pointer, and interface values may still reach shared mutable objects. Start by defining the required independence depth, copy each mutable layer that crosses the boundary, and mutation-test the result rather than inferring isolation from a variable name.'
      zh: '赋值和传参会复制 map 值，但副本仍引用实现管理的同一份条目数据。因此，函数可以修改调用方看到的条目，backup := source 也不是快照。maps.Clone 会创建新的顶层 map，并按普通赋值语义复制键和值；这种克隆是浅层的，slice、map、指针和接口值仍可能指向共享的可变对象。应先定义边界要求的独立深度，再复制跨边界的每一层可变数据，并用变异测试验证结果，不能从变量名称推断隔离性。'
    topics: [go/maps]
    level: intermediate
    section: { en: 'Ownership', zh: '所有权' }
    frequency: common
    tags: [aliasing, shallow-clone, ownership]

  - id: map-range-mutation
    question: { en: 'What does Go guarantee when a map is modified during range?', zh: '在 range 遍历期间修改 map 时，Go 保证哪些行为？' }
    answer:
      en: 'Map iteration order is unspecified and can differ between iterations. If code deletes an entry that the current loop has not reached, that entry will not be produced. This makes deletion during range a valid filtering pattern. Insertion has weaker semantics: each new entry may appear or may be skipped, and the choice can vary by entry and run. Algorithms that must process newly added work need a queue or a second phase. Stable output requires collecting and sorting keys; an observed order in tests is not a contract.'
      zh: 'map 的遍历顺序未指定，不同轮次可以不同。如果代码删除本轮尚未到达的条目，该条目不会产生迭代值，因此在 range 中删除是合法的过滤模式。新增条目的语义更弱：每个新条目都可能出现，也可能被跳过，而且选择可以按条目和运行变化。必须处理新增工作的算法应使用队列或第二阶段。需要稳定输出时，应收集并排序键；测试中偶然观察到的顺序不是契约。'
    topics: [go/maps]
    level: intermediate
    section: { en: 'Language core', zh: '语言核心' }
    frequency: occasional
    tags: [range, iteration-order, mutation]

  - id: concurrent-map-access
    question: { en: 'When may goroutines share an ordinary map, and how would you design safe access?', zh: 'goroutine 何时可以共享普通 map，应该怎样设计安全访问？' }
    answer:
      en: 'Multiple goroutines may read an ordinary map concurrently only while no goroutine modifies it. Once writes are possible, every overlapping lookup, iteration, assignment, delete, and clear needs synchronization. I usually put the map and one mutex in the same struct and expose methods that preserve a documented invariant. A single owning goroutine receiving commands over a channel is another option. Returning the internal map or a nested mutable value can bypass the lock, so read methods may need snapshots. Finally, run go test -race ./...; absence of a runtime fatal error does not prove race freedom.'
      zh: '只有在没有 goroutine 修改 map 时，多个 goroutine 才能并发读取普通 map。一旦可能写入，所有会重叠的读取、遍历、赋值、delete 和 clear 都需要同步。我通常把 map 与一把互斥锁放进同一个结构体，并通过方法维护有文档说明的不变量；也可以让单一 goroutine 拥有 map，通过 channel 接收命令。返回内部 map 或嵌套可变值可能绕过锁，因此读取方法有时需要返回快照。最后还要运行 go test -race ./...；没有出现运行时 fatal error 并不能证明不存在竞争。'
    topics: [go/maps]
    level: intermediate
    section: { en: 'Concurrency', zh: '并发' }
    frequency: common
    tags: [concurrency, mutex, race-detector]
