track: go
items:
  - id: defer-evaluation-and-order
    question: { en: 'When are a deferred call and its arguments evaluated, and in what order do deferred calls run?', zh: '延迟调用及其实参何时求值，多个延迟调用按什么顺序执行？' }
    answer:
      en: 'Executing a defer statement immediately evaluates and saves the function value, method receiver, and arguments. The call itself waits until the surrounding function exits. Calls registered by that function run in reverse registration order, including on a panic path. A deferred closure is slightly different from passing a value as an argument: its body reads captured variables when it runs. On a normal return, result parameters are assigned before deferred calls execute, so a deferred closure can inspect or modify named results.'
      zh: '执行 defer 语句时，函数值、方法接收者和实参都会立即求值并保存，真正的调用则等到外围函数退出。该函数注册的延迟调用按注册顺序的逆序执行，panic 路径也一样。延迟闭包与直接传值略有不同：闭包体在实际运行时读取捕获的变量。正常返回时，结果参数先完成赋值，随后才执行延迟调用，因此延迟闭包可以检查或修改命名结果。'
    topics: [go/defer-panic-recover]
    level: beginner
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [defer, evaluation, lifo]

  - id: panic-versus-error
    question: { en: 'When should Go code return an error, and when is panic appropriate?', zh: 'Go 代码何时应返回 error，何时适合 panic？' }
    answer:
      en: 'Return an error for failures the caller can reasonably expect and handle, such as invalid input, a missing file, or a network timeout. Panic is for a broken assumption that makes the current control flow unsafe, including runtime faults and deliberately enforced internal invariants. A Must-style helper may panic when its name and contract make that behavior explicit. Even if a package uses a private panic internally to unwind recursive code, its public API should normally convert that known value to an error and re-panic unexpected values.'
      zh: '对于调用者可以合理预期并处理的失败，应返回 error，例如无效输入、文件不存在或网络超时。panic 适合表示已破坏的假设，使当前控制流无法安全继续，包括运行时故障和程序主动检查的内部不变量。名称和契约明确说明行为的 Must 风格辅助函数也可以 panic。即使包内部用私有 panic 展开递归代码，公开 API 通常也应把已知值转成 error，并让未知值继续 panic。'
    topics: [go/defer-panic-recover]
    level: intermediate
    section: { en: 'Error handling', zh: '错误处理' }
    frequency: common
    tags: [panic, error, api-design]

  - id: recover-conditions-and-control-flow
    question: { en: 'What conditions make recover effective, and where does execution continue afterward?', zh: 'recover 生效需要哪些条件，恢复后从哪里继续执行？' }
    answer:
      en: 'Recover is effective only when called directly by a function that is currently running as a deferred call, while the same goroutine is panicking. An ordinary helper call, a parent goroutine, or a deferred function running on a normal return sees nil. Successful recovery stops unwinding, but it does not resume at the panic site. The intermediate frames have been discarded. Remaining deferred calls in the function that installed the boundary run in reverse order, that function returns, and execution continues in its caller.'
      zh: 'recover 只有在同一个 goroutine 正在 panicking，而且当前作为延迟调用运行的函数直接调用它时才生效。普通辅助函数、父 goroutine，或正常返回路径上的延迟函数只会得到 nil。成功恢复会停止展开，但不会回到 panic 位置继续；中间栈帧已经丢弃。安装边界的函数中尚未执行的延迟调用继续按逆序运行，随后该函数返回，控制流从它的调用者继续。'
    topics: [go/defer-panic-recover]
    level: intermediate
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [recover, panic-unwinding, control-flow]

  - id: production-recovery-boundary
    question: { en: 'What should a production recovery boundary do besides calling recover?', zh: '生产环境的恢复边界除了调用 recover，还应做什么？' }
    answer:
      en: 'A recovery boundary must define the disposable unit of work and decide whether shared state is still trustworthy. It should capture the panic value and stack, attach a request or task identifier, report failure to the owner, and release resources without depending on damaged state. For goroutine isolation, the boundary belongs inside the new goroutine and must signal completion exactly once. It also needs a policy for unknown panic values: many boundaries should re-panic rather than disguise a programming defect as a routine error.'
      zh: '恢复边界必须定义可丢弃的工作单元，并判断共享状态是否仍然可信。它应记录 panic 值和栈，附上请求或任务标识，向所有者报告失败，并在不依赖损坏状态的前提下释放资源。要隔离 goroutine，边界必须位于新 goroutine 内，而且只能发出一次完成信号。它还需要规定如何处理未知 panic 值：许多边界应再次 panic，而不是把编程缺陷伪装成普通错误。'
    topics: [go/defer-panic-recover]
    level: advanced
    section: { en: 'Production boundaries', zh: '生产边界' }
    frequency: occasional
    tags: [recover, observability, goroutine]

  - id: error-contract-selection
    question: { en: 'How do you choose between an opaque error, a sentinel, a custom error type, and a predicate?', zh: '怎样在不透明错误、哨兵错误、自定义错误类型和判断函数之间选择？' }
    answer:
      en: 'Start with the weakest contract that supports a real caller decision. A non-nil error is enough when callers only stop or report. Use a sentinel for a small stable category that callers test with errors.Is. Use a custom type when they need documented fields through errors.As. A predicate can expose classification while hiding representation. Every exported value, type, field, or matching behavior becomes API surface. Avoid exposing a dependency error unless callers should rely on it after wrappers and future implementation changes.'
      zh: '从足以支持实际调用决策的最弱契约开始。如果调用方只需停止或报告，非 nil 错误已经足够。对于调用方需要通过 errors.Is 检查的少量稳定类别，使用哨兵错误；需要通过 errors.As 读取文档字段时，使用自定义类型。判断函数可以公开分类，同时隐藏具体表示。每个导出的值、类型、字段或匹配行为都会成为 API。除非调用方在包装和未来实现变更后仍应依赖某个依赖错误，否则不要公开它。'
    topics: [go/error-handling]
    level: intermediate
    section: { en: 'Error handling', zh: '错误处理' }
    frequency: common
    tags: [error-contract, sentinel, custom-error]

  - id: errors-is-versus-as
    question: { en: 'What is the difference between errors.Is and errors.As, and why are they preferable to equality or type assertions?', zh: 'errors.Is 与 errors.As 有什么区别，为什么它们优于直接相等比较或类型断言？' }
    answer:
      en: 'errors.Is answers whether an error tree contains a target value or matches a target through a custom Is method. errors.As finds a value assignable to a requested error type and stores it in the supplied target slot. Both traverse wrappers and joined errors. Direct equality and a type assertion inspect only the outer error, so they fail after contextual wrapping. Use Is when control flow depends on a category and As when code needs structured fields. Neither requires parsing the human-readable Error string.'
      zh: 'errors.Is 用来判断错误树是否包含目标值，或是否通过自定义 Is 方法匹配目标。errors.As 会查找能赋给指定错误类型的值，并把它保存到传入的目标槽位中。两者都会遍历包装错误和合并错误。直接相等比较与类型断言只检查最外层错误，因此添加上下文包装后就会失效。控制流依赖错误类别时使用 Is，需要读取结构化字段时使用 As。两者都不需要解析供人阅读的 Error 字符串。'
    topics: [go/error-handling]
    level: intermediate
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [errors-is, errors-as, wrapping]

  - id: typed-nil-error-interface
    question: { en: 'How can a nil pointer become a non-nil error interface, and how do you prevent that bug?', zh: 'nil 指针怎样会变成非 nil 的 error 接口，应该如何避免这个问题？' }
    answer:
      en: 'An interface equals nil only when it has neither a dynamic type nor a dynamic value. Converting a nil *MyError to error records *MyError as the dynamic type, so the interface is non-nil even though its stored pointer is nil. This often happens when a function returns a pointer accumulator directly on its success path. Return a literal nil on success and create the concrete error only for failures. Add a success-path test that checks err == nil; failure-only tests do not expose the bug.'
      zh: '接口只有在动态类型和动态值都不存在时才等于 nil。把 nil 的 *MyError 转换成 error 后，接口会把 *MyError 记录为动态类型，所以即使其中保存的指针是 nil，接口仍然非 nil。函数在成功路径直接返回指针形式的错误累积器时，经常出现这个问题。成功时应返回字面值 nil，只在失败时创建具体错误。还要添加断言 err == nil 的成功路径测试；只测试失败路径发现不了这个缺陷。'
    topics: [go/error-handling]
    level: intermediate
    section: { en: 'Language core', zh: '语言核心' }
    frequency: occasional
    tags: [interface, typed-nil, testing]

  - id: error-reporting-boundary
    question: { en: 'Where should a Go program log an error, and what should intermediate layers do instead?', zh: 'Go 程序应在哪里记录错误，中间层又该怎样处理？' }
    answer:
      en: 'Log at the boundary that owns the outcome, such as an HTTP request, command, queue worker, or process entry point. That layer knows the request identifier, severity, response, and redaction policy. Intermediate libraries should usually add concise operation context and return the error with its intended chain intact. Logging and returning at every layer produces duplicate events and may expose credentials or payloads through ad hoc messages. A layer may consume an error without returning it only when it completes the handling decision, for example by applying a documented fallback.'
      zh: '应在拥有处理结果的边界记录错误，例如 HTTP 请求、命令、队列 worker 或进程入口。该层知道请求标识、严重程度、响应方式和脱敏策略。中间库通常只应添加简洁的操作上下文，并在保留预期错误链的前提下返回错误。每一层都记录后再返回，会产生重复事件，还可能通过临时消息泄露凭据或载荷。只有真正完成处理决策时，一层才可以消费错误而不再返回，例如采用有文档说明的回退方案。'
    topics: [go/error-handling]
    level: intermediate
    section: { en: 'Production boundaries', zh: '生产边界' }
    frequency: common
    tags: [logging, wrapping, observability]

  - id: percent-w-error-contract
    question: { en: 'How does `%w` differ from `%v` in fmt.Errorf, and why is that an API decision?', zh: 'fmt.Errorf 中的 `%w` 与 `%v` 有什么区别，为什么这是一项 API 决策？' }
    answer:
      en: 'Both verbs include the operand in the formatted message, but only `%w` makes the returned error unwrap to that operand. That lets errors.Is and errors.As discover the cause through later wrappers. Once an exported function wraps a sentinel or concrete dependency error, callers can build control flow around that match, so changing the wrapped cause may break them. Use `%w` for causes you intend to expose. Use deliberate translation when callers should depend on your domain error instead of a database, filesystem, or SDK representation.'
      zh: '`%v` 和 `%w` 都会把操作数写入格式化消息，但只有 `%w` 会让返回错误解包到该操作数，因此 errors.Is 和 errors.As 能穿过后续包装找到原因。导出函数一旦包装某个哨兵错误或依赖库的具体错误，调用方就可能围绕该匹配编写控制流，之后更换原因便可能破坏兼容性。希望公开原因时使用 `%w`；如果调用方应该依赖领域错误，而不是数据库、文件系统或 SDK 的表示，就应有意转换错误。'
    topics: [go/error-wrapping]
    level: intermediate
    section: { en: 'Error handling', zh: '错误处理' }
    frequency: common
    tags: [wrapping, api-contract, fmt-errorf]

  - id: error-tree-traversal-order
    question: { en: 'How do errors.Is and errors.As traverse wrappers and joined errors?', zh: 'errors.Is 和 errors.As 怎样遍历包装错误与合并错误？' }
    answer:
      en: 'They treat the supplied error as the root of a tree and walk it in pre-order, depth-first order. Each function examines the current error before visiting children returned by Unwrap() error or Unwrap() []error. Is checks equality and a shallow custom Is method; As checks assignability and a custom As method. This matters when several nodes could match: the outer or earlier branch wins. A custom Is method should not traverse children itself, because the standard algorithm already does that and would repeat the work after a miss.'
      zh: '它们把传入错误视为树根，并按前序深度优先顺序遍历。两个函数都会先检查当前错误，再访问 Unwrap() error 或 Unwrap() []error 返回的子节点。Is 检查相等性和浅层自定义 Is 方法；As 检查可赋值性和自定义 As 方法。多个节点都能匹配时，外层或更早的分支先胜出。自定义 Is 不应自行遍历子节点，因为标准算法已经负责遍历，匹配失败后再做一次只会重复工作。'
    topics: [go/error-wrapping]
    level: advanced
    section: { en: 'Language core', zh: '语言核心' }
    frequency: occasional
    tags: [errors-is, errors-as, traversal]

  - id: joined-errors-and-unwrap
    question: { en: 'What does errors.Join return, and why does errors.Unwrap not enumerate its children?', zh: 'errors.Join 返回什么，为什么 errors.Unwrap 不会枚举它的子错误？' }
    answer:
      en: 'errors.Join discards nil operands and returns nil if none remain. Otherwise it returns one error whose Unwrap() []error method exposes every remaining child, so errors.Is and errors.As can match any branch. The convenience function errors.Unwrap predates multi-error trees and calls only Unwrap() error; it returns nil for a joined value. Code that only needs classification should call Is or As. Diagnostic tooling that truly needs every node must type-check both unwrap interfaces and recurse without treating display order as business priority.'
      zh: 'errors.Join 会丢弃 nil 操作数；没有错误剩余时返回 nil，否则返回一个通过 Unwrap() []error 公开全部子错误的值，因此 errors.Is 和 errors.As 可以匹配任意分支。便利函数 errors.Unwrap 早于多错误树，只会调用 Unwrap() error，所以对合并值返回 nil。只需分类的代码应调用 Is 或 As。确实需要全部节点的诊断工具必须分别判断两种解包接口并递归遍历，而且不能把显示顺序当作业务优先级。'
    topics: [go/error-wrapping]
    level: intermediate
    section: { en: 'Error handling', zh: '错误处理' }
    frequency: occasional
    tags: [errors-join, unwrap, error-tree]

  - id: test-wrapping-contract
    question: { en: 'How would you test that refactoring has not broken a Go error-wrapping contract?', zh: '怎样测试重构没有破坏 Go 的错误包装契约？' }
    answer:
      en: 'Test from the exported boundary and trigger each documented failure through at least one real wrapper. Use errors.Is for promised sentinel categories and errors.As for promised concrete types, then inspect only documented fields. Include a negative target so an overly broad custom Is implementation cannot pass unnoticed. For joined errors, assert every expected branch and the all-success nil case. Do not rely on exact Error text unless that text is public output. A boundary test catches an accidental `%w` to `%v` change that a low-level unit test would miss.'
      zh: '应从导出边界触发每种有文档说明的失败，并让错误至少经过一层真实包装。对承诺的哨兵类别使用 errors.Is，对承诺的具体类型使用 errors.As，随后只检查公开字段。还要加入不应匹配的目标，避免过宽的自定义 Is 悄悄通过。对于合并错误，应断言每个预期分支以及全部成功时返回 nil。除非错误文本本身是公开输出，否则不要精确比较 Error 文本。边界测试能发现底层单元测试遗漏的 `%w` 到 `%v` 误改。'
    topics: [go/error-wrapping]
    level: intermediate
    section: { en: 'Testing', zh: '测试' }
    frequency: common
    tags: [testing, wrapping, error-contract]
