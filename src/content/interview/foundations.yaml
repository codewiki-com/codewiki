track: foundations
items:
  - id: http2-multiplexing-boundary
    question: { en: 'What problem does HTTP/2 multiplexing solve, and which head-of-line blocking remains?', zh: 'HTTP/2多路复用解决了什么问题？哪种队头阻塞仍然存在？' }
    answer:
      en: 'HTTP/2 labels frames with stream identifiers, so requests and responses can be interleaved on one connection. A ready response no longer waits for an earlier slow response merely because HTTP/1.1 requires response order. However, the frames still travel through one ordered TCP byte stream. If a TCP segment is lost, later bytes for every HTTP/2 stream wait for retransmission. Multiplexing therefore removes HTTP-level response ordering, not transport-level head-of-line blocking. I verify the negotiated protocol and measure through the real proxy path before attributing a latency change to multiplexing.'
      zh: 'HTTP/2用流标识标记帧，让多组请求与响应可以在一条连接上交错。已经就绪的响应不必再因为HTTP/1.1的响应顺序要求，等待前面的慢响应。但是，所有帧仍通过一条有序的TCP字节流传输。一旦TCP段丢失，所有HTTP/2流的后续字节都要等待重传。因此，多路复用消除的是HTTP层响应排队，不是传输层队头阻塞。我会确认实际协商出的协议，并经过真实代理路径测量，再判断延迟变化是否来自多路复用。'
    topics: [foundations/http2]
    level: intermediate
    section: { en: 'Networking protocols', zh: '网络协议' }
    frequency: common
    tags: [http2, multiplexing, tcp]

  - id: http2-flow-control-backpressure
    question: { en: 'How do HTTP/2 flow control and application backpressure differ?', zh: 'HTTP/2流量控制与应用背压有什么区别？' }
    answer:
      en: 'HTTP/2 DATA consumes both a stream window and a connection window. WINDOW_UPDATE grants more byte credit after the receiver makes capacity available. These windows do not limit HEADERS, handler count, parsed objects, database work, or an application queue. A runtime may expose the combined pressure through a writable stream returning false and a later drain event. Correct services respect that signal and also bound admission, body size, decoding, downstream calls, and buffered responses. I test a peer that stops reading because happy-path payloads rarely expose missing backpressure.'
      zh: 'HTTP/2的DATA会同时消耗流窗口和连接窗口。接收方释放容量后，用WINDOW_UPDATE增加字节额度。但这些窗口不会限制HEADERS、处理器数量、解析后的对象、数据库工作或应用队列。运行时可能通过可写流返回false以及之后的drain事件，暴露综合压力。正确的服务既要响应这个信号，也要限制入口并发、正文大小、解码、下游调用和缓冲响应。我会测试对端停止读取的情况，因为正常的小负载很难暴露缺失的背压。'
    topics: [foundations/http2]
    level: intermediate
    section: { en: 'Capacity and backpressure', zh: '容量与背压' }
    frequency: common
    tags: [http2, flow-control, backpressure]

  - id: http2-goaway-retry
    question: { en: 'How should a client react to an HTTP/2 GOAWAY frame?', zh: '客户端应如何处理HTTP/2的GOAWAY帧？' }
    answer:
      en: 'GOAWAY means the connection will accept no new streams and carries the highest peer-initiated stream that might have been processed. The client opens or selects another session for new work and gives accepted streams a bounded drain period. Higher-numbered local streams can be candidates for retry, but the protocol signal is not the whole decision. The method must be safe under replay or protected by idempotency, the request body must be reproducible, and intermediary side effects must be considered. I never replay every active request blindly, especially writes.'
      zh: 'GOAWAY表示连接不再接受新流，并携带对端可能处理过的最高流标识。客户端应为新工作创建或选择另一个会话，同时给已经接受的流设置有限排空时间。编号更高的本地流可以成为重试候选，但协议信号不能独自决定重试。方法必须能安全重放或受到幂等机制保护，请求正文必须可重新生成，还要考虑中间层可能产生的副作用。我不会盲目重放所有活动请求，尤其不会盲目重放写操作。'
    topics: [foundations/http2]
    level: advanced
    section: { en: 'Failure handling', zh: '故障处理' }
    frequency: occasional
    tags: [http2, goaway, retry]

  - id: http2-hpack-security
    question: { en: 'What state does HPACK maintain, and what security limits still matter?', zh: 'HPACK维护什么状态？还需要哪些安全限制？' }
    answer:
      en: 'HPACK uses static and dynamic tables so repeated field names and values can be represented by references. Encoder and decoder context is ordered and scoped to one connection; a context failure can therefore become a connection error. Compression does not encrypt fields. Sensitive values should use a never-indexed representation, while TLS, log redaction, and access control remain necessary. Receivers must limit decoded field count and size rather than trusting compressed bytes on the wire. I also bound per-field size and decoding work so a compact field block cannot trigger unbounded memory or CPU use.'
      zh: 'HPACK使用静态表和动态表，让重复的字段名称与值可以通过引用表示。编码与解码上下文具有顺序，并且只属于一条连接；上下文损坏因此可能成为连接错误。压缩不会加密字段。敏感值应使用永不索引的表示，同时仍需TLS、日志脱敏和访问控制。接收方必须限制解码后的字段数量与总大小，不能信任线上的压缩字节数。我还会限制单字段大小和解码工作，避免很小的字段块触发无界内存或CPU消耗。'
    topics: [foundations/http2]
    level: advanced
    section: { en: 'Protocol security', zh: '协议安全' }
    frequency: occasional
    tags: [http2, hpack, header-limits]

  - id: network-programming-tcp-framing
    question: { en: 'Why does TCP need application message framing, and how would you test a length-prefixed decoder?', zh: 'TCP为什么需要应用消息分帧？你会怎样测试长度前缀解码器？' }
    answer:
      en: 'TCP delivers an ordered byte stream, not the write boundaries chosen by the sender. One receive can contain part of a header, part of a payload, several messages, or any combination that preserves byte order. A length-prefixed decoder therefore buffers incrementally, reads a fixed-width length in the agreed byte order, rejects values above a configured maximum, and emits only complete frames. I test every split within the header and payload, several frames in one chunk, zero-length frames, early EOF, oversized lengths, and a total operation deadline.'
      zh: 'TCP交付有序字节流，不保留发送方选择的写入边界。一次接收可能只有部分头或负载，也可能包含多条消息，只要字节顺序不变即可。长度前缀解码器因此要增量缓冲，按约定字节序读取固定宽度长度，拒绝超过配置上限的值，并且只产出完整帧。我会测试头与负载中的每个切分位置、多帧同读、零长度帧、提前EOF、超长声明和覆盖整个操作的截止时间。'
    topics: [foundations/network-programming]
    level: intermediate
    section: { en: 'Transport semantics', zh: '传输语义' }
    frequency: common
    tags: [tcp, framing, partial-read]

  - id: network-programming-end-states
    question: { en: 'How do timeout, orderly EOF, and connection reset differ for a socket reader?', zh: '对于套接字读取方，超时、有序EOF和连接复位有什么区别？' }
    answer:
      en: 'A timeout says that an operation made no required progress before its budget expired; it does not prove the peer is dead. Orderly EOF, represented by an empty read after buffered bytes are consumed, says the peer closed its sending direction. A reset reports abnormal connection termination and normally arrives as an error. None of these outcomes proves whether the peer committed an application transaction. I preserve them as separate error states, attach the connection phase and byte counts, close through one owner, and retry only when application idempotency makes replay safe.'
      zh: '超时表示操作没有在预算内取得所需进展，并不能证明对端已经失效。有序EOF会在缓冲字节读完后表现为空读取，说明对端关闭了发送方向。连接复位表示异常终止，通常以错误形式出现。这三种结果都不能证明对端是否提交了应用事务。我会保留不同错误状态，附上连接阶段和字节计数，由单一所有者关闭资源，并且只在应用幂等语义保证安全时重试。'
    topics: [foundations/network-programming]
    level: intermediate
    section: { en: 'Failure handling', zh: '故障处理' }
    frequency: common
    tags: [timeout, eof, reset, idempotency]

  - id: network-programming-backpressure
    question: { en: 'What does end-to-end backpressure require in a network service?', zh: '网络服务中的端到端背压需要覆盖哪些环节？' }
    answer:
      en: 'Socket backpressure begins when kernel send buffers fill: blocking writes wait, and nonblocking writes complete partially or would block. The service breaks that feedback if it keeps placing responses into an unbounded user-space queue. I put capacity limits on accepted connections, in-flight handlers, parsed messages, downstream calls, and outbound bytes. When a consumer slows, the producer pauses rather than spawning more work. The overload policy may reject, shed permitted data, or close a slow peer, but it must be explicit. I monitor queue depth, buffered bytes, and tail latency to tune those limits.'
      zh: '套接字背压始于内核发送缓冲区填满：阻塞写会等待，非阻塞写会部分完成或报告暂时不可写。服务若继续把响应塞入无界用户态队列，就切断了反馈。我会限制已接收连接、在途处理器、解析后消息、下游调用和待发送字节。消费者变慢时，生产者应暂停，而不是继续创建工作。过载策略可以拒绝、丢弃协议允许丢失的数据或关闭慢连接，但必须明确；再根据队列深度、缓冲字节和尾延迟调整限制。'
    topics: [foundations/network-programming]
    level: advanced
    section: { en: 'Capacity and backpressure', zh: '容量与背压' }
    frequency: common
    tags: [backpressure, capacity, nonblocking-io]

  - id: network-programming-address-candidates
    question: { en: 'Why should a client treat DNS results as connection candidates rather than one address?', zh: '客户端为什么应把DNS结果当作连接候选，而不是单个地址？' }
    answer:
      en: 'A host name can resolve to several IPv6 and IPv4 addresses whose reachability and latency differ. Trying only the first result turns one broken route into an application outage, while connecting to everything simultaneously wastes work. A mature client uses resolver ordering plus a bounded strategy such as staggered candidate attempts, cancels losers, and applies one overall deadline. I keep each candidate failure for diagnostics and record the selected address family. Resolution success, transport connection, TLS handshake, and application handshake remain separate phases because success at one does not guarantee the next.'
      zh: '一个主机名可能解析出多个IPv6与IPv4地址，各自的可达性和延迟不同。只尝试第一项，会让一条故障路径变成应用中断；同时连接全部地址又会浪费资源。成熟客户端会结合解析器顺序和错开的有界候选尝试，取消失败竞争者，并执行一个整体截止时间。我会保留每个候选的失败原因并记录最终地址族。解析成功、传输连接、TLS握手和应用握手仍是不同阶段，因为前一阶段成功不保证下一阶段成功。'
    topics: [foundations/network-programming]
    level: advanced
    section: { en: 'Connection establishment', zh: '连接建立' }
    frequency: occasional
    tags: [dns, ipv6, ipv4, happy-eyeballs]

  - id: websocket-handshake-subprotocol
    question: { en: 'How does a WebSocket opening handshake work, and what does subprotocol negotiation establish?', zh: 'WebSocket开启握手如何工作？子协议协商确定了什么？' }
    answer:
      en: 'On the classic HTTP/1.1 path, the client requests an upgrade and sends a random Sec-WebSocket-Key plus version 13. An accepting server returns 101 and computes Sec-WebSocket-Accept from that key and the protocol GUID. The accept value proves protocol awareness, not user identity. The client may also offer ordered Sec-WebSocket-Protocol values; the server selects at most one offered value, and both endpoints then use that application protocol. I separately verify TLS, Origin policy, authentication, and the selected protocol before marking the session ready.'
      zh: '在经典HTTP/1.1路径上，客户端请求升级，并发送随机的Sec-WebSocket-Key与版本13。服务端接受时返回101，并根据该key和协议GUID计算Sec-WebSocket-Accept。接受值证明对端理解协议，不代表用户身份。客户端还可以提供一组有顺序的Sec-WebSocket-Protocol值；服务端最多选择一个客户端提供的值，随后双方使用该应用协议。我会分别验证TLS、Origin策略、身份认证和所选协议，再把会话标为可用。'
    topics: [foundations/websocket]
    level: intermediate
    section: { en: 'Networking protocols', zh: '网络协议' }
    frequency: common
    tags: [websocket, handshake, subprotocol]

  - id: websocket-reconnect-delivery
    question: { en: 'Why is reconnecting a WebSocket not enough to recover message delivery?', zh: '为什么WebSocket重连不足以恢复消息交付？' }
    answer:
      en: 'A break tells the client that the transport ended, but not whether the server processed the last command. The server may have committed a side effect while its acknowledgement was lost. I reconnect with capped exponential backoff and jitter, then restore authentication and subscriptions before sending new work. Side-effecting commands carry stable idempotency keys so a retry returns the original result rather than repeating it. Server pushes use a confirmed resume cursor; if retained history no longer covers that cursor, the protocol requires a fresh snapshot instead of silently losing events.'
      zh: '连接中断只说明传输结束，不能说明服务端是否处理了最后一条命令。服务端可能已经提交副作用，只是确认在回程中丢失。我会用带随机扰动和上限的指数退避重连，然后先恢复认证与订阅，再发送新工作。有副作用的命令携带稳定幂等键，使重试返回原结果，而不是重复执行。服务器推送使用已确认的恢复游标；如果保留历史不再覆盖该游标，协议应要求获取新快照，不能静默丢失事件。'
    topics: [foundations/websocket]
    level: intermediate
    section: { en: 'Failure handling', zh: '故障处理' }
    frequency: common
    tags: [websocket, reconnect, idempotency]

  - id: websocket-backpressure
    question: { en: 'How do you apply backpressure to the classic WebSocket API?', zh: '怎样为经典WebSocket API实施背压？' }
    answer:
      en: 'The classic API queues data passed to send and exposes bufferedAmount as a snapshot; it has no standard drained event or automatic producer slowdown. I admit a send only while OPEN and while the encoded payload stays under a per-connection byte budget. The producer then pauses, rejects, coalesces replaceable state, or closes a persistently slow peer according to message semantics. Limits also cover inbound message size, concurrent handlers, and downstream calls. I test a peer that stops reading and monitor queued bytes and memory, because ordinary small messages rarely expose a missing bound.'
      zh: '经典API会把传给send的数据排队，并通过bufferedAmount提供快照；它没有标准排空事件，也不会自动让生产者减速。我只在连接处于OPEN且编码后负载不超过每连接字节预算时准入发送。随后根据消息语义暂停或拒绝生产者、合并可替换状态，或关闭持续缓慢的对端。上限还要覆盖入站消息大小、并发处理器和下游调用。我会让对端停止读取并监控排队字节与内存，因为普通小消息很难暴露缺失的边界。'
    topics: [foundations/websocket]
    level: advanced
    section: { en: 'Capacity and backpressure', zh: '容量与背压' }
    frequency: common
    tags: [websocket, backpressure, buffered-amount]

  - id: websocket-origin-auth
    question: { en: 'Which security checks belong at a browser WebSocket boundary?', zh: '浏览器WebSocket边界需要哪些安全检查？' }
    answer:
      en: 'I use wss and validate the browser Origin against an explicit allowlist before upgrade. Origin protects against a hostile page borrowing ambient credentials; it is not authentication and non-browser clients can forge it. Identity comes from a secure session, short-lived connection ticket, or bounded authentication exchange. Every message is size-limited, parsed against a schema, rate-limited, and authorized for its resource rather than trusting connection-time access forever. I keep long-lived tokens out of URLs and logs, expire unauthenticated connections quickly, and define close codes without exposing sensitive policy details.'
      zh: '我会使用wss，并在升级前按明确允许列表校验浏览器Origin。Origin用来防止恶意页面借用环境凭据，不是身份认证，非浏览器客户端也能伪造它。身份来自安全会话、短期连接票据或有界认证交换。每条消息都要限制大小、按schema解析、限制速率，并针对目标资源授权，不能永久信任连接时权限。我不会把长期令牌放进URL和日志，会迅速关闭未完成认证的连接，并定义不会泄露敏感策略细节的关闭状态码。'
    topics: [foundations/websocket]
    level: advanced
    section: { en: 'Protocol security', zh: '协议安全' }
    frequency: occasional
    tags: [websocket, origin, authorization]

  - id: linux-kernel-distribution-shell
    question: { en: 'How do the Linux kernel, a distribution, and a shell differ?', zh: 'Linux内核、发行版与Shell有什么区别？' }
    answer:
      en: 'Linux is the kernel: it schedules execution, manages memory and devices, implements filesystems and networking, and exposes system calls. A distribution combines a selected kernel with user-space libraries, package management, service management, defaults, and an update policy. A shell is one user-space command interpreter that starts programs and configures file descriptors for redirection and pipelines. These layers can vary independently. A Bash command copied from Ubuntu may fail on a minimal Fedora container even though both use Linux, because the available tools, paths, and service policy differ.'
      zh: 'Linux是内核，负责调度执行、管理内存与设备、实现文件系统和网络，并暴露系统调用。发行版把选定内核与用户空间库、包管理、服务管理、默认配置和更新策略组合起来。Shell只是一个用户空间命令解释器，负责启动程序，并为重定向和管道配置文件描述符。这些层可以独立变化。即使两个环境都使用Linux，从Ubuntu复制的Bash命令也可能在精简Fedora容器中失败，因为可用工具、路径与服务策略不同。'
    topics: [foundations/linux]
    level: beginner
    section: { en: 'Operating-system model', zh: '操作系统模型' }
    frequency: common
    tags: [linux, kernel, distribution, shell]

  - id: linux-directory-permissions
    question: { en: 'Why can a user sometimes delete a file they cannot read, or fail to delete one they own?', zh: '为什么用户有时能删除不可读文件，却无法删除自己拥有的文件？' }
    answer:
      en: 'Reading file contents is authorized against the file, while unlinking a name modifies its parent directory. Removing a directory entry therefore normally requires write and search permission on the parent, not read permission on the file. A sticky directory such as a shared temporary directory adds an ownership rule, and mounts or mandatory access control can add more restrictions. I inspect every path component with the process effective credentials and check ACLs and policy denials. File ownership alone does not settle whether the containing directory may be changed.'
      zh: '读取内容时，系统针对文件本身授权；删除名称时，系统修改的是父目录。移除目录项通常因此需要父目录的写入和搜索权限，而不要求文件可读。共享临时目录上的sticky bit会增加所有权规则，挂载选项或强制访问控制还可能继续限制。我会结合进程的有效凭据检查路径的每一级目录，并查看ACL与策略拒绝记录。仅凭文件所有权，无法判断能否修改所在目录。'
    topics: [foundations/linux]
    level: intermediate
    section: { en: 'Files and permissions', zh: '文件与权限' }
    frequency: common
    tags: [linux, permissions, directories, unlink]

  - id: linux-open-deleted-file
    question: { en: 'Why can df report a full filesystem when du cannot find the corresponding files?', zh: '为什么df可能报告文件系统已满，而du找不到对应文件？' }
    answer:
      en: 'du walks reachable directory entries and sums the blocks attributed to them. df reports allocation for the filesystem as a whole. If a process keeps a file open after its last directory entry is removed, that inode and its data remain allocated until the final open file description closes, but du can no longer reach it by name. I first confirm both commands refer to the same mount, then inspect open deleted files and identify the owning service. The safe remedy is usually to make that service close or reopen the file, not to manipulate its descriptor blindly.'
      zh: 'du遍历仍可从目录项到达的对象，并累计它们占用的块；df报告整个文件系统的分配情况。如果进程在最后一个目录项被删除后仍保持文件打开，inode与数据会一直分配到最后一个打开文件描述关闭，但du已无法通过名称找到它。我会先确认两个命令针对同一挂载点，再检查已删除但仍打开的文件并定位所属服务。安全修复通常是让该服务关闭或重新打开文件，而不是盲目操作描述符。'
    topics: [foundations/linux]
    level: intermediate
    section: { en: 'Files and storage', zh: '文件与存储' }
    frequency: common
    tags: [linux, file-descriptor, inode, disk-usage]

  - id: linux-graceful-process-stop
    question: { en: 'How do you design a reliable Linux service shutdown?', zh: '怎样设计可靠的Linux服务关闭流程？' }
    answer:
      en: 'I define one owner for shutdown and a catchable stop signal, usually SIGTERM. The service stops admitting work, cancels or drains operations according to their semantics, forwards termination to children, closes descriptors, and exits before an overall deadline. The supervisor waits and records the real exit status. If the deadline expires, it captures useful diagnostics and escalates to SIGKILL. I test shutdown during startup, active requests, dependency failure, and repeated signals. A vanished PID proves only termination; it does not prove that transactions committed or leases were released.'
      zh: '我会为关闭流程指定唯一所有者和可捕获的停止信号，通常是SIGTERM。服务先停止接收新工作，再按业务语义取消或排空操作，把终止信号转发给子进程，关闭描述符，并在总截止时间前退出。监督进程等待并记录真实退出状态。超时后，它先收集有效诊断，再升级到SIGKILL。我会测试启动中、请求处理中、依赖失败和重复信号下的关闭。PID消失只证明进程终止，不能证明事务已经提交或租约已经释放。'
    topics: [foundations/linux]
    level: advanced
    section: { en: 'Process lifecycle', zh: '进程生命周期' }
    frequency: common
    tags: [linux, signals, shutdown, process-reaping]

  - id: git-object-tree-commit
    question: { en: 'How do Git blobs, trees, commits, and references fit together?', zh: 'Git的blob、tree、commit与引用如何组合？' }
    answer:
      en: 'A blob stores file bytes without a path or file name. A tree gives those blobs and subtrees names and modes, so one root tree describes a project snapshot. A commit points to that root tree, lists parent commits, and records author, committer, and message metadata. A branch is a movable reference to a commit; HEAD normally refers symbolically to the checked-out branch. This separation lets identical content be reused and makes branches cheap names over one shared graph. I inspect the model with cat-file, ls-tree, and for-each-ref rather than editing files under .git directly.'
      zh: 'Blob只保存文件字节，不含路径或文件名。Tree为blob与子tree关联名称和模式，因此一个根tree就能描述项目快照。Commit指向根tree，列出父提交，并保存作者、提交者和消息元数据。分支是指向commit的可移动引用；HEAD通常以符号方式指向当前检出分支。这种分离让相同内容可以复用，也让分支成为同一张共享图上的轻量名称。我会用cat-file、ls-tree和for-each-ref检查模型，不会直接编辑 .git下的文件。'
    topics: [foundations/git-deep-dive]
    level: intermediate
    section: { en: 'Git data model', zh: 'Git数据模型' }
    frequency: common
    tags: [git, objects, references]

  - id: git-index-working-tree-head
    question: { en: 'What is Git’s index, and how does it differ from HEAD and the working tree?', zh: 'Git索引是什么？它与HEAD和工作树有何区别？' }
    answer:
      en: 'HEAD resolves to the current committed snapshot, the index describes the proposed next snapshot, and the working tree contains editable files. Git add reads a path’s current content into a blob and places that blob in the index; later edits remain only in the working tree until added again. That is why git diff shows unstaged changes while git diff --cached shows staged changes relative to HEAD. During conflicts, the index can hold base, ours, and theirs entries at stages 1, 2, and 3. Resolving and adding the file replaces them with one stage 0 entry.'
      zh: 'HEAD解析到当前已提交快照，索引描述下一候选快照，工作树则包含可编辑文件。Git add会读取路径的当前内容，写成blob并放入索引；之后的编辑只留在工作树，直到再次add。因此，git diff显示未暂存变化，而git diff --cached显示索引相对HEAD的已暂存变化。冲突时，索引可以在stage 1、2、3中分别保存基点、ours和theirs。解决文件并再次add后，这些条目会被一个stage 0条目替换。'
    topics: [foundations/git-deep-dive]
    level: intermediate
    section: { en: 'Git data model', zh: 'Git数据模型' }
    frequency: common
    tags: [git, index, working-tree]

  - id: git-merge-versus-rebase
    question: { en: 'What is the structural difference between merging and rebasing?', zh: '合并与变基在结构上有什么区别？' }
    answer:
      en: 'A true merge creates a commit with multiple parents after combining each tip’s changes relative to a merge base. Existing commits keep their identities, and the graph records where lines converged. Rebase instead reapplies commits unique to one branch onto a new base. Because parent IDs are part of commit content, the replacements normally get new IDs even when the final files match. I merge shared history unless a documented policy permits rewriting it, and I use rebase to organize private commits before publication. Force-with-lease is a conditional ref update, not team authorization to rewrite a branch.'
      zh: '真正的合并会根据合并基点组合两个端点的变化，再创建拥有多个父提交的commit。已有提交保持身份，图中也明确记录开发线的汇合点。变基则把某分支独有的提交重新应用到新基点。父提交标识属于commit内容，所以即使最终文件相同，替代提交通常也会获得新标识。除非书面策略允许重写，我会对共享历史使用合并，并只在发布前用变基整理私有提交。Force-with-lease是条件式引用更新，不是团队授权。'
    topics: [foundations/git-deep-dive]
    level: intermediate
    section: { en: 'History transformations', zh: '历史变换' }
    frequency: common
    tags: [git, merge, rebase]

  - id: git-reflog-recovery-limit
    question: { en: 'How would you recover a commit after an accidental reset, and what are reflog’s limits?', zh: '误执行reset后怎样恢复提交？Reflog有哪些限制？' }
    answer:
      en: 'I stop mutating the repository, inspect git reflog with dates, and identify the pre-reset commit from the operation, time, tree, and parent chain. I create a rescue branch at the verified full object ID before deciding whether to reset, cherry-pick, or merge anything. A reflog is local: another clone may not contain the same entries, and expiration plus garbage collection can eventually remove unreachable objects. It does not recover uncommitted working-tree bytes that Git never stored. For important history I rely on protected remote references or independent backups, not an assumed ninety-day recovery window.'
      zh: '我会先停止修改仓库，再带日期查看git reflog，并根据操作、时间、tree和父链找出reset前的commit。确认完整对象标识后，我先在该位置创建救援分支，再决定是否执行reset、cherry-pick或merge。Reflog只属于本地仓库，其他克隆未必有相同条目；条目过期与垃圾回收最终可能删除不可达对象。它也无法恢复Git从未存储的工作树字节。重要历史应依靠受保护的远端引用或独立备份，不能假定固定九十天的恢复窗口。'
    topics: [foundations/git-deep-dive]
    level: advanced
    section: { en: 'Failure recovery', zh: '故障恢复' }
    frequency: common
    tags: [git, reflog, recovery, reachability]

  - id: i18n-versus-localization
    question: { en: 'How do internationalization, localization, and a locale differ?', zh: '国际化、本地化与区域设置有什么区别？' }
    answer:
      en: 'Internationalization is the software design that separates messages, formatting rules, and writing direction from business logic. Localization supplies and validates those inputs for a particular market: translation is part of it, alongside terminology and layout review. A locale is a runtime convention used to select such behavior, usually represented by a BCP 47 tag that may include language, script, and region. It is not a user’s location and does not determine currency or time zone. I model those values separately and define a deterministic policy that resolves requested locales to catalogs the product actually deploys.'
      zh: '国际化是把消息、格式规则和书写方向从业务逻辑中分离的软件设计。本地化为特定市场填充并验证这些输入；翻译只是其中一部分，还包括术语与版式审查。区域设置是运行时选择相关行为的一组约定，通常用包含语言、书写系统和地区的BCP 47标签表示。它不是用户位置，也不能决定货币或时区。我会分别建模这些值，并用确定策略把请求区域设置解析到产品实际部署的目录。'
    topics: [foundations/i18n]
    level: beginner
    section: { en: 'Text and locale', zh: '文本与区域设置' }
    frequency: common
    tags: [i18n, localization, locale]

  - id: i18n-value-formatting-boundary
    question: { en: 'Why should locale, currency, and time zone be separate formatting inputs?', zh: '为什么区域设置、货币和时区应是独立的格式化输入？' }
    answer:
      en: 'They represent different facts. Locale controls presentation conventions such as separators and symbol placement; currency belongs to an order or quote; time zone comes from the user or event context. A Chinese-language user may pay euros while viewing an event in Paris time, so deriving one input from another loses valid states. I keep raw amounts paired with currency codes and preserve explicit time semantics, then format only at the display boundary. Server and client receive the same resolved inputs, and caches include every dimension that actually changes rendered output.'
      zh: '这些值表达不同事实。区域设置控制分隔符与符号位置等呈现约定；货币属于订单或报价；时区来自用户或事件上下文。中文用户完全可能用欧元付款并查看巴黎时间，从一个值推断另一个会丢失正常状态。我会保存带货币代码的原始金额和含义明确的时间数据，只在展示边界格式化。服务端与客户端接收同一组解析结果，缓存键也包含所有真正改变渲染输出的维度。'
    topics: [foundations/i18n]
    level: intermediate
    section: { en: 'Data and presentation', zh: '数据与呈现' }
    frequency: common
    tags: [intl, currency, time-zone]

  - id: i18n-message-plural-contract
    question: { en: 'How would you design and validate a message catalog with plurals?', zh: '怎样设计并验证包含复数的消息目录？' }
    answer:
      en: 'I use stable semantic keys and complete messages with named, typed placeholders, never translated fragments joined in source-language order. A plural-aware message selects a locale-defined category through the message runtime and always has an other branch; exact-number branches such as =0 are distinct from the zero category. At build time I compare catalog key sets, placeholder names and types, plural variables, and permitted rich-text slots. In development a miss fails visibly. Production may follow a short deterministic fallback chain, but it records the requested locale, selected catalog, and missing key for diagnosis.'
      zh: '我会使用稳定的语义键，以及带具名、类型明确占位符的完整消息，不会按源语言顺序拼接翻译片段。复数消息通过消息运行时选择区域规则定义的类别，并始终提供other；=0这样的精确分支与zero类别不同。构建时要比较目录键集合、占位符名称和类型、复数变量及允许的富文本槽位。开发环境让缺键明显失败；生产环境可以执行短而确定的回退链，但要记录请求区域设置、命中目录和缺失键。'
    topics: [foundations/i18n]
    level: intermediate
    section: { en: 'Message contracts', zh: '消息契约' }
    frequency: common
    tags: [messages, plurals, fallback]

  - id: i18n-rtl-bidi-review
    question: { en: 'What does correct RTL support require beyond setting dir="rtl"?', zh: '除了设置dir="rtl"，正确的RTL支持还需要什么？' }
    answer:
      en: 'The root lang and dir attributes must follow the same resolved locale, while layout uses CSS logical properties instead of left and right assumptions. Dynamic fragments such as names, URLs, and order IDs may have the opposite direction from surrounding text, so I isolate them with bdi or an equivalent mechanism. Icon mirroring is semantic: a back arrow may flip, while a play symbol or brand should not. I test keyboard and reading order, copying, selection, focus, and assistive technology with real RTL content because a mirrored screenshot cannot expose every bidirectional boundary defect.'
      zh: '根元素的lang与dir必须来自同一个已解析区域设置，布局则使用CSS逻辑属性，避免左右方向假设。姓名、URL和订单号等动态片段可能与周围文本方向相反，因此要用bdi或等效机制隔离。图标镜像取决于语义：返回箭头可能要翻转，播放符号与品牌通常不应翻转。我会用真实RTL内容测试键盘与朗读顺序、复制、选择、焦点和辅助技术，因为镜像截图无法暴露所有双向边界缺陷。'
    topics: [foundations/i18n]
    level: advanced
    section: { en: 'Bidirectional interfaces', zh: '双向界面' }
    frequency: occasional
    tags: [rtl, bidi, accessibility]

  - id: recursion-termination-proof
    question: { en: 'How do you prove that a recursive function terminates?', zh: '怎样证明一个递归函数会终止？' }
    answer:
      en: 'I first define the admitted input domain and every base case. Then I choose a well-founded measure, often a nonnegative integer such as remaining length or interval width. I show that the measure is valid on entry and strictly decreases on every recursive edge, not only the common branch. Because that measure cannot descend forever, execution must reach a boundary. For graphs, structural size alone is insufficient because edges may form cycles, so I mark identities before descent and use the finite set of reachable, unvisited nodes as the measure.'
      zh: '我会先定义接纳的输入域和所有基本情况，再选择一个良基度量，通常是剩余长度或区间宽度等非负整数。接着证明进入函数时度量有效，并且它会在每条递归边上严格减小，而不只是常见分支。由于该度量不可能无限下降，执行最终必然抵达边界。对于图，结构大小不足以证明终止，因为边可能形成环；因此我会在下降前标记节点身份，并把可达但尚未访问的有限节点集合用作度量。'
    topics: [foundations/recursion]
    level: intermediate
    section: { en: 'Algorithm correctness', zh: '算法正确性' }
    frequency: common
    tags: [recursion, termination, invariants]

  - id: recursion-time-versus-depth
    question: { en: 'Why are recursive running time and call depth different quantities?', zh: '为什么递归运行时间与调用深度是不同的量？' }
    answer:
      en: 'Running time depends on total calls and the work done in each call, while stack space depends on the maximum number of unfinished calls at once. A balanced tree traversal visits every node, so it takes O(n) time but only O(log n) call depth. A chain-shaped tree keeps O(n) time and raises depth to O(n). Naive Fibonacci has linear depth yet exponential total calls because its branches recompute overlapping states. I draw a call tree for work and follow one longest root-to-leaf path for depth, then include non-stack storage separately.'
      zh: '运行时间取决于调用总数和每次调用的工作量，栈空间则取决于同时尚未结束的最大调用数。平衡树遍历会访问所有节点，因此耗时为O(n)，调用深度只有O(log n)。链状树仍耗时O(n)，但深度升至O(n)。朴素Fibonacci的深度是线性的，总调用数却因分支重复计算重叠状态而呈指数增长。我会用调用树分析工作量，用最长的根到叶路径分析深度，再单独计算其他存储。'
    topics: [foundations/recursion]
    level: intermediate
    section: { en: 'Complexity analysis', zh: '复杂度分析' }
    frequency: common
    tags: [recursion, complexity, call-stack]

  - id: recursion-explicit-stack-conversion
    question: { en: 'How do you replace a recursive depth-first traversal with an explicit stack without changing behavior?', zh: '怎样把递归深度优先遍历改成显式栈，同时保持行为不变？' }
    answer:
      en: 'I identify what each recursive frame stores: the node, local accumulator, next child, and any work performed after the child returns. Pre-order traversal can process a node immediately and push its children from right to left so a LIFO stack preserves left-to-right visitation. Post-order traversal needs an explicit phase or next-child index to represent the return point. I also preserve duplicate handling, error timing, and partial-result rules. The explicit stack gets an application limit, and I compare both versions on small branching trees, chains, cycles, and failures before switching large inputs.'
      zh: '我先确定每个递归栈帧保存的内容，包括节点、局部累加器、下一个子节点，以及子调用返回后的工作。前序遍历可以立即处理节点，并从右向左压入子节点，让后进先出栈保持从左到右的访问顺序。后序遍历需要显式阶段或下一个子节点索引来表示返回位置。我还会保持重复节点处理、错误时机和部分结果规则，为显式栈设置应用级限制，并先在小型分支树、链、环和失败场景上对比两个版本。'
    topics: [foundations/recursion]
    level: intermediate
    section: { en: 'Traversal design', zh: '遍历设计' }
    frequency: occasional
    tags: [recursion, explicit-stack, traversal]

  - id: recursion-production-depth-failure
    question: { en: 'A recursive function passes tests but reaches RecursionError in production. How do you diagnose and fix it?', zh: '递归函数通过了测试，却在生产环境遇到RecursionError。你会怎样诊断和修复？' }
    answer:
      en: 'I capture the input shape and a bounded frame trace, then determine whether depth comes from a valid chain, a cycle, or a branch that fails to make progress. I state a termination measure and check it on every edge. Raising the recursion limit is not my default fix because it changes the guard without reducing frames or proving termination. I add cycle detection and business limits where required, then replace linear-depth recursion with an explicit stack for large or external input. Regression tests cover the exact boundary, a deeper chain, a self-cycle, and traversal order.'
      zh: '我会捕获输入形状和有界栈帧追踪，再判断深度来自有效长链、环，还是某条没有取得进展的分支。随后写出终止度量，并检查每条递归边。提高递归限制不是默认修复，因为它只改变防护值，既不减少栈帧，也不能证明终止。我会按业务需要增加环检测和资源限制，并对大型或外部输入把线性深度递归改成显式栈。回归测试要覆盖准确边界、更深的链、自环和遍历顺序。'
    topics: [foundations/recursion]
    level: advanced
    section: { en: 'Failure diagnosis', zh: '故障诊断' }
    frequency: common
    tags: [recursion, recursion-error, production-debugging]

  - id: algorithmic-complexity-asymptotic-bounds
    question: { en: 'How do Big O, Big Omega, and Big Theta differ, and why does a tight bound matter?', zh: '大O、大Omega与大Theta有什么区别？紧确界为什么重要？' }
    answer:
      en: 'Big O is an asymptotic upper bound, Big Omega is a lower bound, and Big Theta means matching upper and lower bounds up to constant factors beyond a threshold. A linear function is technically O(n²), so Big O alone may be true but uninformative. I prefer Theta when I can establish tight growth and state whether the claim is worst-case, expected, or amortized. I also define the input variable and cost model. The notation compares growth; it does not give milliseconds or erase constants that matter at supported input sizes.'
      zh: '大O表示渐近上界，大Omega表示下界，大Theta表示超过某个阈值后，上下界在常数因子范围内匹配。线性函数从技术上也属于O(n²)，因此只有大O的结论可能正确却没有信息量。能证明紧确增长时，我会优先使用Theta，并说明结论针对最坏、期望还是摊还情形。我还会定义输入变量与成本模型。记号用于比较增长，不会给出毫秒数，也不会消除在支持输入规模下仍然重要的常数。'
    topics: [foundations/algorithmic-complexity]
    level: beginner
    section: { en: 'Asymptotic notation', zh: '渐近记号' }
    frequency: common
    tags: [big-o, big-omega, big-theta]

  - id: algorithmic-complexity-derive-from-code
    question: { en: 'How do you derive a complexity bound from unfamiliar code?', zh: '怎样从陌生代码中推导复杂度界限？' }
    answer:
      en: 'I first define every independent input dimension and choose a meaningful operation to count. Then I trace sequential phases, loops, recursion, allocations, and calls whose own cost depends on input. Sequential costs add, nested full traversals usually multiply, and repeated constant-factor shrinking suggests logarithmic work, but I verify how indices move instead of judging indentation. I derive time and peak auxiliary space separately, simplify dominant terms, and label the relevant case and assumptions. Finally, I test operation counts or doubling ratios on boundary, representative, and adversarial shapes to challenge the model.'
      zh: '我先定义每个独立输入维度，并选择有意义的操作作为计数单元。随后追踪顺序阶段、循环、递归、分配，以及自身成本依赖输入的调用。顺序成本相加，完整遍历的嵌套通常相乘，按固定比例缩小问题通常表示对数工作；但我会检查索引如何移动，不会只凭缩进判断。我分别推导时间与峰值辅助空间，简化主导项，并标明相关情形与假设。最后用边界、代表性和对抗性输入的操作计数或翻倍比值检验模型。'
    topics: [foundations/algorithmic-complexity]
    level: beginner
    section: { en: 'Complexity analysis', zh: '复杂度分析' }
    frequency: common
    tags: [cost-model, input-size, code-reading]

  - id: algorithmic-complexity-case-analysis
    question: { en: 'How do worst-case, expected, and amortized complexity differ?', zh: '最坏情况、期望复杂度与摊还复杂度有什么区别？' }
    answer:
      en: 'Worst-case complexity bounds the most expensive valid input of a given size and is useful for deadlines or hostile input. Expected complexity averages under an explicit probability or data-structure assumption, such as randomized hashing; without that assumption the claim is incomplete. Amortized complexity instead bounds the total cost across any relevant operation sequence and spreads it over the operations, with no probability distribution required. A dynamic array append can therefore be worst-case O(n) during resize but amortized O(1) across many appends. I report whichever cases affect the product limit rather than presenting one label without context.'
      zh: '最坏情况复杂度限制某个规模下成本最高的有效输入，适合截止时间或恶意输入。期望复杂度依赖明确的概率或数据结构假设，例如随机化哈希；没有假设时，结论并不完整。摊还复杂度则限制任意相关操作序列的总成本，再分摊给各次操作，不需要概率分布。因此，动态数组追加在扩容时最坏可达O(n)，跨多次追加的摊还成本却是O(1)。我会报告真正影响产品限制的情形，而不是脱离上下文只给一个标签。'
    topics: [foundations/algorithmic-complexity]
    level: intermediate
    section: { en: 'Complexity analysis', zh: '复杂度分析' }
    frequency: common
    tags: [worst-case, expected-complexity, amortized-complexity]

  - id: algorithmic-complexity-engineering-choice
    question: { en: 'How would you choose between a constant-space quadratic duplicate check and a linear-space expected-linear check?', zh: '常数空间的二次重复项检查与线性空间、期望线性时间的检查之间应如何选择？' }
    answer:
      en: 'I start with the maximum and typical item counts, memory budget, latency target, and whether keys can be adversarial. Pairwise comparison is worst-case Θ(n²) time and Θ(1) auxiliary space; a hash set is expected Θ(n) time and Θ(n) space under its hashing contract. For tiny hard-bounded inputs, the simpler scan may win on constants and allocation. For growing inputs, the set usually provides safer scaling. I benchmark near the expected crossover with representative keys, test the no-duplicate worst path, bound accepted cardinality, and record the assumptions so later traffic changes trigger reevaluation.'
      zh: '我会先确认最大与典型元素数量、内存预算、延迟目标，以及键是否可能来自对抗性输入。成对比较的最坏时间为 Θ(n²)，辅助空间为 Θ(1)；在哈希约定下，集合的期望时间与空间都是 Θ(n)。如果输入很小且有硬上限，简单扫描可能凭常数和较少分配获胜；输入会增长时，集合通常更容易扩展。我会在预期交叉点附近使用代表性键做基准测试，检查无重复项的最坏路径，限制可接受基数，并记录假设，以便流量变化后重新评估。'
    topics: [foundations/algorithmic-complexity]
    level: intermediate
    section: { en: 'Engineering trade-offs', zh: '工程取舍' }
    frequency: common
    tags: [time-space-tradeoff, hash-set, capacity-planning]

  - id: sorting-searching-strategy-choice
    question: { en: 'When would you scan unsorted data instead of sorting it or building an index?', zh: '什么时候应扫描无序数据，而不是先排序或建立索引？' }
    answer:
      en: 'I start from the full operation mix. A scan is often right for one query, a small collection, frequently changing data, or a predicate that does not follow an existing order. It has a weak precondition and can stop after the first match. Sorting adds an upfront O(n log n) comparison cost but can support many ordered or range queries afterward. A hash index suits repeated exact-key lookup but consumes memory and needs updates. I compare builds, queries, mutations, and freshness requirements together, then measure representative data after the simplest correct design works.'
      zh: '我会先看完整的操作组合。只有一次查询、集合较小、数据频繁变化，或谓词不符合现有顺序时，扫描通常更合适；它的前置条件很弱，首次匹配后还能停止。排序会预付O(n log n) 的比较成本，但可支持之后的大量有序查询或范围查询。哈希索引适合反复进行精确键查找，却占用额外内存，也要随数据更新。我会一起比较构建、查询、修改和新鲜度要求，在最简单的正确设计完成后，再用代表性数据测量。'
    topics: [foundations/sorting-and-searching]
    level: beginner
    section: { en: 'Algorithm selection', zh: '算法选择' }
    frequency: common
    tags: [linear-search, sorting, indexing, complexity]

  - id: sorting-searching-comparator-contract
    question: { en: 'What must a comparator guarantee, and what extra guarantee does a stable sort provide?', zh: '比较函数必须保证什么？稳定排序还会提供什么额外保证？' }
    answer:
      en: 'A comparator returns a negative, zero, or positive result for before, equivalent in order, or after. Its answers must be consistent: self-comparison is equal, reversing arguments reverses the sign, and ordering is transitive. A stable sort preserves the input-relative order of distinct records that compare equal. Stability does not create a business tie-breaker or make unordered input deterministic. If pagination or reproducible output needs one total order, I add consistent secondary keys and usually a unique identifier. I also define null, missing, locale, and normalization behavior before sorting.'
      zh: '比较函数用负数、0或正数表示靠前、顺序等价或靠后，而且答案必须一致：与自身比较时相等，交换参数会翻转符号，顺序还要满足传递性。稳定排序会保留比较相等的不同记录在输入中的相对顺序，但不会生成业务上的同值排序条件，也不能让无序输入变得确定。如果分页或可重复输出需要全序，我会增加一致的次级键，通常最后使用唯一标识。排序前还要定义空值、字段缺失、区域规则和规范化行为。'
    topics: [foundations/sorting-and-searching]
    level: intermediate
    section: { en: 'Ordering contracts', zh: '顺序契约' }
    frequency: common
    tags: [comparator, stable-sort, total-order]

  - id: sorting-searching-lower-bound-proof
    question: { en: 'How does a lower-bound binary search work, and how do you argue that it is correct?', zh: '下界二分查找怎样工作？如何说明它是正确的？' }
    answer:
      en: 'I use a half-open interval [low, high). Every index below low is known to hold a key less than the target, while every index at or above high is known to hold a key at least the target. If the middle key is too small, low becomes middle plus one; otherwise high becomes middle because middle may be the answer. Both branches shrink the interval. When low equals high, the invariants meet at the first key not less than the target, or at the valid insertion position after the array. Sorting and searching must use the same key order.'
      zh: '我使用半开区间[low, high)。low之前的每个索引都已知小于目标，high及其后的位置都已知大于或等于目标。若中间键太小，就把low设为middle加1；否则把high设为middle，因为该位置仍可能是答案。两个分支都会缩小区间。low与high相等时，两条不变量在第一处不小于目标的键上相接；目标大于全部键时，该位置就是数组后的有效插入点。排序与查找必须采用相同键顺序。'
    topics: [foundations/sorting-and-searching]
    level: intermediate
    section: { en: 'Search invariants', zh: '查找不变量' }
    frequency: common
    tags: [binary-search, lower-bound, loop-invariant]

  - id: sorting-searching-duplicate-range
    question: { en: 'How would you return every record whose sorted key lies in a requested range?', zh: '怎样返回有序键位于指定范围内的全部记录？' }
    answer:
      en: 'I define endpoint semantics first. For a half-open range [minimum, maximum), I run lower bound twice: once for the first key at least minimum and once for the first key at least maximum, then slice between those positions. For an inclusive maximum, the second search is upper bound, the first key greater than maximum. This handles duplicate boundary keys without scanning unrelated values. I test empty input, equal endpoints, bounds before and after the data, and duplicate runs at both ends. The sorted snapshot must remain valid under the same comparison policy during the query.'
      zh: '我会先定义端点语义。对于半开范围[minimum, maximum)，下界查找执行两次：先找第一处不小于minimum的键，再找第一处不小于maximum的键，最后截取两者之间的切片。如果maximum也包含在结果中，第二次应使用上界，也就是第一处大于maximum的键。这样能处理边界上的重复键，而不扫描无关值。我会测试空输入、相等端点、数据前后的边界，以及两端连续重复项；查询期间有序快照还必须遵守同一比较策略。'
    topics: [foundations/sorting-and-searching]
    level: intermediate
    section: { en: 'Range queries', zh: '范围查询' }
    frequency: occasional
    tags: [binary-search, lower-bound, upper-bound, duplicates]

  - id: http-semantics-safe-idempotent
    question: { en: 'What is the difference between a safe HTTP method and an idempotent one?', zh: '安全HTTP方法与幂等方法有什么区别？' }
    answer:
      en: 'A safe method asks for read-only semantics: the client is not requesting a resource-state change, although logging or metrics can still occur. An idempotent method can change state, but repeating the same request has the same intended effect as sending it once. Every safe method is idempotent, but DELETE and PUT are idempotent without being safe. Idempotency does not require identical responses; an initial PUT can return 201 and a repeat 204. I use these properties to design retries, tests, and intermediary behavior, then add any narrower application guarantees explicitly.'
      zh: '安全方法要求只读语义：客户端没有请求改变资源状态，但日志或指标等附带影响仍可发生。幂等方法可以改变状态，不过重复同一请求的预期效果与只发送一次相同。所有安全方法都幂等，但DELETE和PUT幂等却不安全。幂等性不要求响应完全相同；首次PUT可以返回201，重复请求则返回204。我会用这些属性设计重试、测试和中间节点行为，再明确补充应用层更窄的保证。'
    topics: [foundations/http-semantics]
    level: beginner
    section: { en: 'HTTP contracts', zh: 'HTTP约定' }
    frequency: common
    tags: [safe-method, idempotency, methods]

  - id: http-semantics-ambiguous-timeout
    question: { en: 'How should a client react when a write times out before any response arrives?', zh: '写请求在收到响应前超时时，客户端应如何处理？' }
    answer:
      en: 'I preserve the result as unknown because a timeout reports missing progress, not transaction rollback. The request might not have arrived, might still be running, or might have committed while its response was lost. I replay automatically only when the method and application contract make that safe, the body is reproducible, and the retry remains inside a capped attempt and deadline budget. For a non-idempotent operation, I use a stable server-enforced idempotency key or query an operation identifier. Backoff and jitter protect capacity, but they do not solve duplicate effects.'
      zh: '我会把结果保留为未知，因为超时表示没有按期取得进展，不表示事务已经回滚。请求可能尚未到达、仍在运行，也可能已经提交而响应丢失。只有当方法和应用约定允许安全重放、请求体可以重现，而且重试仍在尝试次数与总截止时间预算内时，我才会自动重试。非幂等操作需要稳定且由服务端强制执行的幂等键，或通过操作标识符查询结果。退避与抖动能保护容量，却不能解决重复副作用。'
    topics: [foundations/http-semantics]
    level: intermediate
    section: { en: 'Retries and failure', zh: '重试与故障' }
    frequency: common
    tags: [timeout, retry, ambiguous-commit, idempotency]

  - id: http-semantics-cache-validation
    question: { en: 'Explain a conditional GET that receives 304 Not Modified.', zh: '请解释收到304 Not Modified的条件式GET。' }
    answer:
      en: 'A cache first stores a successful GET representation and its validator, commonly an ETag. Once reuse requires validation, it sends If-None-Match with that tag. If the selected current representation still matches, the server returns 304 without representation content. The cache retains its stored content, updates metadata permitted by the validation response, and serves the combined result. If the tag does not match, the server normally returns 200 with the new representation. This is why 304 is not an empty 200, and why a client with no stored response cannot use it as content.'
      zh: '缓存先保存成功GET的表示及其验证器，通常是ETag。需要验证后才能复用时，它会用If-None-Match发送该标签。如果选定的当前表示仍然匹配，服务端就返回不带表示内容的304。缓存保留已存内容，用验证响应允许的元数据更新它，再提供组合后的结果。标签不匹配时，服务端通常返回带有新表示的200。因此，304不是空的200，没有已存响应的客户端也不能把它当作内容使用。'
    topics: [foundations/http-semantics]
    level: beginner
    section: { en: 'Caching and validators', zh: '缓存与验证器' }
    frequency: common
    tags: [conditional-get, etag, status-304, caching]

  - id: http-semantics-message-connection-boundary
    question: { en: 'Why is an HTTP message boundary different from a connection boundary?', zh: '为什么HTTP消息边界不同于连接边界？' }
    answer:
      en: 'A connection is a transport session, while requests and responses are protocol messages carried by it. HTTP/1.1 can send several exchanges sequentially on one persistent connection, so content length, transfer coding, method, and status rules frame each message without waiting for EOF. HTTP/2 carries multiple concurrent streams on one connection and gives stream failures a narrower scope than connection failures. Closing or replacing a connection therefore says nothing conclusive about an application commit. I keep connection, stream, request-attempt, and idempotency identifiers distinct in logs and retry decisions.'
      zh: '连接是传输会话，请求与响应则是由它承载的协议消息。HTTP/1.1可以在一个持久连接上依次发送多次交互，因此要用内容长度、传输编码、方法和状态规则划分消息，而不能等待EOF。HTTP/2在一个连接上承载多个并发流，流故障的作用域小于连接故障。因此，关闭或更换连接不能说明应用是否提交。我会在日志与重试决策中区分连接、流、请求尝试和幂等标识符。'
    topics: [foundations/http-semantics]
    level: intermediate
    section: { en: 'Protocol boundaries', zh: '协议边界' }
    frequency: occasional
    tags: [message-framing, persistent-connection, http2, observability]

  - id: arrays-linked-lists-tradeoff
    question: { en: 'How do you choose between an array and a linked list?', zh: '怎样在数组与链表之间选择？' }
    answer:
      en: 'I start from the operations and their inputs. Arrays give constant-time access by index, compact traversal, and amortized constant-time append in a dynamic implementation, but middle insertion shifts a suffix. A linked list reaches a numeric position linearly, yet can insert or remove with a fixed number of link updates when the required node or predecessor is already known. I also include memory: every node has links and usually a separate allocation, while an array may hold unused capacity. I default to the standard dynamic array, then benchmark another representation only when the workload justifies it.'
      zh: '我会先确认实际操作及其输入。数组支持按索引常数时间访问、紧凑遍历；动态数组的追加摊还为常数时间，但中部插入要移动后缀。链表按数字位置访问需要线性遍历，不过在所需节点或前驱已经确定时，插入与删除只需固定数量的链接更新。我还会计算内存：每个节点都带链接且通常单独分配，数组则可能保留空余容量。默认先使用标准动态数组，只有工作负载确实需要时，才对其他表示进行基准测试。'
    topics: [foundations/arrays-and-linked-lists]
    level: beginner
    section: { en: 'Data-structure choice', zh: '数据结构选择' }
    frequency: common
    tags: [arrays, linked-lists, tradeoffs]

  - id: linked-list-insertion-precondition
    question: { en: 'Why is “linked-list insertion is O(1)” an incomplete claim?', zh: '为什么“链表插入是O(1)”并不完整？' }
    answer:
      en: 'The constant-time part is pointer rewiring after the correct location is known. If an API receives an index or a value, a plain linked list normally walks from an endpoint to find the predecessor, which costs O(n). In a singly linked list, deleting a target node may still require its predecessor. I state the precondition explicitly: insert after this known node, or remove this known doubly linked node. If a map supplies node handles, I include its memory and consistency costs. Complexity should describe the caller’s whole operation, not only the last assignments.'
      zh: '常数时间只描述位置确定后的指针改链。如果API接收索引或元素值，普通链表通常要从端点开始寻找前驱，这一步是O(n)。在单向链表中，即使目标节点已知，删除时仍可能需要前驱。我会明确写出前置条件，例如“在这个已知节点后插入”，或者“移除这个已知双向节点”。如果另一个映射提供节点句柄，还要计入它的内存与一致性成本。复杂度应覆盖调用方的完整操作，不能只描述最后几次赋值。'
    topics: [foundations/arrays-and-linked-lists]
    level: intermediate
    section: { en: 'Complexity contracts', zh: '复杂度契约' }
    frequency: common
    tags: [linked-lists, insertion, complexity]

  - id: dynamic-array-resize-latency
    question: { en: 'How can dynamic-array append be amortized O(1) when a resize is O(n)?', zh: '动态数组的一次扩容是O(n)，为什么追加仍可摊还为O(1)？' }
    answer:
      en: 'A dynamic array keeps spare capacity, so most appends write one unused slot. When capacity is exhausted, it allocates a larger backing area and moves the existing elements, making that particular append O(n). With geometric growth, such as doubling, the moves across a long sequence form a geometric series whose total is proportional to the number of successful appends. That gives constant amortized cost, not constant worst-case latency. If one slow append violates a deadline, I reserve known capacity or choose a bounded or chunked structure and measure its memory tradeoff.'
      zh: '动态数组会保留空余容量，所以多数追加只写入一个未用槽位。容量耗尽时，它分配更大的底层区域并移动已有元素，因此那一次追加是O(n)。若容量按几何比例增长，例如每次翻倍，那么长操作序列中的移动次数构成几何级数，总量与成功追加次数成正比。这得到的是摊还常数成本，不是单次最坏延迟恒定。如果某次慢追加会违反截止时间，我会预留已知容量，或选择有界、分块结构，并测量相应的内存取舍。'
    topics: [foundations/arrays-and-linked-lists]
    level: intermediate
    section: { en: 'Growth and latency', zh: '增长与延迟' }
    frequency: common
    tags: [dynamic-array, capacity, amortization]

  - id: arrays-lists-locality-memory
    question: { en: 'How do cache locality and memory overhead affect the array-versus-list choice?', zh: '缓存局部性与内存开销怎样影响数组和链表的选择？' }
    answer:
      en: 'Sequential array slots are commonly near one another, so cache-line fetches and prefetching can serve several upcoming accesses. Separately allocated list nodes carry one or two links and the next address is known only after reading the current node, which can make traversal allocation- and cache-heavy despite the same O(n) label. I avoid universal ratios because element shape, allocator, runtime, and hardware change the result. I write a byte model with slot size, capacity slack, link fields, headers, and alignment, then confirm it with a heap profile and representative traversal benchmark.'
      zh: '连续数组槽位通常彼此相邻，因此一次缓存行读取与硬件预取可以服务接下来的多个访问。单独分配的链表节点带有一或两个链接，而且只有读完当前节点才能知道下一个地址；即使同为O(n)，遍历仍可能承担更多分配与缓存成本。我不会给出通用速度比例，因为元素形状、分配器、运行时和硬件都会改变结果。我会先按槽位大小、空余容量、链接字段、对象头与对齐建立字节模型，再用堆剖析和代表性遍历基准确认。'
    topics: [foundations/arrays-and-linked-lists]
    level: advanced
    section: { en: 'Memory behavior', zh: '内存行为' }
    frequency: occasional
    tags: [cache-locality, memory, allocation]

  - id: virtual-memory-address-translation
    question: { en: 'What does virtual memory add between a program address and physical RAM?', zh: '虚拟内存在程序地址与物理RAM之间增加了什么？' }
    answer:
      en: 'A program issues virtual addresses inside its process address space. The processor checks a cached translation or walks page tables, which map a virtual page to a physical frame and carry access permissions. If no usable present entry exists, a page fault transfers control to the kernel. The kernel may supply an anonymous page, find a cached file page, restore swapped data, perform copy-on-write, or reject the access. This layer provides relocation, protection, sparse reservation, and controlled sharing. It does not promise that every mapped byte is resident or that address-space capacity equals available RAM.'
      zh: '程序使用所属进程地址空间中的虚拟地址。处理器先检查缓存的地址转换，或者遍历页表；页表把虚拟页映射到物理页框，同时携带访问权限。如果没有可用的现存页表项，缺页会把控制交给内核。内核可能提供匿名页、找到已缓存文件页、恢复换出数据、执行写时复制，或者拒绝访问。这层机制提供重定位、保护、稀疏预留和受控共享，却不保证每个映射字节都已驻留，也不表示地址空间容量等于可用RAM。'
    topics: [foundations/virtual-memory]
    level: intermediate
    section: { en: 'Address translation', zh: '地址转换' }
    frequency: common
    tags: [virtual-memory, page-tables, address-space]

  - id: virtual-memory-rss-growth
    question: { en: 'How would you decide whether rising RSS is an application memory leak?', zh: '怎样判断RSS上升是否表示应用内存泄漏？' }
    answer:
      en: 'I first keep the scope consistent: one process generation, cgroup, namespace, and workload interval. Then I compare virtual mappings, RSS, proportional set size, private dirty pages, allocator or heap profiles, cache ownership, and cgroup charge on one timeline. Rising RSS can come from live objects, allocator arenas retained for reuse, file cache, first-touch pages, or copy-on-write, so one snapshot is not proof. I reduce load or force a controlled lifecycle boundary and observe what ownership disappears and what the kernel can reclaim under pressure. The fix follows the retaining owner, not the largest headline number.'
      zh: '我会先统一观察范围：同一进程代次、cgroup、命名空间和工作负载区间。随后在一条时间线上比较虚拟映射、RSS、比例集大小、私有脏页、分配器或堆分析、缓存所有权与cgroup记账。RSS上升可能来自存活对象、分配器保留待复用的arena、文件缓存、首次触页或写时复制，因此单次快照不能证明泄漏。我会降低负载或设置可控生命周期边界，观察哪些所有权消失，以及内核在压力下能回收什么。修复应针对保留数据的所有者，而不是最大的概要数字。'
    topics: [foundations/virtual-memory]
    level: intermediate
    section: { en: 'Memory diagnosis', zh: '内存诊断' }
    frequency: common
    tags: [rss, memory-leak, diagnostics]

  - id: virtual-memory-failure-classes
    question: { en: 'How do minor faults, major faults, invalid access, and OOM differ?', zh: '次缺页、主缺页、非法访问与OOM有什么区别？' }
    answer:
      en: 'A minor fault needs kernel work but not storage I/O for the missing page, while a major fault requires I/O under the operating system’s accounting definition. Both may be recoverable and restart the instruction. Invalid access means the address has no permitted mapping; Linux commonly reports SIGSEGV or SIGBUS with fault metadata. OOM is a resource-policy outcome after reclaim cannot satisfy a request under system or cgroup constraints, and the kernel may kill a selected process. I preserve the exact counter, signal, exception, cgroup event, and map around the fault instead of calling every case “out of memory.”'
      zh: '次缺页需要内核处理，但按照操作系统的统计定义，不需要为缺失页执行存储I/O；主缺页则需要I/O。两者都可能恢复并重试指令。非法访问表示该地址没有允许当前操作的映射；Linux通常以带故障元数据的SIGSEGV或SIGBUS报告。OOM是资源策略结果：在系统或cgroup约束下，回收仍无法满足请求时，内核可能终止选中的进程。我会保留准确计数器、信号、异常、cgroup事件和故障附近映射，不会把所有情况都称作“内存不足”。'
    topics: [foundations/virtual-memory]
    level: intermediate
    section: { en: 'Failure diagnosis', zh: '故障诊断' }
    frequency: common
    tags: [page-faults, oom, signals]

  - id: virtual-memory-copy-on-write-budget
    question: { en: 'Why can memory usage rise sharply after fork even with copy-on-write?', zh: '有写时复制时，为什么fork后的内存用量仍可能快速上升？' }
    answer:
      en: 'Copy-on-write avoids eagerly copying private pages at fork. Parent and child can initially map the same physical backing with permissions that fault on a later write. When either process modifies a page, the kernel must preserve private contents, so sharing falls and aggregate physical charge can grow. A large resident heap becomes expensive if both sides dirty many pages, and runtime housekeeping may write pages the application expected to stay shared. I measure proportional and private memory before and after the fork workload, include cgroup accounting, and use a supported spawn-and-exec path when the child does not need the inherited runtime state.'
      zh: '写时复制避免在fork时立即复制全部私有页。父子进程最初可以映射相同物理后备，并通过会在后续写入时触发故障的权限保持私有语义。任一进程修改页面后，内核都必须保留各自内容，因此共享程度下降，物理内存汇总记账可能上升。若父子双方弄脏大型驻留堆中的许多页，成本会很高；运行时维护也可能写入应用原以为会保持共享的页。我会测量fork工作负载前后的比例内存与私有内存，纳入cgroup记账；子进程不需要继承运行时状态时，则使用受支持的启动并立即执行路径。'
    topics: [foundations/virtual-memory]
    level: advanced
    section: { en: 'Process memory', zh: '进程内存' }
    frequency: occasional
    tags: [copy-on-write, fork, memory-budget]

  - id: shell-expansion-to-argv
    question: { en: 'How do you reason from shell source text to the arguments an external program receives?', zh: '怎样从Shell源文本推导外部程序最终收到的参数？' }
    answer:
      en: 'I separate parsing from execution. First I identify operators, quote context, and shell words. Then I trace parameter, arithmetic, and command substitutions, followed where eligible by word splitting and pathname expansion, and finally quote removal. The result is an argument vector, not the original command-line string. I write each final argument on its own line and include empty arguments. For uncertain code, I replace the target temporarily with a function that prints its count and quoted arguments, then test spaces, wildcard characters, newlines, and leading hyphens in a controlled directory.'
      zh: '我会把解析与执行分开。先识别运算符、引用上下文和Shell单词，再追踪参数展开、算术展开与命令替换；适用时继续追踪单词拆分和路径名展开，最后处理引号删除。结果是参数向量，而不是原始命令行字符串。我会把每个最终参数单独写出，并保留空参数。遇到不确定代码时，我会暂时用一个打印参数数量和引用后参数的函数代替目标命令，再在受控目录中测试空格、通配符、换行与前导连字符。'
    topics: [foundations/shell-basics]
    level: beginner
    section: { en: 'Shell parsing', zh: 'Shell解析' }
    frequency: common
    tags: [shell, expansion, argument-vector, quoting]

  - id: shell-forward-all-arguments
    question: { en: 'Why is quoted "$@" the normal way for a Bash function to forward arguments?', zh: '为什么Bash函数通常要用带双引号的 "$@" 转发参数？' }
    answer:
      en: 'Inside double quotes, "$@" expands every positional parameter as a separate word. It therefore preserves the caller’s argument count, spaces inside one argument, and empty arguments. Unquoted $@ exposes values to word splitting and pathname expansion, while "$*" joins all parameters into one word using the first character of IFS. I verify a forwarding wrapper with at least an empty argument, a value containing spaces, a literal asterisk, and a leading-hyphen value. The wrapped command may still need an option terminator because quoting does not stop option parsing.'
      zh: '位于双引号内时，"$@" 会把每个位置参数展开成独立单词，因此能保留调用方的参数数量、单个参数内的空格与空参数。未引用的 $@ 会让值继续参与单词拆分和路径名展开，"$*" 则使用IFS的第一个字符把全部参数连接成一个单词。我会至少使用空参数、带空格的值、字面量星号和前导连字符值验证转发包装器。被包装命令仍可能需要选项终止符，因为引用不会停止选项解析。'
    topics: [foundations/shell-basics]
    level: beginner
    section: { en: 'Argument boundaries', zh: '参数边界' }
    frequency: common
    tags: [shell, positional-parameters, quoting, option-terminator]

  - id: shell-status-and-pipefail
    question: { en: 'How do exit status, pipelines, and pipefail affect shell error handling?', zh: '退出状态、管道与pipefail会怎样影响Shell错误处理？' }
    answer:
      en: 'Zero conventionally means success; each command documents its nonzero outcomes. The special parameter $? is volatile, so I capture it immediately or put the command directly in an if condition. A Bash pipeline normally reports its last stage, which can hide an earlier failure. With pipefail, it reports the rightmost nonzero stage, but early consumer exit can make a producer receive SIGPIPE intentionally. I choose the policy per pipeline, preserve diagnostic output, and force every stage to fail in tests. I do not treat set -e as exception handling because its behavior depends on grammar context.'
      zh: '按照约定，零表示成功，每条命令会定义自己的非零结果。特殊参数 $? 很容易被覆盖，因此我会立即保存它，或者直接把命令放进if条件。Bash管道通常报告最后一个阶段，可能掩盖前面阶段的失败。启用pipefail后，管道报告最靠右的非零阶段，但使用方提前退出也可能让生产方按预期收到SIGPIPE。我会为每条管道单独选择策略，保留诊断输出，并在测试中强制每个阶段失败。set -e的行为依赖语法上下文，因此我不会把它当成异常处理。'
    topics: [foundations/shell-basics]
    level: intermediate
    section: { en: 'Failure handling', zh: '失败处理' }
    frequency: common
    tags: [shell, exit-status, pipelines, pipefail]

  - id: shell-review-destructive-command
    question: { en: 'How do you review a generated shell command that deletes files?', zh: '怎样审查一条会删除文件的生成Shell命令？' }
    answer:
      en: 'I begin with authority and recovery, not only quoting. I identify who controls every input, require the narrowest accepted identifier or path, and reject empty, root, relative, or out-of-scope targets as the contract demands. Then I derive the exact operand array, confirm option termination, and examine glob, symlink, mount, and race behavior. I run the selection logic without mutation against spaces, wildcards, and leading-hyphen names in a temporary tree. Before unattended use, I require a bounded deletion scope, useful diagnostics, preserved failure status, an idempotent cleanup path, and a tested restore or rollback method.'
      zh: '我会先检查权限与恢复，而不只检查引用。首先确认每项输入由谁控制，根据契约只接受最窄的标识或路径，并拒绝空目标、根目录、相对路径与范围外目标。随后推导准确操作数数组，确认选项终止位置，再检查通配符、符号链接、挂载点与竞争行为。我会在临时目录树中，用空格、通配符和前导连字符名称运行不修改数据的选择逻辑。无人值守运行前，还要具备有界删除范围、有效诊断、保留的失败状态、幂等清理路径，以及经过测试的恢复或回滚方法。'
    topics: [foundations/shell-basics]
    level: intermediate
    section: { en: 'Safe automation', zh: '安全自动化' }
    frequency: common
    tags: [shell, deletion, validation, rollback]

  - id: processes-threads-boundary-choice
    question: { en: 'How do you choose between a process and a thread for concurrent work?', zh: '如何为并发工作选择进程或线程？' }
    answer:
      en: 'I start with the required boundary. A process normally gives a separate virtual address space, identity, resource table, and independently observable exit, so it is useful for fault containment, privilege separation, or independent deployment. Threads share a process and can communicate through shared memory with lower transfer cost, but they also share corruption and resource pressure. I then account for runtime rules, serialization or locking cost, startup rate, maximum concurrency, and shutdown. I choose from measured workload and ownership needs rather than assuming threads are always faster.'
      zh: '我会先确定所需边界。进程通常拥有独立虚拟地址空间、身份、资源表和可单独观察的退出状态，因此适合隔离故障、分离权限或独立部署。线程共享同一进程，可以较低传输成本通过共享内存通信，但也会共同承受内存破坏与资源压力。随后我会分析运行时规则、序列化或加锁成本、启动速率、最大并发量与关闭流程，并根据实测工作负载和所有权需求选择，不会预设线程总是更快。'
    topics: [foundations/processes-and-threads]
    level: intermediate
    section: { en: 'Operating-system concurrency', zh: '操作系统并发' }
    frequency: common
    tags: [processes, threads, isolation, tradeoffs]

  - id: processes-threads-race-invariant
    question: { en: 'Why is making a counter atomic not enough to make a shared operation thread-safe?', zh: '为什么把计数器改成原子变量，仍不足以让共享操作具备线程安全性？' }
    answer:
      en: 'An atomic counter protects only the specified counter operation. A business transition may also check capacity, reserve an item, update a balance, and append a ledger entry. Other threads can interleave between those individually atomic steps and observe or create an invalid combination. I write the invariant first, identify every state field and access path that participates, then protect the whole transition with one ownership rule. That may be a mutex, an atomic compare-and-exchange protocol, or a single-owner queue. Tests exercise adverse interleavings, but the synchronization argument establishes correctness.'
      zh: '原子计数器只保护指定的计数操作。一次业务状态转换还可能检查容量、预留元素、更新余额并追加账本记录，其他线程能够在这些分别原子的步骤之间插入，观察或产生无效组合。我会先写出不变量，找出参与其中的每个状态字段与访问路径，再用同一项所有权规则保护完整转换。实现可以采用互斥锁、原子比较交换协议或单一所有者队列。测试用于覆盖不利交错，但同步论证才真正建立正确性。'
    topics: [foundations/processes-and-threads]
    level: intermediate
    section: { en: 'Synchronization', zh: '同步' }
    frequency: common
    tags: [race-condition, atomics, mutex, invariants]

  - id: processes-threads-graceful-lifecycle
    question: { en: 'What lifecycle contract should a bounded worker pool define?', zh: '有界工作池应定义怎样的生命周期契约？' }
    answer:
      en: 'The pool needs a hard worker limit, bounded admission, and an explicit overflow policy. Its owner defines creation failure, result delivery, worker crash, timeout, cancellation, and whether queued work may be abandoned. Graceful shutdown first stops admission, requests cancellation, lets safe in-flight work finish, closes channels, and joins workers within a deadline before escalating. Joining observes termination; it does not itself request it. I also specify result ordering and partial-failure semantics, then test shutdown while workers are blocked, starting, finishing, and reporting an error.'
      zh: '工作池需要明确工作单元硬上限、有界准入与溢出策略。所有者要定义创建失败、结果交付、工作单元崩溃、超时、取消，以及排队任务能否放弃。优雅关闭先停止准入、请求取消、允许安全的进行中工作结束、关闭通道，再在截止时间内等待所有工作单元，必要时升级终止手段。等待只能观察终止，本身不会请求终止。我还会规定结果顺序与部分失败语义，并测试工作单元阻塞、启动、结束和报错时的关闭行为。'
    topics: [foundations/processes-and-threads]
    level: intermediate
    section: { en: 'Lifecycle and shutdown', zh: '生命周期与关闭' }
    frequency: common
    tags: [worker-pool, shutdown, cancellation, join]

  - id: processes-threads-intermittent-race
    question: { en: 'How do you investigate an intermittent process or thread concurrency failure?', zh: '如何调查间歇出现的进程或线程并发故障？' }
    answer:
      en: 'I begin with the violated invariant and build a timeline using monotonic timestamps, process and thread identities, message IDs, lock waits, cancellation requests, and exits. I enumerate every path that touches the state and mark the happens-before edge that should order each conflicting access. Then I force delayed messages, creation failure, worker crashes, and cancellation at boundary points. Race detectors, thread sanitizers, and scheduler traces can expose evidence, but only for exercised paths. Once I reproduce one failing schedule, I minimize it and keep it as a deterministic regression test.'
      zh: '我会先写明遭到违反的不变量，再用单调时间戳、进程与线程身份、消息标识、锁等待、取消请求和退出事件建立时间线。随后枚举访问相关状态的所有路径，标出本应为每组冲突访问建立顺序的先发生边。接着在边界强制制造消息延迟、创建失败、工作单元崩溃与取消。竞态检测器、线程消毒器和调度追踪可以暴露证据，但只覆盖实际执行路径。复现一条失败调度后，我会缩减它，并保留为确定性回归测试。'
    topics: [foundations/processes-and-threads]
    level: advanced
    section: { en: 'Concurrency diagnosis', zh: '并发诊断' }
    frequency: occasional
    tags: [race-condition, diagnosis, happens-before, tracing]

  - id: tls-chain-versus-hostname
    question: { en: 'Why are certificate-chain validation and hostname verification separate TLS checks?', zh: '为什么证书链校验与主机名校验是两项独立的TLS检查？' }
    answer:
      en: 'Chain validation asks whether signatures and certificate constraints lead from the presented leaf to a trust anchor the client already accepts. Hostname verification asks whether that leaf covers the reference service identity, normally the hostname from the original URL or configuration. A perfectly trusted certificate for payments.example must still fail for login.example, and a certificate naming login.example must fail if it chains only to an unknown root. I preserve the original name through DNS and routing, pass it as SNI and the verification input, and require both checks before sending credentials.'
      zh: '证书链校验会检查签名和证书约束，判断所提供叶证书能否到达客户端预先接受的信任锚。主机名校验则判断叶证书是否覆盖参考服务身份，该身份通常来自原始URL或配置。即使证书链完全受信，payments.example的证书用于login.example时仍必须失败；证书包含login.example，但只能连接到未知根时也必须失败。我会让原始名称经过DNS与路由后保持不变，把它同时用于SNI和校验，并在发送凭据前要求两项检查都成功。'
    topics: [foundations/tls-connections]
    level: intermediate
    section: { en: 'Connection security', zh: '连接安全' }
    frequency: common
    tags: [tls, certificate-chain, hostname-verification]

  - id: tls13-authenticated-key-agreement
    question: { en: 'How does a TLS 1.3 handshake combine key agreement with server authentication?', zh: 'TLS 1.3握手如何结合密钥协商与服务器认证？' }
    answer:
      en: 'Client and server exchange ephemeral Diffie-Hellman public shares and independently derive the same shared input. Key agreement alone is not authentication because an attacker could negotiate a different secret with each endpoint. The server therefore sends a certificate chain and a CertificateVerify signature over the handshake transcript, proving possession of the certified private key and binding the negotiation to it. Finished values then authenticate the transcript with derived secrets. The key schedule derives separate handshake and directional application traffic keys; the certificate signing key is not used to encrypt bulk application bytes.'
      zh: '客户端和服务器交换临时Diffie-Hellman公开份额，再各自派生相同的共同输入。密钥协商本身不是认证，因为攻击者可以分别与两个端点协商不同秘密。因此，服务器会发送证书链和覆盖握手记录的CertificateVerify签名，证明自己持有认证私钥，并把协商绑定到该私钥。随后，Finished值使用派生秘密认证握手记录。密钥计划会分别派生握手密钥和两个方向的应用流量密钥；证书签名密钥不会用于加密大量应用字节。'
    topics: [foundations/tls-connections]
    level: intermediate
    section: { en: 'Protocol mechanics', zh: '协议机制' }
    frequency: common
    tags: [tls13, handshake, key-agreement]

  - id: tls-failure-diagnosis
    question: { en: 'How do you diagnose a TLS connection failure without weakening verification?', zh: '怎样在不削弱校验的情况下诊断TLS连接失败？' }
    answer:
      en: 'I first separate DNS resolution, transport connect, TLS negotiation, certificate path building, hostname verification, and application protocol. I record the requested authority, selected address, SNI, ALPN result, safe error code, and phase timing. For certificate errors I inspect the served leaf and intermediates, configured trust anchors, reference hostname, SAN entries, validity times, and endpoint clock from a clean client environment. I test the deployed proxy path rather than only the origin. I do not set rejectUnauthorized to false, because that hides the evidence and can send credentials to an impersonator.'
      zh: '我会先区分DNS解析、传输连接、TLS协商、证书路径构建、主机名校验和应用协议，并记录请求authority、已选地址、SNI、ALPN结果、安全错误码及阶段耗时。遇到证书错误时，我会从干净客户端环境检查实际提供的叶证书与中间证书、已配置信任锚、参考主机名、SAN条目、有效时间和端点时钟。测试必须覆盖真实代理路径，不能只测源站。我不会把rejectUnauthorized设为false，因为这样既会隐藏证据，也可能把凭据发给冒充者。'
    topics: [foundations/tls-connections]
    level: intermediate
    section: { en: 'Failure diagnosis', zh: '故障诊断' }
    frequency: common
    tags: [tls, debugging, verification]

  - id: tls-resumption-early-data
    question: { en: 'What security decisions accompany TLS session resumption and 0-RTT early data?', zh: 'TLS会话恢复和0-RTT早期数据需要哪些安全决策？' }
    answer:
      en: 'A session ticket is a resumption credential, so I bound its lifetime, rotate its protection keys, and isolate those keys between security domains. For TLS 1.3 I prefer resumption with a fresh ephemeral exchange when forward-secrecy requirements call for it. I treat 0-RTT separately: early data can be replayed before the new handshake completes. It stays disabled unless the complete application operation is safe when repeated. A nominal read may still consume a token, write an audit event, or trigger costly work, so an HTTP method label alone is not enough evidence.'
      zh: '会话票据是恢复凭据，因此我会限制生命周期、轮换保护密钥，并在不同安全域之间隔离这些密钥。TLS 1.3有前向保密要求时，我会优先让恢复过程包含新的临时协商。0-RTT必须单独判断：新握手完成前发送的早期数据可能被重放。除非完整应用操作可安全重复，否则应保持关闭。名义上的读取仍可能消耗令牌、写入审计事件或触发昂贵工作，因此只有HTTP方法标签不足以证明操作安全。'
    topics: [foundations/tls-connections]
    level: advanced
    section: { en: 'Session lifecycle', zh: '会话生命周期' }
    frequency: occasional
    tags: [tls13, resumption, zero-rtt]

  - id: hash-maps-collision-contract
    question: { en: 'How does a hash map remain correct when two keys collide?', zh: '两个键发生冲突时，哈希表怎样保持正确？' }
    answer:
      en: 'The hash and bucket index only narrow the candidate set; they do not establish key identity. A chaining table retains both entries in the selected bucket, while an open-addressed table follows a shared probe rule to another slot. Lookup repeats the same path and compares each candidate with the requested key. Equal keys must produce equal hashes, but unequal keys may collide. Insertion updates the existing value only after equality succeeds. I test this contract with deliberately colliding unequal keys, including updates, misses, and deletion in both insertion orders.'
      zh: '哈希值与桶索引只会缩小候选集合，不能确定键标识。拉链表把两个条目都保留在选中的桶里，开放寻址表则按共享探测规则寻找其他槽位。查找会重复同一路径，并把每个候选键与请求键比较。相等键必须产生相同哈希值，不相等键仍可冲突；只有相等检查成功后，插入才能更新已有值。我会用必定冲突但不相等的键测试更新、未命中与删除，并覆盖两种插入顺序。'
    topics: [foundations/hash-maps]
    level: intermediate
    section: { en: 'Hash-table mechanics', zh: '哈希表机制' }
    frequency: common
    tags: [hash-maps, collisions, equality]

  - id: hash-maps-expected-complexity
    question: { en: 'Why is hash-map lookup expected O(1) rather than guaranteed O(1)?', zh: '为什么哈希表查找是预期O(1)，而不是保证O(1)？' }
    answer:
      en: 'Expected constant time assumes a suitable hash distribution, controlled load, and reasonably cheap equality. If many keys share a bucket or probe cluster, lookup examines more candidates and can approach O(n). Hashing a variable-length key also costs time proportional to the input examined unless a hash is cached. Hostile clients may exploit a predictable weak hash to create this concentration. I state the assumptions, bound untrusted key sizes and collection capacity, use the runtime’s hardened map, and measure representative plus adversarial key distributions when tail latency matters.'
      zh: '预期常数时间要求哈希分布合适、负载受控，而且相等比较成本合理。如果大量键进入同一个桶或探测簇，查找就要检查更多候选项，成本可能接近O(n)。除非哈希已缓存，对变长键求哈希的成本也随检查的输入增长。恶意客户端还可能利用可预测的弱哈希制造集中冲突。我会明确这些假设，限制不可信键长度与集合容量，使用运行时加固的映射；尾延迟重要时，还要测量代表性与对抗性键分布。'
    topics: [foundations/hash-maps]
    level: intermediate
    section: { en: 'Complexity contracts', zh: '复杂度契约' }
    frequency: common
    tags: [expected-complexity, hash-flooding, load-factor]

  - id: hash-maps-resize-rehash
    question: { en: 'What happens during hash-table resizing, and why is insertion still amortized O(1)?', zh: '哈希表扩容时发生什么，为什么插入仍是摊还O(1)？' }
    answer:
      en: 'When load crosses an implementation threshold, the table allocates larger storage and relocates live entries. It cannot simply copy buckets by index because index reduction depends on capacity; the same full hash may select another bucket after growth. That resize costs O(n) and may create a latency and memory peak. With geometric growth, however, resizes are infrequent, and the total relocation work across a long insertion sequence remains proportional to the number of entries inserted. The sequence has amortized O(1) insertion even though the particular insertion triggering growth is linear.'
      zh: '负载超过实现阈值后，表会分配更大存储并移动活动条目。它不能按原索引直接复制桶，因为索引缩减依赖容量；增长后，同一个完整哈希值可能选中另一个桶。这次扩容具有O(n) 成本，也可能造成延迟与内存峰值。不过，采用几何增长时，扩容不会频繁发生，长插入序列中的移动总量仍与插入条目数成正比。因此，整个序列的插入成本摊还为O(1)，但触发增长的那一次插入仍是线性的。'
    topics: [foundations/hash-maps]
    level: intermediate
    section: { en: 'Growth and latency', zh: '增长与延迟' }
    frequency: common
    tags: [resizing, rehashing, amortization]

  - id: hash-maps-business-key-design
    question: { en: 'How would you design a safe composite key for a hash map?', zh: '怎样为哈希表设计安全的复合键？' }
    answer:
      en: 'I begin with business equality: which fields define the same entity, including type, case, Unicode normalization, and missing-value rules. The hash or canonical representation must use those exact rules and remain stable while stored. Delimiter joining is unsafe when fields may contain the delimiter, so I prefer a value-key type or a specified length-prefixed encoding. I apply one canonicalizer on every insert, lookup, and delete path. For public input I also bound field length and collection size, then test reconstructed equal keys, delimiter-shaped values, normalized variants, mutations, and deliberate collisions.'
      zh: '我会先定义业务相等关系：哪些字段表示同一实体，并明确类型、大小写、Unicode归一化和缺失值规则。哈希或规范表示必须使用完全相同的规则，而且在存储期间保持稳定。字段可能包含分隔符时，直接连接并不安全，因此我更倾向值键类型或有明确规范的长度前缀编码。插入、查找与删除都调用同一个规范化函数。面对公开输入，还要限制字段长度与集合大小，并测试重建的相等键、类似分隔符的值、归一化变体、修改和刻意冲突。'
    topics: [foundations/hash-maps]
    level: advanced
    section: { en: 'Key design', zh: '键设计' }
    frequency: occasional
    tags: [composite-keys, canonicalization, security]

  - id: trees-graphs-model-boundary
    question: { en: 'How do you decide whether data should be treated as a tree or a graph?', zh: '怎样判断数据应按树还是按图处理？' }
    answer:
      en: 'I begin with invariants, not field names. A rooted tree has one root, every other node has exactly one parent, every node is reachable from the root, and no cycle exists. General graph data may have shared destinations, several parents, cycles, or disconnected vertices. I ask what an edge means, whether it is directed, and which stable key defines vertex identity. If an external API merely exposes children, I still validate unique parentage and acyclicity. When those guarantees are absent, I use graph traversal with visited state rather than trusting a tree-shaped serialization.'
      zh: '我会先看不变量，而不是字段名称。有根树只有一个根，其他节点恰好各有一个父节点，每个节点都能从根到达，而且不存在环。一般图数据则可能有共享目标、多个父节点、环或断开的顶点。我会确认边的含义、是否有向，以及哪个稳定键定义顶点标识。如果外部API只提供children字段，我仍会验证父节点唯一性与无环性。缺少这些保证时，应使用带已访问状态的图遍历，而不能信任树形序列化外观。'
    topics: [foundations/trees-and-graphs]
    level: intermediate
    section: { en: 'Graph modeling', zh: '图建模' }
    frequency: common
    tags: [trees, graphs, invariants, identity]

  - id: dfs-versus-bfs-choice
    question: { en: 'How do DFS and BFS differ, and when would you choose each?', zh: 'DFS与BFS有何区别，分别应在什么场景选择？' }
    answer:
      en: 'DFS uses a stack, explicit or through recursion, and follows one branch before returning to alternatives. It fits recursive evaluation, backtracking, component discovery, and algorithms that need completion order. BFS uses a queue and expands vertices by edge-count layers. That layer invariant makes first discovery a shortest path when every edge has equal cost. Both need stable visited state on a general graph and both take O(V + E) time with an adjacency list. I also compare memory shape: BFS may retain a wide layer, while recursive DFS risks the runtime stack on a deep chain.'
      zh: 'DFS使用显式栈或递归调用栈，会先沿一个分支前进，再返回处理其他选择，适合递归求值、回溯、发现连通分量，以及需要完成顺序的算法。BFS使用队列，按边数逐层扩展顶点；当每条边成本相等时，这个分层不变量保证第一次发现得到最短路径。一般图上的两种算法都需要按稳定标识维护已访问状态，配合邻接表时都是O(V + E)。还要比较内存形态：BFS可能保留很宽的一层，递归DFS则可能在深链上耗尽运行时栈。'
    topics: [foundations/trees-and-graphs]
    level: intermediate
    section: { en: 'Traversal strategy', zh: '遍历策略' }
    frequency: common
    tags: [dfs, bfs, traversal, complexity]

  - id: graph-cycle-detection-state
    question: { en: 'Why is a visited set insufficient for directed cycle detection?', zh: '为什么已访问集合不足以检测有向环？' }
    answer:
      en: 'Visited state answers whether a vertex was encountered before, but it does not say whether that earlier traversal is still active. Directed DFS therefore separates unseen, active, and completed vertices. An edge to an active vertex is a back edge and proves a cycle; an edge to a completed vertex may simply join previously explored work. I keep parent links for active vertices so an error can report the concrete cycle. In an undirected graph, the edge back to the immediate parent is expected, so the detection condition must account for direction rather than reusing the directed test unchanged.'
      zh: '已访问状态只能说明顶点以前是否出现，不能说明此前遍历是否仍在当前路径上。有向DFS因此区分未发现、活跃和已完成顶点。指向活跃顶点的边是反向边，可以证明存在环；指向已完成顶点的边可能只是汇入已经探索过的部分。我会为活跃顶点保留父节点，让错误能够报告具体环路径。在无向图中，返回直接父节点的边是预期行为，因此检测条件必须考虑方向，不能原样复用有向图判断。'
    topics: [foundations/trees-and-graphs]
    level: advanced
    section: { en: 'Cycle detection', zh: '环检测' }
    frequency: common
    tags: [cycle-detection, dfs, state]

  - id: graph-representation-complexity
    question: { en: 'How does graph representation change traversal cost and correctness?', zh: '图的表示形式怎样影响遍历成本与正确性？' }
    answer:
      en: 'With an adjacency list, DFS or BFS processes each reachable vertex once and inspects each stored outgoing edge once, giving O(V + E) work under the usual set assumptions. An adjacency matrix scans V possible neighbors per processed vertex, so full traversal performs O(V squared) cell checks even on a sparse graph. Representation also carries correctness contracts: missing map keys may mean leaves or invalid references, undirected edges normally need entries in both directions, and neighbor order selects among valid traversal or shortest-path results. I define those rules and stable vertex identity before discussing complexity.'
      zh: '使用邻接表时，在通常的集合操作假设下，DFS或BFS会处理每个可达顶点一次，并检查每条已存储出边一次，因此工作量为O(V + E)。邻接矩阵会为每个已处理顶点扫描V个潜在邻居，所以即使图很稀疏，完整遍历也要执行O(V²) 次单元格检查。表示形式还携带正确性契约：缺失映射键可能表示叶子或非法引用；无向边通常要在两个方向存储；邻居顺序会选择一种有效遍历或最短路径结果。讨论复杂度前，应先定义这些规则与稳定顶点标识。'
    topics: [foundations/trees-and-graphs]
    level: intermediate
    section: { en: 'Representation and complexity', zh: '表示与复杂度' }
    frequency: occasional
    tags: [adjacency-list, adjacency-matrix, complexity]

  - id: dns-resolution-roles
    question: { en: 'Trace a cache-miss DNS lookup from an application to an authoritative answer.', zh: '说明应用的一次DNS缓存未命中查询怎样到达权威答案。' }
    answer:
      en: 'The application usually asks a stub resolver, which forwards the name and type to a recursive resolver. On a cache miss, the recursive resolver starts from known root-server addresses. A root reply refers it to the relevant top-level-domain servers, and the TLD reply refers it to authoritative servers for the child zone. The resolver queries one of those servers, follows any CNAME chain under a hop limit, caches the resulting record sets for their remaining TTLs, and returns candidates to the application. Referrals, timeouts, and negative answers are responses, not transport connections to the application service.'
      zh: '应用通常先请求存根解析器，由它把名称和类型转交递归解析器。缓存未命中时，递归解析器从已知根服务器地址开始；根响应把它转介到相关顶级域服务器，顶级域响应再把它转介到子区域的权威服务器。解析器查询其中一台服务器，在跳数上限内跟随CNAME链，按剩余TTL缓存所得记录集，再把候选地址返回应用。转介、超时和否定答案都属于解析阶段，不是与应用服务建立的传输连接。'
    topics: [foundations/dns-resolution]
    level: intermediate
    section: { en: 'Resolution path', zh: '解析路径' }
    frequency: common
    tags: [dns, recursive-resolver, authoritative-server, delegation]

  - id: dns-ttl-migration
    question: { en: 'Why does a DNS TTL not define the exact time when every client changes address?', zh: '为什么DNS TTL不能精确决定所有客户端切换地址的时刻？' }
    answer:
      en: 'TTL limits how long a particular cache may normally reuse a record after receiving it. Caches receive answers at different times, so their expiry instants differ. Applications can add caches with separate policies, and established sockets or connection pools do not consult DNS again merely because a record expired. For a migration, I lower TTL before the change, wait through the previous TTL, keep old and new endpoints healthy during an overlap, and observe traffic before retiring the old endpoint. I also inspect aliases and both A and AAAA data, because each dependent record set has its own lifetime.'
      zh: 'TTL限制的是某个缓存收到记录后通常还能复用多久。各缓存取得答案的时间不同，所以过期时刻也不同；应用还可能使用独立缓存策略，已经建立的套接字或连接池不会仅因记录过期就重新查询DNS。迁移时，我会提前降低TTL，等待旧TTL完整经过，让新旧端点在重叠期都保持健康，并在退役旧端点前观察流量。我还会检查别名以及A、AAAA数据，因为每个依赖记录集都有自己的生存时间。'
    topics: [foundations/dns-resolution]
    level: intermediate
    section: { en: 'Caching and change', zh: '缓存与变更' }
    frequency: common
    tags: [dns, ttl, caching, migration]

  - id: dns-negative-failure-classes
    question: { en: 'How do NXDOMAIN, NODATA, SERVFAIL, and a timeout differ operationally?', zh: 'NXDOMAIN、NODATA、SERVFAIL与超时在运维上有何区别？' }
    answer:
      en: 'NXDOMAIN is an authoritative statement that the queried name does not exist. NODATA is a successful response saying that the existing name has no records of the requested type, so another type may still succeed. SERVFAIL says the resolver could not produce a usable answer, for example because every authority failed or DNSSEC validation was bogus. A timeout says no response arrived within the caller’s wait. I negatively cache only authoritative absence for its derived lifetime, preserve transient failures as distinct states, and retry them only across suitable servers under one bounded deadline. None of these outcomes proves an application port is closed.'
      zh: 'NXDOMAIN是名称不存在的权威声明。NODATA是成功响应，表示现有名称没有请求类型的记录，因此查询其他类型仍可能成功。SERVFAIL表示解析器无法生成可用答案，例如所有权威服务器都失败，或DNSSEC验证结果错误。超时只表示调用方等待时间内没有收到响应。我只按推导出的生存时间否定缓存权威不存在，并把暂时性故障保留为不同状态；仅在同一有界截止时间内跨合适服务器重试。以上结果都不能证明应用端口已关闭。'
    topics: [foundations/dns-resolution]
    level: intermediate
    section: { en: 'Failure diagnosis', zh: '故障诊断' }
    frequency: common
    tags: [dns, nxdomain, nodata, servfail, timeout]

  - id: dns-different-answers
    question: { en: 'How would you diagnose two machines receiving different DNS answers for the same hostname?', zh: '两台机器查询同一主机名却得到不同DNS答案时，应怎样诊断？' }
    answer:
      en: 'I first make the questions truly comparable: absolute name, record type, class, lookup API, recursive resolver, network or tenant view, and query time. I record response code, answer, authority, TTL, and DNSSEC status, then query the intended recursive resolvers directly. Different remaining TTLs may show ordinary cache age; different data may come from split-horizon policy, geography, staged rollout, stale serving, or inconsistent authoritative replicas. I query the parent delegation and every authoritative server for NS, SOA, aliases, A, and AAAA. Finally, I separate resolution from connection reuse, because an existing pool can keep using an older address.'
      zh: '我会先让两个问题真正可比：绝对名称、记录类型、类别、查找API、递归解析器、网络或租户视图以及查询时间都要一致。随后记录响应码、答案、权威部分、TTL与DNSSEC状态，再直接查询目标递归解析器。剩余TTL不同可能只是缓存年龄不同；数据不同则可能来自分割视图、地理策略、分阶段发布、过期数据供应或权威副本不一致。我还会向父委派和每台权威服务器查询NS、SOA、别名、A与AAAA。最后要把解析与连接复用分开，因为现有连接池可能一直使用旧地址。'
    topics: [foundations/dns-resolution]
    level: advanced
    section: { en: 'Failure diagnosis', zh: '故障诊断' }
    frequency: occasional
    tags: [dns, split-horizon, authoritative-server, diagnostics]

  - id: unicode-text-counting-units
    question: { en: 'How do bytes, UTF-16 code units, code points, and grapheme clusters differ?', zh: '字节、UTF-16代码单元、码点与字素簇有什么区别？' }
    answer:
      en: 'Bytes belong to an encoded representation such as UTF-8. UTF-16 code units are 16-bit storage units, and JavaScript length and slicing use them; a supplementary code point needs a surrogate pair. A code point is a numbered Unicode position, although surrogate code points are not scalar values. An extended grapheme cluster is a sequence that segmentation rules treat as one user-perceived character, such as a base letter plus accents or a joined emoji family. I choose the unit from the operation: bytes for protocol capacity, code points for Unicode inspection, and graphemes for cursor movement or visible limits.'
      zh: '字节属于UTF-8等编码后的表示。UTF-16代码单元是16位存储单位；JavaScript的length与切片按它工作，补充平面码点需要一对代理项。码点是Unicode代码空间中的编号位置，但代理项码点不属于标量值。扩展字素簇则是分段规则视为一个用户感知字符的序列，例如基础字母加重音，或由连接符组成的家庭emoji。我会按操作选择单位：协议容量按字节，Unicode值检查按码点，光标移动与可见限制按字素。'
    topics: [foundations/unicode-text]
    level: beginner
    section: { en: 'Text representation', zh: '文本表示' }
    frequency: common
    tags: [unicode, utf-8, utf-16, grapheme-clusters]

  - id: unicode-text-strict-streaming-decode
    question: { en: 'How would you safely decode UTF-8 arriving in network chunks?', zh: '怎样安全解码按网络分块到达的UTF-8？' }
    answer:
      en: 'I get the encoding from the protocol rather than guessing from the bytes. I reuse one decoder in streaming mode because a multibyte sequence can start in one chunk and finish in the next; decoding chunks independently can replace or reject valid text. At end-of-stream I finalize the decoder so an incomplete pending sequence is detected. For identifiers, signed data, or imports, I normally choose fatal decoding and keep the original bytes for diagnosis when policy permits. Wire-size limits are enforced on bytes before decoding, while user-visible limits are checked separately with grapheme segmentation after successful decoding.'
      zh: '我会从协议取得编码，而不是根据字节猜测。多字节序列可能在一个分块中开始、下一个分块中结束，因此要复用同一个流式解码器；独立解码各块会错误替换或拒绝有效文本。流结束时还要完成解码，以检测待处理的不完整序列。对于标识符、签名数据或导入内容，我通常采用严格失败模式，并在策略允许时保留原始字节供诊断。线路大小限制在解码前按字节执行，面向用户的限制则在成功解码后另外按字素检查。'
    topics: [foundations/unicode-text]
    level: intermediate
    section: { en: 'Encoding boundaries', zh: '编码边界' }
    frequency: common
    tags: [utf-8, decoding, streaming, malformed-input]

  - id: unicode-text-normalization-policy
    question: { en: 'When should text be normalized, and how do NFC and NFKC change the policy?', zh: '文本应在什么时候规范化？NFC与NFKC会怎样改变策略？' }
    answer:
      en: 'I normalize only at a boundary whose equality contract requires it, and I preserve the original text for display and audit. NFC makes canonically equivalent sequences converge, such as a precomposed accented letter and its decomposed form. NFKC additionally applies compatibility mappings, so circled digits or width variants can converge with plain characters. That broader relation may help a specified search key but can erase meaningful distinctions in stored content or identifiers. I use the same named form on every write and lookup path, version derived keys when the policy changes, migrate old data, and handle collisions explicitly.'
      zh: '我只在相等契约明确要求的边界做规范化，并保留原始文本用于显示和审计。NFC会让规范等价序列收敛，例如预组和的重音字母与其分解形式。NFKC还会执行兼容映射，因此带圈数字或宽度变体可能与普通字符收敛。更宽的关系可以服务于明确规定的搜索键，却可能消除存储内容或标识符中的有意义差异。我会让每条写入与查询路径使用同一种指定形式，策略变化时给派生键升级版本并迁移旧数据，同时明确处理碰撞。'
    topics: [foundations/unicode-text]
    level: intermediate
    section: { en: 'Normalization and equality', zh: '规范化与相等' }
    frequency: common
    tags: [normalization, nfc, nfkc, comparison-keys]

  - id: unicode-text-collation-identity
    question: { en: 'Why should locale-aware collation not decide account identity?', zh: '为什么不能用区域敏感排序判断账户身份？' }
    answer:
      en: 'A collator defines ordering and equivalence for one locale and option set. At base sensitivity it may ignore accents or case, so a zero comparison does not prove identical code points, bytes, or accounts. Locale data can also change when the runtime upgrades. I reserve collation for display sorting and product-defined search, construct it with an explicit locale and options, and add a stable identifier as the final sorting tie-breaker. Identity, uniqueness, permissions, and protocol tokens use a separate specification-defined comparison key. I test normalization, case, script, and collision cases against that identity contract rather than borrowing display behavior.'
      zh: '排序器只为某个区域与选项组合定义顺序和等价关系。采用基础敏感度时，它可能忽略重音或大小写，因此比较结果为0并不能证明码点、字节或账户相同；运行时升级还可能改变区域数据。我只把排序用于展示顺序与产品定义的搜索，并明确指定区域和选项，再用稳定标识符作为最后的同值排序条件。身份、唯一性、权限和协议标记采用另一套由规范定义的比较键。我会按身份契约测试规范化、大小写、书写系统与碰撞，而不是借用显示行为。'
    topics: [foundations/unicode-text]
    level: advanced
    section: { en: 'Comparison contracts', zh: '比较契约' }
    frequency: occasional
    tags: [collation, identity, locale, security]

  - id: pipes-stream-separation
    question: { en: 'Why should a command keep standard output separate from standard error?', zh: '命令为什么应当让标准输出与标准错误保持分离？' }
    answer:
      en: 'Standard output is the command’s result channel, so another program can parse it as data. Standard error carries diagnostics, warnings, and progress independently. If a script uses `2>&1` before a parser, one warning can become a fake record, invalidate JSON, or change a checksum. I keep the channels separate through the data path, redirect diagnostics to a dedicated log when needed, and preserve the exit status as a third signal. My test producer emits one valid record, one warning, and a nonzero status so the consumer contract is exercised rather than assumed.'
      zh: '标准输出是命令的结果通道，其他程序可以把它作为数据解析；标准错误独立承载诊断、警告与进度。如果脚本在解析器之前使用`2>&1`，一条警告就可能变成伪记录、破坏JSON或改变校验和。我会在整条数据路径中分离两个通道，需要时把诊断重定向到专用日志，并把退出状态作为第三种信号保留下来。测试用的生产者会生成一条有效记录、一条警告和一个非零状态，从而真正验证消费者契约。'
    topics: [foundations/pipes-and-redirection]
    level: intermediate
    section: { en: 'Stream contracts', zh: '流契约' }
    frequency: common
    tags: [standard-output, standard-error, data-integrity]

  - id: pipes-pipefail-stage-status
    question: { en: 'How do you detect an upstream failure in a Bash pipeline without losing stage identity?', zh: '怎样在不丢失阶段身份的前提下检测Bash管道的上游故障？' }
    answer:
      en: 'By default, Bash reports the last command’s status, so a successful consumer can hide a failed producer. I enable `pipefail` when any failed stage should fail the operation, then copy `PIPESTATUS` immediately after the pipeline if diagnosis or status-specific recovery needs every value. Even an `echo` or assignment can replace that array. I classify expected nonzero statuses explicitly instead of attaching `|| true` to the whole pipeline. Before publishing an artifact, I verify the chosen status policy and reject partial output, even when the file is nonempty or the final parser succeeded.'
      zh: 'Bash默认报告最后一条命令的状态，因此成功的消费者可能隐藏失败的生产者。如果任何阶段失败都应让操作失败，我会启用`pipefail`；诊断或按状态恢复需要每个值时，还会在管道之后立即复制`PIPESTATUS`，因为一次`echo`或赋值就能替换该数组。我会显式分类预期的非零状态，而不是给整条管道加上`|| true`。发布产物前还要验证既定状态策略并拒绝部分输出，即使文件非空或最终解析器已经成功。'
    topics: [foundations/pipes-and-redirection]
    level: intermediate
    section: { en: 'Failure handling', zh: '失败处理' }
    frequency: common
    tags: [pipefail, pipestatus, exit-status]

  - id: pipes-redirection-order
    question: { en: 'Why do `>file 2>&1` and `2>&1 >file` have different effects?', zh: '为什么`>file 2>&1`与`2>&1 >file`的效果不同？' }
    answer:
      en: 'The shell applies redirections from left to right. In `>file 2>&1`, it first points standard output at the file, then duplicates that current destination onto standard error, so both descriptors reach the file. In `2>&1 >file`, standard error first receives standard output’s old destination; only then does standard output move to the file. Standard error keeps the old terminal or pipe. I reason about each operator as a descriptor-table update and test with distinct markers on descriptors 1 and 2. Token reordering is therefore a semantic change, not formatting.'
      zh: 'Shell从左到右应用重定向。`>file 2>&1`先让标准输出指向文件，再把这个当前目标复制给标准错误，所以两个描述符都进入文件。`2>&1 >file`则先让标准错误取得标准输出的旧目标，之后才把标准输出移到文件；标准错误会继续指向旧终端或管道。我把每个操作符当作一次描述符表更新，并用分别写入描述符`1`和`2`的不同标记进行测试。因此，重排词元会改变语义，不只是调整格式。'
    topics: [foundations/pipes-and-redirection]
    level: intermediate
    section: { en: 'Descriptor routing', zh: '描述符路由' }
    frequency: common
    tags: [redirection, descriptor-duplication, ordering]

  - id: pipes-eof-sigpipe
    question: { en: 'What controls EOF and SIGPIPE in a pipe, and why can a pipeline hang?', zh: '管道中的EOF与SIGPIPE由什么控制？管道为什么可能挂起？' }
    answer:
      en: 'A reader sees EOF only after every descriptor referring to the write end is closed, not merely when the apparent producer exits or the buffer becomes empty. An inherited duplicate write descriptor can therefore keep the reader waiting forever. Conversely, once every read end is closed, another write normally delivers SIGPIPE or fails with EPIPE if that signal is ignored. Pipe capacity also creates backpressure: a producer blocks when the finite buffer fills. I check descriptor ownership, close unused ends, bound the operation with a deadline, and decide whether an early-closing consumer is expected.'
      zh: '只有引用写入端的每个描述符都关闭后，读取方才会看到EOF；表面上的生产者退出或缓冲区暂时为空都不够。继承的写入描述符副本因此可能让读取方永远等待。反过来，所有读取端都关闭后，继续写入通常会触发SIGPIPE；如果忽略该信号，写入会以EPIPE失败。有限管道容量还会形成背压，缓冲区装满时生产者将阻塞。我会检查描述符所有权，关闭不用的端点，为操作设置总期限，并明确消费者提前关闭是否属于预期。'
    topics: [foundations/pipes-and-redirection]
    level: advanced
    section: { en: 'Pipe lifecycle', zh: '管道生命周期' }
    frequency: occasional
    tags: [eof, sigpipe, backpressure, file-descriptors]

  - id: dates-time-instant-versus-civil
    question: { en: 'How does an instant differ from a civil date-time?', zh: '时间点与民用日期时间有什么区别？' }
    answer:
      en: 'An instant identifies one point on the timeline and can be ordered against other instants. A civil date-time is a set of calendar and clock fields such as 2026-11-01 01:30; it does not identify an instant until a calendar, zone or offset, and transition policy supply the missing context. Some civil values have no candidate instant during a clock gap, while others have two during an overlap. I keep event timestamps, calendar-only dates, and unresolved schedules as different domain types, then convert at a boundary that owns the policy.'
      zh: '时间点标识时间线上的一个位置，可以与其他时间点排序。民用日期时间则是一组日历与钟表字段，例如2026-11-01 01:30；只有补充日历、时区或偏移以及切换策略后，它才能标识时间点。时钟空缺中的某些民用值没有候选时间点，重叠中的某些值则有两个。我会把事件时间戳、只有日期的值与尚未解析的日程建模为不同领域类型，再由拥有策略的边界负责转换。'
    topics: [foundations/dates-and-time]
    level: intermediate
    section: { en: 'Temporal modeling', zh: '时间值建模' }
    frequency: common
    tags: [instant, civil-time, data-model]

  - id: dates-time-offset-versus-zone
    question: { en: 'Why is a UTC offset not a time zone?', zh: '为什么UTC偏移不等于时区？' }
    answer:
      en: 'An offset such as -04:00 states one numeric relationship to UTC and, with complete local fields, identifies an instant. A named IANA zone such as America/New_York supplies date-dependent regional rules, including historical changes and future rules in the installed database. A recurring 09:00 meeting therefore needs the zone, not merely the offset in effect when it was created. For resolved wire timestamps I still include an explicit offset, while scheduling data retains local fields, the zone identifier, and the policy for gaps and overlaps.'
      zh: '像 -04:00这样的偏移只说明与UTC的一个数值关系；配合完整本地字段时，它能够标识时间点。America/New_York这样的IANA时区名提供随日期变化的地区规则，其中包括历史变化与已安装数据库中的未来规则。因此，每天09:00的会议需要保留时区，不能只保留创建时的偏移。已解析的传输时间戳仍应带明确偏移；日程数据则保留本地字段、时区标识符，以及处理空缺和重叠的策略。'
    topics: [foundations/dates-and-time]
    level: intermediate
    section: { en: 'Time-zone rules', zh: '时区规则' }
    frequency: common
    tags: [utc-offset, iana-time-zone, recurrence]

  - id: dates-time-gap-overlap-policy
    question: { en: 'How would you resolve local input during a time-zone gap or overlap?', zh: '如何解析落在时区空缺或重叠中的本地输入？' }
    answer:
      en: 'I validate the calendar fields, load the named zone, and search for instants that project back to exactly those fields. Zero candidates means a gap, one means an ordinary unique time, and two means an overlap. Then I apply a product policy rather than a library default: reject or shift a gap, and choose earlier, choose later, or ask for an overlap. In Python I preserve the selected fold or resolved instant. Tests use real transitions and assert both local round trips and UTC results, because attaching ZoneInfo alone does not reject nonexistent fields.'
      zh: '我会先验证日历字段并加载指定时区，再搜索能够准确投影回这些字段的时间点。零个候选项表示空缺，一个表示普通唯一时间，两个表示重叠。随后应用产品策略，而不是库默认值：对空缺选择拒绝或移动，对重叠选择较早、较晚或询问用户。在Python中，我会保留选定的fold或解析后时间点。测试使用真实切换点，同时断言本地往返与UTC结果，因为只附加ZoneInfo并不会拒绝不存在的字段。'
    topics: [foundations/dates-and-time]
    level: advanced
    section: { en: 'Time-zone rules', zh: '时区规则' }
    frequency: occasional
    tags: [dst-gap, dst-overlap, fold, validation]

  - id: dates-time-duration-and-clock
    question: { en: 'How do calendar arithmetic, elapsed duration, and clock choice interact?', zh: '日历运算、经过时长与时钟选择如何相互影响？' }
    answer:
      en: 'Calendar arithmetic preserves fields under calendar and zone rules: tomorrow at noon can be only 23 elapsed hours away across a forward clock change. Elapsed arithmetic preserves a timeline amount, so exactly 24 hours later may display as 13:00. I make that choice explicit in operation names and test both local fields and timestamp differences at transitions and month ends. For in-process deadlines I use a monotonic clock because wall time can be corrected. I record a separate UTC instant for logs, since monotonic readings are process-relative and cannot serve as universal timestamps.'
      zh: '日历运算按照日历与时区规则保留字段：跨越向前拨钟时，明天中午可能只经过23小时。经过时间运算则保留时间线上的量，所以恰好24小时后可能显示为13:00。我会在操作名称中写明选择，并在切换点与月末同时测试本地字段和时间戳差。进程内截止时间使用单调时钟，因为挂钟可能被校正。日志另行记录UTC时间点；单调时钟读数只相对于当前进程，不能充当通用时间戳。'
    topics: [foundations/dates-and-time]
    level: intermediate
    section: { en: 'Arithmetic and clocks', zh: '运算与时钟' }
    frequency: common
    tags: [calendar-arithmetic, duration, monotonic-clock]

  - id: floating-point-decimal-equality
    question: { en: 'Why can 0.1 + 0.2 differ from 0.3, and when is exact floating-point equality still appropriate?', zh: '为什么0.1 + 0.2可能不等于0.3？何时仍适合精确比较浮点数？' }
    answer:
      en: 'Binary64 has finite precision, and fractions such as one tenth have repeating base-two expansions. Parsing each decimal chooses a nearby representable value, and addition rounds again, so the stored sum can differ from the value selected for the literal 0.3. That does not make every equality check wrong. Exact equality is appropriate when the contract promises identical representations, such as safe integers, an exact sentinel, or a value compared after a lossless round trip. For independently computed measurements, I derive absolute and relative tolerances from units and the algorithm’s error budget, then handle NaN and infinities separately.'
      zh: 'Binary64的精度有限，十分之一这样的分数在二进制中会无限循环。解析每个十进制数时都要选择附近的可表示值，加法还会再次舍入，因此存储的和可能不同于字面量0.3选择的值。这并不表示所有相等检查都有错。如果约定保证表示相同，例如安全整数、精确哨兵值或无损往返后的值，精确比较就很合适。对于独立计算的测量值，我会根据单位与算法误差预算推导绝对和相对容差，再单独处理NaN与无穷。'
    topics: [foundations/floating-point-arithmetic]
    level: intermediate
    section: { en: 'Numeric representation', zh: '数值表示' }
    frequency: common
    tags: [floating-point, binary64, equality, rounding]

  - id: floating-point-tolerance-design
    question: { en: 'How would you design and review a floating-point near-equality check?', zh: '你会怎样设计和审查浮点数近似相等检查？' }
    answer:
      en: 'I first ask what error the domain permits and what error the algorithm introduces. An absolute tolerance gives a meaningful floor near zero, while a relative tolerance scales with the larger operand magnitude; a common rule accepts a difference below the greater bound. I do not copy Number.EPSILON because it only describes binary64 spacing near one. I define policies for NaN, infinities, and signed zero before subtracting. Tests cover zero, both signs, ordinary and maximum magnitudes, and values just inside and outside each bound. I also avoid using tolerant equality as a hash-key or sorting equivalence because it is not transitive.'
      zh: '我会先确认领域允许多少误差，以及算法本身会引入多少误差。绝对容差在零附近提供有意义的下限，相对容差则随较大操作数的量级缩放；常见规则是允许差值不超过两种界限中的较大者。我不会照搬Number.EPSILON，因为它只描述binary64在一附近的间距。执行减法前，还要定义NaN、无穷和带符号零的策略。测试应覆盖零、两个符号、普通与最大量级，以及每条界限内外的值。容差相等不具有传递性，因此也不能直接用作哈希键或排序等价关系。'
    topics: [foundations/floating-point-arithmetic]
    level: intermediate
    section: { en: 'Numeric comparison', zh: '数值比较' }
    frequency: common
    tags: [tolerance, relative-error, absolute-error, nan]

  - id: floating-point-range-failures
    question: { en: 'How should a service handle floating-point overflow, underflow, and nonfinite values?', zh: '服务应怎样处理浮点溢出、下溢和非有限值？' }
    answer:
      en: 'Floating-point overflow usually produces an infinity rather than throwing, invalid arithmetic can produce NaN, and gradual underflow first reduces relative precision before a tiny result becomes zero. I therefore validate finite inputs and results at the domain boundary with a non-coercing predicate such as Number.isFinite. The contract must say whether overflow rejects the operation, saturates to a limit, or switches representation; silently accepting infinity is not a policy. I test the largest expected operands, overflow-producing combinations, the normal-to-subnormal boundary, signed zero, and serialization. Standard JSON has no NaN or infinity literal, so transport behavior must be deliberate rather than discovered after failure.'
      zh: '浮点溢出通常产生无穷而不是抛异常，无效算术可能产生NaN，渐进下溢则会先降低相对精度，之后极小结果才变成零。因此，我会在领域边界用Number.isFinite这类不执行强制转换的谓词验证有限输入与结果。约定必须说明溢出时拒绝操作、饱和到上限，还是切换表示方式；静默接受无穷并不算策略。我会测试最大预期操作数、产生溢出的组合、正规数到次正规数的边界、带符号零和序列化。标准JSON没有NaN或无穷字面量，因此必须主动规定传输行为。'
    topics: [foundations/floating-point-arithmetic]
    level: intermediate
    section: { en: 'Range and failure handling', zh: '范围与故障处理' }
    frequency: occasional
    tags: [overflow, underflow, finite-values, serialization]

  - id: floating-point-summation-stability
    question: { en: 'Why can summation order change a floating-point result, and how do you choose a stable approach?', zh: '为什么求和顺序会改变浮点结果？怎样选择稳定方法？' }
    answer:
      en: 'Every addition rounds at the spacing of its intermediate magnitude, so floating-point addition is not generally associative. A small addend can disappear beside a large partial sum, and subtracting close approximate values can expose catastrophic cancellation. Chunking or parallelizing a reduction changes its rounding tree, which can change the last bits. I inspect input magnitudes and the required error bound, then consider pairwise summation, compensated summation, a reformulated expression, or a higher-precision representation. Tests mix very large and small values and compare with a higher-precision oracle. If bitwise reproducibility matters, I also fix the operation order, runtime behavior, and library implementation.'
      zh: '每次加法都会按照中间结果所在量级的间距舍入，因此浮点加法通常不满足结合律。小加数可能在大部分和旁边消失，两个接近的近似值相减则可能暴露灾难性消减。分块或并行归约会改变舍入树，末位结果也可能变化。我会检查输入量级和所需误差界限，再考虑成对求和、补偿求和、改写表达式或使用更高精度表示。测试要混合极大与极小值，并和高精度预言机比较。如果逐位可重现很重要，还要固定运算顺序、运行时行为和库实现。'
    topics: [foundations/floating-point-arithmetic]
    level: advanced
    section: { en: 'Numerical stability', zh: '数值稳定性' }
    frequency: occasional
    tags: [summation, cancellation, reproducibility, numerical-stability]

  - id: regular-expressions-validation-boundary
    question: { en: 'How do you use a regular expression for validation without confusing shape with meaning?', zh: '怎样用正则表达式做校验，同时不把形状误认为含义？' }
    answer:
      en: 'I first write the lexical contract: character repertoire, separators, length bounds, and whether the whole input must match. In JavaScript I verify the overall match consumes the entire string instead of assuming a successful substring or `$` always means absolute end. I keep `g` and `y` out of an independent Boolean validator because they carry `lastIndex`. After the shape passes, ordinary code or a domain parser checks meaning, such as calendar validity or whether an identifier exists. Tests include valid input, leading and trailing junk, a final newline, boundary lengths, and shape-valid values that are semantically invalid.'
      zh: '我会先写清词法契约：字符范围、分隔符、长度边界，以及是否必须匹配整个输入。在JavaScript中，我会确认整体匹配消费完整字符串，而不是把成功子串或`$`当成绝对末尾。独立布尔校验器不使用`g`与`y`，因为它们会携带`lastIndex`。形状通过后，再由普通代码或领域解析器检查含义，例如日历日期是否存在、标识符是否有对应实体。测试要覆盖有效输入、前后多余文本、末尾换行、边界长度，以及形状有效但语义无效的值。'
    topics: [foundations/regular-expressions]
    level: beginner
    section: { en: 'Text validation', zh: '文本校验' }
    frequency: common
    tags: [regex, validation, anchors, parsing]

  - id: regular-expressions-backtracking-risk
    question: { en: 'What causes catastrophic regex backtracking, and how would you control the risk?', zh: '什么会引发正则表达式的灾难性回溯？你会怎样控制风险？' }
    answer:
      en: 'Backtracking is normal when an engine revisits a quantifier or alternative after later input fails. Risk grows when nested quantifiers or overlapping alternatives create many ways to consume the same prefix, especially on a long near miss that fails at the end. I remove ambiguous nesting, factor shared prefixes, replace broad wildcards with delimiter-aware classes where appropriate, and enforce input and repetition bounds before matching. I then measure adversarial near misses across increasing safe sizes in a worker or child process that the test harness can terminate. For exposed complex patterns, I consider a parser or an engine with a suitable worst-case guarantee.'
      zh: '后续输入失败后，引擎重新尝试量词或分支属于正常回溯。若嵌套量词或重叠分支产生多种消费同一前缀的方式，风险就会升高；直到末尾才失败的长近似匹配尤其危险。我会消除有歧义的嵌套，提取公共前缀，在合适位置用分隔符感知字符类代替宽泛通配符，并在匹配前执行输入与重复边界。随后在可由测试框架终止的工作线程或子进程中，对安全范围内逐步增大的对抗性近似失败输入进行测量。面对外部可达的复杂模式，我还会考虑解析器或具有合适最坏情况保证的引擎。'
    topics: [foundations/regular-expressions]
    level: intermediate
    section: { en: 'Performance and safety', zh: '性能与安全' }
    frequency: common
    tags: [regex, backtracking, redos, input-bounds]

  - id: regular-expressions-dynamic-composition
    question: { en: 'How should dynamic text be included in a JavaScript regular expression?', zh: '应怎样把动态文本放入JavaScript正则表达式？' }
    answer:
      en: 'I decide whether the dynamic value is trusted regex source or literal data; most user names, extensions, and search strings are data. Fixed patterns stay as regex literals. On Node 24, literal fragments pass through `RegExp.escape()` before they are embedded in `new RegExp()`, while trusted source is kept in a visibly separate path. I account for the two parsers: JavaScript string escaping happens before regex parsing in the constructor form. Tests use dots, brackets, parentheses, hyphens, backslashes, newlines, and Unicode. Escaping prevents syntax injection, but input bounds and a review of the surrounding fixed pattern are still required for performance safety.'
      zh: '我会先判断动态值属于可信正则源码还是字面数据；多数用户名、扩展名和搜索词都属于数据。固定模式应保留为正则字面量。在Node 24上，字面片段经过`RegExp.escape()`后才能嵌入`new RegExp()`，可信源码则放在明显分离的路径中。我还会考虑两次解析：构造器形式先执行JavaScript字符串转义，再解析正则。测试要包含点号、方括号、圆括号、连字符、反斜杠、换行与Unicode。转义能阻止语法注入，但性能安全仍需要输入边界和对外围固定模式的审查。'
    topics: [foundations/regular-expressions]
    level: intermediate
    section: { en: 'Pattern construction', zh: '模式构造' }
    frequency: occasional
    tags: [regex, escaping, injection, regexp-escape]

  - id: regular-expressions-state-and-unicode
    question: { en: 'Which JavaScript regex state and Unicode details do you check during code review?', zh: '审查代码时，应检查哪些JavaScript正则状态与Unicode细节？' }
    answer:
      en: 'I inspect the flags first. With `g` or `y`, `test()` and `exec()` mutate `lastIndex`, so a shared validator or a test-then-exec sequence can skip matches; `matchAll()` is usually clearer for complete iteration. I verify whether `u` is required and name the intended unit: UTF-16 code unit, code point, grapheme, byte, ASCII digit, or Unicode decimal number. In ECMAScript, `\d` remains ASCII-only under `u`, while property escapes such as `\p{Decimal_Number}` express broader sets. Match indices are code-unit offsets, and regex matching neither segments graphemes nor normalizes text, so those policies need separate APIs and tests.'
      zh: '我会先检查标志。使用`g`或`y`时，`test()`与`exec()`会修改`lastIndex`，因此共享校验器或先测试再执行的序列可能跳过匹配；完整迭代通常用`matchAll()`更清楚。我会确认是否需要`u`，并写明目标单位：UTF-16代码单元、码点、字素、字节、ASCII数字或Unicode十进制数字。在ECMAScript中，`\d`即使启用`u`仍只匹配ASCII，而`\p{Decimal_Number}`等属性转义可以表达更广的集合。匹配索引是代码单元偏移，正则匹配既不分割字素，也不规范化文本，因此这些策略需要单独的API与测试。'
    topics: [foundations/regular-expressions]
    level: intermediate
    section: { en: 'Runtime semantics', zh: '运行时语义' }
    frequency: common
    tags: [regex, last-index, unicode, match-all]
