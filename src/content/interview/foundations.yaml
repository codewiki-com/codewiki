track: foundations
items:
  - id: http2-multiplexing-boundary
    question: { en: 'What problem does HTTP/2 multiplexing solve, and which head-of-line blocking remains?', zh: 'HTTP/2 多路复用解决了什么问题？哪种队头阻塞仍然存在？' }
    answer:
      en: 'HTTP/2 labels frames with stream identifiers, so requests and responses can be interleaved on one connection. A ready response no longer waits for an earlier slow response merely because HTTP/1.1 requires response order. However, the frames still travel through one ordered TCP byte stream. If a TCP segment is lost, later bytes for every HTTP/2 stream wait for retransmission. Multiplexing therefore removes HTTP-level response ordering, not transport-level head-of-line blocking. I verify the negotiated protocol and measure through the real proxy path before attributing a latency change to multiplexing.'
      zh: 'HTTP/2 用流标识标记帧，让多组请求与响应可以在一条连接上交错。已经就绪的响应不必再因为 HTTP/1.1 的响应顺序要求，等待前面的慢响应。但是，所有帧仍通过一条有序的 TCP 字节流传输。一旦 TCP 段丢失，所有 HTTP/2 流的后续字节都要等待重传。因此，多路复用消除的是 HTTP 层响应排队，不是传输层队头阻塞。我会确认实际协商出的协议，并经过真实代理路径测量，再判断延迟变化是否来自多路复用。'
    topics: [foundations/http2]
    level: intermediate
    section: { en: 'Networking protocols', zh: '网络协议' }
    frequency: common
    tags: [http2, multiplexing, tcp]

  - id: http2-flow-control-backpressure
    question: { en: 'How do HTTP/2 flow control and application backpressure differ?', zh: 'HTTP/2 流量控制与应用背压有什么区别？' }
    answer:
      en: 'HTTP/2 DATA consumes both a stream window and a connection window. WINDOW_UPDATE grants more byte credit after the receiver makes capacity available. These windows do not limit HEADERS, handler count, parsed objects, database work, or an application queue. A runtime may expose the combined pressure through a writable stream returning false and a later drain event. Correct services respect that signal and also bound admission, body size, decoding, downstream calls, and buffered responses. I test a peer that stops reading because happy-path payloads rarely expose missing backpressure.'
      zh: 'HTTP/2 的 DATA 会同时消耗流窗口和连接窗口。接收方释放容量后，用 WINDOW_UPDATE 增加字节额度。但这些窗口不会限制 HEADERS、处理器数量、解析后的对象、数据库工作或应用队列。运行时可能通过可写流返回 false 以及之后的 drain 事件，暴露综合压力。正确的服务既要响应这个信号，也要限制入口并发、正文大小、解码、下游调用和缓冲响应。我会测试对端停止读取的情况，因为正常的小负载很难暴露缺失的背压。'
    topics: [foundations/http2]
    level: intermediate
    section: { en: 'Capacity and backpressure', zh: '容量与背压' }
    frequency: common
    tags: [http2, flow-control, backpressure]

  - id: http2-goaway-retry
    question: { en: 'How should a client react to an HTTP/2 GOAWAY frame?', zh: '客户端应如何处理 HTTP/2 的 GOAWAY 帧？' }
    answer:
      en: 'GOAWAY means the connection will accept no new streams and carries the highest peer-initiated stream that might have been processed. The client opens or selects another session for new work and gives accepted streams a bounded drain period. Higher-numbered local streams can be candidates for retry, but the protocol signal is not the whole decision. The method must be safe under replay or protected by idempotency, the request body must be reproducible, and intermediary side effects must be considered. I never replay every active request blindly, especially writes.'
      zh: 'GOAWAY 表示连接不再接受新流，并携带对端可能处理过的最高流标识。客户端应为新工作创建或选择另一个会话，同时给已经接受的流设置有限排空时间。编号更高的本地流可以成为重试候选，但协议信号不能独自决定重试。方法必须能安全重放或受到幂等机制保护，请求正文必须可重新生成，还要考虑中间层可能产生的副作用。我不会盲目重放所有活动请求，尤其不会盲目重放写操作。'
    topics: [foundations/http2]
    level: advanced
    section: { en: 'Failure handling', zh: '故障处理' }
    frequency: occasional
    tags: [http2, goaway, retry]

  - id: http2-hpack-security
    question: { en: 'What state does HPACK maintain, and what security limits still matter?', zh: 'HPACK 维护什么状态？还需要哪些安全限制？' }
    answer:
      en: 'HPACK uses static and dynamic tables so repeated field names and values can be represented by references. Encoder and decoder context is ordered and scoped to one connection; a context failure can therefore become a connection error. Compression does not encrypt fields. Sensitive values should use a never-indexed representation, while TLS, log redaction, and access control remain necessary. Receivers must limit decoded field count and size rather than trusting compressed bytes on the wire. I also bound per-field size and decoding work so a compact field block cannot trigger unbounded memory or CPU use.'
      zh: 'HPACK 使用静态表和动态表，让重复的字段名称与值可以通过引用表示。编码与解码上下文具有顺序，并且只属于一条连接；上下文损坏因此可能成为连接错误。压缩不会加密字段。敏感值应使用永不索引的表示，同时仍需 TLS、日志脱敏和访问控制。接收方必须限制解码后的字段数量与总大小，不能信任线上的压缩字节数。我还会限制单字段大小和解码工作，避免很小的字段块触发无界内存或 CPU 消耗。'
    topics: [foundations/http2]
    level: advanced
    section: { en: 'Protocol security', zh: '协议安全' }
    frequency: occasional
    tags: [http2, hpack, header-limits]

  - id: network-programming-tcp-framing
    question: { en: 'Why does TCP need application message framing, and how would you test a length-prefixed decoder?', zh: 'TCP 为什么需要应用消息分帧？你会怎样测试长度前缀解码器？' }
    answer:
      en: 'TCP delivers an ordered byte stream, not the write boundaries chosen by the sender. One receive can contain part of a header, part of a payload, several messages, or any combination that preserves byte order. A length-prefixed decoder therefore buffers incrementally, reads a fixed-width length in the agreed byte order, rejects values above a configured maximum, and emits only complete frames. I test every split within the header and payload, several frames in one chunk, zero-length frames, early EOF, oversized lengths, and a total operation deadline.'
      zh: 'TCP 交付有序字节流，不保留发送方选择的写入边界。一次接收可能只有部分头或负载，也可能包含多条消息，只要字节顺序不变即可。长度前缀解码器因此要增量缓冲，按约定字节序读取固定宽度长度，拒绝超过配置上限的值，并且只产出完整帧。我会测试头与负载中的每个切分位置、多帧同读、零长度帧、提前 EOF、超长声明和覆盖整个操作的截止时间。'
    topics: [foundations/network-programming]
    level: intermediate
    section: { en: 'Transport semantics', zh: '传输语义' }
    frequency: common
    tags: [tcp, framing, partial-read]

  - id: network-programming-end-states
    question: { en: 'How do timeout, orderly EOF, and connection reset differ for a socket reader?', zh: '对于套接字读取方，超时、有序 EOF 和连接复位有什么区别？' }
    answer:
      en: 'A timeout says that an operation made no required progress before its budget expired; it does not prove the peer is dead. Orderly EOF, represented by an empty read after buffered bytes are consumed, says the peer closed its sending direction. A reset reports abnormal connection termination and normally arrives as an error. None of these outcomes proves whether the peer committed an application transaction. I preserve them as separate error states, attach the connection phase and byte counts, close through one owner, and retry only when application idempotency makes replay safe.'
      zh: '超时表示操作没有在预算内取得所需进展，并不能证明对端已经失效。有序 EOF 会在缓冲字节读完后表现为空读取，说明对端关闭了发送方向。连接复位表示异常终止，通常以错误形式出现。这三种结果都不能证明对端是否提交了应用事务。我会保留不同错误状态，附上连接阶段和字节计数，由单一所有者关闭资源，并且只在应用幂等语义保证安全时重试。'
    topics: [foundations/network-programming]
    level: intermediate
    section: { en: 'Failure handling', zh: '故障处理' }
    frequency: common
    tags: [timeout, eof, reset, idempotency]

  - id: network-programming-backpressure
    question: { en: 'What does end-to-end backpressure require in a network service?', zh: '网络服务中的端到端背压需要覆盖哪些环节？' }
    answer:
      en: 'Socket backpressure begins when kernel send buffers fill: blocking writes wait, and nonblocking writes complete partially or would block. The service breaks that feedback if it keeps placing responses into an unbounded user-space queue. I put capacity limits on accepted connections, in-flight handlers, parsed messages, downstream calls, and outbound bytes. When a consumer slows, the producer pauses rather than spawning more work. The overload policy may reject, shed permitted data, or close a slow peer, but it must be explicit. I monitor queue depth, buffered bytes, and tail latency to tune those limits.'
      zh: '套接字背压始于内核发送缓冲区填满：阻塞写会等待，非阻塞写会部分完成或报告暂时不可写。服务若继续把响应塞入无界用户态队列，就切断了反馈。我会限制已接收连接、在途处理器、解析后消息、下游调用和待发送字节。消费者变慢时，生产者应暂停，而不是继续创建工作。过载策略可以拒绝、丢弃协议允许丢失的数据或关闭慢连接，但必须明确；再根据队列深度、缓冲字节和尾延迟调整限制。'
    topics: [foundations/network-programming]
    level: advanced
    section: { en: 'Capacity and backpressure', zh: '容量与背压' }
    frequency: common
    tags: [backpressure, capacity, nonblocking-io]

  - id: network-programming-address-candidates
    question: { en: 'Why should a client treat DNS results as connection candidates rather than one address?', zh: '客户端为什么应把 DNS 结果当作连接候选，而不是单个地址？' }
    answer:
      en: 'A host name can resolve to several IPv6 and IPv4 addresses whose reachability and latency differ. Trying only the first result turns one broken route into an application outage, while connecting to everything simultaneously wastes work. A mature client uses resolver ordering plus a bounded strategy such as staggered candidate attempts, cancels losers, and applies one overall deadline. I keep each candidate failure for diagnostics and record the selected address family. Resolution success, transport connection, TLS handshake, and application handshake remain separate phases because success at one does not guarantee the next.'
      zh: '一个主机名可能解析出多个 IPv6 与 IPv4 地址，各自的可达性和延迟不同。只尝试第一项，会让一条故障路径变成应用中断；同时连接全部地址又会浪费资源。成熟客户端会结合解析器顺序和错开的有界候选尝试，取消失败竞争者，并执行一个整体截止时间。我会保留每个候选的失败原因并记录最终地址族。解析成功、传输连接、TLS 握手和应用握手仍是不同阶段，因为前一阶段成功不保证下一阶段成功。'
    topics: [foundations/network-programming]
    level: advanced
    section: { en: 'Connection establishment', zh: '连接建立' }
    frequency: occasional
    tags: [dns, ipv6, ipv4, happy-eyeballs]

  - id: websocket-handshake-subprotocol
    question: { en: 'How does a WebSocket opening handshake work, and what does subprotocol negotiation establish?', zh: 'WebSocket 开启握手如何工作？子协议协商确定了什么？' }
    answer:
      en: 'On the classic HTTP/1.1 path, the client requests an upgrade and sends a random Sec-WebSocket-Key plus version 13. An accepting server returns 101 and computes Sec-WebSocket-Accept from that key and the protocol GUID. The accept value proves protocol awareness, not user identity. The client may also offer ordered Sec-WebSocket-Protocol values; the server selects at most one offered value, and both endpoints then use that application protocol. I separately verify TLS, Origin policy, authentication, and the selected protocol before marking the session ready.'
      zh: '在经典 HTTP/1.1 路径上，客户端请求升级，并发送随机的 Sec-WebSocket-Key 与版本 13。服务端接受时返回 101，并根据该 key 和协议 GUID 计算 Sec-WebSocket-Accept。接受值证明对端理解协议，不代表用户身份。客户端还可以提供一组有顺序的 Sec-WebSocket-Protocol 值；服务端最多选择一个客户端提供的值，随后双方使用该应用协议。我会分别验证 TLS、Origin 策略、身份认证和所选协议，再把会话标为可用。'
    topics: [foundations/websocket]
    level: intermediate
    section: { en: 'Networking protocols', zh: '网络协议' }
    frequency: common
    tags: [websocket, handshake, subprotocol]

  - id: websocket-reconnect-delivery
    question: { en: 'Why is reconnecting a WebSocket not enough to recover message delivery?', zh: '为什么 WebSocket 重连不足以恢复消息交付？' }
    answer:
      en: 'A break tells the client that the transport ended, but not whether the server processed the last command. The server may have committed a side effect while its acknowledgement was lost. I reconnect with capped exponential backoff and jitter, then restore authentication and subscriptions before sending new work. Side-effecting commands carry stable idempotency keys so a retry returns the original result rather than repeating it. Server pushes use a confirmed resume cursor; if retained history no longer covers that cursor, the protocol requires a fresh snapshot instead of silently losing events.'
      zh: '连接中断只说明传输结束，不能说明服务端是否处理了最后一条命令。服务端可能已经提交副作用，只是确认在回程中丢失。我会用带随机扰动和上限的指数退避重连，然后先恢复认证与订阅，再发送新工作。有副作用的命令携带稳定幂等键，使重试返回原结果，而不是重复执行。服务器推送使用已确认的恢复游标；如果保留历史不再覆盖该游标，协议应要求获取新快照，不能静默丢失事件。'
    topics: [foundations/websocket]
    level: intermediate
    section: { en: 'Failure handling', zh: '故障处理' }
    frequency: common
    tags: [websocket, reconnect, idempotency]

  - id: websocket-backpressure
    question: { en: 'How do you apply backpressure to the classic WebSocket API?', zh: '怎样为经典 WebSocket API 实施背压？' }
    answer:
      en: 'The classic API queues data passed to send and exposes bufferedAmount as a snapshot; it has no standard drained event or automatic producer slowdown. I admit a send only while OPEN and while the encoded payload stays under a per-connection byte budget. The producer then pauses, rejects, coalesces replaceable state, or closes a persistently slow peer according to message semantics. Limits also cover inbound message size, concurrent handlers, and downstream calls. I test a peer that stops reading and monitor queued bytes and memory, because ordinary small messages rarely expose a missing bound.'
      zh: '经典 API 会把传给 send 的数据排队，并通过 bufferedAmount 提供快照；它没有标准排空事件，也不会自动让生产者减速。我只在连接处于 OPEN 且编码后负载不超过每连接字节预算时准入发送。随后根据消息语义暂停或拒绝生产者、合并可替换状态，或关闭持续缓慢的对端。上限还要覆盖入站消息大小、并发处理器和下游调用。我会让对端停止读取并监控排队字节与内存，因为普通小消息很难暴露缺失的边界。'
    topics: [foundations/websocket]
    level: advanced
    section: { en: 'Capacity and backpressure', zh: '容量与背压' }
    frequency: common
    tags: [websocket, backpressure, buffered-amount]

  - id: websocket-origin-auth
    question: { en: 'Which security checks belong at a browser WebSocket boundary?', zh: '浏览器 WebSocket 边界需要哪些安全检查？' }
    answer:
      en: 'I use wss and validate the browser Origin against an explicit allowlist before upgrade. Origin protects against a hostile page borrowing ambient credentials; it is not authentication and non-browser clients can forge it. Identity comes from a secure session, short-lived connection ticket, or bounded authentication exchange. Every message is size-limited, parsed against a schema, rate-limited, and authorized for its resource rather than trusting connection-time access forever. I keep long-lived tokens out of URLs and logs, expire unauthenticated connections quickly, and define close codes without exposing sensitive policy details.'
      zh: '我会使用 wss，并在升级前按明确允许列表校验浏览器 Origin。Origin 用来防止恶意页面借用环境凭据，不是身份认证，非浏览器客户端也能伪造它。身份来自安全会话、短期连接票据或有界认证交换。每条消息都要限制大小、按 schema 解析、限制速率，并针对目标资源授权，不能永久信任连接时权限。我不会把长期令牌放进 URL 和日志，会迅速关闭未完成认证的连接，并定义不会泄露敏感策略细节的关闭状态码。'
    topics: [foundations/websocket]
    level: advanced
    section: { en: 'Protocol security', zh: '协议安全' }
    frequency: occasional
    tags: [websocket, origin, authorization]

  - id: linux-kernel-distribution-shell
    question: { en: 'How do the Linux kernel, a distribution, and a shell differ?', zh: 'Linux 内核、发行版与 Shell 有什么区别？' }
    answer:
      en: 'Linux is the kernel: it schedules execution, manages memory and devices, implements filesystems and networking, and exposes system calls. A distribution combines a selected kernel with user-space libraries, package management, service management, defaults, and an update policy. A shell is one user-space command interpreter that starts programs and configures file descriptors for redirection and pipelines. These layers can vary independently. A Bash command copied from Ubuntu may fail on a minimal Fedora container even though both use Linux, because the available tools, paths, and service policy differ.'
      zh: 'Linux 是内核，负责调度执行、管理内存与设备、实现文件系统和网络，并暴露系统调用。发行版把选定内核与用户空间库、包管理、服务管理、默认配置和更新策略组合起来。Shell 只是一个用户空间命令解释器，负责启动程序，并为重定向和管道配置文件描述符。这些层可以独立变化。即使两个环境都使用 Linux，从 Ubuntu 复制的 Bash 命令也可能在精简 Fedora 容器中失败，因为可用工具、路径与服务策略不同。'
    topics: [foundations/linux]
    level: beginner
    section: { en: 'Operating-system model', zh: '操作系统模型' }
    frequency: common
    tags: [linux, kernel, distribution, shell]

  - id: linux-directory-permissions
    question: { en: 'Why can a user sometimes delete a file they cannot read, or fail to delete one they own?', zh: '为什么用户有时能删除不可读文件，却无法删除自己拥有的文件？' }
    answer:
      en: 'Reading file contents is authorized against the file, while unlinking a name modifies its parent directory. Removing a directory entry therefore normally requires write and search permission on the parent, not read permission on the file. A sticky directory such as a shared temporary directory adds an ownership rule, and mounts or mandatory access control can add more restrictions. I inspect every path component with the process effective credentials and check ACLs and policy denials. File ownership alone does not settle whether the containing directory may be changed.'
      zh: '读取内容时，系统针对文件本身授权；删除名称时，系统修改的是父目录。移除目录项通常因此需要父目录的写入和搜索权限，而不要求文件可读。共享临时目录上的 sticky bit 会增加所有权规则，挂载选项或强制访问控制还可能继续限制。我会结合进程的有效凭据检查路径的每一级目录，并查看 ACL 与策略拒绝记录。仅凭文件所有权，无法判断能否修改所在目录。'
    topics: [foundations/linux]
    level: intermediate
    section: { en: 'Files and permissions', zh: '文件与权限' }
    frequency: common
    tags: [linux, permissions, directories, unlink]

  - id: linux-open-deleted-file
    question: { en: 'Why can df report a full filesystem when du cannot find the corresponding files?', zh: '为什么 df 可能报告文件系统已满，而 du 找不到对应文件？' }
    answer:
      en: 'du walks reachable directory entries and sums the blocks attributed to them. df reports allocation for the filesystem as a whole. If a process keeps a file open after its last directory entry is removed, that inode and its data remain allocated until the final open file description closes, but du can no longer reach it by name. I first confirm both commands refer to the same mount, then inspect open deleted files and identify the owning service. The safe remedy is usually to make that service close or reopen the file, not to manipulate its descriptor blindly.'
      zh: 'du 遍历仍可从目录项到达的对象，并累计它们占用的块；df 报告整个文件系统的分配情况。如果进程在最后一个目录项被删除后仍保持文件打开，inode 与数据会一直分配到最后一个打开文件描述关闭，但 du 已无法通过名称找到它。我会先确认两个命令针对同一挂载点，再检查已删除但仍打开的文件并定位所属服务。安全修复通常是让该服务关闭或重新打开文件，而不是盲目操作描述符。'
    topics: [foundations/linux]
    level: intermediate
    section: { en: 'Files and storage', zh: '文件与存储' }
    frequency: common
    tags: [linux, file-descriptor, inode, disk-usage]

  - id: linux-graceful-process-stop
    question: { en: 'How do you design a reliable Linux service shutdown?', zh: '怎样设计可靠的 Linux 服务关闭流程？' }
    answer:
      en: 'I define one owner for shutdown and a catchable stop signal, usually SIGTERM. The service stops admitting work, cancels or drains operations according to their semantics, forwards termination to children, closes descriptors, and exits before an overall deadline. The supervisor waits and records the real exit status. If the deadline expires, it captures useful diagnostics and escalates to SIGKILL. I test shutdown during startup, active requests, dependency failure, and repeated signals. A vanished PID proves only termination; it does not prove that transactions committed or leases were released.'
      zh: '我会为关闭流程指定唯一所有者和可捕获的停止信号，通常是 SIGTERM。服务先停止接收新工作，再按业务语义取消或排空操作，把终止信号转发给子进程，关闭描述符，并在总截止时间前退出。监督进程等待并记录真实退出状态。超时后，它先收集有效诊断，再升级到 SIGKILL。我会测试启动中、请求处理中、依赖失败和重复信号下的关闭。PID 消失只证明进程终止，不能证明事务已经提交或租约已经释放。'
    topics: [foundations/linux]
    level: advanced
    section: { en: 'Process lifecycle', zh: '进程生命周期' }
    frequency: common
    tags: [linux, signals, shutdown, process-reaping]

  - id: git-object-tree-commit
    question: { en: 'How do Git blobs, trees, commits, and references fit together?', zh: 'Git 的 blob、tree、commit 与引用如何组合？' }
    answer:
      en: 'A blob stores file bytes without a path or file name. A tree gives those blobs and subtrees names and modes, so one root tree describes a project snapshot. A commit points to that root tree, lists parent commits, and records author, committer, and message metadata. A branch is a movable reference to a commit; HEAD normally refers symbolically to the checked-out branch. This separation lets identical content be reused and makes branches cheap names over one shared graph. I inspect the model with cat-file, ls-tree, and for-each-ref rather than editing files under .git directly.'
      zh: 'Blob 只保存文件字节，不含路径或文件名。Tree 为 blob 与子 tree 关联名称和模式，因此一个根 tree 就能描述项目快照。Commit 指向根 tree，列出父提交，并保存作者、提交者和消息元数据。分支是指向 commit 的可移动引用；HEAD 通常以符号方式指向当前检出分支。这种分离让相同内容可以复用，也让分支成为同一张共享图上的轻量名称。我会用 cat-file、ls-tree 和 for-each-ref 检查模型，不会直接编辑 .git 下的文件。'
    topics: [foundations/git-deep-dive]
    level: intermediate
    section: { en: 'Git data model', zh: 'Git 数据模型' }
    frequency: common
    tags: [git, objects, references]

  - id: git-index-working-tree-head
    question: { en: 'What is Git’s index, and how does it differ from HEAD and the working tree?', zh: 'Git 索引是什么？它与 HEAD 和工作树有何区别？' }
    answer:
      en: 'HEAD resolves to the current committed snapshot, the index describes the proposed next snapshot, and the working tree contains editable files. Git add reads a path’s current content into a blob and places that blob in the index; later edits remain only in the working tree until added again. That is why git diff shows unstaged changes while git diff --cached shows staged changes relative to HEAD. During conflicts, the index can hold base, ours, and theirs entries at stages 1, 2, and 3. Resolving and adding the file replaces them with one stage 0 entry.'
      zh: 'HEAD 解析到当前已提交快照，索引描述下一候选快照，工作树则包含可编辑文件。Git add 会读取路径的当前内容，写成 blob 并放入索引；之后的编辑只留在工作树，直到再次 add。因此，git diff 显示未暂存变化，而 git diff --cached 显示索引相对 HEAD 的已暂存变化。冲突时，索引可以在 stage 1、2、3 中分别保存基点、ours 和 theirs。解决文件并再次 add 后，这些条目会被一个 stage 0 条目替换。'
    topics: [foundations/git-deep-dive]
    level: intermediate
    section: { en: 'Git data model', zh: 'Git 数据模型' }
    frequency: common
    tags: [git, index, working-tree]

  - id: git-merge-versus-rebase
    question: { en: 'What is the structural difference between merging and rebasing?', zh: '合并与变基在结构上有什么区别？' }
    answer:
      en: 'A true merge creates a commit with multiple parents after combining each tip’s changes relative to a merge base. Existing commits keep their identities, and the graph records where lines converged. Rebase instead reapplies commits unique to one branch onto a new base. Because parent IDs are part of commit content, the replacements normally get new IDs even when the final files match. I merge shared history unless a documented policy permits rewriting it, and I use rebase to organize private commits before publication. Force-with-lease is a conditional ref update, not team authorization to rewrite a branch.'
      zh: '真正的合并会根据合并基点组合两个端点的变化，再创建拥有多个父提交的 commit。已有提交保持身份，图中也明确记录开发线的汇合点。变基则把某分支独有的提交重新应用到新基点。父提交标识属于 commit 内容，所以即使最终文件相同，替代提交通常也会获得新标识。除非书面策略允许重写，我会对共享历史使用合并，并只在发布前用变基整理私有提交。Force-with-lease 是条件式引用更新，不是团队授权。'
    topics: [foundations/git-deep-dive]
    level: intermediate
    section: { en: 'History transformations', zh: '历史变换' }
    frequency: common
    tags: [git, merge, rebase]

  - id: git-reflog-recovery-limit
    question: { en: 'How would you recover a commit after an accidental reset, and what are reflog’s limits?', zh: '误执行 reset 后怎样恢复提交？Reflog 有哪些限制？' }
    answer:
      en: 'I stop mutating the repository, inspect git reflog with dates, and identify the pre-reset commit from the operation, time, tree, and parent chain. I create a rescue branch at the verified full object ID before deciding whether to reset, cherry-pick, or merge anything. A reflog is local: another clone may not contain the same entries, and expiration plus garbage collection can eventually remove unreachable objects. It does not recover uncommitted working-tree bytes that Git never stored. For important history I rely on protected remote references or independent backups, not an assumed ninety-day recovery window.'
      zh: '我会先停止修改仓库，再带日期查看 git reflog，并根据操作、时间、tree 和父链找出 reset 前的 commit。确认完整对象标识后，我先在该位置创建救援分支，再决定是否执行 reset、cherry-pick 或 merge。Reflog 只属于本地仓库，其他克隆未必有相同条目；条目过期与垃圾回收最终可能删除不可达对象。它也无法恢复 Git 从未存储的工作树字节。重要历史应依靠受保护的远端引用或独立备份，不能假定固定九十天的恢复窗口。'
    topics: [foundations/git-deep-dive]
    level: advanced
    section: { en: 'Failure recovery', zh: '故障恢复' }
    frequency: common
    tags: [git, reflog, recovery, reachability]
