track: frontend
items:
  - id: css-transition-versus-keyframes
    question: { en: 'How do you choose between a CSS transition and a keyframe animation?', zh: '怎样在 CSS 过渡与关键帧动画之间选择？' }
    answer:
      en: 'Choose a transition when another state mechanism already changes a property, such as a class, attribute, hover, or focus state, and you only need interpolation from the current value to the target. Choose keyframes when the effect owns an explicit timeline with intermediate stages, repetitions, alternation, or automatic start. A transition reacts to before-and-after computed values; an animation applies named keyframes through animation properties. In either case, keep business and accessibility state outside the animation so the interface remains correct when motion is disabled or canceled.'
      zh: '当类名、属性、悬停或焦点状态已经改变某个属性，而且只需从当前值插值到目标值时，应选择过渡。效果需要明确的中间阶段、重复、交替或自动开始时，应选择关键帧。过渡响应变化前后的计算值，动画则通过 animation 属性应用命名关键帧。无论采用哪种机制，业务状态和可访问状态都应独立于动画，这样在动态效果被禁用或取消时，界面仍然正确。'
    topics: [frontend/css-animation]
    level: beginner
    section: { en: 'HTML and CSS', zh: 'HTML 与 CSS' }
    frequency: common
    tags: [css, transition, keyframes]

  - id: css-animation-performance-review
    question: { en: 'How do you review the rendering performance of a CSS animation?', zh: '怎样审查 CSS 动画的渲染性能？' }
    answer:
      en: 'Start with a recording of the real interaction on a representative device. Inspect whether sampled frames cause style calculation, layout, paint, or only compositing, and look for long frames and large affected regions. Transform and opacity often avoid layout, but they do not guarantee a separate GPU layer or low total cost. Compare a viable alternative instead of relying on a property blacklist. Use will-change only if the trace shows a benefit, apply it shortly before the effect, and remove it afterward so layer memory is not retained indefinitely.'
      zh: '先在有代表性的设备上录制真实交互，再检查采样帧是否执行样式计算、布局、绘制或仅执行合成，同时观察长帧和大面积受影响区域。transform 与 opacity 通常能避开布局，但并不保证独立 GPU 图层或较低总成本。应比较可行实现，而不是依赖属性黑名单。只有录制结果显示收益时才使用 will-change，在效果前短暂设置，并在结束后移除，避免长期占用图层内存。'
    topics: [frontend/css-animation]
    level: intermediate
    section: { en: 'Browser rendering', zh: '浏览器渲染' }
    frequency: common
    tags: [performance, rendering, compositing]

  - id: css-animation-reduced-motion
    question: { en: 'What should a reduced-motion implementation guarantee?', zh: '减少动态效果的实现应保证什么？' }
    answer:
      en: 'It should remove or replace non-essential movement while preserving content, state feedback, focus order, and task completion. Use the prefers-reduced-motion media feature to select an intentional alternative for each effect; do not assume one global near-zero-duration reset is safe. JavaScript must not require transitionend or animationend to commit state, because a disabled or ungenerated effect may produce no useful end event. Test both media settings, including rapid repeated input, and confirm that a spinner or entrance motion is never the only way important information is conveyed.'
      zh: '实现应移除或替换非必要运动，同时保留内容、状态反馈、焦点顺序和任务完成路径。应使用 prefers-reduced-motion 为每种效果选择有意设计的替代方案，不能假设一个全局近零时长重置就安全。JavaScript 不应依赖 transitionend 或 animationend 才提交状态，因为被禁用或未生成的效果可能没有可用的结束事件。两种媒体设置都要测试，还要覆盖快速重复输入，并确认旋转或入场运动不是传达重要信息的唯一方式。'
    topics: [frontend/css-animation]
    level: intermediate
    section: { en: 'Accessibility', zh: '无障碍' }
    frequency: common
    tags: [accessibility, reduced-motion, events]

  - id: css-animation-fill-cascade
    question: { en: 'Why is animation-fill-mode: forwards not a persistent state mechanism?', zh: '为什么 animation-fill-mode: forwards 不是持久状态机制？' }
    answer:
      en: 'Forwards extends the animation effect into its after phase, so the final sampled value can keep participating in the cascade. It does not copy declarations into inline style, update a class, or change component data. Removing the animation name exposes the underlying ordinary style, and other cascade rules may override the filled value. Long-lived fill also makes a completed animation continue to affect later style changes. Put the durable endpoint in an ordinary state rule or DOM attribute, then use fill only to control what appears around delays and active-phase boundaries.'
      zh: 'forwards 会把动画效果延伸到结束后的阶段，让最终采样值继续参与层叠。它不会把声明复制到行内样式，也不会更新类名或组件数据。移除动画名称后，底层普通样式会重新出现，其他层叠规则也可能覆盖填充值。长期填充还会让已结束动画继续影响后续样式变化。持久终点应写在普通状态规则或 DOM 属性中，填充模式只负责延迟与活动阶段边界附近的呈现。'
    topics: [frontend/css-animation]
    level: advanced
    section: { en: 'CSS cascade', zh: 'CSS 层叠' }
    frequency: occasional
    tags: [animation, fill-mode, cascade]
