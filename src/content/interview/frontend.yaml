track: frontend
items:
  - id: css-transition-versus-keyframes
    question: { en: 'How do you choose between a CSS transition and a keyframe animation?', zh: '怎样在 CSS 过渡与关键帧动画之间选择？' }
    answer:
      en: 'Choose a transition when another state mechanism already changes a property, such as a class, attribute, hover, or focus state, and you only need interpolation from the current value to the target. Choose keyframes when the effect owns an explicit timeline with intermediate stages, repetitions, alternation, or automatic start. A transition reacts to before-and-after computed values; an animation applies named keyframes through animation properties. In either case, keep business and accessibility state outside the animation so the interface remains correct when motion is disabled or canceled.'
      zh: '当类名、属性、悬停或焦点状态已经改变某个属性，而且只需从当前值插值到目标值时，应选择过渡。效果需要明确的中间阶段、重复、交替或自动开始时，应选择关键帧。过渡响应变化前后的计算值，动画则通过 animation 属性应用命名关键帧。无论采用哪种机制，业务状态和可访问状态都应独立于动画，这样在动态效果被禁用或取消时，界面仍然正确。'
    topics: [frontend/css-animation]
    level: beginner
    section: { en: 'HTML and CSS', zh: 'HTML 与 CSS' }
    frequency: common
    tags: [css, transition, keyframes]

  - id: css-animation-performance-review
    question: { en: 'How do you review the rendering performance of a CSS animation?', zh: '怎样审查 CSS 动画的渲染性能？' }
    answer:
      en: 'Start with a recording of the real interaction on a representative device. Inspect whether sampled frames cause style calculation, layout, paint, or only compositing, and look for long frames and large affected regions. Transform and opacity often avoid layout, but they do not guarantee a separate GPU layer or low total cost. Compare a viable alternative instead of relying on a property blacklist. Use will-change only if the trace shows a benefit, apply it shortly before the effect, and remove it afterward so layer memory is not retained indefinitely.'
      zh: '先在有代表性的设备上录制真实交互，再检查采样帧是否执行样式计算、布局、绘制或仅执行合成，同时观察长帧和大面积受影响区域。transform 与 opacity 通常能避开布局，但并不保证独立 GPU 图层或较低总成本。应比较可行实现，而不是依赖属性黑名单。只有录制结果显示收益时才使用 will-change，在效果前短暂设置，并在结束后移除，避免长期占用图层内存。'
    topics: [frontend/css-animation]
    level: intermediate
    section: { en: 'Browser rendering', zh: '浏览器渲染' }
    frequency: common
    tags: [performance, rendering, compositing]

  - id: css-animation-reduced-motion
    question: { en: 'What should a reduced-motion implementation guarantee?', zh: '减少动态效果的实现应保证什么？' }
    answer:
      en: 'It should remove or replace non-essential movement while preserving content, state feedback, focus order, and task completion. Use the prefers-reduced-motion media feature to select an intentional alternative for each effect; do not assume one global near-zero-duration reset is safe. JavaScript must not require transitionend or animationend to commit state, because a disabled or ungenerated effect may produce no useful end event. Test both media settings, including rapid repeated input, and confirm that a spinner or entrance motion is never the only way important information is conveyed.'
      zh: '实现应移除或替换非必要运动，同时保留内容、状态反馈、焦点顺序和任务完成路径。应使用 prefers-reduced-motion 为每种效果选择有意设计的替代方案，不能假设一个全局近零时长重置就安全。JavaScript 不应依赖 transitionend 或 animationend 才提交状态，因为被禁用或未生成的效果可能没有可用的结束事件。两种媒体设置都要测试，还要覆盖快速重复输入，并确认旋转或入场运动不是传达重要信息的唯一方式。'
    topics: [frontend/css-animation]
    level: intermediate
    section: { en: 'Accessibility', zh: '无障碍' }
    frequency: common
    tags: [accessibility, reduced-motion, events]

  - id: css-animation-fill-cascade
    question: { en: 'Why is animation-fill-mode: forwards not a persistent state mechanism?', zh: '为什么 animation-fill-mode: forwards 不是持久状态机制？' }
    answer:
      en: 'Forwards extends the animation effect into its after phase, so the final sampled value can keep participating in the cascade. It does not copy declarations into inline style, update a class, or change component data. Removing the animation name exposes the underlying ordinary style, and other cascade rules may override the filled value. Long-lived fill also makes a completed animation continue to affect later style changes. Put the durable endpoint in an ordinary state rule or DOM attribute, then use fill only to control what appears around delays and active-phase boundaries.'
      zh: 'forwards 会把动画效果延伸到结束后的阶段，让最终采样值继续参与层叠。它不会把声明复制到行内样式，也不会更新类名或组件数据。移除动画名称后，底层普通样式会重新出现，其他层叠规则也可能覆盖填充值。长期填充还会让已结束动画继续影响后续样式变化。持久终点应写在普通状态规则或 DOM 属性中，填充模式只负责延迟与活动阶段边界附近的呈现。'
    topics: [frontend/css-animation]
    level: advanced
    section: { en: 'CSS cascade', zh: 'CSS 层叠' }
    frequency: occasional
    tags: [animation, fill-mode, cascade]

  - id: css-flexbox-axis-model
    question: { en: 'How do the main and cross axes determine Flexbox alignment?', zh: '主轴与交叉轴怎样决定 Flexbox 的对齐方式？' }
    answer:
      en: 'The main axis comes from flex-direction, not from a fixed idea of horizontal layout. Row follows the writing mode’s inline axis, while column follows its block axis; reverse values swap the axis endpoints. justify-content distributes remaining space on that main axis. align-items and align-self position items on the perpendicular cross axis, while align-content distributes multiple flex lines there. I first identify flex-direction, writing mode, and direction, then choose an alignment property. That avoids the common mistake of memorizing justify-content as horizontal and align-items as vertical.'
      zh: '主轴由 flex-direction 决定，不是固定的水平方向。row 跟随书写模式的行内轴，column 跟随块轴，reverse 值会交换轴的起点和终点。justify-content 在主轴上分配剩余空间，align-items 与 align-self 在垂直的交叉轴上放置项目，align-content 则在那里分配多条 Flex 行。我会先确定 flex-direction、writing-mode 和 direction，再选择对齐属性，避免把 justify-content 死记成水平对齐、把 align-items 死记成垂直对齐。'
    topics: [frontend/css-flexbox]
    level: beginner
    section: { en: 'HTML and CSS', zh: 'HTML 与 CSS' }
    frequency: common
    tags: [flexbox, axes, alignment]

  - id: css-flexbox-equal-widths
    question: { en: 'Does flex: 1 guarantee equal-width flex items?', zh: 'flex: 1 能保证 Flex 项目等宽吗？' }
    answer:
      en: 'It gives items the same grow and shrink factors and a zero-like base in common browser shorthand expansion, but equal outer widths still depend on the other constraints. An automatic minimum can keep a long item wider. Different padding, borders, box sizing, explicit minimums, or replaced content can also change the border-box result. For equal cards, I use a zero flex basis, normalize the box model, apply min-inline-size: 0 where content may shrink, and measure border boxes with representative content. If columns must align across wrapped rows, I choose Grid instead.'
      zh: '在浏览器常见的简写展开中，它会给项目相同的伸长与收缩因子以及近似零的基准，但外框等宽仍取决于其他约束。自动最小尺寸可能让长内容项目保持更宽，不同的内边距、边框、盒模型、明确最小值或替换内容也会改变外框结果。要做等宽卡片，我会使用零 flex-basis，统一盒模型，在内容可收缩处设置 min-inline-size: 0，并用代表性内容测量外框。若换行后仍要求跨行列对齐，我会改用 Grid。'
    topics: [frontend/css-flexbox]
    level: intermediate
    section: { en: 'HTML and CSS', zh: 'HTML 与 CSS' }
    frequency: common
    tags: [flex, sizing, box-model]

  - id: css-flexbox-minimum-overflow
    question: { en: 'Why can a flex item overflow even when flex-shrink is 1?', zh: '为什么 Flex 项目的 flex-shrink 为 1 时仍会溢出？' }
    answer:
      en: 'flex-shrink distributes negative free space, but it does not override the item’s minimum size. The default main-axis minimum is auto and can resolve to a content-based floor, especially with a long unbreakable string or an intrinsically sized element. When the target reaches that floor, the item freezes and remaining reduction moves elsewhere; if every item is constrained, the line overflows. I inspect the item that owns the content, then set min-inline-size: 0 only when shrinking is intended and add an explicit wrapping, clipping, or scrolling policy.'
      zh: 'flex-shrink 负责分配负剩余空间，但不会覆盖项目的最小尺寸。主轴最小尺寸默认为 auto，可能得到与内容有关的下限，长且不可断的字符串或带固有尺寸的元素尤其容易触发。目标尺寸到达下限后，项目会被冻结，剩余缩减转移给其他项目；所有项目都受限时，整行只能溢出。我会找到真正承载内容的项目，只在确实允许收缩时设置 min-inline-size: 0，并明确选择换行、裁剪或滚动策略。'
    topics: [frontend/css-flexbox]
    level: intermediate
    section: { en: 'HTML and CSS', zh: 'HTML 与 CSS' }
    frequency: common
    tags: [flex-shrink, automatic-minimum-size, overflow]

  - id: css-flexbox-order-accessibility
    question: { en: 'What is the accessibility risk of order and reversed flex directions?', zh: 'order 与反向 Flex 方向有什么无障碍风险？' }
    answer:
      en: 'They reorder flex items visually but do not rewrite the DOM. Reading order for non-visual presentation and sequential keyboard focus normally continue to follow source order, so a user may see controls left to right while Tab moves through them in another sequence. The safest fix is to make source order match the content and task logic, then use layout that preserves it at each breakpoint. I reserve visual reordering for decorative or semantically independent items and verify the result with keyboard navigation, a screen reader, both text directions, and an unstyled view.'
      zh: '它们会在视觉上重排 Flex 项目，却不会改写 DOM。非视觉呈现的阅读顺序和顺序键盘焦点通常仍按源顺序进行，因此用户可能看到控件从左到右排列，按 Tab 键时却沿另一顺序移动。最安全的修复是让源顺序符合内容与任务逻辑，再在每个断点采用保留该顺序的布局。我只对装饰性或语义互不依赖的项目做视觉重排，并用键盘导航、屏幕阅读器、两种文字方向和无样式视图验证结果。'
    topics: [frontend/css-flexbox]
    level: intermediate
    section: { en: 'Accessibility', zh: '无障碍' }
    frequency: occasional
    tags: [order, accessibility, source-order]

  - id: css-grid-track-sizing-fr
    question: { en: 'What does the fr unit represent, and why can a 1fr track still overflow?', zh: 'fr 单位表示什么？为什么 1fr 轨道仍可能溢出？' }
    answer:
      en: 'An fr is a share of the grid container’s flexible leftover space, not a percentage of its full width. Fixed tracks and gaps consume space first, and flexible tracks divide what remains. A plain 1fr track also has an automatic minimum, which may use the min-content contribution of a long string or intrinsically sized child. When shrinking is genuinely allowed, I use minmax(0, 1fr) for the track or min-inline-size: 0 on the item, then specify whether content wraps, clips, or scrolls instead of hiding overflow blindly.'
      zh: 'fr 表示网格容器中弹性剩余空间的一份，不是完整宽度的百分比。固定轨道和间隔先占用空间，弹性轨道再分配剩余部分。普通 1fr 轨道还有自动最小值，可能采用长字符串或固有尺寸子元素的最小内容贡献。设计确实允许收缩时，我会对轨道使用 minmax(0, 1fr)，或对项目设置 min-inline-size: 0，再明确内容应该换行、裁剪还是滚动，而不是一律隐藏溢出。'
    topics: [frontend/css-grid]
    level: intermediate
    section: { en: 'HTML and CSS', zh: 'HTML 与 CSS' }
    frequency: common
    tags: [grid, fr, track-sizing, overflow]

  - id: css-grid-explicit-implicit
    question: { en: 'How do explicit and implicit grids differ, and how do you debug an accidental implicit column?', zh: '显式网格与隐式网格有何区别？怎样调试意外出现的隐式列？' }
    answer:
      en: 'The explicit grid comes from grid-template-columns, grid-template-rows, and grid-template-areas. Grid creates implicit tracks when auto-placement needs more cells or an item is positioned beyond the explicit boundary; grid-auto-columns and grid-auto-rows size those tracks. For an unexpected horizontal scrollbar, I inspect the computed track list and the browser’s grid overlay, then search every child for grid-column or grid-area rules that survive a breakpoint. I reset stale placement with auto and compare clientWidth with scrollWidth at each supported container size.'
      zh: '显式网格来自 grid-template-columns、grid-template-rows 和 grid-template-areas。自动放置需要更多单元格，或项目被定位到显式边界之外时，Grid 会创建隐式轨道；grid-auto-columns 与 grid-auto-rows 控制其尺寸。遇到意外水平滚动条时，我会查看计算轨道列表和浏览器网格覆盖层，再搜索每个子元素上跨断点残留的 grid-column 或 grid-area 规则。我会用 auto 重置遗留定位，并在每个支持的容器尺寸下比较 clientWidth 与 scrollWidth。'
    topics: [frontend/css-grid]
    level: intermediate
    section: { en: 'HTML and CSS', zh: 'HTML 与 CSS' }
    frequency: common
    tags: [explicit-grid, implicit-grid, responsive-design]

  - id: css-grid-auto-fit-fill
    question: { en: 'How do auto-fit and auto-fill differ in a responsive repeated grid?', zh: '响应式重复网格中的 auto-fit 与 auto-fill 有何区别？' }
    answer:
      en: 'Both keywords calculate how many repeated tracks fit into the available size, subject to the track’s minimum. Their difference appears when there are fewer items than possible tracks. auto-fill keeps empty tracks present, so they continue to occupy space. auto-fit collapses those empty tracks and their adjacent gutters, allowing occupied flexible tracks to expand into the released space. They look identical when every generated track contains an item. I test with one or two items in a wide container and choose based on whether empty column slots should remain.'
      zh: '两个关键字都会根据轨道最小尺寸，计算可用空间能容纳多少条重复轨道。可用轨道多于项目时，差异才会出现。auto-fill 保留空轨道，因此空位继续占据空间；auto-fit 会折叠空轨道及相邻间隔，让已有弹性轨道扩展到释放出的空间。每条生成轨道都有项目时，两者看起来相同。我会在宽容器中只放一两个项目，再根据是否需要保留空列位置作出选择。'
    topics: [frontend/css-grid]
    level: intermediate
    section: { en: 'HTML and CSS', zh: 'HTML 与 CSS' }
    frequency: common
    tags: [auto-fit, auto-fill, responsive-design]

  - id: css-grid-source-order
    question: { en: 'Why can Grid placement create an accessibility problem even when the visual layout looks correct?', zh: '为什么 Grid 的视觉布局看似正确，项目定位仍可能造成无障碍问题？' }
    answer:
      en: 'Explicit line placement and grid-auto-flow: dense can change where items appear without changing the DOM. Sequential keyboard focus and non-visual reading normally continue to follow source order, so focus may jump against the screen’s visual sequence or instructions may be announced out of order. I first make DOM order match content and task logic, then use layout that preserves that sequence. I compare DOM, visual-coordinate, and Tab order at every breakpoint, test with CSS disabled, and reserve dense packing for decorative or otherwise order-independent collections.'
      zh: '显式网格线定位与 grid-auto-flow: dense 可以改变项目的显示位置，却不会改变 DOM。顺序键盘焦点和非视觉阅读通常仍遵循源顺序，因此焦点可能逆着屏幕视觉顺序跳动，说明内容也可能按错误次序读出。我会先让 DOM 顺序符合内容与任务逻辑，再采用保留该顺序的布局。每个断点都要比较 DOM、视觉坐标和 Tab 顺序，并在禁用 CSS 后测试；dense 只用于装饰性或其他顺序无关的集合。'
    topics: [frontend/css-grid]
    level: intermediate
    section: { en: 'Accessibility', zh: '无障碍' }
    frequency: occasional
    tags: [grid-placement, accessibility, source-order, dense]

  - id: css-in-js-execution-boundary
    question: { en: 'How do you choose between runtime CSS-in-JS and build-time extraction?', zh: '怎样在运行时 CSS-in-JS 与构建时提取之间选择？' }
    answer:
      en: 'I start with the values the component must express. Finite states such as size, tone, and disabled usually fit extracted classes or data-attribute selectors. High-cardinality values can often use CSS custom properties without runtime rule generation. I choose a runtime engine only when live JavaScript evaluation provides a concrete benefit, then include its cache, client cost, server collector, CSP support, and upgrade path in the decision. I compare production assets and browser traces from the actual route rather than quoting another project’s bundle or timing numbers.'
      zh: '我会先列出组件必须表达的值。尺寸、色调和禁用状态等有限状态，通常适合提取类名或数据属性选择器。高基数值往往可以通过 CSS 自定义属性传入，不必在运行时生成规则。只有实时计算 JavaScript 能带来明确收益时，我才会选择运行时引擎，并把缓存、客户端成本、服务端收集器、CSP 支持和升级路径纳入决策。我会比较实际路由的生产资源和浏览器轨迹，不会照搬其他项目的包体积或耗时数字。'
    topics: [frontend/css-in-js]
    level: intermediate
    section: { en: 'HTML and CSS', zh: 'HTML 与 CSS' }
    frequency: common
    tags: [css-in-js, architecture, performance]

  - id: css-in-js-dynamic-values
    question: { en: 'Why are CSS custom properties often better than rule interpolation for rapidly changing values?', zh: '为什么频繁变化的值通常更适合使用 CSS 自定义属性，而不是规则插值？' }
    answer:
      en: 'A class should describe a reusable style category, while a drag coordinate, progress value, or picker color belongs to one element and may have many possible values. Interpolating each value into a runtime rule can grow the rule cache and repeat serialization work. I keep one class whose declaration reads a custom property, validate the incoming value, attach the correct unit, and set the property per element. Finite states still use classes or data attributes. I confirm the choice with a trace when the update path is performance sensitive.'
      zh: '类名应该描述可复用的样式类别，而拖动坐标、进度值或颜色选择结果只属于某个元素，并且可能拥有大量取值。把每个值插入运行时规则会扩大规则缓存，还会重复执行序列化。我会保留一条读取自定义属性的类规则，验证输入值，补上正确单位，再为单个元素设置属性。有限状态仍使用类名或数据属性。如果更新路径对性能敏感，我还会录制浏览器轨迹来确认选择。'
    topics: [frontend/css-in-js]
    level: intermediate
    section: { en: 'Browser rendering', zh: '浏览器渲染' }
    frequency: common
    tags: [css-custom-properties, dynamic-values, performance]

  - id: css-in-js-server-rendering
    question: { en: 'What must a runtime CSS-in-JS server-rendering integration guarantee?', zh: '运行时 CSS-in-JS 的服务端渲染集成必须保证什么？' }
    answer:
      en: 'It must collect the rules used by one render, serialize them into the response at the right time, and let the client adopt them without duplication. Class identifiers and rule order must be deterministic across server and client inputs. The registry should be request scoped so concurrent requests cannot leak styles. With streaming, each chunk needs its rules before or alongside its markup. I test the raw response with JavaScript disabled, hydrate while treating warnings as failures, and navigate through code-split routes to catch missing rules, stale caches, and insertion-order changes.'
      zh: '集成必须收集单次渲染使用的规则，在正确时机把它们序列化进响应，并让客户端接管而不重复插入。类标识和规则顺序在服务端与客户端输入下必须确定一致。注册表应限制在单个请求内，避免并发请求相互泄漏样式。使用流式传输时，每个区块的规则必须早于或同时于标记到达。我会在禁用 JavaScript 时检查原始响应，把水合警告视为失败，并访问代码分割路由来发现规则缺失、残留缓存和插入顺序变化。'
    topics: [frontend/css-in-js]
    level: advanced
    section: { en: 'Server rendering', zh: '服务端渲染' }
    frequency: common
    tags: [ssr, hydration, determinism, streaming]

  - id: css-in-js-cascade
    question: { en: 'Does a generated class name isolate a component from the CSS cascade?', zh: '生成的类名能让组件脱离 CSS 层叠吗？' }
    answer:
      en: 'No. A generated name reduces accidental selector collisions, but the resulting rule is still ordinary CSS. Origin, cascade layers, importance, specificity, inheritance, scoping proximity, and source order can all affect the element. Global selectors can reach it, and equal-priority generated rules can change behavior when insertion order changes. I define an override contract, assign styling systems to deliberate layers or insertion points, and inspect computed styles in the integrated application. I avoid exposing build-generated class strings because hashes and compiler names are not stable public APIs.'
      zh: '不能。生成名称可以减少意外的选择器重名，但最终规则仍是普通 CSS。声明来源、层叠层、重要性、优先级、继承、作用域邻近性和源码顺序都会影响元素。全局选择器仍能命中它；同优先级的生成规则还可能因插入顺序变化而改变行为。我会定义覆盖契约，把样式系统放进有意设计的层或插入点，并在集成后的应用中检查计算样式。我不会公开构建生成的类名字符串，因为哈希和编译器名称不是稳定的公共 API。'
    topics: [frontend/css-in-js]
    level: intermediate
    section: { en: 'CSS cascade', zh: 'CSS 层叠' }
    frequency: occasional
    tags: [cascade, specificity, style-order]
