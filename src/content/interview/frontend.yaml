track: frontend
items:
  - id: css-transition-versus-keyframes
    question: { en: 'How do you choose between a CSS transition and a keyframe animation?', zh: '怎样在 CSS 过渡与关键帧动画之间选择？' }
    answer:
      en: 'Choose a transition when another state mechanism already changes a property, such as a class, attribute, hover, or focus state, and you only need interpolation from the current value to the target. Choose keyframes when the effect owns an explicit timeline with intermediate stages, repetitions, alternation, or automatic start. A transition reacts to before-and-after computed values; an animation applies named keyframes through animation properties. In either case, keep business and accessibility state outside the animation so the interface remains correct when motion is disabled or canceled.'
      zh: '当类名、属性、悬停或焦点状态已经改变某个属性，而且只需从当前值插值到目标值时，应选择过渡。效果需要明确的中间阶段、重复、交替或自动开始时，应选择关键帧。过渡响应变化前后的计算值，动画则通过 animation 属性应用命名关键帧。无论采用哪种机制，业务状态和可访问状态都应独立于动画，这样在动态效果被禁用或取消时，界面仍然正确。'
    topics: [frontend/css-animation]
    level: beginner
    section: { en: 'HTML and CSS', zh: 'HTML 与 CSS' }
    frequency: common
    tags: [css, transition, keyframes]

  - id: css-animation-performance-review
    question: { en: 'How do you review the rendering performance of a CSS animation?', zh: '怎样审查 CSS 动画的渲染性能？' }
    answer:
      en: 'Start with a recording of the real interaction on a representative device. Inspect whether sampled frames cause style calculation, layout, paint, or only compositing, and look for long frames and large affected regions. Transform and opacity often avoid layout, but they do not guarantee a separate GPU layer or low total cost. Compare a viable alternative instead of relying on a property blacklist. Use will-change only if the trace shows a benefit, apply it shortly before the effect, and remove it afterward so layer memory is not retained indefinitely.'
      zh: '先在有代表性的设备上录制真实交互，再检查采样帧是否执行样式计算、布局、绘制或仅执行合成，同时观察长帧和大面积受影响区域。transform 与 opacity 通常能避开布局，但并不保证独立 GPU 图层或较低总成本。应比较可行实现，而不是依赖属性黑名单。只有录制结果显示收益时才使用 will-change，在效果前短暂设置，并在结束后移除，避免长期占用图层内存。'
    topics: [frontend/css-animation]
    level: intermediate
    section: { en: 'Browser rendering', zh: '浏览器渲染' }
    frequency: common
    tags: [performance, rendering, compositing]

  - id: css-animation-reduced-motion
    question: { en: 'What should a reduced-motion implementation guarantee?', zh: '减少动态效果的实现应保证什么？' }
    answer:
      en: 'It should remove or replace non-essential movement while preserving content, state feedback, focus order, and task completion. Use the prefers-reduced-motion media feature to select an intentional alternative for each effect; do not assume one global near-zero-duration reset is safe. JavaScript must not require transitionend or animationend to commit state, because a disabled or ungenerated effect may produce no useful end event. Test both media settings, including rapid repeated input, and confirm that a spinner or entrance motion is never the only way important information is conveyed.'
      zh: '实现应移除或替换非必要运动，同时保留内容、状态反馈、焦点顺序和任务完成路径。应使用 prefers-reduced-motion 为每种效果选择有意设计的替代方案，不能假设一个全局近零时长重置就安全。JavaScript 不应依赖 transitionend 或 animationend 才提交状态，因为被禁用或未生成的效果可能没有可用的结束事件。两种媒体设置都要测试，还要覆盖快速重复输入，并确认旋转或入场运动不是传达重要信息的唯一方式。'
    topics: [frontend/css-animation]
    level: intermediate
    section: { en: 'Accessibility', zh: '无障碍' }
    frequency: common
    tags: [accessibility, reduced-motion, events]

  - id: css-animation-fill-cascade
    question: { en: 'Why is animation-fill-mode: forwards not a persistent state mechanism?', zh: '为什么 animation-fill-mode: forwards 不是持久状态机制？' }
    answer:
      en: 'Forwards extends the animation effect into its after phase, so the final sampled value can keep participating in the cascade. It does not copy declarations into inline style, update a class, or change component data. Removing the animation name exposes the underlying ordinary style, and other cascade rules may override the filled value. Long-lived fill also makes a completed animation continue to affect later style changes. Put the durable endpoint in an ordinary state rule or DOM attribute, then use fill only to control what appears around delays and active-phase boundaries.'
      zh: 'forwards 会把动画效果延伸到结束后的阶段，让最终采样值继续参与层叠。它不会把声明复制到行内样式，也不会更新类名或组件数据。移除动画名称后，底层普通样式会重新出现，其他层叠规则也可能覆盖填充值。长期填充还会让已结束动画继续影响后续样式变化。持久终点应写在普通状态规则或 DOM 属性中，填充模式只负责延迟与活动阶段边界附近的呈现。'
    topics: [frontend/css-animation]
    level: advanced
    section: { en: 'CSS cascade', zh: 'CSS 层叠' }
    frequency: occasional
    tags: [animation, fill-mode, cascade]

  - id: css-flexbox-axis-model
    question: { en: 'How do the main and cross axes determine Flexbox alignment?', zh: '主轴与交叉轴怎样决定 Flexbox 的对齐方式？' }
    answer:
      en: 'The main axis comes from flex-direction, not from a fixed idea of horizontal layout. Row follows the writing mode’s inline axis, while column follows its block axis; reverse values swap the axis endpoints. justify-content distributes remaining space on that main axis. align-items and align-self position items on the perpendicular cross axis, while align-content distributes multiple flex lines there. I first identify flex-direction, writing mode, and direction, then choose an alignment property. That avoids the common mistake of memorizing justify-content as horizontal and align-items as vertical.'
      zh: '主轴由 flex-direction 决定，不是固定的水平方向。row 跟随书写模式的行内轴，column 跟随块轴，reverse 值会交换轴的起点和终点。justify-content 在主轴上分配剩余空间，align-items 与 align-self 在垂直的交叉轴上放置项目，align-content 则在那里分配多条 Flex 行。我会先确定 flex-direction、writing-mode 和 direction，再选择对齐属性，避免把 justify-content 死记成水平对齐、把 align-items 死记成垂直对齐。'
    topics: [frontend/css-flexbox]
    level: beginner
    section: { en: 'HTML and CSS', zh: 'HTML 与 CSS' }
    frequency: common
    tags: [flexbox, axes, alignment]

  - id: css-flexbox-equal-widths
    question: { en: 'Does flex: 1 guarantee equal-width flex items?', zh: 'flex: 1 能保证 Flex 项目等宽吗？' }
    answer:
      en: 'It gives items the same grow and shrink factors and a zero-like base in common browser shorthand expansion, but equal outer widths still depend on the other constraints. An automatic minimum can keep a long item wider. Different padding, borders, box sizing, explicit minimums, or replaced content can also change the border-box result. For equal cards, I use a zero flex basis, normalize the box model, apply min-inline-size: 0 where content may shrink, and measure border boxes with representative content. If columns must align across wrapped rows, I choose Grid instead.'
      zh: '在浏览器常见的简写展开中，它会给项目相同的伸长与收缩因子以及近似零的基准，但外框等宽仍取决于其他约束。自动最小尺寸可能让长内容项目保持更宽，不同的内边距、边框、盒模型、明确最小值或替换内容也会改变外框结果。要做等宽卡片，我会使用零 flex-basis，统一盒模型，在内容可收缩处设置 min-inline-size: 0，并用代表性内容测量外框。若换行后仍要求跨行列对齐，我会改用 Grid。'
    topics: [frontend/css-flexbox]
    level: intermediate
    section: { en: 'HTML and CSS', zh: 'HTML 与 CSS' }
    frequency: common
    tags: [flex, sizing, box-model]

  - id: css-flexbox-minimum-overflow
    question: { en: 'Why can a flex item overflow even when flex-shrink is 1?', zh: '为什么 Flex 项目的 flex-shrink 为 1 时仍会溢出？' }
    answer:
      en: 'flex-shrink distributes negative free space, but it does not override the item’s minimum size. The default main-axis minimum is auto and can resolve to a content-based floor, especially with a long unbreakable string or an intrinsically sized element. When the target reaches that floor, the item freezes and remaining reduction moves elsewhere; if every item is constrained, the line overflows. I inspect the item that owns the content, then set min-inline-size: 0 only when shrinking is intended and add an explicit wrapping, clipping, or scrolling policy.'
      zh: 'flex-shrink 负责分配负剩余空间，但不会覆盖项目的最小尺寸。主轴最小尺寸默认为 auto，可能得到与内容有关的下限，长且不可断的字符串或带固有尺寸的元素尤其容易触发。目标尺寸到达下限后，项目会被冻结，剩余缩减转移给其他项目；所有项目都受限时，整行只能溢出。我会找到真正承载内容的项目，只在确实允许收缩时设置 min-inline-size: 0，并明确选择换行、裁剪或滚动策略。'
    topics: [frontend/css-flexbox]
    level: intermediate
    section: { en: 'HTML and CSS', zh: 'HTML 与 CSS' }
    frequency: common
    tags: [flex-shrink, automatic-minimum-size, overflow]

  - id: css-flexbox-order-accessibility
    question: { en: 'What is the accessibility risk of order and reversed flex directions?', zh: 'order 与反向 Flex 方向有什么无障碍风险？' }
    answer:
      en: 'They reorder flex items visually but do not rewrite the DOM. Reading order for non-visual presentation and sequential keyboard focus normally continue to follow source order, so a user may see controls left to right while Tab moves through them in another sequence. The safest fix is to make source order match the content and task logic, then use layout that preserves it at each breakpoint. I reserve visual reordering for decorative or semantically independent items and verify the result with keyboard navigation, a screen reader, both text directions, and an unstyled view.'
      zh: '它们会在视觉上重排 Flex 项目，却不会改写 DOM。非视觉呈现的阅读顺序和顺序键盘焦点通常仍按源顺序进行，因此用户可能看到控件从左到右排列，按 Tab 键时却沿另一顺序移动。最安全的修复是让源顺序符合内容与任务逻辑，再在每个断点采用保留该顺序的布局。我只对装饰性或语义互不依赖的项目做视觉重排，并用键盘导航、屏幕阅读器、两种文字方向和无样式视图验证结果。'
    topics: [frontend/css-flexbox]
    level: intermediate
    section: { en: 'Accessibility', zh: '无障碍' }
    frequency: occasional
    tags: [order, accessibility, source-order]

  - id: css-grid-track-sizing-fr
    question: { en: 'What does the fr unit represent, and why can a 1fr track still overflow?', zh: 'fr 单位表示什么？为什么 1fr 轨道仍可能溢出？' }
    answer:
      en: 'An fr is a share of the grid container’s flexible leftover space, not a percentage of its full width. Fixed tracks and gaps consume space first, and flexible tracks divide what remains. A plain 1fr track also has an automatic minimum, which may use the min-content contribution of a long string or intrinsically sized child. When shrinking is genuinely allowed, I use minmax(0, 1fr) for the track or min-inline-size: 0 on the item, then specify whether content wraps, clips, or scrolls instead of hiding overflow blindly.'
      zh: 'fr 表示网格容器中弹性剩余空间的一份，不是完整宽度的百分比。固定轨道和间隔先占用空间，弹性轨道再分配剩余部分。普通 1fr 轨道还有自动最小值，可能采用长字符串或固有尺寸子元素的最小内容贡献。设计确实允许收缩时，我会对轨道使用 minmax(0, 1fr)，或对项目设置 min-inline-size: 0，再明确内容应该换行、裁剪还是滚动，而不是一律隐藏溢出。'
    topics: [frontend/css-grid]
    level: intermediate
    section: { en: 'HTML and CSS', zh: 'HTML 与 CSS' }
    frequency: common
    tags: [grid, fr, track-sizing, overflow]

  - id: css-grid-explicit-implicit
    question: { en: 'How do explicit and implicit grids differ, and how do you debug an accidental implicit column?', zh: '显式网格与隐式网格有何区别？怎样调试意外出现的隐式列？' }
    answer:
      en: 'The explicit grid comes from grid-template-columns, grid-template-rows, and grid-template-areas. Grid creates implicit tracks when auto-placement needs more cells or an item is positioned beyond the explicit boundary; grid-auto-columns and grid-auto-rows size those tracks. For an unexpected horizontal scrollbar, I inspect the computed track list and the browser’s grid overlay, then search every child for grid-column or grid-area rules that survive a breakpoint. I reset stale placement with auto and compare clientWidth with scrollWidth at each supported container size.'
      zh: '显式网格来自 grid-template-columns、grid-template-rows 和 grid-template-areas。自动放置需要更多单元格，或项目被定位到显式边界之外时，Grid 会创建隐式轨道；grid-auto-columns 与 grid-auto-rows 控制其尺寸。遇到意外水平滚动条时，我会查看计算轨道列表和浏览器网格覆盖层，再搜索每个子元素上跨断点残留的 grid-column 或 grid-area 规则。我会用 auto 重置遗留定位，并在每个支持的容器尺寸下比较 clientWidth 与 scrollWidth。'
    topics: [frontend/css-grid]
    level: intermediate
    section: { en: 'HTML and CSS', zh: 'HTML 与 CSS' }
    frequency: common
    tags: [explicit-grid, implicit-grid, responsive-design]

  - id: css-grid-auto-fit-fill
    question: { en: 'How do auto-fit and auto-fill differ in a responsive repeated grid?', zh: '响应式重复网格中的 auto-fit 与 auto-fill 有何区别？' }
    answer:
      en: 'Both keywords calculate how many repeated tracks fit into the available size, subject to the track’s minimum. Their difference appears when there are fewer items than possible tracks. auto-fill keeps empty tracks present, so they continue to occupy space. auto-fit collapses those empty tracks and their adjacent gutters, allowing occupied flexible tracks to expand into the released space. They look identical when every generated track contains an item. I test with one or two items in a wide container and choose based on whether empty column slots should remain.'
      zh: '两个关键字都会根据轨道最小尺寸，计算可用空间能容纳多少条重复轨道。可用轨道多于项目时，差异才会出现。auto-fill 保留空轨道，因此空位继续占据空间；auto-fit 会折叠空轨道及相邻间隔，让已有弹性轨道扩展到释放出的空间。每条生成轨道都有项目时，两者看起来相同。我会在宽容器中只放一两个项目，再根据是否需要保留空列位置作出选择。'
    topics: [frontend/css-grid]
    level: intermediate
    section: { en: 'HTML and CSS', zh: 'HTML 与 CSS' }
    frequency: common
    tags: [auto-fit, auto-fill, responsive-design]

  - id: css-grid-source-order
    question: { en: 'Why can Grid placement create an accessibility problem even when the visual layout looks correct?', zh: '为什么 Grid 的视觉布局看似正确，项目定位仍可能造成无障碍问题？' }
    answer:
      en: 'Explicit line placement and grid-auto-flow: dense can change where items appear without changing the DOM. Sequential keyboard focus and non-visual reading normally continue to follow source order, so focus may jump against the screen’s visual sequence or instructions may be announced out of order. I first make DOM order match content and task logic, then use layout that preserves that sequence. I compare DOM, visual-coordinate, and Tab order at every breakpoint, test with CSS disabled, and reserve dense packing for decorative or otherwise order-independent collections.'
      zh: '显式网格线定位与 grid-auto-flow: dense 可以改变项目的显示位置，却不会改变 DOM。顺序键盘焦点和非视觉阅读通常仍遵循源顺序，因此焦点可能逆着屏幕视觉顺序跳动，说明内容也可能按错误次序读出。我会先让 DOM 顺序符合内容与任务逻辑，再采用保留该顺序的布局。每个断点都要比较 DOM、视觉坐标和 Tab 顺序，并在禁用 CSS 后测试；dense 只用于装饰性或其他顺序无关的集合。'
    topics: [frontend/css-grid]
    level: intermediate
    section: { en: 'Accessibility', zh: '无障碍' }
    frequency: occasional
    tags: [grid-placement, accessibility, source-order, dense]

  - id: css-in-js-execution-boundary
    question: { en: 'How do you choose between runtime CSS-in-JS and build-time extraction?', zh: '怎样在运行时 CSS-in-JS 与构建时提取之间选择？' }
    answer:
      en: 'I start with the values the component must express. Finite states such as size, tone, and disabled usually fit extracted classes or data-attribute selectors. High-cardinality values can often use CSS custom properties without runtime rule generation. I choose a runtime engine only when live JavaScript evaluation provides a concrete benefit, then include its cache, client cost, server collector, CSP support, and upgrade path in the decision. I compare production assets and browser traces from the actual route rather than quoting another project’s bundle or timing numbers.'
      zh: '我会先列出组件必须表达的值。尺寸、色调和禁用状态等有限状态，通常适合提取类名或数据属性选择器。高基数值往往可以通过 CSS 自定义属性传入，不必在运行时生成规则。只有实时计算 JavaScript 能带来明确收益时，我才会选择运行时引擎，并把缓存、客户端成本、服务端收集器、CSP 支持和升级路径纳入决策。我会比较实际路由的生产资源和浏览器轨迹，不会照搬其他项目的包体积或耗时数字。'
    topics: [frontend/css-in-js]
    level: intermediate
    section: { en: 'HTML and CSS', zh: 'HTML 与 CSS' }
    frequency: common
    tags: [css-in-js, architecture, performance]

  - id: css-in-js-dynamic-values
    question: { en: 'Why are CSS custom properties often better than rule interpolation for rapidly changing values?', zh: '为什么频繁变化的值通常更适合使用 CSS 自定义属性，而不是规则插值？' }
    answer:
      en: 'A class should describe a reusable style category, while a drag coordinate, progress value, or picker color belongs to one element and may have many possible values. Interpolating each value into a runtime rule can grow the rule cache and repeat serialization work. I keep one class whose declaration reads a custom property, validate the incoming value, attach the correct unit, and set the property per element. Finite states still use classes or data attributes. I confirm the choice with a trace when the update path is performance sensitive.'
      zh: '类名应该描述可复用的样式类别，而拖动坐标、进度值或颜色选择结果只属于某个元素，并且可能拥有大量取值。把每个值插入运行时规则会扩大规则缓存，还会重复执行序列化。我会保留一条读取自定义属性的类规则，验证输入值，补上正确单位，再为单个元素设置属性。有限状态仍使用类名或数据属性。如果更新路径对性能敏感，我还会录制浏览器轨迹来确认选择。'
    topics: [frontend/css-in-js]
    level: intermediate
    section: { en: 'Browser rendering', zh: '浏览器渲染' }
    frequency: common
    tags: [css-custom-properties, dynamic-values, performance]

  - id: css-in-js-server-rendering
    question: { en: 'What must a runtime CSS-in-JS server-rendering integration guarantee?', zh: '运行时 CSS-in-JS 的服务端渲染集成必须保证什么？' }
    answer:
      en: 'It must collect the rules used by one render, serialize them into the response at the right time, and let the client adopt them without duplication. Class identifiers and rule order must be deterministic across server and client inputs. The registry should be request scoped so concurrent requests cannot leak styles. With streaming, each chunk needs its rules before or alongside its markup. I test the raw response with JavaScript disabled, hydrate while treating warnings as failures, and navigate through code-split routes to catch missing rules, stale caches, and insertion-order changes.'
      zh: '集成必须收集单次渲染使用的规则，在正确时机把它们序列化进响应，并让客户端接管而不重复插入。类标识和规则顺序在服务端与客户端输入下必须确定一致。注册表应限制在单个请求内，避免并发请求相互泄漏样式。使用流式传输时，每个区块的规则必须早于或同时于标记到达。我会在禁用 JavaScript 时检查原始响应，把水合警告视为失败，并访问代码分割路由来发现规则缺失、残留缓存和插入顺序变化。'
    topics: [frontend/css-in-js]
    level: advanced
    section: { en: 'Server rendering', zh: '服务端渲染' }
    frequency: common
    tags: [ssr, hydration, determinism, streaming]

  - id: css-in-js-cascade
    question: { en: 'Does a generated class name isolate a component from the CSS cascade?', zh: '生成的类名能让组件脱离 CSS 层叠吗？' }
    answer:
      en: 'No. A generated name reduces accidental selector collisions, but the resulting rule is still ordinary CSS. Origin, cascade layers, importance, specificity, inheritance, scoping proximity, and source order can all affect the element. Global selectors can reach it, and equal-priority generated rules can change behavior when insertion order changes. I define an override contract, assign styling systems to deliberate layers or insertion points, and inspect computed styles in the integrated application. I avoid exposing build-generated class strings because hashes and compiler names are not stable public APIs.'
      zh: '不能。生成名称可以减少意外的选择器重名，但最终规则仍是普通 CSS。声明来源、层叠层、重要性、优先级、继承、作用域邻近性和源码顺序都会影响元素。全局选择器仍能命中它；同优先级的生成规则还可能因插入顺序变化而改变行为。我会定义覆盖契约，把样式系统放进有意设计的层或插入点，并在集成后的应用中检查计算样式。我不会公开构建生成的类名字符串，因为哈希和编译器名称不是稳定的公共 API。'
    topics: [frontend/css-in-js]
    level: intermediate
    section: { en: 'CSS cascade', zh: 'CSS 层叠' }
    frequency: occasional
    tags: [cascade, specificity, style-order]

  - id: form-validation-client-server-boundary
    question: { en: 'How do client-side and server-side form validation divide responsibility?', zh: '客户端与服务器端表单验证怎样划分职责？' }
    answer:
      en: 'Client-side validation gives early, contextual feedback and prevents obviously invalid submissions, but it runs in an environment the user controls. I express basic rules with native HTML constraints, add only necessary cross-field or asynchronous checks, and connect errors to controls. The server treats every request as untrusted, parses the expected shape, validates the complete business contract, checks authorization and current state, and enforces concurrent invariants near the write. Shared schemas can reduce duplication, but the server never trusts a client flag claiming that validation passed. Validation also does not replace output encoding, parameterized queries, CSRF protection, or rate limiting.'
      zh: '客户端验证负责尽早提供与字段相关的反馈，并阻止明显无效的提交，但它运行在用户可控制的环境中。我会用原生 HTML 约束表达基础规则，只补充必要的跨字段或异步检查，并把错误与控件关联。服务器把每个请求都视为不可信数据，解析预期结构，验证完整业务契约，检查权限与当前状态，并在写入附近执行并发不变量。共享模式可以减少重复，但服务器绝不信任客户端声称“已经验证”的标志。验证也不能替代输出编码、参数化查询、CSRF 防护或速率限制。'
    topics: [frontend/form-validation]
    level: beginner
    section: { en: 'HTML and CSS', zh: 'HTML 与 CSS' }
    frequency: common
    tags: [forms, server-validation, trust-boundary]

  - id: form-validation-accessible-errors
    question: { en: 'What makes form-validation feedback accessible?', zh: '怎样让表单验证反馈具备无障碍性？' }
    answer:
      en: 'Each control needs a visible label and requirements that users can discover before making an error. When validation fails, I provide concise text that identifies the problem and its repair, connect it with aria-describedby, and set aria-invalid on the control. For long forms I add an error summary whose links focus the corresponding controls, then move focus predictably after submission. I do not rely on color, placeholders, or repeated live-region announcements while the user types. Finally, I test failure, correction, and resubmission with a keyboard and screen reader, including dynamic fields and server-returned errors.'
      zh: '每个控件都需要可见标签，格式要求也应在用户出错前就能发现。验证失败时，我会提供简洁文字，说明问题及修复方式，通过 aria-describedby 把消息与控件关联，并在控件上设置 aria-invalid。对于长表单，我会增加错误摘要，让其中的链接聚焦对应控件，再在提交失败后按可预测方式移动焦点。我不会只依赖颜色、占位符，也不会在用户输入时反复触发实时区域通知。最后，我会用键盘和屏幕阅读器测试失败、修正与重新提交，并覆盖动态字段和服务器返回的错误。'
    topics: [frontend/form-validation]
    level: intermediate
    section: { en: 'Accessibility', zh: '无障碍' }
    frequency: common
    tags: [forms, accessibility, error-summary]

  - id: form-validation-async-races
    question: { en: 'How do you make asynchronous field validation safe?', zh: '怎样安全地实现异步字段验证？' }
    answer:
      en: 'I first run synchronous shape checks so an incomplete value does not start a remote request. I debounce when appropriate, encode the value, and assign each request an identity or cancel obsolete work with AbortController. A response may update the field only if it still belongs to the current value; otherwise a slow earlier response can overwrite newer input. Network failure is distinct from a business rejection such as “username taken,” so it needs its own recoverable state. The server repeats the rule at submission time and enforces uniqueness or inventory atomically because a positive availability check is only a snapshot.'
      zh: '我会先执行同步的结构检查，避免未完成的值启动远程请求。适合时进行防抖，对值编码，并为每个请求分配标识，或用 AbortController 取消过期工作。只有仍然对应当前输入的响应才能更新字段，否则较慢的旧响应会覆盖新值。网络失败不同于“用户名已占用”等业务拒绝，需要独立且可恢复的状态。提交时服务器还要重新执行规则，并以原子方式保证唯一性或库存，因为客户端看到的可用结果只是一张瞬时快照。'
    topics: [frontend/form-validation]
    level: intermediate
    section: { en: 'Browser APIs', zh: '浏览器 API' }
    frequency: occasional
    tags: [async-validation, race-condition, abort-controller]

  - id: form-validation-dynamic-state
    question: { en: 'What usually goes wrong when validation meets conditional fields or multi-step forms?', zh: '条件字段或多步骤表单接入验证时通常会出什么问题？' }
    answer:
      en: 'The visible UI, constraint state, submitted payload, and stored errors often drift apart. When a branch hides a field, I decide whether its value still belongs in the payload, then update visibility, disabled state, required rules, and errors together. Dynamic lists use stable item keys so deleting one row does not move another row’s error. A multi-step form validates the current step for navigation but validates the full payload again at final submission, because editing an earlier answer can invalidate a later step. Tests cover branch changes, back navigation, item deletion, refresh recovery, server rejection, and stale asynchronous responses.'
      zh: '可见界面、约束状态、提交载荷和已保存错误经常发生漂移。某个分支隐藏字段时，我会先决定该值是否仍应进入载荷，再同步更新可见性、禁用状态、必填规则和错误。动态列表使用稳定项目键，避免删除一行后把另一行的错误移错位置。多步骤表单可以为页面导航验证当前步骤，但最终提交时必须再次验证完整载荷，因为修改前面的答案可能让后续步骤失效。测试需要覆盖分支变化、返回导航、项目删除、刷新恢复、服务器拒绝和过期异步响应。'
    topics: [frontend/form-validation]
    level: advanced
    section: { en: 'Application state', zh: '应用状态' }
    frequency: occasional
    tags: [dynamic-forms, multi-step, state-consistency]

  - id: frontend-layer-responsibilities
    question: { en: 'How do you divide responsibility among HTML, CSS, and JavaScript?', zh: '怎样划分 HTML、CSS 与 JavaScript 的职责？' }
    answer:
      en: 'I put content structure, native controls, link destinations, and form data shape in HTML. CSS owns cascade, layout, media adaptation, and visual states without changing document meaning. JavaScript owns state transitions, event coordination, and asynchronous enhancement. The boundary is practical rather than ideological: a form may use HTML constraints for immediate feedback, JavaScript for cross-field behavior, and the server for authoritative validation. I verify each layer independently by inspecting DOM and computed styles, navigating by keyboard, disabling enhancements, and tracing network requests and runtime errors.'
      zh: '我会让 HTML 负责内容结构、原生控件、链接目标和表单数据形状，让 CSS 负责层叠、布局、媒体适配与视觉状态，同时不改变文档含义。JavaScript 负责状态转换、事件协调与异步增强。这不是教条式边界：表单可以用 HTML 约束即时反馈，用 JavaScript 处理跨字段行为，再由服务器执行权威验证。我会分别检查 DOM 与计算样式，用键盘操作，禁用增强，并追踪网络请求与运行错误。'
    topics: [frontend/getting-started]
    level: beginner
    section: { en: 'HTML and CSS', zh: 'HTML 与 CSS' }
    frequency: common
    tags: [html, css, javascript, separation-of-concerns]

  - id: frontend-semantic-control
    question: { en: 'Why is a native button usually better than a clickable div?', zh: '为什么原生按钮通常优于可点击的 div？' }
    answer:
      en: 'A button already exposes the correct role, enters the focus order, responds to expected keyboard input, supports disabled state, and has interoperable activation behavior. A div with a click listener provides none of that by default. Adding role and tabindex still leaves keyboard handling, state, focus styling, and edge cases to implement. I start with button for actions and a link with href for navigation, set the button type explicitly, provide an accessible name, and test activation, focus, and state changes with both keyboard and assistive technology.'
      zh: '按钮默认就公开正确角色，会进入焦点顺序，响应预期键盘输入，支持禁用状态，并具备可互操作的激活行为。带点击监听器的 div 默认没有这些能力；补上 role 与 tabindex 后，键盘处理、状态、焦点样式和边界情况仍需自行实现。操作应从 button 开始，导航应使用带 href 的链接；同时明确按钮类型，提供可访问名称，并用键盘和辅助技术测试激活、焦点与状态变化。'
    topics: [frontend/getting-started]
    level: beginner
    section: { en: 'Accessibility', zh: '无障碍' }
    frequency: common
    tags: [semantic-html, native-controls, keyboard, accessibility]

  - id: frontend-progressive-enhancement
    question: { en: 'What does progressive enhancement require in a modern frontend?', zh: '现代前端中的渐进增强要求什么？' }
    answer:
      en: 'It requires an explicit useful baseline and predictable behavior when an enhancement is unavailable or fails. It does not mean every complex application must retain every feature without JavaScript. A content site can usually preserve reading and links; an editor may provide read-only content or a clear failure state. I use native navigation and form behavior where they fit, add script as an enhancement, detect capabilities instead of browser names, and test the chosen baseline directly. Security and authoritative data validation remain server responsibilities regardless of how capable the client is.'
      zh: '渐进增强要求明确最低可用层，并定义增强不可用或失败时的可预测行为；它不要求每个复杂应用在没有 JavaScript 时保留全部功能。内容站点通常可以保留阅读与链接，编辑器则可以提供只读内容或清晰失败状态。我会优先采用合适的原生导航和表单行为，再用脚本增强；检测能力而不是浏览器名称，并直接测试选定的基础层。无论客户端多强，安全规则与权威数据验证仍由服务器负责。'
    topics: [frontend/getting-started]
    level: intermediate
    section: { en: 'Browser fundamentals', zh: '浏览器基础' }
    frequency: occasional
    tags: [progressive-enhancement, resilience, feature-detection]

  - id: frontend-debugging-layers
    question: { en: 'How do you diagnose a frontend page that does not behave as expected?', zh: '前端页面行为不符合预期时，怎样分层诊断？' }
    answer:
      en: 'I reproduce one concrete failure and separate the inputs from the browser result. In Network I verify the URL, status, content type, response, and cache. In Elements I inspect actual DOM, attributes, matched rules, and computed styles rather than assuming the source was applied. In Console I start with the first error and check event paths and state transitions. I then repeat the task with a keyboard, a narrow viewport, long content, and relevant failure conditions. If the cause is still unclear, I reduce it to one file before changing frameworks or dependencies.'
      zh: '我会先稳定复现一个具体故障，再区分源码输入与浏览器运行结果。在 Network 中检查 URL、状态、内容类型、响应和缓存；在 Elements 中检查实际 DOM、属性、匹配规则与计算样式，不假设源码已经生效；在 Console 中从第一条错误开始，追踪事件路径与状态转换。然后用键盘、窄视口、长内容和相关失败条件重走任务。原因仍不明确时，我会把问题缩减成一个文件，再考虑改框架或依赖。'
    topics: [frontend/getting-started]
    level: beginner
    section: { en: 'Browser fundamentals', zh: '浏览器基础' }
    frequency: common
    tags: [devtools, debugging, network, dom]

  - id: semantic-html-native-before-aria
    question: { en: 'Why should you prefer a native HTML element before adding an ARIA role to a generic element?', zh: '为什么应该先选择原生 HTML 元素，而不是给通用元素添加 ARIA 角色？' }
    answer:
      en: 'I start with the element whose built-in contract matches the task. A button already has a role, sequential focus, keyboard activation, disabled state, form behavior, and browser styling for platform modes. Adding role=button to a div changes only the exposed role; it does not implement those behaviors. I use ARIA to supply a missing name, state, or relationship when native HTML cannot express it, and only where ARIA in HTML permits it. I then verify the computed name and role, keyboard path, focus visibility, and state changes in a real browser.'
      zh: '我先选择内置契约符合任务的元素。按钮已经具备角色、顺序焦点、键盘激活、禁用状态、表单行为，以及适应平台模式的浏览器样式。给 div 添加 role=button 只会改变公开角色，不会实现这些行为。只有原生 HTML 无法表达名称、状态或关系，并且 ARIA in HTML 允许时，我才补充 ARIA。最后还要在真实浏览器中验证计算名称与角色、键盘路径、焦点可见性和状态变化。'
    topics: [frontend/html-semantic-tags]
    level: beginner
    section: { en: 'Accessibility', zh: '无障碍' }
    frequency: common
    tags: [semantic-html, aria, native-controls]

  - id: semantic-html-article-section-div
    question: { en: 'How do you choose among article, section, and div?', zh: '怎样在 article、section 与 div 之间选择？' }
    answer:
      en: 'I choose article when the content is complete enough to stand alone or be reused in a feed, search result, or another page. I choose section for a thematic part of the current document, normally with a heading that names that theme. I keep div when the wrapper exists only for layout, styling, measurement, or a script hook. The test is ownership, not appearance: a card shape does not automatically mean article, and a bordered block does not mean section. After composition, I inspect headings and landmarks because an individually reasonable component can still create noisy page structure.'
      zh: '内容足够完整，可以单独阅读或进入订阅源、搜索结果和其他页面时，我会选择 article。内容只是当前文档中有明确主题的部分，通常还带有说明主题的标题时，我会选择 section。容器只服务于布局、样式、测量或脚本挂载时，应保留 div。判断依据是内容所有权，不是外观：卡片形状不会自动成为 article，带边框的区块也不会自动成为 section。组合页面后还要检查标题与地标，因为单独合理的组件仍可能制造结构噪声。'
    topics: [frontend/html-semantic-tags]
    level: beginner
    section: { en: 'HTML and CSS', zh: 'HTML 与 CSS' }
    frequency: common
    tags: [article, section, div, content-model]

  - id: semantic-html-component-headings
    question: { en: 'How should reusable components handle heading levels?', zh: '可复用组件应该怎样处理标题级别？' }
    answer:
      en: 'Heading level belongs to the composed document hierarchy, so a reusable card cannot always know it in isolation. I avoid choosing h3 merely because its default size matches the design. The parent that owns the page structure can pass a heading tag or level, or render the heading around content supplied by the child. I then list every heading in DOM order and check that subtopics descend from their parent and peer sections return to the same level. I do not rely on section or article to reset levels because browsers never implemented that outline model interoperably.'
      zh: '标题级别属于组合后的文档层级，因此可复用卡片在孤立状态下不一定知道正确级别。我不会因为 h3 的默认字号符合设计稿就选择它。拥有页面结构的父级可以传入标题标签或级别，也可以在子组件内容外渲染标题。随后按 DOM 顺序列出所有标题，确认子主题低于父主题，同级章节回到相同级别。我不会依赖 section 或 article 重置级别，因为浏览器从未以可互操作方式实现那套大纲模型。'
    topics: [frontend/html-semantic-tags]
    level: intermediate
    section: { en: 'HTML and CSS', zh: 'HTML 与 CSS' }
    frequency: occasional
    tags: [headings, components, document-outline]

  - id: semantic-html-generated-review
    question: { en: 'How do you verify the semantics of an AI-generated page?', zh: '怎样验证 AI 生成页面的语义？' }
    answer:
      en: 'I begin with the parsed DOM, not the screenshot or template indentation, because the HTML parser may repair invalid nesting. I list headings, visible main elements, navigation regions, forms, and interactive elements, then inspect computed names, roles, and states in the accessibility tree. I use only the keyboard to follow skip links, navigation, disclosures, and form submission while checking focus order and visibility. Automated rules catch duplicate IDs, unnamed landmarks, and clickable generic elements, but they cannot decide whether a heading names the right topic. I finish with a screen-reader sample of the critical path and keep the checks as regression tests.'
      zh: '我先检查解析后的 DOM，而不是截图或模板缩进，因为 HTML 解析器可能修正无效嵌套。我会列出标题、可见 main、导航区域、表单与交互元素，再到可访问性树中检查计算名称、角色和状态。随后只用键盘操作跳过链接、导航、披露控件与表单提交，同时检查焦点顺序和可见性。自动规则能发现重复 ID、无名称地标和可点击通用元素，却无法判断标题是否表达正确主题。最后还要用屏幕阅读器抽查关键路径，并把机械检查保留为回归测试。'
    topics: [frontend/html-semantic-tags]
    level: intermediate
    section: { en: 'Accessibility', zh: '无障碍' }
    frequency: common
    tags: [ai-review, accessibility-tree, keyboard, testing]

  - id: responsive-media-versus-container-query
    question: { en: 'When should responsive CSS use a media query instead of a container query?', zh: '响应式 CSS 应在什么情况下使用媒体查询而不是容器查询？' }
    answer:
      en: 'I use a media query when the condition belongs to the browsing environment: viewport-level page structure, printing, color scheme, motion preference, or input capability. I use a container query when a reusable component changes because of the space its parent allocated. Before choosing either, I check whether intrinsic Grid or Flexbox sizing can express the constraint without a discrete switch. The query coordinate system should match the thing that owns the decision. A card in a narrow sidebar on a wide viewport is the standard case where a viewport query gives the wrong answer.'
      zh: '条件属于整体浏览环境时，我使用媒体查询，例如视口级页面结构、打印、配色方案、动态效果偏好或输入能力。可复用组件因父级分配空间而变化时，我使用容器查询。选择之前还要判断 Grid 或 Flexbox 的内在尺寸能否在没有离散切换的情况下表达约束。查询坐标系应与拥有决策的对象一致。宽视口中的窄侧栏卡片就是典型反例：此时视口查询会得到错误答案。'
    topics: [frontend/responsive-design]
    level: intermediate
    section: { en: 'HTML and CSS', zh: 'HTML 与 CSS' }
    frequency: common
    tags: [media-query, container-query, intrinsic-sizing]

  - id: responsive-content-driven-breakpoints
    question: { en: 'How do you choose and verify a responsive breakpoint?', zh: '怎样选择并验证响应式断点？' }
    answer:
      en: 'I start with real content in the most constrained supported layout and resize the actual container, not a named device preset. I add a breakpoint just before a concrete failure such as control collision, unreadable line length, or enough space appearing for a second region. I prefer rem or em when the constraint follows text scale. Verification covers one CSS pixel below and above the threshold, changed root font size, long translations, zoomed text, and overlapping rules in the cascade. Every breakpoint should have a written reason tied to content, otherwise I remove it.'
      zh: '我先把真实内容放进支持范围内约束最强的布局，再调整实际容器，而不是选择具名设备预设。控件即将碰撞、行长失控，或空间刚好足以容纳第二个区域时，我会在具体失败发生前添加断点。约束跟随文字尺度时优先使用 rem 或 em。验证要覆盖阈值前后各一个 CSS 像素、根字号变化、长翻译、文字缩放和层叠中的重叠规则。每个断点都必须有与内容相关的书面理由，否则就应删除。'
    topics: [frontend/responsive-design]
    level: intermediate
    section: { en: 'HTML and CSS', zh: 'HTML 与 CSS' }
    frequency: common
    tags: [breakpoints, testing, typography]

  - id: responsive-horizontal-overflow
    question: { en: 'How do you diagnose horizontal overflow in a responsive layout?', zh: '怎样诊断响应式布局中的横向溢出？' }
    answer:
      en: 'I first compare the root element’s scrollWidth and clientWidth at the failing container size, then inspect elements whose bounding boxes cross the viewport. Common causes are 100vw plus padding, fixed minimum widths, long unbreakable strings, percentage tracks plus gaps, replaced elements, and the automatic minimum size of Flex or Grid items. I identify which region should wrap and which may own local scrolling. I do not apply overflow-x: hidden to the page as a fix because that hides evidence and may clip operable content. The regression test uses the longest realistic data around every breakpoint.'
      zh: '我先在失败容器宽度下比较根元素的 scrollWidth 与 clientWidth，再检查边界框越过视口的元素。常见原因包括 100vw 叠加内边距、固定最小宽度、不可断开的长字符串、百分比轨道叠加间距、替换元素，以及 Flex 或 Grid 项目的自动最小尺寸。我会明确哪个区域应该换行、哪个区域可以拥有局部滚动。不能用页面级 overflow-x: hidden 充当修复，因为它会隐藏证据并可能裁切可操作内容。回归测试应在每个断点附近使用最长的真实数据。'
    topics: [frontend/responsive-design]
    level: intermediate
    section: { en: 'Browser rendering', zh: '浏览器渲染' }
    frequency: common
    tags: [overflow, sizing, debugging]

  - id: responsive-generated-code-review
    question: { en: 'How do you review AI-generated responsive code beyond comparing screenshots?', zh: '除了比较截图，还应怎样审查 AI 生成的响应式代码？' }
    answer:
      en: 'I ask for the constraint each breakpoint solves, then test immediately below and above it with real long content and text zoom. I trace every container query to an eligible ancestor and every responsive image sizes value to the final rendered slot. For interactive content, I compare DOM order, visual order, and sequential focus order. I also test keyboard use, coarse pointer without hover, precise pointer with hover, and reduced motion independently from viewport size. Finally, I locate horizontal overflow rather than hiding it and verify that narrow layouts retain every primary task, accessible name, and error message.'
      zh: '我先要求说明每个断点解决的约束，再用真实长内容和文字缩放测试阈值两侧。我会把每条容器查询追溯到符合条件的祖先，并让每个响应式图片 sizes 值对应最终渲染槽位。对于交互内容，要比较 DOM 顺序、视觉顺序和顺序焦点。键盘、无悬停粗指针、有悬停精确指针与减少动态效果也要脱离视口尺寸分别测试。最后应定位横向溢出而不是隐藏它，并确认窄布局保留每个主任务、可访问名称和错误消息。'
    topics: [frontend/responsive-design]
    level: advanced
    section: { en: 'Accessibility', zh: '无障碍' }
    frequency: common
    tags: [ai-review, accessibility, boundary-testing]

  - id: sass-variables-versus-custom-properties
    question: { en: 'How do Sass variables differ from CSS custom properties?', zh: 'Sass 变量与 CSS 自定义属性有什么区别？' }
    answer:
      en: 'A Sass variable is evaluated during compilation and disappears into the generated CSS. It can hold Sass maps, lists, colors, and unit-bearing numbers, and it can drive loops or functions. A CSS custom property remains in the stylesheet, participates in the cascade and inheritance, and can change with DOM state, media conditions, or JavaScript. I use Sass variables for build-time structure and finite generation. I keep theme values or component values that must vary after loading as custom properties, then inspect the output to confirm that var() survived compilation.'
      zh: 'Sass 变量在编译期间求值，随后消失在生成的 CSS 中。它可以保存 Sass 映射、列表、颜色和带单位数字，也能驱动循环或函数。CSS 自定义属性会保留在样式表里，参与层叠与继承，并能随 DOM 状态、媒体条件或 JavaScript 改变。我用 Sass 变量表达构建期结构和有限规则生成；主题值或加载后仍需变化的组件值则保留为自定义属性，最后检查输出中的 var() 是否仍然存在。'
    topics: [frontend/sass]
    level: beginner
    section: { en: 'HTML and CSS', zh: 'HTML 与 CSS' }
    frequency: common
    tags: [sass-variables, custom-properties, runtime]

  - id: sass-use-forward-api
    question: { en: 'What roles do @use and @forward play in a Sass library?', zh: '@use 与 @forward 在 Sass 库中分别承担什么职责？' }
    answer:
      en: '@use loads a module for the current stylesheet, evaluates it once per compilation, and exposes public members through a namespace. @forward re-exports another module’s public members to consumers, so an index file can define a stable library surface without copying code. A forwarding file does not automatically gain those names for its own use. I keep implementation files private, forward only supported variables and mixins, and configure !default variables on the first load. A minimal consumer build then verifies public module URLs, configuration order, emitted CSS, and deprecation warnings.'
      zh: '@use 为当前样式表加载模块，在一次编译中只求值一次，并通过命名空间暴露公开成员。@forward 向使用方重新导出另一模块的公开成员，因此索引文件可以定义稳定的库表面而无需复制代码。转发文件不会自动取得这些名称供自己使用。我会隐藏实现文件，只转发受支持的变量与混入，并在首次加载时配置 !default 变量。最后用最小使用方构建验证公开模块 URL、配置顺序、输出 CSS 和弃用警告。'
    topics: [frontend/sass]
    level: intermediate
    section: { en: 'Build tools', zh: '构建工具' }
    frequency: common
    tags: [use, forward, modules, library-api]

  - id: sass-function-mixin-extend
    question: { en: 'When should you use a Sass function, mixin, or @extend?', zh: '什么时候应使用 Sass 函数、混入或 @extend？' }
    answer:
      en: 'I choose from the output contract. A function returns one Sass value and suits a validated calculation or lookup. A mixin emits declarations or nested rules and suits a parameterized style pattern, with @content when the caller supplies a block. @extend changes selector matching so one selector also receives another selector’s styles; it does not copy a block at the call site. I reserve extension for a clear semantic relationship and inspect its combined selectors. Shared component declarations usually belong in a base class, while variants contain only values that actually differ.'
      zh: '我根据输出契约选择工具。函数返回一个 Sass 值，适合经过校验的计算或查询；混入输出声明或嵌套规则，适合带参数的样式模式，调用方需要传入代码块时可使用 @content。@extend 会改变选择器匹配关系，让一个选择器取得另一选择器的样式，而不是在调用点复制代码块。我只在语义关系明确时使用扩展，并检查组合后的选择器。组件共同声明通常放进基础类，变体只保留真正变化的值。'
    topics: [frontend/sass]
    level: intermediate
    section: { en: 'HTML and CSS', zh: 'HTML 与 CSS' }
    frequency: occasional
    tags: [functions, mixins, extend, selectors]

  - id: sass-generated-code-review
    question: { en: 'How do you review AI-generated Sass before merging it?', zh: '合并 AI 生成的 Sass 之前应怎样审查？' }
    answer:
      en: 'I compile every real entry with the project-locked Dart Sass version and treat warnings as findings. I trace the first load of each module because late @use configuration is invalid, then classify every Sass variable and CSS custom property by build-time or runtime ownership. In emitted CSS, I inspect selector length, specificity, media-query order, repeated declarations, and whether required var() references remain. Public functions and mixins get invalid keys, wrong units, empty collections, and boundary values. Finally, I run the application production build because injected source and load paths can differ from a standalone Sass command.'
      zh: '我会用项目锁定的 Dart Sass 版本编译所有真实入口，并把警告当作审查结果。先追踪每个模块的首次加载，因为稍后的 @use 配置无效；再按构建期或运行时所有权区分 Sass 变量与 CSS 自定义属性。对于输出 CSS，我检查选择器长度、特异性、媒体查询顺序、重复声明，以及必须保留的 var() 引用。公共函数与混入要覆盖未知键、错误单位、空集合和边界值。最后还要运行应用的生产构建，因为注入源码与加载路径可能不同于独立 Sass 命令。'
    topics: [frontend/sass]
    level: advanced
    section: { en: 'Build tools', zh: '构建工具' }
    frequency: common
    tags: [ai-review, generated-css, deprecations, testing]
