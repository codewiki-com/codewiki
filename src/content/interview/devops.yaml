track: devops
items:
  - id: dev-containers-versus-production-images
    question: { en: 'How does a Dev Container differ from a production container image?', zh: '开发容器与生产容器镜像有什么区别？' }
    answer:
      en: 'A Dev Container combines a container image or Compose project with development metadata such as the workspace mount, remote user, editor customizations, forwarded ports, Features, and lifecycle commands. It is optimized for writing, building, and debugging code, so it may contain compilers, shells, and editor services. A production image is a release artifact with a smaller runtime surface, a production entrypoint, and separate secret and deployment controls. They can share a base stage and build commands, but publishing the development image directly usually carries unnecessary tools and privileges into production.'
      zh: '开发容器把容器镜像或 Compose 项目与开发期元数据组合起来，包括工作区挂载、远程用户、编辑器设置、端口转发、Feature 和生命周期命令。它面向编写、构建和调试代码，通常包含编译器、shell 与编辑器服务。生产镜像则是发布制品，需要更小的运行时攻击面、生产入口点，以及独立的秘密与部署控制。两者可以共享基础构建阶段和构建命令，但直接发布开发镜像，往往会把多余工具与权限带进生产环境。'
    topics: [devops/dev-containers]
    level: beginner
    section: { en: 'Containers', zh: '容器' }
    frequency: common
    tags: [dev-containers, images]

  - id: dev-container-lifecycle
    question: { en: 'How do you choose among Dev Container lifecycle commands?', zh: '如何选择 Dev Container 的生命周期命令？' }
    answer:
      en: 'Use initializeCommand for repeatable preparation where the source lives on the host. During first creation, container-side stages run as onCreateCommand, updateContentCommand, and postCreateCommand. Put installation that belongs to a new container there, and choose waitFor when attachment must wait for a later stage. postStartCommand runs whenever an existing container starts, so it should stay fast and repeatable. postAttachCommand runs after each tool attachment and should avoid changing shared project state. Test first creation, restart, reattachment, and rebuild because each path executes a different subset.'
      zh: '需要在源码所在宿主机上进行可重复准备时，使用 initializeCommand。首次创建时，容器内阶段依次是 onCreateCommand、updateContentCommand 和 postCreateCommand；新容器所需的安装应放在这里，如果连接必须等待后续阶段，再设置 waitFor。已有容器每次启动都会运行 postStartCommand，因此它应当快速且可重复。每次工具连接后都会运行 postAttachCommand，不应在其中修改共享项目状态。测试要覆盖首次创建、重启、重新连接和重建，因为这些路径执行的命令子集不同。'
    topics: [devops/dev-containers]
    level: intermediate
    section: { en: 'Environment lifecycle', zh: '环境生命周期' }
    frequency: common
    tags: [lifecycle, automation]

  - id: dev-container-security-boundary
    question: { en: 'Why is a Dev Container not automatically a safe sandbox for untrusted repositories?', zh: '为什么开发容器不会自动成为运行不可信仓库的安全沙箱？' }
    answer:
      en: 'The repository controls files that supporting tools may execute. initializeCommand runs on the host, while lifecycle scripts and Features execute during creation or build. Bind mounts can expose host files, forwarded agents can expose credentials, and a mounted Docker socket can give container code control over the host engine. privileged mode, devices, and extra capabilities weaken isolation further. Review the entire .devcontainer directory and Feature sources before opening an untrusted project. Start with a non-root user, narrow read-only mounts, no Docker socket, and no credentials unless the task requires them.'
      zh: '仓库控制的文件可能被支持工具执行。initializeCommand 在宿主机运行，生命周期脚本与 Feature 则会在创建或构建期间执行。绑定挂载可能暴露宿主机文件，转发的代理可能暴露凭据，Docker 套接字还可能让容器代码控制宿主机引擎。privileged 模式、设备与额外 capability 会进一步削弱隔离。打开不可信项目之前，应评审整个 .devcontainer 目录和 Feature 来源；默认使用非 root 用户、范围有限的只读挂载，不提供 Docker 套接字与无关凭据。'
    topics: [devops/dev-containers]
    level: advanced
    section: { en: 'Container security', zh: '容器安全' }
    frequency: common
    tags: [security, isolation, mounts]

  - id: dev-container-reproducibility
    question: { en: 'What must be pinned to make a Dev Container reproducible?', zh: '要让开发容器可复现，需要固定哪些输入？' }
    answer:
      en: 'Start with the whole input graph, not only devcontainer.json. Pin the base image by digest when exact content matters, commit the Dev Container Feature lockfile, and use frozen language dependency lockfiles. Review downloads and operating-system repositories used by the Dockerfile. Record the CLI and container-engine versions used in CI, because implementations and host architecture can affect the result. Run a cold-cache build to catch dependencies that exist only in an old layer, then run the project tests. Update pins through reviewed automation so reproducibility does not block security fixes indefinitely.'
      zh: '应从完整输入图入手，而不是只看 devcontainer.json。需要精确内容时用摘要固定基础镜像，提交 Dev Container Feature 锁文件，并冻结语言依赖锁文件。还要审查 Dockerfile 使用的下载地址与操作系统软件源。CI 应记录 CLI 和容器引擎版本，因为实现差异与宿主机架构会影响结果。用冷缓存构建找出只存在于旧镜像层的依赖，再运行项目测试。版本固定应通过受审查的自动化流程更新，不能让可复现性无限期阻止安全修复。'
    topics: [devops/dev-containers]
    level: advanced
    section: { en: 'Reproducible environments', zh: '可复现环境' }
    frequency: occasional
    tags: [reproducibility, lockfiles, ci]
