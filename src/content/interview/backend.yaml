track: backend
items:
  - id: jwt-signature-versus-validation
    question: { en: 'Why is a valid JWT signature insufficient for authentication?', zh: '为什么 JWT 签名有效仍不足以完成身份认证？' }
    answer: { en: 'A signature protects bytes under a key; the verifier must also bind that key to a trusted issuer and validate audience, token type, time claims, required claim types, and application status before creating an identity.', zh: '签名只说明字节受到某把密钥保护；验证器还要把密钥绑定到可信签发者，并检查受众、令牌类型、时间声明、必需声明类型和应用状态，才能建立身份。' }
    topics: [backend/jwt-authentication]
    level: intermediate
    tags: [jwt, claim-validation]

  - id: jwt-hmac-versus-asymmetric
    question: { en: 'What trust-boundary difference separates HS256 from an asymmetric JWT signature?', zh: 'HS256 与非对称 JWT 签名在信任边界上有什么区别？' }
    answer: { en: 'Every HS256 verifier holds the shared secret and can therefore issue tokens. With an asymmetric algorithm, the issuer can retain the private key while distributing public verification keys, so verifiers need not gain signing power.', zh: '每个 HS256 验证者都持有共享秘密，因此也能签发令牌。非对称算法让签发者保留私钥，只分发验证公钥，所以验证者不必获得签发能力。' }
    topics: [backend/jwt-authentication]
    level: intermediate
    tags: [jwt, key-management]

  - id: refresh-token-replay
    question: { en: 'How does refresh token rotation detect replay, and what should happen after detection?', zh: '刷新令牌轮换如何检测重放，发现重放后应怎样处理？' }
    answer: { en: 'Each refresh consumes the old value and issues one successor while retaining their family relationship. Reuse of an inactive value signals possible theft; revoke the active family and require a new authorization because the server cannot identify which caller is legitimate.', zh: '每次刷新都会消费旧值、签发唯一后继值，并保留令牌族关系。已失效值再次出现说明可能被窃取；服务器无法判断哪一方合法，因此应撤销活动令牌族并要求重新授权。' }
    topics: [backend/jwt-authentication]
    level: advanced
    tags: [refresh-token, replay-detection]

  - id: api-resource-contract
    question: { en: 'What belongs in an HTTP API operation contract besides its URL?', zh: '除了 URL，HTTP API 的操作契约还应包含什么？' }
    answer:
      en: 'The contract names the method, target resource, accepted headers and media types, parameter constraints, authentication and resource-level authorization rules, success representation, failure statuses, and relevant response headers. It also states behavior across time: whether a request is safe or idempotent, how a client retries an unknown result, how concurrent writes are detected, and how pagination remains ordered. OpenAPI can describe much of the message shape, but transaction boundaries and domain invariants still need prose and scenario tests. I review the complete observable HTTP exchange, not only the JSON schema.'
      zh: '契约要说明方法、目标资源、接受的响应头与媒体类型、参数约束、认证和资源级授权规则、成功表示、失败状态码以及相关响应头。它还要定义跨时间行为：请求是否安全或幂等，客户端如何重试结果未知的操作，怎样检测并发写入，以及分页如何保持顺序。OpenAPI 能描述大部分消息形状，但事务边界与领域不变量仍需要文字和场景测试。我会审查完整且可观察的 HTTP 交换，而不只看 JSON 模式。'
    topics: [backend/api-design]
    level: intermediate
    section: { en: 'HTTP API contracts', zh: 'HTTP API 契约' }
    frequency: common
    tags: [api-design, contract, http]

  - id: api-safe-versus-idempotent
    question: { en: 'How do safe and idempotent HTTP methods differ, and what does that mean for retries?', zh: 'HTTP 的安全方法与幂等方法有何区别，这对重试意味着什么？' }
    answer:
      en: 'A safe method has essentially read-only requested semantics, so the client does not ask for a state change. An idempotent method may change state, but repeating the identical request has the same intended effect as sending it once. GET is both; PUT and DELETE are idempotent but unsafe. Incidental logging does not change those classifications, and repeated responses need not be identical. Idempotency supports retry after a connection failure, but the client must preserve the same request. Retrying POST needs an application protocol, typically a caller-stable key backed by atomic deduplication and a stored result.'
      zh: '安全方法的请求语义基本只读，因此客户端没有要求改变状态。幂等方法可以修改状态，但重复发送相同请求时，预期效果与发送一次相同。GET 同时具备两种性质；PUT 和 DELETE 幂等但不安全。附带日志不会改变分类，多次响应也不必完全相同。幂等性支持在连接失败后重试，但客户端必须保持请求不变。重试 POST 需要应用协议，通常由调用方提供稳定键，服务端以原子去重和已保存结果作为支撑。'
    topics: [backend/api-design]
    level: intermediate
    section: { en: 'HTTP semantics', zh: 'HTTP 语义' }
    frequency: common
    tags: [safe-method, idempotency, retry]

  - id: api-etag-lost-update
    question: { en: 'How does an ETag prevent a lost update?', zh: 'ETag 如何防止丢失更新？' }
    answer:
      en: 'The server returns a strong ETag for the selected representation. A client that edits that representation sends the tag in If-Match with its PUT, PATCH, or DELETE. The server compares the precondition against the current entity tag and performs the mutation only on a match; a stale tag normally produces 412 Precondition Failed. The important implementation detail is atomicity. Reading a version, comparing it in application code, and then issuing an unconditional write leaves a race. Use a conditional database update or transaction, and return the new ETag after success so later edits have a fresh validator.'
      zh: '服务端为选定表示返回强 ETag。客户端修改该表示时，在 PUT、PATCH 或 DELETE 请求的 If-Match 中带上此标签。服务端把前置条件与当前实体标签比较，只有匹配时才执行修改；标签过期通常返回 412 Precondition Failed。实现重点是原子性。先读取版本、在应用代码中比较、再执行无条件写入，仍会留下竞态窗口。应使用数据库条件更新或事务，并在成功后返回新 ETag，让后续编辑获得新的验证器。'
    topics: [backend/api-design]
    level: intermediate
    section: { en: 'Concurrency control', zh: '并发控制' }
    frequency: common
    tags: [etag, if-match, lost-update]

  - id: api-cursor-pagination
    question: { en: 'What makes cursor pagination correct under changing data?', zh: '数据持续变化时，怎样保证游标分页正确？' }
    answer:
      en: 'First define a deterministic total order, ending with a unique tie-breaker such as an ID. The cursor encodes the last ordering tuple, direction, and any filter or sort version needed to resume the same query. The service validates and bounds the page size, treats the token as opaque to clients, and rejects malformed or mismatched tokens. This avoids ambiguity among equal sort values, but it does not create snapshot consistency by itself. If one traversal must observe one snapshot, bind the cursor to a database snapshot or watermark and specify its expiration and behavior after inserts or deletes.'
      zh: '先定义确定的全序，并以 ID 等唯一字段作为最后的决胜条件。游标编码上一条记录的排序元组、方向，以及继续同一查询所需的过滤条件或排序版本。服务端要验证并限制页大小，让客户端把令牌视为不透明值，并拒绝格式错误或条件不匹配的令牌。这样能消除相同排序值之间的歧义，但不会自动提供快照一致性。如果一次遍历必须观察同一快照，就要把游标绑定到数据库快照或水位线，并定义过期时间以及插入、删除后的行为。'
    topics: [backend/api-design]
    level: advanced
    section: { en: 'Pagination', zh: '分页' }
    frequency: occasional
    tags: [cursor-pagination, ordering, consistency]

  - id: api-first-versus-openapi-first
    question: { en: 'Why does writing an OpenAPI file first not necessarily make a project API-first?', zh: '为什么先写 OpenAPI 文件，不一定代表项目采用了 API 优先？' }
    answer:
      en: 'API-first is a decision and enforcement process, while OpenAPI is an interface-description format. A team is API-first when consumers and providers review observable behavior before dependent implementation, publish a versioned contract, and make later code and releases prove conformance. A specification written first but ignored after controllers appear is merely early documentation. I look for change review, compatibility checks, contract-backed mocks, provider verification against the real HTTP boundary, and a trace from each deployable artifact to the contract revision it implements.'
      zh: 'API 优先是一套决策与约束流程，OpenAPI 则是接口描述格式。只有消费者和提供者在依赖实现开始前评审可观察行为，发布版本化契约，并要求后续代码与发布证明符合契约，才算 API 优先。先写规范、控制器出现后却不再维护，仍只是提前编写文档。我会检查变更评审、兼容性检查、契约驱动 Mock、针对真实 HTTP 边界的提供者验证，以及每个部署制品到所实现契约修订的追踪关系。'
    topics: [backend/api-first]
    level: intermediate
    section: { en: 'API delivery', zh: 'API 交付' }
    frequency: common
    tags: [api-first, OpenAPI, governance]

  - id: api-first-ci-layers
    question: { en: 'What should an API-first CI pipeline check, and why are several layers needed?', zh: 'API 优先的 CI 流水线应检查什么，为什么需要多个层次？' }
    answer:
      en: 'First parse and validate the description so malformed references or schemas cannot ship. Next compare it with the last published contract and flag changes that may break request or response compatibility. Then exercise a running provider and validate the full HTTP exchange, including status, media type, relevant headers, and body. Those checks still do not prove authorization, transaction atomicity, idempotency, or domain transitions, so add focused scenario tests. Each layer answers a different question; passing one cannot be used as evidence that the others pass.'
      zh: '首先解析并校验描述，阻止错误引用或模式进入发布。然后与上一版已发布契约比较，标出可能破坏请求或响应兼容性的变更。接着调用运行中的提供者，验证完整 HTTP 交换，包括状态码、媒体类型、相关响应头和响应体。这些检查仍不能证明授权、事务原子性、幂等性或领域状态转换，因此还要添加针对性场景测试。每一层回答的问题不同，不能用其中一层通过来推断其他层也通过。'
    topics: [backend/api-first]
    level: intermediate
    section: { en: 'Contract verification', zh: '契约验证' }
    frequency: common
    tags: [ci, provider-verification, compatibility]

  - id: api-first-change-direction
    question: { en: 'Why must compatibility be evaluated differently for requests and responses?', zh: '为什么请求与响应必须按不同方向评估兼容性？' }
    answer:
      en: 'The producer and consumer roles reverse. A client produces requests, so narrowing what the server accepts can reject old traffic, while accepting more input usually leaves old clients unaffected. A server produces responses, so removing a field can break an old reader; adding a field works only if that reader tolerates unknown properties. Schema diffs are therefore a starting point, not a verdict. Defaults, ordering, error meaning, and retry behavior can change without a structural diff. Record the direction, known consumer behavior, and migration evidence for every risky change.'
      zh: '请求与响应中的生产者和消费者角色相反。客户端生产请求，因此服务端收紧可接受输入，可能拒绝旧流量；放宽输入通常不影响旧客户端。服务端生产响应，因此删除字段可能破坏旧读取者；只有读取者容忍未知属性时，新增字段才安全。所以模式差异只是起点，不是最终结论。默认值、排序、错误含义和重试行为可以在结构不变时发生变化。每项高风险变更都应记录方向、已知消费者行为和迁移证据。'
    topics: [backend/api-first]
    level: advanced
    section: { en: 'Compatibility', zh: '兼容性' }
    frequency: common
    tags: [breaking-change, request, response]

  - id: api-first-openapi-and-cdc
    question: { en: 'How do OpenAPI provider verification and consumer-driven contracts complement each other?', zh: 'OpenAPI 提供者验证与消费者驱动契约如何互补？' }
    answer:
      en: 'OpenAPI describes the provider’s public HTTP boundary and supports broad conformance checks across documented operations. A consumer-driven contract records the concrete interactions a named consumer relies on and asks the provider to verify them. The consumer contract exposes real dependencies that optional fields may hide, while OpenAPI covers operations and common rules no current consumer test exercises. Neither proves domain correctness or authorization. Providers should review consumer expectations rather than accept private redefinitions of service semantics, and deployment should require the relevant provider version to pass both kinds of checks.'
      zh: 'OpenAPI 描述提供者的公共 HTTP 边界，可对已记录操作执行广泛的符合性检查。消费者驱动契约记录具名消费者实际依赖的具体交互，并要求提供者验证。消费者契约能暴露可选字段背后的真实依赖，OpenAPI 则覆盖当前消费者测试未执行的操作和通用规则。两者都不能证明领域正确性或授权。提供者应评审消费者期望，而不是接受对服务语义的私下重定义；部署时应要求目标提供者版本通过两类检查。'
    topics: [backend/api-first]
    level: advanced
    section: { en: 'Contract verification', zh: '契约验证' }
    frequency: occasional
    tags: [OpenAPI, consumer-driven-contract, provider-verification]

  - id: api-versioning-new-version
    question: { en: 'When does an HTTP API change require a new public version?', zh: 'HTTP API 变更在什么情况下需要新的公共版本？' }
    answer:
      en: 'Use a new version when a change can invalidate an interaction promised by the current contract and compatibility cannot reasonably be preserved. Clear cases include removing or renaming response fields, adding required request input, changing a field type, or changing authentication requirements. Also inspect behavioral changes such as defaults, ordering, error meaning, and retry effects. Adding an optional request field is usually compatible; adding a response field depends on whether supported readers tolerate unknown properties. The decision should come from contract diffs, representative consumer tests, and policy, not from the service deployment number alone.'
      zh: '当一项变更会使当前契约承诺的交互失效，而且无法合理保持兼容时，就应使用新版本。典型情况包括删除或重命名响应字段、新增必填请求输入、修改字段类型或改变认证要求。还要检查默认值、排序、错误含义和重试效果等行为变化。新增可选请求字段通常兼容；新增响应字段是否兼容，则取决于受支持读取者能否容忍未知属性。判断应依据契约差异、代表性消费者测试和既定策略，不能只看服务部署编号。'
    topics: [backend/api-versioning]
    level: intermediate
    section: { en: 'API compatibility', zh: 'API 兼容性' }
    frequency: common
    tags: [api-versioning, breaking-change, compatibility]

  - id: api-versioning-selector-tradeoffs
    question: { en: 'How do path and header API versioning differ operationally?', zh: '路径版本与请求头版本在运维上有何不同？' }
    answer:
      en: 'A path such as /api/v2/orders makes the selected contract visible in routing, logs, links, and ordinary cache keys. Migration changes the resource URI, which can affect client configuration and generated links. A header keeps the URI stable and can use a custom field or an Accept media type, but clients and debugging tools must send it correctly. Cacheable responses selected by a header need the corresponding Vary field, and the deployed CDN or gateway must honor it. In either scheme, define missing, malformed, conflicting, unsupported, deprecated, and retired values instead of falling through to the latest implementation.'
      zh: '路径形式如 /api/v2/orders，会让所选契约直接出现在路由、日志、链接和常规缓存键中。迁移会改变资源 URI，可能影响客户端配置和生成的链接。请求头可以保持 URI 稳定，并使用自定义字段或 Accept 媒体类型，但客户端与调试工具必须正确发送。若可缓存响应由请求头选择，就要发送 Vary 字段，并确认 CDN 或网关会遵守它。无论采用哪种方案，都应定义缺失、格式错误、冲突、不受支持、已弃用和已退役值的行为，不能落入最新实现。'
    topics: [backend/api-versioning]
    level: intermediate
    section: { en: 'Version selection', zh: '版本选择' }
    frequency: common
    tags: [path-versioning, header-versioning, vary]

  - id: api-versioning-deprecation-plan
    question: { en: 'What makes an API deprecation plan safe to execute?', zh: '怎样的 API 弃用计划才可以安全执行？' }
    answer:
      en: 'Start with a support policy and usage inventory tied to stable client identities, because request volume alone can hide a low-frequency critical job. Publish the replacement contract and a tested migration map, contact known owners, and monitor their progress. During deprecation, preserve the old behavior. RFC 9745 encodes Deprecation as a Structured Field Date; RFC 8594 encodes Sunset as an HTTP date for expected unavailability, and the sunset cannot precede deprecation. Treat both as hints, supplement them with direct communication, define the post-retirement response, and keep a rollback path for missed consumers.'
      zh: '先制定支持策略，并用稳定客户端标识盘点用量，因为单看请求量可能漏掉低频但关键的任务。发布替代契约和经过测试的迁移映射，联系已知负责人并跟踪进度。弃用期间必须保留旧行为。RFC 9745 要求把 Deprecation 编码为结构化字段日期；RFC 8594 要求 Sunset 使用 HTTP 日期来表示预计停止响应的时间，而且日落不能早于弃用。两者都只是提示，需要直接沟通作为补充；同时定义退役后的响应，并为遗漏消费者保留回滚路径。'
    topics: [backend/api-versioning]
    level: advanced
    section: { en: 'API lifecycle', zh: 'API 生命周期' }
    frequency: common
    tags: [deprecation, sunset, migration]

  - id: api-versioning-compatibility-evidence
    question: { en: 'Why is a schema diff insufficient to prove API compatibility?', zh: '为什么模式差异不足以证明 API 兼容性？' }
    answer:
      en: 'A schema diff sees structural changes but not every consumer behavior or protocol promise. A supposedly additive response field can fail in a strict decoder, and a new enum value can break an exhaustive switch. Defaults, result ordering, status codes, headers, authorization rules, and idempotency can change with no obvious schema difference. Use the diff to identify risk, then run provider tests against each published HTTP contract and representative consumer contracts against the candidate provider. Production telemetry adds evidence about which client versions remain active, but low traffic is not proof that a dependency is unimportant.'
      zh: '模式差异能看到结构变化，却无法覆盖所有消费者行为或协议承诺。看似增量的响应字段可能让严格解码器失败，新的枚举值也可能破坏穷尽分支。默认值、结果排序、状态码、响应头、授权规则和幂等性都可能在没有明显模式差异时改变。应先用差异定位风险，再针对每份已发布 HTTP 契约运行提供者测试，并让代表性消费者契约验证候选提供者。生产遥测可以说明哪些客户端版本仍然活跃，但低流量不代表依赖不重要。'
    topics: [backend/api-versioning]
    level: advanced
    section: { en: 'Contract verification', zh: '契约验证' }
    frequency: occasional
    tags: [schema-diff, contract-testing, telemetry]

  - id: django-request-lifecycle
    question: { en: 'Trace a Django request from the server to the response.', zh: '说明一个 Django 请求从服务器到响应的处理过程。' }
    answer:
      en: 'The WSGI or ASGI server constructs a request and passes it to Django’s handler. Request middleware runs in configured order, then the URL resolver checks patterns in order and calls the matched view with converted arguments. The view may validate input, invoke domain logic, query models, and render a template or construct another HttpResponse. The response then unwinds through middleware in reverse order before the server sends it. Exceptions can be converted by middleware or Django’s error handling. I also mention that middleware order is functional: sessions must exist before authentication can attach request.user.'
      zh: 'WSGI 或 ASGI 服务器构造请求并交给 Django 处理器。请求中间件按配置顺序运行，URL 解析器随后按顺序匹配模式，把转换后的参数交给目标视图。视图可以验证输入、调用领域逻辑、查询模型，并渲染模板或构造其他 HttpResponse。响应再按相反顺序经过中间件，最后由服务器发送。异常可以由中间件或 Django 错误处理逻辑转换。中间件顺序具有实际语义，例如必须先建立会话，认证中间件才能设置 request.user。'
    topics: [backend/django]
    level: intermediate
    section: { en: 'Request handling', zh: '请求处理' }
    frequency: common
    tags: [urlconf, middleware, request]

  - id: django-queryset-n-plus-one
    question: { en: 'Why does Django produce N+1 queries, and how do you fix it?', zh: 'Django 为什么会产生 N+1 查询，应该怎样修复？' }
    answer:
      en: 'A QuerySet usually loads its base rows lazily. If later code or a template reads an uncached relation for every row, Django issues one initial query plus one relation query per result. I reproduce the actual access pattern and capture its query count before changing it. select_related() joins single-valued foreign-key or one-to-one relations into the main query. prefetch_related() runs separate queries and connects many-valued results in Python. The fix still needs pagination and measurement: broad joins can duplicate data, while unused or huge prefetches consume memory and may generate large IN clauses.'
      zh: 'QuerySet 通常会惰性加载基础数据行。如果后续代码或模板为每一行读取未缓存的关联，Django 就会先执行一条基础查询，再为每条结果执行一条关联查询。我会先复现真实访问模式并捕获查询数。`select_related()` 把单值外键或一对一关系连接到主查询，`prefetch_related()` 则执行独立查询，再在 Python 中关联多值结果。修复后仍需分页和测量，因为过宽的连接会重复数据，未使用或过大的预取也会消耗内存并生成很大的 `IN` 子句。'
    topics: [backend/django]
    level: intermediate
    section: { en: 'ORM and data access', zh: 'ORM 与数据访问' }
    frequency: common
    tags: [queryset, n-plus-one, optimization]

  - id: django-validation-versus-constraints
    question: { en: 'How do Django validation and database constraints divide responsibility?', zh: 'Django 验证与数据库约束如何分工？' }
    answer:
      en: 'Forms and serializers parse untrusted input, convert types, apply user-facing rules, and return useful field errors. They are not the final integrity boundary because scripts, bulk operations, admin actions, or concurrent requests can bypass or race that validation. Durable invariants belong in database types, foreign keys, unique constraints, check constraints, and transactions where the database can enforce them for every writer. Application code should still validate early for better errors, then handle IntegrityError for races. Model save() does not automatically call full_clean(), so a team should define and test one consistent write policy.'
      zh: '表单和序列化器负责解析不可信输入、转换类型、应用面向用户的规则，并返回有用的字段错误。它们不是最终的数据完整性边界，因为脚本、批量操作、管理操作或并发请求可能绕过验证，或者与验证发生竞态。持久不变量应放进数据库类型、外键、唯一约束、检查约束和事务，由数据库对所有写入者强制执行。应用代码仍应尽早验证以提供更好的错误，并处理竞态产生的 IntegrityError。模型的 save() 不会自动调用 full_clean()，因此团队需要定义并测试一致的写入策略。'
    topics: [backend/django]
    level: intermediate
    section: { en: 'Data integrity', zh: '数据完整性' }
    frequency: common
    tags: [validation, constraint, transaction]

  - id: django-async-boundary
    question: { en: 'When does an async Django view help, and where is the boundary?', zh: 'Django 异步视图何时有用，边界在哪里？' }
    answer:
      en: 'An async view helps when it spends substantial time awaiting supported nonblocking I/O, especially under ASGI with an async-capable middleware stack. The declaration alone does not make synchronous ORM calls or libraries nonblocking. Django can adapt sync and async components, but each transition has overhead, and sync-only code in an async context may raise SynchronousOnlyOperation. Use native async ORM methods where available. In Django 6.0, transaction work remains synchronous, so put the complete atomic unit in one synchronous function and cross the boundary once with sync_to_async(). Also handle cancellation for long-lived requests.'
      zh: '异步视图适合大量时间都在等待受支持的非阻塞 I/O 的场景，特别是运行在 ASGI 下且中间件栈支持异步时。只有 `async def` 声明，并不会让同步 ORM 调用或第三方库变成非阻塞操作。Django 可以适配同步和异步组件，但每次切换都有成本，在异步上下文调用仅支持同步的代码还可能抛出 SynchronousOnlyOperation。应优先使用原生异步 ORM 方法。Django 6.0 的事务工作仍需同步执行，因此要把完整原子单元放在一个同步函数中，再通过 `sync_to_async()` 跨越一次边界。长时间请求还要处理取消。'
    topics: [backend/django]
    level: advanced
    section: { en: 'Async execution', zh: '异步执行' }
    frequency: occasional
    tags: [asgi, async-safety, transaction]

  - id: elysia-schema-types-and-validation
    question: { en: 'How does one Elysia route schema provide both TypeScript types and runtime validation?', zh: '一份 Elysia 路由模式如何同时提供 TypeScript 类型和运行时验证？' }
    answer:
      en: 'The route declaration attaches schemas to body, query, params, headers, cookies, or responses. Elysia uses those schema objects at runtime to parse and reject requests or responses that do not conform. At compile time, TypeScript infers the corresponding handler context and return branches from the same declarations, so a separate interface is usually unnecessary. I still separate transport validation from domain invariants and authorization. A valid order shape does not prove that stock exists or that the caller owns an account. I test malformed HTTP input and business failures independently.'
      zh: '路由声明可以为 `body`、`query`、`params`、`headers`、`cookie` 和响应附加模式。Elysia 在运行时使用这些模式对象解析并拒绝不合规的请求或响应；在编译时，TypeScript 又从同一声明推断处理器上下文与返回分支，因此通常不需要重复接口。我仍会区分传输验证、领域不变量和授权。订单结构有效，并不能证明库存存在或调用方拥有账户。我会分别测试畸形 HTTP 输入和业务失败。'
    topics: [backend/elysia]
    level: intermediate
    section: { en: 'Route contracts', zh: '路由契约' }
    frequency: common
    tags: [elysia, route-schema, validation, typescript]

  - id: elysia-hook-scope-and-order
    question: { en: 'Why do lifecycle hook scope and registration order both matter in Elysia?', zh: '为什么 Elysia 生命周期钩子的作用域和注册顺序都很重要？' }
    answer:
      en: 'Scope determines which Elysia instances inherit a hook, while registration order determines which later routes on an instance receive it. A local hook inside a plugin applies to that plugin and its descendants, not automatically to sibling routes later added by the parent. A hook registered after a route normally does not protect that earlier route. I keep authorization hooks beside their protected routes or inside a guard, widen scope only deliberately, and probe every protected endpoint without credentials. I also place shared error handling before plugins that must inherit it.'
      zh: '作用域决定哪些 Elysia 实例会继承钩子，注册顺序决定实例上哪些后续路由会获得钩子。插件中的本地钩子适用于该插件及其后代，不会自动影响父应用后来添加的兄弟路由；路由之后注册的钩子通常也不能追溯保护该路由。我会把授权钩子放在受保护路由旁或 `guard` 中，只在明确需要时扩大作用域，并对每个受保护端点发送无凭据请求。我还会把需要由插件继承的共享错误处理放在插件之前。'
    topics: [backend/elysia]
    level: advanced
    section: { en: 'Lifecycle and plugins', zh: '生命周期与插件' }
    frequency: common
    tags: [elysia, lifecycle-hook, plugin, scope]

  - id: elysia-eden-contract-limit
    question: { en: 'What does Eden Treaty guarantee, and what deployment problem does it not solve?', zh: 'Eden Treaty 能保证什么，又不能解决哪种部署问题？' }
    answer:
      en: 'Eden Treaty derives a typed, path-shaped client from the final Elysia application type. It can check path parameters, request bodies, and declared status responses at client compile time without generating source files. That proves compatibility with the type present during the client build, not with whatever service version a URL currently serves. A rollback, stale types package, or independently deployed frontend can still drift. I publish and version shared types, use type-only imports, and run contract tests against the candidate deployment’s real HTTP boundary before release.'
      zh: 'Eden Treaty 从最终 Elysia 应用类型推导按路径组织的类型化客户端，无需生成源文件，就能在客户端编译时检查路径参数、请求体和已声明的逐状态响应。它只能证明客户端与构建时看到的类型兼容，不能证明某个 URL 当前运行的就是对应服务版本。回滚、过期的类型包或独立发布的前端仍会产生漂移。我会发布并版本化共享类型，使用仅类型导入，并在发布前针对候选部署的真实 HTTP 边界运行契约测试。'
    topics: [backend/elysia]
    level: intermediate
    section: { en: 'Typed clients', zh: '类型化客户端' }
    frequency: occasional
    tags: [eden-treaty, contract, deployment, compatibility]

  - id: elysia-test-without-listen
    question: { en: 'How do you structure and test an Elysia application without opening a port during import?', zh: '怎样组织和测试 Elysia 应用，才能避免在导入时打开端口？' }
    answer:
      en: 'I export the fully composed Elysia instance from an application module without calling listen. A separate deployment entry point imports that instance, binds the configured host and port, and owns shutdown behavior. Tests construct Web-standard Request objects and pass them to app.handle, or pass the instance to treaty for an in-process typed client. This exercises routing, validation, hooks, and response mapping deterministically without a socket. I keep a smaller real-network suite because in-process tests cannot verify proxy behavior, TLS, base URLs, response-header rewriting, or the version actually deployed.'
      zh: '我会从应用模块导出已经完整组合、但尚未调用 `listen` 的 Elysia 实例。单独的部署入口导入该实例，绑定配置的主机与端口，并负责关闭流程。测试可以构造 Web 标准 `Request` 并传给 `app.handle`，也可以把实例交给 `treaty`，得到进程内类型化客户端。这样能稳定覆盖路由、验证、钩子与响应映射，又不会打开套接字。我仍会保留规模较小的真实网络测试，因为进程内测试无法验证代理、TLS、基础 URL、响应头改写或实际部署版本。'
    topics: [backend/elysia]
    level: intermediate
    section: { en: 'Testing and deployment', zh: '测试与部署' }
    frequency: common
    tags: [elysia, testing, app-handle, deployment]

  - id: backend-fastapi-parameter-source
    question: { en: 'How does FastAPI decide where a path operation parameter comes from and whether it is required?', zh: 'FastAPI 如何判断路径操作参数的来源，以及它是否必填？' }
    answer:
      en: 'FastAPI combines the route template, Python type, default value, and explicit parameter metadata. A matching name in the route template is a path parameter. A simple scalar is normally a query parameter, while a Pydantic model is normally a request body. Header, Cookie, Query, and Body can make the source explicit. Requiredness comes from whether a default is present, not merely from a union with None. I verify the declaration over HTTP because direct function calls bypass extraction, conversion, and the structured 422 error path.'
      zh: 'FastAPI 会综合路由模板、Python 类型、默认值和显式参数元数据。名称出现在路由模板中时，它是路径参数；简单标量通常是查询参数，Pydantic 模型通常是请求体。Header、Cookie、Query 和 Body 可以显式指定来源。是否必填取决于有没有默认值，而不只是类型是否与 None 联合。我会通过 HTTP 验证声明，因为直接调用函数会绕过提取、转换和结构化的 422 错误路径。'
    topics: [backend/fastapi]
    level: beginner
    section: { en: 'Web frameworks', zh: 'Web 框架' }
    frequency: common
    tags: [fastapi, parameters, validation]

  - id: backend-fastapi-response-model-boundary
    question: { en: 'Why should a FastAPI endpoint use a separate response model?', zh: 'FastAPI 端点为什么应使用单独的响应模型？' }
    answer:
      en: 'A response model is the allowlist for data crossing the public boundary. FastAPI uses it to document, validate, serialize, and filter the handler return value, and the decorator response_model takes priority over a return annotation when both exist. Separating input, storage, and output models prevents fields such as password hashes, tenant identifiers, or internal notes from leaking through a convenient object return. I test both the full expected body and the absence of sensitive fields, because checking only positive fields will not detect accidental disclosure.'
      zh: '响应模型是数据跨越公开边界时的字段允许列表。FastAPI 用它记录、验证、序列化并过滤处理函数的返回值；同时存在时，装饰器上的 response_model 优先于返回注解。分离输入、存储和输出模型，可以防止哈希密码、租户标识或内部备注随着整个对象被便利地返回。我会同时测试完整的预期响应体和敏感字段不存在，因为只检查正向字段无法发现意外泄露。'
    topics: [backend/fastapi]
    level: intermediate
    section: { en: 'API contracts', zh: 'API 契约' }
    frequency: common
    tags: [fastapi, response-model, security]

  - id: backend-fastapi-sync-versus-async-handler
    question: { en: 'How do you choose between def and async def for a FastAPI path operation?', zh: 'FastAPI 路径操作应怎样在 def 与 async def 之间选择？' }
    answer:
      en: 'I start at the I/O boundary. If the libraries expose awaitable operations, I use async def and await every such call so the event loop can advance other work. If a required library is blocking, a normal def path operation lets FastAPI run it in a thread pool. Merely writing async def does not make a synchronous ORM, HTTP client, or sleep non-blocking. Helper functions called directly inside a handler are not moved automatically, so I trace reachable calls and confirm their execution context with concurrency and cancellation tests.'
      zh: '我会从 I/O 边界开始判断。如果库提供可等待操作，就使用 async def 并正确 await，让事件循环可以推进其他工作。如果必须使用阻塞库，普通 def 路径操作会让 FastAPI 在线程池中运行它。仅写成 async def 不会让同步 ORM、HTTP 客户端或 sleep 变为非阻塞。处理函数直接调用的辅助函数也不会自动换到线程池，因此我会跟踪可达调用，并通过并发与取消测试确认执行环境。'
    topics: [backend/fastapi]
    level: intermediate
    section: { en: 'Async execution', zh: '异步执行' }
    frequency: common
    tags: [fastapi, async, blocking-io, thread-pool]

  - id: backend-fastapi-dependency-lifecycle
    question: { en: 'How do FastAPI dependency caching, yield cleanup, and test overrides interact?', zh: 'FastAPI 的依赖缓存、yield 清理和测试覆盖如何协作？' }
    answer:
      en: 'FastAPI resolves dependencies as a graph and, by default, evaluates the same dependency callable once per request. Consumers share that request-scoped result unless use_cache=False is explicit. A dependency with one yield acquires before use and runs exit code afterward, so release belongs in finally; its selected scope determines whether cleanup occurs before or after sending the response. Tests replace a node through app.dependency_overrides keyed by the original callable object. Because that mapping is mutable application state, a fixture must always restore it, including after a failed assertion.'
      zh: 'FastAPI 把依赖解析为一张图，默认在一次请求中只求值一次同一依赖可调用对象。各使用方共享这个请求级结果，除非显式设置 use_cache=False。只包含一次 yield 的依赖会先获取资源，再运行退出代码，因此释放操作应放在 finally 中；所选范围决定清理发生在响应发送前还是发送后。测试通过 app.dependency_overrides 替换节点，键必须是原始可调用对象。该映射是应用级可变状态，所以 fixture 即使遇到断言失败也必须恢复它。'
    topics: [backend/fastapi]
    level: advanced
    section: { en: 'Dependency injection', zh: '依赖注入' }
    frequency: occasional
    tags: [fastapi, dependencies, lifecycle, testing]

  - id: file-upload-secure-lifecycle
    question: { en: 'Trace a secure file upload from admission to publication.', zh: '说明安全文件上传从准入到发布的完整流程。' }
    answer:
      en: 'I authenticate the caller, authorize the target resource, check quota, and create a pending record with a server-generated key, owner, limits, and expiry. Bytes stream into private quarantine through actual byte counting and checksum calculation. I compare observed size and digest with the intent, identify the type, fully parse or re-encode under format-specific resource limits, and run the required malware policy. A conditional update publishes only the expected pending object version. Every failure closes the stream and leaves a retryable, rejected, or expiring state; a reconciler finds orphan objects and stale records.'
      zh: '我先认证调用者，对目标资源执行授权并检查配额，再用服务端生成的键、所有者、限制和到期时间创建 pending 记录。字节经过实际计数与校验和计算，流式写入私有隔离区。随后核对实际大小和摘要，识别类型，并在格式专用资源限制下完整解析或重编码，再执行恶意软件策略。只有预期的 pending 对象版本能通过条件更新发布。任何失败都关闭流，并留下可重试、已拒绝或会到期的明确状态；对账任务负责发现孤立对象和失效记录。'
    topics: [backend/file-upload]
    level: intermediate
    section: { en: 'HTTP uploads', zh: 'HTTP 上传' }
    frequency: common
    tags: [file-upload, quarantine, validation, state-machine]

  - id: file-upload-type-validation
    question: { en: 'Why are filename extension, Content-Type, and a magic number still insufficient to validate an upload?', zh: '为什么文件扩展名、Content-Type 和魔数仍不足以验证上传？' }
    answer:
      en: 'The uploader controls the filename and declared Content-Type, so both are hints rather than evidence. A signature checks only a small byte pattern and can prefix an otherwise malformed or hostile file. I use them as cheap allowlist gates, then parse the complete input with a maintained decoder under CPU, memory, nesting, dimension, and output limits. Business validation is separate: a parseable CSV can still have forbidden columns or too many records. A checksum proves byte identity, not safety, and malware scanning adds another signal rather than replacing format parsing or authorization.'
      zh: '上传者可以控制文件名和声明的 Content-Type，所以两者只能作为提示。签名只检查少量字节，后面仍可能跟着畸形或恶意内容。我把这些信息作为廉价允许列表关卡，再用受维护的解码器完整解析输入，并限制 CPU、内存、嵌套、尺寸和输出量。业务验证仍是独立层次：能够解析的 CSV 也可能包含禁用列或过多记录。校验和只能证明字节身份，不能证明安全；恶意软件扫描也只是额外证据，不能替代格式解析和授权。'
    topics: [backend/file-upload]
    level: intermediate
    section: { en: 'Content validation', zh: '内容验证' }
    frequency: common
    tags: [content-type, file-signature, parser, checksum]

  - id: file-upload-presigned-completion
    question: { en: 'What must an application do around a presigned direct upload?', zh: '应用在预签名直传前后必须做什么？' }
    answer:
      en: 'Before signing, I authenticate and authorize the caller, enforce outstanding-upload quota, create a unique quarantine key, and bind a pending record to expected size, type, checksum, owner, and expiry. The capability is narrow in method, key, constraints, and lifetime; the client cannot choose a bucket or public prefix. A successful PUT is not publication. On completion, the service reads storage-observed metadata and object version, compares them with the intent, runs content validation and scanning, then conditionally publishes. Keys are non-reused because a presigned URL may be replayed before expiry and some stores overwrite an existing key.'
      zh: '签名前，我会认证并授权调用者，实施未完成上传配额，创建唯一的隔离键，并把 pending 记录绑定到预期大小、类型、校验和、所有者和到期时间。能力在方法、键、约束和有效期上都应收窄，客户端不能选择 bucket 或公开前缀。PUT 成功不等于发布。完成时，服务读取存储层观察到的元数据与对象版本，与上传意图比较，执行内容验证和扫描，再以条件更新发布。对象键不能复用，因为预签名 URL 在过期前可能被重放，而且部分存储会覆盖同一键。'
    topics: [backend/file-upload]
    level: advanced
    section: { en: 'Object storage', zh: '对象存储' }
    frequency: common
    tags: [presigned-url, object-key, replay, conditional-update]

  - id: file-upload-resumable-correctness
    question: { en: 'What makes a resumable multipart upload correct under retries and failures?', zh: '怎样保证可恢复 multipart upload 在重试和故障下仍然正确？' }
    answer:
      en: 'A durable session binds the owner, target key, total size, part rules, expiry, and state. Each part validates its number or byte range, actual length, and digest; retrying an accepted part is idempotent only when those properties match. Completion uses server or storage state, not the client’s list, to prove every required part exists, assemble in protocol order, and verify final size and checksum before content validation. Concurrent completion needs a conditional state transition. Abandoned sessions must be aborted or expired, and cleanup must recheck expiry so it does not race a client that has just resumed.'
      zh: '持久会话要绑定所有者、目标键、总大小、分段规则、到期时间和状态。每个分段都验证编号或字节范围、实际长度和摘要；只有这些属性一致时，重试已接收分段才是幂等的。完成操作依据服务端或存储层状态，而不是客户端列表，确认所需分段都存在，按协议顺序组装，并在内容验证前核对最终大小与校验和。并发完成需要条件状态转换。系统还要中止或清理废弃会话，且清理前重新检查到期状态，避免与刚恢复的客户端竞态。'
    topics: [backend/file-upload]
    level: advanced
    section: { en: 'Large-file reliability', zh: '大文件可靠性' }
    frequency: occasional
    tags: [multipart-upload, resumable-upload, idempotency, cleanup]

  - id: flask-request-lifecycle
    question: { en: 'Trace a Flask request from the WSGI server through cleanup.', zh: '说明 Flask 请求从 WSGI 服务器到清理结束的处理过程。' }
    answer:
      en: 'The WSGI server converts HTTP data to an environ dictionary and calls the Flask application. Flask pushes an application context and request context, opens the session, matches the URL rule, and runs before_request callbacks. Unless one returns early, Flask invokes the view and converts its return value into a Response. Error handlers may convert exceptions. after_request callbacks can replace or modify the response, then Flask saves the session and returns WSGI data. Finally it pops the contexts and runs teardown callbacks, including after unhandled failures, so cleanup must tolerate partially completed dispatch.'
      zh: 'WSGI 服务器把 HTTP 数据转换为 `environ` 字典并调用 Flask 应用。Flask 先推入应用上下文和请求上下文，打开会话、匹配 URL 规则，再运行 `before_request` 回调。若没有回调提前返回，Flask 会调用视图并把返回值转换为 `Response`；错误处理器可以转换异常。`after_request` 回调可以替换或修改响应，随后 Flask 保存会话并返回 WSGI 数据。最后框架弹出上下文并运行清理回调，即使存在未处理失败也会执行，所以清理逻辑必须容忍只完成了部分分派流程。'
    topics: [backend/flask]
    level: intermediate
    section: { en: 'Request handling', zh: '请求处理' }
    frequency: common
    tags: [flask, request-context, lifecycle]

  - id: flask-application-factory
    question: { en: 'Why use a Flask application factory with blueprints?', zh: '为什么 Flask 应用应结合蓝图使用应用工厂？' }
    answer:
      en: 'A factory makes application construction repeatable and parameterized. Tests can create one instance per case with controlled configuration, while a server can create consistently configured worker instances. Blueprints record routes and related setup without importing a particular global app; the factory registers them after loading configuration and initializing extensions. Extensions should usually be created unbound and connected with init_app for the same reason. The factory is a setup boundary, not a per-request operation: routes, hooks, error handlers, and middleware must be complete before serving begins, while migrations remain a separate deployment step.'
      zh: '应用工厂让应用构造过程可重复并可传入参数。测试可以为每个用例创建配置受控的实例，服务器也能为工作进程创建一致的实例。蓝图只记录路由和相关设置，不必导入某个全局应用；工厂在加载配置并初始化扩展后注册蓝图。出于同样原因，扩展通常先创建为未绑定对象，再通过 `init_app` 连接。工厂是设置边界，不是每个请求都会执行的操作；路由、钩子、错误处理器和中间件必须在开始服务前完成，而迁移应作为独立部署步骤。'
    topics: [backend/flask]
    level: intermediate
    section: { en: 'Application structure', zh: '应用结构' }
    frequency: common
    tags: [flask, application-factory, blueprint]

  - id: flask-context-boundary
    question: { en: 'Why should background work not use Flask request proxies?', zh: '为什么后台工作不应使用 Flask 请求代理？' }
    answer:
      en: 'request, session, g, and current_app are proxies resolved against an active context, not ordinary objects that capture current values when imported or passed. A task may run after Flask has popped the request context or in another thread or process with a different context, causing a runtime error or wrong assumptions about resource lifetime. I read and validate the required values while the request is active, convert them to explicit serializable job arguments, and let the worker acquire its own resources. Manually pushing a context is appropriate for framework integration, not for hiding an underspecified service function.'
      zh: '`request`、`session`、`g` 和 `current_app` 是根据有效上下文解析的代理，并不是在导入或传递时捕获当前值的普通对象。任务可能在 Flask 弹出请求上下文后运行，也可能位于上下文不同的线程或进程中，从而触发运行时错误，或错误判断资源生命周期。我会在请求有效时读取并验证所需值，把它们转换为显式、可序列化的任务参数，再让工作进程获取自己的资源。手工推入上下文适合框架集成，不应拿来掩盖参数定义不完整的服务函数。'
    topics: [backend/flask]
    level: intermediate
    section: { en: 'Context and concurrency', zh: '上下文与并发' }
    frequency: common
    tags: [flask, context-local, background-job]

  - id: flask-async-view-model
    question: { en: 'What does an async Flask view change under a WSGI deployment?', zh: '在 WSGI 部署下，Flask 异步视图会改变什么？' }
    answer:
      en: 'With the async extra installed, Flask can run an async view and await concurrent nonblocking operations inside that request. Under traditional WSGI, however, the request still occupies one worker while Flask runs an event loop for the view, so async def alone does not increase request concurrency. Synchronous drivers and extensions still block, and decorators must adapt coroutine views correctly. The request event loop stops when the view finishes, which cancels unfinished tasks created with asyncio.create_task. Durable work belongs in a task system; async-first workloads need deployment-level evaluation of an ASGI framework or adapter.'
      zh: '安装 `async` 额外依赖后，Flask 可以运行异步视图，并在一次请求内并发等待非阻塞操作。但在传统 WSGI 部署中，请求仍会占用一个工作单元，Flask 只是在其中为视图运行事件循环，因此单独改成 `async def` 不会增加请求并发量。同步驱动和扩展仍会阻塞，装饰器也必须正确适配协程视图。视图结束时，请求事件循环会停止，尚未完成的 `asyncio.create_task` 任务会被取消。持久工作应交给任务系统；异步优先负载则需在部署层评估 ASGI 框架或适配器。'
    topics: [backend/flask]
    level: advanced
    section: { en: 'Context and concurrency', zh: '上下文与并发' }
    frequency: occasional
    tags: [flask, async, wsgi, worker-model]

  - id: backend-start-request-lifecycle
    question: { en: 'Trace one HTTP request through a small backend.', zh: '说明一个 HTTP 请求经过小型后端的完整过程。' }
    answer:
      en: 'The server first parses the request line, headers, and optional body under size and time limits. Request-scoped middleware establishes an identifier, logging context, and authenticated principal before the router selects a handler by method and path. The handler validates transport input, calls domain logic, and uses a storage boundary that may open and commit a transaction. The result is mapped to an HTTP status, relevant headers, and a representation. Response middleware then runs and request-owned resources are released. I name failure paths at each boundary because malformed input, authorization denial, constraint conflicts, timeouts, and unknown outcomes need different responses.'
      zh: '服务器先在大小与时间限制下解析请求行、请求头和可选消息体。请求级中间件建立请求标识、日志上下文和已认证主体，路由器再按方法与路径选择处理器。处理器验证传输输入，调用领域逻辑，并通过可能开启和提交事务的存储边界读写数据。应用把结果映射为 HTTP 状态码、相关响应头和表示，然后运行响应中间件并释放请求拥有的资源。我还会说明每个边界的失败路径，因为畸形输入、授权拒绝、约束冲突、超时和结果未知需要不同响应。'
    topics: [backend/getting-started]
    level: beginner
    section: { en: 'Backend foundations', zh: '后端基础' }
    frequency: common
    tags: [request-lifecycle, middleware, transaction]

  - id: backend-start-validation-layers
    question: { en: 'How do transport validation, domain rules, authorization, and database constraints differ?', zh: '传输验证、领域规则、授权与数据库约束有何区别？' }
    answer:
      en: 'Transport validation asks whether untrusted input has the expected shape, types, encoding, and limits. Domain rules ask whether a valid command makes sense in the current business state, such as whether a project is still open. Authorization asks whether the authenticated principal may perform that operation on that resource; a caller-supplied owner ID is not proof. Database constraints protect durable invariants for every writer and close races that an application check cannot. I keep all four layers: early validation produces useful client errors, while constraints remain the final integrity boundary. Tests should show which layer rejects each invalid case.'
      zh: '传输验证判断不可信输入是否符合预期结构、类型、编码和限制。领域规则判断一个格式有效的命令在当前业务状态下是否成立，例如项目是否仍开放。授权判断已认证主体能否对该资源执行操作，调用方提供的所有者 ID 不能作为证明。数据库约束保护所有写入者都必须遵守的持久不变量，并关闭应用检查无法消除的竞态。这四层都要保留：前置验证提供有用的客户端错误，约束则是最终完整性边界。测试应明确每个无效用例由哪一层拒绝。'
    topics: [backend/getting-started]
    level: intermediate
    section: { en: 'Backend foundations', zh: '后端基础' }
    frequency: common
    tags: [validation, authorization, constraint, invariant]

  - id: backend-start-memory-versus-persistence
    question: { en: 'When is process memory appropriate in a backend, and when is durable storage required?', zh: '后端何时适合使用进程内存，何时必须使用持久存储？' }
    answer:
      en: 'Process memory is appropriate for request-local values and caches that the service can rebuild after loss. It is not a durable system of record: a restart clears it, separate worker processes have different copies, and concurrent updates need coordination. Orders, permissions, balances, and other business facts that must survive or be shared belong in durable storage. The storage choice must support the needed constraints, transactions, and recovery behavior. A cache may copy durable data, but its invalidation and stale-read policy must be explicit. I also keep request context out of mutable module globals because concurrent requests can overwrite one another even inside one process.'
      zh: '进程内存适合请求局部值，以及丢失后可以重建的缓存。它不是持久事实来源：重启会清空数据，不同工作进程各有副本，并发更新也需要协调。订单、权限、余额等必须长期存在或由多个进程共享的业务事实，应进入持久存储；存储还要支持所需约束、事务和恢复行为。缓存可以复制持久数据，但必须明确失效规则与陈旧读取策略。请求上下文也不能放在可变模块全局变量中，因为即使只有一个进程，并发请求仍会相互覆盖。'
    topics: [backend/getting-started]
    level: beginner
    section: { en: 'State and persistence', zh: '状态与持久化' }
    frequency: common
    tags: [persistence, process-memory, request-context]

  - id: backend-start-unknown-outcome
    question: { en: 'What should a backend do when a client may retry after an unknown outcome?', zh: '客户端可能在结果未知后重试时，后端应该怎样处理？' }
    answer:
      en: 'A lost response does not prove that the operation failed; the server may have committed before the connection broke. Safe or idempotent methods already define repeat semantics, but a create-style POST needs an application protocol. I accept a caller-stable idempotency key, scope it to the authenticated principal or tenant, and atomically store the key, a request fingerprint, and the operation result with the durable change. Repeating the same key and content replays that result, while different content under the key is rejected. The retention window is part of the contract. External side effects may also require an outbox or provider-level deduplication.'
      zh: '响应丢失不能证明操作失败，因为服务器可能在连接断开前已经提交。安全或幂等方法已有重复语义，创建型 POST 则需要应用协议。我会接受调用方稳定提供的幂等键，把它限定到已认证主体或租户，并把该键、请求指纹、操作结果与持久变更原子保存。使用相同键和相同内容重试时重放原结果；相同键配合不同内容则拒绝。保留窗口也属于公开契约。涉及外部副作用时，还可能需要 outbox 或下游提供者的去重能力。'
    topics: [backend/getting-started]
    level: intermediate
    section: { en: 'Failure and retries', zh: '失败与重试' }
    frequency: common
    tags: [unknown-outcome, idempotency-key, retry, outbox]

  - id: graphql-request-execution
    question: { en: 'Trace a GraphQL request from document to response.', zh: '说明 GraphQL 请求从文档到响应的处理过程。' }
    answer:
      en: 'The server parses the document, selects the requested operation, and validates fields, arguments, variables, fragments, and selection rules against the schema. It coerces variable values before execution. The executor starts at the relevant root type, collects fields by response key, and invokes resolvers with parent data, arguments, request context, and execution information. Child selections continue from returned values. The server serializes the result under data and records execution failures under errors with paths. Invalid documents do not execute resolvers, while field failures may still leave partial data when nullable boundaries contain them.'
      zh: '服务端先解析文档，选择指定操作，再根据模式验证字段、参数、变量、片段和选择规则。变量值经过强制转换后才进入执行。执行器从对应根类型开始，按响应键收集字段，并用父数据、参数、请求上下文和执行信息调用 resolver；返回值上的子选择继续递归执行。服务端把结果序列化到 data，并把执行故障及其路径写入 errors。无效文档不会执行 resolver；字段故障若被可空边界截住，响应仍可保留部分数据。'
    topics: [backend/graphql]
    level: intermediate
    section: { en: 'GraphQL execution', zh: 'GraphQL 执行' }
    frequency: common
    tags: [graphql, validation, resolver, execution]

  - id: graphql-nullability-boundary
    question: { en: 'How does GraphQL null bubbling affect schema design?', zh: 'GraphQL 的空值传播如何影响模式设计？' }
    answer:
      en: 'A nullable field may return null as ordinary data. If a Non-Null field returns null or throws, execution records an error and replaces the nearest nullable parent with null; propagation reaches the root when every parent on that path is Non-Null. I therefore treat each exclamation mark as a failure-boundary decision, not as a copy of a database constraint or TypeScript property. Remote outages, authorization redaction, and historical rows can all break an internal guarantee. I test the response data and error path for every important resolver failure, especially inside lists where one Non-Null item can null the list.'
      zh: '可空字段可以把 null 作为普通数据返回。非空字段返回 null 或抛错时，执行器记录错误，并把最近的可空父级设为 null；若路径上的父级全部非空，传播会一直到根。我把每个感叹号都视为故障边界决策，而不是数据库约束或 TypeScript 属性的复制。远程故障、授权脱敏与历史数据都可能破坏内部保证。我会为关键 resolver 故障同时测试响应数据与错误路径，尤其关注列表，因为一个非空元素失败就可能让整个列表变成 null。'
    topics: [backend/graphql]
    level: intermediate
    section: { en: 'Schema design', zh: '模式设计' }
    frequency: common
    tags: [graphql, nullability, partial-data]

  - id: graphql-dataloader-contract
    question: { en: 'How does a request-scoped DataLoader address N+1 reads, and what contract must its batch function keep?', zh: '请求级 DataLoader 如何处理 N+1 读取，批量函数必须遵守什么契约？' }
    answer:
      en: 'Sibling field resolvers call load with keys instead of querying the backend directly. DataLoader groups calls in a scheduling window and memoizes repeated keys, so one batch read can satisfy many fields. The batch function must return an array equal in length to the input keys and aligned in exactly the same order, including null or Error entries for missing values. Database IN queries rarely guarantee that order, so I map by key and reorder. I create loaders per request and authorization scope; a global loader can leak protected or stale data. After a mutation, I clear or prime affected request keys.'
      zh: '同级字段 resolver 不直接查询后端，而是把键交给 load。DataLoader 会合并一个调度窗口中的调用并记忆重复键，因此一次批量读取可以满足多个字段。批量函数返回的数组必须与输入键等长并严格同序，缺失值也要用 null 或 Error 占位。数据库的 IN 查询通常不保证顺序，所以我会先按键建立映射再重排。加载器应按请求与授权范围创建；全局加载器可能泄漏受保护或陈旧数据。Mutation 更新实体后，还要清除或填充受影响的请求级键。'
    topics: [backend/graphql]
    level: advanced
    section: { en: 'Data fetching', zh: '数据获取' }
    frequency: common
    tags: [graphql, n-plus-one, data-loader, batching]

  - id: graphql-operation-cost
    question: { en: 'Why is a GraphQL depth limit insufficient, and how would you bound operation cost?', zh: '为什么 GraphQL 深度限制不够，应该怎样约束操作成本？' }
    answer:
      en: 'Depth captures only one dimension. A shallow document can repeat an expensive field under hundreds of aliases, request a huge page, expand fragments, or fan out to remote services. I first cap document size, aliases, and pagination. Then I compute schema-aware cost before execution: fields have weights, list fields multiply child cost by a bounded size, and exceptional search or report fields get explicit budgets. Trusted documents reduce arbitrary input but still need cost checks. Runtime timeouts, downstream limits, and measured call counts remain necessary because a static model cannot predict every data-dependent path.'
      zh: '深度只描述一个维度。浅层文档仍可通过数百个别名重复昂贵字段，请求巨大分页，展开片段，或向远程服务扇出。我会先限制文档大小、别名数和分页，再在执行前计算理解模式的成本：字段带权重，列表字段按受限大小放大子选择成本，搜索或报表字段使用独立预算。受信任文档能减少任意输入，但仍要检查成本。运行时超时、下游限制和实测调用数仍然必要，因为静态模型无法预测所有依赖数据的路径。'
    topics: [backend/graphql]
    level: advanced
    section: { en: 'API security', zh: 'API 安全' }
    frequency: occasional
    tags: [graphql, operation-cost, trusted-document, denial-of-service]

  - id: grpc-call-lifecycle
    question: { en: 'What happens during a unary gRPC call, and why can client and server disagree about its result?', zh: '一元 gRPC 调用经历哪些步骤，客户端与服务端为什么可能对结果判断不一致？' }
    answer:
      en: 'The generated client serializes a typed request with method metadata and an optional deadline. The channel resolves a target, selects a connection, and sends the RPC; the server runtime decodes it, invokes the handler, then returns a response or final status with optional trailing metadata. Client and server judge completion locally. A server can commit a mutation and send a response after the client deadline has expired, so the client sees DEADLINE_EXCEEDED although the change happened. Cancellation asks work to stop but does not roll back committed effects, which is why mutations need explicit unknown-outcome handling.'
      zh: '生成客户端会序列化强类型请求，并附上方法 metadata 与可选截止时间。通道解析目标、选择连接并发送 RPC；服务端运行库解码请求、调用处理器，再返回响应或最终状态以及可选的尾随 metadata。客户端与服务端各自在本地判断调用是否完成。服务端可能已经提交修改并发送响应，但客户端截止时间先到，因此客户端看到 DEADLINE_EXCEEDED，修改却已经发生。取消只要求工作停止，不会回滚已提交副作用，所以修改操作必须明确处理结果未知的情况。'
    topics: [backend/grpc]
    level: intermediate
    section: { en: 'RPC lifecycle', zh: 'RPC 生命周期' }
    frequency: common
    tags: [grpc, deadline, cancellation, unknown-outcome]

  - id: grpc-protobuf-evolution
    question: { en: 'How do you evolve a Protocol Buffers contract without breaking deployed gRPC clients?', zh: '怎样演进 Protocol Buffers 契约而不破坏已部署的 gRPC 客户端？' }
    answer:
      en: 'Treat field numbers as permanent wire identities. Additive fields are usually readable by old clients, but their default values still need safe business meaning. When removing a field, reserve both its number and name; never reuse or reorder numbers. A type change that shares a wire type can still alter overflow, signedness, or semantics, so add a new field and migrate readers and writers in stages. Test old-client/new-server and new-client/old-server combinations, including unknown enum values and intermediaries that deserialize and reserialize messages. Descriptor compatibility checks help, but they cannot prove authorization rules or behavioral compatibility.'
      zh: '字段编号应视为永久线上身份。新增字段通常能被旧客户端读取或忽略，但该字段的默认值仍需具备安全的业务含义。删除字段时，要同时保留原编号与名称，不能复用编号或为整齐而重新编号。某些类型虽然共用 wire type，仍可能改变溢出、符号或业务语义，因此应新增字段，并分阶段迁移读写方。测试要覆盖旧客户端配新服务端、新客户端配旧服务端、未知枚举值，以及会反序列化再序列化消息的中间服务。描述符兼容检查有帮助，却不能证明授权规则或行为兼容。'
    topics: [backend/grpc]
    level: advanced
    section: { en: 'Schema compatibility', zh: '模式兼容性' }
    frequency: common
    tags: [grpc, protobuf, field-number, compatibility]

  - id: grpc-retry-safety
    question: { en: 'How do you decide whether a failed gRPC call may be retried?', zh: '怎样判断失败的 gRPC 调用是否可以重试？' }
    answer:
      en: 'Start with operation semantics, not only the status code. UNAVAILABLE may be transient, but it does not prove that a server skipped a mutation; DEADLINE_EXCEEDED can arrive after a commit. A read is often safe to retry within the remaining budget. A mutation needs idempotent semantics, commonly a caller-stable request ID atomically stored with a request fingerprint and result. Bound attempts, exponential backoff, and the total deadline, and audit retries in proxies, SDKs, business loops, and queues together. Reject reuse of one idempotency key with different content, and define how long deduplication records remain valid.'
      zh: '判断应从操作语义开始，不能只看状态码。UNAVAILABLE 可能表示暂时故障，却不能证明服务端没有执行修改；DEADLINE_EXCEEDED 也可能在提交后出现。读取操作通常可以在剩余预算内重试。修改操作需要幂等语义，常见做法是由调用方稳定提供请求 ID，服务端把它与请求指纹及结果原子保存。还要限制尝试次数、指数退避和总截止时间，并一起审计代理、SDK、业务循环与队列中的重试。相同幂等键配合不同内容时应拒绝，同时要定义去重记录的有效期。'
    topics: [backend/grpc]
    level: advanced
    section: { en: 'Failure and retries', zh: '失败与重试' }
    frequency: common
    tags: [grpc, retry, idempotency, status-code]

  - id: hono-request-lifecycle
    question: { en: 'Trace a Hono request from entry to response.', zh: '说明 Hono 请求从进入应用到返回响应的处理过程。' }
    answer:
      en: 'A runtime adapter hands the Hono application a Web-standard Request plus any platform environment and execution context. Hono matches the HTTP method and path against registered routes, creates a Context, and enters matching middleware in registration order. Each middleware may return a response early or await next. A route handler reads request data and returns a Response, often through c.json or c.text. Control then unwinds through middleware after each await next. Thrown errors go to onError, while an unmatched route goes to notFound. The adapter finally returns the Response to the runtime.'
      zh: '运行时适配器把 Web 标准 Request、平台环境和执行上下文交给 Hono 应用。Hono 按登记顺序匹配 HTTP 方法与路径，创建 Context，再进入匹配的中间件。每个中间件可以提前返回响应，也可以 await next。路由处理器读取请求数据，并通过 c.json、c.text 等方法返回 Response。随后控制权沿各层 await next 反向退出。抛出的错误进入 onError，没有匹配路由的请求进入 notFound，最后由适配器把 Response 交还运行时。'
    topics: [backend/hono]
    level: beginner
    section: { en: 'Request handling', zh: '请求处理' }
    frequency: common
    tags: [hono, request-lifecycle, middleware, response]

  - id: hono-runtime-validation
    question: { en: 'Why is a TypeScript request-body type insufficient in Hono?', zh: '为什么 Hono 中的 TypeScript 请求体类型不足以保护接口？' }
    answer:
      en: 'TypeScript types disappear at runtime, so a generic argument on c.req.json or an assertion cannot inspect bytes sent by an untrusted client. The body can still contain missing fields, wrong primitive types, invalid ranges, or unexpected properties. I attach a runtime validator to the route and have it parse, validate, and normalize the input before business code runs. The handler reads only c.req.valid for that target. Tests send real Requests covering malformed JSON, wrong Content-Type, boundary values, and unknown-field policy. Authorization and database constraints remain separate checks after structural validation.'
      zh: 'TypeScript 类型会在运行时消失，因此 c.req.json 的泛型实参或类型断言无法检查不可信客户端发送的字节。请求体仍可能缺少字段、使用错误的基础类型、超出范围或包含意外属性。我会给路由挂载运行时验证器，让它在业务代码前完成解析、验证和规范化，处理器只读取该目标的 c.req.valid 结果。测试通过真实 Request 覆盖畸形 JSON、错误 Content-Type、边界值与未知字段策略。结构验证之后仍需单独执行授权和数据库约束。'
    topics: [backend/hono]
    level: intermediate
    section: { en: 'Validation', zh: '验证' }
    frequency: common
    tags: [hono, typescript, runtime-validation, trust-boundary]

  - id: hono-middleware-order
    question: { en: 'Why does middleware order matter in Hono?', zh: '为什么 Hono 的中间件顺序很重要？' }
    answer:
      en: 'Hono composes matching middleware and handlers in registration order. Code before await next runs on the request path, and code after it runs as control unwinds through the response path. Middleware that returns a Response without calling next intentionally short-circuits later work. These rules make order functional: authentication registered after a route may not protect it, CORS placed too narrowly may disappear from failure responses, and omitting await can race response-phase work. I test a route-to-middleware matrix with both accepted and rejected requests, then assert headers and events from both sides of next.'
      zh: 'Hono 按登记顺序组合匹配的中间件与处理器。await next 之前的代码在请求阶段执行，之后的代码则在控制权沿响应阶段退出时执行。中间件若直接返回 Response 而不调用 next，就会有意短路后续工作。因此顺序具有实际语义：路由之后登记的认证可能无法保护它，范围过窄的 CORS 可能不会出现在失败响应中，遗漏 await 还会让响应阶段工作发生竞态。我会用成功与拒绝请求测试路由到中间件的映射，并断言 next 两侧的响应头与事件。'
    topics: [backend/hono]
    level: intermediate
    section: { en: 'Middleware', zh: '中间件' }
    frequency: common
    tags: [hono, middleware-order, onion-model, short-circuit]

  - id: hono-rpc-boundary
    question: { en: 'What does Hono RPC guarantee, and what remains to be verified?', zh: 'Hono RPC 提供什么保证，还有哪些内容需要验证？' }
    answer:
      en: 'Hono RPC lets an hc client derive paths, input shapes, and response types from the final server application type. It catches many incorrect path parameters and payloads while the client compiles. It does not send those types over HTTP, validate arbitrary callers, or prove that the deployed service matches the type artifact. I export the final chained route type through a versioned type-only package, keep compatible Hono versions, and avoid importing server startup code into the browser. Runtime tests still cover validation, authentication, every status branch, media types, headers, network failures, and supported client-server version combinations.'
      zh: 'Hono RPC 让 hc 客户端从最终服务端应用类型推导路径、输入结构与响应类型，可以在客户端编译时发现许多错误路径参数和负载。它不会通过 HTTP 发送这些类型，不会验证任意调用方，也不能证明已部署服务与类型制品一致。我会通过版本化的纯类型包导出最终链式路由类型，保持 Hono 版本兼容，并避免把服务端启动代码导入浏览器。运行时测试仍要覆盖验证、认证、各状态分支、媒体类型、响应头、网络故障以及支持的客户端与服务端版本组合。'
    topics: [backend/hono]
    level: advanced
    section: { en: 'Typed clients', zh: '类型化客户端' }
    frequency: occasional
    tags: [hono-rpc, typed-client, contract-testing, versioning]

  - id: httpx-client-lifetime
    question: { en: 'Where should an HTTPX client live in a service, and why?', zh: 'HTTPX 客户端在服务中应由谁持有，为什么？' }
    answer:
      en: 'One application or service-lifecycle owner should normally create a configured Client or AsyncClient, inject it into callers, and close it during shutdown. The client owns a connection pool, so constructing one per request or loop iteration discards reusable connections and multiplies sockets and TLS setup. Its sharing scope should match authentication, cookies, proxy settings, and upstream policy; clients with incompatible trust boundaries should remain separate. Tests can replace the transport while keeping that ownership shape. In async code I also verify that shutdown awaits aclose and that no synchronous client blocks the event loop.'
      zh: '通常应由应用或服务生命周期的唯一所有者创建配置好的 `Client` 或 `AsyncClient`，将其注入调用方，并在关闭阶段释放。客户端持有连接池，因此每个请求或每次循环都新建客户端，会丢失可复用连接，并增加套接字与 TLS 建连成本。共享范围应与认证、Cookie、代理设置和上游策略一致；信任边界不兼容的客户端应保持分离。测试可以替换传输，同时保留相同所有权结构。在异步代码中，还要确认关闭阶段会 `await aclose()`，而且没有同步客户端阻塞事件循环。'
    topics: [backend/httpx]
    level: intermediate
    section: { en: 'HTTP clients', zh: 'HTTP 客户端' }
    frequency: common
    tags: [httpx, client-lifetime, connection-pool]

  - id: httpx-timeout-versus-deadline
    question: { en: 'Why is an HTTPX timeout not the same as an overall deadline?', zh: '为什么 HTTPX 超时不等于整体截止时间？' }
    answer:
      en: 'HTTPX models pool, connect, write, and read waits separately. A read timeout bounds the wait for the next data chunk, not total download duration, so a slow peer can keep a request alive by sending data often enough. An overall deadline belongs outside those phase controls and covers every phase plus parsing, backoff, and retries. I derive phase values from the caller’s remaining budget, never reset the full deadline on each attempt, and test pool saturation and slow streaming independently. Cancellation at the deadline stops local waiting but does not prove that a remote mutation was rolled back.'
      zh: 'HTTPX 分别描述连接池、连接、写入和读取等待。读取超时限制的是下一块数据的等待时间，而不是下载总时长，因此对端只要持续缓慢发送数据，就能让请求继续。整体截止时间位于这些阶段控制之外，还要覆盖解析、退避与所有重试。我会根据调用方的剩余预算设置阶段值，不在每次尝试时重置完整截止时间，并分别测试连接池饱和与缓慢流。截止时间触发的取消只停止本地等待，不能证明远端修改已经回滚。'
    topics: [backend/httpx]
    level: intermediate
    section: { en: 'Failure handling', zh: '故障处理' }
    frequency: common
    tags: [httpx, timeout, deadline]

  - id: httpx-error-boundaries
    question: { en: 'How do HTTPStatusError and RequestError change HTTPX error handling?', zh: '`HTTPStatusError` 与 `RequestError` 如何影响 HTTPX 错误处理？' }
    answer:
      en: 'HTTPX returns a Response for HTTP statuses until code calls raise_for_status. A non-success status then raises HTTPStatusError, which retains the request and response, so code may inspect a trusted error schema and status-specific headers. RequestError represents failures while issuing the request, including transport and timeout subclasses, and may have no response at all. I avoid parsing a success body before checking status and avoid assuming exc.response on transport failures. Retry policy then considers both the failure phase and operation semantics, because a read failure can leave a server-side mutation with an unknown outcome.'
      zh: 'HTTPX 收到 HTTP 状态后会先返回 `Response`，直到代码调用 `raise_for_status()`。非成功状态此时抛出 `HTTPStatusError`，并保留请求与响应，因此代码可以检查可信错误模式及状态专属响应头。`RequestError` 表示发送请求期间的故障，包括传输与超时子类，而且可能完全没有响应。我不会在检查状态前按成功模式解析正文，也不会在传输故障时假定存在 `exc.response`。重试策略还要同时考虑失败阶段与操作语义，因为读取失败可能让服务端修改处于结果未知状态。'
    topics: [backend/httpx]
    level: intermediate
    section: { en: 'Failure handling', zh: '故障处理' }
    frequency: common
    tags: [httpx, status-error, request-error, retry]

  - id: httpx-stream-ownership
    question: { en: 'What must you review when HTTPX returns a streaming response?', zh: 'HTTPX 返回流式响应时必须审查什么？' }
    answer:
      en: 'A streaming call transfers body-consumption and connection-release responsibility to the caller. I prefer client.stream as a context manager, or guarantee Response.close or aclose in every success, error, early-return, and cancellation path when using manual streaming. I select iter_bytes, iter_text, iter_lines, or iter_raw from the consumer protocol, because transport chunks are not record boundaries. The pipeline must bound cumulative size and downstream concurrency; collecting all chunks defeats its memory goal. Tests consume only part of the body and cancel a task, then prove the stream closed and the pool can serve another request.'
      zh: '流式调用把正文消费与连接释放责任交给调用方。我优先把 `client.stream()` 用作上下文管理器；若采用手工流模式，则保证成功、错误、提前返回和取消路径都调用 `Response.close()` 或 `aclose()`。我会根据消费协议选择 `iter_bytes()`、`iter_text()`、`iter_lines()` 或 `iter_raw()`，因为传输块不等于记录边界。管道还要限制累计大小与下游并发，把所有块收集起来会破坏流式处理的内存目标。测试会只消费部分正文并取消任务，再证明流已关闭且连接池可以处理后续请求。'
    topics: [backend/httpx]
    level: advanced
    section: { en: 'Streaming', zh: '流式处理' }
    frequency: occasional
    tags: [httpx, streaming, cleanup, backpressure]

  - id: kotlin-request-boundaries
    question: { en: 'How would you structure the request boundary of a Kotlin HTTP endpoint?', zh: '你会怎样组织 Kotlin HTTP 端点的请求边界？' }
    answer:
      en: 'I keep the framework call object in the route adapter. That layer parses path values, headers, and JSON, performs runtime structural validation, normalizes formats, and derives tenant or actor identity from authenticated context rather than caller-controlled fields. It then constructs a domain command and calls a framework-independent service. The service returns a sealed domain result, which the adapter maps to documented statuses and dedicated response DTOs. I test this boundary through the real HTTP test host with malformed input, wrong media types, authorization failures, domain conflicts, and the success representation.'
      zh: '我会把框架调用对象限制在路由适配层。该层解析路径值、请求头与 JSON，执行运行时结构校验和格式规范化，并从认证上下文推导租户或主体身份，而不是信任调用方字段。随后它构造领域命令，调用与框架无关的服务。服务返回密封领域结果，适配层再把它映射为已记录的状态码与专用响应 DTO。我会通过真实 HTTP 测试主机覆盖畸形输入、错误媒体类型、授权失败、领域冲突和成功表示。'
    topics: [backend/kotlin-backend]
    level: intermediate
    section: { en: 'HTTP boundaries', zh: 'HTTP 边界' }
    frequency: common
    tags: [kotlin, http, validation, dto]

  - id: kotlin-coroutine-lifetimes
    question: { en: 'How should coroutine lifetimes relate to a Kotlin server request?', zh: '协程生命周期应怎样与 Kotlin 服务端请求关联？' }
    answer:
      en: 'Work needed for the response should remain a child of the request scope. I use coroutineScope for concurrent child work so parent cancellation reaches it, sibling failure cancels related work, and the scope does not return early. I avoid GlobalScope and anonymous CoroutineScope construction in handlers because they hide ownership and shutdown behavior. Durable work that must outlive the response goes to a persistent queue or transactional outbox. Process-lifetime maintenance may use an application-owned scope, but shutdown must cancel it, wait for children, and close the resources those children use.'
      zh: '响应所需工作应继续作为请求作用域的子任务。我会使用 coroutineScope 组织并发子任务，使父级取消能向下传播，同级故障能取消相关工作，而且作用域不会提前返回。我不会在处理器中使用 GlobalScope 或匿名构造 CoroutineScope，因为它们会隐藏所有权与关闭行为。必须活过响应的可靠任务应进入持久队列或事务 outbox。进程级维护任务可以使用应用拥有的作用域，但关闭时必须取消它、等待子任务，并关闭子任务使用的资源。'
    topics: [backend/kotlin-backend]
    level: advanced
    section: { en: 'Concurrency', zh: '并发' }
    frequency: common
    tags: [kotlin, coroutines, structured-concurrency, cancellation]

  - id: kotlin-blocking-suspend
    question: { en: 'Why does a suspend function not make a blocking dependency non-blocking?', zh: '为什么挂起函数不会让阻塞依赖自动变成非阻塞？' }
    answer:
      en: 'The suspend modifier lets a function pause through Kotlin continuation machinery; it does not rewrite the implementation of JDBC, file I/O, or a legacy SDK. If that dependency blocks, it still occupies whichever thread called it. I isolate unavoidable blocking work at the dependency adapter with Dispatchers.IO or a bounded dedicated executor, then configure connection limits and dependency timeouts. Cancellation is cooperative, so moving work does not guarantee that the underlying call stops. I pass deadlines downward and test that cancellation releases application resources even when the driver reacts slowly.'
      zh: 'suspend 修饰符允许函数通过 Kotlin continuation 机制暂停，却不会改写 JDBC、文件 I/O 或旧 SDK 的实现。依赖若会阻塞，就仍会占住调用它的线程。我会在依赖适配器边界使用 Dispatchers.IO 或有界专用执行器隔离不可避免的阻塞工作，并配置连接上限与依赖超时。取消是协作式的，所以移动任务并不能保证底层调用停止。我会向下传递截止时间，并测试即使驱动反应缓慢，取消也能释放应用资源。'
    topics: [backend/kotlin-backend]
    level: intermediate
    section: { en: 'Concurrency', zh: '并发' }
    frequency: common
    tags: [kotlin, suspend, blocking-io, dispatcher]

  - id: kotlin-ktor-versus-spring
    question: { en: 'How would you choose between Ktor and Spring Boot for a Kotlin service?', zh: '你会怎样为 Kotlin 服务选择 Ktor 或 Spring Boot？' }
    answer:
      en: 'I start with constraints rather than a generic performance ranking. Ktor offers a small Kotlin-native routing and plugin model and suits teams that want explicit assembly. Spring Boot fits organizations already operating Spring or needing a particular Spring Data, Security, integration, or management component. I compare supported libraries, observability, deployment model, startup and memory measurements in our environment, team experience, and upgrade policy. Whichever adapter wins, I keep domain services independent of route and container types, then verify HTTP behavior and shutdown with framework-level tests.'
      zh: '我会从约束出发，而不是套用笼统的性能排名。Ktor 提供较小的 Kotlin 原生路由与插件模型，适合希望显式组装组件的团队。Spring Boot 适合已经运行 Spring，或明确需要 Spring Data、Security、集成与管理组件的组织。我会比较受支持的库、可观测性、部署模型、实际环境中的启动与内存测量、团队经验和升级策略。无论选择哪个适配层，领域服务都不依赖路由或容器类型，再用框架级测试验证 HTTP 行为与关闭过程。'
    topics: [backend/kotlin-backend]
    level: intermediate
    section: { en: 'Framework selection', zh: '框架选择' }
    frequency: occasional
    tags: [kotlin, ktor, spring-boot, architecture]

  - id: laravel-request-lifecycle
    question: { en: 'Trace a Laravel HTTP request from public/index.php to the response.', zh: '说明 Laravel HTTP 请求从 public/index.php 到响应的处理过程。' }
    answer:
      en: 'The front controller loads Composer and the application from bootstrap/app.php, then hands the captured request to the HTTP kernel. The kernel runs bootstrappers, registers and boots service providers, and sends the request through global middleware. The router matches the HTTP method and URI, applies route middleware, resolves route parameters and container dependencies, and invokes the closure or controller action. The resulting response unwinds through middleware in reverse order before it is sent. I mention that middleware and route order are behavioral, not cosmetic, and that termination work happens after the response path.'
      zh: '前端控制器加载 Composer，并从 bootstrap/app.php 取得应用，再把捕获的请求交给 HTTP 内核。内核运行启动器，注册并启动服务提供者，然后让请求经过全局中间件。路由器匹配 HTTP 方法与 URI，应用路由中间件，解析路由参数和容器依赖，再调用闭包或控制器动作。生成的响应按相反顺序经过中间件后发出。我还会说明中间件与路由顺序具有行为语义，响应路径结束后仍可能执行终止工作。'
    topics: [backend/php-laravel]
    level: intermediate
    section: { en: 'Web frameworks', zh: 'Web 框架' }
    frequency: common
    tags: [laravel, request-lifecycle, middleware]

  - id: laravel-container-lifetimes
    question: { en: 'How do bind, singleton, and scoped differ in Laravel?', zh: 'Laravel 的 bind、singleton 与 scoped 有什么区别？' }
    answer:
      en: 'bind normally creates a new resolved instance each time, singleton returns one shared instance for the application process, and scoped shares within one request or job lifecycle before supported long-running workers flush it. I choose among them from ownership and mutable state, not merely construction cost. A singleton must not retain the current request, user, or tenant. A scoped service can hold unit-of-work state, but static properties inside it still outlive the scope. I test lifetimes by resolving twice within one work cycle and again across two simulated Octane requests or queue jobs.'
      zh: 'bind 通常在每次解析时创建新实例，singleton 在应用进程内返回同一个共享实例，scoped 则只在一次请求或任务生命周期内共享，受支持的常驻工作进程会在下一周期前刷新它。我根据所有权和可变状态选择，而不只看构造成本。单例不能保留当前请求、用户或租户；作用域服务可以保存工作单元状态，但内部静态属性仍会越过作用域。我会在同一周期内解析两次，再跨两个模拟的 Octane 请求或队列任务验证生命周期。'
    topics: [backend/php-laravel]
    level: advanced
    section: { en: 'Dependency management', zh: '依赖管理' }
    frequency: common
    tags: [laravel, container, scoped-binding]

  - id: laravel-write-boundary
    question: { en: 'How should validation, authorization, mass assignment, and constraints divide responsibility in a Laravel write endpoint?', zh: 'Laravel 写入端点中的验证、授权、批量赋值和约束应如何分工？' }
    answer:
      en: 'A Form Request parses and validates the transport fields and may perform entry-point authorization. A policy or tenant-scoped query proves that the authenticated caller may act on the resolved object. The application service enforces state transitions and derives server-owned values such as customer IDs and prices. Eloquent receives an explicit allowlisted array; fillable protection is defense in depth, not the source of truth. A transaction groups related writes, while database types, foreign keys, unique constraints, and checks protect durable invariants against every writer. Tests include malformed input, a second tenant, races, rollback, and forbidden extra fields.'
      zh: 'Form Request 解析并验证传输字段，也可以执行入口授权。策略或限定租户的查询证明已认证调用方可以操作已解析对象。应用服务维护状态转换，并计算客户 ID、价格等服务端字段。Eloquent 只接收显式白名单数组；fillable 是纵深防御，不是事实来源。事务把相关写入组成一个单元，数据库类型、外键、唯一约束和检查约束则对所有写入者保护持久不变量。测试应覆盖畸形输入、第二个租户、竞态、回滚和禁止的额外字段。'
    topics: [backend/php-laravel]
    level: intermediate
    section: { en: 'Data integrity', zh: '数据完整性' }
    frequency: common
    tags: [laravel, validation, authorization, mass-assignment]

  - id: laravel-n-plus-one-proof
    question: { en: 'How do you diagnose and prevent an Eloquent N+1 query?', zh: '怎样诊断并防止 Eloquent N+1 查询？' }
    answer:
      en: 'I reproduce the complete access path, including API Resource or Blade rendering, because lazy relationship access often happens after the controller query. With a fixed page size and relationship shape, I capture the SQL count and identify the repeated relation. with loads planned relationships with the main query, while load adds them to models already retrieved; nested reads need nested eager loading. I then rerun the same path and keep a bounded query-count regression test. I still constrain columns and pagination, since eager-loading an unbounded graph can replace excessive queries with excessive memory and transfer.'
      zh: '我会复现完整访问路径，包括 API Resource 或 Blade 渲染，因为关系惰性访问常发生在控制器查询之后。固定页大小和关联形状后，我记录 SQL 数量并找到重复关系。with 随主查询规划关联，load 为已取得模型补充关联；嵌套读取需要嵌套预加载。随后用同一路径复测，并保留有上限的查询数量回归测试。我仍会限制字段与分页，因为预加载无界对象图可能只是把过多查询换成过多内存和传输。'
    topics: [backend/php-laravel]
    level: intermediate
    section: { en: 'ORM and data access', zh: 'ORM 与数据访问' }
    frequency: common
    tags: [laravel, eloquent, n-plus-one, eager-loading]

  - id: requests-response-layers
    question: { en: 'How should a Requests client distinguish transport, HTTP, decoding, and domain failures?', zh: 'Requests 客户端应怎样区分传输、HTTP、解码和领域失败？' }
    answer:
      en: 'I treat them as separate contracts. Connection and timeout exceptions mean the client did not obtain a complete HTTP result, and a read failure may leave a write outcome unknown. A 4xx or 5xx is a completed HTTP exchange, so I inspect the expected error status and bounded error representation. Only after accepting the status and media type do I decode JSON and validate its schema. Domain failures such as an exhausted balance can arrive in a valid response and need typed application handling. I preserve those categories in logs, metrics, and retry decisions.'
      zh: '我会把它们视为不同契约。连接与超时异常表示客户端没有取得完整 HTTP 结果，而且读取失败可能让写操作结果处于未知状态。4xx 或 5xx 则是已经完成的 HTTP 交换，因此我会检查预期错误状态和有界错误表示。只有接受状态码与媒体类型后，才解码 JSON 并验证模式。余额不足等领域失败可以出现在有效响应中，需要带类型的应用处理。日志、指标与重试决策都应保留这些类别。'
    topics: [backend/requests]
    level: intermediate
    section: { en: 'HTTP clients', zh: 'HTTP 客户端' }
    frequency: common
    tags: [requests, errors, status-codes, json]

  - id: requests-timeout-budget
    question: { en: 'Why is the Requests timeout argument not an overall deadline?', zh: '为什么 Requests 的 timeout 参数不是总截止时间？' }
    answer:
      en: 'A scalar configures connect and read inactivity timeouts, while a tuple configures them separately. The read value limits how long the socket can go without response bytes; a long download that keeps producing bytes can exceed it. DNS work, multiple address attempts, redirects, retries, and backoff can also extend wall-clock duration. I therefore set explicit connect and read values on every call, then enforce a higher-level deadline for the whole operation. That deadline owns the retry budget, and cancellation must close any response or session resources rather than merely stop waiting for a worker thread.'
      zh: '单个数值会配置连接与读取无数据超时，元组则分别配置两者。读取值限制套接字连续收不到响应字节的时长；持续产生少量字节的长下载可以超过该时间。DNS、多个地址尝试、重定向、重试和退避也会延长墙钟耗时。因此，我会为每次调用设置明确的连接与读取值，再由更高层执行整个操作的截止时间。该截止时间负责分配重试预算，而且取消必须关闭响应或会话资源，不能只是停止等待工作线程。'
    topics: [backend/requests]
    level: intermediate
    section: { en: 'Reliability', zh: '可靠性' }
    frequency: common
    tags: [requests, timeout, deadline, retry-budget]

  - id: requests-session-response-lifetime
    question: { en: 'How do Session reuse and streamed-response lifetime interact?', zh: 'Session 复用与流式响应生命周期如何相互影响？' }
    answer:
      en: 'A Session keeps cookies, default configuration, adapters, and urllib3 connection pools. Repeated calls to one host can reuse an underlying connection after the previous response has released it. With normal eager reads, Requests consumes the body before returning. With stream=True, the body still owns the connection, so the caller must consume it fully or close the response. I use a with block for every streamed response and bound both declared and observed size. I also scope sessions by credential ownership because sharing one host does not mean two tenants should share cookies or authorization state.'
      zh: 'Session 保存 Cookie、默认配置、适配器和 urllib3 连接池。对同一主机的重复调用，可以在前一个响应释放连接后复用底层连接。普通急切读取会在返回前消费响应体；使用 stream=True 时，响应体仍占有连接，因此调用方必须完整消费或关闭响应。我会把每个流式响应放进 with 块，并同时限制声明大小与实际读取大小。会话还要按凭据所有权划分，因为访问同一主机不表示两个租户应共享 Cookie 或授权状态。'
    topics: [backend/requests]
    level: intermediate
    section: { en: 'Resource management', zh: '资源管理' }
    frequency: common
    tags: [requests, session, connection-pool, streaming]

  - id: requests-retry-idempotency
    question: { en: 'What must you establish before retrying an HTTP request with Requests?', zh: '使用 Requests 重试 HTTP 请求前必须确认什么？' }
    answer:
      en: 'I first ask what is known about the previous attempt: a connection failure before delivery differs from a read timeout after the server may have committed. Then I verify the method and endpoint are replay-safe, choose retryable statuses and exceptions, cap attempts, and fit backoff plus Retry-After within an overall deadline. Client settings cannot make POST idempotent. For a retryable create operation, the caller keeps one idempotency key across attempts and the server atomically stores that key with the side effect and result. Tests cover lost responses, duplicate delivery, exhaustion, and server-requested delay.'
      zh: '我会先判断对上一次尝试知道什么：请求送达前的连接失败，与服务端可能已经提交后的读取超时不同。然后验证方法和端点可安全重放，选择可重试状态与异常，限制尝试次数，并让退避和 Retry-After 服从总截止时间。客户端设置不能让 POST 变成幂等。可重试的创建操作需要调用方在多次尝试间保持同一个幂等键，服务端则把该键与副作用和结果原子保存。测试应覆盖响应丢失、重复投递、耗尽和服务端要求等待。'
    topics: [backend/requests]
    level: advanced
    section: { en: 'Reliability', zh: '可靠性' }
    frequency: common
    tags: [requests, retry, idempotency, retry-after]

  - id: requests-ssrf-boundary
    question: { en: 'How do you prevent SSRF when a Requests client accepts a target URL?', zh: 'Requests 客户端接收目标 URL 时，怎样防止 SSRF？' }
    answer:
      en: 'The safest interface accepts a business identifier and maps it to a fixed origin. If arbitrary destinations are truly required, I parse and normalize the URL, allow only intended schemes, exact hosts, and ports, resolve the host, and reject prohibited local or private addresses. Every redirect creates a new destination and receives the same validation. I do not rely on string prefixes. Egress firewall or proxy policy supplies another boundary, while response and redirect limits constrain resource use. DNS rebinding and environment proxy settings belong in the threat model, and TLS verification stays enabled.'
      zh: '最安全的接口接收业务标识，再映射到固定源站。确实需要任意目标时，我会解析并规范化 URL，只允许预期协议、精确主机和端口，解析主机后拒绝被禁止的本地或私有地址。每次重定向都会产生新目标，必须接受同样验证，不能依赖字符串前缀。出站防火墙或代理策略提供另一层边界，响应与重定向限制则约束资源消耗。威胁模型还应包含 DNS 重绑定和环境代理设置，并始终保持 TLS 验证开启。'
    topics: [backend/requests]
    level: advanced
    section: { en: 'Security', zh: '安全' }
    frequency: occasional
    tags: [requests, ssrf, redirects, tls]

  - id: scala-future-versus-io
    question: { en: 'How do Scala `Future` and Cats Effect `IO` differ at a service boundary?', zh: 'Scala 的 `Future` 与 Cats Effect 的 `IO` 在服务边界上有什么区别？' }
    answer:
      en: 'A Future normally starts eagerly once it has an ExecutionContext, so constructing it may already schedule work. It carries success or failure but has no uniform structured cancellation protocol. IO is a description that normally starts only when the Cats Effect runtime executes it, and its composition keeps cancellation and finalization visible. I do not claim that one type is universally better. At a boundary, I document evaluation timing, bridge Future with IO.fromFuture while delaying its creation, isolate blocking APIs with IO.blocking, and keep one effect runtime at application startup.'
      zh: 'Future 获得 ExecutionContext 后通常会立即启动，因此构造它时可能已经安排工作。它能表示成功与失败，却没有统一的结构化取消协议。IO 是计算描述，通常要等 Cats Effect 运行时执行才会开始，其组合还会保留取消与终结行为。我不会笼统断言某个类型总是更好；在边界上，我会说明求值时机，用 IO.fromFuture 桥接并推迟 Future 的创建，用 IO.blocking 隔离阻塞 API，并只在应用启动处保留一个效果运行时。'
    topics: [backend/scala-backend]
    level: advanced
    section: { en: 'Effects and concurrency', zh: '效果与并发' }
    frequency: common
    tags: [scala, future, cats-effect, evaluation]

  - id: scala-resource-ownership
    question: { en: 'How would you model a Scala service resource graph with Cats Effect?', zh: '你会怎样用 Cats Effect 建模 Scala 服务的资源图？' }
    answer:
      en: 'I represent each acquired dependency as Resource: configuration-backed clients, database pools, dedicated executors, and the HTTP server. A for-comprehension acquires them in dependency order, while Resource releases them in reverse order after success, startup failure, or cancellation. The application calls use once at its outer boundary. Shorter resources, such as a transaction connection or response stream, stay inside narrower use scopes. I avoid allocated unless a clear owner stores and invokes its release action. Tests make acquisition fail at several points and verify that every earlier resource closes exactly once.'
      zh: '我会把需要获取的依赖都表示为 Resource，包括读取配置后创建的客户端、数据库连接池、专用执行器和 HTTP 服务器。for 推导按依赖顺序获取它们，Resource 则在成功、启动失败或取消后按反向顺序释放。应用只在最外层调用一次 use。事务连接与响应流等短生命周期资源留在更窄的 use 作用域内。我避免使用 allocated，除非有明确所有者保存并调用释放动作。测试会让不同获取步骤失败，并确认此前取得的每项资源都只关闭一次。'
    topics: [backend/scala-backend]
    level: advanced
    section: { en: 'Resource management', zh: '资源管理' }
    frequency: common
    tags: [scala, resource, lifecycle, shutdown]

  - id: scala-blocking-boundary
    question: { en: 'Why is `IO(jdbcCall())` not enough for blocking database access?', zh: '为什么 `IO(jdbcCall())` 不足以处理阻塞式数据库访问？' }
    answer:
      en: 'IO.apply delays the call, but it does not change JDBC into a nonblocking protocol. If the effect runs on compute threads, a slow query occupies capacity that unrelated fibers need. I put unavoidable synchronous calls behind IO.blocking at the repository adapter, then configure the connection pool, statement timeout, and overall request deadline. Cancellation of the fiber does not guarantee that the driver stops immediately or that a committed transaction rolls back. I measure pool wait time, active connections, query latency, and timeout rates before changing limits; there is no context-free pool-size formula.'
      zh: 'IO.apply 会推迟调用，却不会把 JDBC 改造成非阻塞协议。若效果在计算线程上运行，慢查询会占用其他纤程所需的容量。我会在仓库适配器中用 IO.blocking 包住无法避免的同步调用，同时配置连接池、语句超时和请求总截止时间。取消纤程不能保证驱动立刻停止，也不会让已提交事务回滚。调整限制前，我会测量连接池等待时间、活动连接数、查询延迟与超时率；不存在脱离上下文的连接池大小公式。'
    topics: [backend/scala-backend]
    level: intermediate
    section: { en: 'Effects and concurrency', zh: '效果与并发' }
    frequency: common
    tags: [scala, jdbc, blocking-io, capacity]

  - id: scala-http-domain-boundary
    question: { en: 'What belongs in an http4s route, and what belongs in the domain service?', zh: '哪些工作属于 http4s 路由，哪些属于领域服务？' }
    answer:
      en: 'The route owns protocol adaptation: method and path matching, media types, entity decoding, syntactic validation, authenticated principal extraction, and mapping domain results to documented statuses and response DTOs. The service receives validated commands plus a trusted identity, enforces business invariants and authorization, and calls repositories through capabilities that do not mention HTTP. I keep database records and raw exceptions out of public responses. Tests exercise both layers: in-process HttpApp tests cover routing and encoding, ordinary unit tests cover domain branches, and database integration tests prove constraints, transactions, and idempotent writes.'
      zh: '路由负责协议适配，包括方法与路径匹配、媒体类型、实体解码、语法校验、提取已认证主体，以及把领域结果映射为已记录的状态码和响应 DTO。服务接收已校验命令与可信身份，维护业务不变量和授权，再通过不含 HTTP 概念的能力接口调用仓库。我不会让数据库记录与原始异常进入公开响应。测试分层执行：进程内 HttpApp 测试覆盖路由与编码，普通单元测试覆盖领域分支，数据库集成测试则证明约束、事务和幂等写入。'
    topics: [backend/scala-backend]
    level: intermediate
    section: { en: 'HTTP boundaries', zh: 'HTTP 边界' }
    frequency: common
    tags: [scala, http4s, validation, architecture]

  - id: rust-axum-request-lifecycle
    question: { en: 'Trace an HTTP request through an Axum application.', zh: '说明 HTTP 请求在 Axum 应用中的处理路径。' }
    answer:
      en: 'The HTTP server parses the request, then the Router selects a route by method and path. Tower layers wrap that service and may reject, transform, time, or trace the exchange. FromRequestParts extractors read reusable parts such as path, headers, and State; a final FromRequest extractor may consume the body. Any rejection becomes a response before the handler runs. The handler calls domain and I/O services and returns an IntoResponse value. The response then unwinds through the layers. I test this boundary by calling the Router as a Service, including extraction and error cases.'
      zh: 'HTTP 服务端先解析请求，再由 Router 按方法和路径选择路由。Tower 层包装该服务，可以拒绝、转换、计时或追踪交换。FromRequestParts 提取器读取路径、请求头和 State 等可共享部件，最后一个 FromRequest 提取器可以消费正文。提取失败会在处理器运行前直接变成响应。处理器调用领域与 I/O 服务，并返回 IntoResponse 值，响应随后沿 Layer 返回。我会把 Router 当作 Service 调用，覆盖提取失败与错误分支。'
    topics: [backend/rust-backend]
    level: intermediate
    section: { en: 'Web frameworks', zh: 'Web 框架' }
    frequency: common
    tags: [rust, axum, request-lifecycle, extractor]

  - id: rust-async-blocking-boundary
    question: { en: 'How do you keep blocking work from stalling a Tokio HTTP service?', zh: '怎样避免阻塞工作拖住 Tokio HTTP 服务？' }
    answer:
      en: 'I first prefer a genuinely asynchronous client. For a short bounded legacy call, spawn_blocking moves the closure off runtime workers, but I also limit submissions because its pool is not a CPU-work capacity plan. A timeout on the JoinHandle stops waiting; it does not stop a closure that has begun. CPU-heavy batches get a fixed compute pool, semaphore, or external worker. I account for downstream permits such as database connections, acquire capacities in a consistent order, and test saturation. Persistent blocking loops belong on dedicated threads or processes with an explicit shutdown protocol.'
      zh: '我会先选择真正的异步客户端。短而有界的遗留调用可以交给 spawn_blocking，使闭包离开运行时工作线程，但仍要限制提交量，因为其线程池不是 CPU 工作容量方案。JoinHandle 上的超时只会停止等待，不能停止已经开始的闭包。CPU 密集批处理应使用固定计算池、信号量或外部工作者。我还会把数据库连接等下游许可纳入预算，以一致顺序取得容量并测试饱和情况。持续阻塞循环应放到带明确关闭协议的专用线程或进程。'
    topics: [backend/rust-backend]
    level: intermediate
    section: { en: 'Async execution', zh: '异步执行' }
    frequency: common
    tags: [rust, tokio, spawn-blocking, capacity]

  - id: rust-timeout-cancellation
    question: { en: 'Why is a Tokio timeout not equivalent to cancelling or rolling back an operation?', zh: '为什么 Tokio 超时不等于取消或回滚操作？' }
    answer:
      en: 'timeout reports that its inner future did not complete before the deadline and drops that future. Dropping releases owned local values, but it does not retract work already sent to a detached task, blocking closure, kernel, database, or remote service. A write may commit even though the caller sees a timeout, so the outcome is unknown rather than failed. I design writes with transactions, caller-stable idempotency keys, or queryable operation status. For local tasks, I retain handles, send a cancellation signal, and await termination during shutdown instead of assuming that dropping a JoinHandle stops work.'
      zh: 'timeout 表示内部 Future 没有在截止时间前完成，并会丢弃该 Future。丢弃会释放其拥有的局部值，却不会撤回已经交给分离任务、阻塞闭包、内核、数据库或远端服务的工作。写入可能已经提交，而调用方只看到超时，因此结果应视为未知，不是确定失败。我会使用事务、调用方稳定的幂等键或可查询操作状态设计写入。对本地任务，我会保留句柄、发送取消信号，并在关闭时等待结束，而不是假设丢弃 JoinHandle 就能停止工作。'
    topics: [backend/rust-backend]
    level: advanced
    section: { en: 'Failure and cancellation', zh: '失败与取消' }
    frequency: common
    tags: [rust, tokio, timeout, cancellation, idempotency]

  - id: rust-backpressure-ownership
    question: { en: 'How do ownership and backpressure complement each other in a Rust service?', zh: 'Rust 服务中的所有权与背压如何互相补充？' }
    answer:
      en: 'Ownership and Send or Sync constraints prevent classes of invalid memory access; they do not guarantee that a valid allocation fits available memory or that a downstream system can keep up. Backpressure supplies that capacity contract. I bound request bodies, active handlers, database pool acquisition, outbound calls, and background channels separately, then define what happens at capacity: wait within the remaining deadline, reject, coalesce, drop by policy, or persist. Each queue has an owner responsible for draining it during shutdown. Metrics distinguish queue wait, capacity rejection, cancellation, and success so overload cannot masquerade as ordinary latency.'
      zh: '所有权以及 Send、Sync 约束能阻止多类非法内存访问，却不能保证一次合法分配适合可用内存，也不能保证下游跟得上。背压补上容量契约。我会分别限制请求正文、活动处理器、数据库连接取得、外呼和后台通道，再定义满载行为：在剩余截止时间内等待、拒绝、合并、按策略丢弃或持久化。每个队列都要有负责在关闭时排空它的所有者。指标应区分排队等待、容量拒绝、取消与成功，避免过载伪装成普通延迟。'
    topics: [backend/rust-backend]
    level: advanced
    section: { en: 'Capacity and ownership', zh: '容量与所有权' }
    frequency: occasional
    tags: [rust, ownership, backpressure, shutdown]

  - id: restful-resource-model
    question: { en: 'How do you turn a business operation into a REST resource model?', zh: '怎样把一项业务操作转换为 REST 资源模型？' }
    answer:
      en: 'I begin with state that clients can observe and address, not with controller function names. Orders form a collection at /orders, and an order is a member at /orders/{id}. A command with its own lifecycle or audit record can become a subordinate resource, such as POST /orders/{id}/cancellations, instead of /cancelOrderNow. Then I define each operation’s method, preconditions, success and failure statuses, authorization, and representation. This keeps the public model independent from database tables while still making retries, caching, and links understandable through HTTP semantics.'
      zh: '我先找客户端可以观察并寻址的状态，而不是照搬控制器函数名。订单集合位于 /orders，单个订单位于 /orders/{id}。若一项命令有自己的生命周期或审计记录，可以把它建模为从属资源，例如 POST /orders/{id}/cancellations，而不是 /cancelOrderNow。随后定义每项操作的方法、前置条件、成功与失败状态、授权和表示。这样既能让公开模型独立于数据库表，也能通过 HTTP 语义说明重试、缓存和链接。'
    topics: [backend/restful-api-design]
    level: intermediate
    section: { en: 'Resource modeling', zh: '资源建模' }
    frequency: common
    tags: [REST, resource, URI, uniform-interface]

  - id: restful-safe-idempotent
    question: { en: 'What is the difference between a safe HTTP method and an idempotent one?', zh: 'HTTP 安全方法与幂等方法有什么区别？' }
    answer:
      en: 'Safety means the client did not request a state change, which is why GET and HEAD should not charge, delete, or advance a workflow. Incidental logging can still occur. Idempotency means repeating an identical request has the same intended server effect as sending it once. PUT and DELETE can change state while remaining idempotent, and their repeated responses need not match. POST is not idempotent by specification, although an endpoint can add retry safety with a caller-stable idempotency key and atomic deduplication. I test observable effects after duplicate delivery, not just response equality.'
      zh: '安全性表示客户端没有请求改变服务端状态，所以 GET 和 HEAD 不应扣款、删除资源或推进工作流，但附带日志仍可发生。幂等性表示重复发送相同请求时，预期服务端效果与发送一次相同。PUT 与 DELETE 可以改变状态并保持幂等，而且重复响应不必相同。HTTP 规范不保证 POST 幂等，但端点可以通过调用方稳定提供的幂等键和原子去重实现安全重试。我会在重复投递后检查可观察效果，而不只比较响应。'
    topics: [backend/restful-api-design]
    level: intermediate
    section: { en: 'HTTP semantics', zh: 'HTTP 语义' }
    frequency: common
    tags: [safe-method, idempotency, retry]

  - id: restful-lost-update
    question: { en: 'How do ETags prevent a lost update in a RESTful API?', zh: 'ETag 怎样防止 RESTful API 中的丢失更新？' }
    answer:
      en: 'A read returns an ETag that identifies the selected representation. A client changing that resource sends the tag in If-Match, stating that its write is valid only while the representation is still current. The server performs a strong comparison and combines that check with the database update in one atomic operation. If another writer already advanced the resource, zero rows match and the server returns 412 Precondition Failed. Reading and comparing in application code before an unconditional save is insufficient because two writers can pass together. Clients treat tag contents as opaque and reread before merging.'
      zh: '读取响应返回一个标识所选表示的 ETag。客户端修改资源时通过 If-Match 带回该标签，表示只有当前表示仍未变化时才允许写入。服务端执行强比较，并把检查与数据库更新放进同一个原子操作。若其他写入者已经推进资源版本，就没有记录满足条件，服务端返回 412 Precondition Failed。先在应用代码中读取比较、再无条件保存并不够，因为两个写入者可能同时通过。客户端应把标签内容视为不透明值，并在合并前重新读取。'
    topics: [backend/restful-api-design]
    level: advanced
    section: { en: 'Concurrency control', zh: '并发控制' }
    frequency: common
    tags: [etag, if-match, lost-update, optimistic-concurrency]

  - id: restful-idempotency-record
    question: { en: 'What must a server store to make a POST safely retryable with an idempotency key?', zh: '服务端必须保存什么，才能通过幂等键让 POST 可安全重试？' }
    answer:
      en: 'The record needs a key scoped to the authenticated caller or tenant, a canonical fingerprint of the request, operation status, and the final response or stable result reference. The record and business effect must commit atomically; otherwise a crash between them can duplicate the effect. Concurrent duplicates need a defined in-progress response, and the same key with a different fingerprint must fail. A retention policy states when a key expires and what reuse means afterward. Process memory alone is insufficient across restarts and replicas. Tests cover simultaneous delivery, a lost response after commit, and failures at each write boundary.'
      zh: '记录需要包含按已认证调用方或租户限定作用域的键、请求的规范指纹、操作状态，以及最终响应或稳定结果引用。记录与业务效果必须原子提交，否则两者之间的崩溃可能造成重复效果。并发重复请求需要明确的处理中响应，同一个键配上不同指纹时必须失败。保留策略还要说明键何时过期，以及过期后复用的含义。只存进程内存无法跨重启和副本工作。测试应覆盖同时投递、提交后响应丢失，以及每个写入边界上的故障。'
    topics: [backend/restful-api-design]
    level: advanced
    section: { en: 'Retry safety', zh: '重试安全' }
    frequency: common
    tags: [idempotency-key, deduplication, transaction, retry]

  - id: spring-boot-auto-configuration-backoff
    question: { en: 'How does Spring Boot auto-configuration back off, and how do you debug it?', zh: 'Spring Boot 自动配置如何退让，应该怎样调试？' }
    answer:
      en: 'Boot imports a deliberate set of auto-configuration candidates and evaluates conditions over classes, properties, application type, resources, and existing beans. A default guarded by ConditionalOnMissingBean is registered only when its declared search finds no matching bean, so an application can replace that narrow part. I do not guess from annotation names. I run with --debug, read the positive and negative condition outcomes, inspect the actual bean types and names, and compare them with the documented replacement point. I exclude an entire auto-configuration only when none of it belongs in the application.'
      zh: 'Boot 会导入一组明确的自动配置候选项，再根据类、属性、应用类型、资源和现有 Bean 评估条件。由 ConditionalOnMissingBean 保护的默认实现，只有在其声明的搜索范围内找不到匹配 Bean 时才会注册，因此应用可以替换这一小部分。我不会只凭注解名称猜测，而是加 --debug 运行，阅读匹配与不匹配结果，检查实际 Bean 类型和名称，再与文档记录的替换点比较。只有整项自动配置都不适用时，我才会将其排除。'
    topics: [backend/spring-boot]
    level: intermediate
    section: { en: 'Auto-configuration', zh: '自动配置' }
    frequency: common
    tags: [spring-boot, auto-configuration, conditions, backoff]

  - id: spring-boot-configuration-precedence
    question: { en: 'How do you make Spring Boot configuration precedence safe and diagnosable?', zh: '怎样让 Spring Boot 配置优先级既安全又便于诊断？' }
    answer:
      en: 'I group related settings in ConfigurationProperties types, use domain types such as Duration, and validate required values and ranges during startup. Packaged defaults are safe and contain no secrets. Deployment files and environment variables carry environment choices, while command-line overrides are deliberate and short-lived because later sources can replace earlier ones. I test at least the packaged, environment, and command-line cases and log only selected effective non-secret values. Profiles select configuration; they are not a secret store or proof that the process is running in the intended environment.'
      zh: '我会用 ConfigurationProperties 类型组织相关设置，采用 Duration 等领域类型，并在启动时校验必需值和范围。打包默认值必须安全且不含秘密；部署配置文件和环境变量承载环境选择，命令行覆盖因为优先级更高，只用于明确且短期的操作。我至少测试打包值、环境变量和命令行三种情况，并且只记录选定的有效非敏感值。Profile 用于选择配置，既不是秘密存储，也不能证明进程确实运行在预期环境。'
    topics: [backend/spring-boot]
    level: intermediate
    section: { en: 'Configuration', zh: '配置' }
    frequency: common
    tags: [spring-boot, configuration-properties, precedence, validation]

  - id: spring-boot-test-boundaries
    question: { en: 'How do you choose between a Spring Boot test slice, MockMvc, and a random-port test?', zh: '如何在 Spring Boot 测试切片、MockMvc 和随机端口测试之间选择？' }
    answer:
      en: 'I start from the boundary that can reveal the target failure. A web slice is fast and checks controller mapping, binding, validation, and conversion while replacing omitted collaborators deliberately. SpringBootTest with MockMvc proves that the full application context wires and handles a mocked servlet request, but it does not open a socket. RANDOM_PORT adds the embedded server and a real HTTP client path for container behavior. I retain at least one production-shaped context test, then use narrower tests for most cases. Proxy, TLS, packaging, authorization, and stored side effects still need explicit evidence at their own boundaries.'
      zh: '我先判断哪一层能暴露目标故障。Web 切片运行较快，可以检查控制器映射、绑定、校验和转换，同时有意替换被省略的协作者。带 MockMvc 的 SpringBootTest 能证明完整应用上下文完成装配，并处理模拟 Servlet 请求，但不会打开套接字。RANDOM_PORT 会加入内嵌服务器和真实 HTTP 客户端路径，用于检查容器行为。我至少保留一项接近生产配置的上下文测试，大多数情况则使用更窄的测试。代理、TLS、打包、授权和存储副作用仍需在各自边界提供明确证据。'
    topics: [backend/spring-boot]
    level: intermediate
    section: { en: 'Testing', zh: '测试' }
    frequency: common
    tags: [spring-boot, test-slice, mockmvc, random-port]

  - id: spring-boot-bean-scope-safety
    question: { en: 'What does singleton scope mean in Spring Boot, and what concurrency mistake follows from misunderstanding it?', zh: 'Spring Boot 中的单例作用域是什么意思，误解它会导致什么并发错误？' }
    answer:
      en: 'Singleton scope means one bean instance per application context, not one object across every JVM, context, or test. In a web application, that instance is commonly reached by many request threads, so the scope does not make mutable fields thread-safe. I keep singleton services stateless or restrict their state to immutable configuration and thread-safe collaborators. Current user, tenant, request payload, and per-request accumulators belong in method parameters or an explicit narrower scope. Constructor injection exposes the shared collaborators, while load tests and concurrency tests verify compound operations that ordinary context startup cannot prove.'
      zh: '单例作用域表示每个应用上下文有一个 Bean 实例，并不是每个 JVM、上下文或测试共同拥有一个对象。在 Web 应用中，多个请求线程通常会访问同一实例，因此该作用域不会自动让可变字段具备线程安全性。我会让单例服务保持无状态，或只保存不可变配置与线程安全协作者。当前用户、租户、请求负载和每次请求的累加器应放在方法参数或明确的更窄作用域中。构造器注入能公开共享协作者，负载测试和并发测试则验证普通上下文启动无法证明的复合操作。'
    topics: [backend/spring-boot]
    level: advanced
    section: { en: 'Bean lifecycle', zh: 'Bean 生命周期' }
    frequency: occasional
    tags: [spring-boot, bean-scope, singleton, concurrency]

  - id: rails-request-lifecycle
    question: { en: 'Trace a Rails HTTP request from the server to the response.', zh: '说明一个 Rails HTTP 请求从服务器到响应的处理过程。' }
    answer:
      en: 'A Rack-compatible server builds the request environment and calls the Rails application. The request moves inward through middleware, where components may establish sessions, authentication context, logging, or protocol policy. The router matches method and path, extracts route parameters, and dispatches a controller action. The action parses permitted input, invokes application and persistence logic, then renders a view, JSON body, redirect, or empty response. That response unwinds through middleware in reverse order before the server sends it. I also mention that route and middleware order are behavioral, and that direct controller tests bypass much of this path.'
      zh: 'Rack 兼容服务器构造请求环境并调用 Rails 应用。请求按顺序进入中间件，各组件可以建立会话、认证上下文、日志或协议策略。路由器匹配 HTTP 方法与路径，提取路由参数，再分派到控制器动作。动作解析允许的输入，调用应用与持久化逻辑，然后渲染视图、JSON、重定向或空响应。响应按相反顺序经过中间件，最后由服务器发送。我还会说明路由和中间件顺序具有行为语义，而直接控制器测试会绕过这条路径的大部分环节。'
    topics: [backend/ruby-rails]
    level: intermediate
    section: { en: 'Request handling', zh: '请求处理' }
    frequency: common
    tags: [rails, rack, routing, middleware]

  - id: rails-write-boundaries
    question: { en: 'How should strong parameters, authorization, model validation, and database constraints divide responsibility?', zh: 'Rails 写入接口中的强参数、授权、模型校验与数据库约束应如何分工？' }
    answer:
      en: 'Strong parameters allowlist transport fields before mass assignment; they do not decide whether the caller may act on a record. A policy or ownership-scoped query supplies object-level authorization from authenticated identity. Model validations provide readable application errors and guard ordinary model writes, while domain code enforces state transitions and derives server-owned values. Database nullability, foreign keys, unique indexes, and check constraints protect durable invariants for every writer and close concurrency races. I test malformed fields, a second tenant, invalid transitions, forbidden extra attributes, and constraint conflicts, then assert both the HTTP contract and unchanged records on failure.'
      zh: '强参数在批量赋值前筛选传输字段，但不决定调用方能否操作某条记录。策略或限定所有权的查询使用已认证身份提供对象级授权。模型校验为普通模型写入提供易读错误，领域代码则维护状态转换并推导服务端字段。数据库的非空、外键、唯一索引和检查约束对所有写入者保护持久不变量，并关闭并发竞态。测试应覆盖畸形字段、第二个租户、非法状态转换、禁止的额外属性与约束冲突，同时断言 HTTP 契约以及失败后记录没有变化。'
    topics: [backend/ruby-rails]
    level: intermediate
    section: { en: 'Data integrity', zh: '数据完整性' }
    frequency: common
    tags: [rails, strong-parameters, authorization, constraints]

  - id: rails-n-plus-one-proof
    question: { en: 'How do you diagnose and prevent an Active Record N+1 query?', zh: '怎样诊断并防止 Active Record 的 N+1 查询？' }
    answer:
      en: 'I reproduce the complete access path, including the view or serializer, because association reads often happen after the controller query. With a fixed page size and relationship shape, I capture SQL count and identify the repeating association. Then I choose includes, preload, or eager_load based on whether separate queries or a join fit the conditions and result shape, including nested relationships where needed. I rerun the same path and keep a bounded query-count regression test. Pagination and measurement still matter: broad eager loading can replace too many queries with duplicated rows, excessive object allocation, and high memory use.'
      zh: '我会复现包含视图或序列化器的完整访问路径，因为关联读取常发生在控制器查询之后。固定页大小与关联形状后，我记录 SQL 数量并找到重复访问的关联。随后根据条件和结果形状，在 includes、preload 与 eager_load 之间选择独立查询或连接，并按需覆盖嵌套关联。我会重新执行同一路径，保留有上限的查询数量回归测试。分页与测量仍不可缺少，因为过宽的预加载可能只是把过多查询换成重复行、过多对象分配和高内存占用。'
    topics: [backend/ruby-rails]
    level: intermediate
    section: { en: 'ORM and data access', zh: 'ORM 与数据访问' }
    frequency: common
    tags: [rails, active-record, n-plus-one, eager-loading]

  - id: rails-safe-migration-rollout
    question: { en: 'How would you roll out a breaking Rails database change without stopping the application?', zh: '怎样在不停机的情况下发布破坏性的 Rails 数据库变更？' }
    answer:
      en: 'I use an expand-and-contract sequence. First add the new table or nullable column in a way the old application tolerates, then deploy code that can read both shapes and write the data needed by both versions. A bounded, restartable backfill moves existing rows while metrics track progress and constraint violations. After verification, switch reads to the new shape, add constraints with the database-specific low-lock procedure, and only later remove old columns or code. I test exact lock behavior on the target database, keep old and new processes compatible during rolling deployment, and prefer a forward fix when rollback cannot restore deleted data.'
      zh: '我会采用展开与收缩流程。先以旧应用能够容忍的方式添加新表或可空列，再发布能够读取两种结构、并写入两个版本所需数据的代码。使用有界且可重启的回填迁移现有记录，同时通过指标跟踪进度与约束违规。验证后把读取切到新结构，按目标数据库的低锁流程增加约束，最后才删除旧列或旧代码。我会在目标数据库上测试准确锁行为，保证滚动发布期间新旧进程兼容；若回滚无法恢复已删除数据，则优先准备前向修复方案。'
    topics: [backend/ruby-rails]
    level: advanced
    section: { en: 'Database delivery', zh: '数据库发布' }
    frequency: occasional
    tags: [rails, migration, expand-contract, deployment]

  - id: wsgi-request-lifecycle
    question: { en: 'Trace one HTTP request through the WSGI contract.', zh: '说明一个 HTTP 请求经过 WSGI 契约的过程。' }
    answer:
      en: 'The server parses HTTP and builds an environ mapping with CGI request fields, the wsgi.input stream, and execution flags. It calls the application with environ and start_response. The application or middleware validates input, chooses a status and headers, calls start_response before the first body bytes, and returns an iterable of byte chunks. The server consumes those chunks in order and sends them under its HTTP connection policy. Whether iteration finishes or aborts, it calls close on the iterable when available. Socket handling and worker concurrency remain server responsibilities.'
      zh: '服务器解析 HTTP，并构造 environ 映射，其中包含 CGI 请求字段、wsgi.input 流和执行标志。它以 environ 与 start_response 调用应用。应用或中间件校验输入，选择状态与响应头，在第一个正文字节出现前调用 start_response，再返回产出字节块的可迭代对象。服务器按顺序消费这些块，并根据自己的 HTTP 连接策略发送。无论迭代完成还是中止，只要结果提供 close，服务器就要调用它。套接字处理与工作进程并发仍由服务器负责。'
    topics: [backend/wsgi]
    level: intermediate
    section: { en: 'HTTP server interfaces', zh: 'HTTP 服务器接口' }
    frequency: common
    tags: [wsgi, request-lifecycle, http]

  - id: wsgi-sync-concurrency
    question: { en: 'Why does synchronous WSGI not imply a single-threaded server?', zh: '为什么同步 WSGI 不代表服务器只能使用单线程？' }
    answer:
      en: 'Synchronous describes one application invocation: it runs in the current execution context and cannot use ASGI-style receive and send events to suspend the protocol call. The server still chooses its concurrency architecture. It may run several processes, several threads per process, or another strategy, and reports relevant properties through wsgi.multithread and wsgi.multiprocess. Those flags do not add locks. I therefore avoid correctness that depends on process globals, scope connection pools per process, synchronize shared in-process state, and put durable cross-request state in storage with an explicit consistency model.'
      zh: '同步描述的是一次应用调用：它在当前执行上下文中运行，不能通过 ASGI 风格的 receive 与 send 事件挂起协议调用。服务器仍可自行选择并发架构，例如多个进程、每个进程多个线程或其他策略，并通过 wsgi.multithread 与 wsgi.multiprocess 报告相关属性。这些标志不会添加锁。因此我不会让正确性依赖进程全局变量；连接池按进程划分，进程内共享状态需要同步，持久的跨请求状态则放入具有明确一致性模型的存储。'
    topics: [backend/wsgi]
    level: intermediate
    section: { en: 'Concurrency models', zh: '并发模型' }
    frequency: common
    tags: [wsgi, concurrency, workers]

  - id: wsgi-transparent-middleware
    question: { en: 'What must transparent WSGI middleware preserve?', zh: '透明的 WSGI 中间件必须保留哪些行为？' }
    answer:
      en: 'It preserves the application callable shape, forwards environ fields it does not intentionally change, and wraps start_response with all three arguments, including exc_info. It keeps response header multiplicity rather than flattening headers such as Set-Cookie into a dictionary. If the body is unchanged, it can return the downstream iterable directly. If it wraps iteration, it yields byte chunks in order, avoids full-body buffering, propagates iteration failures, and closes the downstream iterable on completion or abort. Request-specific status belongs in local closure state, not a middleware instance field shared by concurrent requests.'
      zh: '它保留应用可调用对象的形状，转发没有明确修改的 environ 字段，并以包括 exc_info 在内的三个参数包装 start_response。它还要保留响应头的重复项，不能把 Set-Cookie 等响应头粗暴压成字典。正文不变时可以直接返回下游可迭代对象；包装迭代时，则应按顺序产出字节块，避免缓冲完整正文，传递迭代异常，并在完成或中止时关闭下游结果。请求专属状态应放在局部闭包中，不能放进并发请求共享的中间件实例字段。'
    topics: [backend/wsgi]
    level: advanced
    section: { en: 'Middleware', zh: '中间件' }
    frequency: occasional
    tags: [wsgi, middleware, streaming]

  - id: wsgi-response-commit
    question: { en: 'How should a WSGI application handle an exception after calling start_response?', zh: 'WSGI 应用调用 start_response 后发生异常，应怎样处理？' }
    answer:
      en: 'Calling start_response does not always mean headers are already on the wire, because the server may defer transmission until body iteration. While handling an exception, the application may call start_response again with the current exc_info. If headers remain unsent, the server can replace them; if transmission began, it must re-raise the original exception. No mechanism can retract body bytes already delivered. Error middleware therefore tracks whether a response is committed, closes iterables and other resources, logs the failure, and only constructs a fresh error response before commitment. Tests need failures both before and during iteration.'
      zh: '调用 start_response 不一定表示响应头已经上网，因为服务器可能推迟到正文迭代时才发送。处理异常时，应用可以带当前 exc_info 再次调用 start_response。响应头尚未发送时，服务器可以替换它们；发送已经开始时，服务器必须重新抛出原异常。任何机制都不能撤回已经交付的正文字节。因此错误中间件要跟踪响应是否提交，关闭可迭代对象和其他资源，记录失败，并且只在提交前构造新错误响应。测试应分别覆盖迭代前和迭代中的失败。'
    topics: [backend/wsgi]
    level: advanced
    section: { en: 'Failure handling', zh: '失败处理' }
    frequency: occasional
    tags: [wsgi, start-response, error-handling]

  - id: trpc-types-versus-runtime
    question: { en: 'What does tRPC end-to-end type safety guarantee, and what does it not guarantee?', zh: 'tRPC 的端到端类型安全保证什么，又不保证什么？' }
    answer:
      en: 'It lets a TypeScript client compiled against AppRouter infer valid procedure paths plus each procedure input and successful output. That catches many contract changes without a generated SDK. It does not put TypeScript types on the wire or validate arbitrary requests after compilation. I still attach a runtime input parser, map deliberate public outputs, authenticate the request, authorize the selected object, and enforce database invariants. I also test the actual HTTP adapter because serialization, headers, network loss, and already-deployed old clients sit outside the shared type graph.'
      zh: '它让根据 AppRouter 编译的 TypeScript 客户端推断合法 procedure 路径，以及每个 procedure 的输入与成功输出，无需生成 SDK 就能发现许多契约变更。但 TypeScript 类型不会进入传输数据，也无法在编译后验证任意请求。我仍会添加运行时输入解析器、映射有意设计的公开输出、认证请求、对目标对象授权，并强制执行数据库不变量。还要测试真实 HTTP adapter，因为序列化、header、网络丢失和已部署旧客户端都不在共享类型图内。'
    topics: [backend/trpc]
    level: intermediate
    section: { en: 'API contracts', zh: 'API 契约' }
    frequency: common
    tags: [trpc, type-safety, validation, compatibility]

  - id: trpc-context-authorization
    question: { en: 'How should tRPC context and middleware divide authentication and authorization work?', zh: 'tRPC 上下文与 middleware 应怎样划分认证和授权工作？' }
    answer:
      en: 'The HTTP adapter creates request-scoped context from trusted request evidence and stores the authenticated principal plus service interfaces, not caller-asserted ownership. Authentication middleware rejects an absent principal and can narrow its context type for downstream procedures. Authorization still evaluates the requested action and resource. I usually scope the database lookup or conditional update by the principal tenant or owner ID, so the policy remains attached to data access. Role checks can form another base procedure, but its name proves nothing unless every sensitive route derives from it and server-owned fields stay out of input spreads.'
      zh: 'HTTP adapter 根据可信请求证据创建请求级上下文，保存已认证主体与服务接口，而不是调用方声称的所有权。认证 middleware 拒绝不存在的主体，并可为后续 procedure 收窄上下文类型。授权仍需判断请求的动作与资源。我通常用主体的租户或所有者 ID 限定数据库查询或条件更新，让策略始终附着在数据访问上。角色检查可以形成另一种基础 procedure，但只有所有敏感路由都从它派生，而且服务端字段不进入输入展开对象时，这个名称才有意义。'
    topics: [backend/trpc]
    level: intermediate
    section: { en: 'Security', zh: '安全' }
    frequency: common
    tags: [trpc, context, middleware, authorization]

  - id: trpc-versus-public-contract
    question: { en: 'When would you choose tRPC instead of a REST, OpenAPI, or GraphQL contract?', zh: '什么情况下应选择 tRPC，而不是 REST、OpenAPI 或 GraphQL 契约？' }
    answer:
      en: 'I choose tRPC when one team owns a TypeScript client and server, shares the router type at build time, and can coordinate releases. That makes procedure refactors visible quickly and removes a separate generated client workflow. I prefer a language-neutral contract when mobile applications, partners, several service languages, or independently released consumers need discovery and long compatibility windows. The choice is not a claim that one protocol is universally faster. I compare consumer ownership, deployment cadence, caching and transport requirements, documentation needs, and whether the contract must be usable without importing TypeScript types.'
      zh: '当同一团队拥有 TypeScript 客户端与服务端、能在构建时共享 router 类型，并且可以协调发布时，我会选择 tRPC。这样能快速发现 procedure 重构影响，也省去单独生成客户端的流程。如果移动应用、合作伙伴、多种服务语言或独立发布的调用方需要接口发现和较长兼容窗口，我更倾向语言无关契约。这不是在声称某种协议永远更快；我会比较调用方所有权、部署节奏、缓存与传输要求、文档需求，以及契约是否必须在不导入 TypeScript 类型的情况下使用。'
    topics: [backend/trpc]
    level: intermediate
    section: { en: 'Architecture', zh: '架构' }
    frequency: occasional
    tags: [trpc, rest, openapi, graphql]

  - id: trpc-caller-versus-http
    question: { en: 'What can a tRPC server-side caller test, and what requires the real HTTP path?', zh: 'tRPC 服务端调用器能测试什么，哪些内容必须通过真实 HTTP 路径测试？' }
    answer:
      en: 'A server-side caller executes the router procedure pipeline in process, so it is useful for input parsing, middleware, authorization, resolver behavior, output validation, and stable tRPC errors. The caller supplies context directly, however, and bypasses the adapter and network. It cannot prove header authentication, body limits, link configuration, serialization, proxy behavior, batch envelopes, or what happens when a response is lost after commit. I keep focused caller tests for procedure logic and add adapter-level tests for raw malformed requests, transformer symmetry, batched partial failure, request context creation, and retry behavior of writes.'
      zh: '服务端调用器会在进程内执行 router procedure 管线，因此适合测试输入解析、middleware、授权、resolver 行为、输出验证与稳定 tRPC 错误。但调用器直接提供上下文，并绕过 adapter 与网络，无法证明 header 认证、请求体限制、link 配置、序列化、proxy 行为、批次封装，或提交后响应丢失的结果。我会用调用器测试聚焦的 procedure 逻辑，再用 adapter 级测试覆盖原始畸形请求、transformer 对称性、批处理部分失败、请求上下文创建和写入重试行为。'
    topics: [backend/trpc]
    level: advanced
    section: { en: 'Testing and transport', zh: '测试与传输' }
    frequency: occasional
    tags: [trpc, testing, server-side-caller, http]

  - id: urlsession-three-failure-layers
    question: { en: 'Why should a URLSession client separate transport, HTTP, and decoding failures?', zh: '为什么 URLSession 客户端应区分传输、HTTP 与解码失败？' }
    answer:
      en: 'A thrown URL loading error means the client lacks a usable response, while a returned HTTP response can still carry 404, 429, or 500. Decoding starts only after the endpoint accepts the status and media type; its failures describe a representation mismatch rather than a network outage. Keeping those layers separate gives callers useful policy: reauthenticate on the right 401, honor Retry-After for an eligible request, reject a permanent 4xx, or report a coding path for malformed JSON. I wrap errors for the application but retain the status, headers, and underlying cause for diagnostics.'
      zh: 'URL 加载错误被抛出，表示客户端没有可用响应；正常返回的 HTTP 响应仍可能带有 404、429 或 500。只有端点接受状态与媒体类型后才开始解码，而解码失败说明表示不匹配，不是网络中断。保留这些层次后，调用方才能执行准确策略：对合适的 401 重新认证，为允许重试的请求遵守 Retry-After，拒绝永久性 4xx，或报告畸形 JSON 的 coding path。我会为应用包装错误，但保留状态、相关响应头和底层原因供诊断。'
    topics: [backend/urlsession]
    level: intermediate
    section: { en: 'HTTP clients', zh: 'HTTP 客户端' }
    frequency: common
    tags: [URLSession, http-status, decoding, errors]

  - id: urlsession-configuration-lifetime
    question: { en: 'How do you choose and own a URLSession configuration?', zh: '怎样选择并管理 URLSession 配置？' }
    answer:
      en: 'I use the shared session only for simple calls with no custom policy. A default session fits reusable interactive traffic, an ephemeral session avoids persistent cache, cookie, and credential storage, and a background session fits long file uploads or downloads that must continue while the app is suspended. I finish configuration before initialization because URLSession copies it. Sessions are grouped by genuinely different policy, not created per request. If a custom session has a delegate, I name its owner and shutdown path because the session retains that delegate until finishTasksAndInvalidate or invalidateAndCancel breaks the relationship.'
      zh: '只有没有自定义策略的简单调用，我才使用共享会话。默认会话适合可复用的交互流量；临时会话不会持久保存缓存、Cookie 和凭证；后台会话适合应用挂起后仍需继续的长时间文件上传或下载。我会在初始化前完成配置，因为 URLSession 会复制它。会话按真正不同的策略分组，而不是每个请求创建一个。若自定义会话带有委托，我会明确所有者和关闭路径，因为会话会保留委托，直到 finishTasksAndInvalidate 或 invalidateAndCancel 打破该关系。'
    topics: [backend/urlsession]
    level: intermediate
    section: { en: 'Lifecycle and configuration', zh: '生命周期与配置' }
    frequency: common
    tags: [URLSession, configuration, delegate, lifecycle]

  - id: urlsession-safe-retry
    question: { en: 'What makes an automatic URLSession retry safe?', zh: '怎样保证 URLSession 自动重试是安全的？' }
    answer:
      en: 'The retry policy starts with the endpoint contract, not a blanket list of errors. It checks whether the operation can be replayed, whether the body and credentials can be reproduced, which status or transport phase failed, how many attempts and how much deadline remain, and whether Retry-After applies. Reads usually admit more retries. A write needs a caller-stable idempotency key and atomic server deduplication, because a timeout cannot prove that the first attempt did not commit. I also prevent nested layers from multiplying attempts and inject timing in tests so backoff is deterministic.'
      zh: '重试策略应从端点契约出发，而不是使用覆盖所有错误的固定清单。它要检查操作能否重放、正文与凭证能否重建、失败发生在哪个状态或传输阶段、还剩多少次数与总截止时间，以及是否应遵守 Retry-After。读取通常允许更多重试。写入需要调用方稳定提供的幂等键和服务端原子去重，因为超时不能证明第一次尝试没有提交。我还会避免多层重试相乘，并在测试中注入计时器，让退避过程保持确定。'
    topics: [backend/urlsession]
    level: advanced
    section: { en: 'Retries and idempotency', zh: '重试与幂等性' }
    frequency: common
    tags: [URLSession, retry, idempotency, cancellation]

  - id: urlsession-deterministic-testing
    question: { en: 'How do you test a URLSession client without relying on a live API?', zh: '怎样在不依赖真实 API 的情况下测试 URLSession 客户端？' }
    answer:
      en: 'I inject a session whose configuration installs a controlled URLProtocol subclass, or inject a smaller transport protocol. The test double captures the URLRequest and returns chosen bytes, headers, status, delay, or error through the normal URLSession path. Tests assert method, encoded query items, redacted authentication behavior, accepted statuses, decoding categories, cancellation, and retry count. A hanging stub is necessary to prove cancellation; an immediate response cannot. I keep a small set of real integration tests for TLS and server-contract drift, while unit tests remain deterministic and never depend on public placeholder services.'
      zh: '我会注入一个在配置中安装受控 URLProtocol 子类的会话，或注入更小的传输协议。测试替身捕获 URLRequest，并通过正常 URLSession 路径返回指定字节、响应头、状态、延迟或错误。测试应断言方法、编码后的查询项、认证信息脱敏、允许状态、解码类别、取消和重试次数。验证取消必须使用真正悬挂的存根，立即响应无法证明这一点。我还会保留少量真实集成测试来检查 TLS 和服务端契约漂移，而单元测试保持确定，绝不依赖公共占位服务。'
    topics: [backend/urlsession]
    level: advanced
    section: { en: 'Testing', zh: '测试' }
    frequency: occasional
    tags: [URLSession, URLProtocol, testing, cancellation]

  - id: wsgi-asgi-call-contracts
    question: { en: 'Compare the WSGI and ASGI application call contracts.', zh: '比较 WSGI 与 ASGI 的应用调用契约。' }
    answer:
      en: 'WSGI calls a synchronous application once per HTTP request with an environ dictionary and start_response callback. The application submits a status plus string header pairs and returns an iterable of response bytes; the server closes that iterable when possible. ASGI calls one async application per protocol-defined connection with scope, receive, and send. Scope holds connection metadata, while request bodies and other changes arrive as typed events. The application sends ordered response events and can represent HTTP, WebSocket, and lifespan. Neither interface dictates worker count, process topology, proxy support, or application performance.'
      zh: 'WSGI 为每个 HTTP 请求调用一次同步应用，传入 environ 字典与 start_response 回调。应用提交状态和字符串响应头二元组，再返回产生响应字节的可迭代对象；若对象支持 close，服务器负责关闭。ASGI 按子协议定义的连接调用一次异步应用，传入 scope、receive 与 send。scope 保存连接元数据，请求体和后续变化则以带类型的事件到达。应用按顺序发送响应事件，并可表示 HTTP、WebSocket 与 lifespan。两种接口都不规定 worker 数量、进程拓扑、代理能力或应用性能。'
    topics: [backend/wsgi-asgi]
    level: intermediate
    section: { en: 'Python web interfaces', zh: 'Python Web 接口' }
    frequency: common
    tags: [wsgi, asgi, callable, protocol]

  - id: wsgi-asgi-blocking-boundary
    question: { en: 'Why can an ASGI application still block, and how do you review that boundary?', zh: 'ASGI 应用为什么仍可能阻塞，应该怎样审查这条边界？' }
    answer:
      en: 'An async function yields control only when it awaits work that can suspend. A synchronous ORM query, file operation, time.sleep, or blocking HTTP client still occupies the event-loop thread when called directly. I trace every I/O call reachable from an async handler and classify it as native async, intentionally moved to a bounded thread pool, or still blocking. For retained synchronous I/O, I use the framework adapter or asyncio.to_thread where appropriate, then test pool saturation, timeouts, cancellation, and shutdown. CPU-heavy work usually needs a process or job system rather than more event-loop tasks.'
      zh: '异步函数只有在等待能够挂起的工作时才会让出执行权。同步 ORM 查询、文件操作、time.sleep 或阻塞式 HTTP 客户端若被直接调用，仍会占用事件循环线程。我会追踪异步处理器可达的每个 I/O 调用，判断它是原生异步、被有意移入有界线程池，还是仍在阻塞。暂时保留同步 I/O 时，应使用框架适配器或合适的 asyncio.to_thread，再测试线程池耗尽、超时、取消和关闭。CPU 密集工作通常应进入进程或任务系统，而不是继续增加事件循环任务。'
    topics: [backend/wsgi-asgi]
    level: intermediate
    section: { en: 'Async execution', zh: '异步执行' }
    frequency: common
    tags: [asgi, event-loop, blocking-io, thread-pool]

  - id: wsgi-asgi-stream-correctness
    question: { en: 'What must middleware preserve when streaming through WSGI or ASGI?', zh: '中间件转发 WSGI 或 ASGI 流时必须保留什么？' }
    answer:
      en: 'For WSGI, middleware preserves the start_response contract, yields only bytes, does not invent a stale Content-Length after transformation, and forwards close from the wrapped iterable. For ASGI HTTP, it preserves event order, every request and response body chunk, the final more_body value, and repeated byte-pair headers such as Set-Cookie. It also passes WebSocket and lifespan scopes through unless it implements them deliberately. I test normal completion, fragmented input, empty bodies, application failure, client disconnect, and cancellation. Disconnect can appear through receive or as an OSError from send, so cleanup must tolerate either order.'
      zh: '对 WSGI，中间件要保持 start_response 契约，只产生字节；转换正文后不能保留错误的 Content-Length，还要转发被包装迭代器的 close。对 ASGI HTTP，它要保持事件顺序、每个请求与响应分片、最终 more_body 值，以及 Set-Cookie 等重复字节响应头。除非明确实现，否则还要透传 WebSocket 与 lifespan scope。我会测试正常完成、分片输入、空正文、应用异常、客户端断开和取消。断开既可能通过 receive 到达，也可能先表现为 send 抛出 OSError，因此清理必须容忍两种顺序。'
    topics: [backend/wsgi-asgi]
    level: advanced
    section: { en: 'Streaming and middleware', zh: '流式传输与中间件' }
    frequency: occasional
    tags: [wsgi, asgi, middleware, streaming, disconnect]

  - id: wsgi-asgi-lifespan-adapter
    question: { en: 'How do lifespan and a WSGI-to-ASGI adapter affect resource ownership?', zh: 'lifespan 与 WSGI-to-ASGI 适配器会怎样影响资源所有权？' }
    answer:
      en: 'ASGI lifespan initializes and closes resources in the event loop that handles requests. It runs once per event loop, so a multiprocess deployment normally creates one connection pool per worker; total downstream connections must include every pool. Supported lifespan state is shallow-copied into request scopes, leaving the resource object shared within that loop. A WSGI-to-ASGI adapter instead runs the synchronous WSGI callable in a thread pool and maps the common HTTP subset. It does not add WebSockets or native async dependencies. I verify thread-sensitive framework rules, context propagation, cancellation behavior, pool capacity, startup failure, and per-worker cleanup.'
      zh: 'ASGI lifespan 在处理请求的事件循环中初始化并关闭资源。它按事件循环执行一次，因此多进程部署通常会为每个 worker 创建一个连接池；计算下游总连接数时必须包含所有池。服务器支持 lifespan state 时，会把命名空间浅复制给请求 scope，而资源对象仍在同一循环内共享。WSGI-to-ASGI 适配器则在线程池运行同步 WSGI callable，并映射两者共有的 HTTP 子集；它不会添加 WebSocket 或原生异步依赖。我会验证框架的线程敏感规则、上下文传播、取消行为、线程池容量、启动失败和每 worker 清理。'
    topics: [backend/wsgi-asgi]
    level: advanced
    section: { en: 'Compatibility and lifecycle', zh: '兼容性与生命周期' }
    frequency: occasional
    tags: [asgi, lifespan, wsgi, adapter, resource-ownership]
