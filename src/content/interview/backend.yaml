track: backend
items:
  - id: jwt-signature-versus-validation
    question: { en: 'Why is a valid JWT signature insufficient for authentication?', zh: '为什么 JWT 签名有效仍不足以完成身份认证？' }
    answer: { en: 'A signature protects bytes under a key; the verifier must also bind that key to a trusted issuer and validate audience, token type, time claims, required claim types, and application status before creating an identity.', zh: '签名只说明字节受到某把密钥保护；验证器还要把密钥绑定到可信签发者，并检查受众、令牌类型、时间声明、必需声明类型和应用状态，才能建立身份。' }
    topics: [backend/jwt-authentication]
    level: intermediate
    tags: [jwt, claim-validation]

  - id: jwt-hmac-versus-asymmetric
    question: { en: 'What trust-boundary difference separates HS256 from an asymmetric JWT signature?', zh: 'HS256 与非对称 JWT 签名在信任边界上有什么区别？' }
    answer: { en: 'Every HS256 verifier holds the shared secret and can therefore issue tokens. With an asymmetric algorithm, the issuer can retain the private key while distributing public verification keys, so verifiers need not gain signing power.', zh: '每个 HS256 验证者都持有共享秘密，因此也能签发令牌。非对称算法让签发者保留私钥，只分发验证公钥，所以验证者不必获得签发能力。' }
    topics: [backend/jwt-authentication]
    level: intermediate
    tags: [jwt, key-management]

  - id: refresh-token-replay
    question: { en: 'How does refresh token rotation detect replay, and what should happen after detection?', zh: '刷新令牌轮换如何检测重放，发现重放后应怎样处理？' }
    answer: { en: 'Each refresh consumes the old value and issues one successor while retaining their family relationship. Reuse of an inactive value signals possible theft; revoke the active family and require a new authorization because the server cannot identify which caller is legitimate.', zh: '每次刷新都会消费旧值、签发唯一后继值，并保留令牌族关系。已失效值再次出现说明可能被窃取；服务器无法判断哪一方合法，因此应撤销活动令牌族并要求重新授权。' }
    topics: [backend/jwt-authentication]
    level: advanced
    tags: [refresh-token, replay-detection]

  - id: api-resource-contract
    question: { en: 'What belongs in an HTTP API operation contract besides its URL?', zh: '除了 URL，HTTP API 的操作契约还应包含什么？' }
    answer:
      en: 'The contract names the method, target resource, accepted headers and media types, parameter constraints, authentication and resource-level authorization rules, success representation, failure statuses, and relevant response headers. It also states behavior across time: whether a request is safe or idempotent, how a client retries an unknown result, how concurrent writes are detected, and how pagination remains ordered. OpenAPI can describe much of the message shape, but transaction boundaries and domain invariants still need prose and scenario tests. I review the complete observable HTTP exchange, not only the JSON schema.'
      zh: '契约要说明方法、目标资源、接受的响应头与媒体类型、参数约束、认证和资源级授权规则、成功表示、失败状态码以及相关响应头。它还要定义跨时间行为：请求是否安全或幂等，客户端如何重试结果未知的操作，怎样检测并发写入，以及分页如何保持顺序。OpenAPI 能描述大部分消息形状，但事务边界与领域不变量仍需要文字和场景测试。我会审查完整且可观察的 HTTP 交换，而不只看 JSON 模式。'
    topics: [backend/api-design]
    level: intermediate
    section: { en: 'HTTP API contracts', zh: 'HTTP API 契约' }
    frequency: common
    tags: [api-design, contract, http]

  - id: api-safe-versus-idempotent
    question: { en: 'How do safe and idempotent HTTP methods differ, and what does that mean for retries?', zh: 'HTTP 的安全方法与幂等方法有何区别，这对重试意味着什么？' }
    answer:
      en: 'A safe method has essentially read-only requested semantics, so the client does not ask for a state change. An idempotent method may change state, but repeating the identical request has the same intended effect as sending it once. GET is both; PUT and DELETE are idempotent but unsafe. Incidental logging does not change those classifications, and repeated responses need not be identical. Idempotency supports retry after a connection failure, but the client must preserve the same request. Retrying POST needs an application protocol, typically a caller-stable key backed by atomic deduplication and a stored result.'
      zh: '安全方法的请求语义基本只读，因此客户端没有要求改变状态。幂等方法可以修改状态，但重复发送相同请求时，预期效果与发送一次相同。GET 同时具备两种性质；PUT 和 DELETE 幂等但不安全。附带日志不会改变分类，多次响应也不必完全相同。幂等性支持在连接失败后重试，但客户端必须保持请求不变。重试 POST 需要应用协议，通常由调用方提供稳定键，服务端以原子去重和已保存结果作为支撑。'
    topics: [backend/api-design]
    level: intermediate
    section: { en: 'HTTP semantics', zh: 'HTTP 语义' }
    frequency: common
    tags: [safe-method, idempotency, retry]

  - id: api-etag-lost-update
    question: { en: 'How does an ETag prevent a lost update?', zh: 'ETag 如何防止丢失更新？' }
    answer:
      en: 'The server returns a strong ETag for the selected representation. A client that edits that representation sends the tag in If-Match with its PUT, PATCH, or DELETE. The server compares the precondition against the current entity tag and performs the mutation only on a match; a stale tag normally produces 412 Precondition Failed. The important implementation detail is atomicity. Reading a version, comparing it in application code, and then issuing an unconditional write leaves a race. Use a conditional database update or transaction, and return the new ETag after success so later edits have a fresh validator.'
      zh: '服务端为选定表示返回强 ETag。客户端修改该表示时，在 PUT、PATCH 或 DELETE 请求的 If-Match 中带上此标签。服务端把前置条件与当前实体标签比较，只有匹配时才执行修改；标签过期通常返回 412 Precondition Failed。实现重点是原子性。先读取版本、在应用代码中比较、再执行无条件写入，仍会留下竞态窗口。应使用数据库条件更新或事务，并在成功后返回新 ETag，让后续编辑获得新的验证器。'
    topics: [backend/api-design]
    level: intermediate
    section: { en: 'Concurrency control', zh: '并发控制' }
    frequency: common
    tags: [etag, if-match, lost-update]

  - id: api-cursor-pagination
    question: { en: 'What makes cursor pagination correct under changing data?', zh: '数据持续变化时，怎样保证游标分页正确？' }
    answer:
      en: 'First define a deterministic total order, ending with a unique tie-breaker such as an ID. The cursor encodes the last ordering tuple, direction, and any filter or sort version needed to resume the same query. The service validates and bounds the page size, treats the token as opaque to clients, and rejects malformed or mismatched tokens. This avoids ambiguity among equal sort values, but it does not create snapshot consistency by itself. If one traversal must observe one snapshot, bind the cursor to a database snapshot or watermark and specify its expiration and behavior after inserts or deletes.'
      zh: '先定义确定的全序，并以 ID 等唯一字段作为最后的决胜条件。游标编码上一条记录的排序元组、方向，以及继续同一查询所需的过滤条件或排序版本。服务端要验证并限制页大小，让客户端把令牌视为不透明值，并拒绝格式错误或条件不匹配的令牌。这样能消除相同排序值之间的歧义，但不会自动提供快照一致性。如果一次遍历必须观察同一快照，就要把游标绑定到数据库快照或水位线，并定义过期时间以及插入、删除后的行为。'
    topics: [backend/api-design]
    level: advanced
    section: { en: 'Pagination', zh: '分页' }
    frequency: occasional
    tags: [cursor-pagination, ordering, consistency]

  - id: api-first-versus-openapi-first
    question: { en: 'Why does writing an OpenAPI file first not necessarily make a project API-first?', zh: '为什么先写 OpenAPI 文件，不一定代表项目采用了 API 优先？' }
    answer:
      en: 'API-first is a decision and enforcement process, while OpenAPI is an interface-description format. A team is API-first when consumers and providers review observable behavior before dependent implementation, publish a versioned contract, and make later code and releases prove conformance. A specification written first but ignored after controllers appear is merely early documentation. I look for change review, compatibility checks, contract-backed mocks, provider verification against the real HTTP boundary, and a trace from each deployable artifact to the contract revision it implements.'
      zh: 'API 优先是一套决策与约束流程，OpenAPI 则是接口描述格式。只有消费者和提供者在依赖实现开始前评审可观察行为，发布版本化契约，并要求后续代码与发布证明符合契约，才算 API 优先。先写规范、控制器出现后却不再维护，仍只是提前编写文档。我会检查变更评审、兼容性检查、契约驱动 Mock、针对真实 HTTP 边界的提供者验证，以及每个部署制品到所实现契约修订的追踪关系。'
    topics: [backend/api-first]
    level: intermediate
    section: { en: 'API delivery', zh: 'API 交付' }
    frequency: common
    tags: [api-first, OpenAPI, governance]

  - id: api-first-ci-layers
    question: { en: 'What should an API-first CI pipeline check, and why are several layers needed?', zh: 'API 优先的 CI 流水线应检查什么，为什么需要多个层次？' }
    answer:
      en: 'First parse and validate the description so malformed references or schemas cannot ship. Next compare it with the last published contract and flag changes that may break request or response compatibility. Then exercise a running provider and validate the full HTTP exchange, including status, media type, relevant headers, and body. Those checks still do not prove authorization, transaction atomicity, idempotency, or domain transitions, so add focused scenario tests. Each layer answers a different question; passing one cannot be used as evidence that the others pass.'
      zh: '首先解析并校验描述，阻止错误引用或模式进入发布。然后与上一版已发布契约比较，标出可能破坏请求或响应兼容性的变更。接着调用运行中的提供者，验证完整 HTTP 交换，包括状态码、媒体类型、相关响应头和响应体。这些检查仍不能证明授权、事务原子性、幂等性或领域状态转换，因此还要添加针对性场景测试。每一层回答的问题不同，不能用其中一层通过来推断其他层也通过。'
    topics: [backend/api-first]
    level: intermediate
    section: { en: 'Contract verification', zh: '契约验证' }
    frequency: common
    tags: [ci, provider-verification, compatibility]

  - id: api-first-change-direction
    question: { en: 'Why must compatibility be evaluated differently for requests and responses?', zh: '为什么请求与响应必须按不同方向评估兼容性？' }
    answer:
      en: 'The producer and consumer roles reverse. A client produces requests, so narrowing what the server accepts can reject old traffic, while accepting more input usually leaves old clients unaffected. A server produces responses, so removing a field can break an old reader; adding a field works only if that reader tolerates unknown properties. Schema diffs are therefore a starting point, not a verdict. Defaults, ordering, error meaning, and retry behavior can change without a structural diff. Record the direction, known consumer behavior, and migration evidence for every risky change.'
      zh: '请求与响应中的生产者和消费者角色相反。客户端生产请求，因此服务端收紧可接受输入，可能拒绝旧流量；放宽输入通常不影响旧客户端。服务端生产响应，因此删除字段可能破坏旧读取者；只有读取者容忍未知属性时，新增字段才安全。所以模式差异只是起点，不是最终结论。默认值、排序、错误含义和重试行为可以在结构不变时发生变化。每项高风险变更都应记录方向、已知消费者行为和迁移证据。'
    topics: [backend/api-first]
    level: advanced
    section: { en: 'Compatibility', zh: '兼容性' }
    frequency: common
    tags: [breaking-change, request, response]

  - id: api-first-openapi-and-cdc
    question: { en: 'How do OpenAPI provider verification and consumer-driven contracts complement each other?', zh: 'OpenAPI 提供者验证与消费者驱动契约如何互补？' }
    answer:
      en: 'OpenAPI describes the provider’s public HTTP boundary and supports broad conformance checks across documented operations. A consumer-driven contract records the concrete interactions a named consumer relies on and asks the provider to verify them. The consumer contract exposes real dependencies that optional fields may hide, while OpenAPI covers operations and common rules no current consumer test exercises. Neither proves domain correctness or authorization. Providers should review consumer expectations rather than accept private redefinitions of service semantics, and deployment should require the relevant provider version to pass both kinds of checks.'
      zh: 'OpenAPI 描述提供者的公共 HTTP 边界，可对已记录操作执行广泛的符合性检查。消费者驱动契约记录具名消费者实际依赖的具体交互，并要求提供者验证。消费者契约能暴露可选字段背后的真实依赖，OpenAPI 则覆盖当前消费者测试未执行的操作和通用规则。两者都不能证明领域正确性或授权。提供者应评审消费者期望，而不是接受对服务语义的私下重定义；部署时应要求目标提供者版本通过两类检查。'
    topics: [backend/api-first]
    level: advanced
    section: { en: 'Contract verification', zh: '契约验证' }
    frequency: occasional
    tags: [OpenAPI, consumer-driven-contract, provider-verification]

  - id: api-versioning-new-version
    question: { en: 'When does an HTTP API change require a new public version?', zh: 'HTTP API 变更在什么情况下需要新的公共版本？' }
    answer:
      en: 'Use a new version when a change can invalidate an interaction promised by the current contract and compatibility cannot reasonably be preserved. Clear cases include removing or renaming response fields, adding required request input, changing a field type, or changing authentication requirements. Also inspect behavioral changes such as defaults, ordering, error meaning, and retry effects. Adding an optional request field is usually compatible; adding a response field depends on whether supported readers tolerate unknown properties. The decision should come from contract diffs, representative consumer tests, and policy, not from the service deployment number alone.'
      zh: '当一项变更会使当前契约承诺的交互失效，而且无法合理保持兼容时，就应使用新版本。典型情况包括删除或重命名响应字段、新增必填请求输入、修改字段类型或改变认证要求。还要检查默认值、排序、错误含义和重试效果等行为变化。新增可选请求字段通常兼容；新增响应字段是否兼容，则取决于受支持读取者能否容忍未知属性。判断应依据契约差异、代表性消费者测试和既定策略，不能只看服务部署编号。'
    topics: [backend/api-versioning]
    level: intermediate
    section: { en: 'API compatibility', zh: 'API 兼容性' }
    frequency: common
    tags: [api-versioning, breaking-change, compatibility]

  - id: api-versioning-selector-tradeoffs
    question: { en: 'How do path and header API versioning differ operationally?', zh: '路径版本与请求头版本在运维上有何不同？' }
    answer:
      en: 'A path such as /api/v2/orders makes the selected contract visible in routing, logs, links, and ordinary cache keys. Migration changes the resource URI, which can affect client configuration and generated links. A header keeps the URI stable and can use a custom field or an Accept media type, but clients and debugging tools must send it correctly. Cacheable responses selected by a header need the corresponding Vary field, and the deployed CDN or gateway must honor it. In either scheme, define missing, malformed, conflicting, unsupported, deprecated, and retired values instead of falling through to the latest implementation.'
      zh: '路径形式如 /api/v2/orders，会让所选契约直接出现在路由、日志、链接和常规缓存键中。迁移会改变资源 URI，可能影响客户端配置和生成的链接。请求头可以保持 URI 稳定，并使用自定义字段或 Accept 媒体类型，但客户端与调试工具必须正确发送。若可缓存响应由请求头选择，就要发送 Vary 字段，并确认 CDN 或网关会遵守它。无论采用哪种方案，都应定义缺失、格式错误、冲突、不受支持、已弃用和已退役值的行为，不能落入最新实现。'
    topics: [backend/api-versioning]
    level: intermediate
    section: { en: 'Version selection', zh: '版本选择' }
    frequency: common
    tags: [path-versioning, header-versioning, vary]

  - id: api-versioning-deprecation-plan
    question: { en: 'What makes an API deprecation plan safe to execute?', zh: '怎样的 API 弃用计划才可以安全执行？' }
    answer:
      en: 'Start with a support policy and usage inventory tied to stable client identities, because request volume alone can hide a low-frequency critical job. Publish the replacement contract and a tested migration map, contact known owners, and monitor their progress. During deprecation, preserve the old behavior. RFC 9745 encodes Deprecation as a Structured Field Date; RFC 8594 encodes Sunset as an HTTP date for expected unavailability, and the sunset cannot precede deprecation. Treat both as hints, supplement them with direct communication, define the post-retirement response, and keep a rollback path for missed consumers.'
      zh: '先制定支持策略，并用稳定客户端标识盘点用量，因为单看请求量可能漏掉低频但关键的任务。发布替代契约和经过测试的迁移映射，联系已知负责人并跟踪进度。弃用期间必须保留旧行为。RFC 9745 要求把 Deprecation 编码为结构化字段日期；RFC 8594 要求 Sunset 使用 HTTP 日期来表示预计停止响应的时间，而且日落不能早于弃用。两者都只是提示，需要直接沟通作为补充；同时定义退役后的响应，并为遗漏消费者保留回滚路径。'
    topics: [backend/api-versioning]
    level: advanced
    section: { en: 'API lifecycle', zh: 'API 生命周期' }
    frequency: common
    tags: [deprecation, sunset, migration]

  - id: api-versioning-compatibility-evidence
    question: { en: 'Why is a schema diff insufficient to prove API compatibility?', zh: '为什么模式差异不足以证明 API 兼容性？' }
    answer:
      en: 'A schema diff sees structural changes but not every consumer behavior or protocol promise. A supposedly additive response field can fail in a strict decoder, and a new enum value can break an exhaustive switch. Defaults, result ordering, status codes, headers, authorization rules, and idempotency can change with no obvious schema difference. Use the diff to identify risk, then run provider tests against each published HTTP contract and representative consumer contracts against the candidate provider. Production telemetry adds evidence about which client versions remain active, but low traffic is not proof that a dependency is unimportant.'
      zh: '模式差异能看到结构变化，却无法覆盖所有消费者行为或协议承诺。看似增量的响应字段可能让严格解码器失败，新的枚举值也可能破坏穷尽分支。默认值、结果排序、状态码、响应头、授权规则和幂等性都可能在没有明显模式差异时改变。应先用差异定位风险，再针对每份已发布 HTTP 契约运行提供者测试，并让代表性消费者契约验证候选提供者。生产遥测可以说明哪些客户端版本仍然活跃，但低流量不代表依赖不重要。'
    topics: [backend/api-versioning]
    level: advanced
    section: { en: 'Contract verification', zh: '契约验证' }
    frequency: occasional
    tags: [schema-diff, contract-testing, telemetry]
