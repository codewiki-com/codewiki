track: backend
items:
  - id: jwt-signature-versus-validation
    question: { en: 'Why is a valid JWT signature insufficient for authentication?', zh: '为什么 JWT 签名有效仍不足以完成身份认证？' }
    answer: { en: 'A signature protects bytes under a key; the verifier must also bind that key to a trusted issuer and validate audience, token type, time claims, required claim types, and application status before creating an identity.', zh: '签名只说明字节受到某把密钥保护；验证器还要把密钥绑定到可信签发者，并检查受众、令牌类型、时间声明、必需声明类型和应用状态，才能建立身份。' }
    topics: [backend/jwt-authentication]
    level: intermediate
    tags: [jwt, claim-validation]

  - id: jwt-hmac-versus-asymmetric
    question: { en: 'What trust-boundary difference separates HS256 from an asymmetric JWT signature?', zh: 'HS256 与非对称 JWT 签名在信任边界上有什么区别？' }
    answer: { en: 'Every HS256 verifier holds the shared secret and can therefore issue tokens. With an asymmetric algorithm, the issuer can retain the private key while distributing public verification keys, so verifiers need not gain signing power.', zh: '每个 HS256 验证者都持有共享秘密，因此也能签发令牌。非对称算法让签发者保留私钥，只分发验证公钥，所以验证者不必获得签发能力。' }
    topics: [backend/jwt-authentication]
    level: intermediate
    tags: [jwt, key-management]

  - id: refresh-token-replay
    question: { en: 'How does refresh token rotation detect replay, and what should happen after detection?', zh: '刷新令牌轮换如何检测重放，发现重放后应怎样处理？' }
    answer: { en: 'Each refresh consumes the old value and issues one successor while retaining their family relationship. Reuse of an inactive value signals possible theft; revoke the active family and require a new authorization because the server cannot identify which caller is legitimate.', zh: '每次刷新都会消费旧值、签发唯一后继值，并保留令牌族关系。已失效值再次出现说明可能被窃取；服务器无法判断哪一方合法，因此应撤销活动令牌族并要求重新授权。' }
    topics: [backend/jwt-authentication]
    level: advanced
    tags: [refresh-token, replay-detection]

  - id: api-resource-contract
    question: { en: 'What belongs in an HTTP API operation contract besides its URL?', zh: '除了 URL，HTTP API 的操作契约还应包含什么？' }
    answer:
      en: 'The contract names the method, target resource, accepted headers and media types, parameter constraints, authentication and resource-level authorization rules, success representation, failure statuses, and relevant response headers. It also states behavior across time: whether a request is safe or idempotent, how a client retries an unknown result, how concurrent writes are detected, and how pagination remains ordered. OpenAPI can describe much of the message shape, but transaction boundaries and domain invariants still need prose and scenario tests. I review the complete observable HTTP exchange, not only the JSON schema.'
      zh: '契约要说明方法、目标资源、接受的响应头与媒体类型、参数约束、认证和资源级授权规则、成功表示、失败状态码以及相关响应头。它还要定义跨时间行为：请求是否安全或幂等，客户端如何重试结果未知的操作，怎样检测并发写入，以及分页如何保持顺序。OpenAPI 能描述大部分消息形状，但事务边界与领域不变量仍需要文字和场景测试。我会审查完整且可观察的 HTTP 交换，而不只看 JSON 模式。'
    topics: [backend/api-design]
    level: intermediate
    section: { en: 'HTTP API contracts', zh: 'HTTP API 契约' }
    frequency: common
    tags: [api-design, contract, http]

  - id: api-safe-versus-idempotent
    question: { en: 'How do safe and idempotent HTTP methods differ, and what does that mean for retries?', zh: 'HTTP 的安全方法与幂等方法有何区别，这对重试意味着什么？' }
    answer:
      en: 'A safe method has essentially read-only requested semantics, so the client does not ask for a state change. An idempotent method may change state, but repeating the identical request has the same intended effect as sending it once. GET is both; PUT and DELETE are idempotent but unsafe. Incidental logging does not change those classifications, and repeated responses need not be identical. Idempotency supports retry after a connection failure, but the client must preserve the same request. Retrying POST needs an application protocol, typically a caller-stable key backed by atomic deduplication and a stored result.'
      zh: '安全方法的请求语义基本只读，因此客户端没有要求改变状态。幂等方法可以修改状态，但重复发送相同请求时，预期效果与发送一次相同。GET 同时具备两种性质；PUT 和 DELETE 幂等但不安全。附带日志不会改变分类，多次响应也不必完全相同。幂等性支持在连接失败后重试，但客户端必须保持请求不变。重试 POST 需要应用协议，通常由调用方提供稳定键，服务端以原子去重和已保存结果作为支撑。'
    topics: [backend/api-design]
    level: intermediate
    section: { en: 'HTTP semantics', zh: 'HTTP 语义' }
    frequency: common
    tags: [safe-method, idempotency, retry]

  - id: api-etag-lost-update
    question: { en: 'How does an ETag prevent a lost update?', zh: 'ETag 如何防止丢失更新？' }
    answer:
      en: 'The server returns a strong ETag for the selected representation. A client that edits that representation sends the tag in If-Match with its PUT, PATCH, or DELETE. The server compares the precondition against the current entity tag and performs the mutation only on a match; a stale tag normally produces 412 Precondition Failed. The important implementation detail is atomicity. Reading a version, comparing it in application code, and then issuing an unconditional write leaves a race. Use a conditional database update or transaction, and return the new ETag after success so later edits have a fresh validator.'
      zh: '服务端为选定表示返回强 ETag。客户端修改该表示时，在 PUT、PATCH 或 DELETE 请求的 If-Match 中带上此标签。服务端把前置条件与当前实体标签比较，只有匹配时才执行修改；标签过期通常返回 412 Precondition Failed。实现重点是原子性。先读取版本、在应用代码中比较、再执行无条件写入，仍会留下竞态窗口。应使用数据库条件更新或事务，并在成功后返回新 ETag，让后续编辑获得新的验证器。'
    topics: [backend/api-design]
    level: intermediate
    section: { en: 'Concurrency control', zh: '并发控制' }
    frequency: common
    tags: [etag, if-match, lost-update]

  - id: api-cursor-pagination
    question: { en: 'What makes cursor pagination correct under changing data?', zh: '数据持续变化时，怎样保证游标分页正确？' }
    answer:
      en: 'First define a deterministic total order, ending with a unique tie-breaker such as an ID. The cursor encodes the last ordering tuple, direction, and any filter or sort version needed to resume the same query. The service validates and bounds the page size, treats the token as opaque to clients, and rejects malformed or mismatched tokens. This avoids ambiguity among equal sort values, but it does not create snapshot consistency by itself. If one traversal must observe one snapshot, bind the cursor to a database snapshot or watermark and specify its expiration and behavior after inserts or deletes.'
      zh: '先定义确定的全序，并以 ID 等唯一字段作为最后的决胜条件。游标编码上一条记录的排序元组、方向，以及继续同一查询所需的过滤条件或排序版本。服务端要验证并限制页大小，让客户端把令牌视为不透明值，并拒绝格式错误或条件不匹配的令牌。这样能消除相同排序值之间的歧义，但不会自动提供快照一致性。如果一次遍历必须观察同一快照，就要把游标绑定到数据库快照或水位线，并定义过期时间以及插入、删除后的行为。'
    topics: [backend/api-design]
    level: advanced
    section: { en: 'Pagination', zh: '分页' }
    frequency: occasional
    tags: [cursor-pagination, ordering, consistency]

  - id: api-first-versus-openapi-first
    question: { en: 'Why does writing an OpenAPI file first not necessarily make a project API-first?', zh: '为什么先写 OpenAPI 文件，不一定代表项目采用了 API 优先？' }
    answer:
      en: 'API-first is a decision and enforcement process, while OpenAPI is an interface-description format. A team is API-first when consumers and providers review observable behavior before dependent implementation, publish a versioned contract, and make later code and releases prove conformance. A specification written first but ignored after controllers appear is merely early documentation. I look for change review, compatibility checks, contract-backed mocks, provider verification against the real HTTP boundary, and a trace from each deployable artifact to the contract revision it implements.'
      zh: 'API 优先是一套决策与约束流程，OpenAPI 则是接口描述格式。只有消费者和提供者在依赖实现开始前评审可观察行为，发布版本化契约，并要求后续代码与发布证明符合契约，才算 API 优先。先写规范、控制器出现后却不再维护，仍只是提前编写文档。我会检查变更评审、兼容性检查、契约驱动 Mock、针对真实 HTTP 边界的提供者验证，以及每个部署制品到所实现契约修订的追踪关系。'
    topics: [backend/api-first]
    level: intermediate
    section: { en: 'API delivery', zh: 'API 交付' }
    frequency: common
    tags: [api-first, OpenAPI, governance]

  - id: api-first-ci-layers
    question: { en: 'What should an API-first CI pipeline check, and why are several layers needed?', zh: 'API 优先的 CI 流水线应检查什么，为什么需要多个层次？' }
    answer:
      en: 'First parse and validate the description so malformed references or schemas cannot ship. Next compare it with the last published contract and flag changes that may break request or response compatibility. Then exercise a running provider and validate the full HTTP exchange, including status, media type, relevant headers, and body. Those checks still do not prove authorization, transaction atomicity, idempotency, or domain transitions, so add focused scenario tests. Each layer answers a different question; passing one cannot be used as evidence that the others pass.'
      zh: '首先解析并校验描述，阻止错误引用或模式进入发布。然后与上一版已发布契约比较，标出可能破坏请求或响应兼容性的变更。接着调用运行中的提供者，验证完整 HTTP 交换，包括状态码、媒体类型、相关响应头和响应体。这些检查仍不能证明授权、事务原子性、幂等性或领域状态转换，因此还要添加针对性场景测试。每一层回答的问题不同，不能用其中一层通过来推断其他层也通过。'
    topics: [backend/api-first]
    level: intermediate
    section: { en: 'Contract verification', zh: '契约验证' }
    frequency: common
    tags: [ci, provider-verification, compatibility]

  - id: api-first-change-direction
    question: { en: 'Why must compatibility be evaluated differently for requests and responses?', zh: '为什么请求与响应必须按不同方向评估兼容性？' }
    answer:
      en: 'The producer and consumer roles reverse. A client produces requests, so narrowing what the server accepts can reject old traffic, while accepting more input usually leaves old clients unaffected. A server produces responses, so removing a field can break an old reader; adding a field works only if that reader tolerates unknown properties. Schema diffs are therefore a starting point, not a verdict. Defaults, ordering, error meaning, and retry behavior can change without a structural diff. Record the direction, known consumer behavior, and migration evidence for every risky change.'
      zh: '请求与响应中的生产者和消费者角色相反。客户端生产请求，因此服务端收紧可接受输入，可能拒绝旧流量；放宽输入通常不影响旧客户端。服务端生产响应，因此删除字段可能破坏旧读取者；只有读取者容忍未知属性时，新增字段才安全。所以模式差异只是起点，不是最终结论。默认值、排序、错误含义和重试行为可以在结构不变时发生变化。每项高风险变更都应记录方向、已知消费者行为和迁移证据。'
    topics: [backend/api-first]
    level: advanced
    section: { en: 'Compatibility', zh: '兼容性' }
    frequency: common
    tags: [breaking-change, request, response]

  - id: api-first-openapi-and-cdc
    question: { en: 'How do OpenAPI provider verification and consumer-driven contracts complement each other?', zh: 'OpenAPI 提供者验证与消费者驱动契约如何互补？' }
    answer:
      en: 'OpenAPI describes the provider’s public HTTP boundary and supports broad conformance checks across documented operations. A consumer-driven contract records the concrete interactions a named consumer relies on and asks the provider to verify them. The consumer contract exposes real dependencies that optional fields may hide, while OpenAPI covers operations and common rules no current consumer test exercises. Neither proves domain correctness or authorization. Providers should review consumer expectations rather than accept private redefinitions of service semantics, and deployment should require the relevant provider version to pass both kinds of checks.'
      zh: 'OpenAPI 描述提供者的公共 HTTP 边界，可对已记录操作执行广泛的符合性检查。消费者驱动契约记录具名消费者实际依赖的具体交互，并要求提供者验证。消费者契约能暴露可选字段背后的真实依赖，OpenAPI 则覆盖当前消费者测试未执行的操作和通用规则。两者都不能证明领域正确性或授权。提供者应评审消费者期望，而不是接受对服务语义的私下重定义；部署时应要求目标提供者版本通过两类检查。'
    topics: [backend/api-first]
    level: advanced
    section: { en: 'Contract verification', zh: '契约验证' }
    frequency: occasional
    tags: [OpenAPI, consumer-driven-contract, provider-verification]

  - id: api-versioning-new-version
    question: { en: 'When does an HTTP API change require a new public version?', zh: 'HTTP API 变更在什么情况下需要新的公共版本？' }
    answer:
      en: 'Use a new version when a change can invalidate an interaction promised by the current contract and compatibility cannot reasonably be preserved. Clear cases include removing or renaming response fields, adding required request input, changing a field type, or changing authentication requirements. Also inspect behavioral changes such as defaults, ordering, error meaning, and retry effects. Adding an optional request field is usually compatible; adding a response field depends on whether supported readers tolerate unknown properties. The decision should come from contract diffs, representative consumer tests, and policy, not from the service deployment number alone.'
      zh: '当一项变更会使当前契约承诺的交互失效，而且无法合理保持兼容时，就应使用新版本。典型情况包括删除或重命名响应字段、新增必填请求输入、修改字段类型或改变认证要求。还要检查默认值、排序、错误含义和重试效果等行为变化。新增可选请求字段通常兼容；新增响应字段是否兼容，则取决于受支持读取者能否容忍未知属性。判断应依据契约差异、代表性消费者测试和既定策略，不能只看服务部署编号。'
    topics: [backend/api-versioning]
    level: intermediate
    section: { en: 'API compatibility', zh: 'API 兼容性' }
    frequency: common
    tags: [api-versioning, breaking-change, compatibility]

  - id: api-versioning-selector-tradeoffs
    question: { en: 'How do path and header API versioning differ operationally?', zh: '路径版本与请求头版本在运维上有何不同？' }
    answer:
      en: 'A path such as /api/v2/orders makes the selected contract visible in routing, logs, links, and ordinary cache keys. Migration changes the resource URI, which can affect client configuration and generated links. A header keeps the URI stable and can use a custom field or an Accept media type, but clients and debugging tools must send it correctly. Cacheable responses selected by a header need the corresponding Vary field, and the deployed CDN or gateway must honor it. In either scheme, define missing, malformed, conflicting, unsupported, deprecated, and retired values instead of falling through to the latest implementation.'
      zh: '路径形式如 /api/v2/orders，会让所选契约直接出现在路由、日志、链接和常规缓存键中。迁移会改变资源 URI，可能影响客户端配置和生成的链接。请求头可以保持 URI 稳定，并使用自定义字段或 Accept 媒体类型，但客户端与调试工具必须正确发送。若可缓存响应由请求头选择，就要发送 Vary 字段，并确认 CDN 或网关会遵守它。无论采用哪种方案，都应定义缺失、格式错误、冲突、不受支持、已弃用和已退役值的行为，不能落入最新实现。'
    topics: [backend/api-versioning]
    level: intermediate
    section: { en: 'Version selection', zh: '版本选择' }
    frequency: common
    tags: [path-versioning, header-versioning, vary]

  - id: api-versioning-deprecation-plan
    question: { en: 'What makes an API deprecation plan safe to execute?', zh: '怎样的 API 弃用计划才可以安全执行？' }
    answer:
      en: 'Start with a support policy and usage inventory tied to stable client identities, because request volume alone can hide a low-frequency critical job. Publish the replacement contract and a tested migration map, contact known owners, and monitor their progress. During deprecation, preserve the old behavior. RFC 9745 encodes Deprecation as a Structured Field Date; RFC 8594 encodes Sunset as an HTTP date for expected unavailability, and the sunset cannot precede deprecation. Treat both as hints, supplement them with direct communication, define the post-retirement response, and keep a rollback path for missed consumers.'
      zh: '先制定支持策略，并用稳定客户端标识盘点用量，因为单看请求量可能漏掉低频但关键的任务。发布替代契约和经过测试的迁移映射，联系已知负责人并跟踪进度。弃用期间必须保留旧行为。RFC 9745 要求把 Deprecation 编码为结构化字段日期；RFC 8594 要求 Sunset 使用 HTTP 日期来表示预计停止响应的时间，而且日落不能早于弃用。两者都只是提示，需要直接沟通作为补充；同时定义退役后的响应，并为遗漏消费者保留回滚路径。'
    topics: [backend/api-versioning]
    level: advanced
    section: { en: 'API lifecycle', zh: 'API 生命周期' }
    frequency: common
    tags: [deprecation, sunset, migration]

  - id: api-versioning-compatibility-evidence
    question: { en: 'Why is a schema diff insufficient to prove API compatibility?', zh: '为什么模式差异不足以证明 API 兼容性？' }
    answer:
      en: 'A schema diff sees structural changes but not every consumer behavior or protocol promise. A supposedly additive response field can fail in a strict decoder, and a new enum value can break an exhaustive switch. Defaults, result ordering, status codes, headers, authorization rules, and idempotency can change with no obvious schema difference. Use the diff to identify risk, then run provider tests against each published HTTP contract and representative consumer contracts against the candidate provider. Production telemetry adds evidence about which client versions remain active, but low traffic is not proof that a dependency is unimportant.'
      zh: '模式差异能看到结构变化，却无法覆盖所有消费者行为或协议承诺。看似增量的响应字段可能让严格解码器失败，新的枚举值也可能破坏穷尽分支。默认值、结果排序、状态码、响应头、授权规则和幂等性都可能在没有明显模式差异时改变。应先用差异定位风险，再针对每份已发布 HTTP 契约运行提供者测试，并让代表性消费者契约验证候选提供者。生产遥测可以说明哪些客户端版本仍然活跃，但低流量不代表依赖不重要。'
    topics: [backend/api-versioning]
    level: advanced
    section: { en: 'Contract verification', zh: '契约验证' }
    frequency: occasional
    tags: [schema-diff, contract-testing, telemetry]

  - id: django-request-lifecycle
    question: { en: 'Trace a Django request from the server to the response.', zh: '说明一个 Django 请求从服务器到响应的处理过程。' }
    answer:
      en: 'The WSGI or ASGI server constructs a request and passes it to Django’s handler. Request middleware runs in configured order, then the URL resolver checks patterns in order and calls the matched view with converted arguments. The view may validate input, invoke domain logic, query models, and render a template or construct another HttpResponse. The response then unwinds through middleware in reverse order before the server sends it. Exceptions can be converted by middleware or Django’s error handling. I also mention that middleware order is functional: sessions must exist before authentication can attach request.user.'
      zh: 'WSGI 或 ASGI 服务器构造请求并交给 Django 处理器。请求中间件按配置顺序运行，URL 解析器随后按顺序匹配模式，把转换后的参数交给目标视图。视图可以验证输入、调用领域逻辑、查询模型，并渲染模板或构造其他 HttpResponse。响应再按相反顺序经过中间件，最后由服务器发送。异常可以由中间件或 Django 错误处理逻辑转换。中间件顺序具有实际语义，例如必须先建立会话，认证中间件才能设置 request.user。'
    topics: [backend/django]
    level: intermediate
    section: { en: 'Request handling', zh: '请求处理' }
    frequency: common
    tags: [urlconf, middleware, request]

  - id: django-queryset-n-plus-one
    question: { en: 'Why does Django produce N+1 queries, and how do you fix it?', zh: 'Django 为什么会产生 N+1 查询，应该怎样修复？' }
    answer:
      en: 'A QuerySet usually loads its base rows lazily. If later code or a template reads an uncached relation for every row, Django issues one initial query plus one relation query per result. I reproduce the actual access pattern and capture its query count before changing it. select_related() joins single-valued foreign-key or one-to-one relations into the main query. prefetch_related() runs separate queries and connects many-valued results in Python. The fix still needs pagination and measurement: broad joins can duplicate data, while unused or huge prefetches consume memory and may generate large IN clauses.'
      zh: 'QuerySet 通常会惰性加载基础数据行。如果后续代码或模板为每一行读取未缓存的关联，Django 就会先执行一条基础查询，再为每条结果执行一条关联查询。我会先复现真实访问模式并捕获查询数。`select_related()` 把单值外键或一对一关系连接到主查询，`prefetch_related()` 则执行独立查询，再在 Python 中关联多值结果。修复后仍需分页和测量，因为过宽的连接会重复数据，未使用或过大的预取也会消耗内存并生成很大的 `IN` 子句。'
    topics: [backend/django]
    level: intermediate
    section: { en: 'ORM and data access', zh: 'ORM 与数据访问' }
    frequency: common
    tags: [queryset, n-plus-one, optimization]

  - id: django-validation-versus-constraints
    question: { en: 'How do Django validation and database constraints divide responsibility?', zh: 'Django 验证与数据库约束如何分工？' }
    answer:
      en: 'Forms and serializers parse untrusted input, convert types, apply user-facing rules, and return useful field errors. They are not the final integrity boundary because scripts, bulk operations, admin actions, or concurrent requests can bypass or race that validation. Durable invariants belong in database types, foreign keys, unique constraints, check constraints, and transactions where the database can enforce them for every writer. Application code should still validate early for better errors, then handle IntegrityError for races. Model save() does not automatically call full_clean(), so a team should define and test one consistent write policy.'
      zh: '表单和序列化器负责解析不可信输入、转换类型、应用面向用户的规则，并返回有用的字段错误。它们不是最终的数据完整性边界，因为脚本、批量操作、管理操作或并发请求可能绕过验证，或者与验证发生竞态。持久不变量应放进数据库类型、外键、唯一约束、检查约束和事务，由数据库对所有写入者强制执行。应用代码仍应尽早验证以提供更好的错误，并处理竞态产生的 IntegrityError。模型的 save() 不会自动调用 full_clean()，因此团队需要定义并测试一致的写入策略。'
    topics: [backend/django]
    level: intermediate
    section: { en: 'Data integrity', zh: '数据完整性' }
    frequency: common
    tags: [validation, constraint, transaction]

  - id: django-async-boundary
    question: { en: 'When does an async Django view help, and where is the boundary?', zh: 'Django 异步视图何时有用，边界在哪里？' }
    answer:
      en: 'An async view helps when it spends substantial time awaiting supported nonblocking I/O, especially under ASGI with an async-capable middleware stack. The declaration alone does not make synchronous ORM calls or libraries nonblocking. Django can adapt sync and async components, but each transition has overhead, and sync-only code in an async context may raise SynchronousOnlyOperation. Use native async ORM methods where available. In Django 6.0, transaction work remains synchronous, so put the complete atomic unit in one synchronous function and cross the boundary once with sync_to_async(). Also handle cancellation for long-lived requests.'
      zh: '异步视图适合大量时间都在等待受支持的非阻塞 I/O 的场景，特别是运行在 ASGI 下且中间件栈支持异步时。只有 `async def` 声明，并不会让同步 ORM 调用或第三方库变成非阻塞操作。Django 可以适配同步和异步组件，但每次切换都有成本，在异步上下文调用仅支持同步的代码还可能抛出 SynchronousOnlyOperation。应优先使用原生异步 ORM 方法。Django 6.0 的事务工作仍需同步执行，因此要把完整原子单元放在一个同步函数中，再通过 `sync_to_async()` 跨越一次边界。长时间请求还要处理取消。'
    topics: [backend/django]
    level: advanced
    section: { en: 'Async execution', zh: '异步执行' }
    frequency: occasional
    tags: [asgi, async-safety, transaction]

  - id: elysia-schema-types-and-validation
    question: { en: 'How does one Elysia route schema provide both TypeScript types and runtime validation?', zh: '一份 Elysia 路由模式如何同时提供 TypeScript 类型和运行时验证？' }
    answer:
      en: 'The route declaration attaches schemas to body, query, params, headers, cookies, or responses. Elysia uses those schema objects at runtime to parse and reject requests or responses that do not conform. At compile time, TypeScript infers the corresponding handler context and return branches from the same declarations, so a separate interface is usually unnecessary. I still separate transport validation from domain invariants and authorization. A valid order shape does not prove that stock exists or that the caller owns an account. I test malformed HTTP input and business failures independently.'
      zh: '路由声明可以为 `body`、`query`、`params`、`headers`、`cookie` 和响应附加模式。Elysia 在运行时使用这些模式对象解析并拒绝不合规的请求或响应；在编译时，TypeScript 又从同一声明推断处理器上下文与返回分支，因此通常不需要重复接口。我仍会区分传输验证、领域不变量和授权。订单结构有效，并不能证明库存存在或调用方拥有账户。我会分别测试畸形 HTTP 输入和业务失败。'
    topics: [backend/elysia]
    level: intermediate
    section: { en: 'Route contracts', zh: '路由契约' }
    frequency: common
    tags: [elysia, route-schema, validation, typescript]

  - id: elysia-hook-scope-and-order
    question: { en: 'Why do lifecycle hook scope and registration order both matter in Elysia?', zh: '为什么 Elysia 生命周期钩子的作用域和注册顺序都很重要？' }
    answer:
      en: 'Scope determines which Elysia instances inherit a hook, while registration order determines which later routes on an instance receive it. A local hook inside a plugin applies to that plugin and its descendants, not automatically to sibling routes later added by the parent. A hook registered after a route normally does not protect that earlier route. I keep authorization hooks beside their protected routes or inside a guard, widen scope only deliberately, and probe every protected endpoint without credentials. I also place shared error handling before plugins that must inherit it.'
      zh: '作用域决定哪些 Elysia 实例会继承钩子，注册顺序决定实例上哪些后续路由会获得钩子。插件中的本地钩子适用于该插件及其后代，不会自动影响父应用后来添加的兄弟路由；路由之后注册的钩子通常也不能追溯保护该路由。我会把授权钩子放在受保护路由旁或 `guard` 中，只在明确需要时扩大作用域，并对每个受保护端点发送无凭据请求。我还会把需要由插件继承的共享错误处理放在插件之前。'
    topics: [backend/elysia]
    level: advanced
    section: { en: 'Lifecycle and plugins', zh: '生命周期与插件' }
    frequency: common
    tags: [elysia, lifecycle-hook, plugin, scope]

  - id: elysia-eden-contract-limit
    question: { en: 'What does Eden Treaty guarantee, and what deployment problem does it not solve?', zh: 'Eden Treaty 能保证什么，又不能解决哪种部署问题？' }
    answer:
      en: 'Eden Treaty derives a typed, path-shaped client from the final Elysia application type. It can check path parameters, request bodies, and declared status responses at client compile time without generating source files. That proves compatibility with the type present during the client build, not with whatever service version a URL currently serves. A rollback, stale types package, or independently deployed frontend can still drift. I publish and version shared types, use type-only imports, and run contract tests against the candidate deployment’s real HTTP boundary before release.'
      zh: 'Eden Treaty 从最终 Elysia 应用类型推导按路径组织的类型化客户端，无需生成源文件，就能在客户端编译时检查路径参数、请求体和已声明的逐状态响应。它只能证明客户端与构建时看到的类型兼容，不能证明某个 URL 当前运行的就是对应服务版本。回滚、过期的类型包或独立发布的前端仍会产生漂移。我会发布并版本化共享类型，使用仅类型导入，并在发布前针对候选部署的真实 HTTP 边界运行契约测试。'
    topics: [backend/elysia]
    level: intermediate
    section: { en: 'Typed clients', zh: '类型化客户端' }
    frequency: occasional
    tags: [eden-treaty, contract, deployment, compatibility]

  - id: elysia-test-without-listen
    question: { en: 'How do you structure and test an Elysia application without opening a port during import?', zh: '怎样组织和测试 Elysia 应用，才能避免在导入时打开端口？' }
    answer:
      en: 'I export the fully composed Elysia instance from an application module without calling listen. A separate deployment entry point imports that instance, binds the configured host and port, and owns shutdown behavior. Tests construct Web-standard Request objects and pass them to app.handle, or pass the instance to treaty for an in-process typed client. This exercises routing, validation, hooks, and response mapping deterministically without a socket. I keep a smaller real-network suite because in-process tests cannot verify proxy behavior, TLS, base URLs, response-header rewriting, or the version actually deployed.'
      zh: '我会从应用模块导出已经完整组合、但尚未调用 `listen` 的 Elysia 实例。单独的部署入口导入该实例，绑定配置的主机与端口，并负责关闭流程。测试可以构造 Web 标准 `Request` 并传给 `app.handle`，也可以把实例交给 `treaty`，得到进程内类型化客户端。这样能稳定覆盖路由、验证、钩子与响应映射，又不会打开套接字。我仍会保留规模较小的真实网络测试，因为进程内测试无法验证代理、TLS、基础 URL、响应头改写或实际部署版本。'
    topics: [backend/elysia]
    level: intermediate
    section: { en: 'Testing and deployment', zh: '测试与部署' }
    frequency: common
    tags: [elysia, testing, app-handle, deployment]

  - id: backend-fastapi-parameter-source
    question: { en: 'How does FastAPI decide where a path operation parameter comes from and whether it is required?', zh: 'FastAPI 如何判断路径操作参数的来源，以及它是否必填？' }
    answer:
      en: 'FastAPI combines the route template, Python type, default value, and explicit parameter metadata. A matching name in the route template is a path parameter. A simple scalar is normally a query parameter, while a Pydantic model is normally a request body. Header, Cookie, Query, and Body can make the source explicit. Requiredness comes from whether a default is present, not merely from a union with None. I verify the declaration over HTTP because direct function calls bypass extraction, conversion, and the structured 422 error path.'
      zh: 'FastAPI 会综合路由模板、Python 类型、默认值和显式参数元数据。名称出现在路由模板中时，它是路径参数；简单标量通常是查询参数，Pydantic 模型通常是请求体。Header、Cookie、Query 和 Body 可以显式指定来源。是否必填取决于有没有默认值，而不只是类型是否与 None 联合。我会通过 HTTP 验证声明，因为直接调用函数会绕过提取、转换和结构化的 422 错误路径。'
    topics: [backend/fastapi]
    level: beginner
    section: { en: 'Web frameworks', zh: 'Web 框架' }
    frequency: common
    tags: [fastapi, parameters, validation]

  - id: backend-fastapi-response-model-boundary
    question: { en: 'Why should a FastAPI endpoint use a separate response model?', zh: 'FastAPI 端点为什么应使用单独的响应模型？' }
    answer:
      en: 'A response model is the allowlist for data crossing the public boundary. FastAPI uses it to document, validate, serialize, and filter the handler return value, and the decorator response_model takes priority over a return annotation when both exist. Separating input, storage, and output models prevents fields such as password hashes, tenant identifiers, or internal notes from leaking through a convenient object return. I test both the full expected body and the absence of sensitive fields, because checking only positive fields will not detect accidental disclosure.'
      zh: '响应模型是数据跨越公开边界时的字段允许列表。FastAPI 用它记录、验证、序列化并过滤处理函数的返回值；同时存在时，装饰器上的 response_model 优先于返回注解。分离输入、存储和输出模型，可以防止哈希密码、租户标识或内部备注随着整个对象被便利地返回。我会同时测试完整的预期响应体和敏感字段不存在，因为只检查正向字段无法发现意外泄露。'
    topics: [backend/fastapi]
    level: intermediate
    section: { en: 'API contracts', zh: 'API 契约' }
    frequency: common
    tags: [fastapi, response-model, security]

  - id: backend-fastapi-sync-versus-async-handler
    question: { en: 'How do you choose between def and async def for a FastAPI path operation?', zh: 'FastAPI 路径操作应怎样在 def 与 async def 之间选择？' }
    answer:
      en: 'I start at the I/O boundary. If the libraries expose awaitable operations, I use async def and await every such call so the event loop can advance other work. If a required library is blocking, a normal def path operation lets FastAPI run it in a thread pool. Merely writing async def does not make a synchronous ORM, HTTP client, or sleep non-blocking. Helper functions called directly inside a handler are not moved automatically, so I trace reachable calls and confirm their execution context with concurrency and cancellation tests.'
      zh: '我会从 I/O 边界开始判断。如果库提供可等待操作，就使用 async def 并正确 await，让事件循环可以推进其他工作。如果必须使用阻塞库，普通 def 路径操作会让 FastAPI 在线程池中运行它。仅写成 async def 不会让同步 ORM、HTTP 客户端或 sleep 变为非阻塞。处理函数直接调用的辅助函数也不会自动换到线程池，因此我会跟踪可达调用，并通过并发与取消测试确认执行环境。'
    topics: [backend/fastapi]
    level: intermediate
    section: { en: 'Async execution', zh: '异步执行' }
    frequency: common
    tags: [fastapi, async, blocking-io, thread-pool]

  - id: backend-fastapi-dependency-lifecycle
    question: { en: 'How do FastAPI dependency caching, yield cleanup, and test overrides interact?', zh: 'FastAPI 的依赖缓存、yield 清理和测试覆盖如何协作？' }
    answer:
      en: 'FastAPI resolves dependencies as a graph and, by default, evaluates the same dependency callable once per request. Consumers share that request-scoped result unless use_cache=False is explicit. A dependency with one yield acquires before use and runs exit code afterward, so release belongs in finally; its selected scope determines whether cleanup occurs before or after sending the response. Tests replace a node through app.dependency_overrides keyed by the original callable object. Because that mapping is mutable application state, a fixture must always restore it, including after a failed assertion.'
      zh: 'FastAPI 把依赖解析为一张图，默认在一次请求中只求值一次同一依赖可调用对象。各使用方共享这个请求级结果，除非显式设置 use_cache=False。只包含一次 yield 的依赖会先获取资源，再运行退出代码，因此释放操作应放在 finally 中；所选范围决定清理发生在响应发送前还是发送后。测试通过 app.dependency_overrides 替换节点，键必须是原始可调用对象。该映射是应用级可变状态，所以 fixture 即使遇到断言失败也必须恢复它。'
    topics: [backend/fastapi]
    level: advanced
    section: { en: 'Dependency injection', zh: '依赖注入' }
    frequency: occasional
    tags: [fastapi, dependencies, lifecycle, testing]

  - id: file-upload-secure-lifecycle
    question: { en: 'Trace a secure file upload from admission to publication.', zh: '说明安全文件上传从准入到发布的完整流程。' }
    answer:
      en: 'I authenticate the caller, authorize the target resource, check quota, and create a pending record with a server-generated key, owner, limits, and expiry. Bytes stream into private quarantine through actual byte counting and checksum calculation. I compare observed size and digest with the intent, identify the type, fully parse or re-encode under format-specific resource limits, and run the required malware policy. A conditional update publishes only the expected pending object version. Every failure closes the stream and leaves a retryable, rejected, or expiring state; a reconciler finds orphan objects and stale records.'
      zh: '我先认证调用者，对目标资源执行授权并检查配额，再用服务端生成的键、所有者、限制和到期时间创建 pending 记录。字节经过实际计数与校验和计算，流式写入私有隔离区。随后核对实际大小和摘要，识别类型，并在格式专用资源限制下完整解析或重编码，再执行恶意软件策略。只有预期的 pending 对象版本能通过条件更新发布。任何失败都关闭流，并留下可重试、已拒绝或会到期的明确状态；对账任务负责发现孤立对象和失效记录。'
    topics: [backend/file-upload]
    level: intermediate
    section: { en: 'HTTP uploads', zh: 'HTTP 上传' }
    frequency: common
    tags: [file-upload, quarantine, validation, state-machine]

  - id: file-upload-type-validation
    question: { en: 'Why are filename extension, Content-Type, and a magic number still insufficient to validate an upload?', zh: '为什么文件扩展名、Content-Type 和魔数仍不足以验证上传？' }
    answer:
      en: 'The uploader controls the filename and declared Content-Type, so both are hints rather than evidence. A signature checks only a small byte pattern and can prefix an otherwise malformed or hostile file. I use them as cheap allowlist gates, then parse the complete input with a maintained decoder under CPU, memory, nesting, dimension, and output limits. Business validation is separate: a parseable CSV can still have forbidden columns or too many records. A checksum proves byte identity, not safety, and malware scanning adds another signal rather than replacing format parsing or authorization.'
      zh: '上传者可以控制文件名和声明的 Content-Type，所以两者只能作为提示。签名只检查少量字节，后面仍可能跟着畸形或恶意内容。我把这些信息作为廉价允许列表关卡，再用受维护的解码器完整解析输入，并限制 CPU、内存、嵌套、尺寸和输出量。业务验证仍是独立层次：能够解析的 CSV 也可能包含禁用列或过多记录。校验和只能证明字节身份，不能证明安全；恶意软件扫描也只是额外证据，不能替代格式解析和授权。'
    topics: [backend/file-upload]
    level: intermediate
    section: { en: 'Content validation', zh: '内容验证' }
    frequency: common
    tags: [content-type, file-signature, parser, checksum]

  - id: file-upload-presigned-completion
    question: { en: 'What must an application do around a presigned direct upload?', zh: '应用在预签名直传前后必须做什么？' }
    answer:
      en: 'Before signing, I authenticate and authorize the caller, enforce outstanding-upload quota, create a unique quarantine key, and bind a pending record to expected size, type, checksum, owner, and expiry. The capability is narrow in method, key, constraints, and lifetime; the client cannot choose a bucket or public prefix. A successful PUT is not publication. On completion, the service reads storage-observed metadata and object version, compares them with the intent, runs content validation and scanning, then conditionally publishes. Keys are non-reused because a presigned URL may be replayed before expiry and some stores overwrite an existing key.'
      zh: '签名前，我会认证并授权调用者，实施未完成上传配额，创建唯一的隔离键，并把 pending 记录绑定到预期大小、类型、校验和、所有者和到期时间。能力在方法、键、约束和有效期上都应收窄，客户端不能选择 bucket 或公开前缀。PUT 成功不等于发布。完成时，服务读取存储层观察到的元数据与对象版本，与上传意图比较，执行内容验证和扫描，再以条件更新发布。对象键不能复用，因为预签名 URL 在过期前可能被重放，而且部分存储会覆盖同一键。'
    topics: [backend/file-upload]
    level: advanced
    section: { en: 'Object storage', zh: '对象存储' }
    frequency: common
    tags: [presigned-url, object-key, replay, conditional-update]

  - id: file-upload-resumable-correctness
    question: { en: 'What makes a resumable multipart upload correct under retries and failures?', zh: '怎样保证可恢复 multipart upload 在重试和故障下仍然正确？' }
    answer:
      en: 'A durable session binds the owner, target key, total size, part rules, expiry, and state. Each part validates its number or byte range, actual length, and digest; retrying an accepted part is idempotent only when those properties match. Completion uses server or storage state, not the client’s list, to prove every required part exists, assemble in protocol order, and verify final size and checksum before content validation. Concurrent completion needs a conditional state transition. Abandoned sessions must be aborted or expired, and cleanup must recheck expiry so it does not race a client that has just resumed.'
      zh: '持久会话要绑定所有者、目标键、总大小、分段规则、到期时间和状态。每个分段都验证编号或字节范围、实际长度和摘要；只有这些属性一致时，重试已接收分段才是幂等的。完成操作依据服务端或存储层状态，而不是客户端列表，确认所需分段都存在，按协议顺序组装，并在内容验证前核对最终大小与校验和。并发完成需要条件状态转换。系统还要中止或清理废弃会话，且清理前重新检查到期状态，避免与刚恢复的客户端竞态。'
    topics: [backend/file-upload]
    level: advanced
    section: { en: 'Large-file reliability', zh: '大文件可靠性' }
    frequency: occasional
    tags: [multipart-upload, resumable-upload, idempotency, cleanup]

  - id: flask-request-lifecycle
    question: { en: 'Trace a Flask request from the WSGI server through cleanup.', zh: '说明 Flask 请求从 WSGI 服务器到清理结束的处理过程。' }
    answer:
      en: 'The WSGI server converts HTTP data to an environ dictionary and calls the Flask application. Flask pushes an application context and request context, opens the session, matches the URL rule, and runs before_request callbacks. Unless one returns early, Flask invokes the view and converts its return value into a Response. Error handlers may convert exceptions. after_request callbacks can replace or modify the response, then Flask saves the session and returns WSGI data. Finally it pops the contexts and runs teardown callbacks, including after unhandled failures, so cleanup must tolerate partially completed dispatch.'
      zh: 'WSGI 服务器把 HTTP 数据转换为 `environ` 字典并调用 Flask 应用。Flask 先推入应用上下文和请求上下文，打开会话、匹配 URL 规则，再运行 `before_request` 回调。若没有回调提前返回，Flask 会调用视图并把返回值转换为 `Response`；错误处理器可以转换异常。`after_request` 回调可以替换或修改响应，随后 Flask 保存会话并返回 WSGI 数据。最后框架弹出上下文并运行清理回调，即使存在未处理失败也会执行，所以清理逻辑必须容忍只完成了部分分派流程。'
    topics: [backend/flask]
    level: intermediate
    section: { en: 'Request handling', zh: '请求处理' }
    frequency: common
    tags: [flask, request-context, lifecycle]

  - id: flask-application-factory
    question: { en: 'Why use a Flask application factory with blueprints?', zh: '为什么 Flask 应用应结合蓝图使用应用工厂？' }
    answer:
      en: 'A factory makes application construction repeatable and parameterized. Tests can create one instance per case with controlled configuration, while a server can create consistently configured worker instances. Blueprints record routes and related setup without importing a particular global app; the factory registers them after loading configuration and initializing extensions. Extensions should usually be created unbound and connected with init_app for the same reason. The factory is a setup boundary, not a per-request operation: routes, hooks, error handlers, and middleware must be complete before serving begins, while migrations remain a separate deployment step.'
      zh: '应用工厂让应用构造过程可重复并可传入参数。测试可以为每个用例创建配置受控的实例，服务器也能为工作进程创建一致的实例。蓝图只记录路由和相关设置，不必导入某个全局应用；工厂在加载配置并初始化扩展后注册蓝图。出于同样原因，扩展通常先创建为未绑定对象，再通过 `init_app` 连接。工厂是设置边界，不是每个请求都会执行的操作；路由、钩子、错误处理器和中间件必须在开始服务前完成，而迁移应作为独立部署步骤。'
    topics: [backend/flask]
    level: intermediate
    section: { en: 'Application structure', zh: '应用结构' }
    frequency: common
    tags: [flask, application-factory, blueprint]

  - id: flask-context-boundary
    question: { en: 'Why should background work not use Flask request proxies?', zh: '为什么后台工作不应使用 Flask 请求代理？' }
    answer:
      en: 'request, session, g, and current_app are proxies resolved against an active context, not ordinary objects that capture current values when imported or passed. A task may run after Flask has popped the request context or in another thread or process with a different context, causing a runtime error or wrong assumptions about resource lifetime. I read and validate the required values while the request is active, convert them to explicit serializable job arguments, and let the worker acquire its own resources. Manually pushing a context is appropriate for framework integration, not for hiding an underspecified service function.'
      zh: '`request`、`session`、`g` 和 `current_app` 是根据有效上下文解析的代理，并不是在导入或传递时捕获当前值的普通对象。任务可能在 Flask 弹出请求上下文后运行，也可能位于上下文不同的线程或进程中，从而触发运行时错误，或错误判断资源生命周期。我会在请求有效时读取并验证所需值，把它们转换为显式、可序列化的任务参数，再让工作进程获取自己的资源。手工推入上下文适合框架集成，不应拿来掩盖参数定义不完整的服务函数。'
    topics: [backend/flask]
    level: intermediate
    section: { en: 'Context and concurrency', zh: '上下文与并发' }
    frequency: common
    tags: [flask, context-local, background-job]

  - id: flask-async-view-model
    question: { en: 'What does an async Flask view change under a WSGI deployment?', zh: '在 WSGI 部署下，Flask 异步视图会改变什么？' }
    answer:
      en: 'With the async extra installed, Flask can run an async view and await concurrent nonblocking operations inside that request. Under traditional WSGI, however, the request still occupies one worker while Flask runs an event loop for the view, so async def alone does not increase request concurrency. Synchronous drivers and extensions still block, and decorators must adapt coroutine views correctly. The request event loop stops when the view finishes, which cancels unfinished tasks created with asyncio.create_task. Durable work belongs in a task system; async-first workloads need deployment-level evaluation of an ASGI framework or adapter.'
      zh: '安装 `async` 额外依赖后，Flask 可以运行异步视图，并在一次请求内并发等待非阻塞操作。但在传统 WSGI 部署中，请求仍会占用一个工作单元，Flask 只是在其中为视图运行事件循环，因此单独改成 `async def` 不会增加请求并发量。同步驱动和扩展仍会阻塞，装饰器也必须正确适配协程视图。视图结束时，请求事件循环会停止，尚未完成的 `asyncio.create_task` 任务会被取消。持久工作应交给任务系统；异步优先负载则需在部署层评估 ASGI 框架或适配器。'
    topics: [backend/flask]
    level: advanced
    section: { en: 'Context and concurrency', zh: '上下文与并发' }
    frequency: occasional
    tags: [flask, async, wsgi, worker-model]

  - id: backend-start-request-lifecycle
    question: { en: 'Trace one HTTP request through a small backend.', zh: '说明一个 HTTP 请求经过小型后端的完整过程。' }
    answer:
      en: 'The server first parses the request line, headers, and optional body under size and time limits. Request-scoped middleware establishes an identifier, logging context, and authenticated principal before the router selects a handler by method and path. The handler validates transport input, calls domain logic, and uses a storage boundary that may open and commit a transaction. The result is mapped to an HTTP status, relevant headers, and a representation. Response middleware then runs and request-owned resources are released. I name failure paths at each boundary because malformed input, authorization denial, constraint conflicts, timeouts, and unknown outcomes need different responses.'
      zh: '服务器先在大小与时间限制下解析请求行、请求头和可选消息体。请求级中间件建立请求标识、日志上下文和已认证主体，路由器再按方法与路径选择处理器。处理器验证传输输入，调用领域逻辑，并通过可能开启和提交事务的存储边界读写数据。应用把结果映射为 HTTP 状态码、相关响应头和表示，然后运行响应中间件并释放请求拥有的资源。我还会说明每个边界的失败路径，因为畸形输入、授权拒绝、约束冲突、超时和结果未知需要不同响应。'
    topics: [backend/getting-started]
    level: beginner
    section: { en: 'Backend foundations', zh: '后端基础' }
    frequency: common
    tags: [request-lifecycle, middleware, transaction]

  - id: backend-start-validation-layers
    question: { en: 'How do transport validation, domain rules, authorization, and database constraints differ?', zh: '传输验证、领域规则、授权与数据库约束有何区别？' }
    answer:
      en: 'Transport validation asks whether untrusted input has the expected shape, types, encoding, and limits. Domain rules ask whether a valid command makes sense in the current business state, such as whether a project is still open. Authorization asks whether the authenticated principal may perform that operation on that resource; a caller-supplied owner ID is not proof. Database constraints protect durable invariants for every writer and close races that an application check cannot. I keep all four layers: early validation produces useful client errors, while constraints remain the final integrity boundary. Tests should show which layer rejects each invalid case.'
      zh: '传输验证判断不可信输入是否符合预期结构、类型、编码和限制。领域规则判断一个格式有效的命令在当前业务状态下是否成立，例如项目是否仍开放。授权判断已认证主体能否对该资源执行操作，调用方提供的所有者 ID 不能作为证明。数据库约束保护所有写入者都必须遵守的持久不变量，并关闭应用检查无法消除的竞态。这四层都要保留：前置验证提供有用的客户端错误，约束则是最终完整性边界。测试应明确每个无效用例由哪一层拒绝。'
    topics: [backend/getting-started]
    level: intermediate
    section: { en: 'Backend foundations', zh: '后端基础' }
    frequency: common
    tags: [validation, authorization, constraint, invariant]

  - id: backend-start-memory-versus-persistence
    question: { en: 'When is process memory appropriate in a backend, and when is durable storage required?', zh: '后端何时适合使用进程内存，何时必须使用持久存储？' }
    answer:
      en: 'Process memory is appropriate for request-local values and caches that the service can rebuild after loss. It is not a durable system of record: a restart clears it, separate worker processes have different copies, and concurrent updates need coordination. Orders, permissions, balances, and other business facts that must survive or be shared belong in durable storage. The storage choice must support the needed constraints, transactions, and recovery behavior. A cache may copy durable data, but its invalidation and stale-read policy must be explicit. I also keep request context out of mutable module globals because concurrent requests can overwrite one another even inside one process.'
      zh: '进程内存适合请求局部值，以及丢失后可以重建的缓存。它不是持久事实来源：重启会清空数据，不同工作进程各有副本，并发更新也需要协调。订单、权限、余额等必须长期存在或由多个进程共享的业务事实，应进入持久存储；存储还要支持所需约束、事务和恢复行为。缓存可以复制持久数据，但必须明确失效规则与陈旧读取策略。请求上下文也不能放在可变模块全局变量中，因为即使只有一个进程，并发请求仍会相互覆盖。'
    topics: [backend/getting-started]
    level: beginner
    section: { en: 'State and persistence', zh: '状态与持久化' }
    frequency: common
    tags: [persistence, process-memory, request-context]

  - id: backend-start-unknown-outcome
    question: { en: 'What should a backend do when a client may retry after an unknown outcome?', zh: '客户端可能在结果未知后重试时，后端应该怎样处理？' }
    answer:
      en: 'A lost response does not prove that the operation failed; the server may have committed before the connection broke. Safe or idempotent methods already define repeat semantics, but a create-style POST needs an application protocol. I accept a caller-stable idempotency key, scope it to the authenticated principal or tenant, and atomically store the key, a request fingerprint, and the operation result with the durable change. Repeating the same key and content replays that result, while different content under the key is rejected. The retention window is part of the contract. External side effects may also require an outbox or provider-level deduplication.'
      zh: '响应丢失不能证明操作失败，因为服务器可能在连接断开前已经提交。安全或幂等方法已有重复语义，创建型 POST 则需要应用协议。我会接受调用方稳定提供的幂等键，把它限定到已认证主体或租户，并把该键、请求指纹、操作结果与持久变更原子保存。使用相同键和相同内容重试时重放原结果；相同键配合不同内容则拒绝。保留窗口也属于公开契约。涉及外部副作用时，还可能需要 outbox 或下游提供者的去重能力。'
    topics: [backend/getting-started]
    level: intermediate
    section: { en: 'Failure and retries', zh: '失败与重试' }
    frequency: common
    tags: [unknown-outcome, idempotency-key, retry, outbox]

  - id: graphql-request-execution
    question: { en: 'Trace a GraphQL request from document to response.', zh: '说明 GraphQL 请求从文档到响应的处理过程。' }
    answer:
      en: 'The server parses the document, selects the requested operation, and validates fields, arguments, variables, fragments, and selection rules against the schema. It coerces variable values before execution. The executor starts at the relevant root type, collects fields by response key, and invokes resolvers with parent data, arguments, request context, and execution information. Child selections continue from returned values. The server serializes the result under data and records execution failures under errors with paths. Invalid documents do not execute resolvers, while field failures may still leave partial data when nullable boundaries contain them.'
      zh: '服务端先解析文档，选择指定操作，再根据模式验证字段、参数、变量、片段和选择规则。变量值经过强制转换后才进入执行。执行器从对应根类型开始，按响应键收集字段，并用父数据、参数、请求上下文和执行信息调用 resolver；返回值上的子选择继续递归执行。服务端把结果序列化到 data，并把执行故障及其路径写入 errors。无效文档不会执行 resolver；字段故障若被可空边界截住，响应仍可保留部分数据。'
    topics: [backend/graphql]
    level: intermediate
    section: { en: 'GraphQL execution', zh: 'GraphQL 执行' }
    frequency: common
    tags: [graphql, validation, resolver, execution]

  - id: graphql-nullability-boundary
    question: { en: 'How does GraphQL null bubbling affect schema design?', zh: 'GraphQL 的空值传播如何影响模式设计？' }
    answer:
      en: 'A nullable field may return null as ordinary data. If a Non-Null field returns null or throws, execution records an error and replaces the nearest nullable parent with null; propagation reaches the root when every parent on that path is Non-Null. I therefore treat each exclamation mark as a failure-boundary decision, not as a copy of a database constraint or TypeScript property. Remote outages, authorization redaction, and historical rows can all break an internal guarantee. I test the response data and error path for every important resolver failure, especially inside lists where one Non-Null item can null the list.'
      zh: '可空字段可以把 null 作为普通数据返回。非空字段返回 null 或抛错时，执行器记录错误，并把最近的可空父级设为 null；若路径上的父级全部非空，传播会一直到根。我把每个感叹号都视为故障边界决策，而不是数据库约束或 TypeScript 属性的复制。远程故障、授权脱敏与历史数据都可能破坏内部保证。我会为关键 resolver 故障同时测试响应数据与错误路径，尤其关注列表，因为一个非空元素失败就可能让整个列表变成 null。'
    topics: [backend/graphql]
    level: intermediate
    section: { en: 'Schema design', zh: '模式设计' }
    frequency: common
    tags: [graphql, nullability, partial-data]

  - id: graphql-dataloader-contract
    question: { en: 'How does a request-scoped DataLoader address N+1 reads, and what contract must its batch function keep?', zh: '请求级 DataLoader 如何处理 N+1 读取，批量函数必须遵守什么契约？' }
    answer:
      en: 'Sibling field resolvers call load with keys instead of querying the backend directly. DataLoader groups calls in a scheduling window and memoizes repeated keys, so one batch read can satisfy many fields. The batch function must return an array equal in length to the input keys and aligned in exactly the same order, including null or Error entries for missing values. Database IN queries rarely guarantee that order, so I map by key and reorder. I create loaders per request and authorization scope; a global loader can leak protected or stale data. After a mutation, I clear or prime affected request keys.'
      zh: '同级字段 resolver 不直接查询后端，而是把键交给 load。DataLoader 会合并一个调度窗口中的调用并记忆重复键，因此一次批量读取可以满足多个字段。批量函数返回的数组必须与输入键等长并严格同序，缺失值也要用 null 或 Error 占位。数据库的 IN 查询通常不保证顺序，所以我会先按键建立映射再重排。加载器应按请求与授权范围创建；全局加载器可能泄漏受保护或陈旧数据。Mutation 更新实体后，还要清除或填充受影响的请求级键。'
    topics: [backend/graphql]
    level: advanced
    section: { en: 'Data fetching', zh: '数据获取' }
    frequency: common
    tags: [graphql, n-plus-one, data-loader, batching]

  - id: graphql-operation-cost
    question: { en: 'Why is a GraphQL depth limit insufficient, and how would you bound operation cost?', zh: '为什么 GraphQL 深度限制不够，应该怎样约束操作成本？' }
    answer:
      en: 'Depth captures only one dimension. A shallow document can repeat an expensive field under hundreds of aliases, request a huge page, expand fragments, or fan out to remote services. I first cap document size, aliases, and pagination. Then I compute schema-aware cost before execution: fields have weights, list fields multiply child cost by a bounded size, and exceptional search or report fields get explicit budgets. Trusted documents reduce arbitrary input but still need cost checks. Runtime timeouts, downstream limits, and measured call counts remain necessary because a static model cannot predict every data-dependent path.'
      zh: '深度只描述一个维度。浅层文档仍可通过数百个别名重复昂贵字段，请求巨大分页，展开片段，或向远程服务扇出。我会先限制文档大小、别名数和分页，再在执行前计算理解模式的成本：字段带权重，列表字段按受限大小放大子选择成本，搜索或报表字段使用独立预算。受信任文档能减少任意输入，但仍要检查成本。运行时超时、下游限制和实测调用数仍然必要，因为静态模型无法预测所有依赖数据的路径。'
    topics: [backend/graphql]
    level: advanced
    section: { en: 'API security', zh: 'API 安全' }
    frequency: occasional
    tags: [graphql, operation-cost, trusted-document, denial-of-service]

  - id: grpc-call-lifecycle
    question: { en: 'What happens during a unary gRPC call, and why can client and server disagree about its result?', zh: '一元 gRPC 调用经历哪些步骤，客户端与服务端为什么可能对结果判断不一致？' }
    answer:
      en: 'The generated client serializes a typed request with method metadata and an optional deadline. The channel resolves a target, selects a connection, and sends the RPC; the server runtime decodes it, invokes the handler, then returns a response or final status with optional trailing metadata. Client and server judge completion locally. A server can commit a mutation and send a response after the client deadline has expired, so the client sees DEADLINE_EXCEEDED although the change happened. Cancellation asks work to stop but does not roll back committed effects, which is why mutations need explicit unknown-outcome handling.'
      zh: '生成客户端会序列化强类型请求，并附上方法 metadata 与可选截止时间。通道解析目标、选择连接并发送 RPC；服务端运行库解码请求、调用处理器，再返回响应或最终状态以及可选的尾随 metadata。客户端与服务端各自在本地判断调用是否完成。服务端可能已经提交修改并发送响应，但客户端截止时间先到，因此客户端看到 DEADLINE_EXCEEDED，修改却已经发生。取消只要求工作停止，不会回滚已提交副作用，所以修改操作必须明确处理结果未知的情况。'
    topics: [backend/grpc]
    level: intermediate
    section: { en: 'RPC lifecycle', zh: 'RPC 生命周期' }
    frequency: common
    tags: [grpc, deadline, cancellation, unknown-outcome]

  - id: grpc-protobuf-evolution
    question: { en: 'How do you evolve a Protocol Buffers contract without breaking deployed gRPC clients?', zh: '怎样演进 Protocol Buffers 契约而不破坏已部署的 gRPC 客户端？' }
    answer:
      en: 'Treat field numbers as permanent wire identities. Additive fields are usually readable by old clients, but their default values still need safe business meaning. When removing a field, reserve both its number and name; never reuse or reorder numbers. A type change that shares a wire type can still alter overflow, signedness, or semantics, so add a new field and migrate readers and writers in stages. Test old-client/new-server and new-client/old-server combinations, including unknown enum values and intermediaries that deserialize and reserialize messages. Descriptor compatibility checks help, but they cannot prove authorization rules or behavioral compatibility.'
      zh: '字段编号应视为永久线上身份。新增字段通常能被旧客户端读取或忽略，但该字段的默认值仍需具备安全的业务含义。删除字段时，要同时保留原编号与名称，不能复用编号或为整齐而重新编号。某些类型虽然共用 wire type，仍可能改变溢出、符号或业务语义，因此应新增字段，并分阶段迁移读写方。测试要覆盖旧客户端配新服务端、新客户端配旧服务端、未知枚举值，以及会反序列化再序列化消息的中间服务。描述符兼容检查有帮助，却不能证明授权规则或行为兼容。'
    topics: [backend/grpc]
    level: advanced
    section: { en: 'Schema compatibility', zh: '模式兼容性' }
    frequency: common
    tags: [grpc, protobuf, field-number, compatibility]

  - id: grpc-retry-safety
    question: { en: 'How do you decide whether a failed gRPC call may be retried?', zh: '怎样判断失败的 gRPC 调用是否可以重试？' }
    answer:
      en: 'Start with operation semantics, not only the status code. UNAVAILABLE may be transient, but it does not prove that a server skipped a mutation; DEADLINE_EXCEEDED can arrive after a commit. A read is often safe to retry within the remaining budget. A mutation needs idempotent semantics, commonly a caller-stable request ID atomically stored with a request fingerprint and result. Bound attempts, exponential backoff, and the total deadline, and audit retries in proxies, SDKs, business loops, and queues together. Reject reuse of one idempotency key with different content, and define how long deduplication records remain valid.'
      zh: '判断应从操作语义开始，不能只看状态码。UNAVAILABLE 可能表示暂时故障，却不能证明服务端没有执行修改；DEADLINE_EXCEEDED 也可能在提交后出现。读取操作通常可以在剩余预算内重试。修改操作需要幂等语义，常见做法是由调用方稳定提供请求 ID，服务端把它与请求指纹及结果原子保存。还要限制尝试次数、指数退避和总截止时间，并一起审计代理、SDK、业务循环与队列中的重试。相同幂等键配合不同内容时应拒绝，同时要定义去重记录的有效期。'
    topics: [backend/grpc]
    level: advanced
    section: { en: 'Failure and retries', zh: '失败与重试' }
    frequency: common
    tags: [grpc, retry, idempotency, status-code]
