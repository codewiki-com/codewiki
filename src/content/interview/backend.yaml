track: backend
items:
  - id: jwt-signature-versus-validation
    question: { en: 'Why is a valid JWT signature insufficient for authentication?', zh: '为什么 JWT 签名有效仍不足以完成身份认证？' }
    answer: { en: 'A signature protects bytes under a key; the verifier must also bind that key to a trusted issuer and validate audience, token type, time claims, required claim types, and application status before creating an identity.', zh: '签名只说明字节受到某把密钥保护；验证器还要把密钥绑定到可信签发者，并检查受众、令牌类型、时间声明、必需声明类型和应用状态，才能建立身份。' }
    topics: [backend/jwt-authentication]
    level: intermediate
    tags: [jwt, claim-validation]

  - id: jwt-hmac-versus-asymmetric
    question: { en: 'What trust-boundary difference separates HS256 from an asymmetric JWT signature?', zh: 'HS256 与非对称 JWT 签名在信任边界上有什么区别？' }
    answer: { en: 'Every HS256 verifier holds the shared secret and can therefore issue tokens. With an asymmetric algorithm, the issuer can retain the private key while distributing public verification keys, so verifiers need not gain signing power.', zh: '每个 HS256 验证者都持有共享秘密，因此也能签发令牌。非对称算法让签发者保留私钥，只分发验证公钥，所以验证者不必获得签发能力。' }
    topics: [backend/jwt-authentication]
    level: intermediate
    tags: [jwt, key-management]

  - id: refresh-token-replay
    question: { en: 'How does refresh token rotation detect replay, and what should happen after detection?', zh: '刷新令牌轮换如何检测重放，发现重放后应怎样处理？' }
    answer: { en: 'Each refresh consumes the old value and issues one successor while retaining their family relationship. Reuse of an inactive value signals possible theft; revoke the active family and require a new authorization because the server cannot identify which caller is legitimate.', zh: '每次刷新都会消费旧值、签发唯一后继值，并保留令牌族关系。已失效值再次出现说明可能被窃取；服务器无法判断哪一方合法，因此应撤销活动令牌族并要求重新授权。' }
    topics: [backend/jwt-authentication]
    level: advanced
    tags: [refresh-token, replay-detection]

  - id: api-resource-contract
    question: { en: 'What belongs in an HTTP API operation contract besides its URL?', zh: '除了 URL，HTTP API 的操作契约还应包含什么？' }
    answer:
      en: 'The contract names the method, target resource, accepted headers and media types, parameter constraints, authentication and resource-level authorization rules, success representation, failure statuses, and relevant response headers. It also states behavior across time: whether a request is safe or idempotent, how a client retries an unknown result, how concurrent writes are detected, and how pagination remains ordered. OpenAPI can describe much of the message shape, but transaction boundaries and domain invariants still need prose and scenario tests. I review the complete observable HTTP exchange, not only the JSON schema.'
      zh: '契约要说明方法、目标资源、接受的响应头与媒体类型、参数约束、认证和资源级授权规则、成功表示、失败状态码以及相关响应头。它还要定义跨时间行为：请求是否安全或幂等，客户端如何重试结果未知的操作，怎样检测并发写入，以及分页如何保持顺序。OpenAPI 能描述大部分消息形状，但事务边界与领域不变量仍需要文字和场景测试。我会审查完整且可观察的 HTTP 交换，而不只看 JSON 模式。'
    topics: [backend/api-design]
    level: intermediate
    section: { en: 'HTTP API contracts', zh: 'HTTP API 契约' }
    frequency: common
    tags: [api-design, contract, http]

  - id: api-safe-versus-idempotent
    question: { en: 'How do safe and idempotent HTTP methods differ, and what does that mean for retries?', zh: 'HTTP 的安全方法与幂等方法有何区别，这对重试意味着什么？' }
    answer:
      en: 'A safe method has essentially read-only requested semantics, so the client does not ask for a state change. An idempotent method may change state, but repeating the identical request has the same intended effect as sending it once. GET is both; PUT and DELETE are idempotent but unsafe. Incidental logging does not change those classifications, and repeated responses need not be identical. Idempotency supports retry after a connection failure, but the client must preserve the same request. Retrying POST needs an application protocol, typically a caller-stable key backed by atomic deduplication and a stored result.'
      zh: '安全方法的请求语义基本只读，因此客户端没有要求改变状态。幂等方法可以修改状态，但重复发送相同请求时，预期效果与发送一次相同。GET 同时具备两种性质；PUT 和 DELETE 幂等但不安全。附带日志不会改变分类，多次响应也不必完全相同。幂等性支持在连接失败后重试，但客户端必须保持请求不变。重试 POST 需要应用协议，通常由调用方提供稳定键，服务端以原子去重和已保存结果作为支撑。'
    topics: [backend/api-design]
    level: intermediate
    section: { en: 'HTTP semantics', zh: 'HTTP 语义' }
    frequency: common
    tags: [safe-method, idempotency, retry]

  - id: api-etag-lost-update
    question: { en: 'How does an ETag prevent a lost update?', zh: 'ETag 如何防止丢失更新？' }
    answer:
      en: 'The server returns a strong ETag for the selected representation. A client that edits that representation sends the tag in If-Match with its PUT, PATCH, or DELETE. The server compares the precondition against the current entity tag and performs the mutation only on a match; a stale tag normally produces 412 Precondition Failed. The important implementation detail is atomicity. Reading a version, comparing it in application code, and then issuing an unconditional write leaves a race. Use a conditional database update or transaction, and return the new ETag after success so later edits have a fresh validator.'
      zh: '服务端为选定表示返回强 ETag。客户端修改该表示时，在 PUT、PATCH 或 DELETE 请求的 If-Match 中带上此标签。服务端把前置条件与当前实体标签比较，只有匹配时才执行修改；标签过期通常返回 412 Precondition Failed。实现重点是原子性。先读取版本、在应用代码中比较、再执行无条件写入，仍会留下竞态窗口。应使用数据库条件更新或事务，并在成功后返回新 ETag，让后续编辑获得新的验证器。'
    topics: [backend/api-design]
    level: intermediate
    section: { en: 'Concurrency control', zh: '并发控制' }
    frequency: common
    tags: [etag, if-match, lost-update]

  - id: api-cursor-pagination
    question: { en: 'What makes cursor pagination correct under changing data?', zh: '数据持续变化时，怎样保证游标分页正确？' }
    answer:
      en: 'First define a deterministic total order, ending with a unique tie-breaker such as an ID. The cursor encodes the last ordering tuple, direction, and any filter or sort version needed to resume the same query. The service validates and bounds the page size, treats the token as opaque to clients, and rejects malformed or mismatched tokens. This avoids ambiguity among equal sort values, but it does not create snapshot consistency by itself. If one traversal must observe one snapshot, bind the cursor to a database snapshot or watermark and specify its expiration and behavior after inserts or deletes.'
      zh: '先定义确定的全序，并以 ID 等唯一字段作为最后的决胜条件。游标编码上一条记录的排序元组、方向，以及继续同一查询所需的过滤条件或排序版本。服务端要验证并限制页大小，让客户端把令牌视为不透明值，并拒绝格式错误或条件不匹配的令牌。这样能消除相同排序值之间的歧义，但不会自动提供快照一致性。如果一次遍历必须观察同一快照，就要把游标绑定到数据库快照或水位线，并定义过期时间以及插入、删除后的行为。'
    topics: [backend/api-design]
    level: advanced
    section: { en: 'Pagination', zh: '分页' }
    frequency: occasional
    tags: [cursor-pagination, ordering, consistency]
