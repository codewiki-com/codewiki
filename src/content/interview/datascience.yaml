track: datascience
items:
  - id: matplotlib-object-model
    question: { en: 'How do Figure, Axes, Axis, and Artist differ in Matplotlib?', zh: 'Matplotlib 中的 Figure、Axes、Axis 与 Artist 有什么区别？' }
    answer:
      en: 'A Figure is the complete output container and owns the canvas, layout, and one or more Axes. An Axes is one plotting area; most commands such as plot, bar, set_title, and legend belong there. Each Axes normally has x and y Axis objects that manage scales, tick locations, formatters, and tick labels. Artist is the shared base concept for visible elements such as lines, rectangles, text, legends, and images. This hierarchy matters because explicit ownership tells you where an update, label, or save operation will take effect.'
      zh: 'Figure 是完整的输出容器，拥有画布、布局和一个或多个 Axes。Axes 是单个绘图区，plot、bar、set_title 和 legend 等常用操作都属于它。每个 Axes 通常包含 x、y 两个 Axis 对象，负责尺度、刻度位置、formatter 与刻度标签。Artist 是折线、矩形、文字、图例和图像等可见元素的共同抽象。理解这套层级后，就能明确一次更新、标签设置或保存操作究竟作用于哪个对象。'
    topics: [datascience/matplotlib]
    level: beginner
    section: { en: 'Python visualization', zh: 'Python 可视化' }
    frequency: common
    tags: [matplotlib, figure, axes, artist]

  - id: matplotlib-oo-versus-pyplot
    question: { en: 'Why is Matplotlib’s object-oriented interface preferred in reusable code?', zh: '为什么可复用代码更适合使用 Matplotlib 的面向对象接口？' }
    answer:
      en: 'Pyplot maintains a current Figure and current Axes, which is convenient for a short interactive session but makes behavior depend on call order. Reusable code is clearer when it receives an Axes, adds artists through ax methods, and saves through the owning Figure. That design works unchanged when a plot moves into a multi-panel layout and lets tests inspect the exact objects created. Pyplot still has a role in constructing and closing figures. The important distinction is explicit ownership, not a ban on importing matplotlib.pyplot.'
      zh: 'Pyplot 会维护当前 Figure 和当前 Axes。短暂的交互式操作很方便，但函数行为会依赖调用顺序。可复用代码更适合接收一个 Axes，通过 ax 方法添加图元，再由所属 Figure 保存。图表以后移入多面板布局时，这种设计无需改写，测试也能检查实际创建的对象。Pyplot 仍可负责创建和关闭图形。重点是让所有权明确，而不是禁止导入 matplotlib.pyplot。'
    topics: [datascience/matplotlib]
    level: intermediate
    section: { en: 'Python visualization', zh: 'Python 可视化' }
    frequency: common
    tags: [pyplot, object-oriented-api, ownership]

  - id: matplotlib-shared-color-normalization
    question: { en: 'How do you make color comparable across multiple Matplotlib panels?', zh: '怎样让多个 Matplotlib 面板中的颜色可以互相比较？' }
    answer:
      en: 'Use one normalization object and one colormap for every comparable artist. The normalization maps domain values into the colormap range, so shared vmin, vmax, and any midpoint guarantee that one value receives one color across panels. Add a common colorbar with the measurement unit. Do not let each scatter or image infer limits independently, because identical colors can then mean different values. Choose limits from domain thresholds or a predefined comparison range, and decide explicitly whether out-of-range values are clipped, extended on the colorbar, or rejected.'
      zh: '所有需要比较的图元应使用同一个归一化对象和同一个 colormap。归一化会把领域数值映射到颜色范围，因此共享 vmin、vmax 和必要的中点，才能保证同一数值在各面板中得到同一颜色。还应添加一根带单位的公共颜色条。不要让每个散点图或图像各自推断范围，否则相同颜色可能代表不同数值。范围应来自领域阈值或预先定义的比较区间，并明确决定越界值是裁剪、在颜色条上扩展，还是拒绝。'
    topics: [datascience/matplotlib]
    level: intermediate
    section: { en: 'Visual encoding', zh: '视觉编码' }
    frequency: occasional
    tags: [colormap, normalization, colorbar]

  - id: matplotlib-headless-lifecycle
    question: { en: 'What makes Matplotlib batch rendering reliable in a headless service?', zh: '怎样让 Matplotlib 在无显示服务中可靠地批量渲染？' }
    answer:
      en: 'Choose a non-interactive backend such as Agg at process startup, before importing pyplot or creating figures. Give each request or job explicit ownership of its Figure, save through fig.savefig, and close that exact Figure in a finally block. Avoid mutating global rcParams from library functions; use rc_context for bounded style changes. Validate the generated file rather than assuming a successful call proves its dimensions or format. Tests should run without a display, force a save failure, and assert that pyplot has no leftover figure numbers afterward.'
      zh: '应在进程启动时、导入 pyplot 或创建图形之前选择 Agg 等非交互式后端。每个请求或任务都明确拥有自己的 Figure，通过 fig.savefig 保存，并在 finally 中关闭这个 Figure。库函数不要修改全局 rcParams；临时样式应放进 rc_context。不能只凭调用成功就假定尺寸和格式正确，还要检查生成文件。测试需要在无显示环境运行，主动制造保存失败，并断言结束后 pyplot 没有遗留任何图形编号。'
    topics: [datascience/matplotlib]
    level: advanced
    section: { en: 'Rendering and lifecycle', zh: '渲染与生命周期' }
    frequency: occasional
    tags: [backend, headless, cleanup, batch-rendering]

  - id: numpy-array-contract
    question: { en: 'What information makes up the practical contract of a NumPy array?', zh: 'NumPy 数组的实用契约包含哪些信息？' }
    answer:
      en: 'Start with shape, dtype, and the meaning of every axis. Shape alone is not enough: a matrix shaped (32, 10) could mean samples by features or time by sensors. Ownership belongs in the contract too, because a basic slice may share its buffer while advanced indexing returns a copy. For numerical code, add policies for empty axes, NaN and infinity, integer range, and acceptable floating tolerance. A reliable function states its input and output shapes relative to named axes and documents whether it mutates, returns a view, or allocates an independent result.'
      zh: '首先要说明形状、数据类型以及每个轴的含义。仅有形状还不够，因为同样的 (32, 10) 既可能表示“样本 × 特征”，也可能表示“时间 × 传感器”。契约还应包含所有权：基本切片可能共享缓冲区，高级索引则返回副本。数值代码还要规定空轴、NaN、无穷、整数范围和浮点容差的处理方式。可靠的函数会按具名轴说明输入输出形状，并明确它会原地修改、返回视图，还是分配独立结果。'
    topics: [datascience/numpy]
    level: beginner
    section: { en: 'Python arrays', zh: 'Python 数组' }
    frequency: common
    tags: [numpy, ndarray, shape, dtype, ownership]

  - id: numpy-broadcasting-rules
    question: { en: 'How does NumPy broadcasting work, and how can a valid broadcast still be wrong?', zh: 'NumPy 广播如何工作，为什么合法广播仍可能出错？' }
    answer:
      en: 'NumPy compares shapes from the trailing axes. Two axis lengths are compatible when they are equal or one is 1, and missing leading axes behave as length 1. The result takes the larger length on each compatible axis. That mechanical rule knows nothing about domain meaning. Adding shapes (n, 1) and (n,) is legal but produces (n, n), which is often an accidental outer operation. I predict the result shape first, keep reduced axes when useful, test with non-square dimensions, and name each axis in the interface rather than trusting an expression merely because it runs.'
      zh: 'NumPy 会从尾轴开始比较形状。两个轴长度相等，或者其中一个为 1 时就兼容；缺失的左侧轴按长度 1 处理。结果在每个兼容轴上取较大的长度。这套机械规则不理解领域含义，因此 `(n, 1)` 与 `(n,)` 相加虽然合法，却会得到常常出乎意料的 `(n, n)`。我会先预测结果形状，必要时保留被聚合的轴，用非方形维度测试，并在接口中命名每个轴，而不是因为表达式能运行就相信它。'
    topics: [datascience/numpy]
    level: intermediate
    section: { en: 'Array semantics', zh: '数组语义' }
    frequency: common
    tags: [numpy, broadcasting, shape, axes]

  - id: numpy-views-and-copies
    question: { en: 'When does NumPy return a view rather than a copy, and why does the distinction matter?', zh: 'NumPy 何时返回视图而不是副本，这个区别为什么重要？' }
    answer:
      en: 'Basic slicing usually returns a view that shares the source buffer, while integer-array and Boolean indexing return copies. Reshape and ravel may return either, depending on layout; flatten always copies. The distinction matters because writing through a view can mutate data owned by the caller, while copying changes allocation and isolates later writes. I use np.shares_memory when overlap must be established and call copy explicitly at an ownership boundary. Function documentation and tests should say whether input may change and should modify both input and output to verify the promised relationship.'
      zh: '基本切片通常返回与原数组共享缓冲区的视图，整数数组索引与布尔索引则返回副本。reshape 和 ravel 会根据内存布局返回视图或副本，flatten 总是复制。这个区别决定了写入视图是否会修改调用者的数据，也决定了是否分配新缓冲区。需要确认重叠时我会使用 np.shares_memory，在所有权边界则显式调用 copy。函数文档和测试都应说明输入是否可能改变，并分别修改输入与输出，验证承诺的关系。'
    topics: [datascience/numpy]
    level: intermediate
    section: { en: 'Memory and ownership', zh: '内存与所有权' }
    frequency: common
    tags: [numpy, view, copy, indexing, memory]

  - id: numpy-numerical-pipeline-review
    question: { en: 'What do you review before trusting a generated NumPy preprocessing pipeline?', zh: '信任生成的 NumPy 预处理管道前，应审查哪些内容？' }
    answer:
      en: 'I trace shape, dtype, axis meaning, and ownership after every operation. Then I look for broadcasts that are legal but semantically wrong, integer arrays used for in-place division, matrix multiplication written as element-wise multiplication, and basic slices modified as temporary copies. Boundary tests include empty input, one row, constant columns, NaN, infinity, extreme integer values, and non-contiguous views. Random work should receive a Generator instead of resetting global state. Finally, I run a tiny non-square example by hand and compare it with the code, because equal dimensions can hide an axis error surprisingly well.'
      zh: '我会跟踪每次操作后的形状、数据类型、轴含义与所有权，然后查找语义错误但形状合法的广播、整数数组上的原地除法、误写成逐元素乘法的矩阵乘法，以及被当作临时副本修改的基本切片。边界测试应覆盖空输入、单行、常数列、NaN、无穷、整数极值和非连续视图。随机操作应接收 Generator，而不是重置全局状态。最后用一个可手算的非方形样本对照代码，因为相等维度很容易掩盖轴错误。'
    topics: [datascience/numpy]
    level: advanced
    section: { en: 'Generated code review', zh: '生成代码审查' }
    frequency: occasional
    tags: [numpy, code-review, numerical-correctness, ai-generated-code]

  - id: pandas-dataframe-contract
    question: { en: 'What belongs in the contract of a DataFrame passed between pipeline stages?', zh: '数据流程阶段之间传递 DataFrame 时，契约应包含什么？' }
    answer:
      en: 'I specify required columns, each column’s dtype and meaning, the row index semantics, and which keys must be unique. The contract also states whether missing values are allowed, how unknown categories are represented, and whether the function may mutate its input. For a transformation, I describe the output shape relative to the input and name invariants such as conserved revenue or preserved left-side orders. At runtime I validate these properties at boundaries, because a DataFrame can have the expected column names while still carrying reordered labels, duplicate keys, or silently promoted dtypes.'
      zh: '我会说明必需列、每列的数据类型与含义、行索引语义，以及哪些键必须唯一。契约还应规定是否允许缺失值、未知分类怎样表示、函数能否修改输入。对于转换操作，要说明输出形状与输入的关系，并写出收入总额守恒、保留左侧全部订单等不变量。运行时应在边界验证这些属性，因为 DataFrame 即使列名正确，也可能带有乱序标签、重复键或被静默提升的数据类型。'
    topics: [datascience/pandas-guide]
    level: intermediate
    section: { en: 'Tabular data contracts', zh: '表格数据契约' }
    frequency: common
    tags: [pandas, dataframe, schema, invariants]

  - id: pandas-loc-and-copy-on-write
    question: { en: 'How do .loc and Copy-on-Write affect assignment in pandas 3.0?', zh: '.loc 与写时复制怎样影响 pandas 3.0 中的赋值？' }
    answer:
      en: 'Copy-on-Write makes an object derived from another pandas object behave like a copy: changing the derived object does not update the source. That makes chained assignment such as df[mask]["status"] = value incapable of changing df, because the second operation writes to an intermediate object. I use df.loc[mask, "status"] = value to name the target rows and column in one operation. If the API should return an independent result, I copy explicitly and return it. Tests compare both source and result after assignment so the ownership promise is observable rather than inferred.'
      zh: '写时复制让从另一个 pandas 对象派生出的对象在使用者看来表现为副本，修改派生对象不会更新源对象。因此，`df[mask]["status"] = value` 这样的链式赋值无法修改 `df`，第二次操作只写入中间对象。我会用 `df.loc[mask, "status"] = value` 在一次操作中指定目标行与列。如果 API 应返回独立结果，就显式复制后再返回。测试需要在赋值后同时比较源对象与结果，让所有权承诺可以观察，而不是靠猜测。'
    topics: [datascience/pandas-guide]
    level: intermediate
    section: { en: 'Selection and ownership', zh: '选择与所有权' }
    frequency: common
    tags: [pandas, loc, copy-on-write, assignment]

  - id: pandas-aggregation-transform-apply
    question: { en: 'When should you use agg, transform, or apply after groupby?', zh: 'groupby 之后应在什么情况下使用 agg、transform 或 apply？' }
    answer:
      en: 'I choose by the required output shape. agg produces one or more summary values per group and usually reduces rows; named aggregation also fixes the output column names. transform returns a result aligned to the original index, so it fits group totals, shares, ranks, and centered values that must be assigned back to each row. apply is the escape hatch for operations whose result cannot be expressed by built-in aggregation or transformation. Before using it, I state the expected index and shape explicitly and check whether direct column operations express the rule more clearly.'
      zh: '我会根据所需输出形状选择。`agg` 为每组生成一个或多个摘要值，通常会减少行数；命名聚合还能固定输出列名。`transform` 返回与原索引对齐的结果，适合需要回填到每行的组总额、占比、排名或中心化值。只有当内置聚合与转换无法表达结果时，才把 `apply` 当作出口。使用前要明确预期索引与形状，并检查直接的列操作能否更清楚地表达规则。'
    topics: [datascience/pandas-guide]
    level: intermediate
    section: { en: 'Grouping and aggregation', zh: '分组与聚合' }
    frequency: common
    tags: [pandas, groupby, aggregation, transform]

  - id: pandas-safe-merge
    question: { en: 'How do you make a pandas merge safe against silent row multiplication?', zh: '怎样防止 pandas 连接静默扩增行数？' }
    answer:
      en: 'I start by naming the intended cardinality: one-to-one, one-to-many, many-to-one, or genuinely many-to-many. Then I check key nulls and uniqueness on the constrained side and pass the matching validate value to merge. I often add indicator=True during validation to count left-only, right-only, and matched rows. After the merge I compare row counts and domain totals that should be preserved. I also handle null keys explicitly because pandas can match null keys across both inputs, unlike common SQL behavior. Normalizing case or whitespace belongs before these checks, not after the join.'
      zh: '我会先明确预期基数：一对一、一对多、多对一，或确实需要的多对多。随后检查键的空值和受约束一侧的唯一性，并把对应 `validate` 值传给 `merge`。验证期间通常加入 `indicator=True`，统计只来自左侧、只来自右侧和两侧匹配的行。连接后比较行数与应保持的业务总额。空键策略也要明确，因为 pandas 会匹配两侧空键，这与常见 SQL 行为不同。大小写和空格规范化应在这些检查前完成。'
    topics: [datascience/pandas-guide]
    level: advanced
    section: { en: 'Joins and integrity', zh: '连接与完整性' }
    frequency: common
    tags: [pandas, merge, cardinality, data-integrity]

  - id: polars-eager-versus-lazy
    question: { en: 'How do DataFrame and LazyFrame differ in Polars, and where should collect appear?', zh: 'Polars 中的 DataFrame 与 LazyFrame 有什么区别，collect 应该出现在哪里？' }
    answer:
      en: 'A DataFrame contains materialized columns, so eager operations run as they are called. A LazyFrame contains a logical query plan. Methods add scan, filter, projection, aggregation, and join nodes until collect executes the plan and returns a DataFrame. I use eager mode for small data already in memory and lazy scans for file pipelines that can benefit from whole-plan optimization. Reusable transformations should normally accept and return LazyFrame objects. I put collect or a sink at an application boundary where I can observe I/O, memory use, schema errors, and post-execution invariants.'
      zh: 'DataFrame 包含已经物化的列，因此即时操作会在调用时执行。LazyFrame 保存逻辑查询计划，方法调用只会继续添加扫描、过滤、投影、聚合与连接节点，直到 collect 执行计划并返回 DataFrame。小型内存数据适合即时模式，能利用全计划优化的文件流程则适合惰性扫描。可复用转换通常应接收并返回 LazyFrame。我会把 collect 或 sink 放在应用边界，这样输入输出、内存占用、模式错误和执行后的不变量都能被观察。'
    topics: [datascience/polars]
    level: beginner
    section: { en: 'Polars execution', zh: 'Polars 执行模型' }
    frequency: common
    tags: [polars, dataframe, lazyframe, collect]

  - id: polars-expression-contexts
    question: { en: 'What is a Polars expression context, and why can sibling expressions not depend on a new alias?', zh: '什么是 Polars 表达式上下文，为什么相邻表达式不能依赖新别名？' }
    answer:
      en: 'An expression describes a column computation, while its context determines shape behavior. select returns expression outputs, with_columns preserves existing columns, filter selects rows, and group_by().agg() reduces groups. Sibling expressions in one context are evaluated against the same input schema and may run independently. If one sibling creates revenue, another cannot read pl.col("revenue") during that same with_columns call. I either chain a second with_columns call, which makes revenue part of the next input schema, or bind the revenue formula to an expression variable and reuse the formula directly.'
      zh: '表达式描述列计算，上下文则决定结果的形状行为。select 返回表达式输出，with_columns 保留现有列，filter 选择行，group_by().agg() 归约分组。同一上下文中的相邻表达式面对同一份输入模式，并且可以独立执行。如果一个表达式创建 revenue，另一个不能在同一次 with_columns 中读取 pl.col("revenue")。我会串联第二次 with_columns，让 revenue 进入下一份输入模式；也可以把收入公式保存为表达式变量，直接复用公式。'
    topics: [datascience/polars]
    level: intermediate
    section: { en: 'Expressions and schemas', zh: '表达式与模式' }
    frequency: common
    tags: [polars, expressions, context, schema]

  - id: polars-null-nan-schema
    question: { en: 'How do schema, null, and NaN rules affect a reliable Polars pipeline?', zh: '模式、null 与 NaN 规则怎样影响可靠的 Polars 流程？' }
    answer:
      en: 'I treat column names, dtypes, nullability, units, and key rules as the input contract. CSV has no native schema, so important fields need schema or schema_overrides instead of sample-dependent inference. Polars null is a missing value represented separately from the data, while NaN is a floating-point value. fill_null does not replace NaN, and fill_nan does not replace null. I count and test them independently, decide whether invalid casts should fail or become null, and validate ranges after parsing. A matching schema still cannot prove that quantities are nonnegative or identifiers are unique.'
      zh: '我会把列名、数据类型、可空性、单位和键规则作为输入契约。CSV 没有原生模式，因此重要字段应使用 schema 或 schema_overrides，不能依赖随样本变化的推断。Polars 的 null 是与数据分开表示的缺失值，NaN 则是浮点值；fill_null 不会替换 NaN，fill_nan 也不会替换 null。我会分别计数和测试两者，决定无效转换应报错还是变成空值，并在解析后验证范围。模式吻合仍不能证明数量非负或标识符唯一。'
    topics: [datascience/polars]
    level: intermediate
    section: { en: 'Data contracts', zh: '数据契约' }
    frequency: common
    tags: [polars, schema, dtype, null, nan]

  - id: polars-safe-joins
    question: { en: 'How do you review a Polars join for silent data multiplication or loss?', zh: '怎样审查 Polars 连接，防止数据静默扩增或丢失？' }
    answer:
      en: 'I first name the intended cardinality: one-to-one, one-to-many, many-to-one, or genuinely many-to-many. Then I validate nulls and uniqueness on constrained keys and pass the matching value such as validate="m:1" to join. I choose the join type from the retention rule, not convenience, and inspect unmatched keys before filling right-side nulls. After execution I compare row counts and business totals that should be conserved. I also sort explicitly when output order is part of the contract, because a group or join result should not be treated as implicitly ordered.'
      zh: '我会先命名预期基数：一对一、一对多、多对一，或确实需要的多对多。随后检查受约束键的空值与唯一性，并把 validate="m:1" 等对应值传给 join。连接类型应由保留规则决定，不能只看写起来是否方便；填充右侧空值前还要检查未匹配键。执行后比较行数与应守恒的业务总量。如果输出顺序属于契约，我也会显式排序，因为分组或连接结果不应被视为天然有序。'
    topics: [datascience/polars]
    level: advanced
    section: { en: 'Joins and integrity', zh: '连接与完整性' }
    frequency: occasional
    tags: [polars, join, cardinality, data-integrity]
