track: ai
items:
  - id: langchain-direct-runnable-agent
    question: { en: 'How do you choose between a direct model call, a runnable pipeline, and create_agent?', zh: '如何在直接模型调用、可运行流水线与 create_agent 之间选择？' }
    answer:
      en: 'Use a direct model call when the operation is one request and the surrounding control flow is ordinary application code. Use a runnable sequence, parallel mapping, or branch when your program can determine the steps and you want consistent invocation, composition, and tracing. Use create_agent only when the model must choose tools or decide how many iterations a task requires. Each move adds flexibility and a larger failure surface, so start with the smallest control structure that expresses the behavior.'
      zh: '如果操作只有一次请求，周围控制流也是普通应用代码，就直接调用模型。步骤可由程序确定，而你需要统一调用、组合与追踪时，使用可运行顺序链、并行映射或分支。只有必须让模型选择工具，或决定任务需要多少轮迭代时，才使用 create_agent。每增加一层都会同时增加灵活性与故障面，因此应选择足以表达行为的最小控制结构。'
    topics: [ai/langchain]
    level: intermediate
    section: { en: 'Agent architecture', zh: '智能体架构' }
    frequency: common
    tags: [langchain, architecture, agents]

  - id: langchain-debug-runnable-pipeline
    question: { en: 'How do you debug a LangChain runnable pipeline that fails between two components?', zh: 'LangChain 可运行流水线在两个组件之间失败时，应该怎样调试？' }
    answer:
      en: 'Name the concrete value crossing every edge: mapping, prompt value, message, string, or domain object. Invoke the smallest upstream prefix and inspect its result before adding the next component. Check required dictionary keys and whether a parser intentionally converts a message into text or structured data. Schema and graph inspection can help, but they do not prove provider content behavior. Keep a contract test at each unstable boundary so an integration upgrade fails close to the component that changed.'
      zh: '先明确每条边传递的具体值：映射、提示词值、消息、字符串或领域对象。调用最短的上游片段并检查结果，再加入下一个组件。核对必需的字典键，并确认解析器是否有意把消息转换为文本或结构化数据。模式与图检查能够辅助诊断，但不能证明服务商的内容行为。应在每个不稳定边界保留契约测试，让集成升级在靠近变化组件的位置失败。'
    topics: [ai/langchain]
    level: intermediate
    section: { en: 'Execution and composition', zh: '执行与组合' }
    frequency: common
    tags: [runnables, lcel, debugging]

  - id: langchain-secure-tool-boundary
    question: { en: 'What must a LangChain tool enforce beyond its generated argument schema?', zh: '除了生成的参数模式，LangChain 工具还必须执行哪些检查？' }
    answer:
      en: 'The schema checks argument shape, not authority or business policy. The tool must authenticate runtime identity, authorize the requested resource and action, constrain paths and amounts, and avoid exposing secrets in results or traces. Side-effecting tools also need idempotency keys and durable outcome records because model, network, or graph retries can repeat a call. Treat model-selected arguments as untrusted input, keep consequential tools on narrow allowlists, and place human approval before actions whose cost or reversibility requires it.'
      zh: '参数模式只检查数据形状，不会验证权限或业务策略。工具必须认证运行时身份，授权所请求的资源与动作，限制路径和金额，并避免在结果或追踪中泄漏秘密。有副作用的工具还需要幂等键与持久结果记录，因为模型、网络或图重试都可能重复调用。模型选择的参数仍是不可信输入；高风险工具应放入严格允许列表，成本较高或难以撤销的动作还要先经过人工批准。'
    topics: [ai/langchain]
    level: advanced
    section: { en: 'Tools and safety', zh: '工具与安全' }
    frequency: common
    tags: [tools, security, idempotency]

  - id: langchain-v1-migration
    question: { en: 'What should you check when migrating generated LangChain 0.x code to 1.x?', zh: '把生成的 LangChain 0.x 代码迁移到 1.x 时，应检查什么？' }
    answer:
      en: 'Inventory every imported symbol before changing behavior. LangChain 1.x centers the main package on create_agent, while many legacy chains and helpers moved to langchain-classic; do not solve each missing import by blindly adding that package. Replace fixed legacy chains with runnable composition where it clarifies data flow, and replace older agent constructors with create_agent. Revisit memory as thread-scoped checkpointed state rather than a process-global history object. Finally, run provider, tool-call, streaming, and persistence tests because an import-clean migration can still change runtime behavior.'
      zh: '先盘点每个导入符号，再修改程序行为。LangChain 1.x 的主包以 create_agent 为核心，许多旧式链和辅助工具已移到 langchain-classic；不要每遇到一个缺失导入就盲目添加这个包。如果可运行组合能让数据流更清楚，就用它替换固定旧式链，并用 create_agent 替换旧智能体构造器。记忆应重新设计为带检查点的线程状态，而不是进程全局历史。最后还要测试服务商、工具调用、流式处理与持久化行为。'
    topics: [ai/langchain]
    level: intermediate
    section: { en: 'Migration', zh: '迁移' }
    frequency: occasional
    tags: [langchain, migration, versioning]
