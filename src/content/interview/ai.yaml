track: ai
items:
  - id: langchain-direct-runnable-agent
    question: { en: 'How do you choose between a direct model call, a runnable pipeline, and create_agent?', zh: '如何在直接模型调用、可运行流水线与 create_agent 之间选择？' }
    answer:
      en: 'Use a direct model call when the operation is one request and the surrounding control flow is ordinary application code. Use a runnable sequence, parallel mapping, or branch when your program can determine the steps and you want consistent invocation, composition, and tracing. Use create_agent only when the model must choose tools or decide how many iterations a task requires. Each move adds flexibility and a larger failure surface, so start with the smallest control structure that expresses the behavior.'
      zh: '如果操作只有一次请求，周围控制流也是普通应用代码，就直接调用模型。步骤可由程序确定，而你需要统一调用、组合与追踪时，使用可运行顺序链、并行映射或分支。只有必须让模型选择工具，或决定任务需要多少轮迭代时，才使用 create_agent。每增加一层都会同时增加灵活性与故障面，因此应选择足以表达行为的最小控制结构。'
    topics: [ai/langchain]
    level: intermediate
    section: { en: 'Agent architecture', zh: '智能体架构' }
    frequency: common
    tags: [langchain, architecture, agents]

  - id: langchain-debug-runnable-pipeline
    question: { en: 'How do you debug a LangChain runnable pipeline that fails between two components?', zh: 'LangChain 可运行流水线在两个组件之间失败时，应该怎样调试？' }
    answer:
      en: 'Name the concrete value crossing every edge: mapping, prompt value, message, string, or domain object. Invoke the smallest upstream prefix and inspect its result before adding the next component. Check required dictionary keys and whether a parser intentionally converts a message into text or structured data. Schema and graph inspection can help, but they do not prove provider content behavior. Keep a contract test at each unstable boundary so an integration upgrade fails close to the component that changed.'
      zh: '先明确每条边传递的具体值：映射、提示词值、消息、字符串或领域对象。调用最短的上游片段并检查结果，再加入下一个组件。核对必需的字典键，并确认解析器是否有意把消息转换为文本或结构化数据。模式与图检查能够辅助诊断，但不能证明服务商的内容行为。应在每个不稳定边界保留契约测试，让集成升级在靠近变化组件的位置失败。'
    topics: [ai/langchain]
    level: intermediate
    section: { en: 'Execution and composition', zh: '执行与组合' }
    frequency: common
    tags: [runnables, lcel, debugging]

  - id: langchain-secure-tool-boundary
    question: { en: 'What must a LangChain tool enforce beyond its generated argument schema?', zh: '除了生成的参数模式，LangChain 工具还必须执行哪些检查？' }
    answer:
      en: 'The schema checks argument shape, not authority or business policy. The tool must authenticate runtime identity, authorize the requested resource and action, constrain paths and amounts, and avoid exposing secrets in results or traces. Side-effecting tools also need idempotency keys and durable outcome records because model, network, or graph retries can repeat a call. Treat model-selected arguments as untrusted input, keep consequential tools on narrow allowlists, and place human approval before actions whose cost or reversibility requires it.'
      zh: '参数模式只检查数据形状，不会验证权限或业务策略。工具必须认证运行时身份，授权所请求的资源与动作，限制路径和金额，并避免在结果或追踪中泄漏秘密。有副作用的工具还需要幂等键与持久结果记录，因为模型、网络或图重试都可能重复调用。模型选择的参数仍是不可信输入；高风险工具应放入严格允许列表，成本较高或难以撤销的动作还要先经过人工批准。'
    topics: [ai/langchain]
    level: advanced
    section: { en: 'Tools and safety', zh: '工具与安全' }
    frequency: common
    tags: [tools, security, idempotency]

  - id: langchain-v1-migration
    question: { en: 'What should you check when migrating generated LangChain 0.x code to 1.x?', zh: '把生成的 LangChain 0.x 代码迁移到 1.x 时，应检查什么？' }
    answer:
      en: 'Inventory every imported symbol before changing behavior. LangChain 1.x centers the main package on create_agent, while many legacy chains and helpers moved to langchain-classic; do not solve each missing import by blindly adding that package. Replace fixed legacy chains with runnable composition where it clarifies data flow, and replace older agent constructors with create_agent. Revisit memory as thread-scoped checkpointed state rather than a process-global history object. Finally, run provider, tool-call, streaming, and persistence tests because an import-clean migration can still change runtime behavior.'
      zh: '先盘点每个导入符号，再修改程序行为。LangChain 1.x 的主包以 create_agent 为核心，许多旧式链和辅助工具已移到 langchain-classic；不要每遇到一个缺失导入就盲目添加这个包。如果可运行组合能让数据流更清楚，就用它替换固定旧式链，并用 create_agent 替换旧智能体构造器。记忆应重新设计为带检查点的线程状态，而不是进程全局历史。最后还要测试服务商、工具调用、流式处理与持久化行为。'
    topics: [ai/langchain]
    level: intermediate
    section: { en: 'Migration', zh: '迁移' }
    frequency: occasional
    tags: [langchain, migration, versioning]

  - id: claude-api-stateless-messages
    question: { en: 'What does it mean that the Claude Messages API is stateless?', zh: 'Claude Messages API 是无状态的，这意味着什么？' }
    answer:
      en: 'Each request contains the conversation state needed to generate the next assistant message; the API does not retain an application chat session between calls. The application therefore owns persistence, history trimming, tenant isolation, and replay. For a normal next turn, resend the relevant user and assistant messages in order. During client tool use, preserve the assistant content containing every tool_use block and follow it with user-role tool_result blocks whose IDs match. Statelessness makes behavior auditable, but only if the stored history is complete and correctly scoped.'
      zh: '每次请求都要包含生成下一条助手消息所需的对话状态；API 不会在两次调用之间替应用保存聊天会话。因此，持久化、历史删减、租户隔离和重放都由应用负责。正常继续对话时，应按顺序重新发送相关的用户与助手消息。处理客户端工具时，还要保留包含全部 tool_use 块的助手内容，再追加用户角色的 tool_result 块，并确保 ID 配对。无状态设计有利于审计，但前提是保存的历史完整且作用域正确。'
    topics: [ai/claude-api]
    level: beginner
    section: { en: 'Provider APIs', zh: '模型服务 API' }
    frequency: common
    tags: [claude, messages-api, conversation-state]

  - id: claude-api-content-stop-contract
    question: { en: 'Why should Claude API code inspect both content blocks and stop_reason?', zh: '为什么 Claude API 代码必须同时检查内容块与 stop_reason？' }
    answer:
      en: 'The content array is a tagged union, not a text field. One response can contain text, one or more tool_use blocks, or blocks from other enabled capabilities, so code should dispatch every block by type and tolerate documented extensions. stop_reason describes the turn-level outcome: end_turn is normal, max_tokens can mean incomplete output, and tool_use requires another application-controlled round trip. Looking at content alone misses termination state; looking only at stop_reason misses the work encoded in individual blocks. Unknown values should produce safe diagnostics rather than an unsafe default.'
      zh: 'content 数组是带类型标签的联合结构，不是单一文本字段。一个响应可能包含文本、一个或多个 tool_use 块，或其他已启用能力产生的块，因此代码应按 type 分派每个块，并允许协议扩展。stop_reason 描述轮次级结果：end_turn 表示正常结束，max_tokens 可能意味着输出不完整，tool_use 则要求应用继续一次往返。只看内容会漏掉终止状态，只看停止原因又会漏掉各块承载的工作。遇到未知值时应生成安全诊断，不能套用危险的默认行为。'
    topics: [ai/claude-api]
    level: intermediate
    section: { en: 'Provider APIs', zh: '模型服务 API' }
    frequency: common
    tags: [claude, content-blocks, stop-reason]

  - id: claude-api-safe-tool-loop
    question: { en: 'How do you implement a safe client-tool loop with the Claude API?', zh: '如何为 Claude API 实现安全的客户端工具循环？' }
    answer:
      en: 'When stop_reason is tool_use, enumerate every tool_use block rather than assuming the first block is the only call. Resolve names from an allowlist, validate arguments, authenticate the principal, authorize the resource and action, and execute the handler. Append the assistant content unchanged, then add one user-role tool_result for each tool_use_id, including explicit error results when needed. Send the same tool definitions on the continuation request. Side-effecting handlers also need durable idempotency keys and outcomes, because model, network, or process retries can otherwise repeat an action.'
      zh: '当 stop_reason 为 tool_use 时，应遍历每个 tool_use 块，不能假设第一个块就是唯一调用。工具名称只能从允许列表解析；执行处理器前还要验证参数、认证当前主体，并授权资源和动作。随后原样追加助手内容，再为每个 tool_use_id 添加一个用户角色的 tool_result；失败时也要返回明确的错误结果。续接请求继续发送同一套工具定义。有副作用的处理器还必须保存幂等键和执行结果，否则模型、网络或进程重试可能重复执行动作。'
    topics: [ai/claude-api]
    level: advanced
    section: { en: 'Tools and safety', zh: '工具与安全' }
    frequency: common
    tags: [claude, tool-use, authorization, idempotency]

  - id: claude-api-retry-stream-boundaries
    question: { en: 'How should retries differ between Claude HTTP requests, streams, and side-effecting tools?', zh: 'Claude HTTP 请求、流式响应与有副作用工具的重试策略应有何不同？' }
    answer:
      en: 'Retry only transient HTTP failures with bounded backoff, accounting for retries the SDK already performs. Authentication and invalid-request errors require a fix, not another identical call. A stream can fail after HTTP 200, so partial text stays incomplete until message_stop; a new request is a new generation and must not be concatenated onto the old one as if it resumed. Tool execution is a separate transaction boundary. Persist its call ID, idempotency key, and outcome before retrying, then query the existing result after an ambiguous timeout to avoid duplicate effects.'
      zh: '只对暂时性 HTTP 故障进行有界退避，并把 SDK 已执行的重试计算在内。认证失败和无效请求需要修正，不能原样再发一次。流可能在 HTTP 200 之后失败，因此在 message_stop 之前，部分文本始终是不完整结果；新请求会产生一次新的生成，不能假装续传并拼到旧文本后。工具执行是另一个事务边界。重试前应保存调用 ID、幂等键与执行结果；遇到结果不明的超时时，先查询既有结果，避免重复副作用。'
    topics: [ai/claude-api]
    level: advanced
    section: { en: 'Reliability', zh: '可靠性' }
    frequency: occasional
    tags: [claude, retries, streaming, idempotency]

  - id: getting-started-model-boundary
    question: { en: 'What belongs in the application boundary around an LLM call?', zh: '大模型调用周围的应用边界应包含什么？' }
    answer:
      en: 'The boundary starts before the provider request and ends after an application decision. It builds a versioned request from trusted instructions and clearly identified untrusted data, sets model and output limits, and records correlation metadata. On return, it checks completion state, parses content, validates schema and domain constraints, and chooses an explicit fallback. Permissions and side effects remain outside the model adapter: application code authenticates the caller, authorizes actions, and handles idempotency. Logs retain approved metadata and redacted diagnostics rather than complete sensitive prompts.'
      zh: '这条边界从服务商请求之前开始，在应用作出决定后结束。它根据可信指令与来源明确的不可信数据构造版本化请求，设置模型和输出限制，并记录关联信息。响应返回后，边界检查完成状态，解析内容，验证模式与领域约束，再选择明确的回退路径。权限和副作用留在模型适配器之外：应用代码负责认证调用者、授权动作并处理幂等性。日志只保存获准的元数据与删减后的诊断信息，不保存完整敏感提示词。'
    topics: [ai/getting-started]
    level: beginner
    section: { en: 'LLM application fundamentals', zh: '大模型应用基础' }
    frequency: common
    tags: [llm, model-boundary, validation]

  - id: getting-started-validated-output
    question: { en: 'Why is schema-valid model output still untrusted?', zh: '为什么符合模式的模型输出仍然不可信？' }
    answer:
      en: 'A schema proves that data has the expected shape; it does not prove that the facts are correct, the classification is appropriate, or the requested action is authorized. A valid amount can still exceed a business limit, and a valid account ID can belong to another tenant. Treat schema validation as one gate. Follow it with allowlists, domain invariants, provenance checks where claims need evidence, and authorization based on runtime identity. For consequential actions, require approval and an idempotency key rather than asking the model to confirm itself.'
      zh: '模式只能证明数据具有预期形状，不能证明事实正确、分类恰当，或请求的动作已经授权。合法金额仍可能超过业务上限，合法账户 ID 也可能属于另一个租户。因此，模式验证只是其中一道关卡。之后还要执行允许列表、领域不变量与必要的来源检查，并根据运行时身份完成授权。对于后果重大的动作，应要求人工批准和幂等键，不能靠再次询问模型来确认。'
    topics: [ai/getting-started]
    level: intermediate
    section: { en: 'Reliability and safety', zh: '可靠性与安全' }
    frequency: common
    tags: [schema, authorization, untrusted-output]

  - id: getting-started-evaluation-change
    question: { en: 'How would you evaluate a prompt or model change before release?', zh: '发布前应如何评测提示词或模型变更？' }
    answer:
      en: 'First preserve the old configuration as a baseline on a versioned set of representative, boundary, and adversarial cases. Change one major variable so any regression is attributable. Run both configurations, keep raw and parsed outputs, and inspect case-level differences rather than only an aggregate score. Domain owners should resolve disputed expected behavior. After offline acceptance, use a limited rollout to watch validation failures, human overrides, fallbacks, and user corrections. Keep the previous configuration available so a production regression has a tested rollback path.'
      zh: '先在版本化评测集上保存旧配置的基线；案例应覆盖代表性输入、边界条件和对抗性输入。一次只改一个主要变量，才能判断回归来源。运行新旧配置，保留原始输出与解析结果，并查看案例级差异，不能只看总分。有争议的预期行为由领域负责人裁决。离线评测通过后，再小范围发布并观察验证失败、人工改判、回退和用户纠正。旧配置应继续可用，为生产回归保留经过测试的回滚路径。'
    topics: [ai/getting-started]
    level: intermediate
    section: { en: 'Evaluation', zh: '评测' }
    frequency: common
    tags: [evaluation, regression, rollout]

  - id: getting-started-prompt-injection-boundary
    question: { en: 'Why does separating instructions from user data not solve prompt injection by itself?', zh: '为什么把指令与用户数据分开仍不能单独解决提示词注入？' }
    answer:
      en: 'Separation records provenance and helps the model distinguish intent, but both instruction and data channels still enter one model context. A malicious user message or retrieved document can influence generation despite labels or delimiters. The dependable controls sit outside that persuasion problem: limit what the model can select, validate outputs, authorize every resource and action at execution time, and give tools least privilege. High-impact actions need an independent policy or human gate. Test direct and indirect injection cases, including hostile content from documents and tool results.'
      zh: '分隔能够记录来源，也有助于模型区分意图，但指令与数据最终仍进入同一个模型上下文。恶意用户消息或检索文档即使带有标签和分隔符，仍可能影响生成结果。可靠控制应放在这种语言影响之外：限制模型可选择的动作，验证输出，在执行时重新授权每个资源与操作，并按最小权限配置工具。高影响动作还需要独立策略或人工关卡。测试必须覆盖直接与间接注入，包括文档和工具结果中的恶意内容。'
    topics: [ai/getting-started]
    level: advanced
    section: { en: 'Reliability and safety', zh: '可靠性与安全' }
    frequency: occasional
    tags: [prompt-injection, least-privilege, human-approval]

  - id: huggingface-pipeline-vs-autoclass
    question: { en: 'When would you use a Transformers Pipeline instead of AutoClass?', zh: '什么情况下应使用 Transformers Pipeline，而不是 AutoClass？' }
    answer:
      en: 'Use Pipeline to validate a supported task quickly when its preprocessing, model call, and standard postprocessing match your needs. It returns task-oriented Python values and keeps setup small. Use AutoTokenizer with a task-specific AutoModel class when you need explicit batching, tensor access, custom pooling, device placement, or postprocessing. In either case, provide the repository ID, task, and commit revision explicitly. Pipeline is a convenience layer over the same artifacts, not a separate model format, and successful execution does not validate label semantics or business policy.'
      zh: '当受支持任务的预处理、模型调用与标准后处理正好符合需求时，可用 Pipeline 快速验证，它会返回面向任务的 Python 值，初始化代码也较少。需要显式控制批处理、张量、自定义池化、设备放置或后处理时，应组合 AutoTokenizer 与任务专用 AutoModel。无论选择哪种入口，都要显式给出仓库 ID、任务与提交哈希。Pipeline 只是同一批制品之上的便利层；调用成功并不能验证标签语义或业务策略。'
    topics: [ai/huggingface]
    level: beginner
    section: { en: 'Model distribution and loading', zh: '模型分发与加载' }
    frequency: common
    tags: [hugging-face, transformers, pipeline, autoclass]

  - id: huggingface-reproducible-deployment
    question: { en: 'How do you make a Hugging Face model deployment reproducible?', zh: '如何让 Hugging Face 模型部署可复现？' }
    answer:
      en: 'Resolve the selected branch or release tag to a full commit hash and pass that revision to every tokenizer, processor, configuration, and model load. Build from an empty cache, instantiate the exact target class, then repeat startup offline with local_files_only enabled. Record the repository hash alongside locked Transformers, huggingface_hub, tensor-backend, and Python versions, plus the device and dtype policy. Save an artifact manifest and evaluation result with the application release. A pinned model commit alone is insufficient because loader code and numerical kernels can still change behavior.'
      zh: '先把选定分支或发布标签解析为完整提交哈希，再将同一 revision 传给 tokenizer、处理器、配置与模型的每次加载。从空缓存开始构建并实例化目标类，然后启用 local_files_only，在离线环境中重复启动。仓库哈希还要与锁定的 Transformers、huggingface_hub、张量后端及 Python 版本一起记录，同时保存设备与数据类型策略。应用发布物应包含制品清单和评测结果；只固定模型提交仍不够，因为加载代码与数值内核也会改变行为。'
    topics: [ai/huggingface]
    level: intermediate
    section: { en: 'Model distribution and loading', zh: '模型分发与加载' }
    frequency: common
    tags: [reproducibility, revision, deployment, cache]

  - id: huggingface-repository-review
    question: { en: 'What should you review before loading a model from the Hugging Face Hub?', zh: '从 Hugging Face Hub 加载模型前，应审核哪些内容？' }
    answer:
      en: 'Start with the model card: intended use, limitations, training context, evaluation evidence, and license. Confirm that the repository task and architecture match your loader, then inspect the pinned revision’s file list, sizes, weight formats, and any custom Python. Prefer reviewed Safetensors weights and leave trust_remote_code disabled unless pinned code has been audited and isolated. Check gated-access obligations and test the model on representative, boundary, and adversarial inputs from your domain. Popularity and download counts help discovery, but they are neither a security review nor evidence that the model meets your requirements.'
      zh: '先检查模型卡中的预期用途、限制、训练背景、评测证据与许可证。确认仓库任务和架构符合加载器，再检查固定修订版本的文件清单、大小、权重格式及自定义 Python 代码。优先选择经过审核的 Safetensors 权重；除非固定版本代码已完成审核与隔离，否则保持 trust_remote_code 关闭。还要确认受限访问义务，并用领域内的代表性、边界与对抗输入评测。流行度和下载量只能帮助发现模型，不能替代安全审查或需求验证。'
    topics: [ai/huggingface]
    level: intermediate
    section: { en: 'Model security', zh: '模型安全' }
    frequency: common
    tags: [model-card, licensing, remote-code, safetensors]

  - id: huggingface-private-cache-boundary
    question: { en: 'What are the security boundaries for private Hub models and a shared local cache?', zh: '私有 Hub 模型与共享本地缓存有哪些安全边界？' }
    answer:
      en: 'Supply a narrowly scoped read token through HF_TOKEN or managed secret injection, never source code or request data. Remote Hub authorization protects download access, but a downloaded snapshot is then governed by local filesystem permissions. A shared cache can expose restricted artifacts across service identities or tenants, so set explicit ownership and mount policy. Separate token rotation from cache removal because revoking a token does not erase local files. Logs should retain repository ID, commit hash, and request ID while excluding credentials and sensitive paths. Test both authorized cold-cache download and credential-free offline startup.'
      zh: '通过 HF_TOKEN 或受控密钥注入提供最小范围的只读 token，绝不能从源码或请求数据读取。Hub 远端授权保护下载过程，但快照下载后便由本地文件系统权限控制。共享缓存可能让不同服务身份或租户读到受限制品，因此必须明确所有权与挂载策略。token 轮换和缓存删除是两个操作，撤销 token 不会清除本地文件。日志只保留仓库 ID、提交哈希与请求 ID，排除凭据和敏感路径，并分别测试有权冷缓存下载与无凭据离线启动。'
    topics: [ai/huggingface]
    level: advanced
    section: { en: 'Model security', zh: '模型安全' }
    frequency: occasional
    tags: [authentication, cache, private-models, isolation]

  - id: local-llms-deployment-fit
    question: { en: 'When is a local LLM a better deployment choice than a hosted model API?', zh: '什么情况下，本地 LLM 比托管模型 API 更适合作为部署方案？' }
    answer:
      en: 'Choose local inference when the workload has a firm data-residency or offline requirement, a model that passes your domain evaluation can run on available hardware, and the expected load justifies operating that hardware. Compare it with a hosted API on the same quality cases, latency targets, and full cost model. Local is a poor default when you need the strongest hosted capability, rapid elasticity, or a provider service-level agreement. It also transfers patching, capacity, monitoring, access control, and recovery to your team, so include those duties in the decision.'
      zh: '当工作负载有明确的数据驻留或离线要求，某个通过领域评测的模型能在现有硬件上运行，而且预期负载值得自行运维时，可以选择本地推理。比较本地与托管方案时，应使用相同的质量案例、延迟目标和完整成本模型。如果需要最强的托管模型、快速弹性或服务商的服务等级协议，本地部署通常不是默认选择。它还会把补丁、容量、监控、访问控制和恢复责任交回团队，这些工作必须计入决策。'
    topics: [ai/local-llms]
    level: beginner
    section: { en: 'Local inference', zh: '本地推理' }
    frequency: common
    tags: [local-inference, deployment, trade-offs]

  - id: local-llms-memory-plan
    question: { en: 'How do you determine whether a quantized model will fit on a target machine?', zh: '如何判断一个量化模型能否在目标机器上运行？' }
    answer:
      en: 'Start with parameter count times bits per weight as a lower bound, then inspect the actual artifact and runner metadata. Add memory for runtime buffers, the computation graph, drivers, and the KV cache. Cache demand changes with model architecture, context length, cache type, batch size, and concurrent sequences, so file size alone is not enough. Run the exact artifact, runner version, backend, maximum permitted input and output, and target concurrency on the real machine. Record peak system and accelerator memory, offload behavior, load failures, and latency with operating headroom.'
      zh: '先用参数量乘以每个权重的位数得到下限，再检查实际制品与运行器元数据。总量还要加入运行时缓冲区、计算图、驱动和 KV 缓存。缓存需求会随模型架构、上下文长度、缓存类型、批量和并发序列变化，因此只看文件大小不够。应在真实机器上运行准确的制品、运行器版本和后端，并使用最长允许输入输出及目标并发。记录系统内存与显存峰值、卸载行为、加载失败和延迟，同时保留运行余量。'
    topics: [ai/local-llms]
    level: intermediate
    section: { en: 'Capacity planning', zh: '容量规划' }
    frequency: common
    tags: [quantization, memory, kv-cache, concurrency]

  - id: local-llms-reproducible-release
    question: { en: 'What must a reproducible local-model release record contain?', zh: '可复现的本地模型发布记录必须包含什么？' }
    answer:
      en: 'Record the model source and immutable revision or file digest, quantization type, tokenizer, chat template, runner version, launch arguments, hardware backend, and relevant driver versions. Attach the domain evaluation set and its results to that exact combination. A mutable model tag is insufficient because it may later resolve to different bytes, and pinning weights alone does not pin template or runner behavior. Build once from an empty cache, verify startup with network access blocked, and retain the reviewed artifact bundle. Rollback should restore the tested combination rather than search for a similarly named model.'
      zh: '记录模型来源与不可变修订或文件摘要、量化类型、分词器、聊天模板、运行器版本、启动参数、硬件后端及相关驱动版本，并把领域评测集和结果关联到这套准确组合。可变模型标签以后可能指向不同字节，因此并不足够；只固定权重也没有固定模板或运行器行为。应从空缓存构建一次，在阻断网络后验证启动，并保留经过审核的制品包。回滚必须恢复已测试组合，不能临时寻找名称相似的模型。'
    topics: [ai/local-llms]
    level: intermediate
    section: { en: 'Model operations', zh: '模型运维' }
    frequency: common
    tags: [reproducibility, artifacts, offline, rollback]

  - id: local-llms-stream-completion
    question: { en: 'How should a client handle a streamed local-model response safely?', zh: '客户端应如何安全处理本地模型的流式响应？' }
    answer:
      en: 'Parse each protocol event incrementally and apply backpressure instead of buffering the complete response. Keep received text provisional until the documented terminal event arrives, then inspect its stop reason and usage or timing fields. A connection that closes first produces incomplete output, even if the text looks fluent. Bound connection and read timeouts and retry only under an explicit policy. A retry starts a new generation and cannot be concatenated as a continuation of the old stream. Before any side effect, validate the completed output and use an application-level idempotency key.'
      zh: '按协议增量解析每个事件并实施背压，不要先缓冲完整响应。在收到文档规定的终止事件前，已接收文本都只是暂定结果；终止后还要检查停止原因、用量和计时字段。如果连接先关闭，即使文字读起来流畅，输出仍不完整。连接与读取都要设置有界超时，重试必须遵循明确策略。重试会开始一次新生成，不能作为旧流的续传拼接。执行任何副作用前，还要验证完整输出并使用应用级幂等键。'
    topics: [ai/local-llms]
    level: advanced
    section: { en: 'Reliability', zh: '可靠性' }
    frequency: occasional
    tags: [streaming, completion-state, retries, idempotency]

  - id: nlp-task-contract
    question: { en: 'How do you turn a vague language problem into an NLP task?', zh: '如何把含糊的语言问题转换成 NLP 任务？' }
    answer:
      en: 'Start with the decision the product must make, then define the input unit and output shape: document labels, token labels, source spans, ranked candidates, or generated text. Specify the label set, abstention path, span-boundary convention, and business cost of each error. Write an annotation guide and test whether independent annotators can apply it consistently. Finally, choose metrics and evaluation slices that match the decision. Model selection comes later; a stronger model cannot repair overlapping labels or an output nobody can verify.'
      zh: '先明确产品必须做出的决定，再定义输入单位与输出形状，例如文档标签、词元标签、原文跨度、候选排序或生成文本。随后规定标签集合、无法判断时的路径、跨度边界约定，以及各类错误的业务成本。编写标注指南，并检查不同标注者能否一致执行。最后选择与决策相符的指标和数据切片。模型选择应放在后面，因为更强的模型无法修复互相重叠的标签，也无法让不可验证的输出变得可验证。'
    topics: [ai/nlp]
    level: intermediate
    section: { en: 'NLP foundations', zh: 'NLP 基础' }
    frequency: common
    tags: [task-contract, annotation, evaluation]

  - id: nlp-normalization-offsets
    question: { en: 'Why should an NLP system preserve source text alongside normalized text?', zh: '为什么 NLP 系统要同时保留原文与规范化文本？' }
    answer:
      en: 'Normalization is a task-specific view, not a lossless replacement. NFKC, case folding, whitespace compression, or punctuation removal can change content and string length. A model span measured on that view may no longer slice the source correctly, and the source is still needed for display, audits, and relabeling. Store the original unchanged, version each transformation, and use a tokenizer-provided offset map or maintain one explicitly. Across services, state whether offsets count bytes, Unicode code points, UTF-16 code units, grapheme clusters, or model tokens.'
      zh: '规范化是面向具体任务的视图，不是无损替代品。NFKC、大小写折叠、空白压缩或标点删除都可能改变内容与字符串长度，因此基于该视图计算的模型跨度未必能正确切割原文。展示、审计和重新标注仍需要原文。系统应原样保存输入，为每项转换记录版本，并使用分词器提供的偏移量映射或显式维护映射。跨服务时还要说明偏移量统计的是字节、Unicode 码点、UTF-16 代码单元、字素簇还是模型词元。'
    topics: [ai/nlp]
    level: intermediate
    section: { en: 'Text representation', zh: '文本表示' }
    frequency: common
    tags: [unicode, normalization, offsets]

  - id: nlp-prevent-split-leakage
    question: { en: 'How do you prevent data leakage when evaluating a text classifier?', zh: '评测文本分类器时如何防止数据泄漏？' }
    answer:
      en: 'Choose a split boundary that matches deployment, such as user, conversation, source document, or time, and keep each group on one side. Detect exact and near duplicates before splitting. Fit vocabularies, IDF weights, feature selection, calibration, and every learned preprocessing step on training data only; validation and test data may only be transformed. Use validation data for routine model and threshold choices. Keep the final test set read-only, record every use, and investigate an implausibly strong baseline before trusting a complex model.'
      zh: '选择与上线环境一致的切分边界，例如用户、会话、来源文档或时间，并让每个分组只出现在一侧。切分前检测完全重复和近重复样本。词表、IDF、特征选择、校准以及所有需要学习的预处理步骤都只能在训练集上拟合；验证集与测试集只能被转换。日常模型和阈值选择使用验证集。最终测试集保持只读并记录每次使用。如果简单基线高得不合理，应先调查泄漏，再相信复杂模型的结果。'
    topics: [ai/nlp]
    level: intermediate
    section: { en: 'Evaluation', zh: '评测' }
    frequency: common
    tags: [data-leakage, grouped-split, validation]

  - id: nlp-metrics-imbalanced
    question: { en: 'Why is accuracy insufficient for an imbalanced NLP classifier?', zh: '为什么准确率不足以评测类别不平衡的 NLP 分类器？' }
    answer:
      en: 'Accuracy gives every example equal weight, so a majority-only predictor can look acceptable while never detecting a rare but costly class. Report the confusion matrix and per-class precision, recall, F1, and support. Macro averages give each class equal weight; micro averages pool decisions and are usually dominated by common classes. Select thresholds on validation data using the cost of false positives, false negatives, and abstention. Then inspect failed examples in slices such as language, channel, length, and time period, because one average cannot locate the failure.'
      zh: '准确率给每个样本相同权重，因此只预测多数类的系统也可能看起来尚可，却完全识别不出稀少但代价高的类别。应报告混淆矩阵，以及逐类精确率、召回率、F1 和支持数。宏平均让各类别等权，微平均汇总所有决策，通常受常见类别主导。阈值应根据验证集上的误报、漏报和转人工成本选择。随后按语言、渠道、长度和时间段检查失败样本，因为一个平均值无法定位问题。'
    topics: [ai/nlp]
    level: intermediate
    section: { en: 'Evaluation', zh: '评测' }
    frequency: common
    tags: [precision, recall, macro-f1, class-imbalance]
