track: typescript
items:
  - id: advanced-types-keyof-indexed-mapped
    question: { en: 'How do keyof, indexed access, and mapped types work together?', zh: 'keyof、索引访问类型和映射类型如何协作？' }
    answer:
      en: 'keyof T produces the union of known keys in T. Indexed access, T[K], retrieves the value type associated with one key or a union of keys. A mapped type iterates over a key union and constructs one property per key, optionally changing modifiers, values, or names. A common pattern maps each key to a complete object and then indexes the mapped object with keyof T to obtain a discriminated union. Keeping the same K in related fields preserves their correlation; indexing the fields independently loses it.'
      zh: 'keyof T 会产生 T 的已知键联合，索引访问 T[K] 则取得一个键或一组键对应的值类型。映射类型遍历键联合，为每个键构造属性，并可修改修饰符、值类型或名称。常见模式是先把每个键映射成完整对象，再用 keyof T 索引映射结果，得到可辨识联合。相关字段都使用同一个 K 时，对应关系会保留；如果分别索引各字段，这种关系就会丢失。'
    topics: [typescript/advanced-types]
    section: { en: 'Type transformations', zh: '类型转换' }
    level: intermediate
    frequency: common
    tags: [keyof, indexed-access, mapped-types]

  - id: advanced-types-distributive-conditionals
    question: { en: 'When does a conditional type distribute, and how do you prevent it?', zh: '条件类型何时会分布，怎样阻止分布？' }
    answer:
      en: 'A conditional type distributes when its checked side is a naked type parameter, as in T extends U ? X : Y, and T is instantiated with a union. The checker evaluates the conditional for each union member and unions the results. This is useful for filters such as Extract, where rejected members become never. To test the union as one value, wrap both sides in single-element tuples: [T] extends [U]. I would test both forms with one member, a mixed union, never, and unknown because the empty-union case is easy to miss.'
      zh: '当条件类型的受检查位置是裸类型参数，例如 T extends U ? X : Y，而且 T 被实例化为联合时，检查器会对每个联合成员分别计算，再合并结果。这适合实现 Extract 一类过滤器，因为被拒绝的成员会变成 never。若要把整个联合当作一次输入，应把两侧包装成单元素元组，即 [T] extends [U]。测试时应同时覆盖单成员、混合联合、never 和 unknown，尤其不能漏掉空联合边界。'
    topics: [typescript/advanced-types]
    section: { en: 'Conditional types', zh: '条件类型' }
    level: advanced
    frequency: common
    tags: [conditional-types, distribution, never]

  - id: advanced-types-runtime-boundary
    question: { en: 'Why can a precisely derived TypeScript type still be unsafe at a data boundary?', zh: '为什么精确派生的 TypeScript 类型在数据边界仍可能不安全？' }
    answer:
      en: 'TypeScript erases types when it emits JavaScript, so a conditional or mapped type performs no runtime validation. JSON.parse(raw) as Event merely tells the checker to trust the programmer; it does not inspect a discriminant, required field, or numeric range. External values should enter as unknown and pass through a runtime parser or validator before receiving the domain type. After that boundary, derived types are valuable because they preserve relationships among trusted values. I also audit any assertion connecting Object.keys or dynamic assignment to a mapped type, since runtime enumeration and keyof are not identical.'
      zh: 'TypeScript 输出 JavaScript 时会擦除类型，因此条件类型或映射类型不会执行运行时验证。JSON.parse(raw) as Event 只是要求检查器信任程序员，并不会检查判别字段、必填字段或数字范围。外部值应先以 unknown 进入系统，通过运行时解析或验证后才能获得领域类型。越过这个边界后，派生类型可以维护可信值之间的关系。还要审核连接 Object.keys、动态赋值与映射类型的断言，因为运行时枚举与 keyof 并不相同。'
    topics: [typescript/advanced-types]
    section: { en: 'Runtime boundaries', zh: '运行时边界' }
    level: intermediate
    frequency: common
    tags: [type-erasure, unknown, validation]

  - id: advanced-types-abstraction-budget
    question: { en: 'When should you replace an advanced generic utility with a direct domain type?', zh: '什么时候应把高级泛型工具替换成直接的领域类型？' }
    answer:
      en: 'Keep the generic utility when it captures a stable mechanical relationship, has a constrained input domain, and gives callers clearer errors than duplicated declarations would. Replace or split it when ordinary mistakes expose several layers of conditional distribution, key remapping, or recursion; when the implementation needs broad any casts; or when runtime behavior supports fewer shapes than the public type claims. I prefer named intermediate types and tests for accepted and rejected assignments. A direct event, route, or configuration type is often better when the abstraction has only one caller or hides important business meaning.'
      zh: '如果泛型工具表达稳定、机械的关系，输入域受到约束，而且错误信息比重复声明更清楚，就可以保留它。若普通错误会暴露多层条件分布、键重映射或递归，若实现依赖宽泛的 any 转换，或者运行时支持的形状少于公开类型声称的范围，就应拆分或替换。应给重要中间类型命名，并测试应接受和应拒绝的赋值。抽象只有一个调用方，或掩盖关键业务含义时，直接的事件、路由或配置类型通常更好。'
    topics: [typescript/advanced-types]
    section: { en: 'API design', zh: 'API 设计' }
    level: advanced
    frequency: occasional
    tags: [api-design, recursive-types, maintainability]

  - id: basics-annotation-vs-inference
    question: { en: 'When should you write a TypeScript annotation instead of relying on inference?', zh: '什么时候应显式写 TypeScript 类型注解，而不是依赖推断？' }
    answer:
      en: 'I annotate boundaries where the code must communicate or preserve a contract: public function parameters and returns, exported objects, empty collections, and variables whose initial value is narrower than their later states. Inside an implementation, I usually let initializers and contextual typing infer obvious locals. Repeating string or number on every constant adds noise without more safety. The key test is whether changing the implementation should be allowed to change the exposed type. If not, an annotation makes that intent explicit and lets the compiler catch accidental API drift.'
      zh: '我会在需要表达或固定契约的边界写注解，例如公开函数的参数与返回值、导出对象、空集合，以及初始值比后续状态更窄的变量。实现内部的明显局部值通常交给初始化表达式和上下文推断。给每个常量重复标注 string 或 number 只会增加噪声。关键判断是：修改实现时，公开类型是否可以随之改变。如果不可以，显式注解能固定意图，并让编译器发现意外的 API 漂移。'
    topics: [typescript/basics]
    section: { en: 'Language core', zh: '语言核心' }
    level: beginner
    frequency: common
    tags: [type-annotation, type-inference]

  - id: basics-unknown-vs-any
    question: { en: 'How do unknown and any differ at an external data boundary?', zh: '在外部数据边界上，unknown 与 any 有什么区别？' }
    answer:
      en: 'Both types can receive any incoming value, but they impose opposite obligations. any opts out of checking, so property access, calls, and assignments continue without proof and the unsafe type spreads to callers. unknown preserves the uncertainty: code must narrow or validate it before using type-specific operations. For JSON, messages, environment-derived values, or third-party callbacks, I accept unknown, check the container and every required field, then construct the domain value. I reserve any for a documented migration seam and keep that seam as small as possible.'
      zh: '两者都能接收任意传入值，但带来的义务相反。any 会退出检查，属性访问、调用和赋值无需证明即可继续，不安全类型还会传播给调用方。unknown 则保留“不确定”这一事实，代码必须先收窄或验证，才能执行依赖具体类型的操作。对于 JSON、消息、环境变量派生值或第三方回调，我会先接收 unknown，检查容器和每个必填字段，再构造领域值。any 只用于有说明的迁移接缝，并把范围压到最小。'
    topics: [typescript/basics]
    section: { en: 'Data boundaries', zh: '数据边界' }
    level: beginner
    frequency: common
    tags: [unknown, any, runtime-validation]

  - id: basics-assertion-not-validation
    question: { en: 'Why does a type assertion not validate JSON, and what should replace it?', zh: '为什么类型断言不能验证 JSON，应该用什么替代？' }
    answer:
      en: 'A type assertion is an instruction to the checker, not an operation emitted into JavaScript. JSON.parse(raw) as User therefore checks no property, converts no value, and throws no shape-specific error. It can make untrusted data look proved while leaving the runtime value unchanged. I parse into unknown, confirm that the value is a non-null object, validate required fields and domain constraints, and return a newly constructed User only after those checks. A schema library can perform the same boundary job for larger models, but its runtime result still needs to drive the static type.'
      zh: '类型断言是给检查器的指令，不是输出到 JavaScript 的操作。因此，JSON.parse(raw) as User 不会检查属性、转换值，也不会抛出针对结构的错误。它只是让不可信数据看起来已经得到证明，运行时值并未改变。我会把解析结果视为 unknown，确认它是非空对象，验证必填字段和领域约束，最后才构造并返回 User。更大的模型可以使用模式验证库，但静态类型仍应由真实的运行时验证结果驱动。'
    topics: [typescript/basics]
    section: { en: 'Data boundaries', zh: '数据边界' }
    level: intermediate
    frequency: common
    tags: [type-assertion, type-erasure, runtime-validation]

  - id: basics-discriminated-union
    question: { en: 'How does a discriminated union make state handling safer?', zh: '可辨识联合如何提高状态处理的安全性？' }
    answer:
      en: 'Each union member carries a shared literal field, such as status, plus the payload valid for that status. Testing the literal narrows the whole object, so a delivered branch can access signedBy while a failed branch exposes reason. In a switch, assigning the remaining value to never makes exhaustiveness part of type checking: adding a new member breaks consumers that omit it. This is still a static guarantee. Values from JSON or JavaScript must be validated before they receive the union type, because an invalid runtime tag can bypass the modeled state space.'
      zh: '联合中的每个成员都带有共享的字面量字段，例如 status，以及该状态对应的载荷。检查这个字面量会收窄整个对象，所以 delivered 分支可以访问 signedBy，而 failed 分支只能看到 reason。在 switch 中把剩余值赋给 never，可以把穷尽性纳入类型检查；新增成员后，遗漏它的使用方会编译失败。这仍是静态保证。来自 JSON 或 JavaScript 的值必须先验证才能获得联合类型，否则非法运行时标签仍可能绕过建模的状态空间。'
    topics: [typescript/basics]
    section: { en: 'Unions and narrowing', zh: '联合与收窄' }
    level: intermediate
    frequency: common
    tags: [discriminated-union, narrowing, never]

  - id: branded-types-guarantee
    question: { en: 'What guarantee does a TypeScript branded type provide, and what does it not provide?', zh: 'TypeScript 品牌类型能提供什么保证，又不能提供什么保证？' }
    answer:
      en: 'A branded type makes structurally identical values incompatible by intersecting a base type with a marker. If UserId and ProductId have distinct brands, checked TypeScript cannot pass one where the other is required, while either can still be used as its base type. The guarantee is static and depends on controlled construction. The marker is erased from JavaScript, so it performs no validation, existence check, or authorization. Assertions, any, and JavaScript callers can bypass it. I therefore describe a brand as evidence that one named constructor checked a local invariant, not as proof of every business fact about the value.'
      zh: '品牌类型把基础类型与标记相交，使结构相同的值变得不兼容。若 UserId 与 ProductId 使用不同品牌，经过检查的 TypeScript 代码就不能混用它们，但两者仍能作为基础类型使用。这项保证只存在于静态检查阶段，而且依赖受控的创建路径；标记在 JavaScript 中会被擦除，不会执行验证、存在性检查或授权。类型断言、any 和 JavaScript 调用方都能绕过它。因此，我把品牌解释为“某个命名构造函数检查过一项本地不变量”的证据，而不是关于该值所有业务事实的证明。'
    topics: [typescript/branded-types]
    section: { en: 'Type system', zh: '类型系统' }
    level: intermediate
    frequency: common
    tags: [branded-types, structural-typing, type-erasure]

  - id: branded-types-constructor-boundary
    question: { en: 'How would you design a safe constructor for a branded value from external data?', zh: '怎样为来自外部数据的品牌值设计安全构造函数？' }
    answer:
      en: 'I accept unknown at the trust boundary and write down the complete invariant before coding. For a positive numeric ID, that usually means checking the primitive type, integrality, positivity, and safe-integer range. Only the success branch contains the assertion that returns the branded type; callers receive a useful error, Result, or exception on failure. I export the branded alias and constructor together but keep the unique-symbol key private. I avoid a public generic cast helper because it creates unchecked values. Tests cover valid data, missing or wrong types, fractions, bounds, and every other condition named by the contract.'
      zh: '我会在信任边界接收 unknown，并在编码前写清完整不变量。对于正数 ID，通常需要检查原始类型、整数、正数和安全整数范围。只有成功分支包含返回品牌类型的断言；失败时则向调用方返回有用的错误、Result 或异常。我会一起导出品牌别名与构造函数，但把唯一符号键留在模块内部，也不会公开通用转换辅助函数。测试应覆盖有效数据、缺失值、错误类型、小数、边界值，以及契约中写明的每项条件。'
    topics: [typescript/branded-types]
    section: { en: 'Runtime boundaries', zh: '运行时边界' }
    level: advanced
    frequency: common
    tags: [smart-constructor, unknown, runtime-validation]

  - id: branded-types-unique-symbol
    question: { en: 'Why use a unique symbol key instead of a public __brand string property?', zh: '为什么使用唯一符号键，而不是公开的 __brand 字符串属性？' }
    answer:
      en: 'A unique-symbol declaration has its own type identity. Used as a computed property key, it makes compatibility depend on that declaration, so separately declared keys remain distinct even when their descriptions or tag text match. Keeping the key private also prevents consumers from accidentally constructing the marker shape. A public __brand string can be adequate inside one codebase, but two modules that copy the same property and literal tag are structurally compatible. Neither option is a security boundary: forced assertions and JavaScript can bypass both. The symbol pattern mainly improves isolation, ownership, and resistance to accidental collisions.'
      zh: '每个唯一符号声明都有独立的类型身份。把它用作计算属性键后，兼容性会依赖该声明，所以分别声明的键即使描述或标签文字相同也不会混同。键保持私有时，使用方也不容易意外构造出标记结构。公开的 __brand 字符串在单一代码库中可以工作，但两个模块复制相同属性与字面量标签后，会按照结构类型规则兼容。两种方案都不是安全边界，强制断言和 JavaScript 都能绕过；符号模式改善的主要是隔离、所有权和防碰撞能力。'
    topics: [typescript/branded-types]
    section: { en: 'API design', zh: 'API 设计' }
    level: advanced
    frequency: occasional
    tags: [unique-symbol, modules, structural-typing]

  - id: branded-types-proof-lifecycle
    question: { en: 'How can a branded value lose the invariant its type claims?', zh: '品牌值怎样会失去其类型声称的不变量？' }
    answer:
      en: 'Primitive operations create new values and normally return the base type, so arithmetic, normalization, and serialization do not automatically preserve a brand. Domain operations should re-run the constructor when overflow, range, format, or precision could change. Object brands have another risk: mutating the branded object through any alias can invalidate a previous check while the static marker remains. I prefer validated immutable snapshots and explicit state transitions. Persisted values also need attention when validation rules change. On every read boundary, the application must decide whether an old value is still valid, needs migration, or must be rejected.'
      zh: '原始值运算会创建新值，而且通常返回基础类型，因此算术、规范化和序列化不会自动保留品牌。若溢出、范围、格式或精度可能变化，领域操作应重新调用构造函数。对象品牌还有别名风险：任何引用修改同一对象后，旧检查都可能失效，但静态标记仍存在。我更倾向于验证后的不可变快照与显式状态转换。验证规则升级后，持久化旧值也需要处理；每个读取边界都要决定旧值仍然有效、需要迁移，还是必须拒绝。'
    topics: [typescript/branded-types]
    section: { en: 'Invariant maintenance', zh: '不变量维护' }
    level: advanced
    frequency: occasional
    tags: [invariants, mutation, serialization]

  - id: declaration-files-contract-boundary
    question: { en: 'What does a declaration file guarantee, and what must be verified separately?', zh: '声明文件能保证什么，哪些内容必须另行验证？' }
    answer:
      en: 'A declaration file gives the TypeScript checker a static contract for code implemented elsewhere. It can reject calls with incompatible arguments, expose documented members to editors, and preserve relationships expressed by its types. It does not create a function, validate external data, or prove that JavaScript exports the declared value. I verify both halves: run type tests that cover accepted and rejected calls, then import the packed runtime artifact and exercise the same public entry. A declaration is useful only while its names, module format, optional results, and asynchronous behavior match the implementation.'
      zh: '声明文件为在其他位置实现的代码提供静态契约。它可以让 TypeScript 拒绝参数不兼容的调用，在编辑器中展示已声明成员，并维护类型表达的关系。但它不会创建函数、验证外部数据，也不能证明 JavaScript 确实导出了声明中的值。我会分别验证两部分：先运行覆盖合法与非法调用的类型测试，再导入打包后的运行时产物，执行同一个公开入口。只有名称、模块格式、可选结果和异步行为都与实现一致时，这份声明才可信。'
    topics: [typescript/declaration-files]
    section: { en: 'Type contracts', zh: '类型契约' }
    level: intermediate
    frequency: common
    tags: [declaration-files, type-erasure, runtime-contract]

  - id: declaration-files-module-vs-global
    question: { en: 'How do you choose between a module declaration file and a global declaration?', zh: '怎样在模块声明文件与全局声明之间选择？' }
    answer:
      en: 'I follow how consumers obtain the runtime value. If they import a package, the declaration should be a module whose exports mirror that package. If a script tag, host, or build bootstrap genuinely installs a global, a global declaration can describe it. A file with no top-level import or export contributes names globally, so accidental omissions cause pollution and merging. For an intentional global addition from a module file, I use export {} and declare global, keep the added surface small, and test that every supported runtime environment installs the value before application code reads it.'
      zh: '我会根据使用方取得运行时值的方式选择。如果使用方导入一个包，声明就应是模块，并逐项映射该包的导出。如果脚本标签、宿主或构建启动代码确实安装了全局值，才适合使用全局声明。没有顶层 import 或 export 的文件会向全局作用域贡献名称，遗漏模块标记会造成污染和意外合并。若要从模块文件有意补充全局，我会使用 export {} 与 declare global，把补充面压到最小，并测试每个受支持环境都会在业务代码读取前安装该值。'
    topics: [typescript/declaration-files]
    section: { en: 'Scope and modules', zh: '作用域与模块' }
    level: intermediate
    frequency: common
    tags: [ambient-declarations, globals, modules]

  - id: declaration-files-test-strategy
    question: { en: 'How would you test a handwritten declaration against an untyped JavaScript package?', zh: '怎样测试手写声明是否符合无类型 JavaScript 包？' }
    answer:
      en: 'I start from the packed package rather than its source tree, because file lists and exports are part of the contract. Positive tests import every public entry and check representative inference. Negative tests use @ts-expect-error for arguments and results that must be rejected; an unused directive then catches accidental widening. I run tsc with the consumer configurations the package supports and inspect traceResolution when paths differ. Finally, I execute runtime imports for the same scenarios and compare export shape, missing-value behavior, promises, and thrown errors. Type tests and runtime tests cover different failure surfaces, so neither replaces the other.'
      zh: '我会从打包后的包开始测试，而不是直接读取源码目录，因为文件清单与 exports 也是契约的一部分。正向测试导入每个公开入口并检查代表性的推断结果；负向测试用 @ts-expect-error 标记必须被拒绝的参数与结果，声明意外变宽后，失去对应诊断的指令就会报错。我会在包支持的使用方配置下运行 tsc，路径不一致时检查 traceResolution。最后还要执行同一批运行时导入，对照导出形状、缺失值、Promise 与异常。类型测试和运行时测试覆盖不同失败面，不能互相替代。'
    topics: [typescript/declaration-files]
    section: { en: 'Verification', zh: '验证' }
    level: advanced
    frequency: common
    tags: [type-tests, runtime-tests, module-resolution]

  - id: declaration-files-dual-package
    question: { en: 'What can go wrong when one package publishes both ESM and CommonJS declarations?', zh: '一个包同时发布 ESM 与 CommonJS 声明时，可能出现哪些问题？' }
    answer:
      en: 'The two runtime entries may expose different default and named exports even when they come from one source. Declaration extensions also carry module information: .d.mts corresponds to ESM .mjs, .d.cts to CommonJS .cjs, while .d.ts follows the surrounding package rules for .js. I map each conditional exports branch to a matching declaration, put the types condition before its runtime default, and test both import and require from a temporary installation. Copying one declaration under several names is safe only after proving that both runtime shapes and consumer resolution results are actually identical.'
      zh: '两套运行时入口即使来自同一源码，也可能暴露不同的默认导出与命名导出。声明扩展名还携带模块信息：.d.mts 对应 ESM 的 .mjs，.d.cts 对应 CommonJS 的 .cjs，而 .d.ts 会按照所在包对 .js 的规则解释。我会让每个条件 exports 分支映射到匹配的声明，把 types 条件放在相应 runtime default 之前，并从临时安装目录分别测试 import 与 require。只有证明两种运行时形状和使用方解析结果完全相同时，才可以把同一声明复制成多个名称。'
    topics: [typescript/declaration-files]
    section: { en: 'Package publishing', zh: '包发布' }
    level: advanced
    frequency: occasional
    tags: [esm, commonjs, conditional-exports]

  - id: enums-runtime-shape
    question: { en: 'What JavaScript does a TypeScript enum create, and how do numeric and string enums differ?', zh: 'TypeScript 枚举会生成什么 JavaScript，数字枚举和字符串枚举有何不同？' }
    answer:
      en: 'A regular enum creates an object at runtime, unlike an interface or type alias. A string enum emits properties from member names to string values. A numeric enum emits those forward properties plus reverse properties from numbers back to names, so Object.keys and Object.values contain both directions. Duplicate numeric values share one reverse key, and the later member name wins. I inspect the emitted artifact when build configuration matters, and I filter numeric-enum iteration by runtime value type rather than asserting that every object entry is one declared member.'
      zh: '普通枚举会在运行时创建对象，这与接口和类型别名不同。字符串枚举输出从成员名到字符串值的属性；数字枚举还会输出从数字到名称的反向属性，所以 Object.keys 和 Object.values 会包含两个方向。重复数字值共用一个反向键，后声明的成员名会覆盖前者。构建配置会影响行为时，我会检查真实输出；遍历数字枚举时则按运行时值类型过滤，不会断言对象中的每个条目都对应一个声明成员。'
    topics: [typescript/enums]
    section: { en: 'Type system', zh: '类型系统' }
    level: intermediate
    frequency: common
    tags: [enums, runtime-object, reverse-mapping]

  - id: enums-external-data
    question: { en: 'How should an application turn external JSON into a value of an enum type?', zh: '应用应怎样把外部 JSON 转换成枚举类型的值？' }
    answer:
      en: 'I keep JSON.parse output as unknown and validate before assigning an enum type. For a string enum, I first prove the container and field types, then compare the field with a Set built from the known runtime values. For a numeric enum, checking typeof number is insufficient because a widened number can enter the type and reverse mappings mix keys and values; I use an explicit allowed-value set and decide how to handle unknown bits. An assertion is never the validator. The parser returns a constructed domain object only after every required field and constraint succeeds.'
      zh: '我会让 JSON.parse 的结果保持为 unknown，并在赋予枚举类型前执行验证。对于字符串枚举，先证明容器与字段类型，再把字段同已知运行时值构成的 Set 比较。对于数字枚举，只检查 typeof number 并不够，因为扩宽后的 number 可以进入该类型，反向映射还会混合键和值；我会使用明确的允许值集合，并决定怎样处理未知位。类型断言绝不是验证器。只有每个必填字段和约束都通过后，解析器才返回构造好的领域对象。'
    topics: [typescript/enums]
    section: { en: 'Runtime boundaries', zh: '运行时边界' }
    level: intermediate
    frequency: common
    tags: [runtime-validation, unknown, json]

  - id: enums-choose-representation
    question: { en: 'When would you choose an enum, an as const object, or a literal union?', zh: '什么时候应选择枚举、as const 对象或字面量联合？' }
    answer:
      en: 'I start with the runtime contract. A literal union is smallest when callers only need a closed type and should pass native string literals. An as const object adds an iterable JavaScript value while deriving the union from one source of truth, which fits wire values and option lists. I choose a regular enum when the API deliberately uses enum-member identity or needs numeric reverse lookup. I avoid deciding from generic bundle-size claims because emit and tree-shaking depend on the actual compiler and bundler. Whichever representation I choose, external input still needs runtime validation.'
      zh: '我会先看运行时契约。调用方只需要封闭类型，而且应该直接传原生字符串字面量时，字面量联合最简洁。as const 对象再增加一个可遍历的 JavaScript 值，并从同一事实来源派生联合，适合线上值和选项列表。API 有意要求枚举成员身份，或确实需要数字反查时，我会选择普通枚举。我不会根据笼统的包体积说法决定，因为输出和 tree-shaking 取决于实际编译器与打包器。无论采用哪种表示，外部输入仍需运行时验证。'
    topics: [typescript/enums]
    section: { en: 'API design', zh: 'API 设计' }
    level: intermediate
    frequency: common
    tags: [as-const, literal-union, api-design]

  - id: enums-const-boundary
    question: { en: 'Why can publishing an ambient const enum break a consumer?', zh: '为什么发布环境 const enum 可能破坏使用方？' }
    answer:
      en: 'A consumer can inline a const-enum value from dependency version A while loading version B at runtime. If the member codes changed, checked source can execute the wrong branch, and tests often miss it because local compile and execution use one installation. Ambient const enums also require cross-file value knowledge that single-file transpilers do not have, so references conflict with isolatedModules. I avoid ambient const enums in public declarations. A library can expose a regular enum or as const object, or use preserveConstEnums internally and strip const from the declarations it publishes.'
      zh: '使用方可能在编译时内联依赖版本 A 的常量枚举值，却在运行时加载版本 B。若成员编号发生变化，通过检查的源码也会进入错误分支；本地编译和执行通常使用同一次安装，所以测试容易漏掉问题。环境 const enum 还要求知道其他文件中的具体值，而单文件转译器没有这些信息，因此引用会与 isolatedModules 冲突。我不会在公共声明中暴露环境 const enum。库可以公开普通枚举或 as const 对象，也可以内部使用 preserveConstEnums，并从发布声明中移除 const。'
    topics: [typescript/enums]
    section: { en: 'Package boundaries', zh: '包边界' }
    level: advanced
    frequency: occasional
    tags: [const-enum, isolated-modules, version-skew]

  - id: generics-relationship-vs-any
    question: { en: 'What does a generic type parameter express that any does not?', zh: '泛型类型参数能表达哪些 any 无法表达的信息？' }
    answer:
      en: 'A type parameter connects positions in a signature for one call or one instance. In <T>(value: T) => T, the caller learns that the result preserves the selected input type. any accepts the input but opts out of checking, so the result carries no trustworthy relationship and unsafe operations can spread. I use unknown when a value may have any runtime shape but must be narrowed before use. I use a generic when two or more positions must vary together, such as an array element, callback parameter, and optional result.'
      zh: '类型参数会在一次调用或一个实例的签名中连接多个位置。在 <T>(value: T) => T 中，调用者可以知道结果保留了所选输入类型。any 虽然接受输入，却会退出检查，因此结果没有可信的对应关系，不安全操作还会继续传播。如果值在运行时可能具有任意形状，但使用前必须收窄，我会选择 unknown；当两个以上位置需要同步变化，例如数组元素、回调参数和可选结果时，我才使用泛型。'
    topics: [typescript/generics]
    section: { en: 'Language core', zh: '语言核心' }
    level: intermediate
    frequency: common
    tags: [generics, type-parameters, any, unknown]

  - id: generics-constraint-vs-validation
    question: { en: 'Why is a generic constraint not runtime validation?', zh: '为什么泛型约束不等于运行时验证？' }
    answer:
      en: 'A constraint such as T extends { id: string } tells the checker which typed arguments are acceptable and which members the implementation may access. TypeScript erases that constraint from emitted JavaScript. JSON, JavaScript callers, any, and assertions can therefore supply values that do not have a valid id. I validate external data as unknown, including shape and domain rules such as non-empty format or authorization, before it enters the generic core. The constraint should then describe the smallest static capability the algorithm needs rather than pretending to secure the boundary.'
      zh: 'T extends { id: string } 一类约束告诉检查器哪些已标注类型的实参可以传入，以及实现可以访问哪些成员。TypeScript 输出 JavaScript 时会擦除这项约束，因此 JSON、JavaScript 调用方、any 和类型断言仍可送入没有有效 id 的值。我会先把外部数据视为 unknown，验证结构以及非空、格式、授权等领域规则，再交给泛型核心。之后，约束只描述算法所需的最小静态能力，不假装保护运行时边界。'
    topics: [typescript/generics]
    section: { en: 'Runtime boundaries', zh: '运行时边界' }
    level: intermediate
    frequency: common
    tags: [generic-constraints, type-erasure, runtime-validation]

  - id: generics-safe-parser
    question: { en: 'How would you design a safe generic JSON parser in TypeScript?', zh: '怎样在 TypeScript 中设计安全的泛型 JSON 解析器？' }
    answer:
      en: 'I would not expose a function that returns caller-selected T after JSON.parse(raw) as T. The parser should first produce unknown, then require runtime evidence tied to T: a schema whose parse result is T or a predicate of the form (value: unknown) => value is T. Failure should return a result or throw a boundary-specific error before domain code runs. I would test malformed JSON, null, missing and mistyped fields, and every domain invariant. The generic preserves the relationship between validator and result; it does not prove the validator itself is correct.'
      zh: '我不会公开一个先执行 JSON.parse(raw) as T、再返回调用者任意选择的 T 的函数。解析结果应先保持为 unknown，然后要求传入与 T 对应的运行时证据：解析结果为 T 的模式，或形如 (value: unknown) => value is T 的谓词。失败应返回结果类型，或在进入领域代码前抛出边界专用错误。测试要覆盖格式错误的 JSON、null、字段缺失或类型错误，以及每项领域不变量。泛型只维持验证器与结果的关系，并不能证明验证器实现正确。'
    topics: [typescript/generics]
    section: { en: 'API design', zh: 'API 设计' }
    level: advanced
    frequency: common
    tags: [generics, json, type-predicate, runtime-witness]

  - id: generics-parameter-ownership
    question: { en: 'When should a type parameter belong to a method versus its interface or class?', zh: '类型参数应放在方法上，还是放在接口或类上？' }
    answer:
      en: 'Put the parameter on a method when every call may choose independently, as with a converter that accepts a new input type each time. Put it on an interface or class when one choice must govern several members for the lifetime of an instance, as with Repository<Entity> or Map<Key, Value>. This placement records who owns the choice and how long it lasts. I also check static members separately because they belong to the constructor, not a generic instance, so a static factory must declare type parameters of its own.'
      zh: '如果每次调用都可以独立选择类型，例如转换器每次接收新的输入类型，就把参数放在方法上。如果一次选择需要在实例生命周期内约束多个成员，例如 Repository<Entity> 或 Map<Key, Value>，则放在接口或类上。这个位置记录了谁拥有类型选择，以及选择持续多久。我还会单独检查静态成员，因为它们属于构造函数，而不属于泛型实例；静态工厂必须声明自己的类型参数。'
    topics: [typescript/generics]
    section: { en: 'API design', zh: 'API 设计' }
    level: intermediate
    frequency: occasional
    tags: [generic-classes, generic-methods, api-design]

  - id: literal-types-closed-set
    question: { en: 'When should you use a literal union instead of string?', zh: '什么时候应使用字面量联合，而不是 string？' }
    answer:
      en: 'I use a literal union when the program owns a finite set of meaningful choices, such as request methods, workflow states, or command names. The union rejects misspellings, drives completion, and can support exhaustive control flow. I keep string when values are user-defined, server-extensible, or otherwise open. Adding string to a literal union does not provide both behaviors; string already contains every string literal, so the constraint collapses. At external boundaries, even a closed union needs runtime membership checks because TypeScript erases the type and JavaScript can still supply any value.'
      zh: '当程序拥有一组有限且有明确含义的选择，例如请求方法、工作流状态或命令名称时，我会使用字面量联合。联合可以拒绝拼写错误、提供补全，并支持穷尽控制流。值由用户定义、可由服务器扩展或本来就是开放集合时，应继续使用 string。把 string 加进字面量联合不会兼得两种行为，因为 string 已经包含所有字符串字面量，约束会直接消失。外部边界即使使用封闭联合，也仍需运行时成员检查，因为 TypeScript 会擦除类型，而 JavaScript 仍能传入任意值。'
    topics: [typescript/literal-types]
    section: { en: 'Type system', zh: '类型系统' }
    level: beginner
    frequency: common
    tags: [literal-union, api-design, assignability]

  - id: literal-types-widening-control
    question: { en: 'How do an annotation, as const, and satisfies differ when controlling literal widening?', zh: '控制字面量拓宽时，类型注解、as const 与 satisfies 有什么区别？' }
    answer:
      en: 'An annotation declares the type a variable or API boundary should expose, so it can intentionally widen a specific initializer to a reusable union. as const asks the checker to preserve literal values and makes object-literal properties readonly and array literals readonly tuples; it does not freeze anything at runtime. satisfies checks that an expression is assignable to a target shape while retaining useful inferred detail instead of replacing the whole expression type with that target. It neither adds readonly behavior nor validates runtime data. I choose among them from the intended contract and mutation model, not by whichever form silences an error.'
      zh: '类型注解声明变量或 API 边界应公开的类型，因此可以有意把具体初始化值拓宽为可复用联合。as const 要求检查器保留字面量值，并让对象字面量属性变为只读、数组字面量变为只读元组；它不会在运行时冻结任何内容。satisfies 检查表达式能否赋给目标结构，同时保留有用的推断细节，而不是用目标替换整个表达式类型。它既不添加只读行为，也不验证运行时数据。我会根据预期契约与修改模型选择，而不是看哪种写法能压掉错误。'
    topics: [typescript/literal-types]
    section: { en: 'Type inference', zh: '类型推断' }
    level: intermediate
    frequency: common
    tags: [literal-widening, as-const, satisfies]

  - id: literal-types-runtime-source
    question: { en: 'How do you keep a runtime list and its literal union in sync?', zh: '怎样让运行时列表与对应的字面量联合保持同步？' }
    answer:
      en: 'For a short set owned in source, I declare a readonly tuple with as const and derive the union with typeof VALUES[number]. The tuple can drive rendering and membership checks, while the type is generated from the same entries. A type predicate must still perform a real comparison; its return annotation alone proves nothing. For a larger external protocol, I prefer one authoritative schema or interface description that generates both the parser and the TypeScript type. I test an accepted value, an unknown value, and each member-specific payload so a stale validator cannot make the static union look safer than runtime data.'
      zh: '对于源码拥有的短小集合，我会用 as const 声明只读元组，再通过 typeof VALUES[number] 派生联合。元组可以驱动渲染和成员检查，类型则来自同一批条目。类型谓词仍必须执行真实比较，仅有返回注解不能证明任何事实。较大的外部协议应使用一份权威模式或接口描述，并由它生成解析器与 TypeScript 类型。我会测试一个允许值、一个未知值，以及每种成员专属载荷，防止过期验证器让静态联合显得比运行时数据更安全。'
    topics: [typescript/literal-types]
    section: { en: 'Runtime boundaries', zh: '运行时边界' }
    level: intermediate
    frequency: common
    tags: [as-const, runtime-validation, single-source-of-truth]

  - id: literal-types-exhaustiveness
    question: { en: 'How does a literal discriminant enable exhaustive handling?', zh: '字面量判别字段如何实现穷尽处理？' }
    answer:
      en: 'Each union member uses the same property name with a distinct literal value and carries only the payload valid for that value. Comparing or switching on the property narrows the whole object. After every known switch case returns, the remainder should be never; passing it to an assertNever helper makes a newly added member fail compilation until the consumer handles it. A permissive default defeats that check by accepting whatever remains. I keep the helper’s runtime throw because unvalidated JSON, assertions, any, and JavaScript callers can still deliver a tag that the static union says is impossible.'
      zh: '联合的每个成员使用同一个属性名和不同的字面量值，并且只携带该值对应的合法载荷。比较该属性或对它执行 switch 会收窄整个对象。所有已知 case 返回后，剩余值应为 never；把它传给 assertNever 辅助函数，就能让新增成员导致编译失败，直到使用方完成处理。宽泛 default 会接受所有剩余值，从而破坏这项检查。我会保留辅助函数的运行时抛错，因为未验证 JSON、断言、any 和 JavaScript 调用方仍可能送入静态联合认为不可能的标签。'
    topics: [typescript/literal-types]
    section: { en: 'Unions and narrowing', zh: '联合与收窄' }
    level: intermediate
    frequency: common
    tags: [discriminated-union, never, exhaustiveness]

  - id: satisfies-annotation-difference
    question: { en: 'How does satisfies differ from a type annotation?', zh: 'satisfies 与类型注解有什么区别？' }
    answer:
      en: 'A type annotation fixes the type exposed by a variable, so reads and later assignments use that written contract. The satisfies operator instead checks whether an expression is assignable to a target and keeps the expression’s contextually inferred result. That is useful for a registry where I want complete keys and valid entries while still deriving precise names or discriminants. I choose an annotation when the variable must evolve across the target’s full range or when an exported API needs a stable public type. Neither form performs runtime validation.'
      zh: '类型注解会固定变量对外暴露的类型，因此读取和后续赋值都按照写出的契约处理。satisfies 则检查表达式能否赋给目标，并保留表达式经过上下文推断后的结果。这适合注册表：既能要求键完整、条目合法，又能继续派生精确名称或判别值。变量需要在目标的完整范围内变化，或导出 API 需要稳定公开类型时，我会使用注解。两种写法都不执行运行时验证。'
    topics: [typescript/satisfies]
    section: { en: 'Type inference', zh: '类型推断' }
    level: intermediate
    frequency: common
    tags: [satisfies, type-annotation, inference]

  - id: satisfies-contextual-inference
    question: { en: 'Does satisfies preserve every literal type without affecting inference?', zh: 'satisfies 是否会在不影响推断的情况下保留所有字面量类型？' }
    answer:
      en: 'No. The target participates in contextual typing before assignability is checked. A property targeted by the union "GET" | "POST" can retain "GET", while one targeted by plain string usually widens to string; numeric object properties also normally widen. A tuple branch in the target can make an array literal infer as a tuple. After this contextual inference, satisfies does not replace the whole result with the target type or add omitted optional properties. I verify the compiler’s displayed type and write positive type tests instead of relying on the slogan that it preserves inference.'
      zh: '不会。目标会先参与上下文类型推断，然后编译器才检查可赋值性。目标为 "GET" | "POST" 时，属性可以保留 "GET"；目标只是 string 时，属性通常拓宽为 string，数字属性也通常会拓宽。目标中的元组分支还能让数组字面量推断为元组。完成上下文推断后，satisfies 不会用整个目标替换结果，也不会补上省略的可选属性。我会查看编译器展示的实际类型，并用正向类型测试确认能力。'
    topics: [typescript/satisfies]
    section: { en: 'Contextual typing', zh: '上下文类型' }
    level: advanced
    frequency: common
    tags: [contextual-typing, literal-widening, tuples]

  - id: satisfies-runtime-boundary
    question: { en: 'Why does JSON.parse(raw) satisfies Config fail to validate configuration?', zh: '为什么 JSON.parse(raw) satisfies Config 无法验证配置？' }
    answer:
      en: 'JSON.parse returns any in TypeScript’s standard declarations, and any can satisfy almost any static target without useful evidence. The satisfies operator is then erased from emitted JavaScript, so it checks no field, allowed value, range, or unknown key. I assign parsed data to unknown, validate that it is a non-null object, inspect every required field and domain rule, and only then return Config. A schema parser can replace handwritten checks, but its runtime result must be the source of the static type. Adding an assertion before satisfies only hides the same gap.'
      zh: 'TypeScript 标准声明中的 JSON.parse 返回 any，而 any 几乎可以满足任意静态目标，无法提供有用证据。satisfies 随后会从生成的 JavaScript 中擦除，因此不会检查字段、允许值、范围或未知键。我会把解析结果赋给 unknown，确认它是非空对象，再检查每个必填字段和领域规则，最后才返回 Config。模式解析器可以替代手写检查，但静态类型必须来自真实运行结果。在 satisfies 前添加断言只会隐藏同一个缺口。'
    topics: [typescript/satisfies]
    section: { en: 'Runtime boundaries', zh: '运行时边界' }
    level: intermediate
    frequency: common
    tags: [runtime-validation, json, any, unknown]

  - id: satisfies-as-const-composition
    question: { en: 'When should you combine as const with satisfies?', zh: '什么时候应把 as const 与 satisfies 组合使用？' }
    answer:
      en: 'I combine them for a source-owned constant table whose exact primitive values and readonly tuples are part of the intended static API. Evaluation is ordered: as const first narrows the literal and marks its properties readonly, then satisfies checks that result against the target. The target must therefore accept readonly collections. I avoid the combination for state that must be reassigned or arrays owned by consumers that sort or append. It also provides no runtime immutability; Object.freeze, encapsulation, or copying is still required when mutation must be prevented while the program runs.'
      zh: '当源码拥有一份常量表，而且精确原始值与只读元组属于预期静态 API 时，我会组合两者。求值有先后顺序：as const 先收窄字面量并把属性标为只读，satisfies 再用目标检查该结果，因此目标也必须接受只读集合。状态需要重新赋值，或数组由使用方排序、追加时，我不会采用这种组合。它也不提供运行时不可变性；程序运行时确实要阻止修改，仍需使用 Object.freeze、封装或复制。'
    topics: [typescript/satisfies]
    section: { en: 'API design', zh: 'API 设计' }
    level: intermediate
    frequency: occasional
    tags: [as-const, readonly, api-design]

  - id: strict-mode-guarantee
    question: { en: 'What does TypeScript strict mode guarantee, and where does that guarantee stop?', zh: 'TypeScript 严格模式能保证什么，它的保证在哪里结束？' }
    answer:
      en: 'Strict mode enables a family of conservative static checks for nulls, implicit any, this, function compatibility, class initialization, catch variables, built-in iterators, and bind/call/apply. It rejects source operations that lack enough type evidence. The guarantee stops at code the compiler can check. Types are erased from emitted JavaScript, so JSON, network responses, JavaScript callers, explicit any, assertions, and suppressed diagnostics can still violate the declared model. I treat strict mode as a strong default for trusted typed code and add runtime validation at every untrusted boundary.'
      zh: '严格模式会为 null、隐式 any、this、函数兼容性、类初始化、catch 变量、内置迭代器以及 bind、call、apply 启用一组保守的静态检查。源码操作缺少足够类型证据时，编译器会拒绝它。保证范围到编译器能够检查的代码为止；类型会从 JavaScript 输出中擦除，因此 JSON、网络响应、JavaScript 调用方、显式 any、断言和被抑制的诊断仍可能违反声明模型。我把严格模式作为可信类型代码的强默认值，并在每个不可信边界补充运行时验证。'
    topics: [typescript/strict-mode]
    section: { en: 'Type system', zh: '类型系统' }
    level: intermediate
    frequency: common
    tags: [strict-mode, type-erasure, runtime-validation]

  - id: strict-mode-extra-options
    question: { en: 'Which useful checks remain outside strict: true, and how do you decide whether to enable them?', zh: '哪些实用检查不属于 strict: true，应如何决定是否启用它们？' }
    answer:
      en: 'I evaluate noUncheckedIndexedAccess, exactOptionalPropertyTypes, and noImplicitOverride separately. The first adds undefined to unchecked indexed reads, the second distinguishes an absent optional property from writing undefined, and the third requires override on replaced base members. They are not members of the TypeScript 6 strict family, and each can expose many existing assumptions. I enable one at a time against the project contract, fix errors rather than mass-adding assertions, and keep tests for missing indexes, optional-property writes, and inheritance refactors. The effective configuration, not the presence of strict alone, defines the baseline.'
      zh: '我会分别评估 noUncheckedIndexedAccess、exactOptionalPropertyTypes 和 noImplicitOverride。第一项让未检查的索引读取包含 undefined，第二项区分可选属性缺失与显式写入 undefined，第三项要求覆盖基类成员时写出 override。它们不属于 TypeScript 6 的 strict 选项组，而且每一项都可能暴露大量既有假设。我会根据项目契约一次启用一项，直接修复错误而不是批量添加断言，并保留覆盖索引缺失、可选属性写入和继承重构的测试。最终基线由生效配置决定，不能只看 strict 是否存在。'
    topics: [typescript/strict-mode]
    section: { en: 'Compiler configuration', zh: '编译器配置' }
    level: intermediate
    frequency: common
    tags: [tsconfig, indexed-access, optional-properties]

  - id: strict-function-variance
    question: { en: 'How does strictFunctionTypes affect callback compatibility, and what exception matters?', zh: 'strictFunctionTypes 如何影响回调兼容性，哪个例外最重要？' }
    answer:
      en: 'For function properties, parameter compatibility is checked contravariantly. A handler accepting Animal can stand in for one that will receive only Dog, because it can handle every value that caller supplies. A dog-only handler cannot stand in for a general Animal handler. Method syntax remains bivariant for compatibility with common class and DOM hierarchies, so an interface method may admit the unsafe direction. I prefer function-property syntax for new callback contracts and test existing method-based APIs with wider inputs. Return types follow the ordinary covariant direction and should be reviewed separately.'
      zh: '对于函数属性，参数兼容性按逆变方向检查。接收 Animal 的处理器可以放在只会收到 Dog 的位置，因为它能处理调用方提供的每个值；只处理 Dog 的函数不能充当通用 Animal 处理器。为了兼容常见类和 DOM 层次，方法语法仍允许双变，所以接口方法可能放过不安全方向。我会为新的回调契约使用函数属性，并用较宽输入测试现有的方法式 API。返回类型遵循普通的协变方向，应与参数分开审查。'
    topics: [typescript/strict-mode]
    section: { en: 'Function types', zh: '函数类型' }
    level: advanced
    frequency: common
    tags: [strict-function-types, contravariance, callbacks]

  - id: strict-mode-migration-evidence
    question: { en: 'How would you review a gradual strict-mode migration?', zh: '你会怎样审查一次渐进式严格模式迁移？' }
    answer:
      en: 'I first run tsc with an explicit project path and inspect showConfig so inherited overrides and the actual file set are visible. Then I inventory explicit any, assertions, definite-assignment markers, ts-ignore directives, ts-expect-error directives, and skipLibCheck. Each escape hatch needs a narrow scope, a stated runtime assumption, a test, and a removal condition. I prioritize public inputs, outputs, and untrusted data boundaries because one upstream any can create many downstream errors. Completion means the intended config is effective and boundary tests pass, not merely that the diagnostic count reached zero.'
      zh: '我会先使用明确的项目路径运行 tsc，再检查 showConfig，让继承覆盖和实际文件集合都可见。随后清点显式 any、类型断言、明确赋值标记、ts-ignore、ts-expect-error 和 skipLibCheck。每个逃生口都要有狭窄范围、写明的运行时假设、对应测试和删除条件。我会优先修复公开输入输出与不可信数据边界，因为一个上游 any 就可能制造大量下游错误。完成迁移意味着目标配置确实生效且边界测试通过，而不只是诊断数量变成零。'
    topics: [typescript/strict-mode]
    section: { en: 'Migration', zh: '迁移' }
    level: advanced
    frequency: occasional
    tags: [strict-mode, migration, code-review]

  - id: type-coverage-metric
    question: { en: 'What does TypeScript type coverage measure, and what is its denominator?', zh: 'TypeScript 类型覆盖率衡量什么，分母是什么？' }
    answer:
      en: 'The type-coverage tool counts identifiers, not lines. Its basic ratio is identifiers whose checker type is not any divided by all identifiers in the selected program. One upstream any can therefore create several uncovered positions as it flows through properties, calls, and callbacks. The denominator depends on the effective tsconfig, file filters, allowJs, generated sources, compiler version, and tool version. I only compare results when those inputs are fixed, and I inspect raw counts and detail output because a rounded percentage can hide a small regression.'
      zh: 'type-coverage 工具统计标识符，而不是源码行。基本比率是检查器类型不为 any 的标识符数除以所选程序中的标识符总数。一个上游 any 沿属性、调用和回调传播时，可能产生多个未覆盖位置。分母取决于实际生效的 tsconfig、文件过滤器、allowJs、生成源码、编译器版本和工具版本。只有这些输入固定时，我才比较结果，并同时查看原始计数与详情，因为取整百分比可能隐藏小幅回退。'
    topics: [typescript/type-coverage]
    section: { en: 'Static analysis', zh: '静态分析' }
    level: intermediate
    frequency: common
    tags: [type-coverage, any, measurement]

  - id: type-coverage-versus-safety
    question: { en: 'Why does 100% type coverage not prove runtime type safety?', zh: '为什么 100% 类型覆盖率不能证明运行时类型安全？' }
    answer:
      en: 'Coverage reports what the checker believes, not whether that belief matches runtime data. An inaccurate interface, handwritten declaration file, non-null assertion, or JSON.parse(raw) as User can give identifiers concrete types without checking a single incoming value. Types are then erased from emitted JavaScript. I treat a perfect score as evidence that current rules found no tracked escape hatch, not as a soundness proof. External values still enter as unknown, pass runtime validation, and receive boundary tests for missing fields, wrong primitives, malformed containers, and domain constraints.'
      zh: '覆盖率报告检查器相信什么，而不证明这种相信符合运行时数据。错误接口、手写声明文件、非空断言或 JSON.parse(raw) as User 都能让标识符获得具体类型，却没有检查任何输入值。类型随后还会从输出的 JavaScript 中擦除。我把满分理解为当前规则没有发现受跟踪的逃生口，而不是健全性证明。外部值仍应以 unknown 进入，通过运行时验证，并接受字段缺失、原始类型错误、容器损坏和领域约束等边界测试。'
    topics: [typescript/type-coverage]
    section: { en: 'Type safety', zh: '类型安全' }
    level: intermediate
    frequency: common
    tags: [type-safety, type-erasure, runtime-validation]

  - id: type-coverage-stable-ci
    question: { en: 'How would you make a type-coverage gate comparable across pull requests?', zh: '怎样让不同拉取请求中的类型覆盖率门槛可比较？' }
    answer:
      en: 'I pin TypeScript and type-coverage, name an explicit project file, keep strict mode fixed, and review every include, exclude, and command-line file filter. The policy lives in version control rather than being reconstructed in each workflow. CI runs tsc and type coverage as separate commands, then trusts process exit status instead of scraping display text. I record the starting numerator and denominator, set atLeast to the baseline, and ratchet it upward after repairs. A tool or scope upgrade gets its own change and a newly documented baseline.'
      zh: '我会锁定 TypeScript 与 type-coverage 版本，指定明确的项目文件，固定严格模式，并审核每个 include、exclude 和命令行文件过滤器。策略放在版本控制中，不由各个工作流重新拼装。CI 分别运行 tsc 与类型覆盖率，并信任进程退出状态，而不是解析展示文本。我记录起始分子与分母，把 atLeast 设为基线，修复后再逐步上调。工具或范围升级应单独提交，并记录新的基线。'
    topics: [typescript/type-coverage]
    section: { en: 'Continuous integration', zh: '持续集成' }
    level: intermediate
    frequency: common
    tags: [ci, baseline, ratchet]

  - id: type-coverage-migration
    question: { en: 'How do you use type coverage during a gradual migration without gaming the metric?', zh: '渐进迁移中怎样使用类型覆盖率而不操纵指标？' }
    answer:
      en: 'I begin with strict detail output and group uncovered identifiers by propagation source rather than fixing each line independently. Boundaries such as JSON parsing, untyped libraries, and broad generic helpers come first because one repair can restore an entire chain. When an any cannot disappear yet, I confine it to a small adapter, assign its result to unknown immediately, validate before returning a domain type, and record an owner and removal condition. I reject broad ignoreFiles changes and bulk ignore comments unless the excluded code has another reviewed verification path.'
      zh: '我先取得严格模式详情，按传播源对未覆盖标识符分组，而不是逐行独立修复。JSON 解析、无类型库和过宽泛型辅助函数等边界优先，因为一次修复可能恢复整条链。暂时无法删除 any 时，我把它限制在小型适配器中，立即把结果赋给 unknown，验证后才返回领域类型，并记录所有者与删除条件。除非被排除代码另有经过评审的验证路径，否则不接受宽泛的 ignoreFiles 改动或批量忽略注释。'
    topics: [typescript/type-coverage]
    section: { en: 'Migration', zh: '迁移' }
    level: advanced
    frequency: occasional
    tags: [migration, any, unknown]
