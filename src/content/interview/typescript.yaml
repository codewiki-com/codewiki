track: typescript
items:
  - id: advanced-types-keyof-indexed-mapped
    question: { en: 'How do keyof, indexed access, and mapped types work together?', zh: 'keyof、索引访问类型和映射类型如何协作？' }
    answer:
      en: 'keyof T produces the union of known keys in T. Indexed access, T[K], retrieves the value type associated with one key or a union of keys. A mapped type iterates over a key union and constructs one property per key, optionally changing modifiers, values, or names. A common pattern maps each key to a complete object and then indexes the mapped object with keyof T to obtain a discriminated union. Keeping the same K in related fields preserves their correlation; indexing the fields independently loses it.'
      zh: 'keyof T 会产生 T 的已知键联合，索引访问 T[K] 则取得一个键或一组键对应的值类型。映射类型遍历键联合，为每个键构造属性，并可修改修饰符、值类型或名称。常见模式是先把每个键映射成完整对象，再用 keyof T 索引映射结果，得到可辨识联合。相关字段都使用同一个 K 时，对应关系会保留；如果分别索引各字段，这种关系就会丢失。'
    topics: [typescript/advanced-types]
    section: { en: 'Type transformations', zh: '类型转换' }
    level: intermediate
    frequency: common
    tags: [keyof, indexed-access, mapped-types]

  - id: advanced-types-distributive-conditionals
    question: { en: 'When does a conditional type distribute, and how do you prevent it?', zh: '条件类型何时会分布，怎样阻止分布？' }
    answer:
      en: 'A conditional type distributes when its checked side is a naked type parameter, as in T extends U ? X : Y, and T is instantiated with a union. The checker evaluates the conditional for each union member and unions the results. This is useful for filters such as Extract, where rejected members become never. To test the union as one value, wrap both sides in single-element tuples: [T] extends [U]. I would test both forms with one member, a mixed union, never, and unknown because the empty-union case is easy to miss.'
      zh: '当条件类型的受检查位置是裸类型参数，例如 T extends U ? X : Y，而且 T 被实例化为联合时，检查器会对每个联合成员分别计算，再合并结果。这适合实现 Extract 一类过滤器，因为被拒绝的成员会变成 never。若要把整个联合当作一次输入，应把两侧包装成单元素元组，即 [T] extends [U]。测试时应同时覆盖单成员、混合联合、never 和 unknown，尤其不能漏掉空联合边界。'
    topics: [typescript/advanced-types]
    section: { en: 'Conditional types', zh: '条件类型' }
    level: advanced
    frequency: common
    tags: [conditional-types, distribution, never]

  - id: advanced-types-runtime-boundary
    question: { en: 'Why can a precisely derived TypeScript type still be unsafe at a data boundary?', zh: '为什么精确派生的 TypeScript 类型在数据边界仍可能不安全？' }
    answer:
      en: 'TypeScript erases types when it emits JavaScript, so a conditional or mapped type performs no runtime validation. JSON.parse(raw) as Event merely tells the checker to trust the programmer; it does not inspect a discriminant, required field, or numeric range. External values should enter as unknown and pass through a runtime parser or validator before receiving the domain type. After that boundary, derived types are valuable because they preserve relationships among trusted values. I also audit any assertion connecting Object.keys or dynamic assignment to a mapped type, since runtime enumeration and keyof are not identical.'
      zh: 'TypeScript 输出 JavaScript 时会擦除类型，因此条件类型或映射类型不会执行运行时验证。JSON.parse(raw) as Event 只是要求检查器信任程序员，并不会检查判别字段、必填字段或数字范围。外部值应先以 unknown 进入系统，通过运行时解析或验证后才能获得领域类型。越过这个边界后，派生类型可以维护可信值之间的关系。还要审核连接 Object.keys、动态赋值与映射类型的断言，因为运行时枚举与 keyof 并不相同。'
    topics: [typescript/advanced-types]
    section: { en: 'Runtime boundaries', zh: '运行时边界' }
    level: intermediate
    frequency: common
    tags: [type-erasure, unknown, validation]

  - id: advanced-types-abstraction-budget
    question: { en: 'When should you replace an advanced generic utility with a direct domain type?', zh: '什么时候应把高级泛型工具替换成直接的领域类型？' }
    answer:
      en: 'Keep the generic utility when it captures a stable mechanical relationship, has a constrained input domain, and gives callers clearer errors than duplicated declarations would. Replace or split it when ordinary mistakes expose several layers of conditional distribution, key remapping, or recursion; when the implementation needs broad any casts; or when runtime behavior supports fewer shapes than the public type claims. I prefer named intermediate types and tests for accepted and rejected assignments. A direct event, route, or configuration type is often better when the abstraction has only one caller or hides important business meaning.'
      zh: '如果泛型工具表达稳定、机械的关系，输入域受到约束，而且错误信息比重复声明更清楚，就可以保留它。若普通错误会暴露多层条件分布、键重映射或递归，若实现依赖宽泛的 any 转换，或者运行时支持的形状少于公开类型声称的范围，就应拆分或替换。应给重要中间类型命名，并测试应接受和应拒绝的赋值。抽象只有一个调用方，或掩盖关键业务含义时，直接的事件、路由或配置类型通常更好。'
    topics: [typescript/advanced-types]
    section: { en: 'API design', zh: 'API 设计' }
    level: advanced
    frequency: occasional
    tags: [api-design, recursive-types, maintainability]

  - id: basics-annotation-vs-inference
    question: { en: 'When should you write a TypeScript annotation instead of relying on inference?', zh: '什么时候应显式写 TypeScript 类型注解，而不是依赖推断？' }
    answer:
      en: 'I annotate boundaries where the code must communicate or preserve a contract: public function parameters and returns, exported objects, empty collections, and variables whose initial value is narrower than their later states. Inside an implementation, I usually let initializers and contextual typing infer obvious locals. Repeating string or number on every constant adds noise without more safety. The key test is whether changing the implementation should be allowed to change the exposed type. If not, an annotation makes that intent explicit and lets the compiler catch accidental API drift.'
      zh: '我会在需要表达或固定契约的边界写注解，例如公开函数的参数与返回值、导出对象、空集合，以及初始值比后续状态更窄的变量。实现内部的明显局部值通常交给初始化表达式和上下文推断。给每个常量重复标注 string 或 number 只会增加噪声。关键判断是：修改实现时，公开类型是否可以随之改变。如果不可以，显式注解能固定意图，并让编译器发现意外的 API 漂移。'
    topics: [typescript/basics]
    section: { en: 'Language core', zh: '语言核心' }
    level: beginner
    frequency: common
    tags: [type-annotation, type-inference]

  - id: basics-unknown-vs-any
    question: { en: 'How do unknown and any differ at an external data boundary?', zh: '在外部数据边界上，unknown 与 any 有什么区别？' }
    answer:
      en: 'Both types can receive any incoming value, but they impose opposite obligations. any opts out of checking, so property access, calls, and assignments continue without proof and the unsafe type spreads to callers. unknown preserves the uncertainty: code must narrow or validate it before using type-specific operations. For JSON, messages, environment-derived values, or third-party callbacks, I accept unknown, check the container and every required field, then construct the domain value. I reserve any for a documented migration seam and keep that seam as small as possible.'
      zh: '两者都能接收任意传入值，但带来的义务相反。any 会退出检查，属性访问、调用和赋值无需证明即可继续，不安全类型还会传播给调用方。unknown 则保留“不确定”这一事实，代码必须先收窄或验证，才能执行依赖具体类型的操作。对于 JSON、消息、环境变量派生值或第三方回调，我会先接收 unknown，检查容器和每个必填字段，再构造领域值。any 只用于有说明的迁移接缝，并把范围压到最小。'
    topics: [typescript/basics]
    section: { en: 'Data boundaries', zh: '数据边界' }
    level: beginner
    frequency: common
    tags: [unknown, any, runtime-validation]

  - id: basics-assertion-not-validation
    question: { en: 'Why does a type assertion not validate JSON, and what should replace it?', zh: '为什么类型断言不能验证 JSON，应该用什么替代？' }
    answer:
      en: 'A type assertion is an instruction to the checker, not an operation emitted into JavaScript. JSON.parse(raw) as User therefore checks no property, converts no value, and throws no shape-specific error. It can make untrusted data look proved while leaving the runtime value unchanged. I parse into unknown, confirm that the value is a non-null object, validate required fields and domain constraints, and return a newly constructed User only after those checks. A schema library can perform the same boundary job for larger models, but its runtime result still needs to drive the static type.'
      zh: '类型断言是给检查器的指令，不是输出到 JavaScript 的操作。因此，JSON.parse(raw) as User 不会检查属性、转换值，也不会抛出针对结构的错误。它只是让不可信数据看起来已经得到证明，运行时值并未改变。我会把解析结果视为 unknown，确认它是非空对象，验证必填字段和领域约束，最后才构造并返回 User。更大的模型可以使用模式验证库，但静态类型仍应由真实的运行时验证结果驱动。'
    topics: [typescript/basics]
    section: { en: 'Data boundaries', zh: '数据边界' }
    level: intermediate
    frequency: common
    tags: [type-assertion, type-erasure, runtime-validation]

  - id: basics-discriminated-union
    question: { en: 'How does a discriminated union make state handling safer?', zh: '可辨识联合如何提高状态处理的安全性？' }
    answer:
      en: 'Each union member carries a shared literal field, such as status, plus the payload valid for that status. Testing the literal narrows the whole object, so a delivered branch can access signedBy while a failed branch exposes reason. In a switch, assigning the remaining value to never makes exhaustiveness part of type checking: adding a new member breaks consumers that omit it. This is still a static guarantee. Values from JSON or JavaScript must be validated before they receive the union type, because an invalid runtime tag can bypass the modeled state space.'
      zh: '联合中的每个成员都带有共享的字面量字段，例如 status，以及该状态对应的载荷。检查这个字面量会收窄整个对象，所以 delivered 分支可以访问 signedBy，而 failed 分支只能看到 reason。在 switch 中把剩余值赋给 never，可以把穷尽性纳入类型检查；新增成员后，遗漏它的使用方会编译失败。这仍是静态保证。来自 JSON 或 JavaScript 的值必须先验证才能获得联合类型，否则非法运行时标签仍可能绕过建模的状态空间。'
    topics: [typescript/basics]
    section: { en: 'Unions and narrowing', zh: '联合与收窄' }
    level: intermediate
    frequency: common
    tags: [discriminated-union, narrowing, never]

  - id: branded-types-guarantee
    question: { en: 'What guarantee does a TypeScript branded type provide, and what does it not provide?', zh: 'TypeScript 品牌类型能提供什么保证，又不能提供什么保证？' }
    answer:
      en: 'A branded type makes structurally identical values incompatible by intersecting a base type with a marker. If UserId and ProductId have distinct brands, checked TypeScript cannot pass one where the other is required, while either can still be used as its base type. The guarantee is static and depends on controlled construction. The marker is erased from JavaScript, so it performs no validation, existence check, or authorization. Assertions, any, and JavaScript callers can bypass it. I therefore describe a brand as evidence that one named constructor checked a local invariant, not as proof of every business fact about the value.'
      zh: '品牌类型把基础类型与标记相交，使结构相同的值变得不兼容。若 UserId 与 ProductId 使用不同品牌，经过检查的 TypeScript 代码就不能混用它们，但两者仍能作为基础类型使用。这项保证只存在于静态检查阶段，而且依赖受控的创建路径；标记在 JavaScript 中会被擦除，不会执行验证、存在性检查或授权。类型断言、any 和 JavaScript 调用方都能绕过它。因此，我把品牌解释为“某个命名构造函数检查过一项本地不变量”的证据，而不是关于该值所有业务事实的证明。'
    topics: [typescript/branded-types]
    section: { en: 'Type system', zh: '类型系统' }
    level: intermediate
    frequency: common
    tags: [branded-types, structural-typing, type-erasure]

  - id: branded-types-constructor-boundary
    question: { en: 'How would you design a safe constructor for a branded value from external data?', zh: '怎样为来自外部数据的品牌值设计安全构造函数？' }
    answer:
      en: 'I accept unknown at the trust boundary and write down the complete invariant before coding. For a positive numeric ID, that usually means checking the primitive type, integrality, positivity, and safe-integer range. Only the success branch contains the assertion that returns the branded type; callers receive a useful error, Result, or exception on failure. I export the branded alias and constructor together but keep the unique-symbol key private. I avoid a public generic cast helper because it creates unchecked values. Tests cover valid data, missing or wrong types, fractions, bounds, and every other condition named by the contract.'
      zh: '我会在信任边界接收 unknown，并在编码前写清完整不变量。对于正数 ID，通常需要检查原始类型、整数、正数和安全整数范围。只有成功分支包含返回品牌类型的断言；失败时则向调用方返回有用的错误、Result 或异常。我会一起导出品牌别名与构造函数，但把唯一符号键留在模块内部，也不会公开通用转换辅助函数。测试应覆盖有效数据、缺失值、错误类型、小数、边界值，以及契约中写明的每项条件。'
    topics: [typescript/branded-types]
    section: { en: 'Runtime boundaries', zh: '运行时边界' }
    level: advanced
    frequency: common
    tags: [smart-constructor, unknown, runtime-validation]

  - id: branded-types-unique-symbol
    question: { en: 'Why use a unique symbol key instead of a public __brand string property?', zh: '为什么使用唯一符号键，而不是公开的 __brand 字符串属性？' }
    answer:
      en: 'A unique-symbol declaration has its own type identity. Used as a computed property key, it makes compatibility depend on that declaration, so separately declared keys remain distinct even when their descriptions or tag text match. Keeping the key private also prevents consumers from accidentally constructing the marker shape. A public __brand string can be adequate inside one codebase, but two modules that copy the same property and literal tag are structurally compatible. Neither option is a security boundary: forced assertions and JavaScript can bypass both. The symbol pattern mainly improves isolation, ownership, and resistance to accidental collisions.'
      zh: '每个唯一符号声明都有独立的类型身份。把它用作计算属性键后，兼容性会依赖该声明，所以分别声明的键即使描述或标签文字相同也不会混同。键保持私有时，使用方也不容易意外构造出标记结构。公开的 __brand 字符串在单一代码库中可以工作，但两个模块复制相同属性与字面量标签后，会按照结构类型规则兼容。两种方案都不是安全边界，强制断言和 JavaScript 都能绕过；符号模式改善的主要是隔离、所有权和防碰撞能力。'
    topics: [typescript/branded-types]
    section: { en: 'API design', zh: 'API 设计' }
    level: advanced
    frequency: occasional
    tags: [unique-symbol, modules, structural-typing]

  - id: branded-types-proof-lifecycle
    question: { en: 'How can a branded value lose the invariant its type claims?', zh: '品牌值怎样会失去其类型声称的不变量？' }
    answer:
      en: 'Primitive operations create new values and normally return the base type, so arithmetic, normalization, and serialization do not automatically preserve a brand. Domain operations should re-run the constructor when overflow, range, format, or precision could change. Object brands have another risk: mutating the branded object through any alias can invalidate a previous check while the static marker remains. I prefer validated immutable snapshots and explicit state transitions. Persisted values also need attention when validation rules change. On every read boundary, the application must decide whether an old value is still valid, needs migration, or must be rejected.'
      zh: '原始值运算会创建新值，而且通常返回基础类型，因此算术、规范化和序列化不会自动保留品牌。若溢出、范围、格式或精度可能变化，领域操作应重新调用构造函数。对象品牌还有别名风险：任何引用修改同一对象后，旧检查都可能失效，但静态标记仍存在。我更倾向于验证后的不可变快照与显式状态转换。验证规则升级后，持久化旧值也需要处理；每个读取边界都要决定旧值仍然有效、需要迁移，还是必须拒绝。'
    topics: [typescript/branded-types]
    section: { en: 'Invariant maintenance', zh: '不变量维护' }
    level: advanced
    frequency: occasional
    tags: [invariants, mutation, serialization]

  - id: declaration-files-contract-boundary
    question: { en: 'What does a declaration file guarantee, and what must be verified separately?', zh: '声明文件能保证什么，哪些内容必须另行验证？' }
    answer:
      en: 'A declaration file gives the TypeScript checker a static contract for code implemented elsewhere. It can reject calls with incompatible arguments, expose documented members to editors, and preserve relationships expressed by its types. It does not create a function, validate external data, or prove that JavaScript exports the declared value. I verify both halves: run type tests that cover accepted and rejected calls, then import the packed runtime artifact and exercise the same public entry. A declaration is useful only while its names, module format, optional results, and asynchronous behavior match the implementation.'
      zh: '声明文件为在其他位置实现的代码提供静态契约。它可以让 TypeScript 拒绝参数不兼容的调用，在编辑器中展示已声明成员，并维护类型表达的关系。但它不会创建函数、验证外部数据，也不能证明 JavaScript 确实导出了声明中的值。我会分别验证两部分：先运行覆盖合法与非法调用的类型测试，再导入打包后的运行时产物，执行同一个公开入口。只有名称、模块格式、可选结果和异步行为都与实现一致时，这份声明才可信。'
    topics: [typescript/declaration-files]
    section: { en: 'Type contracts', zh: '类型契约' }
    level: intermediate
    frequency: common
    tags: [declaration-files, type-erasure, runtime-contract]

  - id: declaration-files-module-vs-global
    question: { en: 'How do you choose between a module declaration file and a global declaration?', zh: '怎样在模块声明文件与全局声明之间选择？' }
    answer:
      en: 'I follow how consumers obtain the runtime value. If they import a package, the declaration should be a module whose exports mirror that package. If a script tag, host, or build bootstrap genuinely installs a global, a global declaration can describe it. A file with no top-level import or export contributes names globally, so accidental omissions cause pollution and merging. For an intentional global addition from a module file, I use export {} and declare global, keep the added surface small, and test that every supported runtime environment installs the value before application code reads it.'
      zh: '我会根据使用方取得运行时值的方式选择。如果使用方导入一个包，声明就应是模块，并逐项映射该包的导出。如果脚本标签、宿主或构建启动代码确实安装了全局值，才适合使用全局声明。没有顶层 import 或 export 的文件会向全局作用域贡献名称，遗漏模块标记会造成污染和意外合并。若要从模块文件有意补充全局，我会使用 export {} 与 declare global，把补充面压到最小，并测试每个受支持环境都会在业务代码读取前安装该值。'
    topics: [typescript/declaration-files]
    section: { en: 'Scope and modules', zh: '作用域与模块' }
    level: intermediate
    frequency: common
    tags: [ambient-declarations, globals, modules]

  - id: declaration-files-test-strategy
    question: { en: 'How would you test a handwritten declaration against an untyped JavaScript package?', zh: '怎样测试手写声明是否符合无类型 JavaScript 包？' }
    answer:
      en: 'I start from the packed package rather than its source tree, because file lists and exports are part of the contract. Positive tests import every public entry and check representative inference. Negative tests use @ts-expect-error for arguments and results that must be rejected; an unused directive then catches accidental widening. I run tsc with the consumer configurations the package supports and inspect traceResolution when paths differ. Finally, I execute runtime imports for the same scenarios and compare export shape, missing-value behavior, promises, and thrown errors. Type tests and runtime tests cover different failure surfaces, so neither replaces the other.'
      zh: '我会从打包后的包开始测试，而不是直接读取源码目录，因为文件清单与 exports 也是契约的一部分。正向测试导入每个公开入口并检查代表性的推断结果；负向测试用 @ts-expect-error 标记必须被拒绝的参数与结果，声明意外变宽后，失去对应诊断的指令就会报错。我会在包支持的使用方配置下运行 tsc，路径不一致时检查 traceResolution。最后还要执行同一批运行时导入，对照导出形状、缺失值、Promise 与异常。类型测试和运行时测试覆盖不同失败面，不能互相替代。'
    topics: [typescript/declaration-files]
    section: { en: 'Verification', zh: '验证' }
    level: advanced
    frequency: common
    tags: [type-tests, runtime-tests, module-resolution]

  - id: declaration-files-dual-package
    question: { en: 'What can go wrong when one package publishes both ESM and CommonJS declarations?', zh: '一个包同时发布 ESM 与 CommonJS 声明时，可能出现哪些问题？' }
    answer:
      en: 'The two runtime entries may expose different default and named exports even when they come from one source. Declaration extensions also carry module information: .d.mts corresponds to ESM .mjs, .d.cts to CommonJS .cjs, while .d.ts follows the surrounding package rules for .js. I map each conditional exports branch to a matching declaration, put the types condition before its runtime default, and test both import and require from a temporary installation. Copying one declaration under several names is safe only after proving that both runtime shapes and consumer resolution results are actually identical.'
      zh: '两套运行时入口即使来自同一源码，也可能暴露不同的默认导出与命名导出。声明扩展名还携带模块信息：.d.mts 对应 ESM 的 .mjs，.d.cts 对应 CommonJS 的 .cjs，而 .d.ts 会按照所在包对 .js 的规则解释。我会让每个条件 exports 分支映射到匹配的声明，把 types 条件放在相应 runtime default 之前，并从临时安装目录分别测试 import 与 require。只有证明两种运行时形状和使用方解析结果完全相同时，才可以把同一声明复制成多个名称。'
    topics: [typescript/declaration-files]
    section: { en: 'Package publishing', zh: '包发布' }
    level: advanced
    frequency: occasional
    tags: [esm, commonjs, conditional-exports]
