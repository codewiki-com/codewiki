track: javascript
items:
  - id: array-map-versus-foreach
    question: { en: 'When should you use map instead of forEach?', zh: '什么情况下应使用 map，而不是 forEach？' }
    answer:
      en: 'Use map when one output element is derived from each visited input element and the new array is the result you want. The callback return value becomes the corresponding result element. Use forEach when the purpose is an external side effect, such as writing to a logger, and you do not need a returned collection. Neither method awaits an async callback. For asynchronous mapping, create Promises with map and explicitly await them with Promise.all, or use a loop when ordering or bounded concurrency matters.'
      zh: '当每个被访问的输入元素都要生成一个输出元素，而且目标就是得到新数组时，应使用 map。回调返回值会成为结果数组中的对应元素。只有操作目的确实是外部副作用，例如写日志，并且不需要返回集合时，才使用 forEach。两种方法都不会等待异步回调；异步映射应先用 map 创建 Promise，再显式交给 Promise.all 等待，若顺序或并发上限很重要，则使用循环或有界 worker。'
    topics: [javascript/array-methods]
    level: beginner
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [arrays, map, foreach]

  - id: array-mutating-versus-copying
    question: { en: 'How do mutating and copying array methods differ?', zh: '修改型数组方法与复制型数组方法有什么区别？' }
    answer:
      en: 'Mutating methods change the receiver. Examples include sort, reverse, splice, push, and fill, though their return values differ. Copying methods such as toSorted, toReversed, toSpliced, and with return a new outer array and leave its ordering or slots alone. That copy is shallow: both arrays may still point at the same element objects. In a review, classify the method, check its exact return value, then trace both array identity and element identity. This catches state bugs that a correct-looking snapshot test can miss.'
      zh: '修改型方法会改变接收者，例如 sort、reverse、splice、push 和 fill，但它们的返回值并不相同。toSorted、toReversed、toSpliced 和 with 等复制型方法返回新的外层数组，不改变原数组的顺序或槽位。这个副本仍是浅拷贝，两边可能继续引用同一批元素对象。审查时应先判断方法类别与准确返回值，再分别追踪数组标识和元素标识；这样才能发现只看最终快照时容易漏掉的状态错误。'
    topics: [javascript/array-methods]
    level: beginner
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [arrays, mutation, shallow-copy]

  - id: array-reduce-initial-value
    question: { en: 'What changes when reduce is called without an initial value?', zh: '调用 reduce 时省略初始值会改变什么？' }
    answer:
      en: 'Without an initial value, reduce finds the first existing array element, uses it as the accumulator, and begins callbacks with the next existing element. It throws TypeError when the array has no existing elements, including an empty array and a fully sparse one. With exactly one existing element, the callback never runs. Supplying a seed defines the empty-input result and the accumulator type from the start. That is why sums normally use 0 and grouping operations start with a deliberately chosen Map, array, or object.'
      zh: '省略初始值时，reduce 会寻找首个已有元素作为累加器，并从下一个已有元素开始调用回调。数组没有任何已有元素时会抛出 TypeError，这既包括空数组，也包括完全稀疏的数组。只有一个已有元素时，回调一次也不会运行。传入初始值可以从一开始定义空输入结果和累加器类型，因此求和通常使用 0，分组则应明确选择 Map、数组或对象作为起点。'
    topics: [javascript/array-methods]
    level: intermediate
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [arrays, reduce, accumulator]

  - id: array-sort-comparator-contract
    question: { en: 'What makes an Array sort comparator valid?', zh: '怎样的 Array 排序比较函数才是有效的？' }
    answer:
      en: 'A comparator returns a negative number when a belongs before b, a positive number when it belongs after b, and zero when they compare equal. Its answers must be consistent for repeated, reversed, and transitive comparisons. Returning a Boolean is invalid because false becomes zero and cannot distinguish one direction from equality. For numeric ascending order, use a - b; for records, compare the primary key and then an explicit tie-breaker. Also decide whether mutation is allowed: sort changes the receiver, while toSorted applies the same comparator to a shallow copy.'
      zh: '比较函数在 a 应排在 b 前面时返回负数，在 a 应排在 b 后面时返回正数，二者相等时返回 0；对重复、反向和传递比较的答案都必须一致。返回布尔值是错误的，因为 false 会变成 0，无法区分一个方向与相等。数值升序可用 a - b；记录排序应先比较主键，再写出明确的次键。同时还要决定是否允许修改输入：sort 改变接收者，toSorted 则对浅拷贝应用同一比较函数。'
    topics: [javascript/array-methods]
    level: intermediate
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [arrays, sorting, comparator]

  - id: class-prototype-relationship
    question: { en: 'How do JavaScript classes relate to prototypes?', zh: 'JavaScript 类与原型是什么关系？' }
    answer:
      en: 'A class creates a constructor function and a prototype object. Ordinary instance methods and accessors are non-enumerable properties on that prototype, so instances share them through normal prototype lookup. Public instance fields are different: they become own properties while each instance is constructed. Static members belong to the constructor function. Private fields are not properties on either prototype chain; the runtime installs private slots and checks the receiver brand. Class syntax therefore organizes the prototype model but also adds semantics, especially initialization order, strict mode, and private names.'
      zh: '类会创建构造函数及其 prototype 对象。普通实例方法和访问器是该原型上的不可枚举属性，实例通过常规原型查找共享它们。公开实例字段不同，它们在构造每个实例时成为自有属性。静态成员属于构造函数。私有字段不在任何一条原型链上；运行时会安装私有槽位并检查接收者标记。因此，类语法组织了原型模型，同时也增加了初始化顺序、严格模式和私有名称等语义。'
    topics: [javascript/classes]
    level: intermediate
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [classes, prototypes, fields]

  - id: class-derived-initialization-order
    question: { en: 'What is the relevant initialization order for a derived JavaScript class?', zh: 'JavaScript 派生类的关键初始化顺序是什么？' }
    answer:
      en: 'When super starts the base construction, base instance fields initialize before the base constructor body runs. The base body can already dispatch a method call to an override on the derived prototype, even though derived fields do not exist yet. As super returns, derived instance fields initialize in source order; only then does the rest of the derived constructor continue. A derived constructor cannot read this before super. This ordering is why base constructors should not call overridable methods that may depend on derived state.'
      zh: 'super 开始基类构造过程后，基类实例字段先于基类构造函数体初始化。构造函数体此时已经可能把方法调用分派给派生类的覆盖实现，但派生类字段还不存在。super 返回时，派生类实例字段按源码顺序初始化，之后才继续执行派生构造函数剩余部分。派生构造函数不能在 super 前读取 this。这正是基类构造函数不应调用依赖派生状态的可覆盖方法的原因。'
    topics: [javascript/classes]
    level: intermediate
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [classes, inheritance, initialization, super]

  - id: class-detached-method-receiver
    question: { en: 'Why can passing a class method as a callback fail, and how do you fix it?', zh: '为什么把类方法作为回调传递可能失败，应该怎样修复？' }
    answer:
      en: 'A class method is not automatically bound to the instance that supplied it. The call form object.method() provides object as the receiver, but map(object.method) later invokes a plain function, so this is undefined in the strict class body. Use a wrapper such as value => object.method(value), or bind the method once when registering it. An arrow-function field also captures the instance, but it creates a separate function per instance. For removable event listeners, retain the exact wrapper or bound function so removal uses the same identity.'
      zh: '类方法不会自动绑定到提供它的实例。object.method() 这种调用形式把 object 作为接收者，而 map(object.method) 随后调用的是普通函数，所以严格模式类体中的 this 为 undefined。可以使用 value => object.method(value) 这样的包装函数，或在注册时绑定一次。箭头函数字段也会捕获实例，但每个实例都会创建独立函数。对于可移除的事件监听器，还必须保存准确的包装函数或绑定函数，确保移除时使用同一标识。'
    topics: [javascript/classes]
    level: intermediate
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [classes, this, callbacks]

  - id: class-static-private-inheritance
    question: { en: 'Why can this.#counter fail in an inherited static method?', zh: '为什么继承的静态方法中 this.#counter 可能失败？' }
    answer:
      en: 'Private static fields are installed only on the class that declares them; subclasses do not receive the same private brand. An inherited public static method is callable through a subclass, and its this then refers to that subclass. Accessing this.#counter performs a brand check and throws TypeError. If one counter belongs to the base class, refer to BaseClass.#counter explicitly inside the declaring class. If every subclass needs separate state, use deliberate storage keyed by the constructor rather than pretending a private static field is polymorphic.'
      zh: '静态私有字段只安装在声明它的类上，子类不会获得同一个私有标记。公开静态方法可以被子类继承；通过子类调用时，其中的 this 指向子类。此时访问 this.#counter 会执行标记检查并抛出 TypeError。如果计数器由基类统一拥有，应在声明类内部明确写 BaseClass.#counter。若每个子类都需要独立状态，应使用以构造函数为键的显式存储，而不是假设静态私有字段支持多态。'
    topics: [javascript/classes]
    level: advanced
    section: { en: 'Language core', zh: '语言核心' }
    frequency: occasional
    tags: [classes, static, private-fields, inheritance]

  - id: closure-binding-versus-value
    question: { en: 'What does a JavaScript closure retain, and why is saying it copies a value misleading?', zh: 'JavaScript 闭包会保留什么，为什么说它复制了值会造成误解？' }
    answer:
      en: 'A JavaScript closure retains access to bindings from the lexical environment where the function was created. It does not copy each value into the function. If an outer let binding is reassigned, a later call observes the new value. Separate calls to an outer factory create separate bindings, while several inner functions created during one call can share them. For captured objects, distinguish the binding from object identity: two bindings may still hold the same object. That distinction explains stateful factories, stale asynchronous reads, and most loop-callback bugs.'
      zh: 'JavaScript 闭包保留对函数创建位置词法环境中绑定的访问路径，不会把每个值复制进函数。外层 let 绑定被重新赋值后，稍后调用会看到新值。两次外层工厂调用会创建不同绑定，同一次调用创建的多个内层函数则可以共享绑定。捕获对象时还要区分绑定与对象标识：两个不同绑定仍可能指向同一个对象。这个区别能解释有状态工厂、异步读取变化以及大多数循环回调错误。'
    topics: [javascript/closures]
    level: intermediate
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [closures, bindings, lexical-scope]

  - id: closure-var-let-loop
    question: { en: 'Why do callbacks in a var loop often read the final index, and why does let change the result?', zh: '为什么 var 循环中的回调常读到最终索引，而 let 会改变结果？' }
    answer:
      en: 'A var declaration creates one binding in the enclosing function or global environment. Every callback created by the loop closes over that same binding, so calls made after the loop read its final value. A for loop declared with let has per-iteration lexical bindings; each callback is associated with the binding for the iteration that created it. The timer or Promise is not the cause. Delayed execution only reveals the shared binding. Also check other captured state: a mutable object declared outside a let loop is still shared by every callback.'
      zh: 'var 声明在外层函数或全局环境中只创建一个绑定。循环产生的所有回调都捕获它，因此循环结束后的调用会读到最终值。用 let 声明的 for 循环具有逐轮词法绑定，每个回调关联到创建它的那一轮。定时器或 Promise 不是根因，延迟执行只是暴露了共享绑定。还要检查其他捕获状态：即使循环变量使用 let，循环外声明的可变对象仍会被所有回调共享。'
    topics: [javascript/closures]
    level: intermediate
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [closures, var, let, loops]

  - id: closure-versus-class-state
    question: { en: 'When would you choose a closure over a class for state, and when would you not?', zh: '什么情况下会用闭包保存状态，什么情况下不会？' }
    answer:
      en: 'A closure works well when one operation needs a small amount of configuration or private state and a factory call gives that state an obvious owner. It is also convenient when an API already expects a function. Prefer a class or explicit object when state has several operations, needs inspection or serialization, participates in inheritance, or has a lifecycle that callers must manage directly. Neither choice creates a security boundary by itself. In both forms, return values can leak references, and ownership should be verified by creating two instances and interleaving their operations.'
      zh: '当一个操作只需要少量配置或私有状态，而且一次工厂调用能清楚表达所有者时，闭包很合适；API 本来就要求函数时也很自然。若状态包含多种操作，需要检查或序列化，要参与继承，或生命周期必须由调用方直接管理，则类或显式对象通常更清楚。两种形式都不会自动形成安全边界，返回值都可能泄露引用。审查所有权时，应创建两个实例并交错执行操作，确认状态是否按预期隔离。'
    topics: [javascript/closures]
    level: intermediate
    section: { en: 'Language core', zh: '语言核心' }
    frequency: occasional
    tags: [closures, classes, state-ownership]

  - id: closure-handler-lifetime
    question: { en: 'How can a long-lived event handler closure retain memory, and what does correct cleanup require?', zh: '长期事件处理器闭包如何保留内存，正确清理需要什么？' }
    answer:
      en: 'Start from reachability, not from the fact that an outer function returned. If a long-lived event source owns a handler, the handler environment can keep captured component or request objects reachable. An unreachable cycle is not automatically a leak because garbage collection can reclaim the whole cycle. Correct cleanup removes the still-reachable registration using the same function identity and any matching options required by the API. Store that identity, expose an unsubscribe or dispose path, capture only needed values, and test teardown. Cleanup removes application references; it does not force immediate garbage collection.'
      zh: '分析时应从可达性出发，而不是只看外层函数是否已经返回。若长期事件源仍持有处理器，处理器环境会让捕获的组件或请求对象保持可达。整体不可达的引用环不一定泄漏，垃圾回收器可以回收它。正确清理必须使用注册时的同一函数标识，以及 API 要求匹配的选项，解除仍可达的注册关系。应保存该标识，提供取消订阅或释放路径，只捕获需要的值，并测试卸载流程。清理移除的是应用引用，不会强制立即回收。'
    topics: [javascript/closures]
    level: advanced
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [closures, callbacks, memory, cleanup]

  - id: date-time-value-and-views
    question: { en: 'What does a JavaScript Date store, and how do UTC, local, and named-zone views differ?', zh: 'JavaScript Date 保存什么，UTC、本地与指定时区视图有何区别？' }
    answer:
      en: 'A valid Date stores one numeric time value: integral milliseconds relative to the Unix epoch. It does not retain the original string, locale, calendar fields, or an IANA time-zone name. UTC getters project that value onto UTC fields. Local getters project it using the host environment local-zone rules, so results can differ across machines. Intl.DateTimeFormat can project the same instant into an explicitly named zone for display. Formatting never changes the instant. If later recurrence depends on the user zone, store that zone separately because Date cannot recover it.'
      zh: '有效的 Date 只保存一个数值时间值，也就是相对于 Unix 纪元的整数毫秒数。它不会保留原始字符串、区域设置、日历字段或 IANA 时区名称。UTC getter 把该值投影成 UTC 字段；本地 getter 使用宿主环境的本地时区规则，所以不同机器可能得到不同结果。Intl.DateTimeFormat 可以把同一时间点投影到明确指定的时区中展示。格式化不会改变时间点。若后续重复日程依赖用户时区，就必须另行保存该时区，因为 Date 无法恢复它。'
    topics: [javascript/date-object]
    level: beginner
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [date, time-value, time-zones]

  - id: date-safe-string-parsing
    question: { en: 'How would you define and enforce a safe timestamp parsing contract?', zh: '你会如何定义并执行安全的时间戳解析契约？' }
    answer:
      en: 'First decide which text shape the interface accepts; for example, require the canonical UTC form YYYY-MM-DDTHH:mm:ss.sssZ. Check the input type and grammar before constructing Date, then reject a NaN time value. If the contract is canonical, compare date.toISOString() with the input so normalized impossible dates do not pass. Do not accept locale-shaped strings merely because one engine parses them. Also document units for numeric timestamps, since Date expects milliseconds while many systems exchange seconds. Parsing an offset identifies an instant, but it does not preserve a named time zone.'
      zh: '首先确定接口接受哪种文本形状，例如要求规范 UTC 形式 YYYY-MM-DDTHH:mm:ss.sssZ。构造 Date 前检查输入类型和语法，再拒绝时间值为 NaN 的结果。如果契约要求规范形式，还要把 date.toISOString() 与输入比较，避免规范化后的不可能日期通过。不要因为某个引擎能解析区域格式字符串就接受它。数值时间戳还必须注明单位，因为 Date 使用毫秒，许多系统却交换秒。带偏移的输入可以标识时间点，但不会保留指定时区。'
    topics: [javascript/date-object]
    level: intermediate
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [date, parsing, validation, api-contract]

  - id: date-calendar-versus-elapsed-arithmetic
    question: { en: 'Why is adding one calendar day different from adding 86,400,000 milliseconds?', zh: '为什么增加一个日历日不同于增加 86,400,000 毫秒？' }
    answer:
      en: 'Adding 86,400,000 milliseconds means exactly 24 elapsed hours on the instant time line. Adding a calendar day means advancing calendar fields in a chosen zone, often while preserving the wall-clock time. Across a daylight-saving transition, those operations can produce instants one hour apart because a local day may span 23 or 25 elapsed hours. Ask whether the requirement is a duration or a recurrence. Use time-value arithmetic for duration. For recurrence, retain the named zone and define what happens when a local time is missing or repeated.'
      zh: '增加 86,400,000 毫秒表示在时间点时间线上经过恰好 24 小时。增加一个日历日则表示在选定时区中推进日历字段，通常还要保留墙上时钟时间。跨越夏令时切换时，两种操作得到的时间点可能相差一小时，因为一个本地日可能只经过 23 小时或经过 25 小时。应先确认需求是时长还是重复日程。时长使用时间值计算；重复日程要保留指定时区，并定义本地时间不存在或重复时的处理策略。'
    topics: [javascript/date-object]
    level: intermediate
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [date, calendar-arithmetic, duration, daylight-saving-time]

  - id: date-invalid-mutation-review
    question: { en: 'Which Date failure modes should you check in code review?', zh: '代码审查时应检查哪些 Date 失败模式？' }
    answer:
      en: 'Check external input first: an unparseable string creates a truthy invalid Date rather than throwing, and toISOString later throws RangeError. Trace whether code mixes local and UTC accessors or manually adds a fixed offset to imitate a named zone. Setters mutate their receiver and normalize overflow, so verify ownership and month-end behavior. Distinguish object equality from equal time values, and distinguish elapsed milliseconds from calendar units. Finally, Date.now reads an adjustable wall clock; interval and performance measurements generally need a monotonic source such as performance.now within the running context.'
      zh: '先检查外部输入：无法解析的字符串会创建真值的无效 Date，而不是立即抛错，之后调用 toISOString 才抛出 RangeError。跟踪代码是否混用本地与 UTC 访问器，或手动增加固定偏移来假装处理指定时区。setter 会修改接收者并规范化溢出，因此要核对所有权和月末行为。还要区分对象相等与时间值相等，以及经过毫秒数与日历单位。最后，Date.now 读取可调整的挂钟；在同一个运行上下文中测量间隔和性能，通常需要 performance.now 这样的单调来源。'
    topics: [javascript/date-object]
    level: advanced
    section: { en: 'Language core', zh: '语言核心' }
    frequency: occasional
    tags: [date, code-review, invalid-date, mutation]

  - id: destructuring-array-vs-object
    question: { en: 'How do array and object destructuring differ semantically?', zh: '数组解构与对象解构在语义上有什么区别？' }
    answer:
      en: 'Array destructuring consumes an iterable in sequence. Every pattern position advances its iterator, including an elision, and a rest element eagerly gathers the remainder into a new array. Object destructuring instead reads properties by key using normal property lookup, so property order in the pattern does not choose values and inherited getters may run. Object rest is narrower: it copies remaining own enumerable string and Symbol properties into a new ordinary object. Both forms support nesting and undefined-only defaults, but they fail on different inputs: an array pattern needs an iterable, while an object pattern rejects null and undefined.'
      zh: '数组解构按顺序消费可迭代对象。模式中的每个位置都会推进迭代器，空位置也不例外；剩余元素则立即把后续值收集到新数组。对象解构改为按键执行普通属性查找，因此模式中的属性顺序不决定取值，继承的 getter 也可能执行。对象剩余属性范围更窄，只把余下的自有可枚举字符串键与 Symbol 键复制到普通新对象。两种形式都支持嵌套和只处理 undefined 的默认值，但无效输入不同：数组模式要求可迭代对象，对象模式则拒绝 null 与 undefined。'
    topics: [javascript/destructuring]
    level: intermediate
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [destructuring, iterables, properties]

  - id: destructuring-default-boundaries
    question: { en: 'How do defaults behave in nested destructuring and function parameters?', zh: '嵌套解构与函数参数中的默认值怎样工作？' }
    answer:
      en: 'A destructuring default runs only when the value extracted at that exact position is undefined. Missing properties trigger it, but null, zero, false, and an empty string do not. Defaults at different levels solve different problems. In function f({ profile: { name = "guest" } = {} } = {}), the outer default handles an omitted or undefined argument, the object default handles undefined profile, and the leaf default handles undefined name. Explicit null still fails at either object-pattern boundary. For external data, validate first rather than turning malformed values into plausible business defaults.'
      zh: '只有在对应位置取出的值为 undefined 时，解构默认值才会执行。缺失属性会触发，而 null、0、false 和空字符串不会。不同层级的默认值解决不同问题。在 function f({ profile: { name = "guest" } = {} } = {}) 中，最外层默认值处理省略或为 undefined 的参数，对象默认值处理为 undefined 的 profile，叶子默认值处理为 undefined 的 name。显式 null 仍会在相应对象模式边界失败。对外部数据应先验证，不要把损坏值变成看似合理的业务默认值。'
    topics: [javascript/destructuring]
    level: intermediate
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [destructuring, defaults, 'null', parameters]

  - id: destructuring-object-rest
    question: { en: 'What exactly does an object rest property copy, and why is it unsafe for redaction?', zh: '对象剩余属性究竟复制什么，为什么它不适合脱敏？' }
    answer:
      en: 'An object rest property creates a new ordinary object and copies source properties not already excluded by the pattern. Only own enumerable string and Symbol keys qualify; inherited and non-enumerable properties do not. Values are read, so getters can run, and the new property is a data property rather than the original accessor. The copy is shallow, leaving nested object identity shared. Redaction by const { password, ...publicUser } is unsafe because any new token or secret field automatically enters publicUser. Across a trust boundary, construct output from an explicit allowlist and decide how each nested value is copied.'
      zh: '对象剩余属性创建普通新对象，并复制模式尚未排除的源属性。只有自有可枚举字符串键与 Symbol 键符合条件，继承属性和不可枚举属性不会复制。复制会读取值，因此 getter 可能执行；新对象上得到的是数据属性，不是原访问器。这个副本是浅层的，嵌套对象标识仍然共享。用 const { password, ...publicUser } 脱敏并不安全，因为以后新增的 token 或秘密字段会自动进入 publicUser。跨越信任边界时，应按明确允许列表构造输出，并分别决定每个嵌套值的复制方式。'
    topics: [javascript/destructuring]
    level: advanced
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [destructuring, object-rest, shallow-copy, security]

  - id: destructuring-observable-operations
    question: { en: 'Which observable operations can a destructuring pattern perform?', zh: '解构模式可能执行哪些可观察操作？' }
    answer:
      en: 'The right-hand expression is evaluated once, but a pattern can perform many later operations. An array pattern calls the iterator next method for every position, closes an unfinished iterator when the pattern ends, and consumes the entire remainder for a rest element. An object pattern evaluates computed keys and performs ordinary property reads, which can invoke getters or Proxy traps. Object rest also enumerates keys, inspects enumerability, and reads copied values. Default initializers run lazily after an extracted undefined. None of these effects is rolled back when a later read or assignment throws, so complex, side-effectful patterns are not atomic.'
      zh: '右侧表达式只求值一次，但模式随后可能执行许多操作。数组模式为每个位置调用迭代器的 next 方法，模式结束时关闭尚未结束的迭代器，并为剩余元素消费全部后续值。对象模式会求值计算键并执行普通属性读取，因而可能触发 getter 或 Proxy trap。对象剩余属性还会枚举键、检查可枚举性并读取复制值。默认初始化表达式只在取出 undefined 后惰性执行。后续读取或赋值抛错时，这些效果都不会回滚，所以复杂且带副作用的模式不是原子操作。'
    topics: [javascript/destructuring]
    level: advanced
    section: { en: 'Language core', zh: '语言核心' }
    frequency: occasional
    tags: [destructuring, iterators, getters, proxy]

  - id: error-handling-sync-versus-async
    question: { en: 'How does handling a synchronous throw differ from handling a Promise rejection?', zh: '处理同步抛出与处理 Promise 拒绝有什么不同？' }
    answer:
      en: 'A synchronous throw immediately unwinds active calls until it reaches a catch. A rejection is stored in a Promise and becomes exception-style control flow where code awaits that Promise; it can also be handled by a rejection callback. A try block around an unawaited async call can catch failures while evaluating the callee or arguments, but throws from the async body reject its returned Promise. I therefore trace every Promise to an owner that awaits, returns, groups, or deliberately terminates it with a rejection handler.'
      zh: '同步抛出会立即展开活跃调用，直到到达 catch。拒绝保存在 Promise 中；代码等待该 Promise 时，它才重新成为异常式控制流，也可以由拒绝回调处理。try 块包住未等待的异步调用时，可以捕获求值被调用者或实参时的失败，但异步函数体中的抛出会拒绝其返回的 Promise。因此，我会跟踪每个 Promise，确认某个所有者会等待、返回、组合它，或用拒绝处理器有意终结它。'
    topics: [javascript/error-handling]
    level: intermediate
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [errors, promises, async-await]

  - id: error-handling-catch-boundary
    question: { en: 'Where should an application catch an error?', zh: '应用应该在哪里捕获错误？' }
    answer:
      en: 'Catch at the nearest boundary that can make a meaningful policy decision. That might mean returning a documented fallback, translating a domain failure into an HTTP response, adding operation context, or releasing a locally owned resource before rethrowing. Keep the try region narrow so unrelated programming defects are not misclassified as expected failures. Low-level code should attach facts it knows and propagate when it cannot recover. A handler that only logs and returns an invented empty value usually destroys information and changes the function contract without telling its callers.'
      zh: '应在能够作出有意义策略决策的最近边界捕获。这个决策可以是返回契约规定的回退值，把领域失败转换为 HTTP 响应，添加操作上下文，或在重新抛出前释放本地拥有的资源。try 区域应保持狭窄，避免把无关的编程缺陷误判为预期失败。底层代码应附加它知道的事实；无法恢复时就继续传播。只写日志再返回临时空值的处理器，通常会破坏信息，并在没有通知调用方的情况下改变函数契约。'
    topics: [javascript/error-handling]
    level: intermediate
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [catch-boundary, propagation, recovery]

  - id: error-handling-wrapping-cause
    question: { en: 'How should you wrap a low-level JavaScript error without losing diagnostic information?', zh: '怎样包装底层 JavaScript 错误而不丢失诊断信息？' }
    answer:
      en: 'Create an Error or domain-specific subclass whose message and fields describe the higher-level operation, then pass the caught value through the cause option. A custom subclass should call super(message, options), set a useful name, and expose stable structured fields that callers can branch on. Do not concatenate stack traces or require consumers to parse message text. First narrow the catch value because JavaScript permits any thrown value. At public boundaries, serialize an explicit allowlist and redact stacks, secrets, and deeply nested causes instead of sending the Error object directly.'
      zh: '应创建 Error 或领域专用子类，让消息和字段描述高层操作，再通过 cause 选项传入捕获值。自定义子类应调用 super(message, options)，设置有用的 name，并公开可供调用方分支的稳定结构化字段。不要拼接堆栈跟踪，也不要要求使用方解析消息文本。JavaScript 允许抛出任何值，所以必须先收窄捕获值。在公开边界，应按显式允许列表序列化并移除堆栈、秘密和过深的原因链，而不是直接发送 Error 对象。'
    topics: [javascript/error-handling]
    level: intermediate
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [error-cause, error-wrapping, custom-errors]

  - id: error-handling-promise-groups
    question: { en: 'How do Promise.all, Promise.allSettled, and Promise.any express different failure policies?', zh: 'Promise.all、Promise.allSettled 与 Promise.any 如何表达不同的失败策略？' }
    answer:
      en: 'Promise.all requires every input to fulfill and reports an input rejection early, but it does not cancel the remaining work. Promise.allSettled waits for every input and returns a status-tagged result for each, so the caller must decide whether partial failure makes the combined operation fail. Promise.any needs one fulfillment and rejects with AggregateError only when every input rejects. I choose from the business success condition first, then add cooperative cancellation where needed. I also retain task identity with each rejection and await cleanup rather than assuming early rejection stopped underlying operations.'
      zh: 'Promise.all 要求每个输入都兑现，并会较早报告某个输入的拒绝，但不会取消剩余工作。Promise.allSettled 等待所有输入，为每项返回带状态标签的结果，因此调用方必须判断部分失败是否使组合操作失败。Promise.any 只需要一项兑现，只有全部输入都拒绝时才以 AggregateError 拒绝。我会先根据业务成功条件选择组合器，再按需加入协作式取消。同时还会为每项拒绝保留任务标识并等待清理，而不会假定提前拒绝已经停止底层操作。'
    topics: [javascript/error-handling]
    level: advanced
    section: { en: 'Asynchronous JavaScript', zh: '异步 JavaScript' }
    frequency: common
    tags: [promise-all, all-settled, aggregate-error, cancellation]

  - id: es6-edition-meaning
    question: { en: 'What does ES6+ mean, and why is it a weak compatibility target?', zh: 'ES6+ 是什么意思，为什么它不是严谨的兼容性目标？' }
    answer:
      en: 'ES6 specifically refers to the sixth ECMAScript edition, standardized as ECMAScript 2015. ES6+ is informal shorthand for that edition plus some unspecified set of later yearly additions. It does not identify an engine, parser, module loader, or build output, so two teams can use the phrase for different feature sets. I replace it with an executable target: name the oldest runtime or browser, state whether source is transformed, identify required built-ins and host APIs, and run the artifact that deployment will actually receive.'
      zh: 'ES6 特指第六版 ECMAScript，也就是 2015 年标准化的 ECMAScript 2015。ES6+ 是非正式简称，表示该版本再加上某些未明确列出的后续年度特性。它没有指出引擎、解析器、模块加载器或构建产物，因此两个团队可能用它表示不同的特性集合。我会把它换成可执行的目标：写明支持范围内最旧的运行时或浏览器，说明源码是否转换，列出所需内置对象与宿主 API，并运行部署实际收到的产物。'
    topics: [javascript/es6-features]
    level: beginner
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [es2015, compatibility, runtimes]

  - id: es6-const-versus-immutability
    question: { en: 'How does a const binding differ from immutable data?', zh: 'const 绑定与不可变数据有什么区别？' }
    answer:
      en: 'const prevents reassignment of one lexical binding after initialization. If that binding contains an object or array, code can still add properties, replace elements, or mutate nested objects. Object.freeze is also only shallow, so it does not make an arbitrary object graph immutable. I use const to communicate that the local binding keeps one identity. Data immutability is a separate ownership decision: construct new values, restrict mutation to a named owner, and test nested identities. This distinction prevents reviewers from approving a mutation merely because the declaration looks safe.'
      zh: 'const 会阻止一个词法绑定在初始化后重新赋值。如果绑定中保存对象或数组，代码仍可新增属性、替换元素或修改嵌套对象。Object.freeze 也只是浅层操作，不会让任意对象图自动不可变。我用 const 表达局部绑定始终保持同一标识；数据不可变性则是另一项所有权决策，需要构造新值、把修改限制在具名所有者内，并测试嵌套标识。分清两者，才能避免审查者仅因声明看起来安全就放过实际修改。'
    topics: [javascript/es6-features]
    level: beginner
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [const, mutation, ownership]

  - id: es6-nullish-operators
    question: { en: 'How do optional chaining, nullish coalescing, and destructuring defaults divide responsibility?', zh: '可选链、空值合并与解构默认值怎样分工？' }
    answer:
      en: 'Optional chaining stops a marked property access or call when its left side is null or undefined. It does not validate the value and does not protect an unmarked nullable hop. Nullish coalescing supplies a fallback for null or undefined while preserving zero, false, and an empty string. A destructuring default is narrower: it runs only when the extracted value is undefined. I decide first whether null means absent or malformed, mark only genuinely optional hops, then test null, undefined, and every valid falsy value. Required fields still need boundary validation.'
      zh: '可选链会在已标记的属性访问或调用左侧为 null 或 undefined 时停止，但不会验证值，也不会保护未标记的可空层级。空值合并为 null 或 undefined 提供回退，同时保留 0、false 和空字符串。解构默认值更窄，只在取出的值为 undefined 时执行。我会先决定 null 表示缺失还是格式错误，只标出确实可选的层级，再测试 null、undefined 和每个合法假值。必需字段仍要在边界验证。'
    topics: [javascript/es6-features]
    level: intermediate
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [optional-chaining, nullish-coalescing, destructuring]

  - id: es6-transform-polyfill-host
    question: { en: 'Why does transpiling modern syntax not settle runtime compatibility?', zh: '为什么转换现代语法仍不能解决全部运行时兼容问题？' }
    answer:
      en: 'A syntax transform rewrites source before the target parser sees it. Lowering optional chaining can remove that parser requirement, but it does not by itself install Promise, Map, a newer prototype method, or a browser or Node host API. Polyfills address selected runtime values and have their own loading and semantic constraints. Module classification and specifier resolution add another host boundary. I therefore inventory features by layer, inspect the emitted artifact, and execute it in the declared target. A successful type check or development build proves only the layers that command actually exercised.'
      zh: '语法转换会在目标解析器看到源码前进行改写。降低可选链语法可以消除这项解析要求，却不会自动安装 Promise、Map、较新的原型方法，也不会提供浏览器或 Node 宿主 API。Polyfill 只补充选定的运行时值，并有自己的加载与语义限制。模块分类和说明符解析又增加了一层宿主边界。因此，我会按层盘点特性，检查输出产物，并在声明的目标中执行。类型检查或开发构建成功，只能证明该命令实际覆盖的层。'
    topics: [javascript/es6-features]
    level: intermediate
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [transpilation, polyfills, host-apis, modules]

  - id: fundamentals-const-binding-mutation
    question: { en: 'What does const guarantee, and how is that different from object immutability?', zh: 'const 保证了什么，它与对象不可变有何不同？' }
    answer:
      en: 'const prevents one lexical binding from being reassigned after initialization. It does not freeze the value. If the binding holds an object or array, code can still replace properties, push elements, and mutate nested objects. Object.freeze is a separate, shallow operation and does not recursively freeze an object graph. I review const in two passes: first ask whether the local name should ever point elsewhere, then ask who owns mutation of the object. When immutability matters, I construct new values and test nested identity rather than relying on the declaration keyword.'
      zh: 'const 会阻止一个词法绑定在初始化后重新赋值，但不会冻结其中的值。绑定保存对象或数组时，代码仍可替换属性、追加元素并修改嵌套对象。Object.freeze 是另一项浅层操作，不会递归冻结对象图。我会分两步审查：先确认局部名称是否需要指向别处，再确认谁拥有对象修改权。需要不可变数据时，应构造新值并测试嵌套对象标识，而不是依赖声明关键字。'
    topics: [javascript/fundamentals]
    level: beginner
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [const, bindings, mutation, ownership]

  - id: fundamentals-conversion-validation
    question: { en: 'Why is explicit conversion not the same as input validation in JavaScript?', zh: '为什么 JavaScript 中的显式转换不等于输入验证？' }
    answer:
      en: 'A conversion function applies language rules; it does not know the business contract. Number converts an empty or whitespace-only string to zero, produces NaN for many malformed strings, and may produce Infinity for an out-of-range literal. Boolean treats every non-empty string, including "false", as true. A boundary should first define accepted input forms, then convert and verify the result with checks such as Number.isFinite, Number.isInteger, and explicit range constraints. I also test null, undefined, whitespace, valid falsy values, and values just outside each boundary.'
      zh: '转换函数只执行语言规则，不知道业务契约。Number 会把空字符串或纯空白字符串转成 0，把许多错误文本转成 NaN，还可能为超范围字面量得到 Infinity。Boolean 会把包括 "false" 在内的所有非空字符串转成 true。边界应先定义可接受的输入形式，再转换并用 Number.isFinite、Number.isInteger 和明确范围检查结果。我还会测试 null、undefined、空白、合法假值，以及刚好越过每个边界的值。'
    topics: [javascript/fundamentals]
    level: beginner
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [type-coercion, validation, numbers, boundaries]

  - id: fundamentals-equality-choice
    question: { en: 'How do you choose between ===, Object.is, and a content comparison?', zh: '怎样在 ===、Object.is 与内容比较之间选择？' }
    answer:
      en: 'Start by naming what equality means for the requirement. For most primitive business values, === avoids coercion and is the clearest default. Object.is uses SameValue semantics, so NaN equals itself and positive zero differs from negative zero; those distinctions matter in a few numerical or memoization cases. Objects compare by identity under both operations. If the requirement is content equality, define the relevant fields and rules for order, missing properties, dates, Symbols, and cycles. A generic JSON.stringify comparison silently changes those rules and fails for several valid object shapes.'
      zh: '应先说明需求中的“相等”究竟指什么。对大多数原始业务值，=== 不执行类型转换，是最清楚的默认选择。Object.is 使用 SameValue 语义，因此 NaN 等于自身，正零与负零不同；这些区别会影响少数数值或记忆化场景。两种操作比较对象时都看标识。若需求是内容相等，就要定义相关字段，以及顺序、缺失属性、日期、Symbol 和循环结构的规则。通用 JSON.stringify 比较会悄悄改变这些规则，并对多种合法对象形状失效。'
    topics: [javascript/fundamentals]
    level: intermediate
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [strict-equality, object-is, object-identity]

  - id: fundamentals-language-versus-host
    question: { en: 'How do you distinguish JavaScript language behavior from host behavior?', zh: '怎样区分 JavaScript 语言行为与宿主行为？' }
    answer:
      en: 'ECMAScript defines the core language: values, objects, declarations, expressions, functions, and execution semantics. A host supplies capabilities around it. Browsers provide the DOM, events, storage, and fetch integration; Node provides file system and process APIs plus its own module and scheduling details. I classify every unfamiliar name by owner, check the target runtime version, and test in that runtime. Syntax that parses under Node does not prove a browser API exists, while a successful browser example does not prove that the same global or module resolution is available in Node.'
      zh: 'ECMAScript 定义语言核心，包括值、对象、声明、表达式、函数和执行语义；宿主在外层提供能力。浏览器提供 DOM、事件、存储和 fetch 集成，Node 提供文件系统、进程 API，以及自己的模块与调度细节。我会判断每个陌生名称由谁提供，核对目标运行时版本，并在该运行时测试。代码能在 Node 解析，不代表浏览器 API 存在；浏览器示例成功，也不代表 Node 有相同全局名称或模块解析方式。'
    topics: [javascript/fundamentals]
    level: beginner
    section: { en: 'Language core', zh: '语言核心' }
    frequency: occasional
    tags: [ecmascript, host-apis, browser, node]

  - id: iterators-iterable-versus-iterator
    question: { en: 'What is the difference between an iterable and an iterator?', zh: '可迭代对象与迭代器有什么区别？' }
    answer:
      en: 'An iterable exposes Symbol.iterator and uses it to supply an iterator. The iterator owns traversal state and its next method returns iterator-result objects with value and done. A repeatable collection normally creates a fresh iterator for every Symbol.iterator call, so nested consumers have independent cursors. A generator object is different: it is an iterator whose Symbol.iterator method returns itself, so it is single-pass. I review APIs by asking whether they promise a restartable sequence or transfer ownership of one cursor, because for...of syntax alone does not reveal that contract.'
      zh: '可迭代对象公开 Symbol.iterator，并通过它提供迭代器。迭代器拥有遍历状态，其 next 方法返回带 value 和 done 的迭代结果。可重复遍历的集合通常在每次调用 Symbol.iterator 时创建新迭代器，让嵌套消费者拥有独立游标。生成器对象不同：它是 Symbol.iterator 返回自身的迭代器，因此只能单次消费。审查 API 时，我会先确认它承诺的是可重新开始的序列，还是转移一份游标的所有权，因为仅看 for...of 语法无法判断这项契约。'
    topics: [javascript/iterators-generators]
    level: intermediate
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [iterable, iterator, state, ownership]

  - id: iterators-generator-messaging
    question: { en: 'How do next, yield, and return exchange values with a generator?', zh: 'next、yield 与 return 如何同生成器交换值？' }
    answer:
      en: 'Calling a generator function creates a not-yet-started generator. The first next argument is ignored because execution is not suspended at a yield. Running reaches yield expression, sends the expression operand out as a done-false result, and suspends. The next next(value) makes that earlier yield expression evaluate to value. A return expression completes the generator with done true. for...of and spread consume only done-false values, so they omit the final return value. When a bidirectional protocol needs that result, the caller must retain the generator and inspect each next result explicitly.'
      zh: '调用生成器函数会创建尚未开始的生成器。第一次 next 的实参会被忽略，因为执行还没有暂停在 yield 处。运行到 yield expression 后，右侧操作数作为 done 为 false 的结果传出，生成器随即暂停。下一次 next(value) 会让先前的 yield 表达式求值为 value。return 表达式以 done 为 true 完成生成器。for...of 和展开只消费 done 为 false 的值，因此会忽略最终返回值。双向协议需要该结果时，调用方必须保留生成器并明确检查每个 next 结果。'
    topics: [javascript/iterators-generators]
    level: intermediate
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [generators, next, yield, return]

  - id: iterators-early-closing
    question: { en: 'How does JavaScript clean up an iterator when for...of exits early?', zh: 'for...of 提前退出时，JavaScript 怎样清理迭代器？' }
    answer:
      en: 'If for...of leaves an unfinished iterator through break, an outer return, or a loop-body exception, it performs iterator closing. The algorithm gets the iterator return method and calls it when present. Generator objects supply return, which resumes control through surrounding finally blocks before completion. A hand-written resource iterator therefore needs an idempotent return method, while a generator should put release work in finally around yield. I test complete consumption, early exit, and consumer failure separately. This cleanup is deterministic control flow; it is neither a garbage-collection callback nor proof that every related object became unreachable.'
      zh: '如果 for...of 通过 break、外围 return 或循环体异常离开尚未完成的迭代器，就会执行迭代器关闭。该算法取得迭代器的 return 方法，并在方法存在时调用它。生成器对象自带 return，会在完成前沿控制流执行包围产出点的 finally。手写资源迭代器因此需要幂等 return，生成器则应把释放动作放在 yield 外层的 finally 中。我会分别测试完整消费、提前退出和消费方失败。这种清理是确定的控制流，既不是垃圾回收回调，也不能证明所有相关对象都已不可达。'
    topics: [javascript/iterators-generators]
    level: advanced
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [iterator-closing, for-of, cleanup, finally]

  - id: iterators-review-generated-pipeline
    question: { en: 'What do you check when reviewing a generated lazy iterator pipeline?', zh: '审查生成的惰性迭代管道时，你会检查什么？' }
    answer:
      en: 'I first label each object as a repeatable iterable, a one-shot iterator, or an iterator result, then identify who advances and closes it. I inspect every spread, Array.from, and rest pattern for a proven finite bound, because an infinite source can hang or exhaust memory. Manual next calls must branch on done rather than value, since undefined is a valid item. I also test two interleaved consumers, stop after the first yield, and force a consumer exception. Those cases expose shared cursors, over-reading, and missing return or finally cleanup that happy-path snapshots miss.'
      zh: '我会先把每个对象标为可重复 iterable、单次 iterator 或迭代结果，再确认谁负责推进和关闭。每个展开、Array.from 与剩余模式都要有可证明的有限上界，否则无限数据源可能卡住或耗尽内存。手动 next 调用必须依据 done 而不是 value 分支，因为 undefined 可以是合法值。我还会交错运行两个消费者，在第一次产出后停止，并强制消费方抛错。这些路径能暴露共享游标、过度读取，以及正常路径快照看不到的 return 或 finally 清理缺失。'
    topics: [javascript/iterators-generators]
    level: advanced
    section: { en: 'Language core', zh: '语言核心' }
    frequency: occasional
    tags: [iterators, lazy-evaluation, code-review, bounded-consumption]

  - id: json-parse-versus-validation
    question: { en: 'What does JSON.parse validate, and what must an application validate afterward?', zh: 'JSON.parse 会验证什么，应用之后还必须验证什么？' }
    answer:
      en: 'JSON.parse checks that the complete input follows JSON grammar and then constructs the corresponding JavaScript value. Success does not imply an object result: null, arrays, strings, numbers, and Booleans are all valid top-level JSON. I next check the expected top-level category, required and optional fields, nested shapes, numeric ranges, and domain invariants. Authorization remains a separate decision. I also keep malformed syntax distinct from an absent body, an HTTP error page, and a well-formed value that violates the contract, because those failures need different diagnostics and responses.'
      zh: 'JSON.parse 会检查完整输入是否符合 JSON 语法，再构造对应的 JavaScript 值。成功并不代表结果一定是对象，因为 null、数组、字符串、数字和布尔值都可以作为 JSON 顶层值。之后还要验证预期的顶层类别、必需与可选字段、嵌套结构、数值范围和领域不变量，授权则是另一项决策。我还会区分语法错误、缺少正文、HTTP 错误页，以及语法正确但违反契约的值，因为它们需要不同的诊断和响应。'
    topics: [javascript/json]
    level: beginner
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [json-parse, validation, boundary]

  - id: json-stringify-lossiness
    question: { en: 'Which JavaScript information does JSON.stringify fail to preserve?', zh: 'JSON.stringify 无法保留哪些 JavaScript 信息？' }
    answer:
      en: 'JSON.stringify serializes only JSON-shaped data, not an arbitrary JavaScript object graph. Own enumerable string-keyed properties can appear, while prototypes, descriptors, Symbol keys, methods, and class identity do not. Undefined, functions, and Symbols disappear from objects and become null in arrays; non-finite numbers become null. BigInt and cycles throw unless code supplies another representation, while Date normally becomes an ISO string through toJSON. Shared references lose identity after a stringify-parse round trip. I therefore define a wire format explicitly and test each non-JSON type instead of treating serialization as a deep-copy operation.'
      zh: 'JSON.stringify 只序列化符合 JSON 数据模型的树状数据，不会保留任意 JavaScript 对象图。自有、可枚举、字符串键属性可以出现，原型、属性描述符、Symbol 键、方法和类标识不会出现。undefined、函数和 Symbol 在对象中消失，在数组中变成 null；非有限数字也变成 null。BigInt 与循环引用默认抛错，Date 则通常通过 toJSON 变成 ISO 字符串。共享引用往返后失去同一性。因此，我会明确制定线格式并测试每种非 JSON 类型，而不是把序列化当作深拷贝。'
    topics: [javascript/json]
    level: intermediate
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [json-stringify, serialization, object-graph]

  - id: json-large-integer-contract
    question: { en: 'How do you preserve an integer larger than Number.MAX_SAFE_INTEGER in JSON?', zh: '怎样在 JSON 中保留大于 Number.MAX_SAFE_INTEGER 的整数？' }
    answer:
      en: 'JSON grammar accepts more integer digits than JavaScript Number can represent exactly, so ordinary parsing may round before application code sees the value. Converting that rounded Number to BigInt cannot restore the lost digits, and comparison with a source-code number literal can mislead because the literal is rounded too. The most portable contract sends the identifier or integer as a validated decimal string and converts it directly with BigInt where needed. In current runtimes with reviver source context, a known numeric field can use context.source, but both field identity and grammar still require validation.'
      zh: 'JSON 数字语法允许的整数位数超过 JavaScript Number 的精确表示范围，因此普通解析可能在应用代码看到值之前就发生舍入。把已经舍入的 Number 转成 BigInt 无法恢复丢失的数字；与源码数字字面量比较也可能误导，因为字面量同样会舍入。最便于跨系统使用的契约是把标识或整数作为经过验证的十进制字符串传输，需要时再直接用 BigInt 转换。支持恢复函数来源上下文的当前运行时也可让已知数字字段使用 context.source，但仍须验证字段身份和数字语法。'
    topics: [javascript/json]
    level: intermediate
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [json-number, safe-integer, bigint, precision]

  - id: json-reviver-replacer-order
    question: { en: 'How do reviver and replacer traversal differ, and why does the order matter?', zh: 'reviver 与 replacer 的遍历方式有何不同，为什么顺序很重要？' }
    answer:
      en: 'A JSON.parse reviver runs bottom-up: leaf properties are visited before their containers, and the root is called last with an empty key. Its return value replaces the property, while undefined deletes it. JSON.stringify starts from an empty-key wrapper and walks outward through the selected representation. An object toJSON method runs before the replacer, so a Date usually reaches the replacer as a string. The replacer can rewrite or omit values, and returned objects are traversed too. I test root values, arrays, deletion, Date, and real empty-string keys because compact callback code often hides these ordering effects.'
      zh: 'JSON.parse 的 reviver 按自底向上顺序运行：先访问叶子属性，再访问容器，最后以空键调用根值。返回值会替换属性，返回 undefined 则删除属性。JSON.stringify 从空键包装根开始，向外遍历选定表示；对象的 toJSON 会先于 replacer 运行，所以 Date 到达 replacer 时通常已经是字符串。replacer 可以改写或省略值，它返回的对象也会继续被遍历。我会测试根值、数组、删除、Date 和真实空字符串键，因为简短回调很容易隐藏这些顺序影响。'
    topics: [javascript/json]
    level: advanced
    section: { en: 'Language core', zh: '语言核心' }
    frequency: occasional
    tags: [reviver, replacer, traversal, tojson]

  - id: map-set-map-versus-object
    question: { en: 'How do you choose between Map and a plain object?', zh: '怎样在 Map 与普通对象之间选择？' }
    answer:
      en: 'I start with the data model rather than a blanket performance rule. A plain object fits a record with known string or Symbol fields, works naturally with property access and destructuring, and has a direct JSON-shaped representation. A Map fits a collection whose keys arrive at runtime, may be objects or other non-property-key values, and need direct entry iteration or a size. I also define the wire format because JSON.stringify does not serialize Map entries. If either choice is on a hot path, I benchmark the actual engine, key distribution, size, and read-write mix.'
      zh: '我会先看数据模型，不会套用笼统的性能规则。普通对象适合字段已知的记录，键是字符串或 Symbol，并且自然支持属性访问、解构与 JSON 形状。Map 适合键在运行时出现、可能是对象或其他非属性键值，而且需要直接遍历条目或读取大小的集合。我还会明确线格式，因为 JSON.stringify 不会序列化 Map 条目。如果选择位于热点路径，就用真实引擎、键分布、集合大小和读写比例做基准测试。'
    topics: [javascript/map-set]
    level: intermediate
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [map, object, data-modeling, serialization]

  - id: map-set-equality-and-identity
    question: { en: 'How do Map keys and Set members compare for equality?', zh: 'Map 的键与 Set 的成员如何判断相等？' }
    answer:
      en: 'Both use SameValueZero. It behaves like strict equality for most values, but NaN equals itself and positive zero equals negative zero. Objects, arrays, and functions compare by identity, so two object literals with the same fields remain different keys or members. If the requirement says that records with the same ID are equal, I extract that stable ID and use it as the key instead of expecting structural comparison. For Map lookups I also separate equality from absence: get returns undefined for both a missing key and a present key whose value is undefined, while has distinguishes them.'
      zh: '二者都使用 SameValueZero。对大多数值，它的表现类似严格相等，但 NaN 等于自身，正零也等于负零。对象、数组和函数按标识比较，因此字段相同的两个对象字面量仍是不同键或成员。如果需求规定 ID 相同的记录相等，我会提取稳定 ID 作为键，而不是期待结构比较。Map 查询还要把相等与缺失分开：缺失键和明确保存 undefined 的键都会让 get 返回 undefined，只有 has 能区分二者。'
    topics: [javascript/map-set]
    level: intermediate
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [samevaluezero, object-identity, map, set]

  - id: map-set-composition-protocol
    question: { en: 'What should you know when using the modern Set composition methods?', zh: '使用现代 Set 集合组合方法时应了解什么？' }
    answer:
      en: 'union, intersection, difference, and symmetricDifference return new Set objects and leave both inputs unchanged. The three relation methods return Booleans. The receiver must be a real Set, but the right operand may be set-like if its size, has, and keys members agree; a Map therefore acts as a set of keys, while an array does not qualify. I do not rely on intersection preserving the left operand order because the algorithm may iterate the smaller side. I test the deployed runtime for method availability and sort the result explicitly when the output has a business order.'
      zh: 'union、intersection、difference 与 symmetricDifference 会返回新的 Set，不修改两个输入；三个关系方法返回布尔值。接收者必须是真正的 Set，右侧参数只要有彼此一致的 size、has 和 keys 就可以满足类集合协议。因此，Map 会表现为键集合，数组则不合格。我不会依赖 intersection 保留左侧顺序，因为算法可能遍历较小的一边。我会在部署运行时验证方法是否存在；输出有业务顺序时，再显式排序结果。'
    topics: [javascript/map-set]
    level: advanced
    section: { en: 'Language core', zh: '语言核心' }
    frequency: occasional
    tags: [set, set-composition, set-like, ordering]

  - id: map-set-weak-collection-boundary
    question: { en: 'When is WeakMap appropriate, and what does it not guarantee?', zh: 'WeakMap 适用于什么场景，又不保证什么？' }
    answer:
      en: 'WeakMap fits metadata keyed by an object whose lifetime is owned elsewhere, such as parsed schema data or DOM metadata. Its presence does not keep an otherwise unreachable key alive. That does not make it an enumerable cache or a cleanup hook: WeakMap exposes no size, iterator, clear operation, capacity policy, or collection deadline. In current Node 24, keys may be objects or non-registered Symbols, but not strings or registered Symbols. I use an ordinary Map for eviction and metrics, and deterministic control flow for subscriptions, locks, files, and transactions. Garbage collection only manages memory reachability.'
      zh: 'WeakMap 适合保存以对象为键、而对象生命周期由其他位置拥有的元数据，例如解析后的模式数据或 DOM 元数据。条目本身不会让已经无法从别处到达的键保持存活。但它既不是可枚举缓存，也不是清理钩子：没有大小、迭代器、clear、容量策略或回收期限。在当前 Node 24 中，键可以是对象或未注册 Symbol，不能是字符串或注册 Symbol。淘汰与指标应使用普通 Map；订阅、锁、文件和事务则要靠确定的控制流释放。垃圾回收只管理内存可达性。'
    topics: [javascript/map-set]
    level: advanced
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [weakmap, garbage-collection, lifetime, resource-management]

  - id: math-rounding-directions
    question: { en: 'How do Math.floor, Math.ceil, Math.trunc, and Math.round differ?', zh: 'Math.floor、Math.ceil、Math.trunc 与 Math.round 有什么区别？' }
    answer:
      en: 'floor rounds toward negative infinity, ceil toward positive infinity, and trunc toward zero. round chooses the nearest integer, with an exact midpoint going toward positive infinity; that makes Math.round(-2.5) equal -2 rather than -3. The negative cases distinguish these contracts: floor(-2.7) is -3, while trunc(-2.7) is -2. Math.round(-0.5) also produces negative zero, which ordinary string output can hide. I choose the method from the required direction and test positive fractions, negative fractions, midpoint values, and signed zero rather than calling all of them “rounding down” or “rounding normally.”'
      zh: 'floor 朝负无穷取整，ceil 朝正无穷取整，trunc 朝零取整。round 选择最近整数，精确中点朝正无穷，因此 Math.round(-2.5) 是 -2 而不是 -3。负数最能区分这些契约：floor(-2.7) 是 -3，trunc(-2.7) 则是 -2。Math.round(-0.5) 还会产生负零，普通字符串输出可能隐藏其符号。我会根据所需方向选择方法，并测试正负小数、中点和带符号零，不会把它们笼统称为“向下”或“正常四舍五入”。'
    topics: [javascript/math-object]
    level: beginner
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [math, rounding, negative-zero]

  - id: math-floating-comparison
    question: { en: 'Why is Number.EPSILON not a universal tolerance for floating-point comparisons?', zh: '为什么 Number.EPSILON 不是浮点比较的通用容差？' }
    answer:
      en: 'Number.EPSILON is the spacing between 1 and the next larger representable Number, so it describes one scale rather than a maximum error for every calculation. At large magnitudes, representable values are farther apart; near zero, the application may have an absolute measurement tolerance far larger than EPSILON. I first decide whether the result is meant to be exact. For approximate results, I derive tolerances from the domain and often combine an absolute bound near zero with a relative bound that scales with the operands. I then test both sides of business thresholds, not just 0.1 plus 0.2.'
      zh: 'Number.EPSILON 是 1 与下一个更大可表示 Number 之间的间隔，只描述一个量级，并不是每次计算的最大误差。数值很大时，可表示值之间的间隔更大；接近零时，应用允许的绝对测量误差又可能远大于 EPSILON。我会先判断结果是否本应精确。对于近似结果，容差要从领域要求推导，通常在零附近使用绝对界限，再用随操作数量级变化的相对界限补充。测试还要覆盖业务阈值两侧，而不只验证 0.1 加 0.2。'
    topics: [javascript/math-object]
    level: intermediate
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [floating-point, number-epsilon, tolerance]

  - id: math-randomness-contracts
    question: { en: 'When is Math.random appropriate, and what should replace it?', zh: 'Math.random 适用于什么情况，又应在何时替换它？' }
    answer:
      en: 'Math.random fits ordinary non-security randomness such as visual variation or a casual sample. Its API offers no seed, reproducibility guarantee, algorithm identity, or cryptographic unpredictability. Reproducible simulations should inject a named seeded pseudorandom generator and record its algorithm version, seed, and input order. Tokens, reset links, verification codes, and security-sensitive drawings need a cryptographically secure platform source such as Web Crypto. Mapping either source to an integer interval still requires explicit endpoint semantics. For secure ranges, I use a reviewed range API or rejection sampling rather than introducing modulo bias with a handwritten percent operation.'
      zh: 'Math.random 适合视觉变化或普通抽样等非安全随机需求。它的 API 不提供种子、复现保证、算法标识或密码学不可预测性。可复现模拟应注入具名的带种子伪随机生成器，并记录算法版本、种子与输入顺序。令牌、重置链接、验证码和涉及安全的抽签需要 Web Crypto 等平台密码学随机源。把任一种来源映射到整数区间时，仍要明确端点语义。安全区间应使用经过审查的范围 API 或拒绝采样，不要用手写取模引入偏差。'
    topics: [javascript/math-object]
    level: intermediate
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [math-random, web-crypto, reproducibility, security]

  - id: math-large-extrema
    question: { en: 'What can go wrong with Math.max(...values), and how do you aggregate safely?', zh: 'Math.max(...values) 可能出什么问题，怎样安全聚合？' }
    answer:
      en: 'Math.max accepts separate arguments rather than an array, so spreading a small validated array is convenient. The spread turns every element into a call argument, however, and a sufficiently large collection can exceed the engine limit. Empty input returns negative infinity, while any NaN argument makes the result NaN; neither may match the application contract. For unbounded data, I validate and aggregate item by item with a loop or a reduce with an explicit initial value. Before coding, I define whether empty input returns null or throws and whether non-finite observations are rejected, skipped, or propagated.'
      zh: 'Math.max 接收独立实参而不是数组，因此展开一个已验证的小数组很方便。但展开会把每个元素变成调用实参，集合足够大时可能超过引擎限制。空调用返回负无穷，任一 NaN 实参又会让结果变成 NaN；两者都未必符合应用契约。规模不受控时，我会用循环或带明确初值的 reduce 逐项验证和聚合。编码前还要决定空输入应返回 null 还是抛错，以及非有限观测值应被拒绝、跳过还是传播。'
    topics: [javascript/math-object]
    level: intermediate
    section: { en: 'Language core', zh: '语言核心' }
    frequency: occasional
    tags: [math-max, aggregation, spread, edge-cases]

  - id: memory-reachability-versus-scope
    question: { en: 'How does reachability determine whether a JavaScript object can be collected?', zh: '可达性如何决定一个 JavaScript 对象能否被回收？' }
    answer:
      en: 'I model the heap as an object graph and start from runtime roots such as active execution state, globals, and host-held callbacks. A tracing collector retains every node reachable through strong references and may reclaim an unreachable subgraph, including cycles. Leaving lexical scope often removes one path, but it does not remove aliases stored in a Map, property, listener, or closure. Becoming unreachable also does not imply immediate collection. In a leak investigation, I inspect the retaining path from a suspect object back to a root rather than relying on a null assignment or reference count.'
      zh: '我会把堆看成对象图，从活动执行状态、全局对象和宿主持有的回调等运行时根开始分析。追踪式垃圾回收器保留能沿强引用到达的所有节点，并可回收不可达子图，包括循环。离开词法作用域通常只移除一条路径，并不会删除 Map、属性、监听器或闭包中的别名。对象变得不可达也不等于立即回收。排查泄漏时，我会查看可疑对象返回根的保留路径，而不是依赖一次 null 赋值或引用计数。'
    topics: [javascript/memory-management]
    level: intermediate
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [garbage-collection, reachability, object-graph]

  - id: memory-weakmap-versus-map
    question: { en: 'When should you use WeakMap instead of Map?', zh: '什么情况下应使用 WeakMap，而不是 Map？' }
    answer:
      en: 'I use WeakMap when keys are objects or non-registered symbols owned elsewhere and the association must not keep those keys alive. Attaching metadata to DOM nodes or session objects is a typical fit. WeakMap uses identity, is not enumerable, and exposes no size, so it is not a replacement for a cache that needs string keys, metrics, iteration, or a predictable capacity. Its values remain available only while the key can be supplied. Other strong references can still retain the key, so switching collection types does not repair an unrelated ownership problem.'
      zh: '当键是由其他位置拥有的对象或非注册 Symbol，而且关联本身不应让键保持存活时，我会使用 WeakMap；给 DOM 节点或会话对象附加元数据就是典型场景。WeakMap 按标识匹配，不可枚举，也没有 size，因此不能替代需要字符串键、指标、遍历或可预测容量的缓存。只有仍能提供键时才能读取值。其他强引用仍可能保留键，所以更换集合类型无法修复无关的所有权问题。'
    topics: [javascript/memory-management]
    level: intermediate
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [weakmap, weak-collection, object-identity]

  - id: memory-finalization-limits
    question: { en: 'Why should FinalizationRegistry not be the primary resource-cleanup mechanism?', zh: '为什么不应把 FinalizationRegistry 作为主要资源清理机制？' }
    answer:
      en: 'FinalizationRegistry depends on a target becoming unreachable and on an implementation choosing to collect it and schedule the callback. The callback can be delayed indefinitely and may never run, including at process shutdown. That makes it unsuitable for correctness-critical release of locks, transactions, files, sockets, or scarce handles. I give the owner an explicit idempotent close or dispose method and invoke it through try/finally or another structured lifecycle. A finalizer can report missed cleanup or perform non-critical fallback work, but code must remain correct if it never executes.'
      zh: 'FinalizationRegistry 依赖目标先变得不可达，还依赖实现决定执行回收并调度回调。回调可能无限延迟，也可能永远不运行，包括进程关闭时。因此，它不适合承担锁、事务、文件、套接字或稀缺句柄等关键资源的释放。我会为所有者提供显式且幂等的 close 或 dispose，并通过 try/finally 或其他结构化生命周期调用。终结器可以报告遗漏或执行非关键补偿，但即使它从未运行，代码也必须保持正确。'
    topics: [javascript/memory-management]
    level: advanced
    section: { en: 'Runtime and diagnostics', zh: '运行时与诊断' }
    frequency: occasional
    tags: [finalization-registry, disposal, resource-lifecycle]

  - id: memory-leak-diagnosis
    question: { en: 'How do you distinguish a JavaScript memory leak from normal heap growth?', zh: '怎样区分 JavaScript 内存泄漏与正常堆增长？' }
    answer:
      en: 'I define one repeatable lifecycle, keep its input size constant, let the application return to a comparable idle state, and capture a baseline plus later heap snapshots. I look for object groups whose live counts grow across rounds and then inspect their retaining paths and business identities. Warm-up, intentional caches, allocation churn, and committed pages can all grow metrics without being leaks. I also keep measurement boundaries separate: browser page memory, V8 heapUsed, external buffers, and process RSS answer different questions. A leak conclusion needs persistent growth tied to an ownership path that should have ended.'
      zh: '我会定义一个可重复的完整生命周期，保持每轮输入规模一致，让应用回到可比较的空闲状态，再取得基线和后续堆快照。我先找出活对象数量跨轮增长的分组，然后检查其保留路径和业务身份。预热、有意缓存、分配抖动和已提交内存页都可能让指标增长，却不构成泄漏。我还会区分浏览器页面内存、V8 heapUsed、外部缓冲区和进程 RSS 等测量边界。只有持续增长能关联到本应结束的所有权路径时，泄漏结论才成立。'
    topics: [javascript/memory-management]
    level: advanced
    section: { en: 'Runtime and diagnostics', zh: '运行时与诊断' }
    frequency: common
    tags: [heap-snapshot, retaining-path, diagnostics]
