track: javascript
items:
  - id: array-map-versus-foreach
    question: { en: 'When should you use map instead of forEach?', zh: '什么情况下应使用 map，而不是 forEach？' }
    answer:
      en: 'Use map when one output element is derived from each visited input element and the new array is the result you want. The callback return value becomes the corresponding result element. Use forEach when the purpose is an external side effect, such as writing to a logger, and you do not need a returned collection. Neither method awaits an async callback. For asynchronous mapping, create Promises with map and explicitly await them with Promise.all, or use a loop when ordering or bounded concurrency matters.'
      zh: '当每个被访问的输入元素都要生成一个输出元素，而且目标就是得到新数组时，应使用 map。回调返回值会成为结果数组中的对应元素。只有操作目的确实是外部副作用，例如写日志，并且不需要返回集合时，才使用 forEach。两种方法都不会等待异步回调；异步映射应先用 map 创建 Promise，再显式交给 Promise.all 等待，若顺序或并发上限很重要，则使用循环或有界 worker。'
    topics: [javascript/array-methods]
    level: beginner
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [arrays, map, foreach]

  - id: array-mutating-versus-copying
    question: { en: 'How do mutating and copying array methods differ?', zh: '修改型数组方法与复制型数组方法有什么区别？' }
    answer:
      en: 'Mutating methods change the receiver. Examples include sort, reverse, splice, push, and fill, though their return values differ. Copying methods such as toSorted, toReversed, toSpliced, and with return a new outer array and leave its ordering or slots alone. That copy is shallow: both arrays may still point at the same element objects. In a review, classify the method, check its exact return value, then trace both array identity and element identity. This catches state bugs that a correct-looking snapshot test can miss.'
      zh: '修改型方法会改变接收者，例如 sort、reverse、splice、push 和 fill，但它们的返回值并不相同。toSorted、toReversed、toSpliced 和 with 等复制型方法返回新的外层数组，不改变原数组的顺序或槽位。这个副本仍是浅拷贝，两边可能继续引用同一批元素对象。审查时应先判断方法类别与准确返回值，再分别追踪数组标识和元素标识；这样才能发现只看最终快照时容易漏掉的状态错误。'
    topics: [javascript/array-methods]
    level: beginner
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [arrays, mutation, shallow-copy]

  - id: array-reduce-initial-value
    question: { en: 'What changes when reduce is called without an initial value?', zh: '调用 reduce 时省略初始值会改变什么？' }
    answer:
      en: 'Without an initial value, reduce finds the first existing array element, uses it as the accumulator, and begins callbacks with the next existing element. It throws TypeError when the array has no existing elements, including an empty array and a fully sparse one. With exactly one existing element, the callback never runs. Supplying a seed defines the empty-input result and the accumulator type from the start. That is why sums normally use 0 and grouping operations start with a deliberately chosen Map, array, or object.'
      zh: '省略初始值时，reduce 会寻找首个已有元素作为累加器，并从下一个已有元素开始调用回调。数组没有任何已有元素时会抛出 TypeError，这既包括空数组，也包括完全稀疏的数组。只有一个已有元素时，回调一次也不会运行。传入初始值可以从一开始定义空输入结果和累加器类型，因此求和通常使用 0，分组则应明确选择 Map、数组或对象作为起点。'
    topics: [javascript/array-methods]
    level: intermediate
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [arrays, reduce, accumulator]

  - id: array-sort-comparator-contract
    question: { en: 'What makes an Array sort comparator valid?', zh: '怎样的 Array 排序比较函数才是有效的？' }
    answer:
      en: 'A comparator returns a negative number when a belongs before b, a positive number when it belongs after b, and zero when they compare equal. Its answers must be consistent for repeated, reversed, and transitive comparisons. Returning a Boolean is invalid because false becomes zero and cannot distinguish one direction from equality. For numeric ascending order, use a - b; for records, compare the primary key and then an explicit tie-breaker. Also decide whether mutation is allowed: sort changes the receiver, while toSorted applies the same comparator to a shallow copy.'
      zh: '比较函数在 a 应排在 b 前面时返回负数，在 a 应排在 b 后面时返回正数，二者相等时返回 0；对重复、反向和传递比较的答案都必须一致。返回布尔值是错误的，因为 false 会变成 0，无法区分一个方向与相等。数值升序可用 a - b；记录排序应先比较主键，再写出明确的次键。同时还要决定是否允许修改输入：sort 改变接收者，toSorted 则对浅拷贝应用同一比较函数。'
    topics: [javascript/array-methods]
    level: intermediate
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [arrays, sorting, comparator]

  - id: class-prototype-relationship
    question: { en: 'How do JavaScript classes relate to prototypes?', zh: 'JavaScript 类与原型是什么关系？' }
    answer:
      en: 'A class creates a constructor function and a prototype object. Ordinary instance methods and accessors are non-enumerable properties on that prototype, so instances share them through normal prototype lookup. Public instance fields are different: they become own properties while each instance is constructed. Static members belong to the constructor function. Private fields are not properties on either prototype chain; the runtime installs private slots and checks the receiver brand. Class syntax therefore organizes the prototype model but also adds semantics, especially initialization order, strict mode, and private names.'
      zh: '类会创建构造函数及其 prototype 对象。普通实例方法和访问器是该原型上的不可枚举属性，实例通过常规原型查找共享它们。公开实例字段不同，它们在构造每个实例时成为自有属性。静态成员属于构造函数。私有字段不在任何一条原型链上；运行时会安装私有槽位并检查接收者标记。因此，类语法组织了原型模型，同时也增加了初始化顺序、严格模式和私有名称等语义。'
    topics: [javascript/classes]
    level: intermediate
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [classes, prototypes, fields]

  - id: class-derived-initialization-order
    question: { en: 'What is the relevant initialization order for a derived JavaScript class?', zh: 'JavaScript 派生类的关键初始化顺序是什么？' }
    answer:
      en: 'When super starts the base construction, base instance fields initialize before the base constructor body runs. The base body can already dispatch a method call to an override on the derived prototype, even though derived fields do not exist yet. As super returns, derived instance fields initialize in source order; only then does the rest of the derived constructor continue. A derived constructor cannot read this before super. This ordering is why base constructors should not call overridable methods that may depend on derived state.'
      zh: 'super 开始基类构造过程后，基类实例字段先于基类构造函数体初始化。构造函数体此时已经可能把方法调用分派给派生类的覆盖实现，但派生类字段还不存在。super 返回时，派生类实例字段按源码顺序初始化，之后才继续执行派生构造函数剩余部分。派生构造函数不能在 super 前读取 this。这正是基类构造函数不应调用依赖派生状态的可覆盖方法的原因。'
    topics: [javascript/classes]
    level: intermediate
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [classes, inheritance, initialization, super]

  - id: class-detached-method-receiver
    question: { en: 'Why can passing a class method as a callback fail, and how do you fix it?', zh: '为什么把类方法作为回调传递可能失败，应该怎样修复？' }
    answer:
      en: 'A class method is not automatically bound to the instance that supplied it. The call form object.method() provides object as the receiver, but map(object.method) later invokes a plain function, so this is undefined in the strict class body. Use a wrapper such as value => object.method(value), or bind the method once when registering it. An arrow-function field also captures the instance, but it creates a separate function per instance. For removable event listeners, retain the exact wrapper or bound function so removal uses the same identity.'
      zh: '类方法不会自动绑定到提供它的实例。object.method() 这种调用形式把 object 作为接收者，而 map(object.method) 随后调用的是普通函数，所以严格模式类体中的 this 为 undefined。可以使用 value => object.method(value) 这样的包装函数，或在注册时绑定一次。箭头函数字段也会捕获实例，但每个实例都会创建独立函数。对于可移除的事件监听器，还必须保存准确的包装函数或绑定函数，确保移除时使用同一标识。'
    topics: [javascript/classes]
    level: intermediate
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [classes, this, callbacks]

  - id: class-static-private-inheritance
    question: { en: 'Why can this.#counter fail in an inherited static method?', zh: '为什么继承的静态方法中 this.#counter 可能失败？' }
    answer:
      en: 'Private static fields are installed only on the class that declares them; subclasses do not receive the same private brand. An inherited public static method is callable through a subclass, and its this then refers to that subclass. Accessing this.#counter performs a brand check and throws TypeError. If one counter belongs to the base class, refer to BaseClass.#counter explicitly inside the declaring class. If every subclass needs separate state, use deliberate storage keyed by the constructor rather than pretending a private static field is polymorphic.'
      zh: '静态私有字段只安装在声明它的类上，子类不会获得同一个私有标记。公开静态方法可以被子类继承；通过子类调用时，其中的 this 指向子类。此时访问 this.#counter 会执行标记检查并抛出 TypeError。如果计数器由基类统一拥有，应在声明类内部明确写 BaseClass.#counter。若每个子类都需要独立状态，应使用以构造函数为键的显式存储，而不是假设静态私有字段支持多态。'
    topics: [javascript/classes]
    level: advanced
    section: { en: 'Language core', zh: '语言核心' }
    frequency: occasional
    tags: [classes, static, private-fields, inheritance]

  - id: closure-binding-versus-value
    question: { en: 'What does a JavaScript closure retain, and why is saying it copies a value misleading?', zh: 'JavaScript 闭包会保留什么，为什么说它复制了值会造成误解？' }
    answer:
      en: 'A JavaScript closure retains access to bindings from the lexical environment where the function was created. It does not copy each value into the function. If an outer let binding is reassigned, a later call observes the new value. Separate calls to an outer factory create separate bindings, while several inner functions created during one call can share them. For captured objects, distinguish the binding from object identity: two bindings may still hold the same object. That distinction explains stateful factories, stale asynchronous reads, and most loop-callback bugs.'
      zh: 'JavaScript 闭包保留对函数创建位置词法环境中绑定的访问路径，不会把每个值复制进函数。外层 let 绑定被重新赋值后，稍后调用会看到新值。两次外层工厂调用会创建不同绑定，同一次调用创建的多个内层函数则可以共享绑定。捕获对象时还要区分绑定与对象标识：两个不同绑定仍可能指向同一个对象。这个区别能解释有状态工厂、异步读取变化以及大多数循环回调错误。'
    topics: [javascript/closures]
    level: intermediate
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [closures, bindings, lexical-scope]

  - id: closure-var-let-loop
    question: { en: 'Why do callbacks in a var loop often read the final index, and why does let change the result?', zh: '为什么 var 循环中的回调常读到最终索引，而 let 会改变结果？' }
    answer:
      en: 'A var declaration creates one binding in the enclosing function or global environment. Every callback created by the loop closes over that same binding, so calls made after the loop read its final value. A for loop declared with let has per-iteration lexical bindings; each callback is associated with the binding for the iteration that created it. The timer or Promise is not the cause. Delayed execution only reveals the shared binding. Also check other captured state: a mutable object declared outside a let loop is still shared by every callback.'
      zh: 'var 声明在外层函数或全局环境中只创建一个绑定。循环产生的所有回调都捕获它，因此循环结束后的调用会读到最终值。用 let 声明的 for 循环具有逐轮词法绑定，每个回调关联到创建它的那一轮。定时器或 Promise 不是根因，延迟执行只是暴露了共享绑定。还要检查其他捕获状态：即使循环变量使用 let，循环外声明的可变对象仍会被所有回调共享。'
    topics: [javascript/closures]
    level: intermediate
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [closures, var, let, loops]

  - id: closure-versus-class-state
    question: { en: 'When would you choose a closure over a class for state, and when would you not?', zh: '什么情况下会用闭包保存状态，什么情况下不会？' }
    answer:
      en: 'A closure works well when one operation needs a small amount of configuration or private state and a factory call gives that state an obvious owner. It is also convenient when an API already expects a function. Prefer a class or explicit object when state has several operations, needs inspection or serialization, participates in inheritance, or has a lifecycle that callers must manage directly. Neither choice creates a security boundary by itself. In both forms, return values can leak references, and ownership should be verified by creating two instances and interleaving their operations.'
      zh: '当一个操作只需要少量配置或私有状态，而且一次工厂调用能清楚表达所有者时，闭包很合适；API 本来就要求函数时也很自然。若状态包含多种操作，需要检查或序列化，要参与继承，或生命周期必须由调用方直接管理，则类或显式对象通常更清楚。两种形式都不会自动形成安全边界，返回值都可能泄露引用。审查所有权时，应创建两个实例并交错执行操作，确认状态是否按预期隔离。'
    topics: [javascript/closures]
    level: intermediate
    section: { en: 'Language core', zh: '语言核心' }
    frequency: occasional
    tags: [closures, classes, state-ownership]

  - id: closure-handler-lifetime
    question: { en: 'How can a long-lived event handler closure retain memory, and what does correct cleanup require?', zh: '长期事件处理器闭包如何保留内存，正确清理需要什么？' }
    answer:
      en: 'Start from reachability, not from the fact that an outer function returned. If a long-lived event source owns a handler, the handler environment can keep captured component or request objects reachable. An unreachable cycle is not automatically a leak because garbage collection can reclaim the whole cycle. Correct cleanup removes the still-reachable registration using the same function identity and any matching options required by the API. Store that identity, expose an unsubscribe or dispose path, capture only needed values, and test teardown. Cleanup removes application references; it does not force immediate garbage collection.'
      zh: '分析时应从可达性出发，而不是只看外层函数是否已经返回。若长期事件源仍持有处理器，处理器环境会让捕获的组件或请求对象保持可达。整体不可达的引用环不一定泄漏，垃圾回收器可以回收它。正确清理必须使用注册时的同一函数标识，以及 API 要求匹配的选项，解除仍可达的注册关系。应保存该标识，提供取消订阅或释放路径，只捕获需要的值，并测试卸载流程。清理移除的是应用引用，不会强制立即回收。'
    topics: [javascript/closures]
    level: advanced
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [closures, callbacks, memory, cleanup]

  - id: date-time-value-and-views
    question: { en: 'What does a JavaScript Date store, and how do UTC, local, and named-zone views differ?', zh: 'JavaScript Date 保存什么，UTC、本地与指定时区视图有何区别？' }
    answer:
      en: 'A valid Date stores one numeric time value: integral milliseconds relative to the Unix epoch. It does not retain the original string, locale, calendar fields, or an IANA time-zone name. UTC getters project that value onto UTC fields. Local getters project it using the host environment local-zone rules, so results can differ across machines. Intl.DateTimeFormat can project the same instant into an explicitly named zone for display. Formatting never changes the instant. If later recurrence depends on the user zone, store that zone separately because Date cannot recover it.'
      zh: '有效的 Date 只保存一个数值时间值，也就是相对于 Unix 纪元的整数毫秒数。它不会保留原始字符串、区域设置、日历字段或 IANA 时区名称。UTC getter 把该值投影成 UTC 字段；本地 getter 使用宿主环境的本地时区规则，所以不同机器可能得到不同结果。Intl.DateTimeFormat 可以把同一时间点投影到明确指定的时区中展示。格式化不会改变时间点。若后续重复日程依赖用户时区，就必须另行保存该时区，因为 Date 无法恢复它。'
    topics: [javascript/date-object]
    level: beginner
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [date, time-value, time-zones]

  - id: date-safe-string-parsing
    question: { en: 'How would you define and enforce a safe timestamp parsing contract?', zh: '你会如何定义并执行安全的时间戳解析契约？' }
    answer:
      en: 'First decide which text shape the interface accepts; for example, require the canonical UTC form YYYY-MM-DDTHH:mm:ss.sssZ. Check the input type and grammar before constructing Date, then reject a NaN time value. If the contract is canonical, compare date.toISOString() with the input so normalized impossible dates do not pass. Do not accept locale-shaped strings merely because one engine parses them. Also document units for numeric timestamps, since Date expects milliseconds while many systems exchange seconds. Parsing an offset identifies an instant, but it does not preserve a named time zone.'
      zh: '首先确定接口接受哪种文本形状，例如要求规范 UTC 形式 YYYY-MM-DDTHH:mm:ss.sssZ。构造 Date 前检查输入类型和语法，再拒绝时间值为 NaN 的结果。如果契约要求规范形式，还要把 date.toISOString() 与输入比较，避免规范化后的不可能日期通过。不要因为某个引擎能解析区域格式字符串就接受它。数值时间戳还必须注明单位，因为 Date 使用毫秒，许多系统却交换秒。带偏移的输入可以标识时间点，但不会保留指定时区。'
    topics: [javascript/date-object]
    level: intermediate
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [date, parsing, validation, api-contract]

  - id: date-calendar-versus-elapsed-arithmetic
    question: { en: 'Why is adding one calendar day different from adding 86,400,000 milliseconds?', zh: '为什么增加一个日历日不同于增加 86,400,000 毫秒？' }
    answer:
      en: 'Adding 86,400,000 milliseconds means exactly 24 elapsed hours on the instant time line. Adding a calendar day means advancing calendar fields in a chosen zone, often while preserving the wall-clock time. Across a daylight-saving transition, those operations can produce instants one hour apart because a local day may span 23 or 25 elapsed hours. Ask whether the requirement is a duration or a recurrence. Use time-value arithmetic for duration. For recurrence, retain the named zone and define what happens when a local time is missing or repeated.'
      zh: '增加 86,400,000 毫秒表示在时间点时间线上经过恰好 24 小时。增加一个日历日则表示在选定时区中推进日历字段，通常还要保留墙上时钟时间。跨越夏令时切换时，两种操作得到的时间点可能相差一小时，因为一个本地日可能只经过 23 小时或经过 25 小时。应先确认需求是时长还是重复日程。时长使用时间值计算；重复日程要保留指定时区，并定义本地时间不存在或重复时的处理策略。'
    topics: [javascript/date-object]
    level: intermediate
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [date, calendar-arithmetic, duration, daylight-saving-time]

  - id: date-invalid-mutation-review
    question: { en: 'Which Date failure modes should you check in code review?', zh: '代码审查时应检查哪些 Date 失败模式？' }
    answer:
      en: 'Check external input first: an unparseable string creates a truthy invalid Date rather than throwing, and toISOString later throws RangeError. Trace whether code mixes local and UTC accessors or manually adds a fixed offset to imitate a named zone. Setters mutate their receiver and normalize overflow, so verify ownership and month-end behavior. Distinguish object equality from equal time values, and distinguish elapsed milliseconds from calendar units. Finally, Date.now reads an adjustable wall clock; interval and performance measurements generally need a monotonic source such as performance.now within the running context.'
      zh: '先检查外部输入：无法解析的字符串会创建真值的无效 Date，而不是立即抛错，之后调用 toISOString 才抛出 RangeError。跟踪代码是否混用本地与 UTC 访问器，或手动增加固定偏移来假装处理指定时区。setter 会修改接收者并规范化溢出，因此要核对所有权和月末行为。还要区分对象相等与时间值相等，以及经过毫秒数与日历单位。最后，Date.now 读取可调整的挂钟；在同一个运行上下文中测量间隔和性能，通常需要 performance.now 这样的单调来源。'
    topics: [javascript/date-object]
    level: advanced
    section: { en: 'Language core', zh: '语言核心' }
    frequency: occasional
    tags: [date, code-review, invalid-date, mutation]

  - id: destructuring-array-vs-object
    question: { en: 'How do array and object destructuring differ semantically?', zh: '数组解构与对象解构在语义上有什么区别？' }
    answer:
      en: 'Array destructuring consumes an iterable in sequence. Every pattern position advances its iterator, including an elision, and a rest element eagerly gathers the remainder into a new array. Object destructuring instead reads properties by key using normal property lookup, so property order in the pattern does not choose values and inherited getters may run. Object rest is narrower: it copies remaining own enumerable string and Symbol properties into a new ordinary object. Both forms support nesting and undefined-only defaults, but they fail on different inputs: an array pattern needs an iterable, while an object pattern rejects null and undefined.'
      zh: '数组解构按顺序消费可迭代对象。模式中的每个位置都会推进迭代器，空位置也不例外；剩余元素则立即把后续值收集到新数组。对象解构改为按键执行普通属性查找，因此模式中的属性顺序不决定取值，继承的 getter 也可能执行。对象剩余属性范围更窄，只把余下的自有可枚举字符串键与 Symbol 键复制到普通新对象。两种形式都支持嵌套和只处理 undefined 的默认值，但无效输入不同：数组模式要求可迭代对象，对象模式则拒绝 null 与 undefined。'
    topics: [javascript/destructuring]
    level: intermediate
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [destructuring, iterables, properties]

  - id: destructuring-default-boundaries
    question: { en: 'How do defaults behave in nested destructuring and function parameters?', zh: '嵌套解构与函数参数中的默认值怎样工作？' }
    answer:
      en: 'A destructuring default runs only when the value extracted at that exact position is undefined. Missing properties trigger it, but null, zero, false, and an empty string do not. Defaults at different levels solve different problems. In function f({ profile: { name = "guest" } = {} } = {}), the outer default handles an omitted or undefined argument, the object default handles undefined profile, and the leaf default handles undefined name. Explicit null still fails at either object-pattern boundary. For external data, validate first rather than turning malformed values into plausible business defaults.'
      zh: '只有在对应位置取出的值为 undefined 时，解构默认值才会执行。缺失属性会触发，而 null、0、false 和空字符串不会。不同层级的默认值解决不同问题。在 function f({ profile: { name = "guest" } = {} } = {}) 中，最外层默认值处理省略或为 undefined 的参数，对象默认值处理为 undefined 的 profile，叶子默认值处理为 undefined 的 name。显式 null 仍会在相应对象模式边界失败。对外部数据应先验证，不要把损坏值变成看似合理的业务默认值。'
    topics: [javascript/destructuring]
    level: intermediate
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [destructuring, defaults, 'null', parameters]

  - id: destructuring-object-rest
    question: { en: 'What exactly does an object rest property copy, and why is it unsafe for redaction?', zh: '对象剩余属性究竟复制什么，为什么它不适合脱敏？' }
    answer:
      en: 'An object rest property creates a new ordinary object and copies source properties not already excluded by the pattern. Only own enumerable string and Symbol keys qualify; inherited and non-enumerable properties do not. Values are read, so getters can run, and the new property is a data property rather than the original accessor. The copy is shallow, leaving nested object identity shared. Redaction by const { password, ...publicUser } is unsafe because any new token or secret field automatically enters publicUser. Across a trust boundary, construct output from an explicit allowlist and decide how each nested value is copied.'
      zh: '对象剩余属性创建普通新对象，并复制模式尚未排除的源属性。只有自有可枚举字符串键与 Symbol 键符合条件，继承属性和不可枚举属性不会复制。复制会读取值，因此 getter 可能执行；新对象上得到的是数据属性，不是原访问器。这个副本是浅层的，嵌套对象标识仍然共享。用 const { password, ...publicUser } 脱敏并不安全，因为以后新增的 token 或秘密字段会自动进入 publicUser。跨越信任边界时，应按明确允许列表构造输出，并分别决定每个嵌套值的复制方式。'
    topics: [javascript/destructuring]
    level: advanced
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [destructuring, object-rest, shallow-copy, security]

  - id: destructuring-observable-operations
    question: { en: 'Which observable operations can a destructuring pattern perform?', zh: '解构模式可能执行哪些可观察操作？' }
    answer:
      en: 'The right-hand expression is evaluated once, but a pattern can perform many later operations. An array pattern calls the iterator next method for every position, closes an unfinished iterator when the pattern ends, and consumes the entire remainder for a rest element. An object pattern evaluates computed keys and performs ordinary property reads, which can invoke getters or Proxy traps. Object rest also enumerates keys, inspects enumerability, and reads copied values. Default initializers run lazily after an extracted undefined. None of these effects is rolled back when a later read or assignment throws, so complex, side-effectful patterns are not atomic.'
      zh: '右侧表达式只求值一次，但模式随后可能执行许多操作。数组模式为每个位置调用迭代器的 next 方法，模式结束时关闭尚未结束的迭代器，并为剩余元素消费全部后续值。对象模式会求值计算键并执行普通属性读取，因而可能触发 getter 或 Proxy trap。对象剩余属性还会枚举键、检查可枚举性并读取复制值。默认初始化表达式只在取出 undefined 后惰性执行。后续读取或赋值抛错时，这些效果都不会回滚，所以复杂且带副作用的模式不是原子操作。'
    topics: [javascript/destructuring]
    level: advanced
    section: { en: 'Language core', zh: '语言核心' }
    frequency: occasional
    tags: [destructuring, iterators, getters, proxy]
