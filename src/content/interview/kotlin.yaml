track: kotlin
items:
  - id: fundamentals-val-versus-immutability
    question: { en: 'What is the difference between val, var, and an immutable object in Kotlin?', zh: 'Kotlin 中的 val、var 与不可变对象有什么区别？' }
    answer:
      en: 'val makes a reference read-only after initialization, while var allows the reference to be reassigned. Neither keyword decides whether the referenced object can change. A val can point to a MutableList whose elements are still added or removed, and two references may observe the same mutations. Immutability comes from the object model and the API that exposes it. I start with val to reduce assignment sites, then separately decide whether callers need a mutable object, a read-only view, or a defensive copy.'
      zh: 'val 让引用在初始化后不能重新赋值，var 则允许名称改指向另一个值。两者都不决定引用对象本身能否变化；val 完全可以指向仍可增删元素的 MutableList，多个别名也会观察到同一批修改。不可变性来自对象模型和公开 API。我会先用 val 缩小赋值范围，再单独判断调用方需要可变对象、只读视图，还是与原对象隔离的副本。'
    topics: [kotlin/fundamentals]
    level: beginner
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [val, var, immutability]

  - id: fundamentals-nullability-and-smart-casts
    question: { en: 'How do nullable types and smart casts work together in Kotlin?', zh: 'Kotlin 的可空类型与智能转换如何协同工作？' }
    answer:
      en: 'A type such as String? admits null, so Kotlin blocks ordinary member access until the code handles that possibility. A null check, type check, or early return can narrow the value on the remaining control-flow path; that compiler-proven narrowing is a smart cast. It works only when the value is stable between check and use. Mutable or open properties may change, so the compiler may reject a smart cast. Reading such a property into a local val both fixes the observed value and often makes the proof possible.'
      zh: 'String? 这类可空类型允许 null，因此代码处理这种可能之前，Kotlin 会阻止普通成员访问。空值检查、类型检查或提前返回可以在剩余控制流中收窄类型，这种由编译器证明的收窄就是智能转换。检查与使用之间的值必须稳定；可变属性或开放属性可能变化，所以智能转换可能被拒绝。把属性先读取到局部 val，既能固定本次观察到的值，也常能让证明成立。'
    topics: [kotlin/fundamentals]
    level: intermediate
    section: { en: 'Type system', zh: '类型系统' }
    frequency: common
    tags: [nullability, smart-cast, control-flow]

  - id: fundamentals-exhaustive-when
    question: { en: 'Why is an exhaustive when useful for enums and sealed hierarchies?', zh: '为什么穷尽 when 对枚举和密封层级有用？' }
    answer:
      en: 'An exhaustive when makes every value in a closed state set explicit. When it is used as an expression, Kotlin requires all possible states to produce a result. Listing each enum member or sealed subtype without a broad else lets the compiler detect future additions: adding a state breaks every decision point that has not defined its behavior. An else is appropriate for an open input such as arbitrary text, but over a closed domain it often hides missing business logic and converts a useful compile-time failure into an unintended fallback.'
      zh: '穷尽 when 会把封闭状态集合中的每个值写明。when 作为表达式时，Kotlin 要求所有可能状态都产生结果。对枚举成员或密封子类型逐项列举并省略宽泛 else，能让编译器发现后续新增状态；尚未定义新行为的决策点都会停止编译。任意文本这类开放输入适合使用 else，但在封闭领域中，else 往往会掩盖遗漏的业务逻辑，把有用的编译错误变成意外的默认行为。'
    topics: [kotlin/fundamentals]
    level: intermediate
    section: { en: 'Control flow', zh: '控制流' }
    frequency: common
    tags: [when, enum, exhaustiveness]

  - id: fundamentals-numeric-conversions
    question: { en: 'How does Kotlin handle numeric inference, conversion, and division?', zh: 'Kotlin 如何处理数字类型推断、转换与除法？' }
    answer:
      en: 'An unsuffixed integer literal normally becomes Int when it fits, while a decimal literal defaults to Double. Kotlin does not implicitly widen an Int argument to Long or Double; the caller uses conversions such as toLong() or toDouble(), which keeps precision and range decisions visible. Arithmetic may combine numeric operand types through their operators, but assignment still has an expected type. Division between integer operands discards the fractional part. I choose the result type before arithmetic, test overflow boundaries, and make monetary units and rounding policy explicit.'
      zh: '无后缀整数文字在范围允许时通常推断为 Int，小数文字默认推断为 Double。Kotlin 不会把 Int 实参隐式扩宽为 Long 或 Double；调用方要使用 toLong()、toDouble() 等转换，使精度与范围选择保持可见。运算符可以处理混合数字操作数，但赋值仍受预期类型约束。两个整数相除会截去小数部分。我会在运算前选择结果类型，测试溢出边界，并明确金额单位和舍入策略。'
    topics: [kotlin/fundamentals]
    level: beginner
    section: { en: 'Type system', zh: '类型系统' }
    frequency: occasional
    tags: [numbers, type-inference, conversion]

  - id: collections-read-only-versus-immutable
    question: { en: 'Why is a Kotlin read-only collection not necessarily immutable?', zh: '为什么 Kotlin 只读集合不一定不可变？' }
    answer:
      en: 'List, Set, and Map expose read operations but do not guarantee that the backing object cannot change. A MutableList can be assigned to a List reference, and another alias can still add or remove elements; the List view then observes those changes. val only prevents the reference from being reassigned. At an API boundary I distinguish a live read-only view from a stable snapshot. If the caller needs a snapshot, I copy the collection, then decide separately whether mutable element objects also require copying.'
      zh: 'List、Set 和 Map 只公开读取操作，并不保证底层对象不会变化。MutableList 可以赋给 List 引用，另一个别名仍能增删元素，List 视图随后也会观察到变化；val 只禁止引用重新赋值。在 API 边界，我会区分实时只读视图与稳定快照。调用方需要快照时，我会复制集合结构，再单独判断可变元素对象是否也需要复制。'
    topics: [kotlin/collections]
    level: beginner
    section: { en: 'Collections', zh: '集合' }
    frequency: common
    tags: [read-only-collection, mutability, aliasing]

  - id: collections-sequence-versus-iterable
    question: { en: 'When would you use Sequence instead of eager collection operations?', zh: '什么情况下应使用 Sequence，而不是急切集合操作？' }
    answer:
      en: 'I choose Sequence when evaluation semantics matter: a pipeline can short-circuit, should avoid materializing intermediate results, or reads from a source that produces values on demand. Sequence intermediate operations such as map and filter are lazy; a terminal operation such as first or toList starts consumption. I do not assume it is faster, because lazy dispatch has overhead and stateful steps may need the whole upstream. I also verify that input is finite when required, resources remain open during consumption, and the source supports any repeated traversal the caller expects.'
      zh: '当求值语义很重要时，我会选择 Sequence，例如管道能够短路、需要避免物化中间结果，或数据源本来就按需产生值。map、filter 等中间操作是惰性的，first、toList 等终结操作才会启动消费。我不会直接假设它更快，因为惰性调用也有成本，状态型步骤还可能需要完整上游。我还会确认输入在需要时有限、消费期间资源保持打开，并验证数据源是否支持调用方期望的重复遍历。'
    topics: [kotlin/collections]
    level: intermediate
    section: { en: 'Collection processing', zh: '集合处理' }
    frequency: common
    tags: [sequence, lazy-evaluation, terminal-operation]

  - id: collections-duplicate-map-keys
    question: { en: 'What happens when associateBy produces duplicate keys, and how do you handle it?', zh: 'associateBy 产生重复键时会怎样，应如何处理？' }
    answer:
      en: 'associateBy returns one value per key, so a later element with the same key replaces the earlier value. That is safe only when "last value wins" is the intended conflict policy. If keys must be unique, I reject a duplicate while inserting or compare the input and result sizes and report the conflicting key. If one key legitimately owns several values, I use groupBy and return Map<K, List<T>>. I make this choice before building the map because silent replacement can look like successful indexing while losing data.'
      zh: 'associateBy 每个键只返回一个值，因此后出现的同键元素会替换较早的值。只有在业务明确采用“最后值胜出”策略时，这才安全。若键必须唯一，我会在插入时拒绝重复项，或比较输入与结果大小并报告冲突键。若一个键确实对应多个值，我会使用 groupBy 并返回 Map<K, List<T>>。这项决定必须在构建映射前明确，因为静默替换看似成功建立了索引，实际却丢失数据。'
    topics: [kotlin/collections]
    level: intermediate
    section: { en: 'Maps and grouping', zh: '映射与分组' }
    frequency: common
    tags: [map, associateBy, groupBy, duplicate-keys]

  - id: collections-hash-key-stability
    question: { en: 'Why should hash-based collection keys remain stable?', zh: '为什么哈希集合中的键应保持稳定？' }
    answer:
      en: 'HashSet and HashMap choose a storage bucket from hashCode and confirm matches with equals. If a property used by those methods changes after insertion, a lookup using the object''s new state can search a different bucket. The entry may still occupy the old bucket but become difficult to find or remove. Kotlin data classes make this easy to miss because primary-constructor properties participate in generated equality and hashing. I use immutable identity fields or dedicated key values, and I test membership after any mutation that the model permits.'
      zh: 'HashSet 和 HashMap 先根据 hashCode 选择存储桶，再用 equals 确认匹配。对象插入后，如果参与这两个方法的属性发生变化，按新状态查找时就可能进入另一个桶。条目仍占据旧桶，却难以找到或删除。Kotlin 数据类的主构造函数属性默认参与生成的相等性和哈希计算，因此这个问题很容易被忽略。我会使用不可变身份字段或专用键值，并在模型允许修改时测试修改后的成员查找。'
    topics: [kotlin/collections]
    level: advanced
    section: { en: 'Collections', zh: '集合' }
    frequency: occasional
    tags: [hash-map, hash-set, equality, hash-code]

  - id: data-classes-generated-members
    question: { en: 'What does Kotlin generate for a data class, and which properties participate?', zh: 'Kotlin 会为数据类生成哪些成员，哪些属性会参与？' }
    answer:
      en: 'Kotlin derives equals, hashCode, toString, ordered component functions, and copy from properties declared in the primary constructor. Body properties remain ordinary instance state but are excluded from those generated members, so a copy initializes them again. I treat the constructor as the value-semantics boundary: moving a property across it changes comparison, hashing, logs, destructuring, and copying together. A data class can explicitly provide equals, hashCode, or toString, but custom equality must preserve the hash contract; copy and generated component functions cannot be supplied manually.'
      zh: 'Kotlin 会根据主构造函数中声明的属性生成 equals、hashCode、toString、按顺序编号的组件函数和 copy。类体属性仍是普通实例状态，但不会进入这些成员，因此副本会重新初始化它们。我把构造函数视为值语义边界；属性移入或移出它，会同时改变比较、哈希、日志、解构和复制。数据类可以显式提供 equals、hashCode 或 toString，但自定义相等性必须保持哈希契约；copy 和生成的组件函数不能手动提供。'
    topics: [kotlin/data-classes]
    level: intermediate
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [data-class, generated-members, primary-constructor]

  - id: data-classes-copy-depth
    question: { en: 'Is a Kotlin data class copy a deep copy, and how do you isolate nested state?', zh: 'Kotlin 数据类的 copy 是深拷贝吗，如何隔离嵌套状态？' }
    answer:
      en: 'copy is shallow. It constructs a new outer instance, defaults each primary-constructor argument to the current property, and passes nested references through unchanged unless the caller replaces them. Two copies can therefore share the same MutableList or mutable child object. For immutable nested data, I update by calling copy explicitly at each affected level. For mutable graphs, I first define ownership, then copy the collection structure and any mutable elements that require isolation. A read-only List type narrows available operations but does not prove that another alias cannot mutate its backing object.'
      zh: 'copy 是浅拷贝。它会构造新的外层实例，把每个主构造函数参数默认设为当前属性；除非调用方替换参数，否则嵌套引用会原样传递。因此，两个副本可能共享同一个 MutableList 或可变子对象。对于嵌套不可变数据，我会在每个受影响层级显式调用 copy。对于可变对象图，我会先定义所有权，再复制需要隔离的集合结构和可变元素。只读 List 类型只能缩小可用操作，不能证明其他别名无法修改其底层对象。'
    topics: [kotlin/data-classes]
    level: intermediate
    section: { en: 'Object modeling', zh: '对象建模' }
    frequency: common
    tags: [copy, shallow-copy, ownership]

  - id: data-classes-hash-key-stability
    question: { en: 'Why are mutable data classes dangerous as HashMap keys?', zh: '为什么可变数据类用作 HashMap 键很危险？' }
    answer:
      en: 'A HashMap chooses a bucket from hashCode and then uses equals to confirm a match. Generated data-class equality and hashing include primary-constructor properties. If one of those properties, or a nested value contributing to its hash, changes after insertion, lookup can search a different bucket while the entry remains in the old one. The key may become hard to find or remove. I use a dedicated key type with stable val properties and immutable reachable state. If identity is independent of mutable fields, I model that identity explicitly instead of hashing the whole entity snapshot.'
      zh: 'HashMap 先根据 hashCode 选择存储桶，再使用 equals 确认匹配。数据类生成的相等性和哈希包含主构造函数属性。如果插入后修改了这些属性，或修改了参与哈希的嵌套值，查找可能进入另一个桶，而条目仍留在旧桶中。这个键随后可能难以查找或删除。我会使用只含稳定 val 属性和不可变可达状态的专用键类型。如果标识独立于可变字段，我会显式建模该标识，而不是对整个实体快照做哈希。'
    topics: [kotlin/data-classes]
    level: advanced
    section: { en: 'Collections', zh: '集合' }
    frequency: common
    tags: [hash-map, mutable-key, equality, hash-code]

  - id: data-classes-array-equality
    question: { en: 'How do array properties affect equality in a Kotlin data class?', zh: '数组属性会怎样影响 Kotlin 数据类的相等性？' }
    answer:
      en: 'Generated data-class equality delegates to each property type, and Kotlin arrays use reference-based equals rather than element-wise equality. Two Packet values holding separately allocated ByteArray instances can therefore compare unequal even when every byte matches. I prefer List when the property conceptually represents a value collection. If an array is required, I override equals and hashCode together, pairing contentEquals with contentHashCode. Nested arrays need contentDeepEquals and contentDeepHashCode. I also test two independently allocated equal-content arrays, because reusing one array reference would hide the bug.'
      zh: '数据类生成的相等性会委托给每个属性类型，而 Kotlin 数组的 equals 使用引用语义，不会逐元素比较。因此，两个 Packet 分别持有独立分配的 ByteArray 时，即使每个字节都相同，也可能比较为不相等。当属性表示值集合时，我优先使用 List。必须使用数组时，我会同时重写 equals 和 hashCode，配对使用 contentEquals 与 contentHashCode；嵌套数组则使用 contentDeepEquals 与 contentDeepHashCode。我还会用两个独立分配、内容相同的数组测试，避免复用同一引用掩盖错误。'
    topics: [kotlin/data-classes]
    level: advanced
    section: { en: 'Equality and hashing', zh: '相等性与哈希' }
    frequency: occasional
    tags: [array, equality, content-equals, hash-code]

  - id: delegated-properties-operator-contract
    question: { en: 'What contract must a Kotlin property delegate provide?', zh: 'Kotlin 属性委托必须提供什么契约？' }
    answer:
      en: 'A read-only delegated property needs an operator getValue whose receiver is the delegate, whose arguments describe the owner and KProperty, and whose return fits the property type. A mutable property also needs setValue with a value parameter that can accept the property type. Implementing ReadOnlyProperty or ReadWriteProperty is optional but makes this contract explicit. I choose a specific owner type when the delegate depends on that owner, and Any? only for a truly general delegate. At a call site, by selects these operators at compile time; it does not use a naming convention discovered dynamically.'
      zh: '只读委托属性需要 operator getValue：接收者是委托，参数描述属性所有者与 KProperty，返回值必须适合属性类型。可变属性还需要 setValue，其 value 参数必须能够接收属性值。实现 ReadOnlyProperty 或 ReadWriteProperty 并非强制，但能明确表达契约。委托依赖特定所有者时，我会写出具体接收者类型；只有真正通用的委托才使用 Any?。调用点的 by 会在编译期解析这些操作符，不会在运行时按名称猜测方法。'
    topics: [kotlin/delegated-properties]
    level: intermediate
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [delegated-property, get-value, set-value]

  - id: delegated-properties-standard-delegates
    question: { en: 'How do lazy, observable, and vetoable differ?', zh: 'lazy、observable 与 vetoable 有什么区别？' }
    answer:
      en: 'lazy is a read-only delegate that computes on first access and caches the first successful result. Its thread mode controls initialization and publication; failed initialization is retried on a later read. observable is read-write and invokes its callback after storing the new value, so it can notify but cannot roll back automatically. vetoable invokes a predicate before storage and keeps the old value when the predicate returns false. I use these only when their timing is the intended API. Validation that needs a reason or an atomic multi-field update belongs in an explicit method rather than a silent veto.'
      zh: 'lazy 是只读委托，在第一次访问时计算并缓存首次成功的结果；线程模式控制初始化与发布，初始化失败后会在后续读取时重试。observable 可读写，会在保存新值后调用回调，所以能通知变化，却不能自动回滚。vetoable 在保存前调用谓词，谓词返回 false 时保留旧值。我只在这些时机正好符合 API 意图时使用它们。需要说明原因或原子更新多个字段的验证，应放进显式方法，而不是静默否决。'
    topics: [kotlin/delegated-properties]
    level: intermediate
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [lazy, observable, vetoable]

  - id: delegated-properties-state-ownership
    question: { en: 'How can a custom property delegate accidentally share state?', zh: '自定义属性委托会怎样意外共享状态？' }
    answer:
      en: 'A delegate that stores one value in its own field shares that value with every property bound to the same delegate instance. Making it an object or placing one instance in a top-level variable can therefore couple unrelated fields and owners. I normally create a stateful delegate in each property declaration, which gives every owner-property pair its own instance. If sharing is intentional, the delegate needs an explicit key such as both thisRef and KProperty, plus a lifetime and concurrency policy. I test by interleaving writes across two properties on two owner instances; a single-owner test misses the leak.'
      zh: '委托若把一个值保存在自身字段中，绑定到同一委托实例的所有属性就会共享该值。因此，把它声明为 object 或放进顶层变量，可能让无关字段和对象互相影响。我通常在每个属性声明中创建有状态委托，让每个“所有者－属性”组合拥有独立实例。若共享是有意设计，委托必须用 thisRef 与 KProperty 等显式键索引状态，并定义生命周期和并发策略。我会交错写入两个对象上的两个属性；只测试一个对象发现不了这种泄漏。'
    topics: [kotlin/delegated-properties]
    level: advanced
    section: { en: 'Object modeling', zh: '对象建模' }
    frequency: common
    tags: [property-delegate, shared-state, ownership]

  - id: delegated-properties-provide-delegate
    question: { en: 'What does provideDelegate add beyond getValue and setValue?', zh: 'provideDelegate 在 getValue 和 setValue 之外增加了什么？' }
    answer:
      en: 'provideDelegate intercepts binding between an owner property and the object on the right of by. It runs while the owner is initialized and returns the actual delegate that later receives getValue and setValue calls. This allows a provider to validate a property name, owner type, annotation, or registry entry early, and to create separate delegate state for every property. I keep the check limited to binding metadata because the owner may be only partly initialized at that point. Runtime value validation still belongs in setValue or, when callers need a result, in an explicit method.'
      zh: 'provideDelegate 会拦截所属对象的属性与 by 右侧对象之间的绑定。它在所属对象初始化时运行，返回之后真正接收 getValue 和 setValue 调用的委托。提供者因此可以尽早检查属性名、所有者类型、注解或注册表项，也能为每个属性创建独立状态。我会把检查限制在绑定元数据上，因为此时所属对象可能只完成了部分初始化。运行时的值验证仍应放在 setValue 中；调用方需要结果时，则应使用显式方法。'
    topics: [kotlin/delegated-properties]
    level: advanced
    section: { en: 'Language core', zh: '语言核心' }
    frequency: occasional
    tags: [provide-delegate, binding, initialization]

  - id: dsl-lambda-with-receiver
    question: { en: 'How does a lambda with receiver support a Kotlin internal DSL?', zh: '带接收者的 lambda 如何支持 Kotlin 内部 DSL？' }
    answer:
      en: 'A receiver function type such as ServerBuilder.() -> Unit gives the lambda a ServerBuilder as this. Its members can then be called without an explicit parameter, and trailing-lambda syntax lets an entry function read like server { ... }. Nothing is parsed as a new language: the entry function creates a builder, invokes the function value on it, validates state, and returns a result. I keep the receiver surface narrow because every public member becomes vocabulary inside the block. The final result should normally be a separate type so temporary mutation does not escape.'
      zh: 'ServerBuilder.() -> Unit 这样的接收者函数类型会把 ServerBuilder 作为 lambda 中的 this，因此块内可以省略显式参数直接调用其成员；再配合尾随 lambda，入口就能写成 server { ... }。这里没有新的解析器：入口函数创建构建器，在它上面调用函数值，校验状态，再返回结果。我会缩小接收者的公开表面，因为每个公开成员都会变成块内词汇。最终结果通常应使用独立类型，避免暂时可变状态逸出。'
    topics: [kotlin/dsl]
    level: intermediate
    section: { en: 'Functions and receivers', zh: '函数与接收者' }
    frequency: common
    tags: [lambda-with-receiver, trailing-lambda, builder]

  - id: dsl-marker-scope-control
    question: { en: 'What problem does @DslMarker solve, and what does it not solve?', zh: '@DslMarker 解决什么问题，又不解决什么问题？' }
    answer:
      en: '@DslMarker controls implicit receiver resolution in nested DSL scopes. When receiver types carry the same marker, the closest receiver remains available implicitly and calls through an outer receiver require a qualified this. That prevents a nested block from silently invoking a structurally inappropriate outer operation. The annotation does not remove the outer object, enforce runtime value rules, sanitize strings, or make results immutable. I apply one marker consistently across every receiver type in the logical DSL and keep negative compilation tests that prove invalid nesting is rejected.'
      zh: '@DslMarker 控制嵌套 DSL 作用域中的隐式接收者解析。多个接收者类型带有同一标记时，只有最近的接收者能被隐式使用；调用外层接收者需要限定的 this。这样可防止嵌套块悄悄调用结构上不合适的外层操作。该注解不会移除外层对象，也不会执行运行期值校验、清理字符串或让结果不可变。我会让同一逻辑 DSL 的所有接收者类型共享一个标记，并保留负向编译测试，证明非法嵌套确实被拒绝。'
    topics: [kotlin/dsl]
    level: intermediate
    section: { en: 'Functions and receivers', zh: '函数与接收者' }
    frequency: common
    tags: [dsl-marker, implicit-receiver, scope]

  - id: dsl-builder-result-boundary
    question: { en: 'Where should validation and ownership changes happen in a Kotlin builder DSL?', zh: 'Kotlin 构建器 DSL 应在哪里完成校验和所有权转换？' }
    answer:
      en: 'I treat build() as the boundary between incomplete, temporarily mutable assembly state and a valid result. The method checks constraints involving several fields, parses raw values into domain types, and copies builder-owned collections before returning. A read-only List type alone is not enough if it still aliases the builder''s MutableList. Per-field checks can run earlier when they improve the error location, but build must still guarantee every result invariant. I test missing and boundary values, then mutate the builder and original inputs after construction to prove the returned object is isolated.'
      zh: '我把 build() 当作未完成的暂时可变装配状态与合法结果之间的边界。它会检查涉及多个字段的约束，把原始值解析成领域类型，并在返回前复制构建器持有的集合。如果只读 List 仍与构建器的 MutableList 互为别名，仅改变公开类型并不够。单字段检查可以提前执行以改善错误位置，但 build 仍须保证结果的全部不变量。我会测试缺失值和边界值，再在构建后修改构建器与原始输入，以证明返回对象已经隔离。'
    topics: [kotlin/dsl]
    level: advanced
    section: { en: 'API design', zh: 'API 设计' }
    frequency: common
    tags: [result-boundary, validation, ownership]

  - id: dsl-staged-builders
    question: { en: 'When is a staged builder better than one mutable builder with nullable fields?', zh: '分阶段构建器何时优于带可空字段的单个可变构建器？' }
    answer:
      en: 'A staged builder fits a small, stable sequence of required steps. Each operation returns a type exposing only the next legal operations, and only the final stage can produce the result. Missing or out-of-order steps then fail during compilation instead of reaching a late !! or requireNotNull. I do not use stages for every optional flag or concrete value range because the number of types grows quickly and runtime checks remain necessary. Constructor parameters are simpler when there is no repeated structure; stages earn their cost when order itself is part of the domain contract.'
      zh: '分阶段构建器适合少量、稳定且必须按顺序完成的步骤。每个操作返回只公开下一批合法操作的类型，只有最后阶段能产生结果；遗漏步骤或顺序错误会在编译期失败，不会拖到最后的 !! 或 requireNotNull。我不会为每个可选开关或具体值范围创建阶段，因为类型数量会迅速增长，运行期检查仍不可少。没有重复结构时，构造函数参数更简单；只有当顺序本身属于领域契约时，阶段类型的成本才值得。'
    topics: [kotlin/dsl]
    level: advanced
    section: { en: 'API design', zh: 'API 设计' }
    frequency: occasional
    tags: [staged-builder, compile-time, api-design]

  - id: extensions-static-dispatch
    question: { en: 'Why are Kotlin extension functions not polymorphic?', zh: '为什么 Kotlin 扩展函数不具备多态性？' }
    answer:
      en: 'An extension call is resolved from the receiver expression type known at compile time, together with visible declarations and arguments. The runtime subtype does not select a more specific extension. If an Alert value enters a parameter declared as Message, message.kind() resolves to the Message extension even when an Alert extension exists. I use an open member or interface operation when behavior must vary by runtime subtype. I test extension adapters through concrete, base, and interface-typed variables because concrete-only tests hide this distinction.'
      zh: '扩展调用根据编译期已知的接收者表达式类型、可见声明和实参解析，运行时子类型不会选择更具体的扩展。即使存在 Alert 扩展，只要 Alert 值进入声明为 Message 的参数，message.kind() 就会解析为 Message 扩展。行为必须随运行时子类型变化时，我会使用开放成员或接口操作。我还会通过具体类型、基类类型和接口类型变量分别测试扩展适配器，因为只测具体类型会掩盖这个区别。'
    topics: [kotlin/extensions]
    level: intermediate
    section: { en: 'Functions and receivers', zh: '函数与接收者' }
    frequency: common
    tags: [extension-function, static-dispatch, polymorphism]

  - id: extensions-member-precedence
    question: { en: 'What happens when an extension and a real member have the same signature?', zh: '扩展与真实成员具有相同签名时会发生什么？' }
    answer:
      en: 'The applicable real member wins; an extension cannot override or replace it. Different signatures may still coexist as overloads. This rule also matters during API evolution: a dependency may add a member whose signature matches an extension already used by callers, and recompiled source then selects the new member. I avoid broad names on widely used receiver types, watch shadowing warnings, and run call-site behavior tests when upgrading dependencies. If both operations are legitimate, I give the extension a domain-specific name rather than relying on subtle overload resolution.'
      zh: '适用的真实成员优先，扩展不能覆盖或替换它；不同签名仍可作为重载共存。这条规则也影响 API 演进：依赖可能新增一个与调用方现有扩展同签名的成员，源码重新编译后就会选择新成员。我会避免在常用接收者类型上使用宽泛名称，留意遮蔽警告，并在升级依赖时运行调用点行为测试。两个操作都合理时，我会给扩展使用领域明确的名称，而不是依赖微妙的重载解析。'
    topics: [kotlin/extensions]
    level: intermediate
    section: { en: 'Functions and receivers', zh: '函数与接收者' }
    frequency: common
    tags: [member-precedence, overload-resolution, api-evolution]

  - id: extensions-properties-and-nullable-receivers
    question: { en: 'What constraints govern extension properties and nullable receivers?', zh: '扩展属性与可空接收者分别受哪些约束？' }
    answer:
      en: 'An extension property adds accessor syntax but no storage, so it cannot have its own backing field. Its getter should normally compute a cheap, stable value from receiver state; hidden I/O or a global cache deserves an explicit function or state owner. A nullable receiver such as Customer? can be called directly when the value is null, with this remaining nullable inside. Adding ?. at the call site skips the body and may bypass its fallback. I test direct and safe calls separately and keep null behavior in the public contract.'
      zh: '扩展属性只增加访问器语法，不增加存储，因此不能拥有自己的后备字段。getter 通常应从接收者状态计算便宜且稳定的值；隐藏的 I/O 或全局缓存应改用显式函数或状态所有者。Customer? 这样的可空接收者可以在值为 null 时直接调用，函数体中的 this 仍然可空。在调用点加 ?. 会跳过函数体，可能绕过回退逻辑。我会分别测试直接调用与安全调用，并把 null 行为写进公开契约。'
    topics: [kotlin/extensions]
    level: intermediate
    section: { en: 'Properties and nullability', zh: '属性与空安全' }
    frequency: common
    tags: [extension-property, nullable-receiver, backing-field]

  - id: extensions-scope-and-api-design
    question: { en: 'How do you keep a Kotlin extension API predictable?', zh: '如何让 Kotlin 扩展 API 保持可预测？' }
    answer:
      en: 'I start with ownership: the extension belongs near the domain rule that justifies it, not in a generic utilities package. I use the narrowest useful visibility, prefer explicit imports for contested names, and avoid vague extensions on broad receivers such as Any, String, or List<T>. The function uses only stable public receiver APIs because member-call syntax grants no private access. If the behavior owns an invariant, needs new per-instance state, or requires runtime polymorphism, I move it into a member, wrapper, or service instead of stretching the extension mechanism.'
      zh: '我先判断所有权：扩展应靠近证明其合理性的领域规则，而不是放进通用工具包。我使用满足需求的最窄可见性，对容易冲突的名称采用显式导入，并避免在 Any、String 或 List<T> 等宽泛接收者上声明模糊扩展。成员调用语法不会授予私有访问权，因此函数只使用稳定的公开 API。如果行为负责不变量、需要每个实例的新状态或运行时多态，我会把它移入成员、包装器或服务，而不是勉强使用扩展机制。'
    topics: [kotlin/extensions]
    level: advanced
    section: { en: 'API design', zh: 'API 设计' }
    frequency: occasional
    tags: [visibility, imports, api-design, ownership]

  - id: inline-classes-versus-aliases-and-data-classes
    question: { en: 'When should you choose an inline value class instead of a type alias or data class?', zh: '何时应选择内联值类，而不是类型别名或数据类？' }
    answer:
      en: 'I use an inline value class when one underlying value completely describes a domain concept and I need a distinct static type, such as separating UserId from OrderId. A type alias only renames an existing type, so aliases with the same underlying type remain assignment-compatible and cannot prevent transposed arguments. A data class is a better fit when the value has several components, needs copy or destructuring, or benefits from an ordinary object representation. Possible unboxed representation is secondary: I choose the value class for the type boundary first, then verify boxing where performance actually matters.'
      zh: '当一个底层值足以完整描述领域概念，而且我需要独立静态类型时，我会使用内联值类，例如区分 UserId 与 OrderId。类型别名只为现有类型改名；底层类型相同的别名仍然赋值兼容，无法阻止参数对调。值由多个组成部分构成、需要 copy 或解构，或者适合常规对象表示时，数据类更合适。可能采用未装箱表示只是次要收益：我先为类型边界选择值类，再在性能确实重要的位置验证装箱。'
    topics: [kotlin/inline-classes]
    level: intermediate
    section: { en: 'Type modeling', zh: '类型建模' }
    frequency: common
    tags: [value-class, type-alias, data-class]

  - id: inline-classes-boxing-boundaries
    question: { en: 'When does a Kotlin inline value class use a boxed representation?', zh: 'Kotlin 内联值类何时使用装箱表示？' }
    answer:
      en: 'On the JVM, the compiler prefers the underlying representation when a value is used directly as its value-class type. It normally needs the generated wrapper when the value is used as a generic type argument, an implemented interface, Any, or a nullable value-class type that the underlying value cannot represent. The same source value can therefore be unboxed at one call and boxed at the next. This is not a guarantee about heap allocation because later compiler and JIT optimization may remove objects. I inspect the target artifact and profile the actual call shape before changing an API for performance.'
      zh: '在 JVM 上，值以其值类类型直接使用时，编译器倾向于采用底层表示。值作为泛型类型实参、实现的接口、Any，或底层值无法表示的可空值类类型使用时，通常需要生成的包装类。因此，同一个源码值可以在一次调用中未装箱，在下一次调用中装箱。这仍不是堆分配保证，因为后续编译器与 JIT 优化可能消除对象。我会先检查目标产物并分析真实调用形状，再为性能修改 API。'
    topics: [kotlin/inline-classes]
    level: intermediate
    section: { en: 'JVM representation', zh: 'JVM 表示' }
    frequency: common
    tags: [boxing, underlying-type, jvm]

  - id: inline-classes-invariants-and-mutability
    question: { en: 'Do inline value classes enforce invariants and immutability automatically?', zh: '内联值类会自动强制不变量与不可变性吗？' }
    answer:
      en: 'No. An init block can reject invalid underlying values, but a companion factory does not become mandatory while the primary constructor remains public. I restrict constructor visibility when normalization or validation must be universal and route every public factory through the same checks. The val data property prevents reassignment of its reference; it does not freeze a MutableList or another mutable object behind that reference. Such mutation can change equality and hashing after insertion into a map. I prefer a stable immutable underlying representation, copy mutable inputs at the boundary, and test framework deserialization paths separately.'
      zh: '不会。init 块可以拒绝非法底层值，但只要主构造函数仍然公开，伴生对象工厂就不是必经入口。规范化或校验必须统一时，我会限制构造函数可见性，并让所有公开工厂经过同一检查。数据属性上的 val 只阻止重新赋值引用，不会冻结引用背后的 MutableList 或其他可变对象；这类修改可能在键插入映射后改变相等性与哈希。我倾向于使用稳定的不可变底层表示，在边界复制可变输入，并单独测试框架反序列化路径。'
    topics: [kotlin/inline-classes]
    level: advanced
    section: { en: 'Type modeling', zh: '类型建模' }
    frequency: common
    tags: [class-invariant, mutability, hash-code]

  - id: inline-classes-java-interop
    question: { en: 'How do JVM name mangling and boxed exposure affect Java callers of Kotlin value classes?', zh: 'JVM 名称修饰与装箱暴露如何影响 Java 调用 Kotlin 值类？' }
    answer:
      en: 'A value-class parameter may compile to its underlying JVM type, which can clash with an overload using that type directly. Kotlin avoids the clash by adding a stable hash to the method name, but the resulting name is awkward or impossible to call from Java source. I publish an explicit @JvmName bridge when Java can pass the underlying value and reconstruct the domain type immediately. When Java must hold the wrapper, Kotlin 2.4.10 offers experimental @JvmExposeBoxed or -Xjvm-expose-boxed. I treat those generated constructors and overloads as ABI, inspect them with javap, and compile a Java consumer test.'
      zh: '值类参数可能编译成其底层 JVM 类型，因而与直接使用该类型的重载发生冲突。Kotlin 会在方法名后添加稳定哈希来避免冲突，但得到的名称难以或无法从 Java 源码调用。Java 可以传递底层值时，我会发布明确的 @JvmName 桥接，并立即恢复领域类型。Java 必须持有包装对象时，Kotlin 2.4.10 提供实验性的 @JvmExposeBoxed 或 -Xjvm-expose-boxed。我会把生成的构造函数与重载当作 ABI，用 javap 检查，并编译一个 Java 消费方测试。'
    topics: [kotlin/inline-classes]
    level: advanced
    section: { en: 'JVM interoperability', zh: 'JVM 互操作' }
    frequency: occasional
    tags: [name-mangling, jvm-name, jvm-expose-boxed]
