track: kotlin
items:
  - id: fundamentals-val-versus-immutability
    question: { en: 'What is the difference between val, var, and an immutable object in Kotlin?', zh: 'Kotlin 中的 val、var 与不可变对象有什么区别？' }
    answer:
      en: 'val makes a reference read-only after initialization, while var allows the reference to be reassigned. Neither keyword decides whether the referenced object can change. A val can point to a MutableList whose elements are still added or removed, and two references may observe the same mutations. Immutability comes from the object model and the API that exposes it. I start with val to reduce assignment sites, then separately decide whether callers need a mutable object, a read-only view, or a defensive copy.'
      zh: 'val 让引用在初始化后不能重新赋值，var 则允许名称改指向另一个值。两者都不决定引用对象本身能否变化；val 完全可以指向仍可增删元素的 MutableList，多个别名也会观察到同一批修改。不可变性来自对象模型和公开 API。我会先用 val 缩小赋值范围，再单独判断调用方需要可变对象、只读视图，还是与原对象隔离的副本。'
    topics: [kotlin/fundamentals]
    level: beginner
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [val, var, immutability]

  - id: fundamentals-nullability-and-smart-casts
    question: { en: 'How do nullable types and smart casts work together in Kotlin?', zh: 'Kotlin 的可空类型与智能转换如何协同工作？' }
    answer:
      en: 'A type such as String? admits null, so Kotlin blocks ordinary member access until the code handles that possibility. A null check, type check, or early return can narrow the value on the remaining control-flow path; that compiler-proven narrowing is a smart cast. It works only when the value is stable between check and use. Mutable or open properties may change, so the compiler may reject a smart cast. Reading such a property into a local val both fixes the observed value and often makes the proof possible.'
      zh: 'String? 这类可空类型允许 null，因此代码处理这种可能之前，Kotlin 会阻止普通成员访问。空值检查、类型检查或提前返回可以在剩余控制流中收窄类型，这种由编译器证明的收窄就是智能转换。检查与使用之间的值必须稳定；可变属性或开放属性可能变化，所以智能转换可能被拒绝。把属性先读取到局部 val，既能固定本次观察到的值，也常能让证明成立。'
    topics: [kotlin/fundamentals]
    level: intermediate
    section: { en: 'Type system', zh: '类型系统' }
    frequency: common
    tags: [nullability, smart-cast, control-flow]

  - id: fundamentals-exhaustive-when
    question: { en: 'Why is an exhaustive when useful for enums and sealed hierarchies?', zh: '为什么穷尽 when 对枚举和密封层级有用？' }
    answer:
      en: 'An exhaustive when makes every value in a closed state set explicit. When it is used as an expression, Kotlin requires all possible states to produce a result. Listing each enum member or sealed subtype without a broad else lets the compiler detect future additions: adding a state breaks every decision point that has not defined its behavior. An else is appropriate for an open input such as arbitrary text, but over a closed domain it often hides missing business logic and converts a useful compile-time failure into an unintended fallback.'
      zh: '穷尽 when 会把封闭状态集合中的每个值写明。when 作为表达式时，Kotlin 要求所有可能状态都产生结果。对枚举成员或密封子类型逐项列举并省略宽泛 else，能让编译器发现后续新增状态；尚未定义新行为的决策点都会停止编译。任意文本这类开放输入适合使用 else，但在封闭领域中，else 往往会掩盖遗漏的业务逻辑，把有用的编译错误变成意外的默认行为。'
    topics: [kotlin/fundamentals]
    level: intermediate
    section: { en: 'Control flow', zh: '控制流' }
    frequency: common
    tags: [when, enum, exhaustiveness]

  - id: fundamentals-numeric-conversions
    question: { en: 'How does Kotlin handle numeric inference, conversion, and division?', zh: 'Kotlin 如何处理数字类型推断、转换与除法？' }
    answer:
      en: 'An unsuffixed integer literal normally becomes Int when it fits, while a decimal literal defaults to Double. Kotlin does not implicitly widen an Int argument to Long or Double; the caller uses conversions such as toLong() or toDouble(), which keeps precision and range decisions visible. Arithmetic may combine numeric operand types through their operators, but assignment still has an expected type. Division between integer operands discards the fractional part. I choose the result type before arithmetic, test overflow boundaries, and make monetary units and rounding policy explicit.'
      zh: '无后缀整数文字在范围允许时通常推断为 Int，小数文字默认推断为 Double。Kotlin 不会把 Int 实参隐式扩宽为 Long 或 Double；调用方要使用 toLong()、toDouble() 等转换，使精度与范围选择保持可见。运算符可以处理混合数字操作数，但赋值仍受预期类型约束。两个整数相除会截去小数部分。我会在运算前选择结果类型，测试溢出边界，并明确金额单位和舍入策略。'
    topics: [kotlin/fundamentals]
    level: beginner
    section: { en: 'Type system', zh: '类型系统' }
    frequency: occasional
    tags: [numbers, type-inference, conversion]

  - id: collections-read-only-versus-immutable
    question: { en: 'Why is a Kotlin read-only collection not necessarily immutable?', zh: '为什么 Kotlin 只读集合不一定不可变？' }
    answer:
      en: 'List, Set, and Map expose read operations but do not guarantee that the backing object cannot change. A MutableList can be assigned to a List reference, and another alias can still add or remove elements; the List view then observes those changes. val only prevents the reference from being reassigned. At an API boundary I distinguish a live read-only view from a stable snapshot. If the caller needs a snapshot, I copy the collection, then decide separately whether mutable element objects also require copying.'
      zh: 'List、Set 和 Map 只公开读取操作，并不保证底层对象不会变化。MutableList 可以赋给 List 引用，另一个别名仍能增删元素，List 视图随后也会观察到变化；val 只禁止引用重新赋值。在 API 边界，我会区分实时只读视图与稳定快照。调用方需要快照时，我会复制集合结构，再单独判断可变元素对象是否也需要复制。'
    topics: [kotlin/collections]
    level: beginner
    section: { en: 'Collections', zh: '集合' }
    frequency: common
    tags: [read-only-collection, mutability, aliasing]

  - id: collections-sequence-versus-iterable
    question: { en: 'When would you use Sequence instead of eager collection operations?', zh: '什么情况下应使用 Sequence，而不是急切集合操作？' }
    answer:
      en: 'I choose Sequence when evaluation semantics matter: a pipeline can short-circuit, should avoid materializing intermediate results, or reads from a source that produces values on demand. Sequence intermediate operations such as map and filter are lazy; a terminal operation such as first or toList starts consumption. I do not assume it is faster, because lazy dispatch has overhead and stateful steps may need the whole upstream. I also verify that input is finite when required, resources remain open during consumption, and the source supports any repeated traversal the caller expects.'
      zh: '当求值语义很重要时，我会选择 Sequence，例如管道能够短路、需要避免物化中间结果，或数据源本来就按需产生值。map、filter 等中间操作是惰性的，first、toList 等终结操作才会启动消费。我不会直接假设它更快，因为惰性调用也有成本，状态型步骤还可能需要完整上游。我还会确认输入在需要时有限、消费期间资源保持打开，并验证数据源是否支持调用方期望的重复遍历。'
    topics: [kotlin/collections]
    level: intermediate
    section: { en: 'Collection processing', zh: '集合处理' }
    frequency: common
    tags: [sequence, lazy-evaluation, terminal-operation]

  - id: collections-duplicate-map-keys
    question: { en: 'What happens when associateBy produces duplicate keys, and how do you handle it?', zh: 'associateBy 产生重复键时会怎样，应如何处理？' }
    answer:
      en: 'associateBy returns one value per key, so a later element with the same key replaces the earlier value. That is safe only when "last value wins" is the intended conflict policy. If keys must be unique, I reject a duplicate while inserting or compare the input and result sizes and report the conflicting key. If one key legitimately owns several values, I use groupBy and return Map<K, List<T>>. I make this choice before building the map because silent replacement can look like successful indexing while losing data.'
      zh: 'associateBy 每个键只返回一个值，因此后出现的同键元素会替换较早的值。只有在业务明确采用“最后值胜出”策略时，这才安全。若键必须唯一，我会在插入时拒绝重复项，或比较输入与结果大小并报告冲突键。若一个键确实对应多个值，我会使用 groupBy 并返回 Map<K, List<T>>。这项决定必须在构建映射前明确，因为静默替换看似成功建立了索引，实际却丢失数据。'
    topics: [kotlin/collections]
    level: intermediate
    section: { en: 'Maps and grouping', zh: '映射与分组' }
    frequency: common
    tags: [map, associateBy, groupBy, duplicate-keys]

  - id: collections-hash-key-stability
    question: { en: 'Why should hash-based collection keys remain stable?', zh: '为什么哈希集合中的键应保持稳定？' }
    answer:
      en: 'HashSet and HashMap choose a storage bucket from hashCode and confirm matches with equals. If a property used by those methods changes after insertion, a lookup using the object''s new state can search a different bucket. The entry may still occupy the old bucket but become difficult to find or remove. Kotlin data classes make this easy to miss because primary-constructor properties participate in generated equality and hashing. I use immutable identity fields or dedicated key values, and I test membership after any mutation that the model permits.'
      zh: 'HashSet 和 HashMap 先根据 hashCode 选择存储桶，再用 equals 确认匹配。对象插入后，如果参与这两个方法的属性发生变化，按新状态查找时就可能进入另一个桶。条目仍占据旧桶，却难以找到或删除。Kotlin 数据类的主构造函数属性默认参与生成的相等性和哈希计算，因此这个问题很容易被忽略。我会使用不可变身份字段或专用键值，并在模型允许修改时测试修改后的成员查找。'
    topics: [kotlin/collections]
    level: advanced
    section: { en: 'Collections', zh: '集合' }
    frequency: occasional
    tags: [hash-map, hash-set, equality, hash-code]
