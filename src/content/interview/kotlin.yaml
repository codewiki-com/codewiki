track: kotlin
items:
  - id: fundamentals-val-versus-immutability
    question: { en: 'What is the difference between val, var, and an immutable object in Kotlin?', zh: 'Kotlin 中的 val、var 与不可变对象有什么区别？' }
    answer:
      en: 'val makes a reference read-only after initialization, while var allows the reference to be reassigned. Neither keyword decides whether the referenced object can change. A val can point to a MutableList whose elements are still added or removed, and two references may observe the same mutations. Immutability comes from the object model and the API that exposes it. I start with val to reduce assignment sites, then separately decide whether callers need a mutable object, a read-only view, or a defensive copy.'
      zh: 'val 让引用在初始化后不能重新赋值，var 则允许名称改指向另一个值。两者都不决定引用对象本身能否变化；val 完全可以指向仍可增删元素的 MutableList，多个别名也会观察到同一批修改。不可变性来自对象模型和公开 API。我会先用 val 缩小赋值范围，再单独判断调用方需要可变对象、只读视图，还是与原对象隔离的副本。'
    topics: [kotlin/fundamentals]
    level: beginner
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [val, var, immutability]

  - id: fundamentals-nullability-and-smart-casts
    question: { en: 'How do nullable types and smart casts work together in Kotlin?', zh: 'Kotlin 的可空类型与智能转换如何协同工作？' }
    answer:
      en: 'A type such as String? admits null, so Kotlin blocks ordinary member access until the code handles that possibility. A null check, type check, or early return can narrow the value on the remaining control-flow path; that compiler-proven narrowing is a smart cast. It works only when the value is stable between check and use. Mutable or open properties may change, so the compiler may reject a smart cast. Reading such a property into a local val both fixes the observed value and often makes the proof possible.'
      zh: 'String? 这类可空类型允许 null，因此代码处理这种可能之前，Kotlin 会阻止普通成员访问。空值检查、类型检查或提前返回可以在剩余控制流中收窄类型，这种由编译器证明的收窄就是智能转换。检查与使用之间的值必须稳定；可变属性或开放属性可能变化，所以智能转换可能被拒绝。把属性先读取到局部 val，既能固定本次观察到的值，也常能让证明成立。'
    topics: [kotlin/fundamentals]
    level: intermediate
    section: { en: 'Type system', zh: '类型系统' }
    frequency: common
    tags: [nullability, smart-cast, control-flow]

  - id: fundamentals-exhaustive-when
    question: { en: 'Why is an exhaustive when useful for enums and sealed hierarchies?', zh: '为什么穷尽 when 对枚举和密封层级有用？' }
    answer:
      en: 'An exhaustive when makes every value in a closed state set explicit. When it is used as an expression, Kotlin requires all possible states to produce a result. Listing each enum member or sealed subtype without a broad else lets the compiler detect future additions: adding a state breaks every decision point that has not defined its behavior. An else is appropriate for an open input such as arbitrary text, but over a closed domain it often hides missing business logic and converts a useful compile-time failure into an unintended fallback.'
      zh: '穷尽 when 会把封闭状态集合中的每个值写明。when 作为表达式时，Kotlin 要求所有可能状态都产生结果。对枚举成员或密封子类型逐项列举并省略宽泛 else，能让编译器发现后续新增状态；尚未定义新行为的决策点都会停止编译。任意文本这类开放输入适合使用 else，但在封闭领域中，else 往往会掩盖遗漏的业务逻辑，把有用的编译错误变成意外的默认行为。'
    topics: [kotlin/fundamentals]
    level: intermediate
    section: { en: 'Control flow', zh: '控制流' }
    frequency: common
    tags: [when, enum, exhaustiveness]

  - id: fundamentals-numeric-conversions
    question: { en: 'How does Kotlin handle numeric inference, conversion, and division?', zh: 'Kotlin 如何处理数字类型推断、转换与除法？' }
    answer:
      en: 'An unsuffixed integer literal normally becomes Int when it fits, while a decimal literal defaults to Double. Kotlin does not implicitly widen an Int argument to Long or Double; the caller uses conversions such as toLong() or toDouble(), which keeps precision and range decisions visible. Arithmetic may combine numeric operand types through their operators, but assignment still has an expected type. Division between integer operands discards the fractional part. I choose the result type before arithmetic, test overflow boundaries, and make monetary units and rounding policy explicit.'
      zh: '无后缀整数文字在范围允许时通常推断为 Int，小数文字默认推断为 Double。Kotlin 不会把 Int 实参隐式扩宽为 Long 或 Double；调用方要使用 toLong()、toDouble() 等转换，使精度与范围选择保持可见。运算符可以处理混合数字操作数，但赋值仍受预期类型约束。两个整数相除会截去小数部分。我会在运算前选择结果类型，测试溢出边界，并明确金额单位和舍入策略。'
    topics: [kotlin/fundamentals]
    level: beginner
    section: { en: 'Type system', zh: '类型系统' }
    frequency: occasional
    tags: [numbers, type-inference, conversion]
