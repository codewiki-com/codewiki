track: java
items:
  - id: primitive-versus-reference-types
    question: { en: 'How do primitive and reference types differ in Java?', zh: 'Java 的基本类型与引用类型有什么区别？' }
    answer:
      en: 'A primitive variable holds one of Java’s built-in Boolean, integral, or floating-point values and cannot hold null. A reference variable holds a reference to an object or array, or the null reference. Assigning a primitive copies its value. Assigning a reference copies the reference, so both variables can identify the same mutable object. Arrays are reference types even when their elements are primitive. Generic type arguments must be reference types, which is why a list of integers uses List<Integer> and introduces boxing.'
      zh: '基本类型变量保存 Java 内建的布尔、整数或浮点值，不能保存 null。引用变量保存对象或数组的引用，也可以是空引用。赋值基本类型会复制值；赋值引用类型会复制引用，因此两个变量可能指向同一个可变对象。数组始终是引用类型，即使元素是基本类型。泛型类型参数必须是引用类型，所以整数列表要写成 List<Integer>，并由此引入装箱。'
    topics: [java/data-types]
    level: beginner
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [primitives, references, arrays]

  - id: java-numeric-conversion-risks
    question: { en: 'What can go wrong in Java widening, narrowing, and numeric promotion?', zh: 'Java 的扩大转换、缩小转换和数值提升分别可能出什么问题？' }
    answer:
      en: 'Widening to a wider integral type preserves the value, but widening int or long to floating point can lose precision. Narrowing integral conversions discard high bits, while floating-to-integral conversion rounds toward zero and has defined results for NaN and out-of-range values rather than throwing. Numeric promotion means byte, short, and char arithmetic usually runs as int. Intermediate expressions therefore matter: assigning an int multiplication to long does not prevent earlier overflow. Widen before the operation or use the Math exact methods when overflow must be rejected.'
      zh: '扩大到更宽的整数类型会保留数值，但把 int 或 long 扩大为浮点类型仍可能丢失精度。整数缩小转换会丢弃高位；浮点转整数会向零舍入，并为 NaN 和超范围值产生规范定义的结果，而不是抛出异常。byte、short 和 char 的算术通常先提升为 int，所以中间表达式的类型很关键。把 int 乘法结果赋给 long 不能阻止先前溢出；需要拒绝溢出时，应在运算前扩大或使用 Math 的精确方法。'
    topics: [java/data-types]
    level: intermediate
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [conversions, promotion, overflow]

  - id: boxing-equality-and-null
    question: { en: 'Why are boxing, wrapper equality, and null a dangerous combination?', zh: '为什么装箱、包装类型相等比较与 null 组合起来很危险？' }
    answer:
      en: 'Autoboxing converts a primitive to its wrapper and unboxing extracts the primitive. The conversions are often implicit in collections, arithmetic, comparisons, conditional expressions, and method calls. Unboxing null throws NullPointerException. Using == between wrapper references tests identity, and the required cache for certain small boxed constants can make that bug pass small-value tests. Use primitives when absence is impossible, validate nullable wrappers before arithmetic, and compare nullable wrapper values with Objects.equals. Also inspect overload selection because boxing, unboxing, and primitive widening affect which method is called.'
      zh: '自动装箱把基本类型转成包装类型，拆箱则取出基本值；集合、算术、比较、条件表达式和方法调用都可能隐式触发这些转换。拆箱 null 会抛出 NullPointerException。包装引用之间的 == 比较对象身份，而规范要求缓存某些小型装箱常量，可能让这个错误通过小值测试。确定不存在缺失值时优先使用基本类型；对可空包装值先校验再运算，并用 Objects.equals 比较值。还要检查重载选择，因为装箱、拆箱和基本类型扩大都会影响调用目标。'
    topics: [java/data-types]
    level: intermediate
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [boxing, unboxing, equality, 'null']

  - id: decimal-and-text-type-choices
    question: { en: 'How do you choose types for decimal money and Unicode text?', zh: '十进制金额与 Unicode 文本应如何选择类型？' }
    answer:
      en: 'For money defined in decimal units, BigDecimal preserves decimal values and makes scale and rounding explicit. Construct it from decimal text or an exact integer, not from an already rounded double. Decide whether equality includes scale: equals distinguishes 1.0 from 1.00, while compareTo treats them as numerically equal. For text, char is one UTF-16 code unit, not every Unicode code point or displayed grapheme. Use String code-point APIs for supplementary characters, and use a text-boundary library when the requirement concerns user-perceived characters.'
      zh: '对于以十进制单位定义的金额，BigDecimal 能保留十进制值，并显式表达小数位数与舍入规则。应从十进制文本或精确整数构造，而不是从已经舍入的 double 构造。还要决定相等是否包含小数位数：equals 区分 1.0 与 1.00，compareTo 则认为数值相等。文本方面，char 只是一个 UTF-16 代码单元，不等于所有 Unicode 码点或显示字素。处理补充码点时使用 String 的代码点 API，需求针对用户可见字符时则使用文本边界库。'
    topics: [java/data-types]
    level: intermediate
    section: { en: 'Numbers and text', zh: '数值与文本' }
    frequency: occasional
    tags: [bigdecimal, unicode, char]

  - id: exceptions-checked-versus-unchecked
    question: { en: 'How do checked and unchecked exceptions differ, and when would you define each kind?', zh: '检查型异常与非检查型异常有何区别？什么情况下会自定义这两类异常？' }
    answer:
      en: 'Checked exception classes are the Throwable hierarchy outside RuntimeException and Error. The compiler requires a caller to catch or declare them. I use a checked domain exception when callers should be forced to choose propagation, translation, or recovery, such as failing to load required external data. I use an unchecked exception for a violated precondition, illegal object state, or programming defect. Neither category dictates that every caller catch the failure. The type describes the contract; the catch boundary should exist only where code can apply a meaningful policy.'
      zh: '检查型异常类位于 Throwable 体系中 RuntimeException 与 Error 分支之外，编译器要求调用方捕获或声明它们。如果调用方应被强制选择传播、转换或恢复，例如无法加载必需的外部数据，我会使用检查型领域异常。前置条件被违反、对象状态不允许操作或存在程序缺陷时，我会使用非检查型异常。两种类别都不表示每个调用方必须捕获。类型描述失败契约，只有能执行明确策略的代码边界才应捕获。'
    topics: [java/exceptions]
    level: beginner
    section: { en: 'Error handling', zh: '错误处理' }
    frequency: common
    tags: [checked-exception, unchecked-exception, contracts]

  - id: exceptions-handler-selection
    question: { en: 'How does Java select a catch clause and continue execution after an exception?', zh: 'Java 如何选择 catch 子句？异常处理后又从哪里继续执行？' }
    answer:
      en: 'The JVM tests handlers around the throw site in source order and selects the first whose parameter can receive the exception object’s runtime type. If none matches, the current frame completes abruptly and the search continues in its caller. A subtype handler must precede its supertype or the later branch is unreachable. After a handler completes normally, execution continues after the entire try statement, not after the failed instruction. Rethrowing the same object preserves its identity and original trace; translating it should create a domain exception with the original as its cause.'
      zh: 'JVM 会按源码顺序检查抛出点周围的处理器，选择第一个参数类型能够接收异常对象实际类型的 catch。如果没有匹配项，当前栈帧会非正常完成，并转到调用方继续搜索。子类处理器必须位于父类之前，否则后续分支不可达。处理器正常结束后，程序从整个 try 语句之后继续，而不是回到失败指令之后。重新抛出同一对象会保留其身份和原始栈轨迹；转换异常时，则应创建领域异常并把原异常作为原因。'
    topics: [java/exceptions]
    level: intermediate
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [catch, propagation, stack-unwinding]

  - id: exceptions-resource-suppression
    question: { en: 'What guarantees does try-with-resources provide when both work and cleanup fail?', zh: '主体操作和清理都失败时，try-with-resources 提供什么保证？' }
    answer:
      en: 'Every successfully initialized, non-null resource receives a close attempt in reverse initialization order. A close failure does not prevent attempts to close the remaining resources. If the body already threw, that exception stays primary and later close failures are attached to it as suppressed exceptions. If the body succeeded, the first close failure becomes primary and later ones are suppressed onto it. I inspect getSuppressed as well as getCause during diagnosis. This differs from a cause: a cause explains why an exception was created, while suppression preserves concurrent cleanup failures.'
      zh: '每个成功初始化且非 null 的资源都会按初始化的相反顺序获得一次关闭机会，一个关闭失败不会阻止其余资源继续关闭。如果主体已经抛出异常，该异常保持为主异常，之后的关闭失败作为被抑制异常附加到它。如果主体成功，第一个关闭失败成为主异常，后续关闭失败附加到它。诊断时我会同时检查 getSuppressed 与 getCause。原因用于解释异常为何创建，被抑制异常则保留传播过程中并列发生的清理失败。'
    topics: [java/exceptions]
    level: intermediate
    section: { en: 'Resource management', zh: '资源管理' }
    frequency: common
    tags: [try-with-resources, autocloseable, suppressed-exception]

  - id: exceptions-boundary-policy
    question: { en: 'What should an exception policy do at service, task, or API boundaries?', zh: '服务、任务或 API 边界上的异常策略应完成哪些工作？' }
    answer:
      en: 'A boundary should classify expected domain failures, unexpected defects, cancellation, and failures that are safe to retry. It can translate low-level exceptions into stable domain types while retaining the original cause, then record the complete exception once where the request or task outcome is owned. Public responses should be sanitized and correlated with internal diagnostics rather than exposing paths, SQL, or credentials. Retry only transient failures of suitably idempotent operations. InterruptedException normally propagates; if the signature cannot do that, cleanup should finish and the thread’s interrupt status should be restored.'
      zh: '边界应区分预期的领域失败、意外程序缺陷、取消，以及可以安全重试的失败。它可以把底层异常转换为稳定的领域类型，同时保留原始原因；随后在拥有请求或任务结果的位置记录一次完整异常。公开响应应经过净化，并通过标识与内部诊断关联，不能暴露路径、SQL 或凭据。只有具有合适幂等性的操作遇到暂时失败时才应重试。InterruptedException 通常应继续传播；签名无法传播时，应完成清理并恢复线程的中断状态。'
    topics: [java/exceptions]
    level: advanced
    section: { en: 'Failure boundaries', zh: '失败边界' }
    frequency: occasional
    tags: [exception-translation, retry, interruption, security]
