track: java
items:
  - id: primitive-versus-reference-types
    question: { en: 'How do primitive and reference types differ in Java?', zh: 'Java 的基本类型与引用类型有什么区别？' }
    answer:
      en: 'A primitive variable holds one of Java’s built-in Boolean, integral, or floating-point values and cannot hold null. A reference variable holds a reference to an object or array, or the null reference. Assigning a primitive copies its value. Assigning a reference copies the reference, so both variables can identify the same mutable object. Arrays are reference types even when their elements are primitive. Generic type arguments must be reference types, which is why a list of integers uses List<Integer> and introduces boxing.'
      zh: '基本类型变量保存 Java 内建的布尔、整数或浮点值，不能保存 null。引用变量保存对象或数组的引用，也可以是空引用。赋值基本类型会复制值；赋值引用类型会复制引用，因此两个变量可能指向同一个可变对象。数组始终是引用类型，即使元素是基本类型。泛型类型参数必须是引用类型，所以整数列表要写成 List<Integer>，并由此引入装箱。'
    topics: [java/data-types]
    level: beginner
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [primitives, references, arrays]

  - id: java-numeric-conversion-risks
    question: { en: 'What can go wrong in Java widening, narrowing, and numeric promotion?', zh: 'Java 的扩大转换、缩小转换和数值提升分别可能出什么问题？' }
    answer:
      en: 'Widening to a wider integral type preserves the value, but widening int or long to floating point can lose precision. Narrowing integral conversions discard high bits, while floating-to-integral conversion rounds toward zero and has defined results for NaN and out-of-range values rather than throwing. Numeric promotion means byte, short, and char arithmetic usually runs as int. Intermediate expressions therefore matter: assigning an int multiplication to long does not prevent earlier overflow. Widen before the operation or use the Math exact methods when overflow must be rejected.'
      zh: '扩大到更宽的整数类型会保留数值，但把 int 或 long 扩大为浮点类型仍可能丢失精度。整数缩小转换会丢弃高位；浮点转整数会向零舍入，并为 NaN 和超范围值产生规范定义的结果，而不是抛出异常。byte、short 和 char 的算术通常先提升为 int，所以中间表达式的类型很关键。把 int 乘法结果赋给 long 不能阻止先前溢出；需要拒绝溢出时，应在运算前扩大或使用 Math 的精确方法。'
    topics: [java/data-types]
    level: intermediate
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [conversions, promotion, overflow]

  - id: boxing-equality-and-null
    question: { en: 'Why are boxing, wrapper equality, and null a dangerous combination?', zh: '为什么装箱、包装类型相等比较与 null 组合起来很危险？' }
    answer:
      en: 'Autoboxing converts a primitive to its wrapper and unboxing extracts the primitive. The conversions are often implicit in collections, arithmetic, comparisons, conditional expressions, and method calls. Unboxing null throws NullPointerException. Using == between wrapper references tests identity, and the required cache for certain small boxed constants can make that bug pass small-value tests. Use primitives when absence is impossible, validate nullable wrappers before arithmetic, and compare nullable wrapper values with Objects.equals. Also inspect overload selection because boxing, unboxing, and primitive widening affect which method is called.'
      zh: '自动装箱把基本类型转成包装类型，拆箱则取出基本值；集合、算术、比较、条件表达式和方法调用都可能隐式触发这些转换。拆箱 null 会抛出 NullPointerException。包装引用之间的 == 比较对象身份，而规范要求缓存某些小型装箱常量，可能让这个错误通过小值测试。确定不存在缺失值时优先使用基本类型；对可空包装值先校验再运算，并用 Objects.equals 比较值。还要检查重载选择，因为装箱、拆箱和基本类型扩大都会影响调用目标。'
    topics: [java/data-types]
    level: intermediate
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [boxing, unboxing, equality, 'null']

  - id: decimal-and-text-type-choices
    question: { en: 'How do you choose types for decimal money and Unicode text?', zh: '十进制金额与 Unicode 文本应如何选择类型？' }
    answer:
      en: 'For money defined in decimal units, BigDecimal preserves decimal values and makes scale and rounding explicit. Construct it from decimal text or an exact integer, not from an already rounded double. Decide whether equality includes scale: equals distinguishes 1.0 from 1.00, while compareTo treats them as numerically equal. For text, char is one UTF-16 code unit, not every Unicode code point or displayed grapheme. Use String code-point APIs for supplementary characters, and use a text-boundary library when the requirement concerns user-perceived characters.'
      zh: '对于以十进制单位定义的金额，BigDecimal 能保留十进制值，并显式表达小数位数与舍入规则。应从十进制文本或精确整数构造，而不是从已经舍入的 double 构造。还要决定相等是否包含小数位数：equals 区分 1.0 与 1.00，compareTo 则认为数值相等。文本方面，char 只是一个 UTF-16 代码单元，不等于所有 Unicode 码点或显示字素。处理补充码点时使用 String 的代码点 API，需求针对用户可见字符时则使用文本边界库。'
    topics: [java/data-types]
    level: intermediate
    section: { en: 'Numbers and text', zh: '数值与文本' }
    frequency: occasional
    tags: [bigdecimal, unicode, char]

  - id: exceptions-checked-versus-unchecked
    question: { en: 'How do checked and unchecked exceptions differ, and when would you define each kind?', zh: '检查型异常与非检查型异常有何区别？什么情况下会自定义这两类异常？' }
    answer:
      en: 'Checked exception classes are the Throwable hierarchy outside RuntimeException and Error. The compiler requires a caller to catch or declare them. I use a checked domain exception when callers should be forced to choose propagation, translation, or recovery, such as failing to load required external data. I use an unchecked exception for a violated precondition, illegal object state, or programming defect. Neither category dictates that every caller catch the failure. The type describes the contract; the catch boundary should exist only where code can apply a meaningful policy.'
      zh: '检查型异常类位于 Throwable 体系中 RuntimeException 与 Error 分支之外，编译器要求调用方捕获或声明它们。如果调用方应被强制选择传播、转换或恢复，例如无法加载必需的外部数据，我会使用检查型领域异常。前置条件被违反、对象状态不允许操作或存在程序缺陷时，我会使用非检查型异常。两种类别都不表示每个调用方必须捕获。类型描述失败契约，只有能执行明确策略的代码边界才应捕获。'
    topics: [java/exceptions]
    level: beginner
    section: { en: 'Error handling', zh: '错误处理' }
    frequency: common
    tags: [checked-exception, unchecked-exception, contracts]

  - id: exceptions-handler-selection
    question: { en: 'How does Java select a catch clause and continue execution after an exception?', zh: 'Java 如何选择 catch 子句？异常处理后又从哪里继续执行？' }
    answer:
      en: 'The JVM tests handlers around the throw site in source order and selects the first whose parameter can receive the exception object’s runtime type. If none matches, the current frame completes abruptly and the search continues in its caller. A subtype handler must precede its supertype or the later branch is unreachable. After a handler completes normally, execution continues after the entire try statement, not after the failed instruction. Rethrowing the same object preserves its identity and original trace; translating it should create a domain exception with the original as its cause.'
      zh: 'JVM 会按源码顺序检查抛出点周围的处理器，选择第一个参数类型能够接收异常对象实际类型的 catch。如果没有匹配项，当前栈帧会非正常完成，并转到调用方继续搜索。子类处理器必须位于父类之前，否则后续分支不可达。处理器正常结束后，程序从整个 try 语句之后继续，而不是回到失败指令之后。重新抛出同一对象会保留其身份和原始栈轨迹；转换异常时，则应创建领域异常并把原异常作为原因。'
    topics: [java/exceptions]
    level: intermediate
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [catch, propagation, stack-unwinding]

  - id: exceptions-resource-suppression
    question: { en: 'What guarantees does try-with-resources provide when both work and cleanup fail?', zh: '主体操作和清理都失败时，try-with-resources 提供什么保证？' }
    answer:
      en: 'Every successfully initialized, non-null resource receives a close attempt in reverse initialization order. A close failure does not prevent attempts to close the remaining resources. If the body already threw, that exception stays primary and later close failures are attached to it as suppressed exceptions. If the body succeeded, the first close failure becomes primary and later ones are suppressed onto it. I inspect getSuppressed as well as getCause during diagnosis. This differs from a cause: a cause explains why an exception was created, while suppression preserves concurrent cleanup failures.'
      zh: '每个成功初始化且非 null 的资源都会按初始化的相反顺序获得一次关闭机会，一个关闭失败不会阻止其余资源继续关闭。如果主体已经抛出异常，该异常保持为主异常，之后的关闭失败作为被抑制异常附加到它。如果主体成功，第一个关闭失败成为主异常，后续关闭失败附加到它。诊断时我会同时检查 getSuppressed 与 getCause。原因用于解释异常为何创建，被抑制异常则保留传播过程中并列发生的清理失败。'
    topics: [java/exceptions]
    level: intermediate
    section: { en: 'Resource management', zh: '资源管理' }
    frequency: common
    tags: [try-with-resources, autocloseable, suppressed-exception]

  - id: exceptions-boundary-policy
    question: { en: 'What should an exception policy do at service, task, or API boundaries?', zh: '服务、任务或 API 边界上的异常策略应完成哪些工作？' }
    answer:
      en: 'A boundary should classify expected domain failures, unexpected defects, cancellation, and failures that are safe to retry. It can translate low-level exceptions into stable domain types while retaining the original cause, then record the complete exception once where the request or task outcome is owned. Public responses should be sanitized and correlated with internal diagnostics rather than exposing paths, SQL, or credentials. Retry only transient failures of suitably idempotent operations. InterruptedException normally propagates; if the signature cannot do that, cleanup should finish and the thread’s interrupt status should be restored.'
      zh: '边界应区分预期的领域失败、意外程序缺陷、取消，以及可以安全重试的失败。它可以把底层异常转换为稳定的领域类型，同时保留原始原因；随后在拥有请求或任务结果的位置记录一次完整异常。公开响应应经过净化，并通过标识与内部诊断关联，不能暴露路径、SQL 或凭据。只有具有合适幂等性的操作遇到暂时失败时才应重试。InterruptedException 通常应继续传播；签名无法传播时，应完成清理并恢复线程的中断状态。'
    topics: [java/exceptions]
    level: advanced
    section: { en: 'Failure boundaries', zh: '失败边界' }
    frequency: occasional
    tags: [exception-translation, retry, interruption, security]

  - id: fundamentals-scope-and-definite-assignment
    question: { en: 'How do scope and definite assignment differ for a Java local variable?', zh: 'Java 局部变量的作用域与明确赋值有什么区别？' }
    answer:
      en: 'Scope says where a declared name can be referenced in source code. Definite assignment asks a separate control-flow question: has every path reaching this read already assigned the local? A variable can be in scope yet still be illegal to read. Fields and new array elements receive default values, but local variables do not. If one branch does not assign the local, that path must assign it later or leave before the read with return or throw. A final local adds the requirement that it be definitely unassigned before assignment.'
      zh: '作用域规定源码中的哪些位置可以引用已声明名称。明确赋值解决另一项控制流问题：每条到达读取点的路径是否都已经给局部变量赋值？变量可能已经在作用域内，却仍不能合法读取。字段和新数组元素有默认值，局部变量没有。如果某条分支没有赋值，它必须稍后赋值，或在读取前通过 return 或 throw 离开。final 局部变量还要求赋值前能够证明它尚未赋值。'
    topics: [java/fundamentals]
    level: beginner
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [scope, definite-assignment, locals]

  - id: fundamentals-short-circuit-operators
    question: { en: 'What is the practical difference between && and & on Boolean operands?', zh: '对布尔操作数而言，&& 与 & 的实际区别是什么？' }
    answer:
      en: 'Both can produce a Boolean conjunction, but && short-circuits: it evaluates the right operand only when the left operand is true. Boolean & always evaluates both operands. That difference controls side effects, exceptions, and safe guards such as value != null && value.isReady(). Java otherwise evaluates operands left to right. I use && for conditions and reserve & for deliberate non-short-circuit Boolean work or bitwise integer operations. Tests should make right-side execution visible, because identical truth tables can hide the behavioral difference.'
      zh: '两者都能产生布尔合取结果，但 && 会短路：只有左侧为 true 时才对右侧求值。布尔 & 总会对两侧求值。这个差异会影响副作用、异常，以及 value != null && value.isReady() 这样的安全防护。Java 在其他情况下按从左到右的顺序求值。我在条件中使用 &&，只在确实需要非短路布尔运算或整数位运算时使用 &。测试应让右侧是否执行变得可见，因为相同的真值表会掩盖行为差异。'
    topics: [java/fundamentals]
    level: beginner
    section: { en: 'Expressions', zh: '表达式' }
    frequency: common
    tags: [short-circuit, boolean, evaluation-order]

  - id: fundamentals-switch-expression
    question: { en: 'How does a modern Java switch expression differ from a traditional switch statement?', zh: '现代 Java switch 表达式与传统 switch 语句有什么区别？' }
    answer:
      en: 'A switch expression produces a value and must cover every selector value. An arrow rule does not fall through; it can provide an expression, a block, or throw. A block rule uses yield to provide the result. Traditional colon-labeled statement groups can fall through until break, which remains useful for compatible older code but is easy to change incorrectly. For enums or sealed hierarchies, the compiler may prove completeness without a source default. I still test binary evolution and null behavior at the API boundary rather than treating exhaustiveness as all-purpose validation.'
      zh: 'switch 表达式会产生值，并且必须覆盖选择器的所有值。箭头规则不会贯穿，可以提供表达式、块或 throw；块规则用 yield 产生结果。传统冒号语句组会一直贯穿到 break，这对兼容旧代码仍有用途，却很容易在修改时出错。对于枚举或密封层次，编译器可能在没有源码 default 的情况下证明完整性。我仍会在 API 边界测试二进制演化和 null 行为，而不会把完整性当成万能校验。'
    topics: [java/fundamentals]
    level: intermediate
    section: { en: 'Control flow', zh: '控制流' }
    frequency: common
    tags: [switch-expression, exhaustiveness, yield]

  - id: fundamentals-loop-boundaries
    question: { en: 'How do you review a Java loop for correctness and termination?', zh: '怎样审查 Java 循环的正确性与终止性？' }
    answer:
      en: 'I identify the initial state, the condition checked for each iteration, the update, and a measure that moves toward termination. For an array index, the usual invariant separates the processed half-open interval [0, index) from the unprocessed remainder, with index < length as the upper bound. I test empty and one-element inputs, the exact threshold, early break, and no-match behavior. I also inspect continue paths to ensure they do not skip a required update. Enhanced for is clearer when only element values are needed; explicit indexing is better when replacing slots.'
      zh: '我会找出初始状态、每轮检查的条件、更新步骤，以及一个持续朝终止边界推进的量。对于数组索引，常见不变量用半开区间 [0, index) 表示已处理部分，其余部分尚未处理，上界写成 index < length。我会测试空输入、单元素、正好位于阈值、提前 break 和始终不命中的情况，还会检查 continue 路径是否跳过了必要更新。只需要元素值时增强 for 更清楚；需要替换数组槽位时显式索引更合适。'
    topics: [java/fundamentals]
    level: intermediate
    section: { en: 'Control flow', zh: '控制流' }
    frequency: common
    tags: [loops, invariants, boundaries, termination]

  - id: java17-feature-provenance
    question: { en: 'Which language features are available at the Java 17 source level, and which one actually became final in Java 17?', zh: 'Java 17 源码级别可以使用哪些语言特性？其中哪一项是在 Java 17 转正的？' }
    answer:
      en: 'Stable Java 17 source can use switch expressions, text blocks, records, pattern matching for instanceof, and sealed classes. Their final releases were 14, 15, 16, 16, and 17 respectively, so only sealed classes became final in Java 17 itself. I keep that provenance separate from the project baseline because it prevents inaccurate minimum-version claims. I also compile with javac --release 17: running a newer JDK does not stop generated source from using Java 21 syntax such as final pattern switches or record patterns.'
      zh: '稳定的 Java 17 源码可以使用 switch 表达式、文本块、记录类、instanceof 模式匹配和密封类。它们分别在 Java 14、15、16、16 和 17 转正，因此只有密封类是在 Java 17 本身正式发布。我会把发布历史与项目基线分开记录，避免最低版本声明失真；同时用 javac --release 17 编译，因为仅仅运行新 JDK，并不能阻止生成代码混入 Java 21 的正式模式 switch 或记录模式。'
    topics: [java/java17-features]
    level: beginner
    section: { en: 'Language evolution', zh: '语言演进' }
    frequency: common
    tags: [java-17, source-level, release-history]

  - id: java17-record-immutability
    question: { en: 'Are Java records immutable, and what contract does a compact canonical constructor provide?', zh: 'Java 记录类是不可变的吗？紧凑规范构造器提供什么契约？' }
    answer:
      en: 'A record fixes its component fields as private and final and derives accessors plus value-oriented object methods, but that guarantee is shallow. A List, array, date-like object, or other mutable component can still change after construction. I use the canonical constructor to reject invalid values and establish ownership, often with List.copyOf or an array copy. A compact canonical constructor lets me validate or rebind parameters before the compiler assigns them to fields. I also review accessors, because returning a mutable component can expose internal state even when its field is final.'
      zh: '记录类把组件字段固定为 private final，并派生访问器和值语义对象方法，但这种保证是浅层的。List、数组、日期类对象或其他可变组件在构造后仍可能变化。我会在规范构造器中拒绝非法值并建立所有权，常用 List.copyOf 或数组副本。紧凑规范构造器允许先校验或重新绑定参数，再由编译器把参数赋给字段。我还会审查访问器，因为即使字段是 final，返回可变组件仍可能暴露内部状态。'
    topics: [java/java17-features]
    level: intermediate
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [records, immutability, constructors]

  - id: java17-sealed-hierarchy-rules
    question: { en: 'What does a sealed hierarchy guarantee in Java 17, and where does that guarantee stop?', zh: 'Java 17 的密封层次保证什么？这种保证到哪里为止？' }
    answer:
      en: 'A sealed class or interface controls its permitted direct subtypes. Each direct subtype must be final, sealed, or non-sealed, with records implicitly final. In a named module those subtypes must share the module; in an unnamed module they must share the package. The guarantee stops at a non-sealed branch, whose descendants are open again. That makes sealed types good for domain alternatives owned by one module, but usually wrong for cross-module plugin contracts. In stable Java 17 I consume the hierarchy with polymorphism or instanceof patterns, not a final type-pattern switch.'
      zh: '密封类或接口控制允许的直接子类型。每个直接子类型必须是 final、sealed 或 non-sealed，记录类隐式为 final。在命名模块中，这些类型必须属于同一模块；在未命名模块中则必须属于同一包。保证会在 non-sealed 分支停止，因为该分支的后代重新开放。因此，密封类型适合由一个模块拥有的领域备选项，通常不适合跨模块插件契约。稳定的 Java 17 应通过多态或 instanceof 模式消费该层次，而不是正式类型模式 switch。'
    topics: [java/java17-features]
    level: intermediate
    section: { en: 'Type design', zh: '类型设计' }
    frequency: common
    tags: [sealed-classes, inheritance, modules]

  - id: java17-switch-versus-pattern-switch
    question: { en: 'How do Java 17 switch expressions differ from pattern matching for instanceof and from pattern switches?', zh: 'Java 17 的 switch 表达式与 instanceof 模式匹配、模式 switch 有何区别？' }
    answer:
      en: 'A Java 17 switch expression is a stable construct that exhaustively produces a value; arrow rules do not fall through, and a block rule uses yield. Pattern matching for instanceof is also stable and binds a typed variable only where flow proves the match succeeded. Combining type patterns with switch was preview work in Java 17, not part of its stable language. The final pattern-switch syntax arrived later, in Java 21, and later examples may also use when guards or record patterns. For a Java 17 contract, I use enum switches and instanceof chains and enforce the boundary with --release 17.'
      zh: 'Java 17 的 switch 表达式是稳定构造，会完整地产生一个值；箭头规则不会贯穿，块规则用 yield 返回结果。instanceof 模式匹配也已稳定，只在控制流证明匹配成功的位置绑定带类型变量。把类型模式与 switch 结合在 Java 17 仍是预览工作，不属于稳定语言。正式的模式 switch 语法到 Java 21 才发布，新示例还可能使用 when 守卫或记录模式。面对 Java 17 契约，我会使用枚举 switch 和 instanceof 链，并用 --release 17 强制边界。'
    topics: [java/java17-features]
    level: intermediate
    section: { en: 'Control flow', zh: '控制流' }
    frequency: common
    tags: [switch-expression, pattern-matching, preview-features]

  - id: java21-stable-preview-boundary
    question: { en: 'Which major Java 21 application features are stable, and which release-note features must not be treated as stable Java 25 APIs?', zh: 'Java 21 的哪些主要应用特性是稳定的？发布说明中的哪些特性不能当作稳定 Java 25 API？' }
    answer:
      en: 'Virtual threads, record patterns, pattern matching for switch, and sequenced collections are final Java 21 features and require no preview flag. Structured Concurrency and String Templates were previews in Java 21. Structured Concurrency continued through a fifth preview in Java 25 and its API changed, while the later String Templates proposal was withdrawn and the syntax is absent from Java 25. I enforce a stable Java 21 contract with javac --release 21 and no --enable-preview, rather than inferring stability from a release-note list.'
      zh: '虚拟线程、记录模式、模式 switch 和有序集合都是 Java 21 正式特性，不需要预览开关。结构化并发与字符串模板在 Java 21 中只是预览。结构化并发到 Java 25 仍处于第五次预览，API 已经变化；字符串模板的后续提案则被撤回，Java 25 中不存在该语法。我会使用 javac --release 21 且不带 --enable-preview 来执行稳定 Java 21 契约，而不会从发布说明列表推断稳定性。'
    topics: [java/java21-features]
    level: beginner
    section: { en: 'Language evolution', zh: '语言演进' }
    frequency: common
    tags: [java-21, final-features, preview-features]

  - id: java21-virtual-thread-capacity
    question: { en: 'Why should virtual threads usually be created per task, and how do you limit a scarce downstream resource?', zh: '为什么虚拟线程通常应按任务创建？又该怎样限制稀缺的下游资源？' }
    answer:
      en: 'A virtual thread is a cheap representation of a blocking task, so a thread-per-task executor avoids sizing and queueing a worker pool. It does not create database connections, remote quota, file descriptors, heap, or CPU capacity. I let each independent blocking task have a virtual thread, then gate only the scarce operation with a semaphore, connection pool, or rate limiter sized from the resource contract. CPU-bound work remains limited by processor parallelism. I also test interruption, timeouts, cancellation, and ThreadLocal memory at realistic concurrency.'
      zh: '虚拟线程是阻塞任务的低成本表示，因此每任务线程执行器不需要设置工作线程池大小，也不会先把任务排入固定工作队列。它不会创造数据库连接、远端配额、文件描述符、堆内存或 CPU 容量。我让每个独立阻塞任务拥有一个虚拟线程，再根据资源契约，用信号量、连接池或速率限制器只约束稀缺操作。CPU 密集工作仍受处理器并行度限制。我还会在真实并发量下测试中断、超时、取消和 ThreadLocal 内存。'
    topics: [java/java21-features]
    level: intermediate
    section: { en: 'Concurrency', zh: '并发' }
    frequency: common
    tags: [virtual-threads, backpressure, resource-limits]

  - id: java21-pattern-switch-contract
    question: { en: 'What correctness guarantees and boundaries matter in a Java 21 pattern switch over records and sealed types?', zh: 'Java 21 对记录类和密封类型使用模式 switch 时，哪些正确性保证与边界最重要？' }
    answer:
      en: 'Record patterns test and deconstruct components, and a pattern switch selects the first applicable label. The compiler rejects a branch dominated by an earlier broader pattern and requires a switch expression to be exhaustive. For a sealed hierarchy I normally list every permitted branch and omit default so a newly added subtype fails at consumer recompilation. Null remains separate: case null handles it, otherwise the switch throws NullPointerException and default does not match it. Separate compilation still creates a binary-evolution boundary, so deployed old consumers need compatibility tests.'
      zh: '记录模式会检查并解构组件，模式 switch 则选择源码顺序中第一个适用标签。编译器会拒绝被前方宽泛模式支配的分支，并要求 switch 表达式穷尽。对密封层次，我通常列出全部允许分支并省略 default，让新增子类型在消费者重新编译时失败。null 需要单独处理：case null 会接住它，否则 switch 抛出 NullPointerException，default 不会匹配 null。分离编译仍存在二进制演进边界，因此已部署的旧消费者需要兼容性测试。'
    topics: [java/java21-features]
    level: intermediate
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [record-patterns, pattern-switch, exhaustiveness, 'null']

  - id: java21-sequenced-view-contract
    question: { en: 'What contract does a Java 21 sequenced collection provide, and why is reversed() often misunderstood?', zh: 'Java 21 有序集合提供什么契约？为什么 reversed() 经常被误解？' }
    answer:
      en: 'A sequenced collection has a defined encounter order and uniform first, last, and reverse-order operations. The concrete collection still decides which mutations it supports, so addFirst can throw on an unmodifiable or structurally constrained implementation. reversed() returns a backed view rather than a snapshot: changes to the original are visible through the view, and supported view mutations write through. I name it reverseView, document ownership, and copy explicitly when a caller needs an independent snapshot. Copying the container still does not deep-copy mutable elements.'
      zh: '有序集合具有确定的遇见顺序，并提供统一的首元素、尾元素和反向顺序操作。具体集合仍决定支持哪些修改，因此不可修改或结构受限的实现可能让 addFirst 抛出异常。reversed() 返回由原集合支持的视图，而不是快照：原集合的变化会出现在视图中，允许的视图修改也会写回。我会把变量命名为 reverseView，说明所有权，并在调用方需要独立快照时显式复制。复制容器仍不会深拷贝可变元素。'
    topics: [java/java21-features]
    level: intermediate
    section: { en: 'Collections', zh: '集合' }
    frequency: occasional
    tags: [sequenced-collections, views, mutability]

  - id: records-state-contract
    question: { en: 'What contract does a Java record header define?', zh: 'Java 记录类的头部定义了什么契约？' }
    answer:
      en: 'A record header declares the complete component state of a transparent data carrier. For each component, the compiler provides a private final field and a public same-named accessor. It also derives the canonical constructor, equals, hashCode, and toString from the component list. The record class is implicitly final and directly extends java.lang.Record, though it can implement interfaces and add behavior. Component names, types, and order are public API because callers, reflection, construction, object methods, and record patterns all observe that shape.'
      zh: '记录类头部声明透明数据载体的完整组件状态。编译器为每个组件提供 private final 字段和同名 public 访问器，并根据组件列表派生规范构造器、equals、hashCode 与 toString。记录类隐式为 final，直接继承 java.lang.Record，但可以实现接口并添加行为。组件的名称、类型与顺序都是公开 API，因为调用方、反射、构造过程、对象方法和记录模式都会观察这个数据形状。'
    topics: [java/records]
    level: beginner
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [records, components, api-contract]

  - id: records-constructor-ownership
    question: { en: 'How should a record canonical constructor establish invariants and ownership?', zh: '记录类的规范构造器应如何建立不变量与所有权？' }
    answer:
      en: 'I use the canonical constructor as the one path that validates every component and takes ownership of mutable inputs. A compact constructor omits the parameter list, lets me validate or rebind implicit component parameters, and relies on compiler assignments after its body. I normalize values there rather than in accessors, preserving the copy invariant. Lists usually become List.copyOf results; arrays require explicit copies, often at both construction and access. An auxiliary constructor must delegate with this so it cannot bypass the canonical path. Element mutability still needs a separate policy.'
      zh: '我把规范构造器作为校验全部组件并取得可变输入所有权的唯一入口。紧凑构造器省略参数列表，可以校验或重新绑定隐式组件参数，再由编译器在构造器体结束后赋给字段。我会在这里规范化，而不是在访问器中转换，以保持复制不变量。列表通常转换为 List.copyOf 的结果；数组需要显式复制，往往构造和访问两端都要复制。额外构造器必须通过 this 委托，不能绕过规范路径。元素本身的可变性仍需单独制定策略。'
    topics: [java/records]
    level: intermediate
    section: { en: 'Object design', zh: '对象设计' }
    frequency: common
    tags: [canonical-constructor, invariants, ownership]

  - id: records-equality-array-components
    question: { en: 'Why are mutable and array components dangerous in record equality and hashing?', zh: '为什么可变组件与数组组件会威胁记录类的相等性和哈希？' }
    answer:
      en: 'Derived equality and hashing use every component field. A mutable list or map can change after construction, changing the record hash and breaking lookup when the record is stored as a HashMap key. Final only fixes the field reference; it does not freeze the referenced object. Arrays add another trap because their inherited equals and hashCode are identity based, not content based. I prefer immutable value components, make defensive copies, and use an unmodifiable List for logical sequences. If an array is unavoidable, I design equals and hashCode together and test their contract.'
      zh: '派生的相等性与哈希会使用每个组件字段。可变列表或映射在构造后仍可能变化，从而改变记录哈希；记录作为 HashMap 键时，查找可能因此失效。final 只固定字段引用，不会冻结引用对象。数组还有另一层陷阱：继承的 equals 与 hashCode 按身份而非内容工作。我会优先选择不可变值组件，执行防御性复制，并用不可修改 List 表示逻辑序列。无法避免数组时，则成对设计 equals 与 hashCode，并测试其契约。'
    topics: [java/records]
    level: intermediate
    section: { en: 'Object design', zh: '对象设计' }
    frequency: common
    tags: [records, equality, hashing, arrays]

  - id: records-pattern-runtime-boundaries
    question: { en: 'What should you verify when using record patterns with a sealed hierarchy?', zh: '在密封层次中使用记录模式时应验证哪些边界？' }
    answer:
      en: 'A record pattern checks the record type and invokes component accessors to feed nested patterns. Null matches no record pattern, so a pattern switch needs case null or an explicit non-null boundary. Branch order matters because an earlier broad pattern can dominate a later one. With a sealed hierarchy, listing every permitted subtype lets the compiler check exhaustiveness when the consumer is recompiled; a broad default can hide omissions. I also compile with the promised --release because record patterns became final in Java 21, and I test separately deployed binaries for hierarchy evolution.'
      zh: '记录模式会检查记录类型，并调用组件访问器，把结果交给嵌套模式。null 不匹配任何记录模式，因此模式 switch 需要 case null 或明确的非空边界。分支顺序很重要，因为前面的宽泛模式可能支配后续模式。对于密封层次，列出全部允许子类型，可以让编译器在重新编译消费者时检查穷尽性；宽泛 default 反而会掩盖遗漏。我还会按承诺的 --release 编译，因为记录模式到 Java 21 才正式发布，并为分开部署的二进制测试层次演进。'
    topics: [java/records]
    level: advanced
    section: { en: 'Pattern matching', zh: '模式匹配' }
    frequency: occasional
    tags: [record-patterns, sealed-classes, exhaustiveness]
