track: data
items:
  - id: sql-window-versus-group-by
    question: { en: 'How does a window aggregate differ from GROUP BY?', zh: '窗口聚合与 GROUP BY 有什么区别？' }
    answer:
      en: 'GROUP BY changes the result grain: it combines each group into one output row unless another operation expands it later. A window aggregate keeps the input grain and attaches a value calculated over a partition to every row. That makes windows suitable for percentages of a group, running totals, and comparisons with nearby rows. You must still define partitioning, window order, and often the frame. The window order controls calculation but not final display order, so the outer query needs its own ORDER BY when presentation must be deterministic.'
      zh: 'GROUP BY 会改变结果粒度：每个分组通常合并成一条输出行，除非后续操作再次展开。窗口聚合保留输入粒度，并为每条行附加一个基于分区计算的值，因此适合组内占比、累计值和相邻行比较。使用时仍需明确分区、窗口顺序，通常还要写出框架。窗口顺序只控制计算，不保证最终展示顺序；展示必须稳定时，外层查询还需要自己的 ORDER BY。'
    topics: [data/sql-advanced]
    level: intermediate
    section: { en: 'Analytical SQL', zh: '分析型 SQL' }
    frequency: common
    tags: [window-functions, group-by, result-grain]

  - id: sql-rows-range-peer-groups
    question: { en: 'Why can ROWS and RANGE produce different running totals?', zh: '为什么 ROWS 与 RANGE 会产生不同的累计值？' }
    answer:
      en: 'ROWS moves a frame boundary by positions in the ordered row sequence. RANGE derives the boundary from ordering values and normally treats equal ordering values as peers. With two rows sharing the current timestamp or amount, a default RANGE frame can include both in each row’s total, while an equivalent-looking ROWS frame grows one physical row at a time. Exact RANGE syntax and interval support vary by database. I write the frame explicitly, add duplicate values at its boundary, and verify the behavior on the production dialect instead of relying on a default.'
      zh: 'ROWS 按排序后行序列中的位置移动框架边界；RANGE 根据排序值确定边界，通常会把排序值相等的行视为同值行。两条记录具有相同时间或金额时，默认 RANGE 框架可能让两行的累计值都包含彼此，而看似相同的 ROWS 框架会按物理行逐条增长。各数据库的 RANGE 语法与时间间隔支持不同。我会显式写出框架，在边界放入重复值，并在生产方言上验证结果。'
    topics: [data/sql-advanced]
    level: advanced
    section: { en: 'Analytical SQL', zh: '分析型 SQL' }
    frequency: common
    tags: [window-frame, range, peer-rows]

  - id: sql-recursive-cte-safety
    question: { en: 'How do you make a recursive CTE safe on hierarchical data?', zh: '怎样让处理层次数据的递归 CTE 更安全？' }
    answer:
      en: 'Start by stating the anchor set and the one-step relationship separately. Then prove what moves each recursive round toward termination. Tree-shaped data may still be dirty, so carry a visited identifier set or delimited path and define what happens when a node repeats. Keep a depth, row, or statement-time limit as resource protection, not as the proof of correctness. In multitenant systems, tenant and authorization predicates belong in both the anchor and recursive member. Finally, test cycles, multiple parents, orphan nodes, an empty anchor, and the maximum legitimate depth.'
      zh: '先分别定义锚集合与一步可达关系，再证明每一轮递归如何向终止状态推进。即使数据按树设计，也可能存在脏数据，因此要携带已访问标识集合或带分隔符的路径，并定义节点重复时如何处理。深度、行数或语句超时上限只是资源保护，不能充当正确性证明。多租户系统还必须在锚成员与递归成员中都保留租户和权限条件。最后测试环、多个父节点、孤儿节点、空锚集合与最大合法深度。'
    topics: [data/sql-advanced]
    level: advanced
    section: { en: 'Recursive queries', zh: '递归查询' }
    frequency: occasional
    tags: [recursive-cte, termination, cycle-detection]

  - id: sql-not-exists-versus-not-in
    question: { en: 'When is NOT EXISTS safer than NOT IN?', zh: '什么情况下 NOT EXISTS 比 NOT IN 更安全？' }
    answer:
      en: 'NOT EXISTS is safer for exclusion when the subquery column can contain NULL. NOT IN compares the outer value with every value on the right under SQL three-valued logic. If no value matches but one is NULL, the condition can be UNKNOWN, and WHERE removes the row. A correlated NOT EXISTS asks only whether an equality match exists, so an unrelated null does not poison the result. I still define how a null outer key should behave, test empty and duplicate right-hand sets, and inspect the target plan rather than assuming one spelling is always faster.'
      zh: '用于排除时，如果子查询列可能包含 NULL，NOT EXISTS 更安全。NOT IN 按 SQL 三值逻辑把外层值与右侧每个值比较；没有相等项但存在 NULL 时，条件可能得到 UNKNOWN，WHERE 会删除该行。相关 NOT EXISTS 只检查等值匹配是否存在，因此无关的空值不会污染结果。我仍会定义外层键为空时的行为，测试空集合与重复值，并查看目标数据库计划，而不是假定某种写法永远更快。'
    topics: [data/sql-advanced]
    level: intermediate
    section: { en: 'Query semantics', zh: '查询语义' }
    frequency: common
    tags: [not-exists, not-in, 'null']
