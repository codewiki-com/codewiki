track: architecture
items:
  - id: cap-partition-tradeoff
    question:
      en: What does the CAP theorem actually make a distributed system choose?
      zh: CAP 定理究竟迫使分布式系统选择什么？
    answer:
      en: CAP applies when replicas that share mutable state cannot communicate. If both sides must complete operations, either side can accept an update that the other cannot observe, so the history may stop being linearizable. Preserving linearizability instead requires at least one side to reject or indefinitely delay some valid operations, giving up CAP availability there. Partition tolerance is best treated as the fault model, not a benefit selected from a menu. The useful design question is therefore which operations and invariants choose consistency or availability during that partition.
      zh: CAP 适用于保存同一份可变状态、却无法通信的副本。如果两侧都必须完成操作，其中一侧可能接受另一侧看不到的更新，操作历史便可能失去线性一致性。若要保持线性一致，至少一侧必须拒绝或无限期延迟某些有效操作，从而在该侧放弃 CAP 可用性。分区容错更适合作为故障模型，而不是菜单中的一项收益。因此，真正的设计问题是：分区期间，哪些操作与不变量选择一致性，哪些选择可用性。
    topics: [architecture/cap-theorem]
    level: intermediate
    section: { en: Distributed systems, zh: 分布式系统 }
    frequency: common
    tags: [cap, partitions, linearizability]

  - id: cap-product-labels
    question:
      en: Why is labeling a whole database CP or AP often misleading?
      zh: 为什么给整个数据库贴上 CP 或 AP 标签往往会误导？
    answer:
      en: A database can expose several read modes, write acknowledgment levels, transaction scopes, and replication paths. A linearizable metadata API and a stale follower read may coexist in the same product, while cross-region replication follows another policy. Configuration and membership also change behavior during faults. A useful answer names the operation, consistency boundary, topology, timeout, and version being discussed, then describes an allowed operation history. Product labels can start a conversation, but they cannot predict whether the client's actual request completes or returns current data during a partition.
      zh: 数据库可能同时提供多种读取模式、写确认级别、事务范围和复制路径。同一产品中，线性一致的元数据 API 可以与陈旧的从副本读取并存，跨区域复制还可能采用另一套策略。配置和成员关系也会改变故障期间的行为。更有用的回答应明确操作、一致性边界、拓扑、超时和具体版本，再描述允许出现的操作历史。产品标签可以开启讨论，却无法预测客户端的真实请求在分区时是否完成、是否读到当前数据。
    topics: [architecture/cap-theorem]
    level: intermediate
    section: { en: Distributed systems, zh: 分布式系统 }
    frequency: common
    tags: [cap, consistency-models, system-design]

  - id: quorum-not-proof
    question:
      en: Why does W + R > N not prove that a replicated store is linearizable?
      zh: 为什么 W + R > N 不能证明复制存储具备线性一致性？
    answer:
      en: The inequality proves only that every read quorum intersects every write quorum. It does not say which value an intersection node should trust, whether a failed write partially committed, how concurrent writers are ordered, or whether an old leader may still answer. The protocol also needs terms or comparable versions, a commit rule, safe membership changes, and a read path that participates in those rules. Caches and follower reads outside that boundary can still violate end-to-end linearizability even when the quorum arithmetic is correct.
      zh: 这个不等式只证明任意读法定人数与任意写法定人数存在交集。它没有说明交集节点应相信哪个值、失败写入是否部分提交、并发写入如何排序，也没有阻止旧主节点继续响应。协议还需要任期或可比较版本、提交规则、安全的成员变更，以及真正参与这些规则的读取路径。即使法定人数算术正确，边界之外的缓存和从副本读取仍可能破坏端到端线性一致性。
    topics: [architecture/cap-theorem]
    level: advanced
    section: { en: Distributed systems, zh: 分布式系统 }
    frequency: occasional
    tags: [quorum, linearizability, consensus]

  - id: cap-recovery-design
    question:
      en: What must an AP-style path do when a partition heals?
      zh: AP 风格的路径在分区恢复后必须做什么？
    answer:
      en: It must exchange enough version or operation history to detect concurrent updates, apply a deterministic merge or escalate an unresolved conflict, and make every replica converge. That solves only state. The system must separately restore business invariants and compensate for effects already exposed, such as duplicate charges or conflicting confirmations. Merge operations should be tested for commutativity, associativity, and idempotence, while external commands need stable idempotency keys or deduplication records. Recovery is part of the data protocol, not merely an operational step after connectivity returns.
      zh: 系统必须交换足够的版本或操作历史，以检测并发更新，执行确定性合并，或升级无法自动解决的冲突，并让所有副本收敛。但这只解决状态问题。系统还要单独恢复业务不变量，并补偿已经外显的效果，例如重复扣款或冲突确认。合并操作应验证交换律、结合律和幂等性；外部命令则需要稳定的幂等键或去重记录。恢复属于数据协议本身，不只是网络连通后的一项运维步骤。
    topics: [architecture/cap-theorem]
    level: advanced
    section: { en: Distributed systems, zh: 分布式系统 }
    frequency: occasional
    tags: [eventual-consistency, recovery, idempotency]

  - id: adr-recording-threshold
    question:
      en: Which decisions deserve an architecture decision record?
      zh: 哪些决定值得写成架构决策记录？
    answer:
      en: >-
        Write an ADR when a decision materially affects system structure, a quality attribute, a dependency or interface boundary, or the way several teams work. Costly reversal and several credible options are also strong signals. Do not record every implementation detail. A local naming choice or an easy refactor belongs in code review, while a temporary workaround belongs in a ticket or runbook. The useful threshold is whether a future maintainer will need the original context and trade-off to change the system safely.
      zh: >-
        当一个决定会实质影响系统结构、质量属性、依赖或接口边界，或者改变多个团队的协作方式时，应写 ADR。回滚成本高、存在多个可信选项，也是很强的信号。不要记录每个实现细节：局部命名和容易撤销的重构属于代码审查，临时变通属于工单或运行手册。真正的判断标准是，未来维护者是否需要知道当时的背景与取舍，才能安全地修改系统。
    topics: [architecture/adr]
    level: beginner
    section: { en: Architecture practice, zh: 架构实践 }
    frequency: common
    tags: [adr, decision-threshold, documentation]

  - id: adr-separate-record-sections
    question:
      en: How do context, decision, and consequences differ in an ADR?
      zh: ADR 中的背景、决策与后果有什么区别？
    answer:
      en: >-
        Context contains facts and constraints that exist before the choice: current boundaries, business needs, quality targets, and known unknowns. The decision is the team's explicit response, written so an implementer can act on it. Consequences predict the environment after adoption, including benefits, costs, risks, and follow-up work. Keeping these categories separate exposes hindsight. If a proposed ADR states a future benefit as an existing fact, or hides a design choice inside context, reviewers cannot tell what evidence supports the choice or later test whether it worked.
      zh: >-
        背景记录选择之前已经存在的事实与约束，包括当前边界、业务需求、质量目标和已知未知项。决策是团队对此作出的明确回应，写法应足以指导实施。后果预测采用方案后的环境，包括收益、成本、风险与跟进工作。把三者分开可以暴露事后偏见：如果提案把未来收益写成既有事实，或把设计选择藏进背景，评审者就无法判断证据是否支持选择，也无法在以后验证它是否有效。
    topics: [architecture/adr]
    level: intermediate
    section: { en: Architecture practice, zh: 架构实践 }
    frequency: common
    tags: [adr, context, consequences]

  - id: adr-supersede-history
    question:
      en: How should a team change an accepted ADR when its context no longer holds?
      zh: 已接受 ADR 的背景不再成立时，团队应如何修改决定？
    answer:
      en: >-
        Preserve the accepted ADR and create a proposed replacement. The new record should identify the changed fact, compare the new options with the status quo, and state which parts of the old rationale still hold. Once the replacement is accepted, mark the old record as superseded and add links in both directions. Do not delete the old file or rewrite its rationale to fit current production. Old commits and components were built under that decision, so its original text remains evidence needed to understand them and the cost of the transition.
      zh: >-
        应保留已接受的 ADR，并创建一份替代提案。新记录要指出发生变化的事实，把新选项与维持现状进行比较，并说明旧理由中哪些仍然成立。替代提案被接受后，把旧记录标为已取代，并添加双向链接。不要删除旧文件，也不要重写旧理由来迎合当前生产状态。旧提交和组件是在那个决定下产生的，原文仍是理解它们与迁移成本所需的证据。
    topics: [architecture/adr]
    level: intermediate
    section: { en: Architecture practice, zh: 架构实践 }
    frequency: common
    tags: [adr, lifecycle, supersession]

  - id: adr-review-ai-draft
    question:
      en: What must you verify before accepting an AI-drafted ADR?
      zh: 接受 AI 起草的 ADR 前必须核对什么？
    answer:
      en: >-
        Treat every name, date, metric, organizational constraint, and claim about prior discussion as untrusted until it has repository or stakeholder evidence. Separate facts from assumptions and predictions. Check that the alternatives were genuinely available at decision time and that negative consequences have not been softened or omitted. Confirm that status reflects real agreement; a model cannot accept a decision for the team. Finally, compare the draft with active ADRs and code, but never let the model silently rewrite an accepted record to make a new implementation appear compliant.
      zh: >-
        在找到仓库证据或相关人员确认前，应把每个人名、日期、指标、组织约束和历史讨论说法都视为不可信。要区分事实、假设与预测，确认备选方案在决策时确实可行，而且负面后果没有被弱化或省略。状态必须反映真实共识，模型不能替团队接受决定。最后，把草稿与当前 ADR 和代码逐项对照，但绝不能让模型悄悄重写已接受记录，从而让新实现看起来符合旧决定。
    topics: [architecture/adr]
    level: advanced
    section: { en: Architecture practice, zh: 架构实践 }
    frequency: occasional
    tags: [adr, ai-review, evidence]

  - id: fundamentals-architecture-decision
    question:
      en: What makes a decision architectural rather than an ordinary implementation detail?
      zh: 什么使一项决定成为架构决定，而不只是普通实现细节？
    answer:
      en: >-
        A decision is architectural when it constrains many later choices or is expensive to reverse across module, data, deployment, or team boundaries. The technology involved does not decide this by itself. A local library can become architectural if every team must depend on its public model, while a cloud setting may remain a routine implementation choice if it is isolated and reversible. I would name the affected quality attribute, ownership or failure boundary, reversal cost, and people who must coordinate. That scope determines how much evidence, review, and documentation the decision deserves.
      zh: >-
        一项决定如果会约束许多后续选择，或者撤销时必须跨越模块、数据、部署或团队边界，就具有架构影响。是否使用某种技术并不能单独决定这一点。一个本地库若让所有团队依赖其公开模型，也可能成为架构；一个隔离良好、容易撤销的云配置则可能只是日常实现。我会说明受影响的质量属性、所有权或故障边界、撤销成本，以及必须协调的人员，再据此决定需要多少证据、评审和文档。
    topics: [architecture/getting-started]
    level: beginner
    section: { en: Architecture fundamentals, zh: 架构基础 }
    frequency: common
    tags: [architecture-decisions, scope, reversibility]

  - id: fundamentals-quality-scenario
    question:
      en: How do you turn a vague quality goal into an architecture scenario?
      zh: 怎样把模糊的质量目标改写为架构场景？
    answer:
      en: >-
        I replace an adjective such as scalable or resilient with a stimulus and an observable response. I name the source, event, operating environment, affected part of the system, expected behavior, and response measure. For a payment timeout, the scenario might require a queryable pending state and reuse of one idempotency key rather than claiming generic availability. Performance scenarios also need workload, data size, environment, and statistic before a number means anything. This form constrains design choices and tells the team what to test without pretending that an unmeasured target has already been achieved.
      zh: >-
        我会把“可扩展”或“有韧性”这样的形容词换成刺激和可观察响应，并写出来源、事件、运行环境、受影响对象、预期行为与判定方式。支付超时时，场景可以要求返回可查询的处理中状态，并复用同一个幂等键，而不是泛泛声称系统高可用。性能场景还必须说明负载、数据规模、环境和统计口径，数字才有意义。这样的表述既能约束设计选择，也能告诉团队该测试什么，同时不会假装尚未测量的目标已经实现。
    topics: [architecture/getting-started]
    level: intermediate
    section: { en: Architecture fundamentals, zh: 架构基础 }
    frequency: common
    tags: [quality-attributes, scenarios, verification]

  - id: fundamentals-boundary-choice
    question:
      en: When should a module boundary become a service boundary?
      zh: 什么时候应该把模块边界升级为服务边界？
    answer:
      en: >-
        I keep a boundary in-process unless independent deployment, failure isolation, scaling, data permissions, or team ownership justifies the network and operating cost. A service adds timeouts, partial failure, versioning, observability, security, and data-consistency work; “decoupling” alone does not pay for that. I inspect which code and releases actually change together and whether one team can own the new failure model end to end. If both sides still coordinate every schema change or need one transaction over shared data, a network split moves the coupling instead of removing it.
      zh: >-
        除非独立部署、故障隔离、扩缩容、数据权限或团队所有权足以证明网络与运维成本合理，否则我会保留进程内边界。服务会新增超时、部分失败、版本、可观测性、安全和数据一致性工作，“解耦”本身不足以支付这些成本。我会检查哪些代码和发布实际总是一起变化，以及一个团队能否端到端负责新的故障模型。若双方仍要协调每次模式变更，或必须在共享数据上使用同一事务，网络拆分只会转移耦合，而不会消除它。
    topics: [architecture/getting-started]
    level: intermediate
    section: { en: Architecture fundamentals, zh: 架构基础 }
    frequency: common
    tags: [architecture-boundaries, services, trade-offs]

  - id: fundamentals-evidence-and-drift
    question:
      en: How do you keep architecture from drifting away from its decisions?
      zh: 怎样防止实现逐渐偏离架构决定？
    answer:
      en: >-
        I turn stable decisions into small fitness functions near the evidence they inspect. Import rules protect dependency direction, contract tests protect interfaces, policy checks protect permissions, and failure exercises or telemetry protect runtime behavior. Each check needs an owner and actionable failure output. I also date diagrams and link them to ADRs so current structure is not confused with rationale. When evidence changes, I separate implementation drift from a stale decision: fix code in the first case, and create a superseding ADR plus migration plan in the second. Rewriting history hides both causes.
      zh: >-
        我会把稳定决定变成靠近证据的小型适应度函数：导入规则保护依赖方向，契约测试保护接口，策略检查保护权限，故障演练或遥测保护运行行为。每项检查都要有负责人，并在失败时给出可行动信息。我还会给图标注日期并链接 ADR，避免把当前结构与历史理由混为一谈。证据变化时，要区分实现漂移与决定过时：前者修复代码，后者创建取代旧决定的新 ADR 和迁移计划。改写历史会把两种原因都隐藏起来。
    topics: [architecture/getting-started]
    level: advanced
    section: { en: Architecture fundamentals, zh: 架构基础 }
    frequency: occasional
    tags: [fitness-functions, drift, adr]

  - id: solid-change-boundaries
    question:
      en: How do the five SOLID principles work together around one design boundary?
      zh: 五条 SOLID 原则怎样共同作用于一个设计边界？
    answer:
      en: >-
        I start with SRP to identify which actor owns a change and which behavior should move together. OCP gives proven variation an extension point, while ISP shapes that point around the consumer's actual role. LSP then makes every implementation preserve the same accepted inputs, results, invariants, and failure semantics. DIP points source dependencies from technical adapters toward the high-level contract, with a composition root connecting them. The principles reinforce one another, but none requires extra classes by itself. If there is no independent variation, substitute, or dependency risk, a direct implementation may still be the clearest design.
      zh: >-
        我先用 SRP 找出哪个参与者拥有某类变化，以及哪些行为应该一起移动。OCP 为已经证实的变化提供扩展点，ISP 再按照消费者的真实角色塑造这个接口。LSP 要求每个实现保持相同的有效输入、结果、不变量与失败语义。DIP 则让源码依赖从技术适配器指向高层契约，并由组合根连接双方。这些原则会相互加强，但没有一条单独要求增加类。如果不存在独立变化、替代实现或依赖风险，直接实现仍可能是最清楚的设计。
    topics: [architecture/solid-principles]
    level: intermediate
    section: { en: Design principles, zh: 设计原则 }
    frequency: common
    tags: [solid, design-boundaries, change]

  - id: solid-srp-vs-isp
    question:
      en: What is the difference between SRP and ISP?
      zh: SRP 与 ISP 有什么区别？
    answer:
      en: >-
        SRP asks why a module changes and which actor requests that change. It groups behavior that follows one policy or ownership source. ISP asks what a particular client must know, and removes operations that client does not use from its interface. A module can have one responsibility yet expose a broad interface that burdens small clients, so it can satisfy SRP while violating ISP. The reverse is also possible: several narrow interfaces may all be implemented by one class that mixes finance, marketing, and persistence changes. I use co-change and ownership evidence for SRP, then client call patterns and contract needs for ISP.
      zh: >-
        SRP 追问模块为什么变化，以及哪个参与者提出这种变化；它把遵循同一政策或所有权来源的行为放在一起。ISP 追问某个客户端必须知道什么，并从其接口中去掉不用的操作。一个模块可能只有一种职责，却暴露让小型客户端负担沉重的大接口，因此满足 SRP 仍可能违反 ISP。反过来也一样：多个窄接口可能都由一个混合财务、营销与持久化变化的类实现。我用共同变化和所有权证据判断 SRP，再用客户端调用方式与契约需求判断 ISP。
    topics: [architecture/solid-principles]
    level: intermediate
    section: { en: Design principles, zh: 设计原则 }
    frequency: common
    tags: [srp, isp, interfaces]

  - id: solid-lsp-contract
    question:
      en: Why is matching a base type's method signatures insufficient for LSP?
      zh: 为什么方法签名与基类型一致，仍不足以满足 LSP？
    answer:
      en: >-
        A signature describes shape, not the full behavior a caller relies on. A substitute can compile while rejecting an input the base contract accepts, returning a value outside its promised range, breaking a state invariant, or throwing a new error after a side effect. Those are stronger preconditions or weaker postconditions, so callers must add subtype-specific branches and substitution fails. I write a shared contract suite through the base interface, covering boundary inputs, state transitions, and failures, then run it against every implementation. Implementation-specific tests add detail but cannot replace that common evidence.
      zh: >-
        签名只描述形状，不包含调用者依赖的全部行为。一个替代实现可以通过编译，却拒绝基础契约接受的输入、返回承诺范围之外的值、破坏状态不变量，或者在产生副作用后抛出新的错误。这些情况加强了前置条件或削弱了后置条件，迫使调用者增加子类型专用分支，替换因此失败。我会通过基础接口编写共享契约测试，覆盖边界输入、状态转换与失败，并对每个实现运行。实现专属测试可以补充细节，却不能取代这组共同证据。
    topics: [architecture/solid-principles]
    level: intermediate
    section: { en: Design principles, zh: 设计原则 }
    frequency: common
    tags: [lsp, behavioral-contracts, testing]

  - id: solid-dip-vs-di
    question:
      en: How does the Dependency Inversion Principle differ from dependency injection?
      zh: 依赖倒置原则与依赖注入有什么区别？
    answer:
      en: >-
        DIP is a design rule about source-code knowledge: high-level policy should own the abstraction it needs, and low-level adapters should depend on that contract. Dependency injection is only a construction technique for passing an object into another object. Injection helps, but it can still supply a vendor-shaped interface directly to business code, leaving dependency direction unchanged. I verify DIP by inspecting imports, contract vocabulary, and ownership, not by looking for a container. A composition root may know both the business port and its concrete adapter; the business module should know only its own port and domain-level failure semantics.
      zh: >-
        DIP 是关于源码知识方向的设计规则：高层策略应拥有自己需要的抽象，低层适配器依赖该契约。依赖注入只是把一个对象传给另一个对象的构造技术。注入虽然有帮助，却仍可能把供应商形状的接口直接交给业务代码，使依赖方向完全不变。我会检查导入、契约词汇和所有权来验证 DIP，而不是只寻找容器。组合根可以同时知道业务端口与具体适配器；业务模块则只应知道自己的端口，以及领域层面的失败语义。
    topics: [architecture/solid-principles]
    level: advanced
    section: { en: Design principles, zh: 设计原则 }
    frequency: occasional
    tags: [dip, dependency-injection, composition-root]
