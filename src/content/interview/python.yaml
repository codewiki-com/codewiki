track: python
items:
  - id: asyncio-coroutine-versus-task
    question: { en: 'What is the difference between a coroutine object and an asyncio Task?', zh: '协程对象与 asyncio Task 有什么区别？' }
    answer:
      en: 'Calling an async def function creates a coroutine object but does not independently schedule its body. Awaiting that object drives it as part of the current task. A Task wraps a coroutine, schedules it on the running event loop, and records its result, exception, or cancellation state. Creating a task is therefore an ownership decision, not just syntax for await. The caller must retain and eventually await it, or place it in a TaskGroup that provides a clear lifetime and failure boundary.'
      zh: '调用 async def 函数会创建协程对象，但不会独立调度函数体。await 该对象时，它作为当前任务的一部分被驱动。Task 会包装协程，把它安排到正在运行的事件循环，并记录结果、异常或取消状态。因此，创建任务是一项所有权决定，不只是 await 的另一种写法。调用方必须保留并最终等待任务，或把它放进 TaskGroup，由任务组提供清晰的生命周期和失败边界。'
    topics: [python/asyncio]
    level: beginner
    section: { en: 'Async execution', zh: '异步执行' }
    frequency: common
    tags: [asyncio, coroutine, task]

  - id: asyncio-taskgroup-versus-gather
    question: { en: 'When would you choose TaskGroup over asyncio.gather()?', zh: '什么情况下应选择 TaskGroup，而不是 asyncio.gather()？' }
    answer:
      en: 'Choose TaskGroup when several child tasks form one operation and a child failure makes the remaining work pointless. The group cancels unfinished siblings, waits for their cleanup, and raises remaining failures as an exception group when its context exits. gather is useful when result order must match input order or when operations are genuinely independent, but its default first-exception behavior does not cancel the other awaitables. With either API, decide explicitly whether failures are fail-fast, collected as data, or allowed to outlive the caller.'
      zh: '当多个子任务共同构成一项操作，而且任一子任务失败后其余工作都失去意义时，应选择 TaskGroup。任务组会取消未完成的兄弟任务，等待它们清理，并在退出上下文时以异常组抛出仍需报告的失败。需要让结果顺序匹配输入顺序，或各项操作确实相互独立时，gather 很有用，但它默认传播首个异常时不会取消其他 awaitable。无论使用哪个 API，都应明确决定失败是快速传播、作为数据收集，还是允许工作比调用方存活更久。'
    topics: [python/asyncio]
    level: intermediate
    section: { en: 'Structured concurrency', zh: '结构化并发' }
    frequency: common
    tags: [taskgroup, gather, exceptions]

  - id: asyncio-cancellation-cleanup
    question: { en: 'How should an asyncio coroutine respond to cancellation?', zh: 'asyncio 协程应如何响应取消？' }
    answer:
      en: 'Cancellation is delivered cooperatively, usually as CancelledError at the next suspension opportunity. A coroutine should put resource release and invariant restoration in finally blocks or async context managers, then normally let the cancellation propagate. Swallowing it can break TaskGroup and timeout behavior and leave the owner believing work has stopped when it has not. CancelledError derives directly from BaseException, so except Exception does not catch it. Explicit suppression is rare and must also account for the task cancellation state, typically with uncancel().'
      zh: '取消通过协作方式传递，通常会在下一次可暂停机会抛出 CancelledError。协程应把资源释放和不变量恢复放进 finally 块或异步上下文管理器，然后通常让取消继续传播。吞掉取消会破坏 TaskGroup 和超时语义，还可能让所有者误以为工作已经停止。CancelledError 直接继承 BaseException，因此 except Exception 不会捕获它。显式抑制取消很少合理，而且还必须处理任务的取消状态，通常需要调用 uncancel()。'
    topics: [python/asyncio]
    level: advanced
    section: { en: 'Cancellation and deadlines', zh: '取消与截止时间' }
    frequency: common
    tags: [cancellation, cleanup, timeout]

  - id: asyncio-bounded-concurrency
    question: { en: 'How do you prevent an asyncio program from creating too much concurrent work?', zh: '怎样防止 asyncio 程序创建过多并发工作？' }
    answer:
      en: 'Separate task ownership from resource capacity. For a finite batch, a semaphore around the external call limits in-flight work while a TaskGroup owns and awaits every task. For an open-ended stream, a bounded asyncio.Queue gives stronger backpressure because producers wait when the buffer is full and a fixed worker set controls consumption. The limit should come from connection pools, file-descriptor budgets, memory, and downstream quotas. Test the observed peak, timeout behavior, and cancellation while workers are waiting for capacity.'
      zh: '应把任务所有权与资源容量分开考虑。对于有限批次，可在外部调用周围使用信号量限制在途工作，并让 TaskGroup 拥有和等待所有任务。对于持续输入的数据流，有界 asyncio.Queue 能提供更强的背压：缓冲区满时生产者等待，固定数量的 worker 控制消费。并发上限应来自连接池、文件描述符预算、内存和下游配额。测试时要观察实际峰值，并覆盖 worker 等待容量时发生超时和取消的路径。'
    topics: [python/asyncio]
    level: intermediate
    section: { en: 'Capacity control', zh: '容量控制' }
    frequency: occasional
    tags: [semaphore, queue, backpressure]

  - id: control-flow-truth-testing
    question: { en: 'How does Python decide whether an object is true in a condition?', zh: 'Python 如何判断条件中的对象是真是假？' }
    answer:
      en: 'Python applies truth value testing rather than requiring a bool. An object is false when its __bool__ method returns False or, if that method is absent, its __len__ method returns zero. Built-in false values include None, False, numeric zero, and empty containers. Everything else is normally true. This makes if items concise, but it can erase a domain distinction between None and an empty collection. Also remember that and and or short-circuit and return one of their operands, not necessarily True or False.'
      zh: 'Python 会执行真值测试，而不要求条件必须是 bool。对象的 __bool__ 方法返回 False 时为假；没有该方法时，__len__ 返回零也会使它为假。内置假值包括 None、False、数值零和空容器，其他对象通常为真。if items 很简洁，却可能抹掉 None 与空集合之间的领域区别。还要记住，and 和 or 会短路，并返回某个操作数，不一定返回 True 或 False。'
    topics: [python/control-flow]
    level: beginner
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [truth-value, short-circuit, conditionals]

  - id: control-flow-loop-else
    question: { en: 'When does else attached to a Python loop execute?', zh: 'Python 循环所带的 else 在何时执行？' }
    answer:
      en: 'A for loop runs its else suite when the iterator is exhausted, and a while loop runs it when the condition becomes false. In both forms, executing break in that loop skips else. continue does not skip it because it ends only the current iteration. The construct fits searches: break on a match and handle not found in else. A return or unhandled exception leaves the surrounding function or suite, so control does not reach else. In nested loops, only a break belonging to the loop with that else suppresses it.'
      zh: 'for 循环在迭代器耗尽时执行 else，while 循环在条件变为假时执行 else。两种形式中，只要同一循环执行 break，就会跳过 else。continue 只结束当前一轮，因此不会跳过它。这种结构适合搜索：找到时 break，else 处理未找到。return 或未处理异常会离开外层函数或语句组，所以控制不会到达 else。在嵌套循环中，只有属于该循环的 break 才会抑制对应的 else。'
    topics: [python/control-flow]
    level: intermediate
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [loops, break, loop-else]

  - id: control-flow-for-versus-while
    question: { en: 'How do you choose between for and while in Python?', zh: '在 Python 中如何选择 for 与 while？' }
    answer:
      en: 'Use for when the work consumes an iterable: records, lines, keys, a range, or a generator. It lets the iteration protocol own advancement and completion. Use while when repetition depends on changing state, such as a bounded retry or a state machine. For every while, identify a progress invariant and show that every path back to the condition moves toward termination. Be especially suspicious of continue before the update. Manual indexing with while is usually weaker than direct iteration unless the algorithm genuinely controls positions in a mutable sequence.'
      zh: '工作本身是在消费可迭代对象时，应使用 for，例如记录、文本行、键、range 或生成器。这样由迭代协议负责推进与结束。重复次数取决于变化状态时，应使用 while，例如有限重试或状态机。对每个 while，都要明确进度不变量，并证明每条回到条件的路径都向终止推进，尤其要检查状态更新之前的 continue。除非算法确实要控制可变序列的位置，否则用 while 手工维护索引通常不如直接迭代。'
    topics: [python/control-flow]
    level: beginner
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [for-loop, while-loop, termination]

  - id: control-flow-match-versus-if
    question: { en: 'When is match clearer than an if chain, and what is its main naming trap?', zh: 'match 何时比 if 链更清楚？它最主要的名称陷阱是什么？' }
    answer:
      en: 'Choose match when branches depend on the structure and contents of one subject, such as tagged mappings, fixed-shape sequences, or class instances. Keep a simple two-way Boolean decision as if. Cases run from top to bottom, so specific patterns must precede general ones, and a guard runs only after its pattern succeeds. The main naming trap is that a bare name is normally a capture pattern, not a comparison with an existing constant. Use literals or qualified names such as State.READY, and include a default case when unknown input needs explicit handling.'
      zh: '当分支取决于同一个主题的结构与内容时，match 通常更清楚，例如带标签的映射、固定形状的序列或类实例。简单的两路布尔选择仍应使用 if。case 从上到下尝试，因此具体模式必须位于一般模式之前；守卫只在模式成功后求值。主要的名称陷阱是，裸名称通常是捕获模式，不会与现有常量比较。应使用字面量或 State.READY 这样的限定名称，并在未知输入需要明确处理时提供默认分支。'
    topics: [python/control-flow]
    level: intermediate
    section: { en: 'Language core', zh: '语言核心' }
    frequency: occasional
    tags: [match, pattern-matching, capture-pattern]

  - id: copy-assignment-shallow-deep
    question: { en: 'How do assignment, shallow copy, and deep copy differ in Python?', zh: 'Python 中的赋值、浅拷贝和深拷贝有何区别？' }
    answer:
      en: 'Assignment creates another binding to the same object, so no ownership boundary is added. A shallow copy creates a new outer container or instance but reuses references to its immediate contents. A deep copy recursively constructs a corresponding object graph according to each type’s copy policy. It uses a memo so repeated references and cycles keep their topology in the result. I choose among them by tracing the exact mutation path, then test both value equality and the identity of mutable nodes that must be shared or isolated.'
      zh: '赋值只会把另一个名称绑定到同一个对象，不会增加所有权边界。浅拷贝创建新的外层容器或实例，但直接内容仍使用原来的引用。深拷贝按照各类型的复制策略，递归构造对应的对象图；它通过 memo 保留结果中的重复引用和循环拓扑。选择时，我会跟踪实际修改路径，再同时测试值相等性，以及必须共享或隔离的可变节点标识。'
    topics: [python/copy]
    level: beginner
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [assignment, shallow-copy, deep-copy]

  - id: copy-deepcopy-memo
    question: { en: 'Why does deepcopy use a memo dictionary, and how should a custom hook use it?', zh: 'deepcopy 为什么使用 memo 字典？自定义钩子应怎样使用它？' }
    answer:
      en: 'The memo maps each visited source identity to the destination already created during one deep-copy traversal. Reusing that destination prevents infinite recursion on cycles and keeps two source references to one child as two references to one copied child. A custom __deepcopy__ method should allocate an unpopulated result, store it under memo[id(self)] before descending, and pass the same memo to every recursive copy.deepcopy call. The memo is opaque traversal state: application code should not interpret, retain, replace, or split it into per-field dictionaries.'
      zh: 'memo 会在一次深拷贝遍历中，把每个已访问的源对象标识映射到已经创建的目标对象。复用目标对象既能避免在循环上无限递归，也能让源对象中指向同一子对象的两条引用，在副本中仍指向同一个已复制子对象。自定义 __deepcopy__ 方法应先分配尚未填充的结果，在递归前存入 memo[id(self)]，并把同一个 memo 传给每次 copy.deepcopy 调用。memo 是不透明的遍历状态，应用代码不应解释、保留、替换或拆分它。'
    topics: [python/copy]
    level: intermediate
    section: { en: 'Object model', zh: '对象模型' }
    frequency: common
    tags: [deep-copy, memo, object-graph]

  - id: copy-custom-policy
    question: { en: 'When should a class implement custom copy behavior?', zh: '类在什么情况下应实现自定义复制行为？' }
    answer:
      en: 'A class needs custom behavior when its fields have different ownership rules or generic reconstruction would violate an invariant. Typical cases include immutable data that should remain shared, mutable state that must be isolated, derived caches that should reset, and live resources such as locks or sockets that cannot sensibly be copied. __copy__ defines the shallow policy; __deepcopy__ defines recursive behavior and participates in the memo traversal. If the operation is domain-specific, a named method such as clone_for_request is often clearer because it states the transition instead of promising a universal deep copy.'
      zh: '当类的各个字段遵循不同所有权规则，或通用重建会破坏不变量时，就需要自定义复制行为。常见情况包括：应保持共享的不可变数据、必须隔离的可变状态、需要重置的派生缓存，以及无法合理复制的锁或套接字等实时资源。__copy__ 定义浅拷贝策略，__deepcopy__ 定义递归行为并参与 memo 遍历。如果操作只适用于特定领域，clone_for_request 这样的具名方法通常更清楚，因为它明确描述状态转换，而不是承诺通用深拷贝。'
    topics: [python/copy]
    level: advanced
    section: { en: 'Object model', zh: '对象模型' }
    frequency: occasional
    tags: [copy-protocol, invariants, resources]

  - id: copy-replace-versus-deepcopy
    question: { en: 'How does copy.replace() differ from copy.deepcopy()?', zh: 'copy.replace() 与 copy.deepcopy() 有何区别？' }
    answer:
      en: 'copy.replace creates a new object of the same type with explicitly named field changes. In Python 3.14 it supports named tuples, data classes, and classes that define __replace__. It is a structural update, not a recursive traversal, so unchanged mutable fields may remain shared. deepcopy instead follows reachable references according to the copy protocol and preserves aliases and cycles through its memo. I use replace for immutable-style record revisions and pass copied fields explicitly when ownership changes. I use deepcopy only when an entire supported graph needs an isolated counterpart.'
      zh: 'copy.replace 会创建相同类型的新对象，并应用显式指定的字段变更。在 Python 3.14 中，它支持具名元组、数据类，以及定义了 __replace__ 的类。它是结构化更新，不会递归遍历，因此未变的可变字段可能保持共享。deepcopy 则按照复制协议跟随可达引用，并通过 memo 保留别名与循环。不可变风格的记录修订适合使用 replace；字段所有权变化时，应显式传入副本。只有整个受支持对象图都需要隔离副本时，我才会使用 deepcopy。'
    topics: [python/copy]
    level: intermediate
    section: { en: 'Language core', zh: '语言核心' }
    frequency: occasional
    tags: [copy-replace, structural-replacement, deep-copy]

  - id: django-request-lifecycle
    question: { en: 'Walk through Django’s request lifecycle from the server to the response.', zh: '说明 Django 请求从服务器进入到响应返回的完整生命周期。' }
    answer:
      en: 'A WSGI or ASGI server hands Django an HTTP request. Request middleware runs in configured order and may attach sessions or authentication state, normalize input, or return a response early. The root URLconf checks patterns in order and calls the first matching view with an HttpRequest and captured path values. The view coordinates validation, authorization, domain work, queries, and rendering, then returns an HttpResponse. Response middleware runs in reverse order before the server sends bytes to the client. Exceptions follow the middleware exception-handling path rather than bypassing the stack.'
      zh: 'WSGI 或 ASGI 服务器把 HTTP 请求交给 Django。请求中间件按配置顺序运行，可以附加会话或认证状态、规范化输入，也可以提前返回响应。根 URLconf 按顺序检查模式，用 HttpRequest 和捕获的路径值调用第一个匹配的视图。视图协调验证、授权、领域操作、查询与渲染，再返回 HttpResponse。响应中间件按相反顺序运行，之后服务器才把字节发送给客户端。异常会进入中间件的异常处理路径，不会绕过整个栈。'
    topics: [python/django]
    level: intermediate
    section: { en: 'Web frameworks', zh: 'Web 框架' }
    frequency: common
    tags: [django, request-lifecycle, middleware, urlconf]

  - id: django-n-plus-one
    question: { en: 'How do you find and fix an N+1 query problem in Django?', zh: '怎样发现并修复 Django 中的 N+1 查询问题？' }
    answer:
      en: 'Start at the evaluation boundary and count queries for a representative list with more than one row. Accessing a foreign key or one-to-one relation per result usually calls for select_related(), which adds a SQL join. Many-to-many and reverse relations usually call for prefetch_related(), which performs separate queries and joins results in Python. Verify the fix with assertNumQueries() and data that exercises every template or serializer branch. Do not prefetch everything by default: unused joins, large related collections, or a differently filtered related manager can waste work or issue another query anyway.'
      zh: '先找到 QuerySet 的求值边界，再对包含多行数据的代表性列表统计查询次数。逐行访问外键或一对一关系时，通常用 select_related() 增加 SQL 连接。多对多和反向关系通常用 prefetch_related() 分别查询，再由 Python 合并结果。应使用 assertNumQueries() 和能覆盖每个模板或序列化分支的数据验证修复。不要默认预取一切；未使用的连接、庞大的关联集合，或条件不同的关联管理器都可能浪费工作，甚至仍然发出新查询。'
    topics: [python/django]
    level: intermediate
    section: { en: 'Data access', zh: '数据访问' }
    frequency: common
    tags: [django, queryset, n-plus-one, performance]

  - id: django-validation-transaction-constraint
    question: { en: 'How do form validation, transactions, and database constraints divide responsibility?', zh: '表单验证、事务和数据库约束分别承担什么责任？' }
    answer:
      en: 'Form validation converts untrusted input and returns field-specific errors before a write. Model validation can reuse model rules and perform friendly uniqueness checks, but neither step serializes concurrent requests. Database constraints are the final authority for invariants such as uniqueness and valid value ranges. transaction.atomic() groups dependent writes so they commit or roll back together; select_for_update() can serialize a workflow around existing rows when needed. Handle IntegrityError outside the atomic block that must roll back. Trigger external side effects with transaction.on_commit() so a failed transaction cannot send a success message or enqueue work for missing data.'
      zh: '表单验证负责转换不可信输入，并在写入前返回具体字段错误。模型验证可以复用模型规则并提供友好的唯一性检查，但两者都不会串行化并发请求。唯一性和有效值范围等不变量最终由数据库约束负责。transaction.atomic() 把相关写入组合起来，使它们一起提交或回滚；必要时，select_for_update() 可以围绕现有行串行化工作流。应在需要回滚的 atomic 块外处理 IntegrityError。外部副作用应通过 transaction.on_commit() 触发，避免失败事务发送成功消息，或为不存在的数据排入任务。'
    topics: [python/django]
    level: advanced
    section: { en: 'Data integrity', zh: '数据完整性' }
    frequency: common
    tags: [django, validation, transactions, constraints]

  - id: django-async-view-boundary
    question: { en: 'When is an async Django view useful, and what boundaries must you check?', zh: 'Django 异步视图何时有用？需要检查哪些边界？' }
    answer:
      en: 'An async view is useful when the endpoint spends substantial time awaiting supported network I/O or maintains a long-lived response. Run it under ASGI and check that middleware on the path supports async operation; synchronous middleware forces adaptation. QuerySet methods that execute SQL generally have a-prefixed variants, while methods that only compose a QuerySet remain synchronous because they do no I/O. In Django 6.0, transactions still belong in one synchronous function called through sync_to_async(). Never use DJANGO_ALLOW_ASYNC_UNSAFE as a production shortcut, and preserve cancellation cleanup when clients disconnect.'
      zh: '端点需要长时间等待受支持的网络 I/O，或维持长响应时，异步视图才有用。它应运行在 ASGI 下，同时还要检查路径上的中间件是否支持异步操作；同步中间件会迫使 Django 进行适配。执行 SQL 的 QuerySet 方法通常有以 a 开头的异步变体，只组合 QuerySet 的方法没有 I/O，仍保持同步。在 Django 6.0 中，事务仍应放在一个同步函数里，再通过 sync_to_async() 调用。不要把 DJANGO_ALLOW_ASYNC_UNSAFE 当成生产捷径，客户端断开时还要保留取消清理逻辑。'
    topics: [python/django]
    level: intermediate
    section: { en: 'Async execution', zh: '异步执行' }
    frequency: occasional
    tags: [django, async, asgi, orm]

  - id: fastapi-parameter-source
    question: { en: 'How does FastAPI decide where a path operation parameter comes from and whether it is required?', zh: 'FastAPI 如何判断路径操作参数的来源，以及它是否必填？' }
    answer:
      en: 'FastAPI combines the route template, Python type, default value, and explicit parameter metadata. A matching name in the route template is a path parameter. A simple scalar is normally a query parameter, while a Pydantic model is normally a request body. Header, Cookie, Query, and Body can make the source explicit. Requiredness comes from whether a default is present, not merely from a union with None. I verify the declaration over HTTP because direct function calls bypass extraction, conversion, and the structured 422 error path.'
      zh: 'FastAPI 会综合路由模板、Python 类型、默认值和显式参数元数据。名称出现在路由模板中时，它是路径参数；简单标量通常是查询参数，Pydantic 模型通常是请求体。Header、Cookie、Query 和 Body 可以显式指定来源。是否必填取决于有没有默认值，而不只是类型是否与 None 联合。我会通过 HTTP 验证声明，因为直接调用函数会绕过提取、转换和结构化的 422 错误路径。'
    topics: [python/fastapi]
    level: beginner
    section: { en: 'Web frameworks', zh: 'Web 框架' }
    frequency: common
    tags: [fastapi, parameters, validation]

  - id: fastapi-response-model-boundary
    question: { en: 'Why should a FastAPI endpoint use a separate response model?', zh: 'FastAPI 端点为什么应使用单独的响应模型？' }
    answer:
      en: 'A response model is the allowlist for data crossing the public boundary. FastAPI uses it to document, validate, serialize, and filter the handler return value, and the decorator response_model takes priority over a return annotation when both exist. Separating input, storage, and output models prevents fields such as password hashes, tenant identifiers, or internal notes from leaking through a convenient object return. I test both the full expected body and the absence of sensitive fields, because checking only positive fields will not detect accidental disclosure.'
      zh: '响应模型是数据跨越公开边界时的字段允许列表。FastAPI 用它记录、验证、序列化并过滤处理函数的返回值；同时存在时，装饰器上的 response_model 优先于返回注解。分离输入、存储和输出模型，可以防止哈希密码、租户标识或内部备注随着整个对象被便利地返回。我会同时测试完整的预期响应体和敏感字段不存在，因为只检查正向字段无法发现意外泄露。'
    topics: [python/fastapi]
    level: intermediate
    section: { en: 'API contracts', zh: 'API 契约' }
    frequency: common
    tags: [fastapi, response-model, security]

  - id: fastapi-sync-versus-async-handler
    question: { en: 'How do you choose between def and async def for a FastAPI path operation?', zh: 'FastAPI 路径操作应怎样在 def 与 async def 之间选择？' }
    answer:
      en: 'I start at the I/O boundary. If the libraries expose awaitable operations, I use async def and await every such call so the event loop can advance other work. If a required library is blocking, a normal def path operation lets FastAPI run it in a thread pool. Merely writing async def does not make a synchronous ORM, HTTP client, or sleep non-blocking. Helper functions called directly inside a handler are not moved automatically, so I trace reachable calls and confirm their execution context with concurrency and cancellation tests.'
      zh: '我会从 I/O 边界开始判断。如果库提供可等待操作，就使用 async def 并正确 await，让事件循环可以推进其他工作。如果必须使用阻塞库，普通 def 路径操作会让 FastAPI 在线程池中运行它。仅写成 async def 不会让同步 ORM、HTTP 客户端或 sleep 变为非阻塞。处理函数直接调用的辅助函数也不会自动换到线程池，因此我会跟踪可达调用，并通过并发与取消测试确认执行环境。'
    topics: [python/fastapi]
    level: intermediate
    section: { en: 'Async execution', zh: '异步执行' }
    frequency: common
    tags: [fastapi, async, blocking-io, thread-pool]

  - id: fastapi-dependency-lifecycle
    question: { en: 'How do FastAPI dependency caching, yield cleanup, and test overrides interact?', zh: 'FastAPI 的依赖缓存、yield 清理和测试覆盖如何协作？' }
    answer:
      en: 'FastAPI resolves dependencies as a graph and, by default, evaluates the same dependency callable once per request. Consumers share that request-scoped result unless use_cache=False is explicit. A dependency with one yield acquires before use and runs exit code afterward, so release belongs in finally; its selected scope determines whether cleanup occurs before or after sending the response. Tests replace a node through app.dependency_overrides keyed by the original callable object. Because that mapping is mutable application state, a fixture must always restore it, including after a failed assertion.'
      zh: 'FastAPI 把依赖解析为一张图，默认在一次请求中只求值一次同一依赖可调用对象。各使用方共享这个请求级结果，除非显式设置 use_cache=False。只包含一次 yield 的依赖会先获取资源，再运行退出代码，因此释放操作应放在 finally 中；所选范围决定清理发生在响应发送前还是发送后。测试通过 app.dependency_overrides 替换节点，键必须是原始可调用对象。该映射是应用级可变状态，所以 fixture 即使遇到断言失败也必须恢复它。'
    topics: [python/fastapi]
    level: advanced
    section: { en: 'Dependency injection', zh: '依赖注入' }
    frequency: occasional
    tags: [fastapi, dependencies, lifecycle, testing]
