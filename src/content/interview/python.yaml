track: python
items:
  - id: closure-capture
    question:
      en: 'What is a closure, and what exactly does it capture?'
      zh: '什么是闭包，它究竟捕获了什么？'
    answer:
      en: |
        A closure is a function that keeps access to bindings from the lexical environment where it was defined, even after the enclosing function returns. It captures the **binding**, stored in a cell, rather than a frozen copy of the current value. A later rebinding can therefore change what the closure sees.
      zh: |
        闭包是一个函数：即使外层函数已经返回，它仍能访问定义位置所对应词法环境中的绑定。闭包捕获的是保存在 cell 中的**绑定**，而不是当前值的一份冻结副本，因此之后的重新绑定会改变闭包看到的对象。
    topics: [python/closures]
    level: beginner
    tags: [calibration]
    section: { en: 'Closures and scope', zh: '闭包与作用域' }
    frequency: common

  - id: late-binding-loop
    question:
      en: 'Why do closures created in a loop often return the same value, and how do you fix it?'
      zh: '为什么循环中创建的闭包常常返回同一个值？该如何修复？'
    answer:
      en: |
        The functions close over one loop-variable binding and look it up when they run. If they run after the loop, they all see its final value. Bind each iteration's value when the function is created, for example with a default argument:

        ```python
        readers = [lambda index=index: index for index in range(3)]
        ```

        A helper factory called once per iteration is another explicit fix.
      zh: |
        这些函数捕获的是同一个循环变量绑定，并在运行时才查找它。如果函数都在循环结束后运行，它们看到的就是最终值。可用默认参数在创建函数时绑定本轮的值：

        ```python
        readers = [lambda index=index: index for index in range(3)]
        ```

        也可以在每轮调用一次辅助工厂函数，显式创建独立绑定。
    topics: [python/closures]
    level: intermediate
    tags: [calibration]
    section: { en: 'Closures and scope', zh: '闭包与作用域' }
    frequency: common

  - id: nonlocal-classification
    question:
      en: "How does nonlocal change the compiler's treatment of a captured name?"
      zh: 'nonlocal 会怎样改变编译器对捕获名称的处理？'
    answer:
      en: |
        Assignment normally makes a name local to the current function. `nonlocal count` changes that compile-time classification so reads and writes use the existing `count` cell from the nearest enclosing function scope. It cannot target module scope or create a missing outer binding.
      zh: |
        赋值通常会让名称被归类为当前函数的局部名称。`nonlocal count` 会在编译时改变这一分类，使读写都使用最近外层函数作用域中已有的 `count` cell。它不能指向模块作用域，也不能创建不存在的外层绑定。
    topics: [python/closures]
    level: advanced
    tags: [calibration]
    section: { en: 'Compiler mechanics', zh: '编译器机制' }
    frequency: occasional
