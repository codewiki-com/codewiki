track: python
items:
  - id: asyncio-coroutine-versus-task
    question: { en: 'What is the difference between a coroutine object and an asyncio Task?', zh: '协程对象与 asyncio Task 有什么区别？' }
    answer:
      en: 'Calling an async def function creates a coroutine object but does not independently schedule its body. Awaiting that object drives it as part of the current task. A Task wraps a coroutine, schedules it on the running event loop, and records its result, exception, or cancellation state. Creating a task is therefore an ownership decision, not just syntax for await. The caller must retain and eventually await it, or place it in a TaskGroup that provides a clear lifetime and failure boundary.'
      zh: '调用 async def 函数会创建协程对象，但不会独立调度函数体。await 该对象时，它作为当前任务的一部分被驱动。Task 会包装协程，把它安排到正在运行的事件循环，并记录结果、异常或取消状态。因此，创建任务是一项所有权决定，不只是 await 的另一种写法。调用方必须保留并最终等待任务，或把它放进 TaskGroup，由任务组提供清晰的生命周期和失败边界。'
    topics: [python/asyncio]
    level: beginner
    section: { en: 'Async execution', zh: '异步执行' }
    frequency: common
    tags: [asyncio, coroutine, task]

  - id: asyncio-taskgroup-versus-gather
    question: { en: 'When would you choose TaskGroup over asyncio.gather()?', zh: '什么情况下应选择 TaskGroup，而不是 asyncio.gather()？' }
    answer:
      en: 'Choose TaskGroup when several child tasks form one operation and a child failure makes the remaining work pointless. The group cancels unfinished siblings, waits for their cleanup, and raises remaining failures as an exception group when its context exits. gather is useful when result order must match input order or when operations are genuinely independent, but its default first-exception behavior does not cancel the other awaitables. With either API, decide explicitly whether failures are fail-fast, collected as data, or allowed to outlive the caller.'
      zh: '当多个子任务共同构成一项操作，而且任一子任务失败后其余工作都失去意义时，应选择 TaskGroup。任务组会取消未完成的兄弟任务，等待它们清理，并在退出上下文时以异常组抛出仍需报告的失败。需要让结果顺序匹配输入顺序，或各项操作确实相互独立时，gather 很有用，但它默认传播首个异常时不会取消其他 awaitable。无论使用哪个 API，都应明确决定失败是快速传播、作为数据收集，还是允许工作比调用方存活更久。'
    topics: [python/asyncio]
    level: intermediate
    section: { en: 'Structured concurrency', zh: '结构化并发' }
    frequency: common
    tags: [taskgroup, gather, exceptions]

  - id: asyncio-cancellation-cleanup
    question: { en: 'How should an asyncio coroutine respond to cancellation?', zh: 'asyncio 协程应如何响应取消？' }
    answer:
      en: 'Cancellation is delivered cooperatively, usually as CancelledError at the next suspension opportunity. A coroutine should put resource release and invariant restoration in finally blocks or async context managers, then normally let the cancellation propagate. Swallowing it can break TaskGroup and timeout behavior and leave the owner believing work has stopped when it has not. CancelledError derives directly from BaseException, so except Exception does not catch it. Explicit suppression is rare and must also account for the task cancellation state, typically with uncancel().'
      zh: '取消通过协作方式传递，通常会在下一次可暂停机会抛出 CancelledError。协程应把资源释放和不变量恢复放进 finally 块或异步上下文管理器，然后通常让取消继续传播。吞掉取消会破坏 TaskGroup 和超时语义，还可能让所有者误以为工作已经停止。CancelledError 直接继承 BaseException，因此 except Exception 不会捕获它。显式抑制取消很少合理，而且还必须处理任务的取消状态，通常需要调用 uncancel()。'
    topics: [python/asyncio]
    level: advanced
    section: { en: 'Cancellation and deadlines', zh: '取消与截止时间' }
    frequency: common
    tags: [cancellation, cleanup, timeout]

  - id: asyncio-bounded-concurrency
    question: { en: 'How do you prevent an asyncio program from creating too much concurrent work?', zh: '怎样防止 asyncio 程序创建过多并发工作？' }
    answer:
      en: 'Separate task ownership from resource capacity. For a finite batch, a semaphore around the external call limits in-flight work while a TaskGroup owns and awaits every task. For an open-ended stream, a bounded asyncio.Queue gives stronger backpressure because producers wait when the buffer is full and a fixed worker set controls consumption. The limit should come from connection pools, file-descriptor budgets, memory, and downstream quotas. Test the observed peak, timeout behavior, and cancellation while workers are waiting for capacity.'
      zh: '应把任务所有权与资源容量分开考虑。对于有限批次，可在外部调用周围使用信号量限制在途工作，并让 TaskGroup 拥有和等待所有任务。对于持续输入的数据流，有界 asyncio.Queue 能提供更强的背压：缓冲区满时生产者等待，固定数量的 worker 控制消费。并发上限应来自连接池、文件描述符预算、内存和下游配额。测试时要观察实际峰值，并覆盖 worker 等待容量时发生超时和取消的路径。'
    topics: [python/asyncio]
    level: intermediate
    section: { en: 'Capacity control', zh: '容量控制' }
    frequency: occasional
    tags: [semaphore, queue, backpressure]
