track: rust
items:
  - id: borrowing-shared-versus-mutable
    question: { en: 'What are Rust’s borrowing rules, and what do they prevent?', zh: 'Rust 的借用规则是什么？它们防止了什么问题？' }
    answer:
      en: 'For an overlapping region, Rust permits multiple shared references or one mutable reference, without conflicting use of both. Every reference must also remain valid for each use. Shared references support observation, while a mutable reference represents exclusive access and permits mutation. These constraints prevent dangling references and unsynchronized aliasing of ordinary data. They apply to actual use ranges rather than automatically lasting to the end of a block because non-lexical lifetimes use control-flow information. Interior-mutability types preserve the model by moving some checks to runtime or synchronization guards rather than removing the rules.'
      zh: '对同一或重叠区域，Rust 允许多个共享引用或一个可变引用，不能让两类访问发生冲突；每个引用在每次使用时还必须有效。共享引用用于观察，可变引用代表独占访问并允许修改。这些限制防止悬垂引用，以及对普通数据进行未同步的别名写入。借用区间不会自动持续到代码块末尾，因为非词法生命周期会利用控制流和实际使用信息。内部可变性类型也没有取消规则，而是把部分检查移到运行时或同步守卫上。'
    topics: [rust/borrowing-rules]
    level: beginner
    section: { en: 'Ownership and borrowing', zh: '所有权与借用' }
    frequency: common
    tags: [borrowing, shared-reference, mutable-reference]

  - id: borrowing-nll-last-use
    question: { en: 'How do non-lexical lifetimes change the way you read a borrow conflict?', zh: '非词法生命周期如何改变你对借用冲突的理解？' }
    answer:
      en: 'NLL lets the compiler infer a borrow region from later uses and control flow instead of extending every borrow to its enclosing brace. A shared reference can therefore be read for the last time and then be followed by a mutable borrow in the same lexical block. When diagnosing an error, identify the reference creation, the conflicting access, and the later use that keeps the first borrow active. NLL does not make dangling references legal or guarantee that every human-obvious access pattern is accepted. It makes valid regions more precise while preserving the same shared-versus-exclusive rules.'
      zh: 'NLL 让编译器根据后续使用和控制流推断借用区域，而不是让每次借用都延伸到包围它的右花括号。因此，共享引用在同一词法代码块中最后一次读取后，可以接着开始可变借用。诊断错误时，应找出引用创建点、冲突访问，以及让首次借用保持有效的后续使用。NLL 不会让悬垂引用合法，也不保证接受每种人能看出安全的访问模式。它只是更精确地计算有效区域，同时保留共享与独占规则。'
    topics: [rust/borrowing-rules]
    level: intermediate
    section: { en: 'Borrow analysis', zh: '借用分析' }
    frequency: common
    tags: [nll, control-flow, diagnostics]

  - id: borrowing-lifetime-annotations
    question: { en: 'What do lifetime annotations express, and what can they not do?', zh: '生命周期标注表达什么？它不能做什么？' }
    answer:
      en: 'A lifetime annotation names relationships among references in a type signature. For a function returning one of two borrowed strings, a shared lifetime parameter says the result cannot be used beyond the region where the relevant inputs remain valid. The compiler chooses concrete regions at each call; the annotation does not force arguments to have identical lexical scopes. It also cannot extend an owned value, turn a local allocation into static storage, or repair a reference to data destroyed on return. Return owned data when the function creates it, and return a borrow only when it originates from a valid input or static source.'
      zh: '生命周期标注在类型签名中命名引用之间的关系。函数返回两个借用字符串之一时，共享生命周期参数表示结果不能越过相关输入都有效的区域使用。编译器会在每次调用处选择具体区域；标注并不要求实参拥有完全相同的词法作用域。它也不能延长拥有型值的存活时间，不能把局部分配变成静态存储，更不能修复返回时即被销毁的数据引用。函数创建数据时应返回拥有型值；只有结果来自有效输入或静态来源时才返回借用。'
    topics: [rust/borrowing-rules]
    level: intermediate
    section: { en: 'Lifetimes', zh: '生命周期' }
    frequency: common
    tags: [lifetimes, return-reference, static]

  - id: borrowing-two-mutable-elements
    question: { en: 'How do you safely obtain mutable access to two elements selected by runtime indices?', zh: '怎样安全地可变访问由运行时索引选出的两个元素？' }
    answer:
      en: 'First reject equal and out-of-range indices. Directly indexing the same slice twice usually fails because the borrow checker conservatively treats the two places as possibly overlapping. Order the indices, split the slice at the larger index with split_at_mut, then take one element from each returned slice and restore the logical source and destination roles. The safe API proves that the regions do not overlap. Validate arithmetic and other domain preconditions before changing either element, so a later failure does not leave a partial update. Raw pointers are unnecessary for this ordinary case.'
      zh: '先拒绝相同索引与越界索引。直接对同一切片索引两次通常不能通过，因为借用检查器会保守地认为两个位置可能重叠。应先排列索引，再在较大索引处调用 split_at_mut 拆分切片，然后分别从两个返回切片中取得元素，并恢复业务上的来源与目标角色。这个安全 API 证明了两个区域不重叠。修改前还要验证算术与领域前置条件，避免后续失败留下部分更新。这个常见场景不需要裸指针。'
    topics: [rust/borrowing-rules]
    level: advanced
    section: { en: 'Disjoint access', zh: '不重叠访问' }
    frequency: occasional
    tags: [split-at-mut, indexing, mutable-reference]

  - id: collections-hashmap-versus-btreemap
    question: { en: 'How do you choose between HashMap and BTreeMap?', zh: '怎样在 HashMap 与 BTreeMap 之间选择？' }
    answer:
      en: 'Start with the observable contract, not a blanket speed claim. HashMap models lookup by equality and hash and makes no iteration-order promise. BTreeMap requires Ord, iterates in key order, and supports range queries and first-or-last key operations. Choose BTreeMap when callers rely on ordered traversal, ranges, or reproducible key order throughout the model. Choose HashMap when those semantics are absent, then sort explicitly at a presentation boundary if only one output needs order. Also check whether the key type has a natural, consistent Ord implementation or only Eq and Hash.'
      zh: '先看可观察契约，不要先下笼统的速度结论。HashMap 按相等关系与哈希值查找，不承诺迭代顺序；BTreeMap 要求键实现 Ord，按键顺序迭代，并支持范围查询与首尾键操作。调用方持续依赖有序遍历、范围或可重复键顺序时，应选 BTreeMap。内部模型不需要这些语义时可选 HashMap；若只有一处输出要求顺序，就在展示边界显式排序。还要确认键是否具有自然且一致的 Ord 实现。'
    topics: [rust/collections]
    level: intermediate
    section: { en: 'Standard collections', zh: '标准集合' }
    frequency: common
    tags: [hashmap, btreemap, ordering]

  - id: collections-vec-growth-borrows
    question: { en: 'Why can growing a Vec conflict with an existing element reference?', zh: '为什么 Vec 增长会与已有元素引用冲突？' }
    answer:
      en: 'A Vec owns a contiguous buffer. When push needs more capacity, it may allocate another buffer, move the elements, and release the old allocation, which would leave an old element reference dangling. Rust therefore rejects a mutable vector operation while a reference borrowed from that vector is still needed later. Even when spare capacity happens to prevent reallocation, other mutations may shift elements or change which entity an index denotes. End the borrow before mutation, retain owned data when appropriate, or save a domain identifier and borrow again after the collection changes.'
      zh: 'Vec 拥有一段连续缓冲区。push 需要更多容量时，可能重新分配缓冲区、搬移元素并释放旧分配，旧元素引用会因此悬空。所以，只要从向量借出的引用之后仍要使用，Rust 就会拒绝对向量进行可变操作。即使剩余容量碰巧避免重新分配，其他修改也可能移动元素，或改变某个索引代表的业务实体。应在修改前结束借用；必要时保留拥有型数据，或保存领域标识，并在集合改变后重新借用。'
    topics: [rust/collections]
    level: intermediate
    section: { en: 'Ownership and allocation', zh: '所有权与分配' }
    frequency: common
    tags: [vec, borrowing, reallocation]

  - id: collections-entry-evaluation
    question: { en: 'What problem does HashMap::entry solve, and when does or_insert_with matter?', zh: 'HashMap::entry 解决什么问题？何时需要 or_insert_with？' }
    answer:
      en: 'entry turns the presence or absence of one key into an Occupied or Vacant state while the map is mutably borrowed. That lets counting, grouping, and conditional replacement use one coherent branch rather than contains_key followed by another lookup. or_insert returns a mutable reference to the stored value, inserting its argument for a vacant entry. The argument itself is evaluated eagerly, though, so or_insert(expensive()) still calls expensive for an occupied key. Use or_insert_with when construction should happen only on the vacant path, or or_default when Default is exactly what you need.'
      zh: 'entry 在映射被可变借用期间，把一个键的存在与否表示为 Occupied 或 Vacant 状态。计数、分组和条件替换因此可以在一次连贯分支中完成，不必先 contains_key 再查找。or_insert 返回已存值的可变引用，并在条目空缺时插入实参；但实参本身会提前求值，所以键已存在时，or_insert(expensive()) 仍会调用 expensive。只有空缺路径才应构造值时使用 or_insert_with；所需值正是 Default 时使用 or_default。'
    topics: [rust/collections]
    level: intermediate
    section: { en: 'Map updates', zh: '映射更新' }
    frequency: common
    tags: [entry-api, hashmap, lazy-evaluation]

  - id: collections-deterministic-deduplication
    question: { en: 'How would you deduplicate values while preserving first-seen order?', zh: '怎样在去重时保留首次出现顺序？' }
    answer:
      en: 'Do not collect straight into HashSet and then iterate it, because the set removes duplicates but does not preserve input order. Keep a result Vec and a membership HashSet. Walk the input once; when seen.insert(key) returns true, append the corresponding value to the result. Decide whether seen owns keys or borrows them from input based on the result lifetime and ownership contract. If output order should instead follow the key’s Ord implementation, collecting into BTreeSet expresses a different, sorted contract. Test interleaved duplicates, not just adjacent ones.'
      zh: '不要直接收集到 HashSet 后再迭代，因为它会去重，却不保留输入顺序。应同时维护结果 Vec 与成员 HashSet：单次遍历输入，当 seen.insert(key) 返回 true 时，才把对应值追加到结果。seen 应拥有键还是从输入借用，要根据结果的生命周期与所有权契约决定。如果输出本来就应按键的 Ord 排序，收集到 BTreeSet 表达的是另一种有序契约。测试应包含交错重复项，不能只测相邻重复。'
    topics: [rust/collections]
    level: intermediate
    section: { en: 'Set semantics', zh: '集合语义' }
    frequency: occasional
    tags: [hashset, vec, ordering]

  - id: iterators-iterator-versus-into-iterator
    question: { en: 'What is the difference between Iterator and IntoIterator?', zh: 'Iterator 与 IntoIterator 有什么区别？' }
    answer:
      en: 'Iterator is the stateful producer that has an Item type and a next method. IntoIterator is the conversion contract used to obtain such a producer from another value. A for loop accepts an IntoIterator, calls into_iter once, and then advances the resulting iterator. One collection may provide different IntoIterator implementations for an owned value, a shared reference, and a mutable reference. Those implementations can yield T, &T, and &mut T respectively, so checking only the loop syntax is not enough; you must also inspect the receiver and Item type.'
      zh: 'Iterator 是有状态的生产者，具有 Item 类型与 next 方法。IntoIterator 则是转换契约，用于从另一个值取得这样的生产者。for 循环接收 IntoIterator，先调用一次 into_iter，再推进得到的迭代器。同一个集合可以分别为拥有型值、共享引用和可变引用实现 IntoIterator，并相应产出 T、&T 或 &mut T。因此，判断所有权语义时不能只看循环语法，还要检查接收者和实际的 Item 类型。'
    topics: [rust/iterators]
    level: beginner
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [iterator, into-iterator, for-loop]

  - id: iterators-ownership-entry-points
    question: { en: 'How do iter, iter_mut, and into_iter differ on a Vec?', zh: 'Vec 上的 iter、iter_mut 与 into_iter 有何区别？' }
    answer:
      en: 'For a Vec<T>, iter borrows the vector and yields &T, so the collection remains available after iteration. iter_mut takes an exclusive borrow and yields &mut T, allowing in-place element changes while that borrow is active. Calling into_iter on the owned Vec consumes it and yields T, transferring each element to the caller. Choose from the ownership contract, not style. If later code still needs the vector, borrow it. If a result must own non-Copy elements, make the necessary clone or transformation explicit instead of cloning the whole collection preemptively.'
      zh: '对 Vec<T> 而言，iter 借用向量并产出 &T，所以迭代后仍可使用原集合。iter_mut 取得独占借用并产出 &mut T，允许在借用有效期间就地修改元素。对拥有型 Vec 调用 into_iter 会消费向量并产出 T，把每项所有权交给调用方。选择入口应依据所有权契约，而不是代码风格。后续仍需向量时就借用它；结果必须拥有非 Copy 元素时，应明确克隆或转换必要元素，不要预先克隆整个集合。'
    topics: [rust/iterators]
    level: beginner
    section: { en: 'Ownership and borrowing', zh: '所有权与借用' }
    frequency: common
    tags: [iter, iter-mut, into-iterator, ownership]

  - id: iterators-laziness-and-short-circuiting
    question: { en: 'How do laziness and short-circuiting affect an iterator pipeline?', zh: '惰性求值与短路如何影响迭代器管道？' }
    answer:
      en: 'Adapters such as map and filter store an upstream iterator and closures but do not request elements themselves. A consumer drives the chain one item at a time. Consumers such as find and any stop after a decisive item, while collect normally runs to exhaustion and fallible collection stops at the first error. Consequently, later inputs may never enter any closure. This matters for both work and side effects: logging or mutation inside inspect or map can run fewer times than the source length. Tests should cover where termination occurs, not only the final value.'
      zh: 'map 与 filter 等适配器只保存上游迭代器和闭包，自身不会请求元素。消费者按项驱动整条链。find 和 any 在遇到决定性元素后停止；普通 collect 通常运行到结束，而可失败收集会在第一个错误处停止。因此，后续输入可能根本不会进入任何闭包。这既影响计算量，也影响副作用：放在 inspect 或 map 中的日志与修改，执行次数可能少于来源长度。测试不能只看最终值，还要覆盖终止位置。'
    topics: [rust/iterators]
    level: intermediate
    section: { en: 'Evaluation model', zh: '求值模型' }
    frequency: common
    tags: [lazy-evaluation, short-circuiting, consumers]

  - id: iterators-fallible-collection
    question: { en: 'How do you collect parsed values without losing the first error?', zh: '怎样收集解析结果而不丢失第一个错误？' }
    answer:
      en: 'Map each input to Result<T, E> and collect the iterator into Result<Vec<T>, E>. The Result implementation of FromIterator gathers every Ok value and returns the first Err immediately, so later inputs are not evaluated. The target type must be visible through an annotation, return type, or turbofish. Using filter_map with Result::ok expresses a different contract: it discards errors and retains successes. That is valid only when rejected inputs are intentionally ignorable. For imports, configuration, money, or identifiers, silent dropping usually turns corrupted input into misleading partial success.'
      zh: '先把每项输入映射成 Result<T, E>，再把迭代器收集成 Result<Vec<T>, E>。Result 的 FromIterator 实现会收集所有 Ok，并在第一个 Err 处立即返回，因此之后的输入不会求值。目标类型必须通过标注、返回类型或 turbofish 明确。使用 filter_map 与 Result::ok 表达的是另一种契约：丢弃错误，只保留成功项。只有坏输入本来就允许忽略时才适用；对于导入、配置、金额或标识符，静默丢弃通常会把损坏输入伪装成部分成功。'
    topics: [rust/iterators]
    level: intermediate
    section: { en: 'Error handling', zh: '错误处理' }
    frequency: occasional
    tags: [result, from-iterator, collect, error-handling]

  - id: modules-package-crate-module
    question: { en: 'How do a Cargo package, a crate, and a module differ?', zh: 'Cargo package、crate 与模块有什么区别？' }
    answer:
      en: 'A Cargo package is the unit described by one Cargo.toml and may contain multiple build targets. Each target is a crate: one library or executable compiled as a unit, with its own crate root and module tree. A package can have at most one library crate and multiple binary crates. Modules live inside a crate and organize items, paths, and visibility; they are not independent Cargo targets. Keeping these levels separate explains why src/lib.rs and src/main.rs in one package cannot share private items or use crate:: to reach the same root.'
      zh: 'Cargo package 由一份 Cargo.toml 描述，可以包含多个构建目标。每个目标都是一个 crate，即独立编译的库或可执行程序，并拥有自己的 crate root 与模块树。一个 package 最多包含一个 library crate，却可以包含多个 binary crate。模块位于 crate 内，用来组织 item、路径和可见性，不是独立 Cargo 目标。区分这三层后，就能理解为何同一 package 中的 src/lib.rs 与 src/main.rs 不能共享私有项，crate:: 也不会指向同一个根。'
    topics: [rust/modules-crates]
    level: beginner
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [package, crate, module, crate-root]

  - id: modules-declaration-file-mapping
    question: { en: 'How does Rust map mod declarations to files, and what role does use play?', zh: 'Rust 如何把 mod 声明映射到文件？use 在其中起什么作用？' }
    answer:
      en: 'An inline mod name { ... } defines a child module in place. A declaration such as mod catalog; defines the same logical child but loads its body from the conventional catalog.rs or catalog/mod.rs location; both candidate entry files cannot represent that module simultaneously. Child file lookup follows the logical parent, so a declaration inside catalog belongs under catalog/. Merely creating a file under src does not attach it to a crate. use operates after the module exists: it binds an existing path into one scope, but it neither declares a module nor controls which files compile.'
      zh: '内联的 mod name { ... } 会在当前位置定义子模块。mod catalog; 声明同一个逻辑子模块，但从常规的 catalog.rs 或 catalog/mod.rs 读取内容；两个候选入口不能同时表示该模块。子模块的文件查找跟随逻辑父级，所以 catalog 内的声明对应 catalog/ 下的文件。仅在 src 中创建文件不会把它接入 crate。use 只在模块已经存在后，把已有路径绑定到一个作用域；它既不声明模块，也不决定哪些文件参与编译。'
    topics: [rust/modules-crates]
    level: intermediate
    section: { en: 'Modules and paths', zh: '模块与路径' }
    frequency: common
    tags: [mod, file-layout, use, module-tree]

  - id: modules-visibility-reexports
    question: { en: 'Why can a pub item remain unreachable, and how does pub use help?', zh: '为什么 pub 项仍可能不可达？pub use 如何解决这个问题？' }
    answer:
      en: 'Visibility is checked from the use site across the complete path. Marking a function pub allows access only as far as its ancestor modules permit, so an external caller still cannot name it through a private ancestor. Making every ancestor public works but exposes implementation structure as API. pub use creates another reachable path to the existing public item, often at the crate root, while the internal module can remain private. This supports a stable facade: files and internal nesting may change without forcing callers to change imports, provided the re-exported path and behavior remain compatible.'
      zh: '可见性会从使用位置检查完整路径。函数标成 pub，只表示它能在祖先模块允许的范围内传播；若祖先模块私有，外部调用方仍无法通过原路径命名它。把所有祖先都公开虽然能编译，却会把实现结构暴露成 API。pub use 可以为已有公开项在 crate root 等稳定边界创建另一条可达路径，同时保持内部模块私有。只要重导出路径和行为兼容，文件与内部嵌套就能调整，而不强迫调用方修改导入。'
    topics: [rust/modules-crates]
    level: intermediate
    section: { en: 'Visibility and APIs', zh: '可见性与 API' }
    frequency: common
    tags: [visibility, ancestor-path, pub-use, facade]

  - id: modules-library-binary-boundary
    question: { en: 'How should binaries and integration tests use a library crate in the same package?', zh: '二进制与集成测试应如何使用同一 package 中的 library crate？' }
    answer:
      en: 'Treat them as external consumers of the library. src/main.rs, each target under src/bin, and each integration test under tests compile as crates separate from src/lib.rs. Their crate:: paths start at their own roots, so they import the library by its crate name, such as store_domain for package store-domain. They can access only reachable pub API, not pub(crate) or private library items. Shared application logic therefore belongs in the library behind a deliberate public facade. This boundary also makes integration tests useful for proving that documented re-export paths really work for downstream callers.'
      zh: '应把它们当作库的外部使用方。src/main.rs、src/bin 下的每个目标以及 tests 下的每个集成测试，都会编译成与 src/lib.rs 分离的 crate。它们的 crate:: 从自己的根开始，所以要用库的 crate 名导入，例如 package store-domain 默认对应 store_domain。它们只能访问可达的 pub API，不能访问库中的 pub(crate) 或私有项。因此，共享应用逻辑应放进库，并通过明确的公共门面开放。这个边界也使集成测试适合验证文档中的重导出路径能否供下游调用。'
    topics: [rust/modules-crates]
    level: intermediate
    section: { en: 'Crate boundaries', zh: 'crate 边界' }
    frequency: occasional
    tags: [library-crate, binary-crate, integration-test, public-api]

  - id: strings-string-versus-str
    question: { en: 'How do String, str, and &str differ?', zh: 'String、str 与 &str 有什么区别？' }
    answer:
      en: 'String is an owned, growable buffer whose contents must be valid UTF-8. str is the dynamically sized string-slice type, so code normally uses it behind a pointer. &str is a shared borrow of valid UTF-8 bytes and carries a data pointer plus a byte length; it has no capacity and cannot grow. A literal is usually a static &str, while String::as_str returns a view into an owned buffer. Use &str for ordinary read-only parameters and String when a value must own, retain, or grow the text. Cloning a String copies its bytes; borrowing it does not.'
      zh: 'String 是拥有型、可增长的缓冲区，内容必须是有效 UTF-8。str 是动态大小的字符串切片类型，因此代码通常通过指针使用它。&str 是对有效 UTF-8 字节的共享借用，携带数据地址与字节长度，没有容量，也不能增长。字面量通常是静态 &str，而 String::as_str 返回拥有型缓冲区的视图。普通只读参数应使用 &str；需要持有、保留或增长文本时使用 String。克隆 String 会复制字节，借用则不会。'
    topics: [rust/strings]
    level: beginner
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [string, str, borrowing, ownership]

  - id: strings-indexing-and-length
    question: { en: 'Why does Rust reject integer indexing on strings, and what does len return?', zh: 'Rust 为什么拒绝字符串整数索引？len 返回什么？' }
    answer:
      en: 'A Rust string is UTF-8, so one Unicode scalar value occupies one to four bytes. An integer index is ambiguous: it could mean a byte, scalar value, or user-perceived grapheme cluster, and finding the nth scalar is not constant time. Rust therefore provides no text[0] operation. len returns the stored byte length. Use bytes for byte-oriented protocols, chars for scalar values, and a Unicode segmentation implementation for grapheme clusters. Range slicing is still byte-based and requires both endpoints to be character boundaries. get returns None for a bad boundary, whereas direct range indexing panics.'
      zh: 'Rust 字符串采用 UTF-8，一个 Unicode 标量值占一到四个字节。整数索引的含义并不明确：它可能表示字节、标量值或用户感知的字素簇，而且寻找第 n 个标量值不是常数时间操作。因此 Rust 不提供 text[0]。len 返回已存储的字节长度。面向协议时可用 bytes，处理标量值时用 chars，处理字素簇则需 Unicode 分段实现。范围切片仍按字节计算，两个端点都必须是字符边界；非法边界下 get 返回 None，直接范围索引会 panic。'
    topics: [rust/strings]
    level: beginner
    section: { en: 'UTF-8 text', zh: 'UTF-8 文本' }
    frequency: common
    tags: [utf-8, indexing, byte-boundary, unicode]

  - id: strings-api-ownership
    question: { en: 'How do you choose string parameter and return types for a Rust API?', zh: '怎样为 Rust API 选择字符串参数和返回类型？' }
    answer:
      en: 'Start with ownership. A function that only reads during the call usually accepts &str, allowing literals and views into String values without allocation. Accept String when the function stores the input, sends it to another owner, or needs its growable buffer. Into<String> can be useful at a deliberate ownership boundary but hides an allocation that callers should understand. Return &str only when the result is a view into an input or other longer-lived storage and tie the lifetime accordingly. Return String when the function creates, formats, normalizes, or otherwise delivers independent text. Lifetime annotations cannot make a local temporary survive.'
      zh: '先判断所有权。只在调用期间读取文本的函数通常接收 &str，这样字面量和 String 视图都无需分配即可传入。函数要保存输入、交给其他所有者或使用可增长缓冲区时接收 String。Into<String> 适合明确的所有权边界，但它会隐藏调用方需要理解的分配。只有结果是输入或其他长生命周期存储的视图时才返回 &str，并建立相应生命周期关系。函数创建、格式化、规范化或交付独立文本时应返回 String；生命周期标注无法让局部临时值继续存活。'
    topics: [rust/strings]
    level: intermediate
    section: { en: 'API design', zh: 'API 设计' }
    frequency: common
    tags: [api-design, ownership, lifetime, allocation]

  - id: strings-unicode-units
    question: { en: 'What is the difference between bytes, Unicode scalar values, and grapheme clusters?', zh: '字节、Unicode 标量值和字素簇有什么区别？' }
    answer:
      en: 'Bytes are UTF-8 storage and I/O units. Rust char represents a Unicode scalar value, which excludes surrogate code points but may still be only part of what a user sees as one character. A grapheme cluster follows Unicode text-segmentation rules and may combine a base letter, marks, variation selectors, or joined emoji. len counts bytes and chars iterates scalar values; the standard library does not provide full grapheme segmentation or automatic normalization. Choose the unit from the domain. Buffer limits may count bytes, parser logic may inspect scalars, and cursor movement usually needs grapheme boundaries. None of these counts guarantees display width.'
      zh: '字节是 UTF-8 的存储与 I/O 单位。Rust 的 char 表示 Unicode 标量值，它排除代理码点，但仍可能只是用户所见一个字符的一部分。字素簇遵循 Unicode 文本分段规则，可能组合基础字母、标记、变体选择符或连接的 emoji。len 计算字节，chars 迭代标量值；标准库不提供完整字素簇分段，也不会自动规范化。单位应由领域决定：缓冲区限制可按字节，解析器可检查标量值，光标移动通常需要字素边界。这些计数都不能保证等于显示宽度。'
    topics: [rust/strings]
    level: intermediate
    section: { en: 'Unicode text', zh: 'Unicode 文本' }
    frequency: occasional
    tags: [unicode, scalar-value, grapheme-cluster, normalization]

  - id: box-rc-arc-selection
    question: { en: 'How do you choose among Box, Rc, Arc, and Weak?', zh: '怎样在 Box、Rc、Arc 与 Weak 之间选择？' }
    answer:
      en: 'Start with the ownership graph. Use Box when one owner needs heap indirection, such as a recursive node or owned trait object. Use Rc when several owners share one value but all access stays on one thread. Use Arc when shared ownership crosses threads and the inner type satisfies the necessary Send and Sync bounds. Use Weak for links that need to find an object without keeping it alive, especially parent pointers and subscriber registries. Decide on mutation separately: Rc and Arc share ownership, while RefCell, Mutex, RwLock, or atomics provide the relevant mutation discipline.'
      zh: '先画出所有权图。单一所有者需要堆间接层时使用 Box，例如递归节点或拥有型 trait 对象；多个所有者只在一个线程内共享时使用 Rc；共享跨越线程且内部类型满足 Send 与 Sync 约束时使用 Arc。某条边需要找到对象、却不应让对象继续存活时使用 Weak，父链接与订阅者注册表是典型场景。可变性要另行决定：Rc 与 Arc 解决共享所有权，RefCell、Mutex、RwLock 或原子类型负责相应的修改规则。'
    topics: [rust/box-rc-arc]
    level: beginner
    section: { en: 'Ownership and borrowing', zh: '所有权与借用' }
    frequency: common
    tags: [box, rc, arc, weak]

  - id: arc-thread-safety-boundary
    question: { en: 'Why does Arc not automatically make its inner value thread-safe?', zh: '为什么 Arc 不会自动让内部值变得线程安全？' }
    answer:
      en: 'Arc makes increments, decrements, and upgrades of the ownership counts safe across threads. It does not synchronize operations performed through T. Consequently, Arc<T> implements Send and Sync only when T satisfies the corresponding Send and Sync requirements; Arc<RefCell<T>> does not become a valid shared-mutation primitive. Read-only immutable data can often use Arc<T> directly. Shared mutation needs a type whose semantics cover that access, such as Mutex, RwLock, or atomics. The distinction prevents data races while keeping ownership lifetime and mutation policy as separate design decisions.'
      zh: 'Arc 只保证所有权计数的增加、减少和升级可以在线程间安全进行，并不为针对 T 的操作提供同步。因此，只有 T 满足相应的 Send 与 Sync 要求时，Arc<T> 才实现这些 trait；Arc<RefCell<T>> 不会变成合法的共享修改工具。不可变只读数据通常可以直接使用 Arc<T>。共享修改则需要 Mutex、RwLock 或原子类型等具有对应访问语义的工具。这个区别既防止数据竞争，也让所有权生存期与修改策略保持为两个独立设计决定。'
    topics: [rust/box-rc-arc]
    level: intermediate
    section: { en: 'Concurrency', zh: '并发' }
    frequency: common
    tags: [arc, send, sync, interior-mutability]

  - id: weak-breaks-ownership-cycles
    question: { en: 'How does Weak break an Rc or Arc ownership cycle?', zh: 'Weak 怎样打破 Rc 或 Arc 的所有权环？' }
    answer:
      en: 'A strong Rc or Arc keeps T alive, so a closed path of strong edges can leave every count above zero after external owners disappear. Weak represents a non-owning edge: downgrade creates it without increasing the strong count, and upgrade returns an Option because the target may already be gone. Model the edge according to domain ownership, commonly strong from parent to child and weak from child to parent. For registries, store weak subscribers when registration should not extend subscriber lifetime, and prune entries whose upgrade returns None.'
      zh: '强 Rc 或 Arc 会让 T 保持存活，因此强边组成闭合路径后，即使外部所有者全部消失，环内计数也可能始终大于零。Weak 表示非拥有边：downgrade 创建弱指针时不增加强计数，upgrade 返回 Option，因为目标可能已经结束。应按领域所有权选择边的方向，常见做法是父到子使用强引用，子到父使用弱引用。若注册行为不应延长订阅者生存期，注册表也应保存弱指针，并清理升级结果为 None 的条目。'
    topics: [rust/box-rc-arc]
    level: intermediate
    section: { en: 'Ownership graphs', zh: '所有权图' }
    frequency: common
    tags: [weak, strong-reference-cycle, ownership-graph]

  - id: get-mut-versus-make-mut
    question: { en: 'How do get_mut and make_mut differ on Rc and Arc?', zh: 'Rc 与 Arc 上的 get_mut 和 make_mut 有什么区别？' }
    answer:
      en: 'get_mut returns a mutable reference only when no other strong or weak pointer refers to the allocation; otherwise it returns None and never clones. make_mut requires T: Clone and guarantees mutable access with copy-on-write behavior. If another strong owner exists, it clones T into an independent allocation for the current handle. If there is only one strong owner but weak pointers remain, make_mut may dissociate those weak pointers instead, after which they cannot upgrade. Neither an earlier strong_count observation nor value equality proves the uniqueness needed by get_mut.'
      zh: 'get_mut 只有在没有其他强指针或弱指针指向该分配时才返回可变引用，否则返回 None，并且绝不克隆。make_mut 要求 T: Clone，并以写时复制语义保证可变访问；存在其他强所有者时，它会为当前句柄把 T 克隆到独立分配。若只有一个强所有者但仍有弱指针，make_mut 可以改为解除这些弱指针的关联，之后它们无法升级。较早读取的 strong_count 或值相等都不能证明 get_mut 所需的唯一性。'
    topics: [rust/box-rc-arc]
    level: advanced
    section: { en: 'Shared ownership internals', zh: '共享所有权原理' }
    frequency: occasional
    tags: [get-mut, make-mut, copy-on-write, weak]
