track: rust
items:
  - id: borrowing-shared-versus-mutable
    question: { en: 'What are Rust’s borrowing rules, and what do they prevent?', zh: 'Rust 的借用规则是什么？它们防止了什么问题？' }
    answer:
      en: 'For an overlapping region, Rust permits multiple shared references or one mutable reference, without conflicting use of both. Every reference must also remain valid for each use. Shared references support observation, while a mutable reference represents exclusive access and permits mutation. These constraints prevent dangling references and unsynchronized aliasing of ordinary data. They apply to actual use ranges rather than automatically lasting to the end of a block because non-lexical lifetimes use control-flow information. Interior-mutability types preserve the model by moving some checks to runtime or synchronization guards rather than removing the rules.'
      zh: '对同一或重叠区域，Rust 允许多个共享引用或一个可变引用，不能让两类访问发生冲突；每个引用在每次使用时还必须有效。共享引用用于观察，可变引用代表独占访问并允许修改。这些限制防止悬垂引用，以及对普通数据进行未同步的别名写入。借用区间不会自动持续到代码块末尾，因为非词法生命周期会利用控制流和实际使用信息。内部可变性类型也没有取消规则，而是把部分检查移到运行时或同步守卫上。'
    topics: [rust/borrowing-rules]
    level: beginner
    section: { en: 'Ownership and borrowing', zh: '所有权与借用' }
    frequency: common
    tags: [borrowing, shared-reference, mutable-reference]

  - id: borrowing-nll-last-use
    question: { en: 'How do non-lexical lifetimes change the way you read a borrow conflict?', zh: '非词法生命周期如何改变你对借用冲突的理解？' }
    answer:
      en: 'NLL lets the compiler infer a borrow region from later uses and control flow instead of extending every borrow to its enclosing brace. A shared reference can therefore be read for the last time and then be followed by a mutable borrow in the same lexical block. When diagnosing an error, identify the reference creation, the conflicting access, and the later use that keeps the first borrow active. NLL does not make dangling references legal or guarantee that every human-obvious access pattern is accepted. It makes valid regions more precise while preserving the same shared-versus-exclusive rules.'
      zh: 'NLL 让编译器根据后续使用和控制流推断借用区域，而不是让每次借用都延伸到包围它的右花括号。因此，共享引用在同一词法代码块中最后一次读取后，可以接着开始可变借用。诊断错误时，应找出引用创建点、冲突访问，以及让首次借用保持有效的后续使用。NLL 不会让悬垂引用合法，也不保证接受每种人能看出安全的访问模式。它只是更精确地计算有效区域，同时保留共享与独占规则。'
    topics: [rust/borrowing-rules]
    level: intermediate
    section: { en: 'Borrow analysis', zh: '借用分析' }
    frequency: common
    tags: [nll, control-flow, diagnostics]

  - id: borrowing-lifetime-annotations
    question: { en: 'What do lifetime annotations express, and what can they not do?', zh: '生命周期标注表达什么？它不能做什么？' }
    answer:
      en: 'A lifetime annotation names relationships among references in a type signature. For a function returning one of two borrowed strings, a shared lifetime parameter says the result cannot be used beyond the region where the relevant inputs remain valid. The compiler chooses concrete regions at each call; the annotation does not force arguments to have identical lexical scopes. It also cannot extend an owned value, turn a local allocation into static storage, or repair a reference to data destroyed on return. Return owned data when the function creates it, and return a borrow only when it originates from a valid input or static source.'
      zh: '生命周期标注在类型签名中命名引用之间的关系。函数返回两个借用字符串之一时，共享生命周期参数表示结果不能越过相关输入都有效的区域使用。编译器会在每次调用处选择具体区域；标注并不要求实参拥有完全相同的词法作用域。它也不能延长拥有型值的存活时间，不能把局部分配变成静态存储，更不能修复返回时即被销毁的数据引用。函数创建数据时应返回拥有型值；只有结果来自有效输入或静态来源时才返回借用。'
    topics: [rust/borrowing-rules]
    level: intermediate
    section: { en: 'Lifetimes', zh: '生命周期' }
    frequency: common
    tags: [lifetimes, return-reference, static]

  - id: borrowing-two-mutable-elements
    question: { en: 'How do you safely obtain mutable access to two elements selected by runtime indices?', zh: '怎样安全地可变访问由运行时索引选出的两个元素？' }
    answer:
      en: 'First reject equal and out-of-range indices. Directly indexing the same slice twice usually fails because the borrow checker conservatively treats the two places as possibly overlapping. Order the indices, split the slice at the larger index with split_at_mut, then take one element from each returned slice and restore the logical source and destination roles. The safe API proves that the regions do not overlap. Validate arithmetic and other domain preconditions before changing either element, so a later failure does not leave a partial update. Raw pointers are unnecessary for this ordinary case.'
      zh: '先拒绝相同索引与越界索引。直接对同一切片索引两次通常不能通过，因为借用检查器会保守地认为两个位置可能重叠。应先排列索引，再在较大索引处调用 split_at_mut 拆分切片，然后分别从两个返回切片中取得元素，并恢复业务上的来源与目标角色。这个安全 API 证明了两个区域不重叠。修改前还要验证算术与领域前置条件，避免后续失败留下部分更新。这个常见场景不需要裸指针。'
    topics: [rust/borrowing-rules]
    level: advanced
    section: { en: 'Disjoint access', zh: '不重叠访问' }
    frequency: occasional
    tags: [split-at-mut, indexing, mutable-reference]
