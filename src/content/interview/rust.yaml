track: rust
items:
  - id: borrowing-shared-versus-mutable
    question: { en: 'What are Rust’s borrowing rules, and what do they prevent?', zh: 'Rust 的借用规则是什么？它们防止了什么问题？' }
    answer:
      en: 'For an overlapping region, Rust permits multiple shared references or one mutable reference, without conflicting use of both. Every reference must also remain valid for each use. Shared references support observation, while a mutable reference represents exclusive access and permits mutation. These constraints prevent dangling references and unsynchronized aliasing of ordinary data. They apply to actual use ranges rather than automatically lasting to the end of a block because non-lexical lifetimes use control-flow information. Interior-mutability types preserve the model by moving some checks to runtime or synchronization guards rather than removing the rules.'
      zh: '对同一或重叠区域，Rust 允许多个共享引用或一个可变引用，不能让两类访问发生冲突；每个引用在每次使用时还必须有效。共享引用用于观察，可变引用代表独占访问并允许修改。这些限制防止悬垂引用，以及对普通数据进行未同步的别名写入。借用区间不会自动持续到代码块末尾，因为非词法生命周期会利用控制流和实际使用信息。内部可变性类型也没有取消规则，而是把部分检查移到运行时或同步守卫上。'
    topics: [rust/borrowing-rules]
    level: beginner
    section: { en: 'Ownership and borrowing', zh: '所有权与借用' }
    frequency: common
    tags: [borrowing, shared-reference, mutable-reference]

  - id: borrowing-nll-last-use
    question: { en: 'How do non-lexical lifetimes change the way you read a borrow conflict?', zh: '非词法生命周期如何改变你对借用冲突的理解？' }
    answer:
      en: 'NLL lets the compiler infer a borrow region from later uses and control flow instead of extending every borrow to its enclosing brace. A shared reference can therefore be read for the last time and then be followed by a mutable borrow in the same lexical block. When diagnosing an error, identify the reference creation, the conflicting access, and the later use that keeps the first borrow active. NLL does not make dangling references legal or guarantee that every human-obvious access pattern is accepted. It makes valid regions more precise while preserving the same shared-versus-exclusive rules.'
      zh: 'NLL 让编译器根据后续使用和控制流推断借用区域，而不是让每次借用都延伸到包围它的右花括号。因此，共享引用在同一词法代码块中最后一次读取后，可以接着开始可变借用。诊断错误时，应找出引用创建点、冲突访问，以及让首次借用保持有效的后续使用。NLL 不会让悬垂引用合法，也不保证接受每种人能看出安全的访问模式。它只是更精确地计算有效区域，同时保留共享与独占规则。'
    topics: [rust/borrowing-rules]
    level: intermediate
    section: { en: 'Borrow analysis', zh: '借用分析' }
    frequency: common
    tags: [nll, control-flow, diagnostics]

  - id: borrowing-lifetime-annotations
    question: { en: 'What do lifetime annotations express, and what can they not do?', zh: '生命周期标注表达什么？它不能做什么？' }
    answer:
      en: 'A lifetime annotation names relationships among references in a type signature. For a function returning one of two borrowed strings, a shared lifetime parameter says the result cannot be used beyond the region where the relevant inputs remain valid. The compiler chooses concrete regions at each call; the annotation does not force arguments to have identical lexical scopes. It also cannot extend an owned value, turn a local allocation into static storage, or repair a reference to data destroyed on return. Return owned data when the function creates it, and return a borrow only when it originates from a valid input or static source.'
      zh: '生命周期标注在类型签名中命名引用之间的关系。函数返回两个借用字符串之一时，共享生命周期参数表示结果不能越过相关输入都有效的区域使用。编译器会在每次调用处选择具体区域；标注并不要求实参拥有完全相同的词法作用域。它也不能延长拥有型值的存活时间，不能把局部分配变成静态存储，更不能修复返回时即被销毁的数据引用。函数创建数据时应返回拥有型值；只有结果来自有效输入或静态来源时才返回借用。'
    topics: [rust/borrowing-rules]
    level: intermediate
    section: { en: 'Lifetimes', zh: '生命周期' }
    frequency: common
    tags: [lifetimes, return-reference, static]

  - id: borrowing-two-mutable-elements
    question: { en: 'How do you safely obtain mutable access to two elements selected by runtime indices?', zh: '怎样安全地可变访问由运行时索引选出的两个元素？' }
    answer:
      en: 'First reject equal and out-of-range indices. Directly indexing the same slice twice usually fails because the borrow checker conservatively treats the two places as possibly overlapping. Order the indices, split the slice at the larger index with split_at_mut, then take one element from each returned slice and restore the logical source and destination roles. The safe API proves that the regions do not overlap. Validate arithmetic and other domain preconditions before changing either element, so a later failure does not leave a partial update. Raw pointers are unnecessary for this ordinary case.'
      zh: '先拒绝相同索引与越界索引。直接对同一切片索引两次通常不能通过，因为借用检查器会保守地认为两个位置可能重叠。应先排列索引，再在较大索引处调用 split_at_mut 拆分切片，然后分别从两个返回切片中取得元素，并恢复业务上的来源与目标角色。这个安全 API 证明了两个区域不重叠。修改前还要验证算术与领域前置条件，避免后续失败留下部分更新。这个常见场景不需要裸指针。'
    topics: [rust/borrowing-rules]
    level: advanced
    section: { en: 'Disjoint access', zh: '不重叠访问' }
    frequency: occasional
    tags: [split-at-mut, indexing, mutable-reference]

  - id: collections-hashmap-versus-btreemap
    question: { en: 'How do you choose between HashMap and BTreeMap?', zh: '怎样在 HashMap 与 BTreeMap 之间选择？' }
    answer:
      en: 'Start with the observable contract, not a blanket speed claim. HashMap models lookup by equality and hash and makes no iteration-order promise. BTreeMap requires Ord, iterates in key order, and supports range queries and first-or-last key operations. Choose BTreeMap when callers rely on ordered traversal, ranges, or reproducible key order throughout the model. Choose HashMap when those semantics are absent, then sort explicitly at a presentation boundary if only one output needs order. Also check whether the key type has a natural, consistent Ord implementation or only Eq and Hash.'
      zh: '先看可观察契约，不要先下笼统的速度结论。HashMap 按相等关系与哈希值查找，不承诺迭代顺序；BTreeMap 要求键实现 Ord，按键顺序迭代，并支持范围查询与首尾键操作。调用方持续依赖有序遍历、范围或可重复键顺序时，应选 BTreeMap。内部模型不需要这些语义时可选 HashMap；若只有一处输出要求顺序，就在展示边界显式排序。还要确认键是否具有自然且一致的 Ord 实现。'
    topics: [rust/collections]
    level: intermediate
    section: { en: 'Standard collections', zh: '标准集合' }
    frequency: common
    tags: [hashmap, btreemap, ordering]

  - id: collections-vec-growth-borrows
    question: { en: 'Why can growing a Vec conflict with an existing element reference?', zh: '为什么 Vec 增长会与已有元素引用冲突？' }
    answer:
      en: 'A Vec owns a contiguous buffer. When push needs more capacity, it may allocate another buffer, move the elements, and release the old allocation, which would leave an old element reference dangling. Rust therefore rejects a mutable vector operation while a reference borrowed from that vector is still needed later. Even when spare capacity happens to prevent reallocation, other mutations may shift elements or change which entity an index denotes. End the borrow before mutation, retain owned data when appropriate, or save a domain identifier and borrow again after the collection changes.'
      zh: 'Vec 拥有一段连续缓冲区。push 需要更多容量时，可能重新分配缓冲区、搬移元素并释放旧分配，旧元素引用会因此悬空。所以，只要从向量借出的引用之后仍要使用，Rust 就会拒绝对向量进行可变操作。即使剩余容量碰巧避免重新分配，其他修改也可能移动元素，或改变某个索引代表的业务实体。应在修改前结束借用；必要时保留拥有型数据，或保存领域标识，并在集合改变后重新借用。'
    topics: [rust/collections]
    level: intermediate
    section: { en: 'Ownership and allocation', zh: '所有权与分配' }
    frequency: common
    tags: [vec, borrowing, reallocation]

  - id: collections-entry-evaluation
    question: { en: 'What problem does HashMap::entry solve, and when does or_insert_with matter?', zh: 'HashMap::entry 解决什么问题？何时需要 or_insert_with？' }
    answer:
      en: 'entry turns the presence or absence of one key into an Occupied or Vacant state while the map is mutably borrowed. That lets counting, grouping, and conditional replacement use one coherent branch rather than contains_key followed by another lookup. or_insert returns a mutable reference to the stored value, inserting its argument for a vacant entry. The argument itself is evaluated eagerly, though, so or_insert(expensive()) still calls expensive for an occupied key. Use or_insert_with when construction should happen only on the vacant path, or or_default when Default is exactly what you need.'
      zh: 'entry 在映射被可变借用期间，把一个键的存在与否表示为 Occupied 或 Vacant 状态。计数、分组和条件替换因此可以在一次连贯分支中完成，不必先 contains_key 再查找。or_insert 返回已存值的可变引用，并在条目空缺时插入实参；但实参本身会提前求值，所以键已存在时，or_insert(expensive()) 仍会调用 expensive。只有空缺路径才应构造值时使用 or_insert_with；所需值正是 Default 时使用 or_default。'
    topics: [rust/collections]
    level: intermediate
    section: { en: 'Map updates', zh: '映射更新' }
    frequency: common
    tags: [entry-api, hashmap, lazy-evaluation]

  - id: collections-deterministic-deduplication
    question: { en: 'How would you deduplicate values while preserving first-seen order?', zh: '怎样在去重时保留首次出现顺序？' }
    answer:
      en: 'Do not collect straight into HashSet and then iterate it, because the set removes duplicates but does not preserve input order. Keep a result Vec and a membership HashSet. Walk the input once; when seen.insert(key) returns true, append the corresponding value to the result. Decide whether seen owns keys or borrows them from input based on the result lifetime and ownership contract. If output order should instead follow the key’s Ord implementation, collecting into BTreeSet expresses a different, sorted contract. Test interleaved duplicates, not just adjacent ones.'
      zh: '不要直接收集到 HashSet 后再迭代，因为它会去重，却不保留输入顺序。应同时维护结果 Vec 与成员 HashSet：单次遍历输入，当 seen.insert(key) 返回 true 时，才把对应值追加到结果。seen 应拥有键还是从输入借用，要根据结果的生命周期与所有权契约决定。如果输出本来就应按键的 Ord 排序，收集到 BTreeSet 表达的是另一种有序契约。测试应包含交错重复项，不能只测相邻重复。'
    topics: [rust/collections]
    level: intermediate
    section: { en: 'Set semantics', zh: '集合语义' }
    frequency: occasional
    tags: [hashset, vec, ordering]

  - id: iterators-iterator-versus-into-iterator
    question: { en: 'What is the difference between Iterator and IntoIterator?', zh: 'Iterator 与 IntoIterator 有什么区别？' }
    answer:
      en: 'Iterator is the stateful producer that has an Item type and a next method. IntoIterator is the conversion contract used to obtain such a producer from another value. A for loop accepts an IntoIterator, calls into_iter once, and then advances the resulting iterator. One collection may provide different IntoIterator implementations for an owned value, a shared reference, and a mutable reference. Those implementations can yield T, &T, and &mut T respectively, so checking only the loop syntax is not enough; you must also inspect the receiver and Item type.'
      zh: 'Iterator 是有状态的生产者，具有 Item 类型与 next 方法。IntoIterator 则是转换契约，用于从另一个值取得这样的生产者。for 循环接收 IntoIterator，先调用一次 into_iter，再推进得到的迭代器。同一个集合可以分别为拥有型值、共享引用和可变引用实现 IntoIterator，并相应产出 T、&T 或 &mut T。因此，判断所有权语义时不能只看循环语法，还要检查接收者和实际的 Item 类型。'
    topics: [rust/iterators]
    level: beginner
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [iterator, into-iterator, for-loop]

  - id: iterators-ownership-entry-points
    question: { en: 'How do iter, iter_mut, and into_iter differ on a Vec?', zh: 'Vec 上的 iter、iter_mut 与 into_iter 有何区别？' }
    answer:
      en: 'For a Vec<T>, iter borrows the vector and yields &T, so the collection remains available after iteration. iter_mut takes an exclusive borrow and yields &mut T, allowing in-place element changes while that borrow is active. Calling into_iter on the owned Vec consumes it and yields T, transferring each element to the caller. Choose from the ownership contract, not style. If later code still needs the vector, borrow it. If a result must own non-Copy elements, make the necessary clone or transformation explicit instead of cloning the whole collection preemptively.'
      zh: '对 Vec<T> 而言，iter 借用向量并产出 &T，所以迭代后仍可使用原集合。iter_mut 取得独占借用并产出 &mut T，允许在借用有效期间就地修改元素。对拥有型 Vec 调用 into_iter 会消费向量并产出 T，把每项所有权交给调用方。选择入口应依据所有权契约，而不是代码风格。后续仍需向量时就借用它；结果必须拥有非 Copy 元素时，应明确克隆或转换必要元素，不要预先克隆整个集合。'
    topics: [rust/iterators]
    level: beginner
    section: { en: 'Ownership and borrowing', zh: '所有权与借用' }
    frequency: common
    tags: [iter, iter-mut, into-iterator, ownership]

  - id: iterators-laziness-and-short-circuiting
    question: { en: 'How do laziness and short-circuiting affect an iterator pipeline?', zh: '惰性求值与短路如何影响迭代器管道？' }
    answer:
      en: 'Adapters such as map and filter store an upstream iterator and closures but do not request elements themselves. A consumer drives the chain one item at a time. Consumers such as find and any stop after a decisive item, while collect normally runs to exhaustion and fallible collection stops at the first error. Consequently, later inputs may never enter any closure. This matters for both work and side effects: logging or mutation inside inspect or map can run fewer times than the source length. Tests should cover where termination occurs, not only the final value.'
      zh: 'map 与 filter 等适配器只保存上游迭代器和闭包，自身不会请求元素。消费者按项驱动整条链。find 和 any 在遇到决定性元素后停止；普通 collect 通常运行到结束，而可失败收集会在第一个错误处停止。因此，后续输入可能根本不会进入任何闭包。这既影响计算量，也影响副作用：放在 inspect 或 map 中的日志与修改，执行次数可能少于来源长度。测试不能只看最终值，还要覆盖终止位置。'
    topics: [rust/iterators]
    level: intermediate
    section: { en: 'Evaluation model', zh: '求值模型' }
    frequency: common
    tags: [lazy-evaluation, short-circuiting, consumers]

  - id: iterators-fallible-collection
    question: { en: 'How do you collect parsed values without losing the first error?', zh: '怎样收集解析结果而不丢失第一个错误？' }
    answer:
      en: 'Map each input to Result<T, E> and collect the iterator into Result<Vec<T>, E>. The Result implementation of FromIterator gathers every Ok value and returns the first Err immediately, so later inputs are not evaluated. The target type must be visible through an annotation, return type, or turbofish. Using filter_map with Result::ok expresses a different contract: it discards errors and retains successes. That is valid only when rejected inputs are intentionally ignorable. For imports, configuration, money, or identifiers, silent dropping usually turns corrupted input into misleading partial success.'
      zh: '先把每项输入映射成 Result<T, E>，再把迭代器收集成 Result<Vec<T>, E>。Result 的 FromIterator 实现会收集所有 Ok，并在第一个 Err 处立即返回，因此之后的输入不会求值。目标类型必须通过标注、返回类型或 turbofish 明确。使用 filter_map 与 Result::ok 表达的是另一种契约：丢弃错误，只保留成功项。只有坏输入本来就允许忽略时才适用；对于导入、配置、金额或标识符，静默丢弃通常会把损坏输入伪装成部分成功。'
    topics: [rust/iterators]
    level: intermediate
    section: { en: 'Error handling', zh: '错误处理' }
    frequency: occasional
    tags: [result, from-iterator, collect, error-handling]

  - id: modules-package-crate-module
    question: { en: 'How do a Cargo package, a crate, and a module differ?', zh: 'Cargo package、crate 与模块有什么区别？' }
    answer:
      en: 'A Cargo package is the unit described by one Cargo.toml and may contain multiple build targets. Each target is a crate: one library or executable compiled as a unit, with its own crate root and module tree. A package can have at most one library crate and multiple binary crates. Modules live inside a crate and organize items, paths, and visibility; they are not independent Cargo targets. Keeping these levels separate explains why src/lib.rs and src/main.rs in one package cannot share private items or use crate:: to reach the same root.'
      zh: 'Cargo package 由一份 Cargo.toml 描述，可以包含多个构建目标。每个目标都是一个 crate，即独立编译的库或可执行程序，并拥有自己的 crate root 与模块树。一个 package 最多包含一个 library crate，却可以包含多个 binary crate。模块位于 crate 内，用来组织 item、路径和可见性，不是独立 Cargo 目标。区分这三层后，就能理解为何同一 package 中的 src/lib.rs 与 src/main.rs 不能共享私有项，crate:: 也不会指向同一个根。'
    topics: [rust/modules-crates]
    level: beginner
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [package, crate, module, crate-root]

  - id: modules-declaration-file-mapping
    question: { en: 'How does Rust map mod declarations to files, and what role does use play?', zh: 'Rust 如何把 mod 声明映射到文件？use 在其中起什么作用？' }
    answer:
      en: 'An inline mod name { ... } defines a child module in place. A declaration such as mod catalog; defines the same logical child but loads its body from the conventional catalog.rs or catalog/mod.rs location; both candidate entry files cannot represent that module simultaneously. Child file lookup follows the logical parent, so a declaration inside catalog belongs under catalog/. Merely creating a file under src does not attach it to a crate. use operates after the module exists: it binds an existing path into one scope, but it neither declares a module nor controls which files compile.'
      zh: '内联的 mod name { ... } 会在当前位置定义子模块。mod catalog; 声明同一个逻辑子模块，但从常规的 catalog.rs 或 catalog/mod.rs 读取内容；两个候选入口不能同时表示该模块。子模块的文件查找跟随逻辑父级，所以 catalog 内的声明对应 catalog/ 下的文件。仅在 src 中创建文件不会把它接入 crate。use 只在模块已经存在后，把已有路径绑定到一个作用域；它既不声明模块，也不决定哪些文件参与编译。'
    topics: [rust/modules-crates]
    level: intermediate
    section: { en: 'Modules and paths', zh: '模块与路径' }
    frequency: common
    tags: [mod, file-layout, use, module-tree]

  - id: modules-visibility-reexports
    question: { en: 'Why can a pub item remain unreachable, and how does pub use help?', zh: '为什么 pub 项仍可能不可达？pub use 如何解决这个问题？' }
    answer:
      en: 'Visibility is checked from the use site across the complete path. Marking a function pub allows access only as far as its ancestor modules permit, so an external caller still cannot name it through a private ancestor. Making every ancestor public works but exposes implementation structure as API. pub use creates another reachable path to the existing public item, often at the crate root, while the internal module can remain private. This supports a stable facade: files and internal nesting may change without forcing callers to change imports, provided the re-exported path and behavior remain compatible.'
      zh: '可见性会从使用位置检查完整路径。函数标成 pub，只表示它能在祖先模块允许的范围内传播；若祖先模块私有，外部调用方仍无法通过原路径命名它。把所有祖先都公开虽然能编译，却会把实现结构暴露成 API。pub use 可以为已有公开项在 crate root 等稳定边界创建另一条可达路径，同时保持内部模块私有。只要重导出路径和行为兼容，文件与内部嵌套就能调整，而不强迫调用方修改导入。'
    topics: [rust/modules-crates]
    level: intermediate
    section: { en: 'Visibility and APIs', zh: '可见性与 API' }
    frequency: common
    tags: [visibility, ancestor-path, pub-use, facade]

  - id: modules-library-binary-boundary
    question: { en: 'How should binaries and integration tests use a library crate in the same package?', zh: '二进制与集成测试应如何使用同一 package 中的 library crate？' }
    answer:
      en: 'Treat them as external consumers of the library. src/main.rs, each target under src/bin, and each integration test under tests compile as crates separate from src/lib.rs. Their crate:: paths start at their own roots, so they import the library by its crate name, such as store_domain for package store-domain. They can access only reachable pub API, not pub(crate) or private library items. Shared application logic therefore belongs in the library behind a deliberate public facade. This boundary also makes integration tests useful for proving that documented re-export paths really work for downstream callers.'
      zh: '应把它们当作库的外部使用方。src/main.rs、src/bin 下的每个目标以及 tests 下的每个集成测试，都会编译成与 src/lib.rs 分离的 crate。它们的 crate:: 从自己的根开始，所以要用库的 crate 名导入，例如 package store-domain 默认对应 store_domain。它们只能访问可达的 pub API，不能访问库中的 pub(crate) 或私有项。因此，共享应用逻辑应放进库，并通过明确的公共门面开放。这个边界也使集成测试适合验证文档中的重导出路径能否供下游调用。'
    topics: [rust/modules-crates]
    level: intermediate
    section: { en: 'Crate boundaries', zh: 'crate 边界' }
    frequency: occasional
    tags: [library-crate, binary-crate, integration-test, public-api]

  - id: strings-string-versus-str
    question: { en: 'How do String, str, and &str differ?', zh: 'String、str 与 &str 有什么区别？' }
    answer:
      en: 'String is an owned, growable buffer whose contents must be valid UTF-8. str is the dynamically sized string-slice type, so code normally uses it behind a pointer. &str is a shared borrow of valid UTF-8 bytes and carries a data pointer plus a byte length; it has no capacity and cannot grow. A literal is usually a static &str, while String::as_str returns a view into an owned buffer. Use &str for ordinary read-only parameters and String when a value must own, retain, or grow the text. Cloning a String copies its bytes; borrowing it does not.'
      zh: 'String 是拥有型、可增长的缓冲区，内容必须是有效 UTF-8。str 是动态大小的字符串切片类型，因此代码通常通过指针使用它。&str 是对有效 UTF-8 字节的共享借用，携带数据地址与字节长度，没有容量，也不能增长。字面量通常是静态 &str，而 String::as_str 返回拥有型缓冲区的视图。普通只读参数应使用 &str；需要持有、保留或增长文本时使用 String。克隆 String 会复制字节，借用则不会。'
    topics: [rust/strings]
    level: beginner
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [string, str, borrowing, ownership]

  - id: strings-indexing-and-length
    question: { en: 'Why does Rust reject integer indexing on strings, and what does len return?', zh: 'Rust 为什么拒绝字符串整数索引？len 返回什么？' }
    answer:
      en: 'A Rust string is UTF-8, so one Unicode scalar value occupies one to four bytes. An integer index is ambiguous: it could mean a byte, scalar value, or user-perceived grapheme cluster, and finding the nth scalar is not constant time. Rust therefore provides no text[0] operation. len returns the stored byte length. Use bytes for byte-oriented protocols, chars for scalar values, and a Unicode segmentation implementation for grapheme clusters. Range slicing is still byte-based and requires both endpoints to be character boundaries. get returns None for a bad boundary, whereas direct range indexing panics.'
      zh: 'Rust 字符串采用 UTF-8，一个 Unicode 标量值占一到四个字节。整数索引的含义并不明确：它可能表示字节、标量值或用户感知的字素簇，而且寻找第 n 个标量值不是常数时间操作。因此 Rust 不提供 text[0]。len 返回已存储的字节长度。面向协议时可用 bytes，处理标量值时用 chars，处理字素簇则需 Unicode 分段实现。范围切片仍按字节计算，两个端点都必须是字符边界；非法边界下 get 返回 None，直接范围索引会 panic。'
    topics: [rust/strings]
    level: beginner
    section: { en: 'UTF-8 text', zh: 'UTF-8 文本' }
    frequency: common
    tags: [utf-8, indexing, byte-boundary, unicode]

  - id: strings-api-ownership
    question: { en: 'How do you choose string parameter and return types for a Rust API?', zh: '怎样为 Rust API 选择字符串参数和返回类型？' }
    answer:
      en: 'Start with ownership. A function that only reads during the call usually accepts &str, allowing literals and views into String values without allocation. Accept String when the function stores the input, sends it to another owner, or needs its growable buffer. Into<String> can be useful at a deliberate ownership boundary but hides an allocation that callers should understand. Return &str only when the result is a view into an input or other longer-lived storage and tie the lifetime accordingly. Return String when the function creates, formats, normalizes, or otherwise delivers independent text. Lifetime annotations cannot make a local temporary survive.'
      zh: '先判断所有权。只在调用期间读取文本的函数通常接收 &str，这样字面量和 String 视图都无需分配即可传入。函数要保存输入、交给其他所有者或使用可增长缓冲区时接收 String。Into<String> 适合明确的所有权边界，但它会隐藏调用方需要理解的分配。只有结果是输入或其他长生命周期存储的视图时才返回 &str，并建立相应生命周期关系。函数创建、格式化、规范化或交付独立文本时应返回 String；生命周期标注无法让局部临时值继续存活。'
    topics: [rust/strings]
    level: intermediate
    section: { en: 'API design', zh: 'API 设计' }
    frequency: common
    tags: [api-design, ownership, lifetime, allocation]

  - id: strings-unicode-units
    question: { en: 'What is the difference between bytes, Unicode scalar values, and grapheme clusters?', zh: '字节、Unicode 标量值和字素簇有什么区别？' }
    answer:
      en: 'Bytes are UTF-8 storage and I/O units. Rust char represents a Unicode scalar value, which excludes surrogate code points but may still be only part of what a user sees as one character. A grapheme cluster follows Unicode text-segmentation rules and may combine a base letter, marks, variation selectors, or joined emoji. len counts bytes and chars iterates scalar values; the standard library does not provide full grapheme segmentation or automatic normalization. Choose the unit from the domain. Buffer limits may count bytes, parser logic may inspect scalars, and cursor movement usually needs grapheme boundaries. None of these counts guarantees display width.'
      zh: '字节是 UTF-8 的存储与 I/O 单位。Rust 的 char 表示 Unicode 标量值，它排除代理码点，但仍可能只是用户所见一个字符的一部分。字素簇遵循 Unicode 文本分段规则，可能组合基础字母、标记、变体选择符或连接的 emoji。len 计算字节，chars 迭代标量值；标准库不提供完整字素簇分段，也不会自动规范化。单位应由领域决定：缓冲区限制可按字节，解析器可检查标量值，光标移动通常需要字素边界。这些计数都不能保证等于显示宽度。'
    topics: [rust/strings]
    level: intermediate
    section: { en: 'Unicode text', zh: 'Unicode 文本' }
    frequency: occasional
    tags: [unicode, scalar-value, grapheme-cluster, normalization]

  - id: box-rc-arc-selection
    question: { en: 'How do you choose among Box, Rc, Arc, and Weak?', zh: '怎样在 Box、Rc、Arc 与 Weak 之间选择？' }
    answer:
      en: 'Start with the ownership graph. Use Box when one owner needs heap indirection, such as a recursive node or owned trait object. Use Rc when several owners share one value but all access stays on one thread. Use Arc when shared ownership crosses threads and the inner type satisfies the necessary Send and Sync bounds. Use Weak for links that need to find an object without keeping it alive, especially parent pointers and subscriber registries. Decide on mutation separately: Rc and Arc share ownership, while RefCell, Mutex, RwLock, or atomics provide the relevant mutation discipline.'
      zh: '先画出所有权图。单一所有者需要堆间接层时使用 Box，例如递归节点或拥有型 trait 对象；多个所有者只在一个线程内共享时使用 Rc；共享跨越线程且内部类型满足 Send 与 Sync 约束时使用 Arc。某条边需要找到对象、却不应让对象继续存活时使用 Weak，父链接与订阅者注册表是典型场景。可变性要另行决定：Rc 与 Arc 解决共享所有权，RefCell、Mutex、RwLock 或原子类型负责相应的修改规则。'
    topics: [rust/box-rc-arc]
    level: beginner
    section: { en: 'Ownership and borrowing', zh: '所有权与借用' }
    frequency: common
    tags: [box, rc, arc, weak]

  - id: arc-thread-safety-boundary
    question: { en: 'Why does Arc not automatically make its inner value thread-safe?', zh: '为什么 Arc 不会自动让内部值变得线程安全？' }
    answer:
      en: 'Arc makes increments, decrements, and upgrades of the ownership counts safe across threads. It does not synchronize operations performed through T. Consequently, Arc<T> implements Send and Sync only when T satisfies the corresponding Send and Sync requirements; Arc<RefCell<T>> does not become a valid shared-mutation primitive. Read-only immutable data can often use Arc<T> directly. Shared mutation needs a type whose semantics cover that access, such as Mutex, RwLock, or atomics. The distinction prevents data races while keeping ownership lifetime and mutation policy as separate design decisions.'
      zh: 'Arc 只保证所有权计数的增加、减少和升级可以在线程间安全进行，并不为针对 T 的操作提供同步。因此，只有 T 满足相应的 Send 与 Sync 要求时，Arc<T> 才实现这些 trait；Arc<RefCell<T>> 不会变成合法的共享修改工具。不可变只读数据通常可以直接使用 Arc<T>。共享修改则需要 Mutex、RwLock 或原子类型等具有对应访问语义的工具。这个区别既防止数据竞争，也让所有权生存期与修改策略保持为两个独立设计决定。'
    topics: [rust/box-rc-arc]
    level: intermediate
    section: { en: 'Concurrency', zh: '并发' }
    frequency: common
    tags: [arc, send, sync, interior-mutability]

  - id: weak-breaks-ownership-cycles
    question: { en: 'How does Weak break an Rc or Arc ownership cycle?', zh: 'Weak 怎样打破 Rc 或 Arc 的所有权环？' }
    answer:
      en: 'A strong Rc or Arc keeps T alive, so a closed path of strong edges can leave every count above zero after external owners disappear. Weak represents a non-owning edge: downgrade creates it without increasing the strong count, and upgrade returns an Option because the target may already be gone. Model the edge according to domain ownership, commonly strong from parent to child and weak from child to parent. For registries, store weak subscribers when registration should not extend subscriber lifetime, and prune entries whose upgrade returns None.'
      zh: '强 Rc 或 Arc 会让 T 保持存活，因此强边组成闭合路径后，即使外部所有者全部消失，环内计数也可能始终大于零。Weak 表示非拥有边：downgrade 创建弱指针时不增加强计数，upgrade 返回 Option，因为目标可能已经结束。应按领域所有权选择边的方向，常见做法是父到子使用强引用，子到父使用弱引用。若注册行为不应延长订阅者生存期，注册表也应保存弱指针，并清理升级结果为 None 的条目。'
    topics: [rust/box-rc-arc]
    level: intermediate
    section: { en: 'Ownership graphs', zh: '所有权图' }
    frequency: common
    tags: [weak, strong-reference-cycle, ownership-graph]

  - id: get-mut-versus-make-mut
    question: { en: 'How do get_mut and make_mut differ on Rc and Arc?', zh: 'Rc 与 Arc 上的 get_mut 和 make_mut 有什么区别？' }
    answer:
      en: 'get_mut returns a mutable reference only when no other strong or weak pointer refers to the allocation; otherwise it returns None and never clones. make_mut requires T: Clone and guarantees mutable access with copy-on-write behavior. If another strong owner exists, it clones T into an independent allocation for the current handle. If there is only one strong owner but weak pointers remain, make_mut may dissociate those weak pointers instead, after which they cannot upgrade. Neither an earlier strong_count observation nor value equality proves the uniqueness needed by get_mut.'
      zh: 'get_mut 只有在没有其他强指针或弱指针指向该分配时才返回可变引用，否则返回 None，并且绝不克隆。make_mut 要求 T: Clone，并以写时复制语义保证可变访问；存在其他强所有者时，它会为当前句柄把 T 克隆到独立分配。若只有一个强所有者但仍有弱指针，make_mut 可以改为解除这些弱指针的关联，之后它们无法升级。较早读取的 strong_count 或值相等都不能证明 get_mut 所需的唯一性。'
    topics: [rust/box-rc-arc]
    level: advanced
    section: { en: 'Shared ownership internals', zh: '共享所有权原理' }
    frequency: occasional
    tags: [get-mut, make-mut, copy-on-write, weak]

  - id: closure-capture-versus-call-traits
    question: { en: 'How do capture modes differ from the Fn, FnMut, and FnOnce traits?', zh: '闭包捕获方式与 Fn、FnMut、FnOnce trait 有什么区别？' }
    answer:
      en: 'A capture mode describes how an outside place enters the closure: through a shared, unique immutable, or mutable borrow, or by value. The call traits describe what a call does with the stored environment. Every closure implements FnOnce; one that does not move out a capture also implements FnMut, and one that neither moves out nor mutates captures also implements Fn. The distinction matters because move changes capture mode but does not force FnOnce. A move closure that only reads an owned String may still implement Fn and be called repeatedly.'
      zh: '捕获方式描述外部位置怎样进入闭包：通过共享借用、唯一不可变借用、可变借用或按值捕获。调用 trait 描述调用时如何使用已经保存的环境。所有闭包都实现 FnOnce；不移出捕获值的闭包还实现 FnMut；既不移出也不修改捕获值的闭包还实现 Fn。两者必须分开理解，因为 move 只改变捕获方式，不会强制闭包只能实现 FnOnce。按值拥有 String 却只读取它的 move 闭包仍可实现 Fn 并重复调用。'
    topics: [rust/closures]
    level: intermediate
    section: { en: 'Closures', zh: '闭包' }
    frequency: common
    tags: [closures, capture, fn, fn-mut, fn-once]

  - id: closure-selecting-call-bound
    question: { en: 'How do you choose a closure bound for a callback parameter?', zh: '怎样为回调参数选择闭包 trait 约束？' }
    answer:
      en: 'Start with the implementation’s call count and receiver needs. If it calls at most once, accept FnOnce; this also admits FnMut and Fn closures. If it repeats calls and may allow captured state to change, use FnMut and bind the parameter mutably. Require Fn only when calls must work through shared access, such as a callback shared among readers. Then specify argument and result ownership independently: Fn(&str) and Fn(String) expose different boundaries. Choosing the strongest-looking trait is counterproductive because it rejects valid stateful or consuming callbacks without adding speed.'
      zh: '先看实现会调用几次，以及需要哪种接收方式。最多调用一次时接受 FnOnce，它也能接收 FnMut 与 Fn 闭包。需要重复调用并允许捕获状态变化时使用 FnMut，同时把参数绑定为可变。只有调用必须通过共享访问完成时才要求 Fn，例如多个读者共享同一回调。参数与结果的所有权要另行确定：Fn(&str) 与 Fn(String) 暴露的是不同边界。选择看起来最强的 trait 不会提升速度，只会排除合法的有状态或消费型回调。'
    topics: [rust/closures]
    level: intermediate
    section: { en: 'API design', zh: 'API 设计' }
    frequency: common
    tags: [closures, trait-bound, callback, api-design]

  - id: closure-impl-trait-versus-dyn
    question: { en: 'When should a function return impl Fn, and when should it return Box<dyn Fn>?', zh: '函数何时应返回 impl Fn，何时应返回 Box<dyn Fn>？' }
    answer:
      en: 'Return impl Fn when every control-flow path produces one concrete closure type. It hides that unnameable type while preserving static dispatch and avoiding an obligatory allocation. Separate closure expressions have distinct types, so two unrelated branch closures cannot directly satisfy one opaque return type. Use Box<dyn Fn> when runtime choice or a heterogeneous collection needs type erasure and owned storage. At that boundary, state the object lifetime and any Send or Sync requirements. If every candidate captures nothing, a function pointer may be simpler; a closed set of behaviors may be clearer as an enum.'
      zh: '所有控制流路径都产生同一种具体闭包类型时返回 impl Fn。它隐藏无法写出的类型，同时保留静态分发，也不强制分配。不同闭包表达式具有不同类型，所以两个无关的分支闭包不能直接满足同一个不透明返回类型。运行时选择或异构集合需要类型擦除与拥有型存储时使用 Box<dyn Fn>，并在边界声明对象生命周期以及 Send、Sync 要求。若候选都不捕获环境，函数指针可能更简单；行为集合固定时，枚举通常更清楚。'
    topics: [rust/closures]
    level: advanced
    section: { en: 'Type erasure', zh: '类型擦除' }
    frequency: occasional
    tags: [impl-trait, trait-object, dynamic-dispatch, function-pointer]

  - id: closure-move-and-static
    question: { en: 'Why does adding move not necessarily satisfy a static callback requirement?', zh: '为什么添加 move 不一定能满足回调的 static 要求？' }
    answer:
      en: 'move transfers each captured place into the closure, but the captured value may itself be a reference. Moving an &str copies that reference; it does not copy or extend the lifetime of the text behind it. A static bound requires the closure type to contain no borrow that expires too early for the storage or thread boundary. I trace every capture to its owner, then move an owned String, Vec, Arc, or another suitable value when the callback must be independent. Mechanically adding static cannot lengthen a local, and broad cloning can hide a poor ownership design.'
      zh: 'move 会把每个捕获位置转移进闭包，但捕获值本身可能是一条引用。移动 &str 只会复制引用，不会复制背后的文本，也不会延长其生命周期。static 约束要求闭包类型不能包含早于存储或线程边界失效的借用。我会把每个捕获追踪到所有者；回调必须独立时，再移入 String、Vec、Arc 或其他合适的拥有型值。机械添加 static 无法延长局部值的生命，而大范围克隆还可能掩盖糟糕的所有权设计。'
    topics: [rust/closures]
    level: intermediate
    section: { en: 'Lifetimes and threads', zh: '生命周期与线程' }
    frequency: common
    tags: [move-closure, static, lifetime, send]

  - id: lifetime-annotations-contract
    question: { en: 'What do lifetime annotations express, and what can they not change?', zh: '生命周期标注表达什么？它不能改变什么？' }
    answer:
      en: 'Lifetime annotations express relationships among references in a type signature. They tell the compiler which inputs can supply a returned borrow and how long the caller may use it. The compiler chooses concrete regions at each call, so a shared name does not require identical lexical scopes. An annotation cannot extend an owner, move data into static storage, or make a reference to a local allocation valid after return. If a function creates the result, it normally returns an owned value. If it returns a borrow, that borrow must trace to a valid input, field, or static item.'
      zh: '生命周期标注在类型签名中表达引用之间的关系，说明哪些输入可以提供返回借用，以及调用方可以使用结果多久。编译器会在每次调用时选择具体区域，所以共享名称并不要求相同的词法作用域。标注不能延长所有者寿命，不能把数据移入静态存储，也不能让局部分配的引用在函数返回后继续有效。函数创建结果时通常应返回拥有型值；返回借用时，必须能把它追溯到有效输入、字段或静态项。'
    topics: [rust/lifetime-annotations]
    level: intermediate
    section: { en: 'Ownership and borrowing', zh: '所有权与借用' }
    frequency: common
    tags: [lifetime-annotation, borrowed-return, api-contract]

  - id: lifetime-annotations-shared-name
    question: { en: 'What does using the same lifetime name for two inputs and an output really mean?', zh: '两个输入与输出使用同一生命周期名称，真正意味着什么？' }
    answer:
      en: 'It means there must be a caller-chosen region in which both input borrows are valid and in which the returned reference may be used. The owners do not need identical lexical scopes; a longer borrow can be shortened to the common region. The signature also permits the implementation to return either input, so the result is conservatively limited by both. If the implementation can only return the first input, giving the second a different or elided lifetime is more precise. That prevents an unrelated short-lived argument from needlessly restricting the returned reference.'
      zh: '它表示必须存在一个由调用方选择的区域：两个输入借用在其中都有效，返回引用也只能在其中使用。两个所有者不必拥有相同的词法作用域；较长借用可以缩短到共同区域。签名还允许实现返回任一输入，所以结果会保守地同时受两者限制。若实现只可能返回第一个输入，就应给第二个输入独立或省略的生命周期，避免无关的短期参数不必要地限制返回引用。'
    topics: [rust/lifetime-annotations]
    level: intermediate
    section: { en: 'Function signatures', zh: '函数签名' }
    frequency: common
    tags: [lifetime-parameter, common-region, precision]

  - id: lifetime-annotations-static-distinction
    question: { en: 'How do a static reference and a static type bound differ?', zh: '静态引用与静态类型边界有什么区别？' }
    answer:
      en: 'A static reference points to data guaranteed valid for the entire program, as with string literals and static items. A T: static bound instead says that values of T contain no borrowed data that expires sooner. An owned String satisfies that bound because it contains its allocation by ownership, yet the String can still be dropped at any ordinary scope boundary. Moving a reference into a closure does not make its referent static. Thread and stored-callback APIs often need the type bound, so callers should move owned data or appropriate shared ownership rather than leak memory or forge a lifetime.'
      zh: '静态引用指向保证在整个程序执行期都有效的数据，例如字符串字面量和 static 项。T 的静态类型边界则表示该类型的值不包含更早失效的借用。拥有型 String 自己拥有分配，因此满足该边界，但仍可在普通作用域末尾销毁。把引用移入闭包不会让引用目标变成静态数据。线程与持久化回调 API 常需要类型边界，调用方应移动拥有型数据或合适的共享所有权，而不是泄漏内存或伪造生命周期。'
    topics: [rust/lifetime-annotations]
    level: intermediate
    section: { en: 'Static boundaries', zh: '静态边界' }
    frequency: common
    tags: [static-lifetime, type-bound, threads]

  - id: lifetime-annotations-hrtb
    question: { en: 'When does a higher-ranked trait bound solve a lifetime problem?', zh: '高阶 trait 约束何时能解决生命周期问题？' }
    answer:
      en: 'Use a higher-ranked trait bound when the callee, rather than the outer caller, must choose a fresh lifetime for each invocation. A bound such as F: for<a> Fn(&a str) -> &a str requires F to preserve the input-output relationship for every suitable borrow duration. This appears when a method borrows its own local data and calls a stored generic function, because that borrow cannot be named at the outer API boundary. A single ordinary lifetime parameter would select one region too early. Common function-pointer elision can imply the same relationship, but explicit for syntax makes complex generic contracts reviewable.'
      zh: '当被调用方需要在每次调用时选择新的生命周期，而不是由外层调用方提前选择一次时，应使用高阶 trait 约束。形如 F: for<a> Fn(&a str) -> &a str 的边界，要求 F 对每个合适的借用时长都保持输入输出关系。方法借用自身局部数据并调用已保存泛型函数时，这种借用无法在外层 API 边界命名，因此常需要该约束。普通单一生命周期会过早固定区域；函数指针省略有时隐含同样关系，但显式 for 语法更便于审查复杂契约。'
    topics: [rust/lifetime-annotations]
    level: advanced
    section: { en: 'Generic bounds', zh: '泛型边界' }
    frequency: occasional
    tags: [hrtb, for-lifetime, callback]

  - id: lifetimes-region-versus-scope
    question: { en: 'Why is a Rust lifetime not simply the lexical scope of a reference variable?', zh: '为什么 Rust 生命周期不等同于引用变量的词法作用域？' }
    answer:
      en: 'A lifetime is the region in which a reference may be used safely, not necessarily the whole block where its binding is visible. With non-lexical lifetimes, the compiler uses control flow and actual uses to end a borrow after its last use. The owner can continue to exist, and the reference binding can remain in lexical scope without keeping the borrow active. When diagnosing a conflict, I identify reference creation, the conflicting access, and the later use that keeps the borrow alive. Closing braces alone do not determine that timeline.'
      zh: '生命周期表示引用可以安全使用的区域，不一定覆盖其绑定可见的整个代码块。借助非词法生命周期，编译器会根据控制流和实际使用，在最后一次使用后结束借用。所有者可以继续存在，引用绑定也可以仍在词法作用域中，却不再让借用保持有效。诊断冲突时，我会找出引用创建点、冲突访问，以及让借用继续有效的后续使用。只看右花括号无法确定这条时间线。'
    topics: [rust/lifetimes]
    level: beginner
    section: { en: 'Ownership and borrowing', zh: '所有权与借用' }
    frequency: common
    tags: [lifetime, nll, borrow-region]

  - id: lifetimes-avoid-overconstraint
    question: { en: 'How do you avoid over-constraining a function that returns a borrowed value?', zh: '怎样避免过度约束返回借用值的函数？' }
    answer:
      en: 'I trace every possible returned reference to its source before naming lifetimes. If the result can come from either of two inputs, those inputs and the output need a common relationship. If it can only come from the first input, auxiliary references should have independent or elided lifetimes so temporary arguments do not restrict the result. A lifetime name is a caller-visible contract, not documentation decoration. I verify precision with a call that destroys each auxiliary argument before the returned reference’s last use; valid source data should still make that call compile.'
      zh: '我会先把每条可能返回的引用追溯到来源，再命名生命周期。结果可能来自两个输入中的任意一个时，这两个输入与输出需要共同关系；结果只可能来自第一个输入时，辅助引用应使用独立或省略的生命周期，避免临时参数限制结果。生命周期名称是调用方可见的契约，不是文档装饰。我还会编写调用测试：让每个辅助参数先销毁，再使用返回引用；只要真正来源仍有效，调用就应通过编译。'
    topics: [rust/lifetimes]
    level: intermediate
    section: { en: 'API design', zh: 'API 设计' }
    frequency: common
    tags: [lifetime-parameter, api-contract, borrowed-return]

  - id: lifetimes-mutable-reference-variance
    question: { en: 'Why is a mutable reference invariant in the type it refers to?', zh: '为什么可变引用对其引用的类型是不变的？' }
    answer:
      en: "A mutable reference permits both reading and writing, so allowing arbitrary subtype replacement would break the type promised to later readers. If &mut &'static str could be treated as &mut &'short str, code could write a short-lived reference through it. After that borrow ended, the original location could still be read under the false assumption that it contains a static reference. Rust therefore makes &mut T invariant in T, while it remains covariant in the mutable reference’s own lifetime. This distinction is central when nested references carry different lifetimes."
      zh: "可变引用既允许读取也允许写入，因此任意替换被引用类型会破坏后续读者依赖的类型承诺。假如 `&mut &'static str` 能当作 `&mut &'short str` 使用，代码就能通过它写入一条短期引用；借用结束后，原位置却仍可能按静态引用读取。Rust 因而让 `&mut T` 对 `T` 保持不变，同时对可变引用自身的生命周期保持协变。嵌套引用携带不同生命周期时，这个区别尤其关键。"
    topics: [rust/lifetimes]
    level: advanced
    section: { en: 'Type system', zh: '类型系统' }
    frequency: occasional
    tags: [variance, mutable-reference, subtyping]

  - id: lifetimes-trait-object-default
    question: { en: 'Why can Box<dyn Trait> impose a static requirement even in a short block?', zh: '为什么 Box<dyn Trait> 在短代码块中也可能提出静态要求？' }
    answer:
      en: "A trait object has an object lifetime bound that limits borrows hidden inside the erased concrete type. When that bound is omitted, Rust applies object-lifetime defaulting rules; an owning position such as Box<dyn Trait> commonly defaults to 'static. The box variable’s short lexical scope does not replace that type-level default. If the concrete object intentionally borrows data, expose Box<dyn Trait + 'a> and carry that lifetime in the container. If the object must be independent, make the concrete value own its data instead of leaking or forging a lifetime."
      zh: "trait 对象有自己的对象生命周期边界，用来限制被擦除具体类型内部隐藏的借用。省略该边界时，Rust 会应用对象生命周期默认规则；`Box<dyn Trait>` 这类拥有型位置通常默认为 `'static`。盒子变量的短词法作用域不会替代类型层面的默认值。具体对象确实要借用数据时，应写出带适当生命周期的 `Box<dyn Trait + 'a>`，并让容器携带该参数；对象必须独立时，则应让具体值拥有数据，而不是泄漏内存或伪造生命周期。"
    topics: [rust/lifetimes]
    level: advanced
    section: { en: 'Trait objects', zh: 'trait 对象' }
    frequency: occasional
    tags: [trait-object, object-lifetime, static]

  - id: ownership-move-copy-drop
    question: { en: 'How do ownership, move semantics, Copy, and Drop fit together in Rust?', zh: 'Rust 中的所有权、移动语义、Copy 与 Drop 如何配合？' }
    answer:
      en: >-
        Each value has an owning place responsible for its eventual destruction. Assigning or passing a non-Copy value by value moves that responsibility, so the source can no longer be used. A Copy type instead duplicates implicitly and leaves the source valid; it cannot also implement Drop. Clone is separate and explicit, with semantics defined by the type. When an owner leaves scope, Rust runs Drop and then releases owned resources. I still check exceptional termination and strong reference cycles, because safe ownership prevents invalid access but does not guarantee every destructor runs.
      zh: >-
        每个值都有一个负责最终析构的拥有位置。对非 Copy 值进行赋值或按值传参会移动这份责任，因此源位置之后不能再使用。Copy 类型会隐式复制并保持源值有效，而且不能同时实现 Drop。Clone 是另一个显式操作，具体语义由类型定义。所有者离开作用域时，Rust 运行 Drop，再释放值拥有的资源。我仍会检查异常终止与强引用环，因为安全所有权能防止无效访问，却不保证每个析构函数必然执行。
    topics: [rust/ownership]
    level: beginner
    section: { en: 'Ownership and borrowing', zh: '所有权与借用' }
    frequency: common
    tags: [ownership, move-semantics, copy, drop]

  - id: ownership-parameter-contracts
    question: { en: 'How do you choose among T, &T, and &mut T for a function parameter?', zh: '怎样在函数参数的 T、&T 与 &mut T 之间选择？' }
    answer:
      en: >-
        I start with responsibility rather than compiler convenience. T means the function receives ownership and may retain, transfer, or destroy the value. &T gives temporary shared access and is the usual choice for a read-only operation that does not retain data. &mut T gives temporary exclusive access for in-place mutation while ownership stays with the caller. If the function must keep text received as &str, it creates an owned value at that boundary or exposes a valid lifetime relationship. I avoid taking ownership merely to read, because that forces unnecessary moves or clones on callers.
      zh: >-
        我先判断责任，而不是先考虑怎样方便通过编译。T 表示函数取得所有权，可以保存、转交或销毁值。&T 提供临时共享访问，适合不保存数据的只读操作。&mut T 提供临时独占访问以原地修改，但所有权仍在调用方。函数若必须保存通过 &str 收到的文本，就应在该边界创建拥有值，或公开有效的生命周期关系。我不会为了读取而索要所有权，因为这会迫使调用方进行不必要的移动或克隆。
    topics: [rust/ownership]
    level: beginner
    section: { en: 'API design', zh: 'API 设计' }
    frequency: common
    tags: [parameter, shared-borrow, mutable-borrow, api-contract]

  - id: ownership-clone-review
    question: { en: 'Why is adding clone not a complete fix for an ownership error?', zh: '为什么添加 clone 不是所有权错误的完整修复？' }
    answer:
      en: >-
        Clone changes the program by creating another logical owner or value; it does not merely silence the compiler. For String or Vec it usually duplicates owned data, while for Rc or Arc it creates another shared handle and changes destruction timing. The right question is whether the contract truly needs independent ownership. I first trace the move and ask whether the callee only reads, mutates temporarily, retains, or consumes the input. A borrow or deliberate move often expresses that answer better. If a clone remains, I document what it copies and measure it when the cost matters.
      zh: >-
        Clone 会创建另一个逻辑所有者或值，它不只是让编译器安静。对 String 或 Vec 而言，它通常复制所拥有的数据；对 Rc 或 Arc 而言，它创建另一个共享句柄，并改变析构时点。真正的问题是契约是否需要独立所有权。我会先追踪移动，再判断被调用方只是读取、临时修改、长期保存还是消费输入。借用或明确移动通常能更准确地表达答案。若最终保留克隆，就应说明它复制什么，并在成本重要时实际测量。
    topics: [rust/ownership]
    level: intermediate
    section: { en: 'Ownership diagnostics', zh: '所有权诊断' }
    frequency: common
    tags: [clone, diagnostics, performance, api-contract]

  - id: ownership-partial-move-drop
    question: { en: 'What is a partial move, and why are Drop types restricted?', zh: '什么是部分移动？为什么实现 Drop 的类型受到限制？' }
    answer:
      en: >-
        A partial move transfers ownership of one non-Copy field while leaving other fields initialized. The compiler permits separate use of the remaining fields but rejects use of the whole struct because it is incomplete. A type implementing Drop is more restricted: its destructor receives &mut self and may rely on every field satisfying the type invariant, so arbitrary field extraction is rejected. I borrow fields when observation is enough. When extraction is part of the design, I consume and destructure the whole value or store the field in Option and use take, leaving a valid state for Drop.
      zh: >-
        部分移动会转移一个非 Copy 字段的所有权，同时让其他字段保持已初始化。编译器允许分别使用剩余字段，却拒绝把不完整的结构体作为整体使用。实现 Drop 的类型限制更严，因为析构函数接收 &mut self，并可能依赖每个字段满足类型不变量，所以不能任意取出字段。只需观察时我会借用字段。提取本来就是设计的一部分时，我会消费并完整解构值，或把字段存为 Option，再用 take 留下对 Drop 有效的状态。
    topics: [rust/ownership]
    level: advanced
    section: { en: 'Destruction', zh: '析构' }
    frequency: occasional
    tags: [partial-move, drop, option-take, invariants]

  - id: ownership-rules-moved-place
    question: { en: 'What does it mean when Rust says a value was moved, and can that binding be used again?', zh: 'Rust 所说的值已移动是什么意思？该绑定还能再次使用吗？' }
    answer:
      en: >-
        A move transfers responsibility for a non-Copy value from one place to another. The compiler then treats the source place as uninitialized, so reading or borrowing it is rejected; this is a static rule rather than a runtime moved flag. The binding itself is not permanently poisoned. If it is mutable and every path assigns a fresh value before the next use, that place becomes initialized again. The new assignment does not recover the old value, which remains owned by the move destination or has already been destroyed there.
      zh: >-
        移动把非 Copy 值的责任转给另一个位置。编译器随后把源位置视为未初始化，拒绝继续读取或借用；这不是运行时标记。绑定并未永久失效：若它可变，且所有路径都在下次使用前赋入新值，该位置便重新初始化。新赋值不会找回旧值；旧值仍由移动目标拥有，或已在那里销毁。
    topics: [rust/ownership-rules]
    level: intermediate
    section: { en: 'Ownership and borrowing', zh: '所有权与借用' }
    frequency: common
    tags: [move-semantics, initialization, control-flow]

  - id: ownership-rules-partial-move
    question: { en: 'What remains usable after a partial move, and why do Drop types impose a restriction?', zh: '部分移动后哪些内容仍可用？为什么 Drop 类型有限制？' }
    answer:
      en: >-
        A partial move takes one non-Copy field while leaving other fields initialized. Those remaining fields may still be accessed separately, but the struct cannot be used as a complete value because one part is absent. Copy fields are copied rather than moved. A type implementing Drop is stricter: its destructor receives mutable access to the whole value and may rely on every field satisfying the invariant, so Rust rejects arbitrary field extraction. When extraction is intentional, consume the whole value or store the field in Option and use take to leave a valid empty state.
      zh: >-
        部分移动取走一个非 Copy 字段，其余已初始化字段仍可分别使用，但结构体已不完整。Copy 字段只会被复制。实现 Drop 的类型更严格：析构函数取得完整值的可变访问权，可能依赖所有字段，因此 Rust 拒绝任意提取。需要提取时，可消费整个值，或把字段放进 Option 并调用 take，留下合法空状态。
    topics: [rust/ownership-rules]
    level: intermediate
    section: { en: 'Patterns and fields', zh: '模式与字段' }
    frequency: common
    tags: [partial-move, drop, option-take]

  - id: ownership-rules-copy-clone
    question: { en: 'Why is “stack values copy and heap values move” a bad model for Rust?', zh: '为什么“栈值复制、堆值移动”不是正确的 Rust 模型？' }
    answer:
      en: >-
        Storage location does not decide whether assignment leaves the source usable. The Copy trait does. Shared references can be Copy even when they point into heap storage, while a fixed-size stack value can be non-Copy because it owns a resource or implements Drop. Copy permits implicit duplication with no custom method call. Clone is explicit and type-defined: String cloning duplicates its buffer, but Rc cloning creates another owner of the same allocation. I inspect the concrete trait implementation and resource meaning instead of guessing from a value's shape or size.
      zh: >-
        赋值后源位置能否继续使用由 Copy trait 决定，与栈或堆无关。共享引用指向堆数据也可以是 Copy；固定大小的栈值若拥有资源或实现 Drop，也可能不是 Copy。Copy 允许隐式复制，Clone 则由类型显式定义：String 克隆缓冲区，Rc 克隆共享句柄。应检查具体实现与资源含义，不能根据形状或大小猜测。
    topics: [rust/ownership-rules]
    level: beginner
    section: { en: 'Copy and Clone', zh: 'Copy 与 Clone' }
    frequency: common
    tags: [copy, clone, storage, drop]

  - id: ownership-rules-diagnose-e0382
    question: { en: 'How do you diagnose E0382 without defaulting to clone?', zh: '怎样在不默认添加 clone 的情况下诊断 E0382？' }
    answer:
      en: >-
        I start at the earlier “value moved here” note, not the later failed use. I inspect whether the move came from assignment, a by-value parameter, a consuming method, iteration, or a pattern. Then I state what the later operation needs: ownership, shared reading, or exclusive mutation. That decides whether to keep the move, borrow temporarily, change the signature, return ownership, or reinitialize the source. Only if two values or handles are part of the domain contract do I clone, after checking what that type's Clone implementation actually duplicates or shares.
      zh: >-
        我先看较早的 value moved here 提示，确认移动来自赋值、按值形参、消费型方法、迭代还是模式，再判断后续操作需要所有权、共享读取还是独占修改。由此决定保留移动、临时借用、修改签名、返回所有权或重新初始化。只有领域契约确实要求两个值或句柄时才克隆，并先查清 Clone 究竟复制数据还是共享资源。
    topics: [rust/ownership-rules]
    level: intermediate
    section: { en: 'Diagnostics', zh: '诊断' }
    frequency: common
    tags: [e0382, diagnostics, clone, api-contract]

  - id: pattern-matching-exhaustiveness-wildcard
    question: { en: 'What does exhaustive matching guarantee, and when can a wildcard weaken that guarantee?', zh: '穷尽匹配保证什么？通配分支何时会削弱这种保证？' }
    answer:
      en: >-
        Exhaustiveness guarantees that every value represented by the matched type can select an arm; it does not guarantee that the selected behavior is correct. On a closed enum I usually name every variant, so adding one creates a compile error at every decision point that needs review. A wildcard still makes the match exhaustive, but it groups all remaining and future cases into one behavior. That is appropriate for open inputs or an external non-exhaustive enum. It is risky when the fallback ignores data, reports success, or calls unreachable, because compiler feedback becomes silent behavior or a runtime panic.
      zh: >-
        穷尽性保证匹配类型所表示的每个值都能选中一个分支，不保证所选行为符合业务要求。对封闭枚举，我通常明确写出每个变体，这样新增变体时，需要复查的决策点都会产生编译错误。通配模式仍能使匹配穷尽，但它把所有剩余情况和未来情况归入同一行为。开放输入或外部的 non-exhaustive 枚举适合这样处理；若兜底分支忽略数据、报告成功或调用 unreachable，编译器反馈就会变成静默行为或运行时 panic。
    topics: [rust/pattern-matching]
    level: intermediate
    section: { en: 'Language core', zh: '语言核心' }
    frequency: common
    tags: [match, exhaustiveness, wildcard, enum]

  - id: pattern-matching-refutability
    question: { en: 'How do refutable and irrefutable patterns determine whether to use let, if let, or let-else?', zh: '可反驳与不可反驳模式如何决定使用 let、if let 还是 let-else？' }
    answer:
      en: >-
        An irrefutable pattern matches every value of its type, so ordinary let, function parameters, and for bindings can use it without a failure branch. A refutable pattern, such as Some(value), a literal, or a fixed slice shape, can fail. Use if let when only the successful shape needs a local block and failure may do nothing. Use let-else when failure should leave early and the successful bindings must remain available afterward; its else branch must diverge through return, break, continue, or a never-returning expression. Use match when several outcomes carry meaning or exhaustiveness should remain visible.
      zh: >-
        不可反驳模式能匹配其类型的每个值，因此普通 let、函数参数和 for 绑定无需失败分支即可使用。Some(value)、字面值或固定切片形状等可反驳模式可能失败。只有成功形状需要局部代码块，失败可以不处理时使用 if let。失败应提前离开，且成功绑定要在后续作用域可用时使用 let-else；它的 else 必须通过 return、break、continue 或永不返回的表达式发散。多个结果都有意义，或需要保留穷尽检查时，应使用 match。
    topics: [rust/pattern-matching]
    level: beginner
    section: { en: 'Patterns and control flow', zh: '模式与控制流' }
    frequency: common
    tags: [refutable-pattern, let-else, if-let, control-flow]

  - id: pattern-matching-binding-modes
    question: { en: 'How can a pattern move part of a value, and how do you avoid an accidental partial move?', zh: '模式如何移动值的一部分？怎样避免意外的部分移动？' }
    answer:
      en: >-
        A by-value pattern over an owned subject moves non-Copy fields into its bindings and copies Copy fields. Moving one field while leaving others initialized creates a partial move: separate remaining fields may still be usable, but the whole structure is no longer available. I start by deciding what the operation owns. For inspection, I match &value, letting match ergonomics create borrowed field bindings. For mutation, I match &mut value. I match value only when the operation should consume it. Adding clone merely to fix E0382 can duplicate data and often conceals that the function signature expresses the wrong ownership contract.
      zh: >-
        对拥有型匹配对象使用按值模式时，非 Copy 字段会移动到绑定中，Copy 字段则复制。移出一个字段并保留其他已初始化字段会形成部分移动：剩余字段可能仍能分别使用，但整体结构已不可用。我会先决定操作应拥有什么。只检查时匹配 &value，让匹配人体工程学生成借用字段绑定；需要修改时匹配 &mut value；只有操作应消费输入时才匹配 value。为修复 E0382 直接添加 clone 可能复制数据，也常掩盖函数签名表达了错误的所有权契约。
    topics: [rust/pattern-matching]
    level: intermediate
    section: { en: 'Ownership and borrowing', zh: '所有权与借用' }
    frequency: common
    tags: [binding-mode, partial-move, match-ergonomics, ownership]

  - id: pattern-matching-guards-bindings
    question: { en: 'What two mistakes commonly occur with match guards and bare identifiers in patterns?', zh: '匹配守卫和模式中的裸标识符常出现哪两类错误？' }
    answer:
      en: >-
        First, a guard does not contribute to exhaustiveness. Some(x) if x > 0 covers only values for which the guard is true, so another Some arm is still needed before None. A guard after A | B applies to the complete or-pattern. Second, a bare lowercase identifier normally creates a new binding; it does not compare with an outer variable of the same name. That binding can match every value and make later arms unreachable. To compare runtime values, bind a fresh name and use a guard such as value if value == expected. Treat unreachable-pattern warnings as evidence, not noise.
      zh: >-
        第一，守卫不参与穷尽性证明。Some(x) if x > 0 只覆盖守卫为 true 的值，因此在 None 之前仍需另一个 Some 分支；A | B 后的守卫作用于整个或模式。第二，小写裸标识符通常创建新绑定，并不与外层同名变量比较。这个绑定可能匹配所有值，使后续分支不可达。比较运行时值时，应绑定新名字，再写 value if value == expected 这样的守卫。应把 unreachable-pattern 警告视为错误证据，而不是噪声。
    topics: [rust/pattern-matching]
    level: intermediate
    section: { en: 'Match semantics', zh: '匹配语义' }
    frequency: occasional
    tags: [match-guard, shadowing, or-pattern, reachability]
