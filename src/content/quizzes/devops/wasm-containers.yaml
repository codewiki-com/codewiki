topic: devops/wasm-containers
items:
  - id: predict-empty-wasm-module
    type: predict
    prompt: { en: 'What does Node 24 print for this minimal core Wasm module?', zh: 'Node 24 会为这个最小核心 Wasm 模块输出什么？' }
    code: |
      const bytes = Uint8Array.from([
        0x00, 0x61, 0x73, 0x6d,
        0x01, 0x00, 0x00, 0x00,
      ]);
      const module = new WebAssembly.Module(bytes);

      console.log(WebAssembly.validate(bytes));
      console.log(WebAssembly.Module.imports(module).length);
    lang: javascript
    options:
      - { text: { en: 'true, then 0', zh: '先输出 true，再输出 0' }, correct: true }
      - { text: { en: 'false, then 0', zh: '先输出 false，再输出 0' }, correct: false }
      - { text: { en: 'true, then 1', zh: '先输出 true，再输出 1' }, correct: false }
      - { text: { en: 'It throws because a module must export a function.', zh: '程序抛出异常，因为模块必须导出函数。' }, correct: false }
    explanation: { en: 'The magic bytes and version form a valid empty core module. Core Wasm requires neither imports nor exports.', zh: '魔数与版本号构成有效的空核心模块；核心 Wasm 不要求模块必须包含导入或导出。' }
    difficulty: beginner
    tags: [wasm, validation]

  - id: wasi-capability-boundary
    type: mcq
    prompt: { en: 'Which statement correctly describes a WASI import and its authority?', zh: '哪项表述正确描述了 WASI 导入及其权限？' }
    options:
      - { text: { en: 'An import declares a required interface; the host still decides whether and with what resource scope to provide it.', zh: '导入声明所需接口；宿主仍决定是否提供，以及提供多大的资源范围。' }, correct: true }
      - { text: { en: 'Declaring wasi:filesystem automatically grants access to the host root filesystem.', zh: '声明 wasi:filesystem 会自动授予宿主机根文件系统访问权。' }, correct: false }
      - { text: { en: 'A component with no socket import cannot receive any network-derived input from its host.', zh: '没有套接字导入的组件不可能从宿主收到任何源自网络的输入。' }, correct: false }
      - { text: { en: 'Kubernetes ServiceAccount permissions are replaced by the Wasm capability model.', zh: 'Wasm 能力模型会取代 Kubernetes ServiceAccount 权限。' }, correct: false }
    explanation: { en: 'Imports describe linkage requirements, while runtime configuration scopes the supplied host implementation. Pod and node permissions remain an outer boundary.', zh: '导入描述链接需求，运行时配置则约束宿主实现的资源范围；Pod 与节点权限仍构成外层边界。' }
    difficulty: intermediate
    tags: [wasi, capabilities, security]

  - id: spot-runtime-class-wiring
    title: { en: 'Spot the bug in the Wasm manifest', zh: '找出 Wasm 清单里的 bug' }
    type: spotbug
    prompt: { en: 'Find the scheduling, RuntimeClass, and supply-chain errors in this generated manifest.', zh: '找出这份生成清单中的调度、RuntimeClass 与供应链错误。' }
    code: |
      apiVersion: node.k8s.io/v1
      kind: RuntimeClass
      metadata:
        name: wasm
      handler: wasmtime
      scheduling:
        nodeSelector:
          kubernetes.io/arch: wasm32
      ---
      apiVersion: v1
      kind: Pod
      metadata:
        name: receipt-worker
      spec:
        runtimeClassName: spin
        containers:
          - name: worker
            image: registry.example/receipt:latest
    lang: yaml
    issues:
      - line: 8
        kind: correctness
        note: { en: 'The built-in architecture label reports the host CPU and should not be overwritten with the Wasm target; use a separate runtime-capability label.', zh: '内置架构标签描述宿主 CPU，不应改成 Wasm 目标；应另设运行时能力标签。' }
      - line: 15
        kind: correctness
        note: { en: 'The Pod must reference the RuntimeClass metadata.name, which is wasm here, rather than a guessed framework or handler name.', zh: 'Pod 必须引用 RuntimeClass 的 metadata.name，此处应为 wasm，而不是臆测的框架或 handler 名称。' }
      - line: 18
        kind: security
        note: { en: 'The mutable latest tag does not identify the reviewed Wasm artifact; deploy an admitted immutable digest.', zh: '可变的 latest 标签不能标识已审查的 Wasm 制品；应部署通过准入检查的不可变摘要。' }
    explanation: { en: 'Keep CPU identity separate from runtime availability, wire the Pod to an existing RuntimeClass, and bind deployment to reviewed content. The handler must also exist in CRI configuration on every labeled node.', zh: '应把 CPU 身份与运行时可用性分开，让 Pod 引用已有 RuntimeClass，并把部署绑定到已审查内容；每个匹配节点的 CRI 配置中也必须存在对应 handler。' }
    difficulty: intermediate
    tags: [kubernetes, runtimeclass, supply-chain]

  - id: oci-descriptor-integrity
    type: mcq
    prompt: { en: 'A Wasm layer changes by one byte after its OCI manifest is created. What must the publisher do?', zh: 'OCI 清单创建后，Wasm 层发生一个字节的变化，发布者必须做什么？' }
    options:
      - { text: { en: 'Recalculate the layer descriptor and every parent config or manifest digest affected by it.', zh: '重算层描述符，以及所有受影响的上层配置或清单摘要。' }, correct: true }
      - { text: { en: 'Keep the old digest because the media type did not change.', zh: '媒体类型未变，因此保留旧摘要。' }, correct: false }
      - { text: { en: 'Update only the human-readable tag in index.json.', zh: '只更新 index.json 中便于阅读的标签。' }, correct: false }
      - { text: { en: 'Round the layer size to the nearest kilobyte and keep the manifest.', zh: '把层大小取整到最接近的 KB，并保留原清单。' }, correct: false }
    explanation: { en: 'OCI descriptors are content-addressed by exact bytes and byte length. Changing a child blob changes its descriptor and therefore the bytes and digest of parents that reference it.', zh: 'OCI 描述符按精确字节及字节数寻址；子 blob 改变后，其描述符会改变，引用它的上层内容及摘要也随之改变。' }
    difficulty: intermediate
    tags: [oci, digests, artifacts]

  - id: review-generated-wasm-pod
    title: { en: 'Review generated Wasm Pod', zh: '审查生成的 Wasm Pod' }
    type: review
    prompt: { en: 'Review this generated Wasm Pod before it enters the deployment repository.', zh: '在这份生成的 Wasm Pod 进入部署仓库前进行审查。' }
    task: { en: 'Deploy a reviewed receipt component through the platform-owned RuntimeClass, expose only its database credential, check health without a shell, and enforce resource bounds.', zh: '通过平台管理的 RuntimeClass 部署已审查的收据组件，只暴露数据库凭据，不依赖 shell 检查健康状态，并实施资源边界。' }
    code: |
      apiVersion: v1
      kind: Pod
      metadata:
        name: receipt-worker
      spec:
        runtimeClassName: wasmtime
        containers:
          - name: worker
            image: registry.example/receipt:latest
            envFrom:
              - secretRef:
                  name: all-service-secrets
            livenessProbe:
              exec:
                command: ["/bin/sh", "-c", "curl -f localhost:8080/health"]
            resources:
              requests:
                cpu: 10m
                memory: 16Mi
    lang: yaml
    right: { en: 'The manifest names the workload clearly, selects a RuntimeClass explicitly, includes a liveness probe, and declares baseline CPU and memory requests.', zh: '这份清单清楚命名了工作负载，显式选择 RuntimeClass，包含存活探针，并声明了基础 CPU 与内存请求。' }
    issues:
      - line: 6
        kind: correctness
        note: { en: 'wasmtime may be the CRI handler but is not necessarily the platform-owned RuntimeClass name; resolve and use metadata.name.', zh: 'wasmtime 可能是 CRI handler，却不一定是平台管理的 RuntimeClass 名称；应解析并使用 metadata.name。' }
      - line: 9
        kind: readability
        note: { en: 'The mutable latest tag hides which reviewed component is deployed; an immutable digest makes the change auditable.', zh: '可变的 latest 标签隐藏了实际部署的已审查组件；不可变摘要能让变更可审计。' }
      - line: 10
        kind: security
        note: { en: 'envFrom injects every key in a broad secret even though the task permits only the database credential; map the required key explicitly.', zh: 'envFrom 会注入整个宽泛 Secret 的全部键，但任务只允许数据库凭据；应显式映射所需键。' }
      - line: 16
        kind: edge-case
        note: { en: 'A pure Wasm artifact does not provide /bin/sh or curl, so this exec probe can fail before checking application health.', zh: '纯 Wasm 制品不提供 /bin/sh 或 curl，因此 exec 探针可能尚未检查应用健康状态就失败。' }
      - line: 17
        kind: performance
        note: { en: 'Requests influence scheduling but do not cap consumption; add tested CPU and memory limits or runtime-native execution budgets.', zh: 'request 影响调度却不限制消耗；应增加经过测试的 CPU、内存 limit 或运行时原生执行预算。' }
    checklist:
      - { en: 'Resolve RuntimeClass metadata.name through the platform inventory and verify its handler on every eligible node.', zh: '从平台清单解析 RuntimeClass 的 metadata.name，并在每个合格节点验证其 handler。' }
      - { en: 'Deploy the admitted artifact digest and inspect its Wasm form, WASI world, imports, and OCI media types.', zh: '部署通过准入检查的制品摘要，并检查其 Wasm 形态、WASI world、导入和 OCI 媒体类型。' }
      - { en: 'Map only required secrets and test that denied filesystem and network capabilities remain denied.', zh: '只映射必需秘密，并测试被拒绝的文件系统与网络能力仍然无法访问。' }
      - { en: 'Use a runtime-supported probe and test startup, termination, timeout, and resource-exhaustion behavior.', zh: '使用运行时支持的探针，并测试启动、终止、超时和资源耗尽行为。' }
    explanation: { en: 'Use the platform RuntimeClass name, pin the admitted artifact digest, map one secret key, choose a probe supported by the Wasm host, and enforce both Kubernetes limits and any runtime-native budget the platform exposes.', zh: '应使用平台的 RuntimeClass 名称，固定通过准入的制品摘要，只映射一个 Secret 键，选择 Wasm 宿主支持的探针，并同时实施 Kubernetes limit 与平台提供的运行时原生预算。' }
    difficulty: advanced
    tags: [review, kubernetes, wasi, security]
