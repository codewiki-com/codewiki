topic: devops/docker-guide
items:
  - id: predict-image-reference-parts
    type: predict
    prompt: { en: 'What does this image-reference inspection print?', zh: '这段镜像引用检查会输出什么？' }
    code: |
      const image = "node:24-bookworm-slim@sha256:abc123";
      const [tag, digest] = image.split("@");

      console.log(tag);
      console.log(digest.startsWith("sha256:"));
    lang: javascript
    options:
      - { text: { en: "node:24-bookworm-slim, then true", zh: '先输出node:24-bookworm-slim，再输出true' }, correct: true }
      - { text: { en: "node, then false", zh: '先输出node，再输出false' }, correct: false }
      - { text: { en: "sha256:abc123, then true", zh: '先输出sha256:abc123，再输出true' }, correct: false }
      - { text: { en: "It throws because @ is not valid in an image reference.", zh: '程序会抛出异常，因为镜像引用中不能出现 @。' }, correct: false }
    explanation: { en: 'The at sign separates a tag-qualified repository reference from its content digest. A readable tag and a digest can appear in one reference.', zh: '@ 把带标签的仓库引用与内容摘要分开；同一引用可以同时包含便于阅读的标签和摘要。' }
    difficulty: beginner
    tags: [images, digests]

  - id: image-versus-container
    type: mcq
    prompt: { en: 'Which statement correctly distinguishes an image from a container?', zh: '哪项表述正确区分了镜像与容器？' }
    options:
      - { text: { en: 'An image is a read-only template; a container combines it with runtime configuration and a writable layer.', zh: '镜像是只读模板；容器把它与运行时配置和可写层组合起来。' }, correct: true }
      - { text: { en: 'A container is the compressed archive uploaded to a registry.', zh: '容器是上传到镜像仓库的压缩归档。' }, correct: false }
      - { text: { en: 'Deleting a container always deletes its image and named volumes.', zh: '删除容器总会同时删除镜像和命名卷。' }, correct: false }
      - { text: { en: 'Each running container requires a separate copy of every image layer.', zh: '每个运行中的容器都需要单独复制每个镜像层。' }, correct: false }
    explanation: { en: 'Containers can share immutable image layers while keeping separate runtime configuration and writable state. Images and named volumes have lifecycles independent of one container.', zh: '多个容器可以共享不可变镜像层，同时保留各自的运行时配置与可写状态；镜像和命名卷的生命周期独立于某个容器。' }
    difficulty: beginner
    tags: [images, containers]

  - id: spot-compose-boundaries
    title: { en: 'Spot the bug in the Compose file', zh: '找出Compose文件里的bug' }
    type: spotbug
    prompt: { en: 'Find the connectivity and host-access problems in this generated Compose file.', zh: '找出这份生成的Compose文件中的连接与宿主机访问问题。' }
    code: |
      services:
        api:
          image: catalog:local
          environment:
            DATABASE_URL: postgresql://catalog:local@localhost:5432/catalog
          volumes:
            - /:/host
          privileged: true
        db:
          image: postgres:18-alpine
          ports:
            - "0.0.0.0:5432:5432"
    lang: yaml
    issues:
      - line: 5
        kind: correctness
        note: { en: 'localhost inside api refers to the api container, not the db service; the hostname should be db.', zh: 'api容器内的localhost指向api自身，而不是db服务；主机名应为db。' }
      - line: 7
        kind: security
        note: { en: 'A writable bind mount of the host root exposes the entire host filesystem to the container.', zh: '可写绑定挂载宿主机根目录，会把整个宿主机文件系统暴露给容器。' }
      - line: 8
        kind: security
        note: { en: 'Privileged mode grants broad access that an API client does not need.', zh: '特权模式授予了API客户端不需要的广泛访问能力。' }
      - line: 12
        kind: edge-case
        note: { en: 'Publishing PostgreSQL on every host interface is unnecessary for service-to-service traffic and expands exposure.', zh: '服务间通信不需要把PostgreSQL发布到宿主机所有接口，这会扩大暴露面。' }
    explanation: { en: 'Compose services should use service-name DNS on their private network. Remove the host-root mount and privileged mode, and publish the database only when a host client genuinely needs it.', zh: 'Compose服务应在私有网络中使用服务名DNS；应移除宿主机根目录挂载与特权模式，只有宿主机客户端确实需要时才发布数据库端口。' }
    difficulty: intermediate
    tags: [compose, networking, security]

  - id: persistent-data-lifecycle
    type: mcq
    prompt: { en: 'Which choice preserves database data when its container is replaced?', zh: '哪种做法能在数据库容器被替换后保留数据？' }
    options:
      - { text: { en: 'Mount a named volume at the database data directory.', zh: '把命名卷挂载到数据库数据目录。' }, correct: true }
      - { text: { en: 'Write to the container writable layer and use restart: always.', zh: '写入容器可写层，并设置restart: always。' }, correct: false }
      - { text: { en: 'Declare the data directory with EXPOSE.', zh: '用EXPOSE声明数据目录。' }, correct: false }
      - { text: { en: 'Run docker compose down -v before every restart.', zh: '每次重启前运行docker compose down -v。' }, correct: false }
    explanation: { en: 'A named volume has a lifecycle outside one container. It survives container replacement, but it still needs a separate backup and restore plan.', zh: '命名卷的生命周期独立于某个容器，因此能跨容器替换保留；但它仍然需要独立的备份与恢复方案。' }
    difficulty: beginner
    tags: [volumes, persistence]

  - id: review-generated-node-image
    title: { en: 'Review generated Node image', zh: '审查生成的Node镜像' }
    type: review
    prompt: { en: 'Review this generated Dockerfile before it enters the release pipeline.', zh: '在这份生成的Dockerfile进入发布流水线前进行审查。' }
    task: { en: 'Build a reproducible, least-privilege Node 24 image that installs locked dependencies, serves port 3000, and shuts down cleanly.', zh: '构建一个可复现、最小权限的Node 24镜像，按锁文件安装依赖，监听端口3000，并能优雅停止。' }
    code: |
      # syntax=docker/dockerfile:1
      FROM node:latest AS build
      WORKDIR /app
      ARG NPM_TOKEN
      COPY package*.json ./
      RUN echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" > .npmrc \
          && npm install
      COPY . .
      RUN npm run build
      FROM node:latest
      WORKDIR /app
      COPY --from=build /app /app
      ENV NODE_ENV=production
      USER root
      EXPOSE 3000
      HEALTHCHECK CMD curl -f http://localhost:3000/health
      CMD node app.mjs
    lang: dockerfile
    right: { en: 'The file separates build and runtime stages, sets an explicit working directory and production environment, and documents the application port.', zh: '这份文件区分了构建与运行阶段，设置了明确的工作目录和生产环境，并声明了应用端口。' }
    issues:
      - line: 2
        kind: correctness
        note: { en: 'The floating latest tag neither guarantees Node 24 nor records the reviewed base-image content.', zh: '浮动的latest标签既不保证Node 24，也没有记录受审查的基础镜像内容。' }
      - line: 6
        kind: security
        note: { en: 'Writing the token into .npmrc in a RUN layer exposes it in build history and the copied application tree; use a BuildKit secret mount.', zh: '在RUN层把令牌写进 .npmrc，会让它暴露在构建历史和复制的应用目录中；应使用BuildKit secret mount。' }
      - line: 12
        kind: performance
        note: { en: 'Copying the whole build workspace carries development dependencies, source, and temporary files into the runtime image.', zh: '复制整个构建工作区，会把开发依赖、源码和临时文件带进运行镜像。' }
      - line: 16
        kind: edge-case
        note: { en: 'The slim base does not guarantee curl is installed, so the container may become unhealthy even when the application works.', zh: 'slim基础镜像不保证安装curl，因此应用正常时容器也可能被判定为不健康。' }
      - line: 17
        kind: readability
        note: { en: 'Shell-form CMD hides the process behind a shell and makes signal behavior less explicit; use JSON exec form.', zh: 'shell形式的CMD把进程藏在shell后面，信号行为不够明确；应使用JSON exec形式。' }
    checklist:
      - { en: 'Resolve every base tag to a reviewed digest and declare the target platforms.', zh: '把每个基础标签解析为受审查的摘要，并声明目标平台。' }
      - { en: 'Use frozen lockfile installation and pass credentials only through secret mounts.', zh: '使用冻结锁文件安装，只通过secret mount传递凭据。' }
      - { en: 'Copy only runtime artifacts, select a non-root user, and inspect the final filesystem.', zh: '只复制运行制品，选择非root用户，并检查最终文件系统。' }
      - { en: 'Test health-check tooling, PID 1 signal handling, and graceful shutdown in the final image.', zh: '在最终镜像中测试健康检查工具、PID 1信号处理和优雅停止。' }
    explanation: { en: 'Pin a Node 24 base, install with npm ci and a secret mount, copy only production artifacts, run as the existing node user, implement the health check with an available tool, and use exec-form CMD.', zh: '应固定Node 24基础镜像，通过secret mount配合npm ci安装，只复制生产制品，以已有的node用户运行，使用镜像内存在的工具做健康检查，并采用exec形式CMD。' }
    difficulty: advanced
    tags: [review, dockerfile, security, reproducibility]
