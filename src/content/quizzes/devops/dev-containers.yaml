topic: devops/dev-containers
items:
  - id: predict-creation-order
    type: predict
    prompt: { en: 'On first creation, in what order do these three container-side commands run?', zh: '首次创建环境时，这三个容器内命令按什么顺序运行？' }
    code: |
      {
        "onCreateCommand": "echo create",
        "updateContentCommand": "echo content",
        "postCreateCommand": "echo post-create"
      }
    lang: jsonc
    options:
      - { text: { en: 'create, content, post-create', zh: 'create、content、post-create' }, correct: true }
      - { text: { en: 'content, create, post-create', zh: 'content、create、post-create' }, correct: false }
      - { text: { en: 'post-create, create, content', zh: 'post-create、create、content' }, correct: false }
      - { text: { en: 'All three start in parallel.', zh: '三个命令全部并行启动。' }, correct: false }
    explanation: { en: 'The creation stages are ordered: onCreateCommand, updateContentCommand, then postCreateCommand. Object members within one stage can run in parallel, but separate stages do not.', zh: '创建阶段的顺序固定为onCreateCommand、updateContentCommand、postCreateCommand。同一阶段的对象成员可以并行，但不同阶段不会并行。' }
    difficulty: beginner
    tags: [lifecycle, ordering]

  - id: container-user-versus-remote-user
    type: mcq
    prompt: { en: 'Which statement correctly distinguishes containerUser from remoteUser?', zh: '关于containerUser与remoteUser，哪项表述正确？' }
    options:
      - { text: { en: 'containerUser covers all container operations; remoteUser covers lifecycle scripts and processes launched by supporting tools.', zh: 'containerUser作用于所有容器操作；remoteUser作用于生命周期脚本和支持工具启动的进程。' }, correct: true }
      - { text: { en: 'remoteUser changes the Docker image USER instruction permanently.', zh: 'remoteUser会永久修改Docker镜像的USER指令。' }, correct: false }
      - { text: { en: 'containerUser applies only to the editor, while remoteUser applies only to Compose sidecars.', zh: 'containerUser只作用于编辑器，remoteUser只作用于Compose边车。' }, correct: false }
    explanation: { en: 'remoteUser is a Dev Container tool concept and defaults to the container user. It does not replace the image user for every process.', zh: 'remoteUser是Dev Container工具层的概念，默认跟随容器用户；它不会替换镜像中所有进程的用户。' }
    difficulty: intermediate
    tags: [users, permissions]

  - id: default-wait-point
    type: mcq
    prompt: { en: 'What does waitFor default to when it is omitted?', zh: '省略waitFor时，默认等待到哪个阶段？' }
    options:
      - { text: { en: 'updateContentCommand', zh: 'updateContentCommand' }, correct: true }
      - { text: { en: 'postCreateCommand', zh: 'postCreateCommand' }, correct: false }
      - { text: { en: 'postStartCommand', zh: 'postStartCommand' }, correct: false }
      - { text: { en: 'postAttachCommand', zh: 'postAttachCommand' }, correct: false }
    explanation: { en: 'The default wait point is updateContentCommand, so postCreateCommand may continue after a supporting tool reports the environment as available.', zh: '默认等待点是updateContentCommand，因此支持工具报告环境可用后，postCreateCommand仍可能继续执行。' }
    difficulty: intermediate
    tags: [lifecycle, wait-for]

  - id: spot-host-exposure
    title: { en: 'Spot the bug in the Dev Container config', zh: '找出开发容器配置里的bug' }
    type: spotbug
    prompt: { en: 'Find the host-access and credential risks in this generated configuration.', zh: '找出这份生成配置中的宿主机访问与凭据风险。' }
    code: |
      {
        "name": "agent-workspace",
        "image": "node:24-bookworm-slim",
        "mounts": [
          "source=/var/run/docker.sock,target=/var/run/docker.sock,type=bind",
          "source=${localEnv:HOME},target=/host-home,type=bind"
        ],
        "containerEnv": {
          "NPM_TOKEN": "token-copied-from-ticket"
        }
      }
    lang: jsonc
    issues:
      - line: 5
        kind: security
        note: { en: 'The Docker socket usually lets container code control the host Docker engine, including mounting host paths into new containers.', zh: 'Docker套接字通常让容器代码控制宿主机Docker引擎，包括把宿主机路径挂进新容器。' }
      - line: 6
        kind: security
        note: { en: 'A writable mount of the whole home directory exposes far more host data than the project needs.', zh: '把整个主目录可写挂载进去，会暴露远超项目所需的宿主机数据。' }
      - line: 9
        kind: security
        note: { en: 'A plaintext token committed in containerEnv is exposed in source and process environments.', zh: '把明文令牌提交到containerEnv，会让它暴露在源码和进程环境中。' }
    explanation: { en: 'Use narrow read-only mounts, avoid the Docker socket unless the task requires host-engine control, and inject a short-lived token at runtime through the platform secret mechanism.', zh: '应使用范围有限的只读挂载；除非任务需要控制宿主机引擎，否则不要挂载Docker套接字；令牌应由平台秘密机制在运行时短期注入。' }
    difficulty: advanced
    tags: [security, mounts, secrets]

  - id: review-generated-node-container
    title: { en: 'Review generated Node workspace', zh: '审查生成的Node工作区' }
    type: review
    prompt: { en: 'Review this generated Dev Container configuration before the team adopts it.', zh: '团队采用前，审查这份生成的Dev Container配置。' }
    task: { en: 'Create a reproducible, least-privilege Node 24 workspace that starts a development server on port 3000.', zh: '创建一个可复现、最小权限的Node 24工作区，并在端口3000启动开发服务器。' }
    code: |
      {
        "name": "generated-node-workspace",
        "image": "node:latest",
        "remoteUser": "vscode",
        "privileged": true,
        "forwardPorts": [3000, 3000],
        "postCreateCommand": "npm install || true",
        "postStartCommand": "npm install && npm run dev",
        "portsAttributes": {
          "3000": {
            "label": "Web application",
            "onAutoForward": "notify"
          }
        },
        "customizations": {
          "vscode": {
            "extensions": ["dbaeumer.vscode-eslint"]
          }
        }
      }
    lang: jsonc
    right: { en: 'The file uses the standard configuration shape, labels the forwarded application port, and keeps editor customization under the vscode namespace.', zh: '配置采用了标准结构，为转发的应用端口提供了标签，并把编辑器设置放在vscode命名空间下。' }
    issues:
      - line: 3
        kind: correctness
        note: { en: 'The floating latest tag does not guarantee Node 24 and can change the environment without a repository diff.', zh: '浮动的latest标签不保证得到Node 24，而且环境可能在仓库没有变更时改变。' }
      - line: 4
        kind: edge-case
        note: { en: 'The official Node image provides a node account, not a guaranteed vscode account, so attachment can fail.', zh: '官方Node镜像提供node用户，并不保证存在vscode用户，因此连接可能失败。' }
      - line: 5
        kind: security
        note: { en: 'privileged grants broad device and kernel capabilities that this Node server task does not require.', zh: 'privileged授予广泛的设备与内核能力，而这个Node服务任务并不需要这些权限。' }
      - line: 7
        kind: readability
        note: { en: 'The shell string hides npm install failures with || true, making a broken environment look ready.', zh: 'shell字符串用 || true隐藏npm install失败，使损坏的环境看起来已经就绪。' }
      - line: 8
        kind: performance
        note: { en: 'Installing dependencies on every start repeats expensive work; installation belongs in a creation stage.', zh: '每次启动都安装依赖会重复高成本工作；安装应放在创建阶段。' }
    checklist:
      - { en: 'Resolve the image and Feature versions and verify their lockfiles or digests.', zh: '解析镜像与Feature版本，并验证锁文件或摘要。' }
      - { en: 'Confirm every named user exists and can write the mounted workspace.', zh: '确认每个指定用户都存在，并能写入挂载的工作区。' }
      - { en: 'Map commands to creation, start, and attach events and test each path.', zh: '把命令映射到创建、启动与连接事件，并测试每条路径。' }
      - { en: 'Remove unneeded privileges, mounts, sockets, secrets, and published ports.', zh: '移除不需要的权限、挂载、套接字、秘密与发布端口。' }
    explanation: { en: 'Use a Node 24 image reference, select the existing node user for both user scopes, remove privileged, deduplicate the port, run npm ci during creation, and let setup failures stop the environment.', zh: '应引用Node 24镜像，为两种用户作用域选择已有的node用户，移除privileged和重复端口，在创建阶段运行npm ci，并让配置失败直接终止环境。' }
    difficulty: advanced
    tags: [review, reproducibility, security, lifecycle]
