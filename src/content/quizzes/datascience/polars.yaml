topic: datascience/polars
items:
  - id: predict-window-total
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      import polars as pl

      sales = pl.DataFrame(
          {
              "order_id": [1, 2, 3],
              "region": ["East", "West", "East"],
              "amount": [10, 20, 30],
          }
      )
      result = sales.with_columns(
          pl.col("amount").sum().over("region").alias("region_total")
      ).select("order_id", "region_total")

      print(result.rows())
    lang: python
    options:
      - { text: { en: "[(1, 40), (2, 20), (3, 40)]", zh: "[(1, 40), (2, 20), (3, 40)]" }, correct: true }
      - { text: { en: "[(1, 10), (2, 20), (3, 30)]", zh: "[(1, 10), (2, 20), (3, 30)]" }, correct: false }
      - { text: { en: "[('East', 40), ('West', 20)]", zh: "[('East', 40), ('West', 20)]" }, correct: false }
      - { text: { en: 'It raises because an aggregation cannot appear in with_columns.', zh: '程序会抛出异常，因为聚合不能出现在with_columns中。' }, correct: false }
    explanation: { en: 'over("region") computes one sum per region and maps that value back to every row in the same window. It preserves the three input rows instead of reducing them like group_by().agg().', zh: 'over("region") 会为每个地区计算一次总和，再把结果映射回同一窗口中的每一行。它会保留三行输入，不像group_by().agg() 那样归约行数。' }
    difficulty: intermediate
    tags: [polars, window-expression, predict-output]

  - id: choose-lazy-file-entry
    type: mcq
    prompt: { en: 'Which expression keeps the Parquet scan inside a lazy query plan?', zh: '哪个表达式会把Parquet扫描保留在惰性查询计划中？' }
    options:
      - { text: { en: 'pl.scan_parquet("orders.parquet")', zh: 'pl.scan_parquet("orders.parquet")' }, correct: true }
      - { text: { en: 'pl.read_parquet("orders.parquet").lazy()', zh: 'pl.read_parquet("orders.parquet").lazy()' }, correct: false }
      - { text: { en: 'pl.read_parquet("orders.parquet")', zh: 'pl.read_parquet("orders.parquet")' }, correct: false }
      - { text: { en: 'pl.scan_parquet("orders.parquet").collect()', zh: 'pl.scan_parquet("orders.parquet").collect()' }, correct: false }
    explanation: { en: 'scan_parquet returns a LazyFrame whose scan node can participate in pushdown. read_parquet is already eager, while collect materializes a lazy query immediately.', zh: 'scan_parquet返回LazyFrame，扫描节点可以参与下推。read_parquet已经即时读取，而collect会立刻物化惰性查询。' }
    difficulty: beginner
    tags: [polars, lazyframe, parquet]

  - id: dependent-alias
    type: mcq
    prompt: { en: 'A tax expression needs the revenue alias created from quantity and unit_price. Which shape states that dependency correctly?', zh: '税额表达式依赖由quantity与unit_price创建的revenue别名。哪种写法能正确表达该依赖？' }
    options:
      - { text: { en: 'Chain one with_columns for revenue and a second with_columns for tax.', zh: '先用一次with_columns创建revenue，再串联第二次with_columns创建tax。' }, correct: true }
      - { text: { en: 'Create revenue and read pl.col("revenue") in sibling expressions in one with_columns.', zh: '在同一次with_columns的相邻表达式中创建revenue，再读取pl.col("revenue")。' }, correct: false }
      - { text: { en: 'Call collect between the two expressions and then continue on the same LazyFrame.', zh: '在两个表达式之间调用collect，再继续使用同一个LazyFrame。' }, correct: false }
      - { text: { en: 'Replace both expressions with a row-wise Python lambda.', zh: '把两个表达式都替换成逐行Python lambda。' }, correct: false }
    explanation: { en: 'Sibling expressions see the input schema of their shared context, not aliases created beside them. Two contexts make the intermediate alias part of the next input schema.', zh: '相邻表达式看到的是共同上下文的输入模式，看不到旁边刚创建的别名。串联两个上下文后，中间别名才会进入下一次调用的输入模式。' }
    difficulty: intermediate
    tags: [polars, expressions, with-columns]

  - id: normalize-null-and-nan
    type: mcq
    prompt: { en: 'A Float64 column uses both null and NaN for missing measurements. Which expression converts both to 0.0?', zh: '一个Float64列同时用null与NaN表示缺失测量值。哪个表达式能把两者都转换成0.0？' }
    options:
      - { text: { en: 'pl.col("value").fill_nan(None).fill_null(0.0)', zh: 'pl.col("value").fill_nan(None).fill_null(0.0)' }, correct: true }
      - { text: { en: 'pl.col("value").fill_null(0.0)', zh: 'pl.col("value").fill_null(0.0)' }, correct: false }
      - { text: { en: 'pl.col("value").fill_nan(0.0)', zh: 'pl.col("value").fill_nan(0.0)' }, correct: false }
      - { text: { en: 'pl.col("value").drop_nulls()', zh: 'pl.col("value").drop_nulls()' }, correct: false }
    explanation: { en: 'fill_nan(None) first converts NaN into the ordinary null representation, then fill_null handles both sources. Either fill operation alone leaves the other state untouched.', zh: 'fill_nan(None) 先把NaN转成普通空值表示，再由fill_null处理两种来源。单独使用任一种填充操作，都会留下另一种状态。' }
    difficulty: intermediate
    tags: [polars, 'null', nan, missing-data]

  - id: validate-order-customer-join
    type: mcq
    prompt: { en: 'Orders may repeat customer_id, while customers must contain a unique row per customer. Which validation matches the join?', zh: '订单可以重复customer_id，而客户表必须每个客户只有一行。哪个验证符合这次连接？' }
    options:
      - { text: { en: 'validate="m:1"', zh: 'validate="m:1"' }, correct: true }
      - { text: { en: 'validate="1:m"', zh: 'validate="1:m"' }, correct: false }
      - { text: { en: 'validate="1:1"', zh: 'validate="1:1"' }, correct: false }
      - { text: { en: 'validate="m:m"', zh: 'validate="m:m"' }, correct: false }
    explanation: { en: 'The left order key may repeat and the right customer key must be unique, so the relationship is many-to-one. The default m:m validation does not enforce uniqueness.', zh: '左侧订单键可以重复，右侧客户键必须唯一，所以关系是多对一。默认的m:m验证不会强制唯一性。' }
    difficulty: intermediate
    tags: [polars, join, cardinality, validation]

  - id: spot-python-and
    title: { en: 'Spot the bug in the Polars filter', zh: '找出Polars过滤器里的bug' }
    type: spotbug
    prompt: { en: 'Find why this generated filter cannot combine the two Polars predicates.', zh: '找出这段生成的过滤代码为什么无法组合两个Polars谓词。' }
    code: |
      import polars as pl

      def select_paid(orders):
          return orders.filter(
              pl.col("paid") and (pl.col("amount") > 0)
          )
    lang: python
    issues:
      - line: 5
        kind: correctness
        note: { en: 'Python and asks for the truth value of an Expr instead of constructing a Polars Boolean expression.', zh: 'Python的and会要求Expr提供真假值，而不是构造Polars布尔表达式。' }
    explanation: { en: 'Use pl.col("paid") & (pl.col("amount") > 0). The bitwise operator is overloaded to compose expressions, while Python and controls Python evaluation.', zh: '应使用pl.col("paid") & (pl.col("amount") > 0)。位运算符经过重载，可以组合表达式；Python的and控制的是Python求值。' }
    difficulty: beginner
    tags: [polars, expressions, boolean-filter, code-review]

  - id: review-generated-segment-revenue
    title: { en: 'Review generated segment revenue pipeline', zh: '审查生成的分组收入管道' }
    type: review
    prompt: { en: 'Review this generated segment-revenue pipeline before it processes uploaded order files.', zh: '在这段生成的分组收入流程处理上传订单文件前，对它进行审查。' }
    task: { en: 'Read one CSV from a fixed order directory, retain rows with an optional missing region, derive revenue and tax, enforce a many-to-one customer join, retain unmatched customers as their own segment, and aggregate through one visible lazy execution boundary.', zh: '从固定订单目录读取一个CSV，保留可选地区缺失的行，派生收入与税额，强制执行多对一客户连接，把未匹配客户保留为独立分组，并通过一个可见的惰性执行边界完成聚合。' }
    code: |
      from pathlib import Path

      import polars as pl

      def segment_revenue(file_name, customers):
          path = Path("/srv/orders") / file_name
          orders = pl.read_csv(path).lazy()

          report = (
              orders
              .with_columns(
                  (pl.col("quantity") * pl.col("unit_price")).alias("revenue"),
                  (pl.col("revenue") * 0.2).alias("tax"),
              )
              .filter(pl.col("region") != None)
              .join(customers.lazy(), on="customer_id", how="left")
              .group_by("segment")
              .agg((pl.col("revenue") + pl.col("tax")).sum())
              .collect()
          )
          return report
    lang: python
    right: { en: 'The code uses a fixed base directory, keeps the transformations in Polars expressions, chooses a left join, names the join key, and has one visible collect call.', zh: '代码使用固定基础目录，把转换保留在Polars表达式中，选择左连接并命名连接键，而且只有一个可见的collect调用。' }
    checklist:
      - { en: 'Resolve the path, require the CSV suffix, and prove the result remains inside the fixed directory.', zh: '解析路径，强制要求CSV后缀，并证明结果仍位于固定目录内。' }
      - { en: 'Declare the input schema, null policy, numeric ranges, and customer-key uniqueness.', zh: '声明输入模式、空值策略、数值范围与客户键唯一性。' }
      - { en: 'Inspect the lazy plan and keep every alias dependency in a valid expression context.', zh: '检查惰性计划，确保每个别名依赖都位于有效的表达式上下文。' }
      - { en: 'Test duplicate and unmatched keys, then compare row counts and revenue totals.', zh: '测试重复键与未匹配键，再比较行数和收入总量。' }
    issues:
      - line: 6
        kind: security
        note: { en: 'file_name may contain path separators and escape the fixed order directory before Polars opens it.', zh: 'file_name可能包含路径分隔符，在Polars打开文件前逃出固定订单目录。' }
      - line: 7
        kind: performance
        note: { en: 'read_csv materializes the file before lazy starts, so the scan cannot participate in predicate or projection pushdown.', zh: 'read_csv会在惰性流程开始前物化文件，因此扫描无法参与谓词下推或投影下推。' }
      - line: 13
        kind: correctness
        note: { en: 'The tax expression reads revenue in the same with_columns context where a sibling creates it, so revenue is absent from the input schema.', zh: '税额表达式在同一次with_columns中读取相邻表达式创建的revenue，因此输入模式中还没有revenue。' }
      - line: 15
        kind: edge-case
        note: { en: 'Comparing with None does not express a null predicate and also contradicts the requirement to retain rows whose optional region is missing.', zh: '与None比较不能表达空值谓词，而且与保留可选地区缺失行的要求矛盾。' }
      - line: 16
        kind: readability
        note: { en: 'The join leaves both the required many-to-one validation and the unmatched-segment policy implicit.', zh: '连接没有明确写出所需的多对一验证，也没有说明未匹配分组策略。' }
    explanation: { en: 'Validate the resolved path, begin with scan_csv and a declared schema, and derive tax in a second context. Remove the region filter, join with validate="m:1", fill or reject unmatched segments explicitly, then collect once and check conserved totals.', zh: '应验证解析后的路径，从带声明模式的scan_csv开始，并在第二个上下文派生税额。删除地区过滤，使用validate="m:1" 连接，明确填充或拒绝未匹配分组，最后只收集一次并检查守恒总量。' }
    difficulty: advanced
    tags: [polars, code-review, lazyframe, join, schema-validation]
