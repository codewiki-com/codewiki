topic: datascience/pandas-guide
items:
  - id: predict-index-alignment
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      import pandas as pd

      left = pd.Series([10, 20], index=["a", "b"])
      right = pd.Series([1, 2], index=["b", "c"])
      result = (left + right).fillna(-1).astype(int)
      print(result.to_dict())
    lang: python
    options:
      - { text: { en: "{'a': -1, 'b': 21, 'c': -1}", zh: "{'a': -1, 'b': 21, 'c': -1}" }, correct: true }
      - { text: { en: "{'a': 11, 'b': 22}", zh: "{'a': 11, 'b': 22}" }, correct: false }
      - { text: { en: "{'b': 21}", zh: "{'b': 21}" }, correct: false }
      - { text: { en: 'It raises because the indexes differ.', zh: '程序会因为索引不同而抛出异常。' }, correct: false }
    explanation: { en: 'pandas aligns the labels first and forms their union. Only label b exists on both sides, so a and c become missing before fillna replaces them.', zh: 'pandas会先对齐标签，并取两侧标签的并集。只有标签b同时存在于两侧，因此a和c先变成缺失值，再由fillna替换。' }
    difficulty: beginner
    tags: [pandas, index-alignment, predict-output]

  - id: select-one-column-shape
    type: mcq
    prompt: { en: 'Which expression selects one named column while preserving a two-dimensional DataFrame?', zh: '哪个表达式在选择一个具名列时仍保留二维DataFrame？' }
    options:
      - { text: { en: 'df[["revenue"]]', zh: 'df[["revenue"]]' }, correct: true }
      - { text: { en: 'df["revenue"]', zh: 'df["revenue"]' }, correct: false }
      - { text: { en: 'df.loc[:, "revenue"]', zh: 'df.loc[:, "revenue"]' }, correct: false }
      - { text: { en: 'df.at[0, "revenue"]', zh: 'df.at[0, "revenue"]' }, correct: false }
    explanation: { en: 'A list of column labels asks for a DataFrame, even when the list contains one label. A scalar label selects a Series, and at selects one scalar.', zh: '列标签列表会返回DataFrame，即使列表中只有一个标签。标量标签会选择Series，而at只选择一个标量。' }
    difficulty: beginner
    tags: [pandas, dataframe, series, selection]

  - id: missing-group-key
    type: mcq
    prompt: { en: 'A revenue report must retain rows whose region is missing. Which groupby choice states that policy?', zh: '收入报表必须保留地区缺失的行。哪个groupby选项明确表达了这项策略？' }
    options:
      - { text: { en: 'groupby("region", dropna=False)', zh: 'groupby("region", dropna=False)' }, correct: true }
      - { text: { en: 'groupby("region")', zh: 'groupby("region")' }, correct: false }
      - { text: { en: 'groupby("region", sort=False)', zh: 'groupby("region", sort=False)' }, correct: false }
      - { text: { en: 'groupby("region", as_index=False)', zh: 'groupby("region", as_index=False)' }, correct: false }
    explanation: { en: 'groupby drops missing grouping keys by default. dropna=False retains a missing-key group; sort and as_index change ordering or output shape, not this policy.', zh: 'groupby默认丢弃分组键缺失的行。dropna=False会保留缺失键分组；sort与as_index改变的是顺序或输出形状，不是这项策略。' }
    difficulty: intermediate
    tags: [pandas, groupby, missing-data]

  - id: validate-customer-join
    type: mcq
    prompt: { en: 'Many orders may reference one customer, and customer IDs must be unique in the customer table. Which validation describes the join?', zh: '多笔订单可以引用同一客户，而客户表中的客户ID必须唯一。哪个验证描述了这次连接？' }
    options:
      - { text: { en: 'validate="many_to_one"', zh: 'validate="many_to_one"' }, correct: true }
      - { text: { en: 'validate="one_to_many"', zh: 'validate="one_to_many"' }, correct: false }
      - { text: { en: 'validate="one_to_one"', zh: 'validate="one_to_one"' }, correct: false }
      - { text: { en: 'validate="many_to_many"', zh: 'validate="many_to_many"' }, correct: false }
    explanation: { en: 'The left order key can repeat and the right customer key must be unique, which is many-to-one. Reversing the input tables would reverse the cardinality name.', zh: '左侧订单键可以重复，右侧客户键必须唯一，所以是多对一。交换两张输入表后，基数名称也会反转。' }
    difficulty: intermediate
    tags: [pandas, merge, cardinality]

  - id: spot-chained-assignment
    title: { en: 'Spot the bug in the paid-row marker', zh: '找出付款行标记里的bug' }
    type: spotbug
    prompt: { en: 'Find why this function does not mark paid rows in the original DataFrame.', zh: '找出这个函数没有在原DataFrame中标记已付款行的原因。' }
    code: |
      def mark_paid(orders):
          paid = orders[orders["paid"]]
          paid["status"] = "ready"
          return orders
    lang: python
    issues:
      - line: 3
        kind: correctness
        note: { en: 'paid is a derived object, so assigning to it under Copy-on-Write does not update orders; the function returns the unchanged source.', zh: 'paid是派生对象，在写时复制语义下给它赋值不会更新orders；函数最终返回未改变的源对象。' }
    explanation: { en: 'Assign directly to the intended target with orders.loc[orders["paid"], "status"] = "ready", or return an explicitly copied and modified result.', zh: '应使用orders.loc[orders["paid"], "status"] = "ready" 直接写入目标，或者显式复制、修改并返回新结果。' }
    difficulty: intermediate
    tags: [pandas, copy-on-write, chained-assignment]

  - id: review-generated-customer-revenue
    title: { en: 'Review generated customer revenue pipeline', zh: '审查生成的客户收入管道' }
    type: review
    prompt: { en: 'Review this generated customer-revenue pipeline before it processes uploaded order files.', zh: '在这段生成的客户收入流程处理上传订单文件前，对它进行审查。' }
    task: { en: 'Load one CSV from a fixed order directory, retain rows with an optional missing email, leave inputs unchanged, mark high-value orders, enforce a many-to-one customer join, retain unmatched customers as their own segment, and aggregate revenue without row-wise Python loops.', zh: '从固定订单目录加载一个CSV，保留可选邮箱缺失的行，不修改输入，标记高价值订单，强制执行多对一客户连接，把未匹配客户保留为独立分组，并且不使用逐行Python循环来聚合收入。' }
    code: |
      from pathlib import Path
      import pandas as pd

      def customer_revenue(file_name, customers):
          path = Path("/srv/orders") / file_name
          orders = pd.read_csv(path)

          orders = orders.dropna()
          orders["email"] = orders["email"].str.lower()

          vip = orders[orders["total"] > 100]
          vip["priority"] = True

          joined = vip.merge(customers, on="customer_id", how="left")

          rows = []
          for _, row in joined.iterrows():
              rows.append({"segment": row["segment"], "total": row["total"]})

          report = pd.DataFrame(rows).groupby("segment")["total"].sum()
          report.fillna(0, inplace=True)
          return report
    lang: python
    right: { en: 'The code uses a fixed base directory, names the join key and join direction, normalizes email text with the string accessor, and returns a labeled revenue result.', zh: '代码使用固定基础目录，明确连接键与连接方向，通过字符串访问器统一邮箱文本，并返回带标签的收入结果。' }
    checklist:
      - { en: 'Resolve the file path, enforce the CSV suffix, and prove it remains inside the fixed directory.', zh: '解析文件路径，强制要求CSV后缀，并证明结果仍位于固定目录内。' }
      - { en: 'Declare required columns, dtypes, null policy, and key uniqueness before transforming data.', zh: '转换数据前声明必需列、数据类型、空值策略和键唯一性。' }
      - { en: 'Test duplicate, unmatched, and null join keys, then compare row counts and revenue totals.', zh: '测试重复、未匹配和空连接键，再比较行数与收入总额。' }
      - { en: 'Trace every assignment to its owner and replace row loops with column or group operations.', zh: '跟踪每次赋值的所有者，并用列操作或分组操作替代逐行循环。' }
    issues:
      - line: 5
        kind: security
        note: { en: 'file_name can contain path separators and escape the fixed order directory before read_csv opens it.', zh: 'file_name可以包含路径分隔符，在read_csv打开文件前逃出固定订单目录。' }
      - line: 8
        kind: edge-case
        note: { en: 'Bare dropna removes a row when any column is missing, including the optional email, instead of validating only required fields.', zh: '不带参数的dropna会删除任意列缺失的行，包括可选邮箱，而不是只验证必需字段。' }
      - line: 12
        kind: correctness
        note: { en: 'Assigning through the filtered vip object cannot mark the intended source under Copy-on-Write and makes ownership ambiguous.', zh: '通过过滤得到的vip对象赋值，在写时复制语义下无法标记预期源对象，也使所有权含糊。' }
      - line: 14
        kind: readability
        note: { en: 'The merge leaves the many-to-one cardinality and unmatched-key policy implicit because it uses neither validate nor indicator.', zh: '连接既没有使用validate，也没有使用indicator，因此多对一基数与未匹配键策略都没有明确表达。' }
      - line: 17
        kind: performance
        note: { en: 'iterrows and repeated Python dictionary construction duplicate a column selection that pandas can aggregate directly.', zh: 'iterrows和反复构造Python字典重复实现了pandas可以直接完成的列选择与聚合。' }
    explanation: { en: 'Resolve and validate the path first, parse a declared schema, and check only required fields. Use one explicit assignment, merge with validate and indicator, fill unmatched segment labels before grouping, then aggregate columns directly.', zh: '应先解析并验证路径，再按声明的模式读取，只检查必需字段。使用一次明确赋值，带validate和indicator连接，在分组前填充未匹配的分组标签，最后直接按列聚合。' }
    difficulty: advanced
    tags: [pandas, code-review, merge, copy-on-write, validation]
