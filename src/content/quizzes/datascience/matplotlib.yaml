topic: datascience/matplotlib
items:
  - id: predict-artist-counts
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      import matplotlib
      matplotlib.use("Agg")
      import matplotlib.pyplot as plt

      fig, (left, right) = plt.subplots(1, 2)
      left.plot([1, 2], [3, 4])
      right.bar(["A", "B"], [5, 6])
      print(len(fig.axes), len(left.lines), len(right.patches))
      plt.close(fig)
    lang: python
    options:
      - { text: { en: '2 1 2', zh: '2 1 2' }, correct: true }
      - { text: { en: '1 2 1', zh: '1 2 1' }, correct: false }
      - { text: { en: '2 2 2', zh: '2 2 2' }, correct: false }
      - { text: { en: 'It prints nothing because Agg is non-interactive.', zh: '因为 Agg 是非交互式后端，所以没有输出。' }, correct: false }
    explanation: { en: 'The Figure owns two Axes. plot adds one line to the left Axes, while bar adds two rectangle patches to the right Axes.', zh: 'Figure 包含两个 Axes。plot 向左侧 Axes 添加一条线，bar 向右侧 Axes 添加两个矩形 patch。' }
    difficulty: beginner
    tags: [figure, axes, artist, predict-output]

  - id: distinguish-axes-and-axis
    type: mcq
    prompt: { en: 'Which statement correctly distinguishes Axes from Axis?', zh: '哪项陈述正确区分了 Axes 与 Axis？' }
    options:
      - { text: { en: 'An Axes is one plotting area; its Axis objects manage scales, ticks, and tick labels.', zh: 'Axes 是一个绘图区；其中的 Axis 对象管理尺度、刻度和刻度标签。' }, correct: true }
      - { text: { en: 'An Axis contains every subplot, while an Axes is only one tick line.', zh: 'Axis 包含全部子图，而 Axes 只是一条刻度线。' }, correct: false }
      - { text: { en: 'Axes and Axis are interchangeable names for the same class.', zh: 'Axes 与 Axis 是同一个类的两个可互换名称。' }, correct: false }
    explanation: { en: 'Most plotting methods belong to Axes. Direct Axis work is usually reserved for locators, formatters, scales, and tick details.', zh: '大多数绘图方法属于 Axes。通常只有配置 locator、formatter、尺度和刻度细节时才直接操作 Axis。' }
    difficulty: beginner
    tags: [axes, axis, object-model]

  - id: comparable-panel-colors
    type: mcq
    prompt: { en: 'Two scatter panels must use the same color for the same latency. What should they share?', zh: '两个散点面板必须让相同延迟使用相同颜色。它们应共享什么？' }
    options:
      - { text: { en: 'One Normalize range and one colormap', zh: '同一个 Normalize 范围和同一个 colormap' }, correct: true }
      - { text: { en: 'Only the marker size', zh: '只共享标记大小' }, correct: false }
      - { text: { en: 'Separate automatic ranges and separate colorbars', zh: '各自的自动范围和各自的颜色条' }, correct: false }
      - { text: { en: 'The current pyplot Axes', zh: 'pyplot 的当前 Axes' }, correct: false }
    explanation: { en: 'Normalization assigns numeric values to positions in the colormap. Separate automatic ranges can give one value different colors across panels.', zh: '归一化先把数值映射到 colormap 中的位置。各自使用自动范围时，同一数值在不同面板中可能得到不同颜色。' }
    difficulty: intermediate
    tags: [colormap, normalize, comparison]

  - id: spot-labels-and-cleanup
    type: spotbug
    prompt: { en: 'Find the tick-label and lifecycle bugs in this batch renderer.', zh: '找出这个批量渲染函数中的刻度标签和生命周期错误。' }
    code: |
      import matplotlib.pyplot as plt

      def save_reports(series_by_name):
          for name, values in series_by_name.items():
              fig, ax = plt.subplots()
              ax.bar(range(len(values)), values)
              ax.set_xticklabels(["A", "B", "C"])
              fig.savefig(f"{name}.png")
    lang: python
    issues:
      - line: 7
        kind: correctness
        note: { en: 'The labels are applied without fixed tick positions, so they can drift from the bars and can trigger a FixedFormatter warning.', zh: '代码没有固定刻度位置就设置标签，标签可能与柱形错位，还可能触发 FixedFormatter 警告。' }
      - line: 8
        kind: performance
        note: { en: 'Each iteration leaves its Figure open in pyplot, so a long batch retains every artist tree.', zh: '每轮都把 Figure 留在 pyplot 中，长批次会持续保留所有图元树。' }
    explanation: { en: 'Set positions and labels together with set_xticks, and close each specific Figure in a finally block after saving.', zh: '应使用 set_xticks 同时设置位置与标签，并在保存后通过 finally 关闭本轮创建的 Figure。' }
    difficulty: intermediate
    tags: [ticks, cleanup, batch-rendering]

  - id: choose-output-format
    type: mcq
    prompt: { en: 'A report logo and line plot must stay sharp when scaled in a document. Which output is the best starting point?', zh: '报告中的标志和折线图需要在文档中缩放后仍保持清晰。应优先选择哪种输出？' }
    options:
      - { text: { en: 'SVG or PDF, then inspect the real file', zh: 'SVG 或 PDF，并检查实际文件' }, correct: true }
      - { text: { en: 'A 72 DPI PNG in every case', zh: '任何情况下都使用 72 DPI PNG' }, correct: false }
      - { text: { en: 'A screenshot of the notebook output', zh: 'Notebook 输出的屏幕截图' }, correct: false }
      - { text: { en: 'Any format, because DPI changes vector geometry', zh: '任意格式，因为 DPI 会改变矢量几何' }, correct: false }
    explanation: { en: 'SVG and PDF preserve vector descriptions for lines and text. Dense collections may still favor rasterization, so the actual artifact must be checked.', zh: 'SVG 与 PDF 会保留线条和文字的矢量描述。密集集合仍可能更适合栅格化，因此必须检查实际产物。' }
    difficulty: beginner
    tags: [savefig, vector, raster, dpi]

  - id: review-generated-latency-chart
    type: review
    prompt: { en: 'Review this generated latency-chart renderer before it writes web assets.', zh: '在这段生成的延迟图渲染代码写入 Web 资源前，对它进行审查。' }
    task: { en: 'Preserve service order, reject empty or incomplete records, label latency in milliseconds, write one fixed asset path, and release every Figure even when saving fails.', zh: '保留服务顺序，拒绝空记录或字段不全的记录，以毫秒标注延迟，只写入固定资源路径，并在保存失败时也释放每个 Figure。' }
    code: |
      from pathlib import Path
      import matplotlib.pyplot as plt

      def render_latency(records, output_name):
          labels = [row["service"] for row in records]
          values = [row["latency_ms"] for row in records]

          plt.figure(figsize=(8, 4))
          plt.bar(labels, sorted(values), color="green")
          plt.ylim(min(values), max(values))
          plt.xticks(rotation=90)
          plt.title("Service report")
          plt.ylabel("Value")
          plt.tight_layout()

          target = Path("/srv/charts") / f"{output_name}.png"
          plt.savefig(target, dpi=120)
          return target
    lang: python
    right: { en: 'The code extracts named fields once, gives the Figure an explicit size, labels the plot, applies a layout pass, and returns the artifact path.', zh: '代码只提取一次具名字段，为 Figure 指定明确尺寸，添加图表标签，执行布局，并返回产物路径。' }
    checklist:
      - { en: 'Test empty input, missing fields, duplicate services, NaN, and extreme values.', zh: '测试空输入、字段缺失、服务重复、NaN 和极端值。' }
      - { en: 'Trace one record from input order to its bar position and label.', zh: '从输入顺序开始，跟踪一条记录对应的柱形位置与标签。' }
      - { en: 'Treat the output path and file name as a fixed application boundary.', zh: '把输出路径和文件名作为固定的应用边界处理。' }
      - { en: 'Force a save failure and assert that the created Figure is still closed.', zh: '强制制造保存失败，并断言创建的 Figure 仍被关闭。' }
    issues:
      - line: 9
        kind: correctness
        note: { en: 'Sorting only values breaks their association with labels, so a service can be shown with another service’s latency.', zh: '只排序数值会破坏它们与标签的对应关系，某个服务可能显示成另一个服务的延迟。' }
      - line: 10
        kind: edge-case
        note: { en: 'Empty input makes min and max raise before the function can produce the required validation result.', zh: '输入为空时，min 和 max 会先抛出异常，函数无法给出任务要求的校验结果。' }
      - line: 13
        kind: readability
        note: { en: 'The label Value omits the latency unit, leaving readers unable to interpret the scale.', zh: '标签 Value 没有写出延迟单位，读者无法解释尺度。' }
      - line: 16
        kind: security
        note: { en: 'An untrusted output_name can contain path separators and escape the intended asset directory.', zh: '不可信的 output_name 可以包含路径分隔符，逃出预期的资源目录。' }
      - line: 17
        kind: performance
        note: { en: 'The pyplot Figure is never closed, including after save errors, so repeated requests retain figures and artists.', zh: 'pyplot Figure 从未关闭，保存失败时也一样；重复请求会持续保留图形和图元。' }
    explanation: { en: 'Validate records before plotting, preserve label-value pairs, use an Axes with explicit units, and write to a constant application-owned path. Close the exact Figure in finally so success and failure have the same lifecycle.', zh: '应先校验记录，再绘图；保持标签与数值成对，使用带明确单位的 Axes，并写入应用拥有的固定路径。通过 finally 关闭对应 Figure，让成功与失败路径具有相同生命周期。' }
    difficulty: advanced
    tags: [code-review, object-ownership, validation, output-path]
