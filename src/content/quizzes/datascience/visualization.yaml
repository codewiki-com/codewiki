topic: datascience/visualization
items:
  - id: predict-missing-segments
    type: predict
    prompt: { en: 'How many line segments does this program report?', zh: '这段程序会报告几条折线段？' }
    code: |
      def segment_count(values):
          count = 0
          inside_segment = False
          for value in values:
              if value is None:
                  inside_segment = False
              elif not inside_segment:
                  count += 1
                  inside_segment = True
          return count

      print(segment_count([1.0, 2.0, None, 3.0, None, None, 4.0]))
    lang: python
    options:
      - { text: { en: '1', zh: '1' }, correct: false }
      - { text: { en: '2', zh: '2' }, correct: false }
      - { text: { en: '3', zh: '3' }, correct: true }
      - { text: { en: '4', zh: '4' }, correct: false }
    explanation: { en: 'A missing value closes the current segment. Consecutive missing values do not create extra segments, so the three observed runs produce 3.', zh: '缺失值会结束当前线段，连续缺失值不会额外创建线段，因此三段连续观测会得到3。' }
    difficulty: beginner
    tags: [missing-values, line-chart, predict-output]
    tests: python3 missing_segments.py

  - id: choose-category-comparison
    type: mcq
    prompt: { en: 'You need accurate comparison of profit across twelve regions. What is the best starting point?', zh: '需要准确比较12个地区的利润，最合适的起点是什么？' }
    options:
      - { text: { en: 'An ordered horizontal bar chart with units and a zero baseline', zh: '带单位与零基线的有序水平柱形图' }, correct: true }
      - { text: { en: 'A twelve-slice pie chart ordered by hue', zh: '按色相排序的12扇区饼图' }, correct: false }
      - { text: { en: 'A 3D radar chart with one spoke per region', zh: '每个地区占一条轴的三维雷达图' }, correct: false }
      - { text: { en: 'A line chart in arbitrary region order', zh: '地区顺序任意的折线图' }, correct: false }
    explanation: { en: 'Bars compare lengths on a common scale, and a horizontal layout leaves room for region labels. A zero baseline preserves the length ratio.', zh: '柱形让读者在共同尺度上比较长度，水平布局也为地区名留出空间。零基线能够保留长度比例。' }
    difficulty: beginner
    tags: [chart-selection, comparison, baseline]

  - id: share-panel-color-domain
    type: mcq
    prompt: { en: 'Two heatmap panels must give the same temperature the same color. What must be shared?', zh: '两个热力图面板必须让相同温度使用相同颜色。它们必须共享什么？' }
    options:
      - { text: { en: 'The numeric domain, normalization, colormap, and colorbar units', zh: '数值领域、归一化、colormap与颜色条单位' }, correct: true }
      - { text: { en: 'Only the number of cells in each panel', zh: '只共享每个面板的单元格数量' }, correct: false }
      - { text: { en: 'Independent automatic limits and matching titles', zh: '各自的自动范围与相同标题' }, correct: false }
      - { text: { en: 'Only the lowest color in the palette', zh: '只共享色板中最低端的颜色' }, correct: false }
    explanation: { en: 'A colormap is comparable only when values pass through the same normalization and units. Independent automatic domains can assign different colors to one temperature.', zh: '只有数值经过相同归一化且单位一致时，colormap才能比较。各自使用自动领域，会让同一温度得到不同颜色。' }
    difficulty: intermediate
    tags: [color, normalization, small-multiples]

  - id: spot-broken-bar-spec
    title: { en: 'Spot the bug in the bar chart data', zh: '找出柱形图数据里的bug' }
    type: spotbug
    prompt: { en: 'Find the record-identity and scale bugs in this bar-chart preparation function.', zh: '找出这个柱形图准备函数中的记录对应与尺度错误。' }
    code: |
      def chart_rows(records):
          labels = [row["region"] for row in records]
          values = sorted(row["profit"] for row in records)
          domain = (min(values), max(values))
          return labels, values, domain
    lang: python
    issues:
      - line: 3
        kind: correctness
        note: { en: 'Sorting values without their records disconnects each profit from its region label.', zh: '只排序数值而不移动完整记录，会让利润与地区标签失去对应。' }
      - line: 4
        kind: edge-case
        note: { en: 'Empty input makes min and max raise without a clear validation error.', zh: '空输入会让min和max直接抛出异常，缺少明确的校验错误。' }
      - line: 4
        kind: correctness
        note: { en: 'Using the observed minimum as the bar domain can remove the zero baseline and exaggerate length differences.', zh: '把观测最小值作为柱形领域下界，可能移除零基线并夸大长度差异。' }
    explanation: { en: 'Validate records, sort complete label-value pairs, and derive a domain that includes zero. Tests should use unique labels, empty input, negatives, and non-finite values.', zh: '应先校验记录，排序完整的标签与数值对，并让领域包含零。测试要覆盖唯一标签、空输入、负数和非有限数值。' }
    difficulty: intermediate
    tags: [sorting, record-identity, scale-domain]

  - id: interpret-uncertainty-band
    type: mcq
    prompt: { en: 'A shaded band is labeled only “95%.” What information is still required?', zh: '一条阴影带只标为“95%”，还缺少什么信息？' }
    options:
      - { text: { en: 'The interval type, calculation method, sampling unit, and level', zh: '区间类型、计算方法、抽样单位与水平' }, correct: true }
      - { text: { en: 'Only a darker fill color', zh: '只需要更深的填充色' }, correct: false }
      - { text: { en: 'A second y-axis', zh: '第二条y轴' }, correct: false }
      - { text: { en: 'The plotting library name alone', zh: '只需要绘图库名称' }, correct: false }
    explanation: { en: 'An observation range, prediction interval, and confidence interval can all be drawn as bands but answer different questions. The label must identify what was calculated.', zh: '观测范围、预测区间与置信区间都能画成阴影带，却回答不同问题。标签必须说明实际计算的对象。' }
    difficulty: intermediate
    tags: [uncertainty, interval, labeling]

  - id: review-generated-profit-chart
    title: { en: 'Review generated profit chart renderer', zh: '审查生成的利润图渲染器' }
    type: review
    prompt: { en: 'Review this generated SVG bar renderer before it publishes a profit report.', zh: '在这段生成的SVG柱形图渲染器发布利润报告前，对它进行审查。' }
    task: { en: 'Sort complete records by profit, reject empty or non-finite input, preserve a zero baseline, encode sign without relying only on color, escape labels, write one fixed asset path, and avoid repeated scale scans.', zh: '按利润排序完整记录，拒绝空输入或非有限数值，保留零基线，不只靠颜色编码正负，转义标签，写入固定资源路径，并避免重复扫描尺度。' }
    code: |
      from html import escape
      from pathlib import Path

      def render_bars(records):
          labels = [row["region"] for row in records]
          values = sorted(row["profit"] for row in records)
          max_value = max(values)
          colors = ["green" if value >= 0 else "red" for value in values]

          lines = ['<svg viewBox="0 0 400 180">']
          for index, (label, value) in enumerate(zip(labels, values)):
              height = 120 * value / max(values)
              x = 20 + index * 80
              y = 150 - height
              lines.append(
                  f'<rect x="{x}" y="{y}" height="{height}" fill="{colors[index]}"><title>{label}: {value}</title></rect>'
              )
          lines.append("</svg>")

          target = Path("/srv/charts/profit.svg")
          target.write_text("".join(lines), encoding="utf-8")
          return target
    lang: python
    right: { en: 'The code reads named fields, uses a fixed canvas and application-owned path, includes per-bar titles, and writes with an explicit encoding.', zh: '代码读取具名字段，使用固定画布与应用拥有的路径，为每个柱形提供标题，并显式指定写入编码。' }
    checklist:
      - { en: 'Trace each label and value together through validation, ordering, and rendering.', zh: '让每组标签与数值共同经过校验、排序和渲染，并逐项追踪。' }
      - { en: 'Test empty input, duplicate labels, negative values, zero, NaN, infinity, and a constant series.', zh: '测试空输入、重复标签、负数、零、NaN、无穷与常量序列。' }
      - { en: 'Inspect the SVG text, zero baseline, units, accessible cues, and final rendered size.', zh: '检查SVG文本、零基线、单位、无障碍提示与最终渲染尺寸。' }
      - { en: 'Verify that the output target is fixed and all inserted text is escaped.', zh: '确认输出目标固定，并且所有插入文本都经过转义。' }
    issues:
      - line: 6
        kind: correctness
        note: { en: 'Sorting only values breaks their association with the labels retained in input order.', zh: '只排序数值会破坏它们与仍按输入顺序排列的标签之间的对应。' }
      - line: 7
        kind: edge-case
        note: { en: 'Empty input raises at max, and the function never validates NaN, infinity, duplicate labels, or a nonpositive scale.', zh: '空输入会在max处报错，函数也没有校验NaN、无穷、重复标签或非正尺度。' }
      - line: 8
        kind: readability
        note: { en: 'Red and green are the only sign encoding, so the distinction can disappear for some readers or grayscale output.', zh: '正负只通过红绿编码，部分读者或灰度输出可能无法分辨。' }
      - line: 12
        kind: performance
        note: { en: 'max(values) rescans the full list for every bar even though max_value was already computed.', zh: '每个柱形都重新用max(values) 扫描完整列表，尽管max_value已经计算过。' }
      - line: 16
        kind: security
        note: { en: 'The raw label is inserted into SVG markup, allowing untrusted data to inject elements or scripts.', zh: '原始标签直接插入SVG标记，不可信数据可以借此注入元素或脚本。' }
    explanation: { en: 'Validate and sort complete records, derive one domain that includes zero, and compute the scale once. Escape inserted text and add a non-color sign cue such as position around a labeled baseline or explicit symbols.', zh: '应校验并排序完整记录，推导包含零的统一领域，并只计算一次尺度。插入文本必须转义，还要通过带标签基线两侧的位置或显式符号增加非颜色提示。' }
    difficulty: advanced
    tags: [code-review, svg, accessibility, data-integrity]
    tests: python3 -m py_compile generated_profit_chart.py
