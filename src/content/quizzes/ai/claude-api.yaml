topic: ai/claude-api
items:
  - id: predict-mixed-content
    type: predict
    prompt: { en: 'What does this content-block parser print?', zh: '这段内容块解析代码会输出什么？' }
    code: |
      message = {
          "content": [
              {"type": "text", "text": "Ready"},
              {"type": "tool_use", "name": "lookup", "input": {}},
          ]
      }
      texts = [b["text"] for b in message["content"] if b["type"] == "text"]
      calls = [b for b in message["content"] if b["type"] == "tool_use"]
      print("".join(texts), len(calls))
    lang: python
    options:
      - { text: { en: 'Ready 1', zh: 'Ready 1' }, correct: true }
      - { text: { en: 'Ready 0', zh: 'Ready 0' }, correct: false }
      - { text: { en: 'It raises KeyError on the tool block.', zh: '程序会在工具块处抛出 KeyError。' }, correct: false }
    explanation: { en: 'Each comprehension filters by block type before reading type-specific fields, so it finds one text block and one tool call.', zh: '两个推导式都先按块类型过滤，再读取该类型独有的字段，因此会找到一个文本块和一个工具调用。' }
    difficulty: beginner
    tags: [content-blocks, predict-output]

  - id: messages-api-state
    type: mcq
    prompt: { en: 'What must a multi-turn application send on the next stateless Messages API request?', zh: '无状态 Messages API 的多轮应用在下一次请求中必须发送什么？' }
    options:
      - { text: { en: 'The conversation history needed for the next inference', zh: '下一轮推理所需的对话历史' }, correct: true }
      - { text: { en: 'Only the newest user message because the API stores the session', zh: '只发送最新用户消息，因为 API 会保存会话' }, correct: false }
      - { text: { en: 'Only the previous response ID', zh: '只发送上一次响应的 ID' }, correct: false }
    explanation: { en: 'Messages requests are stateless, so the application owns and resends the relevant history.', zh: 'Messages 请求是无状态的，因此应用负责保存并重新发送相关历史。' }
    difficulty: beginner
    tags: [messages-api, conversation-state]

  - id: spot-orphan-tool-result
    type: spotbug
    prompt: { en: 'Find the protocol errors in this generated tool continuation.', zh: '找出这段生成的工具续接代码中的协议错误。' }
    code: |
      def continue_tool(response, messages):
          call = response["content"][0]
          output = run_tool(call["name"], call["input"])
          messages.append({
              "role": "user",
              "content": [{
                  "type": "tool_result",
                  "tool_use_id": call["id"],
                  "content": output,
              }],
          })
          return messages
    lang: python
    issues:
      - line: 2
        kind: edge-case
        note: { en: 'The first content block may be text, and a response may contain more than one tool_use block.', zh: '第一个内容块可能是文本，而且响应可能包含多个 tool_use 块。' }
      - line: 4
        kind: correctness
        note: { en: 'The assistant content containing tool_use must be appended unchanged before the user tool_result turn.', zh: '在用户 tool_result 轮次之前，必须原样追加包含 tool_use 的助手内容。' }
    explanation: { en: 'Filter all content blocks by type, append the full assistant response content, and return one result paired to every tool-use ID.', zh: '应按类型筛选全部内容块，追加完整的助手响应内容，并为每个工具调用 ID 返回配对结果。' }
    difficulty: intermediate
    tags: [tool-use, conversation-state, code-review]

  - id: retry-boundary
    type: mcq
    prompt: { en: 'A charge-card tool times out after the remote service may have accepted the charge. What should happen first?', zh: '扣款工具超时，但远端服务可能已接受扣款。接下来首先应该做什么？' }
    options:
      - { text: { en: 'Query the durable result using the same idempotency key', zh: '使用同一个幂等键查询持久化结果' }, correct: true }
      - { text: { en: 'Ask the model to call the tool again with a new key', zh: '让模型使用新幂等键再次调用工具' }, correct: false }
      - { text: { en: 'Repeat the entire conversation until it returns text', zh: '重复整个对话，直到它返回文本' }, correct: false }
      - { text: { en: 'Assume the timeout means the charge failed', zh: '假设超时就表示扣款失败' }, correct: false }
    explanation: { en: 'A timeout does not prove whether the side effect committed. A stable idempotency key and durable outcome let the application recover without charging twice.', zh: '超时无法证明副作用是否已经提交。稳定的幂等键与持久结果能让应用恢复流程，同时避免重复扣款。' }
    difficulty: advanced
    tags: [retries, idempotency, tools]

  - id: review-generated-refund-handler
    type: review
    prompt: { en: 'Review this generated Claude refund handler before production use.', zh: '在投入生产前审查这段生成的 Claude 退款处理器。' }
    task: { en: 'Answer support requests and execute only authorized, retry-safe refunds through a client tool.', zh: '回答支持请求，并且只能通过客户端工具执行已授权、可安全重试的退款。' }
    code: |
      import os
      from anthropic import Anthropic
      def handle_refund(request):
          client = Anthropic(api_key=os.environ["ANTHROPIC_API_KEY"])
          response = client.messages.create(
              model="claude-sonnet-5",
              max_tokens=512,
              system=request["message"],
              tools=[REFUND_TOOL],
              messages=[{"role": "user", "content": request["message"]}],
          )
          if response.stop_reason == "tool_use":
              call = response.content[0]
              receipt = refund_order(**call.input)
              follow_up = client.messages.create(
                  model="claude-sonnet-5",
                  max_tokens=512,
                  tools=[REFUND_TOOL],
                  messages=[{"role": "user", "content": [{
                      "type": "tool_result", "tool_use_id": call.id,
                      "content": receipt,
                  }]}],
              )
              return follow_up.content[0].text
          return response.content[0].text
    lang: python
    issues:
      - line: 4
        kind: performance
        note: { en: 'Constructing a client per request prevents effective connection-pool reuse; configure and reuse a long-lived client.', zh: '每次请求都构造客户端，会妨碍连接池复用；应配置并复用长生命周期客户端。' }
      - line: 8
        kind: security
        note: { en: 'Untrusted user text becomes a system instruction, giving prompt injection higher authority than intended.', zh: '不可信的用户文本被提升为系统指令，使提示注入获得了不应有的高权限。' }
      - line: 13
        kind: edge-case
        note: { en: 'The first block is not guaranteed to be tool_use, and the response can request several tools.', zh: '第一个块不保证是 tool_use，而且一个响应可能请求多个工具。' }
      - line: 19
        lines: 4
        kind: correctness
        note: { en: 'The follow-up omits both the original user turn and the assistant content containing tool_use, leaving an orphan tool_result.', zh: '后续请求遗漏原始用户轮次和包含 tool_use 的助手内容，导致 tool_result 无法配对。' }
    right: { en: 'The handler reads the API key from the environment, uses the current Messages entry point and model, declares a bounded output, and provides a tool definition.', zh: '处理器从环境变量读取 API 密钥，使用当前的 Messages 入口与模型，设置了输出上限，并提供了工具定义。' }
    checklist:
      - { en: 'Keep trusted system instructions separate from user content.', zh: '把可信系统指令与用户内容分开。' }
      - { en: 'Enumerate every content block and preserve complete turn history.', zh: '遍历每个内容块，并保留完整轮次历史。' }
      - { en: 'Authorize tool actions and attach a durable idempotency key.', zh: '授权工具动作，并绑定持久化幂等键。' }
      - { en: 'Reuse the client and test every terminal stop reason.', zh: '复用客户端，并测试每种终止停止原因。' }
    explanation: { en: 'Build the client once, keep the system prompt trusted, and dispatch every tool block through an authorized, idempotent handler. The next request must include the original history, the unchanged assistant content, and all paired tool results.', zh: '应只构造一次客户端，保持系统提示词可信，并通过已授权、具备幂等性的处理器分派每个工具块。下一次请求必须包含原始历史、未经修改的助手内容和所有配对工具结果。' }
    difficulty: advanced
    tags: [messages-api, tool-use, security, code-review]
