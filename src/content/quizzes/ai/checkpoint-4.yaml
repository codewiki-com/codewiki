topic: ai/checkpoint-4
items:
  - id: checkpoint-4-react-loop
    type: mcq
    prompt: { en: 'Which execution pattern characterizes a ReAct-style agent?', zh: '哪种执行模式符合ReAct风格智能体？' }
    options:
      - { text: { en: 'It alternates deciding an action, executing an allowed tool, and incorporating the observation until a stop condition', zh: '它交替进行动作决策、执行允许的工具并吸收观察结果，直到满足停止条件' }, correct: true }
      - { text: { en: 'It creates one response and executes every phrase in that response as a shell command', zh: '它生成一次响应，并把其中每句话都作为shell命令执行' }, correct: false }
      - { text: { en: 'It must create a complete immutable plan and may never revise it after tool feedback', zh: '它必须先生成完整且不可变的计划，收到工具反馈后也不得调整' }, correct: false }
    explanation: { en: 'ReAct interleaves reasoning and action with observations. Production implementations must bound the loop and mediate every tool call.', zh: 'ReAct把推理、动作与观察交错执行；生产实现必须限制循环，并代理审核每次工具调用。' }
    difficulty: beginner
    tags: [checkpoint]

  - id: checkpoint-4-agent-loop
    type: fill
    prompt: { en: 'Name the cyclic control structure that sends tool results or screenshots back to a model before choosing the next action.', zh: '写出把工具结果或截图传回模型、再选择下一动作的英文循环结构名称。' }
    answer: agent loop
    explanation: { en: 'The agent loop coordinates model decisions, application-controlled execution, observations, and termination.', zh: '智能体循环协调模型决策、由应用控制的执行、观察结果与终止条件。' }
    difficulty: beginner
    tags: [checkpoint]

  - id: checkpoint-4-langgraph-mechanics
    type: mcq
    prompt: { en: 'Which description matches LangGraph execution?', zh: '哪项描述符合LangGraph的执行机制？' }
    options:
      - { text: { en: 'Nodes read shared state and return updates, while normal or conditional edges choose the next node and can form cycles', zh: '节点读取共享状态并返回更新，普通边或条件边选择下一节点，且可以形成循环' }, correct: true }
      - { text: { en: 'Nodes mutate an untyped global object, and execution must remain a single linear chain', zh: '节点修改无类型的全局对象，且执行必须保持为单一线性链' }, correct: false }
      - { text: { en: 'Edges store model weights, while nodes are only visualization labels', zh: '边存储模型权重，节点只是可视化标签' }, correct: false }
    explanation: { en: 'LangGraph makes state and routing explicit through state schemas, nodes, and edges, including branches and loops.', zh: 'LangGraph通过状态模式、节点与边显式表达状态和路由，其中包括分支与循环。' }
    difficulty: intermediate
    tags: [checkpoint]

  - id: checkpoint-4-checkpointing
    type: fill
    prompt: { en: 'Name the persistence mechanism that saves graph state so a long-running agent can resume the correct thread.', zh: '写出保存图状态、使长时运行智能体能恢复到正确线程的英文机制。' }
    answer: checkpointing
    explanation: { en: 'Checkpointing persists state at defined points; a stable thread identifier prevents one conversation from loading another conversation’s state.', zh: '检查点机制会在指定位置持久化状态；稳定的线程标识可以防止一个对话加载另一个对话的状态。' }
    difficulty: intermediate
    tags: [checkpoint]

  - id: checkpoint-4-modality-fusion
    type: mcq
    prompt: { en: 'What is the defining purpose of multimodal fusion?', zh: '多模态融合的核心目的是什么？' }
    options:
      - { text: { en: 'Combine representations or decisions from modalities such as text, image, and audio so they inform one task', zh: '组合文本、图像和音频等模态的表示或决策，使它们共同服务于一个任务' }, correct: true }
      - { text: { en: 'Convert every modality into raw text and discard all non-text structure before encoding', zh: '在编码前把每种模态都转为原始文本，并丢弃全部非文本结构' }, correct: false }
      - { text: { en: 'Train independent models whose outputs are never compared or combined', zh: '训练彼此独立、输出永不比较或组合的模型' }, correct: false }
    explanation: { en: 'Fusion lets evidence from multiple modalities interact, whether features are combined early or decisions are combined later.', zh: '无论采用早期特征融合还是后期决策融合，融合都会让多个模态的证据彼此作用。' }
    difficulty: intermediate
    tags: [checkpoint]

  - id: checkpoint-4-vision-encoder
    type: fill
    prompt: { en: 'Name the VLM component that converts pixels or image patches into visual feature representations before language alignment.', zh: '写出VLM中在语言对齐前把像素或图像块转换为视觉特征表示的英文组件。' }
    answer: vision encoder
    explanation: { en: 'The vision encoder produces visual features that a projector or fusion mechanism aligns with the language model space.', zh: '视觉编码器生成视觉特征，再由投影器或融合机制将其与语言模型空间对齐。' }
    difficulty: intermediate
    tags: [checkpoint]

  - id: checkpoint-4-vlm-verification
    type: mcq
    prompt: { en: 'A VLM reads an invoice total from a low-resolution screenshot before payment. What is the safest design?', zh: 'VLM在付款前从低分辨率截图读取发票总额。哪种设计最安全？' }
    options:
      - { text: { en: 'Treat the extracted value as uncertain, verify it against a reliable source or dedicated OCR, and require approval before payment', zh: '把提取值视为不确定结果，与可靠来源或专用OCR核对，并在付款前要求审批' }, correct: true }
      - { text: { en: 'Trust the value whenever the VLM returns fluent explanatory text', zh: '只要VLM给出流畅解释，就信任该数值' }, correct: false }
      - { text: { en: 'Increase temperature until several readings agree, then pay automatically', zh: '提高温度直到多次读取一致，再自动付款' }, correct: false }
    explanation: { en: 'VLMs have OCR and spatial-reasoning limitations. A fluent answer is not evidence that a critical visual value was read correctly.', zh: 'VLM在OCR与空间推理方面存在局限；回答流畅并不能证明关键视觉数值读取正确。' }
    difficulty: advanced
    tags: [checkpoint]

  - id: checkpoint-4-human-in-the-loop
    type: fill
    prompt: { en: 'Name the control pattern that pauses a computer-use agent for a person to approve a high-impact action.', zh: '写出让计算机操作智能体在高影响动作前暂停并等待人工批准的英文控制模式。' }
    answer: human-in-the-loop
    explanation: { en: 'Human-in-the-loop approval complements sandboxing, scoped credentials, action limits, and audit logs for consequential computer use.', zh: '对于后果重大的计算机操作，人机协同审批需要与沙箱、权限受限的凭据、动作限制和审计日志配合。' }
    difficulty: advanced
    tags: [checkpoint]
