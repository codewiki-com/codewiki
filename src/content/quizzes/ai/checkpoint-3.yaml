topic: ai/checkpoint-3
items:
  - id: checkpoint-3-embedding-meaning
    type: mcq
    prompt: { en: 'What does a high similarity score between two text embeddings establish?', zh: '两个文本嵌入的相似度很高，能够说明什么？' }
    options:
      - { text: { en: 'The embedding model places the texts near each other under its learned representation and chosen metric', zh: '在该嵌入模型学到的表示及所选度量下，两段文本彼此接近' }, correct: true }
      - { text: { en: 'The two texts are factually identical and safe to use without verification', zh: '两段文本事实完全一致，可以不经验证直接使用' }, correct: false }
      - { text: { en: 'The texts contain exactly the same words in the same order', zh: '两段文本以相同顺序包含完全相同的词' }, correct: false }
    explanation: { en: 'Embeddings encode learned semantic relationships, not proof of factual equivalence or exact lexical identity.', zh: '嵌入编码的是学到的语义关系，并不能证明事实等价或词面完全一致。' }
    difficulty: beginner
    tags: [checkpoint]

  - id: checkpoint-3-cosine-similarity
    type: fill
    prompt: { en: 'Name the metric that compares vector direction by dividing the dot product by both vector norms.', zh: '写出用点积除以两个向量范数、从而比较向量方向的英文指标名称。' }
    answer: cosine similarity
    explanation: { en: 'Cosine similarity measures angular alignment and is widely used for normalized embedding retrieval.', zh: '余弦相似度衡量方向夹角的一致性，常用于归一化嵌入检索。' }
    difficulty: beginner
    tags: [checkpoint]

  - id: checkpoint-3-hnsw-search-width
    type: mcq
    prompt: { en: 'What is the usual effect of increasing the HNSW query-time search-width parameter ef?', zh: '增大HNSW查询时的搜索宽度参数ef，通常会产生什么影响？' }
    options:
      - { text: { en: 'Recall usually improves, while query latency and work increase', zh: '召回率通常提高，但查询延迟和计算量也会增加' }, correct: true }
      - { text: { en: 'Recall necessarily decreases because fewer graph nodes are visited', zh: '由于访问的图节点更少，召回率必然下降' }, correct: false }
      - { text: { en: 'Only stored vector precision changes; search behavior is unaffected', zh: '只改变存储向量的精度，搜索行为不受影响' }, correct: false }
    explanation: { en: 'A larger ef explores more candidates. That trades additional query work for a better chance of finding true nearest neighbors.', zh: '更大的ef会探索更多候选项，以增加查询开销换取找到真实近邻的更高概率。' }
    difficulty: intermediate
    tags: [checkpoint]

  - id: checkpoint-3-chunking
    type: fill
    prompt: { en: 'Name the ingestion step that splits long source documents into retrievable passages.', zh: '写出在摄取阶段把长文档拆成可检索段落的英文步骤名称。' }
    answer: chunking
    explanation: { en: 'Chunking sets the retrieval unit; its size and overlap affect whether evidence remains coherent and discoverable.', zh: '分块决定检索单元，其大小与重叠会影响证据能否保持连贯并被检索到。' }
    difficulty: intermediate
    tags: [checkpoint]

  - id: checkpoint-3-rag-update
    type: mcq
    prompt: { en: 'A product manual changes every week. Why can RAG be preferable to fine-tuning for answering from the latest manual?', zh: '产品手册每周更新。为什么用RAG回答最新手册内容可能比微调更合适？' }
    options:
      - { text: { en: 'The team can update and re-index the source corpus without retraining model weights', zh: '团队可以更新并重新索引源语料，而无需重新训练模型权重' }, correct: true }
      - { text: { en: 'RAG guarantees that every generated claim is true even when retrieval fails', zh: '即使检索失败，RAG也能保证每条生成内容都真实' }, correct: false }
      - { text: { en: 'RAG removes the need to evaluate retrieval quality or cite sources', zh: 'RAG无需评估检索质量，也无需引用来源' }, correct: false }
    explanation: { en: 'RAG keeps changing knowledge in an external corpus. It still needs retrieval evaluation, provenance, and behavior for missing evidence.', zh: 'RAG把经常变化的知识保存在外部语料中，但仍需评估检索、保留来源，并处理证据缺失。' }
    difficulty: intermediate
    tags: [checkpoint]

  - id: checkpoint-3-knowledge-triple
    type: fill
    prompt: { en: 'Write the ordered three-part form used to represent a fact in a knowledge graph.', zh: '写出知识图谱中表示一条事实的有序三元组形式。' }
    answer: (head, relation, tail)
    explanation: { en: 'A knowledge-graph triple connects a head entity to a tail entity through a named relation.', zh: '知识图谱三元组通过一个命名关系，把头实体连接到尾实体。' }
    difficulty: intermediate
    tags: [checkpoint]

  - id: checkpoint-3-runnable-contract
    type: mcq
    prompt: { en: 'What does wrapping a function in a LangChain RunnableLambda guarantee?', zh: '把函数包装为LangChain RunnableLambda能保证什么？' }
    options:
      - { text: { en: 'It participates in the runnable invocation and composition interfaces, but input validation still needs an explicit boundary', zh: '它可以使用可运行单元的调用与组合接口，但仍需显式设置输入验证边界' }, correct: true }
      - { text: { en: 'It statically proves that every upstream and downstream data shape matches', zh: '它会静态证明所有上下游数据形状完全匹配' }, correct: false }
      - { text: { en: 'It automatically makes side-effecting tools safe to retry', zh: '它会自动让带副作用的工具可以安全重试' }, correct: false }
    explanation: { en: 'The runnable abstraction standardizes execution and composition; it is not a static type proof, schema validator, or transaction boundary.', zh: '可运行单元抽象统一了执行与组合方式，但它不是静态类型证明、模式验证器或事务边界。' }
    difficulty: advanced
    tags: [checkpoint]

  - id: checkpoint-3-recall-at-k
    type: fill
    prompt: { en: 'Name the retrieval metric that asks whether relevant evidence appears among the first k results.', zh: '写出衡量相关证据是否出现在前k条结果中的检索指标。' }
    answer: Recall@K
    explanation: { en: 'Recall@K measures how much relevant material the retriever surfaces within the context budget available to later stages.', zh: 'Recall@K衡量检索器在后续阶段可用的上下文预算内找回了多少相关材料。' }
    difficulty: advanced
    tags: [checkpoint]
