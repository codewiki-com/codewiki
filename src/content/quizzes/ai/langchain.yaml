topic: ai/langchain
items:
  - id: predict-sequence-output
    type: predict
    prompt: { en: 'What does this runnable sequence print?', zh: '这条可运行顺序链会输出什么？' }
    code: |
      from langchain_core.runnables import RunnableLambda

      normalize = RunnableLambda(lambda text: text.strip().lower())
      label = RunnableLambda(lambda text: f"route:{text}")
      chain = normalize | label

      print(chain.invoke(" Billing "))
    lang: python
    options:
      - { text: { en: 'route:billing', zh: 'route:billing' }, correct: true }
      - { text: { en: 'route: Billing ', zh: 'route: Billing ' }, correct: false }
      - { text: { en: 'billing', zh: 'billing' }, correct: false }
      - { text: { en: 'It prints a Runnable object.', zh: '程序会输出一个 Runnable 对象。' }, correct: false }
    explanation: { en: 'The first runnable strips and lowercases the string; its output becomes the second runnable’s input.', zh: '第一个可运行单元去除首尾空白并转成小写，其输出随后成为第二个可运行单元的输入。' }
    difficulty: beginner
    tags: [runnables, predict-output, lcel]

  - id: branch-first-match
    type: mcq
    prompt: { en: 'Two RunnableBranch predicates both match an input. Which branch runs?', zh: '两个 RunnableBranch 谓词都匹配同一输入时，会运行哪个分支？' }
    options:
      - { text: { en: 'The first matching branch in declaration order', zh: '声明顺序中第一个匹配的分支' }, correct: true }
      - { text: { en: 'Every matching branch in parallel', zh: '并行运行所有匹配的分支' }, correct: false }
      - { text: { en: 'The default branch', zh: '默认分支' }, correct: false }
    explanation: { en: 'RunnableBranch evaluates conditions in order and selects the first match. The default runs only when no condition matches.', zh: 'RunnableBranch 按顺序判断条件，并选择第一个匹配项。只有没有条件匹配时，才运行默认分支。' }
    difficulty: intermediate
    tags: [runnables, branching]

  - id: spot-missing-await
    title: { en: 'Spot the bug in async chain invocation', zh: '找出异步链调用里的 bug' }
    type: spotbug
    prompt: { en: 'Find the async invocation bug in this generated handler.', zh: '找出这个生成处理器中的异步调用错误。' }
    code: |
      async def handle_ticket(chain, ticket):
          response = chain.ainvoke(ticket)
          return response.content
    lang: python
    issues:
      - line: 2
        kind: correctness
        note: { en: 'ainvoke returns an awaitable; without await, response is a coroutine rather than the runnable result.', zh: 'ainvoke 返回可等待对象；缺少 await 时，response 是协程，不是可运行单元的结果。' }
    explanation: { en: 'Use response = await chain.ainvoke(ticket). Async method names do not make their results available synchronously.', zh: '应写成 response = await chain.ainvoke(ticket)。异步方法不会同步返回最终结果。' }
    difficulty: beginner
    tags: [async, ainvoke, code-review]

  - id: choose-control-structure
    type: mcq
    prompt: { en: 'When is create_agent a better fit than a fixed runnable sequence?', zh: '什么情况下 create_agent 比固定的可运行顺序链更合适？' }
    options:
      - { text: { en: 'When the model must choose tools or decide how many steps to take', zh: '需要模型选择工具或决定执行多少步时' }, correct: true }
      - { text: { en: 'Whenever two deterministic string transformations are composed', zh: '只要组合两个确定性的字符串转换时' }, correct: false }
      - { text: { en: 'Whenever application code needs an if statement', zh: '只要应用代码需要 if 语句时' }, correct: false }
    explanation: { en: 'An agent is useful for model-directed control flow. Deterministic sequences and branches keep simpler workflows more explicit and testable.', zh: '智能体适合由模型决定控制流的场景。确定性的顺序与分支能让简单工作流更明确、更容易测试。' }
    difficulty: intermediate
    tags: [agents, architecture]

  - id: review-generated-refund-agent
    title: { en: 'Review generated refund agent', zh: '审查生成的退款代理' }
    type: review
    prompt: { en: 'Review this generated refund agent for a multi-tenant support service.', zh: '审查这段为多租户支持服务生成的退款智能体代码。' }
    task: { en: 'Build a reusable support agent that accepts user messages and can issue authorized, retry-safe refunds.', zh: '构建可复用的支持智能体，接收用户消息，并且只能执行已授权、可安全重试的退款。' }
    code: |
      from langchain.agents import create_agent
      from langchain.tools import tool

      @tool
      def refund_order(order_id: str, amount: float) -> str:
          """Refund an order and return the transaction id."""
          result = payment_api.refund(order_id, amount)
          return result.transaction_id

      def answer(request):
          try:
              agent = create_agent(
                  model="openai:gpt-5.5",
                  tools=[refund_order],
                  system_prompt=request["instructions"],
              )
              return agent.invoke({"messages": request["messages"]})
          except Exception:
              return {"messages": []}
    lang: python
    issues:
      - line: 7
        kind: correctness
        note: { en: 'The refund call has no idempotency key, so an agent or transport retry can issue the refund twice.', zh: '退款调用没有幂等键，智能体或传输层重试时可能重复退款。' }
      - line: 12
        kind: performance
        note: { en: 'The code rebuilds and compiles an identical agent for every request instead of reusing a configured instance.', zh: '代码为每个请求重新构建并编译相同的智能体，没有复用已配置实例。' }
      - line: 15
        kind: security
        note: { en: 'Untrusted request data becomes the system prompt, allowing a tenant to replace service policy and tool instructions.', zh: '未经信任的请求数据直接成为系统提示词，租户可以借此替换服务策略与工具指令。' }
      - line: 18
        kind: edge-case
        note: { en: 'A blanket exception handler turns authentication, provider, and payment failures into an empty-looking success state.', zh: '笼统捕获异常会把认证、服务商和付款失败伪装成空的成功状态。' }
    right: { en: 'The code uses the current create_agent entry point, exposes a typed tool, and invokes the agent with message state.', zh: '代码使用当前的 create_agent 入口，暴露了带类型的工具，并以消息状态调用智能体。' }
    checklist:
      - { en: 'Trace authentication and authorization from the request into every tool.', zh: '从请求开始追踪认证与授权，直到每一个工具。' }
      - { en: 'Require idempotency keys and persist side-effect outcomes.', zh: '要求幂等键，并持久化副作用结果。' }
      - { en: 'Separate trusted service prompts from user-controlled content.', zh: '把可信服务提示词与用户可控内容分开。' }
      - { en: 'Classify failures and return explicit error states.', zh: '对失败进行分类，并返回明确的错误状态。' }
    explanation: { en: 'Move agent construction to configured application startup, keep the system prompt trusted, and enforce authorization plus idempotency inside refund_order. Catch only errors the boundary can handle and preserve an explicit failure result.', zh: '应在应用启动配置阶段构建并复用智能体，保持系统提示词可信，并在 refund_order 内执行授权与幂等检查。只捕获边界能够处理的错误，同时保留明确的失败结果。' }
    difficulty: advanced
    tags: [agents, code-review, security, idempotency]
