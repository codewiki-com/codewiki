topic: ai/checkpoint-1
items:
  - id: checkpoint-1-application-boundary
    type: mcq
    prompt: { en: 'A model returns a well-formed request to refund an order. Which component should make the final decision?', zh: '模型返回了格式正确的订单退款请求。应由哪个组件作出最终决定？' }
    options:
      - { text: { en: 'Application code that authenticates the user, authorizes the action, and checks business rules', zh: '负责认证用户、授权操作并检查业务规则的应用代码' }, correct: true }
      - { text: { en: 'The model, because well-formed output proves that the request is permitted', zh: '模型，因为格式正确的输出已经证明请求获得许可' }, correct: false }
      - { text: { en: 'The JSON parser, because successful parsing establishes the user identity', zh: 'JSON 解析器，因为解析成功就能确认用户身份' }, correct: false }
    explanation: { en: 'Model output is untrusted input. The deterministic application shell owns identity, policy, validation, and side effects.', zh: '模型输出属于不可信输入。身份、策略、验证与副作用应由确定性的应用外壳负责。' }
    difficulty: beginner
    tags: [checkpoint]

  - id: checkpoint-1-task-contract
    type: fill
    prompt: { en: 'Name the two-word term for the explicit definition of an NLP input, output, labels, metric, and release boundary.', zh: '写出定义 NLP 输入、输出、标签、指标与上线边界的英文双词术语。' }
    answer: task contract
    explanation: { en: 'A task contract fixes what the system predicts and how that prediction is evaluated before model selection begins.', zh: '任务契约会在选模型之前明确系统预测什么，以及如何评估该预测。' }
    difficulty: beginner
    tags: [checkpoint]

  - id: checkpoint-1-relu-output
    type: mcq
    prompt: { en: 'What does a ReLU activation output for inputs -2 and 3?', zh: 'ReLU 激活函数对输入 -2 和 3 分别输出什么？' }
    options:
      - { text: { en: '0 and 3', zh: '0 和 3' }, correct: true }
      - { text: { en: '-2 and 3', zh: '-2 和 3' }, correct: false }
      - { text: { en: '2 and 3', zh: '2 和 3' }, correct: false }
    explanation: { en: 'ReLU computes max(0, x), so it clips the negative value and preserves the positive value.', zh: 'ReLU 计算 max(0, x)，因此会截断负值并保留正值。' }
    difficulty: beginner
    tags: [checkpoint]

  - id: checkpoint-1-backpropagation
    type: fill
    prompt: { en: 'Name the training procedure that applies the chain rule backward through a computation graph to obtain parameter gradients.', zh: '写出在计算图中反向应用链式法则以求得参数梯度的英文术语。' }
    answer: backpropagation
    explanation: { en: 'Backpropagation propagates derivatives from the loss toward earlier parameters so an optimizer can update them.', zh: '反向传播把损失的导数传向前面的参数，供优化器据此更新参数。' }
    difficulty: beginner
    tags: [checkpoint]

  - id: checkpoint-1-attention-scaling
    type: mcq
    prompt: { en: 'Why does scaled dot-product attention divide query-key scores by the square root of the key dimension?', zh: '缩放点积注意力为什么要用键维度的平方根除以查询与键的得分？' }
    options:
      - { text: { en: 'To keep large dot products from saturating softmax and producing very small gradients', zh: '避免过大的点积让 softmax 饱和并产生极小梯度' }, correct: true }
      - { text: { en: 'To make every token receive exactly the same attention weight', zh: '让每个词元获得完全相同的注意力权重' }, correct: false }
      - { text: { en: 'To remove the need for learned query, key, and value projections', zh: '省去对查询、键和值进行可学习投影的需要' }, correct: false }
    explanation: { en: 'Dot-product variance grows with the key dimension. Scaling controls its magnitude before softmax without forcing uniform attention.', zh: '点积方差会随键维度增大；缩放可在 softmax 前控制其幅度，但不会强制注意力均匀分配。' }
    difficulty: intermediate
    tags: [checkpoint]

  - id: checkpoint-1-positional-encoding
    type: fill
    prompt: { en: 'Name the mechanism added to token representations so a Transformer can distinguish sequence positions.', zh: '写出加入词元表示、让 Transformer 能区分序列位置的英文术语。' }
    answer: positional encoding
    explanation: { en: 'Self-attention alone does not encode token order; positional encoding supplies position information.', zh: '自注意力本身不编码词元顺序，位置编码负责提供位置信息。' }
    difficulty: intermediate
    tags: [checkpoint]

  - id: checkpoint-1-few-shot-rule
    type: mcq
    prompt: { en: 'A classifier prompt repeatedly confuses two labels. Which change is the most targeted few-shot intervention?', zh: '分类提示词反复混淆两个标签。哪项改动是最有针对性的少样本干预？' }
    options:
      - { text: { en: 'Add representative, correctly labeled examples near the decision boundary and keep their format consistent', zh: '加入靠近决策边界且标注正确的代表性示例，并保持示例格式一致' }, correct: true }
      - { text: { en: 'Add many unrelated examples so the prompt becomes longer', zh: '加入大量无关示例，让提示词变得更长' }, correct: false }
      - { text: { en: 'Remove the label definitions and let the model infer a new taxonomy', zh: '删除标签定义，让模型自行推断一套新分类体系' }, correct: false }
    explanation: { en: 'Few-shot examples should demonstrate the intended distinction, especially at ambiguous boundaries. Volume without relevance can consume context without teaching the rule.', zh: '少样本示例应展示预期区分方式，尤其要覆盖模糊边界。堆积无关示例只会占用上下文，却不能说明规则。' }
    difficulty: advanced
    tags: [checkpoint]

  - id: checkpoint-1-prompt-injection
    type: fill
    prompt: { en: 'Name the failure mode in which untrusted input tries to override application instructions or redirect tool behavior.', zh: '写出不可信输入试图覆盖应用指令或改变工具行为的英文失败模式。' }
    answer: prompt injection
    explanation: { en: 'Prompt injection exploits the model instruction channel; delimiters can clarify structure but do not create a security boundary.', zh: '提示注入利用模型的指令通道；分隔符可以澄清结构，却不能构成安全边界。' }
    difficulty: advanced
    tags: [checkpoint]
