topic: ai/local-llms
items:
  - id: predict-context-budget
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      def fits(input_tokens, max_output, context_limit):
          return input_tokens + max_output <= context_limit

      print(fits(3800, 200, 4096))
      print(fits(4000, 200, 4096))
    lang: python
    options:
      - { text: { en: 'True then False', zh: '先输出 True，再输出 False' }, correct: true }
      - { text: { en: 'True then True', zh: '先输出 True，再输出 True' }, correct: false }
      - { text: { en: 'False then False', zh: '先输出 False，再输出 False' }, correct: false }
      - { text: { en: 'It raises ValueError.', zh: '程序抛出 ValueError。' }, correct: false }
    explanation: { en: 'The first total is 4,000 tokens and fits. The second is 4,200, so reserving output pushes it beyond the 4,096-token context.', zh: '第一组共 4,000 个词元，可以放入上下文；第二组共 4,200 个，预留输出后超过了 4,096 个词元的上限。' }
    difficulty: beginner
    tags: [context-window, output-budget, predict-output]

  - id: quantization-capacity-claim
    type: mcq
    prompt: { en: 'Which statement is safe to use when planning memory for a quantized local model?', zh: '规划量化本地模型的内存时，哪种说法可靠？' }
    options:
      - { text: { en: 'Raw quantized weight size is a lower bound; measure buffers and the KV cache at the target context and concurrency.', zh: '量化后的裸权重大小只是下限；还要在目标上下文与并发下测量缓冲区和 KV 缓存。' }, correct: true }
      - { text: { en: 'A 4-bit model always needs exactly one quarter of the memory of its 16-bit version.', zh: '4 bit 模型的内存需求一定恰好是 16 bit 版本的四分之一。' }, correct: false }
      - { text: { en: 'If the model file is smaller than VRAM, every supported context length is safe.', zh: '只要模型文件小于显存，所有受支持的上下文长度都能安全运行。' }, correct: false }
    explanation: { en: 'Quantization changes model data but does not reduce every runtime allocation by the same ratio. Context, cache representation, backend, and concurrent sequences affect peak memory.', zh: '量化会改变模型数据，却不会按相同比例缩小每项运行时分配。上下文、缓存表示、后端与并发序列都会影响内存峰值。' }
    difficulty: intermediate
    tags: [quantization, memory, kv-cache]

  - id: spot-incomplete-stream
    type: spotbug
    prompt: { en: 'Find the completion bug in this generated Ollama stream collector.', zh: '找出这段生成的 Ollama 流收集器中的完成状态错误。' }
    code: |
      import json

      def collect(response):
          parts = []
          for line in response:
              event = json.loads(line)
              parts.append(event.get("response", ""))
          return "".join(parts)
    lang: python
    issues:
      - line: 8
        kind: correctness
        note: { en: 'The function returns accumulated text without requiring a terminal event or checking its done_reason, so a disconnected or truncated stream looks complete.', zh: '函数没有要求终止事件，也没有检查 done_reason，就直接返回已收集文本，因此断线或截断的流看起来也像完整结果。' }
    explanation: { en: 'Track the event whose done field is true, reject a stream that ends without it, and preserve the terminal reason and counts with the text.', zh: '应跟踪 done 为 true 的事件，拒绝缺少该事件的流，并把终止原因和计数与文本一起保留。' }
    difficulty: intermediate
    tags: [streaming, completion-state, ollama]

  - id: local-privacy-boundary
    type: mcq
    prompt: { en: 'What must you verify before claiming that a local LLM deployment is offline?', zh: '声称本地 LLM 部署已经离线前，必须验证什么？' }
    options:
      - { text: { en: 'Inference still starts and completes with network access blocked, and logs, telemetry, backups, and cloud features have explicit policies.', zh: '阻断网络后推理仍能启动并完成，而且日志、遥测、备份和云功能都有明确策略。' }, correct: true }
      - { text: { en: 'The model weights fit entirely in accelerator memory.', zh: '模型权重能够完全放入加速器内存。' }, correct: false }
      - { text: { en: 'The HTTP endpoint uses localhost in one development configuration.', zh: '某个开发配置中的 HTTP 端点使用 localhost。' }, correct: false }
    explanation: { en: 'Local inference describes where computation runs. Only an egress test and a review of every surrounding data path establish offline behavior.', zh: '本地推理只描述计算发生的位置。只有断网测试并审查周围每条数据路径，才能确认离线行为。' }
    difficulty: intermediate
    tags: [privacy, offline, deployment]

  - id: review-private-summarizer
    type: review
    prompt: { en: 'Review this generated local summarization client before it handles private documents.', zh: '在这段生成的本地摘要客户端处理私密文档前，对它进行审查。' }
    task: { en: 'Summarize private documents through a local Ollama service with bounded latency, incremental delivery, and no sensitive-content logs.', zh: '通过本地 Ollama 服务对私密文档生成摘要，并限制延迟、增量交付结果且不记录敏感内容。' }
    code: |
      import json
      from urllib.request import Request, urlopen

      def summarize(document):
          payload = {
              "model": "gemma4",
              "prompt": f"Summarize this document:\n{document}",
              "stream": True,
              "options": {"num_ctx": 131072},
          }
          request = Request(
              "http://127.0.0.1:11434/api/generate",
              data=json.dumps(payload).encode(),
              headers={"Content-Type": "application/json"},
          )
          with urlopen(request) as response:
              chunks = [json.loads(line) for line in response]
          text = "".join(chunk.get("response", "") for chunk in chunks)
          with open("requests.log", "a") as log:
              log.write(document + "\n" + text + "\n")
          return text
    lang: python
    issues:
      - line: 16
        kind: edge-case
        note: { en: 'urlopen has no timeout, so a stalled local service can hold the request indefinitely.', zh: 'urlopen 没有设置超时，因此停滞的本地服务可能无限期占用请求。' }
      - line: 17
        kind: performance
        note: { en: 'The list buffers every event before processing, defeating incremental delivery and retaining the whole stream in memory.', zh: '列表会先缓冲全部事件再处理，既失去增量交付，也会把整条流保留在内存中。' }
      - line: 18
        kind: correctness
        note: { en: 'The client never requires done or checks done_reason, so partial and length-limited output can be returned as complete.', zh: '客户端从未要求 done，也没有检查 done_reason，因此可能把部分输出或长度受限的输出当作完整结果返回。' }
      - line: 19
        lines: 2
        kind: security
        note: { en: 'The code writes the full private document and generated text to a plain local log with no redaction, access policy, or retention limit.', zh: '代码把完整私密文档与生成文本写入普通本地日志，没有删减、访问策略或保留期限。' }
    right: { en: 'The code chooses an explicit model and context, requests streaming, sends JSON with the correct content type, and closes the HTTP response with a context manager.', zh: '代码显式选择了模型与上下文，请求流式响应，以正确的内容类型发送 JSON，并通过上下文管理器关闭 HTTP 响应。' }
    checklist:
      - { en: 'Bound connection and read time, then test a stalled server and a mid-stream disconnect.', zh: '限制连接与读取时间，并测试服务停滞和流式传输中途断线。' }
      - { en: 'Require a terminal event, preserve its reason, and keep incomplete output in a distinct state.', zh: '要求终止事件并保留其原因，把不完整输出置于独立状态。' }
      - { en: 'Process chunks incrementally and apply backpressure instead of buffering the complete stream.', zh: '增量处理分块并实施背压，不要缓冲整条流。' }
      - { en: 'Log approved metadata only; verify permissions, redaction, and retention for local files.', zh: '只记录获准的元数据，并检查本地文件的权限、删减和保留策略。' }
    explanation: { en: 'A loopback endpoint narrows network exposure but does not solve completion, availability, memory, or sensitive-log failures. The client needs explicit controls for each boundary.', zh: '回环端点缩小了网络暴露面，却不能解决完成状态、可用性、内存或敏感日志问题。客户端必须为每条边界设置明确控制。' }
    difficulty: advanced
    tags: [code-review, streaming, privacy, reliability]
