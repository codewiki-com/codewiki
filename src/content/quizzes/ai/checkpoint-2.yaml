topic: ai/checkpoint-2
items:
  - id: checkpoint-2-response-items
    type: mcq
    prompt: { en: 'How should an OpenAI Responses API client extract generated text reliably?', zh: 'OpenAI Responses API 客户端应如何可靠提取生成文本？' }
    options:
      - { text: { en: 'Check the response status, iterate output items by type, and collect text from message content blocks', zh: '检查响应状态，按类型遍历输出项，并从消息内容块中收集文本' }, correct: true }
      - { text: { en: 'Always read output[0].content[0].text because the first item is guaranteed to be text', zh: '始终读取 output[0].content[0].text，因为第一项保证是文本' }, correct: false }
      - { text: { en: 'Serialize the entire response object and display it as the answer', zh: '序列化整个响应对象并将其作为答案显示' }, correct: false }
    explanation: { en: 'Reasoning items, tool calls, multiple messages, and future item types can change output order and shape. Dispatching by type preserves the response contract.', zh: '推理项、工具调用、多条消息及未来新增类型都可能改变输出顺序与形状。按类型分派才能守住响应契约。' }
    difficulty: beginner
    tags: [checkpoint]

  - id: checkpoint-2-content-block
    type: fill
    prompt: { en: 'Name the two-word unit used in Claude message content arrays for text, tool use, and tool results.', zh: '写出 Claude 消息 content 数组中承载文本、工具调用和工具结果的英文双词单元。' }
    answer: content block
    explanation: { en: 'Claude responses contain ordered content blocks rather than one guaranteed text string.', zh: 'Claude 响应由有序内容块组成，并不保证只是一个文本字符串。' }
    difficulty: beginner
    tags: [checkpoint]

  - id: checkpoint-2-json-mode-boundary
    type: mcq
    prompt: { en: 'What does plain JSON mode guarantee?', zh: '普通 JSON 模式保证什么？' }
    options:
      - { text: { en: 'Syntactically valid JSON, but not necessarily conformance to the application schema', zh: '语法有效的 JSON，但不一定符合应用模式' }, correct: true }
      - { text: { en: 'A value that is factually correct and authorized for every downstream action', zh: '内容事实正确，并获准执行所有下游操作的值' }, correct: false }
      - { text: { en: 'An object containing every required business field with no extra keys', zh: '包含所有必需业务字段且没有额外键的对象' }, correct: false }
    explanation: { en: 'JSON mode constrains syntax. Schema compliance, semantic checks, authorization, and business invariants remain separate responsibilities.', zh: 'JSON 模式约束的是语法；模式合规、语义检查、授权与业务不变量仍需分别处理。' }
    difficulty: beginner
    tags: [checkpoint]

  - id: checkpoint-2-json-schema
    type: fill
    prompt: { en: 'Name the schema language commonly used to declare structured-output fields, types, required properties, and tool arguments.', zh: '写出常用于声明结构化输出字段、类型、必需属性与工具参数的模式语言。' }
    answer: JSON Schema
    explanation: { en: 'JSON Schema describes the machine-checkable shape used by structured output and function definitions.', zh: 'JSON Schema 描述结构化输出与函数定义所使用的可机器检查数据形状。' }
    difficulty: intermediate
    tags: [checkpoint]

  - id: checkpoint-2-tool-execution
    type: mcq
    prompt: { en: 'A model emits a function call with schema-valid arguments. What should happen next?', zh: '模型发出参数符合模式的函数调用后，下一步应该做什么？' }
    options:
      - { text: { en: 'The application allowlists the function, validates domain rules and authorization, then executes it and records the result', zh: '应用先检查函数允许列表、领域规则与授权，再执行并记录结果' }, correct: true }
      - { text: { en: 'The provider has already executed the function, so the application should assume success', zh: '服务商已经执行了函数，因此应用应直接视为成功' }, correct: false }
      - { text: { en: 'The application dynamically imports any function name supplied by the model', zh: '应用动态导入模型给出的任意函数名' }, correct: false }
    explanation: { en: 'A model proposes a call; the host application owns validation, authorization, execution, and side-effect policy.', zh: '模型只是提出调用建议；验证、授权、执行与副作用策略由宿主应用负责。' }
    difficulty: intermediate
    tags: [checkpoint]

  - id: checkpoint-2-tool-result
    type: fill
    prompt: { en: 'Which Claude content-block type returns a client tool outcome and pairs it with the original tool_use id?', zh: 'Claude 使用哪种内容块类型返回客户端工具结果，并与原 tool_use id 配对？' }
    answer: tool_result
    explanation: { en: 'A tool_result block carries the application-executed outcome back to the model and references the originating tool call.', zh: 'tool_result 内容块把应用执行的结果传回模型，并引用发起该操作的工具调用。' }
    difficulty: intermediate
    tags: [checkpoint]

  - id: checkpoint-2-mcp-roles
    type: mcq
    prompt: { en: 'Which statement correctly separates MCP host, client, and server responsibilities?', zh: '哪项陈述正确区分了 MCP 宿主、客户端与服务器的职责？' }
    options:
      - { text: { en: 'The host coordinates clients, each client maintains a connection to one server, and servers expose tools, resources, or prompts', zh: '宿主协调客户端，每个客户端维护与一个服务器的连接，服务器公开工具、资源或提示词' }, correct: true }
      - { text: { en: 'Every server embeds the host application and grants all connected models unrestricted tool access', zh: '每个服务器都嵌入宿主应用，并向所有已连接模型授予不受限的工具权限' }, correct: false }
      - { text: { en: 'The client is only a network transport and cannot participate in capability discovery', zh: '客户端只是网络传输层，不能参与能力发现' }, correct: false }
    explanation: { en: 'MCP separates orchestration, per-server connections, and exposed capabilities. That separation does not remove the host’s authorization duties.', zh: 'MCP 将编排、逐服务器连接与能力公开分开；这种分工并不会免除宿主的授权职责。' }
    difficulty: advanced
    tags: [checkpoint]

  - id: checkpoint-2-idempotency-key
    type: fill
    prompt: { en: 'Name the durable request identifier used to prevent a retry from applying the same side effect twice.', zh: '写出用于防止重试重复执行同一副作用的英文术语。' }
    answer: idempotency key
    explanation: { en: 'An idempotency key and stored result let the application distinguish a retry from a new business operation after a timeout.', zh: '幂等键与持久化结果使应用能在超时后区分重试和新的业务操作。' }
    difficulty: advanced
    tags: [checkpoint]
