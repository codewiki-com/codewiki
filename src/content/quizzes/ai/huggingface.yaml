topic: ai/huggingface
items:
  - id: predict-revision-pair
    type: predict
    prompt: { en: 'What does this revision-consistency check print?', zh: '这段修订版本一致性检查会输出什么？' }
    code: |
      revisions = {"tokenizer": "a1c9", "model": "a1c9"}
      print(len(set(revisions.values())) == 1)

      revisions["model"] = "b7e2"
      print(len(set(revisions.values())) == 1)
    lang: python
    options:
      - { text: { en: "True\nFalse", zh: "True\nFalse" }, correct: true }
      - { text: { en: "True\nTrue", zh: "True\nTrue" }, correct: false }
      - { text: { en: "False\nFalse", zh: "False\nFalse" }, correct: false }
      - { text: { en: 'It raises KeyError.', zh: '程序会抛出 KeyError。' }, correct: false }
    explanation: { en: 'The tokenizer and model start on one revision, but changing only the model revision makes the set contain two hashes.', zh: 'tokenizer 与模型起初使用同一修订版本；只修改模型修订版本后，集合中会出现两个哈希。' }
    difficulty: beginner
    tags: [revision, reproducibility, predict-output]

  - id: choose-autoclass-head
    type: mcq
    prompt: { en: 'Which loader expresses that a checkpoint must provide a sequence-classification head?', zh: '哪个加载器明确要求检查点提供序列分类任务头？' }
    options:
      - { text: { en: 'AutoModelForSequenceClassification', zh: 'AutoModelForSequenceClassification' }, correct: true }
      - { text: { en: 'AutoModel', zh: 'AutoModel' }, correct: false }
      - { text: { en: 'AutoTokenizer', zh: 'AutoTokenizer' }, correct: false }
      - { text: { en: 'snapshot_download', zh: 'snapshot_download' }, correct: false }
    explanation: { en: 'The task-specific AutoClass selects a model implementation with a sequence-classification head. AutoModel loads the base architecture.', zh: '任务专用 AutoClass 会选择带序列分类头的模型实现；AutoModel 只加载基础架构。' }
    difficulty: beginner
    tags: [autoclass, task-head, transformers]

  - id: spot-unpinned-model
    type: spotbug
    prompt: { en: 'Find the artifact mismatch risk in this generated loader.', zh: '找出这段生成加载代码中的制品错配风险。' }
    code: |
      from transformers import AutoModel, AutoTokenizer

      tokenizer = AutoTokenizer.from_pretrained(
          "acme/support-bert",
          revision="8f21c4",
      )
      model = AutoModel.from_pretrained("acme/support-bert")
      encoded = tokenizer("Reset my password", return_tensors="pt")
      result = model(**encoded)
    lang: python
    issues:
      - line: 7
        kind: correctness
        note: { en: 'The model resolves the mutable default branch while the tokenizer is pinned, so their files can come from different revisions.', zh: '模型解析可变的默认分支，而 tokenizer 已固定版本，因此两者可能来自不同修订版本。' }
    explanation: { en: 'Pass the same full commit hash to every tokenizer, configuration, processor, and model load in the deployment.', zh: '部署时应把同一个完整提交哈希传给 tokenizer、配置、处理器与模型的所有加载调用。' }
    difficulty: intermediate
    tags: [revision, tokenizer, code-review]

  - id: remote-code-policy
    type: mcq
    prompt: { en: 'When should a service enable trust_remote_code for a Hub model?', zh: '服务应在什么情况下为 Hub 模型启用 trust_remote_code？' }
    options:
      - { text: { en: 'Only after reviewing pinned custom code and isolating its execution', zh: '仅在审核固定版本的自定义代码并隔离其执行之后' }, correct: true }
      - { text: { en: 'Whenever AutoModel reports an unknown architecture', zh: '只要 AutoModel 报告未知架构' }, correct: false }
      - { text: { en: 'For every private repository', zh: '用于每个私有仓库' }, correct: false }
      - { text: { en: 'Whenever the weights use Safetensors', zh: '只要权重使用 Safetensors' }, correct: false }
    explanation: { en: 'Remote code is executable code, independent of repository visibility or weight format. It needs an explicit review and sandbox policy.', zh: '远端代码是可执行代码，与仓库可见性或权重格式无关，因此需要明确的审核与隔离策略。' }
    difficulty: intermediate
    tags: [remote-code, security, model-loading]

  - id: review-generated-classifier
    type: review
    prompt: { en: 'Review this generated model loader before using it in a classification API.', zh: '在分类 API 中使用前，审查这段生成的模型加载代码。' }
    task: { en: 'Serve an approved private classifier with reproducible artifacts, bounded inputs, and low per-request overhead.', zh: '用可复现制品、受限输入和较低的单请求开销提供经过批准的私有分类模型。' }
    code: |
      import os
      from transformers import pipeline

      def build_pipeline(settings):
          return pipeline(
              task="text-classification",
              model=settings["model_id"],
              revision="main",
              token=os.environ["HF_TOKEN"],
              trust_remote_code=True,
              device=0,
          )

      def classify(request, settings):
          classifier = build_pipeline(settings)
          return classifier(
              request["text"],
              truncation=False,
          )[0]["label"]
    lang: python
    issues:
      - line: 7
        lines: 4
        kind: security
        note: { en: 'A settings-controlled repository is allowed to execute remote code without an allowlist, pinned code review, or isolation.', zh: '配置可控的仓库能够直接执行远端代码，却没有仓库允许列表、固定版本代码审核或隔离。' }
      - line: 8
        kind: correctness
        note: { en: 'The mutable main branch makes the deployed artifact change without a code or configuration release.', zh: '可变的 main 分支会让部署制品在没有代码或配置发布的情况下发生变化。' }
      - line: 15
        kind: performance
        note: { en: 'Every request constructs and loads a new Pipeline instead of reusing one initialized during application startup.', zh: '每个请求都重新构造并加载 Pipeline，没有复用应用启动时初始化的实例。' }
      - line: 18
        kind: edge-case
        note: { en: 'Arbitrary text is sent without truncation or an application length limit, so an overlong request can fail at tokenization or inference.', zh: '任意文本在没有截断或应用长度上限的情况下送入模型，超长请求可能在分词或推理阶段失败。' }
    right: { en: 'The code names the task, obtains the private-repository token from the environment, and keeps model settings outside the request object.', zh: '代码显式指定任务，从环境读取私有仓库 token，并把模型设置与请求对象分开。' }
    checklist:
      - { en: 'Allowlist the repository and pin one reviewed commit for code and artifacts.', zh: '把仓库加入允许列表，并为代码与制品固定一个经过审核的提交。' }
      - { en: 'Construct one Pipeline per worker during controlled startup.', zh: '在受控启动阶段为每个工作进程构造一个 Pipeline。' }
      - { en: 'Set and test input length, truncation, batch, device, and dtype policies.', zh: '设置并测试输入长度、截断、批次、设备与数据类型策略。' }
      - { en: 'Run an empty-cache build test and an offline startup test.', zh: '执行空缓存构建测试与离线启动测试。' }
    explanation: { en: 'Resolve approved settings to a reviewed commit, keep remote code off unless separately sandboxed, and initialize the Pipeline once. Validate input size before tokenization and exercise the same device policy used in production.', zh: '应把批准的设置解析为经过审核的提交；除非另行隔离，否则关闭远端代码，并且只初始化一次 Pipeline。分词前先验证输入大小，并用生产环境的同一设备策略完成测试。' }
    difficulty: advanced
    tags: [code-review, security, reproducibility, inference]
