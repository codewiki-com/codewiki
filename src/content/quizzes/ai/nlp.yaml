topic: ai/nlp
items:
  - id: predict-normalized-view
    type: predict
    prompt: { en: 'What does this normalization code print?', zh: '这段规范化代码会输出什么？' }
    code: |
      import unicodedata

      original = "Ｐａｙ ５€"
      matching = unicodedata.normalize("NFKC", original).casefold()
      print(matching)
      print(original)
    lang: python
    options:
      - { text: { en: "pay 5€ followed by Ｐａｙ ５€", zh: "先输出pay 5€，再输出 Ｐａｙ ５€" }, correct: true }
      - { text: { en: "pay 5€ twice", zh: "输出两次pay 5€" }, correct: false }
      - { text: { en: "Ｐａｙ ５€ twice", zh: "输出两次 Ｐａｙ ５€" }, correct: false }
      - { text: { en: 'It raises UnicodeError.', zh: '程序抛出UnicodeError。' }, correct: false }
    explanation: { en: 'NFKC and casefold create a new matching string; they do not mutate the source string. Keeping both views preserves display and audit data.', zh: 'NFKC与casefold会创建新的匹配字符串，不会修改原字符串。同时保留两个视图，才能保住展示与审计数据。' }
    difficulty: beginner
    tags: [unicode, normalization, source-text]

  - id: choose-output-contract
    type: mcq
    prompt: { en: 'A product request says only “understand support messages.” What should the NLP team define first?', zh: '产品需求只写了“理解客服消息”。NLP团队首先应该定义什么？' }
    options:
      - { text: { en: 'The input unit, allowed output shape, abstention behavior, and acceptance metrics', zh: '输入单位、允许的输出形状、无法判断时的行为和验收指标' }, correct: true }
      - { text: { en: 'The largest available language model', zh: '当前可用的最大语言模型' }, correct: false }
      - { text: { en: 'A universal stop-word list for every language', zh: '适用于所有语言的通用停用词表' }, correct: false }
      - { text: { en: 'The number of training epochs', zh: '训练轮数' }, correct: false }
    explanation: { en: 'A task contract gives annotations, model outputs, and evaluation one shared meaning. Model and training choices come after that target is explicit.', zh: '任务契约让标注、模型输出与评测共享同一含义。先明确目标，再选择模型与训练方式。' }
    difficulty: beginner
    tags: [task-contract, labels, evaluation]

  - id: spot-leaky-text-split
    title: { en: 'Spot the bug in the feature pipeline', zh: '找出特征管道里的bug' }
    type: spotbug
    prompt: { en: 'Find the leakage risks in this generated feature pipeline.', zh: '找出这段生成特征流水线中的泄漏风险。' }
    code: |
      from sklearn.feature_extraction.text import TfidfVectorizer
      from sklearn.model_selection import train_test_split

      def prepare(rows):
          texts = [row["text"] for row in rows]
          labels = [row["label"] for row in rows]
          features = TfidfVectorizer().fit_transform(texts)
          return train_test_split(
              features, labels, test_size=0.2, random_state=42
          )
    lang: python
    issues:
      - line: 7
        kind: correctness
        note: { en: 'The vectorizer learns vocabulary and IDF values from all rows before the test split, so test-distribution information enters the features.', zh: '向量器在切分前从所有行学习词表与IDF，因此测试分布信息进入了特征。' }
      - line: 8
        kind: edge-case
        note: { en: 'A row-level random split can place messages from one conversation or near-duplicate templates on both sides.', zh: '逐行随机切分可能把同一会话消息或近重复模板放到两侧。' }
    explanation: { en: 'Split by the deployment unit first, then fit the vectorizer on training text and transform validation or test text with that fitted object.', zh: '先按上线时的独立单位切分，再只用训练文本拟合向量器，并用该对象转换验证或测试文本。' }
    difficulty: intermediate
    tags: [data-leakage, tf-idf, grouped-split]

  - id: offsets-need-units
    type: mcq
    prompt: { en: 'A browser receives { start: 12, end: 18 } from a Python entity service. What is missing from this contract?', zh: '浏览器从Python实体服务收到 { start: 12, end: 18 }。这份契约缺少什么？' }
    options:
      - { text: { en: 'The source text version, offset unit, and inclusive or exclusive end rule', zh: '原文版本、偏移量单位，以及结束位置是否包含在跨度内' }, correct: true }
      - { text: { en: 'Only the model confidence', zh: '只缺模型置信度' }, correct: false }
      - { text: { en: 'A larger tokenizer vocabulary', zh: '更大的分词器词表' }, correct: false }
      - { text: { en: 'The training batch size', zh: '训练批量大小' }, correct: false }
    explanation: { en: 'Python code points, browser UTF-16 code units, bytes, and model-token indices diverge on real Unicode text. A span is unusable unless its coordinate system is explicit.', zh: 'Python码点、浏览器UTF-16代码单元、字节和模型词元位置会在真实Unicode文本中出现差异。跨度必须明确坐标系才能使用。' }
    difficulty: intermediate
    tags: [offsets, unicode, api-contract]

  - id: review-generated-ticket-classifier
    title: { en: 'Review generated ticket classifier', zh: '审查生成的工单分类器' }
    type: review
    prompt: { en: 'Review this generated ticket-classification training function.', zh: '审查这段生成的工单分类训练函数。' }
    task: { en: 'Train from rows containing text, label, and conversation_id without leaking conversations; preserve source text and report safe diagnostic metrics.', zh: '使用包含text、label与conversation_id的数据训练分类器；会话不得泄漏，必须保留原文并报告安全的诊断指标。' }
    code: |
      import re
      from sklearn.feature_extraction.text import TfidfVectorizer
      from sklearn.linear_model import LogisticRegression
      from sklearn.metrics import accuracy_score
      from sklearn.model_selection import train_test_split

      def train_and_report(rows):
          texts = [row["text"] for row in rows]
          labels = [row["label"] for row in rows]
          normalized = [re.sub(r"[^\w\s]", "", text).lower() for text in texts]
          vectorizer = TfidfVectorizer()
          features = vectorizer.fit_transform(normalized)
          train_x, test_x, train_y, test_y = train_test_split(
              features, labels, test_size=0.2, random_state=42
          )
          model = LogisticRegression().fit(train_x, train_y)
          predictions = model.predict(test_x)
          print("accuracy", accuracy_score(test_y, predictions))
          print(list(zip(texts, predictions)))
          return model, vectorizer
    lang: python
    issues:
      - line: 12
        kind: correctness
        note: { en: 'The vectorizer fits vocabulary and IDF on the complete dataset before the split, leaking test-distribution information.', zh: '向量器在切分前用完整数据拟合词表与IDF，泄漏了测试分布信息。' }
      - line: 13
        kind: edge-case
        note: { en: 'The split ignores conversation_id, so messages from one conversation or template can appear in both sets.', zh: '切分忽略了conversation_id，因此同一会话或模板中的消息可能同时出现在两侧。' }
      - line: 18
        kind: readability
        note: { en: 'One aggregate accuracy value provides no per-class support, confusion cells, or failure examples for diagnosis.', zh: '一个总体准确率没有逐类支持数、混淆单元或失败样本，无法诊断问题。' }
      - line: 19
        kind: security
        note: { en: 'Printing raw customer messages can expose personal or confidential data, and predictions cover only test rows rather than every text.', zh: '打印原始客户消息可能泄露个人或机密数据，而且predictions只覆盖测试行，并不对应全部texts。' }
    right: { en: 'The code keeps vectorization and classification as separate objects, uses a deterministic random seed, and returns artifacts needed by an inference path.', zh: '代码把向量化器与分类器保留为独立对象，使用确定性随机种子，并返回推理路径所需的制品。' }
    checklist:
      - { en: 'Group the split by the unit that must not cross the release boundary.', zh: '按不得跨越发布边界的单位进行分组切分。' }
      - { en: 'Fit every learned transformation on training data only.', zh: '所有需要学习的转换都只能用训练数据拟合。' }
      - { en: 'Report per-class metrics and inspect redacted failure examples.', zh: '报告逐类指标，并检查经过删减的失败样本。' }
      - { en: 'Preserve source text and version the normalization policy separately.', zh: '保留原文，并单独对规范化策略做版本管理。' }
    explanation: { en: 'Split conversation groups before fitting TF-IDF, fit and transform through one pipeline, keep normalization reversible or traceable, and log only approved diagnostic fields. Evaluate each class rather than accepting aggregate accuracy.', zh: '应在拟合TF-IDF前按会话分组切分，通过同一流水线完成拟合与转换，确保规范化可逆或可追踪，并且只记录获准的诊断字段。评测必须覆盖每个类别，不能只接受总体准确率。' }
    difficulty: advanced
    tags: [code-review, data-leakage, privacy, evaluation]
