topic: ai/checkpoint-5
items:
  - id: checkpoint-5-controlled-evaluation
    type: mcq
    prompt: { en: 'A team wants to know whether a prompt revision improved its application. Which evaluation design gives the clearest evidence?', zh: '团队想判断提示词修订是否改善了应用。哪种评测设计能提供最清晰的证据？' }
    options:
      - { text: { en: 'Run the old and new prompt against the same versioned cases, model settings, rubric, and aggregation method', zh: '用同一组版本化案例、模型设置、评分标准与汇总方法测试新旧提示词' }, correct: true }
      - { text: { en: 'Change the prompt, model, retrieval corpus, and rubric together, then compare one aggregate score', zh: '同时修改提示词、模型、检索语料与评分标准，再比较一个汇总分数' }, correct: false }
      - { text: { en: 'Ask the prompt author which version feels better without recording outputs', zh: '不记录输出，只询问提示词作者哪个版本感觉更好' }, correct: false }
    explanation: { en: 'Holding the other major variables fixed makes the observed difference attributable and the experiment reproducible.', zh: '固定其他主要变量，才能把观察到的差异归因于提示词变更，并使实验可复现。' }
    difficulty: beginner
    tags: [checkpoint]

  - id: checkpoint-5-data-leakage
    type: fill
    prompt: { en: 'Name the failure mode in which evaluation examples or their answers influence training, tuning, or prompt selection.', zh: '写出评测样例或答案影响训练、调参或提示词选择的英文失败模式。' }
    answer: data leakage
    explanation: { en: 'Data leakage makes held-out performance optimistic because information from the evaluation set affected system construction.', zh: '数据泄漏意味着评测集信息参与了系统构建，从而让留出集表现显得过于乐观。' }
    difficulty: beginner
    tags: [checkpoint]

  - id: checkpoint-5-observability-data
    type: mcq
    prompt: { en: 'Which observability record is most useful and safest for debugging a slow RAG answer?', zh: '为了排查缓慢的RAG回答，哪种可观测记录最有用也最安全？' }
    options:
      - { text: { en: 'A correlated trace with timed retrieval and generation spans, token and cost metadata, stable versions, and redacted approved fields', zh: '一条包含检索与生成耗时跨度、词元与成本元数据、稳定版本信息及经脱敏允许字段的关联追踪' }, correct: true }
      - { text: { en: 'A single total-duration number with no model, prompt, retriever, or request identifiers', zh: '只有总耗时，不包含模型、提示词、检索器或请求标识' }, correct: false }
      - { text: { en: 'Complete raw prompts, documents, credentials, and user records stored indefinitely', zh: '无限期保存完整原始提示词、文档、凭据与用户记录' }, correct: false }
    explanation: { en: 'Nested timing identifies the slow stage, while version metadata supports comparison. All telemetry still needs minimization, access control, retention limits, and redaction.', zh: '嵌套计时能定位缓慢阶段，版本元数据便于比较；所有遥测数据仍需最小化、访问控制、保留期限与脱敏。' }
    difficulty: intermediate
    tags: [checkpoint]

  - id: checkpoint-5-trace
    type: fill
    prompt: { en: 'Name the observability unit that represents one complete application request as related spans.', zh: '写出把一次完整应用请求表示为一组关联跨度的英文可观测单元。' }
    answer: trace
    explanation: { en: 'A trace links the model, retrieval, tool, and application spans that participate in one request lifecycle.', zh: '追踪把一次请求生命周期中的模型、检索、工具与应用跨度关联起来。' }
    difficulty: intermediate
    tags: [checkpoint]

  - id: checkpoint-5-jailbreak-defense
    type: mcq
    prompt: { en: 'Which architecture best limits damage if a jailbreak or prompt injection succeeds?', zh: '如果越狱或提示注入成功，哪种架构最能限制损害？' }
    options:
      - { text: { en: 'Layer input and output controls with least-privilege tools, application authorization, approval gates, and monitoring', zh: '把输入输出控制与最小权限工具、应用授权、审批门和监控分层组合' }, correct: true }
      - { text: { en: 'Rely on one system-prompt sentence that tells the model never to disobey', zh: '只依靠系统提示词中的一句话，要求模型永不违背指令' }, correct: false }
      - { text: { en: 'Give the model broad credentials so it can recover from any blocked action', zh: '向模型提供广泛凭据，使其能从任何被阻止的操作中恢复' }, correct: false }
    explanation: { en: 'Model-level guardrails are probabilistic. Defense in depth keeps a model failure from directly becoming an unauthorized side effect.', zh: '模型层护栏具有概率性；纵深防御可防止模型失败直接转化为未经授权的副作用。' }
    difficulty: intermediate
    tags: [checkpoint]

  - id: checkpoint-5-hub-revision
    type: mcq
    prompt: { en: 'Which Hugging Face loading practice gives the strongest reproducibility boundary?', zh: '哪种Hugging Face加载实践能提供最强的可复现边界？' }
    options:
      - { text: { en: 'Pin a reviewed commit hash and load the tokenizer, configuration, and weights from that same revision', zh: '固定经过审查的提交哈希，并从同一修订加载分词器、配置与权重' }, correct: true }
      - { text: { en: 'Use the default branch without recording its resolved commit because branches never move', zh: '使用默认分支且不记录解析后的提交，因为分支永远不会移动' }, correct: false }
      - { text: { en: 'Mix the newest tokenizer with cached weights from an unknown revision', zh: '把最新分词器与未知修订的缓存权重混用' }, correct: false }
    explanation: { en: 'A commit hash identifies immutable repository content. Keeping all coupled artifacts on that revision prevents silent tokenizer, configuration, and weight drift.', zh: '提交哈希标识不可变的仓库内容；让所有耦合制品使用同一修订，可防止分词器、配置与权重悄然漂移。' }
    difficulty: advanced
    tags: [checkpoint]

  - id: checkpoint-5-quantization-boundary
    type: mcq
    prompt: { en: 'A quantized local model file fits in GPU memory. What must capacity planning still include?', zh: '量化后的本地模型文件能够装入GPU显存。容量规划还必须考虑什么？' }
    options:
      - { text: { en: 'KV cache, runtime buffers, context length, concurrent requests, and runner-specific overhead', zh: 'KV缓存、运行时缓冲区、上下文长度、并发请求及运行器特定开销' }, correct: true }
      - { text: { en: 'Nothing else; model file size is an exact upper bound on runtime memory', zh: '无需考虑其他因素；模型文件大小就是运行时内存的精确上限' }, correct: false }
      - { text: { en: 'Only network bandwidth, because quantization eliminates activation and cache memory', zh: '只需考虑网络带宽，因为量化会消除激活值与缓存内存' }, correct: false }
    explanation: { en: 'Quantization reduces weight storage, but serving allocates additional memory that grows with context and concurrency.', zh: '量化会减少权重存储，但服务过程还会分配随上下文和并发量增长的额外内存。' }
    difficulty: advanced
    tags: [checkpoint]

  - id: checkpoint-5-lora
    type: fill
    prompt: { en: 'Name the parameter-efficient fine-tuning method that learns low-rank update matrices while leaving the base weights frozen.', zh: '写出冻结基础权重、只学习低秩更新矩阵的参数高效微调方法。' }
    answer: LoRA
    explanation: { en: 'LoRA represents the weight update with small low-rank matrices, greatly reducing the number of trainable parameters.', zh: 'LoRA用较小的低秩矩阵表示权重更新，从而显著减少可训练参数数量。' }
    difficulty: advanced
    tags: [checkpoint]
