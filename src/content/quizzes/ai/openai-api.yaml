topic: ai/openai-api
items:
  - id: predict-typed-output
    type: predict
    prompt: { en: 'What does this response-item parser print?', zh: '这段响应项解析代码会输出什么？' }
    code: |
      response = {
          "status": "completed",
          "output": [
              {"type": "reasoning", "summary": []},
              {"type": "message", "content": [
                  {"type": "output_text", "text": "billing"},
              ]},
          ],
      }
      texts = [
          block["text"]
          for item in response["output"] if item["type"] == "message"
          for block in item["content"] if block["type"] == "output_text"
      ]
      print(response["status"], "".join(texts))
    lang: python
    options:
      - { text: { en: 'completed billing', zh: 'completed billing' }, correct: true }
      - { text: { en: 'completed reasoning', zh: 'completed reasoning' }, correct: false }
      - { text: { en: 'It raises KeyError on the reasoning item.', zh: '程序会在 reasoning 项处抛出 KeyError。' }, correct: false }
      - { text: { en: 'billing completed', zh: 'billing completed' }, correct: false }
    explanation: { en: 'The first filter removes the reasoning item before content is read, and the second filter selects the output_text block.', zh: '第一个过滤条件会在读取 content 前排除 reasoning 项，第二个过滤条件再选出 output_text 块。' }
    difficulty: beginner
    tags: [responses-api, response-items, predict-output]

  - id: continuation-instructions
    type: mcq
    prompt: { en: 'A second Responses API call uses previous_response_id. What should it do with trusted instructions?', zh: '第二次 Responses API 调用使用了 previous_response_id。可信指令应如何处理？' }
    options:
      - { text: { en: 'Send the current trusted instructions again because the previous instructions do not carry over.', zh: '再次发送本轮可信指令，因为上一轮 instructions 不会自动继承。' }, correct: true }
      - { text: { en: 'Omit them because every request setting is inherited.', zh: '省略指令，因为每个请求设置都会继承。' }, correct: false }
      - { text: { en: 'Append them to the user text so both have equal authority.', zh: '把指令追加到用户文本，让两者具有相同权限。' }, correct: false }
      - { text: { en: 'Put the API key in instructions so the chain can authenticate.', zh: '把 API 密钥放进 instructions，让响应链完成认证。' }, correct: false }
    explanation: { en: 'previous_response_id supplies prior response context, but the instructions parameter is scoped to the current request and must be rebuilt from trusted configuration.', zh: 'previous_response_id 会提供此前响应的上下文，但 instructions 参数只属于本轮请求，必须从可信配置重新构造。' }
    difficulty: intermediate
    tags: [conversation-state, instructions]

  - id: spot-fragile-response-reader
    type: spotbug
    prompt: { en: 'Find the failure paths in this generated Responses API reader.', zh: '找出这段生成的 Responses API 响应读取代码中的失败路径。' }
    code: |
      def accept_reply(response):
          text = response["output"][0]["content"][0]["text"]
          if response["status"] == "incomplete":
              return text
          if not text:
              return "no answer"
          publish_summary(text)
          return text

      result = accept_reply(api_response)
      audit_log({"result": result, "response": api_response})
    lang: python
    issues:
      - line: 2
        kind: edge-case
        note: { en: 'The first output item may be reasoning or a tool call, and text can appear across several message content blocks.', zh: '第一个输出项可能是推理或工具调用，而且文本可能分布在多个消息内容块中。' }
      - line: 3
        kind: correctness
        note: { en: 'The function returns and later publishes incomplete text instead of routing it to an explicit truncation fallback.', zh: '函数会返回并随后发布未完成文本，而不是进入明确的截断回退路径。' }
      - line: 11
        kind: security
        note: { en: 'Logging the full response can retain sensitive input, output, metadata, and annotations without redaction.', zh: '记录完整响应可能在未删减的情况下保留敏感输入、输出、元数据和注解。' }
    explanation: { en: 'Check completion status first, aggregate or dispatch typed output safely, validate before publishing, and log only approved diagnostic fields.', zh: '应先检查完成状态，再安全聚合或分派类型化输出，验证后才能发布，并且日志只记录获准的诊断字段。' }
    difficulty: intermediate
    tags: [response-status, parsing, logging]

  - id: classify-rate-limit-error
    type: mcq
    prompt: { en: 'A request returns HTTP 429 with error.code organization_spend_limit_exceeded. What is the correct immediate action?', zh: '请求返回 HTTP 429，error.code 为 organization_spend_limit_exceeded。正确的立即处理方式是什么？' }
    options:
      - { text: { en: 'Stop retrying and route the failure to spend-limit remediation.', zh: '停止重试，并把故障交给支出上限处置流程。' }, correct: true }
      - { text: { en: 'Retry forever with exponential backoff.', zh: '使用指数退避无限重试。' }, correct: false }
      - { text: { en: 'Remove max_output_tokens and resend immediately.', zh: '删除 max_output_tokens 后立即重发。' }, correct: false }
      - { text: { en: 'Treat the response as an empty successful completion.', zh: '把响应当作内容为空的成功完成。' }, correct: false }
    explanation: { en: 'Some 429 responses represent billing or spend limits rather than temporary throughput. They require account or project changes, not another identical request.', zh: '部分 429 表示账务或支出上限，并非暂时性吞吐限制。它们需要修改账户或项目配置，原样重发无法恢复。' }
    difficulty: intermediate
    tags: [rate-limits, errors, retries]

  - id: review-generated-support-publisher
    type: review
    prompt: { en: 'Review this generated OpenAI support-summary publisher before production use.', zh: '在投入生产前审查这段生成的 OpenAI 客服摘要发布器。' }
    task: { en: 'Draft a support summary and publish it only after a complete, validated model response.', zh: '起草客服摘要，并且只在模型响应完整且通过验证后发布。' }
    code: |
      from openai import OpenAI

      def publish_ticket(ticket):
          client = OpenAI()
          response = client.responses.create(
              model="gpt-6-astra",
              instructions=ticket["text"],
              input="Write a support summary.",
              max_output_tokens=200,
          )
          summary = response.output[0].content[0].text

          if ticket["priority"] == "urgent":
              page_on_call(summary)

          audit_log({
              "ticket": ticket,
              "response": response.model_dump(),
          })
          publish_summary(ticket["id"], summary)
          return summary
    lang: python
    issues:
      - line: 4
        kind: performance
        note: { en: 'Constructing a client for every ticket prevents normal connection-pool reuse; inject or reuse a configured long-lived client.', zh: '每张工单都构造客户端，会妨碍连接池复用；应注入或复用配置好的长生命周期客户端。' }
      - line: 7
        kind: security
        note: { en: 'Untrusted ticket text becomes a high-authority instruction, allowing user content to replace the application policy.', zh: '不可信的工单文本被提升为高权限指令，使用户内容能够替换应用策略。' }
      - line: 11
        kind: edge-case
        note: { en: 'The first output item is not guaranteed to be a message, and text may span multiple output_text blocks.', zh: '第一个输出项不保证是消息，而且文本可能分布在多个 output_text 块中。' }
      - line: 11
        kind: correctness
        note: { en: 'The code publishes without checking completed status, incomplete_details, or the summary schema and domain limits.', zh: '代码没有检查 completed 状态、incomplete_details、摘要模式与领域限制就直接发布。' }
    right: { en: 'The code uses the current Responses entry point, lets the client read credentials from its environment, and sets an explicit output bound.', zh: '代码使用当前 Responses 入口，让客户端从环境读取凭据，并设置了明确的输出上限。' }
    checklist:
      - { en: 'Keep trusted instructions separate from untrusted ticket content.', zh: '把可信指令与不可信工单内容分开。' }
      - { en: 'Check terminal status and dispatch every output item by type.', zh: '检查终止状态，并按类型分派每个输出项。' }
      - { en: 'Validate summary shape and business constraints before any publish or page.', zh: '发布或呼叫值班人员前，验证摘要形状与业务约束。' }
      - { en: 'Reuse the client and log only redacted correlation fields.', zh: '复用客户端，并且日志只记录经过删减的关联字段。' }
    explanation: { en: 'Reuse a configured client, keep application policy in trusted instructions, and treat the complete response as untrusted until status and content validation succeed. Publishing and paging belong after that gate, while logs need an allowlist instead of full ticket and response objects.', zh: '应复用配置好的客户端，把应用策略放在可信指令中，并在状态与内容验证通过前始终把完整响应视为不可信数据。发布和呼叫值班人员必须位于这道关卡之后；日志应使用字段允许列表，不能记录完整工单与响应对象。' }
    difficulty: advanced
    tags: [responses-api, security, code-review, validation]
