topic: frontend/css-animation
items:
  - id: predict-transition-lists
    type: predict
    prompt: { en: 'What does this page log in a browser?', zh: '这个页面会在浏览器中输出什么？' }
    code: |
      <style>
        .chip {
          transition: opacity 120ms linear, transform 240ms ease 40ms;
        }
      </style>
      <span id="chip" class="chip">Ready</span>
      <script>
        const style = getComputedStyle(document.querySelector('#chip'));
        console.log(style.transitionDuration);
        console.log(style.transitionDelay);
      </script>
    lang: html
    options:
      - { text: { en: "0.12s, 0.24s\n0s, 0.04s", zh: "0.12s, 0.24s\n0s, 0.04s" }, correct: true }
      - { text: { en: "0.12s\n0.04s", zh: "0.12s\n0.04s" }, correct: false }
      - { text: { en: "0.24s, 0.12s\n0.04s, 0s", zh: "0.24s, 0.12s\n0.04s, 0s" }, correct: false }
      - { text: { en: 'It logs empty strings until a transition starts.', zh: '过渡开始前会输出两个空字符串。' }, correct: false }
    explanation: { en: 'Each comma-separated shorthand item contributes one duration and one delay. Browsers serialize 120ms as 0.12s and the omitted first delay as 0s.', zh: '简写中每个逗号分隔项都会提供一个持续时间和一个延迟。浏览器把120ms序列化为0.12s，第一项省略的延迟则是0s。' }
    difficulty: intermediate
    tags: [transition, shorthand, computed-style]

  - id: choose-transition-or-keyframes
    type: mcq
    prompt: { en: 'Which case most directly calls for a CSS keyframe animation rather than a transition?', zh: '哪种场景更适合直接使用CSS关键帧动画，而不是过渡？' }
    options:
      - { text: { en: 'A notice must pass through three timed visual stages and then repeat twice.', zh: '通知需要经过三个定时视觉阶段，并重复两次。' }, correct: true }
      - { text: { en: 'A button color changes between its normal and hover states.', zh: '按钮颜色在普通状态与悬停状态之间变化。' }, correct: false }
      - { text: { en: 'A form field receives an accessible error message.', zh: '表单字段收到一条可访问的错误消息。' }, correct: false }
    explanation: { en: 'Keyframes name intermediate stages and support iteration directly. A two-state value change already represented by hover is the natural transition case.', zh: '关键帧能命名中间阶段，并直接支持重复。由hover表达的两状态属性变化则是典型的过渡场景。' }
    difficulty: beginner
    tags: [animation, transition, keyframes]

  - id: spot-hidden-menu
    title: { en: 'Spot the bug in the menu animation', zh: '找出菜单动画里的bug' }
    type: spotbug
    prompt: { en: 'Find the problems in this generated menu animation.', zh: '找出这段生成的菜单动画中的问题。' }
    code: |
      .menu {
        opacity: 0;
        transform: translateY(-8px);
        transition: all 180ms ease;
      }

      .menu.open {
        opacity: 1;
        transform: translateY(0);
      }
    lang: css
    issues:
      - line: 2
        kind: correctness
        note: { en: 'Opacity changes only presentation; the closed menu can remain focusable and clickable unless semantic visibility is managed separately.', zh: '透明度只改变呈现；如果不另外管理语义可见性，关闭的菜单仍可能获得焦点和点击。' }
      - line: 4
        kind: readability
        note: { en: 'all silently includes every transitionable property added later. Name opacity and transform explicitly.', zh: 'all会悄悄包含以后新增的所有可过渡属性。应明确写出opacity与transform。' }
    explanation: { en: 'Use hidden, inert, or the component framework’s equivalent for the closed semantic state, coordinated with the exit effect. Keep the transition property list explicit.', zh: '关闭状态应通过hidden、inert或组件框架的等价机制处理语义，并与离场效果协调。过渡属性列表应保持明确。' }
    difficulty: intermediate
    tags: [transition, accessibility, code-review]

  - id: fill-mode-state
    type: mcq
    prompt: { en: 'What does animation-fill-mode: forwards guarantee after an animation finishes?', zh: '动画结束后，animation-fill-mode: forwards保证了什么？' }
    options:
      - { text: { en: 'The animation effect continues to supply its final sampled value.', zh: '动画效果会继续提供其最终采样值。' }, correct: true }
      - { text: { en: 'The final declarations are copied into the element’s inline style.', zh: '最终声明会被复制到元素的行内样式。' }, correct: false }
      - { text: { en: 'The component state and ARIA attributes are updated automatically.', zh: '组件状态和ARIA属性会自动更新。' }, correct: false }
      - { text: { en: 'The animation can no longer be overridden by the cascade.', zh: '层叠再也无法覆盖这个动画。' }, correct: false }
    explanation: { en: 'forwards extends the effect into the after phase; it does not persist data or rewrite declarations. Ordinary state rules should own a lasting endpoint.', zh: 'forwards只是把效果延伸到结束后的阶段，不会保存数据或改写声明。持久终点应由普通状态规则负责。' }
    difficulty: intermediate
    tags: [animation, fill-mode, cascade]

  - id: review-generated-cart
    title: { en: 'Review generated cart panel', zh: '审查生成的购物车面板' }
    type: review
    prompt: { en: 'Review this generated cart panel before it ships.', zh: '在这段生成的购物车面板上线前进行审查。' }
    task: { en: 'Open and close an accessible cart panel with a short slide transition, including a reliable reduced-motion path.', zh: '通过短暂滑动过渡打开和关闭可访问的购物车面板，并提供可靠的减少动态效果路径。' }
    code: |
      <button id="open-cart">Open cart</button>
      <aside id="cart" class="cart" hidden tabindex="-1">
        <button id="close-cart">Close</button>
        <p>Your cart is ready.</p>
      </aside>
      <style>
        .cart {
          position: fixed;
          left: -22rem;
          transition: all 300ms ease;
        }
        .cart.open { left: 0; }
      </style>
      <script>
        const cart = document.querySelector('#cart');
        document.querySelector('#open-cart').onclick = () => {
          cart.hidden = false;
          cart.classList.add('open');
        };
        document.querySelector('#close-cart').onclick = () => {
          cart.classList.remove('open');
          cart.hidden = true;
        };
        cart.addEventListener('transitionend', () => cart.focus());
      </script>
    lang: html
    issues:
      - line: 9
        kind: performance
        note: { en: 'Animating left can require layout on every sampled frame. Measure a transform-based slide as the first alternative.', zh: '对left做动画可能在每个采样帧触发布局。应先测量基于transform的滑动方案。' }
      - line: 10
        kind: readability
        note: { en: 'all hides the panel’s motion contract and can animate unrelated properties introduced later.', zh: 'all隐藏了面板的动态效果契约，还可能让以后新增的无关属性参与过渡。' }
      - line: 16
        kind: edge-case
        note: { en: 'Unhiding and adding open in one task may not establish a rendered before-change style, so an entry transition is not guaranteed.', zh: '在同一个任务中取消隐藏并添加open，可能来不及建立已渲染的变化前样式，因此不能保证入场过渡。' }
      - line: 22
        kind: correctness
        note: { en: 'Setting hidden immediately stops rendering, so the exit cannot play and its transitionend-dependent focus code is unreliable.', zh: '立即设置hidden会停止渲染，因此离场无法播放，依赖transitionend的焦点代码也不可靠。' }
    right: { en: 'The snippet starts with semantic buttons, keeps the closed panel out of rendering with hidden, and uses a class to name the visual open state.', zh: '代码使用了语义化按钮，通过hidden让关闭的面板停止渲染，并用类名表示视觉上的打开状态。' }
    checklist:
      - { en: 'Test opening, closing, and rapid reversal with and without reduced motion.', zh: '分别在普通与减少动态效果模式下测试打开、关闭和快速反转。' }
      - { en: 'Name the animated properties and record whether frames perform layout or paint.', zh: '明确列出动画属性，并记录各帧是否执行布局或绘制。' }
      - { en: 'Move focus on open and return it to the trigger on close without depending solely on an end event.', zh: '打开时移动焦点，关闭时把焦点还给触发按钮，而且不能只依赖结束事件。' }
      - { en: 'Keep hidden and the visual state synchronized on cancellation and zero-duration paths.', zh: '在取消与零时长路径中保持hidden与视觉状态同步。' }
    explanation: { en: 'Use explicit transform and opacity transitions, separate rendered exit from final hidden state, and make focus and completion deterministic when motion is absent or canceled. Verify the chosen entry technique in target browsers.', zh: '应明确过渡transform与opacity，把已渲染的离场阶段和最终hidden状态分开，并在无动画或取消时确定地完成焦点与状态处理。所选入场技术还要在目标浏览器中验证。' }
    difficulty: advanced
    tags: [code-review, transition, accessibility, performance]
