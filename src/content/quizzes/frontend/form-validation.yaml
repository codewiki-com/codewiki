topic: frontend/form-validation
items:
  - id: predict-native-validity
    type: predict
    prompt: { en: 'What does this page log in a browser?', zh: '这个页面会在浏览器中输出什么？' }
    code: |
      <form id="signup">
        <input id="email" type="email" required />
      </form>
      <script>
        const form = document.querySelector('#signup');
        const email = document.querySelector('#email');
        email.value = 'wrong';
        console.log(form.checkValidity());
        email.value = 'reader@example.com';
        console.log(form.checkValidity());
      </script>
    lang: html
    options:
      - { text: { en: "false\ntrue", zh: "false\ntrue" }, correct: true }
      - { text: { en: "true\ntrue", zh: "true\ntrue" }, correct: false }
      - { text: { en: "false\nfalse", zh: "false\nfalse" }, correct: false }
      - { text: { en: 'It throws because checkValidity() only exists on controls.', zh: '程序会抛出异常，因为checkValidity() 只存在于控件上。' }, correct: false }
    explanation: { en: 'The first value violates the email type constraint, while the second satisfies both type=email and required. A form exposes checkValidity() and aggregates its participating controls.', zh: '第一个值违反email类型约束，第二个值同时满足type=email与required。表单自身提供checkValidity()，并汇总参与验证的控件。' }
    difficulty: beginner
    tags: [constraint-validation, predict-output]

  - id: server-remains-authoritative
    type: mcq
    prompt: { en: 'Why must a server validate data that already passed browser constraint validation?', zh: '数据已经通过浏览器约束验证，为什么服务器仍须验证？' }
    options:
      - { text: { en: 'A client can modify the DOM or send a request without using the form.', zh: '客户端可以修改DOM，或完全绕过表单直接发送请求。' }, correct: true }
      - { text: { en: 'Browser validation encrypts values, but the server must decrypt them.', zh: '浏览器验证会加密值，而服务器必须解密。' }, correct: false }
      - { text: { en: 'The server is the only layer that can display an inline error.', zh: '只有服务器才能显示字段旁的错误。' }, correct: false }
      - { text: { en: 'HTML constraints stop working after the first successful submit.', zh: 'HTML约束在首次成功提交后就不再工作。' }, correct: false }
    explanation: { en: 'Client-side validation is user experience, not a trust boundary. The server must parse untrusted request data and enforce the authoritative business contract.', zh: '客户端验证服务于用户体验，并不是信任边界。服务器必须解析不可信请求数据，并执行权威业务契约。' }
    difficulty: beginner
    tags: [server-validation, trust-boundary]

  - id: spot-sticky-custom-error
    title: { en: 'Spot the bug in password confirmation', zh: '找出密码确认里的bug' }
    type: spotbug
    prompt: { en: 'Find the state bug in this password-confirmation check.', zh: '找出这段密码确认检查中的状态错误。' }
    code: |
      const form = document.querySelector('#signup');
      const password = document.querySelector('#password');
      const confirmation = document.querySelector('#confirmation');

      form.addEventListener('submit', (event) => {
        if (password.value !== confirmation.value) {
          confirmation.setCustomValidity('Passwords do not match');
          event.preventDefault();
        }
      });
    lang: javascript
    issues:
      - line: 7
        kind: correctness
        note: { en: 'After one mismatch, the custom error is never cleared, so the control remains invalid even when both values later match. Recompute on both inputs and call setCustomValidity("") on success.', zh: '一旦出现不匹配，自定义错误就再也没有清除；即使两个值后来一致，控件仍然无效。应在两个输入变化时重新计算，并在通过时调用setCustomValidity("")。' }
    explanation: { en: 'A non-empty custom validity message is persistent control state. Rendering different text or changing the input value does not clear it automatically.', zh: '非空的自定义有效性消息是持久的控件状态。修改页面文字或输入值，都不会自动清除它。' }
    difficulty: intermediate
    tags: [custom-validity, cross-field]

  - id: choose-real-submit-path
    type: mcq
    prompt: { en: 'Which interface best simulates activation of a submit button and preserves constraint validation?', zh: '哪个接口最适合模拟提交按钮激活，并保留约束验证？' }
    options:
      - { text: { en: 'form.requestSubmit()', zh: 'form.requestSubmit()' }, correct: true }
      - { text: { en: 'form.submit()', zh: 'form.submit()' }, correct: false }
      - { text: { en: 'form.dispatchEvent(new Event("change"))', zh: 'form.dispatchEvent(new Event("change"))' }, correct: false }
      - { text: { en: 'form.reset()', zh: 'form.reset()' }, correct: false }
    explanation: { en: 'requestSubmit() follows the submit-button path, including interactive validation and the submit event. submit() sends directly and bypasses both.', zh: 'requestSubmit() 遵循提交按钮路径，包括交互式验证与submit事件。submit() 会直接发送，并绕过这两步。' }
    difficulty: intermediate
    tags: [request-submit, constraint-validation]

  - id: review-generated-username-form
    title: { en: 'Review generated username form', zh: '审查生成的用户名表单' }
    type: review
    prompt: { en: 'Review this generated username form before release.', zh: '在发布前审查这段生成的用户名表单。' }
    task: { en: 'Validate a username with accessible feedback, check availability without stale results, and submit only data that the server independently accepts.', zh: '使用可访问反馈验证用户名，检查可用性且不产生过期结果，并且只提交由服务器独立接受的数据。' }
    code: |
      <form id="signup" novalidate>
        <label for="username">Username</label><input id="username" name="username" minlength="3" />
        <span id="username-error"></span>
        <button>Create account</button>
      </form>
      <script>
        const form = document.querySelector('#signup');
        const input = document.querySelector('#username');
        input.addEventListener('input', async () => {
          const response = await fetch(`/api/users/${input.value}`);
          const { available } = await response.json();
          if (!available) {
            input.setCustomValidity('Username is already taken');
            input.insertAdjacentHTML('afterend', '<span role="alert">Taken</span>');
          }
        });
        form.addEventListener('submit', (event) => {
          event.preventDefault();
          if (!input.checkValidity()) return;
          fetch('/api/signup', {
            method: 'POST',
            body: JSON.stringify({ username: input.value, validated: true })
          });
        });
      </script>
    lang: html
    right: { en: 'The code uses a semantic form and label, includes a native length constraint, blocks the default navigation, and checks control validity before starting its request.', zh: '代码使用了语义化表单和标签，包含原生长度约束，阻止默认导航，并在发起请求前检查控件有效性。' }
    checklist:
      - { en: 'Compare HTML constraints, custom rules, and the server contract field by field.', zh: '逐字段比较HTML约束、自定义规则与服务器契约。' }
      - { en: 'Test rapid input, out-of-order responses, cancellation, and network failure.', zh: '测试快速输入、乱序响应、取消与网络失败。' }
      - { en: 'Inspect each error message association and complete repair using only the keyboard.', zh: '检查每条错误消息的关联，并且只用键盘完成修正。' }
      - { en: 'Send malformed requests directly and prove the server ignores client validation claims.', zh: '直接发送畸形请求，并证明服务器不会信任客户端的验证声明。' }
    issues:
      - line: 9
        kind: performance
        note: { en: 'Every keystroke starts a remote request without debouncing or cancellation, producing avoidable work while the value is incomplete.', zh: '每次按键都会启动远程请求，而且没有防抖或取消机制，会在值尚未完成时产生可避免的工作。' }
      - line: 10
        kind: edge-case
        note: { en: 'The raw value is placed in a path without encodeURIComponent, responses can arrive out of order, and network or JSON failures have no defined state.', zh: '原始值未经encodeURIComponent就放入路径；响应还可能乱序返回，网络或JSON失败也没有定义状态。' }
      - line: 13
        kind: correctness
        note: { en: 'The custom error is never cleared when a later username is available, so one failed lookup can permanently block the control.', zh: '后续用户名可用时没有清除自定义错误，因此一次失败查询就可能永久阻止该控件。' }
      - line: 14
        kind: readability
        note: { en: 'Each failed check inserts another anonymous alert instead of updating the existing username-error node and its stable aria-describedby relationship.', zh: '每次失败都会插入新的匿名警报，而不是更新已有的username-error节点及其稳定的aria-describedby关联。' }
      - line: 22
        kind: security
        note: { en: 'A client-authored validated flag has no authority. The server must ignore it and validate the username, availability, authentication, and request protections itself.', zh: '客户端生成的validated标志没有权威性。服务器必须忽略它，自行验证用户名、可用性、认证和请求保护。' }
    explanation: { en: 'Keep one associated error node, clear custom validity on success, debounce or cancel lookups, reject stale responses, encode the query value, and define network failure. The server must independently validate and atomically enforce username uniqueness.', zh: '应保留一个已关联的错误节点，在成功时清除自定义有效性，对查询进行防抖或取消，拒绝过期响应，对查询值编码，并定义网络失败状态。服务器必须独立验证，并以原子方式执行用户名唯一性约束。' }
    difficulty: advanced
    tags: [code-review, accessibility, async-validation, trust-boundary]
    minutes: 12
