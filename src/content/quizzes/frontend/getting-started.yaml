topic: frontend/getting-started
items:
  - id: predict-pressed-state
    type: predict
    prompt: { en: 'What does this page log after the scripted click?', zh: '脚本触发点击后，这个页面会输出什么？' }
    code: |
      <button id="toggle" type="button" aria-pressed="false">Enable</button>
      <script>
        const toggle = document.querySelector('#toggle');
        toggle.addEventListener('click', () => {
          const enabled = toggle.ariaPressed !== 'true';
          toggle.ariaPressed = String(enabled);
          toggle.textContent = enabled ? 'Disable' : 'Enable';
        });
        toggle.click();
        console.log(`${toggle.textContent}:${toggle.ariaPressed}`);
      </script>
    lang: html
    options:
      - { text: { en: 'Disable:true', zh: 'Disable:true' }, correct: true }
      - { text: { en: 'Enable:false', zh: 'Enable:false' }, correct: false }
      - { text: { en: 'Disable:false', zh: 'Disable:false' }, correct: false }
      - { text: { en: 'Enable:true', zh: 'Enable:true' }, correct: false }
    explanation: { en: 'The initial string is false, so the handler computes true and updates both the button label and aria-pressed before logging.', zh: '初始字符串为 false，因此处理器计算出 true，并在输出前同时更新按钮文字和 aria-pressed。' }
    difficulty: beginner
    tags: [dom, events, state, predict-output]

  - id: choose-navigation-element
    type: mcq
    prompt: { en: 'Which implementation preserves native navigation if JavaScript does not run?', zh: 'JavaScript 没有运行时，哪种实现仍保留原生导航能力？' }
    options:
      - { text: { en: '<a href="/account">Account</a>', zh: '<a href="/account">Account</a>' }, correct: true }
      - { text: { en: '<button onclick="location.href=/account">Account</button>', zh: '<button onclick="location.href=/account">Account</button>' }, correct: false }
      - { text: { en: '<div role="link">Account</div>', zh: '<div role="link">Account</div>' }, correct: false }
      - { text: { en: '<span data-route="/account">Account</span>', zh: '<span data-route="/account">Account</span>' }, correct: false }
    explanation: { en: 'A link with href exposes a destination and native navigation behavior without a script. The other choices need extra code and still do not reproduce every link behavior.', zh: '带 href 的链接无需脚本就能公开目标并提供原生导航行为。其他选项需要额外代码，而且仍无法复现链接的全部行为。' }
    difficulty: beginner
    tags: [html, navigation, progressive-enhancement]

  - id: spot-generated-save-control
    type: spotbug
    prompt: { en: 'Find the accessibility and data-handling bugs in this generated save control.', zh: '找出这段生成的保存控件中的无障碍与数据处理错误。' }
    code: |
      <div class="save" tabindex="0">Save</div>
      <p id="message"></p>
      <script>
        const label = new URLSearchParams(location.search).get('label');
        const save = document.querySelector('.save');
        save.addEventListener('click', () => {
          message.innerHTML = `Saved ${label}`;
        });
        save.click();
      </script>
    lang: html
    issues:
      - line: 1
        kind: correctness
        note: { en: 'A focusable div with only a click handler does not supply button semantics or Space and Enter activation. Use a button.', zh: '可聚焦的 div 只有点击处理器，并不具备按钮语义，也不支持 Space 与 Enter 激活。应改用 button。' }
      - line: 7
        kind: security
        note: { en: 'label comes from the URL and is parsed as HTML. Insert plain text with textContent or sanitize an explicitly allowed rich-text format.', zh: 'label 来自 URL，却被解析成 HTML。纯文本应使用 textContent；明确允许的富文本格式则要经过清理。' }
    explanation: { en: 'Use the native element for the interaction and keep untrusted text out of HTML parsing sinks. tabindex alone fixes neither keyboard behavior nor semantics.', zh: '交互应采用原生元素，并让不可信文本远离 HTML 解析入口。只添加 tabindex 既不能补齐键盘行为，也不能补齐语义。' }
    difficulty: beginner
    tags: [semantic-html, keyboard, xss, innerhtml]

  - id: identify-css-winner
    type: mcq
    prompt: { en: 'A matching CSS declaration is crossed out in developer tools. What should you inspect first?', zh: '开发者工具中一条匹配的 CSS 声明被划掉了，首先应检查什么？' }
    options:
      - { text: { en: 'The competing declarations and their cascade order', zh: '竞争声明及其层叠顺序' }, correct: true }
      - { text: { en: 'Whether JavaScript is installed', zh: '是否安装了 JavaScript' }, correct: false }
      - { text: { en: 'The monitor resolution only', zh: '只检查显示器分辨率' }, correct: false }
      - { text: { en: 'Whether the file has more CSS lines', zh: '文件中的 CSS 行数是否更多' }, correct: false }
    explanation: { en: 'A crossed-out matching declaration lost during the cascade. Compare origin, layer, importance, specificity, scoping proximity, and source order in the computed result.', zh: '匹配却被划掉的声明在层叠中落败。应在计算结果中比较来源、层、重要性、优先级、作用域邻近性和源码顺序。' }
    difficulty: beginner
    tags: [css, cascade, devtools]

  - id: review-generated-product-panel
    type: review
    prompt: { en: 'Review this generated product panel before it is reused on a production page.', zh: '在生产页面复用前，审查这段生成的产品面板。' }
    task: { en: 'Load product cards on demand into a reusable, responsive panel and expose a clear failure state.', zh: '按需把产品卡片加载到可复用的响应式面板中，并公开清晰的失败状态。' }
    code: |
      <section aria-labelledby="products-title">
        <h2 id="products-title">Products</h2>
        <button id="load-products">Load products</button>
        <div id="results"></div>
      </section>
      <script>
        const results = document.querySelector('#results');
        async function loadProducts() {
          const response = await fetch('/api/products');
          const products = await response.json();
          results.innerHTML = '';
          for (const product of products) {
            results.innerHTML += `<article class="card"><h3>${product.name}</h3></article>`;
          }
          window.addEventListener('resize', () => {
            const width = innerWidth > 700 ? '300px' : '100%';
            results.querySelectorAll('.card').forEach((card) => {
              card.style.width = width;
            });
          });
        }
        document.querySelector('#load-products').addEventListener('click', loadProducts);
      </script>
      <style>
        #results { display: flex; gap: 16px; } .card { width: 300px; }
      </style>
    lang: html
    issues:
      - line: 3
        kind: edge-case
        note: { en: 'The button has no explicit type. If the reusable section is placed inside a form, clicking it submits that form.', zh: '按钮没有明确的 type。可复用区块一旦放进表单，点击它就会提交该表单。' }
      - line: 10
        kind: correctness
        note: { en: 'The code parses every HTTP response as successful JSON without checking response.ok or defining loading, empty, and failure states.', zh: '代码没有检查 response.ok，也没有定义加载、空结果与失败状态，却把所有 HTTP 响应都当成成功的 JSON 解析。' }
      - line: 13
        kind: security
        note: { en: 'An API-controlled product name enters an innerHTML template without sanitization, creating an HTML injection sink.', zh: 'API 控制的产品名称未经清理就进入 innerHTML 模板，形成 HTML 注入入口。' }
      - line: 12
        lines: 3
        kind: performance
        note: { en: 'Repeated innerHTML += reparses and replaces the growing subtree on every iteration. Build nodes in a fragment and append once.', zh: '循环中的 innerHTML += 会在每轮重新解析并替换不断增长的子树。应在片段中构建节点，再一次追加。' }
      - line: 15
        lines: 5
        kind: readability
        note: { en: 'Each load adds another resize listener, while JavaScript and CSS compete to own card width. Express the responsive constraint once in CSS Grid.', zh: '每次加载都会再添加一个 resize 监听器，而且 JavaScript 与 CSS 争夺卡片宽度。应只用 CSS Grid 表达一次响应式约束。' }
    right: { en: 'The generated code uses a section with a named heading, a native button, one function for the network operation, and a shared results container.', zh: '生成代码使用了带名称标题的 section、原生按钮、集中处理网络操作的函数，以及共享的结果容器。' }
    checklist:
      - { en: 'Define loading, success, empty, failure, retry, and repeated-click behavior before styling.', zh: '在写样式前定义加载、成功、空结果、失败、重试与重复点击行为。' }
      - { en: 'Trace remote strings to their DOM sink and keep plain text out of HTML parsing APIs.', zh: '追踪远程字符串到 DOM 写入位置，让纯文本远离 HTML 解析 API。' }
      - { en: 'Keep responsive layout in CSS and test narrow containers, long names, and zoom.', zh: '让响应式布局留在 CSS 中，并测试窄容器、长名称与缩放。' }
      - { en: 'Repeat the action and confirm listeners, requests, focus, and announcements do not duplicate.', zh: '重复执行操作，确认监听器、请求、焦点与通知不会重复。' }
    explanation: { en: 'Make the button type explicit, model every request state, create text-bearing DOM nodes safely, and let CSS own responsive sizing. Repeated actions must not accumulate listeners.', zh: '应明确按钮类型，为每种请求状态建模，安全地创建承载文本的 DOM 节点，并让 CSS 负责响应式尺寸。重复操作不能累积监听器。' }
    difficulty: intermediate
    tags: [code-review, fetch, dom, security, responsive-design]
