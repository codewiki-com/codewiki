topic: frontend/checkpoint-4
items:
  - id: checkpoint-4-core
    type: mcq
    prompt: { en: 'What lets Vite avoid rebuilding one large application bundle before serving every development change?', zh: 'Vite 为什么不必在每次开发改动后先重新构建一个完整的大型应用包？' }
    options:
      - { text: { en: 'It serves source modules through native ESM and transforms requested modules on demand.', zh: '它通过原生 ESM 提供源码模块，并按需转换被请求的模块。' }, correct: true }
      - { text: { en: 'It disables the browser module graph during development.', zh: '它在开发期间禁用浏览器模块图。' }, correct: false }
      - { text: { en: 'It converts every dependency into one global script tag.', zh: '它把所有依赖都转换成一个全局 script 标签。' }, correct: false }
    explanation: { en: 'During development, native module requests let Vite transform and update a narrow part of the graph instead of rebundling the whole application first.', zh: '开发期间，原生模块请求让 Vite 可以转换并更新模块图中的局部内容，而无需先重新打包整个应用。' }
    difficulty: beginner
    tags: [checkpoint]
  - id: checkpoint-4-term
    type: fill
    prompt: { en: 'Name the Vite object used by application code to read exposed environment variables.', zh: '写出 Vite 应用代码读取已公开环境变量时使用的对象。' }
    answer: 'import.meta.env'
    explanation: { en: 'Vite exposes permitted client environment values through `import.meta.env`; secrets must remain on the server.', zh: 'Vite 通过 `import.meta.env` 暴露允许进入客户端的环境值；密钥必须留在服务器端。' }
    difficulty: beginner
    tags: [checkpoint]
  - id: checkpoint-4-output
    type: mcq
    prompt: { en: 'Which JavaScript syntax establishes an asynchronous module boundary that a bundler can use for code splitting?', zh: '哪种 JavaScript 语法会建立异步模块边界，供打包器用于代码分割？' }
    options:
      - { text: { en: '`import("./analytics.js")`', zh: '`import("./analytics.js")`' }, correct: true }
      - { text: { en: '`require("./analytics.js")` at the top of every entry', zh: '在每个入口顶部使用 `require("./analytics.js")`' }, correct: false }
      - { text: { en: 'Copying the module source into an inline comment', zh: '把模块源码复制到行内注释中' }, correct: false }
    explanation: { en: 'Dynamic `import()` returns a promise for the module namespace and gives bundlers a natural point for a separately loaded chunk.', zh: '动态 `import()` 返回模块命名空间的 Promise，也为打包器提供了生成独立加载代码块的自然边界。' }
    difficulty: beginner
    tags: [checkpoint]
  - id: checkpoint-4-boundary
    type: fill
    prompt: { en: 'Name the `package.json` field that tells bundlers whether importing files may run observable side effects.', zh: '写出 `package.json` 中用于告知打包器导入文件是否可能产生可观察副作用的字段名。' }
    answer: 'sideEffects'
    explanation: { en: 'Correct `sideEffects` metadata lets a bundler remove unused modules without accidentally deleting required import-time behavior such as CSS or polyfills.', zh: '正确的 `sideEffects` 元数据让打包器能移除未使用模块，同时避免误删 CSS 或 polyfill 等导入时必须执行的行为。' }
    difficulty: intermediate
    tags: [checkpoint]
  - id: checkpoint-4-rule
    type: mcq
    prompt: { en: 'Why are ES modules generally easier to tree-shake than CommonJS modules?', zh: '为什么 ES 模块通常比 CommonJS 模块更容易进行 Tree Shaking？' }
    options:
      - { text: { en: 'Static `import` and `export` declarations let tools analyze bindings before execution.', zh: '静态的 `import` 与 `export` 声明让工具能在执行前分析绑定关系。' }, correct: true }
      - { text: { en: 'ES modules guarantee that every imported file is free of side effects.', zh: 'ES 模块保证每个被导入文件都没有副作用。' }, correct: false }
      - { text: { en: 'CommonJS always downloads modules from the network at runtime.', zh: 'CommonJS 总是在运行时从网络下载模块。' }, correct: false }
    explanation: { en: 'The static module graph supports reachability analysis. Side effects still matter, so ESM alone does not guarantee that code can be removed safely.', zh: '静态模块图支持可达性分析。副作用仍然重要，因此仅使用 ESM 并不能保证代码一定可以安全移除。' }
    difficulty: intermediate
    tags: [checkpoint]
  - id: checkpoint-4-failure
    type: fill
    prompt: { en: 'Name the responsive-image attribute that lists candidate image resources with width or pixel-density descriptors.', zh: '写出响应式图片中列出多个候选资源及其宽度或像素密度描述符的属性名。' }
    answer: 'srcset'
    explanation: { en: '`srcset` provides candidates; the browser combines width descriptors with `sizes`, viewport conditions, and device density to choose one.', zh: '`srcset` 提供候选资源；浏览器会结合宽度描述符、`sizes`、视口条件与设备像素密度进行选择。' }
    difficulty: intermediate
    tags: [checkpoint]
  - id: checkpoint-4-fix
    type: mcq
    prompt: { en: 'A hero image needs a square crop on phones and a wide crop on desktops. Which markup expresses that art-direction requirement?', zh: '首图在手机上需要方形裁剪，在桌面端需要宽幅裁剪。哪种标记能够表达这种艺术指导需求？' }
    options:
      - { text: { en: 'A `<picture>` element with media-conditioned `<source>` elements and an `<img>` fallback', zh: '使用带媒体条件 `<source>` 与 `<img>` 后备内容的 `<picture>` 元素' }, correct: true }
      - { text: { en: 'One oversized `<img>` hidden with `overflow: hidden` at every width', zh: '在所有宽度下都使用一个超大 `<img>`，再通过 `overflow: hidden` 隐藏部分内容' }, correct: false }
      - { text: { en: 'A background image whose file name is changed by JavaScript after every resize event', zh: '使用背景图片，并在每次 resize 事件后通过 JavaScript 修改文件名' }, correct: false }
    explanation: { en: '`<picture>` lets the author select different image compositions for media conditions while retaining the `<img>` fallback and its alternative text.', zh: '`<picture>` 允许作者按媒体条件选择不同构图，同时保留 `<img>` 后备内容及其替代文本。' }
    difficulty: advanced
    tags: [checkpoint]
  - id: checkpoint-4-review
    type: mcq
    prompt: { en: 'A page jumps when product images load. Which narrow fix most directly improves the relevant Web Vital?', zh: '商品图片加载时页面发生跳动。哪种范围最小的修复最直接改善相关 Web Vital？' }
    options:
      - { text: { en: 'Reserve each image’s aspect ratio with `width` and `height` or equivalent CSS.', zh: '通过 `width` 与 `height` 或等效 CSS 为每张图片预留宽高比空间。' }, correct: true }
      - { text: { en: 'Remove image alternative text so the browser has less text to lay out.', zh: '删除图片替代文本，让浏览器减少需要布局的文字。' }, correct: false }
      - { text: { en: 'Move every image into a dynamically imported JavaScript module.', zh: '把每张图片都移入动态导入的 JavaScript 模块。' }, correct: false }
    explanation: { en: 'Reserving image space prevents unexpected movement and directly targets Cumulative Layout Shift (CLS). Lazy loading alone does not reserve geometry.', zh: '预留图片空间可以防止意外移动，直接改善累积布局偏移（CLS）。单独使用延迟加载并不会预留几何空间。' }
    difficulty: advanced
    tags: [checkpoint]
