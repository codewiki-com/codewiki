topic: frontend/css-flexbox
items:
  - id: predict-equal-flex-items
    type: predict
    prompt: { en: 'What does this page log in a browser?', zh: '这个页面会在浏览器中输出什么？' }
    code: |
      <div class="row"><span>A</span><span>Long label</span></div>
      <style>
        .row { display: flex; gap: 20px; width: 300px; }
        .row span { box-sizing: border-box; flex: 1 1 0; min-width: 0; }
      </style>
      <script>
        const widths = [...document.querySelectorAll('span')]
          .map((item) => item.getBoundingClientRect().width);
        console.log(widths.join(','));
      </script>
    lang: html
    options:
      - { text: { en: '140,140', zh: '140,140' }, correct: true }
      - { text: { en: '150,150', zh: '150,150' }, correct: false }
      - { text: { en: 'The second width is always larger because its label is longer.', zh: '第二项的标签更长，所以它的宽度一定更大。' }, correct: false }
      - { text: { en: 'The items overflow because flex-basis is zero.', zh: '因为flex-basis为零，所以项目会溢出。' }, correct: false }
    explanation: { en: 'The 20px gap leaves 280px, and two items with equal zero bases and grow factors receive 140px each.', zh: '20px间隔后还剩280px；两个项目的零基准与伸长因子相同，因此各得140px。' }
    difficulty: beginner
    tags: [flex-grow, flex-basis, predict-output]

  - id: choose-alignment-axis
    type: mcq
    prompt: { en: 'A container uses flex-direction: column. Which property centers its items along that vertical main axis when free space exists?', zh: '容器使用flex-direction: column。主轴存在剩余空间时，哪个属性会让项目沿这条纵向主轴居中？' }
    options:
      - { text: { en: 'justify-content: center', zh: 'justify-content: center' }, correct: true }
      - { text: { en: 'align-items: center', zh: 'align-items: center' }, correct: false }
      - { text: { en: 'align-content: center', zh: 'align-content: center' }, correct: false }
    explanation: { en: 'justify-content always works on the main axis. With column, that axis follows the block direction and is commonly vertical.', zh: 'justify-content始终作用于主轴。column的主轴沿块方向，在常见书写模式中是纵向。' }
    difficulty: beginner
    tags: [main-axis, alignment]

  - id: spot-profile-overflow
    title: { en: 'Spot the bug in the profile row', zh: '找出个人资料行里的bug' }
    type: spotbug
    prompt: { en: 'Find the sizing bugs in this generated profile row.', zh: '找出这段生成的个人资料行中的尺寸错误。' }
    code: |
      .profile {
        display: flex;
        width: 18rem;
      }
      .avatar {
        width: 4rem;
      }
      .details {
        flex: 1;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
    lang: css
    issues:
      - line: 6
        kind: edge-case
        note: { en: 'The avatar keeps the default flex-shrink: 1, so it may become narrower than 4rem when space is tight.', zh: '头像保留默认的flex-shrink: 1，空间不足时可能缩到4rem以下。' }
      - line: 9
        kind: correctness
        note: { en: 'The details item keeps its automatic minimum width. Add min-inline-size: 0 so its long text can shrink before ellipsis is applied.', zh: 'details项目仍使用自动最小宽度。应添加min-inline-size: 0，让长文本先收缩，再应用省略号。' }
    explanation: { en: 'Make the fixed avatar flex: none and give the text-owning flex item a zero logical minimum. Overflow on a descendant cannot force its parent flex item below the automatic minimum.', zh: '固定头像应使用flex: none，承载文本的Flex项目应使用零逻辑最小尺寸。只给后代设置overflow，不能迫使父级Flex项目突破自动最小尺寸。' }
    difficulty: intermediate
    tags: [flex-shrink, automatic-minimum-size, overflow]

  - id: align-content-requirements
    type: mcq
    prompt: { en: 'When can align-content visibly distribute space in a flex container?', zh: '什么情况下align-content才能在Flex容器中明显地分配空间？' }
    options:
      - { text: { en: 'When the container has multiple flex lines and extra cross-axis space', zh: '容器有多条Flex行，而且交叉轴还有剩余空间时' }, correct: true }
      - { text: { en: 'Whenever one item has align-self: auto', zh: '只要某个项目使用align-self: auto' }, correct: false }
      - { text: { en: 'Whenever justify-content has a non-default value', zh: '只要justify-content不是默认值' }, correct: false }
      - { text: { en: 'Only when flex-direction is column', zh: '仅当flex-direction为column' }, correct: false }
    explanation: { en: 'align-content distributes flex lines on the cross axis. One line, or a cross axis with no free space, leaves nothing for it to distribute.', zh: 'align-content沿交叉轴分配Flex行。只有一条行，或交叉轴没有剩余空间时，它都无从分配。' }
    difficulty: intermediate
    tags: [align-content, cross-axis, wrapping]

  - id: review-generated-checkout
    title: { en: 'Review generated checkout action row', zh: '审查生成的结账操作行' }
    type: review
    prompt: { en: 'Review this generated checkout action row before release.', zh: '在发布前审查这段生成的结账操作行。' }
    task: { en: 'Lay out a shrinkable order summary beside a content-sized payment button while preserving source and focus order on narrow screens.', zh: '把可收缩的订单摘要放在按内容定宽的支付按钮旁，并在窄屏上保留源顺序与焦点顺序。' }
    code: |
      <div class="checkout">
        <p class="summary">Total for account-with-a-long-name: $48</p>
        <button class="pay">Pay now</button>
      </div>
      <style>
        .checkout {
          display: flex;
          gap: 1rem;
          align-items: center;
        }
        .summary {
          flex: 1;
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
          transition: inline-size 200ms;
        }
        .pay {
          order: -1;
          flex: 1;
        }
        @media (max-width: 30rem) { .checkout { flex-direction: row-reverse; } }
      </style>
    lang: html
    issues:
      - line: 12
        kind: edge-case
        note: { en: 'The summary has no min-inline-size: 0, so a long unbreakable account name can defeat the intended ellipsis.', zh: 'summary没有min-inline-size: 0，不可断的长账户名可能使预期的省略号失效。' }
      - line: 16
        kind: performance
        note: { en: 'Animating inline-size can cause repeated layout, and the task does not require motion. Remove it unless a measured interaction justifies it.', zh: '对inline-size做动画可能反复触发布局，而且任务并不要求动态效果。除非实测交互证明有必要，否则应删除。' }
      - line: 19
        lines: 4
        kind: correctness
        note: { en: 'order and row-reverse change the visual sequence without changing DOM or focus order, so keyboard movement can oppose the screen order.', zh: 'order和row-reverse改变视觉顺序，却不改变DOM或焦点顺序，因此键盘移动可能与屏幕顺序相反。' }
      - line: 20
        kind: readability
        note: { en: 'flex: 1 makes the payment button stretch and shrink even though the task says it should be content-sized; flex: none states that intent.', zh: '任务要求支付按钮按内容定宽，flex: 1却让它伸长和收缩；flex: none更能明确表达意图。' }
    right: { en: 'The snippet uses semantic text and button elements, keeps both controls in one named component, and uses gap instead of child-margin cleanup.', zh: '代码使用语义化的文本和按钮元素，把两个控件放在同一命名组件中，并用gap代替对子元素外边距的清理。' }
    checklist:
      - { en: 'Identify the main axis and list DOM, visual, and Tab order at every breakpoint.', zh: '确定主轴，并在每个断点列出DOM、视觉与Tab顺序。' }
      - { en: 'Test the longest real summary at the narrowest supported width and inspect automatic minimum sizes.', zh: '在最窄支持宽度下测试最长真实摘要，并检查自动最小尺寸。' }
      - { en: 'State which item may flex and which must remain content-sized.', zh: '明确哪个项目可以伸缩，哪个项目必须按内容定宽。' }
      - { en: 'Remove unrelated transitions or measure their rendering cost and reduced-motion behavior.', zh: '删除无关过渡，或测量其渲染成本与减少动态效果行为。' }
    explanation: { en: 'Keep the DOM and visual order the same, make the summary flex with a zero logical minimum, and make the button flex: none. Sizing changes do not need animation here.', zh: '应保持DOM与视觉顺序一致，让摘要用零逻辑最小尺寸参与伸缩，并让按钮使用flex: none。这里的尺寸变化不需要动画。' }
    difficulty: advanced
    tags: [code-review, flex-sizing, accessibility, performance]
