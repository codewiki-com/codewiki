topic: frontend/checkpoint-1
items:
  - id: checkpoint-1-core
    type: mcq
    prompt: { en: 'Which division of responsibility matches the browser platform?', zh: '哪种职责划分符合浏览器平台的工作方式？' }
    options:
      - { text: { en: 'HTML describes structure and meaning, CSS controls presentation, and JavaScript handles state and behavior.', zh: 'HTML 描述结构与含义，CSS 控制呈现，JavaScript 处理状态与行为。' }, correct: true }
      - { text: { en: 'CSS defines document meaning, while HTML is used only to load scripts.', zh: 'CSS 定义文档含义，HTML 只用于加载脚本。' }, correct: false }
      - { text: { en: 'JavaScript must recreate every native browser interaction before a page can work.', zh: '页面要正常工作，必须先用 JavaScript 重写所有浏览器原生交互。' }, correct: false }
    explanation: { en: 'The three languages cooperate but keep distinct platform responsibilities; frameworks still produce DOM, CSS, and browser events.', zh: '这三种语言相互配合，但各自承担不同的平台职责；框架最终仍会生成 DOM、应用 CSS 并处理浏览器事件。' }
    difficulty: beginner
    tags: [checkpoint]
  - id: checkpoint-1-term
    type: fill
    prompt: { en: 'Name the semantic HTML element for an action that runs in the current page. Include the angle brackets.', zh: '写出用于触发当前页面内操作的语义化 HTML 元素，并包含尖括号。' }
    answer: '<button>'
    explanation: { en: 'A button supplies native focus, keyboard activation, disabled state, and button semantics.', zh: '按钮原生提供焦点、键盘激活、禁用状态和按钮语义。' }
    difficulty: beginner
    tags: [checkpoint]
  - id: checkpoint-1-output
    type: mcq
    prompt: { en: 'A Flexbox container uses `flex-direction: column`. Along which axis does `justify-content` distribute free space?', zh: 'Flexbox 容器使用 `flex-direction: column` 时，`justify-content` 沿哪条轴分配剩余空间？' }
    options:
      - { text: { en: 'The vertical main axis', zh: '垂直方向的主轴' }, correct: true }
      - { text: { en: 'The horizontal cross axis', zh: '水平方向的交叉轴' }, correct: false }
      - { text: { en: 'The DOM reading order rather than a layout axis', zh: 'DOM 阅读顺序，而不是布局轴' }, correct: false }
    explanation: { en: '`flex-direction` defines the main axis. With `column`, the main axis follows the block direction, and `justify-content` operates on it.', zh: '`flex-direction` 决定主轴。使用 `column` 时，主轴沿块方向延伸，`justify-content` 就作用于这条轴。' }
    difficulty: beginner
    tags: [checkpoint]
  - id: checkpoint-1-boundary
    type: fill
    prompt: { en: 'Which logical CSS property commonly lets a long flex item shrink below its automatic minimum width?', zh: '哪个逻辑 CSS 属性通常能让较长的 Flex 项目收缩到自动最小宽度以下？' }
    answer: 'min-inline-size: 0'
    explanation: { en: 'A flex item can otherwise retain its min-content contribution and overflow; setting its logical inline minimum to zero permits shrinking.', zh: 'Flex 项目可能保留最小内容尺寸并产生溢出；把逻辑行内最小尺寸设为零后，它才能继续收缩。' }
    difficulty: intermediate
    tags: [checkpoint]
  - id: checkpoint-1-rule
    type: mcq
    prompt: { en: 'Which layout problem is the clearest fit for CSS Grid rather than Flexbox?', zh: '哪种布局问题最适合使用 CSS Grid，而不是 Flexbox？' }
    options:
      - { text: { en: 'Cards must align to shared row and column tracks.', zh: '卡片必须同时对齐到共享的行轨道和列轨道。' }, correct: true }
      - { text: { en: 'One toolbar button must move to the end of a single row.', zh: '单行工具栏中的一个按钮需要移动到末端。' }, correct: false }
      - { text: { en: 'Text inside one button must stay in DOM order.', zh: '一个按钮内的文本必须保持 DOM 顺序。' }, correct: false }
    explanation: { en: 'Grid is two-dimensional and coordinates explicit rows and columns. Flexbox distributes items along one main axis, even when it wraps.', zh: 'Grid 是二维布局模型，能够协调明确的行与列；Flexbox 即使换行，也仍然沿一条主轴分配项目。' }
    difficulty: intermediate
    tags: [checkpoint]
  - id: checkpoint-1-failure
    type: fill
    prompt: { en: 'Name the CSS function that gives a Grid track a minimum and a maximum size.', zh: '写出能够为 Grid 轨道同时指定最小尺寸和最大尺寸的 CSS 函数名。' }
    answer: 'minmax()'
    explanation: { en: '`minmax()` expresses a track sizing range and is commonly combined with `repeat()` for responsive grids.', zh: '`minmax()` 用于表达轨道的尺寸范围，常与 `repeat()` 组合构建响应式网格。' }
    difficulty: intermediate
    tags: [checkpoint]
  - id: checkpoint-1-fix
    type: mcq
    prompt: { en: 'A card should adapt to the width of its reusable panel, not the whole viewport. Which mechanism best preserves that contract?', zh: '卡片应根据可复用面板的宽度调整，而不是根据整个视口调整。哪种机制最符合这一约定？' }
    options:
      - { text: { en: 'Declare a query container and use a container query.', zh: '声明查询容器并使用容器查询。' }, correct: true }
      - { text: { en: 'Choose a device name and add a viewport media query for it.', zh: '选择一个设备名称，并为它添加视口媒体查询。' }, correct: false }
      - { text: { en: 'Read `window.innerWidth` once and add permanent inline styles.', zh: '只读取一次 `window.innerWidth`，再添加永久的行内样式。' }, correct: false }
    explanation: { en: 'A container query responds to the component’s containing block, so the component remains portable across page layouts.', zh: '容器查询响应组件所在容器的尺寸，因此组件放到不同页面布局中仍能正确适配。' }
    difficulty: advanced
    tags: [checkpoint]
  - id: checkpoint-1-review
    type: fill
    prompt: { en: 'Name the meta element value that makes CSS viewport units and media queries use the device-width layout viewport. Give the `name` value only.', zh: '写出让 CSS 视口单位和媒体查询采用设备宽度布局视口的 meta 元素 `name` 值。只填写该值。' }
    answer: 'viewport'
    explanation: { en: 'The viewport meta declaration prevents mobile browsers from laying the page out against a wider virtual viewport.', zh: 'viewport meta 声明可以避免移动浏览器按更宽的虚拟视口进行页面布局。' }
    difficulty: advanced
    tags: [checkpoint]
