topic: frontend/responsive-design
items:
  - id: predict-media-query-boundary
    type: predict
    prompt: { en: 'What does this page log in a 640px-wide browser viewport with the default 16px root font size?', zh: '在宽度为 640px、根字号默认为 16px 的浏览器视口中，这个页面会输出什么？' }
    code: |
      <main class="layout"><article>Report</article><aside>Filters</aside></main>
      <style>
        .layout { display: grid; grid-template-columns: minmax(0, 1fr); }
        @media (width >= 48rem) {
          .layout { grid-template-columns: minmax(0, 1fr) 16rem; }
        }
      </style>
      <script>
        const value = getComputedStyle(document.querySelector('.layout')).gridTemplateColumns;
        console.log(value.split(' ').length);
      </script>
    lang: html
    options:
      - { text: { en: '1', zh: '1' }, correct: true }
      - { text: { en: '2', zh: '2' }, correct: false }
      - { text: { en: '16', zh: '16' }, correct: false }
      - { text: { en: '48', zh: '48' }, correct: false }
    explanation: { en: 'At a 16px root size, 48rem is 768px. The media query does not match a 640px viewport, so the base one-column template remains.', zh: '根字号为 16px 时，48rem 等于 768px。宽度为 640px 的视口不匹配该媒体查询，因此保留基础单列模板。' }
    difficulty: beginner
    tags: [media-query, rem, boundary]

  - id: choose-query-coordinate-system
    type: mcq
    prompt: { en: 'A product card must be horizontal in a wide main column and vertical in a narrow sidebar on the same page. Which mechanism expresses that constraint?', zh: '同一页中的商品卡片需要在宽主栏中横排、在窄侧栏中竖排。哪种机制能直接表达这个约束？' }
    options:
      - { text: { en: 'An inline-size container query on the card host', zh: '针对卡片宿主的 inline-size 容器查询' }, correct: true }
      - { text: { en: 'A viewport media query named tablet', zh: '名为 tablet 的视口媒体查询' }, correct: false }
      - { text: { en: 'JavaScript user-agent detection', zh: 'JavaScript 用户代理检测' }, correct: false }
      - { text: { en: 'A hover media query', zh: '悬停媒体查询' }, correct: false }
    explanation: { en: 'The card changes according to allocated component space, not global viewport width or device identity. Its host should establish the query container.', zh: '卡片根据组件获得的空间变化，而不是根据全局视口宽度或设备身份变化。应由卡片宿主建立查询容器。' }
    difficulty: beginner
    tags: [container-query, component, layout]

  - id: spot-missing-query-container
    title: { en: 'Spot the bug in the container-query card', zh: '找出容器查询卡片里的 bug' }
    type: spotbug
    prompt: { en: 'Why does this generated card never switch to two columns?', zh: '为什么这段生成代码中的卡片始终不会切换成两列？' }
    code: |
      .card-host {
        width: 40rem;
      }

      .card {
        display: grid;
        grid-template-columns: 1fr;
      }

      @container card (width >= 30rem) {
        .card { grid-template-columns: 10rem minmax(0, 1fr); }
      }
    lang: css
    issues:
      - line: 1
        kind: correctness
        note: { en: 'The host never establishes a named size query container. Add container: card / inline-size or equivalent container-name and container-type declarations.', zh: '宿主没有建立具名尺寸查询容器。应添加 container: card / inline-size，或等价的 container-name 与 container-type 声明。' }
    explanation: { en: 'An @container rule does not make an ancestor queryable by itself. The browser must find an eligible query container with the requested name.', zh: '@container 规则本身不会让祖先变得可查询。浏览器必须找到名称匹配且符合条件的查询容器。' }
    difficulty: intermediate
    tags: [container-query, query-container, generated-code]

  - id: source-order-under-reflow
    type: mcq
    prompt: { en: 'What is the safest default when a two-column interface becomes one column?', zh: '双栏界面变成单栏时，最安全的默认做法是什么？' }
    options:
      - { text: { en: 'Keep a meaningful DOM order and change only the layout geometry.', zh: '保留有意义的 DOM 顺序，只改变布局几何关系。' }, correct: true }
      - { text: { en: 'Use order values to match each screenshot, regardless of focus order.', zh: '用 order 值匹配每张截图，不考虑焦点顺序。' }, correct: false }
      - { text: { en: 'Duplicate the controls and hide one copy at each breakpoint.', zh: '复制控件，并在每个断点隐藏其中一份。' }, correct: false }
      - { text: { en: 'Enable grid-auto-flow: dense for all interactive content.', zh: '为所有交互内容启用 grid-auto-flow: dense。' }, correct: false }
    explanation: { en: 'Screen readers and sequential keyboard navigation usually follow the DOM even when CSS changes visual position. A coherent source order survives both geometries.', zh: '即使 CSS 改变了视觉位置，屏幕阅读器和顺序键盘导航通常仍按 DOM 移动。有意义的来源顺序能同时适用于两种布局。' }
    difficulty: intermediate
    tags: [source-order, accessibility, reflow]

  - id: review-generated-responsive-page
    title: { en: 'Review generated responsive landing page', zh: '审查生成的响应式落地页' }
    type: review
    prompt: { en: 'Review this generated responsive landing-page fragment before release.', zh: '发布前审查这段生成的响应式落地页代码。' }
    task: { en: 'Build a page that does not overflow horizontally, preserves DOM and focus order, keeps the primary action available, and lets the browser choose an appropriately sized hero image.', zh: '构建一个不横向溢出、保留 DOM 与焦点顺序、始终提供主操作，并让浏览器选择尺寸合适主图的页面。' }
    code: |
      <main class="page">
        <img
          src="hero-1600.jpg"
          srcset="hero-640.jpg 640w, hero-1600.jpg 1600w"
          alt="Team reviewing a release">
        <section class="content">
          <article><h1>Ship with confidence</h1></article>
          <div class="actions">
            <a class="primary" href="/start">Start now</a>
            <a href="/docs">Read docs</a>
          </div>
        </section>
      </main>
      <style>
        .page { width: 100vw; padding-inline: 24px; }
        .content {
          display: grid;
          grid-template-columns: minmax(0, 1fr) 18rem;
        }
        .actions { order: -1; }
        @media (max-width: 48rem) {
          .content { grid-template-columns: 1fr; }
          .primary { display: none; }
        }
      </style>
    lang: html
    right: { en: 'The snippet uses semantic main, section, article, and link elements; gives the informative image useful alternative text; and provides a defined narrow layout.', zh: '代码使用了语义化的 main、section、article 与链接元素，为信息图片提供了有效替代文本，并定义了窄屏布局。' }
    issues:
      - line: 4
        kind: performance
        note: { en: 'Width-descriptor srcset has no sizes attribute, so the browser assumes a 100vw slot even if final layout makes the image narrower. Declare the image slot sizes from the real layout.', zh: '使用宽度描述符的 srcset 没有 sizes 属性，因此即使最终布局中的图片更窄，浏览器仍假定槽位为 100vw。应根据真实布局声明图片槽位尺寸。' }
      - line: 15
        kind: edge-case
        note: { en: 'A content-box width of 100vw plus 48px of inline padding can create horizontal overflow. Use normal block width or include padding in the chosen box size.', zh: '内容盒 100vw 再加 48px 行内内边距可能造成横向溢出。应使用普通块宽度，或把内边距计入所选盒尺寸。' }
      - line: 20
        kind: correctness
        note: { en: 'Moving actions before the article visually does not move them in DOM or Tab order, violating the requirement that those orders agree.', zh: '在视觉上把操作区移到正文之前，并不会改变 DOM 或 Tab 顺序，因此不符合这些顺序保持一致的要求。' }
      - line: 21
        lines: 4
        kind: readability
        note: { en: 'The narrow variant compresses structural overrides and hides the removal of the primary task. Expand the rules and name the layout state by its content constraint.', zh: '窄屏变体压缩了结构覆盖规则，掩盖了主任务被删除的问题。应展开规则，并按内容约束命名布局状态。' }
    checklist:
      - { en: 'Compare documentElement scrollWidth and clientWidth around every boundary using the longest real content.', zh: '在每个边界附近使用最长真实内容，比较 documentElement 的 scrollWidth 与 clientWidth。' }
      - { en: 'List DOM, visual, and Tab order for every interactive element.', zh: '列出每个交互元素的 DOM、视觉与 Tab 顺序。' }
      - { en: 'Confirm that every primary task remains reachable without hover at every width.', zh: '确认每个宽度下都能在不使用悬停的情况下完成主任务。' }
      - { en: 'Inspect the selected image URL and rendered width on both sides of layout changes.', zh: '在布局变化两侧检查所选图片 URL 与渲染宽度。' }
    explanation: { en: 'Use the normal block width with bounded gutters, keep actions in their intended reading order, retain the primary link, and add a sizes value that mirrors the actual image slot. Then test the exact layout boundaries.', zh: '应使用带边界留白的普通块宽度，让操作区保持预期阅读顺序，保留主链接，并添加与真实图片槽位对应的 sizes 值；随后测试精确布局边界。' }
    difficulty: advanced
    tags: [code-review, overflow, source-order, responsive-images]
