topic: frontend/sass
items:
  - id: predict-parent-selector-interpolation
    type: predict
    prompt: { en: 'Which selector does this SCSS emit?', zh: '这段 SCSS 会输出哪个选择器？' }
    code: |
      $state: "open";

      .notice {
        &--#{$state} {
          display: block;
        }
      }
    lang: scss
    options:
      - { text: { en: '.notice --open', zh: '.notice --open' }, correct: false }
      - { text: { en: '.notice--open', zh: '.notice--open' }, correct: true }
      - { text: { en: '.notice .open', zh: '.notice .open' }, correct: false }
      - { text: { en: '.open.notice', zh: '.open.notice' }, correct: false }
    explanation: { en: 'The parent selector expands to .notice, and interpolation appends the string directly, producing .notice--open.', zh: '父选择器展开为 .notice，插值把字符串直接追加在后面，因此结果是 .notice--open。' }
    difficulty: beginner
    tags: [parent-selector, interpolation, output]
    minutes: 2

  - id: choose-runtime-theme-value
    type: mcq
    prompt: { en: 'A user can switch themes after the page loads. Where should the changing color value live?', zh: '用户可在页面加载后切换主题。变化的颜色值应放在哪里？' }
    options:
      - { text: { en: 'A CSS custom property selected by a DOM state', zh: '由 DOM 状态选择的 CSS 自定义属性' }, correct: true }
      - { text: { en: 'A Sass variable reassigned by browser JavaScript', zh: '由浏览器 JavaScript 重新赋值的 Sass 变量' }, correct: false }
      - { text: { en: 'A !default variable configured after @use', zh: '在 @use 之后配置的 !default 变量' }, correct: false }
      - { text: { en: 'A private Sass module variable', zh: 'Sass 模块中的私有变量' }, correct: false }
    explanation: { en: 'Sass variables disappear into compiled CSS. A custom property remains in the browser cascade and can change with selectors or JavaScript.', zh: 'Sass 变量会在编译后消失。CSS 自定义属性保留在浏览器层叠中，可以随选择器或 JavaScript 改变。' }
    difficulty: beginner
    tags: [custom-properties, runtime, themes]
    minutes: 3

  - id: spot-use-after-style-rule
    type: spotbug
    prompt: { en: 'Why does this entry fail before it emits CSS?', zh: '为什么这个入口在输出 CSS 之前就会失败？' }
    code: |
      .card {
        color: #1f2937;
      }

      @use "sass:color";

      .card--muted {
        color: color.adjust(#1f2937, $lightness: 20%);
      }
    lang: scss
    issues:
      - line: 5
        kind: correctness
        note: { en: '@use must appear before style rules; move the module load to the start of the entry.', zh: '@use 必须出现在样式规则之前；应把模块加载移到入口开头。' }
    explanation: { en: 'Sass requires @use before rules other than @forward, although variables may be declared first for configuration. The compiler rejects this ordering.', zh: 'Sass 要求 @use 位于除 @forward 之外的规则之前，但用于配置的变量可以先声明。编译器会拒绝这里的顺序。' }
    difficulty: intermediate
    tags: [modules, use, ordering]
    minutes: 4

  - id: choose-module-configuration-time
    type: mcq
    prompt: { en: 'When can @use ... with configure a module?', zh: '@use ... with 可以在什么时候配置模块？' }
    options:
      - { text: { en: 'When that module URL is first loaded in the compilation', zh: '该模块 URL 在本次编译中首次加载时' }, correct: true }
      - { text: { en: 'Every time a new namespace is chosen', zh: '每次选择新命名空间时' }, correct: false }
      - { text: { en: 'After any dependent module has loaded it', zh: '任意依赖模块加载它之后' }, correct: false }
      - { text: { en: 'At runtime after the CSS reaches the browser', zh: 'CSS 到达浏览器后的运行时' }, correct: false }
    explanation: { en: 'A module loads once per compilation. Configuration applies to !default variables on the first load, so entry-point dependency order matters.', zh: '同一模块在一次编译中只加载一次。配置在首次加载时应用于 !default 变量，因此入口的依赖顺序会影响结果。' }
    difficulty: intermediate
    tags: [modules, configuration, default]
    minutes: 3

  - id: review-generated-alert-variants
    type: review
    prompt: { en: 'Review this generated alert API before adding it to a component library.', zh: '把这段生成的提醒组件 API 加入组件库之前，请审查它。' }
    task: { en: 'Generate one public class per alert token, reject unknown names clearly, keep shared declarations in one place, and use a verified readable foreground without animating color changes.', zh: '为每个提醒令牌生成一个公开类，清楚拒绝未知名称，把共同声明放在一处，并使用经过验证的可读前景色且不为颜色变化添加动画。' }
    code: |
      @use "sass:map";
      @use "sass:color";

      $alert-colors: (
        info: #2563eb,
        danger: #b91c1c,
      );

      @mixin alert($name) {
        $color: map.get($alert-colors, $name);
        color: color.adjust($color, $lightness: 40%);
        background: $color;
        padding: 0.75rem;
        transition: all 0.2s;
      }

      .page {
        .notifications {
          @each $name, $color in $alert-colors {
            .alert-#{$name} {
              @include alert($name);
            }
          }
        }
      }
    lang: scss
    right: { en: 'The code uses namespaced built-in modules, keeps the finite token set in a map, and generates predictable variant names from that set.', zh: '代码使用带命名空间的内置模块，把有限令牌集合保存在映射中，并根据该集合生成可预测的变体名称。' }
    checklist:
      - { en: 'Compile a minimal consumer with the project-locked Dart Sass version and capture warnings.', zh: '使用项目锁定的 Dart Sass 版本编译最小使用方，并记录警告。' }
      - { en: 'Call each public mixin with valid, unknown, and wrong-type inputs.', zh: '用有效值、未知值和错误类型调用每个公共混入。' }
      - { en: 'Inspect emitted selectors and group declarations that do not vary.', zh: '检查输出选择器，并合并不会随变体变化的声明。' }
      - { en: 'Measure final foreground and background contrast in every supported state.', zh: '测量每个支持状态下最终前景色与背景色的对比度。' }
    issues:
      - line: 10
        kind: edge-case
        note: { en: 'An unknown name returns null and fails later inside color.adjust() with an indirect error; validate map.has-key() and raise a named @error.', zh: '未知名称会返回 null，随后在 color.adjust() 中以间接错误失败；应先用 map.has-key() 校验，再抛出具名 @error。' }
      - line: 11
        kind: correctness
        note: { en: 'Lightening each background color by 40% does not establish readable contrast; use reviewed foreground tokens and test final pairs.', zh: '把每个背景色变亮 40% 不能证明对比度可读；应使用审查过的前景令牌并测试最终颜色组合。' }
      - line: 13
        lines: 14
        kind: performance
        note: { en: 'Every variant repeats the unchanged padding and transition declarations; emit shared declarations once and keep variants to changing values.', zh: '每个变体都会重复不变的内边距与过渡声明；应只输出一次共同声明，让变体只保留变化值。' }
      - line: 17
        lines: 24
        kind: readability
        note: { en: 'The public classes are coupled to .page .notifications and gain needless specificity; generate the component classes at the intended public boundary.', zh: '公开类被耦合到 .page .notifications，并获得不必要的特异性；应在预期的公开边界生成组件类。' }
    explanation: { en: 'Validate names at the mixin boundary, put shared box declarations on a base alert class, emit shallow variant selectors, and select foreground tokens from tested pairs. Remove transition: all unless a specific non-color property has a defined motion requirement.', zh: '应在混入边界校验名称，把共同盒模型声明放在提醒基础类上，输出浅层变体选择器，并从测试过的颜色组合中选择前景令牌。除非某个非颜色属性有明确动态效果需求，否则应删除 transition: all。' }
    difficulty: advanced
    tags: [code-review, mixins, selectors, contrast]
    minutes: 12
