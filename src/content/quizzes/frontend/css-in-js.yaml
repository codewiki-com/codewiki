topic: frontend/css-in-js
items:
  - id: predict-variant-classes
    type: predict
    prompt: { en: 'What does this finite-variant selector print?', zh: '这个有限变体选择器会输出什么？' }
    code: |
      const tones = { primary: 'button_primary', quiet: 'button_quiet' };

      function buttonClass(tone = 'primary') {
        if (!tones[tone]) throw new RangeError('unknown tone');
        return `button ${tones[tone]}`;
      }

      console.log(buttonClass('quiet'));
    lang: javascript
    options:
      - { text: { en: 'button button_quiet', zh: 'button button_quiet' }, correct: true }
      - { text: { en: 'button quiet', zh: 'button quiet' }, correct: false }
      - { text: { en: 'button button_primary', zh: 'button button_primary' }, correct: false }
      - { text: { en: 'RangeError: unknown tone', zh: 'RangeError: unknown tone' }, correct: false }
    explanation: { en: 'The explicit quiet key maps to button_quiet, and the function composes it with the base class. The default is used only when no argument is supplied.', zh: '明确传入的 quiet 键映射到 button_quiet，函数再把它与基础类组合。只有未传参数时才会使用默认值。' }
    difficulty: beginner
    tags: [variants, class-names, predict-output]

  - id: runtime-versus-extraction
    type: mcq
    prompt: { en: 'Which statement accurately distinguishes runtime CSS-in-JS from build-time extraction?', zh: '下列哪项准确区分了运行时 CSS-in-JS 与构建时提取？' }
    options:
      - { text: { en: 'Runtime systems may create or select rules while the app executes; extraction emits supported declarations during the build.', zh: '运行时系统可以在应用执行时创建或选择规则；提取系统则在构建时生成工具支持的声明。' }, correct: true }
      - { text: { en: 'Runtime systems bypass the CSS cascade, while extracted styles use it.', zh: '运行时系统会绕过 CSS 层叠，提取样式才使用层叠。' }, correct: false }
      - { text: { en: 'Extracted styles can evaluate arbitrary browser measurements during compilation.', zh: '提取样式可以在编译期间计算任意浏览器测量值。' }, correct: false }
      - { text: { en: 'Build-time extraction means the application ships no JavaScript.', zh: '构建时提取表示应用不会交付任何 JavaScript。' }, correct: false }
    explanation: { en: 'The execution boundary determines when supported rules are produced. Both approaches still emit CSS that participates in the browser cascade.', zh: '执行边界决定工具支持的规则在何时生成。两种方式最终都会输出参与浏览器层叠的 CSS。' }
    difficulty: beginner
    tags: [runtime, static-extraction, cascade]

  - id: spot-render-local-component
    type: spotbug
    prompt: { en: 'Find the lifecycle bug in this generated styled-components wrapper.', zh: '找出这段生成的 styled-components 包装组件中的生命周期错误。' }
    code: |
      import styled from 'styled-components';

      export function SearchBox({ query, onChange }) {
        const Field = styled.input`
          border: 1px solid #94a3b8;
          padding: 0.5rem;
        `;

        return <Field value={query} onChange={onChange} />;
      }
    lang: jsx
    issues:
      - line: 4
        kind: correctness
        note: { en: 'Field gets a new component identity on every SearchBox render, so React can remount the input and disturb focus or selection. Declare Field at module scope.', zh: '每次渲染 SearchBox 都会创建新的 Field 组件标识，React 可能重新挂载输入框并破坏焦点或选择范围。应在模块作用域声明 Field。' }
    explanation: { en: 'Dynamic values do not require a new styled-component declaration. Keep the component identity stable and pass changing state through props or a finite variant.', zh: '动态值不要求重新声明样式组件。组件标识应保持稳定，变化状态通过属性或有限变体传入。' }
    difficulty: intermediate
    tags: [react, component-identity, styled-components]

  - id: custom-property-for-live-values
    type: mcq
    prompt: { en: 'A drag handle receives a new x coordinate on every pointer event. Which styling shape best avoids generating a class for every coordinate?', zh: '拖动手柄会在每次指针事件中得到新的 x 坐标。哪种样式结构最能避免为每个坐标生成类名？' }
    options:
      - { text: { en: 'Keep one class with transform: translateX(var(--x)), then set a validated --x value per element.', zh: '保留一条使用 transform: translateX(var(--x)) 的类规则，再为每个元素设置经过验证的 --x 值。' }, correct: true }
      - { text: { en: 'Create a new styled component inside the pointer handler.', zh: '在指针事件处理器中创建新的样式组件。' }, correct: false }
      - { text: { en: 'Append !important to every generated coordinate rule.', zh: '给每条生成的坐标规则追加 !important。' }, correct: false }
      - { text: { en: 'Hash the raw pointer event object into the class name.', zh: '把原始指针事件对象哈希成类名。' }, correct: false }
    explanation: { en: 'The class describes reusable structure, while the custom property carries high-cardinality instance data. Validate the number and attach the required unit before setting it.', zh: '类规则描述可复用结构，自定义属性承载高基数实例数据。设置前仍要验证数值并补上所需单位。' }
    difficulty: intermediate
    tags: [css-custom-properties, dynamic-values, performance]

  - id: review-generated-status-card
    type: review
    prompt: { en: 'Review this generated status card before it handles production data.', zh: '在这段生成的状态卡片处理生产数据前完成代码审查。' }
    task: { en: 'Render an untrusted message as plain text, use a clamped numeric hue, support a compact variant, preserve component state, and add no animation.', zh: '把不可信消息渲染成纯文本，使用限制范围后的数字色相值，支持紧凑变体，保留组件状态，而且不添加动画。' }
    code: |
      import styled from 'styled-components';

      type Props = { hue: number; compact: boolean; message: string };

      export function StatusCard({ hue, compact, message }: Props) {
        const Card = styled.article<{ hue: number; compact: boolean }>`
          color: hsl(${({ hue }) => hue} 70% 35%);
          padding: ${({ compact }) => (compact ? '0.25rem' : '0.75rem')};
        `;

        return (
          <Card
            hue={hue}
            compact={compact}
            dangerouslySetInnerHTML={{ __html: message }}
          />
        );
      }
    lang: tsx
    right: { en: 'The code uses a semantic article element, keeps the compact decision explicit, declares a narrow prop type, and adds no animation.', zh: '代码使用了语义化的 article 元素，明确表达紧凑模式，声明了范围清楚的属性类型，而且没有添加动画。' }
    checklist:
      - { en: 'Locate every style-factory call and verify that its component identity is stable across renders.', zh: '找出每个样式工厂调用，确认组件标识在多次渲染间保持稳定。' }
      - { en: 'Classify interpolations as finite variants or high-cardinality values, then inspect emitted rules.', zh: '把插值归类为有限变体或高基数值，再检查生成规则。' }
      - { en: 'Inspect rendered DOM attributes and render untrusted strings containing markup.', zh: '检查渲染后的 DOM 属性，并用包含标记的不可信字符串测试。' }
      - { en: 'Test non-finite and out-of-range inputs, focus preservation, and production hydration.', zh: '测试非有限值与越界输入、焦点保留和生产环境水合。' }
    issues:
      - line: 6
        kind: correctness
        note: { en: 'Card is recreated on every StatusCard render, so React can remount its subtree. Move the styled declaration to module scope.', zh: '每次渲染 StatusCard 都会重新创建 Card，React 可能重新挂载其子树。应把样式声明移到模块作用域。' }
      - line: 7
        kind: performance
        note: { en: 'Interpolating every hue can generate a class for each distinct value. Keep one rule that reads a CSS custom property.', zh: '对每个 hue 插值可能为每个不同值生成类名。应保留一条读取 CSS 自定义属性的规则。' }
      - line: 7
        kind: edge-case
        note: { en: 'The TypeScript number accepts NaN, Infinity, and out-of-range values at runtime. Check finiteness and clamp hue before attaching its unit or custom property.', zh: 'TypeScript 的 number 在运行时仍可能是 NaN、Infinity 或越界值。应先检查有限性并限制 hue，再为它补单位或设置自定义属性。' }
      - line: 13
        lines: 2
        kind: readability
        note: { en: 'Styling-only props are passed to the native article. Use the library version’s documented filtering mechanism or a finite data attribute with real DOM meaning.', zh: '样式专用属性被传给原生 article。应采用当前库版本记录的过滤机制，或使用确有 DOM 含义的有限数据属性。' }
      - line: 15
        kind: security
        note: { en: 'The task requires plain text, but dangerouslySetInnerHTML parses the untrusted message as markup. Render {message} as a child instead.', zh: '任务要求纯文本，但 dangerouslySetInnerHTML 会把不可信消息解析成标记。应改为把 {message} 作为子内容渲染。' }
    explanation: { en: 'Move Card to module scope, use a finite compact selector and a validated --hue custom property, filter styling props, remove the transition, and render message as text. Review generated styling code as component, CSS, and DOM behavior together.', zh: '应把 Card 移到模块作用域，使用有限的紧凑模式选择器和经过验证的 --hue 自定义属性，过滤样式属性，删除过渡，并把 message 渲染成文本。审查生成的样式代码时，要同时检查组件、CSS 和 DOM 行为。' }
    difficulty: advanced
    tags: [code-review, security, component-identity, dynamic-values]
