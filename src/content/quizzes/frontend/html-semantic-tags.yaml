topic: frontend/html-semantic-tags
items:
  - id: predict-native-defaults
    type: predict
    prompt: { en: 'What does this page log in a browser?', zh: '这个页面会在浏览器中输出什么？' }
    code: |
      <button id="save">Save</button>
      <div id="status">Idle</div>
      <script>
        const button = document.querySelector('#save');
        const status = document.querySelector('#status');
        console.log(`${button.tabIndex},${status.tabIndex},${button.type}`);
      </script>
    lang: html
    options:
      - { text: { en: '0,-1,submit', zh: '0,-1,submit' }, correct: true }
      - { text: { en: '-1,-1,button', zh: '-1,-1,button' }, correct: false }
      - { text: { en: '0,0,submit', zh: '0,0,submit' }, correct: false }
      - { text: { en: '0,-1,button', zh: '0,-1,button' }, correct: false }
    explanation: { en: 'A button enters sequential focus order and defaults to type=submit, even outside a form. An ordinary div does not enter focus order.', zh: '按钮默认进入顺序焦点，并且 `type` 默认为 `submit`，即使它不在表单中也是如此。普通 `div` 不会进入焦点顺序。' }
    difficulty: beginner
    tags: [button, focus, native-semantics]

  - id: choose-article-or-section
    type: mcq
    prompt: { en: 'A page lists complete release notes that are also syndicated individually. Which element should wrap each release?', zh: '页面列出完整发布说明，并会单独分发每一条记录。每条记录应使用哪个元素？' }
    options:
      - { text: { en: '<article>', zh: '<article>' }, correct: true }
      - { text: { en: '<section>', zh: '<section>' }, correct: false }
      - { text: { en: '<nav>', zh: '<nav>' }, correct: false }
      - { text: { en: '<main>', zh: '<main>' }, correct: false }
    explanation: { en: 'Each release is complete and independently distributable, which is the article contract. A section depends on its surrounding document theme.', zh: '每条发布说明都完整且可独立分发，符合 `article` 的契约。`section` 则依赖周围文档的主题。' }
    difficulty: beginner
    tags: [article, section, content-model]

  - id: contextual-header-role
    type: mcq
    prompt: { en: 'What is the best description of a header nested directly inside an article?', zh: '怎样描述直接嵌套在 `article` 内的 `header` 最准确？' }
    options:
      - { text: { en: "It introduces that article and is not normally the page's banner landmark.", zh: '它介绍该文章，通常不是页面的 `banner` 地标。' }, correct: true }
      - { text: { en: 'It is invalid because a page may contain only one header.', zh: '这种结构无效，因为页面只能包含一个 `header`。' }, correct: false }
      - { text: { en: 'It automatically resets the next heading to h1.', zh: '它会自动把下一个标题重置为 `h1`。' }, correct: false }
      - { text: { en: 'It must declare role=banner to preserve semantics.', zh: '它必须声明 `role=banner` 才能保留语义。' }, correct: false }
    explanation: { en: 'Header and footer are scoped by their surrounding content. Adding banner to an article header would create a false page-level landmark.', zh: '`header` 与 `footer` 的范围由周围内容决定。给文章页眉添加 `banner` 会制造错误的页面级地标。' }
    difficulty: intermediate
    tags: [header, landmark, implicit-role]

  - id: spot-generated-navigation
    title: { en: 'Spot the bug in the toolbar', zh: '找出工具栏里的 bug' }
    type: spotbug
    prompt: { en: 'Find the semantic and keyboard defects in this generated toolbar.', zh: '找出这段生成工具栏中的语义与键盘缺陷。' }
    code: |
      <nav>
        <div class="back" onclick="history.back()">Back</div>
        <div class="title">Account</div>
        <div class="save" role="button" onclick="save()">Save</div>
      </nav>
      <nav>
        <a href="/help">Help</a>
      </nav>
    lang: html
    issues:
      - line: 2
        kind: correctness
        note: { en: 'The Back action is a clickable div with no button semantics or keyboard path. Use a button and preserve focus styling.', zh: '`Back` 操作是可点击的 `div`，没有按钮语义或键盘路径。应使用按钮并保留焦点样式。' }
      - line: 3
        kind: readability
        note: { en: 'A styled div does not create a heading. Use the heading level that matches the composed page hierarchy.', zh: '带样式的 `div` 不会成为标题。应使用与组合页面层级匹配的标题元素。' }
      - line: 4
        kind: edge-case
        note: { en: 'role=button supplies no focusability, Space activation, disabled behavior, or form behavior. Prefer a native button.', zh: '`role=button` 不会提供焦点、Space 激活、禁用状态或表单行为。应优先使用原生按钮。' }
      - line: 1
        lines: 7
        kind: correctness
        note: { en: 'Two navigation landmarks need distinct accessible names so landmark navigation can distinguish them.', zh: '两个导航地标需要不同的可访问名称，地标导航才能区分它们。' }
    explanation: { en: 'Use native buttons for actions, a real heading for the toolbar title, and distinct names such as Primary and Help for the two navigation regions.', zh: '操作应使用原生按钮，工具栏标题应使用真正的标题元素，两个导航区域还应使用“主要导航”和“帮助”等不同名称。' }
    difficulty: intermediate
    tags: [navigation, keyboard, headings, aria]

  - id: review-generated-article-index
    title: { en: 'Review generated article index', zh: '审查生成的文章索引' }
    type: review
    prompt: { en: 'Review this generated article index before it renders server data.', zh: '在这段生成的文章索引渲染服务器数据前审查它。' }
    task: { en: 'Render a safe, keyboard-operable list of article links with a page heading and meaningful image alternatives.', zh: '安全地渲染可用键盘操作的文章链接列表，并提供页面标题与有意义的图片替代文本。' }
    code: |
      <div class="main">
        <div class="page-title">Latest articles</div>
        <div id="articles"></div>
      </div>
      <script>
        const posts = window.__POSTS__;
        const root = document.querySelector('#articles');
        root.innerHTML = posts.map((post) => `
          <div class="card" onclick="location.href='/posts/${post.slug}'">
            <img src="${post.image}">
            <div class="card-title">${post.title}</div>
            <div class="summary">${post.summary}</div>
          </div>
        `).join('');
        for (const card of root.children) {
          card.addEventListener('keydown', (event) => {
            if (event.key === 'Enter') card.click();
          });
        }
      </script>
    lang: html
    right: { en: 'The snippet preserves the input order, gives the list one stable mount point, and keeps navigation destinations derived from each article record.', zh: '代码保留了输入顺序，为列表提供一个稳定挂载点，并从每条文章记录派生导航目标。' }
    checklist:
      - { en: 'Trace every server value to its DOM sink and choose text or attribute APIs that do not parse it as markup.', zh: '追踪每个服务器值到 DOM 接收点，并选择不会把它解析为标记的文本或属性 API。' }
      - { en: 'List headings and landmarks on the composed page, not only inside the component.', zh: '列出组合后整页的标题与地标，不要只检查组件内部。' }
      - { en: 'Navigate every article using Tab, Enter, link context actions, and browser history.', zh: '使用 Tab、Enter、链接上下文操作与浏览器历史访问每篇文章。' }
      - { en: 'Define image alternatives for informative, decorative, missing, and failed images.', zh: '分别定义信息图片、装饰图片、缺失图片与加载失败图片的替代文本。' }
    issues:
      - line: 8
        lines: 6
        kind: security
        note: { en: 'Untrusted title, summary, image, or slug values enter innerHTML without escaping, allowing markup or attribute injection. Build nodes with safe text and URL handling.', zh: '不可信的标题、摘要、图片或 slug 未经转义就进入 `innerHTML`，可造成标记或属性注入。应使用安全文本与 URL API 构建节点。' }
      - line: 9
        kind: correctness
        note: { en: 'A clickable card div is not a link: it has no href, focus entry, link actions, or native keyboard activation. Put an anchor around the linked content.', zh: '可点击卡片 `div` 不是链接，没有 `href`、焦点入口、链接操作或原生键盘激活。应使用锚点包裹链接内容。' }
      - line: 10
        kind: edge-case
        note: { en: 'The image has no alt attribute, so its purpose is undefined for assistive technology and failures have no useful text alternative.', zh: '图片没有 `alt` 属性，辅助技术无法判断其用途，加载失败时也没有有用的文字替代。' }
      - line: 2
        lines: 10
        kind: readability
        note: { en: 'Generic divs hide the page heading, main region, article units, and summaries. Use a heading, main, article or list structure, links, and paragraphs to expose the content model.', zh: '通用 `div` 隐藏了页面标题、主体区域、文章单元与摘要。应使用标题、`main`、`article` 或列表结构、链接和段落表达内容模型。' }
    explanation: { en: 'Create nodes without parsing server text as HTML, expose the page and article structure with native elements, and use anchors with real href values. Image alternatives depend on whether each image adds information.', zh: '构建节点时不要把服务器文本解析为 HTML；使用原生元素表达页面与文章结构，并使用带真实 `href` 的锚点。图片替代文本取决于图片是否提供信息。' }
    difficulty: advanced
    tags: [code-review, semantic-html, keyboard, injection]
