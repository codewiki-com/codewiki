topic: frontend/css-grid
items:
  - id: predict-responsive-track-count
    type: predict
    prompt: { en: 'What does this page log in a browser?', zh: '这个页面会在浏览器中输出什么？' }
    code: |
      <section class="cards"><div>A</div><div>B</div><div>C</div><div>D</div></section>
      <style>
        .cards {
          display: grid;
          width: 340px;
          gap: 12px;
          grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        }
      </style>
      <script>
        const cards = document.querySelector('.cards');
        console.log(getComputedStyle(cards).gridTemplateColumns);
      </script>
    lang: html
    options:
      - { text: { en: '164px 164px', zh: '164px 164px' }, correct: true }
      - { text: { en: '160px 160px', zh: '160px 160px' }, correct: false }
      - { text: { en: '82px 82px 82px 82px', zh: '82px 82px 82px 82px' }, correct: false }
      - { text: { en: '340px', zh: '340px' }, correct: false }
    explanation: { en: 'Two 160px minimum tracks plus one 12px gap fit. The remaining 8px is shared, so each flexible track resolves to 164px.', zh: '两条最小为 160px 的轨道加一个 12px 间隔可以放下；剩余 8px 被平分，因此每条弹性轨道最终为 164px。' }
    difficulty: beginner
    tags: [auto-fit, minmax, predict-output]

  - id: fraction-uses-leftover-space
    type: mcq
    prompt: { en: 'A 700px grid has columns 200px 1fr 2fr and a 20px gap between each pair. How is flexible space divided?', zh: '一个 700px 网格使用 200px 1fr 2fr，并在相邻列间设置 20px 间隔。弹性空间怎样分配？' }
    options:
      - { text: { en: 'The two flexible tracks divide the remaining 460px in a 1:2 ratio.', zh: '两条弹性轨道按 1:2 分配剩余的 460px。' }, correct: true }
      - { text: { en: 'They receive one third and two thirds of the full 700px.', zh: '它们分别取得完整 700px 的三分之一与三分之二。' }, correct: false }
      - { text: { en: 'Each fr always equals 100px.', zh: '每个 fr 始终等于 100px。' }, correct: false }
      - { text: { en: 'The gaps are subtracted from the 200px track only.', zh: '间隔只从 200px 轨道中扣除。' }, correct: false }
    explanation: { en: 'The fixed track and two gaps consume 240px. Grid distributes the 460px flexible remainder as one share and two shares.', zh: '固定轨道和两个间隔占用 240px。Grid 把剩余 460px 弹性空间按一份与两份分配。' }
    difficulty: intermediate
    tags: [fr, track-sizing, gap]

  - id: spot-implicit-mobile-column
    title: { en: 'Spot the bug in the mobile grid', zh: '找出移动端网格里的 bug' }
    type: spotbug
    prompt: { en: 'Find the rule that defeats this generated one-column mobile layout.', zh: '找出破坏这段生成代码单列移动端布局的规则。' }
    code: |
      .dashboard {
        display: grid;
        grid-template-columns: 14rem minmax(0, 1fr);
        gap: 1rem;
      }
      .report { grid-column: 2; }

      @media (max-width: 40rem) {
        .dashboard {
          grid-template-columns: 1fr;
        }
      }
    lang: css
    issues:
      - line: 6
        kind: correctness
        note: { en: 'The report remains assigned to line 2 on mobile, so Grid creates an implicit second column. Reset it to grid-column: auto inside the media query.', zh: '移动端的 report 仍被放到第 2 列，因此 Grid 会创建隐式的第二列。应在媒体查询中把它重置为 grid-column: auto。' }
    explanation: { en: 'Changing the explicit template does not reset item placement. Review container tracks and child placement rules as one responsive system.', zh: '改变显式模板不会重置项目放置。审查响应式布局时，要把容器轨道与子项目放置规则视为同一个系统。' }
    difficulty: intermediate
    tags: [implicit-grid, responsive-design, grid-placement]

  - id: dense-and-source-order
    type: mcq
    prompt: { en: 'What is the main review concern when grid-auto-flow: dense backfills a hole with a later interactive item?', zh: 'grid-auto-flow: dense 用后面的交互项目回填前面的空洞时，审查重点是什么？' }
    options:
      - { text: { en: 'Visual order can diverge from DOM, reading, and sequential focus order.', zh: '视觉顺序可能偏离 DOM、阅读顺序和顺序焦点。' }, correct: true }
      - { text: { en: 'The browser permanently rewrites the DOM to match the grid.', zh: '浏览器会永久改写 DOM，使其与网格一致。' }, correct: false }
      - { text: { en: 'Dense packing disables keyboard focus for every grid item.', zh: '密集放置会禁用所有网格项目的键盘焦点。' }, correct: false }
      - { text: { en: 'Dense packing always reduces the number of explicit tracks.', zh: '密集放置一定会减少显式轨道数量。' }, correct: false }
    explanation: { en: 'Dense packing changes placement, not source order. Use it only when item order is irrelevant, and test keyboard and assistive-technology navigation.', zh: '密集放置只改变项目位置，不改变源顺序。它只适用于顺序无关的项目，而且需要测试键盘与辅助技术导航。' }
    difficulty: intermediate
    tags: [dense, accessibility, source-order]

  - id: review-generated-catalog
    title: { en: 'Review generated catalog grid', zh: '审查生成的商品目录网格' }
    type: review
    prompt: { en: 'Review this generated catalog grid before release.', zh: '在发布前审查这段生成的商品目录网格。' }
    task: { en: 'Lay out cards without horizontal overflow, preserve source and focus order at every width, and let titles shrink or wrap without unrelated animation.', zh: '排列卡片时不得产生水平溢出，在所有宽度下保留源顺序与焦点顺序，并让标题收缩或换行，不添加无关动画。' }
    code: |
      <section class="catalog">
        <article class="catalog-card">Starter</article>
        <article class="catalog-card">Professional</article>
        <article class="catalog-card">Enterprise</article>
      </section>
      <style>
        .catalog {
          display: grid;
          grid-template-columns: repeat(3, 33.333%);
          gap: 24px;
          grid-auto-flow: row dense;
        }
        .catalog-card {
          min-width: 280px;
          transition: all 300ms;
        }
        .catalog-card:first-child {
          grid-column: 3;
        }
        @media (max-width: 40rem) {
          .catalog { grid-template-columns: 1fr; }
          .catalog-card:first-child { grid-column: 2; }
        }
      </style>
    lang: html
    right: { en: 'The snippet uses semantic section and article elements, keeps layout declarations together, and provides an explicit narrow-container variant.', zh: '代码使用语义化的 section 与 article 元素，把布局声明集中在一起，并提供了明确的窄容器变体。' }
    checklist:
      - { en: 'Compare clientWidth and scrollWidth at each supported container width with the longest real title.', zh: '在每个支持的容器宽度下，用最长真实标题比较 clientWidth 与 scrollWidth。' }
      - { en: 'List explicit and implicit tracks after applying every responsive override.', zh: '应用每项响应式覆盖后，列出显式轨道与隐式轨道。' }
      - { en: 'Compare DOM, visual-coordinate, and Tab order for all interactive card content.', zh: '比较所有卡片交互内容的 DOM、视觉坐标与 Tab 顺序。' }
      - { en: 'Remove motion outside the task, or justify it with measured rendering and reduced-motion behavior.', zh: '删除任务之外的动态效果，或用渲染测量和减少动态效果行为证明其合理性。' }
    issues:
      - line: 9
        kind: edge-case
        note: { en: 'Three percentage tracks already consume almost 100% of the container, so two 24px gaps add horizontal overflow. Use three fr tracks.', zh: '三条百分比轨道已经占据接近 100% 的容器宽度，两个 24px 间隔会额外造成水平溢出。应改用三条 fr 轨道。' }
      - line: 15
        kind: performance
        note: { en: 'transition: all can start layout-affecting transitions when later rules change. The task asks for no animation, so remove it.', zh: '后续规则变化时，transition: all 可能启动影响布局的过渡。任务不需要动画，应删除它。' }
      - line: 17
        lines: 6
        kind: correctness
        note: { en: 'Placing the first card in column 3 changes visual order, and leaving it in column 2 under a one-column template creates an implicit column.', zh: '把第一张卡放在第 3 列会改变视觉顺序；单列模板下仍把它放在第 2 列，还会创建隐式列。' }
      - line: 20
        lines: 3
        kind: readability
        note: { en: 'The compressed media-query overrides hide the stale item placement. Put the one-column template and its placement resets in a readable variant.', zh: '压缩成单行的媒体查询覆盖隐藏了遗留项目定位。应在可读的单列变体中同时写出模板和定位重置。' }
    explanation: { en: 'Use repeat(3, minmax(0, 1fr)) at wide sizes, reset placement rather than visually reordering cards, and choose a wrapping policy for titles. No transition is needed.', zh: '宽容器应使用 repeat(3, minmax(0, 1fr))，重置定位而不是视觉重排卡片，并为标题选择换行策略。这里不需要过渡。' }
    difficulty: advanced
    tags: [code-review, overflow, implicit-grid, source-order, performance]
