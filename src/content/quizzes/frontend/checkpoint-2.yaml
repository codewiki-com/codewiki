topic: frontend/checkpoint-2
items:
  - id: checkpoint-2-core
    type: mcq
    prompt: { en: 'Which control is the sound starting point for an accessible “Save” action?', zh: '实现无障碍的“保存”操作时，哪种控件是合理起点？' }
    options:
      - { text: { en: '<button type="button">Save</button>', zh: '<button type="button">Save</button>' }, correct: true }
      - { text: { en: '<div tabindex="0">Save</div>', zh: '<div tabindex="0">Save</div>' }, correct: false }
      - { text: { en: '<span aria-label="Save">Save</span>', zh: '<span aria-label="Save">Save</span>' }, correct: false }
    explanation: { en: 'The native button already provides the role, focus behavior, and keyboard activation. `tabindex` or an accessible name alone does not create button behavior.', zh: '原生按钮已经提供角色、焦点行为和键盘激活能力。单独添加 `tabindex` 或无障碍名称并不能创建按钮行为。' }
    difficulty: beginner
    tags: [checkpoint]
  - id: checkpoint-2-term
    type: fill
    prompt: { en: 'Name the attribute that associates a form control with a separate element containing its error explanation.', zh: '写出把表单控件与另一个错误说明元素关联起来的属性名。' }
    answer: 'aria-describedby'
    explanation: { en: '`aria-describedby` references supplemental descriptive text while the label continues to provide the control’s accessible name.', zh: '`aria-describedby` 引用补充说明文本，而控件的无障碍名称仍由标签提供。' }
    difficulty: beginner
    tags: [checkpoint]
  - id: checkpoint-2-output
    type: mcq
    prompt: { en: 'Why must a server validate a form even when native HTML and JavaScript validation already run in the browser?', zh: '即使浏览器已经执行原生 HTML 与 JavaScript 验证，服务器为什么仍必须验证表单？' }
    options:
      - { text: { en: 'Clients can bypass or alter browser checks before sending a request.', zh: '客户端可以绕过或修改浏览器检查后再发送请求。' }, correct: true }
      - { text: { en: 'Server validation automatically gives every input an accessible label.', zh: '服务器验证会自动为每个输入框提供无障碍标签。' }, correct: false }
      - { text: { en: 'The browser never enforces `required`, `min`, or `pattern`.', zh: '浏览器从不会执行 `required`、`min` 或 `pattern`。' }, correct: false }
    explanation: { en: 'Client validation improves feedback but is not a trust boundary. The server must enforce the same business and security constraints on every request.', zh: '客户端验证可以改善反馈，但不是信任边界。服务器必须对每个请求执行相同的业务与安全约束。' }
    difficulty: beginner
    tags: [checkpoint]
  - id: checkpoint-2-boundary
    type: fill
    prompt: { en: 'Name the media feature used to reduce or remove nonessential motion for users who request it.', zh: '写出用于为偏好减少动态效果的用户削弱或移除非必要动效的媒体特性。' }
    answer: 'prefers-reduced-motion'
    explanation: { en: '`prefers-reduced-motion` exposes the user preference, allowing an alternative with less movement rather than simply shortening every animation.', zh: '`prefers-reduced-motion` 会公开用户偏好，使界面可以提供动态更少的替代效果，而不是简单缩短所有动画。' }
    difficulty: intermediate
    tags: [checkpoint]
  - id: checkpoint-2-rule
    type: mcq
    prompt: { en: 'Which properties are usually the safest starting point for smooth CSS motion because they avoid changing document layout?', zh: '哪些属性通常是实现流畅 CSS 动效的首选，因为它们不会改变文档布局？' }
    options:
      - { text: { en: '`transform` and `opacity`', zh: '`transform` 与 `opacity`' }, correct: true }
      - { text: { en: '`width` and `height`', zh: '`width` 与 `height`' }, correct: false }
      - { text: { en: '`top` and `left` on every frame', zh: '每一帧都修改 `top` 与 `left`' }, correct: false }
    explanation: { en: 'Transforms and opacity can often be handled without recalculating surrounding layout; geometric properties commonly trigger layout work.', zh: '变换与透明度通常无需重新计算周围布局；几何属性则常会触发布局计算。' }
    difficulty: intermediate
    tags: [checkpoint]
  - id: checkpoint-2-failure
    type: fill
    prompt: { en: 'Which Sass directive loads a module with namespaced members and replaces legacy `@import` in modern Sass?', zh: '现代 Sass 使用哪个指令以命名空间成员加载模块，并取代旧式 `@import`？' }
    answer: '@use'
    explanation: { en: '`@use` loads a stylesheet once and keeps its variables, mixins, and functions under an explicit namespace by default.', zh: '`@use` 只加载一次样式表，并默认通过明确的命名空间访问其中的变量、混入和函数。' }
    difficulty: intermediate
    tags: [checkpoint]
  - id: checkpoint-2-fix
    type: mcq
    prompt: { en: 'A Tailwind class `md:grid-cols-3` is present. When does it apply under the default mobile-first responsive model?', zh: '页面中存在 Tailwind 类 `md:grid-cols-3`。在默认的移动优先响应式模型下，它何时生效？' }
    options:
      - { text: { en: 'At the `md` minimum width and wider', zh: '达到 `md` 最小宽度及更宽时' }, correct: true }
      - { text: { en: 'Only at one exact `md` pixel width', zh: '只在 `md` 对应的某一个精确像素宽度时' }, correct: false }
      - { text: { en: 'Below the `md` breakpoint only', zh: '只在低于 `md` 断点时' }, correct: false }
    explanation: { en: 'The unprefixed utility is the base rule, while the default `md:` variant activates from its minimum-width breakpoint upward.', zh: '无前缀工具类是基础规则，默认的 `md:` 变体从对应的最小宽度断点开始向上生效。' }
    difficulty: advanced
    tags: [checkpoint]
  - id: checkpoint-2-review
    type: fill
    prompt: { en: 'Name the JavaScript method that checks a form’s current HTML constraint validity without submitting it.', zh: '写出在不提交表单的情况下检查当前 HTML 约束有效性的 JavaScript 方法名。' }
    answer: 'checkValidity()'
    explanation: { en: '`checkValidity()` evaluates the controls against their current constraint-validation rules; it does not replace server validation.', zh: '`checkValidity()` 会依据控件当前的约束验证规则进行检查，但不能取代服务器验证。' }
    difficulty: advanced
    tags: [checkpoint]
