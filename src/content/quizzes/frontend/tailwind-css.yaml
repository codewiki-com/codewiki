topic: frontend/tailwind-css
items:
  - id: predict-static-candidates
    type: predict
    prompt: { en: 'Which background candidates can source detection see in full?', zh: '源码检测能完整看到哪些背景色候选项？' }
    code: |
      const toneClasses = {
        danger: 'bg-red-600',
        safe: 'bg-green-600',
      };

      const dynamicClass = `bg-${tone}-600`;
    lang: javascript
    options:
      - { text: { en: 'Only bg-red-600 and bg-green-600', zh: '只有 bg-red-600 与 bg-green-600' }, correct: true }
      - { text: { en: 'Every possible bg-*-600 utility', zh: '所有可能的 bg-*-600 工具' }, correct: false }
      - { text: { en: 'Only the runtime value of dynamicClass', zh: '只有 dynamicClass 的运行时值' }, correct: false }
      - { text: { en: 'No candidates because the file is JavaScript', zh: '没有候选项，因为文件是 JavaScript' }, correct: false }
    explanation: { en: 'Tailwind scans source as text. It sees complete strings in the map but cannot evaluate interpolation to discover the runtime class.', zh: 'Tailwind 把源码当作文本扫描。它能看到映射中的完整字符串，但不会执行插值来推导运行时类名。' }
    difficulty: beginner
    tags: [source-detection, dynamic-classes, static-map]
    minutes: 2

  - id: spot-v3-entry-in-v4
    title: { en: 'Spot the bug in the Tailwind CSS 4 entry', zh: '找出 Tailwind 入口里的 bug' }
    type: spotbug
    prompt: { en: 'Why is this not the normal Tailwind CSS 4 stylesheet entry?', zh: '为什么这不是 Tailwind CSS 4 的常规样式入口？' }
    code: |
      @tailwind base;
      @tailwind components;
      @tailwind utilities;

      .card {
        @apply rounded-lg p-4;
      }
    lang: css
    issues:
      - line: 1
        lines: 3
        kind: correctness
        note: { en: 'These three v3-era directives should be replaced by @import "tailwindcss" in a regular v4 entry.', zh: '常规 v4 入口应使用 @import "tailwindcss"，而不是这三条 v3 时代的指令。' }
    explanation: { en: 'A v4 Vite or PostCSS entry imports Tailwind with one CSS import. Version-specific setup must follow the installed major version.', zh: 'v4 的 Vite 或 PostCSS 入口通过一条 CSS 导入加载 Tailwind。配置方式必须匹配已安装的主版本。' }
    difficulty: beginner
    tags: [tailwind-v4, migration, css-entry]
    minutes: 3

  - id: choose-responsive-baseline
    type: mcq
    prompt: { en: 'Which class set makes a grid one column by default, two from md, and four from xl?', zh: '哪组类名会让网格默认一列、从 md 起两列、从 xl 起四列？' }
    options:
      - { text: { en: 'grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4', zh: 'grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4' }, correct: true }
      - { text: { en: 'grid sm:grid-cols-1 md:grid-cols-2 xl:grid-cols-4', zh: 'grid sm:grid-cols-1 md:grid-cols-2 xl:grid-cols-4' }, correct: false }
      - { text: { en: 'grid grid-cols-4 md:grid-cols-2 xl:grid-cols-1', zh: 'grid grid-cols-4 md:grid-cols-2 xl:grid-cols-1' }, correct: false }
      - { text: { en: 'grid md:grid-cols-2 md:max:grid-cols-1 xl:grid-cols-4', zh: 'grid md:grid-cols-2 md:max:grid-cols-1 xl:grid-cols-4' }, correct: false }
    explanation: { en: 'Unprefixed utilities establish the mobile-first baseline. The md and xl variants apply minimum-width overrides from their breakpoints upward.', zh: '无前缀工具建立移动优先基线。md 与 xl 变体从各自断点开始应用最小宽度覆盖。' }
    difficulty: beginner
    tags: [responsive-design, breakpoints, mobile-first]
    minutes: 2

  - id: spot-missing-focus
    title: { en: 'Spot the bug in the button focus style', zh: '找出按钮焦点样式里的 bug' }
    type: spotbug
    prompt: { en: 'What interaction defect does this styled control introduce?', zh: '这个带样式的控件引入了什么交互缺陷？' }
    code: |
      <button
        type="button"
        class="rounded bg-indigo-600 px-4 py-2 text-white focus:outline-none"
      >
        Save
      </button>
    lang: html
    issues:
      - line: 3
        kind: correctness
        note: { en: 'The default focus outline is removed without a visible focus-visible replacement, so keyboard focus may be impossible to locate.', zh: '代码移除了默认焦点轮廓，却没有提供可见的 focus-visible 替代样式，键盘用户可能无法定位焦点。' }
    explanation: { en: 'Utility classes do not make a control accessible automatically. Keep the browser indicator or replace it with a tested visible focus style.', zh: '工具类不会自动保证控件可访问。应保留浏览器焦点指示，或提供经过测试的可见焦点样式。' }
    difficulty: intermediate
    tags: [accessibility, focus-visible, buttons]
    minutes: 3

  - id: review-generated-action-button
    title: { en: 'Review a generated Tailwind action button', zh: '审查生成的 Tailwind 操作按钮' }
    type: review
    prompt: { en: 'Review this generated component before it enters a shared UI package.', zh: '这段生成组件进入共享 UI 包之前，请进行审查。' }
    task: { en: 'Build a button with two finite tones, two widths, a disabled state, and a visible keyboard-focus indicator using statically detectable classes and narrowly scoped transitions.', zh: '使用可静态检测的类名和范围明确的过渡，实现包含两种有限色调、两种宽度、禁用状态与可见键盘焦点的按钮。' }
    code: |
      type Props = {
        tone: 'primary' | 'danger';
        wide?: boolean;
        disabled?: boolean;
        children: React.ReactNode;
      };

      export function ActionButton({ tone, wide, disabled, children }: Props) {
        const toneClass = `bg-${tone}-600 hover:bg-${tone}-700`;
        const widthClass = wide ? 'px-8' : 'px-4';

        return (
          <button
            type="button"
            disabled={disabled}
            className={`py-2 px-4 ${widthClass} ${toneClass} transition-all focus:outline-none`}
          >
            {children}
          </button>
        );
      }
    lang: tsx
    right: { en: 'The generated code starts with a native button, exposes a real disabled property, constrains tone at the type boundary, and keeps the width choice finite.', zh: '生成代码使用原生按钮，公开真实 disabled 属性，在类型边界限制色调，并把宽度选择控制在有限集合内。' }
    checklist:
      - { en: 'Build the package in a minimal consumer and confirm every tone and state selector exists.', zh: '在最小使用方中构建该包，确认每种色调与状态选择器都存在。' }
      - { en: 'Inspect each state for one unambiguous utility per CSS property.', zh: '检查每个状态，确保每个 CSS 属性只有一个意图明确的工具。' }
      - { en: 'Navigate by keyboard and verify a visible focus indicator in supported color modes.', zh: '用键盘导航，并在支持的颜色模式下验证可见焦点指示。' }
      - { en: 'Record which properties transition and test rapid disable and re-enable changes.', zh: '记录发生过渡的属性，并测试快速禁用与重新启用。' }
    issues:
      - line: 9
        kind: correctness
        note: { en: 'Interpolated tone classes do not exist as complete source candidates; map each tone to complete background and hover strings.', zh: '插值生成的色调类名没有以完整候选项出现；应把每种色调映射到完整的背景与悬停字符串。' }
      - line: 16
        kind: readability
        note: { en: 'px-4 conflicts with widthClass, hiding which branch owns horizontal padding; remove the unconditional padding utility.', zh: 'px-4 与 widthClass 冲突，掩盖了水平内边距由哪个分支负责；应删除无条件的内边距工具。' }
      - line: 16
        kind: performance
        note: { en: 'transition-all opts every transitionable change into animation; name only the property whose motion is part of the component contract.', zh: 'transition-all 会让所有可过渡变化进入动画；应只指定组件契约确实需要动态效果的属性。' }
      - line: 16
        kind: edge-case
        note: { en: 'focus:outline-none removes the visible keyboard-focus fallback without supplying focus-visible ring or outline utilities.', zh: 'focus:outline-none 移除了键盘焦点的可见回退，却没有提供 focus-visible 轮廓或环形工具。' }
    explanation: { en: 'Use a static tone map, choose exactly one padding class, transition only an intentional property, and retain or replace the focus indicator. Then verify the package from an isolated consumer build so source-boundary mistakes cannot hide.', zh: '应使用静态色调映射，只选择一个内边距类，只为有意选择的属性添加过渡，并保留或替换焦点指示。随后从隔离的使用方构建验证组件包，避免源码边界错误被掩盖。' }
    difficulty: advanced
    tags: [code-review, dynamic-classes, accessibility, transitions]
    minutes: 12
