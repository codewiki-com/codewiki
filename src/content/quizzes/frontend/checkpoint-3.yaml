topic: frontend/checkpoint-3
items:
  - id: checkpoint-3-core
    type: mcq
    prompt: { en: 'Which concern must be evaluated when choosing a runtime CSS-in-JS library?', zh: '选择运行时 CSS-in-JS 库时，必须评估哪项问题？' }
    options:
      - { text: { en: 'Style generation and injection add client work and require a deliberate SSR strategy.', zh: '样式生成与注入会增加客户端工作量，并需要明确的 SSR 策略。' }, correct: true }
      - { text: { en: 'Component-scoped styles make the CSS cascade cease to exist.', zh: '组件作用域样式会让 CSS 层叠彻底消失。' }, correct: false }
      - { text: { en: 'Using JavaScript for styles guarantees zero runtime cost.', zh: '使用 JavaScript 编写样式一定不会产生运行时成本。' }, correct: false }
    explanation: { en: 'Runtime systems may compute and inject styles in the browser, so rendering cost, caching, hydration, and server extraction remain architectural concerns.', zh: '运行时方案可能在浏览器中计算并注入样式，因此渲染成本、缓存、水合与服务端样式提取仍是架构问题。' }
    difficulty: beginner
    tags: [checkpoint]
  - id: checkpoint-3-term
    type: fill
    prompt: { en: 'Name the approach that turns CSS-in-JS declarations into CSS files during the build instead of generating them in the browser.', zh: '写出在构建阶段把 CSS-in-JS 声明转换为 CSS 文件、而不是在浏览器中生成样式的方式。' }
    answer: 'static extraction'
    explanation: { en: 'Static extraction moves style generation to build time, reducing or removing the style library’s browser runtime.', zh: '静态提取把样式生成移到构建阶段，从而减少或移除样式库在浏览器中的运行时工作。' }
    difficulty: beginner
    tags: [checkpoint]
  - id: checkpoint-3-output
    type: mcq
    prompt: { en: 'What is the main purpose of Storybook `args` in a component story?', zh: '组件故事中的 Storybook `args` 主要用于什么？' }
    options:
      - { text: { en: 'Provide inputs that render a component state and can be varied by tools such as Controls.', zh: '提供用于渲染组件状态的输入，并可通过 Controls 等工具调整。' }, correct: true }
      - { text: { en: 'Replace the component’s production state management automatically.', zh: '自动取代组件在生产环境中的状态管理。' }, correct: false }
      - { text: { en: 'Bundle every story into the application’s production route.', zh: '把每个故事都打包进应用的生产路由。' }, correct: false }
    explanation: { en: 'Args describe a story’s component inputs. Storybook can reuse them for rendering, controls, documentation, and interaction setup.', zh: 'Args 描述故事中的组件输入。Storybook 可以复用这些输入进行渲染、控制、文档展示与交互设置。' }
    difficulty: beginner
    tags: [checkpoint]
  - id: checkpoint-3-boundary
    type: fill
    prompt: { en: 'Name the Storybook story function used to run interactions after a story renders.', zh: '写出 Storybook 中在故事渲染后执行交互的故事函数名。' }
    answer: 'play'
    explanation: { en: 'A `play` function exercises the rendered story through interactions and assertions rather than changing the component implementation.', zh: '`play` 函数通过交互与断言操作已经渲染的故事，而不是修改组件实现。' }
    difficulty: intermediate
    tags: [checkpoint]
  - id: checkpoint-3-rule
    type: mcq
    prompt: { en: 'Which testing split gives fast diagnosis without giving up confidence in a critical checkout flow?', zh: '哪种测试分工既能快速定位问题，又不牺牲对关键结账流程的信心？' }
    options:
      - { text: { en: 'Many focused unit and integration tests, plus a smaller set of end-to-end tests for critical journeys', zh: '大量聚焦的单元与集成测试，再为关键路径编写少量端到端测试' }, correct: true }
      - { text: { en: 'Only end-to-end tests because they make lower-level tests redundant', zh: '只写端到端测试，因为它们会让低层测试变得多余' }, correct: false }
      - { text: { en: 'Only snapshot tests because any unchanged markup proves correct behavior', zh: '只写快照测试，因为标记不变就能证明行为正确' }, correct: false }
    explanation: { en: 'Lower-level tests give cheap, precise feedback, while selected end-to-end tests verify that real layers cooperate on valuable user journeys.', zh: '低层测试能提供成本较低且定位准确的反馈，少量端到端测试则验证各层能否在重要用户路径中协同工作。' }
    difficulty: intermediate
    tags: [checkpoint]
  - id: checkpoint-3-failure
    type: fill
    prompt: { en: 'Name the Vitest environment commonly selected when a unit test needs browser-like DOM APIs without launching a browser.', zh: 'Vitest 单元测试需要类似浏览器的 DOM API、但不启动真实浏览器时，通常选择哪个环境？' }
    answer: 'jsdom'
    explanation: { en: '`jsdom` supplies a simulated DOM for tests; code that depends on real layout or full browser behavior still needs browser-level testing.', zh: '`jsdom` 为测试提供模拟 DOM；依赖真实布局或完整浏览器行为的代码仍需浏览器级测试。' }
    difficulty: intermediate
    tags: [checkpoint]
  - id: checkpoint-3-fix
    type: mcq
    prompt: { en: 'Which Playwright locator is most resilient for a visible “Submit order” button?', zh: '对于可见的“Submit order”按钮，哪种 Playwright 定位方式最稳健？' }
    options:
      - { text: { en: '`page.getByRole("button", { name: "Submit order" })`', zh: '`page.getByRole("button", { name: "Submit order" })`' }, correct: true }
      - { text: { en: '`page.locator("div:nth-child(7)")`', zh: '`page.locator("div:nth-child(7)")`' }, correct: false }
      - { text: { en: '`page.locator(".blue.rounded.large")`', zh: '`page.locator(".blue.rounded.large")`' }, correct: false }
    explanation: { en: 'A role-and-name locator follows the control’s user-facing contract. DOM position and styling classes are incidental and change more easily.', zh: '按角色与名称定位符合控件面向用户的约定。DOM 位置和样式类只是实现细节，更容易变化。' }
    difficulty: advanced
    tags: [checkpoint]
  - id: checkpoint-3-review
    type: mcq
    prompt: { en: 'A Playwright assertion is flaky because content appears after an asynchronous request. Which fix best preserves the test contract?', zh: '某个 Playwright 断言因异步请求后才出现内容而偶发失败。哪种修复方式最能保留测试约定？' }
    options:
      - { text: { en: 'Use a locator with a web-first assertion that retries until its timeout.', zh: '使用定位器配合会在超时前自动重试的 Web-first 断言。' }, correct: true }
      - { text: { en: 'Add a fixed ten-second sleep before every assertion.', zh: '在每个断言前固定等待十秒。' }, correct: false }
      - { text: { en: 'Catch and ignore the failed assertion on the first run.', zh: '第一次运行时捕获并忽略失败的断言。' }, correct: false }
    explanation: { en: 'Playwright locators and web-first assertions wait for observable conditions. Fixed sleeps are both slower and vulnerable to timing variation.', zh: 'Playwright 定位器与 Web-first 断言会等待可观察条件成立。固定休眠不仅更慢，也仍会受到时序变化影响。' }
    difficulty: advanced
    tags: [checkpoint]
