topic: gamedev/unity-coroutines
items:
  - id: predict-first-yield
    type: predict
    prompt: { en: 'In what order do these messages appear?', zh: '这些消息按什么顺序出现？' }
    code: |
      private void Awake()
      {
          Debug.Log("awake");
      }

      private IEnumerator Start()
      {
          Debug.Log("start");
          yield return null;
          Debug.Log("next frame");
      }
    lang: csharp
    options:
      - { text: { en: 'awake, start, then next frame on a later frame', zh: '依次为awake、start，之后在后续帧输出next frame' }, correct: true }
      - { text: { en: 'awake and next frame, then start', zh: '依次为awake、next frame，之后输出start' }, correct: false }
      - { text: { en: 'All three messages appear only on the next frame', zh: '三条消息都只在下一帧出现' }, correct: false }
      - { text: { en: 'The method never runs because Start cannot return IEnumerator', zh: '方法不会运行，因为Start不能返回IEnumerator' }, correct: false }
    explanation: { en: 'Unity starts the IEnumerator-returning Start callback and runs it to its first yield. yield return null postpones only the final log until a later frame.', zh: 'Unity会启动返回IEnumerator的Start回调，并执行到第一次yield。只有最后一条日志会被yield return null推迟到后续帧。' }
    difficulty: beginner
    tags: [coroutine, yield, lifecycle]

  - id: choose-pause-clock
    type: mcq
    prompt: { en: 'A pause-menu notice must disappear after two real seconds while Time.timeScale is zero. Which wait expresses that requirement?', zh: '暂停菜单提示需要在Time.timeScale为零时经过现实中的两秒消失。哪种等待符合要求？' }
    options:
      - { text: { en: 'new WaitForSecondsRealtime(2f)', zh: 'new WaitForSecondsRealtime(2f)' }, correct: true }
      - { text: { en: 'new WaitForSeconds(2f)', zh: 'new WaitForSeconds(2f)' }, correct: false }
      - { text: { en: 'yield return null once', zh: '只执行一次yield return null' }, correct: false }
      - { text: { en: 'Thread.Sleep(2000)', zh: 'Thread.Sleep(2000)' }, correct: false }
    explanation: { en: 'WaitForSecondsRealtime uses unscaled time. WaitForSeconds follows scaled game time, and Thread.Sleep would block the main thread.', zh: 'WaitForSecondsRealtime使用未缩放时间。WaitForSeconds跟随缩放后的游戏时间，而Thread.Sleep会阻塞主线程。' }
    difficulty: beginner
    tags: [scaled-time, unscaled-time, pause]

  - id: spot-replacement-policy
    title: { en: 'Spot the bug in the damage flash', zh: '找出伤害闪烁里的bug' }
    type: spotbug
    prompt: { en: 'Find the timing and ownership bugs in this generated damage-flash code.', zh: '找出这段生成的受击闪烁代码中的计时与所有权错误。' }
    code: |
      private Coroutine flashRoutine;

      public void Flash()
      {
          flashRoutine = StartCoroutine(RunFlash());
      }

      private IEnumerator RunFlash()
      {
          sprite.color = Color.white;
          yield return new WaitForSeconds(0.1f);
          sprite.color = Color.red;
          flashRoutine = null;
      }
    lang: csharp
    issues:
      - line: 5
        kind: correctness
        note: { en: 'A second Flash call overwrites the handle without stopping the first run, so either old run can reset shared color and clear the field.', zh: '第二次调用Flash会覆盖句柄却不停止旧实例，因此任一旧实例都可能重置共享颜色并清空字段。' }
      - line: 11
        kind: edge-case
        note: { en: 'The effect freezes when timeScale is zero; that may be wrong if damage feedback must remain visible during a hit-stop or pause.', zh: 'timeScale为零时效果会停住；若受击停顿或暂停期间仍需显示反馈，这就不符合需求。' }
    explanation: { en: 'Choose whether a new flash replaces, queues behind, or overlaps the old one. Retain and stop the old handle for replacement, and select the clock from the effect specification.', zh: '应明确新闪烁是替换、排队还是叠加旧实例。若采用替换策略，就保存并停止旧句柄，并按效果规格选择时钟。' }
    difficulty: intermediate
    tags: [ownership, replacement, timing]

  - id: component-disable-lifecycle
    type: mcq
    prompt: { en: 'What happens to an already-running coroutine when only its MonoBehaviour.enabled property becomes false?', zh: '只把所属组件的MonoBehaviour.enabled设为false时，已经运行的协程会怎样？' }
    options:
      - { text: { en: 'It keeps running unless application code stops it or another stopping condition occurs.', zh: '它会继续运行，除非应用代码停止它或发生其他停止条件。' }, correct: true }
      - { text: { en: 'It pauses and automatically resumes when enabled becomes true.', zh: '它会暂停，并在enabled恢复为true时自动继续。' }, correct: false }
      - { text: { en: 'It is permanently stopped by Unity in every case.', zh: 'Unity在所有情况下都会永久停止它。' }, correct: false }
    explanation: { en: 'Disabling a MonoBehaviour does not itself stop its coroutines. Deactivating the owning GameObject or destroying the component does stop them.', zh: '禁用MonoBehaviour本身不会停止其协程。把所属GameObject设为非活动状态或销毁组件则会停止。' }
    difficulty: intermediate
    tags: [monobehaviour, lifecycle, stopping]

  - id: review-generated-pause-notice
    title: { en: 'Review generated pause notice', zh: '审查生成的暂停通知' }
    type: review
    prompt: { en: 'Review this generated pause-notice component.', zh: '审查这个生成的暂停提示组件。' }
    task: { en: 'Show only the latest message for two seconds of real time, avoid duplicate timers, remain correct during pause, and leave no stale coroutine handle after disable.', zh: '只显示最新消息并持续现实时间两秒，避免重复计时器，在暂停期间保持正确，并在禁用后不留下过期协程句柄。' }
    code: |
      using System.Collections;
      using TMPro;
      using UnityEngine;

      public sealed class PauseNotice : MonoBehaviour
      {
          [SerializeField] private GameObject panel;
          [SerializeField] private TMP_Text label;
          private bool isVisible;

          public void Show(string message)
          {
              label.text = message;
              panel.SetActive(true);
              isVisible = true;
              StartCoroutine(HideLater());
          }

          private IEnumerator HideLater()
          {
              yield return new WaitForSeconds(2f);
              panel.SetActive(false);
              isVisible = false;
          }
      }
    lang: csharp
    right: { en: 'The generated code keeps the delay off the blocking path, updates the label before showing the panel, and groups the behavior in the component that owns the UI.', zh: '生成代码没有用阻塞方式实现延迟，会先更新文字再显示面板，也把行为放在拥有该UI的组件中。' }
    checklist:
      - { en: 'Call Show twice before the first delay expires and trace which run can hide the panel.', zh: '在第一次延迟结束前连续调用两次Show，并跟踪哪个实例可能隐藏面板。' }
      - { en: 'Set Time.timeScale to zero and verify the chosen clock against the requirement.', zh: '把Time.timeScale设为零，并根据需求验证所选时钟。' }
      - { en: 'Disable and re-enable the owner, then inspect both UI state and the retained handle.', zh: '禁用再重新启用所有者，然后检查UI状态和保存的句柄。' }
      - { en: 'Remove fields that duplicate state without enforcing any behavior.', zh: '删除只重复状态、却不约束任何行为的字段。' }
    issues:
      - line: 9
        kind: readability
        note: { en: 'isVisible duplicates panel state but is never read, so it can drift without expressing a useful invariant.', zh: 'isVisible重复了panel状态却从未被读取，既可能发生漂移，也没有表达有用的不变量。' }
      - line: 16
        kind: performance
        note: { en: 'Every Show call creates another coroutine and delay object, even though the task requires only one active timer.', zh: '每次Show都会创建新的协程和延迟对象，但任务只需要一个活动计时器。' }
      - line: 21
        kind: edge-case
        note: { en: 'WaitForSeconds uses scaled time, so the notice never reaches its hide step while the game remains paused.', zh: 'WaitForSeconds使用缩放时间，因此游戏持续暂停时，提示永远不会执行隐藏步骤。' }
      - line: 22
        kind: correctness
        note: { en: 'An older run can hide a newer message because no handle is retained and replaced when Show is called again.', zh: '代码没有保存并替换句柄，因此旧实例可能隐藏后来显示的新消息。' }
    explanation: { en: 'Store one Coroutine handle, stop it before starting the latest timer, use WaitForSecondsRealtime, and clear the handle on completion and OnDisable. The panel itself is enough to represent visibility.', zh: '应保存一个Coroutine句柄，在启动最新计时器前停止旧实例，改用WaitForSecondsRealtime，并在完成和OnDisable时清空句柄。面板本身已足以表示可见性。' }
    difficulty: advanced
    tags: [code-review, ownership, unscaled-time, lifecycle]
