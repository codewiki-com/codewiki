topic: gamedev/unity-dots
items:
  - id: archetype-identity
    type: mcq
    prompt: { en: 'What determines an entity archetype in Unity Entities?', zh: 'Unity Entities中，什么决定实体所属的原型？' }
    options:
      - { text: { en: 'The exact set of component types on the entity', zh: '实体拥有的完整组件类型集合' }, correct: true }
      - { text: { en: 'The current values stored in its components', zh: '组件中当前保存的值' }, correct: false }
      - { text: { en: 'The system that most recently updated it', zh: '最近更新该实体的系统' }, correct: false }
      - { text: { en: 'The chunk index assigned during the current frame', zh: '当前帧分配的chunk索引' }, correct: false }
    explanation: { en: 'An archetype represents one exact component-type combination. Changing a component value does not change the archetype, but adding or removing a component does.', zh: '原型表示一种确定的组件类型组合。修改组件值不会改变原型，添加或移除组件则会改变。' }
    difficulty: beginner
    tags: [archetype, components]

  - id: predict-disabled-component-query
    type: predict
    prompt: { en: 'What does the final Debug.Log print when Moving is enableable?', zh: '当Moving是可启用组件时，最后的Debug.Log输出什么？' }
    code: |
      var archetype = manager.CreateArchetype(typeof(Moving));
      var units = manager.CreateEntity(archetype, 2, Allocator.Temp);

      manager.SetComponentEnabled<Moving>(units[0], false);

      var query = manager.CreateEntityQuery(typeof(Moving));
      Debug.Log(query.CalculateEntityCount());
      units.Dispose();
    lang: csharp
    options:
      - { text: { en: '1', zh: '1' }, correct: true }
      - { text: { en: '2', zh: '2' }, correct: false }
      - { text: { en: '0', zh: '0' }, correct: false }
      - { text: { en: 'It must move the disabled entity to another archetype first.', zh: '必须先把禁用的实体移到另一个原型。' }, correct: false }
    explanation: { en: 'A default query treats a disabled enableable component as non-matching, so only one entity counts. Toggling the enabled bit does not change the entity archetype.', zh: '默认查询会把已禁用的可启用组件视为不匹配，因此只计入一个实体。切换启用位不会改变实体的原型。' }
    difficulty: intermediate
    tags: [enableable-component, query]

  - id: spot-lost-job-dependency
    title: { en: 'Spot the bug in job scheduling', zh: '找出作业调度里的bug' }
    type: spotbug
    prompt: { en: 'Find the dependency and scheduling problems in this generated system.', zh: '找出这个生成系统中的依赖与调度问题。' }
    code: |
      [BurstCompile]
      public partial struct VelocitySystem : ISystem
      {
          [BurstCompile]
          public void OnUpdate(ref SystemState state)
          {
              var handle = new IntegrateVelocityJob()
                  .ScheduleParallel();
              handle.Complete();
              state.Dependency = handle;
          }
      }
    lang: csharp
    issues:
      - line: 8
        kind: correctness
        note: { en: 'The job is scheduled without state.Dependency, so it does not inherit earlier component-access dependencies.', zh: '调度时没有传入state.Dependency，因此这个Job没有继承之前的组件访问依赖。' }
      - line: 9
        kind: performance
        note: { en: 'Completing immediately forces the main thread to wait and removes the opportunity to overlap this work with compatible jobs.', zh: '立即完成会强制主线程等待，也失去了与兼容Job重叠执行的机会。' }
    explanation: { en: 'Schedule with state.Dependency and assign the returned handle back to it. Complete only where a synchronous consumer actually needs the result.', zh: '应把state.Dependency传给调度调用，并把返回句柄写回其中。只有同步使用方确实需要结果时才完成依赖。' }
    difficulty: intermediate
    tags: [job-system, dependency, scheduling]

  - id: ecb-observation-time
    type: mcq
    prompt: { en: 'A job records AddComponent<Dead> into an EndSimulation ECB. When can another system reliably query that new component?', zh: 'Job把AddComponent<Dead>记录到EndSimulation ECB后，另一个系统何时能可靠查询到新组件？' }
    options:
      - { text: { en: 'After that ECB system has played the command buffer back', zh: '对应ECB系统完成命令缓冲区回放之后' }, correct: true }
      - { text: { en: 'As soon as AddComponent is recorded by any worker thread', zh: '任意工作线程记录AddComponent后立即可见' }, correct: false }
      - { text: { en: 'As soon as the producing job is scheduled', zh: '生产该命令的Job调度后立即可见' }, correct: false }
      - { text: { en: 'Only after the World is destroyed and recreated', zh: '只有销毁并重新创建World后才可见' }, correct: false }
    explanation: { en: 'Recording is deferred; it does not mutate EntityManager storage. The component becomes visible only when the owning ECB system plays the command back.', zh: '记录命令只是延迟修改，并不会立即改变EntityManager存储。只有所属ECB系统回放后，新组件才可见。' }
    difficulty: intermediate
    tags: [entity-command-buffer, playback]

  - id: review-generated-death-system
    title: { en: 'Review generated death system', zh: '审查生成的死亡系统' }
    type: review
    prompt: { en: 'Review this generated death-marking system.', zh: '审查这个生成的死亡标记系统。' }
    task: { en: 'Mark entities with non-positive health as dead, preserve existing job dependencies, and leave the main thread free until a result is needed.', zh: '把生命值不大于零的实体标记为死亡，保留已有Job依赖，并让主线程在真正需要结果前保持可用。' }
    code: |
      using Unity.Burst;
      using Unity.Entities;

      [BurstCompile]
      public partial struct DeathSystem : ISystem
      {
          [BurstCompile]
          public void OnUpdate(ref SystemState state)
          {
              var x = 0f;

              foreach (var (health, entity) in
                       SystemAPI.Query<RefRO<Health>>().WithEntityAccess())
              {
                  if (health.ValueRO.Value <= x)
                      state.EntityManager.AddComponent<Dead>(entity);
              }

              new CountLivingJob().ScheduleParallel();
              state.Dependency.Complete();
          }
      }
    lang: csharp
    right: { en: 'The generated code uses an unmanaged partial ISystem, declares health as read-only, and makes the death threshold explicit instead of hiding it in the condition.', zh: '生成代码使用非托管的partial ISystem，把生命值声明为只读访问，也把死亡阈值明确写出，没有藏在条件中。' }
    checklist:
      - { en: 'List the query storage that each structural change can invalidate.', zh: '列出每项结构变更可能使哪些查询存储失效。' }
      - { en: 'Trace prior and returned JobHandles through every schedule call.', zh: '跟踪每次调度调用中的前序JobHandle与返回句柄。' }
      - { en: 'Locate every main-thread completion and name the consumer that requires it.', zh: '定位每个主线程完成点，并指出要求该同步的使用方。' }
      - { en: 'Check names and system ordering against the domain contract.', zh: '根据领域契约检查命名与系统顺序。' }
    issues:
      - line: 10
        kind: readability
        note: { en: 'The name x hides that this value is the death threshold; a domain name would make the condition self-explanatory.', zh: '名称x隐藏了这个值是死亡阈值；使用领域名称才能让条件直接表达含义。' }
      - line: 16
        kind: correctness
        note: { en: 'Adding a component directly while traversing the query is a structural change that can invalidate iteration; record it in an ECB.', zh: '遍历查询时直接添加组件属于结构变更，可能使迭代失效；应改为记录到ECB。' }
      - line: 19
        kind: edge-case
        note: { en: 'The scheduled job neither depends on state.Dependency nor publishes its returned handle, so overlapping component access can race.', zh: '调度的Job既不依赖state.Dependency，也没有公开返回句柄；组件访问重叠时可能发生竞态。' }
      - line: 20
        kind: performance
        note: { en: 'Completing state.Dependency every update stalls the main thread even though the task names no immediate synchronous consumer.', zh: '任务没有要求立即同步消费结果，却在每次更新中完成state.Dependency，会让主线程停等。' }
    explanation: { en: 'Record death tags in an ECB, schedule work with the prior dependency, and retain the returned handle. Complete only at a real consumption boundary, and use names that expose domain intent.', zh: '应把死亡标签记录到ECB，携带前序依赖调度工作并保存返回句柄。只在真实消费边界完成依赖，并用名称表达领域意图。' }
    difficulty: advanced
    tags: [code-review, structural-change, dependency, synchronization]
