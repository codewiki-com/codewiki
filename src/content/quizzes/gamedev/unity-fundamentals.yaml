topic: gamedev/unity-fundamentals
items:
  - id: component-composition
    type: mcq
    prompt: { en: 'Which statement best describes the relationship between a GameObject and its components?', zh: '哪项最准确地描述了 GameObject 与组件的关系？' }
    options:
      - { text: { en: 'A GameObject owns components that provide separate pieces of behavior and data.', zh: 'GameObject 拥有多个组件，各组件分别提供行为与数据。' }, correct: true }
      - { text: { en: 'Every component creates an independent GameObject at runtime.', zh: '每个组件都会在运行时创建一个独立 GameObject。' }, correct: false }
      - { text: { en: 'A GameObject receives behavior only by inheriting from another GameObject.', zh: 'GameObject 只能通过继承另一个 GameObject 获得行为。' }, correct: false }
      - { text: { en: 'A Transform is optional when a GameObject never moves.', zh: '只要 GameObject 不移动，Transform 就是可选组件。' }, correct: false }
    explanation: { en: 'A GameObject is the owner and container; attached components supply its capabilities. Every GameObject has one non-removable Transform.', zh: 'GameObject 是所有者与容器，挂载的组件提供具体能力。每个 GameObject 都有一个不可移除的 Transform。' }
    difficulty: beginner
    tags: [gameobject, components, composition]

  - id: predict-first-enable
    type: predict
    prompt: { en: 'For one enabled component on an active scene object, what is the first-run log order?', zh: '对于活动场景对象上的一个已启用组件，首次运行时日志顺序是什么？' }
    code: |
      private void Awake()
      {
          Debug.Log("awake");
      }

      private void OnEnable()
      {
          Debug.Log("enabled");
      }

      private void Start()
      {
          Debug.Log("started");
      }
    lang: csharp
    options:
      - { text: { en: 'awake, enabled, started', zh: 'awake、enabled、started' }, correct: true }
      - { text: { en: 'started, awake, enabled', zh: 'started、awake、enabled' }, correct: false }
      - { text: { en: 'enabled, started, awake', zh: 'enabled、started、awake' }, correct: false }
      - { text: { en: 'The three messages have no order even within one component.', zh: '即使在同一个组件中，三条消息也没有顺序。' }, correct: false }
    explanation: { en: 'For one initially active, enabled instance, Awake precedes OnEnable and Start follows before the first frame update. This does not define ordering between different GameObjects.', zh: '对于一个初始活动且已启用的实例，Awake 先于 OnEnable，Start 随后在首次帧更新前执行。这不代表不同 GameObject 之间也有固定顺序。' }
    difficulty: beginner
    tags: [monobehaviour, lifecycle]

  - id: spot-frame-search
    type: spotbug
    prompt: { en: 'Find the wiring, timing, and missing-reference problems in this generated follower.', zh: '找出这个生成的跟随组件在连接、计时与缺失引用方面的问题。' }
    code: |
      using UnityEngine;

      public sealed class PlayerFollower : MonoBehaviour
      {
          [SerializeField] private float speed = 5f;

          private void Update()
          {
              var player = GameObject.Find("Player");
              transform.position = Vector3.MoveTowards(
                  transform.position,
                  player.transform.position,
                  speed);
          }
      }
    lang: csharp
    issues:
      - line: 9
        kind: performance
        note: { en: 'Finding an object by name every frame repeats a scene-wide lookup instead of using one explicit, cached reference.', zh: '每帧按名称查找对象会重复执行全场景搜索，而不是使用一项显式缓存的引用。' }
      - line: 10
        lines: 4
        kind: correctness
        note: { en: 'MoveTowards receives speed as a per-frame distance; multiply a per-second speed by Time.deltaTime.', zh: 'MoveTowards 把 speed 当成每帧距离；表示每秒速度时应乘以 Time.deltaTime。' }
      - line: 12
        kind: edge-case
        note: { en: 'If no active object is named Player, dereferencing player throws instead of following a stated missing-target policy.', zh: '若没有名为 Player 的活动对象，解引用 player 会抛出异常，代码没有定义目标缺失策略。' }
    explanation: { en: 'Serialize a Transform target or register it through an owner, validate it once, and apply a time-scaled movement step. A name is a poor runtime dependency contract.', zh: '应序列化 Transform 目标，或由所有者注册目标；验证一次后按时间缩放移动步长。名称不适合作为运行时依赖契约。' }
    difficulty: intermediate
    tags: [lookup, delta-time, 'null']

  - id: serialized-default
    type: mcq
    prompt: { en: 'A saved Prefab has speed = 3 in the Inspector. The script initializer changes from 3 to 5. What happens to that existing Prefab value?', zh: '已保存的 Prefab 在 Inspector 中 speed 为 3，脚本初始值从 3 改成 5。现有 Prefab 的值会怎样？' }
    options:
      - { text: { en: 'It normally remains 3 because the serialized asset value takes precedence.', zh: '通常仍为 3，因为资源中的序列化值优先。' }, correct: true }
      - { text: { en: 'It always becomes 5 at the next compilation.', zh: '下次编译时一定变成 5。' }, correct: false }
      - { text: { en: 'Unity averages the two values and stores 4.', zh: 'Unity 会取平均值并保存为 4。' }, correct: false }
      - { text: { en: 'The component is removed because its schema changed.', zh: '组件会因结构变化而被移除。' }, correct: false }
    explanation: { en: 'A field initializer supplies a starting value for new components. Existing scene and Prefab instances retain their serialized data until you migrate or edit it.', zh: '字段初始值只为新组件提供起点。现有场景与 Prefab 实例会保留序列化数据，直到你迁移或编辑它。' }
    difficulty: beginner
    tags: [serialization, inspector, prefab]

  - id: review-generated-door
    type: review
    prompt: { en: 'Review this generated door-follow component.', zh: '审查这个生成的门跟随组件。' }
    task: { en: 'Move a configured door toward a configured target at a frame-rate-independent speed, disable its collider on arrival, and fail clearly when setup is incomplete.', zh: '让配置好的门以不受帧率影响的速度移向配置好的目标，到达后禁用碰撞体，并在配置不完整时明确失败。' }
    code: |
      using UnityEngine;

      public sealed class DoorFollower : MonoBehaviour
      {
          public float speed = 3f;
          public GameObject player;

          private BoxCollider doorCollider;

          private void Start()
          {
              doorCollider = GetComponent<BoxCollider>();
          }

          private void Update()
          {
              player = GameObject.Find("Player");
              transform.position = Vector3.MoveTowards(
                  transform.position, player.transform.position, speed);

              if (Vector3.Distance(transform.position, player.transform.position) < 0.1f)
                  doorCollider.enabled = false;
          }
      }
    lang: csharp
    right: { en: 'The generated code uses MoveTowards instead of overshooting manually, caches the collider outside Update, and states an arrival tolerance.', zh: '生成代码使用 MoveTowards 避免手动移动过头，把碰撞体缓存在 Update 之外，也明确写出了到达容差。' }
    checklist:
      - { en: 'Identify every Inspector dependency and the failure expected when it is missing.', zh: '找出每项 Inspector 依赖，并说明缺失时应如何失败。' }
      - { en: 'Convert every speed into units per frame from the clock named by the task.', zh: '根据任务指定的时钟，把每项速度换算成每帧位移。' }
      - { en: 'Search Update for global discovery and repeated component lookup.', zh: '检查 Update 中的全局发现与重复组件查找。' }
      - { en: 'Separate Inspector visibility from the public mutation API.', zh: '把 Inspector 可见性与公开修改 API 分开。' }
    issues:
      - line: 5
        lines: 2
        kind: readability
        note: { en: 'Public mutable fields expose more API than the task needs; use private serialized fields with domain-specific names.', zh: '公开可变字段暴露了超出任务所需的 API；应使用带领域名称的私有序列化字段。' }
      - line: 17
        kind: performance
        note: { en: 'The configured target is overwritten by a name lookup every frame, repeating work and defeating Inspector wiring.', zh: '每帧按名称查找并覆盖配置好的目标，既重复工作，也破坏了 Inspector 连接。' }
      - line: 18
        lines: 2
        kind: correctness
        note: { en: 'Passing speed directly makes it a distance per frame; the task requires speed multiplied by Time.deltaTime.', zh: '直接传入 speed 会使其表示每帧距离；任务要求速度乘以 Time.deltaTime。' }
      - line: 21
        lines: 2
        kind: edge-case
        note: { en: 'Neither the target nor BoxCollider is validated, so incomplete setup becomes a null dereference instead of a clear diagnostic.', zh: '目标与 BoxCollider 都未验证，因此配置不完整会变成空引用，而不是清楚的诊断。' }
    explanation: { en: 'Keep the configured target, require or validate the collider, disable the component with a contextual error when setup is invalid, and scale movement by delta time. Private serialized fields preserve Inspector editing without exposing arbitrary mutation.', zh: '应保留配置目标，要求或验证碰撞体；配置无效时输出带上下文的错误并禁用组件；移动量按 delta time 缩放。私有序列化字段既保留 Inspector 编辑，又不暴露任意修改权限。' }
    difficulty: advanced
    tags: [code-review, dependencies, lifecycle, movement]
