topic: gamedev/unity-scriptableobjects
items:
  - id: predict-shared-health-asset
    type: predict
    prompt: { en: 'The two parameters refer to the same HealthDefinition asset. What does Run log?', zh: '两个参数引用同一个 HealthDefinition 资源。Run 会输出什么？' }
    code: |
      using UnityEngine;

      public sealed class HealthDefinition : ScriptableObject
      {
          public int currentHealth = 100;

          public void Hit(int damage)
          {
              currentHealth -= damage;
          }
      }

      public static class Probe
      {
          public static void Run(HealthDefinition first, HealthDefinition second)
          {
              first.Hit(15);
              Debug.Log($"{first.currentHealth}, {second.currentHealth}");
          }
      }
    lang: csharp
    options:
      - { text: { en: '85, 85', zh: '85、85' }, correct: true }
      - { text: { en: '85, 100', zh: '85、100' }, correct: false }
      - { text: { en: '100, 85', zh: '100、85' }, correct: false }
      - { text: { en: '100, 100', zh: '100、100' }, correct: false }
    explanation: { en: 'Both variables identify one loaded asset object. Mutating currentHealth through first is immediately visible through second.', zh: '两个变量标识同一个已加载资源对象。通过 first 修改 currentHealth 后，second 会立即看到相同变化。' }
    difficulty: beginner
    tags: [shared-reference, runtime-state, predict-output]

  - id: choose-runtime-state-owner
    type: mcq
    prompt: { en: 'Two enemies share one ActorDefinition. Where should each enemy''s current health normally live?', zh: '两个敌人共享同一个 ActorDefinition。每个敌人的当前生命值通常应保存在哪里？' }
    options:
      - { text: { en: 'On the enemy component or an ordinary state object owned by it', zh: '敌人组件中，或由该组件拥有的普通状态对象中' }, correct: true }
      - { text: { en: 'In a mutable currentHealth field on the shared asset', zh: '共享资源的可变 currentHealth 字段中' }, correct: false }
      - { text: { en: 'In the result of ActorDefinition.GetInstanceID()', zh: 'ActorDefinition.GetInstanceID() 的结果中' }, correct: false }
      - { text: { en: 'In AssetDatabase from Player runtime code', zh: 'Player 运行时代码调用的 AssetDatabase 中' }, correct: false }
    explanation: { en: 'The asset is shared authoring data. Per-enemy health needs a per-enemy owner so changing one instance cannot change another.', zh: '资源保存共享的编辑期数据。每个敌人的生命值需要独立拥有者，才能避免一个实例的变化影响另一个。' }
    difficulty: beginner
    tags: [state-ownership, components, definitions]

  - id: spot-runtime-asset-factory
    type: spotbug
    prompt: { en: 'Find why this generated save helper is unsafe for a Player build and a later launch.', zh: '找出这个生成的存档辅助类为什么无法安全用于 Player 构建和下次启动。' }
    code: |
      using UnityEngine;

      public sealed class ItemDefinition : ScriptableObject
      {
          public string displayName = "Unnamed item";
      }

      public sealed class AssetMaker : MonoBehaviour
      {
          public ItemDefinition source;

          public string SaveKey()
          {
              var runtimeItem = new ItemDefinition();
              runtimeItem.displayName = source.displayName;
              UnityEditor.AssetDatabase.CreateAsset(runtimeItem, "Assets/RuntimeItem.asset");
              return source.GetInstanceID().ToString();
          }
      }
    lang: csharp
    issues:
      - line: 14
        kind: correctness
        note: { en: 'A ScriptableObject must use Unity''s creation path, such as CreateInstance for a transient object; ordinary new bypasses it.', zh: 'ScriptableObject 必须使用 Unity 的创建路径，例如用 CreateInstance 创建临时对象；普通 new 会绕过该路径。' }
      - line: 15
        kind: edge-case
        note: { en: 'source is never validated, so an unassigned Inspector reference becomes a null dereference.', zh: '代码没有验证 source；Inspector 未赋值时，这里会发生空引用。' }
      - line: 16
        kind: correctness
        note: { en: 'AssetDatabase is an editor-only API and cannot be part of Player runtime save code.', zh: 'AssetDatabase 是仅编辑器 API，不能出现在 Player 运行时存档代码中。' }
      - line: 17
        kind: correctness
        note: { en: 'GetInstanceID identifies an object only within the current run and is not a stable save identifier.', zh: 'GetInstanceID 只能在当前运行中标识对象，不是稳定的存档标识。' }
    explanation: { en: 'Use an editor-only tool to create project assets. Runtime saves should store a project-defined stable ID and values in a separate DTO, then resolve that ID through a catalog after loading.', zh: '项目资源应由仅编辑器工具创建。运行时存档应在独立 DTO 中保存项目定义的稳定 ID 与数值，加载后再通过目录解析该 ID。' }
    difficulty: intermediate
    tags: [creation, assetdatabase, save-id]

  - id: unity-66-dictionary-rule
    type: mcq
    prompt: { en: 'Which statement about Unity 6.6 serialization is accurate?', zh: '关于 Unity 6.6 序列化，哪项说法正确？' }
    options:
      - { text: { en: 'A compatible Dictionary field marked SerializeField can be serialized natively.', zh: '兼容的 Dictionary 字段加上 SerializeField 后可以原生序列化。' }, correct: true }
      - { text: { en: 'Every Dictionary still requires two parallel Lists.', zh: '每个 Dictionary 仍然必须改成两个平行 List。' }, correct: false }
      - { text: { en: 'Jagged arrays and every directly nested collection are now supported.', zh: '交错数组和所有直接嵌套集合现在都受支持。' }, correct: false }
      - { text: { en: 'A public property is serialized automatically when it has a getter.', zh: '公开属性只要有 getter 就会自动序列化。' }, correct: false }
    explanation: { en: 'Unity 6.6 added native dictionary serialization for supported signatures. Other collection limits remain, and fields rather than ordinary properties form the standard serialization surface.', zh: 'Unity 6.6 为受支持的签名增加了原生字典序列化。其他集合限制仍然存在，常规序列化面仍由字段而不是普通属性构成。' }
    difficulty: intermediate
    tags: [unity-6-6, dictionary, serialization]

  - id: review-generated-tool-state
    type: review
    prompt: { en: 'Review this generated tool-use implementation against the task.', zh: '根据任务审查这个生成的工具使用实现。' }
    task: { en: 'Keep authoring configuration private, give each ToolUser independent durability, consume durability only on an explicit use action, fail clearly when the asset is missing, and avoid recurring allocations or logs.', zh: '保持编辑配置私有，让每个 ToolUser 拥有独立耐久度，只在显式使用动作发生时消耗耐久；资源缺失时明确失败，并避免重复分配或日志。' }
    code: |
      using UnityEngine;

      [CreateAssetMenu]
      public sealed class ToolDefinition : ScriptableObject
      {
          public string displayName = "Tool";
          public int maxDurability = 100;
          public int currentDurability = 100;
          public void Use() => currentDurability--;
      }

      public sealed class ToolUser : MonoBehaviour
      {
          public ToolDefinition tool;

          private void Update()
          {
              var runtimeTool = ScriptableObject.CreateInstance<ToolDefinition>();
              runtimeTool = tool;
              runtimeTool.Use();
              Debug.Log($"{runtimeTool.displayName}: {runtimeTool.currentDurability}");
          }
      }
    lang: csharp
    right: { en: 'The generated code uses a typed asset reference, makes the definition creatable from the asset menu, and keeps the Unity component separate from the data type.', zh: '生成代码使用了有类型的资源引用，让定义可从资源菜单创建，也把 Unity 组件与数据类型分成了两个类。' }
    checklist:
      - { en: 'Classify every field as authoring configuration or per-owner runtime state.', zh: '把每个字段归为编辑配置或每个拥有者独立的运行时状态。' }
      - { en: 'Trace object creation, reassignment, and destruction for every transient Unity object.', zh: '追踪每个临时 Unity 对象的创建、重新赋值和销毁。' }
      - { en: 'Test two users sharing one definition and one user with a missing definition.', zh: '测试两个使用方共享一份定义，以及一个使用方缺失定义的情况。' }
      - { en: 'Check frame callbacks for work that belongs to an explicit domain action.', zh: '检查帧回调中是否包含本应属于显式业务动作的工作。' }
    issues:
      - line: 6
        lines: 4
        kind: readability
        note: { en: 'Public mutable fields expose authoring data as an unrestricted runtime API, and currentDurability does not belong in the shared definition.', zh: '公开可变字段把编辑数据暴露成无限制的运行时 API，而且 currentDurability 不属于共享定义。' }
      - line: 18
        kind: performance
        note: { en: 'Update allocates a new ScriptableObject every frame even though no per-frame object is required.', zh: 'Update 每帧创建新的 ScriptableObject，而任务并不需要逐帧对象。' }
      - line: 19
        lines: 2
        kind: correctness
        note: { en: 'The assignment discards the new instance, then Use mutates the shared asset instead of independent per-user state.', zh: '这次赋值丢弃了新实例，随后 Use 修改的是共享资源，而不是每个使用方独立的状态。' }
      - line: 19
        lines: 3
        kind: edge-case
        note: { en: 'tool is never validated, so a missing Inspector reference fails as a null dereference without naming the misconfigured object.', zh: '代码没有验证 tool；Inspector 引用缺失时只会空引用失败，也不会指出配置错误的对象。' }
    explanation: { en: 'Keep immutable configuration in private serialized fields, initialize a durability field owned by ToolUser once, and expose an explicit Use method. Validate the definition during initialization and log only meaningful actions or diagnostics.', zh: '应把不可变配置放在私有序列化字段中，只初始化一次由 ToolUser 拥有的耐久度字段，并暴露显式 Use 方法。初始化时验证定义，只记录有意义的动作或诊断。' }
    difficulty: advanced
    tags: [code-review, shared-state, lifecycle, allocations]
