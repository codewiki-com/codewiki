topic: gamedev/unity-monobehaviour
items:
  - id: predict-disable-enable-cycle
    type: predict
    prompt: { en: 'An initially active, enabled component finishes Start, then another component calls Cycle once. What is logged?', zh: '一个初始活动且已启用的组件执行完 Start 后，另一个组件调用一次 Cycle。日志顺序是什么？' }
    code: |
      using UnityEngine;

      public sealed class ReenableTrace : MonoBehaviour
      {
          private void Awake() => Debug.Log("A");
          private void OnEnable() => Debug.Log("E");
          private void Start() => Debug.Log("S");
          private void OnDisable() => Debug.Log("D");

          public void Cycle()
          {
              enabled = false;
              enabled = true;
          }
      }
    lang: csharp
    options:
      - { text: { en: 'A, E, S, D, E', zh: 'A、E、S、D、E' }, correct: true }
      - { text: { en: 'A, E, S, D, A, E, S', zh: 'A、E、S、D、A、E、S' }, correct: false }
      - { text: { en: 'A, S, E, D, S', zh: 'A、S、E、D、S' }, correct: false }
      - { text: { en: 'A, E, S, D', zh: 'A、E、S、D' }, correct: false }
    explanation: { en: 'Awake and Start run once for the instance. OnEnable and OnDisable follow each active-enabled period, so re-enable adds only E.', zh: 'Awake 与 Start 在该实例上只运行一次。OnEnable 和 OnDisable 跟随每次活动且启用的周期，因此重新启用只增加 E。' }
    difficulty: beginner
    tags: [lifecycle, reenable, predict-output]

  - id: awake-cross-object-order
    type: mcq
    prompt: { en: 'Without an explicit execution-order rule, what can component A safely assume about component B on another GameObject during A.Awake?', zh: '没有显式执行顺序规则时，组件 A 在 A.Awake 中可以安全假设另一个 GameObject 上的组件 B 已处于什么状态？' }
    options:
      - { text: { en: 'Nothing about whether B.Awake has already run', zh: '不能假设 B.Awake 是否已经运行' }, correct: true }
      - { text: { en: 'B.Awake has run if B is higher in the Hierarchy', zh: '只要 B 在 Hierarchy 中更靠上，B.Awake 就已经运行' }, correct: false }
      - { text: { en: 'B.Start has completed before any Awake call', zh: '任何 Awake 调用前，B.Start 都已完成' }, correct: false }
      - { text: { en: 'B is ready whenever both scripts have order zero', zh: '只要两个脚本的顺序值都是零，B 就已经就绪' }, correct: false }
    explanation: { en: 'Unity does not define a default Awake order across different GameObjects. Cross-object readiness needs an explicit protocol or configured class order.', zh: 'Unity 不会默认定义不同 GameObject 之间的 Awake 顺序。跨对象就绪需要显式协议或配置好的脚本类顺序。' }
    difficulty: intermediate
    tags: [awake, execution-order, dependencies]

  - id: spot-subscription-lifecycle
    type: spotbug
    prompt: { en: 'Find why this generated listener leaks a handler and never prints its ready message.', zh: '找出这个生成的监听器为什么会残留处理器，而且永远不会打印 ready 消息。' }
    code: |
      using UnityEngine;

      public sealed class AlarmListener : MonoBehaviour
      {
          private void OnEnable()
          {
              Alarm.Raised += code => Handle(code);
          }

          private void OnDisable()
          {
              Alarm.Raised -= code => Handle(code);
          }

          private void OnEnabled()
          {
              Debug.Log("ready");
          }

          private void Handle(int code) { }
      }
    lang: csharp
    issues:
      - line: 12
        kind: correctness
        note: { en: 'This creates a new delegate instead of removing the lambda instance added on line 7, so every enable leaves another subscription.', zh: '这里创建了新的委托，并没有移除第 7 行加入的 lambda 实例，因此每次启用都会多留一个订阅。' }
      - line: 15
        kind: correctness
        note: { en: 'OnEnabled is not a Unity message; the recognized lifecycle name is OnEnable.', zh: 'OnEnabled 不是 Unity 消息；Unity 识别的生命周期名称是 OnEnable。' }
    explanation: { en: 'Store a named handler or delegate instance and remove that exact instance in OnDisable. Put ready behavior in the existing OnEnable method instead of inventing a similar name.', zh: '应保存命名处理器或委托实例，并在 OnDisable 中移除同一个实例。ready 行为应放进已有的 OnEnable，而不是另造一个相似名称。' }
    difficulty: intermediate
    tags: [events, delegates, message-signature]

  - id: disabling-coroutine-owner
    type: mcq
    prompt: { en: 'A MonoBehaviour starts a coroutine, then code sets component.enabled = false while its GameObject remains active. What happens by default?', zh: 'MonoBehaviour 启动协程后，代码在 GameObject 仍活动时把 component.enabled 设为 false。默认会发生什么？' }
    options:
      - { text: { en: 'The coroutine continues unless code stops it explicitly.', zh: '除非代码显式停止，否则协程继续运行。' }, correct: true }
      - { text: { en: 'The coroutine pauses and resumes from the same yield after re-enable.', zh: '协程暂停，重新启用后从同一个 yield 恢复。' }, correct: false }
      - { text: { en: 'The coroutine always receives OperationCanceledException.', zh: '协程一定会收到 OperationCanceledException。' }, correct: false }
      - { text: { en: 'Unity converts the coroutine into a background thread.', zh: 'Unity 会把协程转换为后台线程。' }, correct: false }
    explanation: { en: 'Disabling a MonoBehaviour stops its normal update callbacks but not its coroutines. Stop the retained Coroutine handle in OnDisable when active-period ownership requires cancellation.', zh: '禁用 MonoBehaviour 会停止常规更新回调，但不会停止它的协程。若协程只属于活动期，应在 OnDisable 中停止保存的 Coroutine 句柄。' }
    difficulty: intermediate
    tags: [coroutine, disable, ownership]

  - id: ondestroy-guarantee
    type: mcq
    prompt: { en: 'Why should OnDestroy not be the only release path for a mandatory external resource?', zh: '为什么不应把 OnDestroy 作为必需外部资源的唯一释放路径？' }
    options:
      - { text: { en: 'Unity calls OnDestroy only for objects on GameObjects that were active at least once.', zh: 'Unity 只会为至少活动过一次的 GameObject 上的对象调用 OnDestroy。' }, correct: true }
      - { text: { en: 'OnDestroy always runs before Awake.', zh: 'OnDestroy 总是在 Awake 之前运行。' }, correct: false }
      - { text: { en: 'OnDestroy cannot contain ordinary C# method calls.', zh: 'OnDestroy 不能包含普通 C# 方法调用。' }, correct: false }
      - { text: { en: 'Unity invokes OnDestroy once per rendered frame.', zh: 'Unity 每个渲染帧都会调用一次 OnDestroy。' }, correct: false }
    explanation: { en: 'A never-activated object may not receive OnDestroy, and external resources benefit from an explicit, idempotent close operation. OnDestroy can call that operation without being its only caller.', zh: '从未激活的对象可能收不到 OnDestroy，外部资源还需要显式、幂等的关闭操作。OnDestroy 可以调用它，但不应是唯一调用方。' }
    difficulty: intermediate
    tags: [ondestroy, cleanup, ownership]

  - id: review-generated-patrol-motor
    type: review
    prompt: { en: 'Review this generated patrol motor against the stated lifecycle contract.', zh: '根据给定的生命周期契约，审查这个生成的巡逻移动组件。' }
    task: { en: 'While active, respond to PatrolClock.FixedTick and push only this Rigidbody; recover after re-enable, fail clearly on invalid setup, avoid per-tick logs, and keep Inspector configuration private.', zh: '活动期间响应 PatrolClock.FixedTick，只推动本对象的 Rigidbody；重新启用后恢复工作，配置无效时明确失败，不逐次记录日志，并保持 Inspector 配置私有。' }
    code: |
      using UnityEngine;

      [RequireComponent(typeof(Rigidbody))]
      public sealed class PatrolMotor : MonoBehaviour
      {
          public float acceleration = 6f;
          private Rigidbody body;

          private void Start()
          {
              body = GetComponent<Rigidbody>();
              PatrolClock.FixedTick += ApplyThrust;
          }

          private void OnDisable()
          {
              PatrolClock.FixedTick -= ApplyThrust;
          }

          private void ApplyThrust()
          {
              body.AddForce(transform.forward * acceleration);
              Debug.Log("thrust");
          }
      }
    lang: csharp
    right: { en: 'The generated code declares its same-object Rigidbody dependency, caches the component outside the tick handler, uses a named delegate that can be removed, and does attempt lifecycle cleanup.', zh: '生成代码声明了同对象 Rigidbody 依赖，在 tick 处理器之外缓存组件，使用可移除的命名委托，也确实尝试了生命周期清理。' }
    checklist:
      - { en: 'Pair acquisition and release callbacks on the same ownership period.', zh: '在同一个所有权周期内配对获取与释放回调。' }
      - { en: 'Test the first enable, one disable-enable cycle, and destruction.', zh: '测试首次启用、一次禁用重启和销毁。' }
      - { en: 'Validate every required component and name the misconfigured object.', zh: '验证每个必需组件，并指出配置错误的对象。' }
      - { en: 'Inspect fixed-step work for public mutation and repeated logs or allocations.', zh: '检查固定步工作中的公开修改入口，以及重复日志或分配。' }
    issues:
      - line: 6
        kind: readability
        note: { en: 'The public mutable field exposes a runtime API the task did not request; use a private serialized field with a non-negative constraint.', zh: '公开可变字段暴露了任务未要求的运行时 API；应改用带非负约束的私有序列化字段。' }
      - line: 11
        kind: edge-case
        note: { en: 'GetComponent is not checked. RequireComponent helps when attaching the script but does not repair every old Prefab after a new requirement is introduced.', zh: 'GetComponent 的结果未检查。RequireComponent 能在添加脚本时提供帮助，却不会在新增要求后修复所有旧 Prefab。' }
      - line: 12
        lines: 6
        kind: correctness
        note: { en: 'Start subscribes once but OnDisable unsubscribes every active period, so the motor never subscribes again after its first re-enable.', zh: 'Start 只订阅一次，OnDisable 却在每个活动期结束时取消；首次重新启用后，该组件不会再次订阅。' }
      - line: 23
        kind: performance
        note: { en: 'Logging on every fixed tick adds recurring work and Console noise even though the task explicitly excludes per-tick logs.', zh: '每个固定 tick 都写日志会增加重复工作和 Console 噪声，而且任务明确排除了逐次日志。' }
    explanation: { en: 'Move subscription to OnEnable, keep unsubscription in OnDisable, validate the cached Rigidbody, and make acceleration a constrained private serialized field. Remove the recurring log or guard a diagnostic behind an explicit development-only policy.', zh: '应把订阅移到 OnEnable，取消订阅保留在 OnDisable，验证缓存的 Rigidbody，并把 acceleration 改成带约束的私有序列化字段。删除重复日志，或用明确的仅开发环境策略保护诊断。' }
    difficulty: advanced
    tags: [code-review, lifecycle, events, fixed-update]
