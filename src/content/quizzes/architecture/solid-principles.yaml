topic: architecture/solid-principles
items:
  - id: predict-injected-discount
    type: predict
    prompt:
      en: What does this policy-based calculation print for a VIP order and a regular order?
      zh: 这段基于策略的计算分别处理 VIP 订单和普通订单时，会输出什么？
    code: |
      class LoyaltyDiscount {
        discountFor(order) {
          return order.customerKind === 'vip' ? order.subtotal * 0.1 : 0;
        }
      }

      const policy = new LoyaltyDiscount();
      const totals = [
        { subtotal: 100, customerKind: 'vip' },
        { subtotal: 100, customerKind: 'regular' },
      ].map((order) => order.subtotal - policy.discountFor(order));

      console.log(totals.join(', '));
    lang: javascript
    options:
      - text: { en: '90, 100', zh: '90, 100' }
        correct: true
      - text: { en: '90, 90', zh: '90, 90' }
        correct: false
      - text: { en: '100, 90', zh: '100, 90' }
        correct: false
      - text: { en: The regular order throws because it has no discount., zh: 普通订单没有折扣，因此程序抛出异常。 }
        correct: false
    explanation:
      en: The same policy accepts both valid order kinds. It returns ten for the VIP order and zero for the regular order, so their net totals are ninety and one hundred.
      zh: 同一个策略接受两种有效订单。VIP 订单返回 10 的折扣，普通订单返回 0，因此净额分别为 90 和 100。
    difficulty: beginner
    tags: [solid, strategy, predict-output]

  - id: choose-srp-boundary
    type: mcq
    prompt:
      en: Which evidence most strongly supports separating tax calculation from receipt wording under SRP?
      zh: 按照 SRP，哪项证据最能支持把税额计算与收据文案拆开？
    options:
      - text:
          en: Compliance changes tax rules while marketing independently changes receipt wording.
          zh: 合规团队修改税务规则，而营销团队独立修改收据文案。
        correct: true
      - text:
          en: The current class has more than five methods.
          zh: 当前类有五个以上的方法。
        correct: false
      - text:
          en: Both behaviors happen to use the same Order value.
          zh: 两种行为恰好都使用同一个 Order 值。
        correct: false
    explanation:
      en: SRP follows actors and reasons to change, not a method-count threshold. Independent rule owners create independent change axes even when code shares input data.
      zh: SRP 依据参与者与变更原因，而不是方法数量阈值。即使代码共享输入数据，不同规则负责人仍会形成独立的变化轴。
    difficulty: intermediate
    tags: [srp, change-actor, module-boundary]

  - id: spot-strengthened-precondition
    title: { en: 'Spot the bug in the discount policy', zh: '找出折扣策略里的 bug' }
    type: spotbug
    prompt:
      en: Find the substitution bug in this implementation, whose interface promises a discount for every valid order.
      zh: 这个接口承诺为每个有效订单计算折扣，请找出实现中的替换缺陷。
    code: |
      class VipOnlyDiscount {
        discountFor(order) {
          if (order.customerKind !== 'vip') {
            throw new Error('VIP customers only');
          }
          return order.subtotal * 0.1;
        }
      }
    lang: javascript
    issues:
      - line: 3
        lines: 3
        kind: correctness
        note:
          en: The implementation strengthens the precondition to VIP orders and adds an unpromised failure for valid regular orders, so it cannot substitute for the interface.
          zh: 这个实现把前置条件加强为 VIP 订单，并为有效的普通订单新增未约定的失败，因此不能替换该接口。
    explanation:
      en: A conforming policy should return zero or another contract-valid amount for a regular order. Otherwise the API must expose a narrower VIP-only role instead of pretending to implement the broader contract.
      zh: 符合契约的策略应为普通订单返回 0 或其他有效金额。否则，API 应明确提供范围更窄的 VIP 专用角色，而不是假装实现宽泛契约。
    difficulty: intermediate
    tags: [lsp, precondition, behavioral-subtyping]

  - id: choose-dip-direction
    type: mcq
    prompt:
      en: Which module arrangement best satisfies the Dependency Inversion Principle?
      zh: 哪种模块安排最符合依赖倒置原则？
    options:
      - text:
          en: The business module defines an OrderStore port, the database adapter implements it, and the composition root connects them.
          zh: 业务模块定义 OrderStore 端口，数据库适配器实现它，再由组合根连接双方。
        correct: true
      - text:
          en: The business module imports a vendor client interface, but a container constructs the client.
          zh: 业务模块导入供应商客户端接口，但由容器创建客户端。
        correct: false
      - text:
          en: Every module reads the service locator so no constructor names a concrete class.
          zh: 每个模块都读取服务定位器，因此构造函数没有写出具体类名。
        correct: false
    explanation:
      en: >-
        Inversion is visible in source ownership and import direction: the high-level policy owns the port and the detail depends on it. A container or locator alone does not reverse that knowledge.
      zh: >-
        倒置体现在源码所有权和导入方向上：高层策略拥有端口，细节依赖该端口。仅有容器或服务定位器不会改变知识方向。
    difficulty: intermediate
    tags: [dip, dependency-direction, composition-root]

  - id: review-generated-checkout
    title: { en: 'Review generated checkout policy', zh: '审查生成的结账策略' }
    type: review
    prompt:
      en: Review this generated checkout service for SOLID boundaries and observable correctness.
      zh: 审查这段生成的结账服务，检查其 SOLID 边界与可观察正确性。
    task:
      en: Calculate totals for every valid order through injected discount and tax policies, keep vendor details outside business policy, and avoid exposing customer data.
      zh: 通过注入的折扣与税务策略计算每个有效订单的总额，把供应商细节留在业务策略之外，并避免暴露客户数据。
    code: |
      interface AcmePricingSdk {
        discount(order: Order): Promise<number>;
        taxRate(order: Order): Promise<number>;
      }
      type Order = {
        customerId: string;
        customerKind: 'regular' | 'vip';
        subtotal: number;
      };
      class CheckoutService {
        constructor(private readonly pricing: AcmePricingSdk) {}
        async total(order: Order): Promise<number> {
          if (!order.subtotal) return 0;
          console.log('pricing order', order);
          if (order.customerKind !== 'vip') throw new Error('not supported');
          const discount = await this.pricing.discount(order);
          const net = order.subtotal - discount;
          const taxRate = await this.pricing.taxRate(order);
          const auditDiscount = await this.pricing.discount(order);
          return net + net * taxRate + auditDiscount * 0;
        }
      }
    lang: typescript
    right:
      en: The dependency is constructor-injected and immutable, asynchronous results are awaited, and tax is calculated from the post-discount net amount.
      zh: 依赖通过构造函数注入且不可变，异步结果得到等待，并且税额根据折扣后的净额计算。
    issues:
      - line: 11
        kind: readability
        note:
          en: The business service depends on a vendor-shaped interface that combines discount and tax capabilities, hiding the intended role boundaries and leaking low-level language inward.
          zh: 业务服务依赖一个供应商形状的接口，其中混合折扣与税务能力，既掩盖预期角色边界，也让低层术语向内泄漏。
      - line: 13
        kind: edge-case
        note:
          en: A falsy check silently treats NaN like a zero subtotal while allowing negative subtotals; valid zero and invalid numeric inputs need explicit, separate handling.
          zh: 真值检查会把 NaN 悄悄当成零小计，却允许负小计通过；有效的零值和无效数字需要分别显式处理。
      - line: 14
        kind: security
        note:
          en: Logging the complete order exposes the customer identifier and any fields later added to the object to an uncontrolled log sink.
          zh: 记录完整订单会把客户标识，以及以后加入对象的任何字段，暴露给未受控制的日志接收端。
      - line: 15
        kind: correctness
        note:
          en: Rejecting every regular order strengthens the task's precondition and makes the service fail for a valid input its contract promises to handle.
          zh: 拒绝所有普通订单加强了任务的前置条件，使服务在契约承诺处理的有效输入上失败。
      - line: 19
        kind: performance
        note:
          en: Calling the remote discount operation a second time adds latency and cost while its result is multiplied by zero and cannot affect the total.
          zh: 第二次调用远程折扣操作会增加延迟与成本，而结果乘以 0，根本不会影响总额。
    checklist:
      - en: Define separate consumer-owned DiscountPolicy and TaxPolicy contracts with valid ranges and failure semantics.
        zh: 分别定义由消费者拥有的 DiscountPolicy 与 TaxPolicy 契约，写清有效范围与失败语义。
      - en: Run one shared contract suite against every implementation, including zero, negative, NaN, regular, and VIP inputs.
        zh: 对每个实现运行同一组契约测试，覆盖零、负数、NaN、普通客户和 VIP 输入。
      - en: Map vendor types and errors in an outside adapter, then inspect the business module's import graph.
        zh: 在外侧适配器中转换供应商类型与错误，再检查业务模块的导入图。
      - en: Log only an approved correlation identifier and verify each remote policy is called no more than required.
        zh: 只记录获准的关联标识，并验证每个远程策略的调用次数不超过需要。
    explanation:
      en: Split the vendor adapter from consumer-owned pricing ports, validate numeric inputs explicitly, and preserve the contract for both customer kinds. Reuse the first discount result and emit only approved diagnostic fields.
      zh: 应把供应商适配器与消费者拥有的定价端口分开，显式验证数字输入，并为两种客户类型保持契约。复用第一次折扣结果，且只输出获准的诊断字段。
    difficulty: advanced
    tags: [solid, generated-code, code-review, contracts]
