topic: architecture/adr
items:
  - id: predict-recording-threshold
    type: predict
    prompt:
      en: What does this intake check print for a reversible decision that still crosses teams and has two viable options?
      zh: 对于一个可逆、但跨团队且有两个可行选项的决定，这段准入检查会输出什么？
    code: |
      const decision = {
        expensiveToReverse: false,
        crossesTeams: true,
        viableOptions: 2,
      };

      const needsAdr =
        decision.expensiveToReverse ||
        decision.crossesTeams ||
        decision.viableOptions > 1;

      console.log(needsAdr ? 'write ADR' : 'keep in ticket');
    lang: javascript
    options:
      - text: { en: write ADR, zh: write ADR }
        correct: true
      - text: { en: keep in ticket, zh: keep in ticket }
        correct: false
      - text: { en: The program throws because the decision is reversible., zh: 程序会抛出异常，因为这个决定可逆。 }
        correct: false
    explanation:
      en: Crossing team boundaries or having several viable options is enough under this policy; the conditions are joined with logical OR.
      zh: 按这项规则，跨团队或存在多个可行选项已经足够；几个条件使用逻辑或连接。
    difficulty: beginner
    tags: [adr, decision-threshold, predict-output]

  - id: separate-facts-and-predictions
    type: mcq
    prompt:
      en: Which statement belongs under consequences rather than context in a proposed ADR?
      zh: 在一份提议中的 ADR 里，哪句话应写入后果，而不是背景？
    options:
      - text:
          en: Checkout and catalog currently share one database transaction.
          zh: 结账与目录目前共享一个数据库事务。
        correct: false
      - text:
          en: Separate databases will require explicit handling of cross-boundary consistency.
          zh: 拆分数据库后将需要显式处理跨边界一致性。
        correct: true
      - text:
          en: The current compliance policy requires customer data to remain in one region.
          zh: 当前合规政策要求客户数据留在一个区域内。
        correct: false
    explanation:
      en: Context states conditions that already hold. The consistency work is a predicted result of applying the proposed choice, so it is a consequence.
      zh: 背景陈述已经成立的条件。一致性工作是采用提议方案后的预期结果，因此属于后果。
    difficulty: beginner
    tags: [context, consequences, decision-writing]

  - id: spot-one-hop-supersession
    title: { en: 'Spot the bug in the supersession chain', zh: '找出决策替代链里的 bug' }
    type: spotbug
    prompt:
      en: Find the bug in this helper, which promises to return the current decision at the end of any supersession chain.
      zh: 这个辅助函数承诺返回任意取代链末端的当前决定，请找出其中的缺陷。
    code: |
      function currentDecision(records, id) {
        const record = records.get(id);
        if (record.status === 'Superseded') {
          return records.get(record.replacement);
        }
        return record;
      }
    lang: javascript
    issues:
      - line: 4
        kind: correctness
        note:
          en: It follows only one replacement, so a chain such as ADR-1 to ADR-2 to ADR-3 returns the still-superseded ADR-2.
          zh: 它只跟随一次替代关系，因此 ADR-1 到 ADR-2 再到 ADR-3 的链会返回仍已被取代的 ADR-2。
    explanation:
      en: Follow links until a non-superseded record is reached, while tracking visited IDs to detect cycles and checking that every target exists.
      zh: 应持续跟随链接直到遇到未被取代的记录，同时跟踪已访问 ID 以检测环，并检查每个目标确实存在。
    difficulty: intermediate
    tags: [supersession, graph, code-review]

  - id: update-accepted-adr
    type: mcq
    prompt:
      en: Production now violates an accepted ADR because a regulatory boundary changed. What is the sound next step?
      zh: 由于监管边界变化，生产实现已经不再符合一份已接受的 ADR。合理的下一步是什么？
    options:
      - text:
          en: Rewrite the accepted ADR so its original context and decision match production.
          zh: 重写已接受 ADR 的原背景与决定，使其符合生产现状。
        correct: false
      - text:
          en: Create a proposed replacement that names the changed fact, then link and supersede the old ADR if accepted.
          zh: 创建替代提案，说明变化的事实；提案被接受后建立链接并取代旧 ADR。
        correct: true
      - text:
          en: Delete the old ADR because it no longer describes the current architecture.
          zh: 删除旧 ADR，因为它已经无法描述当前架构。
        correct: false
    explanation:
      en: A replacement preserves the evidence behind old code while recording why the new constraint changes the trade-off. Acceptance must precede supersession.
      zh: 替代记录既保留旧代码背后的依据，也记录新约束为何改变了取舍。新决定应先被接受，再取代旧记录。
    difficulty: intermediate
    tags: [lifecycle, supersession, architecture-governance]

  - id: review-generated-adr-publisher
    title: { en: 'Review generated ADR publisher', zh: '审查生成的 ADR 发布器' }
    type: review
    prompt:
      en: Review this generated ADR publisher before it is allowed to write to the repository.
      zh: 在允许这段生成的 ADR 发布器写入仓库前，请审查它。
    task:
      en: Create a proposed ADR from reviewed structured fields, allocate a stable unique ID, and preserve any accepted record that the proposal may later replace.
      zh: 根据已经审查的结构化字段创建提议中的 ADR，分配稳定且唯一的 ID，并保留提案以后可能取代的任何已接受记录。
    code: |
      async function publishAdr(input, repository, model) {
        const id = `ADR-${Date.now()}`;
        const context = await model.complete(JSON.stringify(input));
        const body = [
          `# ${id}: ${input.title}`,
          '',
          'Status: Accepted',
          '',
          '## Context',
          '',
          context,
          '',
          '## Decision',
          '',
          input.choice,
          '',
          '## Consequences',
          '',
          '- Good: simpler operations.', ].join('\n');
        if (input.replaces) {
          await repository.write(input.replaces, body);
        }
        await repository.write(`${id}.md`, body);
        return id;
      }
    lang: javascript
    right:
      en: The function emits readable Markdown, uses a repository abstraction instead of hard-coded filesystem access, and returns the created identifier.
      zh: 这个函数生成可读的 Markdown，通过仓库抽象而不是硬编码文件系统写入，并返回创建的标识。
    issues:
      - line: 2
        kind: edge-case
        note:
          en: Millisecond timestamps can collide across concurrent calls and do not reserve an identifier against existing records.
          zh: 毫秒时间戳在并发调用时可能冲突，也不会针对已有记录预留标识。
      - line: 3
        kind: security
        note:
          en: The complete input is sent to a model without filtering secrets, personal data, or repository-only context.
          zh: 完整输入未经筛除密钥、个人数据或仓库内部信息，就被发送给模型。
      - line: 3
        kind: performance
        note:
          en: A remote model call adds latency and cost to deterministic formatting that can be performed locally from reviewed fields.
          zh: 远程模型调用给本可根据已审查字段在本地完成的确定性格式化增加了延迟和成本。
      - line: 19
        kind: readability
        note:
          en: The generic positive consequence conceals the actual trade-off and gives a reviewer no fact or prediction to challenge.
          zh: 泛化的正面后果掩盖了真实取舍，没有给评审者留下可质疑的事实或预测。
      - line: 21
        kind: correctness
        note:
          en: Writing the new body over input.replaces destroys the accepted record instead of preserving it and adding a reciprocal supersession link.
          zh: 用新正文覆盖 input.replaces 会破坏已接受的记录，而不是保留它并添加双向取代链接。
    checklist:
      - en: Allocate the next ID atomically and reject any existing target path.
        zh: 原子地分配下一个 ID，并拒绝任何已经存在的目标路径。
      - en: Keep deterministic rendering local and send no repository data to a model without an explicit data policy.
        zh: 在本地完成确定性渲染；没有明确数据策略时，不向模型发送任何仓库数据。
      - en: Force new records to Proposed until the repository's real review step accepts them.
        zh: 在仓库的真实评审步骤接受前，强制新记录保持 Proposed 状态。
      - en: Test missing targets, concurrent creation, reciprocal links, and cycles without modifying accepted bodies.
        zh: 测试目标缺失、并发创建、双向链接与环，同时不得修改已接受记录的正文。
    explanation:
      en: Render only reviewed fields, allocate IDs through the repository, and save the new record as Proposed. If it is later accepted, update only the old record's status and replacement link while preserving its body.
      zh: 只渲染已经审查的字段，通过仓库分配 ID，并把新记录保存为 Proposed。它以后被接受时，只更新旧记录的状态和替代链接，同时保留原正文。
    difficulty: advanced
    tags: [adr, generated-code, code-review, supersession]
