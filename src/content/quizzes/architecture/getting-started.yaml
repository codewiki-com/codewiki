topic: architecture/getting-started
items:
  - id: predict-outward-dependency
    type: predict
    prompt:
      en: What does this architecture check print?
      zh: 这项架构检查会输出什么？
    code: |
      const rank = { domain: 0, application: 1, adapter: 2 };
      const modules = {
        order: 'domain',
        checkout: 'application',
        postgres: 'adapter',
      };
      const dependencies = [
        ['checkout', 'order'],
        ['order', 'postgres'],
      ];
      const invalid = dependencies.filter(
        ([from, to]) => rank[modules[from]] < rank[modules[to]],
      );

      console.log(invalid.map((edge) => edge.join(' -> ')));
    lang: javascript
    options:
      - text: { en: "[ 'order -> postgres' ]", zh: "[ 'order -> postgres' ]" }
        correct: true
      - text: { en: "[ 'checkout -> order' ]", zh: "[ 'checkout -> order' ]" }
        correct: false
      - text: { en: '[]', zh: '[]' }
        correct: false
      - text: { en: 'The program throws because adapters cannot be ranked.', zh: 程序会抛出异常，因为适配器不能参与分层。 }
        correct: false
    explanation:
      en: An outer application module may depend on the inner domain, but the domain-to-adapter edge points outward and violates the stated rule.
      zh: 外层应用模块可以依赖内层领域模块，但从领域到适配器的边指向外部，违反了这里的规则。
    difficulty: beginner
    tags: [dependency-direction, predict-output]

  - id: complete-quality-scenario
    type: mcq
    prompt:
      en: Which statement is a usable quality attribute scenario rather than a vague aspiration?
      zh: 哪项表述是可用的质量属性场景，而不是模糊愿望？
    options:
      - text:
          en: The checkout service should be highly available and fast.
          zh: 结账服务应当高可用而且快速。
        correct: false
      - text:
          en: If the payment result is unknown, return a queryable pending state and reuse the same payment idempotency key on retry.
          zh: 支付结果未知时，返回可查询的处理中状态，并在重试时复用同一个支付幂等键。
        correct: true
      - text:
          en: Use an event-driven, cloud-native architecture for future scale.
          zh: 为将来的规模采用事件驱动、云原生架构。
        correct: false
    explanation:
      en: The correct option names a stimulus and observable response that constrain the state model and retry behavior without inventing an unmeasured target.
      zh: 正确选项给出了刺激和可观察响应，能够约束状态模型与重试行为，也没有编造尚未测量的目标。
    difficulty: beginner
    tags: [quality-attributes, scenarios]

  - id: spot-transitive-dependency
    title: { en: 'Spot the bug in the dependency checker', zh: '找出依赖检查器里的 bug' }
    type: spotbug
    prompt:
      en: Find the bug in this checker, which promises to catch every dependency path from domain to adapter code.
      zh: 这个检查器承诺找出从领域代码到适配器代码的每条依赖路径，请找出缺陷。
    code: |
      function forbiddenDependencies(graph, domainModules, adapterModules) {
        const violations = [];
        for (const domain of domainModules) {
          for (const dependency of graph.get(domain) ?? []) {
            if (adapterModules.has(dependency)) {
              violations.push(`${domain} -> ${dependency}`);
            }
          }
        }
        return violations;
      }

      const graph = new Map([
        ['order', ['shared-money']],
        ['shared-money', ['postgres-decimal']],
      ]);
    lang: javascript
    issues:
      - line: 4
        kind: correctness
        note:
          en: The checker visits only direct dependencies, so it misses order to shared-money to postgres-decimal unless it traverses the graph with a visited set.
          zh: 检查器只访问直接依赖，因此会漏掉 order 到 shared-money 再到 postgres-decimal 的路径；它需要使用已访问集合遍历依赖图。
    explanation:
      en: Architecture boundaries can be bypassed transitively. Traverse every reachable dependency, record the full path, and use a visited set so cycles terminate.
      zh: 架构边界可能被传递依赖绕过。检查器应遍历所有可达依赖、记录完整路径，并用已访问集合保证遇到环时终止。
    difficulty: intermediate
    tags: [dependency-graph, transitive-dependency, code-review]

  - id: service-boundary-evidence
    type: mcq
    prompt:
      en: Which evidence most strongly supports moving an in-process module behind a network service boundary?
      zh: 哪项证据最能支持把进程内模块移到网络服务边界之后？
    options:
      - text:
          en: The module has many classes and a large directory.
          zh: 模块包含许多类，目录也很大。
        correct: false
      - text:
          en: A separate team needs independent releases and data permissions, and can own the added failure and operating model.
          zh: 另一个团队需要独立发布和数据权限，并且能够承担新增的故障与运维模型。
        correct: true
      - text:
          en: Microservices are the organization's preferred modern pattern.
          zh: 微服务是组织偏好的现代模式。
        correct: false
    explanation:
      en: A service boundary is justified by an isolation or ownership need that outweighs network and operational cost, not by code size or fashion.
      zh: 服务边界要由足以抵偿网络和运维成本的隔离或所有权需求来证明，不能只看代码规模或潮流。
    difficulty: intermediate
    tags: [boundaries, microservices, trade-offs]

  - id: review-generated-order-boundary
    title: { en: 'Review generated order placement', zh: '审查生成的下单流程' }
    type: review
    prompt:
      en: Review this generated order-placement function before treating it as an architecture boundary.
      zh: 在把这段生成的下单函数当作架构边界前，请审查它。
    task:
      en: Place one order with authenticated customer data, reserve stock safely, charge at most once across retries, and expose useful operational evidence.
      zh: 使用已认证的客户数据创建一个订单，安全预留库存，在重试期间最多扣款一次，并提供可用的运维证据。
    code: |
      async function placeOrder(request, db, payment, metrics) {
        const customer = await db.query(
          `SELECT * FROM customers WHERE id = '${request.customerId}'`,
        );
        if (!customer) throw new Error('customer not found');

        const lines = [];
        for (const item of request.items) {
          const product = await db.query('SELECT * FROM products WHERE id = ?', [item.sku]);
          if (product.stock < item.quantity) throw new Error('out of stock');
          lines.push({ ...item, price: product.price });
        }

        const amount = lines.reduce((sum, line) => sum + line.price * line.quantity, 0);
        const receipt = await payment.charge({ amount, orderId: request.orderId });
        await db.query('INSERT INTO orders VALUES (?, ?, ?)', [
          request.orderId, request.customerId, JSON.stringify(lines),
        ]);
        metrics.push({ name: 'order.created', customer, amount });
        return { orderId: request.orderId, receipt };
      }
    lang: javascript
    right:
      en: The function rejects a missing customer and insufficient stock, parameterizes the product lookup and order insert, and emits a named operational event after success.
      zh: 函数会拒绝不存在的客户与库存不足，对商品查询和订单写入使用参数，并在成功后发出有名称的运维事件。
    issues:
      - line: 2
        lines: 3
        kind: security
        note:
          en: SQL interpolation trusts request.customerId and permits injection; the boundary also accepts customer identity from the request instead of an authenticated principal.
          zh: SQL 插值直接信任 request.customerId，可能造成注入；边界还从请求读取客户身份，而不是使用经过认证的主体。
      - line: 9
        kind: performance
        note:
          en: Querying one product per item creates an N+1 path whose database round trips grow with cart size.
          zh: 每件商品各查询一次会形成 N+1 路径，数据库往返次数随购物车大小增长。
      - line: 15
        kind: edge-case
        note:
          en: The charge has no caller-stable idempotency key, so retrying after a lost response can create a second charge.
          zh: 扣款没有由调用方稳定提供的幂等键，响应丢失后重试可能造成第二次扣款。
      - line: 16
        kind: correctness
        note:
          en: Payment succeeds before the order and stock reservation are durably committed, leaving partial success when the insert fails; no transaction or recovery protocol closes that gap.
          zh: 扣款先于订单与库存预留的持久提交，插入失败时会留下部分成功；代码没有事务或恢复协议来弥合这一缺口。
      - line: 1
        lines: 21
        kind: readability
        note:
          en: One function mixes identity, SQL, inventory policy, pricing, payment, persistence, and telemetry, so ownership and failure boundaries are impossible to see.
          zh: 一个函数混合身份、SQL、库存策略、定价、支付、持久化和遥测，所有权与故障边界因此难以辨认。
    checklist:
      - en: Trace authenticated identity and validate every value crossing the boundary.
        zh: 跟踪经过认证的身份，并验证每个跨越边界的值。
      - en: Define one transaction or recovery protocol for stock, order state, payment, and pending events.
        zh: 为库存、订单状态、支付和待发送事件定义一套事务或恢复协议。
      - en: Reuse one idempotency key through timeouts, retries, and result queries.
        zh: 在超时、重试和结果查询中复用同一个幂等键。
      - en: Batch data access and emit bounded, non-sensitive telemetry for each outcome.
        zh: 批量访问数据，并为每种结果发出有界且不含敏感信息的遥测。
    explanation:
      en: Split policy from adapters, authenticate outside the request body, batch product access, and choose an explicit transaction or recovery design. The same operation ID must cross payment, persistence, retries, and status queries.
      zh: 应把策略与适配器分开，在请求正文之外完成认证，批量读取商品，并选择明确的事务或恢复设计。同一个操作 ID 必须贯穿支付、持久化、重试和状态查询。
    difficulty: advanced
    tags: [architecture-review, security, idempotency, transactions]
