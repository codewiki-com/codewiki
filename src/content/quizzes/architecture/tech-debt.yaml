topic: architecture/tech-debt
items:
  - id: classify-change-cost
    type: mcq
    prompt:
      en: Which item is the clearest technical debt statement?
      zh: 哪一项最清楚地描述了技术债务？
    options:
      - text:
          en: The invoice total is wrong for orders with two tax rates.
          zh: 使用两种税率的订单，其发票总额计算错误。
        correct: false
      - text:
          en: Adding a payment method requires coordinated edits in checkout, billing, and notification because all three import one provider model.
          zh: 由于结账、账单与通知模块都导入同一个供应商模型，新增付款方式必须协调修改这三个模块。
        correct: true
      - text:
          en: Customers have requested a downloadable invoice that has not been built.
          zh: 客户需要尚未实现的发票下载功能。
        correct: false
    explanation:
      en: The second statement names a construction choice and the future class of change made harder. The first is a current defect, while the third is missing product capability.
      zh: 第二项同时说明了构造选择和因此变难的未来变化。第一项是当前缺陷，第三项是缺失的产品能力。
    difficulty: beginner
    tags: [technical-debt, classification, change-cost]

  - id: predict-observed-interest
    type: predict
    prompt:
      en: What does this local-observation calculation print?
      zh: 这段局部观察计算会输出什么？
    code: |
      const debt = {
        changesPerQuarter: 6,
        extraMinutesPerChange: 40,
      };

      const interestHours =
        (debt.changesPerQuarter * debt.extraMinutesPerChange) / 60;

      console.log(`${interestHours} hours per quarter`);
    lang: javascript
    options:
      - text: { en: 4 hours per quarter, zh: 4 hours per quarter }
        correct: true
      - text: { en: 40 hours per quarter, zh: 40 hours per quarter }
        correct: false
      - text: { en: 240 hours per quarter, zh: 240 hours per quarter }
        correct: false
    explanation:
      en: Six changes multiplied by forty extra minutes is 240 minutes, or four hours. It is evidence for this observation window, not a universal forecast.
      zh: 六次变更乘以每次额外四十分钟等于二百四十分钟，也就是四小时。这个结果只属于当前观察窗口，不是通用预测。
    difficulty: beginner
    tags: [debt-interest, evidence, predict-output]

  - id: spot-premature-retirement
    type: spotbug
    prompt:
      en: Find the bug in this retirement check, which requires both behavioral and structural evidence.
      zh: 这个退出检查要求行为与结构证据同时存在，请找出缺陷。
    code: |
      function canRetire(item) {
        const required = ['contract-tests', 'dependency-rule'];
        return required.some((name) => item.evidence.includes(name));
      }

      const debt = { evidence: ['contract-tests'] };
      console.log(canRetire(debt));
    lang: javascript
    issues:
      - line: 3
        kind: correctness
        note:
          en: Using `some` retires the item after either form of evidence; use `every` so both required checks must be present.
          zh: 使用 `some` 会在任意一种证据存在时退出；应使用 `every`，要求两项检查都存在。
    explanation:
      en: Contract tests and a dependency rule prove different claims. Treating one as sufficient can close the item while the old dependency direction still exists.
      zh: 契约测试与依赖规则证明的是不同结论。把任意一项当作充分条件，可能在旧依赖方向仍存在时提前关闭记录。
    difficulty: intermediate
    tags: [exit-criteria, evidence, code-review]

  - id: choose-priority-evidence
    type: mcq
    prompt:
      en: Two debt candidates compete for one remediation slot. Which comparison is most defensible?
      zh: 两项债务候选争取同一个修复名额，哪种比较最可靠？
    options:
      - text:
          en: Pick the module with the lower maintainability score because a tool already reduced every factor to one number.
          zh: 选择可维护性得分更低的模块，因为工具已经把所有因素压成一个数字。
        correct: false
      - text:
          en: Compare active risk, recent change frequency, observed extra work, remediation range, and uncertainty with their evidence links visible.
          zh: 并列比较当前风险、近期变化频率、观察到的额外工作、修复区间与不确定性，同时保留证据链接。
        correct: true
      - text:
          en: Pick the oldest item because software debt charges interest continuously with calendar time.
          zh: 选择最旧的项目，因为软件债务会持续按日历时间计息。
        correct: false
    explanation:
      en: Raw dimensions expose assumptions and allow risk to override a time estimate. A proxy score or item age alone cannot show the future change cost.
      zh: 原始维度能暴露假设，也允许风险优先于时间估算。代理分数或记录年龄本身无法说明未来变化成本。
    difficulty: intermediate
    tags: [prioritization, evidence, uncertainty]

  - id: review-generated-prioritizer
    type: review
    prompt:
      en: Review this generated debt prioritizer before it is connected to the planning repository.
      zh: 在把这个生成的债务排序器连接到计划仓库前，请审查它。
    task:
      en: Produce a read-only ordering of reviewed debt items, putting active incidents first and then sorting by observed interest, without disclosing repository data.
      zh: 对已经审查的债务项生成只读排序：先排正在发生的事故，再按观察利息排序，并且不得泄露仓库数据。
    code: |
      async function prioritizeDebt(items, repository, model) {
        const prompt = `Rank these debt items: ${JSON.stringify(items)}`;
        const ranked = JSON.parse(await model.complete(prompt));
        const results = [];

        for (const item of ranked) {
          const source = items.find((entry) => entry.id === item.id);
          const score = item.incidents * 100 + item.interestHours;

          if (score > 80) {
            await repository.update(item.id, { priority: 'critical' });
          }

          results.push({
            id: source.id,
            score,
            reason: item.reason,
          });
        }

        return results;
      }
    lang: javascript
    right:
      en: The function has a clear entry point, returns a compact result, and keeps persistence behind a repository abstraction.
      zh: 这个函数入口清楚，返回结果紧凑，并通过仓库抽象隔离持久化操作。
    issues:
      - line: 2
        kind: security
        note:
          en: It serializes every item to an external model without filtering incident details, owner data, repository links, or other sensitive fields.
          zh: 它把每个项目完整发送给外部模型，没有过滤事故细节、负责人数据、仓库链接或其他敏感字段。
      - line: 3
        kind: correctness
        note:
          en: Parsed model output is trusted without checking IDs, duplicates, omissions, field types, or whether the ordering follows the requested policy.
          zh: 解析后的模型输出未经验证就被信任，没有检查 ID、重复项、遗漏项、字段类型或排序是否符合要求。
      - line: 7
        kind: edge-case
        note:
          en: An unknown or hallucinated ID makes `source` undefined, so line 15 throws when it reads `source.id`.
          zh: 未知或幻觉生成的 ID 会让 `source` 变成 `undefined`，第十五行读取 `source.id` 时会抛出异常。
      - line: 8
        kind: readability
        note:
          en: The unexplained multiplier merges incidents and time into a score whose units and decision boundary have no stated meaning.
          zh: 这个没有解释的乘数把事故与时间合并成一个分数，其单位和决策边界都没有明确含义。
      - line: 11
        kind: performance
        note:
          en: Serial repository writes add one round trip per item even though the requested result is read-only and needs no writes at all.
          zh: 串行仓库写入让每个项目都增加一次往返，而任务要求的是只读结果，根本不需要写入。
    checklist:
      - en: Keep deterministic sorting local and compare the explicit raw fields in the requested order.
        zh: 在本地完成确定性排序，并按要求的顺序比较显式原始字段。
      - en: Minimize fields before any approved external call and validate every returned identifier and type.
        zh: 在任何获准的外部调用前最小化字段，并验证每个返回标识与类型。
      - en: Make the operation read-only and test duplicates, missing items, unknown IDs, and tied evidence.
        zh: 保持操作只读，并测试重复项、遗漏项、未知 ID 与证据并列情况。
      - en: Preserve links to the observations behind incident and interest fields instead of replacing them with a synthetic score.
        zh: 保留事故与利息字段背后的观察链接，不要用合成分数替代它们。
    explanation:
      en: Sort a validated copy of the reviewed inputs locally with a comparator for active incident and observed interest. Return the ordered evidence view without model calls or repository writes.
      zh: 应在本地复制并验证已经审查的输入，再用当前事故与观察利息比较器排序。返回有序证据视图，不调用模型，也不写入仓库。
    difficulty: advanced
    tags: [technical-debt, generated-code, security, code-review]
