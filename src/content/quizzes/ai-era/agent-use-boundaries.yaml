topic: ai-era/agent-use-boundaries
items:
  - id: predict-method-selection
    type: predict
    prompt: { en: 'What does this boundary selector print?', zh: '这个边界选择器会输出什么？' }
    code: |
      function choose(task) {
        if (!task.intentSettled || task.sensitive) return "human-led";
        if (task.stableRule) return "simple automation";
        if (task.hasOracle && task.bounded) return "agent";
        return "human-led";
      }

      const tasks = [
        { intentSettled: true, sensitive: false, stableRule: true },
        { intentSettled: true, sensitive: false, stableRule: false,
          hasOracle: true, bounded: true },
        { intentSettled: false, sensitive: false, stableRule: true },
      ];

      console.log(tasks.map(choose).join(" | "));
    lang: javascript
    options:
      - { text: { en: 'simple automation | agent | human-led', zh: 'simple automation | agent | human-led' }, correct: true }
      - { text: { en: 'agent | agent | simple automation', zh: 'agent | agent | simple automation' }, correct: false }
      - { text: { en: 'simple automation | human-led | simple automation', zh: 'simple automation | human-led | simple automation' }, correct: false }
    explanation: { en: 'A stable settled rule selects deterministic automation, a bounded task with an oracle selects an agent, and unresolved intent takes precedence over the stableRule label.', zh: '稳定且意图明确的规则选择确定性自动化；有预言机且范围受限的任务选择智能体；意图未决优先于 stableRule 标签。' }
    difficulty: beginner
    tags: [task-selection, uncertainty, decision-table]
    tests: node selector.js
    minutes: 3

  - id: identify-outcome-uncertainty
    type: mcq
    prompt: { en: 'Which task should remain human-led until an accountable owner makes a decision?', zh: '哪项任务应当保持人工主导，直到负责任的负责人作出决策？' }
    options:
      - { text: { en: 'Choose whether enterprise customers may bypass a disputed refund limit', zh: '决定企业客户能否绕过仍有争议的退款限额' }, correct: true }
      - { text: { en: 'Rename a private helper while a complete test suite guards its callers', zh: '在完整测试集保护调用方的情况下重命名私有辅助函数' }, correct: false }
      - { text: { en: 'Format source files with the repository-owned formatter', zh: '用代码库自己的格式化器格式化源文件' }, correct: false }
      - { text: { en: 'Find which parser owns a reproducible failing test', zh: '查找哪个解析器负责一项可复现的失败测试' }, correct: false }
    explanation: { en: 'The refund rule contains outcome uncertainty that repository search cannot settle. The other tasks have a fixed rule or a discoverable implementation route.', zh: '退款规则包含代码库搜索无法解决的结果不确定性。其他任务要么规则固定，要么实现路线可以查明。' }
    difficulty: beginner
    tags: [outcome-uncertainty, human-review, product-authority]
    minutes: 2

  - id: choose-deterministic-automation
    type: mcq
    prompt: { en: 'Eight hundred CSV files need the same fully specified header normalization. What is the best default method?', zh: '800 个 CSV 文件需要执行同一套完整指定的表头规范化。默认应选择哪种方式？' }
    options:
      - { text: { en: 'A deterministic script with exact input-output checks', zh: '带精确输入输出检查的确定性脚本' }, correct: true }
      - { text: { en: 'An unrestricted agent that decides a normalization style per file', zh: '让不受限制的智能体逐文件决定规范化风格' }, correct: false }
      - { text: { en: 'Manual editing without a reusable check', zh: '不使用可复用检查，完全手工编辑' }, correct: false }
    explanation: { en: 'A stable rule over structured inputs gains nothing from an adaptive agent loop. Deterministic code is repeatable, cheaper to rerun, and easier to verify exactly.', zh: '对结构化输入执行稳定规则时，自适应智能体循环没有额外价值。确定性代码可重复、重新运行更便宜，也更容易精确验证。' }
    difficulty: beginner
    tags: [simple-automation, deterministic, cost]
    minutes: 2

  - id: spotbug-permissive-boundary
    title: { en: 'Spot the bug in the agent-use boundary', zh: '找出智能体使用边界里的 bug' }
    type: spotbug
    prompt: { en: 'Find why this generated boundary admits work that should stop or require review.', zh: '找出这个生成边界为何会放行本应停止或接受审查的工作。' }
    code: |
      function mayUseAgent(task) {
        let score = 0;
        if (task.hasTests) score += 2;
        if (task.intentSettled) score += 2;
        if (task.sensitive) score -= 1;
        if (task.irreversible) score -= 1;

        if (task.estimatedCost < 10 || task.maxSteps) {
          return score >= 2;
        }
        return task.approved;
      }
    lang: javascript
    issues:
      - line: 5
        kind: security
        note: { en: 'Sensitivity is only a one-point penalty, so tests and settled intent can cancel a data-exposure red flag instead of forcing a narrower method.', zh: '敏感性只扣一分，因此测试和明确意图可以抵消数据暴露红线，而不是强制改用范围更小的方式。' }
      - line: 8
        kind: edge-case
        note: { en: 'Any truthy maxSteps passes this branch, including negative values and extremely large budgets; validate a positive bounded range.', zh: '任何真值 maxSteps 都能进入该分支，包括负数和极大预算；应验证一个有限的正数范围。' }
      - line: 11
        kind: correctness
        note: { en: 'A generic approved flag grants agent use without recording what operation, target, effect, or duration was actually approved.', zh: '笼统的 approved 标记没有记录获准的具体操作、目标、效果与时限，却直接允许使用智能体。' }
    explanation: { en: 'Hard boundary conditions should not be averaged away. Sensitive or irreversible work needs a dedicated rule, budget fields need validation, and approval must be scoped to a real operation.', zh: '硬边界条件不能被平均抵消。敏感或不可逆工作需要专门规则，预算字段需要验证，审批也必须限定到真实操作。' }
    difficulty: intermediate
    tags: [fail-closed, sensitivity, approval-gate]
    minutes: 6

  - id: choose-completion-evidence
    type: mcq
    prompt: { en: 'An agent says a parser fix is complete. Which record most strongly supports accepting it?', zh: '智能体声称解析器修复已经完成。哪份记录最能支持接受改动？' }
    options:
      - { text: { en: 'Host-captured commands, revisions, exit codes, a red-green regression result, and a reviewed in-scope diff', zh: '宿主捕获的命令、版本、退出码、红绿回归结果，以及审查过且范围合规的差异' }, correct: true }
      - { text: { en: 'A confident explanation that names the likely root cause', zh: '一份语气自信且指出可能根因的解释' }, correct: false }
      - { text: { en: 'A screenshot containing green terminal text without the command or status', zh: '一张只有绿色终端文字、没有命令或状态的截图' }, correct: false }
      - { text: { en: 'A type checker result with no evidence for runtime behavior', zh: '一份没有运行时行为证据的类型检查结果' }, correct: false }
    explanation: { en: 'Acceptance should derive from authenticated environment observations whose scope matches the claims. A summary, screenshot, or unrelated check cannot establish the whole result.', zh: '验收应依据经过验证、且作用范围与主张匹配的环境观察。摘要、截图或无关检查无法证明完整结果。' }
    difficulty: beginner
    tags: [verification, evidence, review]
    minutes: 2

  - id: review-generated-boundary-selector
    type: review
    title: { en: 'Review a generated boundary selector', zh: '审查生成的边界选择器' }
    prompt: { en: 'Review this generated task-routing code before it controls agent access.', zh: '在这段生成的任务路由代码控制智能体访问之前审查它。' }
    task: { en: 'Select human-led work whenever intent is unresolved, data is sensitive, or an effect is irreversible; select simple automation for a fully stable rule; otherwise permit an agent only with tests and a positive maximum of 20 steps.', zh: '意图未决、数据敏感或效果不可逆时选择人工主导；规则完全稳定时选择简单自动化；其他情况只有具备测试且最大步骤数为 1 至 20 时才允许智能体。' }
    code: |
      function chooseRunner(task) {
        let score = 0;
        if (task.intentSettled) score += 2;
        if (task.hasTests) score += 2;
        if (task.sensitive) score -= 1;
        if (task.irreversible) score -= 1;

        if (score >= 2) {
          return { method: "agent", maxSteps: task.maxSteps || 100 };
        }

        if (task.stableRule) {
          return { method: "agent", maxSteps: 100 };
        }

        return { method: "human-led", maxSteps: 0 };
      }

      const request = {
        intentSettled: true,
        hasTests: true,
        sensitive: true,
        irreversible: false,
        maxSteps: -5,
      };
    lang: javascript
    issues:
      - line: 5
        kind: security
        note: { en: 'Sensitive data subtracts only one point, so other signals can cancel the boundary and still grant agent access.', zh: '敏感数据只扣一分，因此其他信号可以抵消这条边界，最终仍授予智能体访问权。' }
      - line: 8
        kind: correctness
        note: { en: 'The score can reach two when intent is unresolved or an effect is irreversible, violating the required human-led rules.', zh: '意图未决或效果不可逆时，分数仍可能达到 2，违反必须人工主导的规则。' }
      - line: 9
        kind: edge-case
        note: { en: 'A negative maxSteps value is truthy and is returned unchanged, while zero or a value above 20 becomes or remains an invalid budget.', zh: '负数 maxSteps 是真值，会原样返回；零或大于 20 的值也会变成或保持无效预算。' }
      - line: 13
        kind: performance
        note: { en: 'A stable deterministic rule is routed to a 100-step agent instead of cheaper repeatable simple automation.', zh: '稳定的确定性规则被交给 100 步智能体，而不是成本更低且可重复的简单自动化。' }
    right: { en: 'The code centralizes the routing decision, returns a structured result, uses descriptive input names, and makes the human-led fallback visible.', zh: '代码集中处理路由决策，返回结构化结果，输入名称清楚，并明确保留了人工主导的兜底分支。' }
    checklist:
      - { en: 'Test each hard stop alone and in combination with favorable signals.', zh: '单独测试每条硬停止规则，并测试它与有利信号组合时的行为。' }
      - { en: 'Check stable rules route to deterministic automation before agent scoring.', zh: '确认稳定规则在智能体评分前就被路由到确定性自动化。' }
      - { en: 'Validate that maxSteps is an integer from 1 through 20.', zh: '验证 maxSteps 是 1 至 20 的整数。' }
      - { en: 'Make missing or unknown fields fail closed instead of inheriting permissive defaults.', zh: '让缺失或未知字段失败关闭，而不是继承宽松默认值。' }
    explanation: { en: 'Replace the weighted score with ordered hard stops, then a stable-rule branch, then a strictly validated agent branch. Unknown inputs should return human-led review with a reason.', zh: '应把加权分数替换为有序硬停止规则，再处理稳定规则分支，最后处理严格验证的智能体分支。未知输入应返回人工主导审查及原因。' }
    difficulty: intermediate
    tags: [code-review, hard-boundary, budget, task-routing]
    tests: node --check boundary_selector.js
    minutes: 9
