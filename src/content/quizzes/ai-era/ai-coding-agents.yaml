topic: ai-era/ai-coding-agents
items:
  - id: predict-observation-loop
    type: predict
    prompt: { en: 'What does this controller print?', zh: '这个控制器会输出什么？' }
    code: |
      transitions = {
          "start": "file read",
          "file read": "patch written",
          "patch written": "tests passed",
          "tests passed": "finish",
      }

      state = "start"
      while True:
          print(state)
          if state == "finish":
              break
          state = transitions[state]
    lang: python
    options:
      - { text: { en: 'start, file read, patch written, tests passed, finish', zh: 'start、file read、patch written、tests passed、finish' }, correct: true }
      - { text: { en: 'start, patch written, finish', zh: 'start、patch written、finish' }, correct: false }
      - { text: { en: 'The loop never stops', zh: '循环不会停止' }, correct: false }
    explanation: { en: 'Each observation indexes the next state, and finish is printed before the explicit break.', zh: '每条观察都会索引下一状态；打印 finish 后，显式 break 才会结束循环。' }
    difficulty: beginner
    tags: [agent-loop, observation, stop-condition]
    tests: python3 controller.py
    minutes: 3

  - id: choose-completion-evidence
    type: mcq
    prompt: { en: 'Which result is the strongest evidence that a bounded bug-fix task is complete?', zh: '对于范围明确的缺陷修复任务，哪项结果是最有力的完成证据？' }
    options:
      - { text: { en: 'The named regression test passes with exit code 0, the relevant suite passes, and the diff stays in scope', zh: '指定回归测试以退出码 0 通过，相关测试集通过，且差异未超出范围' }, correct: true }
      - { text: { en: 'The agent says it is confident and summarizes the intended behavior', zh: '智能体表示有信心，并概括了预期行为' }, correct: false }
      - { text: { en: 'The formatter exits successfully after rewriting the files', zh: '格式化工具重写文件后成功退出' }, correct: false }
      - { text: { en: 'The patch contains fewer lines than the original implementation', zh: '补丁行数少于原实现' }, correct: false }
    explanation: { en: 'Completion needs independent behavioral evidence plus a scope check. Confidence, formatting, and patch size do not establish correctness.', zh: '完成需要独立的行为证据和范围检查。信心、格式化结果与补丁大小都不能证明正确性。' }
    difficulty: beginner
    tags: [verification, evidence, acceptance-criteria]
    minutes: 2

  - id: spotbug-path-and-shell-policy
    type: spotbug
    prompt: { en: 'Find the security failures in this generated tool executor.', zh: '找出这个生成式工具执行器中的安全问题。' }
    code: |
      from pathlib import Path
      import subprocess

      WORKSPACE = Path("/srv/project")

      def read_file(raw_path: str) -> str:
          resolved = Path(raw_path).resolve()
          if not str(resolved).startswith(str(WORKSPACE.resolve())):
              raise PermissionError(raw_path)
          return resolved.read_text()

      def run(command: str) -> str:
          result = subprocess.run(
              command, shell=True, capture_output=True, text=True
          )
          return result.stdout
    lang: python
    issues:
      - line: 8
        kind: security
        note: { en: 'A string prefix is not path containment: /srv/project-secrets starts with /srv/project. Use a path-aware relative-to check after resolving.', zh: '字符串前缀不等于路径包含关系：/srv/project-secrets 也以 /srv/project 开头。解析后应使用路径感知的相对关系检查。' }
      - line: 14
        kind: security
        note: { en: 'Untrusted model text reaches a shell, so metacharacters can execute extra commands. Use a structured argument vector and a narrow allowlist.', zh: '不可信的模型文本直接进入 shell，元字符可以执行额外命令。应使用结构化参数数组和严格白名单。' }
      - line: 16
        kind: correctness
        note: { en: 'Returning stdout alone discards the exit code and stderr, so the controller can mistake a failed command for success.', zh: '只返回 stdout 会丢失退出码和 stderr，控制器可能把失败命令误判为成功。' }
    explanation: { en: 'The executor needs path-aware containment, shell-free structured commands, and a result object that preserves failure evidence.', zh: '执行器需要路径感知的范围检查、无需 shell 的结构化命令，以及保留失败证据的结果对象。' }
    difficulty: intermediate
    tags: [tool-execution, path-traversal, command-injection]
    minutes: 6

  - id: choose-approval-scope
    type: mcq
    prompt: { en: 'A task needs one networked package download. Which approval is safest?', zh: '一个任务需要联网下载一次依赖包。哪种批准方式最安全？' }
    options:
      - { text: { en: 'Approve that exact command, registry destination, working directory, and one invocation', zh: '只批准该次调用的确切命令、注册表目标和工作目录' }, correct: true }
      - { text: { en: 'Approve every future shell command because this task is trusted', zh: '因为信任该任务，批准之后所有 shell 命令' }, correct: false }
      - { text: { en: 'Allow unrestricted network access but keep file writes disabled', zh: '允许无限制联网，但禁用文件写入' }, correct: false }
      - { text: { en: 'Put a sentence in the prompt asking the model to be careful', zh: '在提示词中加入一句要求模型谨慎操作的话' }, correct: false }
    explanation: { en: 'A narrow, one-call approval grants only the capability the task currently needs. Prompt wording cannot enforce an operating-system boundary.', zh: '范围明确且只对一次调用有效的批准，只授予当前任务所需能力。提示词措辞无法强制建立操作系统边界。' }
    difficulty: intermediate
    tags: [approval-gate, least-privilege, network]
    minutes: 2

  - id: review-generated-agent-runner
    type: review
    prompt: { en: 'Review this generated coding-agent runner.', zh: '审查这个生成式编程智能体运行器。' }
    task: { en: 'Run an agent on one Python package, allow reviewed test commands, keep all writes inside the workspace, and report completion only when verification passes.', zh: '让智能体处理一个 Python 包，只允许运行经过审查的测试命令，把所有写入限制在工作区内，并且只在验证通过后报告完成。' }
    code: |
      from pathlib import Path
      import subprocess

      def run_agent(workspace: Path, goal: str, model):
          files = [path for path in workspace.rglob("*") if path.is_file()]
          context = "\n".join(path.read_text() for path in files)
          plan = model.generate(goal + "\n" + context)

          for step in plan.splitlines():
              if step.startswith("RUN "):
                  command = step.removeprefix("RUN ")
                  result = subprocess.run(command, shell=True, cwd=workspace)
                  print("command finished", result.returncode)
              elif step.startswith("WRITE "):
                  _, name, content = step.split(":", 2)
                  target = workspace / name
                  target.write_text(content)

          tests = subprocess.run(
              "python3 -m pytest", shell=True, cwd=workspace,
              capture_output=True, text=True,
          )
          return {"status": "done", "tests": tests.stdout}
    lang: python
    right: { en: 'The code gives the model a goal plus repository content, sets the command working directory, runs a final test command, and returns some test output.', zh: '代码向模型提供了目标和仓库内容，设置了命令工作目录，运行了最终测试命令，并返回了一部分测试输出。' }
    checklist:
      - { en: 'Bound context collection by path, file type, size, and sensitivity.', zh: '按路径、文件类型、大小和敏感性限制上下文收集。' }
      - { en: 'Validate every tool and argument before any side effect.', zh: '产生副作用前验证每个工具及其参数。' }
      - { en: 'Exercise malformed actions, denied actions, failures, timeouts, and cancellation.', zh: '测试格式错误、被拒绝、失败、超时和取消等操作路径。' }
      - { en: 'Derive completion from exit status, required checks, and diff scope.', zh: '根据退出状态、必需检查和差异范围判断是否完成。' }
    issues:
      - line: 6
        kind: performance
        note: { en: 'Reading every file eagerly is unbounded and may load dependencies, binaries, or large generated artifacts before the model does any targeted search.', zh: '无界地预读每个文件，可能在模型执行定向搜索前就加载依赖、二进制文件或大型生成物。' }
      - line: 12
        kind: security
        note: { en: 'A model-authored command executes through a shell without an argument policy or approval gate.', zh: '模型生成的命令未经参数策略或审批门检查就通过 shell 执行。' }
      - line: 15
        kind: edge-case
        note: { en: 'One malformed WRITE line raises during ad hoc parsing; there is no structured schema, error result, or recovery path.', zh: '一条格式错误的 WRITE 行会在临时解析时抛出异常；代码没有结构化模式、错误结果或恢复路径。' }
      - line: 23
        kind: correctness
        note: { en: 'The runner always reports done and discards stderr even when pytest exits nonzero, so failure is presented as completion.', zh: '即使 pytest 以非零状态退出，运行器仍始终报告 done 并丢弃 stderr，因而把失败表示为完成。' }
    explanation: { en: 'Use targeted retrieval, typed tool calls, path-aware write containment, a narrow command policy, and structured results. The final state must depend on the test exit code and required evidence.', zh: '应使用定向检索、带类型的工具调用、路径感知的写入范围、严格命令策略和结构化结果。最终状态必须取决于测试退出码和必需证据。' }
    difficulty: advanced
    tags: [code-review, agent-runner, verification, security]
    tests: python3 -m py_compile agent_runner.py
    minutes: 12
