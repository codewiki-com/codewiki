topic: ai-era/agent-task-planning
items:
  - id: predict-checkpoint-runner
    type: predict
    prompt: { en: 'What does this checkpoint controller print?', zh: '这个检查点控制器会输出什么？' }
    code: |
      const results = [
        { id: "reproduce", exitCode: 1, expected: 1 },
        { id: "implement", exitCode: 0, expected: 0 },
        { id: "verify", exitCode: 2, expected: 0 },
      ];

      for (const result of results) {
        if (result.exitCode !== result.expected) {
          console.log(`STOP ${result.id}`);
          break;
        }
        console.log(`PASS ${result.id}`);
      }
    lang: javascript
    options:
      - { text: { en: "PASS reproduce\nPASS implement\nSTOP verify", zh: "PASS reproduce\nPASS implement\nSTOP verify" }, correct: true }
      - { text: { en: "STOP reproduce", zh: "STOP reproduce" }, correct: false }
      - { text: { en: "PASS reproduce\nPASS implement\nPASS verify", zh: "PASS reproduce\nPASS implement\nPASS verify" }, correct: false }
      - { text: { en: "PASS implement\nSTOP verify", zh: "PASS implement\nSTOP verify" }, correct: false }
    explanation: { en: 'The reproduction checkpoint expects exit code 1, so it passes. Verification expects 0 but receives 2, which stops the controller.', zh: '复现检查点预期退出码为1，因此通过。验证步骤预期为0，却收到2，所以控制器在此停止。' }
    difficulty: beginner
    tags: [checkpoint, expected-result, stop-condition]
    tests: node checkpoint_quiz.js
    minutes: 3

  - id: choose-inspectable-step
    type: mcq
    prompt: { en: 'Which step is most useful in an executable agent plan for an expired-session bug?', zh: '针对会话过期缺陷，哪一个步骤最适合放进可执行的智能体计划？' }
    options:
      - { text: { en: 'Add a regression case in test/session.test.js and checkpoint the expected pre-fix status 200', zh: '在test/session.test.js中添加回归用例，并以修复前预期得到状态码200作为检查点' }, correct: true }
      - { text: { en: 'Analyze the authentication system thoroughly', zh: '全面分析认证系统' }, correct: false }
      - { text: { en: 'Make all necessary improvements and ensure quality', zh: '完成所有必要改进并保证质量' }, correct: false }
      - { text: { en: 'Keep editing until the agent believes the issue is solved', zh: '继续编辑，直到智能体认为问题已经解决' }, correct: false }
    explanation: { en: 'The first option bounds the write, names the artifact, and defines observable evidence. The other options have no decidable checkpoint or stopping rule.', zh: '第一项限制了写入范围，指明产物并定义了可观察证据；其他选项都没有可判定的检查点或停止规则。' }
    difficulty: beginner
    tags: [task-decomposition, checkpoint, scope]
    minutes: 2

  - id: spotbug-premature-completion
    title: { en: 'Spot the bug in checkpoint recording', zh: '找出检查点记录里的bug' }
    type: spotbug
    prompt: { en: 'Find the completion-evidence bugs in this generated checkpoint recorder.', zh: '找出这个生成式检查点记录器中的完成证据错误。' }
    code: |
      function finishStep(step, result, plan) {
        plan.completed.push(step.id);
        step.status = "passed";

        if (result.stdout.includes("PASS")) {
          return true;
        }
        return result.exitCode === 0;
      }
    lang: javascript
    issues:
      - line: 2
        kind: correctness
        note: { en: 'The step enters the completed dependency set before its checkpoint is evaluated, so later work may unlock after a failed tool result.', zh: '步骤在检查点求值前就进入完成依赖集合，因此工具结果失败后，后续工作仍可能被解锁。' }
      - line: 3
        kind: correctness
        note: { en: 'Status is set to passed unconditionally and is not reverted on either false return path.', zh: '状态被无条件设为passed，而且在两个返回false的路径上都不会恢复。' }
      - line: 5
        kind: edge-case
        note: { en: 'Substring matching accepts text such as NOT PASS and ignores which check was expected, its exit status, and output truncation.', zh: '子串匹配会接受NOT PASS等文本，也忽略预期检查、退出状态与输出截断。' }
      - line: 8
        kind: correctness
        note: { en: 'Exit code 0 alone does not prove the step-specific checkpoint; a command can succeed without producing the required state.', zh: '退出码0本身不能证明步骤专属检查点成立；命令可以成功结束，却没有产生必需状态。' }
    explanation: { en: 'Evaluate a typed checkpoint from complete process evidence first. Only after it passes should the controller record the step as passed and unlock dependents.', zh: '应先根据完整进程证据求值带类型的检查点。只有通过后，控制器才能把步骤记为passed并解锁依赖项。' }
    difficulty: intermediate
    tags: [completion, evidence, checkpoint]
    tests: node --check checkpoint_recorder.js
    minutes: 6

  - id: choose-replanning-boundary
    type: mcq
    prompt: { en: 'An agent discovers that the repair needs a database migration, which the task contract excludes. What should its plan do?', zh: '智能体发现修复需要数据库迁移，但任务合同明确排除了迁移。计划应怎样处理？' }
    options:
      - { text: { en: 'Pause with the evidence and request approval for the smallest explicit scope change', zh: '带着证据暂停，并为最小且明确的范围变化请求批准' }, correct: true }
      - { text: { en: 'Add the migration steps silently because replanning permits scope changes', zh: '静默加入迁移步骤，因为重新规划允许改变范围' }, correct: false }
      - { text: { en: 'Mark the original task complete because its current plan cannot continue', zh: '因为当前计划无法继续，所以把原任务标记为完成' }, correct: false }
      - { text: { en: 'Delete the failing acceptance check and continue inside the old scope', zh: '删除失败的验收检查，并在原范围内继续' }, correct: false }
    explanation: { en: 'New evidence may change the route but cannot grant new authority. A migration changes the envelope and needs an approval decision.', zh: '新证据可以改变路线，却不能授予新权限。数据库迁移改变了执行范围，需要经过批准决定。' }
    difficulty: intermediate
    tags: [replanning, approval-gate, scope]
    minutes: 3

  - id: choose-no-progress-rule
    type: mcq
    prompt: { en: 'Which rule best detects that an agent repair loop is no longer making progress?', zh: '哪条规则最适合判断智能体修复循环已经没有进展？' }
    options:
      - { text: { en: 'Stop after the same normalized failure, changed-path set, and proposed action repeat twice without new evidence', zh: '规范化失败、修改路径集合和拟议操作在没有新证据时重复两次，就停止运行' }, correct: true }
      - { text: { en: 'Continue whenever the agent can phrase a different explanation', zh: '只要智能体能换一种解释方式，就继续运行' }, correct: false }
      - { text: { en: 'Stop after exactly one tool call, whether it succeeds or fails', zh: '无论成功还是失败，恰好调用一次工具后就停止' }, correct: false }
      - { text: { en: 'Continue until the token budget is completely exhausted', zh: '持续运行，直到token预算完全耗尽' }, correct: false }
    explanation: { en: 'A progress rule should compare observable state, not prose variation. Repeated equivalent evidence gives a finite and reviewable stop condition.', zh: '进展规则应比较可观察状态，而不是措辞变化。等价证据反复出现，可以形成有限且可审查的停止条件。' }
    difficulty: intermediate
    tags: [no-progress, retry, stopping-condition]
    minutes: 3

  - id: review-generated-plan-executor
    type: review
    title: { en: 'Review a generated plan executor', zh: '审查生成的计划执行器' }
    prompt: { en: 'Review this generated executor before it controls a coding agent.', zh: '在这段生成式执行器控制编程智能体前，对它进行审查。' }
    task: { en: 'Execute a dependency-aware plan using fixed argument arrays inside one workspace, accept only step-specific checkpoint evidence, avoid unnecessary dependency scans, and report completion only when every required step passes.', zh: '在一个工作区内使用固定参数数组执行有依赖关系的计划，只接受步骤专属的检查点证据，避免不必要的依赖扫描，并且仅在所有必需步骤通过后报告完成。' }
    code: |
      import { exec } from "node:child_process";
      import { promisify } from "node:util";

      const execAsync = promisify(exec);

      export async function executePlan(plan) {
        let allPassed = true;

        for (const step of plan.steps) {
          const blocked = step.needs.some(
            (id) => !plan.steps.find((candidate) => candidate.id === id)?.done,
          );
          if (blocked) continue;

          const { stdout } = await execAsync(step.command, { cwd: plan.workspace });
          if (stdout.includes(step.expectedText)) {
            step.done = true;
          } else {
            allPassed = false;
          }
        }

        return { complete: allPassed, steps: plan.steps };
      }
    lang: javascript
    issues:
      - line: 11
        kind: performance
        note: { en: 'Scanning the complete step array for every dependency makes readiness checking quadratic on large plans; index step states by id once.', zh: '每项依赖都扫描完整步骤数组，会让大型计划的就绪检查达到二次复杂度；应先按id建立一次状态索引。' }
      - line: 13
        kind: edge-case
        note: { en: 'Blocked steps are silently skipped without making allPassed false, so missing dependencies or a cycle can return complete: true.', zh: '受阻步骤被静默跳过，却没有把allPassed设为false，因此缺失依赖或依赖环可能返回complete: true。' }
      - line: 15
        kind: security
        note: { en: 'Model-provided command text reaches a shell through exec. Use a reviewed executable and argument array with a fixed workspace and policy.', zh: '模型提供的命令文本通过exec进入shell。应使用经过审查的可执行文件与参数数组，并固定工作区和策略。' }
      - line: 16
        kind: correctness
        note: { en: 'A stdout substring can match unrelated or negated text and discards exit status, stderr, expected-failure semantics, and truncation state.', zh: 'stdout子串可能匹配无关或否定文本，还会丢弃退出状态、stderr、预期失败语义和截断状态。' }
    right: { en: 'The executor keeps dependency declarations on each step, runs from an explicit workspace, awaits one step before using its result, and returns step state for review.', zh: '执行器把依赖声明保存在各步骤上，使用显式工作区，等待每一步结束后再使用结果，并返回步骤状态供审查。' }
    checklist:
      - { en: 'Validate unique ids, dependency existence, acyclicity, and the required-step set before execution.', zh: '执行前验证id唯一、依赖存在、无环，并确认必需步骤集合。' }
      - { en: 'Use fixed executable arguments and preserve exit code, stderr, timeout, and truncation evidence.', zh: '使用固定的可执行参数，并保留退出码、stderr、超时和截断证据。' }
      - { en: 'Index dependency states and refuse completion while any required step is blocked, failed, paused, or stale.', zh: '索引依赖状态；任何必需步骤受阻、失败、暂停或过时时，都不得完成。' }
      - { en: 'Evaluate each typed checkpoint before marking the step passed or unlocking dependents.', zh: '把步骤标记为通过或解锁依赖项前，先求值该步骤带类型的检查点。' }
    explanation: { en: 'The loop shape is understandable, but it conflates shell output with checkpoint evidence and skipped work with success. Validate the graph, use structured execution, and derive completion from every current required checkpoint.', zh: '这段循环的形状容易理解，但它把shell输出等同于检查点证据，又把跳过工作等同于成功。应验证依赖图、使用结构化执行，并根据所有当前必需检查点推导完成状态。' }
    difficulty: advanced
    tags: [code-review, plan-execution, dependencies, verification]
    tests: node --check plan_executor.js
    minutes: 10
