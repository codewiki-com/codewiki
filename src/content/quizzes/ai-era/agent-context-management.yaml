topic: ai-era/agent-context-management
items:
  - id: predict-context-priority
    type: predict
    prompt: { en: 'What does this bounded context selector print?', zh: '这个有限上下文选择器会输出什么？' }
    code: |
      const candidates = [
        { path: "README.md", priority: 5 },
        { path: "src/cart.js", priority: 2 },
        { path: "AGENTS.md", priority: 0 },
        { path: "tests/cart.test.js", priority: 1 },
      ];

      const selected = candidates
        .sort((left, right) => left.priority - right.priority)
        .slice(0, 3)
        .map((item) => item.path);

      console.log(selected.join(" -> "));
    lang: javascript
    options:
      - { text: { en: 'AGENTS.md -> tests/cart.test.js -> src/cart.js', zh: 'AGENTS.md -> tests/cart.test.js -> src/cart.js' }, correct: true }
      - { text: { en: 'README.md -> src/cart.js -> AGENTS.md', zh: 'README.md -> src/cart.js -> AGENTS.md' }, correct: false }
      - { text: { en: 'tests/cart.test.js -> src/cart.js -> README.md', zh: 'tests/cart.test.js -> src/cart.js -> README.md' }, correct: false }
      - { text: { en: 'All four paths in their original order', zh: '按原顺序输出全部四条路径' }, correct: false }
    explanation: { en: 'The array is sorted by ascending priority before the first three paths are selected.', zh: '数组先按优先级升序排序，再选择前三条路径。' }
    difficulty: beginner
    tags: [context-manifest, selection, priority]
    tests: node context_priority.js
    minutes: 3

  - id: choose-authoritative-refresh
    type: mcq
    prompt: { en: 'An indexed excerpt and the current file disagree just before an edit. What should the agent do?', zh: '编辑前，索引片段与当前文件不一致。智能体应怎样处理？' }
    options:
      - { text: { en: 'Treat the index as a locator, reread the file and applicable contract, then recompute the edit', zh: '把索引当作定位信息，重新读取文件与适用契约，再重新计算编辑' }, correct: true }
      - { text: { en: 'Use the indexed excerpt because retrieval ranked it highly', zh: '使用索引片段，因为检索结果给了它很高排名' }, correct: false }
      - { text: { en: 'Combine both versions line by line so neither is lost', zh: '逐行合并两个版本，以免丢失任何内容' }, correct: false }
      - { text: { en: 'Ask the model which version looks more idiomatic', zh: '让模型判断哪个版本看起来更符合惯用写法' }, correct: false }
    explanation: { en: 'Retrieval proposes a candidate; the current authoritative source and its contract must control an edit. A mismatch invalidates reasoning based on the old excerpt.', zh: '检索只提供候选项；编辑必须以当前权威来源及其契约为准。不一致意味着基于旧片段的推理已经失效。' }
    difficulty: beginner
    tags: [freshness, retrieval, source-of-truth]
    minutes: 2

  - id: spotbug-unbounded-context
    title: { en: 'Spot the bug in context collection', zh: '找出上下文收集里的bug' }
    type: spotbug
    prompt: { en: 'Find the context-selection failures in this generated collector.', zh: '找出这个生成式上下文收集器的选择缺陷。' }
    code: |
      const files = [
        { path: ".env", text: "TOKEN=demo-secret" },
        { path: "dist/app.js", text: "generated bundle" },
        { path: "src/cart.js", text: "export function total() {}" },
      ];

      function buildContext(entries) {
        return entries
          .map((file) => `## ${file.path}\n${file.text}`)
          .join("\n\n");
      }

      console.log(buildContext(files));
    lang: javascript
    issues:
      - line: 2
        kind: security
        note: { en: 'The collector admits a credential file and copies its value into model context. Sensitive paths and values need exclusion or redaction at acquisition.', zh: '收集器把凭据文件及其值复制进模型上下文。敏感路径和值应在取得时排除或脱敏。' }
      - line: 3
        kind: correctness
        note: { en: 'The generated bundle is treated like an editable source of truth; the collector should locate its generation input unless the artifact itself is the explicit subject.', zh: '生成的bundle被当成可编辑事实来源；除非任务明确针对产物，否则应定位它的生成输入。' }
      - line: 8
        kind: performance
        note: { en: 'Every entry is concatenated with no size budget, role, or relevance filter, so large inputs can crowd out constraints and failure evidence.', zh: '所有条目都在没有大小预算、角色或相关性过滤的情况下拼接，大型输入可能挤掉约束和失败证据。' }
    explanation: { en: 'A safe collector excludes secrets and derived noise by default, applies a capacity bound, and records why each admitted source is relevant.', zh: '安全的收集器默认排除秘密与派生噪声，设置容量边界，并记录每个来源为何相关。' }
    difficulty: intermediate
    tags: [secret-exposure, generated-files, context-budget]
    tests: node unbounded_context.js
    minutes: 6

  - id: choose-dependency-expansion
    type: mcq
    prompt: { en: 'A test fails in `checkout()`, and the assertion concerns jurisdiction rounding. Which expansion is best?', zh: '`checkout()`的测试失败，断言涉及管辖区舍入。哪种扩展方式最好？' }
    options:
      - { text: { en: 'Trace from the test to `checkout()`, its tax dependency, jurisdiction configuration, and relevant callers and tests', zh: '从测试追踪到`checkout()`、税费依赖、管辖区配置，以及相关调用方与测试' }, correct: true }
      - { text: { en: 'Load every file whose name contains `checkout` and stop there', zh: '加载文件名包含`checkout`的所有文件，然后停止' }, correct: false }
      - { text: { en: 'Read only the assertion because it already describes the expected value', zh: '只读取断言，因为它已经描述了预期值' }, correct: false }
      - { text: { en: 'Load the largest source files first because they contain more context', zh: '先加载最大的源文件，因为其中上下文更多' }, correct: false }
    explanation: { en: 'The failure gives a concrete question, so expansion should follow the runtime relationship that can answer it in both dependency directions.', zh: '失败信息提出了具体问题，因此应沿能够回答它的运行时关系双向扩展依赖。' }
    difficulty: beginner
    tags: [dependency-edge, call-site, context-expansion]
    minutes: 2

  - id: choose-safe-compaction
    type: mcq
    prompt: { en: 'Which information should survive context compaction in a long agent session?', zh: '长时间智能体会话压缩上下文时，哪些信息应当保留？' }
    options:
      - { text: { en: 'Exact acceptance criteria, active scope and permissions, changed files, unresolved assumptions, and references to raw evidence', zh: '确切验收条件、当前范围与权限、已改文件、未解决假设和原始证据引用' }, correct: true }
      - { text: { en: 'Only the model’s latest narrative summary', zh: '只保留模型最新的叙述性摘要' }, correct: false }
      - { text: { en: 'Every repeated search listing, but no failed-command output', zh: '保留每份重复搜索列表，但不保留失败命令输出' }, correct: false }
      - { text: { en: 'Only files that already changed, because constraints no longer matter', zh: '只保留已经修改的文件，因为约束已不再重要' }, correct: false }
    explanation: { en: 'Compaction may remove superseded exploration, but it must preserve the facts that govern later actions and the provenance needed to reacquire evidence.', zh: '压缩可以移除已经被取代的探索，但必须保留约束后续操作的事实，以及重新取得证据所需的来源信息。' }
    difficulty: intermediate
    tags: [compaction, provenance, handoff]
    minutes: 2

  - id: review-generated-context-loader
    type: review
    title: { en: 'Review a generated context loader', zh: '审查生成的上下文加载器' }
    prompt: { en: 'Review this generated loader before it supplies repository context to an agent.', zh: '在这个生成式加载器向智能体提供仓库上下文前审查它。' }
    task: { en: 'Load requested UTF-8 source files from one workspace, reject invalid budgets, keep reads inside the workspace, include only complete sections that fit, and return truthful freshness metadata.', zh: '从一个工作区加载所请求的UTF-8源文件，拒绝非法预算，保证读取不越界，只纳入能够完整容纳的分段，并返回真实的新鲜度元数据。' }
    code: |
      import { readFile } from "node:fs/promises";

      export async function buildContext(
        workspace,
        requested,
        maxCharacters,
      ) {
        const included = [];
        let text = "";

        for (const name of requested) {
          const source = await readFile(`${workspace}/${name}`, "utf8");
          included.push(name);
          text += `\n## ${name}\n${source}`;
        }

        const clipped = text.slice(0, maxCharacters);
        return { text: clipped, files: included, fresh: true };
      }
    lang: javascript
    issues:
      - line: 12
        kind: security
        note: { en: 'String concatenation accepts absolute paths, `..` segments, and symlink escapes. Resolve each candidate and prove path-aware containment before reading.', zh: '字符串拼接会接受绝对路径、`..`路径段和符号链接逃逸。读取前应解析候选路径，并以路径感知方式证明其位于工作区内。' }
      - line: 12
        kind: performance
        note: { en: 'Every file is read in full before the character budget is considered, including files after the context is already full.', zh: '字符预算生效前，每个文件都会被完整读取，包括上下文已满后才遍历到的文件。' }
      - line: 13
        lines: 6
        kind: correctness
        note: { en: 'Metadata is fabricated: every requested name is reported even when clipping removes its section, and freshness is always true without checking a revision or digest.', zh: '元数据并不真实：即使裁剪删除某个分段，所有请求名称仍会被报告，而且没有检查版本或摘要值就始终声称内容新鲜。' }
      - line: 17
        kind: edge-case
        note: { en: 'A negative budget is accepted as a slice endpoint instead of being rejected, producing surprising partial context.', zh: '负数预算会被当成切片终点而不是被拒绝，从而产生意外的部分上下文。' }
    right: { en: 'The function decodes files explicitly as UTF-8, preserves request order, and returns context plus a separate file list.', zh: '函数明确使用UTF-8解码文件，保留请求顺序，并分别返回上下文与文件列表。' }
    checklist:
      - { en: 'Validate the budget and resolve every path before any read.', zh: '进行任何读取前，先验证预算并解析每条路径。' }
      - { en: 'Stop at capacity without reading unnecessary files or splitting a section.', zh: '达到容量后停止，不读取无用文件，也不截断分段。' }
      - { en: 'Make returned file metadata match only complete admitted sections.', zh: '确保返回的文件元数据只对应完整纳入的分段。' }
      - { en: 'Derive freshness from a revision or digest instead of a constant.', zh: '根据版本或摘要值推导新鲜度，不能使用常量。' }
    explanation: { en: 'Validate containment and capacity first, build one complete section at a time, and return provenance that describes the content actually admitted. A constant freshness claim is not evidence.', zh: '先验证路径范围和容量，再逐个构建完整分段，并返回能够描述实际纳入内容的来源信息。固定的新鲜度声明不是证据。' }
    difficulty: intermediate
    tags: [code-review, path-containment, context-budget, freshness]
    tests: node --check context_loader.js
    minutes: 10
