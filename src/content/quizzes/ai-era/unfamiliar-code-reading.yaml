topic: ai-era/unfamiliar-code-reading
items:
  - id: predict-invalid-order-path
    type: predict
    prompt: { en: 'What does this focused data-flow trace print?', zh: '这段聚焦的数据流跟踪会输出什么？' }
    code: |
      const effects = [];

      function submit(input) {
        const cents = Math.round(Number(input.amount) * 100);
        effects.push(`normalized:${cents}`);
        if (!Number.isSafeInteger(cents) || cents < 0) {
          return "rejected";
        }
        effects.push(`charge:${cents}`);
        return "accepted";
      }

      console.log(submit({ amount: "-1.00" }));
      console.log(effects.join(","));
    lang: js
    options:
      - { text: { en: 'rejected, then normalized:-100', zh: '先输出 rejected，再输出 normalized:-100' }, correct: true }
      - { text: { en: 'rejected, then normalized:-100,charge:-100', zh: '先输出 rejected，再输出 normalized:-100,charge:-100' }, correct: false }
      - { text: { en: 'accepted, then charge:-100', zh: '先输出 accepted，再输出 charge:-100' }, correct: false }
    explanation: { en: 'Normalization is recorded before the guard. The negative value then returns rejected, so execution never reaches the charge effect.', zh: '规范化记录发生在守卫之前。负数随后触发 rejected 返回，因此执行不会到达扣款副作用。' }
    difficulty: beginner
    tags: [data-flow, branch, side-effects]
    tests: node predict_invalid_order.js
    minutes: 3

  - id: choose-first-entry-point-evidence
    type: mcq
    prompt: { en: 'You need to learn what handles POST /orders in production. Which evidence is the strongest starting point?', zh: '你需要确定生产环境由什么处理 POST /orders。哪项证据最适合作为起点？' }
    options:
      - { text: { en: 'The active route registration plus the production construction root', zh: '当前路由注册与生产环境组合根' }, correct: true }
      - { text: { en: 'A file named order-service.js with a matching function name', zh: '名为 order-service.js 且包含同名函数的文件' }, correct: false }
      - { text: { en: 'A generated summary that calls one module the main handler', zh: '把某个模块称为主处理器的生成式摘要' }, correct: false }
      - { text: { en: 'The longest order-related test file', zh: '最长的订单相关测试文件' }, correct: false }
    explanation: { en: 'Registration establishes the executable edge, while the construction root shows which concrete dependencies production selects. Names and tests alone do not prove production wiring.', zh: '注册代码确定可执行边，组合根则说明生产环境选择了哪些具体依赖。名称和测试本身不能证明生产接线关系。' }
    difficulty: beginner
    tags: [entry-point, configuration, evidence]
    minutes: 2

  - id: spotbug-generated-order-explanation
    title: { en: 'Spot the bug in the order handler', zh: '找出订单处理器里的 bug' }
    type: spotbug
    prompt: { en: 'Find the trust, data-lineage, and effect-order bugs a generated explanation could miss.', zh: '找出生成式解释可能漏掉的信任、数据传递和副作用顺序问题。' }
    code: |
      let lastTenant = "";

      export function handleOrder(request, dependencies) {
        const input = JSON.parse(request.body);
        lastTenant = request.headers["x-tenant"];
        const totalCents = input.items.reduce(
          (sum, item) => sum + item.priceCents * item.quantity,
          0,
        );
        dependencies.payments.charge(lastTenant, totalCents);
        dependencies.events.publish({ type: "OrderPaid", id: input.id });
        dependencies.orders.save({ ...input, tenant: lastTenant, totalCents });
        return { status: 201, id: input.id };
      }
    lang: js
    issues:
      - line: 5
        kind: security
        note: { en: 'The unvalidated request header becomes the tenant authority. Authentication context must supply and authorize the tenant instead.', zh: '未经校验的请求头被当作租户权限依据。租户应来自身份认证上下文，并经过授权检查。' }
      - line: 7
        kind: correctness
        note: { en: 'The charge total trusts client-supplied prices rather than prices from an authoritative catalog, so the data lineage crosses the trust boundary unchecked.', zh: '扣款总额信任客户端提供的价格，而不是权威商品目录；数据在未经检查时跨过了信任边界。' }
      - line: 11
        kind: edge-case
        note: { en: 'The paid event is published before the order is saved. A later save failure leaves consumers observing an order that does not exist.', zh: '付款事件在订单保存前发布。若后续保存失败，消费者会观察到一笔不存在的订单。' }
    explanation: { en: 'A useful model must trace authority and price fields to their sources and list effects in order. Reading only the success response hides all three failures.', zh: '实用模型必须追踪权限与价格字段的来源，并按顺序列出副作用。只阅读成功响应会漏掉这三个问题。' }
    difficulty: intermediate
    tags: [trust-boundary, data-lineage, effect-order]
    tests: node --check generated_order_handler.js
    minutes: 7

  - id: choose-invariant-evidence
    type: mcq
    prompt: { en: 'A comment says order cancellation is idempotent. What is the best next check?', zh: '注释声称订单取消操作具有幂等性。下一步最佳检查是什么？' }
    options:
      - { text: { en: 'Call cancellation twice on the same paid order and assert the state plus refund and event counts', zh: '对同一个已付款订单调用两次取消，并断言状态、退款次数和事件次数' }, correct: true }
      - { text: { en: 'Search for the word idempotent in more comments', zh: '在更多注释中搜索 idempotent 一词' }, correct: false }
      - { text: { en: 'Confirm the cancellation function returns the same object type', zh: '确认取消函数返回相同的对象类型' }, correct: false }
      - { text: { en: 'Ask the model to restate why idempotency is desirable', zh: '让模型重新说明为什么幂等性值得采用' }, correct: false }
    explanation: { en: 'Idempotency concerns observable results across repeated operations. The test must inspect both state and effects because an unchanged return can still hide a duplicate refund or event.', zh: '幂等性关注重复操作后的可观察结果。测试必须同时检查状态与副作用，因为返回值不变时仍可能隐藏重复退款或事件。' }
    difficulty: beginner
    tags: [invariant, idempotency, characterization-test]
    minutes: 2

  - id: choose-claim-wording
    type: mcq
    prompt: { en: 'A repository search finds no retry code in the order service package. Which conclusion is justified?', zh: '代码库搜索没有在订单服务包中找到重试代码。哪项结论是合理的？' }
    options:
      - { text: { en: 'No retry was found in the searched package and terms; adapters and infrastructure remain unknown', zh: '在已搜索的软件包与关键词范围内未发现重试；适配器和基础设施仍属未知' }, correct: true }
      - { text: { en: 'The production system never retries order work', zh: '生产系统从不重试订单工作' }, correct: false }
      - { text: { en: 'Retries are impossible because the handler has no loop', zh: '处理器没有循环，因此不可能重试' }, correct: false }
      - { text: { en: 'The missing search result proves the operation is idempotent', zh: '搜索结果为空，证明该操作具有幂等性' }, correct: false }
    explanation: { en: 'A negative search result is bounded by its locations and vocabulary. Retry policy may live in a bound adapter, framework, queue, or infrastructure configuration.', zh: '否定搜索结果受搜索位置和词汇限制。重试策略可能位于绑定适配器、框架、队列或基础设施配置中。' }
    difficulty: intermediate
    tags: [negative-evidence, uncertainty, search]
    minutes: 2

  - id: review-generated-cancellation-handler
    type: review
    title: { en: 'Review a generated cancellation handler', zh: '审查生成式取消处理器' }
    prompt: { en: 'Review this generated code using entry-point, data-lineage, side-effect, and invariant evidence.', zh: '请从入口、数据传递、副作用和不变量证据出发，审查这段生成式代码。' }
    task: { en: 'Cancel an authenticated tenant''s paid order at most once, refund the persisted paid amount, save the cancelled state before publishing, and invalidate only that order''s cache entry.', zh: '取消已认证租户的一笔已付款订单，且最多取消一次；按持久化的已付款金额退款，先保存取消状态再发布事件，并且只让该订单的缓存项失效。' }
    code: |
      export async function cancelOrder(request, dependencies) {
        const order = await dependencies.orders.find(request.params.id);
        if (!order) return { status: 404 };

        const tenantId = request.headers["x-tenant"];
        if (order.status === "cancelled") return { status: 200, body: order };

        const refund = await dependencies.payments.refund(
          order.chargeId,
          Number(request.body.paidCents),
        );
        order.status = "cancelled";
        order.refundId = refund.id;

        await dependencies.events.publish({ type: "OrderCancelled", order });
        await dependencies.orders.save(order);

        const keys = await dependencies.cache.keys("*");
        for (const key of keys) {
          if (key.endsWith(order.id)) await dependencies.cache.delete(key);
        }

        return { status: 200, body: order, tenantId };
      }
    lang: js
    right: { en: 'The handler awaits its dependencies, handles a missing order, avoids a second refund after the state is cancelled, and records the refund identifier on the order.', zh: '处理器会等待依赖完成，处理订单不存在的情况，避免已取消状态下再次退款，并把退款标识符记录到订单中。' }
    checklist:
      - { en: 'Prove the authenticated tenant owns the loaded order before any state or money change.', zh: '在修改状态或金额前，证明已认证租户拥有加载的订单。' }
      - { en: 'Trace the refund amount to persisted trusted state and enforce the paid-to-cancelled transition.', zh: '把退款金额追踪到可信的持久化状态，并强制执行从已付款到已取消的转换。' }
      - { en: 'List save, publish, and cache effects in order, including failure outcomes.', zh: '按顺序列出保存、发布与缓存副作用，并包含失败结果。' }
      - { en: 'Exercise missing, already-cancelled, wrong-tenant, refund-failure, and save-failure paths.', zh: '覆盖订单缺失、已取消、租户错误、退款失败和保存失败路径。' }
    issues:
      - line: 2
        kind: security
        note: { en: 'The lookup uses only an order ID, and tenantId is never compared with order ownership. Another tenant can discover and refund the order.', zh: '查询只使用订单 ID，而且 tenantId 从未与订单所有者比较。其他租户可能发现并退款这笔订单。' }
      - line: 8
        kind: correctness
        note: { en: 'Every non-cancelled state reaches refund, and the amount comes from the request instead of order.paidCents. Enforce paid status and use persisted money data.', zh: '任何未取消状态都会进入退款，而且金额来自请求而不是 order.paidCents。应强制要求已付款状态，并使用持久化金额。' }
      - line: 15
        kind: edge-case
        note: { en: 'Publishing before save lets consumers observe cancellation when persistence later fails. Persist first and use a defined publication recovery mechanism.', zh: '先发布再保存，会让消费者在后续持久化失败时仍观察到取消事件。应先持久化，并采用明确的发布恢复机制。' }
      - line: 18
        kind: performance
        note: { en: 'Scanning every cache key is unbounded and crosses tenant scope. Construct and delete the one tenant-and-order cache key directly.', zh: '扫描全部缓存键没有边界，还会跨越租户范围。应直接构造并删除这一租户与订单对应的缓存键。' }
    explanation: { en: 'The code has a readable happy path, but its trusted data, state-transition guard, effect order, and cache scope do not satisfy the task. Focused failure tests would expose each gap.', zh: '代码的正常路径清楚，但可信数据、状态转换守卫、副作用顺序和缓存范围均不满足任务。聚焦失败测试可以逐一暴露这些缺口。' }
    difficulty: advanced
    tags: [code-review, authorization, effect-order, invariants]
    tests: node --check generated_cancellation.js
    minutes: 12
