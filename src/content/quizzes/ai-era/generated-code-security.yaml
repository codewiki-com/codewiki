topic: ai-era/generated-code-security
items:
  - id: predict-cross-tenant-invoice
    type: predict
    prompt: { en: 'What does this object-level authorization check print for the cross-tenant request?', zh: '这个对象级授权检查会为跨租户请求输出什么？' }
    code: |
      const invoices = new Map([
        ["inv-a", { id: "inv-a", tenantId: "tenant-a" }],
        ["inv-b", { id: "inv-b", tenantId: "tenant-b" }],
      ]);

      function readInvoice(principal, invoiceId) {
        if (!principal.scopes.includes("invoices:read")) {
          return { status: 403, body: "forbidden" };
        }
        const invoice = invoices.get(invoiceId);
        if (!invoice || invoice.tenantId !== principal.tenantId) {
          return { status: 404, body: "not found" };
        }
        return { status: 200, body: invoice.id };
      }

      const reader = { tenantId: "tenant-a", scopes: ["invoices:read"] };
      const result = readInvoice(reader, "inv-b");
      console.log(`${result.status} ${result.body}`);
    lang: js
    options:
      - { text: { en: '404 not found', zh: '404 not found' }, correct: true }
      - { text: { en: '200 inv-b', zh: '200 inv-b' }, correct: false }
      - { text: { en: '403 forbidden', zh: '403 forbidden' }, correct: false }
      - { text: { en: 'The function throws', zh: '函数抛出异常' }, correct: false }
    explanation: { en: 'The principal has permission to read invoices, but inv-b belongs to another tenant. The function uses the same 404 shape as a missing object to avoid revealing its existence.', zh: '主体有读取发票的权限，但 inv-b 属于其他租户。函数返回与对象不存在时相同的 404 结构，避免泄露该对象是否存在。' }
    difficulty: intermediate
    tags: [authorization, tenant-isolation, predict]
    tests: node predict_cross_tenant_invoice.js
    minutes: 3

  - id: choose-delta-threat-model
    type: mcq
    prompt: { en: 'A generated refactor adds a new webhook that can schedule refunds. What is the strongest first security review step?', zh: '一次生成式重构新增了能够安排退款的 Webhook。安全审查最有力的第一步是什么？' }
    options:
      - { text: { en: 'Model the new actors, entry point, identity, protected assets, privileged effect, and abuse cases before tracing controls', zh: '先对新的参与者、入口、身份、受保护资产、特权效果和滥用用例建模，再追踪控制' }, correct: true }
      - { text: { en: 'Approve it because the generated function is short and uses async/await', zh: '生成函数很短且使用 async/await，因此批准' }, correct: false }
      - { text: { en: 'Run only the existing successful refund test', zh: '只运行现有的退款成功测试' }, correct: false }
      - { text: { en: 'Ask the model whether the code follows security best practices', zh: '询问模型代码是否遵循安全最佳实践' }, correct: false }
    explanation: { en: 'The webhook changes reachability and authority, so the delta threat model defines which boundaries and denial properties need evidence. Style and one happy path do not establish those properties.', zh: 'Webhook 改变了可达性与权限，因此增量威胁模型应先确定哪些边界与拒绝属性需要证据。代码风格与一条成功路径无法证明这些属性。' }
    difficulty: advanced
    tags: [threat-modeling, trust-boundary, review-scope]
    minutes: 3

  - id: spotbug-generated-profile-update
    type: spotbug
    prompt: { en: 'Find the authorization, input-handling, and secret-exposure defects in this generated profile handler.', zh: '找出这个生成的资料处理器在授权、输入处理和密钥暴露方面的缺陷。' }
    code: |
      async function updateProfile(request, store, audit) {
        const profile = await store.find(request.body.userId);
        if (!profile) {
          return { status: 404, body: { error: "not found" } };
        }

        if (request.body.displayName.length > 80) {
          return { status: 400, body: { error: "too long" } };
        }
        profile.displayName = request.body.displayName.trim();
        audit.push({
          authorization: request.headers.authorization,
          profile,
        });
        await store.save(profile);
        return { status: 200, body: profile };
      }
    lang: js
    issues:
      - line: 2
        kind: security
        note: { en: 'A request-controlled userId selects any profile without checking the authenticated principal, action, or tenant. Scope the lookup and authorize the exact profile update.', zh: '请求控制的 userId 可以选择任意资料，却没有检查认证主体、操作或租户。应限制查询范围，并对该资料更新进行授权。' }
      - line: 7
        kind: edge-case
        note: { en: 'A missing, null, or non-string displayName throws before the intended 400 response, and no accepted character or minimum-length rule is enforced.', zh: 'displayName 缺失、为 null 或非字符串时，会在预期的 400 响应前抛错，而且没有强制字符范围或最小长度。' }
      - line: 12
        kind: security
        note: { en: 'The audit record stores the Authorization header and entire profile. Allowlist stable identifiers and outcomes instead of recording credentials and unnecessary personal data.', zh: '审计记录保存了 Authorization 标头与完整资料。应只允许稳定标识与结果字段，不能记录凭据和不必要的个人数据。' }
      - line: 16
        kind: security
        note: { en: 'Returning the complete stored object can expose internal or sensitive fields. Serialize an explicit public response shape.', zh: '返回完整存储对象可能暴露内部或敏感字段。应序列化成显式的公开响应结构。' }
    explanation: { en: 'Syntax validation alone would not secure this handler. The fix derives identity from a verified channel, enforces object-level policy, validates a canonical string, and uses allowlisted audit and response fields.', zh: '只有语法验证无法保护这个处理器。修复需要从验证通道取得身份，强制对象级策略，验证规范字符串，并为审计与响应使用字段允许列表。' }
    difficulty: advanced
    tags: [authorization, input-validation, secret-exposure]
    tests: node --check generated_profile_update.js
    minutes: 7

  - id: choose-secret-exposure-response
    type: mcq
    prompt: { en: 'A real API token was pasted into a model prompt and then removed from the generated fixture. What is the correct response?', zh: '真实 API 令牌曾被粘贴到模型提示词，之后又从生成夹具中删除。正确的响应是什么？' }
    options:
      - { text: { en: 'Treat it as exposed under the provider retention model, revoke or rotate it, and inspect downstream use', zh: '按照提供方保留模型把它视作已暴露，撤销或轮换，并检查下游使用' }, correct: true }
      - { text: { en: 'No action is needed because the latest fixture no longer contains the token', zh: '最新夹具已经没有令牌，因此无需操作' }, correct: false }
      - { text: { en: 'Replace half the token with asterisks in the same prompt', zh: '在同一提示词中把令牌的一半替换成星号' }, correct: false }
      - { text: { en: 'Commit the deletion so repository history proves the token is gone', zh: '提交删除操作，让代码库历史证明令牌已经消失' }, correct: false }
    explanation: { en: 'Deletion does not erase copies held by prompts, logs, caches, or history. Credible exposure requires revocation or rotation plus a source-to-sink review.', zh: '删除无法清除提示词、日志、缓存或历史中的副本。确认可能暴露后，需要撤销或轮换，并审查从来源到接收点的路径。' }
    difficulty: intermediate
    tags: [secrets, credential-rotation, data-flow]
    minutes: 2

  - id: choose-dependency-admission-evidence
    type: mcq
    prompt: { en: 'A generated change adds a familiar-looking package for a small helper. Which evidence best supports admitting it?', zh: '生成式改动为一个小型辅助功能加入了名称看似熟悉的软件包。哪组证据最能支持准入？' }
    options:
      - { text: { en: 'Manifest and lockfile review, expected registry and integrity, transitive and install-script changes, vulnerability results, and justified need', zh: '审查清单与锁文件、预期注册表与完整性、传递依赖和安装脚本变动、漏洞结果，以及引入必要性' }, correct: true }
      - { text: { en: 'The package name resembles a popular package and the model recommends it', zh: '软件包名称与热门包相似，而且模型推荐使用' }, correct: false }
      - { text: { en: 'The application unit tests pass after ignoring lockfile changes', zh: '忽略锁文件变动后，应用单元测试通过' }, correct: false }
      - { text: { en: 'The direct package has few source lines', zh: '这个直接依赖的软件包源码行数很少' }, correct: false }
    explanation: { en: 'Admission concerns the resolved artifact and every phase in which dependency code can execute. Names, line counts, and happy-path tests do not establish provenance or bounded authority.', zh: '准入关心的是解析后的制品，以及依赖代码可能执行的每个阶段。名称、代码行数与成功路径测试都不能证明来源或权限受限。' }
    difficulty: advanced
    tags: [dependencies, lockfile, provenance]
    minutes: 3

  - id: review-generated-export-scheduler
    type: review
    title: { en: 'Review a generated export scheduler', zh: '审查生成的导出调度器' }
    prompt: { en: 'Review this handler before it is connected to the tenant export API.', zh: '在把这个处理器接入租户导出 API 前审查它。' }
    task: { en: 'Let an authenticated tenant maintainer schedule an export for a project in that tenant. Accept a 1–64 character lowercase slug, create a collision-resistant job ID through an injected generator, publish a bounded IDs-only job, and audit approved identifiers without request bodies or credentials.', zh: '允许通过认证的租户维护者为本租户项目安排导出。只接受 1–64 个字符的小写 slug；通过注入的生成器创建抗碰撞任务 ID；发布只含标识且大小受限的任务；审计批准的标识，不能包含请求正文或凭据。' }
    code: |
      async function scheduleExport(request, store, queue, audit) {
        const project = await store.find(request.params.projectId);
        if (!project) {
          return { status: 404, body: { error: "not found" } };
        }

        const archiveName = request.body.archiveName.trim();
        if (archiveName.length > 64) {
          return { status: 400, body: { error: "name too long" } };
        }

        const job = {
          id: Date.now().toString(),
          project,
          archiveName,
          requestedBy: request.user,
        };
        await queue.publish(job);
        audit.push({ request, job });
        return { status: 202, body: job };
      }
    lang: js
    right: { en: 'The handler distinguishes a missing project, enforces an upper name length, awaits queue publication, records an audit event, and uses the appropriate 202 status for accepted asynchronous work.', zh: '处理器区分项目不存在的情况，限制名称长度上限，等待队列发布完成，记录审计事件，并为已接受的异步工作使用合适的 202 状态。' }
    checklist:
      - { en: 'Trace verified principal, maintainer action, tenant scope, and project lookup through the real route.', zh: '沿真实路由追踪已验证主体、维护者操作、租户范围与项目查询。' }
      - { en: 'Exercise missing, non-string, empty, uppercase, separator, 64-character, and 65-character archive names.', zh: '练习缺失、非字符串、空值、大写、含分隔符、64 字符和 65 字符的归档名称。' }
      - { en: 'Inspect queue and audit schemas for bounded fields, sensitive data, stable identifiers, and failure behavior.', zh: '检查队列与审计模式中的字段边界、敏感数据、稳定标识和失败行为。' }
      - { en: 'Force an ID collision and a queue failure, then prove no misleading success or partial audit remains.', zh: '强制制造 ID 碰撞与队列故障，再证明不会留下误导性成功结果或局部审计。' }
    issues:
      - line: 2
        kind: security
        note: { en: 'The global lookup uses a request-controlled ID before proving authentication, maintainer permission, or tenant scope. Query within the principal tenant and authorize the export action.', zh: '全局查询在证明认证、维护者权限或租户范围前使用请求控制的 ID。应在主体租户内查询，并授权导出操作。' }
      - line: 7
        kind: edge-case
        note: { en: 'Calling trim before checking the type throws for missing or non-string input, and the code never enforces non-empty lowercase slug grammar.', zh: '在检查类型前调用 trim，会对缺失或非字符串输入抛错，而且代码从未强制非空小写 slug 语法。' }
      - line: 13
        kind: correctness
        note: { en: 'Millisecond timestamps can collide under concurrent requests. Use the required injected collision-resistant ID generator and define collision handling.', zh: '并发请求可能产生相同的毫秒时间戳。应使用任务要求的注入式抗碰撞 ID 生成器，并定义碰撞处理。' }
      - line: 14
        kind: performance
        note: { en: 'Publishing the entire project makes queue size and serialization cost depend on an unbounded stored object and creates stale snapshots. Publish stable IDs and bounded fields.', zh: '发布完整项目会让队列大小与序列化成本取决于无界存储对象，还会产生过期快照。应只发布稳定标识与有界字段。' }
      - line: 19
        kind: readability
        note: { en: 'Whole request and job objects hide the audit contract and can silently acquire credentials or personal fields. Build a named event from an allowlist of identifiers and outcome.', zh: '完整请求与任务对象会掩盖审计契约，还可能悄悄带入凭据或个人字段。应根据标识与结果允许列表构造具名事件。' }
    explanation: { en: 'The generated happy path has a useful asynchronous shape, but it does not preserve the task security contract. Review must connect route identity and tenant policy to bounded queue and audit payloads, while testing denial and failure states.', zh: '生成的成功路径具有可用的异步结构，却没有保持任务的安全契约。审查必须把路由身份与租户策略连接到有界队列和审计载荷，同时测试拒绝与故障状态。' }
    difficulty: advanced
    tags: [code-review, authorization, input-validation, bounded-payload]
    tests: node --check generated_export_scheduler.js
    minutes: 12
