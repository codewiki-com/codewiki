topic: ai-era/examples-and-counterexamples
items:
  - id: predict-reorder-counterexamples
    type: predict
    prompt: { en: 'What decisions does the specified inventory rule print?', zh: '这条已规定的库存规则会输出哪些决定？' }
    code: |
      function reorderDecision({ stock, reorderAt, discontinued }) {
        return !discontinued && stock <= reorderAt ? "reorder" : "hold";
      }

      const inputs = [
        { stock: 8, reorderAt: 8, discontinued: false },
        { stock: 8, reorderAt: 5, discontinued: false },
        { stock: 0, reorderAt: 8, discontinued: true },
      ];

      console.log(inputs.map(reorderDecision).join(", "));
    lang: javascript
    options:
      - { text: { en: 'reorder, hold, hold', zh: 'reorder、hold、hold' }, correct: true }
      - { text: { en: 'hold, reorder, reorder', zh: 'hold、reorder、reorder' }, correct: false }
      - { text: { en: 'reorder, reorder, hold', zh: 'reorder、reorder、hold' }, correct: false }
      - { text: { en: 'hold, hold, reorder', zh: 'hold、hold、reorder' }, correct: false }
    explanation: { en: 'Equality is inside the reorder boundary, a per-item threshold can still produce hold, and discontinued state overrides low stock.', zh: '相等值位于补货边界以内，逐商品阈值仍可能产生 hold，停售状态则覆盖低库存规则。' }
    difficulty: intermediate
    tags: [counterexample, boundary-value, rule-override]
    tests: node reorder_prediction.js
    minutes: 3

  - id: spotbug-correlated-reorder-cases
    title: { en: 'Spot the bug in inventory checks', zh: '找出库存检查里的 bug' }
    type: spotbug
    prompt: { en: 'Find why these generated checks cannot establish the requested inventory rule.', zh: '找出这些生成检查为何无法确定请求中的库存规则。' }
    code: |
      import assert from "node:assert/strict";

      const cases = [
        { input: { stock: 4, reorderAt: 8, discontinued: false } },
        { input: { stock: 3, reorderAt: 8, discontinued: false } },
        { input: { stock: 2, reorderAt: 8, discontinued: false } },
      ];

      for (const example of cases) {
        const expected = example.input.stock < 10 ? "reorder" : "hold";
        assert.equal(reorderDecision(example.input), expected);
      }
    lang: javascript
    issues:
      - line: 4
        lines: 3
        kind: edge-case
        note: { en: 'Every row is an active item comfortably below the same threshold. No case covers equality, a custom threshold that changes the result, or the discontinued override.', zh: '每行都是明显低于同一阈值的活跃商品，没有案例覆盖相等值、会改变结果的自定义阈值或停售覆盖规则。' }
      - line: 10
        kind: correctness
        note: { en: 'The generated oracle invents a fixed threshold of 10 instead of using independently approved literal outcomes, so the checks can bless the wrong rule.', zh: '生成预言机自行发明固定阈值 10，没有使用独立批准的字面结果，因此检查可能会认可错误规则。' }
    explanation: { en: 'More rows do not help when they all occupy one input region and their oracle embeds the same unapproved generalization. Add named literal cases that distinguish each plausible wrong rule.', zh: '如果所有行都落在同一个输入区域，而且预言机嵌入同一条未经批准的归纳，增加行数也没有帮助。应加入能区分每种可能错误规则的命名字面案例。' }
    difficulty: intermediate
    tags: [correlated-examples, test-oracle, counterexample]
    minutes: 5

  - id: choose-custom-threshold-counterexample
    type: mcq
    prompt: { en: 'The only example says stock 4 with reorderAt 8 returns reorder. Which case best rejects an implementation that hard-codes threshold 10?', zh: '唯一示例规定库存 4、reorderAt 8 时返回 reorder。哪个案例最能拒绝硬编码阈值 10 的实现？' }
    options:
      - { text: { en: 'stock 8, reorderAt 5, active -> hold', zh: '库存 8、reorderAt 5、活跃 -> hold' }, correct: true }
      - { text: { en: 'stock 3, reorderAt 8, active -> reorder', zh: '库存 3、reorderAt 8、活跃 -> reorder' }, correct: false }
      - { text: { en: 'stock 2, reorderAt 8, active -> reorder', zh: '库存 2、reorderAt 8、活跃 -> reorder' }, correct: false }
      - { text: { en: 'stock 4, reorderAt 8, active -> reorder again', zh: '再次使用库存 4、reorderAt 8、活跃 -> reorder' }, correct: false }
    explanation: { en: 'At stock 8, the hard-coded rule returns reorder while the item-specific threshold of 5 requires hold. The other options stay in the same region as the original example.', zh: '库存为 8 时，硬编码规则会返回 reorder，而商品自己的阈值 5 要求返回 hold。其他选项仍位于原示例所在区域。' }
    difficulty: intermediate
    tags: [distinguishing-case, configuration, counterexample]
    minutes: 2

  - id: choose-archive-interaction-case
    type: mcq
    prompt: { en: 'Why include an archived document owned by an administrator in the permission examples?', zh: '为什么权限示例要包含管理员拥有的归档文档？' }
    options:
      - { text: { en: 'It distinguishes unconditional administrator editing from the rule that archive state removes editing while retaining view access', zh: '它区分「管理员无条件编辑」与「归档状态取消编辑权但保留查看权」两条规则' }, correct: true }
      - { text: { en: 'It proves that every possible role and state combination has been tested', zh: '它证明所有角色与状态组合都已经测试' }, correct: false }
      - { text: { en: 'It makes validation of unknown roles unnecessary', zh: '它使未知角色验证变得不必要' }, correct: false }
      - { text: { en: 'It specifies which database index the permission check must use', zh: '它规定权限检查必须使用哪个数据库索引' }, correct: false }
    explanation: { en: 'The row activates two rules together and fixes their precedence at the observable permission result. It neither covers the full product nor dictates storage internals.', zh: '该行同时激活两条规则，并在可观察权限结果上确定优先级；它既没有覆盖完整组合，也没有规定存储内部结构。' }
    difficulty: intermediate
    tags: [decision-table, rule-precedence, authorization]
    minutes: 2

  - id: choose-unresolved-whitespace-response
    type: mcq
    prompt: { en: 'A parser prompt gives examples for canonical digits but says nothing about surrounding whitespace. What should happen before implementation?', zh: '解析器提示词给出了规范数字示例，却没有说明两端空白。实现前应该怎么做？' }
    options:
      - { text: { en: 'Mark surrounding whitespace as unresolved and obtain a decision to trim, preserve, or reject it', zh: '把两端空白标为未决项，并确认应去除、保留还是拒绝' }, correct: true }
      - { text: { en: 'Trim it because most users probably expect that behavior', zh: '直接去除，因为多数用户可能期待这种行为' }, correct: false }
      - { text: { en: 'Reject it because strict parsing is always safer', zh: '直接拒绝，因为严格解析总是更安全' }, correct: false }
      - { text: { en: 'Let the generated tests choose whichever behavior the implementation already has', zh: '让生成测试选择实现中已经存在的行为' }, correct: false }
    explanation: { en: 'An omitted case is not authorization to invent policy. Naming the unknown keeps generated code and generated tests from silently agreeing on an unsupported choice.', zh: '遗漏案例不等于允许臆造策略。明确标出未知项，可以避免生成代码与生成测试默契地采用未经支持的选择。' }
    difficulty: intermediate
    tags: [unresolved-case, prompt-contract, ambiguity]
    minutes: 2

  - id: review-generated-customer-export
    type: review
    title: { en: 'Review a generated customer export', zh: '审查生成的客户导出函数' }
    prompt: { en: 'Review the generated implementation against the stated examples and counterexamples.', zh: '根据给定示例与反例审查生成实现。' }
    task: { en: 'Export new row objects from a customer array; accept named options { includeInactive } defaulting to false; keep zero balances; include only id, balance, and the existing active or inactive status; reject any other or missing status; and never expose email addresses.', zh: '从客户数组导出新的行对象；接受命名选项 { includeInactive }，默认值为 false；保留零余额；只包含 id、balance 和已有的 active 或 inactive 状态；拒绝其他或缺失状态；绝不暴露邮箱地址。' }
    code: |
      function exportCustomerRows(customers, includeInactive = false) {
        if (!Array.isArray(customers)) {
          throw new TypeError("customers must be an array");
        }

        const rows = [];
        for (const customer of customers) {
          if (!customer.balance) continue;
          if (!includeInactive && customer.status === "inactive") continue;
          rows.push({
            id: customer.id,
            email: customer.email,
            balance: Math.round(customer.balance),
            status: customer.status || "active",
          });
        }

        return rows;
      }
    lang: javascript
    issues:
      - line: 1
        kind: readability
        note: { en: 'The positional Boolean does not implement the named options object and makes calls such as exportCustomerRows(rows, true) obscure. Destructure { includeInactive = false } from an options parameter.', zh: '位置布尔值没有实现命名选项对象，exportCustomerRows(rows, true) 这类调用也难以理解。应从 options 形参解构 { includeInactive = false }。' }
      - line: 8
        kind: edge-case
        note: { en: 'The truthiness check drops a valid zero balance. Check the declared numeric domain rather than treating zero as absence.', zh: '真假值检查会丢弃有效的零余额。应检查声明的数值定义域，不能把零当成缺失。' }
      - line: 12
        kind: security
        note: { en: 'The exported row includes an email address even though the allowed-field counterexample explicitly forbids exposing it.', zh: '导出行包含邮箱地址，而允许字段反例明确禁止暴露它。' }
      - line: 14
        kind: correctness
        note: { en: 'Missing status is silently rewritten to active, and unknown truthy statuses pass through. Validate exactly active or inactive and reject every other value.', zh: '缺失状态被静默改写为 active，未知真值状态也会直接通过。应只接受 active 或 inactive，并拒绝其他值。' }
    right: { en: 'The function validates that its main input is an array, creates new row objects instead of mutating customer records, honors inactive filtering on the ordinary path, and returns the collected result explicitly.', zh: '该函数会验证主要输入是数组，创建新行对象而不修改客户记录，在普通路径上遵守非活跃过滤规则，并显式返回收集结果。' }
    checklist:
      - { en: 'Call with a zero-balance active customer and confirm one safe row remains.', zh: '使用零余额活跃客户调用，并确认保留一条安全记录。' }
      - { en: 'Try missing and unknown statuses and require the approved rejection channel.', zh: '尝试缺失与未知状态，并要求使用已批准的拒绝通道。' }
      - { en: 'Inspect every exported field for the id, balance, status allowlist and absence of email.', zh: '检查每个导出字段是否仅来自 id、balance、status 允许列表，并确保没有 email。' }
      - { en: 'Exercise omitted, false, and true includeInactive through the named options object.', zh: '通过命名选项对象测试省略、false 与 true 三种 includeInactive 情况。' }
    explanation: { en: 'The implementation follows the representative array and filtering path but fails four distinguishing requirements: call shape, zero handling, field allowlisting, and status rejection. Each issue maps to a different observable counterexample.', zh: '实现符合代表性的数组与过滤路径，却违反四项判别要求：调用形式、零值处理、字段允许列表与状态拒绝。每个问题都对应不同的可观察反例。' }
    difficulty: intermediate
    tags: [code-review, counterexample, data-minimization, input-validation]
    tests: node --check customer_export.js
    minutes: 10
