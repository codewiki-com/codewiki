topic: 'ai-era/agent-instructions-and-mcp'
items:
  - id: 'predict-normalized-tool-paths'
    type: 'predict'
    prompt: { en: 'What does this path check print?', zh: '这段路径检查会输出什么？' }
    code: |
      import { posix } from "node:path";

      function verdict(raw) {
        const path = posix.normalize(raw);
        return path.startsWith("src/") && path.endsWith(".ts")
          ? `ALLOW ${path}`
          : `DENY ${path}`;
      }

      console.log(verdict("src/config.ts"));
      console.log(verdict("src/../secrets/token.txt"));
    lang: 'javascript'
    options:
      - { text: { en: 'ALLOW src/config.ts, then DENY secrets/token.txt', zh: '先输出ALLOW src/config.ts，再输出DENY secrets/token.txt' }, correct: true }
      - { text: { en: 'ALLOW both paths because both raw strings start with src/', zh: '两个路径都输出ALLOW，因为原始字符串都以src/ 开头' }, correct: false }
      - { text: { en: 'DENY both paths because normalize rejects relative paths', zh: '两个路径都输出DENY，因为normalize会拒绝相对路径' }, correct: false }
      - { text: { en: 'The second call throws an exception', zh: '第二次调用会抛出异常' }, correct: false }
    explanation: { en: 'Normalization removes the src/.. segment, so the second value becomes secrets/token.txt and fails the source-root test.', zh: '规范化会消除src/.. 片段，因此第二个值变成secrets/token.txt，无法通过源码根目录检查。' }
    difficulty: 'beginner'
    tags: ['path-normalization', 'tool-contract', 'prediction']
    tests: 'node path-policy.js'
    minutes: 3

  - id: 'choose-stable-instruction'
    type: 'mcq'
    prompt: { en: 'Which entry belongs in a repository instruction file?', zh: '哪一项适合写进仓库指令文件？' }
    options:
      - { text: { en: 'For changes under src/payments/, run pnpm test:payments from the repository root', zh: '修改src/payments/ 时，从仓库根目录运行pnpm test:payments' }, correct: true }
      - { text: { en: 'For this one ticket, rename the refund variable before lunch', zh: '针对这一个工单，在午饭前重命名退款变量' }, correct: false }
      - { text: { en: 'Always make the code as good as possible', zh: '始终尽可能把代码写好' }, correct: false }
      - { text: { en: 'Assume every test passes unless an error is visible', zh: '除非看到错误，否则假定所有测试都通过' }, correct: false }
    explanation: { en: 'The first rule is stable, scoped, and checkable. One-off goals belong in the task, while vague quality language and assumed results provide no evidence.', zh: '第一条规则稳定、范围明确而且可以检查。一次性目标应放在任务中；含糊的质量要求和假定结果都不能提供证据。' }
    difficulty: 'beginner'
    tags: ['repository-instructions', 'scope', 'verification']
    minutes: 2

  - id: 'spotbug-mcp-source-reader'
    title: { en: 'Spot the bug in the MCP source reader', zh: '找出MCP源码读取器里的bug' }
    type: 'spotbug'
    prompt: { en: 'Find the boundary failures in this generated source-reading tool.', zh: '找出这个生成式源码读取工具中的边界故障。' }
    code: |
      import { readFile } from "node:fs/promises";
      import { resolve } from "node:path";

      const SOURCE_ROOT = "/srv/project/src";

      export async function readSource(args) {
        const fullPath = resolve(SOURCE_ROOT, args.path);
        if (!fullPath.startsWith(SOURCE_ROOT)) {
          return { isError: true, message: "outside source root" };
        }
        const text = await readFile(fullPath, "utf8");
        return {
          isError: false,
          content: [{ type: "text", text }],
        };
      }
    lang: 'javascript'
    issues:
      - line: 8
        kind: 'security'
        note: { en: 'A string prefix is not path containment: /srv/project/src-secrets also starts with the configured root. Resolve a relative path against the canonical root and use a path-aware containment test, including symbolic links.', zh: '字符串前缀不等于路径包含关系：/srv/project/src-secrets同样以配置的根路径开头。应相对规范根目录解析路径，并使用能够处理符号链接的路径感知包含关系检查。' }
      - line: 11
        kind: 'performance'
        note: { en: 'The entire file is read and returned with no byte limit, so one call can exhaust memory or model context. Enforce a small maximum and report truncation or rejection explicitly.', zh: '代码没有字节上限，会读取并返回整个文件，因此一次调用就可能耗尽内存或模型上下文。应设置较小上限，并明确报告截断或拒绝。' }
      - line: 11
        kind: 'correctness'
        note: { en: 'A missing file or decoding failure rejects the handler promise instead of returning the documented structured tool error, so callers cannot distinguish a domain miss consistently.', zh: '文件不存在或解码失败时，处理器Promise会直接拒绝，而不是返回约定的结构化工具错误，因此调用方无法稳定区分领域错误。' }
    explanation: { en: 'A safe handler needs canonical path containment, bounded reads, and an explicit error result. Schema shape alone would not repair any of these execution-time failures.', zh: '安全处理器需要规范路径包含检查、有限读取和明确错误结果。只验证模式形状无法修复这些执行时故障。' }
    difficulty: 'intermediate'
    tags: ['mcp', 'path-containment', 'bounded-output']
    tests: 'node --check source-reader.js'
    minutes: 6

  - id: 'distinguish-guidance-from-enforcement'
    type: 'mcq'
    prompt: { en: 'A CLAUDE.md says never to deploy to production. What makes that boundary dependable?', zh: 'CLAUDE.md写明绝不部署到生产环境。怎样才能让这条边界可靠？' }
    options:
      - { text: { en: 'Do not expose production credentials or routes, and deny production targets in host or server policy', zh: '不提供生产凭据或网络路径，并在宿主或服务器策略中拒绝生产目标' }, correct: true }
      - { text: { en: 'Repeat the sentence in three headings so the model sees it more often', zh: '在三个标题下重复这句话，让模型多看到几次' }, correct: false }
      - { text: { en: 'Rename the MCP tool from deploy to safe_deploy', zh: '把MCP工具从deploy改名为safe_deploy' }, correct: false }
      - { text: { en: 'Return a warning after the deployment has finished', zh: '部署完成后返回一条警告' }, correct: false }
    explanation: { en: 'Instruction text can guide selection but cannot revoke a process capability. The execution layer must remove or deny production authority before any side effect occurs.', zh: '指令文本可以引导选择，却不能撤销进程能力。执行层必须在副作用发生前移除或拒绝生产权限。' }
    difficulty: 'intermediate'
    tags: ['instruction-boundary', 'least-privilege', 'authorization']
    minutes: 2

  - id: 'choose-narrow-mcp-surface'
    type: 'mcq'
    prompt: { en: 'Which MCP surface best fits an agent that only needs to inspect TypeScript source under src/?', zh: '智能体只需检查src/ 下的TypeScript源码时，哪种MCP接口最合适？' }
    options:
      - { text: { en: 'read_source with a relative path, .ts restriction, byte cap, and caller authorization', zh: 'read_source：接收相对路径，限制 .ts文件和字节数，并验证调用方权限' }, correct: true }
      - { text: { en: 'run_shell with any command and a description asking the model to be careful', zh: 'run_shell：接受任意命令，并在描述中要求模型谨慎' }, correct: false }
      - { text: { en: 'read_file with an absolute path and the server administrator credential', zh: 'read_file：接收绝对路径，并使用服务器管理员凭据' }, correct: false }
      - { text: { en: 'http_request with unrestricted URLs because files can use file URLs', zh: 'http_request：不限制URL，因为文件可以使用file URL' }, correct: false }
    explanation: { en: 'The task-shaped tool exposes only the needed data and operation. Its handler still has to normalize paths and enforce authorization on every call.', zh: '面向任务的工具只暴露所需数据和操作，但处理器仍须在每次调用时规范化路径并强制授权。' }
    difficulty: 'intermediate'
    tags: ['mcp-tools', 'least-privilege', 'tool-design']
    minutes: 2

  - id: 'review-generated-scoped-tool'
    type: 'review'
    title: { en: 'Review a generated scoped source tool', zh: '审查生成的受限源码工具' }
    prompt: { en: 'Review this generated MCP-style handler before connecting it to an agent.', zh: '把这个生成式MCP风格处理器接入智能体前，请先审查它。' }
    task: { en: 'Implement read_source for authenticated callers: accept exactly one relative .ts path under /srv/project/src, reject missing or extra fields with a structured error, read at most 4096 valid UTF-8 bytes, and return canonical path and byte count matching the declared output schema.', zh: '为经过认证的调用方实现read_source：只接受 /srv/project/src下一个相对 .ts路径；缺少字段或含多余字段时返回结构化错误；最多读取4096个有效UTF-8字节；返回符合输出模式的规范路径和字节数。' }
    code: |
      import { readFile } from "node:fs/promises";

      export const tool = {
        name: "read_source",
        inputSchema: {
          type: "object",
          properties: { path: { type: "string" } },
          required: ["path"],
          additionalProperties: false,
        },
        outputSchema: {
          type: "object",
          required: ["path", "bytes"],
        },
      };

      export async function readSource(args, caller) {
        if (!caller.canReadSource) return { isError: true };
        const fullPath = `/srv/project/src/${args.path}`;
        const text = await readFile(fullPath, "utf8");
        return {
          structuredContent: { path: args.path, bytes: text.length },
          content: [{ type: "text", text }],
        };
      }
    lang: 'javascript'
    issues:
      - line: 19
        kind: 'security'
        note: { en: 'String concatenation allows .. and absolute-like segments to escape the source directory. Resolve against a canonical root, reject non-relative input, prove containment after resolving links, and enforce the .ts suffix.', zh: '字符串拼接允许通过 .. 和类似绝对路径的片段逃出源码目录。应相对规范根目录解析，拒绝非相对输入，解析链接后证明路径仍在范围内，并强制要求 .ts后缀。' }
      - line: 20
        kind: 'performance'
        note: { en: 'readFile loads the complete file before any 4096-byte limit. Read only a bounded buffer and reject or mark overflow before returning content to the client.', zh: 'readFile会在应用4096字节上限前加载完整文件。应只读取有限缓冲区，并在向客户端返回内容前拒绝或标记溢出。' }
      - line: 19
        kind: 'edge-case'
        note: { en: 'The handler does not validate missing or extra arguments itself; a direct or incorrectly configured caller can turn a missing path into the literal undefined filename. Validate again at the execution boundary and return a structured error.', zh: '处理器本身没有验证缺失或多余参数；直接调用或配置错误的调用方会把缺失路径变成字面量undefined文件名。应在执行边界再次验证，并返回结构化错误。' }
      - line: 22
        kind: 'correctness'
        note: { en: 'text.length counts UTF-16 code units, not UTF-8 bytes, and the returned path is not canonical. Use Buffer.byteLength on strictly decoded content and return the validated canonical relative path.', zh: 'text.length计算的是UTF-16代码单元，不是UTF-8字节，而且返回路径并非规范路径。应对严格解码后的内容使用Buffer.byteLength，并返回经过验证的规范相对路径。' }
    right: { en: 'The generated code gives the tool a narrow name, rejects additional properties in its declaration, checks a caller capability before reading, and separates text content from structured metadata.', zh: '生成代码使用了范围明确的工具名称，在声明中拒绝多余属性，读取前检查调用方能力，并把文本内容与结构化元数据分开。' }
    checklist:
      - { en: 'Validate shape, extension, canonical containment, and caller authorization again inside the handler.', zh: '在处理器内再次验证形状、扩展名、规范路径包含关系和调用方权限。' }
      - { en: 'Test missing fields, unknown fields, .. segments, symbolic links, and non-TypeScript paths.', zh: '测试缺失字段、未知字段、.. 片段、符号链接和非TypeScript路径。' }
      - { en: 'Enforce the byte cap before a full read and reject invalid UTF-8 deterministically.', zh: '完整读取前强制字节上限，并以确定方式拒绝无效UTF-8。' }
      - { en: 'Validate structured output against outputSchema and compare byte counts with multibyte text.', zh: '按outputSchema验证结构化输出，并使用多字节文本核对字节数。' }
    explanation: { en: 'A narrow declaration is a useful start, but the handler still needs semantic path checks, bounded I/O, argument validation, and byte-correct output. Each condition should be exercised through the actual execution boundary.', zh: '范围明确的声明只是起点；处理器仍需语义路径检查、有限I/O、参数验证和正确的字节统计。每项条件都应通过真实执行边界测试。' }
    difficulty: 'advanced'
    tags: ['code-review', 'mcp', 'tool-contract', 'path-containment']
    tests: 'node --check scoped-source-tool.js'
    minutes: 10
