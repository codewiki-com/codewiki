topic: ai-era/ai-assisted-debugging
items:
  - id: predict-truthiness-fallback
    type: predict
    prompt: { en: 'What does this generated conversion print?', zh: '这段生成式转换会输出什么？' }
    code: |
      function importedStock(raw) {
        return Number(raw) || 100;
      }

      console.log(importedStock("0"), importedStock("bad"));
    lang: javascript
    options:
      - { text: { en: '100 100', zh: '100 100' }, correct: true }
      - { text: { en: '0 NaN', zh: '0 NaN' }, correct: false }
      - { text: { en: '0 100', zh: '0 100' }, correct: false }
      - { text: { en: 'The first call throws', zh: '第一次调用会抛出异常' }, correct: false }
    explanation: { en: 'Number("0") is 0 and Number("bad") is NaN; both are falsy, so both take the || fallback.', zh: 'Number("0") 为 0，Number("bad") 为 NaN；两者都为假值，因此都会进入 || 回退。' }
    difficulty: beginner
    tags: [runtime-evidence, conversion, truthiness]
    tests: node conversion.mjs
    minutes: 3

  - id: choose-discriminating-retry-check
    type: mcq
    prompt: { en: 'A retry policy ignores its limit for status 503. Which check best separates an off-by-one counter from operator grouping?', zh: '重试策略对状态 503 忽略上限。哪项检查最能区分计数差一与运算符分组问题？' }
    options:
      - { text: { en: 'Compare statuses 429 and 503 on both sides of the same attempt boundary', zh: '在同一个尝试次数边界两侧，对比状态 429 与 503' }, correct: true }
      - { text: { en: 'Increase the retry limit and see whether the alert stops', zh: '增大重试上限，观察告警是否停止' }, correct: false }
      - { text: { en: 'Run the 503 case several times without changing its inputs', zh: '输入不变，多次运行 503 用例' }, correct: false }
      - { text: { en: 'Rename attempt to retryCount', zh: '把 attempt 重命名为 retryCount' }, correct: false }
    explanation: { en: 'Changing status and attempt independently reveals whether the boundary applies to both status branches. The other choices do not make the hypotheses predict different results.', zh: '分别改变状态码与尝试次数，可以看出边界是否同时约束两条状态分支。其余选项不会让两个假设预测出不同结果。' }
    difficulty: intermediate
    tags: [hypothesis, discriminating-check, retry]
    minutes: 3

  - id: classify-runtime-evidence
    type: mcq
    prompt: { en: 'Which statement is a runtime observation rather than an inference?', zh: '哪项陈述是运行观察，而不是推断？' }
    options:
      - { text: { en: 'At the parser return boundary, the recorded input was "0" and the returned number was 100', zh: '在解析器返回边界，记录的输入为 "0"，返回数字为 100' }, correct: true }
      - { text: { en: 'The CSV library probably removed the field', zh: 'CSV 库可能删除了该字段' }, correct: false }
      - { text: { en: 'The developer intended zero to mean missing', zh: '开发者原本想用零表示缺失' }, correct: false }
      - { text: { en: 'Replacing || with ?? will fix every invalid input', zh: '把 || 换成 ?? 能修复所有无效输入' }, correct: false }
    explanation: { en: 'The first choice reports values captured at a named boundary. The others claim a cause, an intent, or an unverified fix.', zh: '第一项报告了在具名边界捕获的值；其余选项分别主张原因、意图或未经验证的修复。' }
    difficulty: beginner
    tags: [observation, inference, evidence-ledger]
    minutes: 2

  - id: spotbug-generated-diagnostic-wrapper
    title: { en: 'Spot the bug in the diagnostic wrapper', zh: '找出诊断包装器里的 bug' }
    type: spotbug
    prompt: { en: 'Find the failures in this generated diagnostic wrapper.', zh: '找出这个生成式诊断包装器的问题。' }
    code: |
      const delay = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

      async function fetchProfile(url, token) {
        try {
          const response = await fetch(url, {
            headers: { authorization: `Bearer ${token}` },
          });
          return await response.json();
        } catch (error) {
          console.log("profile failure", { url, token, error });
          await delay(5000);
          return fetchProfile(url, token);
        }
      }
    lang: javascript
    issues:
      - line: 8
        kind: correctness
        note: { en: 'The wrapper parses every HTTP response as success and never checks response.ok, so an error body can be returned as a profile or fail with an unrelated JSON error.', zh: '包装器把所有 HTTP 响应都按成功处理，且从不检查 response.ok，因此错误正文可能被当成资料返回，或产生无关的 JSON 错误。' }
      - line: 10
        kind: security
        note: { en: 'The diagnostic log writes the bearer token. Log only bounded identifiers and redact authentication material.', zh: '诊断日志写出了持有者令牌。只应记录有界标识，并对认证材料脱敏。' }
      - line: 12
        kind: performance
        note: { en: 'Every failure starts another request with no retry bound, cancellation, or backoff cap, so a persistent failure can run forever.', zh: '每次失败都会发起另一次请求，没有重试上限、取消机制或退避上限，因此持续故障可能永不停止。' }
    explanation: { en: 'A diagnostic change must preserve HTTP failure semantics, avoid secrets, and remain bounded. Retrying also changes behavior, so it is not observation-only instrumentation.', zh: '诊断改动必须保留 HTTP 失败语义、不暴露秘密，并保持有界。重试还会改变行为，因此它不是只观察的插桩。' }
    difficulty: intermediate
    tags: [instrumentation, secrets, retry]
    minutes: 6

  - id: choose-regression-proof
    type: mcq
    prompt: { en: 'When does a new regression check provide the strongest evidence for a proposed fix?', zh: '新的回归检查何时能为所提修复提供最强证据？' }
    options:
      - { text: { en: 'It fails on the faulty implementation for the expected reason and passes on the correction under the same setup', zh: '它在错误实现上按预期原因失败，并在相同设置下于修正实现上通过' }, correct: true }
      - { text: { en: 'It passes after both the fixture and implementation are changed', zh: '夹具与实现同时修改后，它能够通过' }, correct: false }
      - { text: { en: 'It passes only after an assertion is removed', zh: '删除一条断言后，它能够通过' }, correct: false }
      - { text: { en: 'The AI predicts that it would have failed before the edit', zh: 'AI 预测它在编辑前会失败' }, correct: false }
    explanation: { en: 'The before-and-after run proves that the check detects the original mechanism and that the correction changes its result. A prediction or moving oracle is not equivalent evidence.', zh: '修正前后的运行证明检查能发现原始机制，而且修正确实改变了结果。预测或移动判定标准都不是等价证据。' }
    difficulty: intermediate
    tags: [regression-test, oracle, verification]
    minutes: 2

  - id: review-generated-profile-diagnosis
    type: review
    title: { en: 'Review a generated profile diagnostic', zh: '审查生成式资料诊断代码' }
    prompt: { en: 'Review this generated change for an intermittent cross-tenant profile bug.', zh: '审查这段针对间歇性跨租户资料错误的生成式改动。' }
    task: { en: 'Instrument profile loading without exposing credentials or changing retry behavior, keep cached profiles isolated by tenant and user, preserve HTTP failure semantics, and collect bounded evidence about cache decisions.', zh: '为资料加载加入插桩，不得暴露凭据或改变重试行为；缓存资料必须按租户与用户隔离，保留 HTTP 失败语义，并收集有界的缓存决策证据。' }
    code: |
      const cache = new Map();

      export async function loadProfile(tenantId, userId, token) {
        const key = userId;
        if (cache.has(key)) {
          console.log("cache hit", { tenantId, userId, token });
          return cache.get(key);
        }

        const started = Date.now();
        try {
          const response = await fetch(
            `/api/${tenantId}/profiles/${userId}`,
            { headers: { authorization: `Bearer ${token}` } },
          );
          const profile = await response.json();
          cache.set(key, profile);
          console.log("loaded", { userId, elapsed: Date.now() - started });
          return profile;
        } catch (error) {
          console.log("retrying", { tenantId, userId, error });
          return loadProfile(tenantId, userId, token);
        }
      }
    lang: javascript
    issues:
      - line: 4
        kind: correctness
        note: { en: "The cache key omits tenantId, so users with the same identifier in different tenants can receive one another's cached profile.", zh: '缓存键遗漏 tenantId，因此不同租户中标识相同的用户可能收到对方的缓存资料。' }
      - line: 6
        kind: security
        note: { en: 'The cache-hit diagnostic logs the bearer token. Authentication material must be redacted rather than copied into logs.', zh: '缓存命中诊断会记录持有者令牌。认证材料必须脱敏，不能复制到日志中。' }
      - line: 16
        kind: edge-case
        note: { en: 'The code never checks response.ok and assumes every response has JSON, so 204, HTML error, and failed HTTP responses lose their intended semantics.', zh: '代码从不检查 response.ok，并假定所有响应都有 JSON，因此 204、HTML 错误页和失败 HTTP 响应都会失去原有语义。' }
      - line: 22
        kind: performance
        note: { en: 'The catch recursively retries every failure forever, adding traffic and changing the behavior of what was supposed to be diagnostic instrumentation.', zh: 'catch 会对所有失败无限递归重试，增加流量，并改变本应只做诊断的插桩行为。' }
    right: { en: 'The change keeps the fetch asynchronous, uses the tenant and user in the request path, measures elapsed time locally, and distinguishes cache-hit from load events.', zh: '这段改动保留了异步请求，在请求路径中使用租户与用户标识，在本地测量耗时，并区分缓存命中与加载事件。' }
    checklist:
      - { en: 'Compare cache ownership with the tenant and user boundaries in the task.', zh: '对照任务中的租户与用户边界检查缓存所有权。' }
      - { en: 'List every logged field and remove secrets, bodies, and unbounded values.', zh: '列出所有日志字段，并移除秘密、正文与无界值。' }
      - { en: 'Exercise successful, missing, non-JSON error, and network-failure responses.', zh: '测试成功、缺失、非 JSON 错误与网络失败响应。' }
      - { en: 'Confirm instrumentation observes behavior without introducing retries or changed error handling.', zh: '确认插桩只观察行为，不会引入重试或改变错误处理。' }
    explanation: { en: 'The patch mixes diagnosis with behavior changes and still leaves the suspected ownership boundary wrong. Use a tenant-and-user cache key, preserve response errors, and emit only bounded redacted cache evidence.', zh: '补丁把诊断与行为改动混在一起，而且可疑的所有权边界仍然错误。应使用租户与用户组成的缓存键，保留响应错误，只发出有界且脱敏的缓存证据。' }
    difficulty: intermediate
    tags: [code-review, cache-key, instrumentation, runtime-evidence]
    tests: node --check profile-diagnosis.mjs
    minutes: 10
