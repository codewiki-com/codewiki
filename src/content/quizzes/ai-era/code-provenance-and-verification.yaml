topic: ai-era/code-provenance-and-verification
items:
  - id: predict-parseint-claim
    type: predict
    prompt: { en: 'What does this candidate print for an input whose unit suffix should be rejected?', zh: '对于按契约应拒绝的单位后缀输入，这个候选实现会输出什么？' }
    code: |
      function timeoutMs(value) {
        const seconds = Number.parseInt(value, 10);
        if (!Number.isFinite(seconds) || seconds < 0) {
          throw new TypeError("invalid timeout");
        }
        return seconds * 1_000;
      }

      console.log(timeoutMs("5s"));
    lang: js
    options:
      - { text: { en: '5000', zh: '5000' }, correct: true }
      - { text: { en: 'TypeError: invalid timeout', zh: 'TypeError: invalid timeout' }, correct: false }
      - { text: { en: 'NaN', zh: 'NaN' }, correct: false }
      - { text: { en: '5', zh: '5' }, correct: false }
    explanation: { en: 'parseInt accepts the numeric prefix of "5s", so the guard does not run and the function returns 5,000. A contract-derived suffix case disproves a misleading happy-path validation claim.', zh: 'parseInt会接受 "5s" 的数字前缀，因此守卫不会执行，函数返回5000。来自契约的后缀用例可以推翻误导性的成功路径验证声明。' }
    difficulty: intermediate
    tags: [independent-verification, counterexample, parsing]
    tests: node predict_parseint_claim.js
    minutes: 3

  - id: choose-digest-claim
    type: mcq
    prompt: { en: 'A file matches the SHA-256 digest in its reviewed source record. What does that observation establish by itself?', zh: '文件与已审查来源记录中的SHA-256摘要一致。单凭这项观察可以确定什么？' }
    options:
      - { text: { en: 'The file bytes match the bytes represented by the recorded digest', zh: '文件字节与记录摘要所表示的字节一致' }, correct: true }
      - { text: { en: 'The code is secure and functionally correct', zh: '代码安全且功能正确' }, correct: false }
      - { text: { en: 'The person named in the record authored the code', zh: '记录中具名的人就是代码作者' }, correct: false }
      - { text: { en: 'Every applicable license obligation has been satisfied', zh: '所有适用的许可证义务都已满足' }, correct: false }
    explanation: { en: 'A digest binds a value to exact bytes. Identity, correctness, security, origin, and license compliance need their own claims and evidence paths.', zh: '摘要把一个值绑定到确切字节。身份、正确性、安全性、起源与许可证合规都需要各自的声明和证据路径。' }
    difficulty: intermediate
    tags: [digest, integrity, claim]
    minutes: 2

  - id: spotbug-source-approval
    title: { en: 'Spot the bug in source approval', zh: '找出来源审批里的bug' }
    type: spotbug
    prompt: { en: 'Find why this generated source-record check cannot safely approve a reused file.', zh: '找出这个生成式来源记录检查为何无法安全批准复用文件。' }
    code: |
      import { createHash } from "node:crypto";

      export function approveSource(record, files) {
        const source = files.get(record.path);
        const actual = createHash("sha256").update(source).digest("hex");
        if (actual !== record.sha256) return false;
        if (!record.sourceUrl.startsWith("https://")) return false;
        return Boolean(record.license);
      }
    lang: js
    issues:
      - line: 5
        kind: edge-case
        note: { en: 'A missing path yields undefined and update throws instead of returning a structured missing-file failure.', zh: '路径不存在时会得到undefined，update随即抛错，而不是返回结构化的文件缺失结果。' }
      - line: 7
        kind: security
        note: { en: 'An HTTPS URL may be mutable or attacker-controlled; the check needs an immutable revision and a policy-approved source identity.', zh: 'HTTPS URL仍可能可变或受攻击者控制；检查需要不可变修订版本和政策批准的来源身份。' }
      - line: 8
        kind: correctness
        note: { en: 'Any non-empty license string passes, including unknown or incompatible terms. Evaluate a normalized identifier and obligations under project policy.', zh: '任何非空许可证字符串都会通过，包括未知或不兼容条款。应根据项目政策评估规范化标识符与相关义务。' }
    explanation: { en: 'Matching bytes are only one claim. Safe approval also needs robust input handling, a protected and immutable source reference, and a real license decision.', zh: '字节匹配只支持一项声明。安全批准还需要稳健的输入处理、受保护且不可变的来源引用，以及真正的许可证决定。' }
    difficulty: intermediate
    tags: [source-record, trust-policy, license]
    tests: node --check source_approval.js
    minutes: 6

  - id: choose-dependency-evidence
    type: mcq
    prompt: { en: 'An agent adds one approved direct package. Which evidence best checks what will actually be installed and distributed?', zh: '智能体添加了一个获批的直接软件包。哪项证据最适合检查实际安装和分发的内容？' }
    options:
      - { text: { en: 'Reconcile the manifest, frozen lockfile graph, package contents, install scripts, and artifact-linked SBOM', zh: '核对清单、冻结的锁文件图、软件包内容、安装脚本和关联产物的SBOM' }, correct: true }
      - { text: { en: 'Read only the new manifest line because transitive packages were not requested directly', zh: '只读新增清单行，因为传递软件包不是直接请求的' }, correct: false }
      - { text: { en: 'Accept the package when its README displays an approved badge', zh: '软件包README显示获批徽章时直接接受' }, correct: false }
      - { text: { en: 'Trust the agent summary if it names the direct package version', zh: '智能体摘要写出了直接软件包版本时就信任它' }, correct: false }
    explanation: { en: 'Resolved transitive, optional, bundled, and install-time material can affect the release. Multiple inventories should be tied to the exact artifact and discrepancies investigated.', zh: '解析后的传递、可选、内嵌和安装时材料都可能影响发布。多份清单应关联到确切产物，并调查其中差异。' }
    difficulty: intermediate
    tags: [dependency-closure, lockfile, sbom]
    minutes: 2

  - id: choose-independent-oracle
    type: mcq
    prompt: { en: 'Which expected value is the most independent oracle for a generated timeout parser?', zh: '对于生成的超时解析器，哪项预期值最适合作为独立预言机？' }
    options:
      - { text: { en: 'A value derived from the accepted-input table in the reviewed requirement', zh: '根据已审查需求中的可接受输入表推导出的值' }, correct: true }
      - { text: { en: 'A value computed by calling the candidate parser from the test setup', zh: '测试准备阶段调用候选解析器计算出的值' }, correct: false }
      - { text: { en: 'A constant copied from the agent explanation that accompanied the parser', zh: '从解析器附带的智能体解释中复制的常量' }, correct: false }
      - { text: { en: 'A snapshot updated after the candidate first ran', zh: '候选实现首次运行后更新的快照' }, correct: false }
    explanation: { en: 'The reviewed requirement does not depend on the candidate implementation. The other choices recycle the candidate or its authoring narrative and can preserve the same mistake.', zh: '已审查需求不依赖候选实现。其他选择复用了候选实现或其生成叙述，可能保留同一个错误。' }
    difficulty: intermediate
    tags: [test-oracle, independence, requirements]
    minutes: 2

  - id: review-generated-release-verifier
    type: review
    title: { en: 'Review a generated release verifier', zh: '审查生成的发布验证器' }
    prompt: { en: 'Review this verifier before it is allowed to approve generated releases.', zh: '在允许这个验证器批准生成式发布前，对它进行审查。' }
    task: { en: 'Run a configured test without shell interpretation, enforce time and output bounds, hash the artifact, verify a signed provenance attestation against an approved issuer, repository, workflow, and subject digest, inspect the complete resolved dependency graph and licenses, and return auditable evidence.', zh: '不经过shell解释运行配置测试，限制时间与输出，计算产物摘要，根据获批签发者、仓库、工作流和主体摘要验证签名来源证明，检查完整解析依赖图及许可证，并返回可审计证据。' }
    code: |
      import { exec } from "node:child_process";
      import { promisify } from "node:util";
      import { readFile } from "node:fs/promises";
      import { createHash } from "node:crypto";

      const run = promisify(exec);

      export async function verifyRelease(request, record) {
        const command = `npm test -- ${request.filter}`;
        const { stdout } = await run(command, { cwd: request.workspace });
        const artifact = await readFile(request.artifact);
        const digest = createHash("sha256").update(artifact).digest("hex");
        const provenance = JSON.parse(await readFile(request.attestation, "utf8"));
        const dependencies = JSON.parse(await readFile("package.json", "utf8")).dependencies;

        return {
          ok:
            stdout.includes("passed") &&
            digest === provenance.subject.digest &&
            Boolean(record.license),
          evidence: { command, stdout, dependencies },
        };
      }
    lang: js
    right: { en: 'The verifier fixes a working directory for the test, reads the artifact as bytes, computes a SHA-256 digest, keeps some command evidence, and returns an explicit decision object.', zh: '验证器为测试固定了工作目录，以字节读取产物并计算SHA-256摘要，保留了部分命令证据，还返回明确的决定对象。' }
    checklist:
      - { en: 'Run an allowlisted executable with argument arrays, cancellation, timeout, and bounded output.', zh: '用参数数组运行允许列表中的可执行文件，并提供取消、超时和输出上限。' }
      - { en: 'Verify the attestation envelope, issuer, repository, workflow, predicate, and exact subject digest.', zh: '验证证明封装、签发者、仓库、工作流、谓词和确切主体摘要。' }
      - { en: 'Resolve the frozen full dependency graph and apply reviewed license policy to distributed contents.', zh: '解析冻结的完整依赖图，并把已审查许可证政策应用于分发内容。' }
      - { en: 'Return exit status, runtime, cwd, truncation, artifact digest, identities, and exceptions as evidence.', zh: '把退出状态、运行时、工作目录、截断、产物摘要、身份和例外作为证据返回。' }
    issues:
      - line: 9
        kind: security
        note: { en: 'A request-controlled filter is interpolated into a shell command, allowing metacharacters to execute outside the intended test. Use an allowlisted binary and argument array.', zh: '请求控制的过滤值被插入shell命令，元字符可执行预期测试之外的操作。应使用允许列表中的二进制文件和参数数组。' }
      - line: 10
        kind: performance
        note: { en: 'The process has no timeout or cancellation path and captures output before returning, so a stuck or noisy test can occupy the verifier. Enforce duration and output budgets.', zh: '进程没有超时或取消路径，并在返回前捕获输出，因此卡住或嘈杂的测试会占用验证器。应强制执行时长与输出预算。' }
      - line: 13
        kind: correctness
        note: { en: 'Parsing adjacent JSON does not verify a signed attestation or trusted builder identity. Verify the envelope and constrain issuer, repository, workflow, predicate, and subject.', zh: '解析旁边的JSON并不等于验证签名证明或可信构建者身份。应验证封装，并约束签发者、仓库、工作流、谓词与主体。' }
      - line: 14
        kind: edge-case
        note: { en: 'Reading only package.json from the process directory omits resolved transitive, optional, and bundled dependencies and may inspect the wrong repository.', zh: '只从进程目录读取package.json，会遗漏解析后的传递、可选与内嵌依赖，还可能检查错误的仓库。' }
      - line: 20
        kind: readability
        note: { en: 'Boolean(record.license) hides the actual compatibility and notice policy behind truthiness. Name and return a reviewed license-policy result with reasons.', zh: 'Boolean(record.license) 用真值掩盖了实际兼容性与通知政策。应使用具名且经过审查的许可证政策结果，并返回理由。' }
    explanation: { en: 'The code collects plausible-looking facts but conflates execution text, byte equality, unsigned metadata, direct dependencies, and a non-empty license string with release approval. Each needs a bounded verifier and explicit trust policy.', zh: '代码收集了看似可信的事实，却把执行文字、字节相等、未签名元数据、直接依赖和非空许可证字符串混同为发布批准。每一项都需要有界验证器与明确的信任政策。' }
    difficulty: advanced
    tags: [release-verification, attestation, dependency-audit, license-policy]
    tests: node --check generated_release_verifier.js
    minutes: 12
