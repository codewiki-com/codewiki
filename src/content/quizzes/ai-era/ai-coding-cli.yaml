topic: ai-era/ai-coding-cli
items:
  - id: predict-delivery-status
    type: predict
    prompt: { en: 'What does this evidence check print?', zh: '这段证据检查会输出什么？' }
    code: |
      checks = {
          "python3 -m pytest tests/test_profile.py": 0,
          "python3 -m ruff check src tests": 2,
      }

      required = (
          "python3 -m pytest tests/test_profile.py",
          "python3 -m ruff check src tests",
      )
      accepted = all(checks.get(command) == 0 for command in required)
      print("ACCEPT" if accepted else "REJECT")
    lang: python
    options:
      - { text: { en: 'REJECT', zh: 'REJECT' }, correct: true }
      - { text: { en: 'ACCEPT', zh: 'ACCEPT' }, correct: false }
      - { text: { en: 'It raises KeyError', zh: '抛出 KeyError' }, correct: false }
    explanation: { en: 'Every required command must be present with exit code 0. The lint command returned 2, so the delivery is rejected.', zh: '每条必需命令都必须存在且退出码为 0。检查命令返回 2，因此交付被拒绝。' }
    difficulty: beginner
    tags: [exit-status, verification, fail-closed]
    tests: python3 evidence_check.py
    minutes: 3

  - id: choose-working-directory
    type: mcq
    prompt: { en: 'Why should an AI coding CLI wrapper set its working directory explicitly?', zh: '为什么 AI 编程 CLI 包装器应该显式设置工作目录？' }
    options:
      - { text: { en: 'It makes relative paths, repository discovery, project rules, and verification commands resolve against the intended checkout', zh: '它让相对路径、仓库发现、项目规则和验证命令都基于预期检出目录解析' }, correct: true }
      - { text: { en: 'It guarantees that the model will generate deterministic patches', zh: '它保证模型生成确定性的补丁' }, correct: false }
      - { text: { en: 'It prevents every subprocess from accessing the network', zh: '它阻止所有子进程访问网络' }, correct: false }
      - { text: { en: 'It automatically removes pre-existing uncommitted changes', zh: '它自动删除会话前已有的未提交修改' }, correct: false }
    explanation: { en: 'The working directory anchors relative filesystem and tool behavior. Determinism, network isolation, and cleanup require separate controls.', zh: '工作目录决定相对文件系统操作与工具行为的起点。确定性、网络隔离和清理需要其他控制。' }
    difficulty: beginner
    tags: [working-directory, repository-root, cwd]
    minutes: 2

  - id: spotbug-unsafe-cli-wrapper
    type: spotbug
    prompt: { en: 'Find the boundary and evidence bugs in this generated wrapper.', zh: '找出这个生成式包装器中的边界与证据错误。' }
    code: |
      from pathlib import Path
      import subprocess

      ROOT = Path("/srv/project")

      def ask_cli(relative_path: str, task: str) -> str:
          target = (ROOT / relative_path).resolve()
          if not str(target).startswith(str(ROOT)):
              raise PermissionError(target)

          command = f'ai-cli "Edit {target}: {task}"'
          completed = subprocess.run(
              command, shell=True, capture_output=True, text=True
          )
          return completed.stdout
    lang: python
    issues:
      - line: 8
        kind: security
        note: { en: 'A string prefix does not prove path containment: /srv/project-private shares the prefix. Use a path-aware containment check against a resolved root.', zh: '字符串前缀不能证明路径包含关系：/srv/project-private 也有相同前缀。应对解析后的根目录使用路径感知检查。' }
      - line: 11
        kind: security
        note: { en: 'The task and path enter a shell command, so quotes and shell syntax can change the command structure. Pass a reviewed argument array without a shell.', zh: '任务与路径进入 shell 命令，引号和 shell 语法可能改变命令结构。应使用经过审查的参数数组，且不经过 shell。' }
      - line: 15
        kind: correctness
        note: { en: 'Returning stdout alone discards exit code and stderr, so callers cannot distinguish a failed CLI run from an empty successful response.', zh: '只返回 stdout 会丢失退出码与 stderr，调用方无法区分失败运行和空的成功响应。' }
    explanation: { en: 'A safe wrapper needs path-aware scope checks, structured process arguments, and a result that preserves failure evidence.', zh: '安全包装器需要路径感知的范围检查、结构化进程参数，以及保留失败证据的结果。' }
    difficulty: intermediate
    tags: [command-injection, path-containment, subprocess]
    tests: python3 -m py_compile unsafe_wrapper.py
    minutes: 6

  - id: choose-ci-interface
    type: mcq
    prompt: { en: 'When is an AI coding CLI suitable for a CI job that creates a draft patch?', zh: '什么情况下，AI 编程 CLI 适合在 CI 中创建草稿补丁？' }
    options:
      - { text: { en: 'Its non-interactive mode has documented failure semantics, bounded runtime, narrow permissions, and machine-checkable output', zh: '其非交互模式具有文档明确的失败语义、有限运行时间、严格权限和机器可检查的输出' }, correct: true }
      - { text: { en: 'Its interactive output looks correct when copied from a developer terminal', zh: '从开发者终端复制的交互输出看起来正确' }, correct: false }
      - { text: { en: 'The job searches the generated prose for the word done', zh: '任务在生成文本中搜索 done 一词' }, correct: false }
      - { text: { en: 'The process has access to production credentials in case they become useful', zh: '进程可以访问生产凭据，以备可能需要' }, correct: false }
    explanation: { en: 'CI needs a stable machine contract and fail-closed limits. Human-readable output and broad credentials are not substitutes for either.', zh: 'CI 需要稳定的机器契约和失败关闭限制。人类可读输出与宽泛凭据都不能替代这些条件。' }
    difficulty: intermediate
    tags: [non-interactive, ci, automation]
    minutes: 3

  - id: review-generated-cli-runner
    type: review
    prompt: { en: 'Review this generated AI coding CLI runner.', zh: '审查这个生成式 AI 编程 CLI 运行器。' }
    task: { en: 'Run a coding CLI on one checkout, preserve useful evidence, prevent prompt text from changing command structure, and accept only a verified patch.', zh: '在一个检出目录中运行编程 CLI，保留有效证据，防止提示文本改变命令结构，并且只接受通过验证的补丁。' }
    code: |
      from pathlib import Path
      import os
      import subprocess

      def run_cli(workspace: Path, prompt: str) -> dict:
          command = f'ai-cli --prompt "{prompt}"'
          result = subprocess.run(
              command,
              shell=True,
              cwd=workspace,
              env=os.environ,
              capture_output=True,
              text=True,
          )
          changed = subprocess.run(
              "git diff --name-only",
              shell=True,
              cwd=workspace,
              capture_output=True,
              text=True,
          )
          passed = "passed" in result.stdout
          return {"status": "done" if passed else "failed",
                  "files": changed.stdout.splitlines()}
    lang: python
    right: { en: 'The runner pins both subprocesses to the supplied workspace, captures their output, and gathers changed paths for later review.', zh: '运行器把两个子进程都固定在给定工作区中，捕获其输出，并收集修改路径供后续审查。' }
    checklist:
      - { en: 'Validate the resolved workspace and establish a clean, recorded baseline.', zh: '验证解析后的工作区，并建立干净且有记录的基线。' }
      - { en: 'Use fixed executable arguments and pass only required environment variables.', zh: '使用固定的可执行参数，只传递必需的环境变量。' }
      - { en: 'Preserve exit codes, stderr, timeouts, truncation, and the exact verification command.', zh: '保留退出码、stderr、超时、截断状态和确切验证命令。' }
      - { en: 'Reject out-of-scope changes and every missing or failed acceptance check.', zh: '拒绝越界修改，以及任何缺失或失败的验收检查。' }
    issues:
      - line: 6
        kind: security
        note: { en: 'Untrusted prompt text is interpolated into a shell command. Quotes, substitutions, or separators can alter the invoked command.', zh: '不可信提示文本被插入 shell 命令。引号、命令替换或分隔符可能改变实际调用。' }
      - line: 11
        kind: edge-case
        note: { en: 'Passing the complete parent environment can expose unrelated tokens and credentials to the CLI and its child processes.', zh: '传递父进程的完整环境，可能向 CLI 及其子进程暴露无关令牌与凭据。' }
      - line: 22
        kind: correctness
        note: { en: 'Searching stdout for passed ignores the process exit code and can match prose, partial output, or a report describing failed tests.', zh: '在 stdout 中搜索 passed 会忽略进程退出码，还可能匹配说明文字、不完整输出或描述失败测试的报告。' }
      - line: 23
        kind: readability
        note: { en: 'The untyped result omits the invoked arguments, exit codes, stderr, and truncation state, making done impossible to audit or reproduce.', zh: '无类型结果遗漏了调用参数、退出码、stderr 和截断状态，使 done 无法审计或复现。' }
    explanation: { en: 'Invoke a documented non-interactive interface with an argument array and minimal environment, then return structured process evidence. A separate delivery gate should verify exit codes, required checks, and diff scope.', zh: '应使用参数数组和最小环境调用文档明确的非交互接口，并返回结构化进程证据。独立交付门还要检查退出码、必需检查和差异范围。' }
    difficulty: advanced
    tags: [code-review, cli-wrapper, evidence, security]
    tests: python3 -m py_compile cli_runner.py
    minutes: 12
