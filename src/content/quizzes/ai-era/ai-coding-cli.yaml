topic: ai-era/ai-coding-cli
items:
  - id: predict-delivery-status
    type: predict
    prompt: { en: 'What does this evidence check print?', zh: '这段证据检查会输出什么？' }
    code: |
      checks = {
          "python3 -m pytest tests/test_profile.py": 0,
          "python3 -m ruff check src tests": 2,
      }

      required = (
          "python3 -m pytest tests/test_profile.py",
          "python3 -m ruff check src tests",
      )
      accepted = all(checks.get(command) == 0 for command in required)
      print("ACCEPT" if accepted else "REJECT")
    lang: python
    options:
      - { text: { en: 'REJECT', zh: 'REJECT' }, correct: true }
      - { text: { en: 'ACCEPT', zh: 'ACCEPT' }, correct: false }
      - { text: { en: 'It raises KeyError', zh: '抛出KeyError' }, correct: false }
    explanation: { en: 'Every required command must be present with exit code 0. The lint command returned 2, so the delivery is rejected.', zh: '每条必需命令都必须存在且退出码为0。检查命令返回2，因此交付被拒绝。' }
    difficulty: beginner
    tags: [exit-status, verification, fail-closed]
    tests: python3 evidence_check.py
    minutes: 3

  - id: choose-working-directory
    type: mcq
    prompt: { en: 'Why should an AI coding CLI wrapper set its working directory explicitly?', zh: '为什么AI编程CLI包装器应该显式设置工作目录？' }
    options:
      - { text: { en: 'It makes relative paths, repository discovery, project rules, and verification commands resolve against the intended checkout', zh: '它让相对路径、仓库发现、项目规则和验证命令都基于预期检出目录解析' }, correct: true }
      - { text: { en: 'It guarantees that the model will generate deterministic patches', zh: '它保证模型生成确定性的补丁' }, correct: false }
      - { text: { en: 'It prevents every subprocess from accessing the network', zh: '它阻止所有子进程访问网络' }, correct: false }
      - { text: { en: 'It automatically removes pre-existing uncommitted changes', zh: '它自动删除会话前已有的未提交修改' }, correct: false }
    explanation: { en: 'The working directory anchors relative filesystem and tool behavior. Determinism, network isolation, and cleanup require separate controls.', zh: '工作目录决定相对文件系统操作与工具行为的起点。确定性、网络隔离和清理需要其他控制。' }
    difficulty: beginner
    tags: [working-directory, repository-root, cwd]
    minutes: 2

  - id: spotbug-unsafe-cli-wrapper
    title: { en: 'Spot the bug in the CLI wrapper', zh: '找出CLI包装器里的bug' }
    type: spotbug
    prompt: { en: 'Find the boundary and evidence bugs in this generated wrapper.', zh: '找出这个生成式包装器中的边界与证据错误。' }
    code: |
      from pathlib import Path
      import subprocess

      ROOT = Path("/srv/project")

      def ask_cli(relative_path: str, task: str) -> str:
          target = (ROOT / relative_path).resolve()
          if not str(target).startswith(str(ROOT)):
              raise PermissionError(target)

          command = f'ai-cli "Edit {target}: {task}"'
          completed = subprocess.run(
              command, shell=True, capture_output=True, text=True
          )
          return completed.stdout
    lang: python
    issues:
      - line: 8
        kind: security
        note: { en: 'A string prefix does not prove path containment: /srv/project-private shares the prefix. Use a path-aware containment check against a resolved root.', zh: '字符串前缀不能证明路径包含关系：/srv/project-private也有相同前缀。应对解析后的根目录使用路径感知检查。' }
      - line: 11
        kind: security
        note: { en: 'The task and path enter a shell command, so quotes and shell syntax can change the command structure. Pass a reviewed argument array without a shell.', zh: '任务与路径进入shell命令，引号和shell语法可能改变命令结构。应使用经过审查的参数数组，且不经过shell。' }
      - line: 15
        kind: correctness
        note: { en: 'Returning stdout alone discards exit code and stderr, so callers cannot distinguish a failed CLI run from an empty successful response.', zh: '只返回stdout会丢失退出码与stderr，调用方无法区分失败运行和空的成功响应。' }
    explanation: { en: 'A safe wrapper needs path-aware scope checks, structured process arguments, and a result that preserves failure evidence.', zh: '安全包装器需要路径感知的范围检查、结构化进程参数，以及保留失败证据的结果。' }
    difficulty: intermediate
    tags: [command-injection, path-containment, subprocess]
    tests: python3 -m py_compile unsafe_wrapper.py
    minutes: 6

  - id: choose-ci-interface
    type: mcq
    prompt: { en: 'When is an AI coding CLI suitable for a CI job that creates a draft patch?', zh: '什么情况下，AI编程CLI适合在CI中创建草稿补丁？' }
    options:
      - { text: { en: 'Its non-interactive mode has documented failure semantics, bounded runtime, narrow permissions, and machine-checkable output', zh: '其非交互模式具有文档明确的失败语义、有限运行时间、严格权限和机器可检查的输出' }, correct: true }
      - { text: { en: 'Its interactive output looks correct when copied from a developer terminal', zh: '从开发者终端复制的交互输出看起来正确' }, correct: false }
      - { text: { en: 'The job searches the generated prose for the word done', zh: '任务在生成文本中搜索done一词' }, correct: false }
      - { text: { en: 'The process has access to production credentials in case they become useful', zh: '进程可以访问生产凭据，以备可能需要' }, correct: false }
    explanation: { en: 'CI needs a stable machine contract and fail-closed limits. Human-readable output and broad credentials are not substitutes for either.', zh: 'CI需要稳定的机器契约和失败关闭限制。人类可读输出与宽泛凭据都不能替代这些条件。' }
    difficulty: intermediate
    tags: [non-interactive, ci, automation]
    minutes: 3

  - id: review-generated-cli-runner
    type: review
    title: { en: 'Review a generated CLI automation runner', zh: '审查生成的CLI自动化运行器' }
    prompt: { en: 'Review this generated code before using it in automation.', zh: '在将这段生成的代码用于自动化流程前，请对其进行审查。' }
    task: { en: 'Run an AI coding CLI on the supplied checkout, stop it after five minutes, retain process evidence, and report success only from its documented machine result.', zh: '在给定检出目录中运行AI编程CLI，五分钟后停止运行，保留进程证据，并且只根据其文档化的机器可读结果报告成功。' }
    code: |
      from pathlib import Path
      import os
      import subprocess

      def run_cli(workspace: Path, prompt: str) -> dict[str, object]:
          result = subprocess.run(
              ["ai-cli", "--non-interactive", "--prompt", prompt],
              cwd=workspace,
              env=os.environ.copy(),
              capture_output=True,
              text=True,
              timeout=300,
          )
          passed = result.returncode == 0 and '"status":"passed"' in result.stdout
          return {
              "passed": passed,
              "argv": result.args,
              "exit_code": result.returncode,
              "stdout": result.stdout,
              "stderr": result.stderr,
          }
    lang: python
    issues:
      - line: 9
        kind: security
        note: { en: 'Copying the entire parent environment exposes unrelated tokens and credentials to the CLI and any child processes; construct a minimal allowlisted environment.', zh: '复制父进程的完整环境会向CLI及其子进程暴露无关令牌和凭据；应构造仅包含允许项的最小环境。' }
      - line: 10
        kind: performance
        note: { en: 'capture_output buffers both streams without a size limit, so a verbose or stuck run can exhaust the wrapper’s memory; consume output with an explicit cap.', zh: 'capture_output会在没有大小上限的情况下缓冲两个输出流，详细或卡住的运行可能耗尽包装器内存；应设置明确上限并按限额读取输出。' }
      - line: 12
        kind: edge-case
        note: { en: 'A timeout raises TimeoutExpired instead of returning the promised structured evidence; catch it and record the timeout plus any partial output.', zh: '超时时会抛出TimeoutExpired，而不是返回承诺的结构化证据；应捕获该异常，并记录超时状态和任何部分输出。' }
      - line: 14
        kind: correctness
        note: { en: 'A raw substring is not a machine-result parser and can match logs or malformed output; parse and validate the documented response format.', zh: '原始子串搜索不是机器可读结果解析器，它可能匹配日志或格式错误的输出；应解析并验证文档中规定的响应格式。' }
    right: { en: 'The runner uses an argument array, fixes the working directory, sets a finite runtime, and keeps argv, exit status, stdout, and stderr separate on normal completion.', zh: '该运行器使用参数数组、固定工作目录、设置有限运行时间，并在正常结束时分别保留argv、退出状态、stdout和stderr。' }
    checklist:
      - { en: 'Pass only the environment variables required for the run.', zh: '只传递本次运行必需的环境变量。' }
      - { en: 'Bound runtime and captured output, including timeout and cancellation paths.', zh: '限制运行时间和捕获的输出，并覆盖超时与取消路径。' }
      - { en: 'Parse and validate the documented machine-readable result.', zh: '解析并验证文档化的机器可读结果。' }
      - { en: 'Keep argv, exit status, stdout, stderr, and truncation state auditable.', zh: '使argv、退出状态、stdout、stderr和截断状态可供审计。' }
    explanation: { en: 'The argument boundary is sound, but process isolation, resource limits, timeout handling, and success parsing are separate contracts. Fix them while preserving distinct stdout, stderr, and exit-status evidence.', zh: '参数边界处理正确，但进程隔离、资源限制、超时处理和成功判定是彼此独立的约定。修复这些问题时，应继续分别保留stdout、stderr和退出状态证据。' }
    difficulty: advanced
    tags: [code-review, cli-automation, subprocess, verification]
    tests: python3 -m py_compile cli_automation_runner.py
    minutes: 10
