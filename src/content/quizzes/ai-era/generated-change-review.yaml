topic: ai-era/generated-change-review
items:
  - id: predict-falsy-limit
    type: predict
    prompt: { en: 'What does this generated pagination helper print for a zero limit?', zh: '这个生成的分页辅助函数在限制值为零时输出什么？' }
    code: |
      function takePublished(products, limit = 20) {
        return products
          .filter((product) => product.published)
          .slice(0, limit || 20);
      }

      const products = [
        { sku: "A", published: true },
        { sku: "B", published: false },
        { sku: "C", published: true },
      ];

      console.log(takePublished(products, 0).map((p) => p.sku));
    lang: js
    options:
      - { text: { en: "[ 'A', 'C' ]", zh: "[ 'A', 'C' ]" }, correct: true }
      - { text: { en: '[]', zh: '[]' }, correct: false }
      - { text: { en: "[ 'A' ]", zh: "[ 'A' ]" }, correct: false }
    explanation: { en: 'Zero is falsy, so limit || 20 evaluates to 20 and both published products are returned. The result violates a contract in which zero means no products.', zh: '零是假值，因此 limit || 20 得到 20，并返回两个已发布产品。如果契约规定零表示不返回产品，这个结果就违反了契约。' }
    difficulty: beginner
    tags: [edge-case, falsy-value, contract]
    tests: node predict_falsy_limit.js
    minutes: 3

  - id: choose-return-contract-review
    type: mcq
    prompt: { en: 'A generated change replaces a Boolean return value with { ok, value }. What is the strongest next review step?', zh: '生成式改动把布尔返回值换成了 { ok, value }。接下来最有力的审查步骤是什么？' }
    options:
      - { text: { en: 'Audit every caller and adapter for branching, destructuring, serialization, and error behavior', zh: '审计每个调用方与适配器的分支、解构、序列化和错误行为' }, correct: true }
      - { text: { en: 'Approve because an object carries more information than a Boolean', zh: '对象携带的信息比布尔值更多，因此直接批准' }, correct: false }
      - { text: { en: 'Run the formatter to prove the new object syntax is valid', zh: '运行格式化工具，证明新的对象语法有效' }, correct: false }
      - { text: { en: 'Check only the function that constructs the result object', zh: '只检查构造结果对象的函数' }, correct: false }
    explanation: { en: 'The return contract crosses the function boundary. Old callers can treat even { ok: false } as truthy or serialize an incompatible shape.', zh: '返回契约跨越了函数边界。旧调用方可能把 { ok: false } 也当成真，或序列化出不兼容的形状。' }
    difficulty: intermediate
    tags: [api-contract, call-site-audit, compatibility]
    minutes: 2

  - id: spotbug-reservation-callers
    title: { en: 'Spot the bug in reservation callers', zh: '找出预订调用方里的 bug' }
    type: spotbug
    prompt: { en: 'Find the edge-case and cross-boundary defects in this generated reservation change.', zh: '找出这个生成式预留改动中的边界情况与跨边界缺陷。' }
    code: |
      function reserve(stock, quantity) {
        return {
          ok: quantity <= stock,
          remaining: quantity <= stock ? stock - quantity : stock,
        };
      }

      function checkout(inventory, sku, quantity) {
        const result = reserve(inventory.get(sku), quantity);
        if (result) {
          inventory.set(sku, inventory.get(sku) - quantity);
          return "reserved";
        }
        return "out of stock";
      }
    lang: js
    issues:
      - line: 3
        kind: edge-case
        note: { en: 'Negative and zero quantities satisfy quantity <= stock; the input contract needs an explicit positive-integer check.', zh: '负数和零都满足 quantity <= stock；输入契约需要显式检查正整数。' }
      - line: 10
        kind: correctness
        note: { en: 'Every result object is truthy, so a failed reservation enters the success branch. The caller must check result.ok.', zh: '每个结果对象都是真值，因此预留失败也会进入成功分支。调用方必须检查 result.ok。' }
      - line: 11
        kind: correctness
        note: { en: 'The caller recomputes stock instead of applying result.remaining, duplicating the callee contract and allowing the two calculations to drift.', zh: '调用方没有使用 result.remaining，而是重新计算库存，重复了被调用方契约，两处计算可能逐渐不一致。' }
    explanation: { en: 'Reviewing reserve alone misses the stale caller. The fix validates quantity, branches on result.ok, and uses the result as the single state-transition decision.', zh: '只审查 reserve 会漏掉过期调用方。修复应验证 quantity，根据 result.ok 分支，并让结果对象成为状态转换的唯一决定。' }
    difficulty: intermediate
    tags: [edge-case, stale-caller, state]
    tests: node --check reservation_callers.js
    minutes: 6

  - id: choose-independent-test-oracle
    type: mcq
    prompt: { en: 'Which test is the most independent evidence for a generated sorting refactor?', zh: '对于生成式排序重构，哪项测试是最独立的证据？' }
    options:
      - { text: { en: 'Assert the required order and that the caller-owned input remains unchanged after the call', zh: '同时断言所需顺序，并断言调用方拥有的输入在调用后保持不变' }, correct: true }
      - { text: { en: 'Copy the generated comparator expression into the expected-value calculation', zh: '把生成的比较器表达式复制到预期值计算中' }, correct: false }
      - { text: { en: 'Update the snapshot and accept it because the output is deterministic', zh: '更新快照，并因为输出确定而接受它' }, correct: false }
      - { text: { en: 'Assert only that the result has the same array length', zh: '只断言结果数组长度相同' }, correct: false }
    explanation: { en: 'The first option checks both ordering and the ownership contract without repeating the implementation. The other options can pass while mutation or wrong ordering survives.', zh: '第一项不复述实现，同时检查顺序与所有权契约。其他选项可能在修改输入或顺序错误仍然存在时通过。' }
    difficulty: intermediate
    tags: [test-oracle, mutation, invariants]
    minutes: 2

  - id: review-generated-customer-update
    type: review
    title: { en: 'Review a generated customer email update', zh: '审查生成的客户邮箱更新' }
    prompt: { en: 'Review this generated handler before it is connected to the support API.', zh: '在把这个生成的处理器接入支持 API 前审查它。' }
    task: { en: 'Let an authorized support agent update a customer email within the agent tenant, validate malformed input as a 400 response, prevent lost concurrent updates with an expected version, and keep email addresses out of audit records.', zh: '允许已授权的支持人员在自己的租户内更新客户邮箱；把畸形输入作为 400 响应处理；通过预期版本防止并发更新丢失；审计记录不得包含邮箱地址。' }
    code: |
      async function updateCustomer(request, store, audit) {
        const customer = await store.find(request.params.id);
        if (!customer) {
          return { status: 404, body: { error: "not found" } };
        }

        const email = request.body.email.trim().toLowerCase();
        if (!email.includes("@")) {
          return { status: 400, body: { error: "invalid email" } };
        }

        customer.email = email;
        customer.version += 1;
        await store.save(customer);
        audit.push({
          actor: request.user.id,
          customerId: customer.id,
          email,
        });
        return { status: 200, body: customer };
      }
    lang: js
    right: { en: 'The handler returns explicit 404 and 400 responses, normalizes the email, awaits persistence, records an actor and customer identifier, and returns a structured success response.', zh: '处理器返回明确的 404 与 400 响应，对邮箱做规范化，等待持久化完成，记录操作者与客户标识，并返回结构化成功响应。' }
    checklist:
      - { en: 'Trace authentication, authorization, and tenant scope into the store lookup.', zh: '把认证、授权和租户范围追踪到存储查询。' }
      - { en: 'Exercise missing, non-string, malformed, and already-normalized email inputs.', zh: '练习缺失、非字符串、畸形和已规范化的邮箱输入。' }
      - { en: 'Interleave two updates with the same expected version and prove one conflicts.', zh: '让两次使用相同预期版本的更新交错，并证明其中一次发生冲突。' }
      - { en: 'Inspect response and audit fields for unnecessary personal data.', zh: '检查响应与审计字段中是否包含不必要的个人数据。' }
    issues:
      - line: 2
        kind: security
        note: { en: 'The lookup uses only a request-controlled customer id and performs no support-role or tenant-scoped authorization, allowing cross-tenant access if the store is global.', zh: '查询只使用请求控制的客户 id，没有检查支持角色，也没有限制租户；如果存储是全局的，就可能跨租户访问。' }
      - line: 7
        kind: edge-case
        note: { en: 'A missing, null, or non-string email throws before the intended 400 response. Validate the value type before calling trim.', zh: '缺失、null 或非字符串邮箱会在预期的 400 响应前抛错。调用 trim 前应验证值类型。' }
      - line: 14
        kind: correctness
        note: { en: 'Saving the mutated object without comparing request.expectedVersion permits two writers to overwrite each other. Use a conditional update and return a conflict for the loser.', zh: '保存已修改对象时没有比较 request.expectedVersion，两个写入者可能互相覆盖。应使用条件更新，并让失败者返回冲突。' }
      - line: 18
        kind: readability
        note: { en: 'The audit payload embeds the raw email despite the task excluding it; define a named audit-event shape with only approved fields so the privacy rule is visible.', zh: '任务要求排除邮箱，但审计载荷仍包含原始邮箱。应定义只含批准字段的具名审计事件形状，让隐私规则清晰可见。' }
    explanation: { en: 'The local update path looks orderly, but repository boundaries carry the real requirements: scoped authorization, defensive input handling, optimistic concurrency, and a privacy-safe audit contract.', zh: '局部更新路径看起来有条理，但真正的要求位于代码库边界：限定范围的授权、防御性输入处理、乐观并发，以及保护隐私的审计契约。' }
    difficulty: advanced
    tags: [code-review, authorization, concurrency, privacy]
    tests: node --check customer_update.js
    minutes: 12
