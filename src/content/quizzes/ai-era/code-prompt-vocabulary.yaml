topic: ai-era/code-prompt-vocabulary
items:
  - id: choose-interface-wording
    type: mcq
    prompt: { en: 'Which request most precisely preserves a function interface?', zh: '哪条请求能最精确地保留函数接口？' }
    options:
      - { text: { en: 'Keep positional and keyword calls to loadUser(id, timeout=...) valid, preserve its return fields and exception types, and update no callers', zh: '保持对 loadUser(id, timeout=...) 的位置调用和关键字调用有效，保留返回字段与异常类型，并且不修改调用方' }, correct: true }
      - { text: { en: 'Clean up loadUser without breaking anything', zh: '清理 loadUser，不要破坏任何东西' }, correct: false }
      - { text: { en: 'Keep the API roughly the same and improve errors', zh: '让 API 大致保持不变，并改进错误处理' }, correct: false }
      - { text: { en: 'Refactor loadUser into a better abstraction', zh: '把 loadUser 重构成更好的抽象' }, correct: false }
    explanation: { en: 'The correct request names protected call forms, result shape, failure channel, and edit scope. The other requests leave those observable dimensions open.', zh: '正确请求明确了受保护的调用形式、结果结构、失败通道与改动范围；其他请求都没有限定这些可观察维度。' }
    difficulty: beginner
    tags: [function-signature, compatibility, call-site]
    minutes: 2

  - id: predict-shipment-contract
    type: predict
    prompt: { en: 'What does this contract-focused example print?', zh: '这个以契约为中心的示例会输出什么？' }
    code: |
      function formatShipmentId(prefix, sequence) {
        if (!/^[A-Z]{2,4}$/.test(prefix)) {
          throw new TypeError("invalid prefix");
        }
        return `${prefix}-${String(sequence).padStart(6, "0")}`;
      }

      console.log(formatShipmentId("EU", 42));
      try {
        console.log(formatShipmentId("eu", 42));
      } catch (error) {
        console.log(error.name);
      }
    lang: javascript
    options:
      - { text: { en: 'EU-000042, then TypeError', zh: '先输出 EU-000042，再输出 TypeError' }, correct: true }
      - { text: { en: 'EU-42, then eu-000042', zh: '先输出 EU-42，再输出 eu-000042' }, correct: false }
      - { text: { en: 'EU-000042, then invalid prefix', zh: '先输出 EU-000042，再输出 invalid prefix' }, correct: false }
    explanation: { en: 'The return-format postcondition pads 42 to six digits. The lowercase prefix violates the precondition, and the catch block prints only the exception type.', zh: '返回格式的后置条件把 42 补齐为六位。小写前缀违反前置条件，catch 代码块只输出异常类型。' }
    difficulty: beginner
    tags: [precondition, postcondition, failure-mode]
    tests: node shipment_contract.js
    minutes: 3

  - id: spotbug-reservation-contract
    title: { en: 'Spot the bug in seat reservation', zh: '找出座位预订里的 bug' }
    type: spotbug
    prompt: { en: 'Find the contract failures in this generated reservation function.', zh: '找出这个生成式预订函数违反契约的地方。' }
    code: |
      function reserveSeats(inventory, requested) {
        if (!requested) return inventory;
        inventory.available -= requested;
        if (inventory.available < 0) {
          console.log("not enough seats");
        }
        return inventory;
      }
    lang: javascript
    issues:
      - line: 2
        kind: edge-case
        note: { en: 'A truthiness check groups zero, NaN, null, and undefined into one silent return. Validate the stated numeric input domain and use the promised error channel.', zh: '真假值检查把零、NaN、null 与 undefined 合并成一次静默返回。应验证规定的数值输入域，并使用承诺的错误通道。' }
      - line: 3
        kind: correctness
        note: { en: 'The function mutates the input and can make available negative before it checks the invariant. Reject excessive demand before any state transition.', zh: '函数先修改输入，可能让 available 变成负数，随后才检查不变量。应在任何状态转换前拒绝超额需求。' }
      - line: 5
        kind: correctness
        note: { en: 'Logging does not communicate failure to the caller, and the function still returns invalid inventory. Return the specified tagged failure with unchanged state.', zh: '记录日志没有把失败传给调用方，函数仍会返回无效库存。应在状态不变的前提下返回规定的带标签失败结果。' }
    explanation: { en: 'The implementation needs explicit validation, a pre-mutation invariant check, and a caller-visible failure value. Each fix follows from a named contract branch.', zh: '实现需要显式验证、修改前的不变量检查，以及调用方可见的失败值。每项修复都对应契约中的一个具名分支。' }
    difficulty: beginner
    tags: [invariant, side-effect, error-channel]
    minutes: 5

  - id: choose-failure-contract
    type: mcq
    prompt: { en: 'Which wording defines a reviewable failure contract?', zh: '哪种表述定义了可审查的失败契约？' }
    options:
      - { text: { en: 'For insufficient seats, return { ok: false, error: INSUFFICIENT_SEATS }, leave inventory unchanged, and send no confirmation', zh: '座位不足时返回 { ok: false, error: INSUFFICIENT_SEATS }，保持库存不变，并且不发送确认消息' }, correct: true }
      - { text: { en: 'Handle every reservation error gracefully', zh: '妥善处理所有预订错误' }, correct: false }
      - { text: { en: 'Catch exceptions and write useful logs', zh: '捕获异常并写入有用日志' }, correct: false }
      - { text: { en: 'Never let anything bad happen during reservation', zh: '绝不允许预订期间发生任何坏事' }, correct: false }
    explanation: { en: 'A failure contract names its trigger, channel, stable code, state guarantee, and forbidden side effect. Graceful handling and logging do not define caller-visible behavior.', zh: '失败契约要说明触发条件、通道、稳定代码、状态保证和禁止的副作用。「妥善处理」与记录日志都没有定义调用方可见行为。' }
    difficulty: beginner
    tags: [failure-mode, error-channel, atomic-transition]
    minutes: 2

  - id: choose-dependency-seam
    type: mcq
    prompt: { en: 'Why ask to keep delivery behind an injected callable?', zh: '为什么要把发送操作保留在注入的可调用对象之后？' }
    options:
      - { text: { en: 'It creates a named seam where tests can observe or replace the side effect without changing orchestration', zh: '它建立一个具名接缝，让测试无需改变编排逻辑就能观察或替换副作用' }, correct: true }
      - { text: { en: 'It guarantees that every delivery is idempotent', zh: '它能保证每次发送都具有幂等性' }, correct: false }
      - { text: { en: 'It makes rejected promises impossible', zh: '它会让 Promise 不可能被拒绝' }, correct: false }
      - { text: { en: 'It proves that a framework mock is required', zh: '它能证明必须使用框架 mock' }, correct: false }
    explanation: { en: 'Injection identifies a replaceable boundary, but it does not define idempotency or failure behavior. The test can use any faithful fake, spy, or mock.', zh: '注入明确了可替换边界，却不会定义幂等性或失败行为。测试可以使用任何忠实的替身、侦测对象或 mock。' }
    difficulty: intermediate
    tags: [architecture-boundary, dependency-seam, side-effect]
    minutes: 2

  - id: review-generated-receipt-sender
    type: review
    title: { en: 'Review a generated receipt sender', zh: '审查生成的收据发送器' }
    prompt: { en: 'Review this generated implementation against the stated change contract.', zh: '根据给定的改动契约审查这段生成实现。' }
    task: { en: 'Send at most one receipt for each tenant and order under concurrent calls, accept zero-total orders, return a tagged success or failure result, avoid exposing customer data, and use no unbounded process cache.', zh: '并发调用时，每个租户与订单最多发送一份收据；接受总额为零的订单；返回带标签的成功或失败结果；不暴露客户数据；不使用无限增长的进程缓存。' }
    code: |
      const sentOrderIds = new Set();

      async function sendReceipt(order, mailer) {
        if (!order.email || !order.total) {
          return false;
        }

        if (sentOrderIds.has(order.id)) {
          return true;
        }

        try {
          const message = `Receipt ${order.id}: ${order.total}`;
          await mailer.send(order.email, message);
          sentOrderIds.add(order.id);
          return true;
        } catch (error) {
          console.log("receipt failed", error, order);
          return false;
        }
      }
    lang: javascript
    issues:
      - line: 1
        kind: performance
        note: { en: 'The process-wide Set has no eviction or size bound, so memory grows with every distinct order for the lifetime of the process.', zh: '进程级 Set 没有淘汰规则或大小上限，内存会在进程生命周期内随不同订单持续增长。' }
      - line: 4
        kind: edge-case
        note: { en: 'The truthiness check rejects a valid numeric total of zero. Validate the explicit domain rather than using falsiness as a proxy.', zh: '真假值检查会拒绝有效的数值总额零。应验证明确的输入域，不能用假值代替。' }
      - line: 8
        lines: 8
        kind: correctness
        note: { en: 'The check and post-send Set update are not atomic, omit tenant identity, and vanish on restart; concurrent calls can both send and equal order IDs from different tenants collide.', zh: '检查与发送后的 Set 更新不是原子操作，也没有租户标识，重启后还会丢失；并发调用可能重复发送，不同租户的相同订单 ID 也会冲突。' }
      - line: 18
        kind: security
        note: { en: 'Logging the full error and order can expose email addresses and other customer data. Emit an approved identifier and sanitized failure metadata only.', zh: '记录完整错误与订单可能暴露邮箱和其他客户数据。日志中只能输出获准标识与清理后的失败元数据。' }
    right: { en: 'The function awaits the injected mailer, keeps delivery behind one replaceable dependency, checks required data before sending, and converts rejection into an explicit return path.', zh: '函数会等待注入的 mailer，把发送操作留在一个可替换依赖之后，在发送前检查必需数据，并把拒绝转换成显式返回路径。' }
    checklist:
      - { en: 'Test zero totals and malformed email or total values against the declared input domain.', zh: '根据声明的输入域测试零总额，以及格式错误的邮箱或总额。' }
      - { en: 'Run two concurrent calls for the same tenant and order and prove only one delivery crosses the seam.', zh: '对同一租户与订单发起两次并发调用，并证明只有一次发送穿过接缝。' }
      - { en: 'Check that success and each failure use distinct tagged results without customer data in logs.', zh: '检查成功与每种失败是否使用不同的带标签结果，并确保日志不包含客户数据。' }
      - { en: 'Inspect the deduplication store for tenant scoping, atomicity, durability, retention, and bounded growth.', zh: '检查去重存储的租户范围、原子性、持久性、保留规则与增长上限。' }
    explanation: { en: 'The prompt vocabulary exposes four independent review dimensions: an edge-case input, an atomic and tenant-scoped effect, a bounded state owner, and a safe error channel. A Boolean plus a process-local Set satisfies none of those contracts completely.', zh: '提示词术语暴露出四个独立审查维度：边界输入、具有原子性且按租户隔离的效果、受限状态所有者，以及安全错误通道。布尔值与进程本地 Set 无法完整满足任何一项契约。' }
    difficulty: intermediate
    tags: [code-review, idempotency, failure-mode, side-effect]
    tests: node --check receipt_sender.js
    minutes: 10
