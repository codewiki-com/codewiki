topic: ai-era/ai-ide
items:
  - id: predict-context-selection
    type: predict
    prompt: { en: 'Which paths does this bounded context picker print?', zh: '这个有边界的上下文选择器会输出哪些路径？' }
    code: |
      const files = [
        { path: "src/pay.js", source: "selection", size: 900 },
        { path: "dist/pay.js", source: "index", size: 700 },
        { path: "test/pay.test.js", source: "diagnostic", size: 800 },
      ];

      const rank = { selection: 0, diagnostic: 1, index: 2 };
      const picked = files
        .filter((file) => !file.path.startsWith("dist/"))
        .sort((left, right) => rank[left.source] - rank[right.source])
        .slice(0, 2);

      console.log(picked.map((file) => file.path).join(", "));
    lang: js
    options:
      - { text: { en: 'src/pay.js, test/pay.test.js', zh: 'src/pay.js, test/pay.test.js' }, correct: true }
      - { text: { en: 'src/pay.js, dist/pay.js', zh: 'src/pay.js, dist/pay.js' }, correct: false }
      - { text: { en: 'All three paths', zh: '全部三个路径' }, correct: false }
    explanation: { en: 'The picker excludes dist before sorting, then selection outranks diagnostic. The two remaining paths fit the final slice.', zh: '选择器先排除 dist，再按优先级排序；selection 高于 diagnostic，最后保留剩下的两个路径。' }
    difficulty: beginner
    tags: [context-selection, context-window, ignore-rules]
    tests: node predict_context.js
    minutes: 3

  - id: choose-authoritative-context
    type: mcq
    prompt: { en: 'A generated edit depends on an exact public function signature. Which context choice is strongest?', zh: '生成式修改依赖一个精确的公共函数签名。哪种上下文选择最可靠？' }
    options:
      - { text: { en: 'Attach the current declaration and its contract tests, then confirm the response names both paths', zh: '附加当前声明与契约测试，并确认回答列出这两个路径' }, correct: true }
      - { text: { en: 'Open several related tabs and assume the IDE sends all of them', zh: '打开几个相关标签页，并假定 IDE 会全部发送' }, correct: false }
      - { text: { en: 'Ask for a longer answer so the model has more room to remember', zh: '要求更长的回答，让模型有更多空间记忆' }, correct: false }
      - { text: { en: 'Attach the whole dependency directory in case the signature appears there', zh: '附加整个依赖目录，以防签名出现在其中' }, correct: false }
    explanation: { en: 'Explicit, current source and tests are auditable inputs. Open tabs, response length, and bulk dependencies do not establish what the model actually received.', zh: '显式提供的当前源码与测试是可审计输入。打开的标签页、回答长度和整包依赖都不能证明模型实际收到了什么。' }
    difficulty: beginner
    tags: [explicit-context, contracts, provenance]
    minutes: 2

  - id: spotbug-unsafe-ide-bridge
    type: spotbug
    prompt: { en: 'Find the scope, command, and completion bugs in this generated IDE bridge.', zh: '找出这个生成式 IDE 桥接器中的范围、命令与完成状态错误。' }
    code: |
      import { readFileSync, writeFileSync } from "node:fs";
      import { exec } from "node:child_process";

      function applySuggestion(workspace, request, proposal) {
        const contextPath = `${workspace}/${request.context}`;
        const context = readFileSync(contextPath, "utf8");
        const command = `cd ${workspace} && ${proposal.command}`;
        exec(command, () => console.log("checked"));
        const target = `${workspace}/${proposal.path}`;
        writeFileSync(target, proposal.content);
        return { status: "done", context };
      }
    lang: js
    issues:
      - line: 5
        kind: security
        note: { en: 'String concatenation does not keep request.context inside the workspace; absolute segments and traversal need resolved, path-aware containment checks.', zh: '字符串拼接不能保证 request.context 位于工作区内；绝对路径和路径穿越必须经过解析后的路径感知范围检查。' }
      - line: 7
        kind: security
        note: { en: 'A model-authored command and workspace are interpolated into a shell command, so shell syntax can change the operation. Use a reviewed executable and argument array.', zh: '模型生成的命令与工作区被插入 shell 字符串，shell 语法可以改变实际操作。应使用经过审查的可执行文件与参数数组。' }
      - line: 11
        kind: correctness
        note: { en: 'The function returns done before the asynchronous command finishes, without its exit status or stderr, so a failed check is reported as completion.', zh: '函数在异步命令结束前就返回 done，也不保留退出状态与 stderr，因此失败检查会被报告为完成。' }
    explanation: { en: 'An IDE bridge must validate resolved paths, keep untrusted text out of shell structure, and derive completion from finished process evidence.', zh: 'IDE 桥接器必须验证解析后的路径，避免不可信文本进入 shell 结构，并根据已结束进程的证据判断完成状态。' }
    difficulty: intermediate
    tags: [path-containment, command-injection, async-process]
    tests: node --check unsafe_ide_bridge.js
    minutes: 7

  - id: choose-stale-edit-response
    type: mcq
    prompt: { en: 'The model proposes a patch against code you changed manually two minutes ago. What should you do first?', zh: '模型针对你两分钟前手工修改过的代码提出补丁。首先应该怎么做？' }
    options:
      - { text: { en: 'Reject or pause the patch, reread the current file and diff, then regenerate against the new baseline', zh: '拒绝或暂停补丁，重新读取当前文件与差异，再基于新基线生成' }, correct: true }
      - { text: { en: 'Apply it because the IDE will always merge semantic intent correctly', zh: '直接应用，因为 IDE 总能正确合并语义意图' }, correct: false }
      - { text: { en: 'Accept only the longest hunk because it contains more context', zh: '只接受最长的差异块，因为它包含更多上下文' }, correct: false }
      - { text: { en: 'Ask the model whether it feels confident before applying', zh: '应用前询问模型是否有信心' }, correct: false }
    explanation: { en: 'The proposal has a stale preimage. Refreshing source and baseline prevents an old replacement from silently overwriting newer work.', zh: '这个建议使用了过期前像。刷新源码与基线，可以防止旧替换内容悄悄覆盖较新的修改。' }
    difficulty: intermediate
    tags: [stale-context, diff-review, baseline]
    minutes: 2

  - id: review-generated-ide-task-runner
    type: review
    prompt: { en: 'Review this generated runner for an AI IDE task.', zh: '审查这个生成式 AI IDE 任务运行器。' }
    task: { en: 'Give a model enough repository context to fix order totals, keep writes inside two approved files, run the repository-owned checks, and return auditable completion evidence.', zh: '向模型提供足以修复订单总价的仓库上下文，把写入限制在两个批准文件内，运行仓库定义的检查，并返回可审计的完成证据。' }
    code: |
      import { globSync, readFileSync, writeFileSync } from "node:fs";
      import { execSync } from "node:child_process";

      function runIdeTask(workspace, task, model) {
        const files = globSync("**/*", { cwd: workspace });
        const context = files
          .map((name) => readFileSync(`${workspace}/${name}`, "utf8"))
          .join("\n");
        const response = model.generate(`${task}\n${context}`);

        for (const edit of response.edits) {
          const target = `${workspace}/${edit.path}`;
          writeFileSync(target, edit.content);
        }
        const testOutput = execSync(response.testCommand, {
          cwd: workspace,
          encoding: "utf8",
          env: process.env,
        });
        return {
          status: "done",
          summary: response.summary,
          testOutput,
        };
      }
    lang: js
    right: { en: 'The runner gives the model task text plus repository content, pins the command to a workspace, captures command output, and returns a structured object.', zh: '运行器把任务文字与仓库内容交给模型，将命令固定在一个工作区中，捕获命令输出，并返回结构化对象。' }
    checklist:
      - { en: 'Name authoritative context and exclude dependencies, generated output, binaries, and sensitive files.', zh: '明确权威上下文，并排除依赖、生成产物、二进制文件和敏感文件。' }
      - { en: 'Resolve every write target and prove that it belongs to the approved path set.', zh: '解析每个写入目标，并证明它属于批准路径集合。' }
      - { en: 'Run fixed repository-owned acceptance commands with a minimal environment.', zh: '使用最小环境运行固定的仓库验收命令。' }
      - { en: 'Return the diff, commands, working directories, exit status, stderr, and skipped checks.', zh: '返回差异、命令、工作目录、退出状态、stderr 和跳过的检查。' }
    issues:
      - line: 5
        kind: performance
        note: { en: 'The unbounded glob eagerly reads the whole workspace, including dependencies, generated output, binaries, and potentially sensitive files.', zh: '无边界 glob 会预读整个工作区，包括依赖、生成产物、二进制文件和潜在敏感文件。' }
      - line: 12
        kind: security
        note: { en: 'Concatenating a model-authored path does not enforce either workspace containment or the two-file allowlist, so an edit can escape its authorized scope.', zh: '拼接模型生成的路径既不能保证工作区包含关系，也没有执行双文件白名单，因此修改可以逃出授权范围。' }
      - line: 15
        kind: correctness
        note: { en: 'The model chooses its own test command. It can run an incomplete or unrelated check instead of the fixed repository-owned acceptance commands.', zh: '模型自行选择测试命令，可能运行不完整或无关的检查，而不是固定的仓库验收命令。' }
      - line: 18
        kind: edge-case
        note: { en: 'Passing the complete parent environment can expose unrelated credentials and makes behavior depend on invisible developer-machine state.', zh: '传递完整父进程环境可能暴露无关凭据，也会让行为依赖不可见的开发机状态。' }
    explanation: { en: 'Bound context and writes before the model acts, then run a fixed verification plan with a minimal environment. Completion must include independent process and diff evidence.', zh: '模型行动前要限制上下文和写入范围，再用最小环境执行固定验证计划。完成状态必须包含独立的进程与差异证据。' }
    difficulty: advanced
    tags: [code-review, ide-runner, verification, security]
    tests: node --check ide_task_runner.js
    minutes: 12
