topic: ai-era/ai-ide
items:
  - id: predict-context-selection
    type: predict
    prompt: { en: 'Which paths does this bounded context picker print?', zh: '这个有边界的上下文选择器会输出哪些路径？' }
    code: |
      const files = [
        { path: "src/pay.js", source: "selection", size: 900 },
        { path: "dist/pay.js", source: "index", size: 700 },
        { path: "test/pay.test.js", source: "diagnostic", size: 800 },
      ];

      const rank = { selection: 0, diagnostic: 1, index: 2 };
      const picked = files
        .filter((file) => !file.path.startsWith("dist/"))
        .sort((left, right) => rank[left.source] - rank[right.source])
        .slice(0, 2);

      console.log(picked.map((file) => file.path).join(", "));
    lang: js
    options:
      - { text: { en: 'src/pay.js, test/pay.test.js', zh: 'src/pay.js, test/pay.test.js' }, correct: true }
      - { text: { en: 'src/pay.js, dist/pay.js', zh: 'src/pay.js, dist/pay.js' }, correct: false }
      - { text: { en: 'All three paths', zh: '全部三个路径' }, correct: false }
    explanation: { en: 'The picker excludes dist before sorting, then selection outranks diagnostic. The two remaining paths fit the final slice.', zh: '选择器先排除dist，再按优先级排序；selection高于diagnostic，最后保留剩下的两个路径。' }
    difficulty: beginner
    tags: [context-selection, context-window, ignore-rules]
    tests: node predict_context.js
    minutes: 3

  - id: choose-authoritative-context
    type: mcq
    prompt: { en: 'A generated edit depends on an exact public function signature. Which context choice is strongest?', zh: '生成式修改依赖一个精确的公共函数签名。哪种上下文选择最可靠？' }
    options:
      - { text: { en: 'Attach the current declaration and its contract tests, then confirm the response names both paths', zh: '附加当前声明与契约测试，并确认回答列出这两个路径' }, correct: true }
      - { text: { en: 'Open several related tabs and assume the IDE sends all of them', zh: '打开几个相关标签页，并假定IDE会全部发送' }, correct: false }
      - { text: { en: 'Ask for a longer answer so the model has more room to remember', zh: '要求更长的回答，让模型有更多空间记忆' }, correct: false }
      - { text: { en: 'Attach the whole dependency directory in case the signature appears there', zh: '附加整个依赖目录，以防签名出现在其中' }, correct: false }
    explanation: { en: 'Explicit, current source and tests are auditable inputs. Open tabs, response length, and bulk dependencies do not establish what the model actually received.', zh: '显式提供的当前源码与测试是可审计输入。打开的标签页、回答长度和整包依赖都不能证明模型实际收到了什么。' }
    difficulty: beginner
    tags: [explicit-context, contracts, provenance]
    minutes: 2

  - id: spotbug-unsafe-ide-bridge
    title: { en: 'Spot the bug in the IDE bridge', zh: '找出IDE桥接器里的bug' }
    type: spotbug
    prompt: { en: 'Find the scope, command, and completion bugs in this generated IDE bridge.', zh: '找出这个生成式IDE桥接器中的范围、命令与完成状态错误。' }
    code: |
      import { readFileSync, writeFileSync } from "node:fs";
      import { exec } from "node:child_process";

      function applySuggestion(workspace, request, proposal) {
        const contextPath = `${workspace}/${request.context}`;
        const context = readFileSync(contextPath, "utf8");
        const command = `cd ${workspace} && ${proposal.command}`;
        exec(command, () => console.log("checked"));
        const target = `${workspace}/${proposal.path}`;
        writeFileSync(target, proposal.content);
        return { status: "done", context };
      }
    lang: js
    issues:
      - line: 5
        kind: security
        note: { en: 'String concatenation does not keep request.context inside the workspace; absolute segments and traversal need resolved, path-aware containment checks.', zh: '字符串拼接不能保证request.context位于工作区内；绝对路径和路径穿越必须经过解析后的路径感知范围检查。' }
      - line: 7
        kind: security
        note: { en: 'A model-authored command and workspace are interpolated into a shell command, so shell syntax can change the operation. Use a reviewed executable and argument array.', zh: '模型生成的命令与工作区被插入shell字符串，shell语法可以改变实际操作。应使用经过审查的可执行文件与参数数组。' }
      - line: 11
        kind: correctness
        note: { en: 'The function returns done before the asynchronous command finishes, without its exit status or stderr, so a failed check is reported as completion.', zh: '函数在异步命令结束前就返回done，也不保留退出状态与stderr，因此失败检查会被报告为完成。' }
    explanation: { en: 'An IDE bridge must validate resolved paths, keep untrusted text out of shell structure, and derive completion from finished process evidence.', zh: 'IDE桥接器必须验证解析后的路径，避免不可信文本进入shell结构，并根据已结束进程的证据判断完成状态。' }
    difficulty: intermediate
    tags: [path-containment, command-injection, async-process]
    tests: node --check unsafe_ide_bridge.js
    minutes: 7

  - id: choose-stale-edit-response
    type: mcq
    prompt: { en: 'The model proposes a patch against code you changed manually two minutes ago. What should you do first?', zh: '模型针对你两分钟前手工修改过的代码提出补丁。首先应该怎么做？' }
    options:
      - { text: { en: 'Reject or pause the patch, reread the current file and diff, then regenerate against the new baseline', zh: '拒绝或暂停补丁，重新读取当前文件与差异，再基于新基线生成' }, correct: true }
      - { text: { en: 'Apply it because the IDE will always merge semantic intent correctly', zh: '直接应用，因为IDE总能正确合并语义意图' }, correct: false }
      - { text: { en: 'Accept only the longest hunk because it contains more context', zh: '只接受最长的差异块，因为它包含更多上下文' }, correct: false }
      - { text: { en: 'Ask the model whether it feels confident before applying', zh: '应用前询问模型是否有信心' }, correct: false }
    explanation: { en: 'The proposal has a stale preimage. Refreshing source and baseline prevents an old replacement from silently overwriting newer work.', zh: '这个建议使用了过期前像。刷新源码与基线，可以防止旧替换内容悄悄覆盖较新的修改。' }
    difficulty: intermediate
    tags: [stale-context, diff-review, baseline]
    minutes: 2

  - id: review-generated-ide-task-runner
    type: review
    title: { en: 'Review a generated AI IDE task runner', zh: '审查生成的AI IDE任务运行器' }
    prompt: { en: 'Review this generated code before the IDE runner is used.', zh: '请在使用IDE任务运行器前审查这段生成的代码。' }
    task: { en: 'Provide the order source and test as context, write only to src/orders.js and test/orders.test.js, run npm test and npm run lint, and return completion evidence.', zh: '提供订单源码与测试作为上下文，仅写入src/orders.js和test/orders.test.js，运行npm test与npm run lint，并返回完成证据。' }
    code: |
      import { globSync, readFileSync, writeFileSync } from "node:fs";
      import { execFileSync } from "node:child_process";

      function runIdeTask(workspace, task, model) {
        const files = globSync("**/*", { cwd: workspace });
        const context = files
          .map((name) => readFileSync(`${workspace}/${name}`, "utf8"))
          .join("\n");
        const response = model.generate(`${task}\n${context}`);

        for (const edit of response.edits) {
          const target = `${workspace}/${edit.path}`;
          writeFileSync(target, edit.content);
        }
        const testOutput = execFileSync("npm", ["test"], {
          cwd: workspace,
          encoding: "utf8",
          env: { PATH: process.env.PATH ?? "", CI: "1" },
        });
        return {
          status: "done",
          summary: response.summary,
          testOutput,
        };
      }
    lang: js
    right: { en: 'The runner supplies task text and repository content, uses fixed command arguments with a minimal environment, pins the check to the workspace, and returns structured output.', zh: '运行器提供任务文字与仓库内容，使用固定命令参数与最小环境，将检查限制在工作区中，并返回结构化结果。' }
    checklist:
      - { en: 'Select the named source and test instead of scanning the whole workspace.', zh: '只选择指定的源码与测试，不要扫描整个工作区。' }
      - { en: 'Resolve each write target and compare it with the exact approved path set.', zh: '解析每个写入目标，并与确切的批准路径集合比较。' }
      - { en: 'Run every required repository check with fixed executable arguments.', zh: '使用固定的可执行文件参数运行仓库要求的每项检查。' }
      - { en: 'Record the final diff, commands, working directory, exit status, and output.', zh: '记录最终差异、命令、工作目录、退出状态与输出。' }
    issues:
      - line: 5
        kind: performance
        note: { en: 'The unbounded glob makes the next expression read the whole workspace, including dependencies, generated output, and binaries, instead of the two named context files.', zh: '这个无边界glob会让后续表达式读取整个工作区，包括依赖、生成产物与二进制文件，而不是只读取两个指定的上下文文件。' }
      - line: 12
        kind: security
        note: { en: 'Concatenating a generated path enforces neither workspace containment nor the two-file allowlist, so traversal can write outside the authorized scope.', zh: '拼接生成的路径既不能保证目标位于工作区内，也没有执行双文件白名单，因此路径穿越可以写到授权范围之外。' }
      - line: 15
        kind: correctness
        note: { en: 'Only npm test runs; the required npm run lint check is omitted, so status done does not represent the stated acceptance plan.', zh: '这里只运行了npm test，遗漏了必需的npm run lint，因此status done并不代表已完成约定的验收计划。' }
    explanation: { en: 'The runner needs bounded context, enforced path authorization, and evidence from every required check before it can report completion.', zh: '任务运行器必须限制上下文、强制执行路径授权，并取得每项必需检查的证据，才能报告完成。' }
    difficulty: advanced
    tags: [code-review, ide-runner, verification, security]
    tests: node --check ide_task_runner.js
    minutes: 12
