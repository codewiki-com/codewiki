topic: ai-era/llm-application-evals
items:
  - id: predict-hard-gate-release
    type: predict
    prompt: { en: 'What does this release gate print?', zh: '这段发布门槛代码会输出什么？' }
    code: |
      const rows = [
        { score: 1.0, weight: 3, hard: false },
        { score: 0.8, weight: 1, hard: false },
        { score: 0.0, weight: 1, hard: true },
      ];

      const points = rows.reduce(
        (sum, row) => sum + row.score * row.weight,
        0,
      );
      const weights = rows.reduce((sum, row) => sum + row.weight, 0);
      const averagePass = points / weights >= 0.75;
      const hardPass = rows.filter((row) => row.hard).every((row) => row.score === 1);

      console.log(averagePass, hardPass, averagePass && hardPass);
    lang: javascript
    options:
      - { text: { en: 'true false false', zh: 'true false false' }, correct: true }
      - { text: { en: 'true true true', zh: 'true true true' }, correct: false }
      - { text: { en: 'false false false', zh: 'false false false' }, correct: false }
      - { text: { en: 'true false true', zh: 'true false true' }, correct: false }
    explanation: { en: 'The weighted score is 0.76, so the average passes. The hard-gate row has score 0, so both the hard gate and the final release fail.', zh: '加权分数为 0.76，因此平均分通过；硬门槛记录的分数为 0，所以硬门槛与最终发布都失败。' }
    difficulty: intermediate
    tags: [weighted-score, hard-gate, release-policy]
    tests: node hard_gate.js
    minutes: 3

  - id: choose-representative-suite
    type: mcq
    prompt: { en: 'Which evaluation-set design gives the strongest release evidence for a customer-support assistant?', zh: '哪种评测集设计能为客服助手提供最可靠的发布证据？' }
    options:
      - { text: { en: 'A versioned mix of sampled task categories, costly incidents, boundary cases, adversarial cases, and predefined user slices', zh: '版本化组合抽样任务类别、高代价事故、边界用例、对抗用例和预先定义的用户切片' }, correct: true }
      - { text: { en: 'The ten demonstrations used while editing the system prompt', zh: '修改系统提示词时使用的十个演示' }, correct: false }
      - { text: { en: 'A large synthetic set generated by the same prompt and model under evaluation', zh: '由受测提示词和模型生成的大型合成集合' }, correct: false }
      - { text: { en: 'Only the most common happy-path question, repeated with different order IDs', zh: '只使用最常见的正常路径问题，并替换不同订单编号' }, correct: false }
    explanation: { en: 'Release evidence needs declared coverage of ordinary behavior and costly failures. Tuning examples, one generator, or near-duplicates provide a biased view of the product distribution.', zh: '发布证据需要明确覆盖普通行为与高代价故障。调优示例、单一生成器或近似重复用例都会让产品分布产生偏差。' }
    difficulty: advanced
    tags: [evaluation-set, sampling, slices]
    minutes: 2

  - id: spotbug-missing-denominators
    type: spotbug
    prompt: { en: 'Find the evaluation errors in this generated aggregator.', zh: '找出这个生成式聚合器中的评测错误。' }
    code: |
      function summarize(rows) {
        const scored = rows.filter((row) => row.score);
        const average = scored.reduce(
          (sum, row) => sum + row.score,
          0,
        ) / scored.length;

        const failures = rows.filter((row) => row.error).length;
        return {
          average,
          failures,
          release: average >= 0.8,
        };
      }
    lang: javascript
    issues:
      - line: 2
        kind: correctness
        note: { en: 'The truthy filter drops valid score 0 rows, inflating the average. Check for an explicit numeric score instead.', zh: '真假值筛选会丢掉有效的 0 分记录，从而抬高平均分。应明确检查分数是否为数字。' }
      - line: 6
        kind: edge-case
        note: { en: 'If no row survives, division by zero produces NaN and the function never reports that the run is inconclusive.', zh: '没有记录通过筛选时，除以零会产生 NaN，而且函数不会报告本次运行结论不明。' }
      - line: 12
        kind: correctness
        note: { en: 'The release decision ignores recorded errors and has no hard-gate policy, so missing or critical results can be averaged away.', zh: '发布决定忽略了已记录的错误，也没有硬门槛政策，因此缺失结果或关键故障可能被平均值掩盖。' }
    explanation: { en: 'A trustworthy aggregator preserves zeroes, reports every denominator and failure class, and evaluates hard gates separately from averages.', zh: '可信的聚合器应保留零分，报告每个分母和故障类别，并在平均值之外单独计算硬门槛。' }
    difficulty: advanced
    tags: [denominator, missing-data, aggregation]
    tests: node --check aggregator.js
    minutes: 5

  - id: choose-judge-calibration
    type: mcq
    prompt: { en: 'Before an LLM judge blocks releases, what is the most useful calibration step?', zh: '在让 LLM 评审器阻止发布前，哪项校准最有用？' }
    options:
      - { text: { en: 'Compare its criterion-level verdicts with blinded human labels on clear and boundary cases, then inspect false passes and false failures', zh: '在明确用例和边界用例上，把各项标准结论与盲测人工标签比较，再检查错误放行与错误拒绝' }, correct: true }
      - { text: { en: 'Raise the judge temperature until its explanations become more varied', zh: '提高评审器温度，直到说明文字更有变化' }, correct: false }
      - { text: { en: 'Give the judge the candidate model name so it can account for model quality', zh: '把候选模型名称告诉评审器，让它考虑模型质量' }, correct: false }
      - { text: { en: 'Accept high agreement between two copies of the same judge prompt as ground truth', zh: '把同一评审提示词的两个副本高度一致视为事实标准' }, correct: false }
    explanation: { en: 'Calibration tests the grader against an external label source and exposes consequential error types. Self-agreement can repeat the same bias, and model identity can introduce another bias.', zh: '校准会把评分器与外部标签来源比较，并暴露会影响决定的错误类型。自我一致可能重复同一种偏差，模型身份还会引入另一种偏差。' }
    difficulty: advanced
    tags: [llm-judge, grader-calibration, human-review]
    minutes: 3

  - id: choose-inconclusive-regression
    type: mcq
    prompt: { en: 'A candidate delta is -1 percentage point, the allowed regression is -2 points, and the confidence interval is [-4, +2]. What should the gate report?', zh: '候选版本变化为 -1 个百分点，允许回归为 -2 个百分点，置信区间为 [-4, +2]。交付门应报告什么？' }
    options:
      - { text: { en: 'Inconclusive, because the interval includes both allowed and forbidden changes', zh: '结论不明，因为区间同时包含允许与禁止的变化' }, correct: true }
      - { text: { en: 'Pass, because the point estimate is above -2 points', zh: '通过，因为点估计高于 -2 个百分点' }, correct: false }
      - { text: { en: 'Fail, because the interval includes -4 points', zh: '失败，因为区间包含 -4 个百分点' }, correct: false }
      - { text: { en: 'Pass, because the interval also includes an improvement', zh: '通过，因为区间也包含提升' }, correct: false }
    explanation: { en: 'The evidence cannot distinguish an acceptable change from a forbidden regression. The honest action is to collect more observations or make a documented risk decision.', zh: '现有证据无法区分允许变化与禁止回归。诚实的做法是收集更多观察，或作出有记录的风险决定。' }
    difficulty: advanced
    tags: [confidence-interval, regression-threshold, uncertainty]
    minutes: 3

  - id: review-generated-eval-runner
    type: review
    title: { en: 'Review a generated eval runner', zh: '审查生成的评测运行器' }
    prompt: { en: 'Review this generated release evaluator before it is added to CI.', zh: '在把这个生成式发布评测器加入 CI 前审查它。' }
    task: { en: 'Evaluate independent cases with at most four concurrent requests, expose only each input to generation, retain every result or error, apply a configurable average threshold, and require all hard-gate cases to pass.', zh: '以最多四个并发请求评价相互独立的用例；生成阶段只能看到各自输入；保留每项结果或错误；应用可配置的平均阈值，并要求所有硬门槛用例通过。' }
    code: |
      export async function evaluateRelease(
        cases,
        generate,
        judge,
        threshold = 0.8,
      ) {
        const results = [];

        for (const testCase of cases) {
          const prompt = `${testCase.input}\nReference: ${testCase.reference}`;
          try {
            const output = await generate(prompt);
            const score = await judge(testCase, output);
            results.push({ id: testCase.id, score });
          } catch {
            continue;
          }
        }

        const average =
          results.reduce((sum, result) => sum + result.score, 0) / results.length;
        return { average, release: average >= threshold };
      }
    lang: javascript
    issues:
      - line: 10
        kind: security
        note: { en: 'The grader-only reference is inserted into the generation prompt, leaking hidden labels and possibly private reference data to the application.', zh: '只供评分器使用的参考答案被插入生成提示词，向应用泄露了隐藏标签，还可能泄露私有参考数据。' }
      - line: 9
        kind: performance
        note: { en: 'Independent cases run serially. The task calls for bounded concurrency of four, which can improve throughput without starting the entire set at once.', zh: '相互独立的用例被串行执行。任务要求并发上限为 4，既能提高吞吐量，也不会一次启动整个集合。' }
      - line: 16
        kind: edge-case
        note: { en: 'Errors disappear from both evidence and denominator; if every case errors, the average is NaN. Record a typed failure and make the run inconclusive or fail by policy.', zh: '错误从证据与分母中同时消失；所有用例都报错时，平均值是 NaN。应记录带类型的故障，并按政策判为结论不明或失败。' }
      - line: 22
        kind: correctness
        note: { en: 'The release rule checks only the average and ignores hard-gate flags, so a critical failure can be compensated by ordinary cases.', zh: '发布规则只检查平均值，忽略硬门槛标记，因此普通用例可以抵消关键故障。' }
    right: { en: 'The function injects generation and judging dependencies, keeps stable case IDs in successful records, accepts a configurable threshold, and returns an explicit decision object.', zh: '函数注入了生成与评分依赖，在成功记录中保留稳定用例标识符，接受可配置阈值，并返回明确的决策对象。' }
    checklist:
      - { en: 'Trace which case fields are visible to generation and which remain grader-only.', zh: '跟踪哪些用例字段对生成阶段可见，哪些只供评分器使用。' }
      - { en: 'Verify bounded concurrency, retry symmetry, and one retained record per requested case.', zh: '检查有界并发、对称重试，以及每个请求用例都有一条保留记录。' }
      - { en: 'Test empty input, all-error runs, score 0, and malformed judge output.', zh: '测试空输入、全部报错、0 分和错误的评审器输出。' }
      - { en: 'Recompute the average and every hard gate from the returned case-level evidence.', zh: '根据返回的用例级证据重新计算平均值和每项硬门槛。' }
    explanation: { en: 'Keep reference data outside generation, schedule work with a bounded pool, preserve typed failures, and derive the release from both aggregate and hard-gate policies.', zh: '参考数据不得进入生成阶段；工作应通过有界任务池调度；保留带类型的故障，并根据聚合政策与硬门槛共同推导发布决定。' }
    difficulty: advanced
    tags: [code-review, evaluation-runner, data-leakage, hard-gate]
    tests: node --check eval_release.js
    minutes: 10
