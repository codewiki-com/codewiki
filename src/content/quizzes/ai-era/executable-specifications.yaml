topic: ai-era/executable-specifications
items:
  - id: predict-inclusive-shipping-boundary
    type: predict
    prompt: { en: 'What does this boundary check print?', zh: '这段边界检查会输出什么？' }
    code: |
      const threshold = 5000;
      const subtotals = [4999, 5000, 5001];
      const results = subtotals.map((subtotal) =>
        subtotal >= threshold ? "free" : "paid"
      );
      console.log(results.join(", "));
    lang: js
    options:
      - { text: { en: 'paid, free, free', zh: 'paid、free、free' }, correct: true }
      - { text: { en: 'paid, paid, free', zh: 'paid、paid、free' }, correct: false }
      - { text: { en: 'free, free, free', zh: 'free、free、free' }, correct: false }
    explanation: { en: 'The inclusive >= comparison makes the exact threshold and every larger subtotal free; the adjacent lower value remains paid.', zh: '包含等号的 >= 比较让恰好达到阈值及更大的小计免运费，相邻的较小值仍需付费。' }
    difficulty: beginner
    tags: [boundary-value, inclusive-boundary, prediction]
    minutes: 3

  - id: choose-decisive-acceptance-examples
    type: mcq
    prompt: { en: 'Which pair best specifies the phrase “standard shipping is free at €50 or more”?', zh: '哪一对案例最能规定「标准配送满 50 欧元免运费」？' }
    options:
      - { text: { en: '4,999 cents costs 500 cents; 5,000 cents costs 0 cents', zh: '4,999 分时运费为 500 分；5,000 分时运费为 0 分' }, correct: true }
      - { text: { en: '6,000 cents costs 0 cents; 7,000 cents costs 0 cents', zh: '6,000 分时运费为 0 分；7,000 分时运费为 0 分' }, correct: false }
      - { text: { en: 'A large order is cheap; a small order is expensive', zh: '大额订单运费低；小额订单运费高' }, correct: false }
      - { text: { en: 'The implementation contains a variable named threshold', zh: '实现中包含名为 threshold 的变量' }, correct: false }
    explanation: { en: 'Adjacent values around the inclusive boundary distinguish >= from > and state both units and literal outcomes.', zh: '包含边界两侧相邻值的案例可以区分 >= 与 >，并明确单位和字面结果。' }
    difficulty: beginner
    tags: [named-example, acceptance-criterion, boundary-value]
    minutes: 2

  - id: spotbug-circular-shipping-oracle
    title: { en: 'Spot the bug in shipping checks', zh: '找出运费检查里的 bug' }
    type: spotbug
    prompt: { en: 'Find why these generated checks do not independently specify the shipping boundary.', zh: '找出这些生成检查为何无法独立规定运费边界。' }
    code: |
      import assert from "node:assert/strict";

      function shippingFeeCents(subtotalCents) {
        return subtotalCents >= 5000 ? 0 : 500;
      }

      const sampledSubtotals = [6000, 7000];
      for (const subtotalCents of sampledSubtotals) {
        const expected = subtotalCents >= 5000 ? 0 : 500;
        assert.equal(shippingFeeCents(subtotalCents), expected);
      }
    lang: js
    issues:
      - line: 7
        kind: edge-case
        note: { en: 'Both samples are comfortably above the threshold, so the checks cannot distinguish an inclusive boundary from an exclusive one or many broader shortcuts.', zh: '两个样本都明显高于阈值，因此检查无法区分包含或排除等号的边界，也无法排除许多过宽捷径。' }
      - line: 9
        kind: correctness
        note: { en: 'The expected result copies the production formula, so the same mistaken operator or misunderstood rule can agree on both sides.', zh: '预期结果复制了生产公式，因此同一个错误运算符或误解规则可能同时出现在比较两侧。' }
    explanation: { en: 'Use approved literal expectations at 4,999 and 5,000 cents, then prove the check fails after deliberately changing >= to >.', zh: '应在 4,999 分和 5,000 分使用经批准的字面预期值，再故意把 >= 改为 >，证明检查会失败。' }
    difficulty: intermediate
    tags: [test-oracle, circular-oracle, boundary-value]
    minutes: 5

  - id: choose-strong-pagination-property
    type: mcq
    prompt: { en: 'Which executable property rules out both too few and unnecessarily many pages?', zh: '哪项可执行性质能同时排除页数不足和页数过多？' }
    options:
      - { text: { en: 'pages × pageSize >= total, and when pages > 0, (pages - 1) × pageSize < total', zh: 'pages × pageSize >= total，且 pages > 0 时，(pages - 1) × pageSize < total' }, correct: true }
      - { text: { en: 'pages is non-negative', zh: 'pages 为非负数' }, correct: false }
      - { text: { en: 'pages is an integer', zh: 'pages 为整数' }, correct: false }
      - { text: { en: 'pageSize is no larger than total', zh: 'pageSize 不大于 total' }, correct: false }
    explanation: { en: 'The first relation proves capacity and the second proves minimality. Either one alone admits realistic wrong results.', zh: '第一个关系证明容量足够，第二个关系证明页数最小。任何一个单独使用都会允许真实的错误结果。' }
    difficulty: intermediate
    tags: [property, test-oracle, pagination]
    minutes: 3

  - id: review-generated-shipping-specification
    type: review
    title: { en: 'Review a generated shipping specification', zh: '审查生成的运费规格' }
    prompt: { en: 'Review this generated specification before an agent uses it as acceptance evidence.', zh: '在智能体把这段生成规格用作验收证据前进行审查。' }
    task: { en: 'Specify that non-negative integer subtotals use integer cents; standard French shipping costs 500 cents below 5,000 and is free at 5,000 or more; expedited French shipping costs 900; non-French shipping costs 1,200; and absent country codes or invalid subtotals are rejected.', zh: '规定小计必须是以整数分表示的非负整数；法国标准配送在 5,000 分以下收取 500 分，达到或超过 5,000 分免费；法国加急配送收取 900 分；非法国配送收取 1,200 分；国家代码缺失或小计无效时必须拒绝。' }
    code: |
      import assert from "node:assert/strict";

      function shippingFeeCents(order) {
        const { subtotalCents, country, expedited = false } = order;
        if (subtotalCents < 0) throw new RangeError("negative subtotal");
        if (country !== "FR") return 1200;
        if (expedited) return 900;
        return subtotalCents > 5000 ? 0 : 500;
      }

      const examples = [
        [{ subtotalCents: 6000, country: "FR" }, 0],
        [{ subtotalCents: 2000, country: "FR" }, 500],
        [{ subtotalCents: 8000, country: "FR", expedited: true }, 900],
      ];

      for (const example of examples) {
        const [input, expected] = example;
        assert.equal(shippingFeeCents(input), expected);
      }

      for (let subtotal = 0; subtotal < 10_000_000; subtotal += 1) {
        assert.ok(shippingFeeCents({ subtotalCents: subtotal, country: "FR" }) >= 0);
      }
    lang: js
    issues:
      - line: 5
        lines: 2
        kind: edge-case
        note: { en: 'Validation accepts fractional, NaN, string, and absent subtotals, while an absent or unknown country is silently priced as international instead of being rejected as required.', zh: '验证会接受小数、NaN、字符串和缺失小计；国家代码缺失或未知时，也会被默默按国际配送计价，而不是按要求拒绝。' }
      - line: 8
        kind: correctness
        note: { en: 'The exclusive > comparison charges 500 cents at exactly 5,000, contradicting the required inclusive free-shipping boundary.', zh: '排除等号的 > 比较会在恰好 5,000 分时收取 500 分，违背包含等号的免运费边界。' }
      - line: 11
        lines: 4
        kind: readability
        note: { en: 'Positional rows have no scenario names, so a failure does not identify the rule, boundary, or precedence decision it represents.', zh: '位置式数据行没有场景名称，因此失败时无法指出对应的规则、边界或优先级决定。' }
      - line: 22
        lines: 3
        kind: performance
        note: { en: 'Ten million weak assertions make the check expensive while still omitting the exact boundary, invalid inputs, and international case.', zh: '一千万次弱断言让检查成本很高，却仍遗漏确切边界、无效输入和国际配送案例。' }
    right: { en: 'The code uses integer cents, keeps the fee function small, supplies literal expected values, covers ordinary French and expedited branches, and uses strict assertions.', zh: '代码使用整数分，费用函数保持简短，使用字面预期值，并覆盖法国普通与加急分支，还采用严格断言。' }
    checklist:
      - { en: 'Place named examples immediately below and at 5,000 cents.', zh: '在 5,000 分的紧邻下方和边界本身放置具名示例。' }
      - { en: 'Cover every destination and delivery-speed partition, including overlapping rules.', zh: '覆盖每个目的地和配送速度分区，包括规则重叠情况。' }
      - { en: 'Reject absent, fractional, non-finite, string, and negative subtotals with a stable error contract.', zh: '通过稳定错误契约拒绝缺失、小数、非有限值、字符串和负数小计。' }
      - { en: 'Replace the exhaustive weak loop with a few decisive examples and a strong bounded property.', zh: '用少量有判别力的示例和一个有界的强性质替换穷举式弱循环。' }
    explanation: { en: 'A useful acceptance specification names product decisions, attacks exact boundaries, and uses independent literal outcomes. High test volume does not compensate for weak or missing cases.', zh: '有用的验收规格会给产品决定命名，直接检查确切边界，并使用独立字面结果。测试数量再多，也无法弥补薄弱或缺失的案例。' }
    difficulty: intermediate
    tags: [code-review, executable-specification, boundary-value, test-oracle]
    tests: node shipping_specification.mjs
    minutes: 10
