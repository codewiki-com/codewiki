topic: ai-era/constraint-rich-prompts
items:
  - id: predict-scope-verdict
    type: predict
    prompt: { en: 'What does this edit-scope check print?', zh: '这段修改范围检查会输出什么？' }
    code: |
      const allowed = new Set([
        "src/cart.js",
        "test/cart.test.js",
      ]);
      const changed = [
        "src/cart.js",
        "README.md",
      ];

      const inScope = changed.every((path) => allowed.has(path));
      console.log(inScope ? "PASS" : "STOP");
    lang: js
    options:
      - { text: { en: 'STOP', zh: 'STOP' }, correct: true }
      - { text: { en: 'PASS', zh: 'PASS' }, correct: false }
      - { text: { en: 'README.md', zh: 'README.md' }, correct: false }
    explanation: { en: 'README.md is not in the allowed set, so every() returns false and the scope gate stops the change.', zh: 'README.md 不在允许集合中，因此 every() 返回 false，范围关卡会停止这项改动。' }
    difficulty: beginner
    tags: [write-scope, allowlist, prediction]
    minutes: 2

  - id: choose-bounded-change-request
    type: mcq
    prompt: { en: 'Which prompt most clearly bounds a generated change?', zh: '哪条提示词能最清楚地限定生成式改动？' }
    options:
      - text: { en: 'Update parseLimit in src/paging.js; edit it and its test only; preserve omitted and zero inputs; add no dependency; run node test/paging.test.js and git diff --check; stop if another file is required.', zh: '更新 src/paging.js 中的 parseLimit；只修改该文件及其测试；保留省略输入与零值输入；不增加依赖；运行 node test/paging.test.js 和 git diff --check；如果必须修改其他文件就停止。' }
        correct: true
      - text: { en: 'Improve pagination and keep everything compatible.', zh: '改进分页，并保持一切兼容。' }
        correct: false
      - text: { en: 'Use a clean class design, refactor as needed, and test thoroughly.', zh: '使用整洁的类设计，按需重构，并充分测试。' }
        correct: false
      - text: { en: 'Fix parseLimit without making unnecessary changes.', zh: '修复 parseLimit，不要做不必要的改动。' }
        correct: false
    explanation: { en: 'The first request names the target, edit surface, protected behaviors, non-goal, exact evidence, and stop condition. The other choices leave consequential decisions undefined.', zh: '第一条请求写明目标、修改面、受保护行为、非目标、确切证据和停止条件。其他选项都把关键决策留空。' }
    difficulty: beginner
    tags: [prompt-contract, scope, acceptance-command]
    minutes: 3

  - id: spotbug-falsy-compatibility
    type: spotbug
    prompt: { en: 'The prompt says an omitted timeout defaults to 5,000 ms and an explicit zero disables waiting. Find the compatibility bug.', zh: '提示词规定省略超时时默认使用 5,000 毫秒，显式零值表示不等待。请找出兼容性缺陷。' }
    code: |
      function timeoutMs(value) {
        return value || 5000;
      }

      console.log(timeoutMs(undefined));
      console.log(timeoutMs(0));
    lang: js
    issues:
      - line: 2
        kind: correctness
        note: { en: 'The || fallback treats explicit 0 as absent and returns 5,000, violating the protected zero-value behavior; use an undefined check or ?? for this contract.', zh: '|| 回退会把显式 0 当成缺失值并返回 5,000，破坏受保护的零值行为；该契约应检查 undefined 或使用 ??。' }
    explanation: { en: 'A compatibility clause must identify distinguishing inputs. Testing only the omitted case would let this generated shortcut pass.', zh: '兼容性条款必须指出有判别力的输入。只测试省略值，会让这条生成捷径错误通过。' }
    difficulty: intermediate
    tags: [backward-compatibility, falsy-value, boundary-case]
    minutes: 4

  - id: choose-acceptance-blocker
    type: mcq
    prompt: { en: 'A focused test passes, the required lint command exits 1, and the required build cannot run because credentials are missing. What should the agent report?', zh: '聚焦测试通过，必需的代码检查命令以 1 退出，必需的构建又因缺少凭据而无法运行。智能体应如何报告？' }
    options:
      - { text: { en: 'Incomplete: include both blockers and do not claim acceptance.', zh: '未完成：同时报告两个阻碍，不要声称已通过验收。' }, correct: true }
      - { text: { en: 'Complete because the behavior test passed.', zh: '已完成，因为行为测试已经通过。' }, correct: false }
      - { text: { en: 'Complete with a note that lint is probably unrelated.', zh: '已完成，并注明代码检查失败可能无关。' }, correct: false }
      - { text: { en: 'Replace both commands with a manual code reading.', zh: '用人工阅读代码替代这两条命令。' }, correct: false }
    explanation: { en: 'Named commands become acceptance evidence only when they actually run and satisfy their success condition. A failed or blocked command keeps the result incomplete unless the contract is explicitly revised.', zh: '具名命令只有实际运行并满足成功条件后，才能成为验收证据。命令失败或受阻时，结果仍未完成，除非显式修改验收契约。' }
    difficulty: intermediate
    tags: [acceptance-evidence, stop-condition, reporting]
    minutes: 3

  - id: review-generated-profile-path
    type: review
    title: { en: 'Review a generated bounded path change', zh: '审查生成的受限路径改动' }
    prompt: { en: 'Review the generated implementation against the task and its constraints.', zh: '根据任务及其约束审查这段生成实现。' }
    task: { en: 'Update buildProfilePath(root, userId) so userId must be 1–32 ASCII letters, digits, or hyphens. Preserve the two-argument signature and the existing TypeError for invalid IDs, return a .json path under root, perform no filesystem I/O or logging, and add no dependency.', zh: '更新 buildProfilePath(root, userId)：userId 必须由 1–32 个 ASCII 字母、数字或连字符组成。保留双参数签名和无效 ID 对应的现有 TypeError，返回 root 下的 .json 路径，不执行文件系统 I/O 或日志记录，也不增加依赖。' }
    code: |
      import path from "node:path";
      import fs from "node:fs";

      export function buildProfilePath(root, userId, options = {}) {
        console.log("profile", root, userId);
        if (!userId) return null;
        const safeId = String(userId).replace(/[^a-z0-9-]/gi, "");
        const profilePath = path.join(root, `${safeId}.json`);

        if (!fs.existsSync(root)) {
          fs.mkdirSync(root, { recursive: true });
        }

        if (options.absolute) return path.resolve(profilePath);
        return profilePath;
      }
    lang: js
    issues:
      - line: 4
        kind: readability
        note: { en: 'The unrequested options parameter expands and obscures a signature the prompt explicitly protects; the absolute branch has no stated caller or requirement.', zh: '未经请求的 options 参数扩大并模糊了提示词明确保护的签名，absolute 分支也没有对应调用方或需求。' }
      - line: 5
        kind: security
        note: { en: 'Logging the root and user identifier creates a forbidden information disclosure path and is unrelated to path construction.', zh: '记录根目录和用户标识会造成提示词明令禁止的信息泄露路径，而且与构造路径无关。' }
      - line: 6
        kind: correctness
        note: { en: 'Invalid empty IDs return null instead of preserving the required TypeError contract.', zh: '无效的空 ID 返回 null，没有保留要求的 TypeError 契约。' }
      - line: 7
        kind: edge-case
        note: { en: 'Deleting invalid characters accepts forbidden IDs and can collapse distinct inputs such as a/b and ab onto the same filename; length is never checked.', zh: '删除非法字符会接受本应拒绝的 ID，还可能让 a/b 与 ab 等不同输入落到同一文件名；代码也没有检查长度。' }
      - line: 10
        lines: 3
        kind: performance
        note: { en: 'Synchronous existence checks and directory creation add blocking I/O to a helper that was constrained to pure path construction.', zh: '同步存在性检查和目录创建给本应只做纯路径构造的辅助函数增加了阻塞式 I/O。' }
    right: { en: 'The code keeps the exported function name, uses the platform path utility, places the .json suffix in one location, and returns a path derived from the supplied root.', zh: '代码保留了导出函数名，使用平台路径工具，只在一处添加 .json 后缀，并返回从给定根目录派生的路径。' }
    checklist:
      - { en: 'Compare the public signature, error type, valid alphabet, and length boundary with the protected contract.', zh: '把公开签名、错误类型、有效字符集和长度边界与受保护契约逐项比较。' }
      - { en: 'Trace whether invalid IDs can collide, escape the root, or reach any side effect.', zh: '追踪无效 ID 是否可能发生碰撞、逃逸根目录或触发任何副作用。' }
      - { en: 'Inspect imports, logging, filesystem access, and changed files against every non-goal.', zh: '对照每项非目标检查导入、日志、文件系统访问和已修改文件。' }
      - { en: 'Run named invalid, boundary-length, and valid-ID cases plus the repository acceptance commands.', zh: '运行具名无效案例、长度边界案例、有效 ID 案例及仓库验收命令。' }
    explanation: { en: 'The generated code solves a broader problem than requested and violates behavior, compatibility, side-effect, and scope constraints. Review must map each prompt clause to code or executed evidence instead of accepting a plausible implementation shape.', zh: '生成代码解决了比请求更宽的问题，并违反行为、兼容性、副作用和范围约束。审查必须把每个提示词条款映射到代码或实际执行证据，而不能只接受看似合理的实现形状。' }
    difficulty: intermediate
    tags: [code-review, constraint-rich-prompt, compatibility, scope]
    tests: node profile_path.test.mjs
    minutes: 12
