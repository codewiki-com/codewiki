topic: ai-era/tests-as-agent-guardrails
items:
  - id: predict-delivery-boundary
    type: predict
    prompt: { en: 'What does this focused boundary check print?', zh: '这项聚焦的边界检查会输出什么？' }
    code: |
      function deliveryFee(totalCents) {
        return totalCents >= 5_000 ? 0 : 799;
      }

      const totals = [4_999, 5_000, 5_001];
      console.log(totals.map(deliveryFee).join(", "));
    lang: js
    options:
      - { text: { en: '799, 0, 0', zh: '799、0、0' }, correct: true }
      - { text: { en: '799, 799, 0', zh: '799、799、0' }, correct: false }
      - { text: { en: '0, 0, 0', zh: '0、0、0' }, correct: false }
      - { text: { en: '799, 0, 799', zh: '799、0、799' }, correct: false }
    explanation: { en: 'The threshold is inclusive, so the case at 5,000 distinguishes >= from > while the adjacent values show each side.', zh: '阈值包含5000，因此该用例可以区分 >= 与 >，相邻值则分别展示边界两侧。' }
    difficulty: beginner
    tags: [boundary-value, behavioral-contract, prediction]
    tests: node delivery_boundary.js
    minutes: 3

  - id: choose-regression-evidence
    type: mcq
    prompt: { en: 'Which observation most directly shows that a new regression test guards the reported defect?', zh: '哪项观察最能直接证明新回归测试约束了报告中的缺陷？' }
    options:
      - { text: { en: 'It fails at the intended assertion on the faulty baseline and passes after the fix', zh: '它在有缺陷的基线上因目标断言失败，并在修复后通过' }, correct: true }
      - { text: { en: 'It raises the repository line-coverage percentage', zh: '它提高了代码库的行覆盖率' }, correct: false }
      - { text: { en: 'It uses the same helper functions as the implementation', zh: '它与实现使用相同的辅助函数' }, correct: false }
      - { text: { en: 'The agent describes it as comprehensive', zh: '智能体称它很全面' }, correct: false }
    explanation: { en: 'The red-then-green result demonstrates sensitivity to the named fault. Coverage, shared helpers, and a generated description do not establish that connection.', zh: '先红后绿的结果证明测试对具名缺陷敏感。覆盖率、共享辅助函数和生成描述都不能建立这种联系。' }
    difficulty: intermediate
    tags: [regression-test, red-green, evidence]
    minutes: 2

  - id: spotbug-self-confirming-tests
    title: { en: 'Spot the bug in authorization tests', zh: '找出授权测试里的bug' }
    type: spotbug
    prompt: { en: 'Find why these generated authorization tests can pass without protecting tenant isolation.', zh: '找出这些生成的授权测试为何能在没有保护租户隔离的情况下通过。' }
    code: |
      import assert from "node:assert/strict";

      function canRead(user, record) {
        return user.tenantId === record.tenantId;
      }

      const tenantA = { tenantId: "a" };
      const tenantBRecord = { tenantId: "b" };

      function generatedTest() {
        const canRead = () => true;
        assert.equal(canRead(tenantA, tenantBRecord), true);
        try {
          canRead(tenantA, tenantBRecord);
        } catch {
          assert.ok(true);
        }
      }

      generatedTest();
    lang: js
    issues:
      - line: 11
        kind: correctness
        note: { en: 'The local stub shadows the production function, so every assertion exercises an always-true replacement instead of tenant logic.', zh: '局部替身遮蔽了生产函数，因此所有断言都在执行恒为真的替代函数，而不是租户逻辑。' }
      - line: 13
        kind: edge-case
        note: { en: 'The try block has no failure assertion when no exception occurs, so the negative path silently passes; assert the false result or use an assertion that requires a throw.', zh: '没有异常时，try代码块不会触发失败断言，因此否定路径会静默通过；应断言结果为false，或使用必须抛错的断言。' }
    explanation: { en: 'A guardrail must invoke the real stable seam and fail when forbidden access is allowed. This code does neither, despite executing without error.', zh: '护栏必须调用真实的稳定接缝，并在允许了禁止访问时失败。这段代码虽然无错误执行，却没有满足任何一项。' }
    difficulty: intermediate
    tags: [authorization, test-double, false-positive]
    tests: node weak_guardrails.js
    minutes: 6

  - id: choose-observable-contract
    type: mcq
    prompt: { en: 'An agent is replacing a parser behind a stable public function. Which assertion is the most resilient guardrail?', zh: '智能体正在替换一个稳定公开函数背后的解析器。哪项断言最适合作为稳健护栏？' }
    options:
      - { text: { en: 'Supported inputs return the specified values and malformed inputs produce the documented diagnostics', zh: '受支持输入返回规定值，畸形输入产生文档规定的诊断信息' }, correct: true }
      - { text: { en: 'The parser creates exactly four private token objects', zh: '解析器恰好创建四个私有令牌对象' }, correct: false }
      - { text: { en: 'A private helper is called before another private helper', zh: '一个私有辅助函数先于另一个私有辅助函数调用' }, correct: false }
      - { text: { en: 'The new source has the same number of branches as the old source', zh: '新源码与旧源码具有相同分支数量' }, correct: false }
    explanation: { en: 'Public results and documented failures survive an implementation replacement. Private object counts, call order, and branch count freeze incidental structure.', zh: '公开结果和文档规定的失败行为能经受实现替换。私有对象数量、调用顺序和分支数量只会冻结偶然结构。' }
    difficulty: intermediate
    tags: [behavioral-contract, refactoring, resilience]
    minutes: 2

  - id: review-generated-test-gate
    type: review
    title: { en: 'Review a generated test gate', zh: '审查生成的测试交付门' }
    prompt: { en: 'Review this generated gate before it decides whether agent patches may be delivered.', zh: '在这个生成式交付门决定智能体补丁能否交付前，对它进行审查。' }
    task: { en: 'Run one or more configured test commands without shell interpretation, reject an empty command list, require structured passing test counts, enforce path-aware workspace containment, bound captured output, and return auditable evidence.', zh: '运行一条或多条配置的测试命令且不经过shell解释；拒绝空命令列表；要求结构化的通过测试数量；以路径语义强制工作区范围；限制捕获输出，并返回可审计证据。' }
    code: |
      import { exec } from "node:child_process";
      import { promisify } from "node:util";

      const run = promisify(exec);

      export async function gate(task) {
        const results = [];
        for (const command of task.commands) {
          const { stdout, stderr } = await run(command, { cwd: task.cwd });
          results.push({ command, stdout, stderr });
        }

        const passed = results.every((result) =>
          result.stdout.includes("pass"));
        const inScope = task.changedFiles.every((file) =>
          file.startsWith(task.workspace));

        return {
          ok: passed && inScope,
          evidence: results.map(({ command, stdout }) => ({ command, stdout })),
        };
      }
    lang: js
    issues:
      - line: 9
        kind: security
        note: { en: 'exec sends each free-form command through a shell, so metacharacters can execute operations beyond the configured test; use an allowlisted executable and argument array.', zh: 'exec会把自由格式命令交给shell，元字符可执行配置测试之外的操作；应使用白名单内的可执行文件与参数数组。' }
      - line: 10
        kind: performance
        note: { en: 'The gate retains stdout and stderr from every command without a task-level output budget; stream or truncate output while preserving an explicit truncation flag.', zh: '交付门没有任务级输出预算，却保留每条命令的stdout和stderr；应流式处理或截断输出，并保留明确的截断标记。' }
      - line: 13
        kind: readability
        note: { en: 'The authoritative-sounding passed name hides a keyword heuristic that accepts text such as 0 passed; parse and name explicit test counts, skips, and status fields.', zh: 'passed这个看似权威的名称掩盖了关键词启发式判断，它会接受0 passed等文字；应解析并明确命名测试数量、跳过项和状态字段。' }
      - line: 15
        kind: correctness
        note: { en: 'A string prefix does not prove path containment: a sibling such as /work/project-secrets also starts with /work/project. Resolve paths and use a path-aware relative check.', zh: '字符串前缀不能证明路径包含关系：/work/project-secrets这样的同级路径也以 /work/project开头。应解析路径并使用路径感知的相对关系检查。' }
      - line: 19
        kind: edge-case
        note: { en: 'Array.every is true for an empty command list, so a patch with no verification commands can be accepted when its changed-file list is also in scope.', zh: 'Array.every对空命令列表返回true，因此没有任何验证命令的补丁也可能在文件范围合规时获得接受。' }
    right: { en: 'The code fixes a working directory for each command, keeps command results in order, captures both output streams initially, and returns a small explicit decision object.', zh: '代码为每条命令固定工作目录，按顺序保留命令结果，起初捕获两个输出流，并返回简洁明确的决策对象。' }
    checklist:
      - { en: 'Reject empty commands and parse a versioned, structured test-result format.', zh: '拒绝空命令，并解析带版本的结构化测试结果格式。' }
      - { en: 'Execute allowlisted binaries with argument arrays, timeouts, cancellation, and bounded output.', zh: '使用参数数组执行白名单内程序，并设置超时、取消机制和输出上限。' }
      - { en: 'Resolve changed paths and prove containment with path operations rather than string prefixes.', zh: '解析改动路径，并使用路径操作而不是字符串前缀证明范围包含关系。' }
      - { en: 'Retain command, cwd, exit status, counts, skips, stderr, and truncation state as evidence.', zh: '保留命令、工作目录、退出状态、数量、跳过项、stderr和截断状态作为证据。' }
    explanation: { en: 'A delivery gate must derive its decision from structured process and test evidence. Shell strings, output keywords, string path prefixes, and vacuous truth all let an unverified patch appear acceptable.', zh: '交付门必须根据结构化的进程与测试证据推导决定。shell字符串、输出关键词、字符串路径前缀和空真值都会让未经验证的补丁看似可以接受。' }
    difficulty: advanced
    tags: [test-gate, independent-verification, code-review, audit-evidence]
    tests: node --check generated_test_gate.js
    minutes: 10
