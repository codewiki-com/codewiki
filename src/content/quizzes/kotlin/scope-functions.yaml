topic: kotlin/scope-functions
items:
  - id: predict-return-shapes
    type: predict
    prompt: { en: 'What does this program print?', zh: '这个程序会输出什么？' }
    code: |
      data class Box(var value: Int)

      fun main() {
          val box = Box(2)
          val first = box.apply { value += 3 }
              .let { it.value * 2 }
          val second = box.also { it.value += 1 }
              .run { value }

          println("$first/$second/${box.value}")
      }
    lang: kotlin
    options:
      - { text: { en: '10/6/6', zh: '10/6/6' }, correct: true }
      - { text: { en: '5/6/2', zh: '5/6/2' }, correct: false }
      - { text: { en: '10/5/6', zh: '10/5/6' }, correct: false }
      - { text: { en: 'It prints Box objects because every scope function returns its receiver.', zh: '输出 Box 对象，因为所有作用域函数都返回接收者。' }, correct: false }
    explanation: { en: 'apply and also preserve the same Box while their blocks mutate it. let returns 5 * 2, and run reads the value after also increments it to 6.', zh: 'apply 与 also 都保留同一个 Box，同时块会修改它；let 返回 5 * 2，run 则读取 also 把值增加到 6 后的结果。' }
    difficulty: beginner
    tags: [return-value, apply, also, let, run]

  - id: nullable-dot-versus-safe-call
    type: mcq
    prompt: { en: 'For value of type String?, which statement about value.let and value?.let is correct?', zh: '对于 String? 类型的 value，关于 value.let 与 value?.let 的哪项说法正确？' }
    options:
      - text: { en: 'value.let always invokes the block with a String?; value?.let skips it for null and supplies a non-null String otherwise.', zh: 'value.let 一定调用块并传入 String?；value?.let 在空值时跳过，非空时传入非空 String。' }
        correct: true
      - text: { en: 'Both forms skip the block when value is null.', zh: '两种写法都会在 value 为空时跳过块。' }
        correct: false
      - text: { en: 'let rejects nullable receivers at compile time.', zh: 'let 会在编译期拒绝可空接收者。' }
        correct: false
      - text: { en: 'value?.let invokes the block once with null before returning.', zh: 'value?.let 会先用 null 调用一次块，再返回。' }
        correct: false
    explanation: { en: 'let is generic enough to receive a nullable value. The safe-call operator, not let itself, provides the null short-circuit and non-null block argument.', zh: 'let 的泛型接收者可以是可空值；提供空值短路并让块参数非空的是安全调用符，而不是 let 本身。' }
    difficulty: intermediate
    tags: [let, null-safety, safe-call]

  - id: predict-nullable-result
    type: predict
    prompt: { en: 'What does lookup("known") print when the receiver exists but the let block returns null?', zh: '接收者存在但 let 块返回 null 时，lookup("known") 会输出什么？' }
    code: |
      fun source(key: String): String? =
          if (key == "known") "   " else null

      fun lookup(key: String): String =
          source(key)?.let { value ->
              value.trim().takeIf { it.isNotEmpty() }
          } ?: "missing"

      fun main() {
          println(lookup("known"))
      }
    lang: kotlin
    options:
      - { text: { en: 'missing', zh: 'missing' }, correct: true }
      - { text: { en: 'An empty line', zh: '一个空行' }, correct: false }
      - { text: { en: 'null', zh: 'null' }, correct: false }
      - { text: { en: 'The code fails because Elvis cannot follow let.', zh: '代码编译失败，因为 Elvis 不能接在 let 后。' }, correct: false }
    explanation: { en: 'The safe call invokes let because source returns a non-null string. takeIf then returns null for the trimmed empty string, so Elvis selects missing.', zh: 'source 返回非空字符串，因此安全调用会执行 let；trim 后为空使 takeIf 返回 null，Elvis 因而选择 missing。' }
    difficulty: intermediate
    tags: [let, nullable-result, elvis]

  - id: spotbug-nested-it
    title: { en: 'Spot the bug in the nested it receiver', zh: '找出嵌套 it 接收者里的 bug' }
    type: spotbug
    prompt: { en: 'The function should send every order belonging to the found customer. Find the receiver mistake.', zh: '函数应发送找到的客户名下的每个订单。请找出接收对象错误。' }
    code: |
      data class Customer(val id: String)
      data class Order(val customerId: String)

      fun notify(customer: Customer?, orders: List<Order>) {
          customer?.let {
              orders.filter { it.customerId == it.id }
                  .forEach { order -> send(order) }
          }
      }
    lang: kotlin
    issues:
      - line: 6
        kind: correctness
        note: { en: 'The inner it is an Order, so it.id does not refer to the Customer and does not compile. Name the outer parameter customer and compare order.customerId with customer.id.', zh: '内层 it 是 Order，因此 it.id 并不指向 Customer，代码也无法编译；应把外层参数命名为 customer，再比较 order.customerId 与 customer.id。' }
    explanation: { en: 'An implicit it belongs to the nearest one-parameter lambda. Naming customer and order makes both static types and the intended comparison visible.', zh: '隐式 it 属于最近的单参数 lambda；把两个参数命名为 customer 与 order，才能同时看清静态类型和预期比较。' }
    difficulty: intermediate
    tags: [let, nested-lambda, shadowing]

  - id: review-generated-signup-registry
    title: { en: 'Review generated signup registry', zh: '审查生成的注册表' }
    type: review
    prompt: { en: 'Review this generated signup registry before it handles production registrations.', zh: '在这个生成的注册表处理生产注册前审查它。' }
    task: { en: 'Normalize addresses, reject blank or duplicate addresses by returning null, avoid logging personal data, and keep high-volume registration efficient.', zh: '规范化地址，遇到空白或重复地址时返回 null，不记录个人数据，并让高频注册保持高效。' }
    code: |
      data class Signup(val email: String)

      class SignupRegistry {
          private val signups = mutableListOf<Signup>()

          fun register(rawEmail: String?): Signup? =
              rawEmail?.let { email ->
                  Signup(email.trim().lowercase())
              }?.also { signup ->
                  println("registered ${signup.email}")
                  if (signups.none { existing -> existing.email == signup.email }) {
                      signups += signup
                  }
              }

          fun size(): Int = signups.size
      }
    lang: kotlin
    right: { en: 'The code handles a null input without an assertion, normalizes case and surrounding whitespace, keeps mutation private, and names both nested lambda parameters.', zh: '代码没有用断言处理空输入，会规范化大小写与首尾空白，把修改保持为私有操作，并为两层 lambda 参数都取了名字。' }
    issues:
      - line: 8
        kind: edge-case
        note: { en: 'A blank or whitespace-only address becomes an empty Signup instead of returning null.', zh: '空白或纯空白地址会变成 email 为空的 Signup，而不是返回 null。' }
      - line: 9
        kind: correctness
        note: { en: 'also always returns signup, so a duplicate is reported as successful even when the block does not add it.', zh: 'also 总会返回 signup，因此重复地址即使没有加入列表也会被报告为成功。' }
      - line: 10
        kind: security
        note: { en: 'The log emits the normalized email address, disclosing personal data contrary to the task.', zh: '日志输出了规范化邮箱地址，违反任务要求并泄露个人数据。' }
      - line: 11
        kind: performance
        note: { en: 'Checking every existing Signup makes registration linear in the registry size; an address-keyed set or map gives direct membership lookup.', zh: '每次扫描所有 Signup 会让注册成本随表大小线性增长；按地址索引的集合或映射能直接判断成员。' }
    checklist:
      - { en: 'Try null, empty, whitespace-only, mixed-case, and surrounding-whitespace inputs.', zh: '测试 null、空字符串、纯空白、大小写混合和首尾带空白的输入。' }
      - { en: 'Register equivalent normalized addresses twice and assert the second result and size.', zh: '把规范化后相同的地址注册两次，并断言第二次结果和表大小。' }
      - { en: 'Capture logs with a sentinel address and assert that no output contains it.', zh: '用哨兵地址捕获日志，并断言输出中不含该地址。' }
      - { en: 'Benchmark membership checks at representative registry sizes before selecting storage.', zh: '在有代表性的注册表规模下测量成员检查，再选择存储结构。' }
    explanation: { en: 'Normalize into a local value, reject blank text, then insert into an address-keyed set or map whose insertion result reports duplicates. Log an opaque event ID or count instead of the address.', zh: '应先在局部值中完成规范化并拒绝空白文本，再插入按地址索引的集合或映射，并用插入结果表示重复；日志只记录不透明事件 ID 或数量，不记录地址。' }
    difficulty: advanced
    tags: [code-review, also, validation, privacy, performance]
