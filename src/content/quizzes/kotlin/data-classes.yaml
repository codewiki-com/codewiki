topic: kotlin/data-classes
items:
  - id: predict-shallow-copy
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      data class Labels(val values: MutableList<String>)

      fun main() {
          val original = Labels(mutableListOf("base"))
          val copied = original.copy()
          copied.values += "extra"

          println(original.values)
          println(copied.values)
      }
    lang: kotlin
    options:
      - text: { en: "[base]\n[base, extra]", zh: "[base]\n[base, extra]" }
        correct: false
      - text: { en: "[base, extra]\n[base, extra]", zh: "[base, extra]\n[base, extra]" }
        correct: true
      - text: { en: "[base]\n[base]", zh: "[base]\n[base]" }
        correct: false
      - text: { en: 'It fails because a copied val property cannot be changed.', zh: '编译失败，因为复制后的val属性不能修改。' }
        correct: false
    explanation: { en: 'copy() creates a new Labels instance but passes through the same MutableList reference. Mutating the list through either instance is visible through both.', zh: 'copy() 会创建新的Labels实例，但沿用同一个MutableList引用。通过任一实例修改列表，两个实例都能看到结果。' }
    difficulty: beginner
    tags: [copy, shallow-copy, mutability]

  - id: generated-member-boundary
    type: mcq
    prompt: { en: 'Which properties participate in all generated data-class members by default?', zh: '默认情况下，哪些属性会参与数据类生成的全部成员？' }
    options:
      - { text: { en: 'Every property reachable from the instance', zh: '从实例可达的全部属性' }, correct: false }
      - { text: { en: 'Only properties declared in the primary constructor', zh: '只有主构造函数中声明的属性' }, correct: true }
      - { text: { en: 'Only val properties, regardless of declaration site', zh: '所有val属性，不论声明位置' }, correct: false }
      - { text: { en: 'Only properties without default values', zh: '只有不带默认值的属性' }, correct: false }
    explanation: { en: 'Primary-constructor properties define generated equality, hashing, string output, components, and copying. Body properties are excluded and are initialized again in a copy.', zh: '主构造函数属性定义生成的相等性、哈希、字符串输出、组件和复制。类体属性不参与，并会在复制时重新初始化。' }
    difficulty: beginner
    tags: [primary-constructor, generated-members]

  - id: spotbug-mutable-hash-key
    title: { en: 'Spot the bug in the mutable data-class key', zh: '找出可变数据类键里的bug' }
    type: spotbug
    prompt: { en: 'This key must remain retrievable after insertion. Find the bug.', zh: '这个键插入后必须一直可以查到。请找出错误。' }
    code: |
      data class AccountKey(var email: String)

      fun main() {
          val key = AccountKey("old@example.com")
          val owners = mutableMapOf(key to "Ada")

          key.email = "new@example.com"
          println(owners[key])
      }
    lang: kotlin
    issues:
      - line: 7
        kind: correctness
        note: { en: 'Changing email changes the generated hash code after the key has been placed in the map, so lookup can search a different bucket.', zh: '键放入映射后再修改email，会改变生成的哈希码，因此查找可能进入另一个存储桶。' }
    explanation: { en: 'Use immutable key properties or construct a new AccountKey and replace the map entry. A hash-based collection cannot repair the position of a mutated key automatically.', zh: '应使用不可变键属性，或创建新的AccountKey并替换映射条目。哈希集合不会自动修复已修改键的存储位置。' }
    difficulty: intermediate
    tags: [hash-map, mutable-key, hash-code]

  - id: array-value-equality
    type: mcq
    prompt: { en: 'Two Packet instances contain distinct byteArrayOf(1, 2) arrays. With data class Packet(val bytes: ByteArray), what does packetA == packetB return?', zh: '两个Packet实例分别持有byteArrayOf(1, 2)。对于data class Packet(val bytes: ByteArray)，packetA == packetB返回什么？' }
    options:
      - { text: { en: 'true, because a data class recursively compares array elements', zh: 'true，因为数据类会递归比较数组元素' }, correct: false }
      - { text: { en: 'false, because the ByteArray references are distinct', zh: 'false，因为两个ByteArray引用不同' }, correct: true }
      - { text: { en: 'A compilation error, because arrays are forbidden in data classes', zh: '编译错误，因为数据类禁止使用数组' }, correct: false }
      - { text: { en: 'It depends on the generated toString() output', zh: '结果取决于生成的toString() 输出' }, correct: false }
    explanation: { en: 'Generated equality delegates to the property type, and arrays use reference equality for equals(). Use a List or override equality and hashing with matching content operations.', zh: '生成的相等性会委托给属性类型，而数组的equals() 使用引用相等性。应改用List，或用配对的内容操作同时重写相等性和哈希。' }
    difficulty: intermediate
    tags: [array, equality, content-equals]

  - id: copy-construction-behavior
    type: mcq
    prompt: { en: 'What happens to an initialized class-body property when copy() creates a data-class instance?', zh: 'copy() 创建数据类实例时，已经初始化过的类体属性会怎样？' }
    options:
      - { text: { en: 'Its current value is copied automatically.', zh: '自动复制它的当前值。' }, correct: false }
      - { text: { en: 'Its initializer runs for the new instance.', zh: '为新实例重新运行属性初始化器。' }, correct: true }
      - { text: { en: 'The property becomes null.', zh: '该属性变成null。' }, correct: false }
      - { text: { en: 'copy() refuses to compile when body properties exist.', zh: '只要存在类体属性，copy() 就无法编译。' }, correct: false }
    explanation: { en: 'copy() passes primary-constructor values into construction. Body properties are not copy parameters, so their initializers execute for the new object.', zh: 'copy() 会把主构造函数值传入构造过程。类体属性不是复制参数，因此其初始化器会为新对象执行。' }
    difficulty: intermediate
    tags: [copy, class-body, initialization]

  - id: review-generated-cart-snapshot
    title: { en: 'Review generated cart snapshot', zh: '审查生成的购物车快照' }
    type: review
    prompt: { en: 'Review this generated cart-state update before it is used in an application store.', zh: '在这段生成的购物车状态更新代码进入应用状态仓库前审查它。' }
    task: { en: 'Return a new snapshot with one item appended and the revision incremented, without changing the input or disclosing the access token.', zh: '返回新增一个商品且修订号递增的新快照，不得修改输入，也不得泄露访问令牌。' }
    code: |
      data class CartSnapshot(
          val id: String,
          val accessToken: String,
          val items: MutableList<String>,
      ) {
          var revision: Int = 0
      }

      fun addItem(snapshot: CartSnapshot, item: String): CartSnapshot {
          val next = snapshot.copy()
          next.items += item
          next.revision = snapshot.revision + 1
          println("updated: $next")
          return next
      }
    lang: kotlin
    right: { en: 'The code uses domain-specific names, models the outer state as a data class, returns a distinct outer instance, and makes the revision update visible.', zh: '代码使用了领域化命名，以数据类表示外层状态，返回不同的外层实例，并明确写出了修订号更新。' }
    issues:
      - line: 13
        kind: security
        note: { en: 'Interpolating next calls generated toString(), which includes the raw accessToken value in the log.', zh: '插值next会调用生成的toString()，从而把原始accessToken值写入日志。' }
      - line: 11
        kind: correctness
        note: { en: 'copy() shares the MutableList, so adding an item through next also mutates snapshot and violates the task.', zh: 'copy() 会共享MutableList，因此通过next添加商品也会修改snapshot，违反任务要求。' }
      - line: 6
        kind: edge-case
        note: { en: 'revision is outside the constructor, so copy() resets it before the manual increment and excludes it from equality and string output.', zh: 'revision位于构造函数外，因此copy() 会先重置它，并且相等性和字符串输出也会忽略它。' }
      - line: 9
        kind: readability
        note: { en: 'The signature accepts a model that exposes a mutable collection even though the operation promises snapshot semantics, leaving ownership unclear.', zh: '函数接收暴露可变集合的模型，却承诺快照语义，导致所有权不清楚。' }
    checklist:
      - { en: 'Classify every property as value state, derived state, cache, or secret.', zh: '把每个属性归类为值状态、派生状态、缓存或秘密。' }
      - { en: 'Trace aliases after copy() and mutate each nested mutable value in a test.', zh: '跟踪copy() 后的别名，并在测试中修改每个嵌套可变值。' }
      - { en: 'Exercise revisions zero and greater than zero to catch body-property resets.', zh: '测试修订号为零和大于零的情况，以发现类体属性重置。' }
      - { en: 'Search logs for a sentinel token and require a redacted representation.', zh: '在日志中搜索哨兵令牌，并要求使用经过遮盖的表示。' }
    explanation: { en: 'Move revision into the primary constructor, expose a read-only list, build a new list during the update, and log an allowlisted representation without the token. Those changes preserve the useful snapshot shape while making value semantics and ownership agree.', zh: '应把revision移入主构造函数，暴露只读列表，更新时构造新列表，并记录不含令牌的字段白名单表示。这样既保留有效的快照结构，也让值语义与所有权保持一致。' }
    difficulty: advanced
    tags: [code-review, shallow-copy, security, value-semantics]
