topic: kotlin/fundamentals
items:
  - id: predict-val-mutable-list
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      fun main() {
          val tags = mutableListOf("core")
          val alias = tags
          tags.add("jvm")
          println(alias.joinToString(" | "))
      }
    lang: kotlin
    options:
      - { text: { en: 'core', zh: 'core' }, correct: false }
      - { text: { en: 'core | jvm', zh: 'core | jvm' }, correct: true }
      - { text: { en: 'It fails because tags is declared with val.', zh: '编译失败，因为 tags 使用 val 声明。' }, correct: false }
      - { text: { en: 'It prints an empty line.', zh: '输出一个空行。' }, correct: false }
    explanation: { en: 'val prevents tags from being reassigned; it does not freeze the mutable list. alias points to the same list and observes the added element.', zh: 'val 禁止重新给 tags 赋值，但不会冻结可变列表。alias 指向同一个列表，因此能看到新增元素。' }
    difficulty: beginner
    tags: [val, mutability, predict-output]

  - id: explicit-numeric-conversion
    type: mcq
    prompt: { en: 'count has type Int. Which expression passes it to fun store(value: Long)?', zh: 'count 的类型是 Int。哪个表达式能把它传给 fun store(value: Long)？' }
    options:
      - { text: { en: 'store(count)', zh: 'store(count)' }, correct: false }
      - { text: { en: 'store(count.toLong())', zh: 'store(count.toLong())' }, correct: true }
      - { text: { en: 'store(count as Long)', zh: 'store(count as Long)' }, correct: false }
      - { text: { en: 'store(Long(count))', zh: 'store(Long(count))' }, correct: false }
    explanation: { en: 'Kotlin does not widen numeric arguments implicitly. toLong() performs the explicit conversion required by the function contract.', zh: 'Kotlin 不会隐式扩宽数字实参。toLong() 会执行函数契约所需的显式转换。' }
    difficulty: beginner
    tags: [numbers, conversion]

  - id: spotbug-null-assertion
    title: { en: 'Spot the bug in the name-length function', zh: '找出名称长度函数里的 bug' }
    type: spotbug
    prompt: { en: 'Find the bug in this function, which should return zero for a missing name.', zh: '找出这个函数中的错误；名称缺失时，它应返回零。' }
    code: |
      fun displayLength(name: String?): Int {
          if (name == null) {
              println("missing")
          }
          return name!!.length
      }
    lang: kotlin
    issues:
      - line: 5
        kind: correctness
        note: { en: 'Logging does not leave the function, so a null name reaches !! and throws instead of returning zero.', zh: '记录日志不会退出函数，因此 null 会到达 !! 并抛出异常，而不是返回零。' }
    explanation: { en: 'Return from the null branch, or write return name?.length ?: 0. Both choices preserve the stated behavior without a not-null assertion.', zh: '应在空值分支返回，或写成 return name?.length ?: 0。两种方式都不需要非空断言，并能保留题目要求的行为。' }
    difficulty: beginner
    tags: [null-safety, not-null-assertion, code-review]

  - id: exhaustive-enum-when
    type: mcq
    prompt: { en: 'Why omit else from a when expression that lists every member of an enum?', zh: '已经列出枚举所有成员的 when 表达式，为什么应省略 else？' }
    options:
      - { text: { en: 'It makes the generated bytecode always smaller.', zh: '它一定会让生成的字节码更小。' }, correct: false }
      - { text: { en: 'A new enum member then makes the expression fail to compile until it is handled.', zh: '新增枚举成员后，表达式会停止编译，直到该成员得到处理。' }, correct: true }
      - { text: { en: 'else is illegal for every enum subject.', zh: '枚举主题一律不允许使用 else。' }, correct: false }
      - { text: { en: 'It changes when from an expression into a statement.', zh: '它会把 when 从表达式变成语句。' }, correct: false }
    explanation: { en: 'An exhaustive enum when lets the compiler track the closed set of states. A broad else hides newly added members from that check.', zh: '穷尽枚举的 when 能让编译器跟踪封闭状态集合。宽泛的 else 会让新增成员逃过这项检查。' }
    difficulty: intermediate
    tags: [when, enum, exhaustiveness]

  - id: review-generated-invoice-total
    title: { en: 'Review generated invoice total', zh: '审查生成的发票合计' }
    type: review
    prompt: { en: 'Review this generated invoice code before it processes a large purchase list.', zh: '在这段生成的发票代码处理大型购买列表前审查它。' }
    task: { en: 'Calculate a discounted total in cents. Reject missing prices and negative quantities instead of silently accepting them.', zh: '计算折扣后的总金额（单位为分）。价格缺失或数量为负时应拒绝数据，不能静默接受。' }
    code: |
      data class Purchase(
          val priceCents: Long?,
          val quantity: Int,
      )

      fun invoiceTotal(purchases: List<Purchase>, discountPercent: Int): Long {
          var total = 0L

          for (index in purchases.indices) {
              val purchase = purchases.drop(index).first()
              val price = purchase.priceCents!!
              if (purchase.quantity < 0) continue
              total += price * purchase.quantity
          }

          return total * (100 - discountPercent) / 100
      }

      fun customerMessage(name: String?, totalCents: Long): String {
          val displayName = name ?: "Customer"
          return "Hello $displayName, total: ${totalCents / 100}"
      }
    lang: kotlin
    right: { en: 'The generated code keeps amounts in integer cents, uses a Long accumulator, gives the record fields domain names, and handles an absent display name explicitly.', zh: '生成代码使用整数分保存金额，采用 Long 累加器，为记录字段使用了领域名称，并显式处理缺失的显示名称。' }
    issues:
      - line: 10
        kind: performance
        note: { en: 'drop(index) creates a suffix list on every iteration; direct iteration avoids repeated traversal and allocation.', zh: 'drop(index) 每轮都会创建后缀列表；直接遍历可以避免反复遍历和分配。' }
      - line: 11
        kind: edge-case
        note: { en: 'A missing price throws a generic NullPointerException through !! instead of being rejected with a useful boundary error.', zh: '价格缺失时，!! 会抛出笼统的 NullPointerException，而不是在边界给出有用的拒绝信息。' }
      - line: 12
        kind: correctness
        note: { en: 'A negative quantity is silently skipped, contrary to the task requirement to reject invalid purchase data.', zh: '负数量被静默跳过，违反了任务中拒绝无效购买数据的要求。' }
      - line: 16
        kind: readability
        note: { en: 'The literal 100 and integer truncation leave the percentage scale and rounding policy unnamed.', zh: '数字 100 和整数截断没有说明百分比尺度与舍入策略，含义不够明确。' }
    checklist:
      - { en: 'Trace null and invalid numeric inputs to an explicit boundary decision.', zh: '跟踪空值和无效数字输入，确认边界有明确处理决定。' }
      - { en: 'Check units and overflow range before multiplying prices and quantities.', zh: '在价格与数量相乘前检查单位和溢出范围。' }
      - { en: 'Inspect collection operations inside loops for repeated copying or traversal.', zh: '检查循环内的集合操作是否反复复制或遍历。' }
      - { en: 'Name and test the percentage and rounding policy.', zh: '为百分比与舍入策略命名并编写测试。' }
    explanation: { en: 'Iterate over each purchase directly, validate nullable and negative fields at the boundary, and give percentage scaling and rounding explicit names. These fixes preserve the good unit choice while making failure and cost visible.', zh: '应直接遍历每笔购买，在边界验证可空字段与负数，并为百分比尺度和舍入策略命名。这些修复保留了合理的单位选择，同时让失败路径和成本可见。' }
    difficulty: advanced
    tags: [code-review, null-safety, validation, performance]
