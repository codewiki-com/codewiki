topic: kotlin/sealed-classes
items:
  - id: predict-exhaustive-render
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      sealed interface UploadState {
          data object Waiting : UploadState
          data class Complete(val files: Int) : UploadState
      }

      fun label(state: UploadState): String = when (state) {
          UploadState.Waiting -> "waiting"
          is UploadState.Complete -> "${state.files} files"
      }

      fun main() {
          println(label(UploadState.Complete(3)))
      }
    lang: kotlin
    options:
      - { text: { en: '3 files', zh: '3 files' }, correct: true }
      - { text: { en: 'Complete(files=3)', zh: 'Complete(files=3)' }, correct: false }
      - { text: { en: 'waiting', zh: 'waiting' }, correct: false }
      - { text: { en: 'It fails because when has no else.', zh: '编译失败，因为 when 没有 else。' }, correct: false }
    explanation: { en: 'Both direct implementations are covered, so the when is exhaustive. The Complete branch smart-casts state and reads files.', zh: '两个直接实现都已覆盖，因此 when 是穷尽的。Complete 分支会智能转换 state 并读取 files。' }
    difficulty: beginner
    tags: [when, exhaustiveness, smart-cast]

  - id: direct-subtype-boundary
    type: mcq
    prompt: { en: 'Where may a direct subclass of a sealed class be declared in Kotlin 2.4.10?', zh: '在 Kotlin 2.4.10 中，密封类的直接子类可以声明在哪里？' }
    options:
      - { text: { en: 'Only inside the sealed class body', zh: '只能写在密封类的类体中' }, correct: false }
      - { text: { en: 'Anywhere in the same package and module, provided it has a qualified name', zh: '同包同模块中的任意位置，且必须有可限定名称' }, correct: true }
      - { text: { en: 'In any module that uses the same package name', zh: '只要包名相同，就能写在任意模块中' }, correct: false }
      - { text: { en: 'As a local class inside any function', zh: '可以作为任意函数中的局部类' }, correct: false }
    explanation: { en: 'Package and module boundaries both apply to direct subtypes, which must also be named rather than local or anonymous. Indirect extension follows the modifier on the direct child.', zh: '直接子类型同时受包与模块边界限制，而且必须具名，不能是局部类或匿名对象。间接扩展则取决于直接子类型的修饰符。' }
    difficulty: intermediate
    tags: [inheritance, module, package]

  - id: spotbug-else-hides-state
    title: { en: 'Spot the bug in delivery state labeling', zh: '找出配送状态标签里的 bug' }
    type: spotbug
    prompt: { en: 'Every delivery state needs an explicit label. Find the line that defeats compile-time checking.', zh: '每种配送状态都需要明确标签。请找出破坏编译期检查的代码行。' }
    code: |
      sealed interface DeliveryState {
          data object Queued : DeliveryState
          data object Sent : DeliveryState
          data class Failed(val reason: String) : DeliveryState
      }

      fun label(state: DeliveryState): String = when (state) {
          DeliveryState.Queued -> "queued"
          DeliveryState.Sent -> "sent"
          else -> "unknown"
      }

      fun main() {
          println(label(DeliveryState.Failed("offline")))
      }
    lang: kotlin
    issues:
      - line: 10
        kind: correctness
        note: { en: 'The else branch hides the omitted Failed case and will also hide future variants, so the required explicit label is never enforced.', zh: 'else 会掩盖遗漏的 Failed，也会继续掩盖未来变体，因此无法强制每种状态都有明确标签。' }
    explanation: { en: 'Replace else with an is DeliveryState.Failed branch. With every case named, adding another variant makes this decision fail to compile until its behavior is chosen.', zh: '应把 else 替换为 is DeliveryState.Failed 分支。逐项命名后，新增变体会让这里停止编译，直到开发者决定其行为。' }
    difficulty: intermediate
    tags: [else, exhaustiveness, evolution]

  - id: predict-nothing-branch
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      sealed interface Result<out T> {
          data object Loading : Result<Nothing>
          data class Success<T>(val value: T) : Result<T>
      }

      fun main() {
          val result: Result<String> = Result.Loading
          println(result)
      }
    lang: kotlin
    options:
      - { text: { en: 'Loading', zh: 'Loading' }, correct: true }
      - { text: { en: 'null', zh: 'null' }, correct: false }
      - { text: { en: 'Result.Loading', zh: 'Result.Loading' }, correct: false }
      - { text: { en: 'It fails because Nothing is not String.', zh: '编译失败，因为 Nothing 不是 String。' }, correct: false }
    explanation: { en: 'Result is covariant, and Nothing is a subtype of every Kotlin type, so Result<Nothing> can be used as Result<String>. A data object prints its declared name.', zh: 'Result 是协变类型，而 Nothing 是所有 Kotlin 类型的子类型，因此 Result<Nothing> 可用作 Result<String>。data object 会输出其声明名称。' }
    difficulty: intermediate
    tags: [covariance, nothing, data-object]

  - id: class-interface-enum-choice
    type: mcq
    prompt: { en: 'Which declaration best models one implementation that is both a known Failure variant and a known Retryable variant?', zh: '一个实现既是已知的 Failure 变体，又是已知的 Retryable 变体，最适合用哪种声明建模？' }
    options:
      - { text: { en: 'Two sealed interfaces implemented by the same class', zh: '让同一个类实现两个密封接口' }, correct: true }
      - { text: { en: 'Two sealed classes inherited by the same class', zh: '让同一个类继承两个密封类' }, correct: false }
      - { text: { en: 'One enum entry with mutable fields', zh: '使用带可变字段的一个枚举项' }, correct: false }
      - { text: { en: 'One open base class with an else branch', zh: '使用开放基类并添加 else 分支' }, correct: false }
    explanation: { en: 'Kotlin allows a class to implement multiple interfaces but inherit from only one class. Sealed interfaces preserve controlled direct implementations for both classifications.', zh: 'Kotlin 允许一个类实现多个接口，却只能继承一个类。两个密封接口都能保持对各自直接实现集合的控制。' }
    difficulty: intermediate
    tags: [sealed-interface, multiple-inheritance, modeling]

  - id: review-generated-payment-state
    title: { en: 'Review a generated payment hierarchy', zh: '审查生成的支付状态层级' }
    type: review
    prompt: { en: 'Review this generated payment-state code before it becomes a public application model.', zh: '在这段生成的支付状态代码成为公开应用模型前审查它。' }
    task: { en: 'Keep the state hierarchy closed, render a public status without secrets, and retry only network failures.', zh: '保持状态层级封闭，生成不含秘密的公开状态，并且只重试网络失败。' }
    code: |
      sealed interface PaymentState
      data object Idle : PaymentState
      data object Processing : PaymentState
      data class Paid(val receiptId: String, val paymentToken: String) : PaymentState
      open class Failed(val message: String) : PaymentState
      class NetworkFailed(message: String) : Failed(message)

      fun render(state: PaymentState): String {
          return when (state) {
              Idle -> "idle"
              Processing -> "processing"
              is Paid -> "paid ${state.receiptId} with ${state.paymentToken}"
              else -> "failed"
          }
      }

      fun shouldRetry(state: PaymentState): Boolean =
          state::class.simpleName?.contains("Network") == true

      fun main() {
          val state = Paid("R-9", "tok_live_123")
          println(render(state))
      }
    lang: kotlin
    right: { en: 'The code uses immutable singleton states for payload-free cases, a data class for the paid payload, domain-specific names, and a separate retry decision.', zh: '代码为无载荷状态使用了不可变单例，为已支付载荷使用了数据类，并采用领域化命名，还把重试判断拆成了独立操作。' }
    issues:
      - line: 5
        kind: edge-case
        note: { en: 'Failed is open, so indirect failure classes can appear outside the sealed parent package; one broad branch can no longer distinguish the concrete set.', zh: 'Failed 是开放类，因此密封父类型所在包之外仍可增加间接失败类型；一个宽泛分支无法再区分具体集合。' }
      - line: 12
        kind: security
        note: { en: 'The public rendering includes the raw payment token, exposing a credential through UI text or logs that consume this string.', zh: '公开字符串包含原始支付令牌，可能通过界面文本或使用该字符串的日志泄露凭证。' }
      - line: 13
        kind: correctness
        note: { en: 'The else branch merges every failure and future state, suppressing the compiler signal that each state needs an intentional rendering.', zh: 'else 把所有失败和未来状态合并处理，压制了“每种状态都要明确渲染”的编译器反馈。' }
      - line: 18
        kind: readability
        note: { en: 'A substring check on a runtime class name hides retry policy in naming and breaks when the class is renamed; model Retryable as a type instead.', zh: '按运行时类名做子串检查，会把重试策略藏进命名约定，并在类重命名后失效；应把 Retryable 建模为类型。' }
    checklist:
      - { en: 'List every direct child and record whether it is final, sealed, or open.', zh: '列出每个直接子类型，并记录它是 final、sealed 还是 open。' }
      - { en: 'Remove broad else branches and compile after adding a temporary state.', zh: '删除宽泛的 else，并在加入临时状态后重新编译。' }
      - { en: 'Trace every value included in public strings and logs.', zh: '追踪公开字符串和日志中包含的每个值。' }
      - { en: 'Represent retry capability with types and test retryable and non-retryable failures.', zh: '用类型表示重试能力，并测试可重试与不可重试失败。' }
    explanation: { en: 'Make failure leaves final or sealed, render each variant explicitly without paymentToken, and introduce a Retryable interface for the network case. Those changes turn hierarchy evolution and retry policy back into compiler-checked decisions.', zh: '应让失败叶节点保持 final 或 sealed，逐项渲染且不包含 paymentToken，并为网络失败引入 Retryable 接口。这些修改能让层级演进与重试策略重新成为编译器检查的决定。' }
    difficulty: advanced
    tags: [sealed-hierarchy, security, review, evolution]
