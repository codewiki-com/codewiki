topic: kotlin/delegated-properties
items:
  - id: predict-lazy-first-access
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      var calls = 0

      val token: String by lazy {
          calls += 1
          println("compute")
          "T-$calls"
      }

      fun main() {
          println(calls)
          println(token)
          println(token)
          println(calls)
      }
    lang: kotlin
    options:
      - text: { en: "0\ncompute\nT-1\nT-1\n1", zh: "0\ncompute\nT-1\nT-1\n1" }
        correct: true
      - text: { en: "compute\n1\nT-1\nT-1\n1", zh: "compute\n1\nT-1\nT-1\n1" }
        correct: false
      - text: { en: "0\ncompute\nT-1\ncompute\nT-2\n2", zh: "0\ncompute\nT-1\ncompute\nT-2\n2" }
        correct: false
      - text: { en: 'It fails because lazy can only be used for member properties.', zh: '编译失败，因为 lazy 只能用于成员属性。' }
        correct: false
    explanation: { en: 'The delegate is created at top-level initialization, but its initializer runs only on the first read of token. The successful result is cached, so the second read neither increments calls nor prints compute.', zh: '委托在顶层初始化阶段创建，但初始化器只在第一次读取 token 时运行。成功结果会被缓存，因此第二次读取既不会增加 calls，也不会再次输出 compute。' }
    difficulty: beginner
    tags: [lazy, initialization, caching]

  - id: predict-vetoable-write
    type: predict
    prompt: { en: 'What does this program print after the rejected assignment?', zh: '拒绝赋值后，这段程序会输出什么？' }
    code: |
      import kotlin.properties.Delegates

      var quantity: Int by Delegates.vetoable(1) { _, old, new ->
          println("$old -> $new")
          new >= 0
      }

      fun main() {
          quantity = 4
          quantity = -2
          println(quantity)
      }
    lang: kotlin
    options:
      - text: { en: "1 -> 4\n4 -> -2\n4", zh: "1 -> 4\n4 -> -2\n4" }
        correct: true
      - text: { en: "1 -> 4\n4 -> -2\n-2", zh: "1 -> 4\n4 -> -2\n-2" }
        correct: false
      - text: { en: "1 -> 4\n4", zh: "1 -> 4\n4" }
        correct: false
      - text: { en: 'An exception is thrown for the negative value.', zh: '负数会导致异常。' }
        correct: false
    explanation: { en: 'The predicate runs before both attempted writes. Returning false for -2 discards that new value without throwing, so quantity remains 4.', zh: '两次写入尝试都会先运行谓词。对 -2 返回 false 会丢弃新值且不抛出异常，因此 quantity 保持为 4。' }
    difficulty: beginner
    tags: [vetoable, assignment, validation]

  - id: provide-delegate-timing
    type: mcq
    prompt: { en: 'When is provideDelegate() called for a delegated member property?', zh: '成员委托属性的 provideDelegate() 在什么时候调用？' }
    options:
      - { text: { en: 'Once while the owner instance is initialized and the property is bound', zh: '所属对象初始化、属性建立绑定时调用一次' }, correct: true }
      - { text: { en: 'On every getter call, immediately before getValue()', zh: '每次调用 getter 时，在 getValue() 之前调用' }, correct: false }
      - { text: { en: 'Only when the first assigned value fails validation', zh: '只在第一次赋值未通过验证时调用' }, correct: false }
      - { text: { en: 'At source compilation, inside the compiler process', zh: '在源代码编译时，由编译器进程调用' }, correct: false }
    explanation: { en: 'The provider creates the real delegate as the owner is initialized. Later reads and writes call getValue() and setValue() on that returned delegate.', zh: '提供者在所属对象初始化时创建真正的委托。之后的读写会在返回的委托上调用 getValue() 和 setValue()。' }
    difficulty: intermediate
    tags: [provide-delegate, binding, initialization]

  - id: spotbug-shared-singleton-delegate
    title: { en: 'Spot the bug in the singleton delegate', zh: '找出单例委托里的 bug' }
    type: spotbug
    prompt: { en: 'Each form field and each form must keep an independent value. Find the bug.', zh: '每个表单字段和每个表单都必须保存独立值。请找出错误。' }
    code: |
      import kotlin.properties.ReadWriteProperty
      import kotlin.reflect.KProperty

      object SharedText : ReadWriteProperty<Any?, String> {
          private var value = ""

          override fun getValue(thisRef: Any?, property: KProperty<*>): String = value

          override fun setValue(thisRef: Any?, property: KProperty<*>, value: String) {
              this.value = value.trim()
          }
      }

      class ContactForm {
          var name: String by SharedText
          var city: String by SharedText
      }
    lang: kotlin
    issues:
      - line: 5
        kind: correctness
        note: { en: 'SharedText is one singleton with one value field, so both properties on every ContactForm read and overwrite the same storage.', zh: 'SharedText 是只有一个 value 字段的单例，因此所有 ContactForm 的两个属性都会读写同一份存储。' }
    explanation: { en: 'Construct a separate stateful delegate for each property, or return one from provideDelegate(). A shared delegate must instead key storage by owner and property, with an explicit lifetime policy.', zh: '应为每个属性构造独立的有状态委托，或由 provideDelegate() 返回独立实例。共享委托则必须按所有者和属性索引存储，并明确生命周期策略。' }
    difficulty: intermediate
    tags: [shared-state, singleton, ownership]

  - id: map-delegate-failure-boundary
    type: mcq
    prompt: { en: 'What does val age: Int by values guarantee when values has type Map<String, Any?>?', zh: '当 values 的类型为 Map<String, Any?> 时，val age: Int by values 能保证什么？' }
    options:
      - { text: { en: 'Only that reads use the key "age"; key presence and runtime value type can still fail', zh: '只能保证读取使用键“age”；键是否存在及运行时值类型仍可能出错' }, correct: true }
      - { text: { en: 'The compiler inserts age with a default value of zero when it is missing', zh: '缺少 age 时，编译器会插入默认值 0' }, correct: false }
      - { text: { en: 'Every Number value is automatically converted to Int', zh: '所有 Number 值都会自动转换为 Int' }, correct: false }
      - { text: { en: 'Renaming the property also migrates persisted map keys', zh: '重命名属性时，持久化映射中的键也会自动迁移' }, correct: false }
    explanation: { en: 'Map delegation derives the key from the property name and performs lookup when the property is read. It doesn''t validate external data ahead of time or migrate keys after a rename.', zh: '映射委托从属性名得出键，并在读取属性时查找。它不会提前验证外部数据，也不会在属性重命名后迁移旧键。' }
    difficulty: intermediate
    tags: [map-delegate, runtime-type, schema-evolution]

  - id: review-generated-account-fields
    title: { en: 'Review generated account field delegate', zh: '审查生成的账户字段委托' }
    type: review
    prompt: { en: 'Review this generated property delegate before it is used for account input.', zh: '在这个生成的属性委托用于账户输入前审查它。' }
    task: { en: 'Trim input while keeping every field and AccountForm instance independent, reject blank values, and never log an API token.', zh: '修剪输入，同时让每个字段和 AccountForm 实例彼此独立；拒绝空白值，并且绝不记录 API 令牌。' }
    code: |
      import kotlin.properties.ReadWriteProperty
      import kotlin.reflect.KProperty

      object TrimmedText : ReadWriteProperty<Any?, String> {
          private var value = ""

          override fun getValue(thisRef: Any?, property: KProperty<*>): String = value

          override fun setValue(
              thisRef: Any?,
              property: KProperty<*>,
              newValue: String,
          ) {
              println("${property.name}: '$value' -> '${newValue.trim()}'")
              value = newValue.trim()
          }
      }

      class AccountForm {
          var displayName: String by TrimmedText
          var apiToken: String by TrimmedText
      }
    lang: kotlin
    right: { en: 'The code uses the standard ReadWriteProperty contract, gives the delegate and fields domain-relevant names, and applies trimming in one place instead of duplicating setters.', zh: '代码使用了标准 ReadWriteProperty 契约，委托和字段命名符合领域含义，并把修剪逻辑集中在一处，没有重复编写 setter。' }
    issues:
      - line: 5
        kind: correctness
        note: { en: 'A singleton delegate has one value field, so displayName, apiToken, and every AccountForm instance overwrite the same state.', zh: '单例委托只有一个 value 字段，因此 displayName、apiToken 以及所有 AccountForm 实例都会覆盖同一份状态。' }
      - line: 14
        kind: security
        note: { en: 'Assigning apiToken logs its raw previous and new values, exposing the secret through ordinary property use.', zh: '给 apiToken 赋值会记录原始的新旧值，普通属性操作就会泄露秘密。' }
      - line: 15
        kind: edge-case
        note: { en: 'Whitespace-only input becomes an empty string and is stored even though the task requires blank values to be rejected.', zh: '只有空白的输入会变成空字符串并被保存，但任务要求拒绝空白值。' }
    checklist:
      - { en: 'Count delegate instances and identify every owner and property that can reach each one.', zh: '统计委托实例，并找出能够访问每个实例的所有对象与属性。' }
      - { en: 'Interleave assignments across two fields on two AccountForm instances.', zh: '在两个 AccountForm 实例的两个字段之间交错赋值。' }
      - { en: 'Assign blank and whitespace-only values and assert the failure contract.', zh: '传入空字符串和纯空白值，并断言失败契约。' }
      - { en: 'Use a sentinel token and assert that no log line contains it.', zh: '使用哨兵令牌，并断言任何日志行都不包含它。' }
    explanation: { en: 'Use a factory or provider that creates one delegate per property and owner, validate the trimmed value before storing it, and remove value logging from the generic delegate. Those changes preserve reusable normalization without hiding shared global state or secret disclosure.', zh: '应使用工厂或提供者为每个属性和所属对象创建独立委托，在保存前验证修剪后的值，并从通用委托中移除值日志。这样既能复用规范化逻辑，也不会隐藏全局共享状态或泄露秘密。' }
    difficulty: advanced
    tags: [code-review, shared-state, validation, security]
