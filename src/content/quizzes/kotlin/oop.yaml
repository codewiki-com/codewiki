topic: kotlin/oop
items:
  - id: predict-runtime-dispatch
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      open class Report {
          open fun format(): String = "plain"
          fun render(): String = "format=${format()}"
      }

      class CsvReport : Report() {
          override fun format(): String = "csv"
      }

      fun main() {
          val report: Report = CsvReport()
          println(report.render())
      }
    lang: kotlin
    options:
      - { text: { en: 'format=plain', zh: 'format=plain' }, correct: false }
      - { text: { en: 'format=csv', zh: 'format=csv' }, correct: true }
      - { text: { en: 'It fails because report has the base type.', zh: '编译失败，因为 report 使用基类类型。' }, correct: false }
      - { text: { en: 'It prints both formats.', zh: '同时输出两种格式。' }, correct: false }
    explanation: { en: 'render() is final but calls the open format() member. Runtime dispatch selects CsvReport.format() even though the reference has type Report.', zh: 'render() 是最终成员，但它调用开放成员 format()。即使引用类型是 Report，运行时分派仍会选择 CsvReport.format()。' }
    difficulty: beginner
    tags: [runtime-dispatch, override, predict-output]

  - id: final-by-default
    type: mcq
    prompt: { en: 'Which declaration permits a subclass to replace calculate()?', zh: '哪个声明允许子类覆盖 calculate()？' }
    options:
      - { text: { en: 'class Price { fun calculate() = 0 }', zh: 'class Price { fun calculate() = 0 }' }, correct: false }
      - { text: { en: 'open class Price { open fun calculate() = 0 }', zh: 'open class Price { open fun calculate() = 0 }' }, correct: true }
      - { text: { en: 'class Price { override fun calculate() = 0 }', zh: 'class Price { override fun calculate() = 0 }' }, correct: false }
      - { text: { en: 'final class Price { open fun calculate() = 0 }', zh: 'final class Price { open fun calculate() = 0 }' }, correct: false }
    explanation: { en: 'Both the class and the member must be open. The subclass then marks its implementation with override.', zh: '类和成员都必须开放，子类再用 override 标记自己的实现。' }
    difficulty: beginner
    tags: [open, final, inheritance]

  - id: spotbug-public-balance
    type: spotbug
    prompt: { en: 'The balance must never be negative. Find the object-boundary bug.', zh: '余额绝不能为负数。请找出对象边界错误。' }
    code: |
      class Wallet(initialCents: Int) {
          var balanceCents: Int = initialCents

          init {
              require(initialCents >= 0)
          }

          fun spend(cents: Int): Boolean {
              require(cents > 0)
              if (cents > balanceCents) return false
              balanceCents -= cents
              return true
          }
      }

      fun main() {
          val wallet = Wallet(500)
          wallet.balanceCents = -1
          println(wallet.balanceCents)
      }
    lang: kotlin
    issues:
      - line: 2
        kind: correctness
        note: { en: 'The public setter lets callers bypass spend() and the constructor check, so the class cannot preserve its non-negative invariant.', zh: '公开 setter 允许调用方绕过 spend() 与构造检查，因此该类无法维护余额非负的不变量。' }
    explanation: { en: 'Give balanceCents a private setter or keep it private and expose a read-only view. Every mutation should pass through an operation that preserves the invariant.', zh: '应给 balanceCents 添加私有 setter，或保持属性私有并公开只读视图。每次修改都应经过维护不变量的操作。' }
    difficulty: beginner
    tags: [encapsulation, invariant, visibility]

  - id: abstract-class-or-interface
    type: mcq
    prompt: { en: 'A family of parsers needs one shared constructor-owned cache and a fixed parse template. Which starting point best matches that contract?', zh: '一组解析器需要构造时持有的共享缓存，以及固定的解析模板。哪个起点最符合该契约？' }
    options:
      - { text: { en: 'An abstract class with protected state and a final template method', zh: '带受保护状态与最终模板方法的抽象类' }, correct: true }
      - { text: { en: 'An interface with a backing field', zh: '带后备字段的接口' }, correct: false }
      - { text: { en: 'A top-level mutable variable', zh: '顶层可变变量' }, correct: false }
      - { text: { en: 'An object declaration shared by every parser', zh: '由所有解析器共享的对象声明' }, correct: false }
    explanation: { en: 'An abstract class can own per-instance constructor state and keep the template final while exposing narrow abstract steps. Interfaces have no instance backing fields.', zh: '抽象类可以持有每个实例的构造状态，让模板保持最终，并只公开狭窄的抽象步骤。接口没有实例后备字段。' }
    difficulty: intermediate
    tags: [abstract-class, interface, template-method]

  - id: composition-boundary
    type: mcq
    prompt: { en: 'BillingService needs to send audit records through interchangeable destinations. Which relationship keeps the boundary smallest?', zh: 'BillingService 需要通过可替换目标发送审计记录。哪种关系能保持最小边界？' }
    options:
      - { text: { en: 'BillingService inherits FileAuditSink.', zh: '让 BillingService 继承 FileAuditSink。' }, correct: false }
      - { text: { en: 'BillingService accepts an AuditSink interface in its constructor.', zh: '让 BillingService 在构造函数中接收 AuditSink 接口。' }, correct: true }
      - { text: { en: 'BillingService writes to a companion-object list.', zh: '让 BillingService 写入伴生对象列表。' }, correct: false }
      - { text: { en: 'Every billing method creates its own FileAuditSink.', zh: '让每个计费方法创建自己的 FileAuditSink。' }, correct: false }
    explanation: { en: 'Constructor composition states that the service has an audit sink, allows replacement without opening the service hierarchy, and gives tests an explicit seam.', zh: '构造函数组合表达服务拥有审计目标，无需开放服务层级即可替换实现，也为测试提供明确接缝。' }
    difficulty: intermediate
    tags: [composition, interface, dependency-injection]

  - id: review-generated-notification-service
    type: review
    prompt: { en: 'Review this generated notification service before it handles several tenants.', zh: '在这段生成的通知服务处理多个租户前审查它。' }
    task: { en: 'Use an injected delivery client, keep a private successful-send count per service instance, reject malformed addresses, and never disclose the API token.', zh: '使用注入的投递客户端，为每个服务实例维护私有的成功发送计数，拒绝格式错误的地址，并且绝不泄露 API 令牌。' }
    code: |
      open class EmailClient {
          fun deliver(address: String, body: String): Boolean =
              address.contains("@") && body.isNotBlank()
      }

      open class NotificationService(val apiToken: String) {
          companion object {
              val history = mutableListOf<String>()
          }

          var sent = 0

          fun send(address: String, body: String): Boolean {
              println("using token=$apiToken")
              val delivered = EmailClient().deliver(address, body)
              history += "$address:$delivered"
              if (delivered) sent++
              return delivered
          }
      }
    lang: kotlin
    right: { en: 'The code separates delivery from orchestration, returns an explicit success value, uses domain names, and increments the count only after a reported delivery.', zh: '代码把投递与编排分开，返回明确的成功值，使用领域名称，并且只在投递报告成功后增加计数。' }
    issues:
      - line: 3
        kind: edge-case
        note: { en: 'contains("@") accepts malformed values such as "@"; validation must match the address contract or be delegated to a validated value type.', zh: 'contains("@") 会接受 "@" 等错误值；校验必须符合地址契约，或交给经过验证的值类型。' }
      - line: 6
        kind: readability
        note: { en: 'The service and client are open without any documented override protocol, exposing behavior that was not designed for inheritance.', zh: '服务和客户端在没有覆盖协议文档的情况下开放，暴露了并未按继承设计的行为。' }
      - line: 8
        kind: correctness
        note: { en: 'The companion history is shared by every service and tenant, contrary to per-instance ownership and isolation.', zh: '伴生对象 history 由所有服务与租户共享，违反每个实例的所有权和隔离要求。' }
      - line: 14
        kind: security
        note: { en: 'The raw API token is written to standard output and can leak through application or test logs.', zh: '原始 API 令牌被写入标准输出，可能通过应用日志或测试日志泄漏。' }
      - line: 15
        kind: performance
        note: { en: 'Constructing a new client for every send discards connection or configuration reuse and ignores the required injected collaborator.', zh: '每次发送都创建新客户端，既丢失连接或配置复用，也忽略了任务要求的注入协作者。' }
    checklist:
      - { en: 'List each mutable field and identify whether it belongs to one call, one service, one tenant, or the process.', zh: '列出每个可变字段，判断它属于一次调用、一个服务、一个租户还是整个进程。' }
      - { en: 'Try to mutate protected state through every public property and inherited member.', zh: '尝试通过每个公开属性与继承成员修改受保护状态。' }
      - { en: 'Inject a fake client and test success, rejection, and collaborator failure without network access.', zh: '注入假客户端，在无网络条件下测试成功、拒绝和协作者失败。' }
      - { en: 'Capture logs with a sentinel token and assert that the token never appears.', zh: '使用哨兵令牌捕获日志，并断言令牌从未出现。' }
    explanation: { en: 'Use a narrow DeliveryClient interface, inject it into a final service, keep sent private with a read-only accessor, and remove global history and token logging. Put address validation at the input boundary and test independent service instances.', zh: '应使用狭窄的 DeliveryClient 接口，把它注入最终服务，让 sent 保持私有并提供只读访问，同时删除全局 history 与令牌日志。地址校验应放在输入边界，并测试相互独立的服务实例。' }
    difficulty: advanced
    tags: [code-review, encapsulation, shared-state, security, composition]
