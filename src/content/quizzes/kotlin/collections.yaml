topic: kotlin/collections
items:
  - id: predict-read-only-alias
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      fun main() {
          val source = mutableListOf("core")
          val view: List<String> = source
          source += "jvm"
          println(view.joinToString(" | "))
      }
    lang: kotlin
    options:
      - { text: { en: 'core', zh: 'core' }, correct: false }
      - { text: { en: 'core | jvm', zh: 'core | jvm' }, correct: true }
      - { text: { en: 'It fails because view is read-only.', zh: '编译失败，因为view是只读集合。' }, correct: false }
      - { text: { en: 'It prints an empty line.', zh: '输出一个空行。' }, correct: false }
    explanation: { en: 'The List type removes write methods from view but does not copy source. Both references observe the same backing list.', zh: 'List类型让view不再暴露写方法，但不会复制source。两个引用观察的是同一个底层列表。' }
    difficulty: beginner
    tags: [read-only-collection, aliasing, predict-output]

  - id: predict-lazy-take
    type: predict
    prompt: { en: 'Which output is produced when the terminal operation runs?', zh: '终结操作执行时会产生哪组输出？' }
    code: |
      fun main() {
          val values = listOf(1, 4, 2, 5)
          val pipeline = values.asSequence()
              .onEach { print("$it ") }
              .filter { it >= 4 }

          println(pipeline.take(1).toList())
      }
    lang: kotlin
    options:
      - { text: { en: '1 4 [4]', zh: '1 4 [4]' }, correct: true }
      - { text: { en: '1 4 2 5 [4]', zh: '1 4 2 5 [4]' }, correct: false }
      - { text: { en: '[4] with no numbers before it', zh: '只输出[4]，前面没有数字' }, correct: false }
      - { text: { en: '1 [4]', zh: '1 [4]' }, correct: false }
    explanation: { en: 'take(1) stops after the first filtered value. onEach observes 1 and 4, then toList prints the one-element result.', zh: 'take(1) 在取得首个过滤结果后停止。onEach会观察1和4，随后toList打印单元素结果。' }
    difficulty: intermediate
    tags: [sequence, lazy-evaluation, short-circuiting]

  - id: spotbug-duplicate-index
    title: { en: 'Spot the bug in the SKU index', zh: '找出SKU索引里的bug' }
    type: spotbug
    prompt: { en: 'This function must reject duplicate SKUs. Find the bug.', zh: '这个函数必须拒绝重复SKU。请找出错误。' }
    code: |
      data class Product(val sku: String, val name: String)

      fun indexProducts(products: List<Product>): Map<String, Product> {
          return products.associateBy { it.sku }
      }
    lang: kotlin
    issues:
      - line: 4
        kind: correctness
        note: { en: 'associateBy keeps the last product for a duplicate SKU, so it silently loses the earlier record instead of rejecting the input.', zh: 'associateBy遇到重复SKU时保留最后一个商品，会静默丢掉较早记录，而不是拒绝输入。' }
    explanation: { en: 'Check for an existing key during insertion or group by SKU and reject groups whose size is not one. The conflict policy must be explicit.', zh: '应在插入时检查旧键，或按SKU分组并拒绝大小不为1的分组。键冲突策略必须明确。' }
    difficulty: intermediate
    tags: [map, associateBy, duplicate-keys, code-review]

  - id: nullable-map-lookup
    type: mcq
    prompt: { en: 'How do you distinguish an absent key from a present key whose value is null?', zh: '如何区分键不存在与键存在但值为null？' }
    options:
      - { text: { en: 'Call map[key] twice.', zh: '调用两次map[key]。' }, correct: false }
      - { text: { en: 'Use map[key] together with containsKey(key).', zh: '同时使用map[key] 与containsKey(key)。' }, correct: true }
      - { text: { en: 'Convert the map to a list first.', zh: '先把映射转换为列表。' }, correct: false }
      - { text: { en: 'Use getValue(key), which returns null only for absence.', zh: '使用getValue(key)，它只会在键不存在时返回null。' }, correct: false }
    explanation: { en: 'Indexed lookup returns null in both cases when V is nullable. containsKey reports membership independently of the stored value.', zh: '当V可空时，索引查找会在两种情况下都返回null。containsKey不依赖存储值，可以单独报告键是否存在。' }
    difficulty: intermediate
    tags: [map, nullability, edge-case]

  - id: sequence-terminal-operation
    type: mcq
    prompt: { en: 'Which operation triggers evaluation and returns a non-Sequence result?', zh: '哪个操作会触发求值并返回非Sequence结果？' }
    options:
      - { text: { en: 'filter()', zh: 'filter()' }, correct: false }
      - { text: { en: 'map()', zh: 'map()' }, correct: false }
      - { text: { en: 'take()', zh: 'take()' }, correct: false }
      - { text: { en: 'toList()', zh: 'toList()' }, correct: true }
    explanation: { en: 'On Sequence, filter, map, and take are lazy intermediate operations. toList is terminal: it consumes the sequence and materializes a list.', zh: '对Sequence而言，filter、map和take都是惰性的中间操作。toList是终结操作，会消费序列并物化列表。' }
    difficulty: beginner
    tags: [sequence, terminal-operation, lazy-evaluation]

  - id: review-generated-active-index
    title: { en: 'Review generated active product index', zh: '审查生成的启用商品索引' }
    type: review
    prompt: { en: 'Review this generated collection code before it indexes a product catalog.', zh: '在这段生成的集合代码为商品目录建立索引前审查它。' }
    task: { en: 'Return an alphabetical index of at most two active products without mutating the input, and reject duplicate SKUs.', zh: '返回最多两个启用商品的按名称排序索引，不得修改输入，并且要拒绝重复SKU。' }
    code: |
      data class Product(
          val sku: String,
          val name: String,
          val active: Boolean,
      )

      fun activeIndex(products: MutableList<Product>): Map<String, Product> {
          val sorted = products
          sorted.sortBy { it.name }
          val selected = mutableListOf<Product>()

          for (index in sorted.indices) {
              val product = sorted.drop(index).first()
              if (!product.active) continue
              selected += product
              if (selected.size == 2) break
          }

          return selected.associateBy { it.sku }
      }
    lang: kotlin
    right: { en: 'The code uses domain names, excludes inactive products, stops after collecting the requested maximum of two, and returns a typed SKU index.', zh: '代码使用了领域化命名，会排除未启用商品，在收集到题目要求的最多两个商品后停止，并返回带类型的SKU索引。' }
    issues:
      - line: 9
        kind: correctness
        note: { en: 'sorted aliases products, so sortBy mutates the caller-owned input despite the task requiring a non-mutating result.', zh: 'sorted与products是别名，因此sortBy会修改调用方拥有的输入，违反不修改输入的要求。' }
      - line: 13
        kind: performance
        note: { en: 'drop(index) builds a suffix list on every iteration; direct iteration over sorted reads each product without repeated copying.', zh: 'drop(index) 每轮都会构造后缀列表；直接遍历sorted可以读取每个商品，避免反复复制。' }
      - line: 16
        kind: readability
        note: { en: 'The literal 2 hides the selection limit inside control flow; a named constant or parameter would expose the rule.', zh: '数字2把选择上限藏在控制流中；具名常量或参数可以明确表达这条规则。' }
      - line: 19
        kind: edge-case
        note: { en: 'associateBy silently overwrites an earlier selected product when two active products share a SKU instead of rejecting duplicates.', zh: '两个启用商品使用相同SKU时，associateBy会静默覆盖较早商品，而不是拒绝重复项。' }
    checklist:
      - { en: 'Trace every alias and confirm which collection, if any, may be mutated.', zh: '跟踪每个别名，确认哪些集合可以被修改。' }
      - { en: 'Exercise empty, all-inactive, duplicate-key, and over-limit inputs.', zh: '测试空输入、全部未启用、重复键和超过上限的输入。' }
      - { en: 'Inspect collection operations inside loops for repeated copying or traversal.', zh: '检查循环内的集合操作是否反复复制或遍历。' }
      - { en: 'State ordering, key-conflict, and limit policies in names or types.', zh: '通过名称或类型表达排序、键冲突和上限策略。' }
    explanation: { en: 'Create a sorted copy, iterate it directly, give the limit a name, and reject duplicate keys during index construction. Those changes preserve the useful filtering and result type while making ownership and conflicts explicit.', zh: '应创建排序副本并直接遍历，为上限命名，并在构建索引时拒绝重复键。这些修改保留了有效的过滤逻辑和结果类型，同时明确所有权与冲突处理。' }
    difficulty: advanced
    tags: [code-review, aliasing, sorting, duplicate-keys, performance]
