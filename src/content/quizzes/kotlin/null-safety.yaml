topic: kotlin/null-safety
items:
  - id: predict-elvis-laziness
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      fun main() {
          var fallbackCalls = 0
          fun fallback(): String {
              fallbackCalls += 1
              return "guest"
          }

          val present: String? = "Ada"
          val absent: String? = null

          println(present?.uppercase() ?: fallback())
          println(absent?.uppercase() ?: fallback())
          println(fallbackCalls)
      }
    lang: kotlin
    options:
      - text: { en: "ADA\nguest\n1", zh: "ADA\nguest\n1" }
        correct: true
      - text: { en: "ADA\nguest\n2", zh: "ADA\nguest\n2" }
        correct: false
      - text: { en: "Ada\nnull\n0", zh: "Ada\nnull\n0" }
        correct: false
      - text: { en: 'It fails because Elvis cannot call a local function.', zh: '编译失败，因为 Elvis 不能调用局部函数。' }
        correct: false
    explanation: { en: 'The safe call returns ADA for present, so its Elvis right side is skipped. Only absent evaluates fallback(), increasing the counter once.', zh: 'present 的安全调用返回 ADA，因此跳过 Elvis 右侧；只有 absent 会计算 fallback()，计数器只增加一次。' }
    difficulty: beginner
    tags: [safe-call, elvis, short-circuit]

  - id: nullable-collection-shape
    type: mcq
    prompt: { en: 'Which type allows both the list itself and each element to be null?', zh: '哪个类型同时允许列表本身和其中的每个元素为 null？' }
    options:
      - { text: { en: 'List<String>', zh: 'List<String>' }, correct: false }
      - { text: { en: 'List<String>?', zh: 'List<String>?' }, correct: false }
      - { text: { en: 'List<String?>', zh: 'List<String?>' }, correct: false }
      - { text: { en: 'List<String?>?', zh: 'List<String?>?' }, correct: true }
    explanation: { en: 'The inner question mark makes elements nullable, while the outer question mark makes the list reference nullable. The other forms permit at most one of those absences.', zh: '内层问号让元素可空，外层问号让列表引用可空；其他写法最多只允许其中一层缺失。' }
    difficulty: beginner
    tags: [nullable-type, collections, type-shape]

  - id: spotbug-changing-getter
    type: spotbug
    prompt: { en: 'The program should print the host length when one value is available. Find the unsafe assumption.', zh: '只要能读到一次主机名，程序就应输出其长度。请找出不安全的假设。' }
    code: |
      class FlakyConfig {
          private var reads = 0
          val host: String?
              get() {
                  reads += 1
                  return if (reads == 1) "db.local" else null
              }
      }

      fun main() {
          val config = FlakyConfig()
          if (config.host != null) {
              println(config.host!!.length)
          }
      }
    lang: kotlin
    issues:
      - line: 13
        kind: correctness
        note: { en: 'The check and assertion call the custom getter separately; the first read is non-null and the second is null, so !! throws.', zh: '检查和断言分别调用自定义 getter；第一次读取非空，第二次为 null，因此 !! 会抛出异常。' }
    explanation: { en: 'Read val host = config.host once, then check and use that local snapshot. A check on one property read proves nothing about a later read from a changing getter.', zh: '应先用 val host = config.host 读取一次，再检查并使用这个局部快照；一次属性读取的检查不能证明变化 getter 的后续读取。' }
    difficulty: intermediate
    tags: [smart-cast, property, not-null-assertion]

  - id: platform-type-boundary
    type: mcq
    prompt: { en: 'An unannotated Java method returns a platform String type. Which first step keeps the Kotlin boundary honest when the implementation is not trusted?', zh: '未注解的 Java 方法返回平台 String 类型。实现不可信时，哪项第一步能如实表达 Kotlin 边界？' }
    options:
      - { text: { en: 'Assign it to String? and validate or normalize it.', zh: '先赋给 String?，再校验或规范化。' }, correct: true }
      - { text: { en: 'Assign it to String and rely on compiler inference.', zh: '赋给 String，并依赖编译器推断。' }, correct: false }
      - { text: { en: 'Append !! so later calls can omit safe calls.', zh: '追加 !!，让后续调用省略安全调用。' }, correct: false }
      - { text: { en: 'Cast it with as String because platform types are always non-null.', zh: '用 as String 转换，因为平台类型一定非空。' }, correct: false }
    explanation: { en: 'A platform type is flexible, not a non-null guarantee. An explicit nullable local exposes the uncertainty so one adapter can handle it before returning domain data.', zh: '平台类型提供的是灵活性，不是非空保证；显式可空局部变量会暴露不确定性，让适配器在返回领域数据前集中处理。' }
    difficulty: intermediate
    tags: [platform-type, java-interop, boundary]

  - id: review-generated-customer-import
    type: review
    prompt: { en: 'Review this generated customer importer before it handles an external batch.', zh: '在这个生成的客户导入器处理外部批次前审查它。' }
    task: { en: 'Return one accepted or indexed rejected outcome per input, reject missing or blank IDs and malformed emails, and never expose access tokens.', zh: '为每条输入返回一个接受结果或带索引的拒绝结果，拒绝缺失或空白 ID 及格式错误的邮箱，并且绝不暴露访问令牌。' }
    code: |
      data class RawCustomer(
          val id: String?,
          val email: String?,
          val accessToken: String?,
      )

      data class Customer(val id: String, val email: String)

      fun importCustomers(rows: List<RawCustomer?>): List<Customer> =
          rows.mapNotNull { row ->
              val index = rows.indexOf(row)
              println("importing $index token=${row?.accessToken}")

              val id = row?.id!!.trim()
              val email = row.email
                  ?.trim()
                  ?.takeIf { it.contains("@") }
                  ?: return@mapNotNull null

              Customer(id, email.lowercase())
          }
    lang: kotlin
    right: { en: 'The generated code models raw fields as nullable, trims external text before constructing an immutable Customer, and keeps the access token out of the domain object.', zh: '生成代码把原始字段建模为可空值，在构造不可变 Customer 前清理外部文本，并且没有把访问令牌放进领域对象。' }
    issues:
      - line: 11
        kind: performance
        note: { en: 'indexOf performs a linear search for every row, making the batch quadratic and returning the first index for duplicate values; mapIndexed supplies the real index directly.', zh: 'indexOf 会为每行做线性搜索，使整个批次成为平方复杂度，而且重复值只会得到首次索引；mapIndexed 可以直接提供真实索引。' }
      - line: 12
        kind: security
        note: { en: 'The log writes the raw access token, exposing a credential to log storage and downstream observability systems.', zh: '日志写入原始访问令牌，会把凭据暴露给日志存储和下游可观测系统。' }
      - line: 14
        kind: correctness
        note: { en: 'row?.id!! throws when either the row or its ID is null, and it accepts a blank ID after trim instead of returning the required rejection outcome.', zh: 'row?.id!! 会在行或 ID 为空时抛出异常，而且清理后仍接受空白 ID，没有返回要求的拒绝结果。' }
      - line: 18
        kind: edge-case
        note: { en: 'mapNotNull silently drops a missing or malformed email, so output cardinality changes and no indexed rejection reason reaches the caller.', zh: 'mapNotNull 会静默丢弃缺失或格式错误的邮箱，导致输出数量变化，调用方也得不到带索引的拒绝原因。' }
    checklist:
      - { en: 'Pass null rows and missing, blank, whitespace-only, and duplicate IDs; assert one indexed outcome for each input.', zh: '传入空行以及缺失、空、纯空白和重复 ID，并断言每条输入都有一个带索引的结果。' }
      - { en: 'Exercise malformed and mixed-case emails and define normalization separately from validation.', zh: '测试格式错误和大小写混合的邮箱，并分别定义规范化与校验规则。' }
      - { en: 'Use a sentinel token and assert that no log, exception, or returned object contains it.', zh: '使用哨兵令牌，并断言日志、异常和返回对象都不包含它。' }
      - { en: 'Run a large batch with duplicates and verify index accuracy and linear traversal.', zh: '运行含重复值的大批次，验证索引准确性和线性遍历。' }
    explanation: { en: 'Use mapIndexed to create an accepted or rejected result for every row, validate each field without !!, and log only non-sensitive structured metadata. This preserves provenance, cardinality, and credentials.', zh: '应使用 mapIndexed 为每行创建接受或拒绝结果，在不用 !! 的前提下逐字段校验，并且只记录非敏感结构化元数据，从而保留来源、数量和凭据安全。' }
    difficulty: advanced
    tags: [code-review, null-safety, batch-import, java-boundary]
