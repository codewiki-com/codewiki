topic: kotlin/dsl
items:
  - id: predict-receiver-builder
    type: predict
    prompt: { en: 'What does this receiver-based builder print?', zh: '这个基于接收者的构建器会输出什么？' }
    code: |
      class LabelBuilder {
          var prefix: String = ""
          private val values = mutableListOf<String>()

          fun value(text: String) {
              values += text
          }

          fun build(): String = values.joinToString(",", "$prefix[", "]")
      }

      fun labels(block: LabelBuilder.() -> Unit): String =
          LabelBuilder().apply(block).build()

      fun main() {
          println(labels {
              prefix = "v"
              value("a")
              value("b")
          })
      }
    lang: kotlin
    options:
      - text: { en: 'v[a,b]', zh: 'v[a,b]' }
        correct: true
      - text: { en: '[v,a,b]', zh: '[v,a,b]' }
        correct: false
      - text: { en: 'LabelBuilder(prefix=v)', zh: 'LabelBuilder(prefix=v)' }
        correct: false
      - text: { en: 'It fails because prefix needs an explicit this.', zh: '编译失败，因为prefix前必须显式写this。' }
        correct: false
    explanation: { en: 'The lambda has a LabelBuilder receiver, so prefix and value resolve to that builder. apply returns the configured builder, and build joins its two stored values.', zh: 'lambda的接收者是LabelBuilder，因此prefix与value都解析到该构建器。apply返回配置后的构建器，build再连接其中保存的两个值。' }
    difficulty: beginner
    tags: [lambda-with-receiver, trailing-lambda, builder]

  - id: dsl-marker-outer-access
    type: mcq
    prompt: { en: 'Two nested receiver types carry the same DSL marker. How can the inner block access an outer receiver intentionally?', zh: '两个嵌套接收者类型带有同一个DSL标记。内层块怎样有意访问外层接收者？' }
    options:
      - { text: { en: 'Use a qualified receiver such as this@service', zh: '使用this@service这样的限定接收者' }, correct: true }
      - { text: { en: 'Remove the marker at runtime before the call', zh: '调用前在运行时移除标记' }, correct: false }
      - { text: { en: 'Cast the inner receiver to the outer type', zh: '把内层接收者转换为外层类型' }, correct: false }
      - { text: { en: 'It is impossible once @DslMarker is present', zh: '只要存在 @DslMarker就完全无法访问' }, correct: false }
    explanation: { en: 'A DSL marker blocks accidental implicit access to another receiver in the same DSL. It does not remove that object; a labeled this selects it explicitly.', zh: 'DSL标记阻止对同一DSL中其他接收者的意外隐式访问，并不会移除对象；带标签的this可以显式选择它。' }
    difficulty: intermediate
    tags: [dsl-marker, implicit-receiver, qualified-this]

  - id: spotbug-result-alias
    title: { en: 'Spot the bug in the menu snapshot', zh: '找出菜单快照里的bug' }
    type: spotbug
    prompt: { en: 'The built menu must remain a snapshot after its builder changes. Find the bug.', zh: '构建器变化后，已经构建的菜单必须保持为快照。请找出错误。' }
    code: |
      data class Menu(val items: List<String>)

      class MenuBuilder {
          private val items = mutableListOf<String>()
          fun item(name: String) { items += name }
          fun build(): Menu = Menu(items)
      }

      fun main() {
          val builder = MenuBuilder()
          builder.item("home")
          val menu = builder.build()
          builder.item("admin")
          println(menu.items)
      }
    lang: kotlin
    issues:
      - line: 6
        kind: correctness
        note: { en: 'build passes the builder-owned MutableList into Menu without copying it, so the read-only List view still observes later mutations.', zh: 'build没有复制构建器持有的MutableList就把它传给Menu，因此只读List视图仍会观察到之后的修改。' }
    explanation: { en: 'Return Menu(items.toList()) and do not expose the builder after construction. A read-only interface narrows operations but does not break an existing alias.', zh: '应返回Menu(items.toList())，并在构建后不再暴露构建器。只读接口会缩小可用操作，却不会切断已有别名。' }
    difficulty: intermediate
    tags: [result-boundary, aliasing, mutability]

  - id: staged-builder-guarantee
    type: mcq
    prompt: { en: 'What does a staged builder guarantee when only the final stage can produce the result?', zh: '只有最后阶段能产生结果时，分阶段构建器保证了什么？' }
    options:
      - { text: { en: 'Required call order is represented by the available methods and return types', zh: '必需调用顺序由可用方法和返回类型表达' }, correct: true }
      - { text: { en: 'Every string value is valid without runtime checks', zh: '所有字符串都有效，不再需要运行期检查' }, correct: false }
      - { text: { en: 'The builder allocates no intermediate objects', zh: '构建器不会分配任何中间对象' }, correct: false }
      - { text: { en: 'Existing call sites remain source-compatible after every stage change', zh: '修改任何阶段后，既有调用点都保持源码兼容' }, correct: false }
    explanation: { en: 'Each stage exposes only the next legal operations, so omitted or out-of-order fixed steps fail at compile time. Concrete value rules still require validation.', zh: '每个阶段只公开下一批合法操作，因此遗漏固定步骤或顺序错误会在编译期失败。具体值规则仍需要校验。' }
    difficulty: intermediate
    tags: [staged-builder, compile-time, api-design]

  - id: type-safety-versus-encoding
    type: mcq
    prompt: { en: 'A SQL DSL accepts a String and interpolates it into a query. What does Kotlin type checking prove?', zh: '某个SQL DSL接收String并把它插入查询。Kotlin类型检查证明了什么？' }
    options:
      - { text: { en: 'Only that the argument has an accepted Kotlin type, not that it is safely encoded', zh: '只能证明实参具有可接受的Kotlin类型，不能证明它已安全编码' }, correct: true }
      - { text: { en: 'The string cannot contain SQL metacharacters', zh: '字符串不可能包含SQL元字符' }, correct: false }
      - { text: { en: '@DslMarker parameterizes the query automatically', zh: '@DslMarker会自动参数化查询' }, correct: false }
      - { text: { en: 'A trailing lambda escapes all values before execution', zh: '尾随lambda会在执行前转义所有值' }, correct: false }
    explanation: { en: 'Host-language type safety and output encoding are separate boundaries. The DSL must use query parameters or a trusted SQL encoder for untrusted values.', zh: '宿主语言的类型安全与输出编码是两个独立边界。DSL必须对不可信值使用查询参数或可信SQL编码器。' }
    difficulty: intermediate
    tags: [security, sql, output-encoding]

  - id: review-generated-database-builder
    title: { en: 'Review generated database DSL', zh: '审查生成的数据库DSL' }
    type: review
    prompt: { en: 'Review this generated database DSL before it becomes a shared configuration API.', zh: '在这个生成的数据库DSL成为共享配置API前审查它。' }
    task: { en: 'Require a nonblank URL and positive pool size, produce an immutable snapshot of unique tags, and never disclose the password in logs.', zh: '要求URL非空白且连接池大小为正数，生成标签唯一的不可变快照，并且绝不在日志中泄露密码。' }
    code: |
      data class DatabaseConfig(
          val url: String,
          val password: String,
          val tags: MutableList<String>,
          val poolSize: Int,
      )

      @DslMarker
      annotation class DatabaseDsl

      @DatabaseDsl
      class DatabaseBuilder {
          var url: String = ""
          var password: String = ""
          var poolSize: Int = 0
          private val tags = mutableListOf<String>()
          fun tag(value: String) {
              if (!tags.contains(value)) tags += value
          }

          fun build(): DatabaseConfig {
              println("connecting to $url with $password")
              return DatabaseConfig(url, password, tags, poolSize)
          }
      }
    lang: kotlin
    right: { en: 'The code has a dedicated result type, keeps tag mutation behind a domain method, uses a DSL marker, and attempts to preserve tag uniqueness.', zh: '代码使用专门的结果类型，把标签修改收在领域方法之后，加入了DSL标记，并尝试保持标签唯一。' }
    issues:
      - line: 22
        kind: security
        note: { en: 'The log interpolates the raw password, exposing a credential during every successful build.', zh: '日志插入原始密码，每次成功构建都会泄露凭据。' }
      - line: 23
        kind: correctness
        note: { en: 'The result receives the builder-owned mutable list, so later builder changes mutate an already-built configuration.', zh: '结果拿到构建器持有的可变列表，因此之后修改构建器会改变已经构建的配置。' }
      - line: 21
        kind: edge-case
        note: { en: 'build accepts a blank URL and a zero or negative pool size even though the task rejects those states.', zh: 'build会接受空白URL以及零或负数连接池大小，但任务要求拒绝这些状态。' }
      - line: 18
        kind: performance
        note: { en: 'A linear contains scan for every insertion makes adding many distinct tags quadratic; an insertion-ordered set expresses uniqueness directly.', zh: '每次插入都线性扫描contains，添加大量不同标签会形成二次复杂度；保序集合能直接表达唯一性。' }
    checklist:
      - { en: 'Build with blank URLs and nonpositive pool sizes and assert precise failures.', zh: '使用空白URL与非正连接池大小构建，并断言准确失败。' }
      - { en: 'Add duplicate and numerous distinct tags, then check uniqueness and growth behavior.', zh: '添加重复标签和大量不同标签，再检查唯一性与增长行为。' }
      - { en: 'Mutate the builder after build and verify that the result remains unchanged.', zh: '构建后修改构建器，确认结果保持不变。' }
      - { en: 'Use a sentinel password and assert that no log or exception contains it.', zh: '使用哨兵密码，并断言日志与异常都不包含它。' }
    explanation: { en: 'Validate scalar fields before construction, store tags in a LinkedHashSet, and return tags.toList() through a List property. Remove password logging and log only allowlisted nonsecret fields.', zh: '应在构造前校验标量字段，用LinkedHashSet保存标签，并通过List属性返回tags.toList()。移除密码日志，只记录允许公开的非秘密字段。' }
    difficulty: advanced
    tags: [code-review, dsl-marker, validation, aliasing, security]
