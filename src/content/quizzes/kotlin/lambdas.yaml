topic: kotlin/lambdas
items:
  - id: predict-captured-sequence
    type: predict
    prompt: { en: 'What does this program print?', zh: '这个程序会输出什么？' }
    code: |
      fun sequence(): () -> Int {
          var next = 1
          return { next++ }
      }

      fun main() {
          val first = sequence()
          val alias = first
          val second = sequence()

          println(listOf(first(), alias(), second(), first()))
      }
    lang: kotlin
    options:
      - text: { en: '[1, 2, 1, 3]', zh: '[1, 2, 1, 3]' }
        correct: true
      - text: { en: '[1, 1, 1, 2]', zh: '[1, 1, 1, 2]' }
        correct: false
      - text: { en: '[1, 2, 3, 4]', zh: '[1, 2, 3, 4]' }
        correct: false
      - text: { en: 'It fails because a lambda cannot modify next.', zh: '编译失败，因为 lambda 不能修改 next。' }
        correct: false
    explanation: { en: 'first and alias invoke the same closure and share next, while second comes from another factory call with its own state.', zh: 'first 与 alias 调用同一个闭包并共享 next，second 则来自另一次工厂调用，拥有独立状态。' }
    difficulty: beginner
    tags: [closure, capture, state]

  - id: nullable-function-type
    type: mcq
    prompt: { en: 'Which type means “an optional function that accepts a String and returns an Int”?', zh: '哪个类型表示“可缺省的函数，它接收 String 并返回 Int”？' }
    options:
      - { text: { en: '((String) -> Int)?', zh: '((String) -> Int)?' }, correct: true }
      - { text: { en: '(String) -> Int?', zh: '(String) -> Int?' }, correct: false }
      - { text: { en: '(String?) -> Int', zh: '(String?) -> Int' }, correct: false }
      - { text: { en: '(() -> String) -> Int', zh: '(() -> String) -> Int' }, correct: false }
    explanation: { en: 'Parentheses make the function value itself nullable. A question mark after Int instead makes only the function result nullable.', zh: '外层括号让函数值本身可空；问号若只写在 Int 后，则只有函数结果可空。' }
    difficulty: beginner
    tags: [function-type, nullability]

  - id: predict-trailing-callback
    type: predict
    prompt: { en: 'Which lines are printed when the trailing lambda is passed?', zh: '传入尾随 lambda 后会输出哪些行？' }
    code: |
      fun load(
          onSuccess: () -> Unit = { println("default success") },
          onFailure: () -> Unit = { println("default failure") },
      ) {
          onSuccess()
          onFailure()
      }

      fun main() {
          load { println("custom") }
      }
    lang: kotlin
    options:
      - text: { en: 'default success, then custom', zh: '先输出 default success，再输出 custom' }
        correct: true
      - text: { en: 'custom, then default failure', zh: '先输出 custom，再输出 default failure' }
        correct: false
      - text: { en: 'custom only', zh: '只输出 custom' }
        correct: false
      - text: { en: 'The call is ambiguous.', zh: '调用存在歧义。' }
        correct: false
    explanation: { en: 'A trailing lambda binds the last parameter, onFailure. onSuccess therefore keeps its default implementation.', zh: '尾随 lambda 绑定最后一个形参 onFailure，因此 onSuccess 仍使用默认实现。' }
    difficulty: intermediate
    tags: [trailing-lambda, default-arguments, callbacks]

  - id: spotbug-loop-capture
    title: { en: 'Spot the bug in callback index capture', zh: '找出回调索引捕获里的 bug' }
    type: spotbug
    prompt: { en: 'Each callback should return the index from the iteration that created it. Find the bug.', zh: '每个回调都应返回创建它的那轮索引。请找出错误。' }
    code: |
      fun callbacks(): List<() -> Int> {
          val result = mutableListOf<() -> Int>()
          var index = 0
          while (index < 3) {
              result += { index }
              index++
          }
          return result
      }

      fun main() {
          println(callbacks().map { callback -> callback() })
      }
    lang: kotlin
    issues:
      - line: 5
        kind: correctness
        note: { en: 'Every lambda captures the same mutable index, so all callbacks read 3 after the loop instead of their creation-time values.', zh: '每个 lambda 都捕获同一个可变 index，因此循环结束后所有回调都读取 3，而不是各自创建时的值。' }
    explanation: { en: 'Create val current = index inside the loop and capture current. The immutable per-iteration value gives each callback the intended snapshot.', zh: '应在循环体内创建 val current = index 并捕获 current；每轮不可变值会给各回调提供预期快照。' }
    difficulty: intermediate
    tags: [closure, mutable-capture, callback]

  - id: review-generated-event-registry
    title: { en: 'Review generated event registry', zh: '审查生成的事件注册表' }
    type: review
    prompt: { en: 'Review this generated event registry before it is used in a concurrent service.', zh: '在这个生成的事件注册表用于并发服务前审查它。' }
    task: { en: 'Reject blank event names, support concurrent registration and emission, make high-volume unsubscription efficient, and isolate handler failures without logging payloads.', zh: '拒绝空白事件名，支持并发注册与发送，让高频注销保持高效，并隔离处理器失败且不记录载荷。' }
    code: |
      class EventRegistry {
          private val handlers =
              mutableMapOf<String, MutableList<(String) -> Unit>>()

          fun on(event: String, handler: (String) -> Unit): () -> Unit {
              val list = handlers.getOrPut(event) { mutableListOf() }
              list += handler
              return { list.remove(handler) }
          }

          fun emit(event: String, payload: String) {
              handlers[event]?.forEach { handler ->
                  try {
                      handler(payload)
                  } catch (error: Exception) {
                      println("handler failed for $payload: ${error.message}")
                  }
              }
          }
      }
    lang: kotlin
    right: { en: 'The registry keeps handler mutation private, uses a typed function parameter, returns an unsubscribe action, and attempts to isolate one failing handler from the rest.', zh: '注册表把处理器修改保持为私有操作，使用有类型的函数参数，返回注销操作，并尝试隔离单个失败处理器。' }
    issues:
      - line: 5
        kind: edge-case
        note: { en: 'on accepts blank event names even though the task requires rejecting them at registration.', zh: 'on 会接受空白事件名，但任务要求在注册时拒绝它们。' }
      - line: 6
        kind: correctness
        note: { en: 'MutableMap and MutableList are read and changed without synchronization, so concurrent registration, removal, and emission can race or fail during iteration.', zh: 'MutableMap 与 MutableList 的读写没有同步，并发注册、删除和发送会发生竞态，迭代期间还可能失败。' }
      - line: 8
        kind: performance
        note: { en: 'MutableList.remove scans linearly for the handler, making high-volume unsubscription cost grow with every event list.', zh: 'MutableList.remove 会线性扫描处理器，高频注销的成本会随事件列表增长。' }
      - line: 16
        kind: security
        note: { en: 'The failure log writes the raw payload and an uncontrolled exception message, which may disclose request or user data.', zh: '失败日志写入原始载荷和不受控的异常消息，可能泄露请求或用户数据。' }
    checklist:
      - { en: 'Register blank and whitespace-only names and assert precise rejection.', zh: '注册空字符串与纯空白名称，并断言它们被准确拒绝。' }
      - { en: 'Interleave registration, emission, and unsubscription from several threads under a deterministic stress test.', zh: '在确定性的压力测试中，从多个线程交错执行注册、发送与注销。' }
      - { en: 'Have a handler unsubscribe itself during emission and verify snapshot and ordering semantics.', zh: '让处理器在发送期间注销自身，并验证快照与顺序语义。' }
      - { en: 'Send a sentinel secret and assert that no log or exception output contains it.', zh: '发送哨兵秘密值，并断言任何日志或异常输出都不包含它。' }
    explanation: { en: 'Validate names before mutation, define a lock or concurrent snapshot strategy, and use token-keyed storage for efficient removal. Send structured failure metadata to an allowlisted sink without copying payloads into logs.', zh: '应在修改前校验名称，定义锁或并发快照策略，并使用按令牌索引的存储实现高效删除；只向允许的接收端发送结构化失败元数据，不把载荷复制到日志。' }
    difficulty: advanced
    tags: [code-review, callbacks, concurrency, logging]
