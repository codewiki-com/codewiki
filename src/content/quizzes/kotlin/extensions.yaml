topic: kotlin/extensions
items:
  - id: predict-static-extension-dispatch
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      open class Report
      class SalesReport : Report()

      fun Report.label(): String = "report"
      fun SalesReport.label(): String = "sales"

      fun printLabel(report: Report) {
          println(report.label())
      }

      fun main() {
          val report: SalesReport = SalesReport()
          println(report.label())
          printLabel(report)
      }
    lang: kotlin
    options:
      - text: { en: "sales\nsales", zh: "sales\nsales" }
        correct: false
      - text: { en: "sales\nreport", zh: "sales\nreport" }
        correct: true
      - text: { en: "report\nreport", zh: "report\nreport" }
        correct: false
      - text: { en: 'A compilation error because both extensions have the same name.', zh: '编译失败，因为两个扩展同名。' }
        correct: false
    explanation: { en: 'The first call has static receiver type SalesReport, while the function parameter has static type Report. Extension overloads do not dispatch from the runtime subtype.', zh: '第一次调用的接收者静态类型是 SalesReport，函数参数的静态类型则是 Report。扩展重载不会根据运行时子类型分派。' }
    difficulty: intermediate
    tags: [extension-function, static-dispatch, receiver-type]

  - id: predict-nullable-receiver-call
    type: predict
    prompt: { en: 'What does the direct call do differently from the safe call?', zh: '直接调用与安全调用的结果有什么不同？' }
    code: |
      fun String?.orLabel(): String = this ?: "missing"

      fun main() {
          val label: String? = null

          println(label.orLabel())
          println(label?.orLabel())
      }
    lang: kotlin
    options:
      - text: { en: "missing\nnull", zh: "missing\nnull" }
        correct: true
      - text: { en: "missing\nmissing", zh: "missing\nmissing" }
        correct: false
      - text: { en: "null\nnull", zh: "null\nnull" }
        correct: false
      - text: { en: 'The direct call fails because label is nullable.', zh: '直接调用失败，因为 label 可空。' }
        correct: false
    explanation: { en: 'The direct call enters an extension whose receiver is String?, so its fallback runs. The safe call skips the function body when label is null and produces null.', zh: '直接调用会进入接收者为 String? 的扩展，因此回退逻辑会执行。安全调用在 label 为 null 时跳过函数体，结果为 null。' }
    difficulty: intermediate
    tags: [nullable-receiver, safe-call, 'null']

  - id: member-versus-extension-resolution
    type: mcq
    prompt: { en: 'A type and an imported extension both define render() with compatible signatures. Which declaration does value.render() select?', zh: '类型与导入的扩展都定义了兼容签名的 render()。value.render() 会选择哪个声明？' }
    options:
      - { text: { en: 'The real member function', zh: '真实成员函数' }, correct: true }
      - { text: { en: 'The imported extension function', zh: '导入的扩展函数' }, correct: false }
      - { text: { en: 'Whichever declaration appears later in the file', zh: '文件中位置更靠后的声明' }, correct: false }
      - { text: { en: 'The choice is deferred to the runtime subtype', zh: '延迟到运行时根据子类型选择' }, correct: false }
    explanation: { en: 'An applicable member takes precedence over an extension with the same call shape. Extensions can overload a same-named member only when another signature is the applicable one.', zh: '适用成员会优先于调用形式相同的扩展。只有另一种签名适用时，扩展才能作为同名重载被选择。' }
    difficulty: beginner
    tags: [member-precedence, overload-resolution]

  - id: spotbug-extension-property-state
    title: { en: 'Spot the bug in the retryCount property', zh: '找出扩展属性里的 bug' }
    type: spotbug
    prompt: { en: 'The retryCount property must read and update the Session state. Find the bug.', zh: 'retryCount 属性必须读取并更新 Session 状态。请找出错误。' }
    code: |
      data class Session(var retries: Int)

      var Session.retryCount: Int
          get() = 0
          set(value) {
              println("requested=$value")
          }

      fun main() {
          val session = Session(retries = 1)
          session.retryCount = 3
          println(session.retryCount)
          println(session.retries)
      }
    lang: kotlin
    issues:
      - line: 4
        kind: correctness
        note: { en: 'The accessors neither read nor update retries; an extension property has no backing field, so retryCount always reads as zero and assignment only prints.', zh: '访问器既不读取也不更新 retries；扩展属性没有后备字段，因此 retryCount 始终读出零，赋值只会输出文本。' }
    explanation: { en: 'Use get() = retries and set(value) { retries = value } if this alias is genuinely useful. New state cannot live in an extension property.', zh: '如果这个别名确有价值，应使用 get() = retries 和 set(value) { retries = value }。新状态不能存放在扩展属性中。' }
    difficulty: beginner
    tags: [extension-property, backing-field, state]

  - id: review-generated-account-label
    title: { en: 'Review generated account label extension', zh: '审查生成的账户标签扩展' }
    type: review
    prompt: { en: 'Review this generated account-label extension before it is shared across the application.', zh: '在这个生成的账户标签扩展用于整个应用前审查它。' }
    task: { en: 'Return a pure, nonblank safe label for a nullable account, default to anonymous, avoid member-name conflicts, and never expose the token.', zh: '为可空账户返回纯函数式、非空白的安全标签，默认值为 anonymous，避免成员名称冲突，并且绝不暴露令牌。' }
    code: |
      data class Account(
          val name: String?,
          val token: String,
      ) {
          fun displayName(): String = name ?: "anonymous"
      }

      private val labelCache = mutableMapOf<Account, String>()

      fun Account.displayName(): String = "Account($name)"

      val Account?.safeLabel: String
          get() {
              if (this == null) return "anonymous"
              return labelCache.getOrPut(this) {
                  if (name == null) toString() else name.trim()
              }
          }

      fun main() {
          val account = Account(null, "token-123")
          println(account.safeLabel)
      }
    lang: kotlin
    right: { en: 'The code accepts a nullable receiver, handles a missing account explicitly, uses domain names, and trims a present name.', zh: '代码接受可空接收者，显式处理缺失账户，使用领域化名称，并修剪已有姓名。' }
    issues:
      - line: 10
        kind: correctness
        note: { en: 'Account.displayName() is shadowed by the real member and can never be selected through ordinary member-call syntax.', zh: 'Account.displayName() 被真实成员遮蔽，无法通过普通成员调用语法选中。' }
      - line: 16
        kind: security
        note: { en: 'For a null name, generated data-class toString() includes token and returns it as part of the label.', zh: '姓名为 null 时，数据类生成的 toString() 会包含 token，并把它作为标签的一部分返回。' }
      - line: 16
        kind: edge-case
        note: { en: 'A whitespace-only name is trimmed to an empty string instead of falling back to anonymous as required.', zh: '只有空白的姓名会被修剪为空字符串，不会按要求回退到 anonymous。' }
      - line: 15
        kind: performance
        note: { en: 'The global cache retains every Account key indefinitely and adds mutable shared state to a cheap-looking property.', zh: '全局缓存会无限期保留每个 Account 键，并在看似便宜的属性背后加入可变共享状态。' }
    checklist:
      - { en: 'Resolve every extension call against real members and imported candidates.', zh: '根据真实成员和导入候选解析每个扩展调用。' }
      - { en: 'Test null, blank, whitespace-only, and ordinary names.', zh: '测试 null、空字符串、纯空白和普通姓名。' }
      - { en: 'Use a sentinel token and assert that results, logs, and exceptions never contain it.', zh: '使用哨兵令牌，并断言结果、日志和异常都不包含它。' }
      - { en: 'Inspect extension-property getters for caches, I/O, allocation, and hidden mutation.', zh: '检查扩展属性 getter 中的缓存、I/O、分配和隐藏修改。' }
    explanation: { en: 'Remove the shadowed extension and global cache, then implement a nullable-receiver function that trims name and uses takeIf { it.isNotEmpty() } ?: "anonymous". Build the label only from allowlisted fields.', zh: '应删除被遮蔽的扩展和全局缓存，再实现可空接收者函数：修剪 name，并使用 takeIf { it.isNotEmpty() } ?: "anonymous"。标签只能由允许公开的字段构造。' }
    difficulty: advanced
    tags: [code-review, nullable-receiver, member-precedence, security]
