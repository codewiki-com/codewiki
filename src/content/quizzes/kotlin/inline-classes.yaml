topic: kotlin/inline-classes
items:
  - id: predict-alias-and-value-class
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      typealias RawUserId = Long

      @JvmInline
      value class UserId(val value: Long)

      fun main() {
          val alias: RawUserId = 7L
          val id = UserId(7L)

          println(alias == 7L)
          println(id == UserId(alias))
      }
    lang: kotlin
    options:
      - text: { en: "true\ntrue", zh: "true\ntrue" }
        correct: true
      - text: { en: "true\nfalse", zh: "true\nfalse" }
        correct: false
      - text: { en: "false\ntrue", zh: "false\ntrue" }
        correct: false
      - text: { en: 'The program fails because UserId and Long cannot be compared anywhere.', zh: '程序无法编译，因为UserId与Long在任何位置都不能比较。' }
        correct: false
    explanation: { en: 'The type alias is assignment-compatible with Long, while two UserId values compare by their underlying value. UserId itself remains a distinct type from Long.', zh: '类型别名与Long赋值兼容，两个UserId值则根据底层值比较；UserId本身仍是不同于Long的类型。' }
    difficulty: beginner
    tags: [value-class, type-alias, equality]

  - id: boxing-boundaries
    type: mcq
    prompt: { en: 'Which use site normally requires a boxed representation for @JvmInline value class UserId(val value: Long)?', zh: '对于 @JvmInline value class UserId(val value: Long)，哪个使用位置通常需要装箱表示？' }
    options:
      - { text: { en: 'Passing UserId directly to a UserId parameter', zh: '把UserId直接传给UserId参数' }, correct: false }
      - { text: { en: 'Reading value from a local UserId', zh: '从局部UserId读取value' }, correct: false }
      - { text: { en: 'Passing UserId as an implemented interface type', zh: '把UserId作为其实现的接口类型传递' }, correct: true }
      - { text: { en: 'Calling a member directly on UserId', zh: '直接调用UserId的成员' }, correct: false }
    explanation: { en: 'An interface-typed parameter needs an object that implements the interface, so the value class uses its wrapper. Direct value-class uses can normally use the underlying Long representation.', zh: '接口类型参数需要一个实现该接口的对象，因此值类会使用包装表示。直接使用值类时通常可以采用底层Long表示。' }
    difficulty: intermediate
    tags: [boxing, interface, representation]

  - id: spotbug-mutable-underlying-key
    title: { en: 'Spot the bug in the value-class map key', zh: '找出值类映射键里的bug' }
    type: spotbug
    prompt: { en: 'This value-class key must remain retrievable after insertion. Find the bug.', zh: '这个值类键插入后必须一直可以查到。请找出错误。' }
    code: |
      @JvmInline
      value class Labels(val values: MutableList<String>)

      fun main() {
          val labels = Labels(mutableListOf("paid"))
          val counts = mutableMapOf(labels to 1)

          labels.values += "priority"
          println(counts[labels])
      }
    lang: kotlin
    issues:
      - line: 8
        kind: correctness
        note: { en: 'Mutating the underlying list changes the value class hash after insertion, so the map can search a different bucket and fail to find the key.', zh: '插入后修改底层列表会改变值类的哈希，映射可能转而查找另一个存储桶，因而找不到该键。' }
    explanation: { en: 'A val fixes the list reference, not its contents. Use an underlying value with stable equality and hashing, and copy mutable input at the construction boundary when aliases may remain.', zh: 'val只固定列表引用，不固定其内容。应使用相等性与哈希稳定的底层值；可变输入可能仍有别名时，应在构造边界复制。' }
    difficulty: intermediate
    tags: [mutable-key, hash-map, equality]

  - id: java-entry-point
    type: mcq
    prompt: { en: 'What is the dependable way to publish a Java-callable function whose Kotlin API accepts an inline value class?', zh: '要发布一个可从Java调用、而Kotlin API接受内联值类的函数，哪种做法可靠？' }
    options:
      - { text: { en: 'Call the generated box-impl method from Java source.', zh: '在Java源码中调用生成的box-impl方法。' }, correct: false }
      - { text: { en: 'Depend on the mangled Kotlin method name never changing.', zh: '依赖修饰后的Kotlin方法名永不改变。' }, correct: false }
      - { text: { en: 'Expose an explicit @JvmName bridge, or deliberately opt in to @JvmExposeBoxed and verify the artifact.', zh: '公开明确的 @JvmName桥接，或有意选择加入 @JvmExposeBoxed并验证产物。' }, correct: true }
      - { text: { en: 'Replace the value class with a type alias only for Java callers.', zh: '只为Java调用方把值类替换成类型别名。' }, correct: false }
    explanation: { en: 'Synthetic helper names are backend details and are not a Java source contract. A named underlying-value bridge is stable and small; boxed exposure is experimental and should be verified as part of the ABI.', zh: '合成辅助方法名属于后端细节，不是Java源码契约。采用底层值的命名桥接稳定且范围小；装箱暴露仍是实验性功能，应作为ABI的一部分验证。' }
    difficulty: advanced
    tags: [java-interop, jvm-name, jvm-expose-boxed]

  - id: review-generated-api-tokens
    title: { en: 'Review generated API token wrapper', zh: '审查生成的API令牌包装器' }
    type: review
    prompt: { en: 'Review this generated token wrapper and allowlist check before it reaches an authentication boundary.', zh: '在这段生成的令牌包装与允许列表检查进入认证边界前审查它。' }
    task: { en: 'Preserve missing inputs as null, accept only trimmed tokens beginning with tok_, check the allowlist, and never disclose a raw token.', zh: '把缺失输入保留为null，只接受修剪后以tok_ 开头的令牌，检查允许列表，并且绝不泄露原始令牌。' }
    code: |
      @JvmInline
      value class ApiToken(val value: String)

      fun <T> audit(value: T) {
          println("token=$value")
      }

      fun parseTokens(raw: List<String?>): List<ApiToken?> =
          raw.map { candidate ->
              if (candidate == null) null
              else ApiToken(candidate.trim())
          }

      fun isAllowed(tokens: List<ApiToken?>, expected: ApiToken): Boolean {
          audit(expected)
          return tokens.map { it?.value }.contains(expected.value)
      }
    lang: kotlin
    right: { en: 'The code introduces a domain-specific token type, preserves null entries explicitly, trims present inputs, and keeps parsing separate from the allowlist operation.', zh: '代码引入了领域明确的令牌类型，显式保留null项，修剪已有输入，并把解析与允许列表操作分开。' }
    issues:
      - line: 2
        kind: correctness
        note: { en: 'The public constructor lets any caller create a token that never passed the required prefix validation.', zh: '公开构造函数允许任何调用方创建从未经过前缀校验的令牌。' }
      - line: 5
        kind: security
        note: { en: 'String interpolation boxes ApiToken and uses its default toString(), which includes the raw token value in the audit output.', zh: '字符串插值会装箱ApiToken并使用其默认toString()，从而在审计输出中包含原始令牌值。' }
      - line: 11
        kind: edge-case
        note: { en: 'Trimming alone accepts an empty string and values without the required tok_ prefix.', zh: '只做修剪仍会接受空字符串，以及不带必需tok_ 前缀的值。' }
      - line: 16
        kind: performance
        note: { en: 'Mapping every token value allocates an intermediate list even though any can stop at the first match.', zh: '映射每个令牌值会分配中间列表，而any可以在第一次匹配时停止。' }
    checklist:
      - { en: 'Enumerate every constructor, factory, deserializer, and Java entry point.', zh: '枚举每个构造函数、工厂、反序列化器和Java入口。' }
      - { en: 'Test null, blank, whitespace-only, wrong-prefix, and valid token inputs.', zh: '测试null、空字符串、纯空白、错误前缀和合法令牌输入。' }
      - { en: 'Search logs, exceptions, and serialized output for a sentinel raw token.', zh: '在日志、异常和序列化输出中搜索哨兵原始令牌。' }
      - { en: 'Inspect collection operations for temporary allocations and early-exit alternatives.', zh: '检查集合操作中的临时分配和可提前结束的替代方案。' }
    explanation: { en: 'Make the constructor private, validate and normalize in one factory, remove raw-value logging, and use tokens.any { it == expected }. This preserves the useful type boundary while satisfying the input and secrecy contracts.', zh: '应把构造函数设为私有，在同一工厂中完成校验与规范化，移除原始值日志，并使用tokens.any { it == expected }。这样既保留有效的类型边界，也满足输入与保密契约。' }
    difficulty: advanced
    tags: [code-review, invariant, security, boxing, collections]
