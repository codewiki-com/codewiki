topic: rust/refcell-cell
items:
  - id: predict-cell-replace
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      use std::cell::Cell;

      fn main() {
          let phase = Cell::new(String::from("queued"));
          let old = phase.replace(String::from("running"));
          println!("{old} -> {}", phase.into_inner());
      }
    lang: rust
    options:
      - { text: { en: 'queued -> running', zh: 'queued -> running' }, correct: true }
      - { text: { en: 'running -> queued', zh: 'running -> queued' }, correct: false }
      - { text: { en: 'It fails because String is not Copy.', zh: '编译失败，因为 String 不是 Copy。' }, correct: false }
      - { text: { en: 'It panics because replace needs a mutable reference.', zh: '程序 panic，因为 replace 需要可变引用。' }, correct: false }
    explanation: { en: 'Cell can store a non-Copy String. replace moves out the old value and installs the new one through a shared Cell reference.', zh: 'Cell 可以保存非 Copy 的 String。replace 通过 Cell 的共享引用移出旧值并放入新值。' }
    difficulty: beginner
    tags: [cell, replace, predict-output]

  - id: predict-temporary-guard
    type: predict
    prompt: { en: 'Does this program compile, and what does it print?', zh: '这段程序能否编译？它会输出什么？' }
    code: |
      use std::cell::RefCell;

      fn main() {
          let values = RefCell::new(vec![10, 20]);
          let first = values.borrow()[0];
          values.borrow_mut().push(30);
          println!("{first}: {:?}", values.borrow());
      }
    lang: rust
    options:
      - { text: { en: '10: [10, 20, 30]', zh: '10: [10, 20, 30]' }, correct: true }
      - { text: { en: 'It panics because the first borrow lasts to the closing brace.', zh: '程序 panic，因为第一次借用持续到右花括号。' }, correct: false }
      - { text: { en: '30: [10, 20, 30]', zh: '30: [10, 20, 30]' }, correct: false }
      - { text: { en: 'It fails because RefCell cannot contain Vec.', zh: '编译失败，因为 RefCell 不能保存 Vec。' }, correct: false }
    explanation: { en: 'Indexing copies the i32 into first, and the temporary Ref guard drops at the end of that statement. The later exclusive borrow therefore succeeds.', zh: '索引操作把 i32 复制到 first，临时 Ref 守卫在该语句末尾销毁，因此后续独占借用可以成功。' }
    difficulty: intermediate
    tags: [refcell, guard-scope, predict-output]

  - id: choose-cell-non-copy
    type: mcq
    prompt: { en: 'Which statement about Cell<String> is correct?', zh: '关于 Cell<String>，哪项说法正确？' }
    options:
      - { text: { en: 'It is valid, and replace can move out the old String while installing a new one.', zh: '它是合法类型，replace 可以在放入新 String 时移出旧 String。' }, correct: true }
      - { text: { en: 'It is invalid because every Cell value must implement Copy.', zh: '它是非法类型，因为 Cell 中的值都必须实现 Copy。' }, correct: false }
      - { text: { en: 'get returns &String and keeps a runtime shared borrow active.', zh: 'get 返回 &String，并保持一个运行时共享借用。' }, correct: false }
      - { text: { en: 'It is Sync because Cell never returns references to its value.', zh: '它实现 Sync，因为 Cell 不返回内部值的引用。' }, correct: false }
    explanation: { en: 'Only operations such as get add a Copy bound. Cell itself accepts non-Copy values and offers whole-value operations such as set, replace, take, and into_inner.', zh: '只有 get 等具体操作附加 Copy 约束。Cell 本身可以保存非 Copy 值，并提供 set、replace、take 与 into_inner 等整体值操作。' }
    difficulty: intermediate
    tags: [cell, copy, api-contract]

  - id: spotbug-reentrant-registry
    title: { en: 'Spot the bug in the callback registry', zh: '找出回调注册表里的 bug' }
    type: spotbug
    prompt: { en: 'Find why a callback that subscribes another callback can panic.', zh: '找出回调在订阅另一个回调时可能 panic 的原因。' }
    code: |
      use std::cell::RefCell;
      use std::rc::Rc;

      struct Registry {
          callbacks: RefCell<Vec<Rc<dyn Fn(&Registry)>>>,
      }

      impl Registry {
          fn subscribe(&self, callback: Rc<dyn Fn(&Registry)>) {
              self.callbacks.borrow_mut().push(callback);
          }

          fn notify(&self) {
              for callback in self.callbacks.borrow().iter() {
                  callback(self);
              }
          }
      }
    lang: rust
    issues:
      - line: 14
        lines: 2
        kind: correctness
        note: { en: 'The shared guard created for iteration remains live while each callback runs, so a callback entering subscribe conflicts with it and borrow_mut panics.', zh: '迭代创建的共享守卫在每个回调运行时仍然存活，因此回调进入 subscribe 后会与它冲突，并使 borrow_mut panic。' }
    explanation: { en: 'Clone a snapshot of Rc handles, let the Ref guard drop, and then invoke the callbacks. Define whether subscriptions made during notification apply now or on the next notification.', zh: '应克隆一份 Rc 句柄快照，先让 Ref 守卫销毁，再调用回调；同时明确通知期间新增的订阅从本次还是下次通知生效。' }
    difficulty: advanced
    tags: [refcell, reentrancy, borrow-conflict]

  - id: review-generated-event-bus
    type: review
    title: { en: 'Review a generated event bus', zh: '审查生成的事件总线' }
    prompt: { en: 'Review this generated single-threaded event bus against the stated contract.', zh: '根据给定契约审查这段生成的单线程事件总线。' }
    task: { en: 'Keep subscriber names unique, let callbacks subscribe safely, apply changes on the next publication, clone only cheap handles for a snapshot, and produce no output.', zh: '保持订阅者名称唯一，允许回调安全订阅，新变化从下一次发布生效，快照只克隆廉价句柄，并且不产生输出。' }
    code: |
      use std::cell::RefCell;
      use std::rc::Rc;
      #[derive(Clone)]
      struct Handler {
          name: String,
          run: Rc<dyn Fn(&Bus)>,
      }
      struct Bus { handlers: RefCell<Vec<Handler>> }
      impl Bus {
          fn subscribe(&self, handler: Handler) -> bool {
              self.handlers.borrow_mut().push(handler);
              true
          }
          fn publish(&self) {
              let snapshot = self.handlers.borrow().clone();
              let _exclusive = self.handlers.borrow_mut();
              for handler in snapshot {
                  (handler.run)(self);
              }
              println!("published");
          }
      }
    lang: rust
    right: { en: 'The code confines mutation behind RefCell, gives subscribe a result channel, and stores each callback in Rc rather than requiring the closure itself to be cloned.', zh: '代码把修改限制在 RefCell 内，让 subscribe 通过返回值报告结果，并把回调存进 Rc，而不是要求闭包本身可克隆。' }
    issues:
      - line: 11
        kind: edge-case
        note: { en: 'subscribe never checks name, so duplicate subscriber names violate the uniqueness contract while it still returns true.', zh: 'subscribe 从不检查 name，因此重复订阅者名称会违反唯一性契约，但函数仍返回 true。' }
      - line: 15
        kind: performance
        note: { en: 'Cloning Vec<Handler> clones every subscriber name String; store Rc<Handler> and clone only those handles for the snapshot.', zh: '克隆 Vec<Handler> 会克隆每个订阅者名称的 String；应存储 Rc<Handler>，让快照只克隆这些句柄。' }
      - line: 16
        kind: correctness
        note: { en: 'The exclusive guard stays live during callbacks, so any callback that calls subscribe reaches a conflicting borrow_mut and panics.', zh: '独占守卫在回调期间一直存活，因此任何调用 subscribe 的回调都会遇到冲突的 borrow_mut 并 panic。' }
      - line: 20
        kind: readability
        note: { en: 'publish writes an unsolicited status line even though the event-bus contract requires no output and leaves logging to callers.', zh: 'publish 擅自输出状态行，违反事件总线不得输出、由调用方决定日志策略的契约。' }
    checklist:
      - { en: 'Test duplicate names before and after a callback adds a subscriber.', zh: '测试回调添加订阅者前后的重复名称。' }
      - { en: 'Mark the lifetime of every Ref and RefMut across callback calls.', zh: '标出回调调用期间每个 Ref 与 RefMut 的存活范围。' }
      - { en: 'Check what each snapshot clone allocates or shares.', zh: '检查每次快照克隆会分配或共享什么。' }
      - { en: 'Compare output and visibility timing with the event-bus contract.', zh: '根据事件总线契约检查输出与可见时机。' }
    explanation: { en: 'Store Rc<Handler>, reject a duplicate name while one short mutable guard is live, clone the Rc list under a shared guard, drop that guard, and then call the snapshot without printing.', zh: '应存储 Rc<Handler>，在一个短可变守卫中拒绝重复名称，再于共享守卫下克隆 Rc 列表；销毁守卫后调用快照，并删除输出。' }
    difficulty: advanced
    minutes: 8
    tags: [code-review, refcell, reentrancy, api-contract]
