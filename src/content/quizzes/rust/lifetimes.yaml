topic: rust/lifetimes
items:
  - id: predict-nll-last-use
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      fn main() {
          let mut values = vec![10, 20];
          let first = &values[0];
          println!("first: {first}");
          values.push(30);
          println!("all: {values:?}");
      }
    lang: rust
    options:
      - { text: { en: "first: 10\nall: [10, 20, 30]", zh: "first: 10\nall: [10, 20, 30]" }, correct: true }
      - { text: { en: 'It fails because first remains in lexical scope during push.', zh: '编译失败，因为执行push时first仍在词法作用域中。' }, correct: false }
      - { text: { en: 'It panics if push reallocates the vector.', zh: '如果push重新分配向量，程序就会panic。' }, correct: false }
      - { text: { en: "first: 30\nall: [10, 20, 30]", zh: "first: 30\nall: [10, 20, 30]" }, correct: false }
    explanation: { en: 'The last use of first occurs before push, so NLL ends the shared borrow before the mutable borrow begins. The owner remains valid throughout.', zh: 'first的最后一次使用发生在push之前，因此NLL会在可变借用开始前结束共享借用；所有者始终有效。' }
    difficulty: beginner
    tags: [nll, borrow-region, predict-output]

  - id: common-lifetime-contract
    type: mcq
    prompt: { en: "What does fn choose<'a>(x: &'a str, y: &'a str) -> &'a str mean?", zh: "fn choose<'a>(x: &'a str, y: &'a str) -> &'a str表达什么？" }
    options:
      - { text: { en: 'Both inputs must be valid for a caller-chosen region in which the result is used.', zh: '两个输入必须在调用方选择、用于结果的区域内都有效。' }, correct: true }
      - { text: { en: 'Both owners must be created and destroyed in the same lexical block.', zh: '两个所有者必须在同一词法代码块内创建并销毁。' }, correct: false }
      - { text: { en: 'The annotation extends the shorter owner to match the longer one.', zh: '标注会延长较短所有者，使它与较长所有者一致。' }, correct: false }
      - { text: { en: 'The result is guaranteed to come from x.', zh: '结果保证来自x。' }, correct: false }
    explanation: { en: 'The repeated lifetime names establish a common validity relationship and permit returning either input. They neither equalize owner scopes nor extend data.', zh: '重复的生命周期名称建立共同有效关系，并允许返回任一输入；它不会统一所有者作用域，也不会延长数据寿命。' }
    difficulty: intermediate
    tags: [lifetime-parameter, api-contract, common-region]

  - id: spotbug-return-local
    title: { en: 'Spot the bug in the local reference', zh: '找出局部引用里的bug' }
    type: spotbug
    prompt: { en: 'Find why the generic lifetime does not make this return valid.', zh: '找出为什么泛型生命周期不能让这个返回值合法。' }
    code: |
      fn status_text<'a>() -> &'a str {
          let status = String::from("ready");
          status.as_str()
      }
    lang: rust
    issues:
      - line: 3
        kind: correctness
        note: { en: 'The result points into status, which is destroyed at function exit; an unconstrained caller-chosen lifetime cannot be supplied by a local owner.', zh: '结果指向status内部，而它会在函数退出时销毁；局部所有者无法满足调用方选择的无约束生命周期。' }
    explanation: { en: 'Return String when the function creates the text, or return a literal directly when the value is genuinely static. An annotation cannot extend the local owner.', zh: '函数创建文本时应返回String；值确实是静态数据时可直接返回字面量。标注不能延长局部所有者的寿命。' }
    difficulty: beginner
    tags: [dangling-reference, owned-return, compiler-error]

  - id: higher-ranked-choice
    type: mcq
    prompt: { en: 'When is a for-lifetime higher-ranked bound appropriate?', zh: '什么时候适合使用for生命周期高阶约束？' }
    options:
      - { text: { en: 'When the callee must choose a fresh input lifetime for each callback invocation', zh: '被调用方必须为每次回调调用选择新的输入生命周期时' }, correct: true }
      - { text: { en: 'When a local reference must be converted into a static reference', zh: '需要把局部引用转换成静态引用时' }, correct: false }
      - { text: { en: 'When all callback calls must share one lifetime chosen by the outer caller', zh: '所有回调调用必须共享外层调用方选择的同一生命周期时' }, correct: false }
      - { text: { en: 'When a callback should run exactly once', zh: '回调应恰好执行一次时' }, correct: false }
    explanation: { en: "A bound such as for<'a> Fn(&'a str) -> &'a str quantifies over every suitable lifetime so each inner call may borrow its own input.", zh: "形如for<'a> Fn(&'a str) -> &'a str的约束会量化每个合适生命周期，因此每次内部调用都能借用自己的输入。" }
    difficulty: advanced
    tags: [hrtb, callback, generic-bound]

  - id: review-generated-record-view
    title: { en: 'Review generated record view', zh: '审查生成的记录视图' }
    type: review
    prompt: { en: 'Review this generated record lookup helper.', zh: '审查这个生成的记录查找辅助函数。' }
    task: { en: 'Find a key in semicolon-separated fields, return an optional zero-copy view into record, permit temporary key and delimiter arguments, trim Unicode whitespace, allocate nothing, and produce no output.', zh: '在分号分隔的字段中查找键，返回指向record的可选零复制视图；允许临时key与delimiter参数；去除Unicode空白；不得分配或输出。' }
    code: |
      fn lookup_value<'a>(
          record: &'a str,
          key: &'a str,
          delimiter: &'a str,
      ) -> &'a str {
          println!("record={record}");
          let owned = record.to_string();

          for field in owned.split(';') {
              if let Some((candidate, value)) = field.split_once(delimiter) {
                  if candidate.trim_ascii() == key {
                      return value.trim_ascii();
                  }
              }
          }

          "missing"
      }
    lang: rust
    right: { en: 'The generated code uses split_once for the key-value boundary and scans fields without constructing a separate collection.', zh: '生成代码使用split_once定位键值边界，并且没有先构造额外集合再扫描字段。' }
    issues:
      - line: 3
        kind: readability
        note: { en: 'Giving key and delimiter the result lifetime hides that only record can supply returned data and needlessly rejects temporary arguments.', zh: '让key与delimiter使用结果生命周期，掩盖了只有record能提供返回数据的事实，还会无谓地拒绝临时参数。' }
      - line: 6
        kind: security
        note: { en: 'Printing the complete record violates the no-output contract and may expose credentials or other sensitive values.', zh: '打印完整record违反不得输出的契约，还可能暴露凭据或其他敏感值。' }
      - line: 7
        kind: performance
        note: { en: 'to_string allocates and copies the full record even though every operation can use the borrowed input directly.', zh: 'to_string会分配并复制完整记录，而所有操作都能直接使用借用输入。' }
      - line: 11
        kind: edge-case
        note: { en: 'trim_ascii ignores non-ASCII Unicode whitespace required by the task; trim should be used for both matching and the result.', zh: 'trim_ascii会忽略任务要求处理的非ASCII Unicode空白；匹配与返回结果都应使用trim。' }
      - line: 12
        kind: correctness
        note: { en: 'The returned slice can point into the local owned String, which is destroyed at function exit; the missing case also needs Option rather than a sentinel.', zh: '返回切片可能指向局部owned String，而它会在函数退出时销毁；缺失情况还应使用Option，而不是哨兵值。' }
    checklist:
      - { en: 'Trace the returned slice to record and keep auxiliary argument lifetimes independent.', zh: '把返回切片追溯到record，并保持辅助参数生命周期独立。' }
      - { en: 'Test missing keys, empty values, and non-ASCII Unicode whitespace.', zh: '测试缺失键、空值与非ASCII Unicode空白。' }
      - { en: 'Inspect the function for allocations and accidental logging of input.', zh: '检查函数是否分配内存或意外记录输入。' }
      - { en: 'Compile a call that drops temporary key and delimiter values before using the result.', zh: '编译一个先销毁临时key与delimiter、再使用结果的调用。' }
    explanation: { en: 'Operate directly on record, return Option<&str>, give auxiliary references independent lifetimes, and use trim for Unicode whitespace. Remove the copy and logging.', zh: '应直接处理record，返回Option<&str>，让辅助引用使用独立生命周期，并用trim处理Unicode空白；同时删除复制和日志。' }
    difficulty: advanced
    tags: [code-review, lifetime-contract, borrowed-return, unicode, allocation]
