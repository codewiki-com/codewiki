topic: rust/iterators
items:
  - id: predict-borrowed-and-mutable-iteration
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      fn main() {
          let mut values = vec![1, 2, 3];
          let total: i32 = values.iter().sum();
          values.iter_mut().for_each(|value| *value *= 10);

          println!("{total}");
          println!("{values:?}");
      }
    lang: rust
    options:
      - { text: { en: "6\n[10, 20, 30]", zh: "6\n[10, 20, 30]" }, correct: true }
      - { text: { en: "60\n[10, 20, 30]", zh: "60\n[10, 20, 30]" }, correct: false }
      - { text: { en: "6\n[1, 2, 3]", zh: "6\n[1, 2, 3]" }, correct: false }
      - { text: { en: 'It fails because iter() moves the vector.', zh: '编译失败，因为 iter() 会移动向量。' }, correct: false }
    explanation: { en: 'iter() borrows the original values for the sum, so total is 6. That borrow ends before iter_mut() changes each element in place.', zh: 'iter() 借用原值完成求和，所以 total 是 6；该借用在 iter_mut() 就地修改每个元素之前已经结束。' }
    difficulty: beginner
    tags: [ownership, iter, iter-mut, predict-output]

  - id: adapter-needs-consumer
    type: mcq
    prompt: { en: 'What happens when code constructs values.iter().map(transform) but never uses the returned iterator?', zh: '代码构造 values.iter().map(transform)，却从未使用返回的迭代器，会发生什么？' }
    options:
      - { text: { en: 'The adapter is created, but transform is not called.', zh: '适配器会被创建，但 transform 不会被调用。' }, correct: true }
      - { text: { en: 'transform runs immediately for every value.', zh: 'transform 会立即对每个值运行。' }, correct: false }
      - { text: { en: 'Rust automatically collects the results into a Vec.', zh: 'Rust 会自动把结果收集到 Vec。' }, correct: false }
      - { text: { en: 'The source collection is always consumed.', zh: '源集合一定会被消费。' }, correct: false }
    explanation: { en: 'map is lazy and only stores its upstream iterator and closure. A consumer or loop must request items before transform runs.', zh: 'map 是惰性的，只保存上游迭代器和闭包；消费者或循环请求元素后，transform 才会运行。' }
    difficulty: beginner
    tags: [lazy-evaluation, iterator-adapter]

  - id: spotbug-unused-map
    title: { en: 'Spot the bug in the lazy map', zh: '找出惰性 map 里的 bug' }
    type: spotbug
    prompt: { en: 'Find why this helper leaves every price unchanged.', zh: '找出这个辅助函数为何不会修改任何价格。' }
    code: |
      fn add_service_fee(prices: &mut [u32]) {
          prices
              .iter_mut()
              .map(|price| *price = price.saturating_add(1));
      }
    lang: rust
    issues:
      - line: 4
        kind: correctness
        note: { en: 'map is lazy, and no consumer requests an item, so the assignment closure never runs.', zh: 'map 采用惰性求值，而且没有消费者请求元素，因此包含赋值的闭包不会运行。' }
    explanation: { en: 'Use a for loop when mutation is the purpose, or drive the iterator with for_each. The compiler’s unused_must_use warning points at the abandoned adapter.', zh: '以修改为目的时应使用 for 循环，或用 for_each 驱动迭代；编译器的 unused_must_use 警告会指向被丢弃的适配器。' }
    difficulty: intermediate
    tags: [spot-bug, lazy-evaluation, side-effects]

  - id: preserve-parse-errors
    type: mcq
    prompt: { en: 'Which expression returns the first integer parse error instead of silently dropping invalid fields?', zh: '哪个表达式会返回第一个整数解析错误，而不是静默丢弃无效字段？' }
    options:
      - { text: { en: 'fields.iter().map(|s| s.parse::<i32>()).collect::<Result<Vec<_>, _>>()', zh: 'fields.iter().map(|s| s.parse::<i32>()).collect::<Result<Vec<_>, _>>()' }, correct: true }
      - { text: { en: 'fields.iter().filter_map(|s| s.parse::<i32>().ok()).collect::<Vec<_>>()', zh: 'fields.iter().filter_map(|s| s.parse::<i32>().ok()).collect::<Vec<_>>()' }, correct: false }
      - { text: { en: 'fields.iter().map_while(|s| s.parse::<i32>().ok()).collect::<Vec<_>>()', zh: 'fields.iter().map_while(|s| s.parse::<i32>().ok()).collect::<Vec<_>>()' }, correct: false }
      - { text: { en: 'fields.iter().flat_map(|s| s.parse::<i32>()).collect::<Vec<_>>()', zh: 'fields.iter().flat_map(|s| s.parse::<i32>()).collect::<Vec<_>>()' }, correct: false }
    explanation: { en: 'Collecting Result items into Result<Vec<_>, _> short-circuits on the first Err. The other expressions either discard errors or return only values before a failure.', zh: '把 Result 元素收集成 Result<Vec<_>, _> 会在第一个 Err 处短路；其他表达式会丢弃错误，或只返回失败前的值。' }
    difficulty: intermediate
    tags: [result, collect, error-handling]

  - id: review-generated-weight-conversion
    title: { en: 'Review generated weight conversion', zh: '审查生成的重量转换' }
    type: review
    prompt: { en: 'Review this generated weight-conversion helper.', zh: '审查这个生成的重量转换辅助函数。' }
    task: { en: 'Parse every input as kilograms, preserve order, return the first parse or overflow error, avoid an intermediate collection, and produce no output.', zh: '把每项输入解析为千克并保留顺序；返回第一个解析或溢出错误；避免中间集合，且不产生输出。' }
    code: |
      fn weights_in_grams(
          rows: &[&str],
      ) -> Result<Vec<u32>, String> {
          let parsed: Vec<u32> = rows
              .iter()
              .filter_map(|row| row.parse::<u32>().ok())
              .collect();

          let mut grams = Vec::new();
          for kilograms in parsed {
              let converted = kilograms * 1_000;
              println!("converted {kilograms}");
              grams.push(converted);
          }

          Ok(grams)
      }
    lang: rust
    right: { en: 'The helper borrows its input, returns an owned result inside Result, and preserves the relative order of every value that reaches its output.', zh: '辅助函数借用输入，通过 Result 返回拥有型结果，并保留所有实际进入输出的值之间的相对顺序。' }
    issues:
      - line: 6
        kind: edge-case
        note: { en: 'Converting parse errors with ok() and filter_map silently drops malformed rows instead of returning the first error.', zh: '通过 ok() 和 filter_map 转换解析错误会静默丢弃坏行，而不是返回第一个错误。' }
      - line: 4
        kind: performance
        note: { en: 'Collecting parsed values creates an avoidable intermediate Vec before constructing the final Vec.', zh: '先收集解析值会创建一个可避免的中间 Vec，之后才构造最终 Vec。' }
      - line: 11
        kind: correctness
        note: { en: 'Multiplication can overflow u32; use checked_mul and turn None into the required error before pushing.', zh: '乘法可能溢出 u32；应使用 checked_mul，并在压入结果前把 None 转成所需错误。' }
      - line: 12
        kind: readability
        note: { en: 'A conversion helper unexpectedly prints for every item even though its Result should be its only observable reporting channel.', zh: '转换辅助函数意外地为每项打印内容，而 Result 应是它唯一可观察的报告通道。' }
    checklist:
      - { en: 'Test an empty input, malformed first and middle rows, zero, the largest valid value, and an overflowing value.', zh: '测试空输入、首项与中间项格式错误、零、最大有效值，以及会溢出的值。' }
      - { en: 'Trace whether Result stays in the pipeline until collect can short-circuit on the first error.', zh: '跟踪 Result 是否一直保留在管道中，直到 collect 能在第一个错误处短路。' }
      - { en: 'Count allocations and confirm there is no temporary collection before the returned Vec.', zh: '计算分配次数，确认返回的 Vec 之前没有临时集合。' }
      - { en: 'Check arithmetic before mutation and verify the helper has no printing or logging side effects.', zh: '在修改前检查算术，并确认辅助函数没有打印或日志副作用。' }
    explanation: { en: 'Map each row to a parsed value and checked conversion while preserving Result, then collect directly into Result<Vec<u32>, String>. That removes the temporary vector and stops at the first failure.', zh: '应在保留 Result 的情况下，把每行映射为解析值并执行受检转换，再直接收集成 Result<Vec<u32>, String>；这样既删除临时向量，也会在第一个失败处停止。' }
    difficulty: advanced
    tags: [code-review, fallible-collect, overflow, allocation]
