topic: rust/borrowing-rules
items:
  - id: predict-nll-last-use
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      fn main() {
          let mut values = vec![10, 20, 30];
          let first = &values[0];
          println!("first: {first}");
          values.push(40);
          println!("values: {values:?}");
      }
    lang: rust
    options:
      - { text: { en: 'first: 10 / values: [10, 20, 30, 40]', zh: 'first: 10 / values: [10, 20, 30, 40]' }, correct: true }
      - { text: { en: 'It fails because every reference lasts to the closing brace.', zh: '编译失败，因为每个引用都会持续到右花括号。' }, correct: false }
      - { text: { en: 'first: 40 / values: [10, 20, 30, 40]', zh: 'first: 40 / values: [10, 20, 30, 40]' }, correct: false }
      - { text: { en: 'It panics when push reallocates the vector.', zh: 'push 导致向量扩容时程序 panic。' }, correct: false }
    explanation: { en: 'The last use of first occurs before push. NLL ends that shared borrow, so the vector can then be mutated safely.', zh: 'first 的最后一次使用发生在 push 之前。NLL 会在此结束共享借用，因此随后可以安全修改向量。' }
    difficulty: beginner
    tags: [nll, predict-output, vector]

  - id: shared-versus-exclusive
    type: mcq
    prompt: { en: 'Which reference set may safely access the same ordinary value at one point?', zh: '在同一时刻，哪组引用可以安全访问同一个普通值？' }
    options:
      - { text: { en: 'Any number of &T references and no conflicting &mut T reference', zh: '任意数量的 &T，且没有与之冲突的 &mut T' }, correct: true }
      - { text: { en: 'Two &mut T references as long as only one writes', zh: '两个 &mut T，只要其中只有一个执行写入' }, correct: false }
      - { text: { en: 'One &T and one &mut T when the owner was declared mut', zh: '一个 &T 和一个 &mut T，只要所有者声明了 mut' }, correct: false }
      - { text: { en: 'Any references when the code runs on one thread', zh: '单线程运行时的任意引用组合' }, correct: false }
    explanation: { en: 'Shared reads may coexist, while mutable access must be exclusive for the overlapping region. The rule is not relaxed by mut bindings or single-threaded execution.', zh: '共享读取可以并存，而可变访问必须独占重叠区域。mut 绑定或单线程执行都不会放宽这条规则。' }
    difficulty: beginner
    tags: [shared-reference, mutable-reference, aliasing]

  - id: spotbug-vector-growth
    type: spotbug
    prompt: { en: 'Find why this function cannot append a copy and then log the original reference.', zh: '找出这个函数为何不能追加副本后再记录原引用。' }
    code: |
      fn duplicate_first(labels: &mut Vec<String>) {
          let first = &labels[0];
          labels.push(first.clone());
          println!("original: {first}");
      }
    lang: rust
    issues:
      - line: 3
        kind: correctness
        note: { en: 'push needs a mutable borrow and may reallocate the vector, but first remains borrowed from its buffer for the following println.', zh: 'push 需要可变借用并可能重新分配向量缓冲区，但后续 println 仍要使用从该缓冲区借出的 first。' }
    explanation: { en: 'Clone the String into an owned local before push and log that owned value, or save an index and borrow the element again after mutation when its identity is still valid.', zh: '应在 push 前把 String 克隆到拥有所有权的局部变量并记录该值；或者保存索引，在修改后确认元素身份仍有效时重新借用。' }
    difficulty: intermediate
    tags: [vector, reallocation, borrow-conflict]

  - id: lifetime-annotations-relate
    type: mcq
    prompt: { en: 'What does a lifetime annotation on a returned reference do?', zh: '返回引用上的生命周期标注有什么作用？' }
    options:
      - { text: { en: 'It states how the result validity relates to input references.', zh: '它说明结果的有效性与输入引用之间的关系。' }, correct: true }
      - { text: { en: 'It extends the lifetime of a local allocation.', zh: '它延长局部分配的存活时间。' }, correct: false }
      - { text: { en: 'It allocates the result in static storage.', zh: '它在静态存储区分配结果。' }, correct: false }
      - { text: { en: 'It disables NLL for the annotated function.', zh: '它为被标注函数禁用 NLL。' }, correct: false }
    explanation: { en: 'Annotations constrain relationships that callers must satisfy; they do not change when an owned value is destroyed or allocate anything.', zh: '标注约束调用方必须满足的引用关系；它不会改变拥有型值的销毁时间，也不会执行分配。' }
    difficulty: intermediate
    tags: [lifetimes, return-reference]

  - id: review-generated-stock-transfer
    type: review
    prompt: { en: 'Review this generated inventory-transfer helper.', zh: '审查这个生成的库存转移辅助函数。' }
    task: { en: 'Move one unit between two distinct valid bins, return false for invalid indices or an empty source, never overflow, perform no allocation, and produce no output.', zh: '在两个不同的有效货位之间移动一个单位；索引无效或来源为空时返回 false；不得溢出、分配或产生输出。' }
    code: |
      fn transfer_one(
          stock: &mut Vec<u32>,
          from: usize,
          to: usize,
      ) -> bool {
          if from >= stock.len() || to >= stock.len() {
              return false;
          }

          let source = &mut stock[from];
          let destination = &mut stock[to];
          let before = stock.clone();

          if *source == 0 {
              return false;
          }

          *source -= 1;
          *destination += 1;
          println!("before: {before:?}");
          true
      }
    lang: rust
    right: { en: 'The generated code checks both indices before indexing and tests the source count before subtracting, so those two failure paths are visible.', zh: '生成代码在索引前检查了两个索引，并在减法前检查来源数量，因此这两条失败路径是明确的。' }
    issues:
      - line: 11
        kind: correctness
        note: { en: 'A second indexed mutable borrow is rejected because from and to might be equal; the task also requires equal indices to return false.', zh: '第二次按索引可变借用会被拒绝，因为 from 与 to 可能相等；任务还要求相同索引返回 false。' }
      - line: 12
        kind: performance
        note: { en: 'Cloning the entire vector violates the no-allocation requirement and also tries to read stock while mutable element borrows are live.', zh: '克隆整个向量违反不得分配的要求，而且会在元素可变借用仍有效时读取 stock。' }
      - line: 19
        kind: edge-case
        note: { en: 'Adding to a destination holding u32::MAX overflows; checked_add or an explicit maximum test must make the operation fail without partial mutation.', zh: '目标为 u32::MAX 时加法会溢出；应使用 checked_add 或显式上限检查，让操作在不发生部分修改的前提下失败。' }
      - line: 20
        kind: readability
        note: { en: 'A low-level mutation helper unexpectedly prints internal state even though its result already reports success or failure.', zh: '底层修改辅助函数意外打印内部状态，而它的返回值已经用于报告成功或失败。' }
    checklist:
      - { en: 'Test empty input, out-of-range indices, and equal indices.', zh: '测试空输入、越界索引与相同索引。' }
      - { en: 'Prove that simultaneous mutable references address disjoint regions, using a safe splitting API.', zh: '使用安全拆分 API，证明同时存在的可变引用指向不重叠区域。' }
      - { en: 'Check source underflow and destination overflow before either count changes.', zh: '在任一数量改变前检查来源下溢与目标溢出。' }
      - { en: 'Inspect allocations and observable side effects against the function contract.', zh: '根据函数契约检查分配与可观察副作用。' }
    explanation: { en: 'Reject equal indices, compute the split boundary, borrow one element from each disjoint slice, and validate both arithmetic operations before committing them. Remove the clone and print.', zh: '应拒绝相同索引，计算拆分边界，从两个不重叠切片中各借一个元素，并在提交修改前验证两项算术操作；同时删除克隆和输出。' }
    difficulty: advanced
    tags: [code-review, split-at-mut, overflow, api-contract]
