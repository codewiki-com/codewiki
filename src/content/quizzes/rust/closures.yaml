topic: rust/closures
items:
  - id: predict-fnmut-captured-total
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      fn main() {
          let factor = 3;
          let mut total = 1;
          let mut add_scaled = |value| {
              total += value * factor;
              total
          };

          println!("{}", add_scaled(2));
          println!("{}", add_scaled(1));
      }
    lang: rust
    options:
      - { text: { en: "7\n10", zh: "7\n10" }, correct: true }
      - { text: { en: "6\n3", zh: "6\n3" }, correct: false }
      - { text: { en: "7\n4", zh: "7\n4" }, correct: false }
      - { text: { en: 'It fails because a closure cannot mutate a capture.', zh: '编译失败，因为闭包不能修改捕获值。' }, correct: false }
    explanation: { en: 'The closure shares factor and mutably borrows total. Each call updates the same total, first from 1 to 7 and then from 7 to 10.', zh: '闭包共享借用 factor，并可变借用 total；两次调用更新同一个 total，先从 1 变为 7，再从 7 变为 10。' }
    difficulty: beginner
    tags: [capture, fn-mut, predict-output]

  - id: move-does-not-imply-fn-once
    type: mcq
    prompt: { en: 'Which statement about move || println!("{label}") is correct when label is a String?', zh: 'label 为 String 时，关于 move || println!("{label}") 的哪项说法正确？' }
    options:
      - { text: { en: 'It captures label by value but can still implement Fn because the body only reads it.', zh: '它按值捕获 label，但闭包体只读取该值，因此仍可实现 Fn。' }, correct: true }
      - { text: { en: 'Every move closure implements only FnOnce.', zh: '每个 move 闭包都只实现 FnOnce。' }, correct: false }
      - { text: { en: 'It copies the String bytes into a second allocation on every call.', zh: '它每次调用都会把 String 字节复制到新的分配中。' }, correct: false }
      - { text: { en: 'It borrows label and therefore cannot leave the defining block.', zh: '它借用 label，因此不能离开定义它的代码块。' }, correct: false }
    explanation: { en: 'move controls how label enters the closure. The call traits depend on use inside the body, and formatting only borrows the stored String.', zh: 'move 决定 label 如何进入闭包；调用 trait 取决于闭包体的使用方式，而格式化只会借用闭包中保存的 String。' }
    difficulty: intermediate
    tags: [move-closure, fn, ownership]

  - id: spotbug-overstrong-fn-bound
    title: { en: 'Spot the bug in the Fn bound', zh: '找出 Fn 约束里的 bug' }
    type: spotbug
    prompt: { en: 'Find why this helper rejects a callback that increments captured state.', zh: '找出这个辅助函数为何拒绝会递增捕获状态的回调。' }
    code: |
      fn call_twice<F>(callback: F) -> (u32, u32)
      where
          F: Fn() -> u32,
      {
          (callback(), callback())
      }

      fn main() {
          let mut sequence = 0;
          let next = || {
              sequence += 1;
              sequence
          };
          println!("{:?}", call_twice(next));
      }
    lang: rust
    issues:
      - line: 3
        kind: correctness
        note: { en: 'Fn forbids mutation of captured state, but next needs a mutable receiver. Use F: FnMut() -> u32 and declare callback mutable.', zh: 'Fn 不允许修改捕获状态，但 next 需要可变接收者；应改用 F: FnMut() -> u32，并把 callback 声明为可变。' }
    explanation: { en: 'The helper calls more than once but does not require shared access. FnMut expresses repeated calls while admitting stateful callbacks.', zh: '辅助函数会多次调用回调，却不要求共享访问；FnMut 既表达重复调用，也允许有状态回调。' }
    difficulty: intermediate
    tags: [spot-bug, trait-bound, fn-mut]

  - id: choose-closure-representation
    type: mcq
    prompt: { en: 'A function chooses at runtime between two capturing closure expressions and returns the chosen callback. Which return type directly supports this?', zh: '函数在运行时从两个捕获型闭包表达式中选择一个并返回。哪种返回类型能直接支持这种需求？' }
    options:
      - { text: { en: 'Box<dyn Fn(i32) -> i32>', zh: 'Box<dyn Fn(i32) -> i32>' }, correct: true }
      - { text: { en: 'impl Fn(i32) -> i32 with an unrelated closure in each branch', zh: 'impl Fn(i32) -> i32，且每个分支使用互不相关的闭包表达式' }, correct: false }
      - { text: { en: 'fn(i32) -> i32 for arbitrary capturing closures', zh: '对任意捕获型闭包使用 fn(i32) -> i32' }, correct: false }
      - { text: { en: '&dyn Fn(i32) -> i32 borrowed from a local Box', zh: '从局部 Box 借用的 &dyn Fn(i32) -> i32' }, correct: false }
    explanation: { en: 'Each closure expression has a distinct type. Boxing a dyn Fn gives both an owned erased representation; impl Trait still requires one concrete return type.', zh: '每个闭包表达式都有不同类型；装箱 dyn Fn 可得到统一的拥有型擦除表示，而 impl Trait 仍要求一个具体返回类型。' }
    difficulty: intermediate
    tags: [trait-object, impl-trait, dynamic-dispatch]

  - id: review-generated-audit-handler
    title: { en: 'Review generated audit handler', zh: '审查生成的审计处理器' }
    type: review
    prompt: { en: 'Review this generated audit callback factory.', zh: '审查这个生成的审计回调工厂。' }
    task: { en: 'Return a reusable callback that can move to a worker thread, records every supplied message without output, avoids copying history, and remains usable after a poisoned lock.', zh: '返回一个可重复调用且能转移到工作线程的回调；记录每条输入消息，不产生输出，不复制历史记录，并在锁中毒后仍可使用。' }
    code: |
      use std::sync::{Arc, Mutex};

      fn make_audit_handler(
          prefix: String,
          entries: Arc<Mutex<Vec<String>>>,
      ) -> Box<dyn FnMut(String) + Send + 'static> {
          Box::new(move |message| {
              let previous = entries.lock().unwrap().clone();
              if message.trim().is_empty() {
                  return;
              }
              entries.lock().unwrap().push(format!("{prefix}:{message}"));
              println!("previous={previous:?}");
          })
      }
    lang: rust
    right: { en: 'The factory owns prefix, shares the log through Arc<Mutex<_>>, returns a reusable FnMut callback, and declares the Send and static boundaries needed for transfer to a worker.', zh: '工厂拥有 prefix，通过 Arc<Mutex<_>> 共享日志，返回可重复调用的 FnMut 回调，并声明了转移到工作线程所需的 Send 与 static 边界。' }
    issues:
      - line: 8
        kind: performance
        note: { en: 'Cloning the complete history on every call performs work and allocation that the task explicitly excludes.', zh: '每次调用都克隆完整历史记录，会产生任务明确排除的计算与分配。' }
      - line: 8
        kind: edge-case
        note: { en: 'unwrap panics after mutex poisoning. Recover the guard deliberately with the poison error’s into_inner when that is the stated policy.', zh: '互斥锁中毒后，unwrap 会 panic；既然策略要求继续使用，就应通过中毒错误的 into_inner 明确恢复守卫。' }
      - line: 9
        kind: correctness
        note: { en: 'Returning for an empty or whitespace-only message violates the requirement to record every supplied message.', zh: '遇到空消息或纯空白消息就返回，违反了记录每条输入消息的要求。' }
      - line: 13
        kind: security
        note: { en: 'Printing previous audit entries exposes stored messages and violates the no-output boundary.', zh: '打印先前的审计条目会泄露已保存的消息，也违反不产生输出的边界。' }
    checklist:
      - { en: 'Call the callback twice and confirm both entries appear in order without cloning the existing vector.', zh: '调用回调两次，确认两个条目按顺序出现，且不会克隆已有向量。' }
      - { en: 'Test empty, whitespace-only, and ordinary messages against the stated record-everything contract.', zh: '根据记录全部消息的契约，测试空消息、纯空白消息和普通消息。' }
      - { en: 'Poison the mutex in a test thread, then verify that the callback follows the documented recovery policy.', zh: '在测试线程中使互斥锁中毒，再验证回调遵循约定的恢复策略。' }
      - { en: 'Capture stdout and stderr to verify that audit contents are never emitted.', zh: '捕获标准输出与标准错误，确认审计内容从未被输出。' }
    explanation: { en: 'Lock once, recover the poisoned guard according to policy, and push the formatted message directly. Removing the snapshot and println eliminates both the copy and the disclosure.', zh: '应只加锁一次，按策略恢复中毒守卫，并直接压入格式化后的消息；删除快照与 println，便可同时消除复制和泄露。' }
    difficulty: advanced
    tags: [code-review, callback, mutex, ownership, security]
