topic: rust/collections
items:
  - id: predict-vec-queue
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      fn main() {
          let mut tasks = vec!["parse", "index", "publish"];
          let first = tasks.remove(0);
          tasks.push("notify");

          println!("first: {first}");
          println!("left: {tasks:?}");
      }
    lang: rust
    options:
      - { text: { en: "first: parse\nleft: [\"index\", \"publish\", \"notify\"]", zh: "first: parse\nleft: [\"index\", \"publish\", \"notify\"]" }, correct: true }
      - { text: { en: "first: publish\nleft: [\"parse\", \"index\", \"notify\"]", zh: "first: publish\nleft: [\"parse\", \"index\", \"notify\"]" }, correct: false }
      - { text: { en: "first: parse\nleft: [\"parse\", \"index\", \"publish\", \"notify\"]", zh: "first: parse\nleft: [\"parse\", \"index\", \"publish\", \"notify\"]" }, correct: false }
      - { text: { en: 'It fails because remove cannot move an element out of a vector.', zh: '编译失败，因为 remove 不能把元素移出向量。' }, correct: false }
    explanation: { en: 'remove(0) moves out the first element and shifts later elements toward the front. push then appends notify at the back.', zh: 'remove(0) 会移出首元素，并把后续元素向前移动；push 随后在尾部追加 notify。' }
    difficulty: beginner
    tags: [vec, ownership, predict-output]

  - id: choose-ordered-range-map
    type: mcq
    prompt: { en: 'Which standard collection most directly expresses a key-value map that must iterate by key and answer key-range queries?', zh: '哪个标准集合最直接地表达按键迭代并支持键范围查询的键值映射？' }
    options:
      - { text: { en: 'BTreeMap<K, V>', zh: 'BTreeMap<K, V>' }, correct: true }
      - { text: { en: 'HashMap<K, V>', zh: 'HashMap<K, V>' }, correct: false }
      - { text: { en: 'VecDeque<(K, V)>', zh: 'VecDeque<(K, V)>' }, correct: false }
      - { text: { en: 'HashSet<(K, V)>', zh: 'HashSet<(K, V)>' }, correct: false }
    explanation: { en: 'BTreeMap iterates in key order and provides range operations. HashMap is appropriate when that ordering is not part of the contract.', zh: 'BTreeMap 按键顺序迭代，并提供范围操作；如果顺序不属于契约，才应考虑 HashMap。' }
    difficulty: beginner
    tags: [btreemap, ordering, ranges]

  - id: spotbug-hashmap-render-order
    type: spotbug
    prompt: { en: 'Find why this report cannot promise reproducible text.', zh: '找出这份报告为何不能承诺生成可重复的文本。' }
    code: |
      use std::collections::HashMap;

      fn render_counts(events: &[&str]) -> String {
          let mut counts = HashMap::new();

          for event in events {
              *counts.entry(*event).or_insert(0) += 1;
          }

          format!("{counts:?}")
      }
    lang: rust
    issues:
      - line: 10
        kind: correctness
        note: { en: 'HashMap debug formatting follows an unspecified iteration order, so the returned text is not a stable serialization.', zh: 'HashMap 的调试格式采用未指定的迭代顺序，因此返回文本不是稳定的序列化结果。' }
    explanation: { en: 'Collect the entries, sort them by an explicit key, and render that sequence, or use BTreeMap when ordered keys belong to the data contract.', zh: '应收集条目并按明确的键排序后再渲染；如果有序键属于数据契约，也可以使用 BTreeMap。' }
    difficulty: intermediate
    tags: [hashmap, iteration-order, serialization]

  - id: entry-lazy-default
    type: mcq
    prompt: { en: 'Which expression calls build_profile only when user_id is absent?', zh: '哪个表达式只会在 user_id 不存在时调用 build_profile？' }
    options:
      - { text: { en: 'profiles.entry(user_id).or_insert_with(build_profile)', zh: 'profiles.entry(user_id).or_insert_with(build_profile)' }, correct: true }
      - { text: { en: 'profiles.entry(user_id).or_insert(build_profile())', zh: 'profiles.entry(user_id).or_insert(build_profile())' }, correct: false }
      - { text: { en: 'profiles.get(&user_id).unwrap_or(&build_profile())', zh: 'profiles.get(&user_id).unwrap_or(&build_profile())' }, correct: false }
      - { text: { en: 'profiles.contains_key(&user_id).then(build_profile)', zh: 'profiles.contains_key(&user_id).then(build_profile)' }, correct: false }
    explanation: { en: 'or_insert_with receives a closure and invokes it only for a vacant entry. Ordinary function-call arguments are evaluated before or_insert or unwrap_or runs.', zh: 'or_insert_with 接收闭包，只在条目空缺时调用；普通函数实参会在 or_insert 或 unwrap_or 运行前求值。' }
    difficulty: intermediate
    tags: [entry-api, lazy-evaluation, hashmap]

  - id: review-generated-product-summary
    type: review
    prompt: { en: 'Review this generated product-summary helper.', zh: '审查这个生成的商品汇总辅助函数。' }
    task: { en: 'Count product IDs, preserve first-seen order, return an error naming the index of any empty ID, avoid cloning repeated IDs during counting, and produce no output.', zh: '统计商品 ID，保留首次出现顺序；遇到空 ID 时返回包含其索引的错误；计数时不要重复克隆相同 ID，也不要产生输出。' }
    code: |
      use std::collections::HashMap;

      fn summarize(ids: &[String]) -> Result<Vec<(String, usize)>, String> {
          let mut counts: HashMap<String, usize> = HashMap::new();

          for (index, id) in ids.iter().enumerate() {
              if id.is_empty() {
                  println!("empty product at {index}");
                  continue;
              }

              *counts.entry(id.clone()).or_insert(0) += 1;
          }

          let mut rows: Vec<_> = counts.into_iter().collect();
          rows.sort_by(|left, right| left.0.cmp(&right.0));
          Ok(rows)
      }
    lang: rust
    right: { en: 'The function returns Result, uses Entry for counting, and produces owned strings in the returned rows, which are all useful choices for the requested boundary.', zh: '函数返回 Result，使用 Entry 计数，并在返回行中提供拥有型字符串；这些都符合所需的接口边界。' }
    issues:
      - line: 8
        kind: readability
        note: { en: 'A library helper prints an internal diagnostic even though its Result is supposed to communicate failure to the caller.', zh: '这个库辅助函数打印内部诊断，但失败本应通过 Result 交给调用方处理。' }
      - line: 9
        kind: edge-case
        note: { en: 'An empty ID is silently skipped instead of returning an error that names index, so the caller receives a partial-looking success.', zh: '空 ID 被静默跳过，没有返回包含 index 的错误，因此调用方会收到看似成功的不完整结果。' }
      - line: 12
        kind: performance
        note: { en: 'id.clone() is evaluated for every occurrence, including keys already in the map; counting can borrow &str and clone each distinct ID only for the final owned result.', zh: '每次出现都会先求值 id.clone()，包括映射中已有的键；计数可以借用 &str，只在生成最终拥有型结果时克隆每个不同 ID。' }
      - line: 16
        kind: correctness
        note: { en: 'Lexicographic sorting does not preserve first-seen order, so the returned sequence violates the task even though it is deterministic.', zh: '字典序排序不能保留首次出现顺序，因此返回序列虽可重复，却违反任务要求。' }
    checklist:
      - { en: 'Test an empty slice, an empty ID at every position, and repeated IDs.', zh: '测试空切片、位于各个位置的空 ID，以及重复 ID。' }
      - { en: 'Record first-seen order separately from the count map and verify it with interleaved duplicates.', zh: '把首次出现顺序与计数映射分开记录，并用交错重复项验证。' }
      - { en: 'Trace key ownership so repeated counting uses borrowed keys and final output performs only necessary clones.', zh: '跟踪键的所有权，让重复计数使用借用键，最终输出只执行必要克隆。' }
      - { en: 'Check that errors use Result and the helper has no printing or logging side effects.', zh: '确认错误通过 Result 返回，而且辅助函数没有打印或日志副作用。' }
    explanation: { en: 'Validate each ID and return Err with its index, count borrowed &str keys, and keep a separate vector when a key is first inserted. Build the owned rows from that vector at the end, cloning each distinct ID once.', zh: '应逐项验证 ID，并返回包含其索引的 Err；用借用的 &str 键计数，并在键首次插入时另存顺序向量。最后按该向量构造拥有型结果，每个不同 ID 只克隆一次。' }
    difficulty: advanced
    tags: [code-review, hashmap, ownership, ordering]
