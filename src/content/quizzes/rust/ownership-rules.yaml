topic: rust/ownership-rules
items:
  - id: predict-partial-move
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      struct Record {
          id: String,
          retries: u8,
      }

      fn main() {
          let record = Record {
              id: String::from("job-7"),
              retries: 2,
          };
          let id = record.id;
          println!("{id} {}", record.retries);
      }
    lang: rust
    options:
      - { text: { en: 'job-7 2', zh: 'job-7 2' }, correct: true }
      - { text: { en: 'It fails because moving id makes every field unusable.', zh: '编译失败，因为移动 id 后所有字段都不可用。' }, correct: false }
      - { text: { en: 'job-7 0', zh: 'job-7 0' }, correct: false }
      - { text: { en: 'It fails because String cannot be moved out of a struct.', zh: '编译失败，因为不能从结构体中移出 String。' }, correct: false }
    explanation: { en: 'Moving the String field partially moves record, but the untouched retries field implements Copy and remains usable on its own.', zh: '移出 String 字段会让 record 部分移动，但未受影响的 retries 字段实现了 Copy，仍可单独使用。' }
    difficulty: intermediate
    tags: [partial-move, copy, predict-output]

  - id: copy-versus-clone-contract
    type: mcq
    prompt: { en: 'Which statement about Copy and Clone is correct?', zh: '关于 Copy 与 Clone，哪项说法正确？' }
    options:
      - { text: { en: 'Copy is implicit, while Clone is explicit and its meaning depends on the type.', zh: 'Copy 是隐式操作；Clone 是显式操作，其含义取决于类型。' }, correct: true }
      - { text: { en: 'Every stack-allocated value is Copy.', zh: '所有栈上分配的值都实现 Copy。' }, correct: false }
      - { text: { en: 'Clone always creates a fully independent object graph.', zh: 'Clone 总会创建完全独立的对象图。' }, correct: false }
      - { text: { en: 'A type may implement both Copy and Drop.', zh: '一个类型可以同时实现 Copy 与 Drop。' }, correct: false }
    explanation: { en: 'Copy permits implicit duplication and cannot coexist with Drop. Clone is an explicit method; cloning may copy data or create another shared handle.', zh: 'Copy 允许隐式复制，且不能与 Drop 共存。Clone 是显式方法；克隆可能复制数据，也可能创建另一个共享句柄。' }
    difficulty: beginner
    tags: [copy, clone, drop]

  - id: spotbug-log-after-push
    title: { en: 'Spot the bug in the moved label', zh: '找出已移动标签里的 bug' }
    type: spotbug
    prompt: { en: 'Find why this function cannot log the label after enqueueing it.', zh: '找出这个函数为何无法在标签入队后记录它。' }
    code: |
      fn enqueue(queue: &mut Vec<String>, label: String) {
          queue.push(label);
          println!("queued: {label}");
      }
    lang: rust
    issues:
      - line: 3
        kind: correctness
        note: { en: 'push takes ownership of label, so the format expression tries to borrow a moved value.', zh: 'push 取得 label 的所有权，因此格式化表达式试图借用已移动的值。' }
    explanation: { en: 'Log before moving label, or log queue.last() after insertion when the stored value is what matters. This ordering problem does not require a clone.', zh: '可以在移动 label 前记录；如果关注实际存入的值，也可在插入后记录 queue.last()。这个顺序问题不需要克隆。' }
    difficulty: beginner
    tags: [use-after-move, vector, diagnostics]

  - id: predict-drop-scopes
    type: predict
    prompt: { en: 'In which order are these lines printed?', zh: '这些行会按什么顺序输出？' }
    code: |
      struct Traced(&'static str);

      impl Drop for Traced {
          fn drop(&mut self) {
              println!("drop {}", self.0);
          }
      }

      fn main() {
          let _outer = Traced("outer");
          {
              let _inner = Traced("inner");
              println!("work");
          }
          println!("done");
      }
    lang: rust
    options:
      - { text: { en: 'work, drop inner, done, drop outer', zh: 'work、drop inner、done、drop outer' }, correct: true }
      - { text: { en: 'work, done, drop inner, drop outer', zh: 'work、done、drop inner、drop outer' }, correct: false }
      - { text: { en: 'drop inner, work, drop outer, done', zh: 'drop inner、work、drop outer、done' }, correct: false }
      - { text: { en: 'work, done; no destructor output is guaranteed', zh: '输出 work、done；不保证有析构输出' }, correct: false }
    explanation: { en: 'The inner binding leaves its scope before done is printed. The outer binding remains alive until main reaches its closing brace.', zh: '内部绑定在输出 done 前就离开了作用域；外部绑定一直存活到 main 的右花括号。' }
    difficulty: beginner
    tags: [drop-order, scopes, predict-output]

  - id: review-generated-dispatch
    type: review
    title: { en: 'Review a generated dispatch helper', zh: '审查生成的派发辅助函数' }
    prompt: { en: 'Review this generated queue operation against its task.', zh: '根据任务要求审查这个生成的队列操作。' }
    task: { en: 'Remove and return the job at a valid index, leave the queue unchanged for an invalid index, preserve the job data, avoid copying the queue, and produce no output.', zh: '索引有效时移除并返回对应任务；索引无效时保持队列不变；保留任务数据；不复制队列；不产生输出。' }
    code: |
      #[derive(Clone, Debug)]
      struct Job {
          id: String,
          attempts: u32,
      }

      fn take_job(
          queue: &mut Vec<Job>,
          index: usize,
      ) -> Option<Job> {
          let snapshot = queue.clone();
          if index > queue.len() {
              return None;
          }

          let mut selected = queue.remove(index);
          selected.attempts += 1;
          println!("dispatching {}", selected.id);
          Some(selected)
      }
    lang: rust
    right: { en: 'The function borrows the queue mutably instead of consuming it, represents an invalid index with Option, and returns ownership of the removed Job.', zh: '函数可变借用队列而不消费它，用 Option 表示无效索引，并返回被移除 Job 的所有权。' }
    issues:
      - line: 11
        kind: performance
        note: { en: 'Cloning the entire queue duplicates every Job and is unused; it violates the no-copy requirement.', zh: '克隆整个队列会复制每个 Job，而且快照并未使用，违反不复制要求。' }
      - line: 12
        kind: edge-case
        note: { en: 'index equal to queue.len() passes this check and then makes remove panic; the condition must reject index >= len.', zh: 'index 等于 queue.len() 时会通过检查，随后在 remove 中 panic；条件必须拒绝 index >= len。' }
      - line: 17
        kind: correctness
        note: { en: 'Incrementing attempts changes the returned job even though the task requires preserving its data.', zh: '任务要求保留任务数据，但这里增加 attempts，改变了返回值。' }
      - line: 18
        kind: readability
        note: { en: 'The helper writes to stdout despite the declared no-output boundary, forcing a logging policy on every caller.', zh: '辅助函数违反不输出约定，向标准输出写入内容，迫使所有调用方接受一种日志策略。' }
    checklist:
      - { en: 'Trace which operation borrows, moves, or clones each owned value.', zh: '追踪每项操作对拥有值进行借用、移动还是克隆。' }
      - { en: 'Test an empty queue and indices at zero, len - 1, and len.', zh: '测试空队列，以及位于零、len - 1 与 len 的索引。' }
      - { en: 'Compare every field before and after the operation.', zh: '比较操作前后的每个字段。' }
      - { en: 'Check allocations and output against the task boundary.', zh: '根据任务边界检查分配与输出。' }
    explanation: { en: 'Check index < queue.len(), then return Some(queue.remove(index)). Remove the clone, mutation, and print because none belongs to the requested ownership transfer.', zh: '先检查 index < queue.len()，再返回 Some(queue.remove(index))。克隆、修改与输出都不属于要求的所有权转移，应全部删除。' }
    difficulty: advanced
    minutes: 7
    tags: [code-review, ownership, partial-move, api-contract]
