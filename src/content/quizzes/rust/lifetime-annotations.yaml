topic: rust/lifetime-annotations
items:
  - id: predict-common-lifetime-region
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      fn select<'a>(left: &'a str, right: &'a str, use_left: bool) -> &'a str {
          if use_left { left } else { right }
      }

      fn main() {
          let outer = String::from("east");

          {
              let inner = String::from("west");
              let result = select(&outer, &inner, true);
              println!("{result}");
          }
      }
    lang: rust
    options:
      - { text: { en: 'east', zh: 'east' }, correct: true }
      - { text: { en: 'west', zh: 'west' }, correct: false }
      - { text: { en: 'It fails because left and right have different lexical scopes.', zh: '编译失败，因为 left 与 right 的词法作用域不同。' }, correct: false }
      - { text: { en: 'It fails because result could refer to inner.', zh: '编译失败，因为 result 可能引用 inner。' }, correct: false }
    explanation: { en: 'The compiler chooses the inner block as a region in which both borrows are valid. The result is used only in that region, so the call is valid and the true branch prints east.', zh: '编译器选择内部代码块作为两个借用都有效的区域。result 只在该区域内使用，因此调用合法，true 分支输出 east。' }
    difficulty: intermediate
    tags: [lifetime-parameter, common-region, predict-output]

  - id: same-name-meaning
    type: mcq
    prompt: { en: 'What does one lifetime name shared by two parameters and a return value guarantee?', zh: '两个参数与返回值共享一个生命周期名称时，保证了什么？' }
    options:
      - { text: { en: 'Both input borrows are valid for a caller-chosen region in which the result may be used.', zh: '两个输入借用在调用方选择、可使用结果的区域内都有效。' }, correct: true }
      - { text: { en: 'Both owners must be created and dropped in the same lexical block.', zh: '两个所有者必须在同一个词法代码块中创建并销毁。' }, correct: false }
      - { text: { en: 'The function extends the shorter owner to match the longer owner.', zh: '函数会延长较短所有者的寿命，使其匹配较长所有者。' }, correct: false }
      - { text: { en: 'The result is always borrowed from the first parameter.', zh: '结果一定借自第一个参数。' }, correct: false }
    explanation: { en: 'A repeated name establishes a validity relationship, not identical owner scopes or a fixed return branch. Longer borrows can be shortened to a common region.', zh: '重复名称建立的是有效性关系，不表示所有者作用域相同，也不固定返回分支；较长借用可以缩短到共同区域。' }
    difficulty: intermediate
    tags: [lifetime-parameter, api-contract]

  - id: spotbug-return-local-reference
    type: spotbug
    prompt: { en: 'Find why adding a generic lifetime does not make this generated function valid.', zh: '找出为何添加泛型生命周期后，这个生成函数仍不合法。' }
    code: |
      fn status_text<'a>() -> &'a str {
          let status = String::from("ready");
          status.as_str()
      }
    lang: rust
    issues:
      - line: 3
        kind: correctness
        note: { en: 'The return value borrows status, which is destroyed when the function returns; the unconstrained lifetime lets the caller request a region the local value cannot satisfy.', zh: '返回值借用了 status，而它会在函数返回时销毁；未受约束的生命周期允许调用方要求局部值无法满足的区域。' }
    explanation: { en: 'Return String when the function creates the text, or return a string literal directly when the value is genuinely static. An annotation cannot extend a local owner.', zh: '函数创建文本时应返回 String；值确实是静态数据时可直接返回字符串字面量。标注无法延长局部所有者的寿命。' }
    difficulty: beginner
    tags: [dangling-reference, owned-return, compiler-error]

  - id: static-bound-distinction
    type: mcq
    prompt: { en: 'Which statement correctly distinguishes String: static from a static reference?', zh: '哪项说法正确区分了 String 的 static 边界与静态引用？' }
    options:
      - { text: { en: 'An owned String satisfies a static type bound but can still be dropped at the end of an ordinary block.', zh: '拥有型 String 满足静态类型边界，但仍可在普通代码块末尾销毁。' }, correct: true }
      - { text: { en: 'Any String satisfying the bound is stored in the program binary forever.', zh: '任何满足该边界的 String 都会永久存储在程序二进制文件中。' }, correct: false }
      - { text: { en: 'A reference to a local String becomes static when moved into a closure.', zh: '指向局部 String 的引用移入闭包后就会变成静态引用。' }, correct: false }
      - { text: { en: 'The static bound delays all destructors until process exit.', zh: '静态边界会把所有析构推迟到进程退出时。' }, correct: false }
    explanation: { en: 'A static type bound excludes non-static borrows inside the type; it says nothing about when an owned value is dropped. A static reference separately describes how long its referent remains valid.', zh: '静态类型边界排除类型内部的非静态借用，并不规定拥有型值何时销毁；静态引用则另行描述引用目标的有效期。' }
    difficulty: intermediate
    tags: [static, type-bound, owned-value]

  - id: review-generated-key-view
    type: review
    prompt: { en: 'Review this generated borrowed-key helper.', zh: '审查这个生成的借用键辅助函数。' }
    task: { en: 'Return the key before a separator as a view into record, allow a temporary separator, return the whole record when no separator exists, trim Unicode whitespace, allocate nothing, and produce no output.', zh: '把分隔符前的键作为 record 的视图返回；允许临时分隔符；无分隔符时返回完整 record；去除 Unicode 空白；不得分配或输出。' }
    code: |
      fn extract_key<'a>(
          record: &'a str,
          separator: &'a str,
      ) -> &'a str {
          println!("record={record}");
          let owned = record.to_string();

          let candidate = if let Some((key, _)) = owned.split_once(separator) {
              key
          } else {
              "missing"
          };

          if candidate.is_empty() {
              return "missing";
          }

          candidate.trim_ascii()
      }
    lang: rust
    right: { en: 'The generated function uses split_once to express a single separator split and returns string slices rather than cloning the selected key separately.', zh: '生成函数使用 split_once 表达只按第一个分隔符切分，并返回字符串切片，没有再单独克隆选中的键。' }
    issues:
      - line: 3
        kind: readability
        note: { en: 'Reusing a for separator hides that only record can be the returned data source and unnecessarily couples an auxiliary borrow to the result.', zh: 'separator 复用 a，掩盖了只有 record 才是返回数据来源的事实，还把辅助借用不必要地绑定到结果。' }
      - line: 5
        kind: security
        note: { en: 'Printing the complete record violates the no-output contract and may disclose credentials or other sensitive input.', zh: '打印完整 record 违反不得输出的契约，还可能泄露凭据或其他敏感输入。' }
      - line: 6
        kind: performance
        note: { en: 'to_string allocates and copies the complete record even though split_once can operate directly on the borrowed input.', zh: 'to_string 会分配并复制完整 record，而 split_once 本可直接处理借用输入。' }
      - line: 11
        kind: edge-case
        note: { en: 'The missing sentinel violates the required no-separator behavior, and the later ASCII-only trim also misses non-ASCII Unicode whitespace.', zh: 'missing 哨兵违反无分隔符时返回完整输入的要求，后续仅处理 ASCII 的 trim 也会漏掉非 ASCII Unicode 空白。' }
      - line: 18
        kind: correctness
        note: { en: 'candidate can point into the local owned String, so returning it would leave a reference to data destroyed at function exit.', zh: 'candidate 可能指向局部 owned String，因此返回它会留下指向函数退出时已销毁数据的引用。' }
    checklist:
      - { en: 'Trace the returned slice to record and keep the separator lifetime independent.', zh: '把返回切片追溯到 record，并保持 separator 的生命周期独立。' }
      - { en: 'Test no separator, an empty key, and leading or trailing non-ASCII Unicode whitespace.', zh: '测试无分隔符、空键，以及首尾含非 ASCII Unicode 空白的情况。' }
      - { en: 'Check the implementation for allocations and accidental logging of input data.', zh: '检查实现是否产生分配或意外记录输入数据。' }
      - { en: 'Compile a call that drops a temporary separator before using the returned key.', zh: '编译一个先销毁临时 separator、再使用返回键的调用。' }
    explanation: { en: 'Operate on record directly, use an independent separator lifetime, let split_once fall back to record, and call trim on the borrowed key. Remove both the allocation and logging.', zh: '应直接处理 record，为 separator 使用独立生命周期，让 split_once 在失败时回退到 record，并对借用键调用 trim；同时删除分配与日志。' }
    difficulty: advanced
    tags: [code-review, lifetime-contract, borrowed-return, unicode, allocation]
