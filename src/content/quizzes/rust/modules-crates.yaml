topic: rust/modules-crates
items:
  - id: predict-module-paths
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      mod shipping {
          fn base() -> u32 {
              250
          }

          pub fn quote(weight: u32) -> u32 {
              self::base() + weight * 80
          }
      }

      fn main() {
          println!("{}", crate::shipping::quote(3));
      }
    lang: rust
    options:
      - { text: { en: '490', zh: '490' }, correct: true }
      - { text: { en: '250', zh: '250' }, correct: false }
      - { text: { en: 'It fails because base is private.', zh: '编译失败，因为 base 是私有函数。' }, correct: false }
      - { text: { en: 'It fails because crate:: cannot be used in main.', zh: '编译失败，因为 main 中不能使用 crate::。' }, correct: false }
    explanation: { en: 'quote is public to its parent, and code inside shipping may call its own private base function. crate:: starts at this binary crate’s root.', zh: 'quote 对父模块公开，而 shipping 内的代码可以调用本模块的私有函数 base；crate:: 从当前二进制 crate 的根开始。' }
    difficulty: beginner
    tags: [module, path, visibility, predict-output]

  - id: distinguish-package-crate-module
    type: mcq
    prompt: { en: 'Which statement correctly distinguishes a Cargo package, a crate, and a module?', zh: '哪项说法正确区分了 Cargo package、crate 与模块？' }
    options:
      - { text: { en: 'A package is described by Cargo.toml, a crate is one compilation unit, and modules organize names inside a crate.', zh: 'Package 由 Cargo.toml 描述，crate 是一次编译的单元，模块在 crate 内组织名称。' }, correct: true }
      - { text: { en: 'Every Rust source file is a separate package and crate.', zh: '每个 Rust 源文件都是独立的 package 和 crate。' }, correct: false }
      - { text: { en: 'A package may contain only one binary crate and any number of library crates.', zh: '一个 package 只能包含一个 binary crate，却能包含任意多个 library crate。' }, correct: false }
      - { text: { en: 'Modules are Cargo targets, while crates are only filesystem directories.', zh: '模块是 Cargo 目标，而 crate 只是文件系统目录。' }, correct: false }
    explanation: { en: 'Cargo packages group targets, each crate compiles as a library or executable, and each crate owns an independent module tree.', zh: 'Cargo package 组织构建目标；每个 crate 编译成库或可执行程序，并拥有独立的模块树。' }
    difficulty: beginner
    tags: [package, crate, module, terminology]

  - id: spotbug-private-module-path
    title: { en: 'Spot the bug in the module path', zh: '找出模块路径里的 bug' }
    type: spotbug
    prompt: { en: 'Find why main cannot construct the public Product type through this path.', zh: '找出 main 为何不能通过这条路径构造公开的 Product 类型。' }
    code: |
      mod store {
          mod catalog {
              pub struct Product;
          }
      }

      fn main() {
          let _item = store::catalog::Product;
      }
    lang: rust
    issues:
      - line: 8
        kind: correctness
        note: { en: 'Product is pub, but the private catalog ancestor makes store::catalog::Product inaccessible from the crate root.', zh: 'Product 虽然是 pub，但祖先模块 catalog 是私有的，所以 crate root 无法访问 store::catalog::Product。' }
    explanation: { en: 'Re-export Product with pub use catalog::Product from store and construct store::Product, or expose catalog only when that module path is intentionally public.', zh: '可以在 store 中用 pub use catalog::Product 重导出，再构造 store::Product；只有确实要公开该模块路径时才公开 catalog。' }
    difficulty: intermediate
    tags: [privacy, ancestor-path, re-export, spot-bug]

  - id: binary-crate-root
    type: mcq
    prompt: { en: 'A package named store-domain has src/lib.rs and src/main.rs. From main.rs, how should the binary normally import Product exposed by the library root?', zh: '名为 store-domain 的 package 同时有 src/lib.rs 与 src/main.rs。main.rs 通常应怎样导入库根公开的 Product？' }
    options:
      - { text: { en: 'use store_domain::Product;', zh: 'use store_domain::Product;' }, correct: true }
      - { text: { en: 'use crate::Product;', zh: 'use crate::Product;' }, correct: false }
      - { text: { en: 'use src::lib::Product;', zh: 'use src::lib::Product;' }, correct: false }
      - { text: { en: 'mod lib; use lib::Product;', zh: 'mod lib; use lib::Product;' }, correct: false }
    explanation: { en: 'src/main.rs and src/lib.rs are separate crates. The binary addresses the library by its crate name, whose default Rust identifier replaces the package hyphen with an underscore.', zh: 'src/main.rs 与 src/lib.rs 属于不同 crate；二进制通过库的 crate 名访问它，默认 Rust 标识符会把 package 名中的连字符换成下划线。' }
    difficulty: intermediate
    tags: [binary-crate, library-crate, crate-root, imports]

  - id: review-generated-catalog-api
    title: { en: 'Review generated catalog API', zh: '审查生成的目录 API' }
    type: review
    prompt: { en: 'Review this generated catalog library API.', zh: '审查这个生成的商品目录库 API。' }
    task: { en: 'Expose Product at the crate root without exposing its implementation module, accept only a non-empty SKU and positive cents, return malformed input as Result without panic, avoid a temporary field collection, and quote by borrowing with checked arithmetic.', zh: '在 crate root 公开 Product 而不公开实现模块；只接受非空 SKU 与正数 cents；用 Result 返回坏输入且不得 panic；避免临时字段集合；通过借用与受检算术报价。' }
    code: |
      pub mod internal {
          pub struct Product {
              pub sku: String,
              pub cents: u32,
          }
      }

      use internal::Product;

      pub fn parse_product(line: &str) -> Product {
          let fields: Vec<&str> = line.split(',').collect();
          Product {
              sku: fields[0].to_string(),
              cents: fields[1].parse().unwrap(),
          }
      }

      pub fn quote(product: &Product, count: u32) -> Option<u32> {
          product.cents.checked_mul(count)
      }
    lang: rust
    right: { en: 'The generated quote function borrows Product instead of consuming it and uses checked_mul to represent overflow without wrapping or panicking.', zh: '生成的 quote 函数借用而不消费 Product，并使用 checked_mul 表示溢出，不会回绕或 panic。' }
    issues:
      - line: 1
        kind: readability
        note: { en: 'Making internal public leaks the implementation path, while the task asks for a crate-root facade; keep the module private and pub use Product at the root.', zh: '把 internal 公开会泄漏实现路径，而任务要求 crate root 门面；应保持模块私有，并在根部用 pub use 重导出 Product。' }
      - line: 3
        lines: 2
        kind: correctness
        note: { en: 'Public fields let callers construct an empty SKU or zero-cent Product and bypass the required invariant checks.', zh: '公开字段让调用方能够构造空 SKU 或零 cents 的 Product，从而绕过必需的不变量检查。' }
      - line: 11
        kind: performance
        note: { en: 'Collecting split fields into Vec performs an avoidable allocation; split_once can expose the two borrowed fields directly.', zh: '把分隔字段收集到 Vec 会产生可避免的分配；split_once 可以直接得到两个借用字段。' }
      - line: 13
        lines: 2
        kind: edge-case
        note: { en: 'Indexing assumes two fields and unwrap assumes valid digits, so missing, extra, empty, or non-numeric input violates the Result-without-panic contract.', zh: '索引假定存在两个字段，unwrap 又假定数字有效，所以缺失、多余、空字段或非数字输入都会违反用 Result 且不得 panic 的契约。' }
    checklist:
      - { en: 'List the public paths and confirm implementation modules and struct representation remain private.', zh: '列出公共路径，确认实现模块与结构体表示仍保持私有。' }
      - { en: 'Test empty, missing, extra, zero, non-numeric, valid, and maximum-value fields.', zh: '测试空值、缺失、多余、零、非数字、有效值与最大值字段。' }
      - { en: 'Trace every parser failure into Result and search the boundary for indexing and unwrap.', zh: '把每种解析失败跟踪到 Result，并在边界搜索索引与 unwrap。' }
      - { en: 'Check allocations, ownership of Product, and arithmetic overflow against the task.', zh: '根据任务检查分配、Product 的所有权与算术溢出。' }
    explanation: { en: 'Keep internal private, re-export Product, and give Product a validating constructor or parser inside its module. split_once plus explicit Result conversion handles the input without a temporary Vec, while the existing borrowed checked quote can remain.', zh: '应保持 internal 私有并重导出 Product，再在其模块中提供验证构造器或解析器；split_once 配合显式 Result 转换可以避免临时 Vec，现有的借用式受检报价可以保留。' }
    difficulty: advanced
    tags: [code-review, public-api, invariants, parsing, overflow]
