topic: rust/box-rc-arc
items:
  - id: predict-box-move
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      fn main() {
          let label = Box::new(String::from("alpha"));
          let moved = label;
          println!("{moved}");
      }
    lang: rust
    options:
      - { text: { en: 'alpha', zh: 'alpha' }, correct: true }
      - { text: { en: 'It fails because moving a Box always moves out its inner String.', zh: '编译失败，因为移动Box总会取出内部String。' }, correct: false }
      - { text: { en: 'It prints a heap address.', zh: '输出一个堆地址。' }, correct: false }
      - { text: { en: 'It panics because label is no longer bound.', zh: '程序panic，因为label已不再绑定。' }, correct: false }
    explanation: { en: 'Moving label transfers ownership of the Box to moved. Deref-based formatting reads the same heap-resident String through its new owner.', zh: '移动label会把Box的所有权转给moved。格式化输出通过解引用从新所有者读取堆上的同一个String。' }
    difficulty: beginner
    tags: [box, move-semantics, ownership]

  - id: predict-rc-count
    type: predict
    prompt: { en: 'Which pair of lines does this program print?', zh: '这段程序会输出哪两行？' }
    code: |
      use std::rc::Rc;

      fn main() {
          let config = Rc::new(7);
          {
              let view = Rc::clone(&config);
              println!("inside: {}", Rc::strong_count(&view));
          }
          println!("outside: {}", Rc::strong_count(&config));
      }
    lang: rust
    options:
      - { text: { en: 'inside: 2 / outside: 1', zh: 'inside: 2 / outside: 1' }, correct: true }
      - { text: { en: 'inside: 1 / outside: 1', zh: 'inside: 1 / outside: 1' }, correct: false }
      - { text: { en: 'inside: 2 / outside: 2', zh: 'inside: 2 / outside: 2' }, correct: false }
      - { text: { en: 'It fails because view cannot outlive its block.', zh: '编译失败，因为view不能活过所在代码块。' }, correct: false }
    explanation: { en: 'Rc::clone raises the strong count to two. Dropping view at the inner closing brace lowers it to one before the second print.', zh: 'Rc::clone把强计数增加到2。view在内部代码块结束时被丢弃，因此第二次输出前计数回到1。' }
    difficulty: beginner
    tags: [rc, reference-counting, drop]

  - id: choose-owner-type
    type: mcq
    prompt: { en: 'A parent owns child nodes on one thread, while each child needs an optional parent link. Which representation best matches that ownership?', zh: '父节点在单线程中拥有子节点，而每个子节点需要可选的父链接。哪种表示最符合这个所有权关系？' }
    options:
      - { text: { en: 'Rc children and Weak parent links', zh: '子节点使用Rc，父链接使用Weak' }, correct: true }
      - { text: { en: 'Rc in both directions', zh: '两个方向都使用Rc' }, correct: false }
      - { text: { en: 'Arc<Mutex<_>> in both directions', zh: '两个方向都使用Arc<Mutex<_>>' }, correct: false }
      - { text: { en: 'Box in both directions', zh: '两个方向都使用Box' }, correct: false }
    explanation: { en: 'The parent-to-child edge is owning, while the back edge is navigation only. Rc fits one-thread sharing and Weak prevents the back edge from forming a strong cycle.', zh: '父到子的边表达所有权，反向边只用于导航。Rc适合单线程共享，Weak能防止反向边形成强引用环。' }
    difficulty: intermediate
    tags: [rc, weak, ownership-graph]

  - id: spotbug-strong-parent
    title: { en: 'Spot the bug in the Rc tree', zh: '找出Rc树里的bug' }
    type: spotbug
    prompt: { en: 'Find why dropping the external root may not destroy this tree.', zh: '找出为什么丢弃外部根节点后，这棵树仍可能无法析构。' }
    code: |
      use std::cell::RefCell;
      use std::rc::Rc;

      struct Node {
          parent: RefCell<Option<Rc<Node>>>,
          children: RefCell<Vec<Rc<Node>>>,
      }

      fn attach(parent: &Rc<Node>, child: &Rc<Node>) {
          *child.parent.borrow_mut() = Some(Rc::clone(parent));
          parent.children.borrow_mut().push(Rc::clone(child));
      }
    lang: rust
    issues:
      - line: 10
        kind: correctness
        note: { en: 'The child stores a strong Rc to its parent while the parent stores a strong Rc to the child, so the two allocations form a cycle.', zh: '子节点用强Rc保存父节点，同时父节点也用强Rc保存子节点，因此两个分配形成引用环。' }
    explanation: { en: 'Store RefCell<Weak<Node>> for parent and assign Rc::downgrade(parent). The back edge remains usable through upgrade without keeping the parent alive.', zh: '应让parent保存RefCell<Weak<Node>>，并赋值Rc::downgrade(parent)。反向边仍可通过upgrade使用，但不会让父节点继续存活。' }
    difficulty: intermediate
    tags: [rc, weak, strong-reference-cycle]

  - id: review-generated-listener-hub
    title: { en: 'Review generated listener hub', zh: '审查生成的监听器中心' }
    type: review
    prompt: { en: 'Review this generated listener hub.', zh: '审查这个生成的监听器中心。' }
    task: { en: 'Keep listeners without owning them, publish to every live listener, prune expired entries, never call listener code under the registry lock, return an error for a poisoned lock, and produce no output.', zh: '以非拥有方式保存监听器；向所有存活监听器发布并清理失效条目；不得在持有注册表锁时调用监听器代码；锁中毒时返回错误；不得产生输出。' }
    code: |
      use std::sync::{Arc, Mutex};

      trait Listener: Send + Sync {
          fn on_message(&self, message: &str);
      }

      struct Hub {
          listeners: Mutex<Vec<Arc<dyn Listener>>>,
      }

      impl Hub {
          fn subscribe(&self, listener: Arc<dyn Listener>) {
              self.listeners.lock().unwrap().push(listener);
          }

          fn publish(&self, message: &str) {
              let listeners = self.listeners.lock().unwrap();
              for listener in listeners.iter() {
                  listener.on_message(message);
              }
              println!("delivered to {}", listeners.len());
          }
      }
    lang: rust
    right: { en: 'The trait requires Send and Sync for cross-thread use, and one mutex gives the registry a clear synchronization point.', zh: 'trait要求Send与Sync，符合跨线程调用条件；单个互斥锁也为注册表提供了明确的同步点。' }
    issues:
      - line: 13
        kind: correctness
        note: { en: 'Storing Arc owns every listener, so dropping a subscriber’s external handle cannot unsubscribe it and no entry ever expires.', zh: '保存Arc会拥有每个监听器，因此订阅方丢弃外部句柄也无法取消订阅，并且条目永远不会失效。' }
      - line: 17
        kind: edge-case
        note: { en: 'unwrap panics after lock poisoning even though the task requires publishing to return an error.', zh: '锁中毒后unwrap会panic，但任务要求发布操作返回错误。' }
      - line: 18
        kind: performance
        note: { en: 'The mutex guard remains live through every callback, serializing unrelated operations and allowing a re-entrant listener to deadlock.', zh: '互斥锁守卫在所有回调期间保持存活，会串行化无关操作，并可能让重入监听器死锁。' }
      - line: 21
        kind: readability
        note: { en: 'A registry primitive unexpectedly writes to stdout, violating the requested side-effect boundary and coupling callers to one reporting policy.', zh: '注册表基础组件意外写入标准输出，违反约定的副作用边界，并把调用方绑定到一种报告策略。' }
    checklist:
      - { en: 'Verify that stored edges use Weak when the registry must not own subscribers.', zh: '注册表不得拥有订阅方时，确认存储的边使用Weak。' }
      - { en: 'Upgrade and retain live entries in a short locked section, then drop the guard before callbacks.', zh: '在短临界区内升级并保留存活条目，然后在回调前释放守卫。' }
      - { en: 'Exercise dropped listeners, a poisoned lock, and a callback that re-enters the hub.', zh: '测试已丢弃的监听器、锁中毒，以及重新进入中心的回调。' }
      - { en: 'Compare every log, panic, and allocation with the API contract.', zh: '根据API契约检查每次日志输出、panic与分配。' }
    explanation: { en: 'Store Weak<dyn Listener>, retain only entries whose upgrade succeeds, collect temporary strong handles while locked, and invoke them after releasing the guard. Make publish return a Result and leave reporting to its caller.', zh: '应保存Weak<dyn Listener>，仅保留升级成功的条目，在锁内收集临时强句柄，并在释放守卫后调用。publish应返回Result，把报告策略留给调用方。' }
    difficulty: advanced
    tags: [arc, weak, mutex, code-review]
