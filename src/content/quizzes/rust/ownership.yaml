topic: rust/ownership
items:
  - id: predict-returned-owner
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      fn rename(mut label: String) -> String {
          label.push_str("-ready");
          label
      }

      fn main() {
          let label = String::from("batch");
          let label = rename(label);
          println!("{label}");
      }
    lang: rust
    options:
      - { text: { en: 'batch-ready', zh: 'batch-ready' }, correct: true }
      - { text: { en: 'batch', zh: 'batch' }, correct: false }
      - { text: { en: 'It fails because label was moved into rename.', zh: '编译失败，因为 label 已移动到 rename。' }, correct: false }
      - { text: { en: 'It prints an empty string because the first binding was consumed.', zh: '输出空字符串，因为第一个绑定已被消费。' }, correct: false }
    explanation: { en: 'rename owns the String, mutates it, and returns ownership. The second binding receives that returned value; shadowing does not reuse the moved value.', zh: 'rename 取得 String 的所有权，修改后再返回。第二个绑定接收该返回值；遮蔽并没有重新使用已移动的值。' }
    difficulty: beginner
    tags: [move-semantics, return-value, shadowing]

  - id: predict-clone-independence
    type: predict
    prompt: { en: 'Which pair of lengths does this program print?', zh: '这段程序会输出哪一对长度？' }
    code: |
      fn main() {
          let original = vec![10, 20];
          let mut copy = original.clone();
          copy.push(30);
          println!("{} {}", original.len(), copy.len());
      }
    lang: rust
    options:
      - { text: { en: '2 3', zh: '2 3' }, correct: true }
      - { text: { en: '3 3', zh: '3 3' }, correct: false }
      - { text: { en: '2 2', zh: '2 2' }, correct: false }
      - { text: { en: 'It fails because Vec cannot be cloned.', zh: '编译失败，因为 Vec 不能克隆。' }, correct: false }
    explanation: { en: 'Cloning this Vec creates an independent buffer containing copies of its i32 elements. Pushing into copy therefore leaves original unchanged.', zh: '克隆这个 Vec 会创建独立缓冲区，并复制其中的 i32 元素。因此，向 copy 追加元素不会改变 original。' }
    difficulty: beginner
    tags: [clone, vector, ownership]

  - id: choose-read-only-parameter
    type: mcq
    prompt: { en: 'A function only reads a Shipment during the call and never stores it. Which parameter best expresses that contract?', zh: '函数只在调用期间读取 Shipment，且不会保存它。哪种参数最准确地表达该契约？' }
    options:
      - { text: { en: 'shipment: &Shipment', zh: 'shipment: &Shipment' }, correct: true }
      - { text: { en: 'shipment: Shipment', zh: 'shipment: Shipment' }, correct: false }
      - { text: { en: 'shipment: &mut Shipment', zh: 'shipment: &mut Shipment' }, correct: false }
      - { text: { en: 'shipment: Arc<Mutex<Shipment>>', zh: 'shipment: Arc<Mutex<Shipment>>' }, correct: false }
    explanation: { en: 'A shared reference permits reading while leaving ownership with the caller. Taking Shipment overstates the transfer, while mutable or synchronized access grants capabilities the function does not need.', zh: '共享引用允许读取，同时让调用方保留所有权。按值接收夸大了责任转移，可变或同步访问则授予了函数并不需要的能力。' }
    difficulty: beginner
    tags: [api-design, shared-borrow, parameter]

  - id: spotbug-log-after-move
    type: spotbug
    prompt: { en: 'Find why this helper cannot log the label after enqueueing it.', zh: '找出这个辅助函数为何无法在标签入队后记录它。' }
    code: |
      fn enqueue(queue: &mut Vec<String>, label: String) {
          queue.push(label);
          println!("queued: {label}");
      }
    lang: rust
    issues:
      - line: 3
        kind: correctness
        note: { en: 'push takes ownership of label, so the following format expression tries to borrow a moved value.', zh: 'push 取得 label 的所有权，因此后续格式化表达式试图借用一个已移动值。' }
    explanation: { en: 'Print before moving label, or print through queue.last() after insertion when that is the intended stored value. Cloning is unnecessary for this ordering problem.', zh: '可以在移动 label 前打印；如果要记录实际入队值，也可在插入后通过 queue.last() 打印。这个顺序问题不需要克隆。' }
    difficulty: beginner
    tags: [use-after-move, vector, diagnostics]

  - id: review-generated-job-removal
    type: review
    prompt: { en: 'Review this generated queue helper.', zh: '审查这个生成的队列辅助函数。' }
    task: { en: 'Remove and return the first case-sensitive match, leave the queue unchanged when absent, perform one linear scan without duplicating the list, and produce no output.', zh: '移除并返回第一个区分大小写的匹配项；没有匹配时保持队列不变；只进行一次线性扫描且不复制列表；不得产生输出。' }
    code: |
      fn take_job(queue: &mut Vec<String>, target: &str) -> Option<String> {
          let snapshot = queue.clone();
          let mut match_index = None;

          for (index, job) in snapshot.iter().enumerate() {
              if job.to_lowercase() == target.to_lowercase() {
                  match_index = Some(index);
              }
          }

          println!("taking {target}");

          match match_index {
              Some(index) => Some(queue.remove(index)),
              None => None,
          }
      }
    lang: rust
    right: { en: 'The generated code borrows target, represents absence with Option, and returns ownership of the removed String instead of cloning the result.', zh: '生成代码借用了 target，用 Option 表示不存在，并直接返回被移除 String 的所有权，而没有克隆结果。' }
    issues:
      - line: 2
        kind: performance
        note: { en: 'Cloning the entire queue duplicates every String and violates the one-scan, no-duplicate requirement.', zh: '克隆整个队列会复制每个 String，违反一次扫描且不复制列表的要求。' }
      - line: 6
        kind: correctness
        note: { en: 'Lowercasing both values changes the required case-sensitive comparison and allocates temporary strings on every iteration.', zh: '把两边都转成小写会把所需的区分大小写比较改成不区分大小写，并在每次迭代分配临时字符串。' }
      - line: 7
        kind: edge-case
        note: { en: 'Overwriting match_index makes duplicate targets remove the last match rather than the required first match.', zh: '反复覆盖 match_index 会在目标重复时移除最后一项，而不是所需的第一项。' }
      - line: 11
        kind: readability
        note: { en: 'A collection helper unexpectedly writes to stdout, violating the requested side-effect boundary and forcing one logging policy on callers.', zh: '集合辅助函数意外写入标准输出，违反约定的副作用边界，并强迫调用方接受一种日志策略。' }
    checklist:
      - { en: 'Match each owned value, borrow, and clone to the function contract.', zh: '根据函数契约核对每个拥有值、借用与克隆。' }
      - { en: 'Test absent, first-position, last-position, duplicate, and case-different targets.', zh: '测试不存在、位于首尾、重复以及大小写不同的目标。' }
      - { en: 'Verify scan count, allocations, and whether removing an element must preserve order.', zh: '验证扫描次数、分配行为，以及移除元素是否必须保持顺序。' }
      - { en: 'Compare all logging and mutation with the declared side-effect boundary.', zh: '根据声明的副作用边界检查所有日志与修改。' }
    explanation: { en: 'Use queue.iter().position(|job| job == target) to borrow during one case-sensitive scan, then map the found index to queue.remove(index). Remove the clone and print.', zh: '使用 queue.iter().position(|job| job == target) 在一次区分大小写的扫描中借用元素，再把找到的索引映射为 queue.remove(index)；同时删除克隆和输出。' }
    difficulty: advanced
    tags: [code-review, ownership, clone, api-contract]

