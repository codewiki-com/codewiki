topic: rust/pattern-matching
items:
  - id: predict-guard-and-range-order
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      fn main() {
          let limit = 10;

          for value in [9, 10, 11] {
              let label = match value {
                  n @ 0..=10 if n == limit => "limit",
                  0..=10 => "inside",
                  _ => "outside",
              };
              println!("{value}: {label}");
          }
      }
    lang: rust
    options:
      - { text: { en: "9: inside\n10: limit\n11: outside", zh: "9: inside\n10: limit\n11: outside" }, correct: true }
      - { text: { en: "9: limit\n10: limit\n11: outside", zh: "9: limit\n10: limit\n11: outside" }, correct: false }
      - { text: { en: "9: inside\n10: inside\n11: outside", zh: "9: inside\n10: inside\n11: outside" }, correct: false }
      - { text: { en: 'It fails because the two range patterns overlap.', zh: '编译失败，因为两个范围模式重叠。' }, correct: false }
    explanation: { en: 'The guarded arm matches only 10. When its guard is false for 9, matching continues to the next range arm; 11 reaches the wildcard.', zh: '带守卫的分支只接受 10；对 9 而言守卫为 false，匹配会继续尝试下一个范围分支，11 则进入通配分支。' }
    difficulty: beginner
    tags: [match-guard, ranges, arm-order]

  - id: spotbug-binding-shadows-expected
    title: { en: 'Spot the bug in the match pattern', zh: '找出匹配模式里的 bug' }
    type: spotbug
    prompt: { en: 'Find why same_as returns true for every value.', zh: '找出 same_as 为所有值都返回 true 的原因。' }
    code: |
      fn same_as(value: u32, expected: u32) -> bool {
          match value {
              expected => true,
              _ => false,
          }
      }
    lang: rust
    issues:
      - line: 3
        kind: correctness
        note: { en: 'expected is a new pattern binding that matches every u32 and shadows the parameter; use value if value == expected as a guarded arm.', zh: 'expected 是匹配任意 u32 的新模式绑定，并遮蔽了参数；应使用 value if value == expected 这样的守卫分支。' }
    explanation: { en: 'A bare lowercase identifier in a pattern normally binds instead of comparing. The following wildcard is unreachable, and the compiler warning is evidence of the mistake.', zh: '模式中的小写裸标识符通常执行绑定而非比较；后续通配分支不可达，编译器警告正是这一错误的线索。' }
    difficulty: intermediate
    tags: [shadowing, pattern-binding, unreachable-pattern]

  - id: exact-slice-shape
    type: mcq
    prompt: { en: 'Which slice pattern accepts exactly a command name followed by one argument?', zh: '哪个切片模式只接受一个命令名和一个参数？' }
    options:
      - { text: { en: '[command, argument]', zh: '[command, argument]' }, correct: true }
      - { text: { en: '[command, argument, ..]', zh: '[command, argument, ..]' }, correct: false }
      - { text: { en: '[command, .., argument]', zh: '[command, .., argument]' }, correct: false }
      - { text: { en: '[..]', zh: '[..]' }, correct: false }
    explanation: { en: 'A slice pattern without .. fixes the length as well as binding the elements. Adding .. admits zero or more elements at that position.', zh: '不含 .. 的切片模式既绑定元素，也固定长度；加入 .. 后，该位置可接受零个或多个元素。' }
    difficulty: beginner
    tags: [slice-pattern, exact-shape]

  - id: borrowed-subject-binding
    type: mcq
    prompt: { en: 'In match &job { Job { owner, .. } => ... }, where owner is a String field, what is the usual binding type?', zh: '在 match &job { Job { owner, .. } => ... } 中，若 owner 是 String 字段，它通常绑定成什么类型？' }
    options:
      - { text: { en: '&String, because the subject is shared-borrowed', zh: '&String，因为待匹配值是共享借用' }, correct: true }
      - { text: { en: 'String, moved out of job', zh: 'String，从 job 中移动出来' }, correct: false }
      - { text: { en: '&mut String, because patterns are mutable', zh: '&mut String，因为模式默认可变' }, correct: false }
      - { text: { en: 'str, copied out of the allocation', zh: 'str，从分配中复制出来' }, correct: false }
    explanation: { en: 'Match ergonomics dereferences the structural pattern while retaining the shared borrowing mode. The String remains owned by job.', zh: '匹配人体工程学会为结构模式自动解引用，同时保留共享借用方式；String 仍由 job 拥有。' }
    difficulty: intermediate
    tags: [match-ergonomics, borrowing, ownership]

  - id: review-generated-event-classifier
    type: review
    title: { en: 'Review an event classifier', zh: '审查事件分类器' }
    prompt: { en: 'Review this generated event classifier against the stated task.', zh: '依据任务要求审查这个生成的事件分类器。' }
    task: { en: 'Borrow the event; return a static label without allocation for a selected read, another read, an accepted write, or a delete; accept writes through 1,024 bytes and return an error above that limit.', zh: '借用事件；为选中读取、其他读取、可接受写入或删除返回无需分配的静态标签；接受不超过 1,024 字节的写入，超限时返回错误。' }
    code: |
      enum Event {
          Read { id: u32 },
          Write { bytes: usize },
          Delete { id: u32 },
      }

      fn classify(event: &Event, selected_id: u32) -> Result<String, String> {
          match event {
              Event::Read { id: selected_id } => Ok(format!("selected {selected_id}")),
              Event::Read { .. } => Ok(String::from("other read")),
              Event::Write { bytes } if *bytes < 1_024 => Ok(String::from("accepted write")),
              Event::Write { .. } => unreachable!(),
              _ => Ok(String::from("ignored")),
          }
      }

      fn main() {
          let event = Event::Read { id: 7 };
          println!("{:?}", classify(&event, 9));
      }
    lang: rust
    right: { en: 'The code borrows Event rather than consuming it, models the input as an enum, and keeps read and write handling in visibly separate arms.', zh: '代码借用而非消费 Event，用枚举建模输入，并让读取与写入处理保留为清楚分离的分支。' }
    issues:
      - line: 7
        kind: performance
        note: { en: 'The String result allocates labels even though the task calls for static borrowed strings; use Result<&''static str, &''static str>.', zh: 'String 结果会为标签分配内存，但任务要求静态借用字符串；应使用 Result<&''static str, &''static str>。' }
      - line: 9
        kind: correctness
        note: { en: 'selected_id creates a new binding and shadows the parameter, so every Read is classified as selected; bind id and compare it in a guard.', zh: 'selected_id 创建新绑定并遮蔽参数，导致每个 Read 都被归为选中项；应绑定 id，再在守卫中比较。' }
      - line: 11
        kind: edge-case
        note: { en: 'The strict less-than rejects exactly 1,024 bytes even though the boundary is allowed.', zh: '严格小于会拒绝恰好 1,024 字节的写入，但任务允许该边界值。' }
      - line: 12
        kind: security
        note: { en: 'An oversized externally controlled write reaches unreachable! and can panic the process instead of returning the required error.', zh: '外部可控的超限写入会到达 unreachable! 并可能使进程 panic，而不是返回所需错误。' }
      - line: 13
        kind: readability
        note: { en: 'The wildcard hides the Delete variant and labels it ignored, weakening the visible enum contract; name Delete explicitly.', zh: '通配分支隐藏 Delete 变体并将其标成 ignored，削弱了可见的枚举契约；应明确写出 Delete。' }
    checklist:
      - { en: 'Test a matching and nonmatching read ID, then confirm neither branch moves the event.', zh: '测试匹配与不匹配的读取 ID，并确认两个分支都不会移动事件。' }
      - { en: 'Test write sizes 0, 1,023, 1,024, and 1,025 and assert that only the last returns an error.', zh: '测试写入大小 0、1,023、1,024 与 1,025，并断言只有最后一个返回错误。' }
      - { en: 'Add a temporary enum variant and check that the match fails exhaustiveness rather than entering a wildcard.', zh: '临时增加一个枚举变体，确认匹配因不穷尽而编译失败，而不是进入通配分支。' }
      - { en: 'Check the return type and every arm for formatting, cloning, or String construction.', zh: '检查返回类型与每个分支，找出格式化、克隆或 String 构造。' }
    explanation: { en: 'Use explicit arms, compare the read ID in a guard, make the size boundary inclusive, and return Err for the remaining Write arm. Static string results then meet the contract without allocation.', zh: '应使用显式分支，在守卫中比较读取 ID，让大小边界包含 1,024，并在剩余 Write 分支返回 Err；静态字符串结果可在不分配内存的情况下满足契约。' }
    difficulty: advanced
    tags: [code-review, exhaustiveness, match-guard, ownership]
