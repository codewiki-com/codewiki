topic: rust/pin
items:
  - id: predict-pin-set-drop-order
    type: predict
    prompt: { en: 'Which three lines does this program print, in order?', zh: '这段程序依次输出哪三行？' }
    code: |
      use std::marker::PhantomPinned;

      struct State(&'static str, PhantomPinned);

      impl Drop for State {
          fn drop(&mut self) {
              println!("drop {}", self.0);
          }
      }

      fn main() {
          let mut state = Box::pin(State("old", PhantomPinned));
          state.as_mut().set(State("new", PhantomPinned));
          println!("current {}", state.0);
      }
    lang: rust
    options:
      - { text: { en: 'drop old / current new / drop new', zh: 'drop old / current new / drop new' }, correct: true }
      - { text: { en: 'current new / drop old / drop new', zh: 'current new / drop old / drop new' }, correct: false }
      - { text: { en: 'drop old / drop new / current new', zh: 'drop old / drop new / current new' }, correct: false }
      - { text: { en: 'It fails because State is !Unpin.', zh: '编译失败，因为 State 是 !Unpin。' }, correct: false }
    explanation: { en: 'Pin::set destroys the old pinned value before writing the replacement. The replacement remains alive until the pinned box leaves scope.', zh: 'Pin::set 会先析构原固定值，再写入替代值。新值会一直存活到固定 Box 离开作用域。' }
    difficulty: intermediate
    tags: [pin, drop, predict-output]

  - id: pointer-handle-versus-pointee
    type: mcq
    prompt: { en: 'What happens when a Pin<Box<T>> binding is moved to another variable?', zh: '把 Pin<Box<T>> 绑定移动到另一个变量时会发生什么？' }
    options:
      - { text: { en: 'The pointer handle moves, while the T in the Box allocation stays at its address.', zh: '指针句柄发生移动，而 Box 分配中的 T 保持原地址。' }, correct: true }
      - { text: { en: 'Both the handle and T are copied byte for byte to new addresses.', zh: '句柄与 T 都按字节复制到新地址。' }, correct: false }
      - { text: { en: 'The assignment is rejected whenever T is !Unpin.', zh: '只要 T 是 !Unpin，赋值就会被拒绝。' }, correct: false }
      - { text: { en: 'T is dropped before the new binding is initialized.', zh: '初始化新绑定前会先析构 T。' }, correct: false }
    explanation: { en: 'Pin constrains movement of the pointee through the pointer, not movement of the owning pointer value. Box keeps its allocation stable when its handle moves.', zh: 'Pin 限制的是通过指针移动目标值，不限制拥有型指针自身移动。Box 句柄移动时，其分配保持稳定。' }
    difficulty: intermediate
    tags: [pin, box, move-semantics]

  - id: spotbug-self-reference-before-pin
    title: { en: 'Spot the bug in the Ticket self-reference', zh: '找出 Ticket 自引用里的 bug' }
    type: spotbug
    prompt: { en: 'Find why this constructor does not establish a valid self-reference.', zh: '找出这个构造器为何没有建立有效的自引用。' }
    code: |
      use std::marker::PhantomPinned;
      use std::pin::Pin;
      use std::ptr;

      struct Ticket {
          label: String,
          label_ptr: *const String,
          _pin: PhantomPinned,
      }

      impl Ticket {
          fn new(label: String) -> Pin<Box<Self>> {
              let mut ticket = Self { label, label_ptr: ptr::null(), _pin: PhantomPinned };
              ticket.label_ptr = &ticket.label;
              Box::pin(ticket)
          }
      }
    lang: rust
    issues:
      - line: 15
        kind: correctness
        note: { en: 'Box::pin moves ticket after label_ptr captured its stack address, so the stored pointer does not point into the final allocation.', zh: 'label_ptr 记录栈地址后，Box::pin 又移动了 ticket，因此保存的指针没有指向最终分配。' }
    explanation: { en: 'Call Box::pin while the pointer is null, then initialize label_ptr through a carefully justified get_unchecked_mut call. The address-dependent state must begin only after pinning.', zh: '应在指针为空时先调用 Box::pin，再通过理由充分的 get_unchecked_mut 初始化 label_ptr。依赖地址的状态只能在固定之后开始。' }
    difficulty: advanced
    tags: [self-reference, construction, raw-pointer]

  - id: future-poll-pin
    type: mcq
    prompt: { en: 'Why does Future::poll receive self as Pin<&mut Self>?', zh: 'Future::poll 为什么用 Pin<&mut Self> 接收 self？' }
    options:
      - { text: { en: 'It lets any future implementation rely on address stability between polls, including implementations with address-sensitive state.', zh: '它让所有 future 实现都能依赖轮询之间的地址稳定性，包括具有地址敏感状态的实现。' }, correct: true }
      - { text: { en: 'Every future is always self-referential and heap allocated.', zh: '每个 future 都必然自引用并分配在堆上。' }, correct: false }
      - { text: { en: 'Pin automatically wakes a pending future.', zh: 'Pin 会自动唤醒处于 pending 状态的 future。' }, correct: false }
      - { text: { en: 'The receiver makes every future implement Unpin.', zh: '该接收者会让每个 future 实现 Unpin。' }, correct: false }
    explanation: { en: 'The trait exposes one contract that supports both Unpin futures and address-sensitive futures. Waking, cancellation, and allocation are separate concerns.', zh: '这个 trait 用统一契约同时支持 Unpin future 与地址敏感 future。唤醒、取消和分配是彼此独立的问题。' }
    difficulty: intermediate
    tags: [future, poll, pin]

  - id: review-generated-pinned-job
    type: review
    title: { en: 'Review a generated pinned job', zh: '审查生成的固定任务' }
    prompt: { en: 'Review this generated address-sensitive job type.', zh: '审查这个生成的地址敏感任务类型。' }
    task: { en: 'Keep payload_ptr pointing to payload after construction, permit appending without exposing a movable field reference, preserve pinning through destruction, and produce no output on drop.', zh: '构造后让 payload_ptr 始终指向 payload；允许追加内容但不暴露可移动字段引用；析构期间保持固定保证；析构时不得输出。' }
    code: |
      use std::marker::PhantomPinned;
      use std::pin::Pin;
      struct Job {
          payload: String,
          payload_ptr: *const String,
          _pin: PhantomPinned,
      }
      impl Job {
          fn new(payload: String) -> Pin<Box<Self>> {
              let mut job = Self { payload, payload_ptr: std::ptr::null(), _pin: PhantomPinned };
              job.payload_ptr = &job.payload;
              Box::pin(job)
          }
          fn payload_mut(self: Pin<&mut Self>) -> &mut String {
              unsafe { &mut self.get_unchecked_mut().payload }
          }
      }
      impl Drop for Job {
          fn drop(&mut self) {
              let _saved = std::mem::take(&mut self.payload);
              println!("dropping job");
          }
      }
    lang: rust
    right: { en: 'The type includes PhantomPinned and returns an owning pinned pointer, so the intended public ownership boundary is visible.', zh: '该类型包含 PhantomPinned，并返回拥有型固定指针，因此预期的公开所有权边界清晰可见。' }
    issues:
      - line: 11
        kind: correctness
        note: { en: 'payload_ptr records an address before Box::pin moves Job into its allocation, leaving a stale pointer.', zh: 'payload_ptr 在 Box::pin 把 Job 移入分配前记录地址，因此会留下失效指针。' }
      - line: 15
        kind: security
        note: { en: 'This safe method leaks &mut String from unchecked access, allowing callers to replace or take a field whose address the invariant exposes.', zh: '这个安全方法通过未检查访问泄漏 &mut String，使调用方能够替换或取走不变量所暴露地址对应的字段。' }
      - line: 20
        kind: edge-case
        note: { en: 'Drop moves payload out with mem::take while payload_ptr may still be used by address-sensitive destruction logic.', zh: 'Drop 用 mem::take 移出 payload，但地址敏感的析构逻辑此时仍可能使用 payload_ptr。' }
      - line: 21
        kind: readability
        note: { en: 'A low-level destructor unexpectedly writes to stdout, violating the requested side-effect boundary and coupling callers to one reporting policy.', zh: '底层析构函数意外写入标准输出，违反副作用边界，并把调用方绑定到一种报告策略。' }
    checklist:
      - { en: 'Pin the allocation before initializing any internal pointer.', zh: '初始化任何内部指针前先固定分配。' }
      - { en: 'Expose operations, not ordinary mutable references to structurally pinned fields.', zh: '公开操作，不要公开指向结构性固定字段的普通可变引用。' }
      - { en: 'Audit Drop and panic cleanup for moves and partially initialized state.', zh: '审查 Drop 与 panic 清理中的移动和部分初始化状态。' }
      - { en: 'Keep logging and reporting outside destructors unless the contract requires it.', zh: '除非契约明确要求，否则把日志与报告放在析构函数之外。' }
    explanation: { en: 'Pin first, initialize payload_ptr through a narrow unsafe block, expose an append method that never moves payload, and leave payload in place throughout a silent Drop implementation.', zh: '应先固定，再通过狭窄的 unsafe 区域初始化 payload_ptr；公开不会移动 payload 的追加方法，并让 payload 在无输出的 Drop 全程留在原位。' }
    difficulty: advanced
    minutes: 8
    tags: [pin, self-reference, code-review, unsafe]
