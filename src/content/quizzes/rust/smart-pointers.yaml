topic: rust/smart-pointers
items:
  - id: predict-drop-order
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      struct Trace(&'static str);

      impl Drop for Trace {
          fn drop(&mut self) {
              println!("drop {}", self.0);
          }
      }

      fn main() {
          let first = Trace("first");
          {
              let second = Trace("second");
              println!("inside");
          }
          println!("outside");
      }
    lang: rust
    options:
      - { text: { en: 'inside / drop second / outside / drop first', zh: 'inside / drop second / outside / drop first' }, correct: true }
      - { text: { en: 'inside / outside / drop first / drop second', zh: 'inside / outside / drop first / drop second' }, correct: false }
      - { text: { en: 'drop second / inside / outside / drop first', zh: 'drop second / inside / outside / drop first' }, correct: false }
      - { text: { en: 'It fails because Drop values cannot use nested scopes.', zh: '编译失败，因为实现Drop的值不能使用嵌套作用域。' }, correct: false }
    explanation: { en: 'second is destroyed when its inner scope ends. first remains alive until the end of main.', zh: 'second在内部作用域结束时析构；first会一直存活到main结束。' }
    difficulty: beginner
    tags: [drop, scope, predict-output]

  - id: predict-weak-lifetime
    type: predict
    prompt: { en: 'Which pair of values does this program print?', zh: '这段程序会输出哪一对值？' }
    code: |
      use std::rc::Rc;

      fn main() {
          let owner = Rc::new(String::from("ready"));
          let weak = Rc::downgrade(&owner);
          let other = Rc::clone(&owner);
          drop(owner);
          println!("{}", weak.upgrade().is_some());
          drop(other);
          println!("{}", weak.upgrade().is_some());
      }
    lang: rust
    options:
      - { text: { en: 'true, false', zh: 'true，false' }, correct: true }
      - { text: { en: 'false, false', zh: 'false，false' }, correct: false }
      - { text: { en: 'true, true', zh: 'true，true' }, correct: false }
      - { text: { en: 'It panics on the second upgrade.', zh: '第二次upgrade时程序panic。' }, correct: false }
    explanation: { en: 'other remains a strong owner after owner is dropped, so the first upgrade succeeds. Once other is dropped, no strong owner remains and upgrade returns None.', zh: 'owner被丢弃后，other仍是强所有者，因此第一次升级成功。other也被丢弃后不再有强所有者，upgrade返回None。' }
    difficulty: beginner
    tags: [rc, weak, reference-counting]

  - id: deref-does-not-transfer-ownership
    type: mcq
    prompt: { en: 'A function accepts &str and receives &Box<String> through deref coercion. What happens to ownership?', zh: '函数接收 &str，并通过解引用强制转换传入 &Box<String>。所有权会怎样变化？' }
    options:
      - { text: { en: 'The function borrows the string; the caller keeps ownership of the Box.', zh: '函数借用字符串，调用方继续拥有Box。' }, correct: true }
      - { text: { en: 'The String moves out of the Box and into the function.', zh: 'String从Box中移出并进入函数。' }, correct: false }
      - { text: { en: 'The Box is cloned and a reference count is incremented.', zh: 'Box被克隆，同时引用计数增加。' }, correct: false }
      - { text: { en: 'The heap allocation is converted into static storage.', zh: '堆分配被转换成静态存储。' }, correct: false }
    explanation: { en: 'Deref coercion transforms references along Deref implementations. It neither moves the owner nor creates another owning handle.', zh: '解引用强制转换沿Deref实现转换引用；它既不移动所有者，也不创建新的拥有句柄。' }
    difficulty: intermediate
    tags: [deref, borrowing, ownership]

  - id: spotbug-strong-back-edge
    title: { en: 'Spot the bug in the Rc node graph', zh: '找出Rc节点图里的bug' }
    type: spotbug
    prompt: { en: 'Find why these nodes can remain allocated after external handles are dropped.', zh: '找出外部句柄被丢弃后这些节点仍可能保留分配的原因。' }
    code: |
      use std::cell::RefCell;
      use std::rc::Rc;

      struct Node {
          parent: RefCell<Option<Rc<Node>>>,
          children: RefCell<Vec<Rc<Node>>>,
      }

      fn attach(parent: &Rc<Node>, child: &Rc<Node>) {
          *child.parent.borrow_mut() = Some(Rc::clone(parent));
          parent.children.borrow_mut().push(Rc::clone(child));
      }
    lang: rust
    issues:
      - line: 10
        kind: correctness
        note: { en: 'The child strongly owns its parent while the parent strongly owns the child, creating a cycle whose strong counts never reach zero.', zh: '子节点强拥有父节点，同时父节点强拥有子节点，形成强计数永远无法归零的环。' }
    explanation: { en: 'Store the parent link as Weak<Node> and assign Rc::downgrade(parent). Upward navigation then requires upgrade but does not extend the parent lifetime.', zh: '应把父链接存为Weak<Node>，并赋值Rc::downgrade(parent)。向上访问需要upgrade，但不会延长父节点生命周期。' }
    difficulty: intermediate
    tags: [rc, weak, strong-reference-cycle]

  - id: review-generated-secret-wrapper
    type: review
    title: { en: 'Review a generated secret wrapper', zh: '审查生成的机密包装器' }
    prompt: { en: 'Review this generated smart-pointer-like wrapper against its contract.', zh: '根据契约审查这个生成的智能指针式包装器。' }
    task: { en: 'Own one API token, expose only an explicit prefix check, avoid extra token copies and leaks, and never log the token during cleanup.', zh: '拥有一个API token，只提供显式的前缀检查，不额外复制或泄漏token，并且清理时绝不记录token。' }
    code: |
      use std::ops::Deref;

      #[derive(Clone)]
      struct SecretBox(String);

      impl Deref for SecretBox {
          type Target = str;

          fn deref(&self) -> &Self::Target {
              &self.0
          }
      }

      impl Drop for SecretBox {
          fn drop(&mut self) {
              println!("dropping {}", self.0);
          }
      }

      fn main() {
          let secret = SecretBox(String::from("live_sk_123"));
          let backup = secret.clone();
          println!("accepted: {}", secret.starts_with("live_"));
          std::mem::forget(backup);
      }
    lang: rust
    right: { en: 'The wrapper owns its String, keeps storage private, and centralizes fallback cleanup in a Drop implementation.', zh: '包装器拥有内部String，把存储保持为私有，并通过Drop实现集中处理兜底清理。' }
    issues:
      - line: 6
        kind: readability
        note: { en: 'Deref exposes the complete str API implicitly, although the contract permits only one explicit prefix-check operation.', zh: 'Deref隐式暴露了完整的str API，但契约只允许一个显式的前缀检查操作。' }
      - line: 16
        kind: security
        note: { en: 'The destructor writes the API token to standard output, leaking a secret during routine cleanup.', zh: '析构函数把API token写到标准输出，会在常规清理期间泄漏机密。' }
      - line: 22
        kind: performance
        note: { en: 'Cloning the wrapper allocates and copies the token even though the task requires a single owned copy.', zh: '克隆包装器会分配并复制token，但任务要求只保留一份拥有型副本。' }
      - line: 24
        kind: correctness
        note: { en: 'forget deliberately skips Drop and leaks the backup allocation, violating both cleanup and no-leak requirements.', zh: 'forget会故意跳过Drop并泄漏备份分配，违反清理与不得泄漏两项要求。' }
    checklist:
      - { en: 'Expose only named domain operations instead of an unrestricted Deref target.', zh: '只公开具名领域操作，不要暴露不受限制的Deref目标。' }
      - { en: 'Trace every clone and prove whether it copies the inner secret.', zh: '跟踪每次clone，并确认它是否复制内部机密。' }
      - { en: 'Check logs and panic messages on every cleanup path.', zh: '检查每条清理路径中的日志与panic消息。' }
      - { en: 'Exercise normal scope exit and explicit early drop without forget.', zh: '测试普通作用域退出与显式提前drop，不使用forget。' }
    explanation: { en: 'Remove Clone and Deref, add a named prefix-check method, keep Drop free of secret output, and let the sole owner follow ordinary destruction.', zh: '应删除Clone与Deref，增加具名的前缀检查方法，禁止Drop输出机密，并让唯一所有者按普通析构流程结束。' }
    difficulty: advanced
    minutes: 8
    tags: [code-review, deref, drop, secret-handling]
