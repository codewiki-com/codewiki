topic: rust/strings
items:
  - id: predict-utf8-units
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      fn main() {
          let word = "é中";

          println!("{} {}", word.len(), word.chars().count());
          println!("{:?}", word.get(0..2));
          println!("{:?}", word.get(1..2));
      }
    lang: rust
    options:
      - { text: { en: "5 2\nSome(\"é\")\nNone", zh: "5 2\nSome(\"é\")\nNone" }, correct: true }
      - { text: { en: "2 2\nSome(\"é\")\nSome(\"é\")", zh: "2 2\nSome(\"é\")\nSome(\"é\")" }, correct: false }
      - { text: { en: "5 5\nSome(\"é\")\nNone", zh: "5 5\nSome(\"é\")\nNone" }, correct: false }
      - { text: { en: 'It panics on get(1..2).', zh: '程序会在 get(1..2) 处 panic。' }, correct: false }
    explanation: { en: 'The text has five UTF-8 bytes and two scalar values. Range 0..2 encloses é, while 1 starts inside its encoding; get reports the bad boundary as None instead of panicking.', zh: '这段文本含 5 个 UTF-8 字节和 2 个标量值。范围 0..2 正好包含 é，而 1 落在它的编码内部；get 会用 None 报告非法边界，不会 panic。' }
    difficulty: beginner
    tags: [utf-8, byte-boundary, predict-output]

  - id: choose-borrowed-parameter
    type: mcq
    prompt: { en: 'A function only searches text during the call and stores nothing. Which ordinary parameter type states that contract most directly?', zh: '函数只在调用期间搜索文本，不保存任何内容。哪种普通参数类型最直接地表达这个契约？' }
    options:
      - { text: { en: '&str', zh: '&str' }, correct: true }
      - { text: { en: 'String', zh: 'String' }, correct: false }
      - { text: { en: '&mut String', zh: '&mut String' }, correct: false }
      - { text: { en: 'Vec<char>', zh: 'Vec<char>' }, correct: false }
    explanation: { en: '&str borrows any valid string slice for the call and accepts literals or views into String values without transferring ownership.', zh: '&str 在调用期间借用有效字符串切片，既能接收字面量，也能接收 String 的视图，而且不会转移所有权。' }
    difficulty: beginner
    tags: [str, borrowing, api-design]

  - id: spotbug-byte-prefix
    title: { en: 'Spot the bug in the UTF-8 prefix', zh: '找出 UTF-8 前缀里的 bug' }
    type: spotbug
    prompt: { en: 'Find why this apparently bounded prefix helper can panic.', zh: '找出这个看似限制了范围的前缀函数为何仍可能 panic。' }
    code: |
      fn prefix(text: &str, max_bytes: usize) -> &str {
          &text[..max_bytes.min(text.len())]
      }

      fn main() {
          println!("{}", prefix("用户", 4));
      }
    lang: rust
    issues:
      - line: 2
        kind: edge-case
        note: { en: 'min prevents an out-of-bounds endpoint but does not make byte 4 a UTF-8 character boundary; it lies inside 户, so slicing panics.', zh: 'min 只防止端点越界，不会让字节 4 自动成为 UTF-8 字符边界；它落在“户”的编码内部，因此切片会 panic。' }
    explanation: { en: 'Use text.get(..end) when the contract is byte-based and invalid boundaries are errors. If the contract counts scalars or graphemes, iterate that unit to find the corresponding byte endpoint.', zh: '契约按字节定义时，可使用 text.get(..end) 并把非法边界作为错误处理；契约按标量值或字素簇定义时，应先迭代相应单位，找出对应的字节端点。' }
    difficulty: intermediate
    tags: [spot-bug, slicing, panic, utf-8]

  - id: distinguish-grapheme-clusters
    type: mcq
    prompt: { en: 'Which statement about Rust string units is correct?', zh: '关于 Rust 字符串单位，哪项说法正确？' }
    options:
      - { text: { en: 'chars() iterates Unicode scalar values, which may not match user-visible characters.', zh: 'chars() 迭代 Unicode 标量值，它们不一定等同于用户看到的字符。' }, correct: true }
      - { text: { en: 'len() returns the number of Unicode scalar values.', zh: 'len() 返回 Unicode 标量值数量。' }, correct: false }
      - { text: { en: 'Every grapheme cluster occupies one char.', zh: '每个字素簇都只占一个 char。' }, correct: false }
      - { text: { en: 'UTF-8 normalization happens when a String is created.', zh: '创建 String 时会自动执行 UTF-8 规范化。' }, correct: false }
    explanation: { en: 'Rust char values are Unicode scalar values. A displayed grapheme can contain several of them, and String validates UTF-8 without normalizing canonically equivalent sequences.', zh: 'Rust 的 char 表示 Unicode 标量值。一个显示字素可能包含多个标量值；String 会验证 UTF-8，但不会规范化语义等价的序列。' }
    difficulty: intermediate
    tags: [unicode, scalar-value, grapheme-cluster]

  - id: review-generated-name-summary
    title: { en: 'Review generated name summary', zh: '审查生成的姓名汇总' }
    type: review
    prompt: { en: 'Review this generated display-name summarizer.', zh: '审查这个生成的显示名称摘要函数。' }
    task: { en: 'Trim comma-separated names, reject the first empty field, limit each name to max_chars Unicode scalar values without panicking, preserve order, and produce no output.', zh: '修剪逗号分隔的名称，遇到第一个空字段时返回错误；按 Unicode 标量值把每个名称限制为 max_chars，不能 panic；保留顺序且不产生输出。' }
    code: |
      fn summarize_names(input: &str, max_chars: usize) -> String {
          let mut result = String::new();

          for raw in input.split(',') {
              let mut name = raw.trim().to_string();
              if name.len() > max_chars {
                  name.truncate(max_chars);
              }

              if name.is_empty() {
                  continue;
              }

              if !result.is_empty() {
                  result.push_str(", ");
              }

              println!("adding {name}");
              result.push_str(&name);
          }

          result
      }
    lang: rust
    right: { en: 'The code trims surrounding whitespace, preserves the order of accepted fields, reuses one result buffer, and inserts separators only between names.', zh: '代码会修剪两端空白，保留已接收字段的顺序，复用同一个结果缓冲区，并且只在名称之间插入分隔符。' }
    issues:
      - line: 7
        kind: edge-case
        note: { en: 'len and truncate use bytes, not Unicode scalar values. A max_chars endpoint inside a multibyte scalar makes truncate panic, and other inputs are limited in the wrong unit.', zh: 'len 与 truncate 按字节而不是 Unicode 标量值工作。max_chars 若落在多字节标量值内部，truncate 会 panic；其他输入的限制单位也不符合任务。' }
      - line: 11
        kind: correctness
        note: { en: 'The task requires rejecting the first empty field, but continue silently drops it and lets later fields produce apparent success.', zh: '任务要求遇到第一个空字段时返回错误，但 continue 会静默丢弃它，并让后续字段产生看似成功的结果。' }
      - line: 5
        kind: performance
        note: { en: 'Every field is allocated as a String before the code knows whether truncation is needed; a boundary found through char_indices can keep unchanged fields borrowed.', zh: '代码还不知道是否需要截断，就为每个字段分配 String；通过 char_indices 找到边界后，未改动的字段可以继续保持借用。' }
      - line: 18
        kind: readability
        note: { en: 'A pure summarizer unexpectedly writes to stdout, which makes the helper noisy and harder to reuse or test.', zh: '摘要函数意外写入标准输出，产生了调用方没有要求的噪声，也更难复用和测试。' }
    checklist:
      - { en: 'Test empty input, empty middle fields, max_chars zero, ASCII, multibyte scalars, and combining sequences.', zh: '测试空输入、中间空字段、max_chars 为零、ASCII、多字节标量值和组合序列。' }
      - { en: 'Label every count and boundary as bytes, scalar values, or grapheme clusters.', zh: '把每个计数和边界明确标为字节、标量值或字素簇。' }
      - { en: 'Trace the first error and verify that no later field is accepted after it.', zh: '跟踪第一个错误，并确认之后的字段不会再被接收。' }
      - { en: 'Count allocations and check stdout or logging side effects.', zh: '计算分配次数，并检查标准输出或日志副作用。' }
    explanation: { en: 'Return Result<String, E>, stop on an empty trimmed field, and locate the max_chars endpoint with char_indices before borrowing or copying the valid prefix. Build the final String once and remove the print.', zh: '应返回 Result<String, E>，在修剪后字段为空时立即停止，并通过 char_indices 找到 max_chars 对应端点，再借用或复制有效前缀；最终 String 只构建一次，同时删除打印。' }
    difficulty: advanced
    tags: [code-review, unicode, ownership, allocation]
