topic: typescript/utility-types
items:
  - id: predict-readonly-depth
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      interface QueueState {
        jobs: string[];
      }

      const state: Readonly<QueueState> = { jobs: ["draft"] };
      state.jobs.push("send");
      console.log(state.jobs.join(","));
    lang: typescript
    options:
      - { text: { en: 'draft,send', zh: 'draft,send' }, correct: true }
      - { text: { en: 'draft', zh: 'draft' }, correct: false }
      - { text: { en: 'It fails to compile because every nested value is read-only.', zh: '编译失败，因为每个嵌套值都只读。' }, correct: false }
      - { text: { en: 'It throws a TypeError at push.', zh: '执行push时抛出TypeError。' }, correct: false }
    explanation: { en: 'Readonly changes only the jobs property, not the mutable array type stored in it. No runtime freeze is emitted, so push succeeds.', zh: 'Readonly只改变jobs属性，没有改变其中可变数组的类型。编译结果也不会执行运行时冻结，因此push成功。' }
    difficulty: beginner
    tags: [readonly, shallow-transformation, runtime]
    minutes: 3

  - id: omit-is-not-redaction
    type: mcq
    prompt: { en: 'A function returns an existing Account object under the type Omit<Account, "passwordHash">. Which claim is correct?', zh: '函数把现有Account对象以Omit<Account, "passwordHash">类型返回。哪项说法正确？' }
    options:
      - { text: { en: 'The runtime object can still contain passwordHash.', zh: '运行时对象仍可能包含passwordHash。' }, correct: true }
      - { text: { en: 'TypeScript deletes passwordHash during emission.', zh: 'TypeScript会在生成代码时删除passwordHash。' }, correct: false }
      - { text: { en: 'The assignment always fails because extra properties are forbidden.', zh: '赋值一定失败，因为额外属性始终被禁止。' }, correct: false }
      - { text: { en: 'Omit replaces passwordHash with undefined.', zh: 'Omit会把passwordHash替换为undefined。' }, correct: false }
    explanation: { en: 'Omit removes a required property from a static shape; it performs no runtime projection. Construct an allowlisted object when data must actually be removed.', zh: 'Omit只从静态结构中去掉一项属性要求，不执行运行时投影。必须真正删除数据时，应按允许列表构造新对象。' }
    difficulty: intermediate
    tags: [omit, type-erasure, security]
    minutes: 3

  - id: spotbug-public-account
    title: { en: 'Spot the bug in PublicAccount', zh: '找出公共账户类型里的bug' }
    type: spotbug
    prompt: { en: 'Find why this public-account helper does not redact the password hash.', zh: '找出这个公开账户辅助函数没有脱敏密码哈希的原因。' }
    code: |
      interface Account {
        id: string;
        displayName: string;
        passwordHash: string;
      }
      type PublicAccount = Omit<Account, "passwordHash">;

      function toPublic(account: Account): PublicAccount {
        return account;
      }

      console.log(JSON.stringify(toPublic({
        id: "a-1", displayName: "Mina", passwordHash: "secret"
      })));
    lang: typescript
    issues:
      - line: 9
        kind: security
        note: { en: 'Structural assignability lets the complete object satisfy PublicAccount, so returning account leaves passwordHash on the serialized runtime value.', zh: '结构可赋值关系允许完整对象满足PublicAccount，因此直接返回account会让序列化后的运行时值仍含passwordHash。' }
    explanation: { en: 'Build a fresh object from id and displayName, then test the serialized payload. A return type can hide a property from typed access but cannot remove it.', zh: '应使用id和displayName构造新对象，再测试序列化载荷。返回类型可以对类型化访问隐藏属性，却无法删除它。' }
    difficulty: intermediate
    tags: [omit, structural-typing, data-redaction]
    minutes: 5

  - id: exact-optional-semantics
    type: mcq
    prompt: { en: 'Why enable exactOptionalPropertyTypes for a patch type built with Partial?', zh: '为什么应为使用Partial构造的补丁类型启用exactOptionalPropertyTypes？' }
    options:
      - { text: { en: 'It distinguishes an absent optional property from assigning undefined unless undefined is explicitly allowed.', zh: '它区分可选属性缺省与赋值undefined，除非值类型明确允许undefined。' }, correct: true }
      - { text: { en: 'It makes Partial recursively optional.', zh: '它会让Partial递归地把属性变为可选。' }, correct: false }
      - { text: { en: 'It rejects every empty patch object.', zh: '它会拒绝所有空补丁对象。' }, correct: false }
      - { text: { en: 'It validates the patch after JSON.parse.', zh: '它会在JSON.parse后验证补丁。' }, correct: false }
    explanation: { en: 'The option gives optional properties absence-oriented assignment semantics. It neither changes Partial depth nor adds runtime validation.', zh: '该选项让可选属性的赋值语义更接近缺省。它既不会改变Partial的深度，也不会增加运行时验证。' }
    difficulty: intermediate
    tags: [partial, exact-optional-property-types, patch]
    minutes: 4

  - id: review-generated-account-update
    type: review
    title: { en: 'Review a generated account update boundary', zh: '审查生成的账户更新边界' }
    prompt: { en: 'Review this generated update, projection, and handler code before it serves account requests.', zh: '在这段生成的更新、投影与处理器代码用于账户请求前，对它进行审查。' }
    task: { en: 'Allow only displayName and nested timezone updates, preserve the existing theme, remove passwordHash from runtime responses, and report unknown handler names.', zh: '只允许更新displayName与嵌套timezone，保留现有theme，从运行时响应中删除passwordHash，并报告未知处理器名称。' }
    code: |
      interface Account {
        id: string;
        displayName: string;
        role: "user" | "admin";
        passwordHash: string;
        preferences: { theme: "light" | "dark"; timezone: string };
      }
      type AccountPatch = Partial<Account>;
      function applyPatch(current: Account, patch: AccountPatch): Account {
        return { ...current, ...patch };
      }

      function publicAccount(account: Account): Omit<Account, "passwordHash"> {
        return account;
      }

      type Handler = (account: Account) => string;
      const handlers: Record<string, Handler> = {
        summary: (account) => account.displayName,
      };

      function runHandler(name: string, account: Account): string {
        return handlers[name](account);
      }
    lang: typescript
    right: { en: 'The code names its account shape, separates update, projection, and dispatch functions, uses immutable top-level spread, and declares public return types.', zh: '代码命名了账户结构，分开了更新、投影和分发函数，使用不可变的第一层展开，并声明了公开返回类型。' }
    checklist:
      - { en: 'Derive update inputs from an explicit field allowlist, not the persistence entity.', zh: '从明确的字段允许列表派生更新输入，不要直接使用持久化实体。' }
      - { en: 'Define and test nested merge semantics for preferences.', zh: '定义并测试preferences的嵌套合并语义。' }
      - { en: 'Inspect the serialized response for secret fields.', zh: '检查序列化响应中是否存在秘密字段。' }
      - { en: 'Test an unknown handler key under noUncheckedIndexedAccess.', zh: '在noUncheckedIndexedAccess下测试未知处理器键。' }
    issues:
      - line: 8
        kind: readability
        note: { en: 'Partial<Account> obscures the update policy and exposes id, role, passwordHash, and the entire preferences object as writable input.', zh: 'Partial<Account>隐藏了更新策略，还把id、role、passwordHash与整个preferences对象都暴露为可写输入。' }
      - line: 10
        kind: edge-case
        note: { en: 'The shallow spread replaces preferences wholesale, so a timezone-only runtime patch can discard the existing theme instead of preserving it.', zh: '浅层展开会整体替换preferences，因此运行时仅含timezone的补丁可能丢失现有theme，而不是保留它。' }
      - line: 14
        kind: security
        note: { en: 'Returning the original object does not remove passwordHash at runtime even though Omit hides it from the return type.', zh: '直接返回原对象不会在运行时删除passwordHash，即使Omit已从返回类型中隐藏它。' }
      - line: 23
        kind: correctness
        note: { en: 'Record<string, Handler> overstates arbitrary lookup safety; an unknown name produces undefined and the call throws.', zh: 'Record<string, Handler>夸大了任意查找的安全性；未知名称会得到undefined，调用随即抛错。' }
    explanation: { en: 'Use a Pick-based allowlist plus an explicit nested patch, merge preferences deliberately, construct the public response from allowed fields, and model open handler lookup as possibly missing.', zh: '应使用基于Pick的允许列表与明确的嵌套补丁，有意合并preferences，按允许字段构造公开响应，并把开放处理器查找建模为可能缺失。' }
    difficulty: advanced
    tags: [code-review, utility-types, runtime-boundary, security]
    minutes: 12
