topic: typescript/enums
items:
  - id: predict-numeric-reverse-mapping
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      enum ResultCode {
        Ok = 0,
        Retry = 2,
      }

      console.log(ResultCode[2], Object.keys(ResultCode).length);
    lang: typescript
    options:
      - { text: { en: 'Retry 4', zh: 'Retry 4' }, correct: true }
      - { text: { en: 'Retry 2', zh: 'Retry 2' }, correct: false }
      - { text: { en: '2 4', zh: '2 4' }, correct: false }
      - { text: { en: 'undefined 2', zh: 'undefined 2' }, correct: false }
    explanation: { en: 'The numeric enum emits two forward properties and two reverse properties. Looking up numeric key 2 returns the member name Retry.', zh: '数字枚举会输出两个正向属性和两个反向属性。查询数字键 2 会得到成员名 Retry。' }
    difficulty: beginner
    tags: [numeric-enum, reverse-mapping, runtime-object]
    tests: npx tsx result_code.ts
    minutes: 2

  - id: string-enum-member-identity
    type: mcq
    prompt: { en: 'Given enum Role { Admin = "ADMIN" }, which assignment type-checks without an assertion?', zh: '对于 enum Role { Admin = "ADMIN" }，哪个赋值无需断言即可通过类型检查？' }
    options:
      - { text: { en: 'const role: Role = Role.Admin;', zh: 'const role: Role = Role.Admin;' }, correct: true }
      - { text: { en: 'const role: Role = "ADMIN";', zh: 'const role: Role = "ADMIN";' }, correct: false }
      - { text: { en: 'const role: Role = "Admin";', zh: 'const role: Role = "Admin";' }, correct: false }
      - { text: { en: 'const role: Role = Object.keys(Role)[0];', zh: 'const role: Role = Object.keys(Role)[0];' }, correct: false }
    explanation: { en: 'A string enum member has member identity in the type system. Equal string text is not by itself assignable to the enum type.', zh: '字符串枚举成员在类型系统中具有成员身份。只有文本相同的字符串不能直接赋给该枚举类型。' }
    difficulty: beginner
    tags: [string-enum, enum-member-type, assignability]
    minutes: 2

  - id: enum-member-name-type
    type: mcq
    prompt: { en: 'Which type expression produces the source member names of an enum E?', zh: '哪个类型表达式会得到枚举 E 的源码成员名？' }
    options:
      - { text: { en: 'keyof typeof E', zh: 'keyof typeof E' }, correct: true }
      - { text: { en: 'keyof E', zh: 'keyof E' }, correct: false }
      - { text: { en: 'typeof keyof E', zh: 'typeof keyof E' }, correct: false }
      - { text: { en: 'E[keyof E]', zh: 'E[keyof E]' }, correct: false }
    explanation: { en: 'typeof E obtains the runtime enum object type, and keyof then extracts its member-name keys. The enum type E itself describes member values.', zh: 'typeof E 先取得运行时枚举对象的类型，keyof 再提取成员名称键。枚举类型 E 本身描述的是成员值。' }
    difficulty: intermediate
    tags: [keyof, typeof, enum-object]
    minutes: 2

  - id: spotbug-asserted-json-state
    type: spotbug
    prompt: { en: 'Find why this generated parser does not establish a valid State.', zh: '找出这段生成的解析器为什么不能证明 State 有效。' }
    code: |
      enum State {
        Ready = "READY",
        Done = "DONE",
      }

      interface Payload {
        state: State;
      }

      function readState(raw: string): State {
        const payload = JSON.parse(raw) as Payload;
        return payload.state;
      }
    lang: typescript
    issues:
      - line: 11
        kind: correctness
        note: { en: 'The assertion emits no shape or membership check, so missing state, null, or an arbitrary string can be returned as State.', zh: '这个断言不会生成结构或成员检查，因此缺少 state、值为 null 或任意字符串时都可能被当作 State 返回。' }
    explanation: { en: 'Parse into unknown, check for a non-null object, read the state field, and compare it with the runtime enum values before returning State.', zh: '应先把结果解析为 unknown，检查它是非空对象，再读取 state 字段，并与运行时枚举值比较后才返回 State。' }
    difficulty: intermediate
    tags: [runtime-validation, type-assertion, json]
    tests: npx tsc --strict --noEmit state_parser.ts
    minutes: 4

  - id: review-generated-session-enum
    type: review
    title: { en: 'Review a generated session helper', zh: '审查生成的会话辅助代码' }
    prompt: { en: 'Review this generated session and role helper.', zh: '审查这段生成的会话与角色辅助代码。' }
    task: { en: 'Parse untrusted session JSON, accept only known roles and future finite expiry times, list serialized role values for a select control, and authorize deletion only for administrators.', zh: '解析不可信会话 JSON，只接受已知角色和未来的有限过期时间，为选择控件列出序列化角色值，并且只允许管理员执行删除。' }
    code: |
      enum AccessRole {
        Reader = "READER",
        Editor = "EDITOR",
        Admin = "ADMIN",
      }

      interface SessionPayload {
        role: AccessRole;
        expiresAt: number;
      }

      function parseSession(raw: string): SessionPayload {
        const session = JSON.parse(raw) as SessionPayload;
        return session;
      }

      function roleOptions(): string[] {
        return Object.keys(AccessRole);
      }

      function canDelete(role: AccessRole): boolean {
        return role !== AccessRole.Reader && role !== AccessRole.Editor;
      }
    lang: typescript
    right: { en: 'The enum uses stable readable wire values, the payload names its expected fields, and parsing, option construction, and authorization are separated into small functions.', zh: '枚举使用稳定且可读的线上值，载荷明确列出预期字段，解析、选项构造和授权也被拆成了小型函数。' }
    checklist:
      - { en: 'Keep parsed data unknown until object shape, role membership, and expiry constraints pass.', zh: '在对象结构、角色成员和过期约束全部通过前，让解析数据保持为 unknown。' }
      - { en: 'Test malformed JSON, null, missing fields, unknown roles, NaN-like values, and expired sessions.', zh: '测试错误 JSON、null、字段缺失、未知角色、类似 NaN 的值和已过期会话。' }
      - { en: 'Distinguish enum member names from serialized values when building UI options.', zh: '构建 UI 选项时区分枚举成员名称和序列化值。' }
      - { en: 'Keep authorization deny-by-default and test every current role.', zh: '让授权默认拒绝，并测试每个当前角色。' }
    issues:
      - line: 22
        kind: security
        note: { en: 'The exclusion check grants deletion to every value other than the two known non-admin roles, so an asserted attacker-controlled role is treated as an administrator.', zh: '排除式检查会允许除两个已知非管理员角色以外的所有值执行删除，因此经过断言的攻击者角色会被当作管理员。' }
      - line: 14
        kind: edge-case
        note: { en: 'The parser accepts missing, non-numeric, non-finite, and already expired expiresAt values even though the task requires a future finite timestamp.', zh: '解析器会接受缺失、非数字、非有限或已经过期的 expiresAt，但任务要求它必须是未来的有限时间戳。' }
      - line: 18
        kind: correctness
        note: { en: 'Object.keys returns Reader, Editor, and Admin, but the select control needs serialized values READER, EDITOR, and ADMIN.', zh: 'Object.keys 返回 Reader、Editor 和 Admin，但选择控件需要的是序列化值 READER、EDITOR 和 ADMIN。' }
      - line: 12
        kind: readability
        note: { en: 'The name parseSession suggests validation, while the implementation only parses and asserts; the contract and behavior disagree.', zh: 'parseSession 这个名称暗示会执行验证，但实现只解析并断言，契约与行为不一致。' }
    explanation: { en: 'Parse into unknown and validate the complete payload before constructing SessionPayload. Use Object.values for this string enum, and authorize with the positive condition role === AccessRole.Admin so unexpected values are denied.', zh: '应先解析为 unknown，完整验证载荷后再构造 SessionPayload。这个字符串枚举应使用 Object.values，并以 role === AccessRole.Admin 作为肯定式授权条件，让意外值默认被拒绝。' }
    difficulty: advanced
    tags: [code-review, enum-validation, authorization, external-data]
    tests: npx tsc --strict --noEmit session_enum.ts
    minutes: 10
