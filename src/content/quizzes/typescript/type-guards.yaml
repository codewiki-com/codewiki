topic: typescript/type-guards
items:
  - id: predict-truthiness-guard
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      function describe(value: string | number | undefined): string {
        if (!value) return "empty";
        return typeof value === "string"
          ? value.toUpperCase()
          : value.toFixed(0);
      }

      console.log(describe(0));
      console.log(describe(""));
      console.log(describe(3.6));
    lang: typescript
    options:
      - { text: { en: 'empty, empty, 4', zh: 'empty、empty、4' }, correct: true }
      - { text: { en: '0, an empty line, 4', zh: '0、一个空行、4' }, correct: false }
      - { text: { en: 'empty, empty, 3', zh: 'empty、empty、3' }, correct: false }
      - { text: { en: 'TypeScript rejects the truthiness check.', zh: 'TypeScript 会拒绝这个真值检查。' }, correct: false }
    explanation: { en: 'The truthiness guard treats both 0 and the empty string as falsy. The remaining number is rounded by toFixed(0), so 3.6 becomes the string 4.', zh: '真值守卫会把 0 和空字符串都视为假值。剩余数字由 toFixed(0) 舍入，因此 3.6 变成字符串 4。' }
    difficulty: beginner
    tags: [truthiness, typeof, predict-output]

  - id: predicate-false-branch
    type: mcq
    prompt: { en: 'Why is declaring isSmallNumber(value): value is number unsafe when it returns false for numbers outside -9 through 9?', zh: '如果 isSmallNumber(value): value is number 会对 -9 到 9 以外的数字返回 false，这个声明为什么不安全？' }
    options:
      - { text: { en: 'The false branch may still contain a number, but TypeScript can exclude number from the union.', zh: '假分支仍可能包含数字，但 TypeScript 会从联合中排除 number。' }, correct: true }
      - { text: { en: 'Type predicates are allowed only for object types.', zh: '类型谓词只能用于对象类型。' }, correct: false }
      - { text: { en: 'The compiler converts large numbers to strings in the false branch.', zh: '编译器会在假分支中把大数字转换成字符串。' }, correct: false }
      - { text: { en: 'A predicate must throw whenever it returns false.', zh: '谓词每次返回 false 时都必须抛出异常。' }, correct: false }
    explanation: { en: 'A type predicate describes both outcomes. If false does not mean “not a number,” callers can receive a number in code that the checker narrowed to string.', zh: '类型谓词同时描述真假两个结果。若 false 不等于“不是数字”，调用方就可能在检查器已收窄为 string 的代码中收到数字。' }
    difficulty: advanced
    tags: [type-predicate, false-branch, soundness]

  - id: spotbug-partial-profile-guard
    type: spotbug
    prompt: { en: 'Find why this guard can approve a value that later crashes.', zh: '找出这个守卫为何会放行一个随后导致崩溃的值。' }
    code: |
      type Profile = {
        name: string;
        roles: string[];
      };

      function isProfile(value: unknown): value is Profile {
        return (
          typeof value === "object" &&
          value !== null &&
          "name" in value
        );
      }

      function roleCount(value: unknown): number {
        if (!isProfile(value)) return 0;
        return value.roles.length;
      }
    lang: typescript
    issues:
      - line: 7
        lines: 5
        kind: correctness
        note: { en: 'The body checks only that name exists; it checks neither the name value nor the required roles array promised by Profile.', zh: '函数体只检查 name 存在，既没有检查 name 的值，也没有检查 Profile 承诺的必填 roles 数组。' }
      - line: 16
        kind: edge-case
        note: { en: 'An object such as { name: "Ada" } passes the guard, then reading roles.length throws.', zh: '像 { name: "Ada" } 这样的对象会通过守卫，随后读取 roles.length 时抛出异常。' }
    explanation: { en: 'A predicate signature is trusted, not derived from its body. The guard must verify name is a string and roles is an array whose every element is a string.', zh: '谓词签名会被直接信任，不是从函数体推导而来。守卫必须确认 name 是字符串，并确认 roles 是每个元素都为字符串的数组。' }
    difficulty: intermediate
    tags: [runtime-validation, object-shape, type-predicate]

  - id: in-operator-proof
    type: mcq
    prompt: { en: 'After checking "id" in value on a non-null object, what has been proved?', zh: '在非空对象上检查 "id" in value 后，代码证明了什么？' }
    options:
      - { text: { en: 'The property is found on the object or its prototype chain, but its value and ownership are not proved.', zh: '属性能在对象或其原型链上找到，但属性值和所有权仍未得到证明。' }, correct: true }
      - { text: { en: 'id is an own, nonempty string property.', zh: 'id 是对象自有的非空字符串属性。' }, correct: false }
      - { text: { en: 'The complete object now matches every field of the target interface.', zh: '完整对象现在符合目标接口的每个字段。' }, correct: false }
      - { text: { en: 'The check removes id from the object after the branch.', zh: '检查会在分支结束后从对象中删除 id。' }, correct: false }
    explanation: { en: 'The in operator tests property lookup, including inherited properties. Validate the value separately and use Object.hasOwn when ownership is part of the protocol.', zh: 'in 运算符测试属性查找，其中包含继承属性。属性值要另行验证；若协议要求自有属性，应使用 Object.hasOwn。' }
    difficulty: intermediate
    tags: [in-operator, own-property, runtime-validation]

  - id: review-generated-webhook-guard
    type: review
    prompt: { en: 'Review this generated webhook decoder before it handles production transfers.', zh: '在这个生成的 Webhook 解码器处理生产转账前，对它进行审查。' }
    task: { en: 'Accept an untrusted transfer webhook, validate its type, accountId, positive finite amount, and secret token, avoid exposing the token, and return invalid for malformed input.', zh: '接收不可信的转账 Webhook，验证 type、accountId、正的有限 amount 与 secret token，不泄露 token，并对损坏输入返回 invalid。' }
    code: |
      type Transfer = {
        type: "transfer";
        accountId: string;
        amount: number;
        token: string;
      };

      function isTransfer(value: unknown): value is Transfer {
        return (
          typeof value === "object" &&
          value !== null &&
          "type" in value
        );
      }

      function handleTransfer(raw: string): string {
        const value: unknown = JSON.parse(raw);
        if (!isTransfer(value)) return "invalid";
        console.log("webhook", JSON.stringify(value));
        return `${value.accountId}:${value.amount.toFixed(2)}`;
      }
    lang: typescript
    right: { en: 'The code accepts unknown at the guard, names the domain shape, gives the handler an explicit return type, and keeps field access after the guard.', zh: '代码让守卫接收 unknown，为领域结构命名，给处理函数写出显式返回类型，并把字段访问放在守卫之后。' }
    checklist:
      - { en: 'Test the container, discriminant, every required field, and every domain constraint.', zh: '检查容器、判别字段、每个必填字段和每项领域约束。' }
      - { en: 'Exercise malformed JSON, null, arrays, missing fields, wrong primitives, NaN-like values, and boundary numbers.', zh: '测试损坏 JSON、null、数组、缺字段、错原始类型、类似 NaN 的值和边界数字。' }
      - { en: 'Trace secrets and personal data through logs, errors, and returned strings.', zh: '跟踪秘密与个人数据是否进入日志、错误和返回字符串。' }
      - { en: 'Check both the runtime result and the static type received after the predicate.', zh: '同时检查运行时结果和谓词之后得到的静态类型。' }
    issues:
      - line: 9
        lines: 5
        kind: correctness
        note: { en: 'The predicate checks only for a type property but promises the literal discriminant, accountId, amount, and token, including constraints it never inspects.', zh: '谓词只检查 type 属性存在，却承诺了字面量判别值、accountId、amount 和 token，其中包含它从未检查的约束。' }
      - line: 17
        kind: edge-case
        note: { en: 'Malformed JSON throws before the function can return invalid, and the code also does not distinguish arrays from records.', zh: '损坏的 JSON 会在函数返回 invalid 前抛出异常，而且代码也没有区分数组与记录对象。' }
      - line: 19
        kind: security
        note: { en: 'Serializing the complete validated value writes the secret token to logs.', zh: '序列化完整的已验证值会把 secret token 写入日志。' }
    explanation: { en: 'Parse inside a controlled error path, validate a non-array record and every field, enforce a finite positive amount, compare the token without logging it, and log only an approved identifier.', zh: '应在受控错误路径中解析，验证非数组记录和每个字段，限制 amount 为正的有限数，比较 token 但不记录它，并且只记录获准的标识符。' }
    difficulty: advanced
    tags: [code-review, webhooks, secrets, type-predicate]
