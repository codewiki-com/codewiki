topic: typescript/advanced-types
items:
  - id: predict-success-values
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      type Result<Value> =
        | { ok: true; value: Value }
        | { ok: false; error: string };

      function values<Value>(items: Result<Value>[]): Value[] {
        return items.flatMap((item) => item.ok ? [item.value] : []);
      }

      const attempts: Result<number>[] = [
        { ok: false, error: "retry" },
        { ok: true, value: 12 },
      ];
      console.log(values(attempts).join(","));
    lang: typescript
    options:
      - { text: { en: 'retry,12', zh: 'retry,12' }, correct: false }
      - { text: { en: '12', zh: '12' }, correct: true }
      - { text: { en: 'true,12', zh: 'true,12' }, correct: false }
      - { text: { en: 'The type alias prints before the value.', zh: '类型别名会在值之前输出。' }, correct: false }
    explanation: { en: 'Type declarations are erased. At runtime, flatMap returns an empty array for the failed result and an array containing 12 for the successful result.', zh: '类型声明会被擦除。运行时，flatMap为失败结果返回空数组，为成功结果返回只含12的数组。' }
    difficulty: intermediate
    tags: [type-erasure, discriminated-union]

  - id: conditional-distribution
    type: mcq
    prompt: { en: 'Which conditional tests whether a union T as a whole is assignable to U?', zh: '哪个条件类型会判断整个联合类型T是否可赋给U？' }
    options:
      - { text: { en: 'T extends U ? true : false', zh: 'T extends U ? true : false' }, correct: false }
      - { text: { en: '[T] extends [U] ? true : false', zh: '[T] extends [U] ? true : false' }, correct: true }
      - { text: { en: 'keyof T extends U ? true : false', zh: 'keyof T extends U ? true : false' }, correct: false }
      - { text: { en: 'T[keyof T] extends U ? true : false', zh: 'T[keyof T] extends U ? true : false' }, correct: false }
    explanation: { en: 'Tuple wrapping keeps T from appearing as a naked checked type parameter, so the conditional does not distribute over union members.', zh: '元组包装让T不再作为裸类型参数出现在受检查位置，因此条件类型不会对联合成员分布。' }
    difficulty: advanced
    tags: [conditional-types, distribution]

  - id: mapped-then-indexed
    type: mcq
    prompt: { en: 'Why does { [K in keyof M]: { type: K; payload: M[K] } }[keyof M] preserve an event name-payload relationship?', zh: '为什么 { [K in keyof M]: { type: K; payload: M[K] } }[keyof M] 能保留事件名与载荷的关系？' }
    options:
      - { text: { en: 'It builds one complete object per key before collecting those objects into a union.', zh: '它先为每个键构造完整对象，再把这些对象合成联合。' }, correct: true }
      - { text: { en: 'Indexed access validates every payload at runtime.', zh: '索引访问会在运行时验证每个载荷。' }, correct: false }
      - { text: { en: 'Mapped types turn the result into a nominal type.', zh: '映射类型会把结果变成名义类型。' }, correct: false }
      - { text: { en: 'keyof keeps only the first key in M.', zh: 'keyof只会保留M中的第一个键。' }, correct: false }
    explanation: { en: 'Each mapped member uses the same K for both fields. Indexing afterward yields a discriminated union of those correlated members.', zh: '每个映射成员的两个字段都使用同一个K。随后索引会得到由这些相关成员组成的可辨识联合。' }
    difficulty: advanced
    tags: [mapped-types, indexed-access, correlation]

  - id: spotbug-unbounded-deep-readonly
    title: { en: 'Spot the bug in DeepReadonly', zh: '找出深度只读类型里的bug' }
    type: spotbug
    prompt: { en: 'Find the unsupported object cases in this generated DeepReadonly utility.', zh: '找出这个生成的DeepReadonly工具没有正确支持的对象类型。' }
    code: |
      type DeepReadonly<Value> = Value extends object
        ? { readonly [Key in keyof Value]: DeepReadonly<Value[Key]> }
        : Value;

      type Settings = {
        updatedAt: Date;
        onChange: (theme: string) => void;
        tags: string[];
      };

      declare const settings: DeepReadonly<Settings>;
      settings.onChange("dark");
      console.log(settings.updatedAt.getTime());
    lang: typescript
    issues:
      - line: 12
        kind: correctness
        note: { en: 'Mapping over a function object does not preserve its call signature, so onChange is no longer callable.', zh: '对函数对象做属性映射不会保留调用签名，因此onChange不再可调用。' }
      - line: 13
        kind: edge-case
        note: { en: 'Date methods are functions and are recursively mapped too, so getTime also loses its callable type.', zh: 'Date方法也是函数，同样会被递归映射，因此getTime也失去可调用类型。' }
    explanation: { en: 'Define terminal branches for functions and supported built-ins before the general object branch, or constrain the utility to a smaller domain such as JSON values.', zh: '应在普通对象分支之前为函数和受支持的内置对象定义终止分支，或者把工具限制在JSON值等更小的输入域。' }
    difficulty: advanced
    tags: [recursive-types, mapped-types, code-review]

  - id: review-generated-event-router
    type: review
    title: { en: 'Review a generated event router', zh: '审查生成的事件路由器' }
    prompt: { en: 'Review this generated router for untrusted event JSON.', zh: '审查这个用于处理不可信事件JSON的生成路由器。' }
    task: { en: 'Derive event and handler types from one payload map, validate incoming JSON, and route every supported event to a handler.', zh: '从一份载荷映射派生事件与处理器类型，验证传入的JSON，并把每种受支持事件路由到处理器。' }
    code: |
      type EventPayloads = {
        userDeleted: { userId: string };
        creditIssued: { accountId: string; cents: number };
      };

      type AppEvent = {
        [Kind in keyof EventPayloads]: {
          type: Kind;
          payload: EventPayloads[Kind];
        };
      }[keyof EventPayloads];

      type Handlers = {
        [Kind in keyof EventPayloads]: (payload: EventPayloads[Kind]) => void;
      };

      function parseEvent(raw: string): AppEvent {
        return JSON.parse(raw) as AppEvent;
      }

      function dispatch(event: AppEvent, handlers: Partial<Handlers>): void {
        const handler = handlers[event.type] as ((payload: unknown) => void) | undefined;
        handler?.(event.payload);
      }
    lang: typescript
    right: { en: 'The payload map is a single source of truth, and the mapped-then-indexed AppEvent type preserves each discriminant-payload pair. The handler parameters also derive from that map.', zh: '载荷映射充当唯一事实来源，先映射再索引得到的AppEvent保留了每组判别字段与载荷的对应关系；处理器参数也从同一映射派生。' }
    checklist:
      - { en: 'Identify every untrusted-data boundary and require runtime validation there.', zh: '找出每个不可信数据边界，并要求在边界处运行验证。' }
      - { en: 'Check that every supported event has one required handler.', zh: '确认每种受支持事件都有一个必需的处理器。' }
      - { en: 'Trace the discriminant-payload relationship through each dynamic lookup.', zh: '跟踪每次动态查找中的判别字段与载荷关系。' }
      - { en: 'Audit every assertion and replace broad casts with a proved helper or explicit narrowing.', zh: '审核每个断言，用经过证明的辅助函数或显式收窄替代宽泛转换。' }
    issues:
      - line: 18
        kind: security
        note: { en: 'The assertion trusts attacker-controlled JSON without checking the event name, payload shape, or numeric constraints before privileged handlers can receive it.', zh: '这个断言直接信任攻击者可控的JSON；在高权限处理器收到数据前，事件名、载荷结构和数字约束都没有经过检查。' }
      - line: 21
        kind: edge-case
        note: { en: 'Partial makes missing handlers valid even though the task requires every supported event to be routed; optional invocation then drops such events silently.', zh: '任务要求路由所有受支持事件，但Partial允许处理器缺失，随后可选调用会静默丢弃这些事件。' }
      - line: 22
        kind: readability
        note: { en: 'The broad function assertion hides the correlation lost by dynamic indexing instead of expressing why this handler accepts this payload.', zh: '宽泛的函数断言掩盖了动态索引丢失的相关性，没有表达该处理器为何接受当前载荷。' }
    explanation: { en: 'Validate raw input before creating AppEvent, require a complete Handlers map, and preserve correlation with explicit discriminant narrowing or a small audited generic dispatcher.', zh: '应先验证原始输入再创建AppEvent，要求完整的Handlers映射，并通过显式判别收窄或小型、可审核的泛型分派器保留相关性。' }
    difficulty: advanced
    tags: [code-review, runtime-validation, mapped-types, assertions]
