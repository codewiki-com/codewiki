topic: typescript/satisfies
items:
  - id: predict-runtime-erasure
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      type Settings = { mode: "safe" | "fast"; retries: number };

      const settings = {
        mode: "safe",
        retries: 2,
      } satisfies Settings;

      console.log(settings.mode, settings.retries);
    lang: typescript
    options:
      - { text: { en: 'safe 2', zh: 'safe 2' }, correct: true }
      - { text: { en: 'Settings safe 2', zh: 'Settings safe 2' }, correct: false }
      - { text: { en: 'true', zh: 'true' }, correct: false }
      - { text: { en: 'Nothing, because satisfies removes the value.', zh: '没有输出，因为satisfies会移除这个值。' }, correct: false }
    explanation: { en: 'The operator performs a compile-time check and is erased; the ordinary object remains and prints its two values.', zh: '该操作符只执行编译时检查，随后会被擦除；普通对象仍然存在，并输出它的两个值。' }
    difficulty: beginner
    tags: [satisfies, type-erasure]

  - id: inferred-result-type
    type: mcq
    prompt: { en: 'Under TypeScript 6 strict checking, which statement about this declaration is correct?', zh: '在TypeScript 6严格检查下，关于这个声明的哪项说法正确？' }
    options:
      - { text: { en: 'The variable has exactly the type Settings.', zh: '变量的类型就是Settings。' }, correct: false }
      - { text: { en: 'mode retains "safe", retries is number, and omitted optional target properties are not added.', zh: 'mode保持为 "safe"，retries是number，目标中省略的可选属性不会被补上。' }, correct: true }
      - { text: { en: 'Every property retains its exact primitive literal value.', zh: '每个属性都会保留精确的原始字面量值。' }, correct: false }
      - { text: { en: 'The object becomes readonly at compile time and frozen at runtime.', zh: '对象在编译时变为只读，并在运行时被冻结。' }, correct: false }
    explanation: { en: 'The target supplies contextual typing, but it does not replace the inferred result or add absent properties. Ordinary numeric properties still widen unless another construct preserves them.', zh: '目标会提供上下文类型，但不会替换推断结果，也不会增加缺失属性。普通数字属性仍会拓宽，除非另有语法要求保留。' }
    difficulty: intermediate
    tags: [contextual-typing, type-inference]

  - id: json-satisfies-boundary
    type: mcq
    prompt: { en: 'Why is JSON.parse(raw) satisfies Settings not runtime validation?', zh: '为什么JSON.parse(raw) satisfies Settings不是运行时验证？' }
    options:
      - { text: { en: 'JSON.parse returns any by default, and satisfies emits no field checks.', zh: 'JSON.parse默认返回any，而且satisfies不会生成字段检查。' }, correct: true }
      - { text: { en: 'satisfies validates only string fields, not numbers.', zh: 'satisfies只验证字符串字段，不验证数字字段。' }, correct: false }
      - { text: { en: 'Runtime validation happens only when the result is assigned to let.', zh: '只有把结果赋给let时才会执行运行时验证。' }, correct: false }
      - { text: { en: 'Settings must be changed from a type alias to an interface.', zh: '必须把Settings从类型别名改成接口。' }, correct: false }
    explanation: { en: 'any bypasses the useful compatibility proof, and TypeScript erases the operator. Parse into unknown and run a real parser or validator before constructing Settings.', zh: 'any会绕过有用的兼容性证明，而TypeScript会擦除该操作符。应先把结果视为unknown，再通过真实解析器或验证器构造Settings。' }
    difficulty: intermediate
    tags: [runtime-validation, any, json]

  - id: spotbug-open-command-keys
    title: { en: 'Spot the bug in the command registry', zh: '找出命令注册表里的bug' }
    type: spotbug
    prompt: { en: 'Find why this generated command registry fails to guarantee the declared command set.', zh: '找出这个生成的命令注册表为何无法保证声明的命令集合。' }
    code: |
      type Command = { label: string; run(): void };
      type CommandName = "build" | "deploy";

      const commands = {
        build: { label: "Build", run: () => console.log("building") },
        delpoy: { label: "Deploy", run: () => console.log("deploying") },
      } satisfies Record<string, Command>;

      function execute(name: CommandName): void {
        commands[name].run();
      }

      execute("deploy");
    lang: typescript
    issues:
      - line: 6
        kind: correctness
        note: { en: 'The deploy key is misspelled, but Record<string, Command> accepts every string key and therefore does not reject it.', zh: 'deploy键拼写错误，但Record<string, Command>接受任意字符串键，因此不会拒绝它。' }
      - line: 10
        kind: edge-case
        note: { en: 'The declared CommandName includes deploy while the inferred object does not, so indexed access exposes the mismatch instead of guaranteeing a handler.', zh: '声明的CommandName包含deploy，而推断对象中没有该键，因此索引访问暴露了不一致，无法保证处理器存在。' }
    explanation: { en: 'Check the object with Record<CommandName, Command>, or derive CommandName from a correct authoritative object instead of maintaining an open target and a separate union.', zh: '应使用Record<CommandName, Command>检查对象，或者从正确的权威对象派生CommandName，不要同时维护开放目标和独立联合。' }
    difficulty: intermediate
    tags: [finite-keys, record, code-review]

  - id: review-generated-job-registry
    title: { en: 'Review generated job registry', zh: '审查生成的任务注册表' }
    type: review
    prompt: { en: 'Review this generated environment-driven job registry.', zh: '审查这个由环境变量驱动的生成任务注册表。' }
    task: { en: 'Load exactly the cleanup and invoice jobs from environment JSON, reject malformed configuration, and execute a requested job without silently changing behavior.', zh: '从环境JSON加载且仅加载cleanup与invoice任务，拒绝格式错误的配置，并在不静默改变行为的前提下执行指定任务。' }
    code: |
      type JobName = "cleanup" | "invoice";
      type Job = {
        schedule: "hourly" | "daily";
        retries: number;
        run(input: unknown): void;
      };

      declare const env: { JOBS?: string };
      const rawJobs = JSON.parse(env.JOBS ?? "{}");
      const jobs = rawJobs satisfies Record<string, Job>;

      const fallback = {
        schedule: "daily",
        retries: 0,
        run: (_input: unknown) => undefined,
      } as const satisfies Job;

      function execute(name: JobName, input: unknown): void {
        const job = jobs[name] ?? fallback;
        job.run(input);
      }

      execute("cleanup", { tenantId: "acme" });
    lang: typescript
    right: { en: 'The Job contract records the schedule, retry count, and callable shape. The fallback literal is statically checked, and execute accepts a finite JobName rather than an arbitrary string.', zh: 'Job契约写出了调度、重试次数和调用形式；fallback字面量接受静态检查，execute也只接收有限的JobName，而不是任意字符串。' }
    checklist:
      - { en: 'Trace every value from the environment as unknown until runtime validation succeeds.', zh: '跟踪来自环境变量的每个值，在运行时验证成功前始终将其视为unknown。' }
      - { en: 'Require the exact finite job keys and decide whether unknown keys are rejected.', zh: '要求精确的有限任务键，并明确是否拒绝未知键。' }
      - { en: 'Test missing, malformed, and mistyped job entries before executing handlers.', zh: '执行处理器前，测试任务缺失、格式错误和字段类型错误的情况。' }
      - { en: 'Audit fallbacks for behavior that hides configuration failures.', zh: '审核fallback是否会隐藏配置失败并改变行为。' }
    issues:
      - line: 9
        kind: security
        note: { en: 'Environment-controlled JSON is parsed as any and can reach job execution without checking keys, field types, numeric bounds, or the run value.', zh: '环境变量控制的JSON被解析为any，无需检查键、字段类型、数字边界或run值就能进入任务执行。' }
      - line: 10
        kind: correctness
        note: { en: 'Record<string, Job> does not require cleanup and invoice and does not reject unknown job names, contrary to the stated closed registry.', zh: 'Record<string, Job>不要求cleanup与invoice存在，也不拒绝未知任务名，不符合封闭注册表的任务要求。' }
      - line: 10
        kind: readability
        note: { en: 'Using satisfies on an any expression visually suggests validation even though the check establishes no useful evidence.', zh: '对any表达式使用satisfies会在视觉上暗示已经验证，实际上没有建立任何有用证据。' }
      - line: 19
        kind: edge-case
        note: { en: 'A missing requested job silently runs the no-op fallback, hiding broken configuration instead of reporting that cleanup or invoice is absent.', zh: '请求的任务缺失时会静默运行空操作fallback，掩盖错误配置，而不是报告cleanup或invoice缺失。' }
    explanation: { en: 'Parse into unknown, validate an exact Record<JobName, Job> with executable handlers supplied by trusted source code, and fail explicitly when required configuration is absent. Keep satisfies for the trusted static registry, not executable behavior from JSON.', zh: '应先解析为unknown，验证精确的Record<JobName, Job>，并让可执行处理器来自可信源码；必需配置缺失时要明确失败。satisfies应用于可信静态注册表，而不是来自JSON的可执行行为。' }
    difficulty: advanced
    tags: [code-review, runtime-validation, finite-keys, satisfies]
