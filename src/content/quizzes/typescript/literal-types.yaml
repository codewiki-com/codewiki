topic: typescript/literal-types
items:
  - id: predict-derived-state-union
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      const STATES = ["queued", "done"] as const;
      type State = (typeof STATES)[number];

      function label(state: State): string {
        return state === "done" ? "complete" : "waiting";
      }

      console.log(STATES.map(label).join(", "));
    lang: typescript
    options:
      - { text: { en: 'waiting, complete', zh: 'waiting, complete' }, correct: true }
      - { text: { en: 'queued, done', zh: 'queued, done' }, correct: false }
      - { text: { en: 'complete, waiting', zh: 'complete, waiting' }, correct: false }
      - { text: { en: 'It fails because a readonly tuple cannot be mapped.', zh: '程序失败，因为只读元组不能调用 map。' }, correct: false }
    explanation: { en: 'The tuple values are queued and done. The callback maps them to waiting and complete, and join inserts the comma and space.', zh: '元组中的值是 queued 和 done，回调把它们映射为 waiting 和 complete，join 再插入逗号与空格。' }
    difficulty: beginner
    tags: [as-const, indexed-access, predict-output]
    tests: npx tsx quiz_predict.ts
    minutes: 3

  - id: object-property-widening
    type: mcq
    prompt: { en: 'What is the usual inferred type of request.method in const request = { method: "GET" }?', zh: '在 const request = { method: "GET" } 中，request.method 通常被推断成什么类型？' }
    options:
      - { text: { en: 'string, because the property remains mutable', zh: 'string，因为该属性仍然可变' }, correct: true }
      - { text: { en: 'The literal type "GET", because request uses const', zh: '字面量类型 "GET"，因为 request 使用了 const' }, correct: false }
      - { text: { en: '"GET" | "POST", inferred from common HTTP methods', zh: '"GET" | "POST"，由常见 HTTP 方法自动推断' }, correct: false }
      - { text: { en: 'never, because no reassignment is shown', zh: 'never，因为代码中没有重新赋值' }, correct: false }
    explanation: { en: 'const prevents rebinding the variable, not assigning its properties. The property therefore widens so another string can be stored later.', zh: 'const 禁止重新绑定变量，却不禁止给属性赋值；因此该属性会拓宽，以便之后存入其他字符串。' }
    difficulty: beginner
    tags: [literal-widening, const, objects]
    minutes: 2

  - id: broad-string-collapses-union
    type: mcq
    prompt: { en: 'What constraint does the type "auto" | string impose?', zh: '类型 "auto" | string 能施加什么约束？' }
    options:
      - { text: { en: 'It accepts every string, so the literal adds no restriction.', zh: '它接受所有字符串，因此该字面量没有增加约束。' }, correct: true }
      - { text: { en: 'It accepts only the exact string auto.', zh: '它只接受精确字符串 auto。' }, correct: false }
      - { text: { en: 'It accepts auto and non-empty strings only.', zh: '它接受 auto 和其他非空字符串。' }, correct: false }
      - { text: { en: 'It creates a runtime set containing auto.', zh: '它会创建一个包含 auto 的运行时集合。' }, correct: false }
    explanation: { en: 'The broad string type already contains the value "auto" and every other string. A union with its subset is still just the broad set.', zh: '宽泛的 string 已经包含 "auto" 和其他所有字符串；它与自身子集组成联合后，仍然只是这个宽泛集合。' }
    difficulty: intermediate
    tags: [literal-union, assignability, open-set]
    minutes: 2

  - id: satisfies-preserves-detail
    type: mcq
    prompt: { en: 'What is the main effect of const cfg = { retry: 3 } satisfies { retry: 0 | 1 | 2 | 3 }?', zh: 'const cfg = { retry: 3 } satisfies { retry: 0 | 1 | 2 | 3 } 的主要效果是什么？' }
    options:
      - { text: { en: 'It checks that 3 is allowed while retaining the useful specific type of cfg.retry.', zh: '它检查 3 是否允许，同时保留 cfg.retry 有用的具体类型。' }, correct: true }
      - { text: { en: 'It freezes cfg at runtime.', zh: '它会在运行时冻结 cfg。' }, correct: false }
      - { text: { en: 'It validates future JSON assigned to cfg.', zh: '它会验证以后赋给 cfg 的 JSON。' }, correct: false }
      - { text: { en: 'It converts retry to a string union.', zh: '它会把 retry 转换为字符串联合。' }, correct: false }
    explanation: { en: 'satisfies checks assignability without replacing the expression with the target annotation. It emits no runtime validation or freezing code.', zh: 'satisfies 检查可赋值性，但不会用目标注解替换表达式类型；它也不会输出运行时验证或冻结代码。' }
    difficulty: intermediate
    tags: [satisfies, inference, configuration]
    minutes: 3

  - id: spotbug-asserted-mode-json
    type: spotbug
    prompt: { en: 'Find why this generated parser does not establish a valid Mode.', zh: '找出这段生成的解析器为什么不能证明 Mode 有效。' }
    code: |
      type Mode = "safe" | "fast";

      function parseMode(raw: string): Mode {
        const payload = JSON.parse(raw) as { mode: Mode };
        return payload.mode;
      }
    lang: typescript
    issues:
      - line: 4
        kind: correctness
        note: { en: 'The assertion performs no object-shape or literal-membership check, so missing mode, null, or an arbitrary string can be returned as Mode.', zh: '这个断言不会检查对象结构或字面量成员，因此缺少 mode、值为 null 或任意字符串时都可能被当作 Mode 返回。' }
    explanation: { en: 'Parse to unknown, prove that the result is a non-null object, and compare its mode field with safe and fast before returning it.', zh: '应先解析为 unknown，证明结果是非空对象，再把 mode 字段与 safe 和 fast 比较，通过后才能返回。' }
    difficulty: intermediate
    tags: [type-assertion, runtime-validation, json]
    tests: npx tsc --strict --noEmit mode_parser.ts
    minutes: 5

  - id: review-generated-job-events
    type: review
    prompt: { en: 'Review this generated parser and event summarizer.', zh: '审查这段生成的事件解析与摘要代码。' }
    task: { en: 'Parse an untrusted job event, accept only valid literal-tagged payloads, and return a descriptive line containing the job id and state-specific detail with exhaustive handling and no unnecessary work.', zh: '解析不可信的任务事件，只接受字面量标签与载荷都有效的数据，并在不做无用工作的前提下穷尽处理各状态，返回包含任务 id 和状态专属信息的描述。' }
    code: |
      type JobEvent =
        | { kind: "started"; jobId: string }
        | { kind: "completed"; jobId: string; resultUrl: string }
        | { kind: "failed"; jobId: string; message: string };

      function parseEvent(raw: string): JobEvent {
        const event = JSON.parse(raw) as JobEvent;
        return event;
      }

      function summarize(event: JobEvent): string {
        const copy = { ...event };
        switch (copy.kind) {
          case "completed":
            return copy.resultUrl;
          case "failed":
            return copy.message;
          default:
            return "started";
        }
      }
    lang: typescript
    right: { en: 'The code defines a genuine discriminated union, keeps parsing separate from presentation, and narrows completed and failed payload fields through the literal tag.', zh: '代码定义了真正的可辨识联合，分开了解析与展示逻辑，并通过字面量标签正确收窄 completed 和 failed 的载荷字段。' }
    checklist:
      - { en: 'Keep parsed data unknown until the object, tag, and every member-specific field pass runtime checks.', zh: '在对象、标签和每个成员专属字段通过运行时检查前，让解析数据保持为 unknown。' }
      - { en: 'Require an explicit branch for every literal member and send the remainder to a never check.', zh: '要求每个字面量成员都有显式分支，并把剩余值交给 never 检查。' }
      - { en: 'Verify that each branch returns every field required by the stated output contract.', zh: '确认每个分支都返回输出契约要求的全部字段。' }
      - { en: 'Remove copies, sorting, or transformations whose results are not needed.', zh: '删除结果没有被使用的复制、排序或转换。' }
    issues:
      - line: 7
        kind: security
        note: { en: 'The assertion lets attacker-controlled JSON acquire JobEvent without checking the object, tag, jobId, or member-specific payload.', zh: '这个断言让攻击者控制的 JSON 无需检查对象、标签、jobId 或成员专属载荷，就获得 JobEvent 类型。' }
      - line: 12
        kind: performance
        note: { en: 'Spreading every event creates an unnecessary object because summarize only reads its input.', zh: 'summarize 只读取输入，却为每个事件执行展开并创建无用对象。' }
      - line: 15
        kind: correctness
        note: { en: 'The completed result omits the job id and a state label, so it does not satisfy the requested descriptive output.', zh: 'completed 分支遗漏任务 id 和状态标签，因此不满足所要求的描述性输出。' }
      - line: 18
        kind: edge-case
        note: { en: 'A catch-all default treats future union members or invalid runtime tags as started instead of making exhaustiveness failures visible.', zh: '兜底 default 会把未来联合成员或非法运行时标签当成 started，无法暴露穷尽性错误。' }
    explanation: { en: 'Validate raw data before constructing JobEvent, read event directly, include the common job id in every summary, and replace the catch-all default with a never-based exhaustiveness check that throws at runtime.', zh: '应先验证原始数据再构造 JobEvent，直接读取 event，在每个摘要中包含公共 job id，并用基于 never 且运行时会抛错的穷尽性检查替换兜底 default。' }
    difficulty: advanced
    tags: [code-review, discriminated-union, exhaustiveness, runtime-validation]
    tests: npx tsc --strict --noEmit generated_event.ts
    minutes: 12
