topic: typescript/basics
items:
  - id: predict-union-narrowing
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      function formatReference(value: string | number): string {
        if (typeof value === "number") {
          return `#${value.toFixed(0)}`;
        }
        return value.toUpperCase();
      }

      console.log(formatReference(204));
      console.log(formatReference("ord-205"));
    lang: typescript
    options:
      - { text: { en: "#204\nORD-205", zh: "#204\nORD-205" }, correct: true }
      - { text: { en: "204\nord-205", zh: "204\nord-205" }, correct: false }
      - { text: { en: "#204.0\nORD-205", zh: "#204.0\nORD-205" }, correct: false }
      - { text: { en: 'It fails because union values cannot be used.', zh: '程序会失败，因为联合类型的值不能使用。' }, correct: false }
    explanation: { en: 'The typeof check narrows numbers to the first branch, where toFixed(0) returns 204. Strings take the second branch and are converted to uppercase.', zh: 'typeof 检查把数字收窄到第一个分支，toFixed(0) 返回 204；字符串进入第二个分支并转换成大写。' }
    difficulty: beginner
    tags: [union-types, narrowing, predict-output]

  - id: unknown-before-use
    type: mcq
    prompt: { en: 'Why is unknown safer than any for an untrusted JSON result?', zh: '对于不可信的 JSON 结果，为什么 unknown 比 any 更安全？' }
    options:
      - { text: { en: 'unknown requires narrowing or validation before type-specific operations.', zh: 'unknown 要求先收窄或验证，才能执行依赖具体类型的操作。' }, correct: true }
      - { text: { en: 'unknown validates JSON properties automatically at runtime.', zh: 'unknown 会在运行时自动验证 JSON 属性。' }, correct: false }
      - { text: { en: 'unknown converts every primitive into a string.', zh: 'unknown 会把每个原始值转换成字符串。' }, correct: false }
      - { text: { en: 'unknown prevents the JavaScript from being emitted.', zh: 'unknown 会阻止 JavaScript 输出。' }, correct: false }
    explanation: { en: 'unknown accepts any incoming value but blocks arbitrary use until the program establishes a narrower type. It does not itself add runtime validation.', zh: 'unknown 可以接收任意值，但在程序确定更具体的类型前，会阻止任意使用；它本身不会添加运行时验证。' }
    difficulty: beginner
    tags: [unknown, any, runtime-validation]

  - id: assertions-at-runtime
    type: mcq
    prompt: { en: 'What does value as Account do at runtime?', zh: 'value as Account 在运行时会做什么？' }
    options:
      - { text: { en: 'Nothing; the assertion is erased and does not inspect value.', zh: '什么也不做；断言会被擦除，也不会检查 value。' }, correct: true }
      - { text: { en: 'It creates an Account instance and copies matching fields.', zh: '它会创建 Account 实例，并复制匹配字段。' }, correct: false }
      - { text: { en: 'It throws if a required property is absent.', zh: '如果缺少必填属性，它会抛出异常。' }, correct: false }
      - { text: { en: 'It converts every property to its declared type.', zh: '它会把每个属性转换成声明的类型。' }, correct: false }
    explanation: { en: 'A type assertion changes what the checker accepts, not the runtime value. External data still needs explicit parsing and validation.', zh: '类型断言改变的是检查器接受的内容，不是运行时值；外部数据仍需要显式解析和验证。' }
    difficulty: beginner
    tags: [type-assertion, type-erasure]

  - id: spot-empty-array-access
    type: spotbug
    prompt: { en: 'Find the unchecked assumption in this generated label helper.', zh: '找出这个生成的标签辅助函数中未经检查的假设。' }
    code: |
      function firstLabel(labels: string[]): string {
        return labels[0].toUpperCase();
      }

      console.log(firstLabel([]));
    lang: typescript
    issues:
      - line: 2
        kind: edge-case
        note: { en: 'An empty array makes labels[0] undefined at runtime, so calling toUpperCase throws even if a permissive configuration types the lookup as string.', zh: '空数组会让 labels[0] 在运行时得到 undefined，因此调用 toUpperCase 会抛错，即使宽松配置把这次读取标为 string。' }
    explanation: { en: 'Return a fallback, return string | undefined, or reject empty input explicitly. Enabling noUncheckedIndexedAccess also makes the possible undefined visible to the checker.', zh: '可以返回默认值、返回 string | undefined，或显式拒绝空输入；启用 noUncheckedIndexedAccess 还能让检查器看到可能出现的 undefined。' }
    difficulty: beginner
    tags: [arrays, undefined, code-review]

  - id: review-generated-account-total
    type: review
    prompt: { en: 'Review this generated CLI helper before it processes an API response.', zh: '在这个生成的命令行辅助函数处理 API 响应前，对它进行审查。' }
    task: { en: 'Read account JSON from the first CLI argument, validate it, and total active balances in cents without unnecessary work.', zh: '从第一个命令行参数读取账户 JSON，验证数据，并在不做无用工作的前提下汇总启用账户的余额分值。' }
    code: |
      type Account = {
        id: string;
        balanceCents: number;
        active: boolean;
      };

      function activeBalance(raw: string): number {
        const accounts = JSON.parse(raw) as Account[];
        accounts.sort((a, b) => a.id.localeCompare(b.id));

        let total: any = 0;
        for (const account of accounts) {
          if (account.active) total += account.balanceCents;
        }
        return total;
      }

      const raw = process.argv[2]!;
      console.log(activeBalance(raw));
    lang: typescript
    right: { en: 'The code gives the domain object and function return explicit types, uses integer cents instead of floating-point currency, and keeps the accumulation readable.', zh: '代码显式声明了领域对象和函数返回类型，使用整数分值而非浮点货币，并保持了汇总流程的可读性。' }
    checklist:
      - { en: 'Treat parsed and API data as unknown until every required field and range is checked.', zh: '在检查完每个必填字段和值域前，把解析结果与 API 数据视为 unknown。' }
      - { en: 'Audit every any, assertion, and non-null assertion for a proved precondition.', zh: '审核每个 any、类型断言和非空断言，确认其前置条件已经得到证明。' }
      - { en: 'Test missing CLI input, malformed JSON, wrong field types, and an empty account list.', zh: '测试缺少命令行输入、JSON 格式错误、字段类型错误和空账户列表。' }
      - { en: 'Remove transformations whose result the task never consumes.', zh: '删除任务从未使用其结果的转换操作。' }
    issues:
      - line: 8
        kind: security
        note: { en: 'The assertion trusts unvalidated API JSON, so attacker-controlled property types can reach arithmetic and control flow as if checked.', zh: '这个断言信任未经验证的 API JSON，攻击者控制的属性类型会像通过检查一样进入算术和控制流。' }
      - line: 9
        kind: performance
        note: { en: 'Sorting every account is unnecessary because the task only asks for a total and never consumes the order.', zh: '任务只要求汇总，也不会使用排列顺序，因此对所有账户排序是无用工作。' }
      - line: 11
        kind: readability
        note: { en: 'Declaring the accumulator as any removes the numeric invariant and can turn addition into string concatenation if bad data crosses the assertion.', zh: '把累加器声明为 any 会移除数值不变量；如果错误数据越过断言，加法可能变成字符串拼接。' }
      - line: 18
        kind: edge-case
        note: { en: 'The non-null assertion hides a missing command-line argument; JSON.parse then receives undefined and fails without a useful input error.', zh: '非空断言掩盖了命令行参数缺失；JSON.parse 随后收到 undefined，却无法给出有用的输入错误。' }
    explanation: { en: 'Accept the CLI value only after checking it exists, parse to unknown, validate the array and each field, use a number accumulator, and remove the unused sort. Keep malformed-input errors at the boundary.', zh: '应先确认命令行参数存在，再把解析结果视为 unknown，并验证数组及每个字段；累加器使用 number，同时删除无用排序。格式错误应在边界处报告。' }
    difficulty: intermediate
    tags: [code-review, unknown, any, type-assertion]
