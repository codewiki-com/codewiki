topic: typescript/basics
items:
  - id: predict-union-narrowing
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      function formatReference(value: string | number): string {
        if (typeof value === "number") {
          return `#${value.toFixed(0)}`;
        }
        return value.toUpperCase();
      }

      console.log(formatReference(204));
      console.log(formatReference("ord-205"));
    lang: typescript
    options:
      - { text: { en: "#204\nORD-205", zh: "#204\nORD-205" }, correct: true }
      - { text: { en: "204\nord-205", zh: "204\nord-205" }, correct: false }
      - { text: { en: "#204.0\nORD-205", zh: "#204.0\nORD-205" }, correct: false }
      - { text: { en: 'It fails because union values cannot be used.', zh: '程序会失败，因为联合类型的值不能使用。' }, correct: false }
    explanation: { en: 'The typeof check narrows numbers to the first branch, where toFixed(0) returns 204. Strings take the second branch and are converted to uppercase.', zh: 'typeof检查把数字收窄到第一个分支，toFixed(0) 返回204；字符串进入第二个分支并转换成大写。' }
    difficulty: beginner
    tags: [union-types, narrowing, predict-output]

  - id: unknown-before-use
    type: mcq
    prompt: { en: 'Why is unknown safer than any for an untrusted JSON result?', zh: '对于不可信的JSON结果，为什么unknown比any更安全？' }
    options:
      - { text: { en: 'unknown requires narrowing or validation before type-specific operations.', zh: 'unknown要求先收窄或验证，才能执行依赖具体类型的操作。' }, correct: true }
      - { text: { en: 'unknown validates JSON properties automatically at runtime.', zh: 'unknown会在运行时自动验证JSON属性。' }, correct: false }
      - { text: { en: 'unknown converts every primitive into a string.', zh: 'unknown会把每个原始值转换成字符串。' }, correct: false }
      - { text: { en: 'unknown prevents the JavaScript from being emitted.', zh: 'unknown会阻止JavaScript输出。' }, correct: false }
    explanation: { en: 'unknown accepts any incoming value but blocks arbitrary use until the program establishes a narrower type. It does not itself add runtime validation.', zh: 'unknown可以接收任意值，但在程序确定更具体的类型前，会阻止任意使用；它本身不会添加运行时验证。' }
    difficulty: beginner
    tags: [unknown, any, runtime-validation]

  - id: assertions-at-runtime
    type: mcq
    prompt: { en: 'What does value as Account do at runtime?', zh: 'value as Account在运行时会做什么？' }
    options:
      - { text: { en: 'Nothing; the assertion is erased and does not inspect value.', zh: '什么也不做；断言会被擦除，也不会检查value。' }, correct: true }
      - { text: { en: 'It creates an Account instance and copies matching fields.', zh: '它会创建Account实例，并复制匹配字段。' }, correct: false }
      - { text: { en: 'It throws if a required property is absent.', zh: '如果缺少必填属性，它会抛出异常。' }, correct: false }
      - { text: { en: 'It converts every property to its declared type.', zh: '它会把每个属性转换成声明的类型。' }, correct: false }
    explanation: { en: 'A type assertion changes what the checker accepts, not the runtime value. External data still needs explicit parsing and validation.', zh: '类型断言改变的是检查器接受的内容，不是运行时值；外部数据仍需要显式解析和验证。' }
    difficulty: beginner
    tags: [type-assertion, type-erasure]

  - id: spot-empty-array-access
    title: { en: 'Spot the bug in firstLabel', zh: '找出firstLabel里的bug' }
    type: spotbug
    prompt: { en: 'Find the unchecked assumption in this generated label helper.', zh: '找出这个生成的标签辅助函数中未经检查的假设。' }
    code: |
      function firstLabel(labels: string[]): string {
        return labels[0].toUpperCase();
      }

      console.log(firstLabel([]));
    lang: typescript
    issues:
      - line: 2
        kind: edge-case
        note: { en: 'An empty array makes labels[0] undefined at runtime, so calling toUpperCase throws even if a permissive configuration types the lookup as string.', zh: '空数组会让labels[0] 在运行时得到undefined，因此调用toUpperCase会抛错，即使宽松配置把这次读取标为string。' }
    explanation: { en: 'Return a fallback, return string | undefined, or reject empty input explicitly. Enabling noUncheckedIndexedAccess also makes the possible undefined visible to the checker.', zh: '可以返回默认值、返回string | undefined，或显式拒绝空输入；启用noUncheckedIndexedAccess还能让检查器看到可能出现的undefined。' }
    difficulty: beginner
    tags: [arrays, undefined, code-review]

  - id: review-generated-admin-filter
    type: review
    title: { en: 'Review a generated admin ID filter', zh: '审查生成的管理员ID筛选器' }
    prompt: { en: 'Review this generated CLI helper before it is used for access control.', zh: '请在这个生成的命令行辅助函数用于访问控制前审查它。' }
    task: { en: 'Read untrusted user JSON from the first CLI argument, validate every record, and return the IDs of active admins without unnecessary work.', zh: '从第一个命令行参数读取不可信的用户JSON，验证每条记录，并在不做无用工作的前提下返回已启用管理员的ID。' }
    code: |
      type User = {
        id: string;
        role: "admin" | "member";
        active: boolean;
      };

      export function activeAdminIds(raw: string): string[] {
        const users = JSON.parse(raw) as User[];
        users.sort((a, b) => a.id.localeCompare(b.id));

        const ids: any[] = [];
        for (const user of users) {
          if (!user.active || user.role === "member") continue;
          ids.push(user.id);
        }
        return ids;
      }

      const raw = process.argv[2]!;
      console.log(activeAdminIds(raw));
    lang: typescript
    issues:
      - line: 8
        kind: correctness
        note: { en: 'The assertion does not validate that the parsed value is an array or that each item has the required field types.', zh: '这个断言不会验证解析结果是否为数组，也不会验证每个元素是否具有所需的字段类型。' }
      - line: 9
        kind: performance
        note: { en: 'Sorting every user adds O(n log n) work even though the task does not require ordered output.', zh: '任务并不要求有序输出，却对所有用户排序，额外增加了O(n log n) 的工作。' }
      - line: 11
        kind: readability
        note: { en: 'Using any[] hides the intended string element type and disables checks on values added to the result.', zh: '使用any[] 会隐藏预期的string元素类型，并关闭对结果中新增值的类型检查。' }
      - line: 13
        kind: security
        note: { en: 'Rejecting only member fails open: an unvalidated role such as owner is treated as an admin.', zh: '只排除member会造成开放式授权：owner等未经验证的角色会被当作管理员。' }
      - line: 19
        kind: edge-case
        note: { en: 'The non-null assertion hides a missing CLI argument, so parsing fails before the program can report a useful input error.', zh: '非空断言掩盖了命令行参数缺失，导致程序在给出有用的输入错误前就解析失败。' }
    right: { en: 'The code names the user shape, gives the exported function an explicit parameter and return type, and collects matching IDs in one clear loop.', zh: '代码为用户结构命名，为导出函数显式声明参数与返回类型，并通过一个清晰的循环收集匹配的ID。' }
    checklist:
      - { en: 'Keep parsed data unknown until the array and every required field pass runtime checks.', zh: '在数组及每个必填字段通过运行时检查前，让解析结果保持为unknown。' }
      - { en: 'Make authorization allow only explicitly recognized privileged roles.', zh: '授权时只允许明确识别出的特权角色。' }
      - { en: 'Replace any and unjustified assertions with types backed by proved checks.', zh: '用经过检查证明的类型替换any和缺乏依据的断言。' }
      - { en: 'Test missing input, malformed JSON, invalid roles, inactive users, and empty arrays.', zh: '测试输入缺失、JSON格式错误、非法角色、未启用用户和空数组。' }
    explanation: { en: 'Check the CLI argument, parse to unknown, and validate the array plus each user before filtering. Use an explicit admin equality check, infer ids as string[], and remove the unused sort.', zh: '应先检查命令行参数，把解析结果视为unknown，并在筛选前验证数组及每个用户。使用显式的admin相等检查，让ids推断为string[]，并删除无用排序。' }
    difficulty: intermediate
    minutes: 10
    tags: [code-review, unknown, any, type-assertion, authorization]
