topic: typescript/type-narrowing
items:
  - id: predict-truthiness-narrowing
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      function label(value: string | number | null): string {
        if (!value) return "missing";
        return typeof value === "string"
          ? value.toUpperCase()
          : value.toFixed(0);
      }

      console.log(label(0));
      console.log(label(""));
      console.log(label(2.6));
    lang: typescript
    options:
      - { text: { en: 'missing, missing, 3', zh: 'missing、missing、3' }, correct: true }
      - { text: { en: '0, an empty line, 3', zh: '0、一个空行、3' }, correct: false }
      - { text: { en: 'missing, missing, 2', zh: 'missing、missing、2' }, correct: false }
      - { text: { en: 'The program fails because value is still a union.', zh: '程序会失败，因为 value 仍是联合类型。' }, correct: false }
    explanation: { en: 'The truthiness check sends both 0 and the empty string to the first return. The remaining number is rounded by toFixed(0), so 2.6 produces 3.', zh: '真值检查会把 0 和空字符串都送入第一个 return。剩余数字由 toFixed(0) 舍入，因此 2.6 输出 3。' }
    difficulty: beginner
    tags: [truthiness, nullish-values, predict-output]
    minutes: 3

  - id: declared-versus-observed-type
    type: mcq
    prompt: { en: 'A variable is declared as string | number and currently narrowed to string. Why may a later assignment of 42 still compile?', zh: '变量声明为 string | number，当前已收窄为 string，为什么稍后赋值 42 仍可通过编译？' }
    options:
      - { text: { en: 'Assignments are checked against the declared type, while the observed type can change along control flow.', zh: '赋值按声明类型检查，而观察类型可以随控制流变化。' }, correct: true }
      - { text: { en: 'Narrowing permanently changes the declaration to any.', zh: '收窄会把声明永久改成 any。' }, correct: false }
      - { text: { en: 'Every number is implicitly converted to a string.', zh: '每个数字都会隐式转换成字符串。' }, correct: false }
      - { text: { en: 'The assignment is accepted only when strict mode is disabled.', zh: '只有关闭严格模式后，该赋值才会被接受。' }, correct: false }
    explanation: { en: 'The declared union remains the assignment contract. A check or assignment changes only the type observed at a particular program point.', zh: '声明的联合类型仍是赋值契约。检查或赋值只会改变某个程序位置的观察类型。' }
    difficulty: intermediate
    tags: [control-flow, assignment, observed-type]
    minutes: 3

  - id: spotbug-incomplete-invoice-predicate
    type: spotbug
    prompt: { en: 'Find why this predicate can approve a value that crashes in formatInvoice.', zh: '找出这个谓词为何会放行一个让 formatInvoice 崩溃的值。' }
    code: |
      type Invoice = { id: string; total: number };

      function isInvoice(value: unknown): value is Invoice {
        return (
          typeof value === "object" &&
          value !== null &&
          "id" in value
        );
      }

      function formatInvoice(value: unknown): string {
        if (!isInvoice(value)) return "invalid";
        return `${value.id}:${value.total.toFixed(2)}`;
      }
    lang: typescript
    issues:
      - line: 4
        lines: 5
        kind: correctness
        note: { en: 'The body proves only that id can be found; it checks neither the id value nor the required total field promised by Invoice.', zh: '函数体只证明能够找到 id，既没有检查 id 的值，也没有检查 Invoice 承诺的必填 total 字段。' }
      - line: 13
        kind: edge-case
        note: { en: 'A value such as { id: "A-1" } passes the predicate, then total.toFixed throws because total is undefined.', zh: '像 { id: "A-1" } 这样的值会通过谓词，随后因 total 是 undefined 而在 total.toFixed 处抛出异常。' }
    explanation: { en: 'A type predicate is trusted as a contract; TypeScript does not derive its truth from the body. Check both fields and their runtime types before returning true.', zh: '类型谓词会作为契约被信任，TypeScript 不会从函数体证明它为真。返回 true 前必须检查两个字段及其运行时类型。' }
    difficulty: intermediate
    tags: [type-predicate, runtime-validation, object-shape]
    minutes: 5

  - id: exhaustive-default-branch
    type: mcq
    prompt: { en: 'Why pass a switch default value to assertNever instead of returning "unknown"?', zh: '为什么应把 switch 默认分支的值传给 assertNever，而不是返回 "unknown"？' }
    options:
      - { text: { en: 'A newly added union member then produces a compile error until it gets a branch.', zh: '联合类型新增成员后会产生编译错误，直到代码补上对应分支。' }, correct: true }
      - { text: { en: 'assertNever converts unknown runtime data into a valid union member.', zh: 'assertNever 会把未知运行时数据转换成合法联合成员。' }, correct: false }
      - { text: { en: 'It makes every switch branch run once.', zh: '它会让每个 switch 分支都执行一次。' }, correct: false }
      - { text: { en: 'It removes the discriminant from emitted JavaScript.', zh: '它会从输出的 JavaScript 中删除判别字段。' }, correct: false }
    explanation: { en: 'Once every current member is handled, the remainder is never. Adding an unhandled member makes that remainder concrete and no longer assignable to never.', zh: '处理完当前所有成员后，剩余值是 never。加入未处理成员后，剩余值变成具体类型，无法再赋给 never。' }
    difficulty: intermediate
    tags: [discriminated-union, never, exhaustiveness]
    minutes: 3

  - id: review-generated-job-update
    type: review
    prompt: { en: 'Review this generated job-update decoder before it receives production events.', zh: '在这段生成的任务更新解码器接收生产事件前，对它进行审查。' }
    task: { en: 'Decode untrusted JSON without leaking the token, return invalid for malformed data, preserve a legitimate 0% update, and make future union members fail exhaustiveness checks.', zh: '解码不可信 JSON，不泄露 token，对损坏数据返回 invalid，保留合法的 0% 更新，并让未来新增联合成员触发穷尽性错误。' }
    code: |
      type JobUpdate =
        | { kind: "progress"; percent: number; token: string }
        | { kind: "failed"; message: string; token: string }
        | { kind: "done"; artifact: string; token: string };

      function decodeUpdate(raw: string): JobUpdate {
        const value = JSON.parse(raw) as JobUpdate;
        return value;
      }

      function summarize(update: JobUpdate): string {
        console.log("update", JSON.stringify(update));

        if (update.kind === "progress") {
          if (!update.percent) return "waiting";
          return `${update.percent}%`;
        }

        if (update.kind === "failed") return update.message;
        return "finished";
      }
    lang: typescript
    right: { en: 'The code names a discriminated union, gives summarize an explicit return type, and keeps member-specific field access inside the matching branch.', zh: '代码定义了可辨识联合，为 summarize 写出显式返回类型，并把成员专属字段访问放在对应分支中。' }
    checklist:
      - { en: 'Keep parsed data unknown until the container, discriminant, fields, and domain constraints pass runtime checks.', zh: '解析结果在容器、判别字段、各字段和领域约束通过运行时检查前保持为 unknown。' }
      - { en: 'Test malformed JSON, null, arrays, missing fields, wrong primitives, and boundary numbers including zero.', zh: '测试损坏 JSON、null、数组、缺失字段、错误原始类型和包括零在内的边界数字。' }
      - { en: 'Trace secrets through logs, thrown errors, and returned strings.', zh: '追踪秘密是否进入日志、抛出的错误和返回字符串。' }
      - { en: 'Require a never remainder after all known discriminants are handled.', zh: '处理所有已知判别值后，要求剩余类型为 never。' }
    issues:
      - line: 7
        kind: correctness
        note: { en: 'The assertion trusts arbitrary parsed data as JobUpdate without validating the object, fields, literals, or percent range; malformed JSON also throws instead of returning invalid.', zh: '这个断言把任意解析结果信任为 JobUpdate，没有验证对象、字段、字面量或 percent 范围；损坏 JSON 也会抛出异常，而不是返回 invalid。' }
      - line: 12
        kind: security
        note: { en: 'Serializing the complete update writes the secret token to logs.', zh: '序列化完整 update 会把秘密 token 写入日志。' }
      - line: 15
        kind: edge-case
        note: { en: 'The truthiness check labels a legitimate 0% progress update as waiting.', zh: '真值检查会把合法的 0% 进度更新标记为 waiting。' }
      - line: 20
        kind: readability
        note: { en: 'The final return silently treats every future union member as done; an exhaustive switch with a never check records the intended closed set.', zh: '最后的 return 会悄悄把未来所有联合成员当成 done；带 never 检查的穷尽 switch 才能记录预期的封闭集合。' }
    explanation: { en: 'Parse under error handling, validate unknown data into the union, log only approved non-secret fields, compare percent explicitly, and make the final branch prove a never remainder.', zh: '应在错误处理内解析，把 unknown 验证成联合类型，只记录获准的非秘密字段，明确比较 percent，并让最后分支证明剩余类型为 never。' }
    difficulty: advanced
    tags: [code-review, type-narrowing, untrusted-input, exhaustiveness]
    minutes: 12
