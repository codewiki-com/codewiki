topic: typescript/union-intersection
items:
  - id: predict-narrowed-identifier
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      function display(value: string | number): string {
        return typeof value === "number"
          ? value.toFixed(1)
          : value.trim().toUpperCase();
      }

      console.log(display(2));
      console.log(display(" ready "));
    lang: typescript
    options:
      - { text: { en: '2.0, then READY', zh: '先输出 2.0，再输出 READY' }, correct: true }
      - { text: { en: '2, then ready', zh: '先输出 2，再输出 ready' }, correct: false }
      - { text: { en: 'The program fails because value remains a union.', zh: '程序失败，因为 value 仍是联合类型。' }, correct: false }
      - { text: { en: '2.0, then a string with surrounding spaces', zh: '先输出 2.0，再输出保留两侧空格的字符串' }, correct: false }
    explanation: { en: 'The typeof branch narrows value to number and toFixed adds one decimal place. The other branch narrows to string, trims it, and converts it to upper case.', zh: 'typeof 分支把 value 收窄为 number，toFixed 会保留一位小数。另一分支把它收窄为 string，再去除空白并转成大写。' }
    difficulty: beginner
    tags: [union-types, narrowing, predict-output]
    minutes: 3

  - id: union-is-inclusive
    type: mcq
    prompt: { en: 'Which statement about an object union A | B is correct under structural typing?', zh: '在结构类型系统中，关于对象联合 A | B 的哪项说法正确？' }
    options:
      - { text: { en: 'A value may satisfy A, B, or both.', zh: '一个值可以满足 A、B，或同时满足两者。' }, correct: true }
      - { text: { en: 'Every value must have all properties from A and B.', zh: '每个值都必须拥有 A 和 B 的全部属性。' }, correct: false }
      - { text: { en: 'A runtime tag is added automatically.', zh: '运行时会自动添加标签。' }, correct: false }
      - { text: { en: 'All properties unique to A or B become optional.', zh: 'A 或 B 独有的所有属性都会自动变成可选。' }, correct: false }
    explanation: { en: 'A union accepts any value assignable to at least one member. Structural compatibility allows one sufficiently rich object to satisfy both members.', zh: '联合类型接受可赋给至少一个成员的值。结构兼容性允许一个字段足够丰富的对象同时满足两个成员。' }
    difficulty: intermediate
    tags: [union-types, structural-typing, assignability]
    minutes: 3

  - id: spotbug-conflicting-identifier
    type: spotbug
    prompt: { en: 'Find why this imported-user type and constructor do not establish a usable identifier contract.', zh: '找出这个导入用户类型及构造函数为何无法建立可用的标识符契约。' }
    code: |
      type StoredUser = { id: string; name: string };
      type ImportMetadata = { id: number; source: string };
      type ImportedUser = StoredUser & ImportMetadata;

      function importedUser(
        rawId: string,
        name: string,
      ): ImportedUser {
        const value = { id: Number(rawId), name, source: "csv" };
        return value as unknown as ImportedUser;
      }
    lang: typescript
    issues:
      - line: 3
        kind: correctness
        note: { en: 'The overlapping id requirements intersect to string & number, so ImportedUser.id is never and no ordinary object can satisfy the contract.', zh: '重名的 id 约束交叉成 string & number，因此 ImportedUser.id 是 never，没有普通对象能满足这份契约。' }
      - line: 10
        kind: readability
        note: { en: 'The double assertion suppresses the contradiction instead of deciding whether the imported number should be converted, renamed, or modeled separately.', zh: '双重断言掩盖了矛盾，没有决定导入数字究竟应转换、改名，还是单独建模。' }
    explanation: { en: 'Rename the source identifier or remove the stored id with Omit before defining its replacement, then perform the matching runtime conversion. An assertion cannot make incompatible property requirements coexist.', zh: '应给来源标识符改名，或先用 Omit 删除存储 id 再定义替代字段，并执行对应的运行时转换。类型断言无法让不兼容的属性要求同时成立。' }
    difficulty: intermediate
    tags: [intersection-types, conflicting-properties, type-assertions]
    minutes: 5

  - id: intersection-runtime-effect
    type: mcq
    prompt: { en: 'What runtime effect does declaring type Combined = A & B have?', zh: '声明 type Combined = A & B 会产生什么运行时效果？' }
    options:
      - { text: { en: 'None; code must still construct a value with the fields required by both types.', zh: '没有；代码仍须构造真正拥有两侧所需字段的值。' }, correct: true }
      - { text: { en: 'It calls Object.assign(A, B) during module loading.', zh: '模块加载时会调用 Object.assign(A, B)。' }, correct: false }
      - { text: { en: 'It copies B properties onto every A instance.', zh: '它会把 B 的属性复制到每个 A 实例。' }, correct: false }
      - { text: { en: 'It installs a runtime validator for both types.', zh: '它会为两个类型安装运行时验证器。' }, correct: false }
    explanation: { en: 'Type aliases and intersection operators are erased from emitted JavaScript. Object creation, merging, and validation require explicit runtime code.', zh: '类型别名和交叉运算符会从生成的 JavaScript 中擦除。对象创建、合并与验证都需要显式运行时代码。' }
    difficulty: beginner
    tags: [intersection-types, type-erasure, runtime]
    minutes: 3

  - id: review-generated-api-result
    type: review
    title: { en: 'Review a generated API result renderer', zh: '审查生成的 API 结果渲染器' }
    prompt: { en: 'Review this generated parser and renderer before it handles production API responses.', zh: '在这段生成的解析与渲染代码处理生产 API 响应前，对它进行审查。' }
    task: { en: 'Validate untrusted JSON, require a label, never log tokens, preserve a legitimate zero value, and fail compilation when a union member is added without rendering logic.', zh: '验证不可信 JSON，要求存在 label，不记录 token，保留合法的零值，并在新增联合成员却没有渲染逻辑时让编译失败。' }
    code: |
      type ApiResult =
        | { kind: "ok"; value: number; token: string }
        | { kind: "error"; message: string; token: string };

      type Displayable = ApiResult & { label: string };

      function parseResult(raw: string): Displayable {
        const parsed = JSON.parse(raw) as Displayable;
        return parsed;
      }

      function render(result: Displayable): string {
        console.log("result", JSON.stringify(result));

        switch (result.kind) {
          case "ok":
            if (!result.value) return `${result.label}:empty`;
            return `${result.label}:${result.value}`;
          case "error":
            return `${result.label}:${result.message}`;
          default:
            return "unknown";
        }
      }
    lang: typescript
    right: { en: 'The code gives results a literal discriminant, keeps member-specific access in matching cases, names the shared label constraint, and declares function return types.', zh: '代码为结果设置了字面量判别字段，只在对应 case 中访问成员专属字段，命名了共享 label 约束，并声明了函数返回类型。' }
    checklist:
      - { en: 'Parse under error handling and validate the container, discriminant, label, and member payload from unknown.', zh: '在错误处理内解析，并从 unknown 开始验证容器、判别字段、label 和成员载荷。' }
      - { en: 'Trace secrets through logs, returned strings, and thrown errors.', zh: '追踪秘密是否进入日志、返回字符串和抛出的错误。' }
      - { en: 'Test zero, missing fields, wrong primitive types, malformed JSON, and unknown discriminants.', zh: '测试零值、缺失字段、错误原始类型、损坏 JSON 和未知判别值。' }
      - { en: 'Require the remainder after known cases to be never.', zh: '要求处理已知分支后的剩余值为 never。' }
    issues:
      - line: 8
        kind: correctness
        note: { en: 'The assertion trusts arbitrary parsed data and does not verify either ApiResult member or the label required by the intersection; malformed JSON also throws uncontrolled.', zh: '断言信任任意解析数据，没有验证 ApiResult 的任一成员，也没有验证交叉类型要求的 label；损坏 JSON 还会不受控地抛出异常。' }
      - line: 13
        kind: security
        note: { en: 'Serializing the complete result writes the secret token to logs.', zh: '序列化完整 result 会把秘密 token 写入日志。' }
      - line: 17
        kind: edge-case
        note: { en: 'The truthiness check classifies a legitimate numeric zero as empty.', zh: '真值检查会把合法的数字零错误归类为空值。' }
      - line: 22
        kind: readability
        note: { en: 'The generic default hides future union members instead of proving an exhaustive never remainder.', zh: '通用默认分支会隐藏未来新增的联合成员，没有证明剩余值已穷尽为 never。' }
    explanation: { en: 'Parse to unknown under error handling, validate the discriminated union and label, log only approved fields, compare numeric cases explicitly, and make the default branch accept only never.', zh: '应在错误处理内把数据解析为 unknown，再验证可辨识联合与 label，只记录允许字段，显式比较数字情况，并让默认分支只接受 never。' }
    difficulty: advanced
    tags: [code-review, union-types, intersection-types, untrusted-input]
    minutes: 12
