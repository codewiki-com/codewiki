topic: typescript/generics
items:
  - id: predict-first-match
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      function firstMatch<T>(
        items: readonly T[],
        accepts: (item: T) => boolean,
      ): T | undefined {
        return items.find(accepts);
      }

      const result = firstMatch([3, 8, 13], (value) => value > 5);
      console.log(result);
    lang: typescript
    options:
      - { text: { en: '3', zh: '3' }, correct: false }
      - { text: { en: '8', zh: '8' }, correct: true }
      - { text: { en: '13', zh: '13' }, correct: false }
      - { text: { en: 'undefined', zh: 'undefined' }, correct: false }
    explanation: { en: 'T is inferred as number, and Array.find returns the first element for which the predicate is true. The generic changes static relationships, not find''s runtime order.', zh: 'T 被推断为 number，Array.find 返回第一个让谓词为真的元素。泛型改变的是静态类型关系，不会改变 find 的运行顺序。' }
    difficulty: beginner
    tags: [generics, inference, predict-output]

  - id: relationship-not-any
    type: mcq
    prompt: { en: 'What useful fact does <T>(value: T) => T express that (value: any) => any does not?', zh: '<T>(value: T) => T 表达了哪项 (value: any) => any 没有表达的事实？' }
    options:
      - { text: { en: 'The result preserves the input type selected for this call.', zh: '结果保留本次调用所选择的输入类型。' }, correct: true }
      - { text: { en: 'The function validates value at runtime.', zh: '函数会在运行时验证 value。' }, correct: false }
      - { text: { en: 'The function accepts only objects.', zh: '函数只接受对象。' }, correct: false }
      - { text: { en: 'TypeScript emits one JavaScript function per type.', zh: 'TypeScript 会为每种类型输出一份 JavaScript 函数。' }, correct: false }
    explanation: { en: 'The repeated T connects input and output for each call. It adds no runtime validation, and TypeScript erases the type parameter when emitting JavaScript.', zh: '重复出现的 T 会为每次调用连接输入与输出。它不会添加运行时验证，而且 TypeScript 输出 JavaScript 时会擦除这个类型参数。' }
    difficulty: beginner
    tags: [type-parameters, any, type-erasure]

  - id: constraint-capability
    type: mcq
    prompt: { en: 'What does T extends { id: string } guarantee inside a generic function?', zh: '在泛型函数中，T extends { id: string } 能保证什么？' }
    options:
      - { text: { en: 'Typed arguments have a string id, so the body may read that member.', zh: '经过类型检查的实参具有字符串 id，因此函数体可以读取该成员。' }, correct: true }
      - { text: { en: 'Every JSON value passed at runtime is validated automatically.', zh: '运行时传入的每个 JSON 值都会被自动验证。' }, correct: false }
      - { text: { en: 'Only instances of one named class are accepted.', zh: '只有某个具名类的实例才会被接受。' }, correct: false }
      - { text: { en: 'The id must be non-empty and authorized.', zh: 'id 必须非空且已经授权。' }, correct: false }
    explanation: { en: 'The structural constraint gives the checked body one static capability. It neither validates external values nor enforces domain rules such as format or authorization.', zh: '这个结构约束让经过检查的函数体获得一项静态能力。它既不验证外部值，也不执行格式或授权等领域规则。' }
    difficulty: intermediate
    tags: [generic-constraints, structural-typing, runtime-validation]

  - id: spot-asserted-parser
    type: spotbug
    prompt: { en: 'Find the false guarantee in this generated generic JSON helper.', zh: '找出这个生成的泛型 JSON 辅助函数作出的虚假保证。' }
    code: |
      function decode<T>(raw: string): T {
        return JSON.parse(raw) as T;
      }

      type Account = { id: string; active: boolean };
      const account = decode<Account>('{"active":"yes"}');
      console.log(account.id.toLowerCase());
    lang: typescript
    issues:
      - line: 2
        kind: security
        note: { en: 'The assertion labels unvalidated input as any caller-selected T; the payload has no id and active has the wrong runtime type.', zh: '这个断言把未经验证的输入标成调用者任意选择的 T；载荷缺少 id，而且 active 的运行时类型错误。' }
    explanation: { en: 'Parse to unknown and require a validator or schema that proves the requested type before returning it. Supplying <Account> is a static choice, not runtime parsing.', zh: '应先解析为 unknown，并要求验证器或模式在返回前证明目标类型。传入 <Account> 只是静态选择，不是运行时解析。' }
    difficulty: intermediate
    tags: [code-review, type-assertion, json]

  - id: review-generated-entity-index
    type: review
    prompt: { en: 'Review this generated generic response index before it is used by a CLI.', zh: '在命令行工具使用这段生成的通用响应索引前，对它进行审查。' }
    task: { en: 'Read an API array, validate that every item has a unique non-empty string id, index the items without reordering them, and print the count.', zh: '读取 API 数组，验证每项都有唯一且非空的字符串 id，在不重新排序的情况下建立索引，并输出数量。' }
    code: |
      type HasId = {
        id: string;
      };

      function indexResponse<T extends HasId>(raw: string): Map<string, T> {
        const parsed = JSON.parse(raw) as T[];
        parsed.sort((left, right) => left.id.localeCompare(right.id));

        const byId = new Map<string, T>();
        for (const item of parsed) {
          byId.set(item.id, item);
        }
        return byId;
      }

      type Account = HasId & { active: boolean };

      const raw = process.argv[2]!;
      console.log(indexResponse<Account>(raw).size);
    lang: typescript
    right: { en: 'The code gives the generic a minimal structural constraint, keeps the Map key and value types explicit, and exposes a clear Map return type.', zh: '代码为泛型设置了最小结构约束，明确保留 Map 的键值类型，并给出了清楚的 Map 返回类型。' }
    checklist:
      - { en: 'Parse external data to unknown and validate the array, fields, and domain rules.', zh: '把外部数据解析为 unknown，并验证数组、字段和领域规则。' }
      - { en: 'Test duplicate, empty, and missing ids instead of relying on a generic constraint.', zh: '测试重复、空值和缺失的 id，不要依赖泛型约束。' }
      - { en: 'Audit assertions and non-null assertions for a proved runtime precondition.', zh: '审核类型断言与非空断言，确认运行时前置条件已经得到证明。' }
      - { en: 'Remove sorting or copying when the stated result does not consume order.', zh: '如果任务结果不使用顺序，就删除排序或复制操作。' }
    issues:
      - line: 6
        kind: security
        note: { en: 'The assertion trusts attacker-controlled JSON as T[] without checking that it is an array or that each value matches HasId and Account.', zh: '这个断言把攻击者可控的 JSON 直接信任为 T[]，没有检查数组本身，也没有检查每项是否符合 HasId 与 Account。' }
      - line: 7
        kind: performance
        note: { en: 'Sorting the whole response is unnecessary because Map construction and the requested count do not consume item order.', zh: '建立 Map 和输出数量都不使用项目顺序，因此对整个响应排序是无用工作。' }
      - line: 11
        kind: correctness
        note: { en: 'Map.set silently overwrites an earlier item with the same id, violating the task''s uniqueness requirement instead of reporting the duplicate.', zh: 'Map.set 会静默覆盖具有相同 id 的旧项目，没有按任务要求报告重复值。' }
      - line: 18
        kind: edge-case
        note: { en: 'The non-null assertion hides a missing CLI argument; JSON.parse then fails before the program can report a useful input error.', zh: '非空断言掩盖了命令行参数缺失；JSON.parse 会直接失败，程序无法给出有用的输入错误。' }
    explanation: { en: 'Check the CLI argument, parse to unknown, validate every item and unique non-empty id, then build the Map in one pass. The generic should preserve a proved item type, not manufacture one.', zh: '应先检查命令行参数，再解析为 unknown，验证每项以及唯一且非空的 id，最后单次遍历建立 Map。泛型应保留已经证明的项目类型，而不是凭空制造类型。' }
    difficulty: advanced
    tags: [code-review, generics, runtime-validation, constraints]
