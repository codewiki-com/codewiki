topic: typescript/strict-mode
items:
  - id: predict-nullish-account-label
    type: predict
    prompt: { en: 'What does this strict TypeScript program print?', zh: '这段严格模式下的TypeScript程序会输出什么？' }
    code: |
      type Account = { id: number; label: string | null };
      const accounts: Account[] = [{ id: 1, label: null }];

      const account = accounts.find((item) => item.id === 1);
      const label = account?.label ?? `account-${account?.id ?? "missing"}`;
      console.log(label);
    lang: typescript
    options:
      - { text: { en: 'account-1', zh: 'account-1' }, correct: true }
      - { text: { en: 'null', zh: 'null' }, correct: false }
      - { text: { en: 'account-missing', zh: 'account-missing' }, correct: false }
      - { text: { en: 'It throws because label is null.', zh: '程序会因为label是null而抛错。' }, correct: false }
    explanation: { en: 'The account exists, but its label is null, so the right side of ?? runs. Optional access reads id as 1 and produces account-1.', zh: '账户存在，但label是null，因此会计算 ?? 右侧。可选链读取到id为1，最终得到account-1。' }
    difficulty: beginner
    tags: [strict-null-checks, nullish-coalescing, narrowing]

  - id: strict-umbrella-boundary
    type: mcq
    prompt: { en: 'Which option is not enabled by strict: true in TypeScript 6?', zh: 'TypeScript 6中，哪个选项不会由strict: true启用？' }
    options:
      - { text: { en: 'strictBuiltinIteratorReturn', zh: 'strictBuiltinIteratorReturn' }, correct: false }
      - { text: { en: 'useUnknownInCatchVariables', zh: 'useUnknownInCatchVariables' }, correct: false }
      - { text: { en: 'strictPropertyInitialization', zh: 'strictPropertyInitialization' }, correct: false }
      - { text: { en: 'noUncheckedIndexedAccess', zh: 'noUncheckedIndexedAccess' }, correct: true }
    explanation: { en: 'noUncheckedIndexedAccess is a separate hardening choice. TypeScript 6 includes the other three in the strict option family.', zh: 'noUncheckedIndexedAccess是独立的强化选项。TypeScript 6会通过strict选项组启用其余三项。' }
    difficulty: intermediate
    tags: [strict-mode, tsconfig, indexed-access]

  - id: spotbug-unvalidated-settings
    title: { en: 'Spot the bug in Client settings', zh: '找出Client设置里的bug' }
    type: spotbug
    prompt: { en: 'Find why this generated strict-mode client can still fail before making a request.', zh: '找出这个生成的严格模式客户端为何仍可能在发送请求前失败。' }
    code: |
      interface Settings {
        endpoint: string;
      }

      class Client {
        private endpoint!: string;

        load(text: string): void {
          const settings = JSON.parse(text) as Settings;
          this.endpoint = settings.endpoint;
        }

        request(): string {
          return this.endpoint.toUpperCase();
        }
      }
    lang: typescript
    issues:
      - line: 6
        kind: correctness
        note: { en: 'The definite assignment assertion hides that request can run before load, leaving endpoint undefined at runtime.', zh: '明确赋值断言掩盖了request可能先于load执行的问题，此时endpoint在运行时仍是undefined。' }
      - line: 9
        kind: edge-case
        note: { en: 'The assertion performs no runtime validation, so malformed JSON, null, or a missing endpoint can enter the client as Settings.', zh: '这个断言不会执行运行时验证，因此格式错误的JSON、null或缺少endpoint的对象都可能作为Settings进入客户端。' }
    explanation: { en: 'Parse into unknown, validate endpoint, and return a fully initialized Client from a constructor or factory. Do not use two assertions to hide one lifecycle gap.', zh: '应先把解析结果视为unknown并验证endpoint，再由构造函数或工厂返回完整初始化的Client。不要用两个断言掩盖同一个生命周期缺口。' }
    difficulty: intermediate
    tags: [runtime-validation, definite-assignment, type-assertion]

  - id: callback-variance-direction
    type: mcq
    prompt: { en: 'With strictFunctionTypes, which assignment is safe for function-property callbacks?', zh: '启用strictFunctionTypes后，函数属性形式的回调中哪项赋值是安全的？' }
    options:
      - { text: { en: 'Assign (dog: Dog) => void where (animal: Animal) => void is required.', zh: '需要 (animal: Animal) => void时赋入 (dog: Dog) => void。' }, correct: false }
      - { text: { en: 'Assign (animal: Animal) => void where (dog: Dog) => void is required.', zh: '需要 (dog: Dog) => void时赋入 (animal: Animal) => void。' }, correct: true }
      - { text: { en: 'Both directions are always safe because Dog extends Animal.', zh: '因为Dog继承Animal，所以两个方向始终安全。' }, correct: false }
      - { text: { en: 'Neither direction is allowed under strict mode.', zh: '严格模式下两个方向都不允许。' }, correct: false }
    explanation: { en: 'A handler able to accept every Animal can also accept every Dog the narrower caller supplies. A dog-only handler cannot safely receive an arbitrary Animal.', zh: '能处理所有Animal的函数也能处理较窄调用方传入的每个Dog。只处理Dog的函数不能安全接收任意Animal。' }
    difficulty: intermediate
    tags: [strict-function-types, contravariance, callbacks]

  - id: review-generated-runner
    title: { en: 'Review generated job runner', zh: '审查生成的任务运行器' }
    type: review
    prompt: { en: 'Review this generated strict-mode job runner before it is used in a service.', zh: '在服务中使用这个生成的严格模式任务运行器前，对它进行审查。' }
    task: { en: 'Load one job from untrusted JSON, validate its fields, prevent execution before loading, pass no service token to the handler, and report any thrown value safely.', zh: '从不可信JSON加载一个任务并验证字段，禁止加载前执行，不向处理器传递服务token，并安全报告任意抛出值。' }
    code: |
      type Job = {
        name: string;
        timeoutMs: number;
        serviceToken: string;
      };

      declare const readConfig: () => string;

      class Runner {
        private config!: Job;

        load(): void {
          this.config = JSON.parse(readConfig()) as Job;
        }

        run(handler: (job: Job) => void): void {
          try {
            handler(this.config);
          } catch (error) {
            console.log((error as Error).message);
          }
        }
      }
    lang: typescript
    right: { en: 'The Job shape is named, public methods have explicit return types, and the handler parameter records the value the runner intends to deliver.', zh: '代码为Job结构命名，为公开方法写出明确返回类型，处理器参数也记录了运行器准备传递的值。' }
    checklist:
      - { en: 'Run the entry point before load and with missing or mistyped JSON fields.', zh: '在load前运行入口，并测试JSON字段缺失或类型错误的情况。' }
      - { en: 'Trace secrets into every callback argument and diagnostic.', zh: '追踪每个回调参数和诊断信息中是否包含秘密。' }
      - { en: 'Throw an Error, a string, and null from the handler.', zh: '让处理器分别抛出Error、字符串和null。' }
      - { en: 'Inventory every assertion and name the proof it replaces.', zh: '清点每个断言，并指出它替代了哪项证明。' }
    issues:
      - line: 10
        kind: correctness
        note: { en: 'The definite assignment assertion suppresses initialization checking, so run can pass undefined when load has not completed.', zh: '明确赋值断言压制了初始化检查，因此load尚未完成时，run可能传入undefined。' }
      - line: 13
        kind: readability
        note: { en: 'The assertion makes unvalidated JSON look like a checked Job and hides all required field and domain checks.', zh: '这个断言让未经验证的JSON看起来像经过检查的Job，并隐藏了所有字段与领域检查。' }
      - line: 18
        kind: security
        note: { en: 'Passing the complete Job exposes serviceToken to a handler that only needs public job fields.', zh: '传递完整Job会向只需要公开任务字段的处理器暴露serviceToken。' }
      - line: 20
        kind: edge-case
        note: { en: 'JavaScript may throw a string or null, so asserting Error can produce an undefined message or throw while handling the first failure.', zh: 'JavaScript可能抛出字符串或null，因此断言为Error可能得到undefined消息，或在处理第一次失败时再次抛错。' }
    explanation: { en: 'Validate unknown JSON into a private fully initialized state, expose a token-free handler payload, and narrow caught values. A factory or explicit unloaded/loaded state removes the lifecycle assertion.', zh: '应把unknown JSON验证成私有且完整初始化的状态，向处理器暴露不含token的载荷，并收窄捕获值。工厂或显式的未加载、已加载状态可以移除生命周期断言。' }
    difficulty: advanced
    tags: [code-review, strict-mode, runtime-validation, secrets]
