topic: typescript/branded-types
items:
  - id: predict-runtime-brand
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      declare const brandKey: unique symbol;
      type OrderId = string & { readonly [brandKey]: "OrderId" };

      const orderId = "ord-9" as OrderId;
      console.log(typeof orderId);
      console.log(JSON.stringify(orderId));
    lang: typescript
    options:
      - { text: { en: "string\n\"ord-9\"", zh: "string\n\"ord-9\"" }, correct: true }
      - { text: { en: "OrderId\n{\"value\":\"ord-9\"}", zh: "OrderId\n{\"value\":\"ord-9\"}" }, correct: false }
      - { text: { en: "symbol\n\"ord-9\"", zh: "symbol\n\"ord-9\"" }, correct: false }
      - { text: { en: 'It throws because the brand property is missing.', zh: '程序会因为缺少品牌属性而抛出异常。' }, correct: false }
    explanation: { en: 'The declaration, intersection, and assertion are erased. The runtime value remains the primitive string ord-9, and JSON serializes that string normally.', zh: '声明、交叉类型和断言都会被擦除。运行时值仍是原始字符串 ord-9，JSON 会按普通字符串进行序列化。' }
    difficulty: intermediate
    tags: [branded-types, type-erasure, runtime]

  - id: brand-assignability-direction
    type: mcq
    prompt: { en: 'Given a correctly constructed UserId brand over number, which assignment is safe without another assertion?', zh: '对于在 number 上正确构造的 UserId 品牌，哪项赋值不需要另一个断言？' }
    options:
      - { text: { en: 'Assign a UserId to a number.', zh: '把 UserId 赋给 number。' }, correct: true }
      - { text: { en: 'Assign any number to a UserId.', zh: '把任意 number 赋给 UserId。' }, correct: false }
      - { text: { en: 'Assign a ProductId to a UserId.', zh: '把 ProductId 赋给 UserId。' }, correct: false }
      - { text: { en: 'Assign parsed JSON directly to a UserId.', zh: '把解析后的 JSON 直接赋给 UserId。' }, correct: false }
    explanation: { en: 'A branded number still satisfies number, but the base type and other brands lack the required marker. External data must pass through the constructor.', zh: '品牌化数字仍满足 number，但基础类型和其他品牌都缺少所需标记。外部数据必须先经过构造函数。' }
    difficulty: intermediate
    tags: [branded-types, assignability, structural-typing]

  - id: operation-brand-loss
    type: mcq
    prompt: { en: 'Why should addUsd(a, b) call the UsdCents constructor on a + b?', zh: '为什么 addUsd(a, b) 应在 a + b 后调用 UsdCents 构造函数？' }
    options:
      - { text: { en: 'Addition returns number and may violate range or safe-integer invariants.', zh: '加法返回 number，而且可能破坏范围或安全整数不变量。' }, correct: true }
      - { text: { en: 'Branded numbers cannot be arithmetic operands.', zh: '品牌化数字不能作为算术运算数。' }, correct: false }
      - { text: { en: 'The constructor adds a runtime symbol property used by addition.', zh: '构造函数会添加一个供加法使用的运行时符号属性。' }, correct: false }
      - { text: { en: 'TypeScript automatically converts the result to another currency.', zh: 'TypeScript 会自动把结果换算成另一种货币。' }, correct: false }
    explanation: { en: 'Brands do not propagate through numeric operators. A domain function must decide which invariants the operation preserves and validate the result accordingly.', zh: '品牌不会通过数字运算符传播。领域函数必须判断运算保留了哪些不变量，并据此验证结果。' }
    difficulty: advanced
    tags: [branded-types, arithmetic, invariants]

  - id: spotbug-weak-predicate
    title: { en: 'Spot the bug in the UserId predicate', zh: '找出 UserId 谓词里的 bug' }
    type: spotbug
    prompt: { en: 'Find the false proof in this generated UserId predicate.', zh: '找出这个生成的 UserId 类型谓词提供的错误证明。' }
    code: |
      declare const brandKey: unique symbol;
      type UserId = number & { readonly [brandKey]: "UserId" };

      function isUserId(value: unknown): value is UserId {
        return typeof value === "number";
      }

      const input: unknown = JSON.parse("-2");
      if (isUserId(input)) {
        console.log(`loading user ${input}`);
      }
    lang: typescript
    issues:
      - line: 5
        kind: correctness
        note: { en: 'The predicate proves only number, not the promised positive safe-integer invariant, so -2, NaN, fractions, and unsafe integers can receive UserId.', zh: '这个谓词只证明了 number，没有证明正安全整数不变量，因此 -2、NaN、小数和不安全整数都可能获得 UserId。' }
    explanation: { en: 'TypeScript trusts a type predicate body rather than proving it. Match every constructor condition, or call the constructor and return its validated result.', zh: 'TypeScript 会信任类型谓词，而不会证明函数体是否充分。谓词必须匹配构造函数的每项条件，或者直接调用构造函数并返回验证结果。' }
    difficulty: advanced
    tags: [type-predicate, runtime-validation, branded-types]

  - id: review-generated-transfer
    type: review
    title: { en: 'Review a generated transfer boundary', zh: '审查生成的转账边界' }
    prompt: { en: 'Review this generated transfer boundary before it handles untrusted JSON.', zh: '在这个生成的转账边界处理不可信 JSON 前，对它进行审查。' }
    task: { en: 'Parse positive safe-integer account IDs and cents, reject self-transfers, authorize the source account, and submit exactly the requested amount.', zh: '解析正安全整数账户 ID 和分值，拒绝向自己转账，验证付款账户权限，并准确提交请求金额。' }
    code: |
      declare const brandKey: unique symbol;

      type Brand<Value, Name extends string> = Value & {
        readonly [brandKey]: Name;
      };

      type AccountId = Brand<number, "AccountId">;
      type Cents = Brand<number, "Cents">;

      type Transfer = { from: AccountId; to: AccountId; cents: Cents };

      declare function sendTransfer(from: AccountId, to: AccountId, cents: Cents): void;

      function parseTransfer(raw: string): Transfer {
        const data = JSON.parse(raw) as Transfer;
        return data;
      }

      function submitTransfer(raw: string, currentAccount: AccountId): void {
        const transfer = parseTransfer(raw);
        if (transfer.from !== currentAccount) throw new Error("forbidden");

        const charged = transfer.cents + 25;
        sendTransfer(transfer.from, transfer.to, charged as Cents);
      }
    lang: typescript
    right: { en: 'The generated code names the two domain primitives, keeps parsing in a separate boundary function, and performs an explicit ownership check before calling the transfer service.', zh: '生成代码为两个领域原始值命名，把解析保留在独立的边界函数中，并在调用转账服务前显式检查付款账户所有权。' }
    checklist:
      - { en: 'Parse to unknown and validate every required field, primitive type, and numeric bound.', zh: '把数据解析为 unknown，并验证每个必填字段、原始类型和数字边界。' }
      - { en: 'List business edge cases such as equal source and destination accounts.', zh: '列出付款与收款账户相同等业务边界情况。' }
      - { en: 'Trace the exact amount from validated input to the side-effecting call.', zh: '从验证后的输入一路追踪准确金额，直到产生副作用的调用。' }
      - { en: 'Audit every assertion introduced after an operation that loses a brand.', zh: '审核品牌丢失的运算之后引入的每个断言。' }
    issues:
      - line: 15
        kind: security
        note: { en: 'The assertion grants all three brands to attacker-controlled JSON without checking the object shape, field types, positivity, or safe-integer range.', zh: '这个断言把三个品牌直接授予攻击者可控的 JSON，没有检查对象结构、字段类型、正数条件或安全整数范围。' }
      - line: 20
        kind: edge-case
        note: { en: 'No branch rejects a transfer whose source and destination are the same account, although the task requires it.', zh: '代码没有拒绝付款与收款账户相同的转账，但任务明确要求处理这种情况。' }
      - line: 23
        kind: correctness
        note: { en: 'Adding 25 changes the requested amount before submission, so the side effect no longer matches the validated request.', zh: '提交前加上 25 改变了请求金额，因此副作用不再符合已验证的请求。' }
      - line: 24
        kind: readability
        note: { en: 'The final assertion hides that arithmetic returned an unbranded number instead of using a named operation with an explicit invariant.', zh: '最后的断言掩盖了算术只返回无品牌数字的事实，没有使用具备明确不变量的命名操作。' }
    explanation: { en: 'Parse into unknown, construct each brand through one validated constructor, reject equal accounts, retain the ownership check, and pass the original validated cents. Do not repair brand loss with an unexplained assertion.', zh: '应把数据解析为 unknown，通过统一的验证构造函数创建每个品牌，拒绝相同账户，保留所有权检查，并传入原始的已验证分值。不要用无说明的断言修补品牌丢失。' }
    difficulty: advanced
    tags: [code-review, branded-types, authorization, runtime-validation]
