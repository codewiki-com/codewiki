topic: typescript/type-inference
items:
  - id: predict-contextual-map
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      const weights = [4, 7, 10];
      const labels = weights
        .filter((weight) => weight >= 7)
        .map((weight, index) => `${index}:${weight * 2}`);

      console.log(labels.join(" | "));
    lang: typescript
    options:
      - { text: { en: '0:14 | 1:20', zh: '0:14 | 1:20' }, correct: true }
      - { text: { en: '1:14 | 2:20', zh: '1:14 | 2:20' }, correct: false }
      - { text: { en: '0:8 | 1:14 | 2:20', zh: '0:8 | 1:14 | 2:20' }, correct: false }
      - { text: { en: 'It fails because the callback parameters have implicit any types.', zh: '程序失败，因为回调参数是隐式 any。' }, correct: false }
    explanation: { en: 'The number array context types both callbacks. Filtering leaves 7 and 10, then map receives fresh indexes 0 and 1 and doubles each value.', zh: 'number 数组为两个回调提供上下文类型。筛选后留下 7 和 10，map 再从索引 0、1 开始，并把每个值乘以 2。' }
    difficulty: beginner
    tags: [contextual-typing, arrays, predict-output]
    tests: npx tsx contextual_map.ts
    minutes: 3

  - id: object-property-widening
    type: mcq
    prompt: { en: 'What is the usual inferred type of config.mode in const config = { mode: "safe" }?', zh: '在 const config = { mode: "safe" } 中，config.mode 通常被推断成什么类型？' }
    options:
      - { text: { en: 'string, because the property remains mutable', zh: 'string，因为该属性仍然可修改' }, correct: true }
      - { text: { en: 'The literal type "safe", because config uses const', zh: '字面量类型 "safe"，因为 config 使用 const' }, correct: false }
      - { text: { en: '"safe" | "fast", inferred from likely future values', zh: '"safe" | "fast"，根据可能的未来值推断' }, correct: false }
      - { text: { en: 'never, because no reassignment appears', zh: 'never，因为代码中没有重新赋值' }, correct: false }
    explanation: { en: 'const prevents rebinding config but does not make mode readonly. The property widens so another string may be assigned later.', zh: 'const 禁止重新绑定 config，却不会让 mode 只读；该属性会拓宽，以便以后写入其他字符串。' }
    difficulty: beginner
    tags: [literal-widening, const, objects]
    minutes: 2

  - id: extracted-callback-context
    type: mcq
    prompt: { en: 'Why can extracting an inline map callback into const render = (item) => item.name introduce an error under noImplicitAny?', zh: '为什么把内联 map 回调抽成 const render = (item) => item.name 后，可能在 noImplicitAny 下产生错误？' }
    options:
      - { text: { en: 'The standalone function is checked before a later map call can provide contextual parameter types.', zh: '独立函数会先接受检查，后面的 map 调用无法为它补充上下文参数类型。' }, correct: true }
      - { text: { en: 'Arrow functions cannot receive contextual types.', zh: '箭头函数不能取得上下文类型。' }, correct: false }
      - { text: { en: 'map accepts only named function declarations.', zh: 'map 只接受具名函数声明。' }, correct: false }
      - { text: { en: 'const forces every parameter to become any.', zh: 'const 会强制把每个参数变成 any。' }, correct: false }
    explanation: { en: 'Contextual typing applies where the function expression is checked. Keep the callback inline or annotate the reusable function parameter and result.', zh: '上下文类型推断发生在函数表达式接受检查的位置。应保持回调内联，或者为可复用函数的参数和返回值添加注解。' }
    difficulty: intermediate
    tags: [contextual-typing, implicit-any, callbacks]
    minutes: 3

  - id: spotbug-untyped-handler
    type: spotbug
    prompt: { en: 'Find why this generated handler loses the event type even though register later expects one.', zh: '找出这段生成代码为何丢失事件类型，即使后面的 register 已经要求具体类型。' }
    code: |
      const handler = (event) => {
        console.log(event.id.toUpperCase());
      };

      declare function register(
        callback: (event: { id: string }) => void,
      ): void;

      register(handler);
    lang: typescript
    issues:
      - line: 1
        kind: correctness
        note: { en: 'The standalone function has no contextual signature when it is declared, so event is implicit any under strict checking; the later register call cannot retroactively type it.', zh: '独立函数在声明时没有上下文签名，因此严格检查下 event 是隐式 any；后面的 register 调用无法事后补回类型。' }
    explanation: { en: 'Annotate handler as (event: { id: string }) => void, annotate its parameter, or keep the short function expression directly inside register.', zh: '应把 handler 注解为 (event: { id: string }) => void，给参数添加注解，或者把短函数表达式直接写在 register 调用中。' }
    difficulty: intermediate
    tags: [implicit-any, callbacks, code-review]
    tests: npx tsc --strict --noEmit untyped_handler.ts
    minutes: 5

  - id: review-generated-invoice-summary
    type: review
    prompt: { en: 'Review this generated invoice summarizer before it becomes a public library function.', zh: '在这段生成的发票汇总代码成为公开库函数前，对它进行审查。' }
    task: { en: 'Parse an untrusted invoice array, validate each record, and return a stable InvoiceSummary for every input without sorting or exposing accidental inferred API changes.', zh: '解析不可信的发票数组，验证每条记录，并为每种输入返回稳定的 InvoiceSummary；不要排序，也不要暴露意外的推断 API 变化。' }
    code: |
      type Invoice = { id: string; cents: number };
      type InvoiceSummary = { count: number; totalCents: number };

      export function summarize(raw: string) {
        const invoices = JSON.parse(raw) as Invoice[];
        const cents = [];

        for (const invoice of invoices) {
          cents.push(invoice.cents);
        }

        cents.sort((left, right) => left - right);
        const totalCents = cents.reduce((sum, value) => sum + value, 0);

        if (cents.length === 0) {
          return null;
        }

        return { count: cents.length, totalCents };
      }
    lang: typescript
    right: { en: 'The code names its domain record and intended summary shape, uses a numeric comparator, and supplies an initial value to reduce so aggregation itself is defined for an empty array.', zh: '代码为领域记录和预期摘要结构命名，使用数值比较器，并为 reduce 提供初始值，因此聚合操作本身可以处理空数组。' }
    checklist:
      - { en: 'Keep JSON data unknown until the array and every required field pass runtime checks.', zh: '在数组和每个必填字段通过运行时检查前，让 JSON 数据保持为 unknown。' }
      - { en: 'Give exported functions the intended stable return contract and compare declaration output.', zh: '为导出函数写出预期稳定返回契约，并比较声明输出。' }
      - { en: 'Annotate empty domain collections instead of relying on evolving-array inference.', zh: '为空领域集合添加注解，不要依赖演化数组推断。' }
      - { en: 'Remove sorting, copying, or transforms that the requested result does not consume.', zh: '删除请求结果不会使用的排序、复制或转换。' }
    issues:
      - line: 4
        kind: correctness
        note: { en: 'The exported function has no InvoiceSummary return annotation, so the null branch becomes part of its inferred public contract instead of failing in the implementation.', zh: '导出函数没有 InvoiceSummary 返回注解，因此 null 分支会进入推断出的公开契约，而不是在实现中报错。' }
      - line: 5
        kind: security
        note: { en: 'The assertion trusts unvalidated JSON as Invoice[] without proving the array, id, cents type, finiteness, or allowed numeric range.', zh: '这个断言把未经验证的 JSON 信任为 Invoice[]，没有证明数组、id、cents 类型、有限性或允许的数值范围。' }
      - line: 6
        kind: readability
        note: { en: 'The empty cents array relies on control-flow evolution instead of recording its number[] element contract at creation.', zh: '空 cents 数组依赖控制流演化，没有在创建位置记录 number[] 元素契约。' }
      - line: 12
        kind: performance
        note: { en: 'Sorting every amount is unnecessary because count and sum do not depend on order.', zh: '数量和总和都不依赖顺序，因此对所有金额排序属于无用工作。' }
      - line: 16
        kind: edge-case
        note: { en: 'Returning null for an empty valid array violates the requirement to return a stable summary; the natural result is count 0 and totalCents 0.', zh: '对合法空数组返回 null 违反稳定摘要要求；自然结果应为 count 0 和 totalCents 0。' }
    explanation: { en: 'Parse to unknown, validate the array and each invoice, accumulate count and total in one pass, and annotate the export as returning InvoiceSummary. An empty input then returns the zero summary without a special nullable branch.', zh: '应先解析为 unknown，验证数组和每张发票，再单次遍历累计数量与总额，并把导出返回类型注解为 InvoiceSummary。空输入直接返回零值摘要，不需要特殊的可空分支。' }
    difficulty: advanced
    tags: [code-review, declaration-emit, runtime-validation, evolving-array]
    tests: npx tsc --strict --noEmit generated_invoice_summary.ts
    minutes: 12
