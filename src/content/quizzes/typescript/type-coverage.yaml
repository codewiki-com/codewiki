topic: typescript/type-coverage
items:
  - id: predict-any-property-chain
    type: predict
    prompt: { en: 'What does this program print when JSON.parse returns any?', zh: '当 JSON.parse 返回 any 时，这段程序会输出什么？' }
    code: |
      function total(text: string): number {
        const invoice = JSON.parse(text);
        return invoice.itmes?.length ?? 0;
      }

      console.log(total('{"items":[1,2]}'));
    lang: typescript
    options:
      - { text: { en: '0', zh: '0' }, correct: true }
      - { text: { en: '2', zh: '2' }, correct: false }
      - { text: { en: 'undefined', zh: 'undefined' }, correct: false }
      - { text: { en: 'TypeScript rejects the misspelled property.', zh: 'TypeScript 会拒绝拼错的属性。' }, correct: false }
    explanation: { en: 'The any result disables the property-name check, so itmes evaluates to undefined and ?? returns 0. A return annotation does not make the intermediate access safe.', zh: 'any 结果关闭了属性名检查，因此 itmes 得到 undefined，?? 返回 0。返回类型注解不能让中间的属性访问变安全。' }
    difficulty: beginner
    tags: [any, json, predict-output]

  - id: unknown-under-strict-coverage
    type: mcq
    prompt: { en: 'How does type-coverage treat a value explicitly typed as unknown?', zh: 'type-coverage 如何计算显式标为 unknown 的值？' }
    options:
      - { text: { en: 'It counts as covered in ordinary and strict mode, but must still be narrowed before use.', zh: '普通模式和严格模式都计为已覆盖，但使用前仍必须收窄。' }, correct: true }
      - { text: { en: 'It is always uncovered because unknown and any are aliases.', zh: '它始终未覆盖，因为 unknown 与 any 是别名。' }, correct: false }
      - { text: { en: 'It counts as covered only after a type assertion.', zh: '只有添加类型断言后才计为已覆盖。' }, correct: false }
      - { text: { en: 'It is ignored and removed from the denominator.', zh: '它会被忽略并从分母中移除。' }, correct: false }
    explanation: { en: 'unknown preserves uncertainty and blocks type-specific operations until narrowing. The metric looks for any and strict escape hatches; unknown is a covered type, not runtime validation.', zh: 'unknown 会保留不确定性，并在收窄前阻止依赖具体类型的操作。指标寻找 any 与严格逃生口；unknown 是已覆盖类型，但不是运行时验证。' }
    difficulty: intermediate
    tags: [unknown, strict-mode, measurement]

  - id: spotbug-asserted-profile
    type: spotbug
    prompt: { en: 'Find why this high-coverage profile formatter can still fail at runtime.', zh: '找出这个高覆盖率的资料格式化函数为何仍会在运行时失败。' }
    code: |
      type Profile = {
        name: string;
      };

      function displayName(raw: string): string {
        const profile = JSON.parse(raw) as Profile;
        return profile.name.toUpperCase();
      }

      console.log(displayName('{"name":null}'));
    lang: typescript
    issues:
      - line: 6
        kind: correctness
        note: { en: 'The assertion tells the checker to trust Profile but performs no runtime check on the parsed value.', zh: '这个断言要求检查器信任 Profile，却不会对解析值执行运行时检查。' }
      - line: 7
        kind: edge-case
        note: { en: 'A null or missing name reaches toUpperCase and throws even though the declared return type is string.', zh: 'name 为 null 或缺失时仍会调用 toUpperCase 并抛错，即使声明的返回类型是 string。' }
    explanation: { en: 'Parse into unknown and validate that the value is a non-null object with a string name. Coverage measures checker knowledge, not whether JSON supplied that shape.', zh: '应把解析结果视为 unknown，并验证它是拥有字符串 name 的非空对象。覆盖率衡量检查器掌握的类型，不证明 JSON 提供了该结构。' }
    difficulty: intermediate
    tags: [type-assertion, runtime-validation, type-safety]

  - id: comparable-coverage-baseline
    type: mcq
    prompt: { en: 'Which comparison provides a meaningful type-coverage regression signal?', zh: '哪种比较能提供有意义的类型覆盖率回归信号？' }
    options:
      - { text: { en: 'Two commits measured with the same compiler, tool, tsconfig, mode, and file set.', zh: '两个提交使用相同编译器、工具、tsconfig、模式与文件集合。' }, correct: true }
      - { text: { en: 'Two repositories that both report a rounded percentage.', zh: '两个都报告取整百分比的代码库。' }, correct: false }
      - { text: { en: 'A strict-mode result compared with an ordinary-mode result.', zh: '严格模式结果与普通模式结果比较。' }, correct: false }
      - { text: { en: 'A result before and after excluding generated and legacy directories.', zh: '排除生成目录与遗留目录前后的结果比较。' }, correct: false }
    explanation: { en: 'The ratio depends on both counting rules and scope. Holding those inputs constant makes a decrease evidence of a code change rather than a denominator change.', zh: '比率同时取决于计数规则和范围。固定这些输入后，下降才能说明代码发生变化，而不是分母改变。' }
    difficulty: intermediate
    tags: [ci, baseline, denominator]

  - id: review-generated-coverage-runner
    type: review
    prompt: { en: 'Review this generated coverage runner before it is added to CI.', zh: '在把这个生成的覆盖率运行器加入 CI 前，对它进行审查。' }
    task: { en: 'Read an untrusted JSON configuration, validate it, run type coverage once for the project without a shell, enforce the configured minimum, and report failure reliably.', zh: '读取不可信 JSON 配置并验证，不通过 shell 为项目运行一次类型覆盖率，执行配置的最低门槛，并可靠报告失败。' }
    code: |
      import { exec } from "node:child_process";

      type Config = {
        project: string;
        files: string[];
        minimum: number;
      };

      function check(configText: string): void {
        const config = JSON.parse(configText) as Config;
        for (const file of config.files) {
          const command = `npx type-coverage -p ${config.project} -- ${file}`;
          exec(command, (error, stdout) => {
            const match: any = stdout.match(/([0-9.]+)%/);
            const percent = Number(match[1]);
            console.log(`${file}: ${percent} >= ${config.minimum}`);
            if (error) process.exitCode = 1;
          });
        }
      }

      check(process.argv[2]!);
    lang: typescript
    right: { en: 'The code names the configuration shape, avoids a synchronous child process, preserves a failing exit code, and attempts to keep per-file diagnostics visible.', zh: '代码为配置结构命名，避免同步子进程，保留失败退出码，并尝试让逐文件诊断保持可见。' }
    checklist:
      - { en: 'Validate the configuration container, strings, file list, and numeric range before use.', zh: '使用前验证配置容器、字符串、文件列表与数值范围。' }
      - { en: 'Pass executable arguments as an array and test shell metacharacters in every external value.', zh: '把可执行参数作为数组传递，并用 shell 元字符测试每个外部值。' }
      - { en: 'Run one project-level measurement and rely on its exit status or documented JSON output.', zh: '只运行一次项目级度量，并依赖退出状态或有文档的 JSON 输出。' }
      - { en: 'Test missing input, malformed JSON, a missing executable, and a threshold failure.', zh: '测试输入缺失、JSON 损坏、可执行文件缺失和门槛失败。' }
    issues:
      - line: 10
        kind: correctness
        note: { en: 'The assertion accepts unvalidated JSON as Config, so wrong field types can control the loop, command, and comparison.', zh: '这个断言把未验证 JSON 当作 Config，因此错误字段类型可以控制循环、命令与比较。' }
      - line: 11
        kind: performance
        note: { en: 'Starting a complete TypeScript coverage process for every file repeatedly rebuilds project state instead of measuring the project once.', zh: '为每个文件启动完整的 TypeScript 覆盖率进程，会反复构建项目状态，而不是只度量一次项目。' }
      - line: 12
        kind: security
        note: { en: 'Interpolating project and file values into a shell command permits command injection from the untrusted configuration.', zh: '把 project 与 file 值插入 shell 命令，会让不可信配置造成命令注入。' }
      - line: 14
        kind: edge-case
        note: { en: 'Human-readable output may not match the regular expression; any hides the null case and match[1] can then throw.', zh: '人类可读输出可能不匹配正则；any 隐藏了 null 分支，随后访问 match[1] 会抛错。' }
    explanation: { en: 'Validate the JSON into a Config, use execFile or spawn with an argument array, run the project once with --at-least, and trust its exit status. Use documented JSON output only when structured data is required.', zh: '应先把 JSON 验证成 Config，使用 execFile 或 spawn 并传递参数数组，通过 --at-least 对项目只运行一次，再信任退出状态。只有需要结构化数据时才使用有文档的 JSON 输出。' }
    difficulty: advanced
    tags: [code-review, command-injection, ci, type-coverage]
