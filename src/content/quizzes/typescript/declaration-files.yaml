topic: typescript/declaration-files
items:
  - id: predict-types-erased
    type: predict
    prompt: { en: 'What does this program print after TypeScript erases its type-only declarations?', zh: 'TypeScript擦除仅类型声明后，这段程序会输出什么？' }
    code: |
      interface Invoice {
        id: string;
        total: number;
      }

      const invoice: Invoice = {
        id: "INV-204",
        total: 19.5,
      };

      console.log(`${invoice.id}: ${invoice.total.toFixed(2)}`);
    lang: typescript
    options:
      - { text: { en: 'INV-204: 19.50', zh: 'INV-204: 19.50' }, correct: true }
      - { text: { en: 'Invoice: INV-204: 19.50', zh: 'Invoice: INV-204: 19.50' }, correct: false }
      - { text: { en: 'It prints the Invoice interface before the value.', zh: '程序会先输出Invoice接口，再输出值。' }, correct: false }
      - { text: { en: 'It fails because interfaces need runtime constructors.', zh: '程序会失败，因为接口需要运行时构造函数。' }, correct: false }
    explanation: { en: 'The interface and annotation are erased. The object and template string remain as ordinary JavaScript, so only the formatted invoice line is printed.', zh: '接口和类型注解会被擦除。对象与模板字符串作为普通JavaScript保留，因此只会输出格式化后的发票信息。' }
    difficulty: beginner
    tags: [declaration-files, type-erasure]

  - id: ambient-does-not-implement
    type: mcq
    prompt: { en: 'What does declare function loadConfig(): Config do in a declaration file?', zh: '声明文件中的declare function loadConfig(): Config有什么作用？' }
    options:
      - { text: { en: 'It tells the checker that runtime code elsewhere supplies the function.', zh: '它告诉检查器，运行时函数由其他代码提供。' }, correct: true }
      - { text: { en: 'It emits a JavaScript function that returns Config.', zh: '它会输出一个返回Config的JavaScript函数。' }, correct: false }
      - { text: { en: 'It validates the returned object against Config at runtime.', zh: '它会在运行时根据Config验证返回对象。' }, correct: false }
      - { text: { en: 'It imports loadConfig from the nearest package.', zh: '它会从最近的包导入loadConfig。' }, correct: false }
    explanation: { en: 'An ambient declaration is a promise to the checker, not an implementation or validator. Loading and runtime behavior must be supplied and tested separately.', zh: '环境声明只是向检查器作出的承诺，不是实现或验证器。加载方式与运行时行为必须另行提供并测试。' }
    difficulty: beginner
    tags: [ambient-declarations, runtime-boundary]

  - id: spotbug-runtime-drift
    title: { en: 'Spot the bug in the Session declaration', zh: '找出Session声明里的bug' }
    type: spotbug
    prompt: { en: 'Find where this generated declaration disagrees with the documented JavaScript behavior.', zh: '找出这份生成声明与已记录JavaScript行为不一致的地方。' }
    code: |
      export interface Session {
        id: string;
        expiresAt: Date;
      }

      export declare function findSession(
        id: string,
      ): Session;

      export declare function renewSession(
        id: string,
        seconds?: number,
      ): Session;

      export declare const mode: "production";
    lang: typescript
    issues:
      - line: 8
        kind: edge-case
        note: { en: 'The implementation returns undefined when the ID is absent, so the return type must include undefined.', zh: '实现会在ID不存在时返回undefined，因此返回类型必须包含undefined。' }
      - line: 13
        kind: correctness
        note: { en: 'The implementation returns a Promise because renewal is asynchronous; this declaration claims a synchronous Session.', zh: '续期实现是异步的并返回Promise；这份声明却声称会同步返回Session。' }
      - line: 15
        kind: correctness
        note: { en: 'The runtime mode is configurable between development and production, so one production literal is too narrow.', zh: '运行时模式可在development与production之间配置，只声明production字面量过窄。' }
    explanation: { en: 'A declaration must follow observable runtime behavior, including missing results, asynchrony, and configurable values. Precision unsupported by the implementation is a bug.', zh: '声明必须符合可观察的运行时行为，包括缺失结果、异步性和可配置值。没有实现事实支撑的精确类型本身就是缺陷。' }
    difficulty: intermediate
    tags: [declaration-drift, async, optional-values]

  - id: package-subpath-resolution
    type: mcq
    prompt: { en: 'A package exports both "." and "./reports". What must its declarations cover?', zh: '一个包同时导出 "." 与 "./reports"，它的声明必须覆盖什么？' }
    options:
      - { text: { en: 'Only the package root, because TypeScript always reuses its index.d.ts for subpaths.', zh: '只需覆盖包根，因为TypeScript总会为子路径复用index.d.ts。' }, correct: false }
      - { text: { en: 'Each public subpath, with types matching that subpath’s runtime target and module format.', zh: '每个公开子路径，并让类型匹配该子路径的运行时目标与模块格式。' }, correct: true }
      - { text: { en: 'Only ./reports, because exports disables the package root.', zh: '只需覆盖 ./reports，因为exports会禁用包根。' }, correct: false }
      - { text: { en: 'No declarations when the JavaScript files use ESM syntax.', zh: 'JavaScript文件使用ESM语法时不需要声明。' }, correct: false }
    explanation: { en: 'Package exports form a public map. Every supported entry needs declarations that resolve with and accurately describe its corresponding runtime entry.', zh: '包导出是一张公开映射表。每个受支持入口都需要能够被解析、并且准确描述对应运行时入口的声明。' }
    difficulty: intermediate
    tags: [module-resolution, conditional-exports]

  - id: review-generated-payment-types
    type: review
    title: { en: 'Review a generated payment declaration', zh: '审查生成的支付声明' }
    prompt: { en: 'Review this generated local declaration and consumer wrapper.', zh: '审查这份生成的本地声明与使用方包装函数。' }
    task: { en: 'Type a named-export JavaScript package whose findCharge can return undefined, and expose a public receipt without the internal access token.', zh: '为一个使用命名导出的JavaScript包补充类型；findCharge可能返回undefined，并且公开收据不得包含内部access token。' }
    code: |
      declare module "legacy-payments" {
        interface Charge {
          id: string;
          cents: number;
          accessToken: string;
        }

        function findCharge(id: string): Charge;
        const client: { findCharge: typeof findCharge };
        export default client;
      }

      import client from "legacy-payments";

      type PublicReceipt = { id: string; cents: number };

      export function publicReceipt(id: string) {
        const charge = client.findCharge(id);
        return charge;
      }
    lang: typescript
    right: { en: 'The generated code gives the charge fields concrete types, keeps the dependency behind one wrapper, and names the intended token-free result shape as PublicReceipt.', zh: '生成代码为收费记录字段给出了具体类型，把依赖封装在一个包装函数之后，并用PublicReceipt命名了预期的不含令牌结果。' }
    checklist:
      - { en: 'Compare module export syntax with the packed JavaScript value.', zh: '把模块导出语法与打包后的JavaScript值逐项对照。' }
      - { en: 'Include every missing-result state in the declaration and wrapper control flow.', zh: '在声明与包装函数控制流中覆盖每种缺失结果状态。' }
      - { en: 'Write an explicit public return type and select only approved fields.', zh: '显式写出公开返回类型，并且只选择获准公开的字段。' }
      - { en: 'Keep local declarations in an owned file with a removal condition.', zh: '把本地声明放在有明确所有者的文件中，并记录移除条件。' }
    issues:
      - line: 1
        kind: readability
        note: { en: 'Embedding a package declaration in consumer implementation code obscures ownership and makes the temporary shim hard to find or remove.', zh: '把包声明嵌入使用方实现代码会模糊所有权，也让临时补丁难以查找和移除。' }
      - line: 8
        kind: edge-case
        note: { en: 'The declared return type omits undefined even though a missing charge is part of the runtime contract.', zh: '运行时契约包含收费记录不存在的情况，但声明返回类型遗漏了undefined。' }
      - line: 10
        kind: correctness
        note: { en: 'The declaration invents a default client export although the JavaScript package provides a named findCharge export.', zh: 'JavaScript包提供的是命名导出的findCharge，这份声明却虚构了默认导出的client。' }
      - line: 19
        kind: security
        note: { en: 'Returning Charge exposes accessToken and ignores the token-free PublicReceipt type required by the task.', zh: '返回Charge会暴露accessToken，也完全没有使用任务要求的不含令牌的PublicReceipt类型。' }
    explanation: { en: 'Move the declaration to an owned .d.ts file, model the named export and undefined result, then return PublicReceipt | undefined by constructing a new object from approved fields.', zh: '应把声明移到有明确所有者的 .d.ts文件，准确描述命名导出与undefined结果，再从获准字段构造并返回PublicReceipt | undefined。' }
    difficulty: advanced
    tags: [code-review, declaration-files, data-exposure, module-exports]
