topic: cpp/c-function-pointers
items:
  - id: predict-selected-operation
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      #include <stdio.h>

      typedef int (*Operation)(int, int);

      int add(int left, int right) { return left + right; }
      int multiply(int left, int right) { return left * right; }

      int main(void) {
          Operation current = add;
          printf("%d ", current(8, 2));
          current = multiply;
          printf("%d\n", current(8, 2));
      }
    lang: c
    options:
      - { text: { en: '10 16', zh: '10 16' }, correct: true }
      - { text: { en: '10 10', zh: '10 10' }, correct: false }
      - { text: { en: '16 16', zh: '16 16' }, correct: false }
      - { text: { en: 'The assignment to current is illegal.', zh: '给 current 再次赋值是非法操作。' }, correct: false }
    explanation: { en: 'current initially points to add, then is reassigned to the compatible multiply function. Each indirect call uses its current target.', zh: 'current 起初指向 add，随后改为指向类型兼容的 multiply。每次间接调用都使用它当时指向的目标。' }
    difficulty: beginner
    tags: [function-pointers, predict-output]

  - id: declaration-parentheses
    type: mcq
    prompt: { en: 'Which declaration makes handler a pointer to a function that takes int and returns int?', zh: '哪个声明表示 handler 是一个指针，指向接收 int 并返回 int 的函数？' }
    options:
      - { text: { en: 'int (*handler)(int);', zh: 'int (*handler)(int);' }, correct: true }
      - { text: { en: 'int *handler(int);', zh: 'int *handler(int);' }, correct: false }
      - { text: { en: 'int handler(*int);', zh: 'int handler(*int);' }, correct: false }
      - { text: { en: 'int handler(int *);', zh: 'int handler(int *);' }, correct: false }
    explanation: { en: 'Parentheses make * bind to handler before the function suffix. Without them, int *handler(int) declares a function returning int*.', zh: '括号让 * 先与 handler 组合，再应用函数后缀。没有括号时，int *handler(int) 声明的是返回 int* 的函数。' }
    difficulty: beginner
    tags: [declarations, precedence]

  - id: spotbug-overflowing-comparator
    title: { en: 'Spot the bug in the qsort comparator', zh: '找出 qsort 比较器里的 bug' }
    type: spotbug
    prompt: { en: 'Find the correctness bug in this qsort comparator.', zh: '找出这个 qsort 比较函数中的正确性缺陷。' }
    code: |
      typedef struct {
          int priority;
      } Job;

      int compare_jobs(const void *lhs, const void *rhs) {
          const Job *left = lhs;
          const Job *right = rhs;
          return left->priority - right->priority;
      }
    lang: c
    issues:
      - line: 8
        kind: correctness
        note: { en: 'Subtracting distant int values can overflow, so the comparator can have undefined behavior instead of defining an order.', zh: '两个差距很大的 int 相减可能溢出，使比较函数产生未定义行为，无法定义可靠顺序。' }
    explanation: { en: 'Build the sign from comparisons: (left->priority > right->priority) - (left->priority < right->priority). Relational results cannot overflow.', zh: '应从关系比较组成符号：(left->priority > right->priority) - (left->priority < right->priority)。关系表达式的结果不会溢出。' }
    difficulty: intermediate
    tags: [qsort, comparator, integer-overflow]

  - id: retained-context-lifetime
    type: mcq
    prompt: { en: 'An API retains a callback and void* context until unregister returns. Which context is safe to register?', zh: '某 API 会保留回调与 void* 上下文，直到 unregister 返回。哪种上下文可以安全注册？' }
    options:
      - { text: { en: 'The address of a local variable in a helper that returns immediately', zh: '一个立即返回的辅助函数中局部变量的地址' }, correct: false }
      - { text: { en: 'Storage whose lifetime extends through completed unregistration and any in-progress calls', zh: '生命周期覆盖注销完成及所有进行中调用的存储' }, correct: true }
      - { text: { en: 'Any pointer after casting it to void*', zh: '任何已经强转为 void* 的指针' }, correct: false }
      - { text: { en: 'A pointer to a temporary object used by the registration expression', zh: '注册表达式所用临时对象的指针' }, correct: false }
    explanation: { en: 'void* erases the object type but does not extend lifetime or transfer ownership. The context must remain alive for every possible callback access.', zh: 'void* 会擦除对象类型，却不会延长生命周期或转移所有权。每次可能的回调访问发生时，上下文都必须仍然存活。' }
    difficulty: intermediate
    tags: [callbacks, lifetime, context]

  - id: review-generated-route-registry
    title: { en: 'Review generated route registry', zh: '审查生成的路由注册表' }
    type: review
    prompt: { en: 'Review this generated callback route registry.', zh: '审查这个生成的回调路由注册表。' }
    task: { en: 'Store up to eight routes with unique ids, reject null handlers, and dispatch the one matching route once. Return whether dispatch found a route; the caller owns every context.', zh: '保存最多 8 条 id 唯一的路由，拒绝空处理器，并且只调用一次匹配路由。dispatch 返回是否找到路由；所有上下文都由调用方拥有。' }
    code: |
      typedef void (*Handler)(const char *message, void *context);

      typedef struct {
          unsigned id;
          Handler handler;
          void *context;
      } Route;

      static Route routes[8];
      static size_t route_count = 0;

      int add_route(unsigned id, Handler handler, void *context) {
          routes[route_count++] = (Route){id, handler, context};
          return 1;
      }

      int dispatch(unsigned id, const char *message) {
          for (size_t index = 0; index < 8; ++index) {
              if (routes[index].id == id) {
                  routes[index].handler(message, routes[index].context);
              }
          }
          return 0;
      }
    lang: c
    right: { en: 'The generated code gives all handlers one named signature, groups each handler with its id and context, and uses size_t for array indexing.', zh: '生成代码为所有处理器定义了同一个具名签名，把处理器与 id、上下文放在同一结构体中，并用 size_t 进行数组索引。' }
    checklist:
      - { en: 'Check capacity, duplicate ids, and required pointers before changing the registry.', zh: '修改注册表前检查容量、重复 id 和必需指针。' }
      - { en: 'Iterate only over initialized entries and stop after a unique match.', zh: '只遍历已初始化表项，并在找到唯一匹配项后停止。' }
      - { en: 'Make return values distinguish success, not found, and registration failure.', zh: '让返回值能够区分成功、未找到和注册失败。' }
      - { en: 'Verify that caller-owned contexts outlive every dispatch and completed removal.', zh: '确认调用方拥有的上下文覆盖每次分发和完整移除过程。' }
    issues:
      - line: 13
        kind: security
        note: { en: 'There is no capacity check, so a ninth registration writes beyond routes.', zh: '代码没有检查容量，第 9 次注册会写出 routes 的边界。' }
      - line: 13
        kind: edge-case
        note: { en: 'A null handler is accepted and later called; duplicate ids are also accepted despite the task.', zh: '代码会接收空处理器并在之后调用，而且与任务要求相反，它也接受重复 id。' }
      - line: 18
        kind: correctness
        note: { en: 'The loop examines all capacity slots instead of route_count, so id 0 can match a zero-initialized unused entry.', zh: '循环遍历全部容量，而不是 route_count，因此 id 为 0 时可能匹配到零初始化的未用表项。' }
      - line: 18
        kind: performance
        note: { en: 'The search scans unused slots and continues after the supposedly unique match instead of returning immediately.', zh: '查找会扫描未用表项，而且找到本应唯一的匹配项后仍不立即返回。' }
      - line: 23
        kind: readability
        note: { en: 'dispatch always returns 0, making the promised found/not-found result misleading to callers.', zh: 'dispatch 始终返回 0，使它向调用方承诺的“找到或未找到”结果难以理解。' }
    explanation: { en: 'Validate handler, capacity, and uniqueness before insertion. Dispatch over route_count, call one non-null handler, and return 1 immediately; return 0 only when no initialized route matches.', zh: '插入前应验证处理器、容量和唯一性。dispatch 只遍历 route_count，调用一个非空处理器后立即返回 1；只有已初始化路由均不匹配时才返回 0。' }
    difficulty: advanced
    tags: [code-review, callbacks, bounds, lifetime]
