topic: cpp/references
items:
  - id: predict-reference-assignment
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      #include <iostream>

      int main() {
          int first = 10;
          int second = 20;
          int& current = first;
          current = second;
          second = 30;
          std::cout << first << ' ' << current << ' ' << second << '\n';
      }
    lang: cpp
    options:
      - { text: { en: '20 20 30', zh: '20 20 30' }, correct: true }
      - { text: { en: '10 30 30', zh: '10 30 30' }, correct: false }
      - { text: { en: '10 20 30', zh: '10 20 30' }, correct: false }
      - { text: { en: 'The assignment reseats current, so behavior is undefined.', zh: '赋值让 current 改绑，因此行为未定义。' }, correct: false }
    explanation: { en: 'Assigning through current writes second’s value into first; it does not reseat the reference. The later change to second therefore does not affect first.', zh: '通过 current 赋值会把 second 的值写入 first，而不会让引用改绑。因此，随后修改 second 不会影响 first。' }
    difficulty: beginner
    tags: [lvalue-reference, assignment, predict-output]

  - id: temporary-parameter-lifetime
    type: mcq
    prompt: { en: 'A function stores a const std::string& parameter that was bound to a temporary argument. How long does that temporary normally live?', zh: '函数保存了一个绑定临时实参的 const std::string& 形参。该临时对象通常存活多久？' }
    options:
      - { text: { en: 'Until the stored reference is destroyed', zh: '直到保存下来的引用被销毁' }, correct: false }
      - { text: { en: 'Until the end of the full expression containing the call', zh: '直到包含该调用的完整表达式结束' }, correct: true }
      - { text: { en: 'Until the program exits', zh: '直到程序退出' }, correct: false }
    explanation: { en: 'Binding a temporary to a reference parameter does not extend it to the lifetime of a retained reference. Using the stored reference after the full expression ends can dangle.', zh: '临时对象绑定到引用形参时，生命周期不会延长到后来保存的引用。完整表达式结束后再使用所保存引用，可能发生悬空。' }
    difficulty: intermediate
    tags: [temporary-lifetime, const-reference]

  - id: spot-dangling-return
    title: { en: 'Spot the bug in the Result factory', zh: '找出 Result 工厂里的 bug' }
    type: spotbug
    prompt: { en: 'Find the lifetime bug in this generated result factory.', zh: '找出这段生成结果工厂中的生命周期错误。' }
    code: |
      #include <string>
      struct Result {
          const std::string& name;
      };
      Result make_result() {
          std::string local = "ready";
          return {local};
      }
    lang: cpp
    issues:
      - line: 7
        kind: correctness
        note: { en: 'The returned Result holds a reference to local, which is destroyed when make_result returns.', zh: '返回的 Result 保存了 local 的引用，而 local 会在 make_result 返回时销毁。' }
    explanation: { en: 'A reference member does not extend the life of an automatic local object. Store an owning std::string in Result or make the owner’s lifetime explicit.', zh: '引用成员不会延长自动局部对象的生命周期。应让 Result 保存自有的 std::string，或明确建立更长寿命的所有者。' }
    difficulty: intermediate
    tags: [dangling-reference, return-value]

  - id: forwarding-reference-context
    type: mcq
    prompt: { en: 'Which declaration has a forwarding reference parameter?', zh: '下面哪个声明的形参是转发引用？' }
    options:
      - { text: { en: 'template<class T> void relay(T&& value)', zh: 'template<class T> void relay(T&& value)' }, correct: true }
      - { text: { en: 'void relay(std::string&& value)', zh: 'void relay(std::string&& value)' }, correct: false }
      - { text: { en: 'template<class T> void relay(const T&& value)', zh: 'template<class T> void relay(const T&& value)' }, correct: false }
      - { text: { en: 'template<class T> struct Box { void relay(T&& value); }', zh: 'template<class T> struct Box { void relay(T&& value); }' }, correct: false }
    explanation: { en: 'The first parameter is an unqualified T&& in a context where T is deduced for that call. The other forms are ordinary rvalue references.', zh: '第一项是在调用处推导 T 的无 cv 限定 T&&。其他形式都是普通右值引用。' }
    difficulty: intermediate
    tags: [forwarding-reference, template-deduction]

  - id: review-delayed-registry
    type: review
    title: { en: 'Review a generated registry', zh: '审查一段生成的注册表' }
    prompt: { en: 'Review this generated registry for reference lifetime, edge cases, and unnecessary work.', zh: '从引用生命周期、边界情况和多余工作角度审查这段生成的注册表。' }
    task: { en: 'Expose a display name, search stored names, and queue a callback for the first name.', zh: '提供显示名称、搜索已有名称，并为第一个名称排入回调。' }
    code: |
      #include <functional>
      #include <string>
      #include <vector>
      using Callback = std::function<void()>;
      class Registry {
      public:
          const std::string& display_name(std::string fallback) const {
              if (names_.empty()) return fallback;
              return names_.front();
          }
          bool contains(const std::string& needle) const {
              for (std::string name : names_) {
                  if (name == needle) return true;
              }
              return false;
          }
          void schedule_first(std::vector<Callback>& pending) {
              const std::string& name = names_.front();
              pending.push_back([this, &name] { use(name); });
          }
      private:
          void use(const std::string&) const;
          std::vector<std::string> names_;
      };
    lang: cpp
    issues:
      - line: 8
        kind: correctness
        note: { en: 'fallback is a by-value parameter, so returning a reference to it leaves a dangling reference when the call ends.', zh: 'fallback 是按值形参，调用结束后再返回它的引用会产生悬空引用。' }
      - line: 12
        kind: performance
        note: { en: 'The loop copies every string although it only compares them; const std::string& avoids that work.', zh: '循环只比较字符串，却复制了每个元素；改用 const std::string& 可避免这些操作。' }
      - line: 18
        kind: edge-case
        note: { en: 'front() requires a non-empty vector, but schedule_first does not handle an empty registry.', zh: 'front() 要求 vector 非空，但 schedule_first 没有处理空注册表。' }
      - line: 19
        kind: readability
        note: { en: 'The escaping callback hides dependencies on both this and an element reference; its owner and invalidation contract are not visible to the caller.', zh: '逃逸回调隐藏了对 this 和元素引用的依赖，调用方看不到所有者与失效契约。' }
    right: { en: 'The class keeps storage private, marks observer operations const, and uses a named Callback type that makes the queue interface readable.', zh: '该类把存储保持为 private，为只读操作添加了 const，并用命名 Callback 类型让队列接口更易读。' }
    checklist:
      - { en: 'Trace every returned or captured reference to an owner that outlives its last use.', zh: '把每个返回或捕获的引用追溯到能活过最后一次使用的所有者。' }
      - { en: 'Check preconditions before front, back, indexing, or dereference.', zh: '在调用 front、back、索引或解引用前检查前置条件。' }
      - { en: 'Use references in read-only loops to avoid unintended element copies.', zh: '只读循环使用引用，避免无意复制元素。' }
      - { en: 'Make queued-work cancellation and container invalidation explicit.', zh: '明确排队任务的取消方式和容器失效条件。' }
    explanation: { en: 'Return an owning fallback value, iterate by const reference, handle the empty case, and queue data with a lifetime that is independent of later vector mutation and Registry destruction.', zh: '应按值返回自有的后备名称，按 const 引用迭代，处理空容器，并让排队数据的生命周期不受后续 vector 修改和 Registry 销毁影响。' }
    difficulty: advanced
    minutes: 8
    tags: [code-review, references, lifetime, invalidation]
