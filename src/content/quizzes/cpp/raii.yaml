topic: cpp/raii
items:
  - id: predict-unwinding-order
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      #include <iostream>
      #include <stdexcept>

      struct Guard {
          int id;
          Guard(int value) : id(value) { std::cout << "+" << id << '\n'; }
          ~Guard() { std::cout << "-" << id << '\n'; }
      };

      void run() {
          Guard first(1);
          Guard second(2);
          throw std::runtime_error("stop");
      }

      int main() {
          try { run(); }
          catch (const std::exception&) { std::cout << "caught\n"; }
      }
    lang: cpp
    options:
      - { text: { en: "+1\n+2\n-2\n-1\ncaught", zh: "+1\n+2\n-2\n-1\ncaught" }, correct: true }
      - { text: { en: "+1\n+2\ncaught\n-2\n-1", zh: "+1\n+2\ncaught\n-2\n-1" }, correct: false }
      - { text: { en: "+1\n+2\n-1\n-2\ncaught", zh: "+1\n+2\n-1\n-2\ncaught" }, correct: false }
      - { text: { en: "+1\n+2\ncaught", zh: "+1\n+2\ncaught" }, correct: false }
    explanation: { en: 'Stack unwinding destroys fully constructed local objects in reverse construction order before control enters the matching handler.', zh: '栈展开会在控制进入匹配处理器之前，按构造的逆序销毁已完成构造的局部对象。' }
    difficulty: intermediate
    tags: [stack-unwinding, destruction-order]

  - id: constructor-throws-members
    type: mcq
    prompt: { en: 'A resource-owning constructor throws after two RAII members finish construction. What is destroyed?', zh: '资源所有型构造函数在两个RAII成员完成构造后抛出。哪些对象会析构？' }
    options:
      - { text: { en: 'The two completed members are destroyed in reverse order, but the incomplete outer object is not.', zh: '两个已完成成员按逆序销毁，但未完成的外层对象不析构。' }, correct: true }
      - { text: { en: 'Only the outer object destructor runs.', zh: '只执行外层对象的析构函数。' }, correct: false }
      - { text: { en: 'Every declared member is destroyed, including members never constructed.', zh: '所有已声明成员都会销毁，包括从未构造的成员。' }, correct: false }
      - { text: { en: 'Nothing is destroyed because construction failed.', zh: '因为构造失败，所以不会销毁任何对象。' }, correct: false }
    explanation: { en: 'A complete object never came into existence, so its destructor does not run. Fully constructed base and member subobjects still clean themselves up.', zh: '完整对象从未形成，因此不会执行它的析构函数；已完成构造的基类和成员子对象仍会自行清理。' }
    difficulty: intermediate
    tags: [construction-failure, member-lifetime]

  - id: spot-shallow-handle-copy
    title: { en: 'Spot the bug in the Socket wrapper', zh: '找出Socket包装器里的bug' }
    type: spotbug
    prompt: { en: 'Find the ownership bug in this generated socket wrapper.', zh: '找出这个生成式套接字包装器中的所有权错误。' }
    code: |
      class Socket {
      public:
          explicit Socket(int fd) : fd_(fd) {}
          ~Socket() { close_socket(fd_); }
          int get() const { return fd_; }
      private:
          int fd_;
      };

      void send_probe(Socket socket) {
          send_bytes(socket.get(), "ping");
      }
    lang: cpp
    issues:
      - line: 10
        kind: correctness
        note: { en: 'Passing by value uses the compiler-generated copy constructor. The parameter and caller object then own the same descriptor and both close it.', zh: '按值传参会调用编译器生成的复制构造函数。形参和调用方对象随后拥有同一个描述符，并会重复关闭。' }
    explanation: { en: 'An exclusive handle owner should delete copying and implement or compose safe moving. A function that only uses the socket should accept a reference or an explicitly borrowed handle.', zh: '独占句柄所有者应删除复制，并实现或组合出安全移动。只使用套接字的函数应接收引用或明确的借用句柄。' }
    difficulty: intermediate
    tags: [exclusive-ownership, special-members]

  - id: raii-versus-strong-guarantee
    type: mcq
    prompt: { en: 'A function uses vector for all temporary memory but appends to its caller’s vector before a later operation throws. What does RAII establish?', zh: '函数用vector管理所有临时内存，却在后续操作抛出前已向调用方的vector追加数据。RAII能保证什么？' }
    options:
      - { text: { en: 'Temporary resources are cleaned up, but the caller-visible append means the strong guarantee is not automatic.', zh: '临时资源会清理，但调用方可见的追加说明强保证不会自动成立。' }, correct: true }
      - { text: { en: 'The caller’s vector is automatically rolled back.', zh: '调用方的vector会自动回滚。' }, correct: false }
      - { text: { en: 'No operation inside an RAII-using function can throw.', zh: '使用RAII的函数内部不会有任何操作抛出。' }, correct: false }
      - { text: { en: 'The function necessarily provides the no-throw guarantee.', zh: '该函数必然提供不抛出保证。' }, correct: false }
    explanation: { en: 'RAII controls resource lifetime. The strong guarantee also needs a state-transition design, commonly preparing temporary state and committing through a non-throwing operation.', zh: 'RAII管理资源生命周期；强保证还需要状态转换设计，常见做法是先准备临时状态，再用不抛出的操作提交。' }
    difficulty: intermediate
    tags: [exception-safety, strong-guarantee]

  - id: review-generated-report-file
    title: { en: 'Repair a generated file owner', zh: '修复生成式文件所有者' }
    type: review
    prompt: { en: 'Review this generated report-file wrapper and export function.', zh: '审查这个生成式报表文件包装器与导出函数。' }
    task: { en: 'Own a FILE exclusively, reject open failure, write report text safely, and let callers observe close failure without throwing from destruction.', zh: '独占FILE，拒绝打开失败，安全写入报表文本，让调用方能观察关闭失败，同时不从析构函数抛出。' }
    code: |
      class ReportFile {
      public:
          explicit ReportFile(const char* path)
              : file_(std::fopen(path, "w")) {}
          ~ReportFile() { close(); }
          void write(std::string text) {
              std::fprintf(file_, text.c_str());
          }
          void close() {
              if (file_ && std::fclose(file_) != 0) {
                  throw std::runtime_error("close failed");
              }
          }
      private:
          std::FILE* file_;
      };

      void export_report(const std::string& report, const char* path) {
          ReportFile file(path);
          file.write(report);
      }
    lang: cpp
    right: { en: 'The code puts the handle behind a small type, attempts cleanup in the destructor, accepts the export input by const reference, and gives close failure a specific diagnostic.', zh: '代码把句柄封装进小型类型，在析构时尝试清理，通过const引用接收导出内容，并为关闭失败给出具体诊断。' }
    checklist:
      - { en: 'Trace null, open, write, explicit close, and destructor states.', zh: '跟踪空值、打开、写入、显式关闭和析构状态。' }
      - { en: 'Check copying, moving, borrowing, and repeated close calls.', zh: '检查复制、移动、借用和重复关闭调用。' }
      - { en: 'Test report text containing percent conversion sequences.', zh: '测试包含百分号转换序列的报表文本。' }
      - { en: 'Separate reportable close errors from non-throwing fallback cleanup.', zh: '区分需要报告的关闭错误与不抛出的兜底清理。' }
    issues:
      - line: 4
        kind: edge-case
        note: { en: 'The constructor accepts a null result from fopen, creating an apparently usable object whose write passes null to std::fprintf.', zh: '构造函数接受fopen的空结果，产生一个看似可用的对象；write随后会把空指针传给std::fprintf。' }
      - line: 5
        kind: correctness
        note: { en: 'The destructor calls a function that can throw. An escaping exception crosses the destructor’s non-throwing boundary and can terminate, especially during unwinding.', zh: '析构函数调用了可能抛出的函数。异常若越过析构的不抛出边界会导致终止，栈展开期间尤其危险。' }
      - line: 7
        kind: security
        note: { en: 'Untrusted report text is used as a printf format string. A percent sequence can read nonexistent arguments; use "%s" or a length-aware write.', zh: '不可信报表文本被当作printf格式串。百分号序列可能读取不存在的参数；应使用 "%s" 或带长度的写入。' }
      - line: 15
        kind: readability
        note: { en: 'A raw FILE pointer plus handwritten cleanup obscures ownership and special-member behavior that unique_ptr with a FILE deleter could encode.', zh: '裸FILE指针和手写清理掩盖了所有权与特殊成员行为；带FILE删除器的unique_ptr可以直接表达这些语义。' }
    explanation: { en: 'Use a standard move-only owner with a non-throwing deleter, reject fopen failure during construction, and write data with a fixed format. An explicit close can report failure after marking the stream no longer owned; destruction remains a no-throw fallback.', zh: '应使用带不抛出删除器的标准只移动所有者，在构造时拒绝fopen失败，并用固定格式写数据。显式close可在标记不再拥有流后报告失败，析构则保持不抛出的兜底路径。' }
    difficulty: advanced
    tags: [code-review, file-handle, destructor, format-string]
