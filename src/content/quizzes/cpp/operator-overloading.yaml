topic: cpp/operator-overloading
items:
  - id: predict-addition-preserves-left
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      #include <iostream>

      class Counter {
          int value_;

      public:
          explicit Counter(int value) : value_(value) {}

          Counter& operator+=(int amount) {
              value_ += amount;
              return *this;
          }

          friend Counter operator+(Counter left, int right) {
              left += right;
              return left;
          }

          int value() const { return value_; }
      };

      int main() {
          Counter original{4};
          Counter result = original + 3;
          std::cout << original.value() << ' ' << result.value() << '\n';
      }
    lang: cpp
    options:
      - { text: { en: '4 7', zh: '4 7' }, correct: true }
      - { text: { en: '7 7', zh: '7 7' }, correct: false }
      - { text: { en: '4 4', zh: '4 4' }, correct: false }
      - { text: { en: 'The program fails because operator+ cannot call operator+=.', zh: '程序编译失败，因为 operator+ 不能调用 operator+=。' }, correct: false }
    explanation: { en: 'operator+ receives a copy of original, changes that copy through operator+=, and returns it. The original object therefore remains 4.', zh: 'operator+ 接收 original 的副本，通过 operator+= 修改副本后返回，因此原对象仍为 4。' }
    difficulty: beginner
    tags: [binary-operator, compound-assignment, value-semantics]
    tests: 'g++ -std=c++23 predict-addition-preserves-left.cpp && ./a.out'

  - id: hidden-friend-lookup
    type: mcq
    prompt: { en: 'Why can an expression a + b find operator+ defined as a friend inside the class of a and b?', zh: '为什么表达式 a + b 能找到定义在 a 与 b 所属类中的友元 operator+？' }
    options:
      - { text: { en: 'Argument-dependent lookup adds the hidden friend as a candidate.', zh: '参数依赖查找会把隐藏友元加入候选。' }, correct: true }
      - { text: { en: 'Every friend function is a private member function.', zh: '所有友元函数都是私有成员函数。' }, correct: false }
      - { text: { en: 'The compiler searches every class definition in the program.', zh: '编译器会搜索程序中的每个类定义。' }, correct: false }
      - { text: { en: 'friend changes the operator into a built-in operation.', zh: 'friend 会把该运算符变成内置运算。' }, correct: false }
    explanation: { en: 'A friend defined in the class is still a non-member. ADL considers functions associated with the argument types, which makes this hidden friend a candidate.', zh: '定义在类内的友元仍是非成员函数。ADL 会考虑与实参类型关联的函数，因此这个隐藏友元会成为候选。' }
    difficulty: intermediate
    tags: [hidden-friend, adl, lookup]

  - id: spot-value-subscript
    type: spotbug
    prompt: { en: 'The task requires writable indexing and reading through const objects. Find the operator bug.', zh: '任务要求下标可写，并能通过 const 对象读取。请找出运算符错误。' }
    code: |
      #include <cstddef>
      #include <vector>

      class Scores {
          std::vector<int> values_{0, 0, 0};

      public:
          int operator[](std::size_t index) {
              return values_.at(index);
          }
      };

      void award_bonus(Scores& scores) {
          scores[0] = 10;
      }
    lang: cpp
    issues:
      - line: 8
        lines: 3
        kind: correctness
        note: { en: 'Returning int by value makes scores[0] non-assignable, and the non-const member cannot serve reads from const Scores. Provide int& and const int& overloads with matching bounds behavior.', zh: '按值返回 int 会让 scores[0] 无法赋值，非 const 成员也不能读取 const Scores。应提供返回 int& 与 const int& 的两个重载，并保持一致的边界行为。' }
    explanation: { en: 'Element-like indexing normally needs a writable reference overload and a const-reference overload. Here at() already supplies checked access, so both wrappers should retain that policy.', zh: '元素式下标通常需要可写引用重载和 const 引用重载。这里已经使用 at() 检查边界，两个包装重载都应保留该策略。' }
    difficulty: intermediate
    tags: [subscript-operator, const-correctness, references]

  - id: defaulted-three-way-equality
    type: mcq
    prompt: { en: 'In C++23, what happens when a class defines auto operator<=>(const T&) const = default; and declares no operator==?', zh: '在 C++23 中，类定义 auto operator<=>(const T&) const = default; 且没有声明 operator== 时会怎样？' }
    options:
      - { text: { en: 'A matching defaulted operator== is declared implicitly.', zh: '编译器会隐式声明匹配的默认 operator==。' }, correct: true }
      - { text: { en: 'Equality is unavailable until operator== is written by hand.', zh: '必须手写 operator== 才能使用相等比较。' }, correct: false }
      - { text: { en: 'operator== compares object addresses.', zh: 'operator== 会比较对象地址。' }, correct: false }
      - { text: { en: 'The declaration is valid only for classes with one data member.', zh: '该声明只对含一个数据成员的类有效。' }, correct: false }
    explanation: { en: 'A defaulted three-way comparison implicitly declares a defaulted equality operator when the class has no member or friend named operator==. Both comparisons follow the applicable defaulted-comparison rules.', zh: '类中没有名为 operator== 的成员或友元时，默认三向比较会隐式声明默认相等运算符；两者都遵守默认比较规则。' }
    difficulty: intermediate
    tags: [three-way-comparison, equality, cpp20]

  - id: predict-overloaded-logical-and
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      #include <iostream>

      struct Flag {
          bool value;
      };

      Flag operator&&(Flag left, Flag right) {
          return {left.value && right.value};
      }

      Flag probe() {
          std::cout << "probe\n";
          return {false};
      }

      int main() {
          Flag disabled{false};
          Flag result = disabled && probe();
          std::cout << std::boolalpha << result.value << '\n';
      }
    lang: cpp
    options:
      - { text: { en: 'probe, then false', zh: '先输出 probe，再输出 false' }, correct: true }
      - { text: { en: 'Only false', zh: '只输出 false' }, correct: false }
      - { text: { en: 'Only probe', zh: '只输出 probe' }, correct: false }
      - { text: { en: 'The call is ambiguous with built-in &&.', zh: '该调用与内置 && 产生歧义。' }, correct: false }
    explanation: { en: 'Overloaded && calls a function, so probe() is evaluated even though the left Flag contains false. The function then combines the two stored bool values.', zh: '重载 && 会调用函数，因此即使左侧 Flag 保存 false，probe() 仍会执行；随后函数组合两个已保存的 bool 值。' }
    difficulty: intermediate
    tags: [logical-operator, evaluation, short-circuit]
    tests: 'g++ -std=c++23 predict-overloaded-logical-and.cpp && ./a.out'

  - id: review-generated-polynomial
    type: review
    prompt: { en: 'Review this generated polynomial type against the requested contract.', zh: '根据任务契约审查这个生成的多项式类型。' }
    task: { en: 'Own coefficients efficiently, add polynomials of different degrees by treating missing coefficients as zero, provide checked coefficient access, and compare complete values.', zh: '高效拥有系数；不同次数的多项式相加时把缺失系数视为零；提供带检查的系数访问；比较完整的值。' }
    code: |
      #include <cstddef>
      #include <vector>

      class Polynomial {
          std::vector<double> coefficients_;
      public:
          explicit Polynomial(std::vector<double> values) : coefficients_(values) {}

          Polynomial operator+(const Polynomial& other) const {
              Polynomial result{coefficients_};
              for (std::size_t i = 0; i < other.coefficients_.size(); ++i) {
                  result.coefficients_[i] += other.coefficients_[i];
              }
              return result;
          }

          double operator[](std::size_t index) const {
              return coefficients_[index];
          }

          friend bool operator==(const Polynomial& left, const Polynomial& right) {
              return left.coefficients_.size() == right.coefficients_.size();
          }
      };
    lang: cpp
    right: { en: 'The class lets vector own its storage, takes the other operand by const reference, and returns a fresh sum rather than mutating either source polynomial.', zh: '该类用 vector 管理存储，通过 const 引用接收另一操作数，并返回新的和，没有修改任一源多项式。' }
    checklist:
      - { en: 'Trace result sizes when either operand has the higher degree.', zh: '分别跟踪任一操作数次数更高时的结果大小。' }
      - { en: 'Check every index path for defined failure behavior.', zh: '检查每条索引路径是否具有明确的失败行为。' }
      - { en: 'Compare equality and ordering fields against the value contract.', zh: '根据值契约检查相等与排序使用的字段。' }
      - { en: 'Count copies from constructor arguments into owned storage.', zh: '计算构造参数进入自有存储时发生的复制。' }
    issues:
      - line: 7
        kind: performance
        note: { en: 'The by-value vector parameter is copied into coefficients_ even for an rvalue. Move values into the member so lvalues pay one copy and rvalues can transfer storage.', zh: '按值传入的 vector 即使来自右值，也会再次复制进 coefficients_。应把 values 移入成员，使左值只复制一次，右值可以转移存储。' }
      - line: 11
        lines: 3
        kind: edge-case
        note: { en: 'If other has more coefficients than the left operand, result is too small and indexing runs past its end. If other is shorter, the loop happens to work, so one operand order can hide the bug.', zh: 'other 的系数更多时，result 长度不足，索引会越过末尾；other 较短时又恰好可用，因此只测一种操作数顺序会掩盖错误。' }
      - line: 18
        kind: security
        note: { en: 'Unchecked vector indexing has undefined behavior for an out-of-range index, violating the checked-access requirement and making an external index memory-unsafe.', zh: 'vector 的未检查下标在越界时产生未定义行为，既违反带检查访问的要求，也会让外部索引造成内存安全风险。' }
      - line: 22
        kind: correctness
        note: { en: 'Equality compares only coefficient counts, so distinct polynomials of the same degree compare equal. Compare the complete coefficient sequence under the stated value contract.', zh: '相等运算只比较系数数量，次数相同但内容不同的多项式也会相等；应按值契约比较完整系数序列。' }
    explanation: { en: 'Move the constructor parameter into storage, size the sum to the larger operand and add only valid positions, use checked access for the promised API, and compare all coefficients. Tests need both operand orders and distinct same-sized values.', zh: '应把构造参数移入存储，让结果长度取两个操作数中的较大值并只访问有效位置，按承诺提供带检查访问，并比较全部系数。测试还要覆盖两种操作数顺序，以及长度相同但内容不同的值。' }
    difficulty: advanced
    tags: [code-review, operator-contract, bounds, value-semantics]
    tests: 'Compile with address and undefined-behavior sanitizers; test both operand orders, invalid indexes, and same-sized unequal values.'
