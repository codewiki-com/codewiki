topic: cpp/classes
items:
  - id: predict-memberwise-copy
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      #include <iostream>

      class Counter {
      public:
          explicit Counter(int value) : value_(value) {}
          void increment() { ++value_; }
          int value() const { return value_; }
      private:
          int value_;
      };

      int main() {
          Counter original{3};
          Counter copy = original;
          copy.increment();
          std::cout << original.value() << ' ' << copy.value() << '\n';
      }
    lang: cpp
    options:
      - { text: { en: '3 4', zh: '3 4' }, correct: true }
      - { text: { en: '4 4', zh: '4 4' }, correct: false }
      - { text: { en: '3 3', zh: '3 3' }, correct: false }
      - { text: { en: 'The copy does not compile.', zh: '复制操作无法通过编译。' }, correct: false }
    explanation: { en: 'The implicit copy constructor copies value_ into a separate object. Incrementing copy changes only its own int member.', zh: '隐式复制构造函数把 value_ 复制到另一个对象。递增 copy 只会修改它自己的 int 成员。' }
    difficulty: beginner
    tags: [copy-constructor, value-semantics]

  - id: class-struct-default-access
    type: mcq
    prompt: { en: 'What language-level difference applies to otherwise identical class and struct definitions?', zh: '对于其他部分完全相同的 class 与 struct 定义，语言层面有什么区别？' }
    options:
      - { text: { en: 'Members and bases default to private for class and public for struct.', zh: 'class 的成员与基类默认是 private，struct 则默认是 public。' }, correct: true }
      - { text: { en: 'Only class can declare constructors and member functions.', zh: '只有 class 能声明构造函数和成员函数。' }, correct: false }
      - { text: { en: 'Only struct objects can be copied memberwise.', zh: '只有 struct 对象可以逐成员复制。' }, correct: false }
      - { text: { en: 'A struct cannot inherit from another type.', zh: 'struct 不能继承其他类型。' }, correct: false }
    explanation: { en: 'Both keywords define class types. Their default member access and default base-class access differ; explicit access specifiers override those defaults.', zh: '两个关键字都定义类类型。它们的默认成员访问和默认基类访问不同；显式访问说明符会覆盖这些默认值。' }
    difficulty: beginner
    tags: [class, struct, access-control]

  - id: spot-initialization-order
    type: spotbug
    prompt: { en: 'Find the initialization-order bug in this invoice class.', zh: '找出这个发票类中的初始化顺序错误。' }
    code: |
      class Invoice {
      public:
          explicit Invoice(int subtotal)
              : subtotal_(subtotal), tax_(subtotal_ / 10) {}
          int total() const { return subtotal_ + tax_; }
      private:
          int tax_;
          int subtotal_;
      };
    lang: cpp
    issues:
      - line: 4
        kind: correctness
        note: { en: 'tax_ is declared first, so it initializes first and reads subtotal_ before subtotal_ is initialized. The initializer-list order does not change this.', zh: 'tax_ 先声明，因此也先初始化，并在 subtotal_ 初始化前读取它。初始化器列表的书写顺序不会改变这一点。' }
    explanation: { en: 'Declare subtotal_ before tax_, then list the initializers in that same order. Compiler reorder warnings should also be enabled.', zh: '应先声明 subtotal_，再声明 tax_，并让初始化器保持相同顺序。同时应启用编译器的重排警告。' }
    difficulty: intermediate
    tags: [constructors, initialization-order, undefined-behavior]

  - id: const-observer
    type: mcq
    prompt: { en: 'Why should a member function that only reads object state usually have a trailing const?', zh: '为什么只读取对象状态的成员函数通常应在末尾加 const？' }
    options:
      - { text: { en: 'It can be called through const objects and prevents ordinary mutation through this.', zh: '它可以通过 const 对象调用，并阻止通过 this 进行普通修改。' }, correct: true }
      - { text: { en: 'It makes every returned reference safe after the object is destroyed.', zh: '它会让所有返回引用在对象销毁后仍然安全。' }, correct: false }
      - { text: { en: 'It guarantees the function is thread-safe.', zh: '它保证函数是线程安全的。' }, correct: false }
      - { text: { en: 'It forces the compiler to evaluate the function at compile time.', zh: '它强制编译器在编译期求值该函数。' }, correct: false }
    explanation: { en: 'Trailing const qualifies the current object for that call. It supports const-correct interfaces but does not guarantee lifetime safety, thread safety, or constant evaluation.', zh: '末尾的 const 限定本次调用中的当前对象。它支持 const 正确的接口，但不保证生命周期安全、线程安全或编译期求值。' }
    difficulty: beginner
    tags: [const, member-functions]

  - id: review-generated-course
    type: review
    prompt: { en: 'Review this generated Course class against the requested contract.', zh: '根据任务契约审查这个生成的 Course 类。' }
    task: { en: 'Implement a course that starts empty, requires a positive capacity, refuses enrollment when full, and exposes read-only student access.', zh: '实现一个初始为空、容量必须为正、满员时拒绝注册，并提供只读学生访问接口的课程类。' }
    code: |
      #include <cstddef>
      #include <string>
      #include <utility>
      #include <vector>

      class Course {
      public:
          Course(std::string name, std::size_t capacity)
              : enrolled_(capacity), capacity_(capacity), name_(std::move(name)) {}

          void enroll(std::string student) {
              students_.push_back(std::move(student));
              ++enrolled_;
          }

          std::vector<std::string> students() const { return students_; }
          std::size_t remaining() const { return capacity_ - enrolled_; }
      private:
          std::size_t enrolled_;
          std::size_t capacity_;
          std::string name_;
          std::vector<std::string> students_;
      };
    lang: cpp
    right: { en: 'The code keeps representation private, uses an initializer list, moves owned string arguments, and marks both observer functions const.', zh: '代码把表示设为 private，使用了初始化器列表，移动了取得所有权的字符串参数，并把两个观察函数都标为 const。' }
    checklist:
      - { en: 'Write the invariant in terms of capacity and the student collection.', zh: '用容量与学生集合明确写出不变量。' }
      - { en: 'Test construction at zero and enrollment at the capacity boundary.', zh: '测试容量为 0 的构造，以及达到容量边界时的注册。' }
      - { en: 'Compare stored state with values that can be derived from another member.', zh: '比较存储状态与能够从其他成员推导出的值。' }
      - { en: 'Inspect observer return types for copying and lifetime exposure.', zh: '检查观察函数返回类型中的复制与生命周期暴露。' }
    issues:
      - line: 9
        kind: correctness
        note: { en: 'enrolled_ starts at capacity even though the course must start empty, so remaining() begins at zero.', zh: '课程应当初始为空，但 enrolled_ 被初始化为 capacity，因此 remaining() 一开始就是 0。' }
      - line: 11
        kind: edge-case
        note: { en: 'enroll never checks whether the course is full, so it can exceed capacity and make unsigned subtraction wrap.', zh: 'enroll 从不检查课程是否已满，因此人数可以超过容量，并让无符号减法发生回绕。' }
      - line: 16
        kind: performance
        note: { en: 'students() copies the complete vector on every read. A const reference or span can expose read-only access with an explicit lifetime contract.', zh: 'students() 每次读取都会复制整个 vector。const 引用或 span 可以在明确生命周期契约后提供只读访问。' }
      - line: 19
        kind: readability
        note: { en: 'enrolled_ duplicates students_.size(), creating two representations that every mutation must keep synchronized.', zh: 'enrolled_ 重复存储了 students_.size() 已能表达的信息，所有修改都必须同步维护两份表示。' }
    explanation: { en: 'Use students_.size() as the enrollment count, reject zero capacity during construction, and check the boundary before push_back. Return a documented read-only view when callers do not need a copy.', zh: '应以 students_.size() 作为注册人数，在构造时拒绝 0 容量，并在 push_back 前检查边界。调用者不需要副本时，返回带有明确说明的只读视图。' }
    difficulty: intermediate
    tags: [code-review, invariants, api-design]
