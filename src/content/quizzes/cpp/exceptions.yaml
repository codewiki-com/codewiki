topic: cpp/exceptions
items:
  - id: predict-standard-hierarchy
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      #include <iostream>
      #include <stdexcept>

      int main() {
          try {
              throw std::out_of_range("index");
          } catch (const std::invalid_argument& error) {
              std::cout << "invalid: " << error.what() << '\n';
          } catch (const std::logic_error& error) {
              std::cout << "logic: " << error.what() << '\n';
          } catch (const std::exception& error) {
              std::cout << "standard: " << error.what() << '\n';
          }
      }
    lang: cpp
    options:
      - { text: { en: 'logic: index', zh: 'logic: index' }, correct: true }
      - { text: { en: 'invalid: index', zh: 'invalid: index' }, correct: false }
      - { text: { en: 'standard: index', zh: 'standard: index' }, correct: false }
      - { text: { en: 'The exception is not caught.', zh: '异常不会被捕获。' }, correct: false }
    explanation: { en: 'std::out_of_range derives from std::logic_error, not std::invalid_argument. The first type-compatible handler runs.', zh: 'std::out_of_range 继承自 std::logic_error，而不是 std::invalid_argument。程序会执行第一个类型兼容的处理器。' }
    difficulty: intermediate
    tags: [handler-matching, standard-exceptions]

  - id: constructor-unwinding
    type: mcq
    prompt: { en: 'A constructor throws after two data members finished construction. Which destructors run?', zh: '构造函数在两个数据成员完成构造后抛出。哪些析构函数会执行？' }
    options:
      - { text: { en: 'The two completed members are destroyed in reverse order; the incomplete outer object is not.', zh: '两个已完成成员按相反顺序销毁；未完成的外层对象不销毁。' }, correct: true }
      - { text: { en: 'Only the outer object destructor runs.', zh: '只执行外层对象的析构函数。' }, correct: false }
      - { text: { en: 'All declared members are destroyed, including members whose construction never began.', zh: '所有已声明成员都会销毁，包括尚未开始构造的成员。' }, correct: false }
      - { text: { en: 'No destructors run because construction failed.', zh: '因为构造失败，所以不会执行任何析构函数。' }, correct: false }
    explanation: { en: 'Only fully constructed subobjects exist and need destruction. The complete object never came into existence, so its own destructor is not called.', zh: '只有完成构造的子对象存在并需要销毁。完整对象从未形成，因此不会调用它自身的析构函数。' }
    difficulty: intermediate
    tags: [constructors, stack-unwinding]

  - id: spot-manual-cleanup
    title: { en: 'Spot the bug in record import cleanup', zh: '找出记录导入清理里的 bug' }
    type: spotbug
    prompt: { en: 'Find the resource-lifetime failure in this generated import helper.', zh: '找出这个生成式导入辅助函数的资源生命周期错误。' }
    code: |
      void import_records(std::size_t count) {
          auto* buffer = new Record[count];
          read_records(buffer, count);
          validate_records(buffer, count);
          delete[] buffer;
      }
    lang: cpp
    issues:
      - line: 3
        kind: correctness
        note: { en: 'If read_records or validate_records throws, control skips delete[] and leaks the array.', zh: '如果 read_records 或 validate_records 抛出，控制流会跳过 delete[]，导致数组泄漏。' }
    explanation: { en: 'Store the records in std::vector<Record> or another RAII owner. Its destructor releases storage during both normal return and stack unwinding.', zh: '应把记录存入 std::vector<Record> 或其他 RAII 所有者。无论正常返回还是栈展开，其析构函数都会释放存储。' }
    difficulty: beginner
    tags: [raii, resource-lifetime]

  - id: noexcept-escape
    type: mcq
    prompt: { en: 'What happens when an exception tries to leave a noexcept function?', zh: '异常试图离开 noexcept 函数时会发生什么？' }
    options:
      - { text: { en: 'std::terminate is called.', zh: '程序调用 std::terminate。' }, correct: true }
      - { text: { en: 'The nearest outer catch handles it normally.', zh: '最近的外层 catch 会正常处理它。' }, correct: false }
      - { text: { en: 'The compiler always rejects the function body.', zh: '编译器总会拒绝这个函数体。' }, correct: false }
      - { text: { en: 'The exception is converted into an error code.', zh: '异常会转换成错误码。' }, correct: false }
    explanation: { en: 'A noexcept promise changes escape behavior: an exception that crosses the boundary invokes termination instead of continuing handler search.', zh: 'noexcept 承诺会改变异常逃逸的行为：异常越过该边界时会触发终止，不会继续寻找处理器。' }
    difficulty: intermediate
    tags: [noexcept, termination]

  - id: review-generated-ledger-import
    title: { en: 'Review generated ledger import', zh: '审查生成的账本导入' }
    type: review
    prompt: { en: 'Review this generated ledger import path.', zh: '审查这段生成的账本导入路径。' }
    task: { en: 'Append a batch of non-negative amounts atomically, preserve failures for the caller, and manage temporary storage automatically.', zh: '原子地追加一批非负金额，把失败保留给调用方，并自动管理临时存储。' }
    code: |
      void append_amounts(
          std::vector<int>& ledger,
          const std::vector<int>& input) noexcept {
          auto* scratch = new int[input.size()];

          for (std::size_t i = 0; i < input.size(); ++i) {
              ledger.push_back(input[i]);
              if (input[i] < 0) {
                  throw std::invalid_argument("negative amount");
              }
              scratch[i] = input[i];
          }
          delete[] scratch;
      }

      void import(std::vector<int>& ledger, const std::vector<int>& input) {
          try {
              append_amounts(ledger, input);
          } catch (std::exception error) {
              std::cerr << error.what() << '\n';
          }
      }
    lang: cpp
    right: { en: 'The code accepts the input by const reference, uses std::size_t for vector indexing, and reports an invalid amount with a standard exception and a specific message.', zh: '代码通过 const 引用接收输入，使用 std::size_t 索引 vector，并以标准异常和具体消息报告无效金额。' }
    checklist:
      - { en: 'List every throwing operation and the visible mutation before it.', zh: '列出每个可能抛出的操作，以及它之前的可见修改。' }
      - { en: 'Test invalid input at the first, middle, and last positions.', zh: '分别测试位于首项、中间项和末项的无效输入。' }
      - { en: 'Trace temporary ownership through normal return and unwinding.', zh: '跟踪正常返回与栈展开时的临时资源所有权。' }
      - { en: 'Check noexcept and catch clauses against the intended failure contract.', zh: '对照预期失败契约检查 noexcept 和 catch 子句。' }
    issues:
      - line: 3
        kind: correctness
        note: { en: 'append_amounts is noexcept but explicitly throws and can also fail during allocation or vector growth; any escape calls std::terminate.', zh: 'append_amounts 声明为 noexcept，却会显式抛出，而且分配或 vector 增长也可能失败；任何逃逸都会调用 std::terminate。' }
      - line: 4
        kind: performance
        note: { en: 'The scratch array is copied into but never read, adding an allocation and a full extra write pass with no effect on the result.', zh: 'scratch 数组只写不读，增加了一次分配和完整的额外写入，却不影响结果。' }
      - line: 7
        kind: edge-case
        note: { en: 'The amount is appended before validation, so a negative value is stored and earlier entries remain committed when the batch fails.', zh: '金额在验证前就被追加，因此负数也会写入；批次失败时，更早的条目仍已提交。' }
      - line: 19
        kind: readability
        note: { en: 'The broad catch copies and slices the exception, then suppresses failure, obscuring whether import produced a complete ledger.', zh: '宽泛的 catch 会复制并切片异常，随后又压制失败，使调用方无法看清导入是否得到完整账本。' }
    explanation: { en: 'Validate or build a temporary vector before a non-throwing commit, remove the unused raw allocation, and let a truthful exception contract reach the caller. Catch by const reference only where this layer can add policy.', zh: '应先验证或构造临时 vector，再通过不抛出的操作提交；删除无用的裸分配，并让真实的异常契约到达调用方。只有当前层能执行策略时，才通过 const 引用捕获。' }
    difficulty: advanced
    tags: [code-review, strong-guarantee, noexcept, object-slicing]
