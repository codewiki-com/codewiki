topic: cpp/smart-pointers
items:
  - id: predict-unique-move
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      #include <iostream>
      #include <memory>
      #include <utility>

      int main() {
          auto first = std::make_unique<int>(7);
          auto second = std::move(first);
          std::cout << std::boolalpha << !first
                    << ' ' << *second << '\n';
      }
    lang: cpp
    options:
      - { text: { en: 'true 7', zh: 'true 7' }, correct: true }
      - { text: { en: 'false 7', zh: 'false 7' }, correct: false }
      - { text: { en: 'true 0', zh: 'true 0' }, correct: false }
      - { text: { en: 'It fails to compile because unique_ptr cannot move.', zh: '编译失败，因为 unique_ptr 不能移动。' }, correct: false }
    explanation: { en: 'Moving transfers the stored pointer to second and leaves first empty. The managed integer retains its value.', zh: '移动把保存的指针转交给 second，并把 first 置空；被管理的整数仍保持原值。' }
    difficulty: beginner
    tags: [unique-ptr, move-semantics, predict-output]

  - id: shared-control-block
    type: mcq
    prompt: { en: 'What happens when a shared_ptr is copied?', zh: '复制一个 shared_ptr 时会发生什么？' }
    options:
      - { text: { en: 'The copy joins the same control block and becomes another strong owner.', zh: '副本加入同一个控制块，成为另一个强所有者。' }, correct: true }
      - { text: { en: 'The managed object is deep-copied into a separate allocation.', zh: '被管理对象会深拷贝到另一块分配中。' }, correct: false }
      - { text: { en: 'The source becomes empty, exactly like moving a unique_ptr.', zh: '源指针会像移动 unique_ptr 一样变空。' }, correct: false }
      - { text: { en: 'Every weak_ptr is converted into a strong owner.', zh: '所有 weak_ptr 都会转成强所有者。' }, correct: false }
    explanation: { en: 'A copy shares control-block identity and increments the strong-owner count. Moving, not copying, empties the source pointer.', zh: '复制会共享控制块身份并增加强所有者计数；移动而非复制才会把源指针置空。' }
    difficulty: beginner
    tags: [shared-ptr, control-block, reference-counting]

  - id: spotbug-two-control-blocks
    type: spotbug
    prompt: { en: 'Find the ownership bug in this factory.', zh: '找出这个工厂函数中的所有权错误。' }
    code: |
      std::pair<std::shared_ptr<Widget>, std::shared_ptr<Widget>> make_views() {
          Widget* raw = new Widget;
          std::shared_ptr<Widget> primary(raw);
          std::shared_ptr<Widget> backup(raw);
          return {primary, backup};
      }
    lang: cpp
    issues:
      - line: 4
        kind: correctness
        note: { en: 'backup creates a second control block for the same raw pointer, so both ownership groups eventually delete one Widget.', zh: 'backup 为同一个裸指针创建了第二个控制块，因此两个所有权组最终会删除同一个 Widget。' }
    explanation: { en: 'Create one shared_ptr, preferably with make_shared, and copy it for every additional owner. Copies must share the original control block.', zh: '应创建一个 shared_ptr，最好使用 make_shared，再把它复制给其他所有者；所有副本都必须共享原控制块。' }
    difficulty: intermediate
    tags: [shared-ptr, double-delete, control-block]

  - id: shared-pointer-thread-safety
    type: mcq
    prompt: { en: 'Which C++23 statement about shared_ptr and threads is correct?', zh: '关于 C++23 中 shared_ptr 与线程，哪项说法正确？' }
    options:
      - { text: { en: 'Different shared_ptr objects may share a control block across threads, but the managed object still needs its own synchronization.', zh: '不同 shared_ptr 对象可以跨线程共享控制块，但被管理对象仍需要自己的同步。' }, correct: true }
      - { text: { en: 'Reference counting makes every field of the managed object atomic.', zh: '引用计数会让被管理对象的每个字段自动成为原子字段。' }, correct: false }
      - { text: { en: 'Two threads may call reset concurrently on the same ordinary shared_ptr variable without synchronization.', zh: '两个线程可以不加同步地对同一个普通 shared_ptr 变量并发调用 reset。' }, correct: false }
      - { text: { en: 'weak_ptr::expired keeps the target alive until the next statement.', zh: 'weak_ptr::expired 会让目标至少存活到下一条语句。' }, correct: false }
    explanation: { en: 'Control-block operations support independent pointer objects, not unsynchronized mutation of T or of one shared_ptr variable. Use object-level synchronization and atomic<shared_ptr> or a lock where appropriate.', zh: '控制块操作支持独立的指针对象，并不保护 T 的状态或同一个 shared_ptr 变量上的并发修改；应分别使用对象级同步，以及 atomic<shared_ptr> 或锁。' }
    difficulty: advanced
    tags: [shared-ptr, concurrency, atomic-shared-ptr]

  - id: review-generated-worker-callbacks
    type: review
    title: { en: 'Repair generated worker callbacks', zh: '修复生成式工作器回调' }
    prompt: { en: 'Review this generated worker for ownership, expiration, and lifetime behavior.', zh: '审查这个生成式工作器的所有权、失效处理和生命周期行为。' }
    task: { en: 'Queue work without keeping Worker alive, make the status callback a safe no-op after destruction, and expose the current Job only as a non-owning borrow.', zh: '排队的任务不得让 Worker 保活；对象销毁后，状态回调应安全地不执行操作；当前 Job 只能作为非拥有借用暴露。' }
    code: |
      class Worker : public std::enable_shared_from_this<Worker> {
      public:
          explicit Worker(TaskQueue& queue) : queue_(queue) {}

          void schedule() {
              auto keep_alive = shared_from_this();
              queue_.push([keep_alive] { keep_alive->run(); });
          }

          std::function<void()> status_callback() {
              auto weak = weak_from_this();
              return [weak] { weak.lock()->print_status(); };
          }

          std::shared_ptr<Job> current_job() {
              return std::shared_ptr<Job>(job_.get());
          }

          void run();
          void print_status() const;

      private:
          TaskQueue& queue_;
          std::unique_ptr<Job> job_ = std::make_unique<Job>();
      };
    lang: cpp
    right: { en: 'The code uses enable_shared_from_this instead of constructing shared_ptr from this, gives the Job one clear unique owner, and separates scheduling from status reporting.', zh: '代码使用 enable_shared_from_this，没有直接从 this 构造 shared_ptr；Job 有一个清楚的独占所有者，并且调度与状态报告彼此分开。' }
    checklist:
      - { en: 'State whether every stored callback keeps its target alive or may expire.', zh: '说明每个被保存的回调会让目标保活，还是允许目标失效。' }
      - { en: 'Handle every weak upgrade failure before dereferencing.', zh: '在解引用之前处理每次弱引用升级失败。' }
      - { en: 'Ensure each object enters exactly one ownership group with a matching deleter.', zh: '确保每个对象只进入一个所有权组，并使用匹配的删除器。' }
      - { en: 'Use references or raw pointers for bounded borrows instead of inventing shared ownership.', zh: '对有明确期限的借用使用引用或裸指针，不要凭空建立共享所有权。' }
    issues:
      - line: 6
        kind: performance
        note: { en: 'The queued lambda strongly captures Worker, so a long-lived queue extends its lifetime even though the task must be non-owning.', zh: '排队的 lambda 强捕获 Worker，因此长生命周期队列会延长对象寿命，不符合任务要求的非拥有语义。' }
      - line: 12
        kind: edge-case
        note: { en: 'lock may return an empty shared_ptr after Worker is destroyed; immediately using operator-> then dereferences null.', zh: 'Worker 销毁后，lock 可能返回空 shared_ptr；立即调用 operator-> 会解引用空指针。' }
      - line: 15
        kind: readability
        note: { en: 'The shared_ptr return type claims shared ownership even though the contract asks only for a bounded non-owning view.', zh: '返回 shared_ptr 声称存在共享所有权，但契约只要求有期限的非拥有视图。' }
      - line: 16
        kind: correctness
        note: { en: 'Constructing shared_ptr from job_.get() creates an independent control block; it will delete a Job still owned by unique_ptr.', zh: '从 job_.get() 构造 shared_ptr 会创建独立控制块；它将删除仍由 unique_ptr 拥有的 Job。' }
    explanation: { en: 'Capture weak_from_this in both callbacks and branch on one local result from lock. Return Job& or Job* under a documented Worker lifetime instead of creating another owner.', zh: '两个回调都应捕获 weak_from_this，并对一次 lock 得到的局部结果进行分支；在有文档的 Worker 生命周期内返回 Job& 或 Job*，不要创建另一个所有者。' }
    difficulty: advanced
    minutes: 10
    tags: [code-review, weak-ptr, callbacks, ownership]
