topic: cpp/virtual-functions
items:
  - id: predict-virtual-default-argument
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      #include <iostream>

      class Sender {
      public:
          virtual void send(int priority = 1) const {
              std::cout << "base:" << priority << '\n';
          }
          virtual ~Sender() = default;
      };

      class EmailSender final : public Sender {
      public:
          void send(int priority = 2) const override {
              std::cout << "email:" << priority << '\n';
          }
      };

      int main() {
          EmailSender email;
          Sender& sender = email;
          sender.send();
          email.send();
      }
    lang: cpp
    options:
      - { text: { en: "email:1\nemail:2", zh: "email:1\nemail:2" }, correct: true }
      - { text: { en: "email:2\nemail:2", zh: "email:2\nemail:2" }, correct: false }
      - { text: { en: "base:1\nemail:2", zh: "base:1\nemail:2" }, correct: false }
      - { text: { en: 'The program does not compile.', zh: '程序无法通过编译。' }, correct: false }
    explanation: { en: 'Virtual dispatch selects EmailSender::send for both calls, but each missing argument is filled from the static declaration at its call site.', zh: '两次调用都通过虚分派选择EmailSender::send，但缺失实参分别取自调用点可见的静态声明。' }
    difficulty: advanced
    tags: [virtual-dispatch, default-arguments, static-type]

  - id: final-overrider-selection
    type: mcq
    prompt: { en: 'After overload resolution selects a virtual member, what selects the function body for an ordinary call through Base&?', zh: '重载决议选中虚成员后，通过Base& 的普通调用由什么选择函数体？' }
    options:
      - { text: { en: "The complete object's dynamic type determines the final overrider.", zh: '完整对象的动态类型决定最终覆盖函数。' }, correct: true }
      - { text: { en: 'The source-file order of the class definitions determines it.', zh: '类定义在源文件中的顺序决定函数体。' }, correct: false }
      - { text: { en: 'The static type always forces the base implementation.', zh: '静态类型始终强制调用基类实现。' }, correct: false }
      - { text: { en: 'The access level of the overriding function determines it.', zh: '重写函数的访问级别决定函数体。' }, correct: false }
    explanation: { en: 'Static type controls lookup and overload resolution. Once a virtual member is selected, the dynamic type determines its final overrider unless explicit qualification suppresses dispatch.', zh: '静态类型控制名字查找与重载决议。虚成员一旦选定，动态类型就决定最终覆盖函数，除非显式限定抑制了分派。' }
    difficulty: intermediate
    tags: [final-overrider, dynamic-type, overload-resolution]

  - id: spot-missing-override-qualifier
    title: { en: 'Spot the bug in JsonDecoder override', zh: '找出解码器重写里的bug' }
    type: spotbug
    prompt: { en: 'Find why calls through Decoder& do not use JsonDecoder.', zh: '找出为什么通过Decoder& 调用时没有使用JsonDecoder。' }
    code: |
      #include <string>
      #include <string_view>

      class Decoder {
      public:
          virtual std::string decode(std::string_view input) const {
              return std::string(input);
          }
          virtual ~Decoder() = default;
      };

      class JsonDecoder final : public Decoder {
      public:
          std::string decode(std::string_view input) {
              return "json:" + std::string(input);
          }
      };
    lang: cpp
    issues:
      - line: 14
        kind: correctness
        note: { en: 'The derived declaration lacks the trailing const, so it is a different function rather than an override. Adding override exposes the mismatch at compile time.', zh: '派生声明缺少末尾的const，因此它是另一个函数，而不是重写。加上override会在编译期暴露不匹配。' }
    explanation: { en: 'Write std::string decode(std::string_view input) const override. Tests should call through Decoder& so accidental fallback to the base implementation is observable.', zh: '应写成std::string decode(std::string_view input) const override。测试还应通过Decoder& 调用，以便观察意外退回基类实现。' }
    difficulty: intermediate
    tags: [override, const-correctness, name-hiding]

  - id: constructor-dispatch-boundary
    type: mcq
    prompt: { en: 'A Base constructor calls a virtual member on *this while constructing a Derived object. Where can that call dispatch?', zh: '构造Derived对象时，Base构造函数通过*this调用虚成员。该调用可以分派到哪里？' }
    options:
      - { text: { en: 'To the final overrider in Base or one of its bases, not to Derived.', zh: '到Base或其基类中的最终覆盖函数，不会进入Derived。' }, correct: true }
      - { text: { en: 'Always to Derived because the allocation already has Derived size.', zh: '始终进入Derived，因为分配空间已经具有Derived的大小。' }, correct: false }
      - { text: { en: 'Only to a free function selected by argument-dependent lookup.', zh: '只能进入由实参相关查找选择的自由函数。' }, correct: false }
      - { text: { en: 'The call is always a compile-time error.', zh: '这种调用始终是编译错误。' }, correct: false }
    explanation: { en: "During Base construction, the more-derived portion has not begun its lifetime, so virtual dispatch does not enter Derived. Reaching a pure virtual function this way has undefined behavior.", zh: 'Base构造期间，更派生部分尚未开始生命周期，因此虚分派不会进入Derived。若这种调用命中纯虚函数，行为未定义。' }
    difficulty: intermediate
    tags: [construction, lifetime, virtual-dispatch]

  - id: review-generated-report-interface
    type: review
    title: { en: 'Review a generated report interface', zh: '审查生成的报表接口' }
    prompt: { en: 'Review this generated hierarchy against the requested contract.', zh: '根据任务契约审查这个生成的类层次。' }
    task: { en: 'Return owned reports through Report, render them polymorphically, destroy them safely, and expose report text without an inspection copy.', zh: '通过Report返回拥有型报表，以多态方式渲染并安全销毁，同时在检查文本时不产生副本。' }
    code: |
      #include <memory>
      #include <string>
      #include <utility>

      class Report {
      public:
          explicit Report(std::string text) : text_(std::move(text)) {}
          virtual std::string render() const { return text_; }
          std::string text() const { return text_; }
          ~Report() = default;
      protected:
          std::string text_;
      };

      class HtmlReport final : public Report {
      public:
          using Report::Report;
          std::string render() { return "<p>" + text_ + "</p>"; }
      };

      std::unique_ptr<Report> make_report() {
          return std::make_unique<HtmlReport>("ready");
      }
    lang: cpp
    right: { en: 'The code uses a virtual render entry point, moves owned constructor text, returns ownership with unique_ptr, and prevents further derivation from HtmlReport.', zh: '代码使用了虚render入口，移动取得所有权的构造文本，通过unique_ptr返回所有权，并禁止继续派生HtmlReport。' }
    checklist:
      - { en: 'Compare each intended override with the complete base declaration.', zh: '把每个预期重写与基类完整声明逐项比较。' }
      - { en: 'Trace deletion through the exact owning pointer type.', zh: '通过实际拥有型指针类型跟踪删除过程。' }
      - { en: 'Inspect observers for unnecessary copies and exposed lifetimes.', zh: '检查观察函数是否产生不必要的副本或暴露生命周期。' }
      - { en: 'Keep representation private unless extension requires a documented protected contract.', zh: '除非扩展确实需要有文档的protected契约，否则表示应保持private。' }
    issues:
      - line: 9
        kind: performance
        note: { en: 'text() copies the complete string on every inspection. Return const std::string& or an appropriate view with a documented lifetime.', zh: 'text() 每次检查都复制完整字符串。应返回const std::string& 或具有明确生命周期说明的合适视图。' }
      - line: 10
        kind: edge-case
        note: { en: 'The factory deletes HtmlReport through unique_ptr<Report>, but Report has a public non-virtual destructor. That polymorphic deletion has undefined behavior.', zh: '工厂会通过unique_ptr<Report>删除HtmlReport，但Report使用公有非虚析构函数。这种多态删除的行为未定义。' }
      - line: 12
        kind: readability
        note: { en: 'Protected storage couples derived classes to Report representation. Private storage plus protected access operations would make the extension contract explicit.', zh: 'protected存储让派生类耦合到Report表示。使用private存储和受保护访问操作可以明确扩展契约。' }
      - line: 18
        kind: correctness
        note: { en: 'HtmlReport::render lacks trailing const, so it does not override Report::render. Adding override would make the compiler reject this mismatch.', zh: 'HtmlReport::render缺少末尾的const，因此没有重写Report::render。加上override后，编译器会拒绝这种不匹配。' }
    explanation: { en: 'Make Report destruction virtual, preserve the const render signature with override, and expose text through a read-only reference or view. Keep storage private unless subclasses truly need representation-level access.', zh: '应把Report析构设为虚函数，通过override保持带const的render签名，并用只读引用或视图暴露文本。除非子类确实需要表示层访问，否则存储应保持private。' }
    difficulty: advanced
    tags: [code-review, virtual-destructor, override, api-design]
