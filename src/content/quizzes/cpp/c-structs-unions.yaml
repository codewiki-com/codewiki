topic: cpp/c-structs-unions
items:
  - id: predict-struct-array-copy
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      #include <stdio.h>

      typedef struct {
          int values[2];
      } Pair;

      int main(void) {
          Pair original = {{1, 2}};
          Pair copy = original;
          copy.values[0] = 9;
          printf("%d %d\n", original.values[0], copy.values[0]);
          return 0;
      }
    lang: c
    options:
      - { text: { en: '1 9', zh: '1 9' }, correct: true }
      - { text: { en: '9 9', zh: '9 9' }, correct: false }
      - { text: { en: '1 1', zh: '1 1' }, correct: false }
      - { text: { en: 'The assignment is invalid because the struct contains an array.', zh: '赋值无效，因为结构体中包含数组。' }, correct: false }
    explanation: { en: 'Struct assignment copies an array member as part of the struct value, so changing the copy does not change the original array.', zh: '结构体赋值会把数组成员作为结构体值的一部分复制，因此修改副本不会改变原数组。' }
    difficulty: beginner
    tags: [struct, assignment, arrays]

  - id: union-storage-contract
    type: mcq
    prompt: { en: 'What must a program track when a union represents several alternative payloads?', zh: '联合体表示多种互斥载荷时，程序必须跟踪什么？' }
    options:
      - { text: { en: 'Which member currently represents a valid value', zh: '当前由哪个成员表示有效值' }, correct: true }
      - { text: { en: 'A separate allocation for every union member', zh: '为联合体的每个成员分别分配内存' }, correct: false }
      - { text: { en: 'The sum of all member sizes', zh: '所有成员大小之和' }, correct: false }
      - { text: { en: 'The source-line number of the last write', zh: '上次写入所在的源码行号' }, correct: false }
    explanation: { en: 'Union members reuse storage, but C does not record the current member. A discriminant and the payload must stay synchronized.', zh: '联合体成员重用存储，但 C 不会记录当前成员。判别值必须与载荷保持同步。' }
    difficulty: beginner
    tags: [union, active-member, discriminant]

  - id: spotbug-tag-payload-mismatch
    title: { en: 'Spot the bug in the tagged union', zh: '找出标签联合体里的 bug' }
    type: spotbug
    prompt: { en: 'Find the line that breaks this tagged union before it is printed.', zh: '找出打印前破坏这个带标记联合体的代码行。' }
    code: |
      #include <stdio.h>

      typedef enum { VALUE_COUNT, VALUE_RATIO } ValueKind;

      typedef struct {
          ValueKind kind;
          union { int count; double ratio; } as;
      } Value;

      int main(void) {
          Value value = {VALUE_RATIO, {.ratio = 0.5}};
          value.kind = VALUE_COUNT;
          printf("%d\n", value.as.count);
          return 0;
      }
    lang: c
    issues:
      - line: 12
        kind: correctness
        note: { en: 'Changing only the tag claims that count is current even though ratio was the member written. Reading count no longer follows the tagged-union invariant.', zh: '只修改标签会声称 count 是当前成员，但此前写入的是 ratio。随后读取 count 违反了带标记联合体的不变量。' }
    explanation: { en: 'Change the tag and payload together through a constructor or mutator. A discriminant does not convert the bytes already stored in the union.', zh: '应通过构造函数或修改函数同时更新标签与载荷。改变判别值不会转换联合体中已有的字节。' }
    difficulty: intermediate
    tags: [tagged-union, correctness]

  - id: enum-untrusted-value
    type: mcq
    prompt: { en: 'A protocol byte is converted to enum MessageKind. What should happen before using it to index a handler table?', zh: '协议字节被转换成 enum MessageKind 后，用它索引处理函数表之前应该做什么？' }
    options:
      - { text: { en: 'Validate that it equals one of the supported enumerator values', zh: '验证它等于某个受支持的枚举器值' }, correct: true }
      - { text: { en: 'Assume the conversion clamps it to the nearest enumerator', zh: '假定转换会把它限制为最接近的枚举器' }, correct: false }
      - { text: { en: 'Check only that sizeof(MessageKind) equals one', zh: '只检查 sizeof(MessageKind) 等于 1' }, correct: false }
      - { text: { en: 'Read it through a union to make it type-safe', zh: '通过联合体读取，让它获得类型安全' }, correct: false }
    explanation: { en: 'A C enum is not a runtime range check. An unsupported integer can make a table index invalid or select the wrong union member.', zh: 'C 枚举不会在运行时执行范围检查。不受支持的整数可能让表索引越界，或选择错误的联合体成员。' }
    difficulty: intermediate
    tags: [enum, validation, bounds]

  - id: struct-size-portability
    type: mcq
    prompt: { en: 'Which statement about sizeof(struct Record) is portable C?', zh: '关于 sizeof(struct Record)，哪项说法符合可移植 C？' }
    options:
      - { text: { en: 'It includes any internal and tail padding chosen for that implementation.', zh: '它包含该实现选择的内部填充和尾部填充。' }, correct: true }
      - { text: { en: 'It always equals the sum of sizeof for every member.', zh: '它总是等于每个成员 sizeof 之和。' }, correct: false }
      - { text: { en: 'It is identical across compilers whenever member declarations match.', zh: '只要成员声明相同，它在不同编译器中就完全相同。' }, correct: false }
      - { text: { en: 'It excludes bytes needed to align adjacent array elements.', zh: '它不包含对齐相邻数组元素所需的字节。' }, correct: false }
    explanation: { en: 'The implementation may add padding between members and after the final member. Tail padding makes every element of a struct array correctly aligned.', zh: '实现可以在成员之间及最后一个成员之后添加填充。尾部填充可让结构体数组中的每个元素正确对齐。' }
    difficulty: intermediate
    tags: [struct, sizeof, padding]

  - id: review-owned-message
    title: { en: 'Review generated owned text message', zh: '审查生成的自有文本消息' }
    type: review
    prompt: { en: 'Review this generated implementation of a cloneable, owned text message built from untrusted input.', zh: '审查这段生成代码：它要从不可信输入创建可克隆、拥有文本的消息。' }
    task: { en: 'Construct a valid owned text message, report allocation failure, and clone it without sharing ownership.', zh: '构造有效的拥有型文本消息，报告分配失败，并在不共享所有权的前提下克隆它。' }
    code: |
      #include <stdlib.h>
      #include <string.h>
      typedef enum { MSG_NUMBER, MSG_TEXT } MessageKind;

      typedef struct {
          MessageKind kind;
          union {
              int n;
              char *s;
          } as;
      } Message;

      Message message_from_text(const char *input, size_t length) {
          Message result = {0};
          result.kind = MSG_TEXT;
          result.as.s = malloc(length + 1u);
          if (result.as.s == NULL) return result;
          memcpy(result.as.s, input, length);
          result.as.s[length] = '\0';
          return result;
      }

      Message message_copy(Message source) {
          return source;
      }
    lang: c
    right: { en: 'The code uses an enum discriminant, stores alternatives in a union, and terminates a successfully copied text payload.', zh: '代码使用枚举判别值和联合体保存互斥载荷，并会给成功复制的文本载荷添加终止符。' }
    issues:
      - line: 8
        lines: 2
        kind: readability
        note: { en: 'The payload names n and s hide ownership and meaning. Names such as number and owned_text would make review and destruction rules clearer.', zh: '载荷名称 n 和 s 隐藏了含义与所有权。number 和 owned_text 之类的名称能让审查和销毁规则更清楚。' }
      - line: 16
        kind: security
        note: { en: 'Untrusted length is neither capped nor checked before length + 1; SIZE_MAX wraps to zero and large values can exhaust memory.', zh: '不可信的 length 既没有上限，也没有在 length + 1 前检查；SIZE_MAX 会回绕为 0，大值还可能耗尽内存。' }
      - line: 17
        kind: edge-case
        note: { en: 'Allocation failure returns a value tagged MSG_TEXT with a null payload and no status, so callers cannot distinguish failure from a valid message.', zh: '分配失败时返回的值仍标记为 MSG_TEXT，载荷却为空且没有状态，调用方无法区分失败与有效消息。' }
      - line: 24
        kind: correctness
        note: { en: 'Returning source performs a shallow pointer copy. If both messages own the text, destruction will double-free the same allocation.', zh: '直接返回 source 只会浅拷贝指针。若两个消息都拥有文本，销毁时会对同一分配区重复释放。' }
    checklist:
      - { en: 'Check tag and payload invariants on success and on every failure return.', zh: '检查成功路径及每个失败返回中的标签与载荷不变量。' }
      - { en: 'Bound all external lengths and check addition or multiplication before allocation.', zh: '限制所有外部长度，并在分配前检查加法或乘法。' }
      - { en: 'Trace owning and borrowed pointers through copy, replacement, and destruction.', zh: '跟踪拥有指针和借用指针在复制、替换与销毁时的变化。' }
      - { en: 'Test allocation failure, empty text, the maximum allowed length, and independent clone destruction.', zh: '测试分配失败、空文本、最大允许长度，以及两个克隆的独立销毁。' }
    explanation: { en: 'Use a result status, cap length, guard length + 1, and deep-copy the text when cloning. Central constructors and destructors should keep the discriminant, payload, and ownership state synchronized.', zh: '应返回状态、限制长度、保护 length + 1，并在克隆时深拷贝文本。集中式构造与销毁函数应让判别值、载荷和所有权状态保持同步。' }
    difficulty: advanced
    tags: [code-review, tagged-union, ownership, allocation]
