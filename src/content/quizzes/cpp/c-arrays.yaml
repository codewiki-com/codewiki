topic: cpp/c-arrays
items:
  - id: predict-array-reference
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      #include <cstddef>
      #include <iostream>

      template<std::size_t N>
      std::size_t extent(const int (&)[N]) {
          return N;
      }

      int main() {
          int values[]{4, 7, 9};
          auto pointer = values;
          std::cout << extent(values) << ' '
                    << (pointer == &values[0]) << '\n';
      }
    lang: cpp
    options:
      - { text: { en: '3 1', zh: '3 1' }, correct: true }
      - { text: { en: '3 0', zh: '3 0' }, correct: false }
      - { text: { en: '1 1', zh: '1 1' }, correct: false }
      - { text: { en: 'The program does not compile because arrays cannot be passed to functions.', zh: '程序无法编译，因为数组不能传给函数。' }, correct: false }
    explanation: { en: 'The reference parameter preserves and deduces the extent as 3. The by-value auto declaration converts values to a pointer to its first element, so the comparison is true and prints 1.', zh: '引用形参保留数组类型，并把边界推导为3。按值声明auto时，values转换为首元素指针，因此比较为真并输出1。' }
    difficulty: beginner
    tags: [array-reference, array-decay, predict-output]

  - id: parameter-bound-adjustment
    type: mcq
    prompt: { en: 'What contract does void read(const int values[8]) enforce in C++23?', zh: '在C++23中，void read(const int values[8]) 强制了什么契约？' }
    options:
      - { text: { en: 'It accepts only arrays whose extent is exactly 8.', zh: '它只接受边界恰好为8的数组。' }, correct: false }
      - { text: { en: 'It adjusts to a const int* parameter and enforces no element count.', zh: '它会调整为const int*形参，不强制任何元素数量。' }, correct: true }
      - { text: { en: 'It copies eight integers into the function.', zh: '它会把8个整数复制进函数。' }, correct: false }
      - { text: { en: 'It rejects null pointers but accepts every non-null pointer.', zh: '它拒绝空指针，但接受所有非空指针。' }, correct: false }
    explanation: { en: 'An array parameter is adjusted to a pointer parameter. The bracketed 8 is documentation at most; use an array reference or fixed-extent span when the type must enforce it.', zh: '数组形参会调整为指针形参。方括号中的8最多只是说明；需要由类型强制边界时，应使用数组引用或固定边界span。' }
    difficulty: beginner
    tags: [function-parameters, array-decay, bounds]

  - id: spotbug-inclusive-bound
    title: { en: 'Spot the bug in the four-element total', zh: '找出四元素求和里的bug' }
    type: spotbug
    prompt: { en: 'Find the bounds error in this function, which should total exactly four elements.', zh: '找出这个函数的边界错误；它应当只累加4个元素。' }
    code: |
      int total_four(const int (&values)[4]) {
          int total = 0;
          for (int index = 0; index <= 4; ++index) {
              total += values[index];
          }
          return total;
      }
    lang: cpp
    issues:
      - line: 3
        kind: edge-case
        note: { en: 'The inclusive condition reaches index 4, which is the one-past position and cannot be dereferenced.', zh: '包含等号的条件会访问索引4；它是尾后位置，不能解引用。' }
    explanation: { en: 'Use index < 4, or avoid repeating the bound with a range for. A one-past pointer can mark an end, but values[4] has undefined behavior.', zh: '应使用index < 4，或改用范围for，避免重复边界。尾后指针可以表示结束位置，但values[4] 会产生未定义行为。' }
    difficulty: beginner
    tags: [bounds, off-by-one, undefined-behavior]

  - id: multidimensional-pointer-type
    type: mcq
    prompt: { en: 'After array-to-pointer conversion, what is the type of int grid[2][3] in an ordinary expression?', zh: 'int grid[2][3] 在普通表达式中发生数组到指针转换后，类型是什么？' }
    options:
      - { text: { en: 'int**', zh: 'int**' }, correct: false }
      - { text: { en: 'int*', zh: 'int*' }, correct: false }
      - { text: { en: 'int (*)[3]', zh: 'int (*)[3]' }, correct: true }
      - { text: { en: 'int (*)[2]', zh: 'int (*)[2]' }, correct: false }
    explanation: { en: 'The outer array contains two elements of type int[3], so conversion produces a pointer to its first row. The row extent 3 remains in the pointee type.', zh: '外层数组含有两个int[3] 元素，因此转换结果是指向第一行的指针。行边界3仍保留在指针目标类型中。' }
    difficulty: intermediate
    tags: [multidimensional-arrays, pointer-to-array, row-major]

  - id: review-generated-average
    title: { en: 'Review generated reading average', zh: '审查生成的读数平均值' }
    type: review
    prompt: { en: 'Review this generated fixed-buffer averaging function.', zh: '审查这个生成的定长缓冲区求平均值函数。' }
    task: { en: 'Accept up to eight readings, ignore negative values, and return the average of the remaining readings. Oversized input and an empty filtered result must be reported rather than accessed or divided.', zh: '接收最多8个读数，忽略负值，并返回其余读数的平均值。输入过大或过滤后为空时必须报告错误，不能继续访问或做除法。' }
    code: |
      double average_nonnegative(const int readings[8], std::size_t count) {
          int accepted[8];
          std::size_t used = 0;

          for (std::size_t index = 0; index <= count; ++index) {
              if (readings[index] >= 0) {
                  accepted[used++] = readings[index];
              }
          }

          int total = 0;
          for (std::size_t index = 0;
               index < sizeof(readings) / sizeof(readings[0]); ++index) {
              total += accepted[index];
          }

          return static_cast<double>(total / used);
      }
    lang: cpp
    right: { en: 'The generated code uses std::size_t for counts, keeps negative readings out of the sum, and performs an explicit conversion for the floating-point result.', zh: '生成代码用std::size_t表示数量，排除了负值，并对浮点结果做了显式类型转换。' }
    checklist:
      - { en: 'Make the parameter type carry a trustworthy extent or validate count before every access.', zh: '让形参类型携带可信边界，或在每次访问前验证count。' }
      - { en: 'Use a half-open index range and test counts of zero, one, eight, and nine.', zh: '使用半开索引范围，并测试count为0、1、8和9。' }
      - { en: 'Base the sum on the number of initialized accepted elements, not on sizeof a parameter.', zh: '按已经初始化的accepted元素数量求和，不要依赖形参的sizeof。' }
      - { en: 'Handle an empty filtered result and perform division in floating-point arithmetic.', zh: '处理过滤后为空的结果，并使用浮点运算执行除法。' }
    issues:
      - line: 1
        kind: readability
        note: { en: 'The [8] spelling is adjusted to const int* and misleadingly looks as though the function enforces an eight-element input.', zh: '[8] 写法会调整为const int*，却容易让人误以为函数强制要求8个元素。' }
      - line: 5
        kind: security
        note: { en: 'The inclusive loop reads readings[count], and count is never limited to eight; large input can also overflow accepted.', zh: '包含等号的循环会读取readings[count]，而且count从未限制为8；过大的输入还会写穿accepted。' }
      - line: 13
        kind: correctness
        note: { en: 'readings is a pointer here, so sizeof produces a pointer-based count and can make the loop read uninitialized accepted elements.', zh: '这里的readings是指针，sizeof得到基于指针大小的数量，循环可能读取accepted中未初始化的元素。' }
      - line: 17
        kind: edge-case
        note: { en: 'If every reading is negative, used is zero and the division is invalid; when it is nonzero, integer division also discards the fractional part before the cast.', zh: '如果所有读数都为负，used为0，除法无效；used非零时，整数除法也会在类型转换前丢掉小数部分。' }
    explanation: { en: 'Accept a span, reject sizes above eight if the capacity remains a requirement, iterate with index < size, and sum only initialized elements. Return an optional or error for an empty filtered range, and divide as double.', zh: '应接收span；若容量限制仍是要求，则拒绝超过8个元素的输入；用index < size遍历，并且只累加已初始化元素。过滤后为空时返回optional或错误，并以double做除法。' }
    difficulty: advanced
    tags: [code-review, bounds, array-decay, uninitialized-memory]
