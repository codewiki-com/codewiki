topic: cpp/c-preprocessor
items:
  - id: predict-indirect-stringification
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      #include <stdio.h>

      #define LEVEL 3
      #define RAW(value) #value
      #define EXPANDED(value) RAW(value)

      int main(void) {
          printf("%s %s\n", RAW(LEVEL), EXPANDED(LEVEL));
          return 0;
      }
    lang: c
    options:
      - { text: { en: 'LEVEL LEVEL', zh: 'LEVEL LEVEL' }, correct: false }
      - { text: { en: '3 3', zh: '3 3' }, correct: false }
      - { text: { en: 'LEVEL 3', zh: 'LEVEL 3' }, correct: true }
      - { text: { en: 'The program does not compile.', zh: '程序无法编译。' }, correct: false }
    explanation: { en: 'The # operator suppresses argument prescan in RAW, while the outer EXPANDED macro expands LEVEL before RAW stringifies it.', zh: '# 运算符会在RAW中抑制实参预扫描；外层EXPANDED宏先展开LEVEL，再由RAW将结果字符串化。' }
    difficulty: intermediate
    tags: [stringification, expansion-order, predict-output]

  - id: defined-versus-value
    type: mcq
    prompt: { en: 'After #define CACHE_ENABLED 0, which condition selects the disabled branch?', zh: '执行 #define CACHE_ENABLED 0后，哪个条件会选择关闭分支？' }
    options:
      - { text: { en: '#ifdef CACHE_ENABLED', zh: '#ifdef CACHE_ENABLED' }, correct: false }
      - { text: { en: '#if defined(CACHE_ENABLED)', zh: '#if defined(CACHE_ENABLED)' }, correct: false }
      - { text: { en: '#if CACHE_ENABLED', zh: '#if CACHE_ENABLED' }, correct: true }
      - { text: { en: '#ifndef CACHE_ENABLED', zh: '#ifndef CACHE_ENABLED' }, correct: false }
    explanation: { en: '#ifdef and defined test presence, so both are true even when the replacement is zero. #if expands the value and evaluates zero as false.', zh: '#ifdef与defined检查的是名称是否存在，因此替换值为零时仍为真。#if会展开该值，并把零计算为假。' }
    difficulty: beginner
    tags: [conditional-inclusion, feature-flag]

  - id: spotbug-repeated-evaluation
    title: { en: 'Spot the bug in the MAX_VALUE macro', zh: '找出MAX_VALUE宏里的bug' }
    type: spotbug
    prompt: { en: 'Find the macro bug when either argument has a side effect.', zh: '找出实参带副作用时出现的宏错误。' }
    code: |
      #define MAX_VALUE(left, right) \
          ((left) > (right) ? (left) : (right))

      int select_next(int *cursor, int limit) {
          return MAX_VALUE((*cursor)++, limit);
      }
    lang: c
    issues:
      - line: 5
        kind: correctness
        note: { en: 'The selected macro argument appears in both the comparison and result arm, so (*cursor)++ may run twice.', zh: '被选中的宏实参同时出现在比较与结果分支中，因此 (*cursor)++ 可能执行两次。' }
    explanation: { en: 'Parentheses protect precedence but cannot make a repeated parameter evaluate once. Use a typed inline function or evaluate the side effect before the macro call.', zh: '括号只能保护优先级，不能让重复出现的形参只求值一次。应改用带类型的内联函数，或在调用宏前完成带副作用的求值。' }
    difficulty: intermediate
    tags: [multiple-evaluation, side-effects, function-like-macro]

  - id: include-guard-scope
    type: mcq
    prompt: { en: 'What does a conventional include guard guarantee?', zh: '传统的头文件防重复包含能保证什么？' }
    options:
      - { text: { en: 'The header body is processed at most once in each translation unit.', zh: '头文件正文在每个翻译单元中最多处理一次。' }, correct: true }
      - { text: { en: 'The header creates one runtime module for the whole program.', zh: '头文件会为整个程序创建一个运行时模块。' }, correct: false }
      - { text: { en: 'Definitions in the header have one program-wide storage instance.', zh: '头文件中的定义在整个程序中只有一份存储。' }, correct: false }
      - { text: { en: 'Circular dependencies on complete types are resolved automatically.', zh: '对完整类型的循环依赖会被自动解决。' }, correct: false }
    explanation: { en: 'Guard macros have preprocessing state within one translation unit. Another source file begins its own preprocessing and can include the header once again.', zh: '保护宏的预处理状态属于单个翻译单元。另一个源文件会重新开始预处理，也会再次包含该头文件一次。' }
    difficulty: beginner
    tags: [include-guard, translation-unit, headers]

  - id: review-generated-label-copy
    type: review
    title: { en: 'Review a generated label-copy helper', zh: '审查生成的标签复制辅助函数' }
    prompt: { en: 'Review this generated C23 code before it enters a portable library.', zh: '在这段生成的C23代码进入可移植库之前进行审查。' }
    task: { en: 'Copy a label into caller storage only when it fits, terminate it, preserve the destination on failure, and compile tracing only when FEATURE_TRACE is 1.', zh: '仅在标签能够放入调用方存储时才复制并补终止符；失败时保持目标不变，并且只在FEATURE_TRACE为1时编译跟踪代码。' }
    code: |
      #include <stddef.h>
      #include <stdio.h>
      #include <string.h>

      #define FEATURE_TRACE 0
      #ifdef FEATURE_TRACE
      #define TRACE(format, ...) printf(format, ##__VA_ARGS__)
      #else
      #define TRACE(format, ...) ((void)0)
      #endif

      #define COPY_LABEL(dst, src, count) do { \
          memcpy((dst), (src), (count)); \
          (dst)[(count)] = '\0'; \
      } while (0)

      size_t store_label(char *dst, size_t capacity,
                         const char *src, size_t length) {
          if (length > capacity) return 0;
          COPY_LABEL(dst, src, length);
          TRACE("stored %zu\n", length);
          return length;
      }
    lang: c
    right: { en: 'The generated function uses size_t for lengths, checks capacity before calling memcpy, writes the terminator in one helper, and keeps tracing behind a preprocessing branch.', zh: '生成函数用size_t表示长度，在调用memcpy前检查容量，通过一个辅助宏写入终止符，并把跟踪代码放在预处理分支之后。' }
    checklist:
      - { en: 'Distinguish definition presence from the zero-or-one value of every build switch.', zh: '区分每个构建开关的定义状态与零或一数值。' }
      - { en: 'Prove capacity leaves room for the terminator and that failure performs no writes.', zh: '证明容量为终止符留有空间，并确认失败时不执行任何写入。' }
      - { en: 'Count every macro-argument occurrence and reject side-effecting arguments where evaluation repeats.', zh: '统计每个宏实参的出现次数，并在重复求值处拒绝带副作用的实参。' }
      - { en: 'Build with strict C23 diagnostics and without GNU extensions.', zh: '使用严格的C23诊断并关闭GNU扩展进行构建。' }
    issues:
      - line: 6
        kind: correctness
        note: { en: '#ifdef selects the tracing branch because FEATURE_TRACE is defined, even though its value is zero.', zh: 'FEATURE_TRACE虽然值为零但已经定义，因此 #ifdef仍会选择跟踪分支。' }
      - line: 7
        kind: readability
        note: { en: 'The GNU comma-swallowing form hides a dialect dependency; portable C23 should use __VA_OPT__ for the optional comma.', zh: 'GNU的逗号吞并写法隐藏了方言依赖；可移植C23应使用 __VA_OPT__ 处理可选逗号。' }
      - line: 12
        kind: edge-case
        note: { en: 'dst and count occur more than once, so a future call with expressions such as next_slot() or length++ would evaluate them repeatedly.', zh: 'dst与count出现多次，因此以后若传入next_slot() 或length++等表达式，就会发生重复求值。' }
      - line: 19
        kind: security
        note: { en: 'Allowing length == capacity leaves no byte for the terminator written at dst[length], causing an out-of-bounds write.', zh: '允许length == capacity不会给终止符留下字节，写入dst[length] 时会越界。' }
    explanation: { en: 'Use #if FEATURE_TRACE and __VA_OPT__, move the copy into a function or require already evaluated arguments, and reject length >= capacity. Prepare any fallible work before modifying dst so every failure preserves it.', zh: '应使用 #if FEATURE_TRACE与 __VA_OPT__，把复制逻辑移入函数或要求传入已经求值的实参，并拒绝length >= capacity。所有可能失败的工作都应在修改dst前完成，使每条失败路径都保持目标不变。' }
    difficulty: advanced
    minutes: 7
    tags: [code-review, macros, bounds, portability]
