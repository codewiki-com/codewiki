topic: cpp/c-pointers
items:
  - id: predict-pointer-copy
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      #include <stdio.h>

      static void redirect(int *current, int *next) {
          current = next;
          *current = 9;
      }

      int main(void) {
          int first = 3;
          int second = 4;
          redirect(&first, &second);
          printf("%d %d\n", first, second);
          return 0;
      }
    lang: c
    options:
      - { text: { en: '3 9', zh: '3 9' }, correct: true }
      - { text: { en: '9 4', zh: '9 4' }, correct: false }
      - { text: { en: '9 9', zh: '9 9' }, correct: false }
      - { text: { en: '3 4', zh: '3 4' }, correct: false }
    explanation: { en: 'The function receives copies of both addresses. Reassigning current changes only the local pointer, then dereferencing it writes second, so the output is 3 9.', zh: '函数收到两个地址的副本。给 current 重新赋值只改变局部指针，随后解引用会写入 second，因此输出为 3 9。' }
    difficulty: beginner
    tags: [pointer-copy, pass-by-value, predict-output]

  - id: pointer-carries-no-extent
    type: mcq
    prompt: { en: 'Inside void inspect(const int *values), what does sizeof(values) measure?', zh: '在 void inspect(const int *values) 内，sizeof(values) 测量什么？' }
    options:
      - { text: { en: 'The size of the caller’s complete array', zh: '调用方完整数组的大小' }, correct: false }
      - { text: { en: 'The number of initialized array elements', zh: '已经初始化的数组元素数' }, correct: false }
      - { text: { en: 'The size of the pointer object', zh: '指针对象本身的大小' }, correct: true }
      - { text: { en: 'The size of the first int element', zh: '第一个 int 元素的大小' }, correct: false }
    explanation: { en: 'The parameter has pointer type and carries no array extent. Pass a count or end pointer instead of trying to recover the caller’s array length with sizeof.', zh: '该形参是指针类型，不携带数组边界。应传递数量或结束指针，不能尝试用 sizeof 恢复调用方数组长度。' }
    difficulty: beginner
    tags: [sizeof, bounds, array-decay]

  - id: spotbug-return-local-address
    title: { en: 'Spot the bug in the local reading pointer', zh: '找出局部读数指针里的 bug' }
    type: spotbug
    prompt: { en: 'Find the lifetime bug in this function.', zh: '找出这个函数中的生命周期错误。' }
    code: |
      const int *last_reading(void) {
          int reading = 42;
          return &reading;
      }
    lang: c
    issues:
      - line: 3
        kind: correctness
        note: { en: 'reading has automatic storage duration, so its lifetime ends when the function returns and the returned pointer is dangling.', zh: 'reading 具有自动存储期，函数返回时其生命周期结束，因此返回的指针会悬空。' }
    explanation: { en: 'Let the caller provide storage or return the integer by value. Adding static would change the state-sharing and concurrency contract rather than generally fixing ownership.', zh: '应让调用方提供存储，或按值返回整数。改加 static 会改变状态共享与并发契约，不是通用的所有权修复。' }
    difficulty: beginner
    tags: [dangling-pointer, lifetime, stack-address]

  - id: pointee-constness
    type: mcq
    prompt: { en: 'What does const int *cursor permit?', zh: 'const int *cursor 允许哪种操作？' }
    options:
      - { text: { en: 'Reassign cursor, but not modify the int through cursor', zh: '可以给 cursor 重新赋值，但不能经 cursor 修改 int' }, correct: true }
      - { text: { en: 'Modify the int through cursor, but not reassign cursor', zh: '可以经 cursor 修改 int，但不能给 cursor 重新赋值' }, correct: false }
      - { text: { en: 'Neither reassign cursor nor read the int', zh: '既不能给 cursor 重新赋值，也不能读取 int' }, correct: false }
      - { text: { en: 'Modify both cursor and the int without restriction', zh: '可以不受限制地修改 cursor 与 int' }, correct: false }
    explanation: { en: 'const qualifies the pointed-to int in this declaration. The pointer object remains assignable; int *const cursor would instead make the pointer itself const.', zh: '该声明中的 const 限定所指向的 int，指针对象本身仍可赋值。int *const cursor 才会限定指针对象。' }
    difficulty: beginner
    tags: [const, pointee, declaration]

  - id: review-generated-range-search
    type: review
    title: { en: 'Review a generated pointer-range search', zh: '审查生成的指针范围查找' }
    prompt: { en: 'Review this generated function before it is used with external counts.', zh: '在这个生成函数接收外部数量之前进行审查。' }
    task: { en: 'Search at most 16 integers for the first value in the inclusive [low, high] range. Reject a null output pointer, never access beyond count, and leave *out unchanged on every failure.', zh: '在最多 16 个整数中查找首个落入闭区间 [low, high] 的值。拒绝空输出指针，不得访问 count 之外的位置，并在所有失败路径上保持 *out 不变。' }
    code: |
      int find_between(const int values[16],
                       size_t count,
                       int low,
                       int high,
                       const int **out) {
          *out = NULL;
          if (low > high) {
              return 0;
          }

          for (size_t index = 0; index <= count; ++index) {
              if (values[index] > low && values[index] < high) {
                  *out = &values[index];
                  return 1;
              }
          }

          return 0;
      }
    lang: c
    right: { en: 'The generated code uses size_t for the element count, accepts read-only input, and returns a pointer into caller-owned storage rather than copying or freeing that storage.', zh: '生成代码使用 size_t 表示元素数，以只读方式接收输入，并返回指向调用方存储的指针，没有复制或释放该存储。' }
    checklist:
      - { en: 'Make the pointer-plus-count contract explicit and reject count above 16 before traversal.', zh: '明确指针与数量组成的契约，并在遍历前拒绝大于 16 的 count。' }
      - { en: 'Validate every output pointer before dereferencing and commit it only on success.', zh: '解引用前验证每个输出指针，并且只在成功时提交结果。' }
      - { en: 'Use a half-open loop and test counts of zero, one, sixteen, and seventeen.', zh: '使用半开循环，并测试 count 为 0、1、16 和 17。' }
      - { en: 'Test values equal to low and high as well as an inverted range.', zh: '测试恰好等于 low 与 high 的值，以及上下界颠倒的区间。' }
    issues:
      - line: 1
        kind: readability
        note: { en: 'The [16] parameter spelling adjusts to a pointer and misleadingly looks as though it enforces the maximum.', zh: '[16] 形参写法会调整为指针，却容易让人误以为它会强制最大数量。' }
      - line: 6
        kind: edge-case
        note: { en: 'The code dereferences out before checking whether it is null.', zh: '代码在检查 out 是否为空之前就解引用了它。' }
      - line: 11
        kind: security
        note: { en: 'The inclusive condition reads values[count], and count is never rejected when it exceeds the promised capacity.', zh: '包含等号的条件会读取 values[count]，而且超过约定容量的 count 从未被拒绝。' }
      - line: 12
        kind: correctness
        note: { en: 'Strict comparisons exclude values equal to low or high even though the required range is inclusive.', zh: '任务要求闭区间，但严格比较会排除恰好等于 low 或 high 的值。' }
    explanation: { en: 'Validate out, values, count, and range before traversal, then loop while index < count and use inclusive comparisons. Assign *out only after finding a match so every failure preserves the old result.', zh: '遍历前应验证 out、values、count 与区间，再用 index < count 循环并采用包含端点的比较。只有找到匹配后才写入 *out，使每条失败路径都保留旧结果。' }
    difficulty: advanced
    tags: [code-review, bounds, output-parameter, lifetime]
