topic: cpp/move-semantics
items:
  - id: predict-named-rvalue-reference
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      #include <iostream>
      #include <string>
      #include <utility>

      void route(const std::string&) { std::cout << "lvalue\n"; }
      void route(std::string&&) { std::cout << "rvalue\n"; }

      int main() {
          std::string item = "report";
          std::string&& ref = std::move(item);
          route(ref);
          route(std::move(ref));
      }
    lang: cpp
    options:
      - { text: { en: "lvalue\nrvalue", zh: "lvalue\nrvalue" }, correct: true }
      - { text: { en: "rvalue\nrvalue", zh: "rvalue\nrvalue" }, correct: false }
      - { text: { en: "lvalue\nlvalue", zh: "lvalue\nlvalue" }, correct: false }
      - { text: { en: 'The program does not compile.', zh: '程序无法通过编译。' }, correct: false }
    explanation: { en: 'A named variable expression is an lvalue even when its declared type is an rvalue reference. The explicit std::move in the second call produces an xvalue.', zh: '即使变量声明为右值引用，有名字的变量表达式仍是左值。第二次调用中的显式 std::move 产生 xvalue。' }
    difficulty: intermediate
    tags: [value-category, overload-resolution]

  - id: const-move-selects-copy
    type: mcq
    prompt: { en: 'Why does constructing T from std::move(const_value) commonly call T(const T&) instead of T(T&&)?', zh: '为什么用 std::move(const_value) 构造 T 时，通常调用 T(const T&)，而不是 T(T&&)？' }
    options:
      - { text: { en: 'std::move preserves const, and T&& cannot bind to const T&&.', zh: 'std::move 会保留 const，而 T&& 不能绑定到 const T&&。' }, correct: true }
      - { text: { en: 'std::move always copies class objects.', zh: 'std::move 总会复制类对象。' }, correct: false }
      - { text: { en: 'Move construction is disabled whenever a copy constructor exists.', zh: '只要复制构造函数存在，移动构造就会被禁用。' }, correct: false }
    explanation: { en: 'The cast changes the value category but not cv-qualification. A usual move constructor needs a non-const source so it can modify the source state.', zh: '该转换只改变值类别，不改变 cv 限定。常见移动构造函数需要非 const 源对象，以便修改其状态。' }
    difficulty: intermediate
    tags: [const, overload-resolution]

  - id: spot-moved-from-index
    title: { en: 'Spot the bug in the moved-from vector', zh: '找出移动后 vector 里的 bug' }
    type: spotbug
    prompt: { en: 'Find the invalid assumption about the moved-from vector.', zh: '找出代码对移动后 vector 所作的无效假设。' }
    code: |
      #include <iostream>
      #include <string>
      #include <utility>
      #include <vector>

      void archive(std::vector<std::string> pending) {
          auto stored = std::move(pending);
          std::cout << pending[0] << '\n';
          std::cout << stored.size() << '\n';
      }
    lang: cpp
    issues:
      - line: 8
        kind: edge-case
        note: { en: 'A moved-from vector is valid but its size is unspecified. Indexing element 0 violates operator[] preconditions if the vector is empty.', zh: '移动后的 vector 有效，但其大小未指定。如果 vector 为空，访问 0 号元素会违反 operator[] 的前置条件。' }
    explanation: { en: 'Do not read a moved-from container through an index unless a documented postcondition proves that index exists. Destroy it, assign a new value, or use only operations whose preconditions are satisfied.', zh: '除非有明确后置条件证明索引存在，否则不要通过索引读取移动后的容器。可以析构、重新赋值，或只调用满足前置条件的操作。' }
    difficulty: intermediate
    tags: [moved-from-state, preconditions]

  - id: move-if-noexcept-choice
    type: mcq
    prompt: { en: 'For a copyable type, when does std::move_if_noexcept return an rvalue reference?', zh: '对于可复制类型，std::move_if_noexcept 何时返回右值引用？' }
    options:
      - { text: { en: 'When its move constructor is non-throwing', zh: '当它的移动构造函数保证不抛异常时' }, correct: true }
      - { text: { en: 'Whenever std::move was used earlier', zh: '只要之前使用过 std::move' }, correct: false }
      - { text: { en: 'Only when its copy constructor is noexcept', zh: '仅当复制构造函数为 noexcept 时' }, correct: false }
      - { text: { en: 'Only for standard-library types', zh: '仅适用于标准库类型' }, correct: false }
    explanation: { en: 'A non-throwing move lets relocation transfer the source without losing the recovery path to a move exception. If copying is unavailable, move_if_noexcept also returns an rvalue reference even when moving may throw.', zh: '不抛异常的移动允许重定位安全地转移源对象，不会因移动异常失去恢复路径。如果对象不可复制，即使移动可能抛异常，move_if_noexcept 也会返回右值引用。' }
    difficulty: advanced
    tags: [noexcept, exception-safety]

  - id: review-generated-packet-owner
    title: { en: 'Review generated Packet owner', zh: '审查生成的 Packet 所有者' }
    type: review
    prompt: { en: 'Review this generated owning packet type and its factory.', zh: '审查这个生成的资源所有型 Packet 及其工厂函数。' }
    task: { en: 'Implement a move-only Packet that owns a dynamic byte array and can be returned efficiently from load_packet.', zh: '实现只可移动的 Packet，使其拥有动态字节数组，并能从 load_packet 高效返回。' }
    code: |
      class Packet {
      public:
          explicit Packet(std::size_t size)
              : data_(new unsigned char[size]), size_(size) {}
          ~Packet() { delete[] data_; }
          Packet(const Packet&) = delete;
          Packet& operator=(const Packet&) = delete;
          Packet(Packet&& other) noexcept
              : data_(other.data_), size_(other.size_) {}
          Packet& operator=(Packet&& other) noexcept {
              delete[] data_;
              data_ = other.data_;
              size_ = other.size_;
              other.data_ = nullptr;
              other.size_ = 0;
              return *this;
          }
      private:
          unsigned char* data_;
          std::size_t size_;
      };
      Packet load_packet(std::size_t size) {
          Packet packet(size);
          return std::move(packet);
      }
    lang: cpp
    right: { en: 'The code deletes copying, releases storage in the destructor, truthfully marks its move operations noexcept, and resets the source during ordinary move assignment.', zh: '代码删除了复制操作，在析构函数中释放资源，如实把移动操作标为 noexcept，并在普通移动赋值中重置源对象。' }
    checklist:
      - { en: 'Trace ownership through construction, assignment, self-move, and destruction.', zh: '跟踪构造、赋值、自移动和析构过程中的所有权。' }
      - { en: 'Check pointer-and-size invariants for both source and target.', zh: '检查源对象和目标对象的指针与长度不变量。' }
      - { en: 'Verify noexcept with traits and the operations in each function body.', zh: '用类型特征和函数体中的操作验证 noexcept。' }
      - { en: 'Look for explicit moves that block copy elision.', zh: '查找会阻止拷贝消除的显式移动。' }
    issues:
      - line: 19
        kind: readability
        note: { en: 'The raw pointer and size duplicate ownership machinery that a vector or another RAII member would express and maintain together.', zh: '裸指针和长度重复实现了所有权机制；vector 或其他 RAII 成员能把二者一起表达和维护。' }
      - line: 9
        kind: correctness
        note: { en: 'The move constructor copies the pointer but never clears the source, so both objects later delete the same array.', zh: '移动构造函数复制了指针却未清空源对象，两个对象之后会重复释放同一数组。' }
      - line: 11
        kind: edge-case
        note: { en: 'Move assignment does not handle self-move; it deletes the array and then stores the same dangling pointer back into the object.', zh: '移动赋值没有处理自移动；它先释放数组，又把同一个悬空指针存回对象。' }
      - line: 24
        kind: performance
        note: { en: 'Explicitly moving the named local prevents NRVO. Returning packet by name preserves elision and still permits implicit move when needed.', zh: '显式移动命名局部对象会阻止 NRVO。按名称返回 packet 可保留消除机会，必要时仍能隐式移动。' }
    explanation: { en: 'Replace the raw resource pair with an RAII member when possible. Otherwise reset the source in both move operations, make assignment self-move safe, and return the local by name.', zh: '应尽量用 RAII 成员替代裸资源组合。否则要在两种移动操作中都重置源对象，让赋值安全处理自移动，并按名称返回局部对象。' }
    difficulty: advanced
    tags: [code-review, rule-of-five, copy-elision]
