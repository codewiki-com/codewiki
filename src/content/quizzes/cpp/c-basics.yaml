topic: cpp/c-basics
items:
  - id: predict-integer-division
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      #include <stdio.h>

      int main(void) {
          printf("%d %.1f\n", 7 / 2, 7 / 2.0);
          return 0;
      }
    lang: c
    options:
      - { text: { en: '3 3.5', zh: '3 3.5' }, correct: true }
      - { text: { en: '3.5 3.5', zh: '3.5 3.5' }, correct: false }
      - { text: { en: '3 3.0', zh: '3 3.0' }, correct: false }
      - { text: { en: 'The program has undefined behavior.', zh: '程序产生未定义行为。' }, correct: false }
    explanation: { en: 'Both operands of 7 / 2 are int, so integer division truncates toward zero. The 2.0 in the second expression makes the common type double.', zh: '7 / 2的两个操作数都是int，因此整数除法向零截断；第二个表达式中的2.0让共同类型变为double。' }
    difficulty: beginner
    tags: [integer-division, conversions, predict-output]
    tests: 'gcc -std=c2x -Wall -Wextra -Werror quiz.c -o quiz && ./quiz'
    minutes: 2

  - id: c-byte-size
    type: mcq
    prompt: { en: 'Which statement about sizeof(char) is portable C?', zh: '关于sizeof(char)，哪项说法符合可移植C？' }
    options:
      - { text: { en: 'It is always 1 C byte, while CHAR_BIT tells how many bits that byte has.', zh: '它始终是1个C字节，而CHAR_BIT给出该字节的位数。' }, correct: true }
      - { text: { en: 'It is always 8 because every C byte is eight bits.', zh: '它始终是8，因为每个C字节都有8位。' }, correct: false }
      - { text: { en: 'It equals sizeof(int) on every hosted implementation.', zh: '在所有宿主实现中，它都等于sizeof(int)。' }, correct: false }
      - { text: { en: 'It depends on whether plain char is signed.', zh: '它取决于普通char是否有符号。' }, correct: false }
    explanation: { en: 'C defines sizeof in units of char-sized bytes, so sizeof(char) is 1 by definition. CHAR_BIT is at least 8 but is not required to equal 8.', zh: 'C用char大小的字节作为sizeof的单位，所以sizeof(char) 按定义就是1。CHAR_BIT至少为8，但不要求恰好为8。' }
    difficulty: beginner
    tags: [sizeof, char, portability]
    minutes: 2

  - id: spot-signed-unsigned-comparison
    title: { en: 'Spot the bug in the balance comparison', zh: '找出余额比较里的bug' }
    type: spotbug
    prompt: { en: 'Find why the branch does not report a negative balance.', zh: '找出这个分支没有报告负余额的原因。' }
    code: |
      #include <stdio.h>

      int main(void) {
          int balance = -1;
          unsigned int minimum = 1;
          if (balance < minimum) {
              puts("below minimum");
          } else {
              puts("not below minimum");
          }
          return 0;
      }
    lang: c
    issues:
      - line: 6
        kind: correctness
        note: { en: 'The usual arithmetic conversions can convert balance to unsigned int, turning -1 into a large value before comparison.', zh: '通常算术转换可能先把balance转成unsigned int，使 -1在比较前变成很大的无符号值。' }
    explanation: { en: 'Use compatible signed types for values that can be negative, or validate the signed value before a checked conversion. Enabling -Wsign-compare exposes this mismatch.', zh: '可能为负的值应使用兼容的有符号类型，或者先检查有符号值，再做经过范围验证的转换。启用 -Wsign-compare可以暴露这个问题。' }
    difficulty: intermediate
    tags: [signedness, usual-arithmetic-conversions, bug-finding]
    tests: 'gcc -std=c2x -Wall -Wextra -Wsign-compare quiz.c -o quiz && ./quiz'
    minutes: 4

  - id: unsequenced-modification
    type: mcq
    prompt: { en: 'What may portable C conclude about int next = index++ + index;?', zh: '对于int next = index++ + index;，可移植C能得出什么结论？' }
    options:
      - { text: { en: 'It has undefined behavior because the modification and other read of index are unsequenced.', zh: '它产生未定义行为，因为对index的修改与另一次读取彼此无序。' }, correct: true }
      - { text: { en: 'It always uses the old index value twice.', zh: '它一定会使用两次index的旧值。' }, correct: false }
      - { text: { en: 'It always increments index before the second operand.', zh: '它一定会在计算第二个操作数前增加index。' }, correct: false }
      - { text: { en: 'The result is implementation-defined and documented by the compiler.', zh: '结果由实现定义，编译器会记录具体选择。' }, correct: false }
    explanation: { en: 'The + operator does not sequence its operands, so the side effect and the other value computation conflict. Split the increment and calculation into separate statements.', zh: '+ 运算符不会规定两个操作数的先后顺序，因此副作用与另一次取值冲突。应把自增和计算拆成不同语句。' }
    difficulty: intermediate
    tags: [sequencing, side-effects, undefined-behavior]
    minutes: 3

  - id: review-generated-average
    title: { en: 'Review generated reading average', zh: '审查生成的读数平均值' }
    type: review
    prompt: { en: 'Review this generated function for averaging sensor readings.', zh: '审查这个用于计算传感器读数平均值的生成函数。' }
    task: { en: 'Accept at most 16 readings, ignore negative readings, write the average through result, and report invalid pointers, oversized input, or an empty filtered result.', zh: '最多接收16个读数，忽略负数，通过result写出平均值，并报告无效指针、过大输入或过滤后为空。' }
    code: |
      #include <stddef.h>

      int average_nonnegative(const int *readings, size_t count, double *result) {
          int total;
          size_t accepted = 0;

          for (size_t index = 0; index <= count; ++index) {
              if (readings[index] >= 0) {
                  total += readings[index];
                  ++accepted;
              }
          }

          if (accepted == 0) {
              return 0;
          }

          *result = total / accepted;
          return 1;
      }
    lang: c
    right: { en: 'The generated code uses size_t for a count, keeps negative readings out of the total, and avoids division when no reading is accepted.', zh: '生成代码使用size_t表示数量，排除了负读数，并且在没有读数被接收时避免了除法。' }
    checklist:
      - { en: 'Validate pointer preconditions and the maximum count before any dereference.', zh: '在任何解引用之前验证指针前置条件和最大数量。' }
      - { en: 'Use a half-open loop and test counts of zero, one, sixteen, and seventeen.', zh: '使用半开循环，并测试数量为0、1、16和17的情况。' }
      - { en: 'Initialize every accumulator and perform the final division in double.', zh: '初始化每个累加器，并使用double完成最终除法。' }
      - { en: 'Give success and each failure mode an explicit, documented result.', zh: '为成功和每种失败模式提供明确且有文档的结果。' }
    issues:
      - line: 3
        kind: edge-case
        note: { en: 'The function dereferences readings and result without rejecting null pointers.', zh: '函数没有拒绝空指针，就会解引用readings和result。' }
      - line: 4
        lines: 15
        kind: correctness
        note: { en: 'total is uninitialized, and the later int-by-size_t division truncates before assignment to double.', zh: 'total未初始化，而且后面的int与size_t除法会在赋给double之前截断。' }
      - line: 7
        kind: security
        note: { en: 'The inclusive bound reads readings[count], and no check rejects count above the promised capacity of 16.', zh: '包含等号的边界会读取readings[count]，而且没有检查并拒绝超过容量16的count。' }
      - line: 14
        lines: 3
        kind: readability
        note: { en: 'A bare 0 conflates an empty filtered result with other validation failures and leaves the error contract implicit.', zh: '直接返回0会把过滤后为空与其他验证失败混在一起，使错误契约保持隐含。' }
    explanation: { en: 'Validate pointers and count first, initialize total, iterate while index < count, and divide after converting an operand to double. Use a documented status enum or distinct error codes so the caller can handle each failure.', zh: '应先验证指针和count，初始化total，以index < count遍历，并在把一个操作数转成double后做除法。使用有文档的状态枚举或不同错误码，让调用方能处理每种失败。' }
    difficulty: advanced
    tags: [code-review, bounds, initialization, conversions]
    minutes: 10
