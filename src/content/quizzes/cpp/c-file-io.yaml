topic: cpp/c-file-io
items:
  - id: predict-fgets-newline
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      #include <stdio.h>
      #include <string.h>

      int main(void) {
          FILE *stream = tmpfile();
          if (stream == NULL) return 1;
          if (fputs("red\nblue\n", stream) == EOF ||
              fseek(stream, 0, SEEK_SET) != 0) return 1;

          char buffer[5];
          if (fgets(buffer, sizeof buffer, stream) == NULL) return 1;
          printf("%zu %d\n", strlen(buffer), buffer[3] == '\n');
          return fclose(stream) == EOF ? 1 : 0;
      }
    lang: c
    options:
      - { text: { en: '4 1', zh: '4 1' }, correct: true }
      - { text: { en: '3 0', zh: '3 0' }, correct: false }
      - { text: { en: '3 1', zh: '3 1' }, correct: false }
      - { text: { en: '4 0', zh: '4 0' }, correct: false }
    explanation: { en: 'fgets stores the newline when it fits, followed by the null terminator. The string is therefore four characters long and buffer[3] is a newline.', zh: '换行符能放入缓冲区时，fgets会保留它，再添加空字符。因此字符串长度为4，而且buffer[3] 是换行符。' }
    difficulty: beginner
    tags: [fgets, newline, predict-output]
    tests: 'gcc -std=c2x -Wall -Wextra -Werror quiz.c -o quiz && ./quiz'
    minutes: 3

  - id: fread-counts-elements
    type: mcq
    prompt: { en: 'What does fread(buffer, sizeof(uint32_t), 8, stream) return?', zh: 'fread(buffer, sizeof(uint32_t), 8, stream) 返回什么？' }
    options:
      - { text: { en: 'The number of complete uint32_t elements read, from 0 through 8.', zh: '完整读到的uint32_t元素数，范围为0到8。' }, correct: true }
      - { text: { en: 'The number of bytes read, from 0 through 32.', zh: '读取的字节数，范围为0到32。' }, correct: false }
      - { text: { en: 'EOF when the stream contains fewer than eight elements.', zh: '流中不足8个元素时返回EOF。' }, correct: false }
      - { text: { en: 'Exactly 8 unless the program has undefined behavior.', zh: '除非程序产生未定义行为，否则一定返回8。' }, correct: false }
    explanation: { en: 'fread returns complete elements, not bytes. A value below 8 is a short count, after which feof and ferror explain whether input ended or failed.', zh: 'fread返回完整元素数，而不是字节数。小于8是短计数，随后要用feof和ferror判断输入是正常结束还是发生错误。' }
    difficulty: beginner
    tags: [fread, short-read, return-value]
    minutes: 2

  - id: spot-fgetc-char
    title: { en: 'Spot the bug in the byte-copy loop', zh: '找出字节复制循环里的bug' }
    type: spotbug
    prompt: { en: 'Find the portability bug in this byte-copy loop.', zh: '找出这个字节复制循环中的可移植性缺陷。' }
    code: |
      #include <stdio.h>

      int copy_bytes(FILE *input, FILE *output) {
          char byte;
          while ((byte = fgetc(input)) != EOF) {
              if (fputc(byte, output) == EOF) return -1;
          }
          return ferror(input) ? -1 : 0;
      }
    lang: c
    issues:
      - line: 4
        kind: correctness
        note: { en: 'fgetc returns every unsigned-char value plus EOF, so narrowing to char can either turn a valid byte into EOF or make EOF impossible to represent.', zh: 'fgetc需要返回所有unsigned char值以及EOF；缩窄成char后，可能把有效字节变成EOF，也可能让EOF无法表示。' }
    explanation: { en: 'Receive fgetc in an int, compare that int with EOF, and pass the successful value to fputc. Plain char signedness is implementation-defined.', zh: '应使用int接收fgetc的结果，先与EOF比较，再把成功读取的值传给fputc。普通char的符号性由实现决定。' }
    difficulty: intermediate
    tags: [fgetc, eof, integer-conversion]
    tests: 'gcc -std=c2x -Wall -Wextra -Wconversion -Werror -c quiz.c'
    minutes: 4

  - id: update-stream-direction
    type: mcq
    prompt: { en: 'On an r+b update stream, what must normally separate a successful read from a following write when that read did not encounter EOF?', zh: '在r+b更新流上，一次未遇到EOF的成功读取与随后的写入之间通常必须有什么操作？' }
    options:
      - { text: { en: 'A successful file-positioning call such as fseek.', zh: '一次成功的文件定位调用，例如fseek。' }, correct: true }
      - { text: { en: 'Only fflush, because it discards unread input portably.', zh: '只能调用fflush，因为它能以可移植方式丢弃未读输入。' }, correct: false }
      - { text: { en: 'A call to feof, even when it returns false.', zh: '调用feof，即使它返回假也可以。' }, correct: false }
      - { text: { en: 'Nothing; + removes every sequencing restriction.', zh: '不需要任何操作；+ 会取消所有顺序限制。' }, correct: false }
    explanation: { en: 'After input on an update stream, output normally requires an intervening positioning operation. The exception is an input operation that encountered end of file.', zh: '更新流执行输入后，开始输出前通常需要插入定位操作。例外情况是前一次输入操作遇到了文件结束。' }
    difficulty: intermediate
    tags: [update-stream, fseek, sequencing]
    minutes: 3

  - id: review-generated-file-copy
    title: { en: 'Review generated file copy', zh: '审查生成的文件复制' }
    type: review
    prompt: { en: 'Review this generated function for copying an arbitrary file.', zh: '审查这个用于复制任意文件的生成函数。' }
    task: { en: 'Copy arbitrary bytes from an existing source to a newly created destination, never replace an existing destination, handle short transfers and every I/O error, and report success only after closing succeeds.', zh: '把任意字节从已有源文件复制到新建目标，不得替换已有目标；处理短传输和所有I/O错误，并且只在关闭成功后报告成功。' }
    code: |
      #include <stdio.h>

      int copy_file(const char *source_path, const char *destination_path) {
          FILE *source = fopen(source_path, "r");
          if (source == NULL) {
              return -1;
          }

          FILE *destination = fopen(destination_path, "wb");
          unsigned char buffer[4096];

          while (!feof(source)) {
              size_t count = fread(buffer, 1, sizeof buffer, source);
              (void)count;
              fwrite(buffer, sizeof buffer, 1, destination);
              fflush(destination);
          }

          fclose(source);
          fclose(destination);
          return 0;
      }
    lang: c
    right: { en: 'The generated code checks whether the source opened, uses a bounded stack buffer, and stores the actual fread count instead of assuming the buffer is full.', zh: '生成代码检查了源文件是否打开成功，使用有界栈缓冲区，并保存了fread的实际返回数量，没有直接假定缓冲区已满。' }
    checklist:
      - { en: 'Verify binary modes, exclusive destination creation, path policy, and every open result before transfer.', zh: '在传输前核对二进制模式、目标独占创建、路径策略，并检查每个打开结果。' }
      - { en: 'Drive the loop with fread, pass its actual count to a short-write loop, and inspect ferror afterward.', zh: '用fread驱动循环，把实际数量交给短写循环，并在结束后检查ferror。' }
      - { en: 'Avoid unconditional per-chunk flushing unless the durability contract requires it.', zh: '除非持久性契约明确要求，否则不要无条件逐块刷新。' }
      - { en: 'Treat destination close failure as copy failure and define cleanup for a partial destination.', zh: '把目标关闭失败视为复制失败，并定义半成品目标的清理策略。' }
    issues:
      - line: 9
        kind: security
        note: { en: 'wb replaces an existing destination and its result is never checked; the task requires exclusive creation and a validated destination path.', zh: 'wb会替换已有目标，而且代码未检查打开结果；任务要求独占创建，并验证目标路径。' }
      - line: 4
        lines: 12
        kind: correctness
        note: { en: 'The source uses text mode for arbitrary bytes, then fwrite ignores count and always requests one full 4096-byte element, including bytes never read.', zh: '源文件对任意字节使用了文本模式，随后fwrite又忽略count，固定请求一个4096字节元素，其中包含从未读入的字节。' }
      - line: 12
        kind: edge-case
        note: { en: 'Testing feof before fread adds a failed iteration and never distinguishes an ordinary end from a read error.', zh: '在fread前检查feof会多执行一次失败迭代，而且无法区分正常结束和读取错误。' }
      - line: 16
        kind: performance
        note: { en: 'Flushing after every block defeats useful stdio buffering without being part of the requested durability contract.', zh: '每一块都刷新会破坏stdio缓冲的作用，而任务的持久性契约并没有要求这样做。' }
      - line: 19
        lines: 3
        kind: readability
        note: { en: 'Unchecked close results and an unconditional zero return hide write and close failures and leave partial-file cleanup unspecified.', zh: '未检查关闭结果并无条件返回0，会掩盖写入与关闭失败，也没有说明如何清理半成品文件。' }
    explanation: { en: 'Open the source with rb and the destination with exclusive binary creation, rejecting invalid paths and failed opens. Loop on fread, write exactly count bytes with short-write handling, inspect ferror, and report success only if final output and close operations succeed.', zh: '应以rb打开源文件，以独占二进制创建模式打开目标，并拒绝无效路径和打开失败。用fread驱动循环，处理短写且只写count字节，再检查ferror；只有最终输出和关闭都成功时才报告成功。' }
    difficulty: advanced
    tags: [code-review, file-copy, error-handling, security]
    tests: 'Review with injected short reads, short writes, existing targets, open failures, and close failures.'
    minutes: 12
