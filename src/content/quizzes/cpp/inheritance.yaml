topic: cpp/inheritance
items:
  - id: predict-object-slicing
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      #include <iostream>
      #include <string>

      class Message {
      public:
          virtual std::string kind() const { return "base"; }
          virtual ~Message() = default;
      };

      class Alert : public Message {
      public:
          std::string kind() const override { return "alert"; }
      };

      void by_value(Message message) { std::cout << message.kind() << '\n'; }
      void by_reference(const Message& message) { std::cout << message.kind() << '\n'; }

      int main() {
          Alert alert;
          by_value(alert);
          by_reference(alert);
      }
    lang: cpp
    options:
      - { text: { en: "base\nalert", zh: "base\nalert" }, correct: true }
      - { text: { en: "alert\nalert", zh: "alert\nalert" }, correct: false }
      - { text: { en: "base\nbase", zh: "base\nbase" }, correct: false }
      - { text: { en: 'The program does not compile.', zh: '程序无法通过编译。' }, correct: false }
    explanation: { en: 'The by-value call slices Alert into a new Message object. The reference still denotes the Alert, so virtual dispatch selects Alert::kind.', zh: '按值调用会把 Alert 切片成新的 Message 对象。引用仍指向 Alert，因此虚分派会选择 Alert::kind。' }
    difficulty: intermediate
    tags: [object-slicing, virtual-dispatch]

  - id: public-base-access
    type: mcq
    prompt: { en: 'What does public inheritance guarantee about accessible base members?', zh: '公有继承对可访问的基类成员有什么影响？' }
    options:
      - { text: { en: 'Public members stay public, protected members stay protected, and private members remain inaccessible to derived members.', zh: 'public 成员保持 public，protected 成员保持 protected，private 成员仍不能由派生类成员直接访问。' }, correct: true }
      - { text: { en: 'Every base member becomes public in the derived class.', zh: '基类的所有成员都会在派生类中变成 public。' }, correct: false }
      - { text: { en: 'Protected members become private, while private members become protected.', zh: 'protected 成员变成 private，而 private 成员变成 protected。' }, correct: false }
      - { text: { en: 'Access changes only at runtime after an upcast.', zh: '只有运行时发生向上转换后，访问级别才会改变。' }, correct: false }
    explanation: { en: 'Public inheritance preserves the access level of public and protected base members. A private base member remains part of the subobject but cannot be named directly by derived members.', zh: '公有继承会保留基类 public 和 protected 成员的访问级别。private 成员仍存在于基类子对象中，但派生类成员不能直接命名它。' }
    difficulty: beginner
    tags: [access-control, public-inheritance]

  - id: spot-nonvirtual-base-destructor
    type: spotbug
    prompt: { en: 'Find the lifetime bug in this generated job hierarchy.', zh: '找出这个生成的任务类层次中的生命周期错误。' }
    code: |
      #include <memory>
      #include <string>
      #include <utility>

      class Job {
      public:
          virtual void run() = 0;
          ~Job() = default;
      };

      class FileJob final : public Job {
      public:
          explicit FileJob(std::string path) : path_(std::move(path)) {}
          void run() override {}
      private:
          std::string path_;
      };

      std::unique_ptr<Job> make_job() {
          return std::make_unique<FileJob>("report.csv");
      }
    lang: cpp
    issues:
      - line: 8
        kind: correctness
        note: { en: 'Job is destroyed through unique_ptr<Job>, but its destructor is not virtual. Deleting the FileJob through that base pointer has undefined behavior.', zh: '对象会通过 unique_ptr<Job> 销毁，但 Job 的析构函数不是虚函数。经该基类指针删除 FileJob 会产生未定义行为。' }
    explanation: { en: 'Make the public destructor virtual because this interface permits polymorphic ownership. A protected non-virtual destructor is suitable only when deletion through Job is forbidden.', zh: '该接口允许多态所有权，因此应把公有析构函数设为虚函数。只有明确禁止通过 Job 删除对象时，才适合使用受保护的非虚析构函数。' }
    difficulty: intermediate
    tags: [virtual-destructor, ownership, undefined-behavior]

  - id: virtual-base-initializer
    type: mcq
    prompt: { en: 'In a virtual-inheritance diamond, which constructor initializes the shared virtual base for a complete object?', zh: '在虚继承菱形中，哪个构造函数负责初始化完整对象共享的虚基类？' }
    options:
      - { text: { en: 'The constructor of the most-derived class', zh: '最派生类的构造函数' }, correct: true }
      - { text: { en: 'Whichever intermediate base appears first alphabetically', zh: '名称按字母排序最靠前的中间基类' }, correct: false }
      - { text: { en: 'Every intermediate base, producing one shared initialization per path', zh: '每个中间基类，各条路径分别执行一次共享初始化' }, correct: false }
      - { text: { en: 'The virtual base always uses only its default constructor', zh: '虚基类始终只能使用默认构造函数' }, correct: false }
    explanation: { en: 'The most-derived constructor initializes each virtual base. Initializers in intermediate classes are ignored for that virtual base unless the intermediate class is itself the complete object.', zh: '每个虚基类都由最派生类构造函数初始化。除非中间类本身就是完整对象，否则其中针对该虚基类的初始化器会被忽略。' }
    difficulty: advanced
    tags: [virtual-inheritance, construction-order]

  - id: review-generated-report-hierarchy
    type: review
    prompt: { en: 'Review this generated report hierarchy against the requested contract.', zh: '根据任务契约审查这个生成的报表类层次。' }
    task: { en: 'Define reports that can be summarized polymorphically, destroyed through an owning base pointer, and inspected without copying the stored values.', zh: '定义可多态生成摘要、可通过拥有型基类指针销毁，并能在不复制所存数据的情况下检查数值的报表。' }
    code: |
      #include <iostream>
      #include <string>
      #include <utility>
      #include <vector>
      class Report {
      public:
          Report(std::string title, std::vector<int> values)
              : title_(std::move(title)), values_(std::move(values)) {}
          std::vector<int> values() const { return values_; }
          virtual std::string summary() const { return title_; }
          ~Report() = default;
      protected:
          std::string title_;
          std::vector<int> values_;
      };
      class SalesReport : public Report {
      public:
          SalesReport(std::string title, std::vector<int> values)
              : Report(std::move(title), std::move(values)) {}
          std::string summary() { return title_ + ": sales"; }
      };
      void print_report(const Report& report) {
          std::cout << report.summary() << '\n';
      }
    lang: cpp
    right: { en: 'The code moves its owned constructor arguments, keeps the data inside the classes, makes summary virtual, and passes Report to print_report by const reference rather than slicing it.', zh: '代码移动了取得所有权的构造参数，把数据保存在类内部，将 summary 设为虚函数，并让 print_report 通过 const 引用接收 Report，避免了切片。' }
    checklist:
      - { en: 'Compare every intended override with the complete base signature.', zh: '把每个预期重写与基类的完整签名逐项比较。' }
      - { en: 'Trace destruction through each owning base pointer.', zh: '沿每个拥有型基类指针跟踪析构过程。' }
      - { en: 'Inspect getters for unnecessary container copies and exposed lifetimes.', zh: '检查 getter 是否产生不必要的容器复制或暴露生命周期。' }
      - { en: 'Check whether derived code can bypass base invariants through protected data.', zh: '检查派生代码能否通过 protected 数据绕过基类不变量。' }
    issues:
      - line: 9
        kind: performance
        note: { en: 'values() copies the complete vector on every inspection. Return a const reference or an appropriate view with a documented lifetime.', zh: '每次检查时 values() 都会复制整个 vector。应返回 const 引用或合适的视图，并说明其生命周期。' }
      - line: 11
        kind: edge-case
        note: { en: 'The public non-virtual destructor makes deletion through an owning Report pointer undefined. This failure appears specifically at the polymorphic destruction boundary.', zh: '公有非虚析构函数会让通过拥有型 Report 指针进行的删除产生未定义行为。这个问题会在多态销毁边界出现。' }
      - line: 13
        kind: readability
        note: { en: 'Protected representation couples every derived class to Report storage. Private data plus protected operations would make the invariant and allowed extension points clearer.', zh: 'protected 表示会让所有派生类都耦合到 Report 的存储。使用 private 数据和受保护操作，可以更清楚地表达不变量与扩展点。' }
      - line: 20
        kind: correctness
        note: { en: 'SalesReport::summary lacks the trailing const, so it does not override Report::summary. Adding override would expose the mismatch at compile time.', zh: 'SalesReport::summary 缺少末尾的 const，因此没有重写 Report::summary。添加 override 后，编译器会直接指出签名不匹配。' }
    explanation: { en: 'Make destruction virtual, preserve the exact const signature with override, and expose observations without copying. Keep representation private unless derived classes truly need a documented storage-level contract.', zh: '应使用虚析构，通过 override 保持完全一致的 const 签名，并避免为观察数据而复制。除非派生类确实需要有文档的存储层契约，否则表示应保持 private。' }
    difficulty: advanced
    tags: [code-review, object-slicing, virtual-destructor, name-hiding]
