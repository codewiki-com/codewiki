topic: cpp/c-memory
items:
  - id: predict-calloc-integers
    type: predict
    prompt: { en: 'What does this C23 program print when calloc succeeds?', zh: '当 calloc 成功时，这段 C23 程序会输出什么？' }
    code: |
      #include <stdio.h>
      #include <stdlib.h>

      int main(void) {
          int *counts = (int *)calloc(3, sizeof *counts);
          if (counts == NULL) {
              return 1;
          }
          counts[1] = 4;
          printf("%d %d %d\n", counts[0], counts[1], counts[2]);
          free(counts);
          return 0;
      }
    lang: c
    options:
      - { text: { en: '0 4 0', zh: '0 4 0' }, correct: true }
      - { text: { en: 'Indeterminate values around 4', zh: '4 两侧是不确定值' }, correct: false }
      - { text: { en: '4 4 4', zh: '4 4 4' }, correct: false }
      - { text: { en: 'The program necessarily fails to compile.', zh: '程序一定无法通过编译。' }, correct: false }
    explanation: { en: 'calloc sets every allocated bit to zero, which represents integer zero; assigning counts[1] changes only the middle element. The allocation is checked before access and released afterward.', zh: 'calloc 把已分配区域的每一位清零，对整数得到 0；给 counts[1] 赋值只改变中间元素。程序先检查分配结果，再访问并释放内存。' }
    difficulty: beginner
    tags: [calloc, initialization, predict-output]

  - id: realloc-failure-state
    type: mcq
    prompt: { en: 'What is guaranteed when realloc(owner, larger_size) returns NULL for a nonzero valid size?', zh: '对有效的非零大小调用 realloc(owner, larger_size) 并返回 NULL 时，哪项保证成立？' }
    options:
      - { text: { en: 'The old allocation remains valid and unchanged.', zh: '旧分配保持有效，内容不变。' }, correct: true }
      - { text: { en: 'The old allocation has already been freed.', zh: '旧分配已经被释放。' }, correct: false }
      - { text: { en: 'The first half of the old allocation remains valid.', zh: '旧分配只有前半部分仍有效。' }, correct: false }
      - { text: { en: 'The caller must free the NULL result before reusing owner.', zh: '调用方必须先释放这个 NULL 结果，才能继续使用 owner。' }, correct: false }
    explanation: { en: 'Allocation failure leaves the old object and its contents intact. Store the result in a temporary pointer so the owning pointer is not lost.', zh: '分配失败不会释放旧对象，也不会改变其内容。应使用临时指针接收结果，避免丢失拥有型指针。' }
    difficulty: intermediate
    tags: [realloc, failure-atomicity, ownership]

  - id: spotbug-allocation-overflow
    title: { en: 'Spot the bug in array-copy allocation', zh: '找出数组复制分配里的 bug' }
    type: spotbug
    prompt: { en: 'Find the size bug in this generated array-copy function.', zh: '找出这个生成的数组复制函数中的大小错误。' }
    code: |
      #include <stddef.h>
      #include <stdlib.h>

      int *copy_readings(const int *source, size_t count) {
          int *copy = (int *)malloc(count * sizeof *copy);
          if (copy == NULL) {
              return NULL;
          }
          for (size_t index = 0; index < count; ++index) {
              copy[index] = source[index];
          }
          return copy;
      }
    lang: c
    issues:
      - line: 5
        kind: security
        note: { en: 'count * sizeof *copy can wrap before malloc, creating a block smaller than count elements while the loop still writes count elements.', zh: 'count * sizeof *copy 可能在调用 malloc 前回绕，得到小于 count 个元素的内存块，而循环仍会写入 count 个元素。' }
    explanation: { en: 'Reject a null source when count is nonzero, define the zero-count policy, and check count > SIZE_MAX / sizeof *copy before multiplication. Allocation success alone does not prove that count elements fit.', zh: 'count 非零时应拒绝空 source，定义零数量策略，并在乘法前检查 count > SIZE_MAX / sizeof *copy。分配成功本身不能证明能容纳 count 个元素。' }
    difficulty: intermediate
    tags: [allocation-size-overflow, bounds, bug-finding]

  - id: free-valid-pointer
    type: mcq
    prompt: { en: 'Which pointer may be passed to free?', zh: '哪种指针可以传给 free？' }
    options:
      - { text: { en: 'The still-valid pointer returned by malloc, or NULL.', zh: 'malloc 返回且仍然有效的指针，或者 NULL。' }, correct: true }
      - { text: { en: 'Any pointer to an element inside a malloc block.', zh: '指向 malloc 内存块中任意元素的指针。' }, correct: false }
      - { text: { en: 'A pointer to an automatic array after its block ends.', zh: '自动数组离开代码块后的指针。' }, correct: false }
      - { text: { en: 'The old pointer saved before a successful realloc.', zh: '成功 realloc 之前保存的旧指针。' }, correct: false }
    explanation: { en: 'free accepts NULL or a still-live allocation result with the required identity. Interior pointers, automatic-object addresses, and pointers invalidated by successful realloc are not valid arguments.', zh: 'free 接受 NULL，或身份匹配且生命周期尚未结束的分配结果。内部指针、自动对象地址和被成功 realloc 失效的指针都不是合法实参。' }
    difficulty: intermediate
    tags: [free, pointer-identity, undefined-behavior]

  - id: review-generated-byte-buffer
    type: review
    title: { en: 'Review a generated byte buffer', zh: '审查生成的字节缓冲区' }
    prompt: { en: 'Review this generated growable buffer against the requested contract.', zh: '根据任务契约审查这个生成的可增长缓冲区。' }
    task: { en: 'Append arbitrary bytes while preserving the complete old buffer on failure, reject invalid input, prevent size overflow, and leave a destroyed buffer in a reusable empty state.', zh: '追加任意字节；失败时保留完整旧缓冲区；拒绝无效输入并防止大小溢出；销毁后留下可复用的空状态。' }
    code: |
      #include <stddef.h>
      #include <stdlib.h>
      #include <string.h>
      typedef struct {
          unsigned char *data;
          size_t length;
          size_t capacity;
      } Buffer;

      int buffer_append(Buffer *buffer, const unsigned char *input, size_t count) {
          size_t needed = buffer->length + count;

          if (needed > buffer->capacity) {
              buffer->capacity = needed * 2;
              buffer->data = (unsigned char *)realloc(buffer->data, buffer->capacity);
          }

          memcpy(buffer->data + buffer->length, input, count);
          buffer->length = needed;
          return 1;
      }

      void buffer_destroy(Buffer *buffer) {
          free(buffer->data);
      }
    lang: c
    right: { en: 'The code keeps data, logical length, and capacity together, reallocates only when the current capacity is insufficient, copies bytes without text assumptions, and provides a paired destroy operation.', zh: '代码把数据、逻辑长度和容量保存在一起，只在当前容量不足时重新分配，按字节复制而不假设文本格式，并提供了配对销毁操作。' }
    checklist:
      - { en: 'Validate pointer preconditions and define the zero-count behavior before dereferencing.', zh: '在解引用前验证指针前置条件，并定义零数量行为。' }
      - { en: 'Prove every size_t addition and multiplication before allocating or copying.', zh: '在分配或复制前证明每次 size_t 加法与乘法不会溢出。' }
      - { en: 'Commit pointer, capacity, and length only after realloc succeeds.', zh: '只在 realloc 成功后提交指针、容量和长度。' }
      - { en: 'Test each allocation failure and verify destruction restores one documented empty state.', zh: '测试每个分配失败点，并验证销毁操作恢复到一种有文档的空状态。' }
    issues:
      - line: 10
        kind: edge-case
        note: { en: 'The function dereferences buffer without rejecting NULL and passes input to memcpy without defining whether NULL is accepted when count is zero.', zh: '函数没有拒绝 NULL buffer 就进行解引用，也没有定义 count 为 0 时是否接受传给 memcpy 的 NULL input。' }
      - line: 11
        lines: 4
        kind: security
        note: { en: 'Both length + count and needed * 2 can wrap size_t, producing an undersized capacity followed by an out-of-bounds copy.', zh: 'length + count 与 needed * 2 都可能让 size_t 回绕，产生过小容量，随后发生越界复制。' }
      - line: 14
        lines: 2
        kind: correctness
        note: { en: 'Capacity is committed before allocation, and direct assignment loses the old pointer when realloc fails; the unchecked NULL is then used by memcpy.', zh: '代码在分配前提交容量；realloc 失败时直接赋值会丢失旧指针，随后 memcpy 还会使用未经检查的 NULL。' }
      - line: 23
        lines: 3
        kind: readability
        note: { en: 'Destroying leaves a dangling data pointer and stale length and capacity, so the documented empty state is neither visible nor safely reusable.', zh: '销毁后留下悬空 data 指针以及过期的长度和容量，因此既看不出规定的空状态，也无法安全复用。' }
    explanation: { en: 'Validate arguments, check the addition and growth calculation, and keep realloc in a temporary pointer. Commit all fields together after success, and reset every field during destruction.', zh: '应验证实参，检查加法与增长计算，并用临时指针接收 realloc。成功后一起提交所有字段，销毁时重置每个字段。' }
    difficulty: advanced
    tags: [code-review, realloc, size-overflow, cleanup]
