topic: cpp/namespaces
items:
  - id: predict-adl-candidate
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      #include <iostream>

      namespace courier {
      struct Parcel {};
      void dispatch(Parcel) { std::cout << "parcel\n"; }
      }

      void dispatch(int) { std::cout << "integer\n"; }

      int main() {
          courier::Parcel parcel;
          dispatch(parcel);
          dispatch(0);
      }
    lang: cpp
    options:
      - { text: { en: 'parcel, then integer', zh: '先输出 parcel，再输出 integer' }, correct: true }
      - { text: { en: 'integer, then integer', zh: '两次都输出 integer' }, correct: false }
      - { text: { en: 'The first call is an unresolved name.', zh: '第一次调用找不到名称。' }, correct: false }
      - { text: { en: 'The first call is ambiguous.', zh: '第一次调用存在歧义。' }, correct: false }
    explanation: { en: 'ADL adds courier::dispatch for the Parcel argument. The int argument has no associated namespace, so ordinary lookup selects global dispatch(int).', zh: 'Parcel 实参让 ADL 加入 courier::dispatch。int 实参没有关联命名空间，因此普通查找选择全局 dispatch(int)。' }
    difficulty: intermediate
    tags: [adl, name-lookup, overload-resolution]
    tests: 'g++ -std=c++23 predict-adl-candidate.cpp && ./a.out'

  - id: using-declaration-scope
    type: mcq
    prompt: { en: 'Which statement best describes using metrics::distance; inside a function?', zh: '在函数中写 using metrics::distance;，下列哪项描述最准确？' }
    options:
      - { text: { en: 'It introduces the selected name or overload set into that scope.', zh: '它把选定名称或重载组引入该作用域。' }, correct: true }
      - { text: { en: 'It copies every member of metrics into the function.', zh: '它把 metrics 的所有成员复制进函数。' }, correct: false }
      - { text: { en: 'It creates a new namespace named distance.', zh: '它会创建名为 distance 的新命名空间。' }, correct: false }
      - { text: { en: 'It changes the linkage of metrics::distance to internal.', zh: '它会把 metrics::distance 改成内部链接。' }, correct: false }
    explanation: { en: 'A using-declaration names specific declarations for lookup in its scope. It neither imports an entire namespace nor changes identity or linkage.', zh: 'using 声明为当前作用域的查找引入指定声明，不会导入整个命名空间，也不会改变实体身份或链接。' }
    difficulty: beginner
    tags: [using-declaration, scope]

  - id: spot-definition-namespace
    title: { en: 'Spot the bug in the render definition', zh: '找出渲染函数定义里的 bug' }
    type: spotbug
    prompt: { en: 'The header declares reports::render, but clients get an undefined reference. Find the source-file bug.', zh: '头文件声明了 reports::render，但调用方出现未定义引用。请找出源文件错误。' }
    code: |
      #include <string>

      namespace reports {
      std::string render(int rows);
      }

      std::string render(int rows) {
          return "rows=" + std::to_string(rows);
      }
    lang: cpp
    issues:
      - line: 7
        kind: correctness
        note: { en: 'This defines global ::render, not reports::render. The declared function still has no definition when a client links.', zh: '这里定义的是全局 ::render，而不是 reports::render；调用方链接时，原声明仍然没有定义。' }
    explanation: { en: 'Define std::string reports::render(int rows) or put the definition inside namespace reports, then link a caller in the test.', zh: '应定义 std::string reports::render(int rows)，或把定义放进 namespace reports，并在测试中链接一个真实调用方。' }
    difficulty: intermediate
    tags: [qualified-name, linkage, definitions]

  - id: unnamed-namespace-header
    type: mcq
    prompt: { en: 'What happens to an unnamed-namespace variable defined in a header included by three translation units?', zh: '头文件中的未命名命名空间变量被三个翻译单元包含后，会发生什么？' }
    options:
      - { text: { en: 'Each translation unit gets its own internal-linkage entity.', zh: '每个翻译单元各自得到一个内部链接实体。' }, correct: true }
      - { text: { en: 'The linker automatically merges all three into one object.', zh: '链接器会自动把三份合成一个对象。' }, correct: false }
      - { text: { en: 'The variable becomes a member of the global namespace with external linkage.', zh: '该变量会成为具有外部链接的全局命名空间成员。' }, correct: false }
      - { text: { en: 'The program is ill-formed solely because the header was included more than once.', zh: '仅因头文件被多次包含，程序就不符合语法。' }, correct: false }
    explanation: { en: 'An unnamed namespace is unique within one translation unit, not across the whole program. Header inclusion therefore produces independent entities.', zh: '未命名命名空间只在单个翻译单元内唯一，并非全程序唯一，因此头文件包含会产生彼此独立的实体。' }
    difficulty: intermediate
    tags: [unnamed-namespace, translation-unit, internal-linkage]

  - id: review-generated-header-helper
    title: { en: 'Review generated header label helper', zh: '审查生成的头文件标签函数' }
    type: review
    prompt: { en: 'Review this generated header-only helper against the requested contract.', zh: '根据任务契约审查这个生成的头文件辅助工具。' }
    task: { en: 'Provide acme::text::label in a header, maintain one program-wide call count, avoid namespace pollution, and construct labels efficiently.', zh: '在头文件中提供 acme::text::label，维护全程序唯一的调用计数，避免命名空间污染，并高效构造标签。' }
    code: |
      #pragma once

      #include <string>
      #include <string_view>

      using namespace std;

      namespace acme::text {
      namespace {
      int calls = 0;
      }

      string label(string_view route) {
          ++calls;
          return "[" + string(route) + "]";
      }

      int call_count() {
          return calls;
      }
      }
    lang: cpp
    right: { en: 'The code uses a domain-owned nested namespace, accepts non-owning text through string_view, and keeps the counter out of the public global namespace.', zh: '代码使用领域所属的嵌套命名空间，通过 string_view 接收非拥有文本，并且没有把计数器直接放进公共全局命名空间。' }
    checklist:
      - { en: 'Inspect headers for using-directives and leaked global names.', zh: '检查头文件中的 using 指令与泄漏到全局的名称。' }
      - { en: 'State whether each variable is per block, per translation unit, or program-wide.', zh: '说明每个变量属于代码块、翻译单元还是整个程序。' }
      - { en: 'Check whether every header definition is legal in several translation units.', zh: '检查每个头文件定义能否合法出现在多个翻译单元中。' }
      - { en: 'Count allocations when constructing a result from several string parts.', zh: '从多个字符串片段构造结果时，检查可能的分配次数。' }
    issues:
      - line: 6
        kind: readability
        note: { en: 'The using-directive leaks every std name into includers after this line and hides ownership in the public header.', zh: '这个 using 指令让后续包含代码接触所有 std 名称，也掩盖了公共头文件中的名称归属。' }
      - line: 9
        kind: edge-case
        note: { en: 'The unnamed namespace creates a separate calls object in every translation unit, violating the program-wide counter requirement.', zh: '未命名命名空间会让每个翻译单元各有一份 calls，违反全程序唯一计数的要求。' }
      - line: 13
        lines: 8
        kind: correctness
        note: { en: 'Both non-inline function definitions appear in every including translation unit, so a multi-file program violates the one-definition rule.', zh: '两个非 inline 函数定义会出现在每个包含它的翻译单元中，多文件程序因此违反单一定义规则。' }
      - line: 15
        kind: performance
        note: { en: 'Chained string addition can allocate intermediate strings. Reserve route.size() + 2 in one result and append the three parts.', zh: '链式字符串加法可能分配中间字符串；应在一个结果中预留 route.size() + 2，再依次追加三个片段。' }
    explanation: { en: 'Use fully qualified std names, an inline function and inline counter when header-only program-wide state is truly required, and build the result in one reserved string. A source-file implementation is often simpler.', zh: '应使用完整的 std 限定名；确实需要头文件中的全程序状态时，使用 inline 函数与 inline 计数器，并在一个预留容量的字符串中构造结果。放进源文件通常更简单。' }
    difficulty: advanced
    tags: [code-review, headers, linkage, using-directive]
    tests: 'Compile and link two source files that include the header, then assert one shared call count.'
