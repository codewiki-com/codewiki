topic: backend/wsgi-asgi
items:
  - id: predict-wsgi-call
    type: predict
    prompt: { en: 'What does this WSGI driver print?', zh: '这个 WSGI 驱动器会输出什么？' }
    code: |
      def application(environ, start_response):
          body = environ["PATH_INFO"].encode()
          start_response("200 OK", [("Content-Length", str(len(body)))])
          return [body]

      captured = []

      def start_response(status, headers):
          captured.append(status)

      result = application({"PATH_INFO": "/health"}, start_response)
      print(captured[0], b"".join(result).decode())
    lang: python
    options:
      - { text: { en: '200 OK /health', zh: '200 OK /health' }, correct: true }
      - { text: { en: '200 /health', zh: '200 /health' }, correct: false }
      - { text: { en: "200 OK b'/health'", zh: "200 OK b'/health'" }, correct: false }
      - { text: { en: 'It raises because start_response must be awaited', zh: '程序抛出异常，因为必须 await start_response' }, correct: false }
    explanation: { en: 'A WSGI application calls start_response synchronously and returns an iterable of bytes. The driver joins those bytes and decodes them before printing.', zh: 'WSGI 应用同步调用 start_response，并返回产生字节的可迭代对象。驱动器拼接字节并解码后再输出。' }
    difficulty: beginner
    tags: [wsgi, callable, predict-output]

  - id: asgi-http-response-order
    type: mcq
    prompt: { en: 'Which sequence completes a two-chunk ASGI HTTP response correctly?', zh: '哪组事件顺序能正确完成包含两个分片的 ASGI HTTP 响应？' }
    options:
      - { text: { en: 'One http.response.start, then body with more_body true, then body with more_body false', zh: '一次 http.response.start，然后是 more_body 为 true 的 body，最后是 more_body 为 false 的 body' }, correct: true }
      - { text: { en: 'Two http.response.start events, one before each body', zh: '两个 http.response.start，每个 body 前发送一次' }, correct: false }
      - { text: { en: 'A body event first, then http.response.start', zh: '先发送 body，再发送 http.response.start' }, correct: false }
      - { text: { en: 'One body with more_body true and no later event', zh: '只发送一个 more_body 为 true 的 body，之后不再发送事件' }, correct: false }
    explanation: { en: 'The response starts once. A true more_body value promises another body event, and the final false or omitted value completes the response.', zh: '响应只能开始一次。more_body 为 true 表示后面还有 body 事件，最后一次为 false 或省略时才结束响应。' }
    difficulty: beginner
    tags: [asgi, http, event-sequence]

  - id: spotbug-asgi-request-stream
    type: spotbug
    prompt: { en: 'This raw ASGI application should echo the complete request body. Find the two protocol bugs.', zh: '这个原始 ASGI 应用应回显完整请求体。找出两个协议错误。' }
    code: |
      async def application(scope, receive, send):
          message = await receive()
          body = message.get("body", b"")

          await send({
              "type": "http.response.start",
              "status": 200,
              "headers": {"content-type": "text/plain"},
          })
          await send({
              "type": "http.response.body",
              "body": body,
          })
    lang: python
    issues:
      - line: 2
        lines: 2
        kind: edge-case
        note: { en: 'One receive call can capture only the first request chunk; the code ignores more_body and truncates a fragmented request.', zh: '一次 receive 只能取得首个请求分片；代码忽略 more_body，会截断分片请求。' }
      - line: 8
        kind: correctness
        note: { en: 'ASGI headers must be an iterable of byte pairs, not a string-to-string dictionary.', zh: 'ASGI headers 必须是字节二元组的可迭代对象，不能使用字符串字典。' }
    explanation: { en: 'Loop over http.request events until more_body is false, and send headers as byte pairs. Production code also needs a cumulative body-size limit and disconnect handling.', zh: '应循环读取 http.request，直到 more_body 为 false，并用字节二元组发送响应头。生产代码还要限制累计请求体大小并处理断开连接。' }
    difficulty: intermediate
    tags: [asgi, request-body, headers, code-review]

  - id: wsgi-adapter-capability
    type: mcq
    prompt: { en: 'What does mounting a WSGI application through an ASGI adapter actually provide?', zh: '通过 ASGI 适配器挂载 WSGI 应用，实际得到的是什么？' }
    options:
      - { text: { en: 'HTTP compatibility while the synchronous callable runs in a thread pool', zh: '在线程池运行同步 callable，同时保留 HTTP 兼容性' }, correct: true }
      - { text: { en: 'Automatic WebSocket support for every WSGI route', zh: '为每个 WSGI 路由自动增加 WebSocket 支持' }, correct: false }
      - { text: { en: 'Conversion of every blocking library into native async I/O', zh: '把所有阻塞库转换成原生异步 I/O' }, correct: false }
      - { text: { en: 'A guarantee that HTTP/2 is enabled at the reverse proxy', zh: '保证反向代理已经启用 HTTP/2' }, correct: false }
    explanation: { en: 'The adapter maps the shared HTTP subset and schedules synchronous WSGI work away from the event loop. It cannot add protocol semantics the WSGI application does not expose.', zh: '适配器映射两者共有的 HTTP 子集，并把同步 WSGI 工作移出事件循环。它不能添加 WSGI 应用没有暴露的协议语义。' }
    difficulty: intermediate
    tags: [wsgi, asgi, adapter, compatibility]

  - id: review-generated-request-id-middleware
    type: review
    title: { en: 'Review generated ASGI middleware', zh: '审查生成的 ASGI 中间件' }
    prompt: { en: 'Review this generated request-ID middleware against the task and identify five distinct risks.', zh: '根据任务要求审查这个生成的请求 ID 中间件，并找出五类不同风险。' }
    task: { en: 'Add one server-generated x-request-id header to every HTTP response without consuming the request, blocking the loop, losing repeated headers, or changing non-HTTP scopes.', zh: '为每个 HTTP 响应增加一个服务端生成的 x-request-id，同时不得消费请求、阻塞事件循环、丢失重复响应头或改变非 HTTP scope。' }
    right: { en: 'The generated code uses the standard ASGI middleware call shape, wraps send instead of buffering the response body, and limits response changes to response-start messages.', zh: '生成代码使用了标准 ASGI 中间件调用形式，通过包装 send 而不是缓冲响应体，并把响应修改限制在 response-start 消息上。' }
    code: |
      import time

      class RequestIdMiddleware:
          def __init__(self, app):
              self.app = app

          async def __call__(self, scope, receive, send):
              if scope["type"] != "http":
                  return

              first = await receive()
              request_body = first.get("body", b"")
              time.sleep(0.05)
              request_id = scope["headers"][0][1].decode()

              async def send_wrapper(message):
                  if message["type"] == "http.response.start":
                      message["headers"] = dict(message.get("headers", []))
                      message["headers"][b"x-request-id"] = request_id.encode()
                  await send(message)

              await self.app(scope, receive, send_wrapper)
    lang: python
    issues:
      - line: 9
        kind: edge-case
        note: { en: 'The middleware returns without calling the inner app for WebSocket and lifespan scopes, so those protocols hang or disappear.', zh: '中间件遇到 WebSocket 或 lifespan scope 时没有调用内层应用，相关协议会挂起或直接消失。' }
      - line: 11
        lines: 2
        kind: correctness
        note: { en: 'It consumes the first request event and never replays it, so the inner application sees a missing or truncated body.', zh: '它消费首个请求事件却没有回放，内层应用会看到缺失或截断的请求体。' }
      - line: 13
        kind: performance
        note: { en: 'time.sleep blocks the event-loop thread for every request.', zh: 'time.sleep 会在每个请求中阻塞事件循环线程。' }
      - line: 14
        kind: security
        note: { en: 'The first arbitrary client header is reflected as the request ID, which can disclose an Authorization or Cookie value in a response.', zh: '代码把任意第一个客户端请求头反射为请求 ID，可能在响应中泄露 Authorization 或 Cookie 值。' }
      - line: 18
        lines: 2
        kind: readability
        note: { en: 'Replacing the protocol-native pair list with a mutable dictionary hides duplicate-header behavior and makes the outbound message shape invalid.', zh: '把协议原生的二元组列表换成可变字典，既掩盖重复头行为，也让出站消息结构无效。' }
    checklist:
      - { en: 'Exercise HTTP, WebSocket, and lifespan scopes and assert that unhandled scopes pass through.', zh: '驱动 HTTP、WebSocket 与 lifespan scope，并断言未处理的 scope 会原样透传。' }
      - { en: 'Send a request body in at least two events and verify that the inner app receives both.', zh: '用至少两个事件发送请求体，并验证内层应用能收到全部分片。' }
      - { en: 'Return two Set-Cookie headers and assert that both survive with one generated request ID.', zh: '返回两个 Set-Cookie，并断言它们与一个服务端生成的请求 ID 都得到保留。' }
      - { en: 'Scan reachable calls for blocking work and test cancellation plus disconnect cleanup.', zh: '检查可达调用中的阻塞工作，并测试取消与断开连接后的清理。' }
    explanation: { en: 'A correct wrapper delegates non-HTTP scopes, leaves receive untouched, generates or validates the ID without blocking, copies the response-start message, appends one byte-pair header, and forwards every message.', zh: '正确包装器应透传非 HTTP scope，不改动 receive，以非阻塞方式生成或校验 ID，复制 response-start 消息，追加一个字节二元组响应头，并转发每条消息。' }
    difficulty: advanced
    tags: [asgi, middleware, code-review, request-id]
