topic: backend/flask
items:
  - id: predict-route-converters
    type: predict
    prompt: { en: 'What status-code list does this program print?', zh: '这段程序会输出哪个状态码列表？' }
    code: |
      from flask import Flask

      app = Flask(__name__)

      @app.get("/orders/<int:order_id>")
      def order(order_id):
          return {"id": order_id}

      client = app.test_client()
      print([
          client.get("/orders/7").status_code,
          client.get("/orders/seven").status_code,
          client.post("/orders/7").status_code,
      ])
    lang: python
    options:
      - { text: { en: '[200, 400, 404]', zh: '[200, 400, 404]' }, correct: false }
      - { text: { en: '[200, 404, 405]', zh: '[200, 404, 405]' }, correct: true }
      - { text: { en: '[200, 422, 405]', zh: '[200, 422, 405]' }, correct: false }
      - { text: { en: '[200, 404, 404]', zh: '[200, 404, 404]' }, correct: false }
    explanation: { en: 'The integer path matches GET, the noninteger segment fails routing with 404, and POST matches the path but not the allowed method, producing 405.', zh: '整数路径能匹配 GET；非整数片段无法匹配路由，得到 404；POST 能匹配路径但不符合允许的方法，得到 405。' }
    difficulty: beginner
    tags: [routing, converter, http-status]

  - id: blueprint-registration
    type: mcq
    prompt: { en: 'What does a Flask blueprint do before it is registered?', zh: 'Flask 蓝图注册前会做什么？' }
    options:
      - { text: { en: 'It records operations such as routes but cannot handle requests on its own.', zh: '它记录路由等操作，但不能独立处理请求。' }, correct: true }
      - { text: { en: 'It starts an independent WSGI application and worker pool.', zh: '它会启动独立的 WSGI 应用与工作进程池。' }, correct: false }
      - { text: { en: 'It copies every application configuration value at import time.', zh: '它会在导入时复制全部应用配置。' }, correct: false }
    explanation: { en: 'A blueprint is a deferred set of setup operations. register_blueprint applies them to a concrete Flask application and URL map.', zh: '蓝图是一组延迟执行的设置操作。`register_blueprint` 会把这些操作应用到具体 Flask 应用及其 URL 映射。' }
    difficulty: beginner
    tags: [blueprint, application-factory]

  - id: context-lifetime
    type: mcq
    prompt: { en: 'What should a view pass to a durable background job that needs the current request ID?', zh: '持久后台任务需要当前请求 ID 时，视图应该传递什么？' }
    options:
      - { text: { en: 'A copied string value read while the request context is active', zh: '在请求上下文有效时读取并复制出的字符串值' }, correct: true }
      - { text: { en: 'The imported request proxy itself', zh: '导入的 `request` 代理对象本身' }, correct: false }
      - { text: { en: 'The complete g object so the worker can discover later values', zh: '完整的 `g` 对象，以便工作进程发现之后出现的值' }, correct: false }
    explanation: { en: 'Context-local proxies resolve only in an appropriate active context. A durable job should receive explicit serializable data whose ownership outlives the request.', zh: '上下文局部代理只能在合适的有效上下文中解析。持久任务应接收所有权可超越请求生命周期的显式可序列化数据。' }
    difficulty: intermediate
    tags: [request-context, background-job]

  - id: spot-background-request-proxy
    type: spotbug
    prompt: { en: 'Find the lifecycle bugs in this generated export endpoint.', zh: '找出这个生成的导出端点中的生命周期错误。' }
    code: |
      from threading import Thread
      from flask import Flask, request

      app = Flask(__name__)

      def build_export(output_format):
          print(f"building {output_format}")

      @app.post("/exports")
      def start_export():
          thread = Thread(
              target=lambda: build_export(request.args["format"])
          )
          thread.start()
          return {"status": "queued"}, 202
    lang: python
    issues:
      - line: 12
        lines: 2
        kind: correctness
        note: { en: 'The new thread resolves request after the view may have returned, so the request proxy can raise “Working outside of request context.”', zh: '新线程可能在视图返回后才解析 `request`，因此该代理可能抛出“Working outside of request context.”。' }
      - line: 14
        kind: performance
        note: { en: 'Starting an unbounded unmanaged thread per request provides no admission control, durable retry, shutdown coordination, or result state.', zh: '每个请求都启动一个无界且不受管理的线程，没有准入控制、持久重试、关闭协调或结果状态。' }
    explanation: { en: 'Read and validate the format inside the request, then submit that plain value to a bounded durable job system. The worker should not depend on Flask request proxies.', zh: '应在请求内读取并验证格式，再把这个普通值提交给有界的持久任务系统。工作进程不应依赖 Flask 请求代理。' }
    difficulty: intermediate
    tags: [request-context, thread, background-job]

  - id: review-generated-ticket-endpoint
    type: review
    prompt: { en: 'Review this generated ticket-creation endpoint before deployment.', zh: '部署前审查这个生成的工单创建端点。' }
    task: { en: 'Accept an authenticated user’s JSON object with a 1–120 character title, persist one ticket, and return only public fields with status 201.', zh: '接收已认证用户的 JSON 对象，其中标题长度为 1–120 个字符；持久化一条工单，并以 201 只返回公开字段。' }
    code: |
      from flask import Flask, request

      app = Flask(__name__)
      tickets = []


      @app.post("/tickets")
      def create_ticket():
          data = request.get_json()
          user_id = request.headers.get("X-User-ID")
          title = data["title"]
          ticket = {
              "id": len(tickets) + 1,
              "user_id": user_id,
              "title": title,
              "internal_note": data.get("internal_note"),
          }
          tickets.append(ticket)
          return ticket
    lang: python
    right: { en: 'The code uses a method-specific route, keeps ticket construction in one visible place, appends before responding, and returns a JSON-convertible object.', zh: '代码使用了限定方法的路由，把工单构造集中在一个可见位置，先追加数据再响应，并返回可转换为 JSON 的对象。' }
    checklist:
      - { en: 'Send wrong media types, malformed JSON, nonobject JSON, missing fields, booleans, and boundary-length titles.', zh: '发送错误媒体类型、畸形 JSON、非对象 JSON、缺失字段、布尔值和边界长度标题。' }
      - { en: 'Prove authentication establishes the user identity without trusting caller-selected identity headers.', zh: '证明认证过程建立了用户身份，没有信任调用方可选的身份请求头。' }
      - { en: 'Run concurrent creates and verify durable unique IDs, atomic writes, and bounded storage behavior.', zh: '并发创建工单，验证持久唯一 ID、原子写入与有界存储行为。' }
      - { en: 'Assert status 201, the complete public response shape, and the absence of internal fields.', zh: '断言状态码为 201、公开响应结构完整，而且不包含内部字段。' }
    issues:
      - line: 4
        kind: performance
        note: { en: 'The process-global list grows without a bound and is neither durable nor shared across production workers.', zh: '进程全局列表会无界增长，而且既不持久，也不在生产工作进程之间共享。' }
      - line: 9
        lines: 3
        kind: edge-case
        note: { en: 'The endpoint assumes a JSON object and valid title, so wrong media types, malformed or nonobject JSON, missing fields, and invalid lengths do not follow a defined error contract.', zh: '端点假定请求是 JSON 对象且标题有效，因此错误媒体类型、畸形或非对象 JSON、缺失字段和错误长度都没有明确错误契约。' }
      - line: 10
        kind: security
        note: { en: 'The caller controls X-User-ID, so this value is not an authenticated identity and allows creating tickets for another user.', zh: '调用方可以控制 `X-User-ID`，所以该值不是经过认证的身份，并允许为其他用户创建工单。' }
      - line: 12
        lines: 8
        kind: correctness
        note: { en: 'The response exposes internal_note and returns the default 200 instead of the required public projection with status 201.', zh: '响应暴露了 `internal_note`，并返回默认 200，而不是要求的公开字段投影与 201。' }
    explanation: { en: 'Move identity to the authentication layer, validate the complete transport shape, write through a durable repository with database-generated identity, and construct an explicit public response with status 201.', zh: '应由认证层提供身份，验证完整传输结构，通过带数据库生成标识的持久存储库写入，并显式构造公开响应与 201 状态码。' }
    difficulty: advanced
    tags: [code-review, validation, authentication, response-contract]
