topic: backend/getting-started
items:
  - id: predict-method-path-route
    type: predict
    prompt: { en: 'What does this router print for the request?', zh: '这个路由器会为该请求输出什么？' }
    code: |
      function route(method, path) {
        if (method === "GET" && path === "/tasks") return 200;
        if (method === "POST" && path === "/tasks") return 201;
        return 404;
      }

      console.log(route("POST", "/tasks"));
    lang: javascript
    options:
      - { text: { en: '200', zh: '200' }, correct: false }
      - { text: { en: '201', zh: '201' }, correct: true }
      - { text: { en: '404', zh: '404' }, correct: false }
      - { text: { en: 'The function throws.', zh: '函数会抛出异常。' }, correct: false }
    explanation: { en: 'Both the method and path match the creation branch, so the function returns 201.', zh: '方法与路径都匹配创建分支，因此函数返回 201。' }
    difficulty: beginner
    tags: [routing, http-method, predict-output]

  - id: created-task-contract
    type: mcq
    prompt: { en: 'Which response best represents a task that was successfully created at /tasks/t-9?', zh: '任务已在 /tasks/t-9 成功创建，哪项响应最准确？' }
    options:
      - { text: { en: '201 Created with Location: /tasks/t-9', zh: '201 Created，并带有 Location: /tasks/t-9' }, correct: true }
      - { text: { en: '200 OK with { success: true } only', zh: '200 OK，响应体只有 { success: true }' }, correct: false }
      - { text: { en: '204 No Content with no resource address', zh: '204 No Content，不提供资源地址' }, correct: false }
    explanation: { en: '201 states that the request created a resource, while Location gives the client its address.', zh: '201 表明请求创建了资源，Location 则把资源地址交给客户端。' }
    difficulty: beginner
    tags: [status-code, location, api-contract]

  - id: spot-shared-request-principal
    type: spotbug
    prompt: { en: 'Find the concurrency bug in this generated request handler.', zh: '找出这段生成的请求处理器中的并发错误。' }
    code: |
      let currentPrincipal;

      async function handle(request) {
        currentPrincipal = await authenticate(request);
        await loadDashboard();
        return { userId: currentPrincipal.id };
      }
    lang: javascript
    issues:
      - line: 1
        lines: 6
        kind: correctness
        note: { en: 'The mutable module variable is shared by concurrent requests. Another request can replace the principal while the first handler is awaiting the dashboard.', zh: '可变模块变量由并发请求共享。第一个处理器等待仪表盘时，另一个请求可能替换当前主体。' }
    explanation: { en: 'Keep the principal in a request-scoped value and pass it to downstream functions. Authentication state must never use a process-global mutable slot.', zh: '应把主体保存在请求作用域值中，并显式传给下游函数。认证状态绝不能放进进程级可变槽位。' }
    difficulty: intermediate
    tags: [request-context, concurrency, shared-state]

  - id: durable-business-state
    type: mcq
    prompt: { en: 'Why is a module-level array unsuitable as the only task store in a deployed backend?', zh: '为什么部署后的后端不能只用模块级数组保存任务？' }
    options:
      - { text: { en: 'Its state is lost on restart and is not shared across worker processes.', zh: '它会在重启时丢失，而且多个工作进程不会共享这份状态。' }, correct: true }
      - { text: { en: 'JavaScript arrays cannot contain objects.', zh: 'JavaScript 数组不能包含对象。' }, correct: false }
      - { text: { en: 'HTTP forbids servers from using memory.', zh: 'HTTP 禁止服务器使用内存。' }, correct: false }
    explanation: { en: 'Memory is fine for request-local data and rebuildable caches, but durable business records need storage with persistence and concurrency guarantees.', zh: '内存适合请求局部数据和可重建缓存；持久业务记录需要能保证持久性与并发正确性的存储。' }
    difficulty: beginner
    tags: [persistence, process, restart]

  - id: review-generated-create-task
    type: review
    prompt: { en: 'Review this generated task endpoint before it is exposed to clients.', zh: '在这段生成的任务端点对客户端开放前，对它进行审查。' }
    task: { en: 'Create a task for the authenticated owner, accept a non-empty title of at most 80 characters, remain correct under retries, and return 201 with Location after durable creation and audit recording.', zh: '为已认证所有者创建任务，接受长度不超过 80 的非空标题，在重试时保持正确，并在持久创建和记录审计信息后返回带 Location 的 201 响应。' }
    code: |
      async function createTask(request, db, audit) {
        const body = await request.json();
        const ownerId = body.ownerId;
        const owner = (await db.users.list()).find((user) => user.id === ownerId);
        if (!owner) return json(404, { error: "owner_not_found" });

        const task = {
          id: crypto.randomUUID(),
          ownerId,
          title: String(body.title).trim(),
          completed: false,
        };

        const duplicate = await db.tasks.findByTitle(task.title);
        if (duplicate) return json(409, { error: "duplicate" });
        await db.tasks.insert(task);
        await audit.publish("task.created", task);
        return json(200, task);
      }
    lang: javascript
    right: { en: 'The code uses a stable task shape, distinguishes a missing owner from a duplicate, assigns an addressable ID, and publishes the audit event only after attempting the insert.', zh: '代码使用稳定的任务结构，区分所有者不存在与任务重复，为资源分配可寻址 ID，并在尝试插入后才发布审计事件。' }
    checklist:
      - { en: 'Derive owner identity from the authenticated principal and test cross-user access.', zh: '从已认证主体取得所有者身份，并测试跨用户访问。' }
      - { en: 'Test missing, non-string, blank, boundary-length, and oversized titles.', zh: '测试缺失、非字符串、空白、临界长度和超长标题。' }
      - { en: 'Run concurrent duplicate requests and retry one caller-stable idempotency key after a simulated lost response.', zh: '并发发送重复请求，并在模拟响应丢失后使用同一个调用方稳定幂等键重试。' }
      - { en: 'Inject failure between insert, audit recording, and response, then verify the durable outcome and HTTP contract.', zh: '在插入、审计记录与响应之间注入故障，再核对持久结果和 HTTP 契约。' }
    issues:
      - line: 3
        kind: security
        note: { en: 'The caller chooses ownerId in the request body, so one authenticated user can create a task for another unless an unseen layer prevents it.', zh: '调用方可以在请求体中选择 ownerId；除非未展示的层另行阻止，否则一个已认证用户可以替另一个用户创建任务。' }
      - line: 4
        kind: performance
        note: { en: 'Loading every user and scanning in application memory makes one lookup grow with the complete user table; query the indexed identifier instead.', zh: '加载全部用户再在应用内扫描，会让一次查找随整张用户表增长；应按有索引的标识查询。' }
      - line: 10
        kind: edge-case
        note: { en: 'String coercion accepts missing and non-string values, while trim alone does not enforce the required non-empty and 80-character contract.', zh: 'String 强制转换会接受缺失值和非字符串值，而只调用 trim 也没有执行非空与 80 字符限制。' }
      - line: 14
        lines: 5
        kind: correctness
        note: { en: 'The duplicate check races the insert, insert and audit are not one recoverable unit, no caller-stable key handles unknown outcomes, and the success response violates the required 201 with Location contract.', zh: '重复检查会与插入发生竞态，插入与审计不属于同一个可恢复单元，没有调用方稳定键处理结果未知，而且成功响应违反带 Location 的 201 契约。' }
    explanation: { en: 'Use authenticated identity, strict validation, an indexed lookup, and a database uniqueness constraint. Save the task, idempotency result, and outbox or audit record atomically, then return the contracted 201 response with Location.', zh: '应使用已认证身份、严格验证、有索引的查询和数据库唯一约束。原子保存任务、幂等结果与 outbox 或审计记录，再返回契约规定的带 Location 的 201 响应。' }
    difficulty: intermediate
    tags: [code-review, authorization, validation, idempotency, transaction]
