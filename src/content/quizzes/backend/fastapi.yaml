topic: backend/fastapi
items:
  - id: predict-parameter-sources
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      from fastapi import FastAPI
      from fastapi.testclient import TestClient

      app = FastAPI()

      @app.get("/items/{item_id}")
      def read_item(item_id: int, active: bool = False):
          return {"item_id": item_id, "active": active}

      response = TestClient(app).get("/items/9?active=true")
      print(response.status_code, response.json())
    lang: python
    options:
      - { text: { en: "200 {'item_id': 9, 'active': True}", zh: "200 {'item_id': 9, 'active': True}" }, correct: true }
      - { text: { en: "200 {'item_id': '9', 'active': 'true'}", zh: "200 {'item_id': '9', 'active': 'true'}" }, correct: false }
      - { text: { en: '422 with two validation errors', zh: '422，并包含两个验证错误' }, correct: false }
      - { text: { en: 'The handler raises TypeError', zh: '处理函数抛出 TypeError' }, correct: false }
    explanation: { en: 'The route template supplies item_id and the query string supplies active. FastAPI converts both strings according to their annotations before calling the handler.', zh: '路由模板提供 item_id，查询字符串提供 active。FastAPI 会先按类型注解转换两个字符串，再调用处理函数。' }
    difficulty: beginner
    tags: [fastapi, parameters, predict-output]

  - id: optional-versus-required
    type: mcq
    prompt: { en: 'Which declaration lets a client omit the query parameter q?', zh: '哪项声明允许客户端省略查询参数 q？' }
    options:
      - { text: { en: 'q: str | None = None', zh: 'q: str | None = None' }, correct: true }
      - { text: { en: 'q: str | None', zh: 'q: str | None' }, correct: false }
      - { text: { en: 'q: str = Query()', zh: 'q: str = Query()' }, correct: false }
    explanation: { en: 'Requiredness follows the presence of a default, not merely the union with None. Without a default, the client must still send the parameter.', zh: '是否必填取决于有没有默认值，而不只是类型是否与 None 联合。没有默认值时，客户端仍必须发送该参数。' }
    difficulty: beginner
    tags: [fastapi, optional, validation]

  - id: response-model-priority
    type: mcq
    prompt: { en: 'A route has a broad return annotation and response_model=PublicUser. Which shape does FastAPI use for response validation and filtering?', zh: '路由具有宽泛的返回注解，同时设置 response_model=PublicUser。FastAPI 使用哪种结构验证并过滤响应？' }
    options:
      - { text: { en: 'PublicUser, because response_model takes priority', zh: 'PublicUser，因为 response_model 优先' }, correct: true }
      - { text: { en: 'The return annotation, because Python annotations always win', zh: '返回注解，因为 Python 注解总是优先' }, correct: false }
      - { text: { en: 'The union of fields from both declarations', zh: '两个声明中全部字段的并集' }, correct: false }
    explanation: { en: 'The decorator response_model takes priority and defines the documented, validated, and filtered output. Its public field list should therefore be reviewed as an allowlist.', zh: '装饰器上的 response_model 优先，决定文档、验证和过滤后的输出。因此应把其中的公开字段列表当作允许列表审查。' }
    difficulty: intermediate
    tags: [fastapi, response-model, security]

  - id: spotbug-async-order-reader
    type: spotbug
    prompt: { en: 'This endpoint should fetch only an order visible to the current user without blocking the event loop. Find the two boundary bugs.', zh: '这个端点应只获取当前用户可见的订单，而且不能阻塞事件循环。找出两个边界错误。' }
    code: |
      from fastapi import FastAPI

      app = FastAPI()

      @app.get("/orders/{order_id}")
      async def read_order(order_id: int):
          order = sync_session.get(Order, order_id)
          return {"id": order.id, "total_cents": order.total_cents}
    lang: python
    issues:
      - line: 7
        kind: performance
        note: { en: 'The synchronous database call runs inside async def and can block the event loop.', zh: '同步数据库调用位于 async def 内部，可能阻塞事件循环。' }
      - line: 7
        kind: security
        note: { en: 'The lookup uses only the identifier and never scopes the order to the authenticated user or tenant.', zh: '查询只使用资源标识，没有把订单限制在已认证用户或租户范围内。' }
    explanation: { en: 'Use an async data-access API or a normal def boundary for blocking access, and query through the authenticated principal’s scope. Also handle the absent resource before dereferencing it.', zh: '应使用异步数据访问 API，或用普通 def 隔离阻塞访问，并通过已认证主体的范围查询。还要在解引用前处理资源不存在的情况。' }
    difficulty: intermediate
    tags: [fastapi, async, authorization, code-review]

  - id: review-generated-document-update
    type: review
    prompt: { en: 'Review this generated document update endpoint against the stated task and identify five distinct risks.', zh: '根据任务要求审查这个生成的文档更新端点，找出五类不同的风险。' }
    task: { en: 'Update a non-empty title for a document owned by the current tenant, use non-blocking storage, return 404 when absent, and expose only public document fields.', zh: '为当前租户拥有的文档更新非空标题，使用非阻塞存储，资源不存在时返回 404，并且只暴露文档的公开字段。' }
    right: { en: 'The generated code uses a typed request model, selects PATCH for a partial update, and keeps the route body short.', zh: '生成代码使用了带类型的请求模型，以 PATCH 表达部分更新，而且路由函数较短。' }
    code: |
      import time

      from fastapi import FastAPI
      from pydantic import BaseModel

      class DocumentPatch(BaseModel):
          title: str | None = None

      app = FastAPI()

      @app.patch("/documents/{document_id}")
      async def update_document(document_id: int, patch: DocumentPatch):
          time.sleep(0.2)
          document = repository.get(document_id)
          if document is None:
              return {"error": "not found"}

          for name, value in patch.model_dump().items():
              setattr(document, name, value)

          repository.save(document)
          return document.__dict__
    lang: python
    issues:
      - line: 7
        kind: edge-case
        note: { en: 'The model accepts an omitted, null, empty, or arbitrarily long title instead of enforcing the non-empty title task.', zh: '模型允许省略、null、空字符串或任意长度的标题，没有执行标题非空的任务要求。' }
      - line: 13
        kind: performance
        note: { en: 'time.sleep blocks the event loop inside async def; the synchronous repository calls may do the same.', zh: 'time.sleep 会在 async def 中阻塞事件循环，同步 repository 调用也可能如此。' }
      - line: 14
        lines: 22
        kind: security
        note: { en: 'The lookup is not tenant-scoped, and returning __dict__ can expose internal fields beyond the public contract.', zh: '查询没有按租户限制，而且返回 __dict__ 可能暴露公开契约之外的内部字段。' }
      - line: 16
        kind: correctness
        note: { en: 'Returning an error dictionary without raising HTTPException produces a successful 200 response instead of the required 404.', zh: '直接返回错误字典而不抛出 HTTPException，会产生成功的 200 响应，而不是要求的 404。' }
      - line: 18
        lines: 19
        kind: readability
        note: { en: 'Generic setattr mutation hides which fields may change and also writes unset values produced by model_dump().', zh: '通用 setattr 修改掩盖了允许变更的字段，还会写入 model_dump() 产生的未设置值。' }
    checklist:
      - { en: 'Map authentication and tenant scope to the storage query.', zh: '把认证与租户范围落实到存储查询中。' }
      - { en: 'Test omitted, null, blank, boundary-length, and valid titles.', zh: '测试省略、null、空白、边界长度和有效标题。' }
      - { en: 'Trace every blocking call reachable from async def.', zh: '跟踪 async def 可达的每个阻塞调用。' }
      - { en: 'Assert status codes and the absence of internal response fields.', zh: '断言状态码，并确认响应不含内部字段。' }
    explanation: { en: 'Use a constrained patch model, authenticated tenant dependency, async repository, explicit 404, deliberate field update, and a public response model. Each boundary then becomes independently testable.', zh: '应使用带约束的更新模型、已认证租户依赖、异步仓储、显式 404、明确字段更新和公开响应模型。这样每个边界都能独立测试。' }
    difficulty: advanced
    tags: [fastapi, code-review, authorization, response-model]
