topic: backend/php-laravel
items:
  - id: predict-container-lifetime
    type: predict
    prompt: { en: 'What does this Laravel container program print?', zh: '这段 Laravel 容器程序会输出什么？' }
    code: |
      <?php
      use Illuminate\Container\Container;

      interface Clock
      {
          public function now(): string;
      }

      final class FixedClock implements Clock
      {
          public function now(): string { return '10:00'; }
      }

      $container = new Container();
      $container->bind(Clock::class, FixedClock::class);
      $first = $container->make(Clock::class);
      $second = $container->make(Clock::class);

      echo $first->now(), "\n";
      echo $first === $second ? "same\n" : "different\n";
    lang: php
    options:
      - { text: { en: "10:00\ndifferent", zh: "10:00\ndifferent" }, correct: true }
      - { text: { en: "10:00\nsame", zh: "10:00\nsame" }, correct: false }
      - { text: { en: 'The container cannot resolve FixedClock.', zh: '容器无法解析 FixedClock。' }, correct: false }
    explanation: { en: 'bind() selects the implementation but does not share it. Each make() call creates a new FixedClock, so the values match while object identity differs.', zh: 'bind() 选择实现，但不共享实例。每次 make() 都创建新的 FixedClock，因此时间值相同，对象身份不同。' }
    difficulty: beginner
    tags: [container, binding, lifetime]

  - id: validation-versus-authorization
    type: mcq
    prompt: { en: 'A Form Request validates an order ID as an integer. What must still happen before updating that order?', zh: 'Form Request 已验证订单 ID 是整数。更新订单前还必须做什么？' }
    options:
      - { text: { en: 'Authorize the current user against the resolved order or a tenant-scoped query.', zh: '针对已解析订单执行当前用户授权，或使用限定租户的查询。' }, correct: true }
      - { text: { en: 'Add the ID to the model casts array.', zh: '把 ID 加入模型的 casts 数组。' }, correct: false }
      - { text: { en: 'Call route:cache before every request.', zh: '每次请求前调用 route:cache。' }, correct: false }
      - { text: { en: 'Convert the controller to a singleton.', zh: '把控制器改成单例。' }, correct: false }
    explanation: { en: 'Validation checks input shape, and model binding checks existence. Neither establishes object-level permission for the authenticated user.', zh: '验证检查输入形状，模型绑定检查对象是否存在；两者都不能建立已认证用户的对象级权限。' }
    difficulty: intermediate
    tags: [validation, authorization, model-binding]

  - id: spot-unscoped-order-update
    title: { en: 'Spot the bug in the Laravel controller', zh: '找出 Laravel 控制器里的 bug' }
    type: spotbug
    prompt: { en: 'Find the object-authorization bug in this generated controller.', zh: '找出这段生成控制器中的对象授权缺陷。' }
    code: |
      <?php

      final class OrderController
      {
          public function update(Request $request, int $orderId): JsonResponse
          {
              $data = $request->validate([
                  'status' => ['required', 'in:cancelled'],
              ]);

              $order = Order::findOrFail($orderId);
              $order->update($data);

              return response()->json($order);
          }
      }
    lang: php
    issues:
      - line: 11
        kind: security
        note: { en: 'The lookup trusts a caller-selected ID and never scopes by the authenticated customer or calls a policy. Any authenticated caller reaching the route could target another customer’s order.', zh: '查询信任调用方选择的 ID，既没有按已认证客户限定，也没有调用策略。任何能访问该路由的已认证调用方都可能操作其他客户的订单。' }
    explanation: { en: 'Resolve the order through the authenticated owner or tenant, then authorize the requested transition with a policy. Validation of status does not confer permission.', zh: '应通过已认证所有者或租户解析订单，再通过策略授权状态转换。验证 status 不会授予操作权限。' }
    difficulty: intermediate
    tags: [authorization, tenant-scope, controller]

  - id: long-running-binding-choice
    type: mcq
    prompt: { en: 'A service stores per-job correlation data and a queue worker handles many jobs in one process. Which binding best matches that ownership?', zh: '某服务保存每个任务的关联数据，而队列工作进程会在同一进程处理多个任务。哪种绑定最符合该所有权？' }
    options:
      - { text: { en: 'scoped(), with no separate static cache', zh: '使用 scoped()，且不另设静态缓存' }, correct: true }
      - { text: { en: 'singleton(), because one process should have one object', zh: '使用 singleton()，因为一个进程应该只有一个对象' }, correct: false }
      - { text: { en: 'instance(), created from the first job request', zh: '使用 instance()，并从第一个任务请求创建对象' }, correct: false }
      - { text: { en: 'A global variable reset only on deployment', zh: '使用只在部署时重置的全局变量' }, correct: false }
    explanation: { en: 'A scoped binding is reused within one job lifecycle and flushed for the next job in supported long-running workers. Static state would remain outside that lifecycle.', zh: '作用域绑定会在一个任务生命周期内复用，并在受支持的常驻工作进程开始下一任务时刷新；静态状态不受该生命周期控制。' }
    difficulty: advanced
    tags: [scoped-binding, queues, state]

  - id: eager-loading-proof
    type: mcq
    prompt: { en: 'Which test best proves an Eloquent N+1 regression is fixed?', zh: '哪项测试最能证明 Eloquent 的 N+1 回归已经修复？' }
    options:
      - { text: { en: 'Render or serialize a fixed-size result with its relationships and assert a bounded query count.', zh: '渲染或序列化固定大小且包含关联的结果，并断言查询数量上限。' }, correct: true }
      - { text: { en: 'Assert that the controller source contains with().', zh: '断言控制器源码包含 with()。' }, correct: false }
      - { text: { en: 'Run the query once with an empty database.', zh: '在空数据库上运行一次查询。' }, correct: false }
      - { text: { en: 'Convert every relationship to a singleton.', zh: '把每个关联都转换成单例。' }, correct: false }
    explanation: { en: 'N+1 work often happens during rendering or resource serialization. A stable fixture and the complete access path make the query-count assertion meaningful.', zh: 'N+1 往往发生在渲染或资源序列化阶段。稳定夹具与完整访问路径能让查询数量断言具有实际意义。' }
    difficulty: intermediate
    tags: [eloquent, eager-loading, testing]

  - id: review-generated-order-endpoint
    title: { en: 'Review a generated order endpoint', zh: '审查生成的订单端点' }
    type: review
    prompt: { en: 'Review this generated Laravel endpoint before deployment.', zh: '在部署这段生成的 Laravel 端点前进行审查。' }
    task: { en: 'Let an authenticated customer create an order from validated product quantities, use authoritative prices, persist the order and audit event atomically, and return a public representation.', zh: '允许已认证客户用经过验证的商品数量创建订单，使用服务端权威价格，原子保存订单与审计事件，并返回公开表示。' }
    code: |
      <?php

      public function store(Request $request): JsonResponse
      {
          $payload = $request->all();
          $customer = Customer::findOrFail($payload['customer_id']);

          $order = Order::create([
              'customer_id' => $customer->id,
              'status' => 'pending',
          ]);

          foreach ($payload['lines'] as $line) {
              $product = Product::findOrFail($line['product_id']);
              OrderLine::create([
                  'order_id' => $order->id,
                  'product_id' => $product->id,
                  'unit_price_cents' => $line['unit_price_cents'],
              ]);
          }

          AuditEvent::create(['order_id' => $order->id, 'kind' => 'created']);

          return response()->json($order->load('customer', 'lines.product'), 201);
      }
    lang: php
    right: { en: 'The generated code returns the appropriate 201 status, records a price snapshot on each line, attempts to write an audit event, and loads relationships before producing the response.', zh: '生成代码返回合适的 201 状态，为每条明细记录价格快照，尝试写入审计事件，并在生成响应前加载关联。' }
    checklist:
      - { en: 'Send malformed JSON, missing and extra fields, empty lines, duplicate products, zero quantities, and unavailable products.', zh: '发送格式错误的 JSON、缺失与额外字段、空明细、重复商品、零数量和不可售商品。' }
      - { en: 'Create two customers and prove neither customer_id nor unit_price_cents from the request can cross the ownership or pricing boundary.', zh: '创建两个客户，证明请求中的 customer_id 和 unit_price_cents 都不能越过所有权或定价边界。' }
      - { en: 'Fail each write in turn and prove the order, lines, and audit event commit or roll back as one unit.', zh: '依次让每次写入失败，证明订单、明细和审计事件会作为一个整体提交或回滚。' }
      - { en: 'Assert an explicit response schema and a bounded query count for the maximum accepted line count.', zh: '针对允许的最大明细数量，断言明确响应模式和查询数量上限。' }
    issues:
      - line: 5
        kind: edge-case
        note: { en: 'The endpoint performs no shape or value validation. Missing lines, non-array input, zero quantities, duplicates, and unavailable products can become errors or invalid orders.', zh: '端点没有执行结构或值验证。缺失明细、非数组输入、零数量、重复商品和不可售商品可能变成异常或无效订单。' }
      - line: 6
        lines: 13
        kind: security
        note: { en: 'The caller chooses both customer_id and unit_price_cents. Authentication is not tied to the selected customer, and client pricing overrides the authoritative product price.', zh: '调用方同时选择 customer_id 和 unit_price_cents。认证身份没有绑定所选客户，客户端价格还覆盖了商品权威价格。' }
      - line: 8
        lines: 15
        kind: correctness
        note: { en: 'The order, lines, and audit event are separate writes with no transaction. A failure leaves a partial order while the task requires atomic persistence.', zh: '订单、明细和审计事件是没有事务保护的独立写入。任何失败都会留下部分订单，与原子持久化要求冲突。' }
      - line: 14
        kind: performance
        note: { en: 'Finding one product per line produces query growth proportional to line count. Fetch the distinct product IDs in one bounded query and map them by ID.', zh: '每条明细查找一次商品，查询量会随明细数增长。应在一次有界查询中取得不同商品 ID，再按 ID 建立映射。' }
    explanation: { en: 'Use a Form Request allowlist, derive the customer from the authenticated user, load authoritative products in one query, and perform all writes in a database transaction. Return an API Resource with selected fields and test authorization, rollback, and query count over HTTP.', zh: '应使用 Form Request 白名单，从已认证用户取得客户，一次查询加载权威商品，并在数据库事务中执行全部写入。返回只含选定字段的 API Resource，再通过 HTTP 测试授权、回滚与查询数量。' }
    difficulty: advanced
    tags: [code-review, authorization, transaction, query-shape]
