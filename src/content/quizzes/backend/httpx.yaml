topic: backend/httpx
items:
  - id: predict-client-merge
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      import httpx

      def app(request):
          return httpx.Response(200, json={"url": str(request.url)})

      with httpx.Client(
          base_url="https://api.test/v1/",
          params={"locale": "en"},
          transport=httpx.MockTransport(app),
      ) as client:
          response = client.get("orders", params={"page": 2})
          print(response.json()["url"])
    lang: python
    options:
      - { text: { en: 'https://api.test/v1/orders?locale=en&page=2', zh: 'https://api.test/v1/orders?locale=en&page=2' }, correct: true }
      - { text: { en: 'https://api.test/orders?page=2', zh: 'https://api.test/orders?page=2' }, correct: false }
      - { text: { en: 'https://api.test/v1/orders?page=2', zh: 'https://api.test/v1/orders?page=2' }, correct: false }
      - { text: { en: 'It raises because client and request parameters cannot be combined.', zh: '程序会抛出异常，因为客户端参数与单次请求参数不能合并。' }, correct: false }
    explanation: { en: 'The relative resource path preserves the base path, and client-level and request-level query parameters merge.', zh: '相对资源路径会保留基础路径，客户端级与单次请求级查询参数也会合并。' }
    difficulty: beginner
    tags: [httpx, client, request-building]

  - id: timeout-semantics
    type: mcq
    prompt: { en: 'What does timeout=5.0 guarantee for a normal HTTPX request?', zh: '`timeout=5.0` 对普通 HTTPX 请求保证了什么？' }
    options:
      - { text: { en: 'Each network timeout phase is bounded, but the full operation may exceed five seconds.', zh: '每个网络超时阶段都有边界，但完整操作可能超过 5 秒。' }, correct: true }
      - { text: { en: 'The complete request, including all retries, ends within exactly five seconds.', zh: '包含所有重试的完整请求一定在 5 秒内结束。' }, correct: false }
      - { text: { en: 'Only opening the TCP connection is bounded to five seconds.', zh: '只有建立 TCP 连接被限制为 5 秒。' }, correct: false }
      - { text: { en: 'The server is asked to cancel its work after five seconds.', zh: '服务端会被要求在 5 秒后取消工作。' }, correct: false }
    explanation: { en: 'HTTPX separates pool, connect, write, and read timeouts; a caller-owned overall deadline is a separate control.', zh: 'HTTPX 区分连接池、连接、写入与读取超时；调用方控制的整体截止时间属于另一层机制。' }
    difficulty: intermediate
    tags: [httpx, timeout, deadline]

  - id: spotbug-async-client
    title: { en: 'Spot the bug in the async HTTPX client', zh: '找出异步 HTTPX 客户端里的 bug' }
    type: spotbug
    prompt: { en: 'This function should reuse asynchronous I/O in a service. Find the two client-boundary bugs.', zh: '这个函数应在服务中复用异步 I/O。找出两个客户端边界错误。' }
    code: |
      import httpx

      async def load_order(order_id: int) -> dict:
          async with httpx.AsyncClient() as client:
              response = client.get(
                  f"https://inventory.test/orders/{order_id}"
              )
          return response.json()
    lang: python
    issues:
      - line: 4
        kind: performance
        note: { en: 'Every call creates and closes a client, so service calls cannot reuse its connection pool.', zh: '每次调用都创建并关闭客户端，因此服务调用无法复用连接池。' }
      - line: 5
        lines: 3
        kind: correctness
        note: { en: 'AsyncClient.get returns an awaitable; without await, response is a coroutine and has no json method.', zh: '`AsyncClient.get` 返回可等待对象；缺少 `await` 时，`response` 是协程，没有 `json` 方法。' }
    explanation: { en: 'Inject a long-lived AsyncClient owned by the service lifecycle and await its get call before checking status and decoding JSON.', zh: '应注入由服务生命周期持有的长期 `AsyncClient`，并先 `await` 其 `get` 调用，再检查状态与解码 JSON。' }
    difficulty: intermediate
    tags: [httpx, async-client, code-review]

  - id: streaming-cleanup
    type: mcq
    prompt: { en: 'Why should a streaming response normally be used as a context manager?', zh: '为什么流式响应通常应通过上下文管理器使用？' }
    options:
      - { text: { en: 'It guarantees cleanup on success, error, early exit, and cancellation paths.', zh: '它保证成功、错误、提前退出与取消路径都会执行清理。' }, correct: true }
      - { text: { en: 'It forces the complete body into memory before the first iteration.', zh: '它会在首次迭代前强制把完整正文读入内存。' }, correct: false }
      - { text: { en: 'It makes every received chunk correspond to one application record.', zh: '它会让每个网络块对应一条应用记录。' }, correct: false }
      - { text: { en: 'It automatically retries a partially consumed download.', zh: '它会自动重试只消费了一部分的下载。' }, correct: false }
    explanation: { en: 'Closing releases the response stream and lets the connection close or return to the pool. Chunk boundaries and retries remain application concerns.', zh: '关闭操作会释放响应流，让连接关闭或回到连接池；分块边界与重试仍由应用处理。' }
    difficulty: intermediate
    tags: [httpx, streaming, cleanup]

  - id: review-generated-order-fetcher
    title: { en: 'Review a generated order fetcher', zh: '审查生成的订单读取器' }
    type: review
    prompt: { en: 'Review this generated HTTPX client against the stated task and identify five distinct risks.', zh: '根据任务要求审查这个生成的 HTTPX 客户端，找出五类不同的风险。' }
    task: { en: 'Fetch order JSON for many IDs with shared async resources, verified TLS, bounded concurrency and timeouts; surface status failures and preserve server documents.', zh: '读取多个订单的 JSON，复用异步资源，验证 TLS，限制并发与超时；暴露状态错误，并保持服务端文档不变。' }
    right: { en: 'The generated code uses AsyncClient, carries authentication in a header rather than the URL, annotates its boundary, and retains the request URL for diagnosis.', zh: '生成代码使用 `AsyncClient`，把认证信息放在请求头而不是 URL 中，为边界添加了类型注解，并保留请求 URL 以便诊断。' }
    code: |
      import httpx

      async def fetch_orders(order_ids: list[int], token: str) -> list[dict]:
          orders = []

          for order_id in order_ids:
              async with httpx.AsyncClient(verify=False) as client:
                  response = await client.post(
                      f"https://inventory.test/orders/{order_id}",
                      headers={"Authorization": f"Bearer {token}"},
                      timeout=None,
                  )

                  if response.status_code >= 500:
                      response = await client.post(str(response.request.url))

                  payload = response.json()
                  payload["source_url"] = str(response.request.url)
                  orders.append(payload)

          return orders
    lang: python
    issues:
      - line: 7
        kind: security
        note: { en: 'verify=False disables TLS certificate verification for every request.', zh: '`verify=False` 会对每个请求禁用 TLS 证书验证。' }
      - line: 6
        lines: 10
        kind: performance
        note: { en: 'The loop is sequential and creates a new client per order, losing both bounded parallelism and connection reuse.', zh: '循环串行执行，而且为每个订单创建新客户端，既没有有界并行，也无法复用连接。' }
      - line: 11
        kind: edge-case
        note: { en: 'timeout=None allows pool, connection, write, and read waits to remain unbounded.', zh: '`timeout=None` 允许连接池、连接、写入与读取无限等待。' }
      - line: 8
        lines: 8
        kind: correctness
        note: { en: 'A read uses POST and retries it after a server response without an idempotency policy; the retry also drops authentication and status validation.', zh: '读取操作使用了 `POST`，并在收到服务端响应后无幂等策略地重试；重试还丢失了认证与状态校验。' }
      - line: 18
        kind: readability
        note: { en: 'Mutating the decoded server document with transport metadata hides the distinction between the API schema and local diagnostics.', zh: '把传输元数据写入解码后的服务端文档，掩盖了 API 模式与本地诊断信息之间的区别。' }
    checklist:
      - { en: 'Map one client owner to a guaranteed async close path and verify TLS policy.', zh: '把唯一客户端所有者映射到可靠的异步关闭路径，并检查 TLS 策略。' }
      - { en: 'Bound input, active tasks, connections, phase timeouts, and the overall deadline.', zh: '限制输入、活动任务、连接、分阶段超时和整体截止时间。' }
      - { en: 'Assert method, authentication, allowed statuses, media type, and response schema.', zh: '断言方法、认证、允许的状态、媒体类型与响应模式。' }
      - { en: 'Review retry semantics and keep diagnostics separate from returned documents.', zh: '审查重试语义，并让诊断信息与返回文档保持分离。' }
    explanation: { en: 'Pass one configured AsyncClient into a bounded task group, issue authenticated GET requests, apply phase and overall budgets, check status and schema, and record sanitized diagnostics separately.', zh: '应把一个配置好的 `AsyncClient` 传入有界任务组，发送带认证的 `GET` 请求，应用分阶段与整体预算，检查状态和模式，并单独记录脱敏诊断信息。' }
    difficulty: advanced
    tags: [httpx, code-review, async-client, retry]
