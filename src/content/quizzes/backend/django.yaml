topic: backend/django
items:
  - id: predict-path-converter
    type: predict
    prompt: { en: 'What does this URL resolution program print?', zh: '这段URL解析程序会输出什么？' }
    code: |
      from django.http import HttpResponse
      from django.urls import Resolver404, path, resolve


      def order_detail(request, order_id):
          return HttpResponse(str(order_id))


      patterns = (path("orders/<int:order_id>/", order_detail),)

      for url in ("/orders/7/", "/orders/seven/"):
          try:
              match = resolve(url, urlconf=patterns)
              print(match.kwargs["order_id"])
          except Resolver404:
              print("no match")
    lang: python
    options:
      - { text: { en: "7\nno match", zh: "7\nno match" }, correct: true }
      - { text: { en: "7\nseven", zh: "7\nseven" }, correct: false }
      - { text: { en: "'7'\nno match", zh: "'7'\nno match" }, correct: false }
      - { text: { en: 'The program stops with ValueError.', zh: '程序抛出ValueError并停止。' }, correct: false }
    explanation: { en: 'The int converter accepts the first segment and stores integer 7 in kwargs. It rejects "seven", so resolution raises Resolver404 for the second URL.', zh: 'int转换器接受第一个片段，并把整数7放入kwargs；它拒绝 "seven"，所以解析第二个URL时抛出Resolver404。' }
    difficulty: beginner
    tags: [urlconf, path-converter, routing]

  - id: queryset-stays-lazy
    type: mcq
    prompt: { en: 'Which operation normally builds a new QuerySet without executing its SELECT?', zh: '哪项操作通常只构造新的QuerySet，而不会执行SELECT？' }
    options:
      - { text: { en: 'Order.objects.filter(paid=True)', zh: 'Order.objects.filter(paid=True)' }, correct: true }
      - { text: { en: 'list(Order.objects.all())', zh: 'list(Order.objects.all())' }, correct: false }
      - { text: { en: 'len(Order.objects.all())', zh: 'len(Order.objects.all())' }, correct: false }
      - { text: { en: 'bool(Order.objects.all())', zh: 'bool(Order.objects.all())' }, correct: false }
    explanation: { en: 'filter() composes a query and returns another lazy QuerySet. Converting to a list, taking len(), or testing truth evaluates the QuerySet.', zh: 'filter() 组合查询并返回另一个惰性QuerySet；转换为列表、调用len() 或执行真值判断都会触发求值。' }
    difficulty: beginner
    tags: [queryset, laziness, evaluation]

  - id: spot-object-authorization
    title: { en: 'Spot the bug in the order view', zh: '找出订单视图里的bug' }
    type: spotbug
    prompt: { en: 'Find the authorization flaw in this generated order view.', zh: '找出这段生成的订单视图中的授权缺陷。' }
    code: |
      @login_required
      def order_detail(request, order_id):
          order = get_object_or_404(Order, pk=order_id)
          return JsonResponse(
              {
                  "reference": order.reference,
                  "shipping_address": order.shipping_address,
              }
          )
    lang: python
    issues:
      - line: 3
        kind: security
        note: { en: 'The lookup is constrained only by a caller-controlled ID. Any authenticated user can read another user’s order if they can obtain or guess its ID.', zh: '查询只受调用方控制的ID限制。任意已登录用户只要获得或猜到其他用户的订单ID，就能读取该订单。' }
    explanation: { en: 'Constrain the lookup by the authenticated user or tenant, or apply an explicit object policy before serializing the order. Authentication alone does not provide object-level authorization.', zh: '查询时还要限定已认证用户或租户，或者在序列化订单前执行明确的对象策略。只有认证并不能提供对象级授权。' }
    difficulty: intermediate
    tags: [authorization, idor, view]

  - id: migration-source-model
    type: mcq
    prompt: { en: 'A RunPython data migration needs the Order model. Which lookup is safe for the recorded migration state?', zh: 'RunPython数据迁移需要Order模型。哪种查找方式适用于已记录的迁移状态？' }
    options:
      - { text: { en: "apps.get_model('shop', 'Order')", zh: "apps.get_model('shop', 'Order')" }, correct: true }
      - { text: { en: 'from shop.models import Order', zh: 'from shop.models import Order' }, correct: false }
      - { text: { en: 'django.setup().models.Order', zh: 'django.setup().models.Order' }, correct: false }
    explanation: { en: 'The apps argument exposes historical model definitions for that migration point. Importing the current class can apply future fields or methods to an older schema.', zh: 'apps参数提供迁移所在时间点的历史模型定义。导入当前模型类，可能把未来字段或方法应用到旧数据库模式。' }
    difficulty: intermediate
    tags: [migration, historical-model, runpython]

  - id: async-transaction-boundary
    type: mcq
    prompt: { en: 'A Django 6.0 async view must perform several ORM writes in one transaction. What is the supported design?', zh: 'Django 6.0异步视图需要在一个事务中执行多次ORM写入。哪种设计受到支持？' }
    options:
      - { text: { en: 'Put the transactional ORM work in one synchronous function and call it through sync_to_async().', zh: '把事务性ORM工作放入一个同步函数，再通过sync_to_async() 调用。' }, correct: true }
      - { text: { en: 'Use async with transaction.atomic() directly around async ORM calls.', zh: '直接用async with transaction.atomic() 包裹异步ORM调用。' }, correct: false }
      - { text: { en: 'Set DJANGO_ALLOW_ASYNC_UNSAFE so synchronous transaction code can run freely.', zh: '设置DJANGO_ALLOW_ASYNC_UNSAFE，让同步事务代码直接运行。' }, correct: false }
    explanation: { en: 'Django 6.0 does not support transactions in async mode. Keep the whole atomic unit synchronous and cross the boundary once with the documented adapter.', zh: 'Django 6.0不支持异步模式下的事务。应让整个原子工作单元保持同步，只通过文档规定的适配器跨越一次边界。' }
    difficulty: advanced
    tags: [asgi, async-safety, transaction]

  - id: review-generated-profile-update
    type: review
    title: { en: 'Review a generated profile endpoint', zh: '审查生成的个人资料端点' }
    prompt: { en: 'Review this generated profile endpoint before it is deployed.', zh: '在部署这段生成的个人资料端点前，对它进行审查。' }
    task: { en: 'Let an authenticated user update only their own display name and time zone, reject malformed input, record an audit event atomically, and return the public profile.', zh: '允许已认证用户只更新自己的显示名称和时区，拒绝格式错误的输入，原子记录审计事件，并返回公开个人资料。' }
    code: |
      import json

      from django.contrib.auth.decorators import login_required
      from django.forms.models import model_to_dict
      from django.http import JsonResponse
      from django.views.decorators.csrf import csrf_exempt


      @csrf_exempt
      @login_required
      def update_profile(request, account_id):
          payload = json.loads(request.body)
          account = Account.objects.get(pk=account_id)
          for field, value in payload.items():
              setattr(account, field, value)
          account.save()
          AuditEvent.objects.create(account=account, kind="profile.updated")
          active_sessions = len(list(account.sessions.all()))
          return JsonResponse(
              {"profile": model_to_dict(account), "active_sessions": active_sessions}
          )
    lang: python
    right: { en: 'The view requires authentication, returns a JSON response, and attempts to leave an audit record for a state-changing operation.', zh: '该视图要求用户先认证，返回JSON响应，并尝试为状态变更留下审计记录。' }
    checklist:
      - { en: 'Exercise the real HTTP method, content type, malformed JSON, missing fields, length limits, and unsupported time zones.', zh: '测试真实HTTP方法、内容类型、格式错误的JSON、缺失字段、长度限制和不支持的时区。' }
      - { en: 'Try the request with another account ID and with server-owned fields such as is_staff in the body.', zh: '使用另一个账户ID发起请求，并在请求体中加入is_staff等服务端控制字段。' }
      - { en: 'Inject a failure between profile persistence and audit creation, then prove that neither change remains.', zh: '在保存资料与创建审计记录之间注入故障，再证明两项变更都没有残留。' }
      - { en: 'Assert an explicit public response schema and capture the query count with many sessions.', zh: '断言明确的公开响应模式，并在存在许多会话时捕获查询数量。' }
    issues:
      - line: 9
        lines: 7
        kind: security
        note: { en: 'The endpoint disables CSRF, trusts a caller-selected account ID, and mass-assigns arbitrary fields. A session-authenticated user could target another account or set server-owned privileges.', zh: '端点禁用CSRF，信任调用方选择的账户ID，并批量赋值任意字段。使用会话认证的用户可能修改其他账户，或设置由服务端控制的权限。' }
      - line: 12
        kind: edge-case
        note: { en: 'JSON decoding, body shape, method, content type, display-name limits, and time-zone validity are unchecked, so malformed or surprising input becomes a server error or invalid state.', zh: '代码没有检查JSON解码、请求体结构、方法、内容类型、显示名称限制和时区有效性，因此异常输入会变成服务端错误或无效状态。' }
      - line: 16
        lines: 2
        kind: correctness
        note: { en: 'The profile save and audit insert are separate commits. If audit creation fails, the profile changes without the required audit event.', zh: '个人资料保存和审计插入分别提交。如果创建审计事件失败，资料会在缺少必要审计记录的情况下发生变更。' }
      - line: 18
        kind: performance
        note: { en: 'Converting every session to a list loads all rows and model objects merely to count them; an appropriately filtered count() query avoids that materialization.', zh: '仅为计数就把所有会话转换成列表，会加载全部数据行和模型对象；使用带适当过滤条件的count() 查询可以避免实例化这些对象。' }
    explanation: { en: 'Derive the account from request.user, require the intended method and CSRF policy, validate an allowlisted input form, and wrap the save plus audit insert in transaction.atomic(). Return explicitly selected public fields and count only active sessions in SQL.', zh: '应从request.user取得账户，强制使用预期方法和CSRF策略，通过字段白名单表单验证输入，并用transaction.atomic() 包裹保存与审计插入。响应只返回显式选择的公开字段，并在SQL中只统计有效会话。' }
    difficulty: advanced
    minutes: 10
    tags: [code-review, authorization, validation, transaction]
