topic: backend/api-versioning
items:
  - id: predict-version-selection
    type: predict
    prompt: { en: 'What does this version selector print?', zh: '这个版本选择器会输出什么？' }
    code: |
      function resolve(path) {
        const match = /^\/api\/(v1|v2)\//.exec(path);
        return match ? match[1] : "unsupported";
      }

      console.log(resolve("/api/v2/orders"));
      console.log(resolve("/api/v3/orders"));
    lang: javascript
    options:
      - { text: { en: 'v2, then unsupported', zh: '先输出 v2，再输出 unsupported' }, correct: true }
      - { text: { en: 'v2, then v3', zh: '先输出 v2，再输出 v3' }, correct: false }
      - { text: { en: 'v1, then v1', zh: '先输出 v1，再输出 v1' }, correct: false }
      - { text: { en: 'The regular expression throws.', zh: '正则表达式会抛出异常。' }, correct: false }
    explanation: { en: 'The expression accepts only v1 or v2. The v3 path does not match and reaches the explicit unsupported result.', zh: '该表达式只接受 v1 或 v2。v3 路径无法匹配，因此得到明确的 unsupported 结果。' }
    difficulty: beginner
    tags: [version-selector, routing, predict-output]

  - id: public-version-boundary
    type: mcq
    prompt: { en: 'Which artifact should normally determine whether an HTTP API needs a new public version?', zh: '通常应根据哪项内容判断 HTTP API 是否需要新的公共版本？' }
    options:
      - { text: { en: 'A change to the observable API contract that supported consumers cannot handle', zh: '受支持消费者无法处理的可观察 API 契约变更' }, correct: true }
      - { text: { en: 'Every production deployment identifier', zh: '每一个生产部署标识' }, correct: false }
      - { text: { en: 'Every database schema migration', zh: '每一次数据库模式迁移' }, correct: false }
      - { text: { en: 'Every internal refactor of a controller', zh: '控制器的每一次内部重构' }, correct: false }
    explanation: { en: 'Public versions name compatibility boundaries that clients observe. Internal deployments, schemas, and refactors can change without a new API version when the contract remains intact.', zh: '公共版本为客户端可观察的兼容性边界命名。只要契约保持不变，内部部署、模式和重构都可以在不增加 API 版本的情况下变化。' }
    difficulty: beginner
    tags: [api-contract, compatibility, version-policy]

  - id: spot-header-cache-key
    type: spotbug
    prompt: { en: 'Find the version isolation bug in this generated cache wrapper.', zh: '找出这段生成缓存包装器中的版本隔离缺陷。' }
    code: |
      function serve(headers, cache) {
        const version = headers["x-api-version"] || "v1";
        const key = "/orders/ord-7";
        if (cache.has(key)) return cache.get(key);

        const body = version === "v1"
          ? { id: "ord-7", total: 25.99 }
          : { id: "ord-7", total: { amount: "25.99", currency: "USD" } };
        cache.set(key, body);
        return body;
      }
    lang: javascript
    issues:
      - line: 3
        lines: 2
        kind: correctness
        note: { en: 'The cache key ignores the selecting header, so whichever version fills the URI key first can be returned to the other version.', zh: '缓存键忽略了用于选择版本的请求头，因此先填充该 URI 键的版本可能被返回给另一个版本。' }
    explanation: { en: 'Separate cached variants by the selecting header and emit the corresponding Vary field at the HTTP boundary. Verify the deployed gateway or CDN key, not only this application map.', zh: '应按选择版本的请求头隔离缓存变体，并在 HTTP 边界发送对应的 Vary 字段。还要验证实际部署的网关或 CDN 缓存键，不能只检查应用内的 Map。' }
    difficulty: intermediate
    tags: [cache, vary, header-versioning]

  - id: lifecycle-header-syntax
    type: mcq
    prompt: { en: 'Which pair uses the current standard syntax for a deprecation date and a later sunset?', zh: '哪一组值符合当前标准中的弃用日期和更晚的日落日期语法？' }
    options:
      - { text: { en: 'Deprecation: @1798761600; Sunset: Thu, 01 Jul 2027 00:00:00 GMT', zh: 'Deprecation: @1798761600；Sunset: Thu, 01 Jul 2027 00:00:00 GMT' }, correct: true }
      - { text: { en: 'Deprecation: true; Sunset: 2027-07-01', zh: 'Deprecation: true；Sunset: 2027-07-01' }, correct: false }
      - { text: { en: 'Deprecation-Date: 2027-01-01; Sunset: false', zh: 'Deprecation-Date: 2027-01-01；Sunset: false' }, correct: false }
    explanation: { en: 'RFC 9745 defines Deprecation as a Structured Field Date using @ plus Unix seconds. RFC 8594 defines Sunset as an HTTP date.', zh: 'RFC 9745 把 Deprecation 定义为使用 @ 加 Unix 秒数的结构化字段日期；RFC 8594 则规定 Sunset 使用 HTTP 日期。' }
    difficulty: intermediate
    tags: [deprecation, sunset, http-headers]

  - id: additive-response-field
    type: mcq
    prompt: { en: 'When is adding a response field backward-compatible?', zh: '什么情况下新增响应字段才向后兼容？' }
    options:
      - { text: { en: 'When supported readers tolerate unknown fields and existing semantics do not change', zh: '受支持读取者容忍未知字段，并且现有语义不变时' }, correct: true }
      - { text: { en: 'Always, because the new field is optional for the server', zh: '任何时候，因为新字段对服务端来说是可选的' }, correct: false }
      - { text: { en: 'Only when the database column is nullable', zh: '只有对应数据库列允许为空时' }, correct: false }
      - { text: { en: 'Whenever the deployment keeps the same major build number', zh: '只要部署保留相同的主构建号' }, correct: false }
    explanation: { en: 'Response compatibility is determined by readers. Strict decoders can reject an unknown property even when a provider considers the change additive.', zh: '响应兼容性由读取者决定。即使提供者把变更视为增量变更，严格解码器仍可能拒绝未知属性。' }
    difficulty: intermediate
    tags: [backward-compatibility, tolerant-reader, response-schema]

  - id: review-generated-version-handler
    type: review
    prompt: { en: 'Review this generated versioned order handler before release.', zh: '发布前审查这段生成的订单版本处理器。' }
    task: { en: 'Serve GET /orders/:id for v1 and v2, preserve the v1 numeric total until its announced retirement, reject unsupported selectors before storage work, and emit standard lifecycle headers for v1.', zh: '为 v1 和 v2 提供 GET /orders/:id，在公告的退役时间前保留 v1 的数字总额，在访问存储前拒绝不受支持的选择器，并为 v1 发送符合标准的生命周期响应头。' }
    code: |
      async function getOrder(request, db) {
        const version = request.headers.get("X-API-Version") || "v2";
        const order = await db.orders.find(request.params.id);
        if (!order) return json(404, { error: "order not found" });

        if (version === "v1") {
          return json(
            200,
            { id: order.id, total: order.totalCents / 100 },
            {
              Deprecation: "true",
              Sunset: "2027-07-01",
            },
          );
        }

        return json(200, {
          ...order,
          total: { amount: order.totalCents / 100, currency: "USD" },
        });
      }
    lang: javascript
    right: { en: 'The handler reuses one storage read, keeps the v1 total numeric, and gives v2 a separate money representation.', zh: '处理器复用了一次存储读取，保留了 v1 的数字总额，并为 v2 提供独立的金额表示。' }
    checklist:
      - { en: 'Test missing, malformed, unsupported, conflicting, deprecated, and retired selectors.', zh: '测试缺失、格式错误、不受支持、冲突、已弃用和已退役的选择器。' }
      - { en: 'Assert the complete v1 and v2 HTTP contracts, including errors and headers.', zh: '断言完整的 v1 与 v2 HTTP 契约，包括错误和响应头。' }
      - { en: 'Serialize from explicit presenters rather than spreading persistence records.', zh: '通过明确的呈现器序列化，不要展开持久化记录。' }
      - { en: 'Compare exact lifecycle values with RFC 9745 and RFC 8594.', zh: '对照 RFC 9745 和 RFC 8594 检查确切的生命周期值。' }
    issues:
      - line: 2
        kind: edge-case
        note: { en: 'A missing selector silently receives v2, and any unknown non-v1 value also falls through to v2 instead of being rejected.', zh: '缺失选择器会静默得到 v2，任何不是 v1 的未知值也会落入 v2，而不是被拒绝。' }
      - line: 3
        kind: performance
        note: { en: 'The database lookup happens before version validation, so malformed and unsupported requests consume storage work.', zh: '数据库查询发生在版本验证之前，因此格式错误和不受支持的请求也会消耗存储资源。' }
      - line: 11
        lines: 2
        kind: correctness
        note: { en: 'Deprecation must be a Structured Field Date and Sunset must be an HTTP date; the boolean-like and ISO date values use neither required syntax.', zh: 'Deprecation 必须是结构化字段日期，Sunset 必须是 HTTP 日期；这里的类布尔值和 ISO 日期都不符合要求。' }
      - line: 18
        kind: security
        note: { en: 'Spreading the persistence record can expose internal fields such as owner identifiers, fraud flags, or notes that were never part of the v2 contract.', zh: '展开持久化记录可能暴露所有者标识、欺诈标记或备注等从未进入 v2 契约的内部字段。' }
    explanation: { en: 'Resolve and validate the selector first, use explicit presenters for both versions, and freeze any legacy default by policy. Serialize RFC-compliant lifecycle fields and test the complete response at the deployed HTTP boundary.', zh: '应先解析并验证选择器，为两个版本使用明确的呈现器，并按策略固定旧默认值。还要序列化符合 RFC 的生命周期字段，在部署后的 HTTP 边界测试完整响应。' }
    difficulty: advanced
    tags: [code-review, version-routing, lifecycle-headers, data-exposure]
