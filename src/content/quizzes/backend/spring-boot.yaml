topic: backend/spring-boot
items:
  - id: predict-property-precedence
    type: predict
    prompt: { en: 'What is the final line printed by this application?', zh: '这个应用打印的最后一行是什么？' }
    code: |
      import org.springframework.boot.WebApplicationType;
      import org.springframework.boot.SpringBootConfiguration;
      import org.springframework.boot.autoconfigure.EnableAutoConfiguration;
      import org.springframework.boot.builder.SpringApplicationBuilder;

      @SpringBootConfiguration
      @EnableAutoConfiguration
      class DemoConfiguration {}

      public class PrecedenceDemo {
          public static void main(String[] args) {
              try (var context = new SpringApplicationBuilder(DemoConfiguration.class)
                      .web(WebApplicationType.NONE)
                      .properties("catalog.currency=USD")
                      .run("--catalog.currency=EUR")) {
                  System.out.println(context.getEnvironment()
                          .getProperty("catalog.currency"));
              }
          }
      }
    lang: java
    options:
      - { text: { en: 'EUR', zh: 'EUR' }, correct: true }
      - { text: { en: 'USD', zh: 'USD' }, correct: false }
      - { text: { en: 'null', zh: 'null' }, correct: false }
      - { text: { en: 'Startup fails because the property appears twice.', zh: '因为属性出现两次，启动失败。' }, correct: false }
    explanation: { en: 'The builder value is a default property, while the command-line argument is a later, higher-precedence source. The effective value is therefore EUR.', zh: '构建器中的值属于默认属性，命令行参数则是靠后且优先级更高的来源，因此有效值为 EUR。' }
    difficulty: intermediate
    tags: [configuration, precedence, command-line]

  - id: application-scan-root
    type: mcq
    prompt: { en: 'Where should the primary application class normally live?', zh: '主应用类通常应放在哪里？' }
    options:
      - { text: { en: 'In a named root package above the application components it should scan', zh: '放在具名根包中，并位于所有待扫描应用组件的上层' }, correct: true }
      - { text: { en: 'In the deepest controller package so startup finds controllers first', zh: '放在最深的控制器包中，让启动过程先找到控制器' }, correct: false }
      - { text: { en: 'In the unnamed default package so every dependency is scanned', zh: '放在无名默认包中，从而扫描每项依赖' }, correct: false }
      - { text: { en: 'Its package never affects component discovery.', zh: '它所在的包绝不会影响组件发现。' }, correct: false }
    explanation: { en: 'The package of `@SpringBootApplication` is the default component-scan root. A named root package includes intended subpackages without triggering an indiscriminate default-package scan.', zh: '`@SpringBootApplication` 所在包是默认组件扫描根。具名根包可以包含预期子包，同时避免无名包引发不加区分的扫描。' }
    difficulty: beginner
    tags: [component-scan, packages, startup]

  - id: spot-missing-object-authorization
    type: spotbug
    prompt: { en: 'Find the authorization flaw in this generated controller.', zh: '找出这个生成控制器中的授权缺陷。' }
    code: |
      @RestController
      class InvoiceController {
          private final InvoiceRepository invoices;

          @GetMapping("/accounts/{accountId}/invoices/{invoiceId}")
          Invoice invoice(@PathVariable long accountId, @PathVariable long invoiceId) {
              return invoices.findById(invoiceId)
                      .orElseThrow(() -> new ResponseStatusException(HttpStatus.NOT_FOUND));
          }
      }
    lang: java
    issues:
      - line: 7
        kind: security
        note: { en: 'The query trusts a caller-selected invoice ID and ignores both accountId and the authenticated actor. Any caller who can reach the route may retrieve an invoice outside the authorized account.', zh: '查询信任调用方选择的发票 ID，同时忽略 accountId 和已认证主体。任何能访问该路由的调用方都可能取得授权账户之外的发票。' }
    explanation: { en: 'Dependency injection and route binding do not provide object authorization. Constrain the lookup by the authenticated tenant or apply an explicit policy before returning the invoice, then test with a second tenant.', zh: '依赖注入和路由绑定不会提供对象级授权。查询必须受已认证租户约束，或在返回发票前执行明确策略，并用第二个租户进行测试。' }
    difficulty: intermediate
    tags: [authorization, controller, idor]

  - id: conditional-default-backoff
    type: mcq
    prompt: { en: 'What does `@ConditionalOnMissingBean(PaymentClient.class)` mean on a default bean?', zh: '默认 Bean 上的 `@ConditionalOnMissingBean(PaymentClient.class)` 表示什么？' }
    options:
      - { text: { en: 'Register the default only when the condition finds no matching PaymentClient bean', zh: '只有条件未找到匹配的 PaymentClient Bean 时，才注册默认实现' }, correct: true }
      - { text: { en: 'Delete every application-defined PaymentClient and install the default', zh: '删除应用定义的所有 PaymentClient，并安装默认实现' }, correct: false }
      - { text: { en: 'Create one default PaymentClient for every HTTP request', zh: '为每次 HTTP 请求创建一个默认 PaymentClient' }, correct: false }
      - { text: { en: 'Disable all auto-configuration when PaymentClient is absent', zh: '缺少 PaymentClient 时禁用全部自动配置' }, correct: false }
    explanation: { en: 'The condition is a narrow replacement point: the auto-configured default backs away when a matching application bean already exists. The precise match still depends on the condition’s declared types and search strategy.', zh: '该条件提供窄小替换点：匹配的应用 Bean 已存在时，自动配置默认实现会退让。准确匹配仍取决于条件声明的类型和搜索策略。' }
    difficulty: intermediate
    tags: [auto-configuration, condition, backoff]

  - id: actuator-default-exposure
    type: mcq
    prompt: { en: 'Which Actuator endpoint is exposed over HTTP by default in Spring Boot 4.1.1?', zh: 'Spring Boot 4.1.1 默认通过 HTTP 公开哪个 Actuator 端点？' }
    options:
      - { text: { en: 'health', zh: 'health' }, correct: true }
      - { text: { en: 'env', zh: 'env' }, correct: false }
      - { text: { en: 'beans', zh: 'beans' }, correct: false }
      - { text: { en: 'conditions', zh: 'conditions' }, correct: false }
    explanation: { en: 'Only health is exposed over HTTP and JMX by default. Other endpoints require a deliberate exposure decision and still need appropriate access and network controls.', zh: '默认只有 health 通过 HTTP 与 JMX 公开。其他端点需要明确决定公开范围，而且仍需适当的访问控制与网络控制。' }
    difficulty: beginner
    tags: [actuator, exposure, operations]

  - id: review-generated-order-controller
    type: review
    title: { en: 'Review a generated order controller', zh: '审查生成的订单控制器' }
    prompt: { en: 'Review this generated Spring Boot controller before it is deployed.', zh: '部署前审查这个生成的 Spring Boot 控制器。' }
    task: { en: 'Create and list orders only for the authenticated tenant, validate input, commit the order and event reliably under retries, and return bounded public representations.', zh: '只为已认证租户创建和列出订单，校验输入，在重试下可靠提交订单与事件，并返回有界的公开表示。' }
    code: |
      @RestController
      @RequestMapping("/tenants")
      class OrderController {
          @Autowired
          OrderRepository orders;
          @Autowired
          EventPublisher events;

          @PostMapping("/{tenantId}/orders")
          Order create(@PathVariable String tenantId,
                  @RequestBody Map<String, Object> body) {
              var order = new Order();
              order.setTenantId(tenantId);
              order.setSku((String) body.get("sku"));
              order.setQuantity(Integer.parseInt(body.get("quantity").toString()));
              orders.save(order);
              events.publish("order.created", order);
              return order;
          }

          @GetMapping("/{tenantId}/orders")
          List<Order> list(@PathVariable String tenantId) {
              return orders.findAll();
          }
      }
    lang: java
    right: { en: 'The generated code uses resource-oriented paths, separates persistence from event publication behind collaborators, and gives create and list operations distinct HTTP methods.', zh: '生成代码使用面向资源的路径，把持久化与事件发布放在不同协作者之后，并为创建和列表操作使用不同 HTTP 方法。' }
    checklist:
      - { en: 'Authenticate as two tenants and try each tenant ID against the other tenant’s orders.', zh: '分别以两个租户完成认证，再用每个租户 ID 尝试访问另一租户的订单。' }
      - { en: 'Send missing, wrong-type, zero, negative, fractional, oversized, and unknown fields and assert that no side effect occurs.', zh: '发送缺失、类型错误、零、负数、小数、过大值和未知字段，并断言没有副作用。' }
      - { en: 'Inject failures before and after persistence and publication, then retry the same idempotency key.', zh: '在持久化和发布前后注入故障，再使用同一幂等键重试。' }
      - { en: 'Request a large result set and verify pagination plus an explicit public response schema.', zh: '请求大型结果集，并验证分页与明确的公开响应模式。' }
    issues:
      - line: 9
        lines: 14
        kind: security
        note: { en: 'Both methods trust a path tenantId without binding it to the authenticated principal, and list() ignores it entirely. A caller can target another tenant or retrieve all orders.', zh: '两个方法都信任路径中的 tenantId，却没有绑定到已认证主体；list() 甚至完全忽略它。调用方可以指定其他租户，或取得全部订单。' }
      - line: 10
        lines: 6
        kind: edge-case
        note: { en: 'A raw map and manual casts do not validate required fields, types, quantity bounds, or unknown input. Missing and malformed values become server errors or invalid state.', zh: '原始 Map 与手工类型转换没有校验必填字段、类型、数量边界或未知输入。缺失与畸形值会变成服务端错误或非法状态。' }
      - line: 16
        lines: 2
        kind: correctness
        note: { en: 'The database save and event publication are separate effects with no transaction, outbox, or idempotency record. Failure and retry can lose or duplicate the event or order.', zh: '数据库保存与事件发布是两个独立效果，却没有事务、outbox 或幂等记录。故障与重试可能丢失或重复事件或订单。' }
      - line: 4
        lines: 4
        kind: readability
        note: { en: 'Field injection hides required collaborators and permits a partially constructed controller. Constructor injection makes the dependency contract explicit.', zh: '字段注入隐藏了必需协作者，并允许控制器处于部分构造状态。构造器注入可以明确表达依赖契约。' }
      - line: 21
        lines: 2
        kind: performance
        note: { en: 'findAll() is unbounded and materializes every tenant’s orders. A tenant-scoped, deterministically ordered page should cap database and response work.', zh: 'findAll() 没有上限，还会实例化所有租户的订单。按租户限定并确定排序的分页查询，才能限制数据库与响应工作量。' }
    explanation: { en: 'Derive the tenant from verified credentials, accept a validated request DTO, and return an explicit response DTO. Store the order, idempotency record, and outbox event atomically, then publish asynchronously; query only that tenant with deterministic pagination.', zh: '应从已验证凭据取得租户，接收经过校验的请求 DTO，并返回明确的响应 DTO。订单、幂等记录和 outbox 事件要原子保存，再异步发布；查询只能针对该租户，并采用确定排序的分页。' }
    difficulty: advanced
    tags: [code-review, authorization, validation, outbox, pagination]
