topic: backend/elysia
items:
  - id: predict-body-validation-status
    type: predict
    prompt: { en: 'What statuses does this Elysia program print?', zh: '这段 Elysia 程序会输出哪些状态码？' }
    code: |
      import { Elysia, t } from 'elysia'

      const app = new Elysia().post('/orders', ({ body }) => body.quantity, {
        body: t.Object({ quantity: t.Integer({ minimum: 1 }) })
      })

      for (const quantity of [2, 0]) {
        const response = await app.handle(new Request('http://local/orders', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ quantity })
        }))
        console.log(response.status)
      }
    lang: typescript
    options:
      - { text: { en: "200\n200", zh: "200\n200" }, correct: false }
      - { text: { en: "200\n400", zh: "200\n400" }, correct: false }
      - { text: { en: "200\n422", zh: "200\n422" }, correct: true }
      - { text: { en: "201\n422", zh: "201\n422" }, correct: false }
    explanation: { en: 'The first body satisfies the integer minimum and the handler returns with the default 200 status. The second body fails route-schema validation before the handler and receives Elysia’s default 422.', zh: '第一个请求体满足整数下限，处理器以默认的 200 状态返回；第二个请求体在进入处理器前未通过路由模式验证，得到 Elysia 默认的 422。' }
    difficulty: beginner
    tags: [validation, status, predict-output]

  - id: route-schema-boundary
    type: mcq
    prompt: { en: 'What does a declared Elysia body schema provide that a TypeScript interface alone cannot?', zh: '与单独使用 TypeScript 接口相比，Elysia 请求体模式额外提供了什么？' }
    options:
      - { text: { en: 'Runtime rejection of bodies that do not satisfy the schema', zh: '在运行时拒绝不符合模式的请求体' }, correct: true }
      - { text: { en: 'Automatic authorization for every valid body', zh: '自动授权每个请求体有效的调用方' }, correct: false }
      - { text: { en: 'A guarantee that database constraints cannot fail', zh: '保证数据库约束不会失败' }, correct: false }
      - { text: { en: 'A guarantee that every deployed client uses the latest contract', zh: '保证每个已部署客户端都使用最新契约' }, correct: false }
    explanation: { en: 'TypeScript interfaces are erased at runtime. A route schema supplies a runtime validator and a static handler type, but domain rules and deployment compatibility still need separate checks.', zh: 'TypeScript 接口在运行时会被擦除。路由模式既提供运行时验证，也提供静态处理器类型，但领域规则与部署兼容性仍需单独检查。' }
    difficulty: beginner
    tags: [route-schema, runtime-validation, typescript]

  - id: spot-discarded-app-type
    title: { en: 'Spot the bug in Elysia route typing', zh: '找出 Elysia 路由类型里的 bug' }
    type: spotbug
    prompt: { en: 'Why can the Eden client fail to see `/health` even though the route works at runtime?', zh: '为什么 `/health` 在运行时可用，Eden 客户端却可能看不到它？' }
    code: |
      import { treaty } from '@elysia/eden'
      import { Elysia } from 'elysia'

      const app = new Elysia()
      app.get('/health', () => ({ ok: true }))
      type App = typeof app

      const api = treaty<App>('http://localhost:3000')
      await api.health.get()
    lang: typescript
    issues:
      - line: 5
        kind: correctness
        note: { en: 'The route call returns a more specific Elysia instance type, but that return value is discarded. The variable used by `typeof app` keeps the empty-application type, so Eden has no typed `health` path.', zh: '路由调用返回类型更具体的 Elysia 实例，但返回值被丢弃。`typeof app` 使用的变量仍是空应用类型，因此 Eden 没有带类型的 `health` 路径。' }
    explanation: { en: 'Compose routes in one chain and export the type of the final result. Test the runtime route and a compiling Eden call because they prove different properties.', zh: '应通过一条链完成路由组合，并导出最终结果的类型。运行时路由测试与 Eden 编译测试证明的性质不同，两者都要保留。' }
    difficulty: intermediate
    tags: [eden-treaty, type-inference, chaining]

  - id: local-plugin-hook
    type: mcq
    prompt: { en: 'A plugin has a default local `onBeforeHandle` hook and an `/account` route. The parent uses the plugin, then adds `/health`. Which route inherits the hook?', zh: '插件包含默认本地 `onBeforeHandle` 钩子和 `/account` 路由。父应用使用插件后再添加 `/health`。哪条路由会继承该钩子？' }
    options:
      - { text: { en: 'Only `/account`, because it belongs to the plugin instance', zh: '只有属于插件实例的 `/account`' }, correct: true }
      - { text: { en: 'Only `/health`, because it was registered later', zh: '只有注册得更晚的 `/health`' }, correct: false }
      - { text: { en: 'Both routes, because `.use()` always makes hooks global', zh: '两条路由，因为 `.use()` 总会让钩子变成全局钩子' }, correct: false }
      - { text: { en: 'Neither route, because hooks cannot live in plugins', zh: '两条路由都不会，因为插件不能包含钩子' }, correct: false }
    explanation: { en: 'Local hooks are encapsulated in their plugin instance and descendants. Propagating a hook outside that boundary requires an explicit wider scope and careful regression tests.', zh: '本地钩子封装在插件实例及其后代中。要把钩子传播到该边界外，需要显式扩大作用域并执行回归测试。' }
    difficulty: intermediate
    tags: [plugin, lifecycle-hook, scope]

  - id: typed-status-response
    type: mcq
    prompt: { en: 'Why prefer `return status(404, payload)` when a route declares a `404` response schema?', zh: '路由已经声明 `404` 响应模式时，为什么应优先使用 `return status(404, payload)`？' }
    options:
      - { text: { en: 'It binds the status to the payload so TypeScript can check and narrow that response branch.', zh: '它把状态码与负载绑定，使 TypeScript 能检查并收窄该响应分支。' }, correct: true }
      - { text: { en: 'It retries the handler automatically after every 404.', zh: '它会在每次出现 404 后自动重试处理器。' }, correct: false }
      - { text: { en: 'It skips response validation to reduce latency.', zh: '它会跳过响应验证以降低延迟。' }, correct: false }
      - { text: { en: 'It converts every thrown exception into the same payload.', zh: '它会把每个抛出的异常都转换为同一个负载。' }, correct: false }
    explanation: { en: '`status()` preserves the status code in the return type and associates the payload with that status’s schema. Error mapping and retries remain separate concerns.', zh: '`status()` 会在返回类型中保留状态码，并把负载关联到该状态的模式；错误映射和重试仍是独立问题。' }
    difficulty: intermediate
    tags: [response-schema, status, type-narrowing]

  - id: review-generated-order-route
    type: review
    title: { en: 'Review a generated Elysia order route', zh: '审查生成的 Elysia 订单路由' }
    prompt: { en: 'Review this generated Elysia order route before it ships.', zh: '请在发布前审查这段生成的 Elysia 订单路由。' }
    task: { en: 'Create one order for the authenticated actor’s account with a positive whole-number quantity, then publish its event consistently even if a failure is retried.', zh: '为已认证主体所属账户创建一份数量为正整数的订单，并在失败重试时保持订单与事件发布一致。' }
    code: |
      import { Elysia, t } from 'elysia'
      import { db, events } from './services'
      export const app = new Elysia().post(
        '/accounts/:accountId/orders',
        async ({ params, body, headers, status }) => {
          const actorId = headers['x-user-id']
          const account = await db.accounts.find(params.accountId)
          const product = await db.products.find(body.sku)
          if (!product || !account) {
            return status(404, { error: 'Not found' })
          }
          const order = {
            id: crypto.randomUUID(),
            accountId: params.accountId,
            actorId, sku: body.sku, quantity: body.quantity
          }
          await db.orders.insert(order)
          await events.publish('order.created', order)
          return status(201, order)
        },
        { body: t.Object({
          sku: t.String({ minLength: 1 }),
          quantity: t.Number()
        }) }
      )
    lang: typescript
    issues:
      - line: 6
        kind: security
        note: { en: 'The route trusts the caller-controlled `x-user-id` header and never checks that the actor owns `params.accountId`.', zh: '路由信任调用方可控的 `x-user-id` 请求头，且从未检查该主体是否拥有 `params.accountId`。' }
      - line: 7
        kind: performance
        note: { en: 'The independent account and product reads are awaited serially, adding one storage round trip to the request path.', zh: '相互独立的账户与商品读取被串行等待，在请求路径上增加了一次存储往返。' }
      - line: 17
        kind: correctness
        note: { en: 'The order insert and event publish are separate effects with no idempotency key. A publish failure or retry can leave a missing event or create another order.', zh: '订单插入与事件发布是两个独立副作用，也没有幂等键。发布失败或请求重试可能造成事件缺失或再创建一份订单。' }
      - line: 23
        kind: edge-case
        note: { en: '`t.Number()` accepts zero, negative values, and fractions even though the task requires a positive whole-number quantity.', zh: '`t.Number()` 会接受零、负数和小数，但任务要求数量必须为正整数。' }
    right: { en: 'The route uses a resource-oriented path, validates a non-empty SKU, checks referenced records before writing, returns explicit statuses with `status()`, and exports the app without binding a port.', zh: '该路由使用面向资源的路径，验证 SKU 非空，写入前检查关联记录，通过 `status()` 返回明确状态，并且导出应用时不会监听端口。' }
    checklist:
      - { en: 'Derive identity from verified credentials and test access to another actor’s account.', zh: '从已验证凭据中取得身份，并测试访问其他主体的账户。' }
      - { en: 'Test zero, negative, fractional, and valid quantities at the route boundary.', zh: '在路由边界测试零、负数、小数和有效数量。' }
      - { en: 'Trace independent reads and avoid serial waits when neither result depends on the other.', zh: '检查相互独立的读取；若结果互不依赖，应避免串行等待。' }
      - { en: 'Inject failures before and after commit, then retry with the same idempotency key.', zh: '在提交前后注入故障，再使用相同的幂等键重试。' }
    explanation: { en: 'Derive the actor from verified authentication, authorize the account, require `t.Integer({ minimum: 1 })`, and begin independent reads together. Use an idempotency key plus a transactional outbox so retries cannot split or duplicate the durable effects.', zh: '应从已验证的认证信息中取得主体并授权账户，通过 `t.Integer({ minimum: 1 })` 限制数量，再同时发起相互独立的读取。使用幂等键和事务性 outbox，避免重试拆分或重复持久化副作用。' }
    difficulty: advanced
    minutes: 10
    tags: [code-review, elysia, validation, idempotency]
