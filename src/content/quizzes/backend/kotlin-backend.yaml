topic: backend/kotlin-backend
items:
  - id: predict-sealed-boundary
    type: predict
    prompt: { en: 'What does this boundary parser print?', zh: '这个边界解析器会输出什么？' }
    code: |
      sealed interface Quantity {
          data class Valid(val value: Int) : Quantity
          data class Invalid(val raw: String?) : Quantity
      }

      fun parse(raw: String?): Quantity {
          val value = raw?.trim()?.toIntOrNull()
          return if (value != null && value in 1..10) {
              Quantity.Valid(value)
          } else {
              Quantity.Invalid(raw)
          }
      }

      fun main() {
          println(listOf(" 3 ", "0", null).map(::parse))
      }
    lang: kotlin
    options:
      - { text: { en: '[Valid(value=3), Invalid(raw=0), Invalid(raw=null)]', zh: '[Valid(value=3), Invalid(raw=0), Invalid(raw=null)]' }, correct: true }
      - { text: { en: '[Valid(value=3), Valid(value=0), Invalid(raw=null)]', zh: '[Valid(value=3), Valid(value=0), Invalid(raw=null)]' }, correct: false }
      - { text: { en: 'The program throws NumberFormatException for null.', zh: '程序会因为 null 抛出 NumberFormatException。' }, correct: false }
      - { text: { en: 'The program does not compile because raw is nullable.', zh: '程序无法编译，因为 raw 是可空类型。' }, correct: false }
    explanation: { en: 'Safe calls and toIntOrNull keep absent or malformed input in the failure branch. The range check rejects zero after parsing succeeds.', zh: '安全调用与 toIntOrNull 会让缺失或格式错误的输入进入失败分支；零虽然解析成功，仍会被范围检查拒绝。' }
    difficulty: beginner
    tags: [sealed-type, validation, predict-output]

  - id: suspend-versus-blocking
    type: mcq
    prompt: { en: 'What does adding `suspend` to a function that calls blocking JDBC guarantee?', zh: '给调用阻塞式 JDBC 的函数加上 `suspend`，能保证什么？' }
    options:
      - { text: { en: 'The JDBC call releases its thread while waiting.', zh: 'JDBC 调用在等待时会释放线程。' }, correct: false }
      - { text: { en: 'The function may call suspending APIs, but JDBC remains blocking.', zh: '函数可以调用挂起 API，但 JDBC 仍然阻塞。' }, correct: true }
      - { text: { en: 'The database transaction becomes cancellable.', zh: '数据库事务会自动变得可取消。' }, correct: false }
      - { text: { en: 'Ktor moves the call to Dispatchers.IO automatically.', zh: 'Ktor 会自动把该调用移到 Dispatchers.IO。' }, correct: false }
    explanation: { en: '`suspend` changes how a function may suspend; it does not rewrite a blocking dependency. Isolate the call and configure its own timeout and pool.', zh: '`suspend` 改变的是函数挂起方式，不会改写阻塞依赖；应隔离该调用，并配置它自己的超时与连接池。' }
    difficulty: intermediate
    tags: [coroutines, blocking-io, dispatcher]

  - id: spot-detached-route-work
    title: { en: 'Spot the bug in notification launch', zh: '找出通知启动里的 bug' }
    type: spotbug
    prompt: { en: 'Why can this generated notification disappear after a successful response?', zh: '为什么这段生成代码在响应成功后仍可能丢失通知？' }
    code: |
      fun Route.orderRoutes(service: OrderService, mailer: Mailer) {
          post("/orders") {
              val request = call.receive<CreateOrderRequest>()
              val order = service.create(request)

              GlobalScope.launch {
                  mailer.sendConfirmation(order)
              }
              call.respond(HttpStatusCode.Created, order.toResponse())
          }
      }
    lang: kotlin
    issues:
      - line: 6
        kind: correctness
        note: { en: 'GlobalScope detaches notification delivery from both request completion and application shutdown, so the process can exit before delivery finishes.', zh: 'GlobalScope 会让通知投递同时脱离请求完成与应用关闭流程，因此进程可能在投递完成前退出。' }
    explanation: { en: 'Durable post-response work belongs in a persistent queue or outbox. Work required for the response should remain a child of the request scope.', zh: '可靠的响应后任务应进入持久队列或 outbox；响应所需工作则应继续作为请求作用域的子任务。' }
    difficulty: intermediate
    tags: [global-scope, lifecycle, durability]

  - id: async-await-order
    type: mcq
    prompt: { en: 'Which shape actually starts two independent calls before waiting for either result?', zh: '哪种写法会先启动两个独立调用，再等待任一结果？' }
    options:
      - { text: { en: '`val a = async { first() }.await(); val b = async { second() }.await()`', zh: '`val a = async { first() }.await(); val b = async { second() }.await()`' }, correct: false }
      - { text: { en: '`val a = async { first() }; val b = async { second() }; use(a.await(), b.await())`', zh: '`val a = async { first() }; val b = async { second() }; use(a.await(), b.await())`' }, correct: true }
      - { text: { en: '`val a = first(); val b = second(); use(a, b)`', zh: '`val a = first(); val b = second(); use(a, b)`' }, correct: false }
      - { text: { en: '`GlobalScope.async { first(); second() }.await()`', zh: '`GlobalScope.async { first(); second() }.await()`' }, correct: false }
    explanation: { en: 'Both Deferred values must be created before the first await if the calls should overlap. They should also be children of the current structured scope.', zh: '若要让调用重叠，必须在第一次 await 前创建两个 Deferred；它们还应属于当前结构化作用域。' }
    difficulty: intermediate
    tags: [async, await, structured-concurrency]

  - id: spot-swallowed-cancellation
    title: { en: 'Spot the bug in the coroutine error mapper', zh: '找出协程错误映射器里的 bug' }
    type: spotbug
    prompt: { en: 'What coroutine signal does this error mapper accidentally convert into a server error?', zh: '这个错误映射器误把哪种协程信号转换成了服务端错误？' }
    code: |
      suspend fun loadOrder(id: Long): ApiResult {
          return try {
              val order = repository.find(id)
              ApiResult.Ok(order)
          } catch (error: Exception) {
              logger.error("load failed", error)
              ApiResult.Failed("internal_error")
          }
      }
    lang: kotlin
    issues:
      - line: 5
        kind: correctness
        note: { en: 'CancellationException is an Exception; converting it to a value prevents cancellation from propagating through this boundary.', zh: 'CancellationException 属于 Exception；把它转换成普通值会阻止取消越过该边界传播。' }
    explanation: { en: 'Let cancellation propagate, or catch CancellationException first and rethrow it. Map expected domain failures separately from unexpected exceptions.', zh: '应让取消继续传播，或先捕获并重新抛出 CancellationException；预期领域失败与意外异常要分别映射。' }
    difficulty: advanced
    tags: [cancellation, exception-handling, propagation]

  - id: review-generated-order-route
    type: review
    title: { en: 'Review a generated Ktor order route', zh: '审查生成的 Ktor 订单路由' }
    prompt: { en: 'Review this route before it accepts production orders.', zh: '在这条路由接收生产订单前，对它进行审查。' }
    task: { en: 'Authenticate the tenant, validate an order, create it durably and idempotently, and publish a notification after commit.', zh: '认证租户、校验订单、以持久且幂等的方式创建订单，并在提交后发布通知。' }
    code: |
      fun Route.orderRoutes(
          service: OrderService,
          notifications: Notifications,
      ) {
          post("/orders") {
              val request = call.receive<CreateOrderRequest>()
              val tenantId = call.request.headers["X-Tenant"]!!
              val key = call.request.headers["Idempotency-Key"]

              val existing = service.findByKey(key)
              if (existing != null) return@post call.respond(existing)

              val order = service.create(tenantId, request)
              GlobalScope.launch {
                  notifications.send(order)
              }

              call.respond(HttpStatusCode.Created, order)
          }
      }
    lang: kotlin
    issues:
      - line: 6
        kind: edge-case
        note: { en: 'Deserialization does not reject blank SKUs, invalid quantities, or every unwanted field; the route needs runtime validation and normalization.', zh: '反序列化不会拒绝空 SKU、非法数量或所有多余字段；路由需要运行时校验与规范化。' }
      - line: 7
        kind: security
        note: { en: 'The caller controls X-Tenant and a missing header crashes through `!!`; tenant scope must come from an authenticated and authorized principal.', zh: '调用方可以控制 X-Tenant，缺失请求头还会通过 `!!` 触发崩溃；租户范围必须来自经过认证与授权的主体。' }
      - line: 10
        kind: correctness
        note: { en: 'The separate lookup and create are not atomic, so concurrent retries can both create an order; null keys can also collapse unrelated requests.', zh: '分开的查询与创建不是原子操作，并发重试可能各自创建订单；空键还可能把无关请求混在一起。' }
      - line: 14
        kind: performance
        note: { en: 'One detached coroutine per request has no admission limit or shutdown coordination and can accumulate when notification delivery slows.', zh: '每个请求启动一个脱离作用域的协程，没有准入上限或关闭协调；通知变慢时任务会持续堆积。' }
    right: { en: 'The route returns 201 for creation and receives its service and notification dependencies explicitly.', zh: '这条路由为创建操作返回 201，并且显式接收服务与通知依赖。' }
    checklist:
      - { en: 'Derive tenant scope from an authenticated principal and authorize the operation.', zh: '从认证主体推导租户范围，并对操作执行授权。' }
      - { en: 'Validate and normalize all transport input before calling the service.', zh: '调用服务前，校验并规范化所有传输输入。' }
      - { en: 'Atomically store the idempotency key, request fingerprint, order, and response.', zh: '原子保存幂等键、请求指纹、订单与响应。' }
      - { en: 'Publish through a transactional outbox and make the consumer idempotent.', zh: '通过事务 outbox 发布，并让消费者具备幂等性。' }
    explanation: { en: 'Move trust decisions to authentication and validation boundaries, and put deduplication beside the durable write. An outbox closes the commit-to-publish loss window without detaching work from an owner.', zh: '应在认证与校验边界做出信任决策，并让去重与持久写入相邻；outbox 可以关闭提交到发布之间的丢失窗口，而无需让任务脱离所有者。' }
    difficulty: advanced
    minutes: 8
    tags: [code-review, security, idempotency, coroutines]
