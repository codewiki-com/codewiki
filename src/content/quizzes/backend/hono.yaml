topic: backend/hono
items:
  - id: predict-middleware-unwind
    type: predict
    prompt: { en: 'What does this Hono program print?', zh: '这段 Hono 程序会输出什么？' }
    code: |
      import { Hono } from 'hono'

      const events: string[] = []
      const app = new Hono()

      app.use(async (c, next) => {
        events.push('outer:start')
        await next()
        events.push('outer:end')
      })

      app.get('/', (c) => {
        events.push('handler')
        return c.text('ok')
      })

      await app.request('/')
      console.log(events.join(' > '))
    lang: typescript
    options:
      - { text: { en: 'outer:start > outer:end > handler', zh: 'outer:start > outer:end > handler' }, correct: false }
      - { text: { en: 'outer:start > handler > outer:end', zh: 'outer:start > handler > outer:end' }, correct: true }
      - { text: { en: 'handler > outer:start > outer:end', zh: 'handler > outer:start > outer:end' }, correct: false }
      - { text: { en: 'outer:start > handler', zh: 'outer:start > handler' }, correct: false }
    explanation: { en: 'The middleware runs its request phase, awaits the handler, and resumes with its response phase. This is Hono’s onion-style middleware flow.', zh: '中间件先执行请求阶段，等待处理器结束，再继续执行响应阶段；这就是 Hono 的洋葱式中间件流程。' }
    difficulty: beginner
    tags: [middleware, onion-model, predict-output]

  - id: runtime-validation-boundary
    type: mcq
    prompt: { en: 'What does `await c.req.json<OrderInput>()` guarantee about an incoming body?', zh: '`await c.req.json<OrderInput>()` 对传入请求体提供什么保证？' }
    options:
      - { text: { en: 'It validates every field at runtime before returning.', zh: '它会在返回前对每个字段执行运行时验证。' }, correct: false }
      - { text: { en: 'It changes the static TypeScript type but does not validate the network data.', zh: '它改变 TypeScript 静态类型，但不会验证网络数据。' }, correct: true }
      - { text: { en: 'It authorizes the caller to create an order.', zh: '它会授权调用方创建订单。' }, correct: false }
      - { text: { en: 'It rejects every unknown field automatically.', zh: '它会自动拒绝所有未知字段。' }, correct: false }
    explanation: { en: 'A generic type argument is erased with the rest of the TypeScript types. A route validator must inspect the parsed value at runtime and pass a cleaned result to the handler.', zh: '泛型类型实参与其他 TypeScript 类型一样会被擦除。路由验证器必须在运行时检查解析值，再把清洗结果交给处理器。' }
    difficulty: beginner
    tags: [typescript, runtime-validation, request-body]

  - id: spot-late-auth-middleware
    title: { en: 'Spot the bug in Hono admin middleware', zh: '找出 Hono 管理中间件里的 bug' }
    type: spotbug
    prompt: { en: 'Why is `/admin/report` not protected by this generated middleware?', zh: '为什么生成代码中的 `/admin/report` 没有受到该中间件保护？' }
    code: |
      import { Hono } from 'hono'

      const app = new Hono()

      app.get('/admin/report', (c) => {
        return c.json({ revenue: 4200 })
      })

      app.use('/admin/*', async (c, next) => {
        if (c.req.header('authorization') !== 'Bearer valid') {
          return c.json({ error: 'Unauthorized' }, 401)
        }
        await next()
      })
    lang: typescript
    issues:
      - line: 9
        kind: security
        note: { en: 'Hono registration order has semantics. This middleware is registered after the report route, so that earlier route does not traverse the authentication check.', zh: 'Hono 的注册顺序具有语义。该中间件在报表路由之后登记，因此前面的路由不会经过认证检查。' }
    explanation: { en: 'Register authentication middleware before every route it protects, then test each protected route with missing and invalid credentials.', zh: '应在所有受保护路由之前登记认证中间件，再用缺失和无效凭据测试每条受保护路由。' }
    difficulty: intermediate
    tags: [middleware-order, authentication, security]

  - id: rpc-final-route-type
    type: mcq
    prompt: { en: 'Which type should an `hc` client receive for reliable route inference?', zh: '`hc` 客户端应接收哪一种类型，才能可靠推导路由？' }
    options:
      - { text: { en: 'The type of the final chained route declaration', zh: '最终链式路由声明的类型' }, correct: true }
      - { text: { en: 'The type of a new empty Hono application', zh: '新建空 Hono 应用的类型' }, correct: false }
      - { text: { en: 'The runtime type of a JSON response body', zh: 'JSON 响应体的运行时类型' }, correct: false }
      - { text: { en: 'Any interface with a string index signature', zh: '任意带字符串索引签名的接口' }, correct: false }
    explanation: { en: 'The final chained value carries the registered route information in its TypeScript type. The client cannot infer routes that are absent from the exported type.', zh: '最终链式值会在 TypeScript 类型中携带已登记路由信息。导出类型中缺少的路由，客户端无法推导。' }
    difficulty: intermediate
    tags: [hono-rpc, type-inference, chaining]

  - id: portability-boundary
    type: mcq
    prompt: { en: 'What must still be audited before moving a Web-standard Hono application to another runtime?', zh: '把基于 Web 标准的 Hono 应用迁移到另一运行时前，还必须审查什么？' }
    options:
      - { text: { en: 'Platform bindings, dependencies, background-work APIs, and persistent-state assumptions', zh: '平台绑定、依赖、后台任务 API 与持久状态假设' }, correct: true }
      - { text: { en: 'Only the spelling of route paths', zh: '只需检查路由路径的拼写' }, correct: false }
      - { text: { en: 'Only whether TypeScript compilation succeeds', zh: '只需检查 TypeScript 是否编译成功' }, correct: false }
      - { text: { en: 'Nothing, because `Request` and `Response` make every dependency portable', zh: '无需审查，因为 `Request` 与 `Response` 会让所有依赖都可移植' }, correct: false }
    explanation: { en: 'Hono normalizes the HTTP layer, not every database driver, environment mechanism, file API, or lifecycle. A target-runtime smoke test complements the dependency audit.', zh: 'Hono 统一的是 HTTP 层，而不是所有数据库驱动、环境机制、文件 API 或生命周期。依赖审查后还要执行目标运行时冒烟测试。' }
    difficulty: intermediate
    tags: [portability, edge-runtime, deployment]

  - id: review-generated-order-route
    type: review
    title: { en: 'Review a generated Hono order route', zh: '审查生成的 Hono 订单路由' }
    prompt: { en: 'Review this generated route before it handles production orders.', zh: '在这段生成路由处理生产订单前，对它进行审查。' }
    task: { en: 'Authenticate the actor, validate one order, create it durably and idempotently, and enqueue a notification only after a successful commit.', zh: '认证主体、验证订单、以持久且幂等的方式创建订单，并且只在成功提交后发送通知。' }
    code: |
      import { Hono } from 'hono'

      type Order = { id: string; tenantId: string; key: string | undefined; sku: string; quantity: number }
      type Bindings = { NOTIFICATIONS: { send(message: Order): Promise<void> } }
      const orders: Order[] = []

      const app = new Hono<{ Bindings: Bindings }>()

      app.post('/orders', async (c) => {
        const body = await c.req.json() as { sku: string; quantity: number }
        const tenantId = c.req.header('x-tenant-id')!
        const key = c.req.header('idempotency-key')

        const existing = orders.find((order) => order.key === key)
        if (existing) return c.json(existing, 201)

        const order = {
          id: crypto.randomUUID(), tenantId, key,
          sku: body.sku, quantity: body.quantity,
        }

        orders.push(order)
        c.env.NOTIFICATIONS.send(order)
        return c.json(order, 201)
      })
    lang: typescript
    issues:
      - line: 10
        kind: edge-case
        note: { en: 'The type assertion does not validate malformed JSON, missing fields, blank SKUs, non-integer quantities, or bounds.', zh: '类型断言不会验证畸形 JSON、缺失字段、空 SKU、非整数数量或取值边界。' }
      - line: 11
        kind: security
        note: { en: 'The caller controls `x-tenant-id`; trusting it without authenticated principal and authorization checks enables cross-tenant writes.', zh: '调用方可以控制 `x-tenant-id`；在没有认证主体与授权检查时信任它，会造成跨租户写入。' }
      - line: 14
        kind: performance
        note: { en: 'Every request scans an unbounded process-local array, so lookup cost and memory use grow with all orders and cannot work across instances.', zh: '每次请求都会扫描无界的进程内数组，因此查找成本与内存随全部订单增长，而且无法跨实例工作。' }
      - line: 23
        kind: correctness
        note: { en: 'The notification is neither awaited nor coordinated with a durable commit, so failure can be lost and retries can create duplicate effects.', zh: '通知既没有被等待，也没有与持久提交协调，因此故障可能丢失，重试还可能产生重复副作用。' }
    right: { en: 'The generated route uses a clear creation status and returns an identifier with the created representation.', zh: '生成路由使用了明确的创建状态，并在创建后的表示中返回标识符。' }
    checklist:
      - { en: 'Authenticate first and derive tenant scope from the verified principal.', zh: '先完成认证，并从已验证主体推导租户范围。' }
      - { en: 'Validate and normalize every untrusted input at the route boundary.', zh: '在路由边界验证并规范化所有不可信输入。' }
      - { en: 'Atomically store the idempotency key, request fingerprint, order, and result.', zh: '原子保存幂等键、请求指纹、订单与结果。' }
      - { en: 'Publish notifications through an outbox or another commit-aware mechanism.', zh: '通过 outbox 或其他感知提交的机制发布通知。' }
    explanation: { en: 'Use authentication and runtime validation before domain work, then put order creation and idempotency in durable atomic storage. A transactional outbox can make notification delivery recoverable after commit.', zh: '应在领域操作前执行认证与运行时验证，再用持久原子存储实现订单创建和幂等性。事务 outbox 可以让提交后的通知投递具备恢复能力。' }
    difficulty: advanced
    minutes: 8
    tags: [code-review, security, validation, idempotency, outbox]
