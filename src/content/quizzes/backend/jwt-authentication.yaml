topic: backend/jwt-authentication
items:
  - id: predict-decode-without-verify
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      const payload = Buffer.from(
        JSON.stringify({ sub: 'user-42', role: 'admin' })
      ).toString('base64url');
      const token = `header.${payload}.forged`;
      const claims = JSON.parse(
        Buffer.from(token.split('.')[1], 'base64url')
      );
      console.log(claims.role);
    lang: javascript
    options:
      - { text: { en: 'admin', zh: 'admin' }, correct: true }
      - { text: { en: 'undefined', zh: 'undefined' }, correct: false }
      - { text: { en: 'It throws because the signature is forged.', zh: '程序因签名伪造而抛出异常。' }, correct: false }
    explanation: { en: 'Base64url decoding does not check a signature. The forged payload is readable and must remain untrusted.', zh: 'Base64url 解码不会检查签名。伪造的 payload 仍可读取，但结果不可信。' }
    difficulty: beginner
    tags: [jwt, predict-output, signature]

  - id: algorithm-source
    type: mcq
    prompt: { en: 'Where should a JWT verifier get its allowed algorithms?', zh: 'JWT 验证器应从哪里取得允许的算法？' }
    options:
      - { text: { en: 'From server-side policy bound to the token kind and key', zh: '从服务端策略取得，并绑定令牌类型和密钥' }, correct: true }
      - { text: { en: 'From the unverified alg header alone', zh: '只从未经验证的 alg header 取得' }, correct: false }
      - { text: { en: 'From whichever algorithm makes verification succeed', zh: '尝试算法，采用任何能让验证成功的算法' }, correct: false }
    explanation: { en: 'The header can identify an expected configured algorithm, but it cannot expand the verifier’s allowlist. Each key should be restricted to one algorithm.', zh: 'Header 可以标识策略中预期的算法，却不能扩大验证器的允许列表。每把密钥都应限制为一种算法。' }
    difficulty: intermediate
    tags: [jwt, algorithm-allowlist]

  - id: signature-is-not-policy
    type: mcq
    prompt: { en: 'A token has a valid signature and has not expired. Which check still prevents use at the wrong API?', zh: '一个令牌签名有效且尚未过期。哪项检查仍能防止它被错误的 API 使用？' }
    options:
      - { text: { en: 'Require the current API in the aud claim.', zh: '要求 aud 声明包含当前 API。' }, correct: true }
      - { text: { en: 'Decode the payload a second time.', zh: '再次解码 payload。' }, correct: false }
      - { text: { en: 'Accept any token from the same browser.', zh: '接受同一浏览器发送的任何令牌。' }, correct: false }
    explanation: { en: 'Audience validation binds a token to intended recipients. Issuer and token-type checks are also needed for a complete policy.', zh: '受众验证把令牌限制给预期接收者。完整策略还需要检查签发者和令牌类型。' }
    difficulty: intermediate
    tags: [jwt, audience, claim-validation]

  - id: review-generated-middleware
    type: review
    prompt: { en: 'Review this generated JWT middleware. Find the trust and time-validation flaws.', zh: '审查这段生成的 JWT 中间件，找出信任边界和时间验证缺陷。' }
    code: |
      function authenticate(token) {
        const [headerPart, payloadPart, signature] = token.split('.');
        const header = decodeJson(headerPart);
        const claims = decodeJson(payloadPart);
        const key = readFileSync(`/srv/keys/${header.kid}.pem`);
        verifySignature(header.alg, key, headerPart, payloadPart, signature);
        if (claims.exp < Date.now()) throw new Error('expired');
        return { subject: claims.sub, role: claims.role };
      }
    lang: javascript
    issues:
      - line: 5
        kind: security
        note: { en: 'Untrusted kid is interpolated into a path, allowing path traversal and key selection outside an issuer-bound allowlist.', zh: '未经信任的 kid 被拼进路径，可能造成路径遍历，并绕过绑定签发者的密钥允许列表。' }
      - line: 6
        kind: security
        note: { en: 'The untrusted alg selects verification behavior. The algorithm must come from server policy and be bound to the selected key.', zh: '未经信任的 alg 决定了验证行为。算法必须来自服务端策略，并与所选密钥绑定。' }
      - line: 7
        kind: bug
        note: { en: 'JWT exp is in seconds while Date.now() is in milliseconds, so an otherwise valid token is normally treated as expired.', zh: 'JWT exp 使用秒，Date.now() 使用毫秒，因此正常有效的令牌通常会被误判为过期。' }
      - line: 8
        kind: security
        note: { en: 'The code returns identity without validating issuer, audience, token type, or the subject type.', zh: '代码没有验证签发者、受众、令牌类型和主体类型，就返回了身份。' }
    explanation: { en: 'Use a maintained verifier configured with an issuer-bound key set, a fixed algorithm and token type, required claims, audience, and NumericDate handling. Return only normalized claims after every check succeeds.', zh: '应使用成熟验证器，并配置绑定签发者的密钥集、固定算法与令牌类型、必需声明、受众和 NumericDate 处理。全部检查通过后，只返回规范化声明。' }
    difficulty: advanced
    tags: [jwt, code-review, security]
