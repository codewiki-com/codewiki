topic: backend/jwt-authentication
items:
  - id: predict-decode-without-verify
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      const payload = Buffer.from(
        JSON.stringify({ sub: 'user-42', role: 'admin' })
      ).toString('base64url');
      const token = `header.${payload}.forged`;
      const claims = JSON.parse(
        Buffer.from(token.split('.')[1], 'base64url')
      );
      console.log(claims.role);
    lang: javascript
    options:
      - { text: { en: 'admin', zh: 'admin' }, correct: true }
      - { text: { en: 'undefined', zh: 'undefined' }, correct: false }
      - { text: { en: 'It throws because the signature is forged.', zh: '程序因签名伪造而抛出异常。' }, correct: false }
    explanation: { en: 'Base64url decoding does not check a signature. The forged payload is readable and must remain untrusted.', zh: 'Base64url解码不会检查签名。伪造的payload仍可读取，但结果不可信。' }
    difficulty: beginner
    tags: [jwt, predict-output, signature]

  - id: algorithm-source
    type: mcq
    prompt: { en: 'Where should a JWT verifier get its allowed algorithms?', zh: 'JWT验证器应从哪里取得允许的算法？' }
    options:
      - { text: { en: 'From server-side policy bound to the token kind and key', zh: '从服务端策略取得，并绑定令牌类型和密钥' }, correct: true }
      - { text: { en: 'From the unverified alg header alone', zh: '只从未经验证的alg header取得' }, correct: false }
      - { text: { en: 'From whichever algorithm makes verification succeed', zh: '尝试算法，采用任何能让验证成功的算法' }, correct: false }
    explanation: { en: 'The header can identify an expected configured algorithm, but it cannot expand the verifier’s allowlist. Each key should be restricted to one algorithm.', zh: 'Header可以标识策略中预期的算法，却不能扩大验证器的允许列表。每把密钥都应限制为一种算法。' }
    difficulty: intermediate
    tags: [jwt, algorithm-allowlist]

  - id: signature-is-not-policy
    type: mcq
    prompt: { en: 'A token has a valid signature and has not expired. Which check still prevents use at the wrong API?', zh: '一个令牌签名有效且尚未过期。哪项检查仍能防止它被错误的API使用？' }
    options:
      - { text: { en: 'Require the current API in the aud claim.', zh: '要求aud声明包含当前API。' }, correct: true }
      - { text: { en: 'Decode the payload a second time.', zh: '再次解码payload。' }, correct: false }
      - { text: { en: 'Accept any token from the same browser.', zh: '接受同一浏览器发送的任何令牌。' }, correct: false }
    explanation: { en: 'Audience validation binds a token to intended recipients. Issuer and token-type checks are also needed for a complete policy.', zh: '受众验证把令牌限制给预期接收者。完整策略还需要检查签发者和令牌类型。' }
    difficulty: intermediate
    tags: [jwt, audience, claim-validation]

  - id: review-generated-middleware
    title: { en: 'Review generated JWT middleware', zh: '审查生成的JWT中间件' }
    type: review
    prompt: { en: 'Review this generated JWT middleware. Find the trust and time-validation flaws.', zh: '审查这段生成的JWT中间件，找出信任边界和时间验证缺陷。' }
    task: { en: 'Verify a bearer access token for the inventory API and return a normalized principal without blocking the request path.', zh: '验证库存API的bearer access token，在不阻塞请求路径的前提下返回规范化主体。' }
    code: |
      const { readFileSync } = require('node:fs');

      function authenticate(token, request) {
        const [headerPart, payloadPart, signature] = token.split('.');
        const header = decodeJson(headerPart);
        const claims = decodeJson(payloadPart);
        const key = readFileSync(`/srv/keys/${header.kid}.pem`);
        verifySignature(header.alg, key, headerPart, payloadPart, signature);
        if (claims.exp < Date.now()) throw new Error('expired');
        const scopes = Array.isArray(claims.scope)
          ? claims.scope
          : claims.scope.split(' ');
        auditLog('token accepted', claims);
        return {
          subject: claims.sub,
          role: claims.role,
          scopes,
          route: request.url,
        };
      }
    lang: javascript
    issues:
      - line: 4
        kind: edge-case
        note: { en: 'Destructuring accepts missing or extra segments and sends malformed data into decoders instead of rejecting one exact three-segment token.', zh: '解构会接受缺失或多余的分段，把畸形数据送进解码器，而不是只接受恰好包含三段的令牌。' }
      - line: 7
        kind: performance
        note: { en: 'Synchronous file I/O runs for every request and blocks the event-loop thread instead of using a cached issuer-bound key set.', zh: '每个请求都会执行同步文件I/O并阻塞事件循环线程，而不是使用缓存且绑定签发者的密钥集。' }
      - line: 7
        lines: 2
        kind: security
        note: { en: 'Untrusted kid controls a path and untrusted alg selects verification behavior; neither is constrained by an issuer-bound key and algorithm policy.', zh: '未经信任的kid控制路径，未经信任的alg选择验证行为；二者都没有受到绑定签发者的密钥与算法策略约束。' }
      - line: 9
        kind: correctness
        note: { en: 'JWT exp is in seconds while Date.now() is in milliseconds, so an otherwise valid token is normally treated as expired.', zh: 'JWT exp使用秒，Date.now() 使用毫秒，因此正常有效的令牌通常会被误判为过期。' }
      - line: 13
        kind: readability
        note: { en: 'Logging the complete claims object hides the intended audit schema and may copy bearer data or sensitive claims into long-lived logs.', zh: '记录完整claims对象会掩盖预期的审计模式，还可能把bearer数据或敏感声明写入长期日志。' }
    right: { en: 'The generated code separates parsing from signature verification and returns a small principal object instead of exposing the original token.', zh: '生成代码把解析与签名验证分开，并返回较小的主体对象，而不是暴露原始令牌。' }
    checklist:
      - { en: 'Reject malformed tokens before decoding any segment.', zh: '解码任何分段前，先拒绝畸形令牌。' }
      - { en: 'Bind issuer, key, algorithm, type, audience, and required claims in server policy.', zh: '在服务端策略中绑定签发者、密钥、算法、类型、受众和必需声明。' }
      - { en: 'Use NumericDate seconds and test expiry and not-before boundaries.', zh: '使用NumericDate秒值，并测试过期与生效时间边界。' }
      - { en: 'Allowlist audit fields and keep key lookup off the synchronous request path.', zh: '对审计字段使用允许列表，并避免在同步请求路径查找密钥。' }
    explanation: { en: 'Use a maintained verifier configured with an issuer-bound key set, a fixed algorithm and token type, required claims, audience, and NumericDate handling. Return only normalized claims after every check succeeds.', zh: '应使用成熟验证器，并配置绑定签发者的密钥集、固定算法与令牌类型、必需声明、受众和NumericDate处理。全部检查通过后，只返回规范化声明。' }
    difficulty: advanced
    tags: [jwt, code-review, security]
