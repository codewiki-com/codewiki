topic: backend/restful-api-design
items:
  - id: predict-resource-handler
    type: predict
    prompt: { en: 'What does this resource handler print?', zh: '这个资源处理器会输出什么？' }
    code: |
      function getOrder(id, orders) {
        const order = orders.get(id);
        return order
          ? { status: 200, body: order }
          : { status: 404, body: { title: "Not Found" } };
      }

      const orders = new Map([["ord-7", { id: "ord-7" }]]);
      console.log(getOrder("ord-7", orders).status);
      console.log(getOrder("ord-8", orders).status);
    lang: javascript
    options:
      - { text: { en: '200, then 404', zh: '先输出 200，再输出 404' }, correct: true }
      - { text: { en: '200, then 200', zh: '先输出 200，再输出 200' }, correct: false }
      - { text: { en: '201, then 404', zh: '先输出 201，再输出 404' }, correct: false }
      - { text: { en: 'The missing key throws.', zh: '缺失键会导致异常。' }, correct: false }
    explanation: { en: 'The first map lookup finds a representation and returns 200. The second misses and returns the explicit 404 branch.', zh: '第一次 Map 查询找到了表示，因此返回 200；第二次没有找到，进入明确的 404 分支。' }
    difficulty: beginner
    tags: [resource, status-code, predict-output]

  - id: method-semantics
    type: mcq
    prompt: { en: 'Which statement describes HTTP idempotency correctly?', zh: '哪项说法正确描述了 HTTP 幂等性？' }
    options:
      - { text: { en: 'Repeated identical requests have the same intended server effect as one request, although responses may differ.', zh: '重复相同请求的预期服务端效果与一次请求相同，但响应可以不同。' }, correct: true }
      - { text: { en: 'Every idempotent request is read-only and has no server-side effects.', zh: '所有幂等请求都只读，不会产生任何服务端效果。' }, correct: false }
      - { text: { en: 'An operation is idempotent only when every retry returns the same status and body.', zh: '只有每次重试都返回相同状态码与响应体时，操作才幂等。' }, correct: false }
      - { text: { en: 'POST is automatically idempotent whenever it returns 201.', zh: '只要 POST 返回 201，它就自动具有幂等性。' }, correct: false }
    explanation: { en: 'Idempotency concerns the intended effect on server state. A repeated DELETE can return a different status after the resource is gone and still remain idempotent.', zh: '幂等性关注服务端状态上的预期效果。资源删除后，重复 DELETE 可以返回不同状态码，同时仍保持幂等。' }
    difficulty: intermediate
    tags: [idempotency, method-semantics]

  - id: spot-nonatomic-precondition
    type: spotbug
    prompt: { en: 'Find the lost-update flaw in this generated replacement handler.', zh: '找出这段生成的替换处理器中的丢失更新缺陷。' }
    code: |
      async function replaceOrder(id, input, ifMatch, db) {
        const current = await db.orders.find(id);
        if (!current) return { status: 404 };
        if (ifMatch !== `"order-${current.version}"`) {
          return { status: 412 };
        }
        const next = { id, status: input.status, version: current.version + 1 };
        await db.orders.update(id, next);
        return { status: 200, body: next };
      }
    lang: javascript
    issues:
      - line: 8
        kind: correctness
        note: { en: 'The update is unconditional after a separate read and comparison. Two writers can both pass the check and the later save can erase the first.', zh: '代码在独立读取和比较后执行无条件更新。两个写入者可能同时通过检查，后保存的一方会抹掉前一次更新。' }
    explanation: { en: 'Carry the version predicate into one conditional database update or transaction and treat zero updated rows as a failed precondition.', zh: '应把版本条件带入同一条数据库条件更新或事务，并把更新行数为零视为前置条件失败。' }
    difficulty: intermediate
    tags: [etag, conditional-request, lost-update]

  - id: stable-cursor
    type: mcq
    prompt: { en: 'Orders are sorted by a non-unique createdAt field. What must a cursor add?', zh: '订单按不唯一的 createdAt 字段排序。游标还必须加入什么？' }
    options:
      - { text: { en: 'A unique tie-breaker such as order id in both the ordering and cursor', zh: '在排序和游标中都加入订单 ID 等唯一决胜字段' }, correct: true }
      - { text: { en: 'A larger default page size', zh: '更大的默认页大小' }, correct: false }
      - { text: { en: 'A random value generated for each page', zh: '为每一页生成的随机值' }, correct: false }
      - { text: { en: 'The approximate total number of rows', zh: '近似总行数' }, correct: false }
    explanation: { en: 'A cursor needs a deterministic total order. A unique tie-breaker gives the next query an exact continuation point among equal timestamps.', zh: '游标需要确定的全序。唯一决胜字段能让下一次查询在时间戳相同时找到准确的继续位置。' }
    difficulty: intermediate
    tags: [cursor-pagination, ordering, tie-breaker]

  - id: review-generated-order-creation
    type: review
    prompt: { en: 'Review this generated order-creation endpoint before release.', zh: '发布前审查这段生成的订单创建端点。' }
    task: { en: 'Create an order for an authorized account, charge an exact positive amount once, expose only the public representation, and let the caller retry an unknown result safely.', zh: '为已授权账户创建订单，对精确的正数金额只扣款一次，只公开公共表示，并允许调用方安全重试结果未知的请求。' }
    code: |
      async function createOrder(request, db, payments) {
        const body = await request.json();
        const key = request.headers.get("Idempotency-Key");
        const accountId = body.accountId;
        const order = {
          id: crypto.randomUUID(),
          accountId,
          total: Number(body.total),
          status: "paid",
          internalNote: body.internalNote,
        };
        await db.orders.insert(order);
        await payments.charge(accountId, order.total);
        return json(
          201,
          order,
          { Location: `/orders/${order.id}`, "Idempotency-Key": key },
        );
      }
    lang: javascript
    right: { en: 'The handler reads an idempotency key, creates an addressable resource identifier, and uses 201 with a Location header for the new order.', zh: '处理器读取了幂等键，为资源创建可寻址标识，并通过 201 与 Location 响应头表示新订单。' }
    checklist:
      - { en: 'Authorize the authenticated actor against the requested account before any write or charge.', zh: '在任何写入或扣款前，检查已认证主体是否有权操作目标账户。' }
      - { en: 'Parse money into exact minor units and reject missing, non-finite, non-positive, or over-precision values.', zh: '把金额解析为精确的最小货币单位，并拒绝缺失、非有限、非正数或精度过高的值。' }
      - { en: 'Retry the same scoped key concurrently and after injected failures, then prove that one order and one charge exist.', zh: '并发重试同一个限定作用域的键，并注入故障后重试，证明只存在一个订单和一次扣款。' }
      - { en: 'Assert the complete public response and the absence of persistence-only fields.', zh: '断言完整的公共响应，并确认其中没有只属于持久层的字段。' }
    issues:
      - line: 4
        kind: security
        note: { en: 'The caller chooses accountId, but the handler never verifies that the authenticated actor may create or charge orders for that account.', zh: '调用方自行选择 accountId，但处理器没有验证已认证主体能否为该账户创建订单或扣款。' }
      - line: 8
        kind: edge-case
        note: { en: 'Number accepts NaN, infinities, negative values, and imprecise decimal amounts; no amount or currency invariant is enforced.', zh: 'Number 会接受 NaN、无穷、负数和不精确小数；代码没有强制金额或币种不变量。' }
      - line: 12
        lines: 2
        kind: correctness
        note: { en: 'The order write and charge are not atomic, and the idempotency key is never used for deduplication. Failure or retry can leave partial or duplicate effects.', zh: '订单写入与扣款不具备原子性，而且幂等键从未用于去重。故障或重试可能留下部分效果或重复效果。' }
      - line: 16
        kind: readability
        note: { en: 'Returning the persistence object couples the public contract to storage fields and includes internalNote instead of using an explicit response presenter.', zh: '直接返回持久化对象会把公共契约耦合到存储字段，并暴露 internalNote，而不是使用明确的响应呈现器。' }
    explanation: { en: 'Authorize first, validate exact minor-unit money, and atomically persist the order, scoped idempotency record, and charge intent or outbox event. Build the response from an explicit allow-listed presenter.', zh: '应先授权并验证精确的最小货币单位，再原子持久化订单、限定作用域的幂等记录，以及扣款意图或 outbox 事件。响应应由明确的字段白名单呈现器构造。' }
    difficulty: advanced
    tags: [code-review, authorization, idempotency, transaction]
