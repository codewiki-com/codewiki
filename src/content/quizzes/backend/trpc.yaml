topic: backend/trpc
items:
  - id: predict-defaulted-input
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      import { initTRPC } from "@trpc/server";
      import { z } from "zod";

      const t = initTRPC.create();
      const appRouter = t.router({
        list: t.procedure
          .input(z.object({ limit: z.number().default(20) }))
          .query(({ input }) => input),
      });

      const caller = appRouter.createCaller({});
      console.log(JSON.stringify(await caller.list({})));
    lang: typescript
    options:
      - { text: { en: '{"limit":20}', zh: '{"limit":20}' }, correct: true }
      - { text: { en: '{}', zh: '{}' }, correct: false }
      - { text: { en: 'undefined', zh: 'undefined' }, correct: false }
      - { text: { en: 'It throws BAD_REQUEST.', zh: '程序抛出BAD_REQUEST。' }, correct: false }
    explanation: { en: 'The runtime input parser applies the Zod default before the resolver runs, so the resolver receives an object whose limit is 20.', zh: '运行时输入解析器会在resolver运行前应用Zod默认值，因此resolver收到的对象中limit为20。' }
    difficulty: beginner
    tags: [trpc, input-validation, predict-output]

  - id: inference-versus-validation
    type: mcq
    prompt: { en: 'Why does a tRPC procedure still need a runtime input parser when its TypeScript client has inferred input types?', zh: 'tRPC客户端已经推断出输入类型，为什么procedure仍需要运行时输入解析器？' }
    options:
      - { text: { en: 'TypeScript types are erased, and network callers can send values that were never type-checked.', zh: 'TypeScript类型会被擦除，网络调用方可以发送从未经过类型检查的值。' }, correct: true }
      - { text: { en: 'The parser downloads the router implementation into the browser.', zh: '解析器会把router实现下载到浏览器。' }, correct: false }
      - { text: { en: 'The parser makes every mutation transactional.', zh: '解析器会让每个mutation自动具有事务性。' }, correct: false }
    explanation: { en: 'Inference protects compatible source code during compilation. Runtime parsing protects the executing server from malformed, stale, or adversarial data.', zh: '类型推断在编译期间保护兼容源码，运行时解析则防止执行中的服务端接收畸形、过期或恶意数据。' }
    difficulty: intermediate
    tags: [trpc, type-inference, validation]

  - id: spotbug-caller-selected-owner
    title: { en: 'Spot the bug in the tRPC rename mutation', zh: '找出tRPC变更里的bug' }
    type: spotbug
    prompt: { en: 'Find the authorization flaw in this generated mutation.', zh: '找出这段生成mutation中的授权缺陷。' }
    code: |
      const rename = protectedProcedure
        .input(z.object({ orderId: z.string(), ownerId: z.string(), name: z.string() }))
        .mutation(async ({ ctx, input }) => {
          const order = await ctx.db.order.findFirst({
            where: { id: input.orderId, ownerId: input.ownerId },
          });
          if (!order) throw new TRPCError({ code: "NOT_FOUND" });
          return ctx.db.order.update({
            where: { id: order.id }, data: { name: input.name },
          });
        });
    lang: typescript
    issues:
      - line: 2
        lines: 4
        kind: security
        note: { en: 'The caller selects ownerId and the query trusts it; authentication does not bind the order to ctx.user. Derive owner or tenant identity from trusted context.', zh: '调用方可以选择ownerId，查询又信任该值；认证并未把订单绑定到ctx.user。所有者或租户身份应从可信上下文推导。' }
    explanation: { en: 'A protected procedure proves that a principal exists, not that caller-supplied ownership is true. Scope the lookup or conditional update with the principal from context.', zh: '受保护procedure只能证明主体存在，不能证明调用方提交的所有权真实。查询或条件更新应使用上下文中的主体限定作用域。' }
    difficulty: intermediate
    tags: [trpc, authorization, multi-tenant]

  - id: batch-transaction-semantics
    type: mcq
    prompt: { en: 'Two mutations are sent together through httpBatchLink. What transaction guarantee does that provide?', zh: '两个mutation通过httpBatchLink一起发送，这会提供什么事务保证？' }
    options:
      - { text: { en: 'None; each procedure remains a distinct operation unless application code creates a transaction.', zh: '不提供保证；除非应用代码创建事务，否则每个procedure仍是独立操作。' }, correct: true }
      - { text: { en: 'Both mutations commit or both roll back automatically.', zh: '两个mutation会自动一起提交或一起回滚。' }, correct: false }
      - { text: { en: 'The second mutation runs only if the first succeeds.', zh: '只有第一个mutation成功后，第二个才会运行。' }, correct: false }
      - { text: { en: 'The batch makes both mutations idempotent.', zh: '批处理会让两个mutation都变成幂等操作。' }, correct: false }
    explanation: { en: 'Batching changes transport shape, not business atomicity or replay semantics. Put inseparable work behind one application operation and database transaction.', zh: '批处理改变的是传输形状，不会改变业务原子性或重放语义。不可分割的工作应放进同一个应用操作与数据库事务。' }
    difficulty: intermediate
    tags: [trpc, batching, transaction]

  - id: review-generated-user-admin
    type: review
    title: { en: 'Review a generated tRPC admin router', zh: '审查生成的tRPC管理router' }
    prompt: { en: 'Review this generated router for trust-boundary, result, and resource-use failures.', zh: '从信任边界、返回结果和资源使用角度审查这段生成的router。' }
    task: { en: 'Let an administrator update one user profile and fetch a bounded audit page.', zh: '允许管理员更新一个用户资料，并获取有界的审计记录页。' }
    code: |
      import { z } from "zod";
      import { router, publicProcedure } from "../trpc";
      export const userRouter = router({
        update: publicProcedure
          .input(z.object({
            userId: z.string(),
            name: z.string(),
            role: z.string(),
          }))
          .mutation(async ({ ctx, input }) => {
            const user = await ctx.db.user.findUnique({ where: { id: input.userId } });
            if (!user) throw new Error("missing user");
            await ctx.db.user.update({
              where: { id: user.id },
              data: { name: input.name, role: input.role },
            });
            return ctx.db.user.findMany();
          }),
        audit: publicProcedure
          .input(z.object({ limit: z.number().optional() }))
          .query(async ({ ctx, input }) => {
            const rows = await ctx.db.audit.findMany();
            return rows.slice(0, input.limit ?? rows.length);
          }),
      });
    lang: typescript
    issues:
      - line: 4
        kind: security
        note: { en: 'Both administrative capabilities derive from publicProcedure, so no authenticated administrator or authorization policy is required.', zh: '两个管理能力都从publicProcedure派生，因此既不要求已认证管理员，也不执行授权策略。' }
      - line: 7
        lines: 2
        kind: edge-case
        note: { en: 'name is unbounded and role accepts every string, including unsupported or privilege-escalating values.', zh: 'name没有长度上限，role接受任意字符串，包括不受支持或会提升权限的值。' }
      - line: 17
        kind: correctness
        note: { en: 'The update operation returns every user rather than the updated public profile promised by the task.', zh: '更新操作返回全部用户，而不是任务要求的已更新公开资料。' }
      - line: 22
        lines: 2
        kind: performance
        note: { en: 'The audit query loads the complete table before slicing in memory, and an absent or invalid limit leaves the work unbounded.', zh: '审计查询先加载整张表，再在内存中切片；limit缺失或无效时，工作量没有上限。' }
    right: { en: 'The code uses structured ORM calls, distinguishes the two capabilities, and checks whether the target user exists before updating.', zh: '代码使用结构化ORM调用，区分了两项能力，并在更新前检查目标用户是否存在。' }
    checklist:
      - { en: 'Derive sensitive procedures from an authenticated, administrator-authorized base procedure.', zh: '敏感procedure应从经过认证与管理员授权的基础procedure派生。' }
      - { en: 'Allowlist and bound writable fields, especially roles and server-owned state.', zh: '对白名单写入字段设置边界，尤其是角色与服务端状态。' }
      - { en: 'Return a deliberate public result and stable domain error codes.', zh: '返回有意设计的公开结果与稳定领域错误码。' }
      - { en: 'Validate a capped page size and apply pagination in the database query.', zh: '验证有上限的页面大小，并在数据库查询中执行分页。' }
    explanation: { en: 'Use an administrator procedure, a bounded update schema with an explicit role enum, an intentional public-user output, and database-level cursor pagination with a capped limit.', zh: '应使用管理员procedure、带明确角色枚举和边界的更新schema、有意设计的公开用户输出，以及在数据库中执行且limit有上限的游标分页。' }
    difficulty: advanced
    minutes: 8
    tags: [trpc, code-review, authorization, validation]
