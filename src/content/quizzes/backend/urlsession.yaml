topic: backend/urlsession
items:
  - id: predict-status-range
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      func accepted(_ status: Int) -> Bool {
          (200...299).contains(status)
      }

      print([199, 200, 204, 300].map(accepted))
    lang: swift
    options:
      - { text: { en: '[false, true, true, false]', zh: '[false, true, true, false]' }, correct: true }
      - { text: { en: '[false, true, false, false]', zh: '[false, true, false, false]' }, correct: false }
      - { text: { en: '[true, true, true, true]', zh: '[true, true, true, true]' }, correct: false }
    explanation: { en: 'The closed range includes every integer from 200 through 299, including 204, but excludes both boundary-adjacent values.', zh: '闭区间包含200到299的所有整数，因此包含204，但不包含区间两侧的199与300。' }
    difficulty: beginner
    tags: [http-status, predict-output]

  - id: transport-versus-http
    type: mcq
    prompt: { en: '`data(for:)` returns without throwing and the response status is 500. Which interpretation is correct?', zh: '`data(for:)`没有抛错，但响应状态是500。哪种解释正确？' }
    options:
      - { text: { en: 'Transport completed, but the client must treat the HTTP status according to the endpoint contract.', zh: '传输已经完成，但客户端仍须按端点契约处理HTTP状态。' }, correct: true }
      - { text: { en: 'URLSession has already classified the operation as successful.', zh: 'URLSession已经把这次操作判定为成功。' }, correct: false }
      - { text: { en: 'JSONDecoder will automatically turn the status into an Error.', zh: 'JSONDecoder会自动把该状态转换成Error。' }, correct: false }
    explanation: { en: 'URLSession async methods throw for loading failures, not for every non-2xx HTTP response. Status validation belongs before decoding.', zh: 'URLSession的异步方法会在加载失败时抛错，而不会为每个非2xx HTTP响应抛错。状态验证应发生在解码之前。' }
    difficulty: intermediate
    tags: [http-status, error-model]

  - id: spot-erased-response
    title: { en: 'Spot the bug in the URLSession user loader', zh: '找出URLSession里的bug' }
    type: spotbug
    prompt: { en: 'Find the two boundary failures hidden by this generated helper.', zh: '找出这段生成的辅助函数隐藏的两个边界错误。' }
    code: |
      func loadUser(from request: URLRequest) async throws -> User? {
          let (data, _) = try await URLSession.shared.data(for: request)
          return try? JSONDecoder().decode(User.self, from: data)
      }
    lang: swift
    issues:
      - line: 2
        kind: correctness
        note: { en: 'Discarding URLResponse loses HTTP status and headers, so an error body may be decoded as if it were a success payload.', zh: '丢弃URLResponse会同时丢失HTTP状态与响应头，错误正文可能被当成成功载荷解码。' }
      - line: 3
        kind: readability
        note: { en: '`try?` collapses all decoding failures into nil, removing the DecodingError category and coding path callers need to diagnose the contract.', zh: '`try?`把所有解码失败压成nil，抹掉调用方诊断契约所需的DecodingError类别与coding path。' }
    explanation: { en: 'Require an HTTPURLResponse, validate accepted statuses, then let decoding errors remain visible or wrap them while preserving their cause.', zh: '应先要求响应为HTTPURLResponse并验证允许状态，再让解码错误保持可见，或在保留原因的前提下包装错误。' }
    difficulty: intermediate
    tags: [code-review, decoding, http-status]

  - id: configuration-copy
    type: mcq
    prompt: { en: 'A session has already been initialized from a configuration. How do you apply a different timeout policy?', zh: '会话已经从配置创建。怎样应用另一套超时策略？' }
    options:
      - { text: { en: 'Create a new configuration and initialize a new session with it.', zh: '创建新配置，再用它初始化一个新会话。' }, correct: true }
      - { text: { en: 'Mutate the original configuration; the existing session observes it live.', zh: '修改原配置；现有会话会实时观察变化。' }, correct: false }
      - { text: { en: 'Mutate session.configuration; it is the session’s writable policy object.', zh: '修改session.configuration；它是会话的可写策略对象。' }, correct: false }
    explanation: { en: 'URLSession copies configuration values at initialization. Later mutations affect neither the existing session nor its tasks.', zh: 'URLSession在初始化时复制配置值。之后的修改不会影响现有会话及其任务。' }
    difficulty: intermediate
    tags: [configuration, lifecycle]

  - id: cancellation-outcome
    type: mcq
    prompt: { en: 'A POST is cancelled after its bytes may have reached the server. What may the client safely conclude?', zh: 'POST的字节可能已经到达服务端后，客户端取消了请求。客户端可以安全得出什么结论？' }
    options:
      - { text: { en: 'The outcome is unknown until the API’s idempotency or status protocol resolves it.', zh: '在API的幂等或状态查询协议确认前，结果未知。' }, correct: true }
      - { text: { en: 'The server rolled back the operation.', zh: '服务端已经回滚操作。' }, correct: false }
      - { text: { en: 'Retrying with a new idempotency key cannot duplicate the operation.', zh: '使用新的幂等键重试不会重复执行操作。' }, correct: false }
    explanation: { en: 'Cancellation stops local waiting or transfer work; it does not retract a remote commit. A retryable write needs a stable key and server-side deduplication.', zh: '取消只会停止本地等待或传输工作，不会撤回远端提交。可重试写入需要稳定键和服务端去重。' }
    difficulty: advanced
    tags: [cancellation, idempotency, retry]

  - id: review-generated-user-client
    type: review
    title: { en: 'Review a generated URLSession client', zh: '审查生成的URLSession客户端' }
    prompt: { en: 'Review this generated user loader against its transport, security, and retry contract.', zh: '根据传输、安全和重试契约审查这段生成的用户加载器。' }
    task: { en: 'Fetch one user with bearer authentication. Accept only 2xx responses, preserve decoding failures, reuse transport resources, allow at most three GET attempts, and never log credentials.', zh: '使用Bearer认证获取一个用户；只接受2xx响应，保留解码失败，复用传输资源，GET最多尝试三次，并且绝不记录凭证。' }
    code: |
      import Foundation

      struct User: Decodable {
          let id: Int
          let name: String
      }

      func loadUser(id: Int, token: String) async -> User? {
          for _ in 0..<3 {
              do {
                  let session = URLSession(configuration: .default)
                  var request = URLRequest(url: URL(string: "https://api.example.com/users/\(id)")!)
                  request.setValue("Bearer \(token)", forHTTPHeaderField: "Authorization")
                  let (data, _) = try await session.data(for: request)
                  print(request.allHTTPHeaderFields ?? [:])
                  if let user = try? JSONDecoder().decode(User.self, from: data) {
                      return user
                  }
              } catch {}
          }
          return nil
      }
    lang: swift
    issues:
      - line: 11
        kind: performance
        note: { en: 'Creating a new session on every attempt prevents deliberate reuse of connections, caches, cookies, and metrics; inject and reuse one session.', zh: '每次尝试都创建新会话，无法有计划地复用连接、缓存、Cookie和指标；应注入并复用一个会话。' }
      - line: 14
        kind: correctness
        note: { en: 'The response is discarded, so 4xx and 5xx bodies enter the success decoder and retry decisions cannot use status or Retry-After.', zh: '响应被丢弃，4xx与5xx正文会进入成功解码器，重试决策也无法使用状态或Retry-After。' }
      - line: 15
        kind: security
        note: { en: 'Logging all request headers writes the bearer token to logs.', zh: '记录全部请求头会把Bearer令牌写入日志。' }
      - line: 16
        lines: 3
        kind: readability
        note: { en: '`try?` plus an empty catch and final nil erase whether transport, status, or decoding failed, making the caller contract ambiguous.', zh: '`try?`、空catch与最终nil抹掉了传输、状态或解码失败的区别，让调用方契约含糊不清。' }
    right: { en: 'The code uses async/await, places the token in the Authorization header rather than the URL, and bounds the loop to three attempts.', zh: '代码使用async/await，把令牌放在Authorization请求头而不是URL中，并把循环限制为三次尝试。' }
    checklist:
      - { en: 'Validate HTTP status and relevant headers before decoding.', zh: '解码前验证HTTP状态与相关响应头。' }
      - { en: 'Inject one reusable session and an explicit retry policy.', zh: '注入一个可复用会话和明确的重试策略。' }
      - { en: 'Preserve transport, status, cancellation, and decoding error categories.', zh: '保留传输、状态、取消与解码错误类别。' }
      - { en: 'Redact credentials and bound any logged body sample.', zh: '对凭证脱敏，并限制任何正文日志样本的大小。' }
    explanation: { en: 'Separate request construction, transport, status validation, and decoding. Reuse the injected session and retry only failures admitted by a bounded endpoint policy.', zh: '应拆分请求构造、传输、状态验证与解码。复用注入的会话，只重试端点有限策略明确允许的失败。' }
    difficulty: advanced
    minutes: 8
    tags: [code-review, URLSession, security, retry]
