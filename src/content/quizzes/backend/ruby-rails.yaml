topic: backend/ruby-rails
items:
  - id: predict-strong-parameters
    type: predict
    prompt: { en: 'What does this Rails strong-parameters script print?', zh: '这段 Rails 强参数脚本会输出什么？' }
    code: |
      params = ActionController::Parameters.new(
        order: { status: "shipped", account_id: 99 }
      )

      allowed = params.require(:order).permit(:status)
      puts allowed.to_h
      puts allowed.permitted?
    lang: ruby
    options:
      - { text: { en: "{\"status\"=>\"shipped\"}\ntrue", zh: "{\"status\"=>\"shipped\"}\ntrue" }, correct: true }
      - { text: { en: "{\"status\"=>\"shipped\", \"account_id\"=>99}\ntrue", zh: "{\"status\"=>\"shipped\", \"account_id\"=>99}\ntrue" }, correct: false }
      - { text: { en: "{\"status\"=>\"shipped\"}\nfalse", zh: "{\"status\"=>\"shipped\"}\nfalse" }, correct: false }
    explanation: { en: 'permit(:status) returns permitted parameters containing only the allowlisted status key. It removes account_id instead of granting permission to change ownership.', zh: 'permit(:status) 返回只含白名单 status 键的已允许参数。它会移除 account_id，但不会授予修改所有权的权限。' }
    difficulty: beginner
    tags: [rails, strong-parameters, mass-assignment]

  - id: validation-versus-authorization
    type: mcq
    prompt: { en: 'An order ID exists and its submitted status passes validation. What must happen before the update?', zh: '订单 ID 存在，提交的状态也通过校验。更新前还必须做什么？' }
    options:
      - { text: { en: 'Authorize the authenticated principal against that order or use an ownership-scoped query.', zh: '针对该订单授权已认证主体，或使用限定所有权的查询。' }, correct: true }
      - { text: { en: 'Call permit! so Rails trusts every submitted field.', zh: '调用 permit!，让 Rails 信任所有提交字段。' }, correct: false }
      - { text: { en: 'Return the model attributes before saving.', zh: '保存前返回模型的全部属性。' }, correct: false }
      - { text: { en: 'Move the update into an after_save callback.', zh: '把更新移入 after_save 回调。' }, correct: false }
    explanation: { en: 'Existence, input shape, and object-level permission are separate checks. Scope the lookup or apply a policy using identity established by authentication.', zh: '记录存在、输入结构与对象级权限是三项独立检查。应使用认证建立的身份限定查询，或执行授权策略。' }
    difficulty: intermediate
    tags: [authorization, tenant-scope, controller]

  - id: spot-unscoped-order
    type: spotbug
    prompt: { en: 'Find the object-authorization flaw in this generated Rails controller.', zh: '找出这段生成的 Rails 控制器中的对象授权缺陷。' }
    code: |
      class OrdersController < ActionController::API
        def update
          order = Order.find(params[:id])
          order.update!(params.require(:order).permit(:status))
          render json: { id: order.id, status: order.status }
        end
      end
    lang: ruby
    issues:
      - line: 3
        kind: security
        note: { en: 'The caller controls the ID, and the lookup neither scopes through the authenticated account nor invokes an authorization policy.', zh: '调用方控制 ID，而查询既没有通过已认证账户限定范围，也没有执行授权策略。' }
    explanation: { en: 'Strong parameters limit writable fields but do not authorize the target record. Start from the current account association or authorize the loaded order explicitly.', zh: '强参数只限制可写字段，不会授权目标记录。应从当前账户关联开始查询，或对加载后的订单显式授权。' }
    difficulty: intermediate
    tags: [rails, authorization, strong-parameters]

  - id: prove-n-plus-one-fix
    type: mcq
    prompt: { en: 'Which test best proves that a Rails N+1 regression is fixed?', zh: '哪项测试最能证明 Rails 的 N+1 回归已经修复？' }
    options:
      - { text: { en: 'Render or serialize a fixed-size page with its associations and assert a bounded SQL count.', zh: '渲染或序列化固定大小且包含关联的页面，并断言 SQL 数量上限。' }, correct: true }
      - { text: { en: 'Check that includes(:customer) appears in the controller source.', zh: '检查控制器源码中出现 includes(:customer)。' }, correct: false }
      - { text: { en: 'Call Order.count and assert that it returns the fixture count.', zh: '调用 Order.count 并断言它返回 fixture 数量。' }, correct: false }
      - { text: { en: 'Increase the database connection pool until the page responds.', zh: '增大数据库连接池，直到页面能够响应。' }, correct: false }
    explanation: { en: 'Association access often happens in a view or serializer after the controller query. The regression test must execute that path with stable data and record the resulting SQL count.', zh: '关联访问常在控制器查询之后的视图或序列化器中发生。回归测试必须用稳定数据执行该路径，并记录最终 SQL 数量。' }
    difficulty: intermediate
    tags: [active-record, n-plus-one, testing]

  - id: review-generated-update
    type: review
    title: { en: 'Review a generated order update', zh: '审查生成的订单更新接口' }
    task: { en: 'Update the quantity of one current-account order and return only its public ID, status, and quantity.', zh: '更新当前账户中一个订单的数量，并且只返回公开的 ID、状态和数量。' }
    prompt: { en: 'Review this generated controller against the task and identify three distinct production issues.', zh: '根据任务审查这段生成的控制器，找出三类不同的生产问题。' }
    code: |
      class OrdersController < ActionController::API
        def update
          order = current_account.orders.find(params[:id])
          attributes = params.require(:order).permit(:quantity)

          order.update(attributes)

          customer_names = Order.all.map do |candidate|
            candidate.customer.name
          end
          Rails.logger.info("customers=#{customer_names.join(',')}")

          render json: order.attributes
        end
      end
    lang: ruby
    issues:
      - line: 6
        kind: correctness
        note: { en: 'update can return false after validation failure, but the action continues and returns a success response with unchanged or invalidly requested state.', zh: 'update 在校验失败时可以返回 false，但动作仍继续执行，并用未变化或请求无效的状态返回成功响应。' }
      - line: 9
        kind: performance
        note: { en: 'The unrelated full-table scan lazily loads customer for every order, adding unbounded work and an N+1 query to one update request.', zh: '这段无关的全表扫描会为每个订单惰性加载 customer，给一次更新请求增加无界工作与 N+1 查询。' }
      - line: 13
        kind: security
        note: { en: 'Returning every model attribute can expose account IDs, internal notes, or future sensitive columns outside the stated response contract.', zh: '返回模型全部属性可能把账户 ID、内部备注或未来新增的敏感列暴露到约定响应之外。' }
    right: { en: 'The code scopes the order through current_account and allowlists quantity, so it starts with sound ownership and input-field boundaries.', zh: '代码通过 current_account 限定订单，并把输入字段限制为 quantity，因此所有权与字段边界的起点是正确的。' }
    checklist:
      - { en: 'Check ownership or policy authorization for the exact record.', zh: '检查目标记录的所有权限定或策略授权。' }
      - { en: 'Map validation failure to a documented non-success response.', zh: '把校验失败映射为已记录的非成功响应。' }
      - { en: 'Execute the complete query and serialization path with a SQL-count bound.', zh: '执行完整查询与序列化路径，并限制 SQL 数量。' }
      - { en: 'Allowlist response fields and assert that internal fields are absent.', zh: '为响应字段设置白名单，并断言内部字段缺失。' }
    explanation: { en: 'A safe lookup and narrow input map are not enough when failure handling, query shape, and output filtering are wrong. Review the whole request path, not one defensive line.', zh: '查询安全且输入映射狭窄仍不够，失败处理、查询形状与输出过滤都必须正确。审查对象应是完整请求路径，而不是某一行防御代码。' }
    difficulty: advanced
    tags: [rails, review, authorization, n-plus-one]
