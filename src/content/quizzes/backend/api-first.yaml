topic: backend/api-first
items:
  - id: predict-provider-verification
    type: predict
    prompt: { en: 'What does this contract check print?', zh: '这段契约检查会输出什么？' }
    code: |
      const contract = {
        status: 201,
        requiredHeaders: ["Location"],
      };

      const response = {
        status: 201,
        headers: { "Content-Type": "application/json" },
      };

      const errors = [];
      if (response.status !== contract.status) errors.push("wrong status");
      for (const name of contract.requiredHeaders) {
        if (!(name in response.headers)) errors.push(`missing ${name}`);
      }
      console.log(errors.join(", ") || "OK");
    lang: javascript
    options:
      - { text: { en: 'OK', zh: 'OK' }, correct: false }
      - { text: { en: 'wrong status', zh: 'wrong status' }, correct: false }
      - { text: { en: 'missing Location', zh: 'missing Location' }, correct: true }
      - { text: { en: 'missing Content-Type', zh: 'missing Content-Type' }, correct: false }
    explanation: { en: 'The status matches, but the response omits the Location header required by the 201 contract.', zh: '状态码符合要求，但响应缺少 201 契约规定的 Location 响应头。' }
    difficulty: beginner
    tags: [provider-verification, response-header, predict-output]

  - id: api-first-control-point
    type: mcq
    prompt: { en: 'Which practice makes an OpenAPI description part of an API-first process?', zh: '哪种做法能让 OpenAPI 描述真正进入 API 优先流程？' }
    options:
      - { text: { en: 'Generate the description after each production deployment.', zh: '每次生产部署后再生成描述。' }, correct: false }
      - { text: { en: 'Review and version it before dependent work, then enforce it against the implementation.', zh: '在依赖方开工前评审并版本化，再用它约束实现。' }, correct: true }
      - { text: { en: 'Add every database column to the public response schema.', zh: '把每个数据库列都加入公共响应模式。' }, correct: false }
    explanation: { en: 'API-first makes the approved contract an input and a release control. A description that follows production cannot constrain design or detect drift before release.', zh: 'API 优先把已批准契约当作输入和发布控制点。生产之后才生成的描述无法约束设计，也无法在发布前发现漂移。' }
    difficulty: beginner
    tags: [api-first, workflow, contract]

  - id: spot-body-only-verification
    type: spotbug
    prompt: { en: 'Find the contract-verification gap in this generated test.', zh: '找出这段生成测试中的契约验证缺口。' }
    code: |
      async function verifyCreated(response) {
        const body = await response.json();
        if (typeof body.id !== "string") {
          throw new Error("missing order id");
        }
        return true;
      }
    lang: javascript
    issues:
      - line: 2
        lines: 5
        kind: correctness
        note: { en: 'The test checks only a decoded body. It can pass for status 200, the wrong media type, or a missing Location header even though the published operation requires all three HTTP details.', zh: '测试只检查解码后的响应体。即使状态码是 200、媒体类型错误或缺少 Location 响应头，它仍可能通过，而发布的操作要求检查全部三项 HTTP 细节。' }
    explanation: { en: 'Contract verification captures the observable HTTP exchange: status, relevant headers, media type, and body schema. Calling response.json() first discards part of that evidence.', zh: '契约验证应捕获可观察的 HTTP 交换，包括状态码、相关响应头、媒体类型和响应体模式。直接调用 response.json() 会丢掉一部分证据。' }
    difficulty: intermediate
    tags: [contract-testing, http-boundary, spotbug]

  - id: response-field-compatibility
    type: mcq
    prompt: { en: 'A provider adds an optional field to a response. When is that change compatible with an existing client?', zh: '提供者向响应新增一个可选字段。什么情况下它与现有客户端兼容？' }
    options:
      - { text: { en: 'Always; optional response fields cannot break clients.', zh: '任何时候；可选响应字段不可能破坏客户端。' }, correct: false }
      - { text: { en: 'When the client tolerates unknown response fields and no existing semantics change.', zh: '客户端容忍未知响应字段，并且现有语义没有改变时。' }, correct: true }
      - { text: { en: 'Only when the API URL gains a new major version.', zh: '只有 API URL 增加新的主版本时。' }, correct: false }
    explanation: { en: 'Response additions are normally extensible only for tolerant readers. A strict decoder that rejects unknown properties can turn the same addition into a breaking change.', zh: '只有宽容读取者通常能兼容新增响应字段。若严格解码器拒绝未知属性，同一个变更就可能成为破坏性变更。' }
    difficulty: intermediate
    tags: [compatibility, response-schema, tolerant-reader]

  - id: consumer-contract-scope
    type: mcq
    prompt: { en: 'What evidence does a consumer-driven contract add beside an OpenAPI description?', zh: '除了 OpenAPI 描述，消费者驱动契约还增加了什么证据？' }
    options:
      - { text: { en: 'A guarantee that every domain rule and security policy is correct', zh: '保证每条领域规则和安全策略都正确' }, correct: false }
      - { text: { en: 'Concrete interactions that a named consumer depends on and the provider has verified', zh: '具名消费者依赖、且提供者已经验证的具体交互' }, correct: true }
      - { text: { en: 'Permission for each consumer to redefine provider semantics privately', zh: '允许每个消费者私下重新定义提供者语义' }, correct: false }
    explanation: { en: 'Consumer contracts record actual dependencies and provider verification results. They complement a public interface description but do not replace domain, authorization, or broad conformance tests.', zh: '消费者契约记录实际依赖和提供者验证结果。它们补充公共接口描述，但不能替代领域、授权或广泛的符合性测试。' }
    difficulty: intermediate
    tags: [consumer-driven-contract, OpenAPI, scope]

  - id: review-generated-order-endpoint
    type: review
    prompt: { en: 'Review this generated create-order endpoint before it is connected to the published contract.', zh: '在这段生成的创建订单端点接入已发布契约前，对它进行审查。' }
    task: { en: 'Implement POST /orders for the authenticated customer, accept a positive integer quantity, create one durable order under retries, and return 201 with Location after recording an event.', zh: '为已认证客户实现 POST /orders，接受正整数数量，在重试时只持久创建一个订单，并在记录事件后返回带 Location 的 201 响应。' }
    code: |
      async function createOrder(request, db, events) {
        const body = await request.json();
        const product = await db.products.find(body.sku);
        const inventory = await db.inventory.find(body.sku);
        if (!product || !inventory) {
          return json(404, { title: "Product not found" });
        }

        const order = {
          id: crypto.randomUUID(),
          customerId: body.customerId,
          sku: body.sku,
          quantity: Number(body.quantity),
        };
        await db.orders.insert(order);
        await events.publish("order.created", order);

        return json(201, order, {
          Location: `/orders/${order.id}`,
        });
      }
    lang: javascript
    right: { en: 'The handler distinguishes an unavailable product, returns the contracted 201 status, includes Location, and gives the created order an addressable identifier.', zh: '处理器区分了不可用商品，返回契约规定的 201 状态码，包含 Location，并为新订单提供可寻址标识。' }
    checklist:
      - { en: 'Bind customer identity to the authenticated principal rather than a caller-selected body field.', zh: '把客户身份绑定到已认证主体，不要使用调用方在请求体中选择的字段。' }
      - { en: 'Test missing, non-numeric, fractional, zero, negative, and excessive quantities.', zh: '测试缺失、非数字、小数、零、负数和过大数量。' }
      - { en: 'Inject failures between persistence and event publication and verify there is no partial outcome.', zh: '在持久化与事件发布之间注入故障，确认不会产生部分结果。' }
      - { en: 'Repeat the same caller-supplied idempotency key and prove that the stored order and event are reused.', zh: '重复使用同一个调用方幂等键，证明已存订单和事件会被复用。' }
    issues:
      - line: 3
        lines: 2
        kind: performance
        note: { en: 'The product and inventory reads depend only on the same SKU but are awaited serially, adding one storage round trip of latency to the critical path.', zh: '商品与库存读取都只依赖同一个 SKU，却被串行等待，因此在关键路径上增加了一次存储往返的延迟。' }
      - line: 11
        kind: security
        note: { en: 'The caller chooses customerId in the body, so one authenticated customer can create an order attributed to another unless authorization happens elsewhere.', zh: '调用方可以在请求体中选择 customerId；除非别处执行授权，否则一个已认证客户可以用另一个客户的身份创建订单。' }
      - line: 13
        kind: edge-case
        note: { en: 'Number accepts NaN, infinities, fractions, zero, and negatives, while the task and contract require a positive integer within a domain limit.', zh: 'Number 会接受 NaN、无穷、小数、零和负数，而任务与契约要求在领域上限内的正整数。' }
      - line: 15
        lines: 2
        kind: correctness
        note: { en: 'The order insert and event publish are not one durable transaction or outbox operation, and no caller-stable idempotency key prevents duplicate orders after an unknown result.', zh: '订单插入与事件发布不属于同一个持久事务或 outbox 操作，而且没有调用方稳定提供的幂等键来防止结果未知后的重复订单。' }
    explanation: { en: 'Authorize the authenticated customer, validate quantity without lossy coercion, and accept a stable idempotency key bound to the request. Commit the order and an outbox record atomically, then publish from the outbox and replay the saved response on retries.', zh: '应验证已认证客户的权限，不经有损强制转换地校验数量，并接受与请求绑定的稳定幂等键。把订单与 outbox 记录原子提交，再从 outbox 发布事件，重试时重放已保存响应。' }
    difficulty: advanced
    tags: [code-review, authorization, idempotency, outbox]
