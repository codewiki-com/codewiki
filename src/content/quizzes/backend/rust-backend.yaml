topic: backend/rust-backend
items:
  - id: predict-result-status
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      fn validate(quantity: u32) -> Result<u32, &'static str> {
          if quantity == 0 {
              Err("quantity must be positive")
          } else {
              Ok(quantity)
          }
      }

      fn main() {
          for quantity in [0, 2] {
              match validate(quantity) {
                  Ok(value) => println!("accepted {value}"),
                  Err(message) => println!("rejected {message}"),
              }
          }
      }
    lang: rust
    options:
      - { text: { en: "rejected quantity must be positive\naccepted 2", zh: "rejected quantity must be positive\naccepted 2" }, correct: true }
      - { text: { en: "accepted 0\naccepted 2", zh: "accepted 0\naccepted 2" }, correct: false }
      - { text: { en: "rejected quantity must be positive\nrejected quantity must be positive", zh: "rejected quantity must be positive\nrejected quantity must be positive" }, correct: false }
    explanation: { en: 'The zero value takes the Err branch, while 2 is carried by Ok. A Result forces the caller to handle both outcomes before using the value.', zh: '零进入Err分支，2则由Ok携带。调用方必须处理Result的两种结果，才能继续使用其中的值。' }
    difficulty: beginner
    tags: [rust, result, validation, predict-output]

  - id: body-extractor-position
    type: mcq
    prompt: { en: 'Why must Json<T> be the last Axum handler argument when other arguments read request parts?', zh: '当其他参数还要读取请求部件时，为什么Axum处理器的Json<T>必须放在最后？' }
    options:
      - { text: { en: 'Json<T> consumes the request body through FromRequest, while earlier FromRequestParts extractors can share request parts.', zh: 'Json<T>通过FromRequest消费请求正文，而前面的FromRequestParts提取器可以共享请求部件。' }, correct: true }
      - { text: { en: 'Rust evaluates all function arguments from right to left.', zh: 'Rust会从右到左计算所有函数参数。' }, correct: false }
      - { text: { en: 'Serde can deserialize only the final field of a tuple.', zh: 'Serde只能反序列化元组的最后一个字段。' }, correct: false }
    explanation: { en: 'A request body has one consuming extraction boundary. Axum composes any number of request-parts extractors before the final body extractor.', zh: '请求正文只有一个消费式提取边界。Axum可以先组合多个请求部件提取器，再执行最后的正文提取器。' }
    difficulty: intermediate
    tags: [axum, extractor, request-body]

  - id: blocking-timeout-semantics
    type: mcq
    prompt: { en: 'A timeout expires while awaiting a spawn_blocking task that has started. What can the caller safely conclude?', zh: '等待已经开始的spawn_blocking任务时发生超时。调用方可以确定什么？' }
    options:
      - { text: { en: 'Only that the wait exceeded its deadline; the blocking closure may still finish.', zh: '只能确定等待超过截止时间；阻塞闭包仍可能完成。' }, correct: true }
      - { text: { en: 'The closure was stopped before its next machine instruction.', zh: '闭包会在下一条机器指令前停止。' }, correct: false }
      - { text: { en: 'Any database transaction started by the closure was rolled back.', zh: '闭包启动的数据库事务一定已经回滚。' }, correct: false }
      - { text: { en: 'Dropping the JoinHandle waits for the closure in the background.', zh: '丢弃JoinHandle会在后台等待闭包结束。' }, correct: false }
    explanation: { en: 'Tokio cannot abort a spawn_blocking closure after it begins. Timeout and rollback are separate contracts, so the operation may have an unknown outcome.', zh: 'Tokio无法中止已经开始的spawn_blocking闭包。超时与回滚是不同契约，因此操作结果可能处于未知状态。' }
    difficulty: advanced
    tags: [tokio, spawn-blocking, timeout, cancellation]

  - id: spotbug-lock-across-await
    title: { en: 'Spot the bug in the async cache refresh', zh: '找出异步缓存刷新里的bug' }
    type: spotbug
    prompt: { en: 'This async function should refresh one cache entry without blocking unrelated requests. Find the two concurrency problems.', zh: '这个异步函数应刷新一个缓存项，而且不能阻塞无关请求。找出两个并发问题。' }
    code: |
      use std::{collections::HashMap, sync::{Arc, Mutex}};

      async fn refresh(cache: Arc<Mutex<HashMap<u64, String>>>, user_id: u64) {
          let mut entries = cache.lock().unwrap();
          entries.insert(user_id, "refreshing".to_string());
          let profile = fetch_profile(user_id).await;
          entries.insert(user_id, profile);
      }
    lang: rust
    issues:
      - line: 4
        kind: performance
        note: { en: 'std::sync::Mutex::lock can block a Tokio worker thread while another holder owns the lock.', zh: '当锁由其他任务持有时，std::sync::Mutex::lock可能阻塞Tokio工作线程。' }
      - line: 4
        lines: 4
        kind: correctness
        note: { en: 'The guard remains live across await, serializing cache users and potentially making a spawned handler future fail Send requirements.', zh: '锁守卫跨越await仍然存活，会串行化缓存访问，还可能让生成的处理器Future不满足Send要求。' }
    explanation: { en: 'Read or mark state in a short critical section, drop the guard, await the fetch, and reacquire briefly to commit. If duplicate refreshes matter, model an explicit per-key state instead of holding a global lock through I/O.', zh: '应在短临界区读取或标记状态，释放锁后等待请求，再短暂加锁提交结果。若重复刷新不可接受，应显式建模每个键的状态，而不是在I/O期间持有全局锁。' }
    difficulty: advanced
    tags: [rust, mutex, async, code-review]

  - id: review-generated-create-order
    title: { en: 'Review a generated Axum write handler', zh: '审查生成的Axum写入处理器' }
    type: review
    prompt: { en: 'Review this generated endpoint against the task and identify five distinct risks.', zh: '根据任务要求审查这个生成端点，找出五类不同的风险。' }
    task: { en: 'Create an order for the authenticated tenant, accept quantities from 1 through 100, persist through an async repository before responding, and return 201.', zh: '为已认证租户创建订单，只接受1到100的数量，通过异步仓储完成持久化后再响应，并返回201。' }
    right: { en: 'The generated code uses typed JSON input, receives dependencies through Axum State, and returns a serialized order rather than assembling JSON by hand.', zh: '生成代码使用带类型的JSON输入，通过Axum State接收依赖，并序列化订单，而不是手工拼装JSON。' }
    code: |
      use axum::{extract::State, http::StatusCode, response::IntoResponse, Json};
      use serde::Deserialize;
      use std::sync::{atomic::Ordering, Arc};

      #[derive(Deserialize)]
      struct NewOrder {
          tenant_id: u64,
          quantity: u32,
      }

      async fn create_order(
          State(state): State<Arc<AppState>>,
          Json(input): Json<NewOrder>,
      ) -> impl IntoResponse {
          std::thread::sleep(std::time::Duration::from_millis(50));
          let id = state.next_id.fetch_add(1, Ordering::Relaxed);
          let order = Order { id, tenant_id: input.tenant_id, quantity: input.quantity };
          let saved = order.clone();
          tokio::spawn(async move {
              state.repository.save(saved).await.unwrap();
          });
          (StatusCode::OK, Json(order))
      }
    lang: rust
    issues:
      - line: 7
        kind: security
        note: { en: 'The client chooses tenant_id instead of the handler deriving it from an authenticated principal.', zh: 'tenant_id由客户端选择，而不是由处理器从已认证主体中取得。' }
      - line: 8
        kind: edge-case
        note: { en: 'u32 excludes negative values but still accepts 0 and values above the required maximum of 100.', zh: 'u32只排除了负数，仍会接受0和超过任务上限100的值。' }
      - line: 15
        kind: performance
        note: { en: 'std::thread::sleep blocks a Tokio worker inside an async handler.', zh: 'std::thread::sleep会在异步处理器中阻塞Tokio工作线程。' }
      - line: 19
        lines: 4
        kind: correctness
        note: { en: 'Persistence is detached and its error panics only inside the task, so the handler returns 200 before proving the required save completed.', zh: '持久化被分离执行，错误只会让任务自身panic，因此处理器会在确认保存完成前返回200。' }
      - line: 16
        lines: 7
        kind: readability
        note: { en: 'ID allocation, ownership selection, persistence scheduling, and HTTP mapping are mixed in one handler instead of a named application-service operation.', zh: 'ID分配、所有权选择、持久化调度和HTTP映射混在一个处理器中，没有形成具名的应用服务操作。' }
    checklist:
      - { en: 'Derive tenant ownership from authenticated state and test a second tenant.', zh: '从认证状态派生租户所有权，并用第二个租户测试。' }
      - { en: 'Test quantities 0, 1, 100, 101, and the largest u32.', zh: '测试数量0、1、100、101和最大的u32。' }
      - { en: 'Trace blocking calls and await persistence before committing the HTTP success response.', zh: '跟踪阻塞调用，并在提交HTTP成功响应前等待持久化完成。' }
      - { en: 'Assert 201 and a public response shape after both repository success and failure.', zh: '在仓储成功与失败时分别断言201和公开响应结构。' }
    explanation: { en: 'Move tenant derivation and validation to explicit boundaries, call an async application service, await its repository result, map typed failures, and return Created only after persistence succeeds.', zh: '应在明确边界派生租户并验证输入，调用异步应用服务，等待仓储结果，映射带类型的错误，并且只在持久化成功后返回Created。' }
    difficulty: advanced
    tags: [axum, code-review, authorization, async]

