topic: backend/requests
items:
  - id: predict-repeated-query-parameters
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      from requests import Request

      request = Request(
          "GET",
          "https://api.example.test/search",
          params=[("tag", "python"), ("tag", "http client")],
      ).prepare()
      print(request.path_url)
    lang: python
    options:
      - { text: { en: '/search?tag=python&tag=http+client', zh: '/search?tag=python&tag=http+client' }, correct: true }
      - { text: { en: '/search?tag=http+client', zh: '/search?tag=http+client' }, correct: false }
      - { text: { en: '/search?tag=python,http client', zh: '/search?tag=python,http client' }, correct: false }
      - { text: { en: 'It raises ValueError.', zh: '程序抛出 ValueError。' }, correct: false }
    explanation: { en: 'A list of pairs preserves repeated keys, and Requests URL-encodes the space as + in the query string.', zh: '键值对列表会保留重复键，Requests 在查询字符串中把空格编码为 +。' }
    difficulty: beginner
    tags: [query-parameters, encoding, predict-output]

  - id: timeout-semantics
    type: mcq
    prompt: { en: 'What does timeout=(2, 5) guarantee for a Requests call?', zh: 'Requests 调用中的 timeout=(2, 5) 能保证什么？' }
    options:
      - { text: { en: 'At most two seconds to connect and at most five seconds without response bytes while reading', zh: '连接等待最多两秒，读取时连续收不到响应字节最多五秒' }, correct: true }
      - { text: { en: 'The complete call, including retries and downloads, always ends within seven seconds', zh: '包括重试和下载在内的整个调用一定在七秒内结束' }, correct: false }
      - { text: { en: 'Two retries are allowed and each can run for five seconds', zh: '允许重试两次，每次最多运行五秒' }, correct: false }
    explanation: { en: 'The tuple separates connect and read inactivity timeouts. It is not an overall wall-clock deadline.', zh: '该元组分别设置连接超时与读取无数据超时，不是整个调用的墙钟截止时间。' }
    difficulty: intermediate
    tags: [timeouts, reliability]

  - id: spot-json-before-status
    type: spotbug
    prompt: { en: 'Find the failure-handling bugs in this generated client function.', zh: '找出这个生成客户端函数中的失败处理错误。' }
    code: |
      def load_user(session, url):
          response = session.get(url)
          try:
              return response.json()
          except ValueError:
              return {}
    lang: python
    issues:
      - line: 2
        kind: edge-case
        note: { en: 'The call has no timeout, so a stalled peer can hold the caller indefinitely.', zh: '调用没有超时，停止响应的对端可能无限期占住调用方。' }
      - line: 4
        kind: correctness
        note: { en: 'It parses before checking status, so a JSON error response can be returned as if it were a successful user.', zh: '代码在检查状态前解析，因此 JSON 错误响应可能被当作成功用户返回。' }
    explanation: { en: 'Set explicit timeouts, interpret the HTTP status first, then validate the expected media type and user schema. Do not turn malformed content into an empty successful value.', zh: '应设置明确超时，先解释 HTTP 状态，再验证预期媒体类型和用户模式。不要把畸形内容转换为空的成功值。' }
    difficulty: intermediate
    tags: [status-codes, json, error-handling]

  - id: retry-post-safely
    type: mcq
    prompt: { en: 'A POST may have committed before its response was lost. What makes retrying the create operation safe?', zh: '一个 POST 可能已提交，但响应丢失。怎样才能安全重试这次创建操作？' }
    options:
      - { text: { en: 'Use one stable idempotency key across attempts and deduplicate atomically on the server', zh: '多次尝试使用同一个稳定幂等键，并由服务端原子去重' }, correct: true }
      - { text: { en: 'Generate a new random idempotency key before every attempt', zh: '每次尝试前重新生成一个随机幂等键' }, correct: false }
      - { text: { en: 'Retry whenever response.json() raises an exception', zh: '只要 response.json() 抛出异常就重试' }, correct: false }
      - { text: { en: 'Set allowed_methods=None because POST is then idempotent', zh: '设置 allowed_methods=None，因为这样 POST 就会变成幂等' }, correct: false }
    explanation: { en: 'Client configuration cannot make an operation idempotent. Replay safety needs a stable operation identity and server-side storage tied to the side effect.', zh: '客户端配置不能让操作变成幂等。安全重放需要稳定的操作标识，以及与副作用处于同一一致性边界的服务端记录。' }
    difficulty: advanced
    tags: [retry, idempotency, post]

  - id: review-generated-report-client
    type: review
    title: { en: 'Review a generated report downloader', zh: '审查生成的报表下载器' }
    prompt: { en: 'Review this generated Requests client for security, correctness, edge cases, readability, and performance.', zh: '从安全性、正确性、边界情况、可读性和性能角度审查这个生成的 Requests 客户端。' }
    task: { en: 'Download a UTF-8 report from an allowlisted HTTPS origin, reject HTTP errors, enforce a 1 MB limit, and reuse connections safely.', zh: '从允许列表中的 HTTPS 源站下载 UTF-8 报表，拒绝 HTTP 错误，限制为 1 MB，并安全复用连接。' }
    code: |
      import requests
      from requests.adapters import HTTPAdapter
      from urllib3.util import Retry

      session = requests.Session()
      session.verify = False
      retry = Retry(total=5, allowed_methods=None)
      session.mount("https://", HTTPAdapter(max_retries=retry))

      def download_report(url):
          if not url.startswith("https://reports.example.com/"):
              return None
          response = session.get(url, stream=True)
          if response.status_code != 200:
              return None
          body = b""
          for chunk in response.iter_content(8192):
              body += chunk
              if len(body) > 1_000_000:
                  break
          return body.decode()
    lang: python
    issues:
      - line: 6
        lines: 7
        kind: security
        note: { en: 'TLS verification is disabled, and a string-prefix check is not a robust URL allowlist. Parse the URL, validate its exact origin, and revalidate redirects.', zh: '代码关闭了 TLS 验证，而且字符串前缀不是可靠的 URL 允许列表。应解析 URL、验证精确源站，并重新验证重定向。' }
      - line: 13
        kind: edge-case
        note: { en: 'The streamed call has no connect or read timeout and can wait indefinitely.', zh: '这个流式调用没有连接或读取超时，可能无限等待。' }
      - line: 14
        lines: 2
        kind: correctness
        note: { en: 'The non-200 path returns without closing a streamed response, so the connection may never return to the pool.', zh: '非 200 路径没有关闭流式响应便返回，连接可能无法回到连接池。' }
      - line: 18
        kind: performance
        note: { en: 'Repeated immutable-bytes concatenation copies accumulated data; write chunks to a bounded buffer instead.', zh: '反复拼接不可变 bytes 会复制已累积数据；应把分块写入有上限的缓冲区。' }
      - line: 5
        kind: readability
        note: { en: 'A process-global mutable session hides credential and shutdown ownership. Construct it at an explicit client lifecycle boundary.', zh: '进程级可变会话隐藏了凭据和关闭责任。应在明确的客户端生命周期边界创建会话。' }
    right: { en: 'The code attempts connection reuse, asks for a streamed body, and checks an explicit byte threshold instead of eagerly accepting an unbounded response.', zh: '代码尝试复用连接，选择流式响应，并检查明确的字节阈值，而不是急切接收无界响应。' }
    checklist:
      - { en: 'Validate exact destinations, redirects, and TLS without disabling certificate checks.', zh: '验证精确目标与重定向，并保持 TLS 证书检查开启。' }
      - { en: 'Budget connect, read, retries, and the overall deadline.', zh: '为连接、读取、重试和总截止时间分配预算。' }
      - { en: 'Close every streamed response on success, failure, and size rejection.', zh: '在成功、失败和拒绝超限内容时都关闭流式响应。' }
      - { en: 'Enforce the size limit before retaining bytes and define decoding failures.', zh: '在保留字节前执行大小限制，并定义解码失败行为。' }
    explanation: { en: 'Use an owned session with certificate verification, a parsed-origin allowlist, explicit timeouts, and a with block around the streamed response. Accumulate into a bounded buffer and reject overflow instead of returning a truncated report.', zh: '应使用所有权明确且开启证书验证的会话、基于解析结果的源站允许列表、显式超时，并用 with 包住流式响应。把内容写入有界缓冲区，超限时拒绝，而不是返回截断报表。' }
    difficulty: advanced
    minutes: 8
    tags: [code-review, requests, streaming, security]
