topic: backend/graphql
items:
  - id: predict-null-bubbling
    type: predict
    prompt: { en: 'The nullable order field contains a Non-Null total that resolves to null. What does result.data contain?', zh: '可空的 order 字段中有一个非空 total，但它解析为 null。result.data 包含什么？' }
    code: |
      const { buildSchema, graphql } = require("graphql");
      const schema = buildSchema(`
        type Order { id: ID!, total: Int! }
        type Query { service: String!, order: Order }
      `);
      const result = await graphql({
        schema,
        source: `{ service order { id total } }`,
        rootValue: { service: "shop", order: { id: "o1", total: null } },
      });
      console.log(JSON.stringify(result.data));
    lang: javascript
    options:
      - { text: { en: '{"service":"shop","order":null}', zh: '{"service":"shop","order":null}' }, correct: true }
      - { text: { en: '{"service":"shop","order":{"id":"o1","total":null}}', zh: '{"service":"shop","order":{"id":"o1","total":null}}' }, correct: false }
      - { text: { en: 'null', zh: 'null' }, correct: false }
      - { text: { en: 'The operation has no data key.', zh: '操作没有 data 键。' }, correct: false }
    explanation: { en: 'The total error bubbles to the nearest nullable parent, order. Its sibling service remains available, while the response also carries an errors entry.', zh: 'total 错误传播到最近的可空父字段 order。同级 service 仍可用，同时响应还包含 errors 条目。' }
    difficulty: intermediate
    tags: [null-bubbling, non-null, partial-data]

  - id: validation-before-execution
    type: mcq
    prompt: { en: 'A query selects Product.internalCost, which is absent from the schema. What should happen?', zh: '查询选择了模式中不存在的 Product.internalCost。服务端应怎样处理？' }
    options:
      - { text: { en: 'Validation rejects the operation before product resolvers execute.', zh: '验证在商品 resolver 执行前拒绝该操作。' }, correct: true }
      - { text: { en: 'The server silently omits internalCost and executes the rest.', zh: '服务端静默省略 internalCost，并执行其余字段。' }, correct: false }
      - { text: { en: 'The product resolver runs and GraphQL changes internalCost to null.', zh: '商品 resolver 先运行，GraphQL 再把 internalCost 改为 null。' }, correct: false }
    explanation: { en: 'Field selections are validated against the parent type before execution. Unknown fields are request errors, not nullable execution results.', zh: '字段选择会在执行前根据父类型完成验证。未知字段属于请求错误，不是可空的执行结果。' }
    difficulty: beginner
    tags: [validation, schema, execution]

  - id: spot-n-plus-one
    title: { en: 'Spot the bug in the relationship resolver', zh: '找出关联字段解析器里的 bug' }
    type: spotbug
    prompt: { en: 'Find the data-access problem in this generated relationship resolver.', zh: '找出这段生成的关联字段 resolver 中的数据访问问题。' }
    code: |
      const resolvers = {
        Query: {
          orders: (_root, _args, { db }) => db.orders.list(),
        },
        Order: {
          customer: (order, _args, { db }) =>
            db.customers.findById(order.customerId),
        },
      };
    lang: javascript
    issues:
      - line: 6
        lines: 2
        kind: performance
        note: { en: 'The child resolver performs one backend read per order. A list of N orders therefore adds N customer reads.', zh: '子字段 resolver 为每个订单执行一次后端读取。N 个订单会额外产生 N 次客户读取。' }
    explanation: { en: 'Use a request-scoped loader that batches customer IDs and memoizes duplicate keys. Test the full operation with several orders and assert the backend call count.', zh: '应使用请求级加载器批量处理客户 ID，并记忆重复键。用多个订单执行完整操作，并断言后端调用次数。' }
    difficulty: intermediate
    tags: [n-plus-one, resolver, data-loader]

  - id: mutation-serialization
    type: mcq
    prompt: { en: 'What does GraphQL guarantee for two top-level fields in one mutation operation?', zh: '一个 mutation 操作包含两个顶层字段时，GraphQL 保证什么？' }
    options:
      - { text: { en: 'They execute serially in document order, but are not automatically one transaction.', zh: '它们按文档顺序串行执行，但不会自动组成一个事务。' }, correct: true }
      - { text: { en: 'They execute in parallel inside an automatic transaction.', zh: '它们在自动事务中并行执行。' }, correct: false }
      - { text: { en: 'A failure in the second field rolls back the first field.', zh: '第二个字段失败会回滚第一个字段。' }, correct: false }
      - { text: { en: 'The operation is automatically idempotent on retry.', zh: '重试该操作会自动保持幂等。' }, correct: false }
    explanation: { en: 'Mutation serialization controls top-level execution order only. Transactions, rollback, and retry semantics belong to the application and storage design.', zh: 'Mutation 串行化只控制顶层执行顺序。事务、回滚和重试语义由应用与存储设计负责。' }
    difficulty: intermediate
    tags: [mutation, transaction, idempotency]

  - id: review-generated-order-api
    title: { en: 'Review a generated order graph', zh: '审查生成的订单图' }
    type: review
    prompt: { en: 'Review this generated resolver map before exposing tenant orders.', zh: '在公开租户订单前，审查这份生成的 resolver 映射。' }
    task: { en: 'Return only the viewer’s bounded order page, resolve customers in request-scoped batches, preserve key ordering, and cancel an authorized order safely.', zh: '只返回当前查看者有权访问且大小受限的订单页；按请求批量解析客户并保持键顺序，同时安全地取消已授权订单。' }
    code: |
      const customerLoader = new DataLoader(async (ids) => {
        return db.customers.findMany({ ids });
      });

      const resolvers = {
        Query: {
          orders: async (_root, { userId, first = 10000 }) => {
            const rows = await db.orders.findMany({ ownerId: userId, limit: first });
            return Promise.all(rows.map(async (order) => ({
              ...order,
              customer: await db.customers.findById(order.customerId),
            })));
          },
        },
        Order: {
          customer: (order) => customerLoader.load(order.customerId),
        },
        Mutation: {
          cancelOrder: async (_root, { id }) => {
            await db.orders.update(id, { status: "CANCELLED" });
            return true;
          },
        },
      };
    lang: javascript
    right: { en: 'The generated map separates query and mutation entry points, uses explicit relationship resolution, and returns one Boolean result for cancellation.', zh: '生成代码区分了查询与变更入口，显式处理关联字段，并让取消操作返回一个布尔结果。' }
    checklist:
      - { en: 'Bind every order and mutation lookup to the authenticated principal in context.', zh: '把每个订单与 mutation 查询绑定到上下文中的已认证主体。' }
      - { en: 'Reject invalid page sizes and test aliases or fragments at the largest accepted value.', zh: '拒绝无效分页大小，并用最大允许值测试别名与片段。' }
      - { en: 'Assert loader batch length and key order, including duplicate and missing IDs.', zh: '断言加载批次的长度与键顺序，并覆盖重复和缺失 ID。' }
      - { en: 'Record data-source calls and inject failure around the cancellation write.', zh: '记录数据源调用，并在取消写入前后注入故障。' }
    issues:
      - line: 1
        lines: 8
        kind: security
        note: { en: 'The loader is shared outside request context, and the query trusts a caller-selected userId. Results can cross authorization scopes.', zh: '加载器在请求上下文外共享，查询还信任调用方选择的 userId，结果可能跨越授权范围。' }
      - line: 2
        kind: correctness
        note: { en: 'findMany is returned directly without restoring input order or inserting a value for each missing key, violating the batch contract.', zh: 'findMany 结果未经重排，也没有为缺失键补位，违反了批量函数的返回契约。' }
      - line: 7
        kind: edge-case
        note: { en: 'The default page size is 10,000 and there is no positive, integer, or maximum check on caller input.', zh: '默认分页大小为 10000，而且没有检查调用值是否为正整数或是否超过上限。' }
      - line: 9
        lines: 4
        kind: performance
        note: { en: 'The query loads each customer once before GraphQL then the Order resolver loads it again, creating serial work and duplicate reads.', zh: '查询在 GraphQL 解析前逐个加载客户，随后 Order resolver 又加载一次，产生串行工作与重复读取。' }
    explanation: { en: 'Build loaders inside request context, derive ownership from the authenticated principal, cap pagination, and return plain orders so the relationship resolver performs one ordered batch. Put cancellation authorization and domain transition in one service operation, with retry behavior defined explicitly.', zh: '应在请求上下文中创建加载器，从已认证主体推导所有权，限制分页，并返回普通订单对象，让关联 resolver 完成一次有序批量读取。取消操作的授权与领域状态转换应放进同一个服务操作，并明确定义重试行为。' }
    difficulty: advanced
    tags: [code-review, authorization, batching, pagination]
