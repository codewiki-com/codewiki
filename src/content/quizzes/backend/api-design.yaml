topic: backend/api-design
items:
  - id: predict-delete-response
    type: predict
    prompt: { en: 'What does this program print for a successful deletion?', zh: '删除成功时，这段程序会输出什么？' }
    code: |
      function deleteOrder(exists) {
        if (!exists) return { status: 404, body: { title: "Not Found" } };
        return { status: 204, body: null };
      }

      const response = deleteOrder(true);
      console.log(response.status, response.body);
    lang: javascript
    options:
      - { text: { en: '200 undefined', zh: '200 undefined' }, correct: false }
      - { text: { en: '204 null', zh: '204 null' }, correct: true }
      - { text: { en: '404 Not Found', zh: '404 Not Found' }, correct: false }
      - { text: { en: 'The function throws.', zh: '函数会抛出异常。' }, correct: false }
    explanation: { en: 'The existing order takes the success branch, whose contract uses 204 and an empty body represented here by null.', zh: '订单存在，因此执行成功分支；该契约用 204 表示成功，并在这里用 null 表示空响应体。' }
    difficulty: beginner
    tags: [status-code, no-content, predict-output]

  - id: created-resource-response
    type: mcq
    prompt: { en: 'Which response best describes a successful POST that created order o-42?', zh: 'POST 成功创建订单 o-42 后，哪项响应最准确？' }
    options:
      - { text: { en: '201 Created with Location: /orders/o-42', zh: '201 Created，并带有 Location: /orders/o-42' }, correct: true }
      - { text: { en: '200 OK with only { success: true }', zh: '200 OK，响应体只有 { success: true }' }, correct: false }
      - { text: { en: '204 No Content with Location omitted', zh: '204 No Content，并省略 Location' }, correct: false }
    explanation: { en: '201 identifies resource creation, and Location lets the client address the created resource. A representation may also be returned.', zh: '201 表明资源已经创建，Location 让客户端能够定位新资源；响应还可以包含其表示。' }
    difficulty: beginner
    tags: [post, created, location]

  - id: spot-unconditional-update
    title: { en: 'Spot the bug in the product update', zh: '找出商品更新里的 bug' }
    type: spotbug
    prompt: { en: 'Find the concurrency flaw in this generated product update.', zh: '找出这段生成的商品更新代码中的并发缺陷。' }
    code: |
      async function updateProduct(id, patch, db) {
        const current = await db.products.find(id);
        if (!current) return { status: 404 };
        const updated = { ...current, ...patch };
        await db.products.update(id, updated);
        return { status: 200, body: updated };
      }
    lang: javascript
    issues:
      - line: 5
        kind: correctness
        note: { en: 'The database update is unconditional. Another writer can commit after the read and have its changes silently overwritten.', zh: '数据库更新没有前置条件。另一个写入者可能在读取后提交，其修改随后会被静默覆盖。' }
    explanation: { en: 'Require If-Match and perform a version comparison with the update atomically. Return 412 when the supplied entity tag is stale.', zh: '应要求 If-Match，并在更新时原子比较版本；提供的实体标签过期时返回 412。' }
    difficulty: intermediate
    tags: [etag, lost-update, conditional-request]

  - id: stable-cursor-order
    type: mcq
    prompt: { en: 'Orders are sorted by createdAt, which is not unique. What must a cursor design add first?', zh: '订单按不唯一的 createdAt 排序。游标设计首先还要加入什么？' }
    options:
      - { text: { en: 'A unique tie-breaker such as order id in the ordering and cursor', zh: '在排序与游标中加入订单 ID 等唯一决胜字段' }, correct: true }
      - { text: { en: 'A larger default page size', zh: '更大的默认页大小' }, correct: false }
      - { text: { en: 'A random shuffle before every query', zh: '每次查询前随机打乱结果' }, correct: false }
    explanation: { en: 'A cursor needs a deterministic total order. The unique tie-breaker tells the next query exactly where to continue among equal timestamps.', zh: '游标需要确定的全序。唯一决胜字段能让下一次查询在时间戳相同时准确找到继续位置。' }
    difficulty: intermediate
    tags: [cursor-pagination, ordering, tie-breaker]

  - id: review-generated-transfer-endpoint
    type: review
    title: { en: 'Review a generated transfer endpoint', zh: '审查生成的转账端点' }
    prompt: { en: 'Review this generated transfer endpoint before it handles real accounts.', zh: '在这段生成的转账端点处理真实账户前，对它进行审查。' }
    task: { en: 'Transfer an exact positive amount between authorized accounts, commit atomically, publish one event, and let the caller retry an unknown result safely.', zh: '在已授权账户间转移精确的正数金额，原子提交，只发布一次事件，并让调用方安全重试结果未知的请求。' }
    code: |
      async function createTransfer(request, db) {
        const body = await request.json();
        const amount = Number(body.amount);
        const requestId = crypto.randomUUID();
        const source = await db.accounts.find(body.sourceId);
        const target = await db.accounts.find(body.targetId);
        if (!source) return json(404, { error: "not found" });
        if (!target) return json(404, { error: "not found" });
        source.balance -= amount;
        target.balance += amount;
        await db.accounts.save(source);
        await db.accounts.save(target);
        await db.events.publish("transfer.created", { requestId, amount });
        return json(
          201,
          { id: requestId, sourceId: source.id, targetId: target.id, amount },
        );
      }
    lang: javascript
    right: { en: 'The handler names source and target resources, distinguishes missing accounts with 404, and returns a stable identifier for the created transfer.', zh: '处理器明确区分来源与目标资源，用 404 表示账户不存在，并为新建转账返回稳定标识。' }
    checklist:
      - { en: 'Authorize the authenticated actor against both account identifiers and allowed transfer direction.', zh: '针对两个账户标识和允许的转账方向，对已认证主体执行授权。' }
      - { en: 'Reject missing, non-finite, non-positive, over-precision, and over-balance amounts.', zh: '拒绝缺失、非有限、非正数、精度过高和超过余额的金额。' }
      - { en: 'Inject failure between every write and event step, then verify that no partial transfer remains.', zh: '在每次写入和事件步骤之间注入故障，并验证不会留下部分转账。' }
      - { en: 'Retry with the same caller-supplied key and prove that the transfer and event occur once.', zh: '使用相同的调用方幂等键重试，并证明转账与事件都只发生一次。' }
    issues:
      - line: 2
        kind: security
        note: { en: 'The handler trusts caller-selected account IDs without checking that the authenticated actor may debit the source or credit the target.', zh: '处理器信任调用方选择的账户 ID，却没有检查已认证主体能否从来源账户扣款或向目标账户入账。' }
      - line: 3
        kind: edge-case
        note: { en: 'Number accepts NaN, infinities, negative values, and fractional binary amounts; no positivity, scale, currency, or balance rule is enforced.', zh: 'Number 会接受 NaN、无穷、负数和二进制小数；代码没有检查正数、精度、币种或余额规则。' }
      - line: 5
        lines: 2
        kind: performance
        note: { en: 'The independent account reads are awaited serially, adding one storage round trip to the request path.', zh: '两个相互独立的账户读取被串行等待，请求路径因此多出一次存储往返。' }
      - line: 9
        lines: 5
        kind: correctness
        note: { en: 'Two saves and event publication have no shared transaction or outbox, while each call invents a new ID. Failure or retry can leave partial balances or duplicate effects.', zh: '两次保存与事件发布没有共享事务或 outbox，而且每次调用都新建 ID；故障或重试可能留下部分余额或重复副作用。' }
    explanation: { en: 'Authorize first, parse money into exact minor units, validate domain invariants, and commit both balances plus an outbox record in one transaction. Accept a caller-stable idempotency key and bind it to a request fingerprint and stored result.', zh: '应先授权，把金额解析为精确的最小货币单位，验证领域不变量，并在同一事务中提交双方余额与 outbox 记录。接受调用方稳定提供的幂等键，并将其绑定到请求指纹和已保存结果。' }
    difficulty: advanced
    tags: [code-review, authorization, idempotency, transaction]
