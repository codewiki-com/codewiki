topic: backend/scala-backend
items:
  - id: predict-runtime-validation
    type: predict
    prompt: { en: 'What does this boundary parser print?', zh: '这个边界解析器会输出什么？' }
    code: |
      def parse(raw: String): Either[String, Int] =
        raw.trim.toIntOption
          .filter(1 to 5 contains _)
          .toRight("invalid")

      @main def run(): Unit =
        println(List(" 3 ", "0", "many").map(parse))
    lang: scala
    options:
      - { text: { en: 'List(Right(3), Left(invalid), Left(invalid))', zh: 'List(Right(3), Left(invalid), Left(invalid))' }, correct: true }
      - { text: { en: 'List(Right(3), Right(0), Left(invalid))', zh: 'List(Right(3), Right(0), Left(invalid))' }, correct: false }
      - { text: { en: 'The program throws NumberFormatException on "many".', zh: '程序会在处理 "many" 时抛出 NumberFormatException。' }, correct: false }
      - { text: { en: 'The program does not compile because toIntOption is nullable.', zh: '程序无法编译，因为 toIntOption 是可空的。' }, correct: false }
    explanation: { en: '`toIntOption` represents malformed syntax as `None`, and `filter` also removes the parsed but out-of-range zero before `toRight` assigns the error.', zh: '`toIntOption` 用 `None` 表示格式错误，`filter` 还会移除虽解析成功但越界的零，随后 `toRight` 才加入错误值。' }
    difficulty: beginner
    tags: [validation, either, predict-output]

  - id: io-evaluation-timing
    type: mcq
    prompt: { en: 'When does the body of `IO.println("saved")` normally run?', zh: '`IO.println("saved")` 的函数体通常何时运行？' }
    options:
      - { text: { en: 'Immediately when the `IO` value is constructed.', zh: '构造 `IO` 值时立即运行。' }, correct: false }
      - { text: { en: 'When the returned effect is executed by the Cats Effect runtime.', zh: '返回的效果交给 Cats Effect 运行时执行时。' }, correct: true }
      - { text: { en: 'Only after the JVM garbage collector reaches the value.', zh: '只有 JVM 垃圾回收器访问该值后才运行。' }, correct: false }
      - { text: { en: 'On a new platform thread created for every `IO`.', zh: '在每个 `IO` 都新建的平台线程后运行。' }, correct: false }
    explanation: { en: 'An `IO` describes work; constructing it does not execute the effect. The application runtime interprets the composed value at an owning entry point.', zh: '`IO` 描述工作，构造它不会执行副作用；应用运行时会在拥有该效果的入口解释组合后的值。' }
    difficulty: intermediate
    tags: [cats-effect, io, evaluation]

  - id: spot-eager-future
    title: { en: 'Spot the bug in the eager Future wrapper', zh: '找出 Future 包装器里的 bug' }
    type: spotbug
    prompt: { en: 'Why can this repository call begin before the returned `IO` is run?', zh: '为什么这段仓库调用可能在返回的 `IO` 运行前就开始？' }
    code: |
      def load(id: Long)(using ec: ExecutionContext): IO[User] = {
        val started = Future(repository.find(id))
        IO.fromFuture(IO.pure(started))
      }
    lang: scala
    issues:
      - line: 2
        kind: correctness
        note: { en: '`Future.apply` starts eagerly on the supplied execution context, so creating `started` performs work outside the `IO` evaluation and cancellation lifetime.', zh: '`Future.apply` 会在给定执行上下文中立即启动，因此构造 `started` 已在 `IO` 的求值与取消生命周期之外执行工作。' }
    explanation: { en: 'Delay creation with `IO.fromFuture(IO(Future(...)))` for a genuinely asynchronous API. If `repository.find` blocks, use `IO.blocking` instead and configure its own timeout.', zh: '对于真正的异步 API，可用 `IO.fromFuture(IO(Future(...)))` 推迟创建；若 `repository.find` 会阻塞，则应使用 `IO.blocking` 并配置独立超时。' }
    difficulty: advanced
    tags: [future, io, evaluation, cancellation]

  - id: blocking-boundary
    type: mcq
    prompt: { en: 'What does `IO.blocking(jdbcCall())` provide?', zh: '`IO.blocking(jdbcCall())` 提供什么？' }
    options:
      - { text: { en: 'It makes JDBC nonblocking and transactionally cancellable.', zh: '它让 JDBC 变成非阻塞，并使事务可取消。' }, correct: false }
      - { text: { en: 'It shifts blocking work away from compute threads; the call still needs driver timeouts and capacity limits.', zh: '它把阻塞工作移出计算线程；该调用仍需要驱动超时和容量限制。' }, correct: true }
      - { text: { en: 'It opens one new database connection for the effect.', zh: '它会为该效果新建一条数据库连接。' }, correct: false }
      - { text: { en: 'It serializes all blocking work in the process.', zh: '它会串行执行进程内所有阻塞工作。' }, correct: false }
    explanation: { en: '`IO.blocking` protects the compute pool from a blocking region. It cannot change the dependency protocol, undo committed work, or replace a connection pool and deadlines.', zh: '`IO.blocking` 保护计算线程池不受阻塞区域拖累；它不能改变依赖协议、撤销已提交工作，也不能替代连接池与截止时间。' }
    difficulty: intermediate
    tags: [blocking-io, jdbc, thread-pool]

  - id: resource-release-action
    title: { en: 'Spot the bug in the Resource client helper', zh: '找出 Resource 里的 bug' }
    type: spotbug
    prompt: { en: 'What lifecycle guarantee does this helper discard?', zh: '这个辅助函数丢掉了哪项生命周期保证？' }
    code: |
      def openClient: IO[Client] =
        clientResource.allocated.map { case (client, release) =>
          client
        }
    lang: scala
    issues:
      - line: 2
        kind: correctness
        note: { en: '`allocated` returns both the client and its release action, but the mapping drops that action, so no owner can close the client reliably.', zh: '`allocated` 同时返回客户端与释放动作，这段映射却丢弃了释放动作，因此没有所有者能可靠关闭客户端。' }
    explanation: { en: 'Prefer `clientResource.use` and finish client work inside its lexical scope. Use `allocated` only when an explicit owner stores and invokes the returned release action.', zh: '应优先使用 `clientResource.use`，并在词法作用域内完成客户端工作；只有显式所有者会保存并调用释放动作时才使用 `allocated`。' }
    difficulty: advanced
    tags: [resource, lifecycle, cleanup]

  - id: review-generated-order-route
    type: review
    title: { en: 'Review a generated http4s order route', zh: '审查生成的 http4s 订单路由' }
    prompt: { en: 'Review this route before it accepts production orders.', zh: '在这条路由接收生产订单前，对它进行审查。' }
    task: { en: 'Authenticate the tenant, validate the request, create an order idempotently, and publish a durable notification after commit.', zh: '认证租户、校验请求、以幂等方式创建订单，并在提交后持久发布通知。' }
    code: |
      def routes(
        service: OrderService,
        publisher: Publisher
      ): HttpRoutes[IO] = HttpRoutes.of[IO]:
        case request @ POST -> Root / "orders" =>
          for
            input <- request.as[CreateOrderRequest]
            tenant <- IO.pure(request.headers.get(ci"X-Tenant").get.head.value)
            existing <- service.findByKey(input.requestId)
            response <- existing match
              case Some(order) => Ok(order)
              case None =>
                for
                  order <- service.create(tenant, input)
                  _ <- IO(publisher.publish(order))
                  response <- Created(order)
                yield response
          yield response
    lang: scala
    issues:
      - line: 7
        kind: edge-case
        note: { en: 'Entity decoding does not reject blank SKUs, invalid quantities, every unwanted field, or an empty idempotency key; explicit runtime validation is missing.', zh: '实体解码不会拒绝空 SKU、非法数量、所有多余字段或空幂等键；这里缺少显式运行时校验。' }
      - line: 8
        kind: security
        note: { en: 'The caller controls `X-Tenant`, and unsafe `get` calls turn a missing header into a server fault. Tenant scope must come from an authenticated and authorized principal.', zh: '调用方可以控制 `X-Tenant`，而不安全的 `get` 会把请求头缺失变成服务端故障；租户范围必须来自经过认证与授权的主体。' }
      - line: 9
        kind: correctness
        note: { en: 'The separate lookup and create are not atomic, so concurrent retries can both create an order; the key is not bound to a normalized request fingerprint either.', zh: '分开的查询与创建不是原子操作，并发重试可能各自创建订单；该键也没有绑定规范化请求指纹。' }
      - line: 15
        kind: performance
        note: { en: 'A synchronous publisher is wrapped in ordinary `IO`, so a blocking publish occupies compute threads and has no stated concurrency or timeout bound.', zh: '同步发布器被包装在普通 `IO` 中；阻塞发布会占住计算线程，而且没有明确的并发或超时上限。' }
    right: { en: 'The route receives dependencies explicitly, distinguishes an existing result, and returns 201 for a newly created order.', zh: '这条路由显式接收依赖，区分已有结果，并为新建订单返回 201。' }
    checklist:
      - { en: 'Derive tenant scope from an authenticated principal and authorize the target resource.', zh: '从认证主体推导租户范围，并对目标资源执行授权。' }
      - { en: 'Decode, normalize, and validate transport data before constructing a domain command.', zh: '构造领域命令前，对传输数据进行解码、规范化与校验。' }
      - { en: 'Atomically store the idempotency key, request fingerprint, order, and response.', zh: '原子保存幂等键、请求指纹、订单与响应。' }
      - { en: 'Publish through a transactional outbox and bound the publisher runtime.', zh: '通过事务 outbox 发布，并限制发布器运行容量。' }
    explanation: { en: 'Move trust decisions to authentication and validation boundaries, and put deduplication beside the durable write. An outbox closes the commit-to-publish loss window; the publisher still needs bounded blocking and retry behavior.', zh: '应在认证与校验边界做出信任决策，并让去重与持久写入相邻；outbox 可以关闭提交到发布之间的丢失窗口，发布器仍需限制阻塞与重试行为。' }
    difficulty: advanced
    minutes: 8
    tags: [code-review, security, idempotency, resource-safety]
