topic: backend/file-upload
items:
  - id: predict-publication-state
    type: predict
    prompt: { en: 'What does this publication gate print?', zh: '这个发布关卡会输出什么？' }
    code: |
      function decide({ sizeMatches, typeParses, scanStatus }) {
        if (!sizeMatches || !typeParses) return 'rejected';
        if (scanStatus !== 'clean') return 'quarantined';
        return 'available';
      }

      console.log(decide({
        sizeMatches: true,
        typeParses: true,
        scanStatus: 'timeout',
      }));
    lang: javascript
    options:
      - { text: { en: 'available', zh: 'available' }, correct: false }
      - { text: { en: 'rejected', zh: 'rejected' }, correct: false }
      - { text: { en: 'quarantined', zh: 'quarantined' }, correct: true }
      - { text: { en: 'The function throws.', zh: '函数会抛出异常。' }, correct: false }
    explanation: { en: 'Size and parsing pass, but a timeout is not a clean scan result. The upload stays quarantined instead of failing open.', zh: '大小与解析检查通过，但超时不等于扫描结果干净。上传应保持隔离，不能失败后放行。' }
    difficulty: beginner
    tags: [state-machine, quarantine, fail-closed]

  - id: multipart-meanings
    type: mcq
    prompt: { en: 'Which statement correctly distinguishes multipart/form-data from an object-store multipart upload?', zh: '哪项正确区分了 multipart/form-data 与对象存储 multipart upload？' }
    options:
      - { text: { en: 'The first frames form fields in one HTTP body; the second transfers independently addressable parts of one object before completion.', zh: '前者在一个 HTTP 消息体中分隔表单字段；后者在完成前独立传输同一对象的多个分段。' }, correct: true }
      - { text: { en: 'They are two names for the same boundary syntax.', zh: '它们只是同一种 boundary 语法的两个名称。' }, correct: false }
      - { text: { en: 'Object-store multipart upload validates the media type automatically.', zh: '对象存储 multipart upload 会自动验证媒体类型。' }, correct: false }
    explanation: { en: 'Form multipart is a message encoding governed by a boundary. Object multipart is a storage protocol with initiation, part transfer, and completion.', zh: '表单 multipart 是由 boundary 分隔的消息编码；对象 multipart 是包含初始化、分段传输与完成操作的存储协议。' }
    difficulty: beginner
    tags: [multipart-form-data, object-storage, protocol]

  - id: spot-client-completion
    type: spotbug
    prompt: { en: 'Find the trust-boundary flaw in this direct-upload completion handler.', zh: '找出这个直传完成处理器的信任边界缺陷。' }
    code: |
      async function completeUpload(id, body, actor, db) {
        const record = await db.files.find(id);
        if (record.ownerId !== actor.id) throw new Error('forbidden');
        await db.files.update(id, {
          status: 'available',
          size: body.size,
          contentType: body.contentType,
          checksum: body.sha256,
        });
        return { id, status: 'available' };
      }
    lang: javascript
    issues:
      - line: 4
        lines: 6
        kind: correctness
        note: { en: 'The handler publishes metadata supplied by the client without checking the pending state or reading the actual key, size, checksum, object version, and scan result from trusted services.', zh: '处理器没有检查 pending 状态，也没有从可信服务读取实际的键、大小、校验和、对象版本和扫描结果，就发布了客户端提交的元数据。' }
    explanation: { en: 'The completion operation must compare stored intent with storage-observed properties and a scan bound to that object version, then conditionally transition the owned pending record.', zh: '完成操作必须把已保存意图与存储层观察到的属性比较，并核对绑定该对象版本的扫描结果，再以条件更新转换调用者拥有的 pending 记录。' }
    difficulty: intermediate
    tags: [direct-upload, trust-boundary, conditional-update]

  - id: backpressure-preservation
    type: mcq
    prompt: { en: 'Which implementation preserves backpressure while writing an upload?', zh: '哪种上传写入实现能保留背压？' }
    options:
      - { text: { en: 'Pipe the readable through bounded transforms into the writable with pipeline(), and bound concurrent pipelines.', zh: '使用 pipeline() 让可读流经过有界转换流进入可写流，并限制并发管线数。' }, correct: true }
      - { text: { en: 'Push every data chunk into an array, then concatenate after end.', zh: '把每个 data 块放入数组，结束后再拼接。' }, correct: false }
      - { text: { en: 'Start one pipeline per request without an admission limit.', zh: '每个请求都启动一条管线，不设置准入上限。' }, correct: false }
      - { text: { en: 'Trust Content-Length and disable byte counting inside the stream.', zh: '信任 Content-Length，并关闭流内字节计数。' }, correct: false }
    explanation: { en: 'pipeline() connects stream pressure and error propagation, while an admission bound controls aggregate buffers and file descriptors. Streaming still needs an actual byte counter.', zh: 'pipeline() 连接各段的压力与错误传播，准入上限则控制缓冲区和文件描述符总量。流式处理仍需实际字节计数器。' }
    difficulty: intermediate
    tags: [streaming, backpressure, capacity]

  - id: review-generated-upload-handler
    type: review
    prompt: { en: 'Review this generated upload handler before it receives profile images.', zh: '在这个生成的上传处理器接收头像前完成代码审查。' }
    task: { en: 'Accept an authenticated user’s PNG up to 8 MiB, stream it under a server-generated key into private quarantine, validate the complete image, scan it, and publish only a clean result while cleaning failures.', zh: '接收已认证用户不超过 8 MiB 的 PNG，以服务端生成的键流式写入私有隔离区，完整验证并扫描图像，只发布干净结果，并清理失败数据。' }
    code: |
      async function acceptUpload(req, db, scan) {
        const filename = req.headers['x-file-name'];
        const path = `/srv/public/uploads/${filename}`;
        const chunks = [];
        for await (const chunk of req) chunks.push(chunk);
        const body = Buffer.concat(chunks);

        if (req.headers['content-type'] !== 'image/png') {
          throw new Error('unsupported type');
        }

        await writeFile(path, body);
        const row = await db.files.insert({
          ownerId: req.user.id,
          path,
          contentType: req.headers['content-type'],
          status: 'available',
        });
        await scan(path);
        return { id: row.id, url: `/uploads/${filename}` };
      }
    lang: javascript
    right: { en: 'The handler associates the record with the authenticated user, rejects one unsupported declared type, and awaits its write, database, and scan operations.', zh: '处理器把记录关联到已认证用户，拒绝了一种不支持的声明类型，并等待了写入、数据库和扫描操作。' }
    checklist:
      - { en: 'Test authorization, server-generated naming, path containment, and non-public quarantine permissions.', zh: '测试授权、服务端命名、路径 containment 与非公开隔离区权限。' }
      - { en: 'Send absent lengths, oversized streams, slow streams, disconnects, corrupt PNGs, and decompression-heavy images.', zh: '发送缺失长度、超限流、慢速流、中断连接、损坏 PNG 和解压开销过高的图像。' }
      - { en: 'Fail the write, decoder, scanner, and database in turn; verify state and partial-data cleanup.', zh: '依次让写入、解码器、扫描器和数据库失败，验证状态与部分数据清理。' }
      - { en: 'Prove that only the expected object version reaches available and that completion is idempotent.', zh: '证明只有预期对象版本能进入 available，且完成操作具备幂等性。' }
    issues:
      - line: 3
        kind: security
        note: { en: 'The untrusted filename selects a path under a public directory, allowing traversal, overwrite, and exposure before validation.', zh: '不可信文件名决定了公开目录下的路径，可能造成路径穿越、覆盖，以及验证前暴露。' }
      - line: 4
        lines: 3
        kind: performance
        note: { en: 'The complete unbounded request is accumulated in memory, bypassing backpressure and the required 8 MiB streaming limit.', zh: '完整且无界的请求被累积到内存中，绕开了背压与所需的 8 MiB 流式限制。' }
      - line: 8
        lines: 3
        kind: edge-case
        note: { en: 'The code accepts an empty, truncated, or malformed body whenever the client declares image/png; it never checks actual bytes or decodes the complete image.', zh: '只要客户端声明 image/png，代码就会接受空、截断或畸形消息体；它从未检查实际字节，也未完整解码图像。' }
      - line: 12
        lines: 8
        kind: correctness
        note: { en: 'The handler writes publicly and records available before scanning, then ignores the scan result and has no cleanup path for any failure.', zh: '处理器先公开写入并记录 available，之后才扫描；它还忽略扫描结果，并且任何失败都没有清理路径。' }
    explanation: { en: 'Create a pending record and random key first, then pipeline the request through an actual byte meter into private quarantine. Fully decode under resource limits, bind a clean scan to the stored version, and conditionally publish; every failure closes streams and removes or expires partial state.', zh: '应先创建 pending 记录与随机键，再通过带实际字节计数器的 pipeline 把请求写入私有隔离区。在资源限制下完整解码，把干净扫描结论绑定到已存版本，并以条件更新发布；每种失败都要关闭流并删除或让部分状态到期。' }
    difficulty: advanced
    tags: [code-review, file-upload, security, streaming]
