topic: backend/wsgi
items:
  - id: predict-generator-start
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      def application(environ, start_response):
          start_response("200 OK", [])
          yield b"A"
          yield b"B"

      statuses = []

      def start_response(status, headers, exc_info=None):
          statuses.append(status)
          return lambda data: None

      result = application({}, start_response)
      print(statuses)
      print(list(result))
      print(statuses)
    lang: python
    options:
      - text:
          en: "[]\n[b'A', b'B']\n['200 OK']"
          zh: "[]\n[b'A', b'B']\n['200 OK']"
        correct: true
      - text:
          en: "['200 OK']\n[b'A', b'B']\n['200 OK']"
          zh: "['200 OK']\n[b'A', b'B']\n['200 OK']"
        correct: false
      - text:
          en: "[]\n[]\n['200 OK']"
          zh: "[]\n[]\n['200 OK']"
        correct: false
    explanation: { en: 'Calling a generator function creates the generator without running its body. The first iteration calls start_response and then yields both byte chunks.', zh: '调用生成器函数只会创建生成器，不会立即执行函数体。开始迭代后才调用 start_response，并依次产出两个字节块。' }
    difficulty: intermediate
    tags: [wsgi, generator, predict-output]

  - id: concurrency-model
    type: mcq
    prompt: { en: 'Which statement about WSGI concurrency is correct?', zh: '关于 WSGI 并发，哪一项说法正确？' }
    options:
      - { text: { en: 'WSGI requires one thread and one process for the whole server.', zh: 'WSGI 要求整个服务器只能使用一个线程和一个进程。' }, correct: false }
      - { text: { en: 'WSGI calls are synchronous, while the server may run several calls in threads or processes.', zh: 'WSGI 调用是同步的，但服务器可以在线程或进程中并发运行多个调用。' }, correct: true }
      - { text: { en: 'A true wsgi.multithread value makes application globals thread-safe.', zh: 'wsgi.multithread 为真会让应用全局变量自动具备线程安全性。' }, correct: false }
    explanation: { en: 'The protocol describes a synchronous application call, not a fixed worker architecture. The environ flags report server behavior but add no synchronization.', zh: '该协议描述同步应用调用，不规定固定的工作进程架构。environ 标志只报告服务器行为，不会添加同步机制。' }
    difficulty: intermediate
    tags: [wsgi, concurrency, environ]

  - id: spot-text-body
    type: spotbug
    prompt: { en: 'Find the WSGI contract violation in this response.', zh: '找出这段响应违反 WSGI 契约的位置。' }
    code: |
      def application(environ, start_response):
          body = "café"
          start_response("200 OK", [("Content-Type", "text/plain")])
          return [body]
    lang: python
    issues:
      - line: 4
        kind: correctness
        note: { en: 'A WSGI response iterable must yield bytes, not str. Encode the body and declare the matching charset.', zh: 'WSGI 响应可迭代对象必须产出 bytes，不能产出 str。应编码正文并声明匹配的字符集。' }
    explanation: { en: 'Return an encoded byte body such as body.encode("utf-8"), set charset=utf-8, and calculate any Content-Length from those bytes.', zh: '应返回 body.encode("utf-8") 之类的已编码字节，设置 charset=utf-8，并根据这些字节计算 Content-Length。' }
    difficulty: beginner
    tags: [wsgi, bytes, spotbug]

  - id: input-length-boundary
    type: mcq
    prompt: { en: 'What is the safest portable way to read a normal WSGI request body?', zh: '以可移植方式读取普通 WSGI 请求正文，哪一种做法最安全？' }
    options:
      - { text: { en: 'Call environ["wsgi.input"].read() with no limit for every request.', zh: '对每个请求都无参数调用 environ["wsgi.input"].read()。' }, correct: false }
      - { text: { en: 'Validate CONTENT_LENGTH, enforce an application byte limit, then read no more than the accepted length.', zh: '校验 CONTENT_LENGTH，执行应用字节上限，再读取不超过已接受长度的字节。' }, correct: true }
      - { text: { en: 'Read until a newline because HTTP bodies always end with one.', zh: '一直读取到换行符，因为 HTTP 正文总是以换行符结尾。' }, correct: false }
      - { text: { en: 'Trust a Content-Type header to impose the correct memory limit.', zh: '信任 Content-Type 响应头，由它实施正确的内存限制。' }, correct: false }
    explanation: { en: 'CONTENT_LENGTH defines the declared transport length, but the application still needs its own maximum and invalid-length handling. Unbounded reads may block or exhaust memory.', zh: 'CONTENT_LENGTH 定义声明的传输长度，但应用仍需自己的上限与无效长度处理。无界读取可能阻塞或耗尽内存。' }
    difficulty: intermediate
    tags: [wsgi-input, content-length, resource-limit]

  - id: review-access-log-middleware
    type: review
    title: { en: 'Review generated WSGI logging middleware', zh: '审查生成的 WSGI 日志中间件' }
    prompt: { en: 'Review this generated middleware for protocol correctness, security, edge cases, and streaming behavior.', zh: '从协议正确性、安全性、边界情况和流式行为审查这段生成的中间件。' }
    task: { en: 'Log the method, path, and response status while preserving the downstream WSGI response.', zh: '记录方法、路径和响应状态，同时保留下游 WSGI 响应的行为。' }
    code: |
      class AccessLogMiddleware:
          def __init__(self, app):
              self.app = app
              self.status = None

          def __call__(self, environ, start_response):
              chunks = []
              def capture(status, headers, exc_info=None):
                  self.status = status
                  return start_response(status, headers, exc_info)

              result = self.app(environ, capture)
              for chunk in result:
                  chunks.append(chunk)
              print(environ.get("HTTP_AUTHORIZATION"), self.status)
              return [b"".join(chunks)]
    lang: python
    issues:
      - line: 9
        kind: correctness
        note: { en: 'The response status is stored on a shared middleware instance, so concurrent requests can overwrite one another. Keep it in request-local closure state.', zh: '响应状态保存在共享中间件实例上，并发请求可能互相覆盖。应把它保存在每次请求的闭包状态中。' }
      - line: 13
        lines: 2
        kind: performance
        note: { en: 'The loop buffers the complete downstream iterable and destroys incremental streaming. Yield chunks through a wrapper instead.', zh: '这个循环缓冲完整的下游可迭代对象，破坏了增量流式传输。应通过包装器继续产出字节块。' }
      - line: 12
        kind: edge-case
        note: { en: 'The downstream result is never closed, so early termination and generator cleanup are lost. The wrapper must propagate close().', zh: '下游结果从未关闭，因此提前终止和生成器清理会丢失。包装器必须传递 close()。' }
      - line: 15
        kind: security
        note: { en: 'Logging HTTP_AUTHORIZATION exposes credentials. Log an approved request identifier and redacted metadata instead.', zh: '记录 HTTP_AUTHORIZATION 会泄露凭据。应改为记录获准的请求标识与脱敏元数据。' }
    right: { en: 'The code wraps an arbitrary WSGI application and correctly preserves the optional exc_info argument when forwarding start_response.', zh: '这段代码可以包装任意 WSGI 应用，并在转发 start_response 时正确保留可选的 exc_info 参数。' }
    checklist:
      - { en: 'Keep all request-specific state local to one application call.', zh: '把所有请求专属状态限制在单次应用调用内。' }
      - { en: 'Preserve byte order and streaming without full-body buffering.', zh: '不缓冲完整正文，并保持字节顺序与流式传输。' }
      - { en: 'Forward exc_info and close() across the wrapper.', zh: '跨包装器传递 exc_info 与 close()。' }
      - { en: 'Redact credentials and other sensitive request headers.', zh: '脱敏凭据及其他敏感请求头。' }
    explanation: { en: 'Use request-local status storage and a closing iterable wrapper that yields each downstream chunk unchanged. Log only approved metadata after status is known.', zh: '应使用请求局部状态，并通过可关闭的可迭代包装器原样产出下游字节块。状态确定后，只记录获准的元数据。' }
    difficulty: advanced
    minutes: 8
    tags: [wsgi, middleware, code-review]
