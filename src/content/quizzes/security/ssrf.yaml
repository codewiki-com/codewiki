topic: security/ssrf
items:
  - id: predict-url-authority
    type: predict
    prompt:
      en: What authority fields does the URL parser print?
      zh: URL解析器会输出哪些authority字段？
    code: |
      const target = new URL('https://api.example@127.0.0.1:8443/data');
      console.log(target.hostname);
      console.log(target.port);
      console.log(target.username);
    lang: javascript
    options:
      - text:
          en: "127.0.0.1, then 8443, then api.example"
          zh: "依次为127.0.0.1、8443、api.example"
        correct: true
      - text:
          en: "api.example, then 8443, then an empty string"
          zh: "依次为api.example、8443、空字符串"
        correct: false
      - text:
          en: "api.example@127.0.0.1, then 8443, then an empty string"
          zh: "依次为api.example@127.0.0.1、8443、空字符串"
        correct: false
    explanation:
      en: Text before the at-sign is user information, not the hostname. Parsed fields expose the actual authority more reliably than substring inspection.
      zh: >-
        @ 符号前的文本属于用户信息，不是主机名。解析字段比子字符串检查更能准确体现实际authority。
    difficulty: beginner
    tags: [url-parsing, authority, predict-output]

  - id: dns-check-versus-connection
    type: mcq
    prompt:
      en: Code approves a DNS answer and then gives the original URL to an HTTP client that resolves the name again. What remains wrong?
      zh: 代码批准DNS答案后，把原始URL交给会再次解析名称的HTTP客户端。还存在什么问题？
    options:
      - text:
          en: The checked address is not bound to the connection, so the second lookup may select a prohibited address
          zh: 被检查地址没有绑定到连接，第二次查询可能选中被禁止的地址
        correct: true
      - text:
          en: DNS names cannot be used with HTTPS certificates
          zh: DNS名称无法用于HTTPS证书
        correct: false
      - text:
          en: A hostname becomes safe whenever its first answer is public
          zh: 只要首个答案是公共地址，主机名就会变得安全
        correct: false
    explanation:
      en: Validation and use are separate operations unless the client connects through the approved result. Preserve the hostname for TLS while binding an approved address to the socket or enforcing policy in an egress proxy.
      zh: 如果客户端没有通过获准结果建立连接，校验与使用就是两次独立操作。应保留主机名用于TLS，同时把获准地址绑定到套接字，或由出站代理执行策略。
    difficulty: intermediate
    tags: [dns-rebinding, toctou, address-pinning]

  - id: spot-hostname-suffix
    title:
      en: Spot the bug in the preview helper
      zh: 找出预览辅助函数里的bug
    type: spotbug
    prompt:
      en: Find the SSRF bug in this generated preview helper.
      zh: 找出这段生成的预览辅助函数中的SSRF缺陷。
    code: |
      async function preview(input) {
        const target = new URL(input);
        if (!target.hostname.endsWith('example.com')) throw new Error('blocked');
        return fetch(target, { redirect: 'follow' });
      }
    lang: javascript
    issues:
      - line: 3
        kind: security
        note:
          en: A suffix without a DNS label boundary accepts names such as attackerexample.com, and the code never checks the resolved addresses.
          zh: 没有DNS标签边界的后缀检查会接受attackerexample.com等名称，而且代码从未检查解析后的地址。
      - line: 4
        kind: correctness
        note:
          en: Automatic redirect following lets the approved first URL choose a second destination without repeating policy.
          zh: 自动跟随重定向会让获准的首个URL在不重复执行策略的情况下选择第二个目标。
    explanation:
      en: Compare exact configured hostnames or explicit subdomain boundaries, validate every selectable DNS answer, bind the approved address to the connection, and revalidate redirects.
      zh: 应比较精确配置的主机名或明确子域边界，检查每个可能选用的DNS答案，把获准地址绑定到连接，并重新校验重定向。
    difficulty: intermediate
    tags: [hostname-validation, redirects, code-review]

  - id: metadata-hardening-boundary
    type: mcq
    prompt:
      en: An EC2 workload requires IMDSv2. Which statement about its SSRF posture is accurate?
      zh: EC2工作负载强制使用IMDSv2。关于它的SSRF防护，哪项描述准确？
    options:
      - text:
          en: It reduces metadata exposure for some request shapes, but application destination controls and egress restrictions are still required
          zh: 它能降低部分请求形态下的元数据暴露，但应用目标控制与出站限制仍然不可少
        correct: true
      - text:
          en: It makes every server-side request destination trustworthy
          zh: 它会让所有服务端请求目标都变得可信
        correct: false
      - text:
          en: It prevents the workload from reaching any other internal HTTP service
          zh: 它能阻止工作负载访问所有其他内部HTTP服务
        correct: false
    explanation:
      en: IMDSv2 protects one provider-specific metadata path with a token flow. It neither removes arbitrary outbound fetches nor controls access to unrelated internal or public services.
      zh: IMDSv2通过令牌流程保护一个云平台特有的元数据路径。它既不会移除任意出站抓取，也不控制对其他内部或公共服务的访问。
    difficulty: intermediate
    tags: [cloud-metadata, defense-in-depth, imdsv2]

  - id: review-generated-webhook-delivery
    title:
      en: Review generated webhook delivery
      zh: 审查生成的Webhook投递函数
    type: review
    prompt:
      en: Review this AI-generated webhook delivery function before deployment.
      zh: 部署前审查这个由AI生成的Webhook投递函数。
    task:
      en: Send a small JSON event only to configured partner endpoints, prevent internal-network access and credential leakage, revalidate redirects, and return a bounded delivery result.
      zh: 只向已配置的合作方端点发送小型JSON事件，阻止访问内网和泄露凭据，重新校验重定向，并返回有界的投递结果。
    code: |
      async function deliverWebhook(request, fetchImpl) {
        const target = new URL(request.body.url);
        if (!target.hostname.includes('partner.example')) {
          return { status: 400, error: 'destination rejected' };
        }
        const response = await fetchImpl(target, {
          method: 'POST',
          redirect: 'follow',
          headers: {
            ...request.headers,
            authorization: `Bearer ${process.env.INTERNAL_TOKEN}`,
            'content-type': 'application/json',
          },
          body: JSON.stringify(request.body.event),
        });
        const body = await response.arrayBuffer();
        console.log('webhook response', target.href, Buffer.from(body).toString());
        return { status: response.status, bytes: body.byteLength };
      }
    lang: javascript
    right:
      en: The generated function injects its transport dependency, fixes the outbound method, sets the JSON media type, serializes the event explicitly, and returns a small result shape rather than the response body.
      zh: 生成函数显式注入传输依赖，固定了出站方法，设置JSON媒体类型，明确序列化事件，并返回小型结果结构而不是响应正文。
    issues:
      - line: 2
        kind: edge-case
        note:
          en: A missing or malformed URL throws outside a defined delivery result, so ordinary input failure becomes an uncontrolled rejection.
          zh: URL缺失或畸形时，函数不会返回约定的投递结果，而是产生未受控的异常拒绝。
      - line: 3
        kind: security
        note:
          en: Substring matching accepts attacker-controlled hostnames containing partner.example and does not validate or bind resolved addresses.
          zh: 子字符串匹配会接受包含partner.example的攻击者主机名，也没有校验并绑定解析后的地址。
      - line: 8
        kind: correctness
        note:
          en: Automatic redirects let the first endpoint choose an unchecked next destination while retaining a state-changing request.
          zh: 自动重定向让首个端点选择未经检查的下一目标，同时保留具有副作用的请求。
      - line: 10
        kind: readability
        note:
          en: Spreading the inbound header set hides the outbound header contract and makes credential and forwarding-header ownership hard to review.
          zh: 展开入站请求头会掩盖出站请求头契约，使凭据与转发头的归属难以审查。
      - line: 16
        kind: performance
        note:
          en: arrayBuffer buffers an unbounded response before measuring it, so a partner can exhaust memory or hold the delivery open.
          zh: arrayBuffer会先缓冲无界响应再计量，因此合作方可能耗尽内存或长期占用投递连接。
    checklist:
      - en: Map a server-defined endpoint ID to an exact scheme, host, port, credential, method, and event schema.
        zh: 把服务端定义的端点ID映射到精确协议、主机、端口、凭据、方法与事件模式。
      - en: Validate all resolved addresses, bind an approved address to the connection, and repeat the decision for every redirect or retry.
        zh: 校验所有解析地址，把获准地址绑定到连接，并对每次重定向或重试重复决策。
      - en: Build outbound headers from an allowlist and prove that inbound cookies, authorization, and forwarding headers never leave the service.
        zh: 从允许列表构造出站请求头，并证明入站Cookie、授权头与转发头绝不会离开服务。
      - en: Enforce deadlines, byte and decompression limits, concurrency budgets, and stable redacted logging.
        zh: 限制期限、字节数、解压后大小与并发预算，并使用稳定的脱敏日志。
    explanation:
      en: Replace the caller-provided destination with a configured endpoint identity and route delivery through one policy-enforcing connection layer. Rebuild headers per service, handle redirects manually, stream under explicit limits, and return controlled errors for malformed input and unavailable dependencies.
      zh: 应以配置的端点身份替代调用方提供的目标，让投递统一经过执行策略的连接层。按服务重新构造请求头，手动处理重定向，在明确限制下流式读取，并为畸形输入与依赖不可用返回受控错误。
    difficulty: advanced
    tags: [generated-code, webhooks, ssrf, code-review]
