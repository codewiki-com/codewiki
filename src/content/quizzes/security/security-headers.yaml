topic: security/security-headers
items:
  - id: predict-https-only-hsts
    type: predict
    prompt:
      en: What does this response-header builder print?
      zh: 这个响应头构造函数会输出什么？
    code: |
      function headers({ https }) {
        const result = {
          'X-Content-Type-Options': 'nosniff',
        };
        if (https) {
          result['Strict-Transport-Security'] = 'max-age=31536000';
        }
        return result;
      }

      console.log(Object.keys(headers({ https: false })).length);
      console.log(Object.keys(headers({ https: true })).length);
    lang: javascript
    options:
      - text: { en: "1 then 2", zh: "先输出 1，再输出 2" }
        correct: true
      - text: { en: "2 then 2", zh: "先输出 2，再输出 2" }
        correct: false
      - text: { en: "0 then 1", zh: "先输出 0，再输出 1" }
        correct: false
    explanation:
      en: The MIME protection is present in both cases. HSTS is added only to the HTTPS response, so the object grows from one field to two.
      zh: MIME 防护在两种情况下都存在。HSTS 只添加到 HTTPS 响应，因此对象字段数从 1 增加到 2。
    difficulty: beginner
    tags: [hsts, response-headers, predict-output]

  - id: hsts-first-visit-boundary
    type: mcq
    prompt:
      en: What closes the first-visit HTTP window that an ordinary HSTS response cannot close by itself?
      zh: 普通 HSTS 响应本身无法关闭首次 HTTP 访问窗口，什么机制可以关闭它？
    options:
      - text:
          en: A successfully registered HSTS preload entry shipped by the browser
          zh: 已成功登记并随浏览器发布的 HSTS 预加载条目
        correct: true
      - text:
          en: Adding preload to an HTTP response without submitting the domain
          zh: 只在 HTTP 响应中添加 preload，但不提交域名
        correct: false
      - text:
          en: Setting X-Content-Type-Options to nosniff
          zh: 把 X-Content-Type-Options 设置为 nosniff
        correct: false
    explanation:
      en: A browser must learn ordinary HSTS over valid HTTPS before it can upgrade later visits. Preload can provide state before the first connection, but the response token alone does not register a domain.
      zh: 浏览器必须先通过有效 HTTPS 获知普通 HSTS，才能升级后续访问。预加载可以在首次连接前提供状态，但响应中的令牌不会自行登记域名。
    difficulty: intermediate
    tags: [hsts, preload, transport-security]

  - id: spot-reused-csp-nonce
    title:
      en: Spot the bug in the CSP nonce middleware
      zh: 找出 CSP nonce 里的 bug
    type: spotbug
    prompt:
      en: Find the security bug in this generated CSP nonce middleware.
      zh: 找出这段生成的 CSP nonce 中间件中的安全缺陷。
    code: |
      import { randomBytes } from 'node:crypto';

      const nonce = randomBytes(16).toString('base64');

      function addCsp(request, response, next) {
        response.locals.nonce = nonce;
        response.setHeader(
          'Content-Security-Policy',
          `default-src 'self'; script-src 'nonce-${nonce}'`,
        );
        next();
      }
    lang: javascript
    issues:
      - line: 3
        kind: security
        note:
          en: The nonce is created once at process startup and reused for every response, so a value disclosed from one page remains valid on other pages using this process.
          zh: nonce 只在进程启动时生成一次并被所有响应复用，因此从一个页面泄露的值会继续对该进程生成的其他页面有效。
    explanation:
      en: Generate the nonce inside request handling with a cryptographic random source, then pass that one response's value to both the CSP builder and template. Test that consecutive responses differ.
      zh: 应在请求处理过程中使用密码学随机源生成 nonce，再把本次响应的同一个值传给 CSP 构造器与模板，并测试连续响应的值不同。
    difficulty: intermediate
    tags: [csp, nonce, code-review]

  - id: framing-direction
    type: mcq
    prompt:
      en: Which directive controls which parent pages may embed the current response?
      zh: 哪项指令控制哪些父页面可以嵌入当前响应？
    options:
      - text: { en: "CSP frame-ancestors", zh: "CSP frame-ancestors" }
        correct: true
      - text: { en: "CSP frame-src", zh: "CSP frame-src" }
        correct: false
      - text: { en: "Referrer-Policy", zh: "Referrer-Policy" }
        correct: false
    explanation:
      en: frame-ancestors constrains the current page's embedding ancestors. frame-src controls frame resources that the current page itself may load.
      zh: frame-ancestors 限制当前页面的嵌入祖先。frame-src 控制当前页面自身可以加载的 frame 资源。
    difficulty: beginner
    tags: [csp, clickjacking, framing]

  - id: review-generated-dashboard-headers
    title:
      en: Review generated dashboard response
      zh: 审查生成的仪表盘响应
    type: review
    prompt:
      en: Review this generated dashboard response before production deployment.
      zh: 在生产部署前审查这段生成的仪表盘响应代码。
    task:
      en: Render an authenticated dashboard with a per-response CSP nonce, minimal page-specific headers, safely serialized profile data, bounded history, and consistent protection on every response path.
      zh: 渲染已认证仪表盘，为每个响应生成 CSP nonce，设置页面所需的最小响应头，安全序列化资料数据，限制历史记录，并保护所有响应路径。
    code: |
      const nonce = Math.random().toString(36);
      const sharedPolicy = "default-src *; script-src * 'unsafe-inline'";

      function generatedHeaders(request) {
        return {
          'Content-Security-Policy': sharedPolicy,
          'Strict-Transport-Security': 'max-age=31536000; includeSubDomains; preload',
          'X-Content-Type-Options': 'nosniff',
          'Permissions-Policy': `camera=(${request.query.cameraOrigin})`,
        };
      }

      async function renderDashboard(request, response, db) {
        if (request.path === '/health') {
          return response.status(200).send('ok');
        }
        const history = await db.events.findAll({ userId: request.user.id });
        response.set(generatedHeaders(request));
        response.send(`<script nonce="${nonce}">window.data=${JSON.stringify(history)}</script>`);
      }
    lang: javascript
    right:
      en: The function centralizes response-header construction, sets nosniff, scopes the data lookup to the authenticated user, and waits for storage before responding.
      zh: 函数集中构造响应头，设置了 nosniff，按已认证用户限制数据查询，并在响应前等待存储操作完成。
    issues:
      - line: 1
        kind: correctness
        note:
          en: The nonce is neither cryptographically generated per response nor present in sharedPolicy, so the implementation does not meet the requested nonce contract.
          zh: nonce 既不是为每个响应使用密码学随机源生成，也没有出现在 sharedPolicy 中，因此实现没有满足所要求的 nonce 契约。
      - line: 2
        kind: readability
        note:
          en: One opaque shared policy gives every page broad wildcard and inline-script exceptions without naming which response class needs each relaxation or who owns it.
          zh: 一条含糊的共享策略让所有页面都获得宽泛通配符与内联脚本例外，却没有说明哪个响应类别需要哪项放宽以及由谁负责。
      - line: 9
        kind: edge-case
        note:
          en: Missing or malformed cameraOrigin input produces a meaningless or invalid feature allowlist instead of a reviewed server-side policy.
          zh: cameraOrigin 缺失或格式错误时会产生无意义或无效的功能允许列表，而不是经过评审的服务端策略。
      - line: 15
        kind: security
        note:
          en: The health response returns before headers are applied, showing that other early errors can leave browser-rendered responses outside the intended policy.
          zh: 健康检查响应在设置头之前返回，说明其他提前返回的错误也可能让浏览器渲染的响应脱离预期策略。
      - line: 17
        kind: performance
        note:
          en: findAll loads an unbounded event history and then serializes the entire result into HTML, allowing storage, memory, and response size to grow without a limit.
          zh: findAll 读取无界事件历史，再把全部结果序列化进 HTML，使存储查询、内存与响应大小都没有上限。
    checklist:
      - en: Generate one unpredictable nonce per response and assert that the same value appears only in that response's CSP and approved script elements.
        zh: 为每个响应生成一个不可预测的 nonce，并断言同一个值只出现在本次响应的 CSP 与获准脚本元素中。
      - en: Derive CSP and Permissions Policy from reviewed server configuration and the exact response class, not request query data.
        zh: 根据经过评审的服务端配置与准确响应类别生成 CSP 和 Permissions Policy，不使用请求查询数据。
      - en: Trigger success, redirect, early return, authentication failure, not found, rate limit, and gateway errors through the final deployment path.
        zh: 经过最终部署路径触发成功、重定向、提前返回、认证失败、未找到、限流与网关错误。
      - en: Bound queries and serialization, safely encode data for its HTML context, and verify behavior in a real browser.
        zh: 限制查询与序列化规模，按 HTML 上下文安全编码数据，并在真实浏览器中验证行为。
    explanation:
      en: Build policy from trusted configuration before route exits, generate and couple the nonce to one rendered response, and encode script data against HTML parsing. Query a bounded page of history and verify final headers after every proxy and cache layer.
      zh: 应在路由提前返回前根据可信配置建立策略，把 nonce 生成并绑定到一个渲染响应，并针对 HTML 解析规则编码脚本数据。历史记录采用有界分页查询，最终响应头要经过全部代理与缓存层验证。
    difficulty: advanced
    tags: [generated-code, csp, hsts, response-paths, resource-bounds]
