topic: security/cors
items:
  - id: predict-origin-tuple
    type: predict
    prompt:
      en: What does this exact origin comparison print?
      zh: 这段精确的源比较会输出什么？
    code: |
      const base = new URL('https://app.example.com/a');
      const targets = [
        'https://app.example.com/b',
        'https://api.example.com/a',
        'https://app.example.com:8443/a',
      ];
      for (const value of targets) {
        console.log(new URL(value).origin === base.origin);
      }
    lang: javascript
    options:
      - text: { en: "true, false, false", zh: "true、false、false" }
        correct: true
      - text: { en: "true, true, false", zh: "true、true、false" }
        correct: false
      - text: { en: "false, false, true", zh: "false、false、true" }
        correct: false
    explanation:
      en: Paths do not belong to an origin, so the first target matches. The second changes the host and the third changes the port.
      zh: 路径不属于源，所以第一个目标匹配。第二个目标改变主机，第三个目标改变端口。
    difficulty: beginner
    tags: [origin, same-origin-policy, predict-output]

  - id: simple-request-without-permission
    type: mcq
    prompt:
      en: A cross-origin form-encoded POST is sent without a preflight, but its response has no Access-Control-Allow-Origin. What can happen?
      zh: 一个跨源表单编码POST未经预检便已发送，但响应没有Access-Control-Allow-Origin。可能发生什么？
    options:
      - text:
          en: The server may perform the operation, while the browser prevents the calling script from reading the response
          zh: 服务器可能执行操作，但浏览器不让调用脚本读取响应
        correct: true
      - text:
          en: The browser must cancel the POST before any bytes reach the server
          zh: 浏览器一定会在任何字节到达服务器前取消POST
        correct: false
      - text:
          en: The browser automatically retries the POST as an OPTIONS request
          zh: 浏览器会自动把POST重试为OPTIONS请求
        correct: false
    explanation:
      en: A safelisted request is sent first and checked when its response arrives. CORS can block response exposure, but endpoint authorization and CSRF defenses must prevent unwanted effects.
      zh: 安全列表请求会先发送，浏览器在响应到达后检查。CORS可以阻止暴露响应，但端点授权和CSRF防护必须阻止非预期副作用。
    difficulty: intermediate
    tags: [simple-request, csrf, response-exposure]

  - id: spot-unconditional-origin-reflection
    title:
      en: Spot the bug in the CORS helper
      zh: 找出CORS辅助函数里的bug
    type: spotbug
    prompt:
      en: Find the security bug in this generated credentialed CORS helper.
      zh: 找出这段生成的凭证CORS辅助函数中的安全缺陷。
    code: |
      function addCors(request, response) {
        const origin = request.headers.origin;
        if (origin) {
          response.setHeader('Access-Control-Allow-Origin', origin);
          response.setHeader('Access-Control-Allow-Credentials', 'true');
        }
      }
    lang: javascript
    issues:
      - line: 4
        kind: security
        note:
          en: The code reflects every supplied origin while allowing credentials, so any website can receive browser-readable authenticated responses if cookies are otherwise eligible.
          zh: 代码在允许凭证的同时反射任意来源；只要Cookie满足发送条件，任何网站都可能读取认证响应。
    explanation:
      en: Match the complete serialized origin against a reviewed allowlist and emit the header only on a match. Authentication and resource authorization remain mandatory on the endpoint.
      zh: 应用完整序列化源精确匹配经过评审的允许列表，并且只在命中时返回该头。端点仍必须执行认证与资源授权。
    difficulty: intermediate
    tags: [origin-reflection, credentials, code-review]

  - id: credentialed-cors-contract
    type: mcq
    prompt:
      en: Which response contract lets an allowed frontend read a cross-origin response to fetch with credentials set to include?
      zh: 哪种响应契约能让获准前端读取credentials设为include的跨源fetch响应？
    options:
      - text:
          en: An exact matching Access-Control-Allow-Origin plus Access-Control-Allow-Credentials set to true
          zh: 精确匹配的Access-Control-Allow-Origin，加上值为true的Access-Control-Allow-Credentials
        correct: true
      - text:
          en: Access-Control-Allow-Origin set to an asterisk, with no other response header
          zh: 只把Access-Control-Allow-Origin设置为星号
        correct: false
      - text:
          en: Access-Control-Allow-Credentials set to true, with no Access-Control-Allow-Origin
          zh: 只把Access-Control-Allow-Credentials设置为true，不返回Access-Control-Allow-Origin
        correct: false
    explanation:
      en: Credentialed response sharing requires both an exact allowed origin and the true credentials header. Cookie attributes and browser cookie policy still decide whether a cookie is sent.
      zh: 凭证响应共享同时需要精确允许源和值为true的凭证头。Cookie属性与浏览器Cookie策略仍决定是否发送Cookie。
    difficulty: intermediate
    tags: [credentials, cookies, response-headers]

  - id: review-generated-cors-middleware
    title:
      en: Review generated CORS middleware
      zh: 审查生成的CORS中间件
    type: review
    prompt:
      en: Review this generated CORS middleware and private export route before deployment.
      zh: 部署前审查这段生成的CORS中间件和私有导出路由。
    task:
      en: Allow two configured browser origins to call a credentialed private API, preflight only the documented methods and headers, keep shared caches correct, and return one authenticated user's bounded export.
      zh: 允许两个已配置的浏览器源调用带凭证的私有API，只预检契约规定的方法和请求头，保证共享缓存正确，并返回一名已认证用户的有界导出数据。
    code: |
      const configuredOrigins = ['https://app.example.com'];

      function corsFor(request, response, next) {
        const origin = request.headers.origin;
        const trusted = configuredOrigins.some(
          (value) => origin?.includes(new URL(value).hostname),
        );
        if (trusted) {
          response.setHeader('Access-Control-Allow-Origin', origin);
          response.setHeader('Access-Control-Allow-Credentials', 'true');
        }
        response.setHeader('Access-Control-Allow-Methods', '*');
        response.setHeader('Access-Control-Allow-Headers', request.headers['access-control-request-headers'] ?? '*');
        if (origin) response.setHeader('Vary', 'Accept-Encoding');
        if (request.method === 'OPTIONS') return response.writeHead(204).end();
        next();
      }

      router.get('/private/export', corsFor, async (request, response) => {
        const user = await requireUser(request);
        const records = await db.records.findAll({ ownerId: user.id });
        response.json(records);
      });
    lang: javascript
    right:
      en: The generated code centralizes the browser policy, ends preflights without running the route, authenticates the export, and scopes records by the authenticated owner.
      zh: 生成代码集中处理浏览器策略，在不执行路由的情况下结束预检，还对导出执行认证，并按已认证所有者限制记录。
    issues:
      - line: 6
        kind: security
        note:
          en: Substring matching ignores scheme, port, and hostname boundaries, so an attacker origin containing app.example.com can receive a credentialed read grant.
          zh: 子字符串匹配忽略协议、端口和主机名边界，因此包含app.example.com的攻击者源可能获得凭证读取许可。
      - line: 12
        kind: correctness
        note:
          en: With credentials, an asterisk in Access-Control-Allow-Methods is treated as the literal method name rather than granting the route's real methods.
          zh: 在凭证模式下，Access-Control-Allow-Methods中的星号会被当作字面方法名，不能许可路由的真实方法。
      - line: 13
        kind: readability
        note:
          en: Reflecting every requested header hides the supported API contract inside client input instead of naming a reviewable server-side allowlist.
          zh: 反射所有请求头会把API支持契约藏进客户端输入，而不是使用可评审的服务端允许列表。
      - line: 14
        kind: edge-case
        note:
          en: The response varies by Origin, but Vary names only Accept-Encoding, so a shared cache can reuse one origin's CORS headers for another.
          zh: 响应随Origin改变，但Vary只包含Accept-Encoding，因此共享缓存可能为另一个源复用CORS头。
      - line: 21
        kind: performance
        note:
          en: findAll produces an unbounded query and response; one user with a large history can exhaust memory or hold the connection indefinitely.
          zh: findAll会产生无界查询与响应；历史记录很多的用户可能耗尽内存或长期占用连接。
    checklist:
      - en: Parse and exactly match complete configured origins; fail closed on missing or malformed configuration.
        zh: 解析并精确匹配完整配置源；配置缺失或畸形时采用关闭默认值。
      - en: Declare the route's methods and request headers explicitly, and exercise preflight separately from the actual request.
        zh: 显式声明路由的方法与请求头，并分别测试预检和实际请求。
      - en: Merge Origin into existing Vary values and test cache behavior across allowed and denied origins.
        zh: 把Origin合并进已有Vary值，并跨允许源与拒绝源测试缓存行为。
      - en: Authenticate and authorize the actual route, then paginate or stream the export under explicit resource bounds.
        zh: 对实际路由执行认证与授权，再在明确资源边界内分页或流式导出。
    explanation:
      en: Replace substring and request-reflection logic with a fixed policy keyed by exact origins and routes. Keep CORS separate from user authorization, preserve cache variation, and bound the authenticated export.
      zh: 应把子字符串与请求反射逻辑替换为按精确源和路由定义的固定策略。CORS与用户授权保持分离，保留缓存变化维度，并限制认证导出的规模。
    difficulty: advanced
    tags: [generated-code, cors-policy, caching, resource-bounds]
