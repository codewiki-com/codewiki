topic: security/web-security-fundamentals
items:
  - id: predict-html-text-encoding
    type: predict
    prompt:
      en: What does this program print on its second line?
      zh: 这段程序的第二行会输出什么？
    code: |
      function escapeHtmlText(value) {
        return value.replace(/[&<>]/g, (character) => ({
          '&': '&amp;', '<': '&lt;', '>': '&gt;',
        })[character]);
      }

      const name = '<b>Ada & Lin</b>';
      console.log(name);
      console.log(escapeHtmlText(name));
    lang: javascript
    options:
      - text: { en: '<b>Ada & Lin</b>', zh: '<b>Ada & Lin</b>' }
        correct: false
      - text: { en: '&lt;b&gt;Ada &amp; Lin&lt;/b&gt;', zh: '&lt;b&gt;Ada &amp; Lin&lt;/b&gt;' }
        correct: true
      - text: { en: 'Ada & Lin', zh: 'Ada & Lin' }
        correct: false
      - text: { en: 'The program throws a syntax error.', zh: '程序抛出语法错误。' }
        correct: false
    explanation:
      en: The function replaces HTML-significant characters with entities, so a later HTML text context displays the tags instead of parsing them.
      zh: 这个函数把对 HTML 有语法意义的字符替换为实体，因此后续 HTML 文本上下文会显示标签，而不是解析标签。
    difficulty: beginner
    tags: [xss, output-encoding, predict-output]
    tests: node predict-html-text-encoding.js
    minutes: 2

  - id: choose-control-at-sql-boundary
    type: mcq
    prompt:
      en: A validated invoice ID is inserted into a SQL query. Which control protects the SQL interpretation boundary?
      zh: 一个通过格式校验的发票 ID 即将进入 SQL 查询。哪项控制保护 SQL 解释边界？
    options:
      - text:
          en: Bind the ID as a parameter through the database driver.
          zh: 通过数据库驱动把 ID 绑定为参数。
        correct: true
      - text:
          en: Add the Access-Control-Allow-Origin response header.
          zh: 添加 Access-Control-Allow-Origin 响应头。
        correct: false
      - text:
          en: HTML-encode the ID before string concatenation.
          zh: 拼接字符串前对 ID 做 HTML 编码。
        correct: false
      - text:
          en: Make the ID a UUID so it is difficult to guess.
          zh: 把 ID 改成难以猜测的 UUID。
        correct: false
    explanation:
      en: Parameter binding keeps SQL code separate from data. Validation can enforce the business shape, but HTML encoding, CORS, and unguessable identifiers do not define SQL syntax.
      zh: 参数绑定会分离 SQL 代码与数据。校验可以执行业务格式，但 HTML 编码、CORS 和不可猜测标识都不能界定 SQL 语法。
    difficulty: beginner
    tags: [sql-injection, parameterized-query, trust-boundary]
    minutes: 2

  - id: cors-boundary
    type: mcq
    prompt:
      en: What does a correctly configured CORS policy primarily control?
      zh: 正确配置的 CORS 策略主要控制什么？
    options:
      - text:
          en: Which page origins may read a cross-origin response through browser APIs.
          zh: 哪些页面源可以通过浏览器 API 读取跨源响应。
        correct: true
      - text:
          en: Which authenticated users may update a database object.
          zh: 哪些已认证用户可以更新数据库对象。
        correct: false
      - text:
          en: Whether non-browser clients can send requests to the service.
          zh: 非浏览器客户端能否向服务发送请求。
        correct: false
      - text:
          en: Whether all cookie-backed requests are protected from CSRF.
          zh: 所有基于 Cookie 的请求是否都免受 CSRF 攻击。
        correct: false
    explanation:
      en: Browsers enforce CORS as a response-sharing policy. It neither authenticates or authorizes server operations nor prevents every cross-origin request from reaching the server.
      zh: 浏览器把 CORS 作为响应共享策略执行。它既不认证或授权服务端操作，也不能阻止所有跨源请求到达服务器。
    difficulty: intermediate
    tags: [cors, same-origin-policy, csrf]
    minutes: 2

  - id: spot-profile-boundaries
    type: spotbug
    prompt:
      en: Find the security boundaries this generated profile handler fails to enforce.
      zh: 找出这个生成的个人资料处理器没有执行的安全边界。
    code: |
      async function getProfile(req, db) {
        if (!req.user) return { status: 401 };

        const result = await db.query(
          'SELECT display_name FROM profiles WHERE id = $1',
          [req.params.id],
        );

        return { status: 200, body: `<h1>${result.rows[0].display_name}</h1>` };
      }
    lang: javascript
    issues:
      - line: 4
        lines: 4
        kind: security
        note:
          en: The query has no owner or tenant condition, so any authenticated user who learns another profile ID may read it.
          zh: 查询没有所有者或租户条件，因此任何获知其他资料 ID 的已认证用户都可能读取它。
      - line: 9
        kind: security
        note:
          en: The display name is concatenated into HTML without text-context encoding, allowing stored XSS when a profile value contains markup.
          zh: 显示名称未经文本上下文编码就拼入 HTML；资料值含标记时会形成存储型 XSS。
      - line: 9
        kind: edge-case
        note:
          en: The handler dereferences the first row without defining behavior for a missing profile, so an empty result can throw instead of returning a stable 404.
          zh: 处理器没有定义资料不存在时的行为；空结果可能抛错，而不是稳定返回 404。
    explanation:
      en: Authentication, parameterization, object-level authorization, missing-object handling, and output encoding protect different boundaries. The handler implements only the first two.
      zh: 认证、参数化、对象级授权、对象不存在处理和输出编码保护不同边界。这个处理器只实现了前两项。
    difficulty: intermediate
    tags: [authorization, xss, negative-path]
    minutes: 5

  - id: csp-role
    type: mcq
    prompt:
      en: Which statement best describes Content Security Policy in an XSS defense?
      zh: 哪项陈述最准确地说明了内容安全策略在 XSS 防护中的作用？
    options:
      - text:
          en: It is an additional browser-enforced layer; safe sinks and contextual encoding still address the root cause.
          zh: 它是浏览器执行的附加层；安全接收器和上下文编码仍负责消除根因。
        correct: true
      - text:
          en: It makes every use of innerHTML safe when default-src is set.
          zh: 设置 default-src 后，它会让所有 innerHTML 用法都安全。
        correct: false
      - text:
          en: It authorizes users to access server-side objects.
          zh: 它会授权用户访问服务端对象。
        correct: false
      - text:
          en: One fixed nonce can be reused by every response indefinitely.
          zh: 一个固定 nonce 可以由所有响应永久复用。
        correct: false
    explanation:
      en: CSP constrains browser resource loading and execution, but it does not repair unsafe data flow or server authorization. A nonce must be unpredictable and fresh for each response.
      zh: CSP 约束浏览器加载和执行资源，但不会修复不安全的数据流或服务端授权。nonce 必须不可预测，并且每个响应使用新值。
    difficulty: intermediate
    tags: [csp, xss, defense-in-depth]
    minutes: 2

  - id: review-generated-invoice-update
    type: review
    prompt:
      en: Review this AI-generated invoice update handler against its task and identify four distinct problems.
      zh: 按照任务要求审查这个 AI 生成的发票更新处理器，并找出四类不同的问题。
    task:
      en: Update an invoice total for the authenticated principal, only inside that principal's tenant, and return the updated invoice.
      zh: 为已认证主体更新发票总额，只允许操作该主体所在租户，并返回更新后的发票。
    code: |
      async function updateInvoice(req, db, audit) {
        const principal = req.body.principal;
        const invoiceId = req.params.id;
        const totalCents = Number(req.body.totalCents);

        const lookup = await db.query(
          'SELECT id, total_cents FROM invoices WHERE id = $1 AND tenant_id = $2',
          [invoiceId, principal.tenantId],
        );
        if (lookup.rows.length === 0) return { status: 404 };

        await db.query(
          'UPDATE invoices SET total_cents = $1 WHERE id = $2',
          [totalCents, invoiceId],
        );
        audit.write({ actor: principal.id, invoiceId });

        return { status: 200, body: lookup.rows[0] };
      }
    lang: javascript
    right:
      en: The generated code uses bound SQL parameters, scopes the lookup by tenant, returns a stable not-found response, and keeps the audit event free of the request body.
      zh: 生成代码使用了 SQL 绑定参数，按租户限定查询，为不存在的对象返回稳定结果，并且审计事件没有记录请求正文。
    issues:
      - line: 2
        kind: security
        note:
          en: The principal comes from the attacker-controlled body instead of trusted authentication state, so the caller can choose another tenant and actor ID.
          zh: 主体来自攻击者控制的请求正文，而不是可信认证状态；调用方可以选择其他租户和主体 ID。
      - line: 4
        kind: edge-case
        note:
          en: Number() accepts values such as an empty string as zero and can produce NaN or unsafe integers; the handler needs an explicit integer range contract.
          zh: Number() 会把空字符串等值接受为零，也可能产生 NaN 或不安全整数；处理器需要明确的整数范围契约。
      - line: 6
        lines: 9
        kind: performance
        note:
          en: A separate SELECT and UPDATE cost two round trips; one tenant-constrained UPDATE with a returned row can perform the check and mutation together.
          zh: 分开的 SELECT 与 UPDATE 需要两次往返；一次带租户条件并返回记录的 UPDATE 可以同时完成检查与修改。
      - line: 18
        kind: correctness
        note:
          en: The response returns the row read before the update, so total_cents is stale even when the mutation succeeds.
          zh: 响应返回更新前读取的记录，因此即使修改成功，total_cents 仍是旧值。
    checklist:
      - en: Derive the principal only from server-verified authentication state.
        zh: 只从服务端验证过的认证状态派生主体。
      - en: Validate money as an integer with explicit minimum and maximum bounds.
        zh: 按带有明确最小值和最大值的整数规则校验金额。
      - en: Constrain the mutation itself by tenant and return the row changed by that mutation.
        zh: 在修改语句本身加入租户条件，并返回该语句修改的记录。
      - en: Test another tenant, a missing invoice, invalid totals, and a concurrent deletion.
        zh: 测试其他租户、发票不存在、金额无效和并发删除。
    explanation:
      en: A strong revision reads the authenticated principal from trusted state, validates the amount, and performs one tenant-constrained update that returns the changed row. It should emit the audit event only after a successful commit.
      zh: 更可靠的版本应从可信状态读取已认证主体，校验金额，并通过一次带租户条件的更新返回修改后的记录。审计事件只能在成功提交后发出。
    difficulty: advanced
    tags: [code-review, authorization, validation, database]
    minutes: 10
