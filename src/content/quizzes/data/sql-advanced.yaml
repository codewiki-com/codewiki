topic: data/sql-advanced
items:
  - id: predict-default-range-frame
    type: predict
    prompt: { en: 'What rows does this SQLite query print?', zh: '这段 SQLite 查询会输出哪些行？' }
    code: |
      WITH scores(name, points) AS (
        VALUES ('Ari', 10), ('Bo', 10), ('Cy', 20)
      )
      SELECT
        name,
        points,
        SUM(points) OVER (ORDER BY points) AS running_points
      FROM scores
      ORDER BY name;
    lang: sql
    options:
      - { text: { en: 'Ari 10 10; Bo 10 20; Cy 20 40', zh: 'Ari 10 10；Bo 10 20；Cy 20 40' }, correct: false }
      - { text: { en: 'Ari 10 20; Bo 10 20; Cy 20 40', zh: 'Ari 10 20；Bo 10 20；Cy 20 40' }, correct: true }
      - { text: { en: 'Ari 10 40; Bo 10 40; Cy 20 40', zh: 'Ari 10 40；Bo 10 40；Cy 20 40' }, correct: false }
    explanation: { en: 'SQLite uses a peer-aware RANGE frame by default when the window has ORDER BY. Both 10-point rows are peers, so each frame contains both rows.', zh: 'SQLite 的窗口带有 ORDER BY 时，默认使用包含同值行的 RANGE 框架。两条 10 分记录互为同值行，因此两者的框架都包含这两行。' }
    difficulty: advanced
    tags: [window-frame, peer-rows, predict-output]

  - id: choose-ranking-function
    type: mcq
    prompt: { en: 'A report must return every product tied at either of the two highest distinct revenue amounts in each category. Which function matches that requirement?', zh: '报表要返回每个类别中收入位于最高两种不同金额的所有商品，并保留并列。哪个函数符合要求？' }
    options:
      - { text: { en: 'ROW_NUMBER() filtered to values at most 2', zh: '筛选 ROW_NUMBER() 不大于 2 的行' }, correct: false }
      - { text: { en: 'RANK() filtered to values at most 2', zh: '筛选 RANK() 不大于 2 的行' }, correct: false }
      - { text: { en: 'DENSE_RANK() filtered to values at most 2', zh: '筛选 DENSE_RANK() 不大于 2 的行' }, correct: true }
    explanation: { en: 'DENSE_RANK gives peers one rank and assigns the next distinct amount the next consecutive rank. RANK may skip 2 when several products tie for first.', zh: 'DENSE_RANK 会让同值行共享名次，并让下一个不同金额取得连续名次。多个商品并列第一时，RANK 可能直接跳过第 2 名。' }
    difficulty: intermediate
    tags: [dense-rank, ties]

  - id: spot-window-filter
    type: spotbug
    prompt: { en: 'Find the correctness and stability problems in this generated top-two query.', zh: '找出这段生成的每组前两名查询中的正确性与稳定性问题。' }
    code: |
      SELECT
        order_id,
        customer,
        amount,
        ROW_NUMBER() OVER (
          PARTITION BY customer
          ORDER BY amount DESC
        ) AS position
      FROM orders
      WHERE position <= 2;
    lang: sql
    issues:
      - line: 7
        kind: edge-case
        note: { en: 'Equal amounts have no stable tie-breaker, so ROW_NUMBER can choose different orders after a plan or index change.', zh: '相同金额之间没有稳定的并列决胜键，因此执行计划或索引改变后，ROW_NUMBER 可能选中不同订单。' }
      - line: 10
        kind: correctness
        note: { en: 'WHERE runs before this query level evaluates window functions, so position is not available here. Compute it in a CTE or subquery and filter outside.', zh: 'WHERE 早于同层窗口函数求值，因此这里无法使用 position。应在 CTE 或子查询中计算，再由外层过滤。' }
    explanation: { en: 'Stage the window result, add a unique final ordering key such as order_id, and then filter position from the outer query.', zh: '应先分层计算窗口结果，在排序末尾加入 order_id 等唯一键，再从外层查询过滤 position。' }
    difficulty: advanced
    tags: [row-number, query-phases, code-review]

  - id: recursive-termination
    type: mcq
    prompt: { en: 'What does a depth limit alone guarantee in a recursive CTE over data that may contain cycles?', zh: '递归 CTE 处理可能含环的数据时，只有深度上限能够保证什么？' }
    options:
      - { text: { en: 'The returned hierarchy is complete and contains each node once.', zh: '返回的层次结构完整，而且每个节点只出现一次。' }, correct: false }
      - { text: { en: 'Expansion is bounded, but the result may be truncated and repeated nodes may remain.', zh: '扩展受到限制，但结果可能被截断，重复节点也可能保留。' }, correct: true }
      - { text: { en: 'The database repairs cycles before evaluating the query.', zh: '数据库会在查询求值前修复数据中的环。' }, correct: false }
    explanation: { en: 'A depth cap is a resource boundary, not cycle detection. Track visited identifiers and define how a detected cycle should be reported or skipped.', zh: '深度上限是资源边界，不是环检测。查询还需跟踪已访问标识，并定义发现环后应报告还是跳过。' }
    difficulty: intermediate
    tags: [recursive-cte, cycle-detection]

  - id: review-tenant-category-orders
    type: review
    prompt: { en: 'Review this generated category-order report before it reaches a multitenant production database.', zh: '在这段生成的类别订单报表进入多租户生产数据库前，对它进行审查。' }
    task: { en: 'For one tenant, traverse a category subtree, exclude blocked accounts, and return exactly two paid orders per category with stable ordering. Return only order_id, category_id, amount, and position.', zh: '针对一个租户遍历类别子树，排除已停用账户，并按稳定顺序为每个类别返回恰好两笔已支付订单。结果只含 order_id、category_id、amount 和 position。' }
    code: |
      WITH RECURSIVE category_tree AS (
        SELECT id, parent_id, tenant_id
        FROM categories
        WHERE id = :root_id
        UNION
        SELECT c.id, c.parent_id, c.tenant_id
        FROM categories AS c
        JOIN category_tree AS t ON c.parent_id = t.id
      ),
      eligible_orders AS (
        SELECT o.*
        FROM orders AS o
        WHERE o.category_id IN (SELECT id FROM category_tree)
          AND o.account_id NOT IN (SELECT account_id FROM blocked_accounts)
      ),
      ranked AS (
        SELECT *,
          ROW_NUMBER() OVER (
            PARTITION BY category_id
            ORDER BY amount DESC
          ) AS position
        FROM eligible_orders
      )
      SELECT *
      FROM ranked WHERE position <= 2;
    lang: sql
    right: { en: 'The query gives the traversal and ranking stages clear names, uses UNION to stop revisiting an identical category row, and partitions the ranking by category.', zh: '查询清楚命名了遍历与排名阶段，使用 UNION 阻止完全相同的类别行被反复访问，并按类别对排名进行分区。' }
    checklist:
      - { en: 'Carry tenant and authorization predicates through the anchor, recursive member, and every joined relation.', zh: '在锚成员、递归成员和每个连接关系中持续携带租户与权限谓词。' }
      - { en: 'Test exclusion sets that are empty, contain NULL, and contain duplicate identifiers.', zh: '测试排除集合为空、含 NULL 和含重复标识的情况。' }
      - { en: 'Make every top-N window order unique and verify whether ties should count as rows or value levels.', zh: '让每个前 N 名窗口的顺序唯一，并确认并列应按行还是按数值层级计数。' }
      - { en: 'Project only required columns and inspect the target database plan with realistic row counts.', zh: '只投影所需列，并用真实数量级的数据检查目标数据库执行计划。' }
    issues:
      - line: 4
        lines: 5
        kind: security
        note: { en: 'Neither the root lookup nor the recursive join constrains :tenant_id, so a caller can select another tenant root or cross tenants when identifiers are not globally isolated.', zh: '根查询和递归连接都没有约束 :tenant_id，因此调用方可能选择其他租户的根；标识未全局隔离时，递归还可能跨越租户。' }
      - line: 11
        kind: performance
        note: { en: 'SELECT o.* carries every order column through the window sort and returns fields the task explicitly excludes.', zh: 'SELECT o.* 会让所有订单列参与窗口排序，还会返回任务明确排除的字段。' }
      - line: 14
        kind: edge-case
        note: { en: 'A null account_id in blocked_accounts makes NOT IN evaluate to UNKNOWN for otherwise eligible orders and can empty the result.', zh: 'blocked_accounts 中只要有空 account_id，NOT IN 就会让本来合格的订单得到 UNKNOWN，并可能清空结果。' }
      - line: 20
        kind: correctness
        note: { en: 'Equal amounts have no unique final key, so the query cannot guarantee which two orders receive positions 1 and 2.', zh: '相同金额后没有唯一的最终排序键，因此查询无法保证哪两笔订单取得第 1 和第 2 个位置。' }
    explanation: { en: 'Constrain tenant_id in both recursive members and order access, replace NOT IN with a correlated NOT EXISTS, project the four required columns, and append order_id to the window order. Tests should include equal amounts and a null in the blocklist.', zh: '应在两个递归成员与订单访问中约束 tenant_id，把 NOT IN 改为相关 NOT EXISTS，只投影要求的四列，并在窗口顺序末尾添加 order_id。测试需包含相同金额与停用列表中的空值。' }
    difficulty: advanced
    tags: [code-review, multitenancy, anti-join, row-number]
