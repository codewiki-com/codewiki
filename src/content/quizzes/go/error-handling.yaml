topic: go/error-handling
items:
  - id: predict-wrapped-sentinel
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      package main

      import (
          "errors"
          "fmt"
      )

      var ErrMissing = errors.New("missing")

      func load() error {
          return fmt.Errorf("load profile: %w", ErrMissing)
      }

      func main() {
          err := load()
          fmt.Println(err == ErrMissing)
          fmt.Println(errors.Is(err, ErrMissing))
      }
    lang: go
    options:
      - { text: { en: 'false / true', zh: 'false / true' }, correct: true }
      - { text: { en: 'true / true', zh: 'true / true' }, correct: false }
      - { text: { en: 'false / false', zh: 'false / false' }, correct: false }
      - { text: { en: 'The program does not compile', zh: '程序无法编译' }, correct: false }
    explanation: { en: 'The outer wrapper is not equal to the sentinel, but errors.Is traverses the wrapper and finds ErrMissing.', zh: '最外层包装器不等于哨兵错误，但 errors.Is 会遍历包装器并找到 ErrMissing。' }
    difficulty: beginner
    tags: [wrapping, sentinel, errors-is]

  - id: choose-errors-as-target
    type: mcq
    prompt: { en: 'Given an error chain that may contain *PathError, which use of errors.As is correct?', zh: '错误链中可能包含 *PathError 时，哪种 errors.As 用法正确？' }
    options:
      - { text: { en: 'var target *PathError; errors.As(err, &target)', zh: 'var target *PathError; errors.As(err, &target)' }, correct: true }
      - { text: { en: 'target := PathError{}; errors.As(err, target)', zh: 'target := PathError{}; errors.As(err, target)' }, correct: false }
      - { text: { en: 'var target **PathError; errors.As(err, target)', zh: 'var target **PathError; errors.As(err, target)' }, correct: false }
      - { text: { en: 'errors.As(err, PathError{})', zh: 'errors.As(err, PathError{})' }, correct: false }
    explanation: { en: 'As needs a non-nil pointer to the target slot. For a pointer error type, that makes the argument a **PathError.', zh: 'As 需要接收指向目标槽位的非 nil 指针。错误类型本身是指针时，传入的参数因此是 **PathError。' }
    difficulty: intermediate
    tags: [errors-as, custom-error]

  - id: spotbug-typed-nil
    type: spotbug
    prompt: { en: 'Find why the valid input still returns a non-nil error.', zh: '找出为什么有效输入仍会返回非 nil 错误。' }
    code: |
      type ParseError struct {
          Input string
      }

      func (e *ParseError) Error() string {
          return "invalid input: " + e.Input
      }

      func validate(input string) error {
          var parseErr *ParseError
          if input == "" {
              parseErr = &ParseError{Input: input}
          }
          return parseErr
      }
    lang: go
    issues:
      - line: 14
        kind: correctness
        note: { en: 'Converting the nil *ParseError to error records a dynamic type, so the returned interface is not nil.', zh: '把 nil 的 *ParseError 转成 error 会记录动态类型，因此返回的接口并非 nil。' }
      - line: 6
        kind: edge-case
        note: { en: 'If the typed-nil interface is formatted, Error dereferences its nil receiver while reading Input and may panic.', zh: '如果格式化这个 typed nil 接口，Error 读取 Input 时会解引用 nil 接收者，并可能触发 panic。' }
    explanation: { en: 'Return a literal nil on success and construct *ParseError only on the failure path. The interface then has neither a dynamic type nor a value.', zh: '成功路径应直接返回字面值 nil，只在失败路径构造 *ParseError。这样接口才既没有动态类型，也没有动态值。' }
    difficulty: intermediate
    tags: [interface, typed-nil, custom-error]

  - id: joined-errors-contract
    type: mcq
    prompt: { en: 'Which statement about errors.Join is correct?', zh: '关于 errors.Join，哪项说法正确？' }
    options:
      - { text: { en: 'errors.Is can match any non-nil child of the joined error', zh: 'errors.Is 可以匹配合并错误中的任意非 nil 子错误' }, correct: true }
      - { text: { en: 'errors.Join returns a non-nil error when every input is nil', zh: '所有输入都是 nil 时，errors.Join 仍返回非 nil 错误' }, correct: false }
      - { text: { en: 'errors.Unwrap returns the first child of a joined error', zh: 'errors.Unwrap 会返回合并错误的第一个子错误' }, correct: false }
      - { text: { en: 'Callers should parse the joined message to identify each child', zh: '调用方应解析合并消息来识别每个子错误' }, correct: false }
    explanation: { en: 'A joined error exposes all children through Unwrap() []error, and Is or As traverses them. errors.Unwrap handles only Unwrap() error.', zh: '合并错误通过 Unwrap() []error 公开全部子错误，Is 或 As 会遍历它们。errors.Unwrap 只处理 Unwrap() error。' }
    difficulty: intermediate
    tags: [errors-join, errors-is, aggregation]

  - id: review-generated-invoice-loader
    type: review
    prompt: { en: 'Review this generated invoice loader.', zh: '审查这个生成的发票加载函数。' }
    task: { en: 'Load an invoice by an untrusted ID from the invoices directory, preserve a matchable not-found cause, reject null or empty invoices, and return errors for the caller to report without exposing secrets.', zh: '根据不可信的 ID 从 invoices 目录加载发票，保留可匹配的不存在原因，拒绝 null 或空发票，并把错误交给调用方报告且不泄露秘密。' }
    code: |
      func LoadInvoice(id string) (*Invoice, error) {
          path := filepath.Join("invoices", id+".json")
          file, err := os.Open(path)
          if err != nil {
              return nil, errors.New("cannot open invoice")
          }
          defer file.Close()
          var invoice *Invoice
          if err := json.NewDecoder(file).Decode(&invoice); err != nil {
              log.Printf("decode failed token=%s: %v", os.Getenv("API_TOKEN"), err)
              return nil, err
          }
          if invoice.ID == "" {
              return invoice, nil
          }
          return invoice, nil
      }
    lang: go
    right: { en: 'The generated code checks both open and decode failures, closes the file, and keeps the returned invoice strongly typed.', zh: '生成代码检查了打开和解码失败，关闭了文件，并让返回的发票保持明确类型。' }
    checklist:
      - { en: 'Validate that a user-controlled identifier cannot escape the intended directory.', zh: '验证用户可控标识不能逃出预期目录。' }
      - { en: 'Preserve every documented cause with wrapping or deliberate translation.', zh: '通过包装或有意转换保留每个有文档说明的原因。' }
      - { en: 'Test null, empty, malformed, missing, and valid input separately.', zh: '分别测试 null、空值、格式错误、不存在和有效输入。' }
      - { en: 'Choose one reporting boundary and redact its structured fields.', zh: '选择唯一的报告边界，并对其结构化字段脱敏。' }
    issues:
      - line: 2
        kind: security
        note: { en: 'An ID containing path separators or .. can escape the invoices directory; joining a path does not prove containment.', zh: '包含路径分隔符或 .. 的 ID 可以逃出 invoices 目录；拼接路径并不能证明目标仍在目录内。' }
      - line: 5
        kind: correctness
        note: { en: 'Replacing the open error with a fresh value destroys os.ErrNotExist, so callers cannot classify a missing invoice.', zh: '用新错误替换打开错误会丢失 os.ErrNotExist，调用方因而无法识别发票不存在。' }
      - line: 10
        kind: readability
        note: { en: 'This reusable function logs an error it also returns, creating duplicate reporting, and its ad hoc message includes a secret.', zh: '这个可复用函数既记录又返回错误，会造成重复报告，而且临时拼出的消息包含秘密。' }
      - line: 13
        kind: edge-case
        note: { en: 'JSON null leaves invoice nil, so reading invoice.ID panics instead of returning a validation error.', zh: 'JSON null 会让 invoice 保持 nil，因此读取 invoice.ID 会触发 panic，而不是返回验证错误。' }
    explanation: { en: 'Validate containment, wrap the open failure, decode into a value or reject nil explicitly, and let the owning boundary log once with reviewed fields. Empty IDs should return a non-nil validation error.', zh: '应验证路径范围、包装打开失败、解码到值中或显式拒绝 nil，并让拥有结果的边界使用经过审查的字段记录一次。空 ID 必须返回非 nil 验证错误。' }
    difficulty: advanced
    tags: [code-review, wrapping, typed-nil, security]
