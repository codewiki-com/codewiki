topic: go/error-handling
items:
  - id: predict-wrapped-sentinel
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      package main

      import (
          "errors"
          "fmt"
      )

      var ErrMissing = errors.New("missing")

      func load() error {
          return fmt.Errorf("load profile: %w", ErrMissing)
      }

      func main() {
          err := load()
          fmt.Println(err == ErrMissing)
          fmt.Println(errors.Is(err, ErrMissing))
      }
    lang: go
    options:
      - { text: { en: 'false / true', zh: 'false / true' }, correct: true }
      - { text: { en: 'true / true', zh: 'true / true' }, correct: false }
      - { text: { en: 'false / false', zh: 'false / false' }, correct: false }
      - { text: { en: 'The program does not compile', zh: '程序无法编译' }, correct: false }
    explanation: { en: 'The outer wrapper is not equal to the sentinel, but errors.Is traverses the wrapper and finds ErrMissing.', zh: '最外层包装器不等于哨兵错误，但errors.Is会遍历包装器并找到ErrMissing。' }
    difficulty: beginner
    tags: [wrapping, sentinel, errors-is]

  - id: choose-errors-as-target
    type: mcq
    prompt: { en: 'Given an error chain that may contain *PathError, which use of errors.As is correct?', zh: '错误链中可能包含*PathError时，哪种errors.As用法正确？' }
    options:
      - { text: { en: 'var target *PathError; errors.As(err, &target)', zh: 'var target *PathError; errors.As(err, &target)' }, correct: true }
      - { text: { en: 'target := PathError{}; errors.As(err, target)', zh: 'target := PathError{}; errors.As(err, target)' }, correct: false }
      - { text: { en: 'var target **PathError; errors.As(err, target)', zh: 'var target **PathError; errors.As(err, target)' }, correct: false }
      - { text: { en: 'errors.As(err, PathError{})', zh: 'errors.As(err, PathError{})' }, correct: false }
    explanation: { en: 'As needs a non-nil pointer to the target slot. For a pointer error type, that makes the argument a **PathError.', zh: 'As需要接收指向目标槽位的非nil指针。错误类型本身是指针时，传入的参数因此是**PathError。' }
    difficulty: intermediate
    tags: [errors-as, custom-error]

  - id: spotbug-typed-nil
    title: { en: 'Spot the bug in the typed nil error', zh: '找出带类型nil错误里的bug' }
    type: spotbug
    prompt: { en: 'Find why the valid input still returns a non-nil error.', zh: '找出为什么有效输入仍会返回非nil错误。' }
    code: |
      type ParseError struct {
          Input string
      }

      func (e *ParseError) Error() string {
          return "invalid input: " + e.Input
      }

      func validate(input string) error {
          var parseErr *ParseError
          if input == "" {
              parseErr = &ParseError{Input: input}
          }
          return parseErr
      }
    lang: go
    issues:
      - line: 14
        kind: correctness
        note: { en: 'Converting the nil *ParseError to error records a dynamic type, so the returned interface is not nil.', zh: '把nil的*ParseError转成error会记录动态类型，因此返回的接口并非nil。' }
      - line: 6
        kind: edge-case
        note: { en: 'If the typed-nil interface is formatted, Error dereferences its nil receiver while reading Input and may panic.', zh: '如果格式化这个typed nil接口，Error读取Input时会解引用nil接收者，并可能触发panic。' }
    explanation: { en: 'Return a literal nil on success and construct *ParseError only on the failure path. The interface then has neither a dynamic type nor a value.', zh: '成功路径应直接返回字面值nil，只在失败路径构造*ParseError。这样接口才既没有动态类型，也没有动态值。' }
    difficulty: intermediate
    tags: [interface, typed-nil, custom-error]

  - id: joined-errors-contract
    type: mcq
    prompt: { en: 'Which statement about errors.Join is correct?', zh: '关于errors.Join，哪项说法正确？' }
    options:
      - { text: { en: 'errors.Is can match any non-nil child of the joined error', zh: 'errors.Is可以匹配合并错误中的任意非nil子错误' }, correct: true }
      - { text: { en: 'errors.Join returns a non-nil error when every input is nil', zh: '所有输入都是nil时，errors.Join仍返回非nil错误' }, correct: false }
      - { text: { en: 'errors.Unwrap returns the first child of a joined error', zh: 'errors.Unwrap会返回合并错误的第一个子错误' }, correct: false }
      - { text: { en: 'Callers should parse the joined message to identify each child', zh: '调用方应解析合并消息来识别每个子错误' }, correct: false }
    explanation: { en: 'A joined error exposes all children through Unwrap() []error, and Is or As traverses them. errors.Unwrap handles only Unwrap() error.', zh: '合并错误通过Unwrap() []error公开全部子错误，Is或As会遍历它们。errors.Unwrap只处理Unwrap() error。' }
    difficulty: intermediate
    tags: [errors-join, errors-is, aggregation]

  - id: review-generated-session-loader
    type: review
    title: { en: 'Review a generated session loader', zh: '审查生成的会话加载器' }
    prompt: { en: 'Review this generated code before it ships.', zh: '请在发布前审查这段生成的代码。' }
    task: { en: 'Load a session by ID, preserve matchable storage and decoding causes, reject JSON null, keep stored payloads out of errors, and leave reporting to the caller.', zh: '根据ID加载会话，保留可匹配的存储和解码原因，拒绝JSON null，避免错误中包含存储的载荷，并由调用方负责报告。' }
    code: |
      func LoadSession(id string, store SessionStore) (*Session, error) {
          data, err := store.Read(id)
          if err != nil {
              return nil, fmt.Errorf("load session %q: %v", id, err)
          }

          var session *Session
          if err := json.Unmarshal(data, &session); err != nil {
              log.Printf("decode session %q: %v", id, err)
              return nil, fmt.Errorf("decode payload %s: %w", data, err)
          }
          if session.UserID == "" {
              return nil, errors.New("session has no user")
          }
          return session, nil
      }
    lang: go
    issues:
      - line: 4
        kind: correctness
        note: { en: 'Formatting the storage error with %v breaks its chain, so callers cannot match a documented cause such as ErrNotFound.', zh: '使用 %v格式化存储错误会切断错误链，因此调用方无法匹配ErrNotFound等有文档说明的原因。' }
      - line: 9
        kind: readability
        note: { en: 'The loader logs a decoding failure that it also returns, so a caller that owns reporting will record the same failure twice.', zh: '加载器记录了解码失败，又把它返回；负责报告的调用方再次记录时，同一次失败会出现两条日志。' }
      - line: 10
        kind: security
        note: { en: 'The returned error includes the raw stored payload, which may expose session tokens or other sensitive data.', zh: '返回的错误包含原始存储载荷，可能泄露会话token或其他敏感数据。' }
      - line: 12
        kind: edge-case
        note: { en: 'Decoding JSON null leaves session nil, so reading session.UserID panics instead of returning a validation error.', zh: '解码JSON null后session仍为nil，因此读取session.UserID会触发panic，而不是返回验证错误。' }
    right: { en: 'The generated code injects the storage dependency, checks both operations, and returns a typed session only after decoding.', zh: '生成代码注入了存储依赖，检查了两项操作，并且只在解码后返回明确类型的会话。' }
    checklist:
      - { en: 'Wrap each documented cause with %w and useful operation context.', zh: '使用 %w和有用的操作上下文包装每个有文档说明的原因。' }
      - { en: 'Test valid, malformed, missing, and null session records separately.', zh: '分别测试有效、格式错误、不存在和null会话记录。' }
      - { en: 'Keep payloads, credentials, and tokens out of returned errors.', zh: '避免返回的错误包含载荷、凭据和token。' }
      - { en: 'Choose one owning boundary to report each failure.', zh: '为每次失败选择唯一的报告边界。' }
    explanation: { en: 'Wrap storage and decoding failures without embedding the payload, reject a nil decoded session before dereferencing it, and let the owning boundary log the returned error once.', zh: '应包装存储和解码失败，但不要嵌入载荷；解码结果为nil时，应在解引用前拒绝它；返回的错误只由拥有结果的边界记录一次。' }
    difficulty: advanced
    minutes: 8
    tags: [code-review, error-chain, reporting-boundary, security]
