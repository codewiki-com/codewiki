topic: go/checkpoint-2
items:
  - id: checkpoint-2-append-result
    type: mcq
    prompt: { en: 'A function appends to a slice. Which rule keeps the result correct whether or not a new backing array is allocated?', zh: '函数向切片追加元素时，哪条规则能保证无论是否分配新底层数组都得到正确结果？' }
    options:
      - { text: { en: 'Always retain the slice value returned by `append`.', zh: '始终保留 `append` 返回的切片值。' }, correct: true }
      - { text: { en: 'Ignore the return value when the original slice has spare capacity.', zh: '原切片还有剩余容量时忽略返回值。' }, correct: false }
      - { text: { en: 'Take the address of the first element before every append.', zh: '每次追加前先取得第一个元素的地址。' }, correct: false }
    explanation: { en: '`append` can return a slice header describing different storage, so callers must use its result.', zh: '`append` 可能返回描述不同存储空间的切片头，因此调用方必须使用其返回值。' }
    difficulty: beginner
    tags: [checkpoint]
  - id: checkpoint-2-nil-map-failure
    type: fill
    prompt: { en: 'Give the runtime failure message produced by assigning an entry to a nil map.', zh: '写出向 nil map 写入条目时产生的运行时失败信息。' }
    answer: 'panic: assignment to entry in nil map'
    explanation: { en: 'A nil map can be read, ranged over, and measured, but it must be initialized before a write.', zh: 'nil map 可以读取、遍历和取长度，但写入前必须先初始化。' }
    difficulty: beginner
    tags: [checkpoint]
  - id: checkpoint-2-map-presence
    type: mcq
    prompt: { en: 'A map may legitimately store zero. How should code distinguish an absent key from a present key mapped to zero?', zh: 'map 可以合法保存零值。代码应如何区分键不存在与键存在但值为零？' }
    options:
      - { text: { en: 'Use the two-result lookup `value, ok := counts[key]`.', zh: '使用双结果查询 `value, ok := counts[key]`。' }, correct: true }
      - { text: { en: 'Test only whether `counts[key] == 0`.', zh: '只检查 `counts[key] == 0`。' }, correct: false }
      - { text: { en: 'Range over the map because lookup cannot report presence.', zh: '遍历整个 map，因为查询无法报告键是否存在。' }, correct: false }
    explanation: { en: 'The second result reports presence independently of the stored value.', zh: '第二个结果独立于存储值，用来报告键是否存在。' }
    difficulty: intermediate
    tags: [checkpoint]
  - id: checkpoint-2-underlying-type
    type: fill
    prompt: { en: 'Which token before a constraint term such as `int` also admits named types whose underlying type is `int`?', zh: '在约束项 `int` 前加哪个符号，可以同时接受底层类型为 `int` 的命名类型？' }
    answer: '~'
    explanation: { en: 'The term `~int` denotes types whose underlying type is `int`; plain `int` denotes only the exact predeclared type.', zh: '类型项 `~int` 表示底层类型为 `int` 的类型；普通 `int` 只表示预声明类型本身。' }
    difficulty: intermediate
    tags: [checkpoint]
  - id: checkpoint-2-wrap-verb
    type: fill
    prompt: { en: 'Which `fmt.Errorf` formatting verb adds context while preserving an error for later unwrapping?', zh: '`fmt.Errorf` 使用哪个格式化动词既能补充上下文，又能保留错误供后续解包？' }
    answer: '%w'
    explanation: { en: '`%w` creates an error chain that `errors.Is` and `errors.As` can inspect.', zh: '`%w` 会创建可由 `errors.Is` 和 `errors.As` 检查的错误链。' }
    difficulty: intermediate
    tags: [checkpoint]
  - id: checkpoint-2-error-match
    type: mcq
    prompt: { en: 'A sentinel has been wrapped twice. Which check preserves the caller contract?', zh: '一个哨兵错误经过两层包装后，哪种检查方式能保持调用方契约？' }
    options:
      - { text: { en: 'Call `errors.Is(err, sentinel)`.', zh: '调用 `errors.Is(err, sentinel)`。' }, correct: true }
      - { text: { en: 'Compare the outer error directly with `err == sentinel`.', zh: '使用 `err == sentinel` 直接比较外层错误。' }, correct: false }
      - { text: { en: 'Search `err.Error()` for the sentinel message.', zh: '在 `err.Error()` 中搜索哨兵错误的消息文本。' }, correct: false }
    explanation: { en: '`errors.Is` traverses the error chain; direct equality sees only the outer wrapper, and message text is not a stable machine contract.', zh: '`errors.Is` 会遍历错误链；直接相等只检查最外层包装，而消息文本不是稳定的机器契约。' }
    difficulty: advanced
    tags: [checkpoint]
  - id: checkpoint-2-recovery-function
    type: fill
    prompt: { en: 'Name the built-in function that can stop panic unwinding when called directly by a deferred function in the same goroutine.', zh: '写出内置函数名称：它在同一 goroutine 的延迟函数中被直接调用时，可以停止 panic 展开。' }
    answer: recover
    explanation: { en: '`recover` is effective only at the matching deferred, same-goroutine boundary; a parent goroutine cannot recover a child panic.', zh: '`recover` 只有位于对应的延迟调用和同一 goroutine 边界时才生效；父 goroutine 无法恢复子 goroutine 的 panic。' }
    difficulty: advanced
    tags: [checkpoint]
  - id: checkpoint-2-defer-order
    type: mcq
    prompt: { en: 'Which statement about deferred calls is correct?', zh: '关于延迟调用，哪项陈述正确？' }
    options:
      - { text: { en: 'Direct call arguments are evaluated when `defer` executes, and deferred calls later run in last-in, first-out order.', zh: '直接调用的实参在执行 `defer` 时求值，延迟调用随后按后进先出顺序运行。' }, correct: true }
      - { text: { en: 'Arguments are first evaluated when the surrounding function returns, in first-in, first-out order.', zh: '实参在外围函数返回时才求值，并按先进先出顺序运行。' }, correct: false }
      - { text: { en: 'Deferred calls run only on normal return, never during panic unwinding.', zh: '延迟调用只在正常返回时运行，在 panic 展开期间不会运行。' }, correct: false }
    explanation: { en: 'Registration evaluates direct arguments immediately; function exit runs deferred calls in LIFO order on return and during panic unwinding.', zh: '注册延迟调用时会立即计算直接实参；函数退出时，无论正常返回还是 panic 展开，延迟调用都按后进先出顺序执行。' }
    difficulty: advanced
    tags: [checkpoint]
