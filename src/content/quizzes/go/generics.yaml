topic: go/generics
items:
  - id: predict-named-type-preserved
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      package main

      import "fmt"

      type Score int

      func Double[T ~int](value T) T {
          return value * 2
      }

      func main() {
          result := Double(Score(7))
          fmt.Printf("%T %v\n", result, result)
      }
    lang: go
    options:
      - { text: { en: 'main.Score 14', zh: 'main.Score 14' }, correct: true }
      - { text: { en: 'int 14', zh: 'int 14' }, correct: false }
      - { text: { en: 'Score 7', zh: 'Score 7' }, correct: false }
      - { text: { en: 'It does not compile because Score is not exactly int.', zh: '代码无法编译，因为Score并不精确等于int。' }, correct: false }
    explanation: { en: '`~int` accepts named types whose underlying type is int, and the result retains the inferred type argument Score.', zh: '`~int`接受底层类型为int的命名类型，返回值会保留推断出的类型实参Score。' }
    difficulty: beginner
    tags: [type-set, named-type, predict-output]

  - id: approximation-element
    type: mcq
    prompt: { en: 'In a constraint, what is the difference between int and ~int?', zh: '在约束中，int与~int有什么区别？' }
    options:
      - { text: { en: 'int accepts only the predeclared int type; ~int also accepts named types with underlying type int.', zh: 'int只接受预声明的int；~int还接受底层类型为int的命名类型。' }, correct: true }
      - { text: { en: '~int converts every argument to int at runtime.', zh: '~int会在运行时把每个实参转换为int。' }, correct: false }
      - { text: { en: '~int accepts every numeric type, including floats.', zh: '~int接受包括浮点数在内的所有数值类型。' }, correct: false }
    explanation: { en: 'The tilde is a static approximation element over underlying types. It neither performs a conversion nor expands to unrelated numeric types.', zh: '波浪号是针对底层类型的静态近似元素；它不会执行转换，也不会扩展到无关的数值类型。' }
    difficulty: intermediate
    tags: [constraint, underlying-type]

  - id: spot-comparable-order
    title: { en: 'Spot the bug in the comparable constraint', zh: '找出泛型排序约束里的bug' }
    type: spotbug
    prompt: { en: 'Find the constraint error in this generated helper.', zh: '找出这个生成辅助函数中的约束错误。' }
    code: |
      func Earlier[T comparable](left, right T) T {
          if left < right {
              return left
          }
          return right
      }
    lang: go
    issues:
      - line: 2
        kind: correctness
        note: { en: '`comparable` permits == and != but does not guarantee the < operator, so this function does not compile.', zh: '`comparable`只允许 == 和 !=，不保证 < 运算符，因此该函数无法编译。' }
    explanation: { en: 'Use cmp.Ordered for the predeclared ordered types, a narrower custom type set, or a caller-provided comparison function for domain ordering.', zh: '对于预声明的有序类型可使用cmp.Ordered，也可使用更窄的自定义类型集；领域顺序则应由调用方传入比较函数。' }
    difficulty: beginner
    tags: [comparable, ordering, compile-error]

  - id: generic-method-limit
    type: mcq
    prompt: { en: 'A Stack[T] method needs to transform values into a new type U. Which declaration is valid Go?', zh: 'Stack[T] 的一个操作需要把值转换为新类型U。哪种声明是合法的Go？' }
    options:
      - { text: { en: 'A standalone function MapStack[T, U any](Stack[T], func(T) U) Stack[U]', zh: '独立函数MapStack[T, U any](Stack[T], func(T) U) Stack[U]' }, correct: true }
      - { text: { en: 'A method func (s Stack[T]) Map[U any](func(T) U) Stack[U]', zh: '方法func (s Stack[T]) Map[U any](func(T) U) Stack[U]' }, correct: false }
      - { text: { en: 'A method that declares U after its return type', zh: '在返回类型后声明U的方法' }, correct: false }
    explanation: { en: 'Methods may use receiver type parameters but cannot introduce their own additional type parameters. A standalone generic function can relate T and U.', zh: '方法可以使用接收器类型参数，但不能引入额外的独立类型参数。独立泛型函数可以表达T与U的关系。' }
    difficulty: intermediate
    tags: [generic-method, type-parameter]

  - id: review-stable-unique
    type: review
    title: { en: 'Review generated stable deduplication', zh: '审查生成的稳定去重函数' }
    prompt: { en: 'Review this generated stable deduplication helper against the stated task.', zh: '根据给定任务审查这个生成的稳定去重辅助函数。' }
    task: { en: 'Return the first occurrence of each value in input order, preserve nil input as nil, and do not mutate the input.', zh: '按输入顺序保留每个值的首次出现，把nil输入保留为nil，并且不修改输入。' }
    code: |
      package cache

      import (
          "fmt"
          "sort"
      )

      // Unique makes output deterministic.
      func Unique[T comparable](values []T) []T {
          if values == nil {
              return []T{}
          }
          seen := map[T]bool{}
          result := []T{}
          for _, value := range values {
              if !seen[value] {
                  seen[value] = true
                  result = append(result, value)
              }
          }
          sort.Slice(result, func(i, j int) bool {
              return fmt.Sprint(result[i]) < fmt.Sprint(result[j])
          })
          return result
      }
    lang: go
    right: { en: 'The code uses a comparable constraint for map keys, tracks values without mutating the input, and appends only the first copy seen during traversal.', zh: '代码为map键使用了comparable约束，在不修改输入的情况下记录已见值，并且遍历时只追加第一次出现的值。' }
    issues:
      - line: 8
        kind: readability
        note: { en: 'The comment says only “deterministic” and omits the important first-occurrence, nil, and ownership contracts.', zh: '注释只说“确定性”，没有写出首次出现顺序、nil行为和所有权这些重要契约。' }
      - line: 11
        kind: edge-case
        note: { en: 'The task requires nil input to produce nil, but this returns a non-nil empty slice.', zh: '任务要求nil输入返回nil，但这里返回了非nil的空切片。' }
      - line: 21
        kind: correctness
        note: { en: 'Sorting changes first-occurrence order, so the result violates the core stable-deduplication contract.', zh: '排序会改变首次出现顺序，因此结果违反稳定去重的核心契约。' }
      - line: 22
        kind: performance
        note: { en: 'Formatting both operands on every comparison adds repeated allocations and O(n log n) comparison work that the task does not need.', zh: '每次比较都格式化两个操作数，会产生重复分配和任务不需要的O(n log n) 比较工作。' }
    checklist:
      - { en: 'Test nil, empty, all-duplicate, and already-unique inputs.', zh: '测试nil、空切片、全部重复和已经唯一的输入。' }
      - { en: 'Assert exact output order, not just set membership.', zh: '断言精确输出顺序，而不只是检查集合成员。' }
      - { en: 'Verify the input remains unchanged and the result does not alias it unexpectedly.', zh: '确认输入保持不变，并检查结果没有意外与其共享存储。' }
      - { en: 'Run a representative benchmark before retaining sorting or formatting work.', zh: '保留排序或格式化工作前，先运行有代表性的基准测试。' }
    explanation: { en: 'Remove the sort, return nil for nil input, document the full contract, and preallocate the result when expected cardinality justifies it. Tests must compare order and nilness explicitly.', zh: '应删除排序，对nil输入返回nil，写清完整契约，并在预期基数合理时预分配结果。测试必须明确比较顺序和nil属性。' }
    difficulty: advanced
    tags: [code-review, stable-order, zero-value, performance]
