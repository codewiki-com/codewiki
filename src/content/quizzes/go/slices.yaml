topic: go/slices
items:
  - id: predict-shared-capacity
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      package main

      import "fmt"

      func main() {
          base := []int{10, 20, 30, 40}
          view := base[1:3]
          copyHeader := view
          copyHeader[0] = 99
          copyHeader = append(copyHeader, 50)
          fmt.Println(base)
          fmt.Println(view)
      }
    lang: go
    options:
      - { text: { en: '[10 20 30 40], then [20 30]', zh: '先输出[10 20 30 40]，再输出[20 30]' }, correct: false }
      - { text: { en: '[10 99 30 50], then [99 30]', zh: '先输出[10 99 30 50]，再输出[99 30]' }, correct: true }
      - { text: { en: '[10 99 30 40], then [99 30 50]', zh: '先输出[10 99 30 40]，再输出[99 30 50]' }, correct: false }
      - { text: { en: 'It panics because view has length 2.', zh: '程序会panic，因为view的长度为2。' }, correct: false }
    explanation: { en: 'The header copy shares elements, so the assignment changes base[1]. The view has spare capacity, so append reuses the array and writes 50 into base[3], while view keeps length 2.', zh: '切片头副本共享元素，所以赋值会修改base[1]。view还有容量，因此append复用数组并把50写入base[3]，但view的长度仍为2。' }
    difficulty: intermediate
    tags: [aliasing, capacity, predict-output]

  - id: nil-empty-contract
    type: mcq
    prompt: { en: 'Which statement about var items []string and items := []string{} is correct?', zh: '关于var items []string与items := []string{}，哪项说法正确？' }
    options:
      - { text: { en: 'Both compare equal to nil.', zh: '两者与nil比较都为true。' }, correct: false }
      - { text: { en: 'Both have length zero and accept append, but their default JSON encodings differ.', zh: '两者长度都为零且都能append，但默认JSON编码不同。' }, correct: true }
      - { text: { en: 'Only the empty literal can be ranged over.', zh: '只有空字面量可以使用range遍历。' }, correct: false }
      - { text: { en: 'The nil slice cannot be passed to copy.', zh: 'nil切片不能传给copy。' }, correct: false }
    explanation: { en: 'Both forms work with len, range, append, and copy. The nil form compares equal to nil and encoding/json emits null for it, while a non-nil empty slice becomes [].', zh: '两种形式都能用于len、range、append和copy。nil形式与nil比较为true，encoding/json会把它编码成null；非nil空切片则编码成 []。' }
    difficulty: beginner
    tags: [nil-slice, json, api-contract]

  - id: spotbug-preallocated-length
    title: { en: 'Spot the bug in the preallocated slice', zh: '找出预分配切片里的bug' }
    type: spotbug
    prompt: { en: 'Find why collect returns twice as many elements as its input.', zh: '找出collect为什么会返回输入两倍数量的元素。' }
    code: |
      func collect(ids []int) []int {
          result := make([]int, len(ids))
          for _, id := range ids {
              result = append(result, id)
          }
          return result
      }
    lang: go
    issues:
      - line: 2
        kind: correctness
        note: { en: 'make creates len(ids) existing zero-valued elements, then append adds another len(ids). Use make([]int, 0, len(ids)) for append-based construction, or assign by index.', zh: 'make已经创建了len(ids) 个零值元素，append又添加了len(ids) 个元素。追加式构造应使用make([]int, 0, len(ids))，或改为按索引赋值。' }
    explanation: { en: 'Length describes elements that already exist; capacity describes reserved room. The code intended to reserve capacity but initialized the length instead.', zh: '长度表示已经存在的元素，容量表示预留空间。这段代码本想预留容量，却初始化了长度。' }
    difficulty: beginner
    tags: [make, length, capacity]

  - id: spotbug-lost-append-result
    title: { en: 'Spot the bug in the addTag helper', zh: '找出addTag辅助函数里的bug' }
    type: spotbug
    prompt: { en: 'Find why addTag does not reliably add a visible tag for its caller.', zh: '找出addTag为什么不能可靠地让调用方看到新增标签。' }
    code: |
      func addTag(tags []string, tag string) {
          tags = append(tags, tag)
      }

      func label() []string {
          tags := []string{"stable"}
          addTag(tags, "reviewed")
          return tags
      }
    lang: go
    issues:
      - line: 2
        kind: correctness
        note: { en: 'append returns a new slice value with a new length and possibly a new backing array, but the function keeps it only in its local header. Return []string and assign the result in label.', zh: 'append返回带有新长度、也可能带有新底层数组的切片值，但函数只把它保存在局部切片头中。应返回 []string，并在label中接收结果。' }
    explanation: { en: 'A function can modify shared existing elements through a slice parameter, but replacing its local header does not replace the caller header. Returning the result makes the length change explicit.', zh: '函数可以通过切片参数修改共享的现有元素，但替换局部切片头不会替换调用方的切片头。返回结果可以明确传递长度变化。' }
    difficulty: intermediate
    tags: [append, function-parameters, slice-header]

  - id: clone-depth
    type: mcq
    prompt: { en: 'What independence does slices.Clone provide for a [][]byte value?', zh: '对 [][]byte使用slices.Clone会提供哪一层独立性？' }
    options:
      - { text: { en: 'It clones the outer slice but the inner byte slices still share their backing arrays.', zh: '它会克隆外层切片，但内层字节切片仍共享各自的底层数组。' }, correct: true }
      - { text: { en: 'It recursively clones every byte in every inner slice.', zh: '它会递归克隆每个内层切片中的所有字节。' }, correct: false }
      - { text: { en: 'It returns the same outer slice when capacity is sufficient.', zh: '容量足够时，它会返回同一个外层切片。' }, correct: false }
      - { text: { en: 'It cannot clone a slice whose elements are slices.', zh: '它不能克隆元素也是切片的切片。' }, correct: false }
    explanation: { en: 'Clone makes a shallow copy of the outer elements. Each copied element is still a slice header naming the same inner backing array, so deep independence requires cloning each row.', zh: 'Clone对外层元素执行浅拷贝。复制后的每个元素仍是指向同一内层底层数组的切片头，因此要完全独立，必须逐行克隆。' }
    difficulty: intermediate
    tags: [clone, shallow-copy, nested-slices]

  - id: review-generated-event-collector
    title: { en: 'Review generated event collector', zh: '审查生成的事件收集器' }
    type: review
    prompt: { en: 'Review this generated event collector against the stated task.', zh: '根据任务要求审查这段生成的事件收集代码。' }
    task: { en: 'Collect at most limit events in channel order, return payloads that no longer alias producer buffers, and handle invalid limits without panicking.', zh: '按channel顺序最多收集limit个事件，返回不再与生产方缓冲区共享的payload，并在limit无效时避免panic。' }
    code: |
      package events

      import "sort"

      type Event struct {
          ID      int
          Payload []byte
      }

      func collect(ch <-chan Event, limit int) []Event {
          events := make([]Event, limit)
          for event := range ch {
              events = append(events, event)
              if len(events) == limit {
                  break
              }
          }
          sort.Slice(events, func(i, j int) bool {
              return events[i].ID < events[j].ID
          })
          return events
      }
    lang: go
    right: { en: 'The code defines the event shape explicitly, keeps channel reads in one goroutine, and tries to enforce a caller-supplied limit before returning a concrete slice.', zh: '代码明确声明了事件结构，只在一个goroutine中读取channel，并尝试在返回具体切片前执行调用方提供的数量限制。' }
    checklist:
      - { en: 'Match make length and capacity to whether later writes use indices or append.', zh: '根据后续写入使用索引还是append，核对make的长度与容量。' }
      - { en: 'Test negative, zero, one, and larger limits against open and closed channels.', zh: '用负数、零、一和更大的limit测试打开与关闭的channel。' }
      - { en: 'Mutation-test every byte slice that must be independent from producer-owned buffers.', zh: '对每个必须脱离生产方缓冲区的字节切片执行变异测试。' }
      - { en: 'Reject extra sorting or reordering unless the task requests it.', zh: '除非任务明确要求，否则拒绝额外的排序或重排。' }
    issues:
      - line: 11
        kind: correctness
        note: { en: 'make sets the length to limit before any reads. Appending adds zero-valued prefix entries, and len(events) cannot equal a non-negative limit after the first append; use length zero with capacity limit and count accepted events.', zh: 'make在读取前就把长度设为limit。继续append会留下零值前缀，而且第一次追加后len(events) 不可能再等于非负的limit；应使用长度为零、容量为limit的切片，并统计已接收事件。' }
      - line: 13
        kind: security
        note: { en: 'Appending Event copies only its Payload slice header. If a producer reuses or mutates that buffer, returned data can change across trust boundaries; clone each payload before retaining it.', zh: '追加Event只会复制Payload的切片头。如果生产方复用或修改缓冲区，跨信任边界返回的数据也会变化；保留前应克隆每个payload。' }
      - line: 18
        kind: performance
        note: { en: 'Sorting adds O(n log n) work and allocation-sensitive comparator traffic even though channel order is already the required order. It also changes the requested ordering and should be removed.', zh: '任务已经要求保持channel顺序，排序却增加O(n log n) 的工作和比较开销，还会改变要求的顺序，因此应删除。' }
    explanation: { en: 'Validate limit first, allocate make([]Event, 0, limit), clone each Payload, append until the accepted count reaches limit, and return without sorting. Tests should include a producer that reuses one byte buffer.', zh: '应先校验limit，分配make([]Event, 0, limit)，克隆每个Payload，追加到接收数量达到limit后停止，并直接返回而不排序。测试应包含重复使用同一个字节缓冲区的生产方。' }
    difficulty: advanced
    tags: [code-review, aliasing, bounds, performance]
