topic: go/defer-panic-recover
items:
  - id: predict-defer-evaluation
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      package main

      import "fmt"

      func main() {
          label := "draft"
          defer fmt.Println("argument:", label)
          defer func() { fmt.Println("closure:", label) }()
          label = "final"
          fmt.Println("body:", label)
      }
    lang: go
    options:
      - { text: { en: 'body: final / closure: final / argument: draft', zh: 'body: final / closure: final / argument: draft' }, correct: true }
      - { text: { en: 'body: final / argument: draft / closure: final', zh: 'body: final / argument: draft / closure: final' }, correct: false }
      - { text: { en: 'body: final / closure: draft / argument: draft', zh: 'body: final / closure: draft / argument: draft' }, correct: false }
      - { text: { en: 'argument: draft / closure: final / body: final', zh: 'argument: draft / closure: final / body: final' }, correct: false }
    explanation: { en: 'The direct argument is saved when defer executes, while the closure reads label at exit. Deferred calls then run in reverse registration order.', zh: '直接传入的实参在执行 defer 时保存，闭包则在退出时读取 label。两个延迟调用按注册顺序的逆序运行。' }
    difficulty: beginner
    tags: [defer, evaluation, lifo]

  - id: recover-effective-call
    type: mcq
    prompt: { en: 'When can recover stop a panic?', zh: 'recover 在什么情况下能停止 panic？' }
    options:
      - { text: { en: 'When a deferred function in the same goroutine calls recover directly', zh: '同一 goroutine 中的延迟函数直接调用 recover 时' }, correct: true }
      - { text: { en: 'Whenever any parent goroutine has deferred recover', zh: '只要任意父 goroutine 延迟调用了 recover' }, correct: false }
      - { text: { en: 'When an ordinary helper called by a deferred function calls recover', zh: '延迟函数调用的普通辅助函数再调用 recover 时' }, correct: false }
      - { text: { en: 'Whenever recover appears lexically above panic', zh: '只要 recover 在源码位置上位于 panic 上方' }, correct: false }
    explanation: { en: 'The call must be direct from a function currently running because it was deferred, and the panic must be unwinding that same goroutine.', zh: 'recover 必须由正在作为延迟调用执行的函数直接调用，而且目标 panic 必须正在同一个 goroutine 中展开。' }
    difficulty: intermediate
    tags: [recover, goroutine, panic]

  - id: spotbug-defer-in-loop
    type: spotbug
    prompt: { en: 'Find the resource-lifetime problems in this batch digest function.', zh: '找出这个批量摘要函数中的资源生命周期问题。' }
    code: |
      func digestAll(paths []string) error {
          for _, path := range paths {
              file, err := os.Open(path)
              if err != nil {
                  return err
              }
              defer file.Close()
              if err := digest(file); err != nil {
                  return err
              }
          }
          return nil
      }
    lang: go
    issues:
      - line: 7
        kind: performance
        note: { en: 'Every file remains open until digestAll returns, so a large input can exhaust file descriptors.', zh: '所有文件都会保持打开直到 digestAll 返回，大批输入可能耗尽文件描述符。' }
      - line: 7
        kind: edge-case
        note: { en: 'The close error is discarded, which can hide a failure for resource types whose Close finalizes work.', zh: '关闭错误被丢弃；对于由 Close 完成最终写入的资源，这会隐藏失败。' }
    explanation: { en: 'Move one iteration into a helper that defers Close so the resource is released after each digest. Preserve a close error when the concrete resource contract makes it significant.', zh: '把单次迭代移入辅助函数并在其中延迟 Close，让每次摘要完成后立即释放资源。具体资源的契约认为关闭错误有意义时，还要保留该错误。' }
    difficulty: intermediate
    tags: [defer, loops, resource-lifetime]

  - id: exit-skips-defer
    type: mcq
    prompt: { en: 'Which operation terminates without running deferred calls?', zh: '哪项操作会在不执行延迟调用的情况下终止？' }
    options:
      - { text: { en: 'Returning from main', zh: '从 main 返回' }, correct: false }
      - { text: { en: 'A recovered panic', zh: '被恢复的 panic' }, correct: false }
      - { text: { en: 'runtime.Goexit', zh: 'runtime.Goexit' }, correct: false }
      - { text: { en: 'os.Exit', zh: 'os.Exit' }, correct: true }
    explanation: { en: 'os.Exit terminates the process immediately, so no deferred call runs. Goexit runs deferred calls for the current goroutine but cannot be stopped by recover.', zh: 'os.Exit 会立即终止进程，因此不会执行任何延迟调用。Goexit 会执行当前 goroutine 的延迟调用，但 recover 无法阻止它。' }
    difficulty: intermediate
    tags: [defer, os-exit, goexit]

  - id: review-generated-export-batch
    type: review
    prompt: { en: 'Review this generated export-batch implementation.', zh: '审查这个生成的批量导出实现。' }
    task: { en: 'Process user-submitted export jobs under /srv/exports, allow at most four concurrent jobs, close each file, return after all jobs finish, and report ordinary I/O errors without crashing.', zh: '处理用户提交的导出任务，把文件限制在 /srv/exports 下，最多并发执行四项任务，关闭每个文件，等待全部任务完成，并以普通错误报告 I/O 失败而不让进程崩溃。' }
    code: |
      func processAll(jobs []Job) (err error) {
          defer func() {
              if value := recover(); value != nil {
                  err = fmt.Errorf("batch failed: %v", value)
              }
          }()
          for _, job := range jobs {
              go func() {
                  path := filepath.Join("/srv/exports", job.Path)
                  handle, err := os.Create(path)
                  if err != nil {
                      panic(err)
                  }
                  defer handle.Close()
                  if _, err := handle.Write(job.Data); err != nil {
                      panic(err)
                  }
              }()
          }
          return nil
      }
    lang: go
    right: { en: 'The generated code keeps each file close inside the job that owns the handle and checks the immediate create and write results.', zh: '生成代码把文件关闭放在拥有句柄的任务内部，也检查了创建和写入操作的即时结果。' }
    checklist:
      - { en: 'Trace each panic to a direct recovery call in the same goroutine.', zh: '沿每条 panic 路径找到同一 goroutine 中直接调用 recover 的位置。' }
      - { en: 'Verify path containment after cleaning or resolving user-controlled names.', zh: '清理或解析用户可控名称后，验证路径仍位于目标目录内。' }
      - { en: 'Bound concurrency and wait for every started job before returning.', zh: '限制并发量，并在返回前等待每个已启动任务。' }
      - { en: 'Return ordinary I/O and close failures through an inspectable error chain.', zh: '通过可检查的错误链返回普通 I/O 错误和关闭错误。' }
    issues:
      - line: 3
        kind: correctness
        note: { en: 'This recover runs in processAll, so it cannot catch a panic from either child goroutine.', zh: '这个 recover 在 processAll 中运行，因此无法捕获任何子 goroutine 的 panic。' }
      - line: 8
        kind: performance
        note: { en: 'The loop launches one goroutine per job with no four-job capacity limit.', zh: '循环为每个任务启动一个 goroutine，没有把并发量限制为四项。' }
      - line: 9
        kind: security
        note: { en: 'Cleaning with filepath.Join does not prove containment; a path containing .. can escape /srv/exports.', zh: '使用 filepath.Join 清理路径不能证明路径受限；包含 .. 的路径可能逃出 /srv/exports。' }
      - line: 20
        kind: edge-case
        note: { en: 'processAll returns before any child is guaranteed to finish, so it can report success while work is pending or about to panic.', zh: 'processAll 返回时不能保证任何子任务已经完成，因此可能在工作仍未结束或即将 panic 时报告成功。' }
    explanation: { en: 'Use a bounded worker group that owns and waits for every job, validate the resolved output path, and return normal I/O errors. If job isolation also requires panic recovery, install it directly inside each worker and capture the stack.', zh: '应使用有界工作组拥有并等待每项任务，验证解析后的输出路径，并返回普通 I/O 错误。如果任务隔离还要求恢复 panic，就在每个 worker 内直接安装恢复函数并记录栈。' }
    difficulty: advanced
    tags: [code-review, recover, goroutine, security]
