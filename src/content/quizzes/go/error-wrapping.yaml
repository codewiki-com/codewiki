topic: go/error-wrapping
items:
  - id: predict-wrapped-sentinel
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      package main

      import (
          "errors"
          "fmt"
      )

      var ErrClosed = errors.New("store closed")

      func main() {
          err := fmt.Errorf("publish: %w", ErrClosed)
          fmt.Println(err == ErrClosed)
          fmt.Println(errors.Is(err, ErrClosed))
      }
    lang: go
    options:
      - { text: { en: 'false, then true', zh: '先输出 false，再输出 true' }, correct: true }
      - { text: { en: 'true, then true', zh: '先输出 true，再输出 true' }, correct: false }
      - { text: { en: 'false, then false', zh: '先输出 false，再输出 false' }, correct: false }
      - { text: { en: 'The program does not compile.', zh: '程序无法编译。' }, correct: false }
    explanation: { en: 'The wrapper is a different outer value, so equality is false. errors.Is traverses through `%w` and finds ErrClosed.', zh: '包装器是不同的最外层值，因此相等比较为 false。errors.Is 会沿 `%w` 向下遍历并找到 ErrClosed。' }
    difficulty: beginner
    tags: [errors-is, sentinel-error, predict-output]

  - id: predict-joined-unwrapping
    type: predict
    prompt: { en: 'Which three Boolean values does this program print?', zh: '这段程序会输出哪三个布尔值？' }
    code: |
      package main

      import (
          "errors"
          "fmt"
      )

      var ErrName = errors.New("name")
      var ErrEmail = errors.New("email")

      func main() {
          err := errors.Join(ErrName, fmt.Errorf("field: %w", ErrEmail))
          fmt.Println(errors.Is(err, ErrName))
          fmt.Println(errors.Is(err, ErrEmail))
          fmt.Println(errors.Unwrap(err) == nil)
      }
    lang: go
    options:
      - { text: { en: 'true / true / true', zh: 'true / true / true' }, correct: true }
      - { text: { en: 'true / true / false', zh: 'true / true / false' }, correct: false }
      - { text: { en: 'true / false / false', zh: 'true / false / false' }, correct: false }
      - { text: { en: 'false / false / true', zh: 'false / false / true' }, correct: false }
    explanation: { en: 'Is traverses every joined branch, while errors.Unwrap recognizes only Unwrap() error and therefore returns nil for the joined value.', zh: 'Is 会遍历合并后的每个分支，而 errors.Unwrap 只识别 Unwrap() error，因此对合并值返回 nil。' }
    difficulty: intermediate
    tags: [errors-join, errors-is, unwrap]

  - id: choose-public-wrapping-contract
    type: mcq
    prompt: { en: 'A package replaces its database but wants callers to keep matching ErrAccountMissing. Which return preserves that contract without exposing sql.ErrNoRows?', zh: '一个包替换了数据库，但希望调用方仍能匹配 ErrAccountMissing。哪种返回方式既保留契约，又不公开 sql.ErrNoRows？' }
    options:
      - { text: { en: 'fmt.Errorf("load account: %w", ErrAccountMissing)', zh: 'fmt.Errorf("load account: %w", ErrAccountMissing)' }, correct: true }
      - { text: { en: 'fmt.Errorf("load account: %w", sql.ErrNoRows)', zh: 'fmt.Errorf("load account: %w", sql.ErrNoRows)' }, correct: false }
      - { text: { en: 'fmt.Errorf("load account: %v", ErrAccountMissing)', zh: 'fmt.Errorf("load account: %v", ErrAccountMissing)' }, correct: false }
      - { text: { en: 'errors.New(sql.ErrNoRows.Error())', zh: 'errors.New(sql.ErrNoRows.Error())' }, correct: false }
    explanation: { en: 'Wrapping the package sentinel keeps the promised category and hides the storage representation. Wrapping sql.ErrNoRows would publish the dependency error instead.', zh: '包装包自己的哨兵错误可以保留已承诺的类别，同时隐藏存储实现。包装 sql.ErrNoRows 则会公开依赖错误。' }
    difficulty: intermediate
    tags: [api-contract, sentinel-error, error-translation]

  - id: spotbug-errors-as-target
    type: spotbug
    prompt: { en: 'Find why this generated program panics instead of printing true.', zh: '找出这段生成代码为什么会 panic，而不是输出 true。' }
    code: |
      package main

      import (
          "errors"
          "fmt"
      )

      type ParseError struct{ Input string }

      func (e *ParseError) Error() string {
          return "invalid input: " + e.Input
      }

      func main() {
          err := fmt.Errorf("import: %w", &ParseError{Input: "x"})
          var target ParseError
          fmt.Println(errors.As(err, &target))
      }
    lang: go
    issues:
      - line: 17
        kind: correctness
        note: { en: 'ParseError does not implement error because Error has a pointer receiver. The target slot must be *ParseError, so As receives **ParseError.', zh: 'ParseError 没有实现 error，因为 Error 使用指针接收者。目标槽位必须是 *ParseError，因此传给 As 的是 **ParseError。' }
    explanation: { en: 'Declare `var target *ParseError` and call `errors.As(err, &target)`. The pointer passed to As then points to a slot whose value can implement error.', zh: '应声明 `var target *ParseError`，再调用 `errors.As(err, &target)`。此时传给 As 的指针指向一个其值可实现 error 的槽位。' }
    difficulty: intermediate
    tags: [errors-as, pointer-receiver, panic]

  - id: review-generated-operation-wrapper
    type: review
    title: { en: 'Review a generated operation wrapper', zh: '审查生成的操作错误包装器' }
    prompt: { en: 'Review this generated operation wrapper.', zh: '审查这个生成的操作错误包装器。' }
    task: { en: 'Wrap execute failures with the operation and job ID, preserve the matchable cause, avoid duplicate reporting, and return nil when execution succeeds.', zh: '包装 execute 的失败并加入操作和任务 ID，保留可匹配的原因，避免重复报告，并在执行成功时返回 nil。' }
    code: |
      type OpError struct {
          Op  string
          Err error
      }

      func (e *OpError) Error() string {
          return e.Op + ": " + e.Err.Error()
      }

      func (e *OpError) Unwrap() error {
          return e.Err
      }

      func (e *OpError) Is(target error) bool {
          return errors.Is(e.Err, target)
      }

      func runJob(id string) error {
          err := execute(id)
          if err != nil {
              log.Printf("job %s failed: %v", id, err)
              return &OpError{Op: "run job " + id, Err: err}
          }
          return &OpError{Op: "run job " + id}
      }
    lang: go
    right: { en: 'The generated type records a named operation, keeps the cause in a dedicated field, and exposes that cause correctly through Unwrap.', zh: '生成的类型记录了明确操作，把原因保存在专用字段中，并通过 Unwrap 正确公开该原因。' }
    checklist:
      - { en: 'Test both a sentinel cause and a typed cause through the public wrapper.', zh: '通过公开包装器分别测试哨兵原因和具体类型原因。' }
      - { en: 'Confirm the success path returns an interface that equals nil.', zh: '确认成功路径返回的接口确实等于 nil。' }
      - { en: 'Keep custom Is methods shallow and let the standard library traverse children.', zh: '让自定义 Is 方法保持浅层匹配，由标准库遍历子节点。' }
      - { en: 'Choose one boundary to log each failure and test the final context there.', zh: '为每次失败选择唯一日志边界，并在那里测试最终上下文。' }
    issues:
      - line: 7
        kind: edge-case
        note: { en: 'Error assumes Err is non-nil and dereferences it; the success value constructed below therefore panics when formatted.', zh: 'Error 假定 Err 非 nil 并直接解引用；下方构造的成功返回值在格式化时因此会触发 panic。' }
      - line: 15
        kind: performance
        note: { en: 'The custom Is recursively traverses the child, which the standard errors.Is traversal will visit again after a miss; nested wrappers repeat increasing amounts of work.', zh: '自定义 Is 递归遍历子节点；匹配失败后，标准 errors.Is 还会再次访问该子节点，嵌套包装会反复执行越来越多的工作。' }
      - line: 21
        kind: readability
        note: { en: 'runJob logs a failure that it also returns, so an owning caller that logs the result will report the same failure twice.', zh: 'runJob 记录了随后继续返回的失败；拥有处理结果的调用方再次记录时，同一次失败会出现两条日志。' }
      - line: 24
        kind: correctness
        note: { en: 'The success path returns a non-nil *OpError, so callers treat a successful execute call as a failure.', zh: '成功路径返回非 nil 的 *OpError，因此调用方会把成功的 execute 调用误判为失败。' }
    explanation: { en: 'Keep Unwrap as written, remove the recursive Is method unless it adds shallow semantics, and let the owner log the returned error. A successful execute call must return a literal nil.', zh: '保留当前的 Unwrap；除非 Is 提供额外的浅层语义，否则应删除递归 Is，并让拥有结果的一层记录返回错误。execute 成功时必须返回字面值 nil。' }
    difficulty: advanced
    tags: [code-review, custom-error, unwrap, generated-code]
