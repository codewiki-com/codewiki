topic: go/reflection
items:
  - id: predict-named-type-state
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      package main

      import (
          "fmt"
          "reflect"
      )

      type Score int

      func main() {
          score := Score(8)
          value := reflect.ValueOf(&score).Elem()
          fmt.Println(value.CanAddr(), value.CanSet())
          fmt.Println(value.Type(), value.Kind())
      }
    lang: go
    options:
      - text: { en: "true true\nmain.Score int", zh: "true true\nmain.Score int" }
        correct: true
      - text: { en: "true false\nmain.Score int", zh: "true false\nmain.Score int" }
        correct: false
      - text: { en: "false false\nint int", zh: "false false\nint int" }
        correct: false
      - text: { en: 'The call to Elem panics.', zh: '调用 Elem 时发生 panic。' }
        correct: false
    explanation: { en: 'ValueOf receives *Score, and Elem reaches the original settable variable. Its exact type remains main.Score while its underlying Kind is int.', zh: 'ValueOf 接收 *Score，Elem 取得原来可设置的变量。它的精确类型仍是 main.Score，底层 Kind 则是 int。' }
    difficulty: intermediate
    tags: [predict-output, named-type, settability]
    tests: go run predict_named_type_state.go
    minutes: 3

  - id: choose-unexported-field-guard
    type: mcq
    prompt: { en: 'Which check protects Value.Interface() when iterating fields that may be unexported?', zh: '遍历可能包含未导出字段的结构体时，哪项检查能保护 Value.Interface()？' }
    options:
      - { text: { en: 'field.CanInterface()', zh: 'field.CanInterface()' }, correct: true }
      - { text: { en: 'field.CanAddr()', zh: 'field.CanAddr()' }, correct: false }
      - { text: { en: 'field.IsZero()', zh: 'field.IsZero()' }, correct: false }
      - { text: { en: 'field.Type().Comparable()', zh: 'field.Type().Comparable()' }, correct: false }
    explanation: { en: 'CanInterface reports whether Interface can expose the reflected value without panicking. Addressability and comparability answer unrelated questions.', zh: 'CanInterface 表示 Interface 能否在不 panic 的情况下暴露反射值。可寻址性与可比较性回答的是其他问题。' }
    difficulty: intermediate
    tags: [visibility, can-interface, panic]
    minutes: 3

  - id: spotbug-universal-isnil
    type: spotbug
    prompt: { en: 'Find why this nil helper panics for ordinary values.', zh: '找出这个 nil 辅助函数为何会在普通值上 panic。' }
    code: |
      package main

      import "reflect"

      func IsNil(input any) bool {
          value := reflect.ValueOf(input)
          return value.IsNil()
      }

      func main() {
          println(IsNil(3))
      }
    lang: go
    issues:
      - line: 7
        kind: correctness
        note: { en: 'IsNil panics for an int and for an invalid Value; first check IsValid, then call IsNil only for the six nil-capable kinds.', zh: 'IsNil 用于 int 或无效 Value 时会 panic；应先检查 IsValid，再只对六种可为 nil 的 Kind 调用 IsNil。' }
    explanation: { en: 'IsNil is defined only for Chan, Func, Interface, Map, Pointer, and Slice. A nil interface also produces an invalid Value that needs a separate branch.', zh: 'IsNil 只适用于 Chan、Func、Interface、Map、Pointer 和 Slice。nil 接口还会产生无效 Value，需要单独处理。' }
    difficulty: intermediate
    tags: [nil, invalid-value, kind-guard]
    tests: go run universal_isnil.go
    minutes: 4

  - id: choose-pointer-method-lookup
    type: mcq
    prompt: { en: 'A method is declared as func (*Worker) Stop(). Which reflected receiver can expose it through MethodByName?', zh: '某方法声明为 func (*Worker) Stop()。哪个反射接收者能通过 MethodByName 找到它？' }
    options:
      - { text: { en: 'reflect.ValueOf(&Worker{})', zh: 'reflect.ValueOf(&Worker{})' }, correct: true }
      - { text: { en: 'reflect.ValueOf(Worker{}) only', zh: '仅 reflect.ValueOf(Worker{})' }, correct: false }
      - { text: { en: 'Both values always expose identical method sets.', zh: '两种值始终公开完全相同的方法集。' }, correct: false }
      - { text: { en: 'MethodByName cannot find pointer-receiver methods.', zh: 'MethodByName 无法找到指针接收者方法。' }, correct: false }
    explanation: { en: 'Stop belongs to the method set of *Worker, not Worker. Reflection follows the method-set distinction instead of implicitly taking an address for this lookup.', zh: 'Stop 属于 *Worker 的方法集，不属于 Worker。反射查找遵循方法集差异，不会在这里隐式取地址。' }
    difficulty: intermediate
    tags: [method-set, pointer-receiver, method-by-name]
    minutes: 3

  - id: review-generated-settings-patch
    type: review
    prompt: { en: 'Review this generated settings patcher against the task.', zh: '根据任务要求审查这个生成的设置更新器。' }
    task: { en: 'Update a non-nil *Settings only through edit tags, reject unknown, nil, or incompatible values without panicking, never expose AdminToken, and reuse validated metadata in batch processing.', zh: '只通过 edit 标签更新非 nil 的 *Settings；遇到未知、nil 或不兼容值时返回错误且不能 panic；绝不暴露 AdminToken，并在批处理中复用已验证的元数据。' }
    code: |
      package config

      import "reflect"

      type Settings struct {
          Host       string `edit:"host"`
          Port       int    `edit:"port"`
          AdminToken string
      }

      func Apply(dst any, changes map[string]any) error {
          target := reflect.ValueOf(dst).Elem()
          for name, raw := range changes {
              field := target.FieldByName(name)
              if !field.IsValid() {
                  continue
              }
              candidate := reflect.ValueOf(raw)
              if candidate.Type().ConvertibleTo(field.Type()) {
                  field.Set(candidate.Convert(field.Type()))
              }
          }
          return nil
      }
    lang: go
    right: { en: 'The generated code keeps reflection inside one helper, checks that a requested field exists before setting it, and mutates the supplied destination rather than a detached copy.', zh: '生成代码把反射集中在一个辅助函数中，在设置字段前检查字段是否存在，而且修改传入的目标，而不是脱离原对象的副本。' }
    checklist:
      - { en: 'Pass nil, a value, a nil pointer, and pointers to non-struct and struct values; require errors rather than panics.', zh: '传入 nil、普通值、nil 指针、指向非结构体和结构体的指针，要求返回错误而不是 panic。' }
      - { en: 'Try tag names, Go field names, unknown names, and AdminToken; assert that only tagged fields change.', zh: '尝试标签名、Go 字段名、未知名称和 AdminToken，断言只有带标签字段发生变化。' }
      - { en: 'Exercise nil, named types, incompatible types, and numeric boundaries before allowing conversion.', zh: '允许转换前，覆盖 nil、命名类型、不兼容类型与数值边界。' }
      - { en: 'Benchmark a representative batch and verify that the cache retains type plans, not request Values.', zh: '对有代表性的批次运行基准，确认缓存保留的是类型计划，而不是请求中的 Value。' }
    issues:
      - line: 12
        kind: correctness
        note: { en: 'Elem panics for nil, a non-pointer, or a nil pointer, and the code never establishes that the element is a struct.', zh: 'dst 为 nil、非指针或 nil 指针时，Elem 会 panic；代码也没有确认指针元素是结构体。' }
      - line: 14
        kind: security
        note: { en: 'FieldByName accepts external Go field names instead of edit tags, so AdminToken becomes writable even though it has no edit tag.', zh: 'FieldByName 接受外部提供的 Go 字段名，而不是 edit 标签，因此没有 edit 标签的 AdminToken 也会变成可写字段。' }
      - line: 19
        kind: edge-case
        note: { en: 'A nil raw value produces an invalid Value and Type panics; broad numeric conversion can also change an out-of-range value.', zh: 'raw 为 nil 时会产生无效 Value，调用 Type 随即 panic；宽泛数值转换也可能改变越界值。' }
      - line: 14
        kind: performance
        note: { en: 'Every update repeats name discovery and type-policy work; batch code should reuse an immutable validated plan keyed by reflect.Type.', zh: '每次更新都重复名称发现与类型策略工作；批处理代码应复用以 reflect.Type 为键、经过验证的不可变计划。' }
    explanation: { en: 'Validate the destination first, build an allowlist from edit tags, reject invalid or disallowed values under explicit assignment and range rules, and cache only immutable type metadata for repeated work.', zh: '应先验证目标，再根据 edit 标签建立允许清单，按照明确的赋值与范围规则拒绝无效或不允许的值，并且只为重复处理缓存不可变类型元数据。' }
    difficulty: advanced
    tags: [code-review, mass-assignment, panic-safety, metadata-cache]
    tests: go test ./...
    minutes: 12
