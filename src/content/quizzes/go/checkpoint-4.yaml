topic: go/checkpoint-4
items:
  - id: checkpoint-4-reader-contract
    type: mcq
    prompt: { en: 'An `io.Reader` returns `n > 0` and `err == io.EOF` in the same call. What should the caller do?', zh: '一次 `io.Reader` 调用同时返回 `n > 0` 和 `err == io.EOF`。调用方应如何处理？' }
    options:
      - { text: { en: 'Process the first `n` bytes, then handle the EOF.', zh: '先处理前 `n` 个字节，再处理 EOF。' }, correct: true }
      - { text: { en: 'Discard the bytes because every non-nil error invalidates `n`.', zh: '丢弃这些字节，因为只要错误非 nil，`n` 就无效。' }, correct: false }
      - { text: { en: 'Retry the same read until it returns the bytes with a nil error.', zh: '重复同一次读取，直到字节与 nil 错误一起返回。' }, correct: false }
    explanation: { en: 'The Reader contract permits data and an error together, so code must consume `n` bytes before acting on `err`.', zh: 'Reader 契约允许一次调用同时返回数据和错误，因此代码必须先消费 `n` 个字节，再处理 `err`。' }
    difficulty: beginner
    tags: [checkpoint]
  - id: checkpoint-4-buffered-writer
    type: fill
    prompt: { en: 'Name the `bufio.Writer` method that pushes buffered bytes to the underlying writer.', zh: '写出把缓冲字节推送到底层 writer 的 `bufio.Writer` 方法名。' }
    answer: Flush
    explanation: { en: 'Buffered writes are not guaranteed to reach the underlying writer until `Flush` succeeds.', zh: '只有 `Flush` 成功后，缓冲写入才确保到达底层 writer。' }
    difficulty: beginner
    tags: [checkpoint]
  - id: checkpoint-4-json-boundary
    type: mcq
    prompt: { en: 'An HTTP API must reject misspelled JSON fields instead of silently ignoring them. Which decoder setup enforces that contract?', zh: 'HTTP API 必须拒绝拼错的 JSON 字段，而不是静默忽略。哪种解码器设置能落实这一契约？' }
    options:
      - { text: { en: 'Create a `json.Decoder`, call `DisallowUnknownFields`, then decode.', zh: '创建 `json.Decoder`，调用 `DisallowUnknownFields`，再解码。' }, correct: true }
      - { text: { en: 'Use `json.Unmarshal`; it rejects unknown fields by default.', zh: '使用 `json.Unmarshal`；它默认拒绝未知字段。' }, correct: false }
      - { text: { en: 'Add `omitempty` to every response field.', zh: '给每个响应字段添加 `omitempty`。' }, correct: false }
    explanation: { en: 'Unknown object keys are ignored by default; `DisallowUnknownFields` makes the request boundary strict.', zh: '默认情况下，未知对象字段会被忽略；`DisallowUnknownFields` 会让请求边界执行严格检查。' }
    difficulty: intermediate
    tags: [checkpoint]
  - id: checkpoint-4-header-commit
    type: fill
    prompt: { en: 'Name the `http.ResponseWriter` method after which changing ordinary response headers is too late.', zh: '写出 `http.ResponseWriter` 的方法名：调用该方法后再修改普通响应头就太晚了。' }
    answer: WriteHeader
    explanation: { en: '`WriteHeader` commits the status and headers; calling `Write` first implicitly commits status 200.', zh: '`WriteHeader` 会提交状态码和响应头；若先调用 `Write`，则会隐式提交状态码 200。' }
    difficulty: intermediate
    tags: [checkpoint]
  - id: checkpoint-4-graceful-shutdown
    type: mcq
    prompt: { en: 'Which action implements a bounded graceful shutdown for an `http.Server`?', zh: '哪项操作能为 `http.Server` 实现有时限的优雅关闭？' }
    options:
      - { text: { en: 'Call `Shutdown` with a timeout context so in-flight requests get a bounded chance to finish.', zh: '使用带超时的 context 调用 `Shutdown`，让进行中的请求有时限地完成。' }, correct: true }
      - { text: { en: 'Call `os.Exit` from the signal handler before waiting for handlers.', zh: '在信号处理器中调用 `os.Exit`，不等待处理器结束。' }, correct: false }
      - { text: { en: 'Close every client connection immediately and wait without a deadline.', zh: '立即关闭所有客户端连接，并且不设期限地等待。' }, correct: false }
    explanation: { en: '`Shutdown` stops accepting new work and waits for active connections within the supplied context deadline.', zh: '`Shutdown` 会停止接收新工作，并在传入 context 的截止时间内等待活动连接结束。' }
    difficulty: intermediate
    tags: [checkpoint]
  - id: checkpoint-4-no-rows
    type: fill
    prompt: { en: 'Name the sentinel returned by `QueryRow(...).Scan(...)` when a query produces no row.', zh: '查询没有返回任何行时，`QueryRow(...).Scan(...)` 会返回哪个哨兵错误？' }
    answer: sql.ErrNoRows
    explanation: { en: 'The no-row result is reported when `Scan` runs, and service code can translate `sql.ErrNoRows` into its own domain contract.', zh: '无结果错误会在执行 `Scan` 时报告；服务代码可以把 `sql.ErrNoRows` 转换为自己的领域契约。' }
    difficulty: advanced
    tags: [checkpoint]
  - id: checkpoint-4-sqlx-in
    type: mcq
    prompt: { en: 'A repository must bind a slice safely into an SQL `IN` clause and support PostgreSQL placeholders. Which sequence is correct?', zh: '仓储层需要把切片安全绑定到 SQL 的 `IN` 子句，并支持 PostgreSQL 占位符。哪组步骤正确？' }
    options:
      - { text: { en: 'Use `sqlx.In` to expand placeholders and arguments, then call `db.Rebind` before execution.', zh: '先用 `sqlx.In` 展开占位符和参数，再在执行前调用 `db.Rebind`。' }, correct: true }
      - { text: { en: 'Join values into the SQL string, then quote the complete query with `fmt.Sprintf`.', zh: '把各个值拼接进 SQL 字符串，再用 `fmt.Sprintf` 引用完整查询。' }, correct: false }
      - { text: { en: 'Pass the slice as one `?` argument; every driver expands it automatically.', zh: '把切片作为一个 `?` 参数传入；所有驱动都会自动展开。' }, correct: false }
    explanation: { en: '`sqlx.In` creates one bound argument per element, and `Rebind` converts the placeholder style for the selected driver.', zh: '`sqlx.In` 会为每个元素创建一个绑定参数，`Rebind` 再把占位符转换为所选驱动的格式。' }
    difficulty: advanced
    tags: [checkpoint]
  - id: checkpoint-4-log-review
    type: mcq
    prompt: { en: 'Which review rule preserves a structured logging contract at an authentication boundary?', zh: '在身份验证边界，哪条审查规则能维护结构化日志契约？' }
    options:
      - { text: { en: 'Keep stable attribute keys and omit or redact passwords, tokens, and full payment data.', zh: '保持属性键稳定，并省略或脱敏密码、令牌和完整支付数据。' }, correct: true }
      - { text: { en: 'Log complete request objects so no debugging context is lost.', zh: '记录完整请求对象，确保不丢失任何调试上下文。' }, correct: false }
      - { text: { en: 'Build one interpolated message because log handlers cannot process typed attributes.', zh: '拼接成一条消息，因为日志处理器无法处理带类型的属性。' }, correct: false }
    explanation: { en: 'Structured attributes aid filtering, but their values still require an explicit data-exposure policy; secrets must not reach logs.', zh: '结构化属性便于筛选，但属性值仍需遵守明确的数据暴露策略；敏感信息不得进入日志。' }
    difficulty: advanced
    tags: [checkpoint]
