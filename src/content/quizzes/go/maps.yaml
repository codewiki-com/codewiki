topic: go/maps
items:
  - id: predict-zero-value-and-presence
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      package main

      import "fmt"

      func main() {
          counts := map[string]int{"ready": 0}
          ready, readyOK := counts["ready"]
          missing, missingOK := counts["missing"]
          counts["accepted"]++
          fmt.Println(ready, readyOK)
          fmt.Println(missing, missingOK)
          fmt.Println(counts["accepted"])
      }
    lang: go
    options:
      - { text: { en: '0 true, then 0 false, then 1', zh: '依次输出 0 true、0 false、1' }, correct: true }
      - { text: { en: '0 false, then 0 false, then 1', zh: '依次输出 0 false、0 false、1' }, correct: false }
      - { text: { en: '0 true, then a panic on the missing key', zh: '先输出 0 true，再因缺失键发生 panic' }, correct: false }
      - { text: { en: '0 true, then 0 false, then 0', zh: '依次输出 0 true、0 false、0' }, correct: false }
    explanation: { en: 'A present entry can store the zero value, so readyOK is true. A missing integer entry reads as zero, and increment writes back one.', zh: '已存在的条目可以保存零值，所以 readyOK 为 true。缺失的整数条目读取为零，递增后会把 1 写回。' }
    difficulty: beginner
    tags: [comma-ok, zero-value, predict-output]

  - id: comparable-key-types
    type: mcq
    prompt: { en: 'Which declaration is a valid Go map type?', zh: '以下哪项是合法的 Go map 类型声明？' }
    options:
      - { text: { en: 'map[[]byte]string', zh: 'map[[]byte]string' }, correct: false }
      - { text: { en: 'map[func()]int', zh: 'map[func()]int' }, correct: false }
      - { text: { en: 'map[struct{ Region string; Zone int }]bool', zh: 'map[struct{ Region string; Zone int }]bool' }, correct: true }
      - { text: { en: 'map[map[string]int]bool', zh: 'map[map[string]int]bool' }, correct: false }
    explanation: { en: 'The struct is comparable because both fields are comparable. Slices, functions, and maps are not comparable and therefore cannot be map keys.', zh: '该结构体的两个字段都可比较，因此结构体本身可比较。slice、函数和 map 不可比较，不能作为 map 键。' }
    difficulty: beginner
    tags: [comparability, map-key, types]

  - id: nil-map-operations
    type: mcq
    prompt: { en: 'Which operation panics when records is a nil map[string]int?', zh: '当 records 是 nil 的 map[string]int 时，哪项操作会发生 panic？' }
    options:
      - { text: { en: 'Reading records["id"]', zh: '读取 records["id"]' }, correct: false }
      - { text: { en: 'Calling delete(records, "id")', zh: '调用 delete(records, "id")' }, correct: false }
      - { text: { en: 'Ranging over records', zh: '对 records 执行 range' }, correct: false }
      - { text: { en: 'Assigning records["id"] = 1', zh: '执行 records["id"] = 1' }, correct: true }
    explanation: { en: 'Lookup, delete, clear, len, and range are safe on a nil map. Adding or replacing an entry panics because the map has not been initialized.', zh: '对 nil map 执行读取、delete、clear、len 和 range 都是安全的。map 尚未初始化时，新增或替换条目会发生 panic。' }
    difficulty: beginner
    tags: [nil-map, initialization, panic]

  - id: spotbug-struct-field-update
    title: { en: 'Spot the bug in the map field update', zh: '找出 map 字段更新里的 bug' }
    type: spotbug
    prompt: { en: 'Find why rename does not compile.', zh: '找出 rename 无法编译的原因。' }
    code: |
      type Profile struct {
          Name string
      }

      func rename(profiles map[int]Profile, id int) {
          profiles[id].Name = "Lin"
      }
    lang: go
    issues:
      - line: 6
        kind: correctness
        note: { en: 'A map index expression is not an addressable struct variable, so its field cannot be assigned directly. Read the Profile, change its copy, and assign the whole value back.', zh: 'map 索引表达式不是可寻址的结构体变量，因此不能直接给其字段赋值。应先读出 Profile，修改副本，再把完整值写回。' }
    explanation: { en: 'Map entries may move as the implementation changes its storage, so Go does not expose an addressable struct element. A pointer-valued map is another design, but it changes aliasing and ownership.', zh: '实现调整存储时，map 条目可能移动，因此 Go 不提供可寻址的结构体元素。也可以改用指针值，但这会改变别名与所有权语义。' }
    difficulty: intermediate
    tags: [addressability, struct-value, assignment]

  - id: review-generated-price-store
    title: { en: 'Review generated price store', zh: '审查生成的价格存储' }
    type: review
    prompt: { en: 'Review this generated price store against the stated task.', zh: '根据任务要求审查这段生成的价格存储代码。' }
    task: { en: 'Build a zero-value-ready price store that distinguishes a missing item from a free item, returns a snapshot callers cannot mutate, and lists only stored keys in sorted order.', zh: '实现零值可用的价格存储：区分缺失商品与免费商品，返回调用方无法修改的快照，并只按排序顺序列出已存键。' }
    code: |
      package catalog

      import "sort"

      type Store struct{ prices map[string]int }

      func NewStore() *Store { return &Store{} }

      func (s *Store) Set(item string, price int) {
          s.prices[item] = price
      }

      func (s *Store) Price(item string) int { return s.prices[item] }

      func (s *Store) Snapshot() map[string]int { return s.prices }

      func (s *Store) Items() []string {
          items := make([]string, len(s.prices))
          for item := range s.prices {
              items = append(items, item)
          }
          sort.Strings(items)
          return items
      }
    lang: go
    right: { en: 'The code gives keys and prices concrete types, keeps map operations behind a small API, and sorts the item list instead of exposing map iteration order.', zh: '代码为键和价格使用了具体类型，把 map 操作放在小型 API 后面，并对商品列表排序，没有暴露 map 的遍历顺序。' }
    checklist:
      - { en: 'Exercise methods on both a constructed Store and its zero value.', zh: '分别对构造得到的 Store 和它的零值调用方法。' }
      - { en: 'Test an absent key beside a present key whose value is zero.', zh: '同时测试缺失键与值为零的已存在键。' }
      - { en: 'Mutation-test every returned map that is described as a snapshot.', zh: '对每个声称是快照的返回 map 执行变异测试。' }
      - { en: 'Compare allocation length with whether the loop writes by index or append.', zh: '把分配长度与循环按索引写入或 append 的方式对照检查。' }
    issues:
      - line: 7
        kind: edge-case
        note: { en: 'The constructor leaves prices nil, and the zero value does too, so Set panics on its assignment. Initialize lazily in Set or construct the map explicitly.', zh: '构造函数与零值都会让 prices 保持 nil，因此 Set 赋值时会 panic。应在 Set 中延迟初始化，或在构造时显式创建 map。' }
      - line: 13
        kind: correctness
        note: { en: 'Price returns only an int, so callers cannot distinguish a missing item from a stored zero price. Return (int, bool) or another explicit result.', zh: 'Price 只返回 int，调用方无法区分缺失商品与保存的零价格。应返回 (int, bool) 或其他显式结果。' }
      - line: 15
        kind: security
        note: { en: 'Snapshot returns the internal map itself. A caller can overwrite or delete store entries across the API boundary; return maps.Clone(s.prices).', zh: 'Snapshot 直接返回内部 map。调用方可以跨过 API 边界覆盖或删除存储条目；应返回 maps.Clone(s.prices)。' }
      - line: 18
        kind: performance
        note: { en: 'make creates len(s.prices) empty-string elements before append adds every key, doubling the logical length and forcing unnecessary growth. Allocate length zero with capacity len(s.prices).', zh: 'make 先创建 len(s.prices) 个空字符串元素，append 又加入全部键，逻辑长度翻倍并产生不必要的增长。应把长度设为零、容量设为 len(s.prices)。' }
    explanation: { en: 'Initialize the map before writing, return presence from Price, clone the map at the snapshot boundary, and build Items with make([]string, 0, len(s.prices)). Tests should mutate the returned snapshot and call every method on Store{}.', zh: '应在写入前初始化 map，让 Price 返回存在性，在快照边界克隆 map，并用 make([]string, 0, len(s.prices)) 构造 Items。测试还应修改返回的快照，并对 Store{} 调用每个方法。' }
    difficulty: advanced
    tags: [code-review, nil-map, ownership, comma-ok]
