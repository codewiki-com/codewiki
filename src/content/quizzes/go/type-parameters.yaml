topic: go/type-parameters
items:
  - id: predict-named-slice-clone
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      package main

      import "fmt"

      type Labels []string

      func Clone[S ~[]E, E any](values S) S {
          return append(S(nil), values...)
      }

      func main() {
          copy := Clone(Labels{"draft", "review"})
          fmt.Printf("%T %v\n", copy, copy)
      }
    lang: go
    options:
      - { text: { en: 'main.Labels [draft review]', zh: 'main.Labels [draft review]' }, correct: true }
      - { text: { en: '[]string [draft review]', zh: '[]string [draft review]' }, correct: false }
      - { text: { en: 'It fails because E cannot be inferred from S.', zh: '编译失败，因为无法从 S 推断 E。' }, correct: false }
      - { text: { en: 'It fails because Labels is not exactly []string.', zh: '编译失败，因为 Labels 并不精确等于 []string。' }, correct: false }
    explanation: { en: 'The constraint relationship `S ~[]E` lets the compiler infer `E = string`, while returning `S` preserves the named slice type `Labels`.', zh: '约束关系 `S ~[]E` 让编译器推断出 `E = string`，返回 `S` 则保留命名切片类型 `Labels`。' }
    difficulty: intermediate
    tags: [type-inference, named-type, underlying-type]

  - id: constraint-intersection
    type: mcq
    prompt: { en: 'What must a type satisfy for the constraint `interface { ~string; IsValid() bool }`?', zh: '类型要满足约束 `interface { ~string; IsValid() bool }`，必须具备什么条件？' }
    options:
      - { text: { en: 'It must have underlying type string and an IsValid() bool method.', zh: '底层类型必须是 string，并且具有 IsValid() bool 方法。' }, correct: true }
      - { text: { en: 'Either a string underlying type or the method is sufficient.', zh: '底层类型是 string 或具有该方法，满足任一条件即可。' }, correct: false }
      - { text: { en: 'Only the predeclared string type can satisfy it.', zh: '只有预声明类型 string 可以满足它。' }, correct: false }
      - { text: { en: 'The value is converted to string before the method check.', zh: '检查方法前，值会先转换成 string。' }, correct: false }
    explanation: { en: 'Separate interface elements intersect. The tilde admits named string-underlying types, but those types must also declare the required method.', zh: '接口中的独立元素取交集。波浪号接纳以 string 为底层类型的命名类型，但这些类型还必须声明所需方法。' }
    difficulty: intermediate
    tags: [type-set, intersection, method-constraint]

  - id: spot-any-addition
    type: spotbug
    prompt: { en: 'Find the constraint error in this generated function.', zh: '找出这个生成函数中的约束错误。' }
    code: |
      func Combine[T any](left, right T) T {
          return left + right
      }
    lang: go
    issues:
      - line: 2
        kind: correctness
        note: { en: '`any` does not guarantee that `+` is defined for every T, so the function body does not compile.', zh: '`any` 不保证每一种 T 都支持 `+`，因此函数体无法编译。' }
    explanation: { en: 'Derive a type set that supports the intended addition semantics, or accept a combining function from the caller. A broad numeric-and-string union may still be wrong if those operations have different domain meanings.', zh: '应推导支持目标加法语义的类型集，或者让调用方传入组合函数。如果数值与字符串在领域中的操作含义不同，宽泛的 union 仍可能不合适。' }
    difficulty: beginner
    tags: [constraint, operator, compile-error]

  - id: spot-interface-comparable-panic
    type: spotbug
    prompt: { en: 'Why can this compiled generic call panic?', zh: '为什么这个已经通过编译的泛型调用仍可能 panic？' }
    code: |
      func Equal[T comparable](left, right T) bool {
          return left == right
      }

      func sameNumbers() bool {
          var left any = []int{1, 2}
          var right any = []int{1, 2}
          return Equal(left, right)
      }
    lang: go
    issues:
      - line: 2
        kind: edge-case
        note: { en: '`any` satisfies the comparable constraint, but comparing interface values whose shared dynamic type is []int panics because slices are not comparable.', zh: '`any` 满足 comparable 约束，但两个接口值的动态类型同为 []int 时，比较会 panic，因为切片不可比较。' }
    explanation: { en: 'Constraint satisfaction permits the interface type argument; runtime equality still checks the dynamic values. Use an explicit comparable representation or validate dynamic input before comparison.', zh: '约束满足规则允许使用该接口类型实参，但运行时相等比较仍会检查动态值。应使用明确可比较的表示，或在比较前验证动态输入。' }
    difficulty: advanced
    tags: [comparable, interface, panic]

  - id: review-first-record-index
    type: review
    title: { en: 'Review a generic record index', zh: '审查泛型记录索引' }
    prompt: { en: 'Review this generated index against the stated contract.', zh: '根据给定契约审查这个生成索引。' }
    task: { en: 'Index records by a named string-based ID, reject IDs that are blank after trimming, preserve the first duplicate, avoid output side effects, and leave the input unchanged.', zh: '按基于字符串的命名 ID 为记录建立索引，拒绝修剪后为空的 ID，保留重复 ID 的第一条记录，不产生输出副作用，并且不修改输入。' }
    code: |
      package catalog

      import "fmt"

      type StringID interface {
          ~string
      }

      type Record[ID StringID] struct { ID ID; Name string }

      // IndexByID keeps the first record for each non-blank ID.
      func IndexByID[ID StringID](records []Record[ID]) map[ID]Record[ID] {
          index := make(map[ID]Record[ID])
          for i, record := range records {
              if fmt.Sprint(record.ID) == " " {
                  continue
              }
              index[record.ID] = record
              fmt.Printf("indexed %s at %d\n", record.ID, i)
          }
          return index
      }
    lang: go
    right: { en: 'The code preserves the named ID type in the map key, creates typed storage once, iterates records by value, and does not mutate the input slice.', zh: '代码在 map 键中保留命名 ID 类型，只创建一次带类型的存储，按值遍历记录，而且没有修改输入切片。' }
    issues:
      - line: 11
        kind: readability
        note: { en: 'The comment claims the contract but does not explain that validity means trimming whitespace, which is where this implementation is ambiguous.', zh: '注释只声称满足契约，没有说明有效 ID 需要修剪空白，导致实现意图含糊。' }
      - line: 15
        kind: edge-case
        note: { en: 'Comparing with one literal space misses the empty string, tabs, and longer whitespace-only IDs; convert to string and trim before testing emptiness.', zh: '只与一个空格比较会漏掉空字符串、制表符和更长的纯空白 ID；应转换成 string，修剪后再检查是否为空。' }
      - line: 18
        kind: correctness
        note: { en: 'Unconditional assignment overwrites the first duplicate, violating the first-record contract.', zh: '无条件赋值会覆盖第一条重复记录，违反保留首条记录的契约。' }
      - line: 19
        kind: security
        note: { en: 'Printing every identifier is an unrequested side effect and may disclose domain identifiers to logs.', zh: '打印每个标识符是契约未要求的副作用，还可能把领域标识符泄露到日志。' }
    checklist:
      - { en: 'Test empty, spaces-only, tab-only, valid, and duplicate named IDs.', zh: '测试空字符串、纯空格、纯制表符、有效值和重复的命名 ID。' }
      - { en: 'Assert that the first duplicate remains in the result.', zh: '断言结果保留重复 ID 的第一条记录。' }
      - { en: 'Capture stdout and verify indexing emits no output.', zh: '捕获标准输出，确认建立索引时没有输出。' }
      - { en: 'Compare the input before and after the call to confirm it is unchanged.', zh: '比较调用前后的输入，确认它保持不变。' }
    explanation: { en: 'Use a `~string` constraint, normalize with `strings.TrimSpace(string(record.ID))`, skip an ID already present, and remove printing. Tests should assert the boundary behavior rather than only map length.', zh: '应使用 `~string` 约束，通过 `strings.TrimSpace(string(record.ID))` 规范化，跳过已经存在的 ID，并删除打印。测试应断言边界行为，而不只检查 map 长度。' }
    difficulty: advanced
    tags: [code-review, named-type, edge-case, ownership]
