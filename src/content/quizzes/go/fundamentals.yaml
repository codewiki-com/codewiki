topic: go/fundamentals
items:
  - id: predict-zero-value-and-constant
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      package main

      import "fmt"

      const step = 2

      func main() {
          var total int
          count := 3
          total += count * step
          fmt.Println(total)
      }
    lang: go
    options:
      - { text: { en: '0', zh: '0' }, correct: false }
      - { text: { en: '2', zh: '2' }, correct: false }
      - { text: { en: '6', zh: '6' }, correct: true }
      - { text: { en: 'It fails because total has no initializer.', zh: '编译失败，因为 total 没有初始化表达式。' }, correct: false }
    explanation: { en: 'total starts at the zero value of int, then receives 3 * 2. The untyped constant step is representable in the int expression.', zh: 'total 从 int 的零值开始，随后加上 3 * 2。无类型常量 step 可以在这个 int 表达式中表示。' }
    difficulty: beginner
    tags: [zero-value, constants, predict-output]

  - id: short-declaration-rule
    type: mcq
    prompt: { en: 'When can names already declared in the current block appear on the left of :=?', zh: '当前代码块中已经声明的名称何时可以出现在 := 左侧？' }
    options:
      - { text: { en: 'When at least one other non-blank name on the left is new in that block', zh: '左侧至少还有一个非空白名称在该代码块中是新名称时' }, correct: true }
      - { text: { en: 'Only when every name on the left already exists', zh: '仅当左侧所有名称都已经存在时' }, correct: false }
      - { text: { en: 'Whenever the statement is inside an if block', zh: '只要语句位于 if 代码块中' }, correct: false }
      - { text: { en: 'Never; := requires every left-side name to be new', zh: '绝不可以；:= 要求左侧每个名称都是新的' }, correct: false }
    explanation: { en: 'A short declaration may redeclare same-block variables only when it also declares at least one new non-blank variable. In an inner block, a same-spelled name is a new variable there.', zh: '短变量声明只有在同时声明至少一个新的非空白变量时，才能重新使用当前块中的变量。进入内层块后，同名名称会成为该块中的新变量。' }
    difficulty: beginner
    tags: [short-declaration, scope, shadowing]

  - id: spotbug-shadowed-port
    title: { en: 'Spot the bug in port selection', zh: '找出端口选择里的 bug' }
    type: spotbug
    prompt: { en: 'Find why a valid custom port is parsed but the function still returns 8080.', zh: '找出为什么代码解析了有效的自定义端口，函数却仍然返回 8080。' }
    code: |
      func selectPort(raw string) (int, error) {
          port := 8080
          if raw != "" {
              port, err := strconv.Atoi(raw)
              if err != nil {
                  return 0, err
              }
              if port < 1 || port > 65535 {
                  return 0, fmt.Errorf("port out of range")
              }
          }
          return port, nil
      }
    lang: go
    issues:
      - line: 4
        kind: correctness
        note: { en: 'The inner := declares both port and err in the if block, so it shadows the outer port. Parse into a differently named value and assign it to the outer port after validation, or declare err first and use =.', zh: '内层的 := 在 if 块中同时声明 port 和 err，因此遮蔽了外层 port。应先解析到另一个名称并在校验后赋给外层 port，或者先声明 err 再使用 =。' }
    explanation: { en: 'The parsed port exists only inside the if block. The return reads the unchanged outer variable, which still contains its default of 8080.', zh: '解析得到的 port 只存在于 if 块中。return 读取未被修改的外层变量，所以结果仍是默认值 8080。' }
    difficulty: intermediate
    tags: [shadowing, short-declaration, code-review]

  - id: string-range-values
    type: mcq
    prompt: { en: 'When ranging over a UTF-8 string with for index, value := range text, what are index and value?', zh: '使用 for index, value := range text 遍历 UTF-8 字符串时，index 与 value 分别是什么？' }
    options:
      - { text: { en: 'The starting byte index and the decoded rune', zh: '码点起始处的字节索引，以及解码后的 rune' }, correct: true }
      - { text: { en: 'The consecutive rune number and a one-byte character', zh: '连续的 rune 序号，以及一个单字节字符' }, correct: false }
      - { text: { en: 'The grapheme-cluster number and a string', zh: '字形簇序号，以及一个字符串' }, correct: false }
      - { text: { en: 'Two byte offsets: start and end', zh: '两个字节偏移量：起点与终点' }, correct: false }
    explanation: { en: 'range decodes code points and reports the byte offset where each decoded rune starts. The offsets can skip numbers when a rune occupies several UTF-8 bytes.', zh: 'range 会解码码点，并报告每个 rune 起始处的字节偏移量。一个 rune 占用多个 UTF-8 字节时，偏移量会跳号。' }
    difficulty: intermediate
    tags: [strings, utf-8, rune]

  - id: review-generated-limit-summary
    type: review
    title: { en: 'Review a generated limit-summary parser', zh: '审查生成的限制摘要解析器' }
    prompt: { en: 'Review this generated code before it is used in a configuration report.', zh: '请在将这段生成的代码用于配置报告前进行审查。' }
    task: { en: 'Parse each whitespace-tolerant name=count entry, reject malformed input, empty names, and non-positive counts, preserve every entry in input order, and return a readable summary or an error.', zh: '逐条解析允许空白的 name=count 条目，拒绝格式错误、空名称和非正数，按输入顺序保留每个条目，并返回可读摘要或错误。' }
    code: |
      package limits

      import (
          "fmt"
          "strconv"
          "strings"
      )

      func summarizeLimits(entries []string) (summary string, err error) {
          limits := map[string]int{}
          for _, entry := range entries {
              parts := strings.Split(entry, "=")
              value, _ := strconv.Atoi(strings.TrimSpace(parts[1]))
              name := strings.TrimSpace(parts[0])
              limits[name] = value
          }
          for name, value := range limits {
              summary += fmt.Sprintf("%s=%d\n", name, value)
          }
          return
      }
    lang: go
    issues:
      - line: 13
        kind: edge-case
        note: { en: 'The code indexes parts[1] without checking the delimiter count, discards the Atoi error, and never validates the trimmed name or positive range. Missing delimiters panic, while other invalid entries can be accepted.', zh: '代码未检查分隔符数量便读取 parts[1]，丢弃 Atoi 错误，也没有校验清理后的名称和正数范围。缺少分隔符会触发 panic，其他无效条目则可能被接受。' }
      - line: 15
        kind: correctness
        note: { en: 'Storing entries in a map overwrites repeated names, and ranging over that map does not preserve input order. Keep validated entries in a slice.', zh: '把条目存入 map 会覆盖重复名称，而且遍历该 map 不会保留输入顺序。应把校验后的条目保存在切片中。' }
      - line: 18
        kind: performance
        note: { en: 'Repeated += concatenation copies the growing summary on each iteration. Build larger reports with strings.Builder.', zh: '反复使用 += 拼接会在每次迭代时复制不断增长的摘要。较大的报告应使用 strings.Builder 构建。' }
    right: { en: 'The function has a clear typed signature, trims both fields, and uses strconv.Atoi for decimal parsing instead of converting an integer to a rune.', zh: '该函数具有清晰的类型化签名，会清理两个字段，并使用 strconv.Atoi 解析十进制数，而不是把整数转换为 rune。' }
    checklist:
      - { en: 'Test missing and repeated delimiters, empty names, invalid numbers, zero, and negative counts.', zh: '测试缺少或重复的分隔符、空名称、无效数字、零和负数。' }
      - { en: 'Verify that every parse failure reaches the caller as an error.', zh: '确认每个解析失败都会作为错误返回给调用方。' }
      - { en: 'Check output order and repeated names against the task.', zh: '根据任务要求检查输出顺序和重复名称。' }
      - { en: 'Avoid repeated immutable-string concatenation in input-sized loops.', zh: '避免在随输入规模增长的循环中反复拼接不可变字符串。' }
    explanation: { en: 'Validate a single delimiter with strings.Cut, reject invalid fields, and propagate conversion errors. Preserve validated entries in a slice and format them with strings.Builder so correctness and cost follow the stated task.', zh: '应使用 strings.Cut 校验唯一分隔符，拒绝无效字段，并传递转换错误。把校验后的条目保存在切片中，再用 strings.Builder 格式化，使正确性与开销都符合任务要求。' }
    difficulty: intermediate
    minutes: 8
    tags: [code-review, parsing, conversion, edge-cases]
