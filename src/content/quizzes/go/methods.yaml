topic: go/methods
items:
  - id: predict-value-receiver-copy
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      package main

      import "fmt"

      type Score struct{ Value int }

      func (score Score) Add(delta int) {
          score.Value += delta
      }

      func main() {
          score := Score{Value: 7}
          score.Add(3)
          fmt.Println(score.Value)
      }
    lang: go
    options:
      - { text: { en: '7', zh: '7' }, correct: true }
      - { text: { en: '10', zh: '10' }, correct: false }
      - { text: { en: '0', zh: '0' }, correct: false }
      - { text: { en: 'It fails because Add must return Score.', zh: '编译失败，因为 Add 必须返回 Score。' }, correct: false }
    explanation: { en: 'The value receiver is a copy, so Add changes only its local Score. Use *Score when the method must update the caller.', zh: '值接收者是副本，因此 Add 只修改局部的 Score。方法需要更新调用方时，应使用 *Score。' }
    difficulty: beginner
    tags: [value-receiver, copy, mutation]

  - id: predict-method-value-capture
    type: predict
    prompt: { en: 'What does the saved method value print?', zh: '保存的方法值会输出什么？' }
    code: |
      package main

      import "fmt"

      type Price struct{ Cents int }

      func (price Price) WithTax(tax int) int {
          return price.Cents + tax
      }

      func main() {
          price := Price{Cents: 100}
          calculate := price.WithTax
          price.Cents = 200
          fmt.Println(calculate(20))
      }
    lang: go
    options:
      - { text: { en: '120', zh: '120' }, correct: true }
      - { text: { en: '220', zh: '220' }, correct: false }
      - { text: { en: '200', zh: '200' }, correct: false }
      - { text: { en: 'It panics because price changed.', zh: '程序会 panic，因为 price 发生了变化。' }, correct: false }
    explanation: { en: 'Evaluating price.WithTax saves a copy of the value receiver while Cents is 100. The later assignment changes price, not the saved copy.', zh: '对 price.WithTax 求值时，会在 Cents 为 100 时保存值接收者的副本。后续赋值修改的是 price，不是保存的副本。' }
    difficulty: intermediate
    tags: [method-value, receiver-evaluation, copy]

  - id: method-set-interface-assertion
    type: mcq
    prompt: { en: 'Given func (job *Job) Cancel(), which compile-time assertion can succeed for interface{ Cancel() }?', zh: '已知 func (job *Job) Cancel()，哪个针对 interface{ Cancel() } 的编译期断言可以成立？' }
    options:
      - { text: { en: 'var _ interface{ Cancel() } = (*Job)(nil)', zh: 'var _ interface{ Cancel() } = (*Job)(nil)' }, correct: true }
      - { text: { en: 'var _ interface{ Cancel() } = Job{}', zh: 'var _ interface{ Cancel() } = Job{}' }, correct: false }
      - { text: { en: 'var _ *Job = interface{ Cancel() }(nil)', zh: 'var _ *Job = interface{ Cancel() }(nil)' }, correct: false }
      - { text: { en: 'Both Job{} and (*Job)(nil)', zh: 'Job{} 与 (*Job)(nil) 都可以' }, correct: false }
    explanation: { en: 'A pointer-receiver method belongs to the method set of *Job, not Job. Implicit address-taking for an addressable call does not change interface satisfaction.', zh: '指针接收者方法属于 *Job 的方法集，不属于 Job。可寻址调用中的隐式取地址不会改变接口满足关系。' }
    difficulty: intermediate
    tags: [method-set, pointer-receiver, interface]

  - id: spotbug-map-element-method
    type: spotbug
    prompt: { en: 'Find why MarkDone cannot be called on this map element.', zh: '找出为什么不能对这个 map 元素调用 MarkDone。' }
    code: |
      type Job struct {
          Done bool
      }

      func (job *Job) MarkDone() {
          job.Done = true
      }

      func finish(jobs map[string]Job, id string) {
          jobs[id].MarkDone()
      }
    lang: go
    issues:
      - line: 10
        kind: correctness
        note: { en: 'A map index expression is not addressable, so the compiler cannot rewrite the pointer-receiver call as (&jobs[id]).MarkDone().', zh: 'map 索引表达式不可寻址，因此编译器不能把指针接收者调用改写为 (&jobs[id]).MarkDone()。' }
    explanation: { en: 'Retrieve the Job into a variable, mutate it, and assign it back, or store *Job elements when shared identity matches the ownership design.', zh: '应先把 Job 取到变量中，修改后再写回；如果共享标识符合所有权设计，也可以让 map 保存 *Job。' }
    difficulty: intermediate
    tags: [addressability, map-element, pointer-receiver]

  - id: review-generated-quota-tracker
    type: review
    prompt: { en: 'Review this generated quota tracker against the stated task.', zh: '根据任务要求审查这个生成的配额跟踪器。' }
    task: { en: 'Provide concurrency-safe increments, make the zero value usable, return an independently owned snapshot, and never log the API token.', zh: '提供并发安全的递增操作，让零值可用，返回独立所有权的快照，并且绝不记录 API token。' }
    code: |
      package quota

      import (
          "fmt"
          "sync"
      )

      type Tracker struct {
          mu       sync.Mutex
          limits   map[string]int
          apiToken string
      }

      func (tracker Tracker) Add(name string, amount int) {
          tracker.mu.Lock()
          defer tracker.mu.Unlock()
          fmt.Printf("token=%s name=%s\n", tracker.apiToken, name)
          tracker.limits[name] += amount
      }

      func (tracker *Tracker) Snapshot() map[string]int {
          return tracker.limits
      }
    lang: go
    right: { en: 'The code keeps the mutex next to the state it is meant to guard, releases the lock with defer, and exposes operations instead of exporting the map field.', zh: '代码把互斥锁放在它应保护的状态旁边，使用 defer 释放锁，并通过操作公开能力，而不是导出 map 字段。' }
    checklist:
      - { en: 'Run increments concurrently under the race detector.', zh: '在竞态检测器下并发执行递增操作。' }
      - { en: 'Exercise every method on a zero-value Tracker.', zh: '在 Tracker 零值上执行每个方法。' }
      - { en: 'Mutate the returned snapshot and inspect internal state.', zh: '修改返回的快照，并检查内部状态。' }
      - { en: 'Inspect logs and format strings for credentials.', zh: '检查日志与格式字符串中是否包含凭据。' }
    issues:
      - line: 14
        kind: correctness
        note: { en: 'The value receiver copies the mutex, so concurrent calls lock different copies and do not synchronize access to the shared map.', zh: '值接收者会复制互斥锁，因此并发调用锁住不同副本，无法同步访问共享 map。' }
      - line: 17
        kind: security
        note: { en: 'The log line exposes the API token directly.', zh: '这条日志直接暴露了 API token。' }
      - line: 18
        kind: edge-case
        note: { en: 'The zero value has a nil map, so the first assignment panics instead of initializing storage.', zh: '零值包含 nil map，因此第一次赋值会 panic，而不是初始化存储。' }
      - line: 22
        kind: readability
        note: { en: 'Snapshot promises an independent point-in-time result but returns the live internal map without locking or copying.', zh: 'Snapshot 这个名称承诺独立的时点结果，实际却既未加锁也未复制，直接返回内部 map。' }
    explanation: { en: 'Use pointer receivers consistently, initialize the map on the locked write path, remove credential logging, and clone the map while holding the same mutex in Snapshot.', zh: '应统一使用指针接收者，在加锁的写路径中初始化 map，删除凭据日志，并让 Snapshot 持有同一把锁时克隆 map。' }
    difficulty: advanced
    tags: [code-review, receiver-copy, mutex, zero-value]
