topic: go/checkpoint-1
items:
  - id: checkpoint-1-entry-point
    type: mcq
    prompt: { en: 'Which declarations make a Go package directly executable?', zh: '哪组声明能让 Go 包直接执行？' }
    options:
      - { text: { en: '`package main` with `func main()` taking no parameters and returning no values', zh: '`package main`，并包含无参数、无返回值的 `func main()`' }, correct: true }
      - { text: { en: 'Any package with an exported `Main` function', zh: '任意包含导出函数 `Main` 的包' }, correct: false }
      - { text: { en: '`package executable` with `func main() error`', zh: '`package executable`，并包含 `func main() error`' }, correct: false }
    explanation: { en: 'An executable Go program uses package `main` and the special parameterless, resultless `main` function.', zh: '可执行 Go 程序必须使用 `main` 包，并定义无参数、无返回值的特殊 `main` 函数。' }
    difficulty: beginner
    tags: [checkpoint]
  - id: checkpoint-1-module-file
    type: fill
    prompt: { en: 'Name the file at a module root that declares the module path and dependency requirements.', zh: '写出模块根目录中声明模块路径和依赖要求的文件名。' }
    answer: go.mod
    explanation: { en: '`go mod init` creates `go.mod`; a module can contain multiple packages.', zh: '`go mod init` 会创建 `go.mod`；一个模块可以包含多个包。' }
    difficulty: beginner
    tags: [checkpoint]
  - id: checkpoint-1-export-rule
    type: mcq
    prompt: { en: 'How does Go make an identifier accessible from another package?', zh: 'Go 如何让标识符可被其他包访问？' }
    options:
      - { text: { en: 'Its first character is a Unicode uppercase letter.', zh: '标识符的首字符是 Unicode 大写字母。' }, correct: true }
      - { text: { en: 'It is declared with the `public` keyword.', zh: '使用 `public` 关键字声明。' }, correct: false }
      - { text: { en: 'It appears in a package-level `exports` list.', zh: '把它加入包级 `exports` 列表。' }, correct: false }
    explanation: { en: 'Export is determined by the identifier spelling; Go has no `public` keyword or export list.', zh: '是否导出由标识符的拼写决定；Go 没有 `public` 关键字或导出列表。' }
    difficulty: beginner
    tags: [checkpoint]
  - id: checkpoint-1-zero-value
    type: fill
    prompt: { en: 'Name the value automatically assigned to a declared variable that has no explicit initializer.', zh: '写出变量声明时没有显式初始化器所获得的值的术语。' }
    answer: zero value
    explanation: { en: 'Every Go type has a zero value, including structs whose fields each receive their own zero value.', zh: '每种 Go 类型都有零值；结构体的每个字段也会分别获得其类型的零值。' }
    difficulty: intermediate
    tags: [checkpoint]
  - id: checkpoint-1-struct-copy
    type: mcq
    prompt: { en: 'A struct containing a slice is assigned to another variable. Which statement is correct?', zh: '一个包含切片字段的结构体被赋值给另一个变量。哪项陈述正确？' }
    options:
      - { text: { en: 'The outer struct is copied, but both slice fields can still refer to the same backing array.', zh: '外层结构体会被复制，但两个切片字段仍可能指向同一个底层数组。' }, correct: true }
      - { text: { en: 'The assignment recursively clones every element and nested value.', zh: '赋值会递归克隆每个元素和嵌套值。' }, correct: false }
      - { text: { en: 'Struct assignment is forbidden whenever a field is a slice.', zh: '只要字段中有切片，就禁止结构体赋值。' }, correct: false }
    explanation: { en: 'Struct assignment copies fields. Copying a slice copies its descriptor, not the backing array it describes.', zh: '结构体赋值会复制字段。复制切片只会复制切片描述符，不会复制其指向的底层数组。' }
    difficulty: intermediate
    tags: [checkpoint]
  - id: checkpoint-1-method-set
    type: fill
    prompt: { en: 'Name the set that determines whether `T` or `*T` satisfies an interface.', zh: '写出决定 `T` 或 `*T` 是否满足某个接口的集合名称。' }
    answer: method set
    explanation: { en: 'The method set of `T` contains value-receiver methods, while the method set of `*T` contains both value- and pointer-receiver methods.', zh: '`T` 的方法集包含值接收者方法，`*T` 的方法集同时包含值接收者和指针接收者方法。' }
    difficulty: intermediate
    tags: [checkpoint]
  - id: checkpoint-1-typed-nil
    type: mcq
    prompt: { en: 'A nil `*ParseError` is stored in a variable of type `error`. What is true?', zh: '把值为 nil 的 `*ParseError` 存入 `error` 类型变量后，哪项说法正确？' }
    options:
      - { text: { en: 'The interface is not equal to `nil` because it has dynamic type `*ParseError`.', zh: '该接口不等于 `nil`，因为它带有动态类型 `*ParseError`。' }, correct: true }
      - { text: { en: 'The interface is equal to `nil` because its dynamic pointer value is nil.', zh: '该接口等于 `nil`，因为动态指针值为 nil。' }, correct: false }
      - { text: { en: 'Assigning a nil pointer to an interface is a compile-time error.', zh: '把 nil 指针赋给接口会产生编译错误。' }, correct: false }
    explanation: { en: 'An interface equals nil only when both its dynamic type and dynamic value are absent.', zh: '只有动态类型和动态值都不存在时，接口才等于 nil。' }
    difficulty: advanced
    tags: [checkpoint]
  - id: checkpoint-1-interface-assertion
    type: fill
    prompt: { en: 'Complete the compile-time assertion for a pointer type: `var _ Notifier = ______`.', zh: '补全针对指针类型的编译期接口断言：`var _ Notifier = ______`。' }
    answer: (*EmailSender)(nil)
    explanation: { en: 'The conversion produces a nil `*EmailSender`, and the assignment makes the compiler verify that its method set satisfies `Notifier`.', zh: '该转换会得到 nil 的 `*EmailSender`，赋值则要求编译器验证其方法集满足 `Notifier`。' }
    difficulty: advanced
    tags: [checkpoint]
