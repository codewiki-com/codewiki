topic: go/structs
items:
  - id: predict-struct-zero-values
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      package main

      import "fmt"

      type Job struct {
          Attempts int
          Done     bool
      }

      func main() {
          var job Job
          job.Attempts++
          fmt.Println(job.Attempts, job.Done)
      }
    lang: go
    options:
      - { text: { en: '1 false', zh: '1 false' }, correct: true }
      - { text: { en: '0 false', zh: '0 false' }, correct: false }
      - { text: { en: '1 true', zh: '1 true' }, correct: false }
      - { text: { en: 'It panics because job was not constructed.', zh: '程序会 panic，因为 job 没有经过构造。' }, correct: false }
    explanation: { en: 'The zero value of Job contains 0 and false. Incrementing the assignable Attempts field changes it to 1; no constructor is required.', zh: 'Job 的零值包含 0 和 false。对可赋值的 Attempts 字段递增后，它变成 1；这里不需要构造函数。' }
    difficulty: beginner
    tags: [zero-value, fields, predict-output]

  - id: predict-struct-shallow-copy
    type: predict
    prompt: { en: 'What does this program print after copying the struct?', zh: '复制结构体后，这段程序会输出什么？' }
    code: |
      package main

      import "fmt"

      type Record struct {
          Name   string
          Labels []string
      }

      func main() {
          original := Record{"draft", []string{"new"}}
          copied := original
          copied.Name = "copy"
          copied.Labels[0] = "reviewed"
          fmt.Println(original.Name, original.Labels[0])
      }
    lang: go
    options:
      - { text: { en: 'draft new', zh: 'draft new' }, correct: false }
      - { text: { en: 'copy reviewed', zh: 'copy reviewed' }, correct: false }
      - { text: { en: 'draft reviewed', zh: 'draft reviewed' }, correct: true }
      - { text: { en: 'It does not compile because structs cannot contain slices.', zh: '无法编译，因为结构体不能包含切片。' }, correct: false }
    explanation: { en: 'The string field is copied as a value, but copying Labels copies only its slice descriptor. Both structs still reach the same element in the backing array.', zh: '字符串字段按值复制，但复制 Labels 只会复制切片描述信息。两个结构体仍能访问底层数组中的同一个元素。' }
    difficulty: beginner
    tags: [shallow-copy, slices, aliasing]

  - id: comparable-struct-map-key
    type: mcq
    prompt: { en: 'Which struct type can be used safely as a map key without a runtime comparability panic?', zh: '哪种结构体可以安全用作 map 键，并且不会发生运行时可比较性 panic？' }
    options:
      - { text: { en: 'struct { Tenant string; ID int }', zh: 'struct { Tenant string; ID int }' }, correct: true }
      - { text: { en: 'struct { IDs []int }', zh: 'struct { IDs []int }' }, correct: false }
      - { text: { en: 'struct { Labels map[string]string }', zh: 'struct { Labels map[string]string }' }, correct: false }
      - { text: { en: 'struct { Value any }, for every possible dynamic value', zh: 'struct { Value any }，并允许任意动态值' }, correct: false }
    explanation: { en: 'Strings and integers are comparable, so the first struct is a stable key. Slices and maps are not comparable, and an interface field can panic during comparison when it holds a non-comparable dynamic value.', zh: '字符串与整数可比较，所以第一种结构体是稳定的键。切片和 map 不可比较；接口字段持有不可比较的动态值时，比较仍可能 panic。' }
    difficulty: intermediate
    tags: [comparability, map-key, interface]

  - id: spotbug-value-receiver-update
    type: spotbug
    prompt: { en: 'Find why Activate returns normally but leaves the caller unchanged.', zh: '找出 Activate 正常返回却没有修改调用方的原因。' }
    code: |
      type Account struct {
          Active bool
      }

      func (account Account) Activate() {
          account.Active = true
      }

      func enable(account *Account) {
          account.Activate()
      }
    lang: go
    issues:
      - line: 5
        kind: correctness
        note: { en: 'The value receiver is a copy. Activate changes only that copy, even though Go lets the pointer call the value-receiver method.', zh: '值接收器是一个副本。即使 Go 允许指针调用值接收器方法，Activate 修改的仍然只是副本。' }
    explanation: { en: 'Declare Activate on *Account when the method is meant to update the receiver. The selector call syntax does not change the receiver type or copy semantics.', zh: '方法需要更新接收者时，应把 Activate 声明在 *Account 上。选择器调用语法不会改变接收者类型或复制语义。' }
    difficulty: beginner
    tags: [value-receiver, pointer-receiver, mutation]

  - id: review-generated-profile-struct
    type: review
    prompt: { en: 'Review this generated profile model against the stated task.', zh: '根据任务要求审查这个生成的资料模型。' }
    task: { en: 'Support concurrent profile renames and return a JSON response snapshot whose roles cannot mutate internal state and which never exposes the API key.', zh: '支持并发修改资料名称，并返回 JSON 响应快照；快照中的 roles 不能修改内部状态，而且绝不能暴露 API key。' }
    code: |
      type Profile struct {
          mu          sync.Mutex
          ID          string
          DisplayName string
          Roles       []string
          apiKey      string
      }

      type ProfileView struct {
          ID          string   `json:"id"`
          DisplayName string   `json:"display_name"`
          Roles       []string `json:"roles"`
          APIKey      string   `json:"api_key"`
      }

      func (p Profile) Rename(name string) {
          p.mu.Lock()
          defer p.mu.Unlock()
          p.DisplayName = name
      }

      func (p *Profile) Snapshot() ProfileView {
          return ProfileView{p.ID, p.DisplayName, p.Roles, p.apiKey}
      }
    lang: go
    right: { en: 'The code separates the response shape from the internal profile and gives every response field an explicit JSON name.', zh: '代码把响应形状与内部资料分开，并为每个响应字段指定了明确的 JSON 名称。' }
    checklist:
      - { en: 'Compute receiver copy behavior and run go vet for copied locks.', zh: '推导接收者的复制行为，并运行 go vet 检查锁复制。' }
      - { en: 'Check that every read and write of guarded state uses the same mutex.', zh: '检查受保护状态的每次读写是否都使用同一个互斥锁。' }
      - { en: 'Mutation-test slices and maps returned in snapshots.', zh: '对快照返回的切片和 map 执行变异测试。' }
      - { en: 'Marshal a populated response and inspect every sensitive field.', zh: '序列化填充后的响应，并检查每个敏感字段。' }
    issues:
      - line: 13
        kind: security
        note: { en: 'ProfileView exports APIKey with a JSON tag, so every snapshot serializes the secret instead of excluding it.', zh: 'ProfileView 导出带 JSON 标签的 APIKey，因此每个快照都会序列化秘密，而不是排除它。' }
      - line: 16
        kind: correctness
        note: { en: 'Rename uses a value receiver, copying both the profile and its mutex; the original name is never changed and the copied lock protects no shared state.', zh: 'Rename 使用值接收器，同时复制资料和互斥锁；原名称不会改变，复制出的锁也没有保护共享状态。' }
      - line: 23
        kind: edge-case
        note: { en: 'Snapshot reads state without locking and returns the original Roles slice header, so concurrent updates can race and response mutation can reach internal elements.', zh: 'Snapshot 读取状态时没有加锁，还返回原 Roles 切片头，因此并发更新可能发生数据竞争，修改响应也会触及内部元素。' }
      - line: 23
        kind: readability
        note: { en: 'The unkeyed ProfileView literal hides which same-typed string maps to which response field and is brittle when the response shape changes.', zh: '不带字段名的 ProfileView 字面量隐藏了同类型字符串与响应字段的对应关系，响应形状变化时也很脆弱。' }
    explanation: { en: 'Use a pointer receiver for Rename, lock Snapshot with the same mutex, clone Roles while locked, omit APIKey from ProfileView, and build the response with keyed fields. Test under the race detector and mutate the returned roles.', zh: '应让 Rename 使用指针接收器，让 Snapshot 使用同一个互斥锁加锁，在锁内克隆 Roles，从 ProfileView 删除 APIKey，并使用带字段名的字面量构造响应。还要在竞态检测器下测试，并修改返回的 roles 验证独立性。' }
    difficulty: advanced
    tags: [code-review, mutex, shallow-copy, json]
