topic: go/checkpoint-3
items:
  - id: checkpoint-3-unbuffered-channel
    type: mcq
    prompt: { en: 'What must happen before a send on an unbuffered channel can complete?', zh: '向无缓冲通道发送值之前，必须发生什么，发送操作才能完成？' }
    options:
      - { text: { en: 'A corresponding receiver must be ready to receive the value.', zh: '必须有对应的接收方准备接收该值。' }, correct: true }
      - { text: { en: 'The runtime must allocate a one-element buffer.', zh: '运行时必须分配一个单元素缓冲区。' }, correct: false }
      - { text: { en: 'The sender must close the channel immediately after sending.', zh: '发送方必须在发送后立即关闭通道。' }, correct: false }
    explanation: { en: 'An unbuffered send and receive rendezvous, which creates a synchronization point between the goroutines.', zh: '无缓冲通道的发送与接收会直接会合，从而在两个 goroutine 之间形成同步点。' }
    difficulty: beginner
    tags: [checkpoint]
  - id: checkpoint-3-closed-receive
    type: fill
    prompt: { en: 'In `value, ok := <-ch`, which result becomes false after a closed channel has been drained?', zh: '在 `value, ok := <-ch` 中，已关闭通道被取空后，哪个结果会变为 false？' }
    answer: ok
    explanation: { en: 'After buffered values are drained, receives complete immediately with the element zero value and `ok == false`.', zh: '缓冲值取空后，接收操作会立即得到元素零值，并且 `ok == false`。' }
    difficulty: beginner
    tags: [checkpoint]
  - id: checkpoint-3-nil-select-case
    type: mcq
    prompt: { en: 'How does a `select` treat a send or receive case whose channel is nil?', zh: '`select` 如何处理通道为 nil 的发送或接收分支？' }
    options:
      - { text: { en: 'That case is disabled and cannot be selected while the channel remains nil.', zh: '只要通道仍为 nil，该分支就会被禁用，无法被选中。' }, correct: true }
      - { text: { en: 'That case is always ready and wins over other cases.', zh: '该分支始终就绪，并优先于其他分支。' }, correct: false }
      - { text: { en: 'The `select` panics as soon as it evaluates the nil channel.', zh: '`select` 一旦求值到 nil 通道就会 panic。' }, correct: false }
    explanation: { en: 'A nil channel blocks forever, so its case is effectively disabled inside `select`.', zh: 'nil 通道上的操作会永久阻塞，因此对应分支在 `select` 中等同于被禁用。' }
    difficulty: intermediate
    tags: [checkpoint]
  - id: checkpoint-3-wait-group
    type: fill
    prompt: { en: 'Name the `sync` type used to wait until a known group of goroutines has called `Done`.', zh: '写出 `sync` 包中的类型名称：它用于等待一组已知 goroutine 全部调用 `Done`。' }
    answer: sync.WaitGroup
    explanation: { en: 'Call `Add` before starting the goroutines, `Done` as each finishes, and `Wait` at the join point.', zh: '应在启动 goroutine 前调用 `Add`，每个 goroutine 结束时调用 `Done`，并在汇合点调用 `Wait`。' }
    difficulty: intermediate
    tags: [checkpoint]
  - id: checkpoint-3-mutex-copy
    type: mcq
    prompt: { en: 'A service struct contains a `sync.Mutex` that has already been used. Which change is safe?', zh: '一个服务结构体包含已经使用过的 `sync.Mutex`。哪项修改是安全的？' }
    options:
      - { text: { en: 'Keep the struct behind a pointer and use pointer receivers instead of copying it.', zh: '通过指针持有该结构体，并使用指针接收者，避免复制。' }, correct: true }
      - { text: { en: 'Pass the struct by value so each caller receives an independent lock.', zh: '按值传递结构体，让每个调用方获得独立的锁。' }, correct: false }
      - { text: { en: 'Copy the mutex only while it happens to be unlocked.', zh: '只在互斥锁碰巧未锁定时复制它。' }, correct: false }
    explanation: { en: 'A mutex must not be copied after first use; copying the protected state and lock also breaks their shared synchronization boundary.', zh: '互斥锁首次使用后不得复制；同时复制受保护状态和锁还会破坏它们共同的同步边界。' }
    difficulty: intermediate
    tags: [checkpoint]
  - id: checkpoint-3-cancel-function
    type: fill
    prompt: { en: 'A function calls `context.WithTimeout`. Name the returned function it must call to release resources even when the operation finishes early.', zh: '函数调用 `context.WithTimeout` 后，即使操作提前结束，也必须调用哪个返回函数来释放资源？' }
    answer: cancel
    explanation: { en: 'Calling `cancel` releases resources associated with the derived context and stops its timer.', zh: '调用 `cancel` 会释放派生 context 关联的资源并停止其计时器。' }
    difficulty: intermediate
    tags: [checkpoint]
  - id: checkpoint-3-cancellation-loop
    type: mcq
    prompt: { en: 'Which worker-loop design responds promptly when its request is cancelled?', zh: '哪种工作循环设计能在请求取消后及时响应？' }
    options:
      - { text: { en: 'Select between the work operation and `<-ctx.Done()`, returning `ctx.Err()` on cancellation.', zh: '在工作操作与 `<-ctx.Done()` 之间使用 `select`，取消时返回 `ctx.Err()`。' }, correct: true }
      - { text: { en: 'Store the context in a global variable and poll it only after all work completes.', zh: '把 context 存入全局变量，等所有工作完成后再轮询。' }, correct: false }
      - { text: { en: 'Replace the context with `time.Sleep` so the worker eventually wakes up.', zh: '用 `time.Sleep` 替代 context，让工作协程最终自行唤醒。' }, correct: false }
    explanation: { en: 'Selecting on `ctx.Done()` connects cancellation to the blocking work boundary; `ctx.Err()` preserves the reason.', zh: '在阻塞工作边界监听 `ctx.Done()`，才能把取消信号接入控制流；`ctx.Err()` 会保留取消原因。' }
    difficulty: advanced
    tags: [checkpoint]
  - id: checkpoint-3-backpressure
    type: fill
    prompt: { en: 'Name the flow-control effect created when a bounded worker pool makes producers wait instead of spawning unlimited work.', zh: '有界工作池让生产者等待，而不是无限创建任务。写出这种流量控制效果的名称。' }
    answer: backpressure
    explanation: { en: 'Backpressure bounds outstanding work and carries capacity limits upstream instead of allowing unbounded queues or goroutines.', zh: '背压会限制未完成工作的数量，并把容量约束向上游传递，避免队列或 goroutine 无界增长。' }
    difficulty: advanced
    tags: [checkpoint]
