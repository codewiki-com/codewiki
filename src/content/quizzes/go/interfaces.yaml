topic: go/interfaces
items:
  - id: predict-typed-nil-error
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      package main

      import "fmt"

      type ParseError struct{}

      func (*ParseError) Error() string { return "parse error" }

      func validate() error {
          var parseErr *ParseError
          return parseErr
      }

      func main() {
          fmt.Println(validate() == nil)
      }
    lang: go
    options:
      - { text: { en: 'false', zh: 'false' }, correct: true }
      - { text: { en: 'true', zh: 'true' }, correct: false }
      - { text: { en: 'parse error', zh: 'parse error' }, correct: false }
      - { text: { en: 'It panics before printing.', zh: '程序在输出前发生 panic。' }, correct: false }
    explanation: { en: 'Converting the nil *ParseError to error records the dynamic type *ParseError, so the resulting interface is not nil.', zh: '把 nil 的 *ParseError 转换成 error 后，接口记录了动态类型 *ParseError，因此结果不等于 nil。' }
    difficulty: intermediate
    tags: [interface-value, typed-nil, predict-output]

  - id: predict-type-switch-order
    type: predict
    prompt: { en: 'Which branch handles the OrderID value?', zh: 'OrderID 值会进入哪个分支？' }
    code: |
      package main

      import "fmt"

      type OrderID string

      func (id OrderID) String() string { return string(id) }

      func main() {
          var value any = OrderID("A-104")
          switch value.(type) {
          case string:
              fmt.Println("string")
          case fmt.Stringer:
              fmt.Println("stringer")
          default:
              fmt.Println("other")
          }
      }
    lang: go
    options:
      - { text: { en: 'stringer', zh: 'stringer' }, correct: true }
      - { text: { en: 'string', zh: 'string' }, correct: false }
      - { text: { en: 'other', zh: 'other' }, correct: false }
      - { text: { en: 'Both string and stringer', zh: 'string 和 stringer 都会输出' }, correct: false }
    explanation: { en: 'OrderID is a distinct named type, not string, and its String method makes it satisfy fmt.Stringer. A type switch selects only the first matching case.', zh: 'OrderID 是独立的命名类型，并不是 string；它通过 String 方法满足 fmt.Stringer。类型开关只选择第一个匹配分支。' }
    difficulty: intermediate
    tags: [type-switch, named-type, stringer]

  - id: pointer-method-set
    type: mcq
    prompt: { en: 'Given func (s *Sequence) Next() int, which compile-time assertion is valid?', zh: '已知 func (s *Sequence) Next() int，哪个编译期断言有效？' }
    options:
      - { text: { en: 'var _ Counter = (*Sequence)(nil)', zh: 'var _ Counter = (*Sequence)(nil)' }, correct: true }
      - { text: { en: 'var _ Counter = Sequence{}', zh: 'var _ Counter = Sequence{}' }, correct: false }
      - { text: { en: 'var _ *Counter = Sequence{}', zh: 'var _ *Counter = Sequence{}' }, correct: false }
      - { text: { en: 'var _ Sequence = Counter(nil)', zh: 'var _ Sequence = Counter(nil)' }, correct: false }
    explanation: { en: 'A pointer-receiver method belongs to the method set of *Sequence, not Sequence. The assertion assigns a nil *Sequence value to Counter only for compile-time checking.', zh: '指针接收者方法属于 *Sequence 的方法集，不属于 Sequence。该断言把 nil 的 *Sequence 赋给 Counter，只用于编译期检查。' }
    difficulty: beginner
    tags: [method-set, pointer-receiver, compile-time-assertion]

  - id: spotbug-interface-map-key
    type: spotbug
    prompt: { en: 'Find why a valid any value can make this lookup panic.', zh: '找出为什么合法的 any 值会让这次查询发生 panic。' }
    code: |
      func AlreadySeen(seen map[any]bool, value any) bool {
          return seen[value]
      }

      func example() bool {
          seen := map[any]bool{"ready": true}
          return AlreadySeen(seen, []int{1, 2})
      }
    lang: go
    issues:
      - line: 2
        kind: correctness
        note: { en: 'A map[any] key still needs a comparable dynamic type; hashing the []int dynamic value panics.', zh: 'map[any] 的键仍要求动态类型可比较；对动态值 []int 求哈希会发生 panic。' }
    explanation: { en: 'Restrict keys to a concrete comparable representation or encode the slice into an explicit stable key before lookup. The static comparability of an interface does not make every dynamic value hashable.', zh: '应把键限制为明确可比较的表示，或先把切片编码成显式的稳定键再查询。接口在静态上可比较，并不会让每个动态值都能求哈希。' }
    difficulty: intermediate
    tags: [interface-equality, comparability, map-key]

  - id: review-generated-alert-sender
    type: review
    prompt: { en: 'Review this generated alert sender against the stated task.', zh: '根据任务要求审查这个生成的告警发送器。' }
    task: { en: 'Expose the smallest sender boundary, reject empty messages, never log credentials, and return a nil interface when sending is disabled.', zh: '公开最小的发送器边界，拒绝空消息，绝不记录凭据，并在禁用发送时返回 nil 接口。' }
    code: |
      type Sender interface {
          Send(ctx context.Context, message string) error
          Health() error
          Close() error
      }

      type HTTPClient struct {
          Token string
      }

      func (client *HTTPClient) Send(ctx context.Context, message string) error {
          if message == "" {
              return nil
          }
          log.Printf("sending token=%s message=%s", client.Token, message)
          return nil
      }

      func BuildSender(enabled bool) Sender {
          var client *HTTPClient
          if enabled {
              client = &HTTPClient{Token: os.Getenv("ALERT_TOKEN")}
          }
          return client
      }
    lang: go
    right: { en: 'The code passes context through the behavior boundary, uses a pointer receiver for a client with identity, and keeps construction behind one function.', zh: '代码通过行为边界传递 context，为具有身份的客户端使用指针接收者，并把构造过程集中在一个函数中。' }
    checklist:
      - { en: 'List only the methods the consumer calls.', zh: '只列出使用方实际调用的方法。' }
      - { en: 'Test empty, disabled, and enabled paths separately.', zh: '分别测试空消息、禁用和启用路径。' }
      - { en: 'Inspect every log field for credentials and personal data.', zh: '检查每个日志字段是否包含凭据或个人数据。' }
      - { en: 'Compare returned interfaces with nil at the public boundary.', zh: '在公开边界把返回的接口与 nil 比较。' }
    issues:
      - line: 3
        kind: readability
        note: { en: 'Health and Close make the consumer boundary wider than the Send-only task and force unrelated methods onto every implementation.', zh: 'Health 和 Close 让使用方边界超出只发送消息的任务，并迫使每个实现提供无关方法。' }
      - line: 13
        kind: edge-case
        note: { en: 'An empty alert is silently accepted even though the contract requires rejection.', zh: '空告警被静默接受，但契约要求拒绝它。' }
      - line: 15
        kind: security
        note: { en: 'The log line emits the authentication token and message contents.', zh: '这条日志会输出认证令牌和消息内容。' }
      - line: 24
        kind: correctness
        note: { en: 'When disabled, returning the nil *HTTPClient as Sender creates a typed-nil interface rather than the required nil interface.', zh: '禁用时，把 nil 的 *HTTPClient 作为 Sender 返回，会产生带类型的 nil 接口，而不是要求的 nil 接口。' }
    explanation: { en: 'Keep only Send on the consumer interface, reject empty messages with an error, log reviewed metadata without the token or body, and return a literal nil before constructing the client when disabled.', zh: '使用方接口应只保留 Send；空消息应返回错误；日志只能记录经过审查且不含令牌或正文的元数据；禁用时应在构造客户端前直接返回字面值 nil。' }
    difficulty: advanced
    tags: [code-review, interface-design, typed-nil, security]
