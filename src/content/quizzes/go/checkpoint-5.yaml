topic: go/checkpoint-5
items:
  - id: checkpoint-5-test-suffix
    type: fill
    prompt: { en: 'Which filename suffix makes a Go source file part of the test build?', zh: '哪个文件名后缀会让 Go 源文件进入测试构建？' }
    answer: _test.go
    explanation: { en: 'The `go test` command discovers test source files by the `_test.go` suffix.', zh: '`go test` 通过 `_test.go` 后缀发现测试源文件。' }
    difficulty: beginner
    tags: [checkpoint]
  - id: checkpoint-5-helper-location
    type: mcq
    prompt: { en: 'A shared assertion helper reports failures at its own line instead of the caller. What is the narrow fix?', zh: '共享断言辅助函数把失败位置报告在自身代码行，而不是调用处。最小修复是什么？' }
    options:
      - { text: { en: 'Call `t.Helper()` at the start of the helper.', zh: '在辅助函数开头调用 `t.Helper()`。' }, correct: true }
      - { text: { en: 'Replace every `t.Errorf` with `panic`.', zh: '把所有 `t.Errorf` 替换为 `panic`。' }, correct: false }
      - { text: { en: 'Move the helper into a non-test package.', zh: '把辅助函数移到非测试包中。' }, correct: false }
    explanation: { en: '`t.Helper()` marks the function as a test helper so diagnostics point to its caller.', zh: '`t.Helper()` 会把函数标记为测试辅助函数，使诊断信息指向调用位置。' }
    difficulty: beginner
    tags: [checkpoint]
  - id: checkpoint-5-vet-scope
    type: mcq
    prompt: { en: 'What conclusion is justified after `go vet ./...` succeeds?', zh: '`go vet ./...` 成功后，可以得出哪项结论？' }
    options:
      - { text: { en: 'The enabled analyzers found no suspicious constructs they recognize; tests and review are still required.', zh: '已启用的分析器没有发现其能够识别的可疑写法；仍然需要测试和审查。' }, correct: true }
      - { text: { en: 'The program is free of data races and business-logic defects.', zh: '程序不存在数据竞争和业务逻辑缺陷。' }, correct: false }
      - { text: { en: 'All dependencies are secure and every error path has been executed.', zh: '所有依赖都安全，而且每条错误路径都已执行。' }, correct: false }
    explanation: { en: '`go vet` targets specific suspicious patterns such as format mismatches and lock copies; it is not a proof of correctness.', zh: '`go vet` 针对格式不匹配、锁复制等特定可疑模式，并不能证明程序正确。' }
    difficulty: intermediate
    tags: [checkpoint]
  - id: checkpoint-5-fuzz-seed
    type: fill
    prompt: { en: 'Name the fuzz-test method used to add a known input to the seed corpus before calling `Fuzz`.', zh: '写出模糊测试方法名称：它在调用 `Fuzz` 前把已知输入加入种子语料库。' }
    answer: f.Add
    explanation: { en: '`f.Add` supplies valid and boundary examples that run before coverage-guided mutations.', zh: '`f.Add` 提供有效输入和边界示例，并在覆盖率引导的变异之前运行。' }
    difficulty: intermediate
    tags: [checkpoint]
  - id: checkpoint-5-benchmark-loop
    type: fill
    prompt: { en: 'Which `testing.B` field supplies the iteration count that a benchmark body must use?', zh: '`testing.B` 的哪个字段提供基准测试主体必须使用的迭代次数？' }
    answer: b.N
    explanation: { en: 'The benchmark harness adjusts `b.N` to obtain a useful measurement interval, so the measured operation must run that many times.', zh: '基准测试框架会调整 `b.N` 以获得合适的测量区间，因此被测操作必须执行相应次数。' }
    difficulty: intermediate
    tags: [checkpoint]
  - id: checkpoint-5-timer-boundary
    type: mcq
    prompt: { en: 'A benchmark performs expensive fixture setup before its measured loop. Which change isolates the operation cost?', zh: '基准测试在测量循环前执行了昂贵的夹具初始化。哪项修改能隔离被测操作的成本？' }
    options:
      - { text: { en: 'Finish setup, then call `b.ResetTimer()` immediately before the `b.N` loop.', zh: '完成初始化后，在 `b.N` 循环之前立即调用 `b.ResetTimer()`。' }, correct: true }
      - { text: { en: 'Move setup inside every iteration so the benchmark includes more work.', zh: '把初始化移入每次迭代，让基准测试包含更多工作。' }, correct: false }
      - { text: { en: 'Replace `b.N` with a fixed loop count so setup becomes negligible.', zh: '用固定循环次数替换 `b.N`，让初始化成本变得可以忽略。' }, correct: false }
    explanation: { en: '`b.ResetTimer()` discards elapsed setup time while preserving harness-controlled iteration and reporting.', zh: '`b.ResetTimer()` 会丢弃已经经过的初始化时间，同时保留框架控制的迭代与报告机制。' }
    difficulty: advanced
    tags: [checkpoint]
  - id: checkpoint-5-pprof-command
    type: fill
    prompt: { en: 'Name the standard command used to inspect a Go CPU or heap profile.', zh: '写出用于检查 Go CPU 或堆 profile 的标准命令。' }
    answer: go tool pprof
    explanation: { en: '`go tool pprof` aggregates sampled costs by functions and call paths so a measured hotspot can be investigated.', zh: '`go tool pprof` 会按函数和调用路径聚合采样成本，用于分析实际测得的热点。' }
    difficulty: advanced
    tags: [checkpoint]
  - id: checkpoint-5-trace-choice
    type: mcq
    prompt: { en: 'A service has intermittent scheduler latency between goroutines, but a CPU profile shows no dominant function. Which evidence is most suitable next?', zh: '服务偶尔出现 goroutine 之间的调度延迟，但 CPU profile 没有显示主导函数。下一步最适合收集哪种证据？' }
    options:
      - { text: { en: 'Collect a bounded execution trace and inspect scheduler events and goroutine timelines.', zh: '收集一段有界执行跟踪，并检查调度器事件与 goroutine 时间线。' }, correct: true }
      - { text: { en: 'Increase the benchmark duration and infer the scheduler sequence from ns/op.', zh: '延长基准测试时间，并从 ns/op 推断调度器执行顺序。' }, correct: false }
      - { text: { en: 'Run `go vet` because static analysis records runtime scheduling events.', zh: '运行 `go vet`，因为静态分析会记录运行时调度事件。' }, correct: false }
    explanation: { en: 'Profiles aggregate sampled resource use, while an execution trace preserves time-ordered runtime events needed to inspect scheduling and blocking.', zh: 'profile 聚合采样到的资源使用情况，而执行跟踪会保留按时间排序的运行时事件，适合检查调度与阻塞。' }
    difficulty: advanced
    tags: [checkpoint]
