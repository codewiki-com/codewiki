topic: go/reflect
items:
  - id: predict-named-type-and-settability
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      package main

      import (
          "fmt"
          "reflect"
      )

      type Score int

      func main() {
          score := Score(8)
          value := reflect.ValueOf(&score).Elem()
          fmt.Println(value.CanAddr(), value.CanSet())
          fmt.Println(value.Type(), value.Kind())
      }
    lang: go
    options:
      - text: { en: "true true\nmain.Score int", zh: "true true\nmain.Score int" }
        correct: true
      - text: { en: "true false\nmain.Score int", zh: "true false\nmain.Score int" }
        correct: false
      - text: { en: "false false\nint int", zh: "false false\nint int" }
        correct: false
      - text: { en: 'The call to Elem panics because score is not a pointer.', zh: '调用 Elem 时发生 panic，因为 score 不是指针。' }
        correct: false
    explanation: { en: 'ValueOf receives *Score, and Elem reaches the original settable variable. Its exact type remains main.Score while its underlying kind is int.', zh: 'ValueOf 接收 *Score，Elem 取得原来可设置的变量。它的精确类型仍是 main.Score，底层 Kind 则是 int。' }
    difficulty: intermediate
    tags: [predict-output, reflect-value, kind]

  - id: type-versus-kind
    type: mcq
    prompt: { en: 'Which check is the right default before setting one reflect.Value from another?', zh: '用一个 reflect.Value 设置另一个值之前，默认应使用哪项检查？' }
    options:
      - { text: { en: 'The two values have the same Kind.', zh: '两个值具有相同的 Kind。' }, correct: false }
      - { text: { en: 'source.Type().AssignableTo(destination.Type())', zh: 'source.Type().AssignableTo(destination.Type())' }, correct: true }
      - { text: { en: 'source.CanAddr() is true.', zh: 'source.CanAddr() 为 true。' }, correct: false }
      - { text: { en: 'destination.Type().ConvertibleTo(source.Type())', zh: 'destination.Type().ConvertibleTo(source.Type())' }, correct: false }
    explanation: { en: 'Set follows Go assignment rules, so the source type must be assignable to the destination type. Equal kinds are too broad, and conversion is a separate policy decision.', zh: 'Set 遵循 Go 的赋值规则，因此来源类型必须可赋给目标类型。Kind 相同的范围太宽，类型转换则是另一项策略决策。' }
    difficulty: intermediate
    tags: [assignability, type-identity]

  - id: spotbug-isnil-on-any-value
    title: { en: 'Spot the bug in the IsNil helper', zh: '找出 IsNil 辅助函数里的 bug' }
    type: spotbug
    prompt: { en: 'This helper should report whether any input is nil without panicking. Find the unsafe operation.', zh: '这个辅助函数应判断任意输入是否为 nil，并且不能 panic。请找出不安全的操作。' }
    code: |
      package main

      import "reflect"

      func IsNil(input any) bool {
          return reflect.ValueOf(input).IsNil()
      }

      func main() {
          println(IsNil(3))
      }
    lang: go
    issues:
      - line: 6
        kind: correctness
        note: { en: 'IsNil panics for an int and for an invalid Value; the helper must check IsValid and switch on the six nil-capable kinds first.', zh: 'IsNil 用于 int 或无效 Value 时会 panic；辅助函数必须先检查 IsValid，再只对六种可为 nil 的 Kind 调用它。' }
    explanation: { en: 'IsNil is defined only for Chan, Func, Interface, Map, Pointer, and Slice. A nil interface also becomes an invalid Value, which needs its own branch.', zh: 'IsNil 只适用于 Chan、Func、Interface、Map、Pointer 和 Slice。nil 接口还会产生无效 Value，需要单独处理。' }
    difficulty: intermediate
    tags: [nil, panic, kind-guard]

  - id: struct-tag-lookup
    type: mcq
    prompt: { en: 'Why would a decoder use StructTag.Lookup("config") instead of Get("config")?', zh: '解码器为什么会使用 StructTag.Lookup("config")，而不是 Get("config")？' }
    options:
      - { text: { en: 'Lookup distinguishes a missing key from a present key with an empty value.', zh: 'Lookup 能区分键不存在与键存在但值为空。' }, correct: true }
      - { text: { en: 'Lookup validates the tag according to encoding/json rules.', zh: 'Lookup 会按照 encoding/json 的规则校验标签。' }, correct: false }
      - { text: { en: 'Lookup returns the field index path together with the tag.', zh: 'Lookup 会同时返回字段索引路径和标签。' }, correct: false }
      - { text: { en: 'Get cannot read tags on exported fields.', zh: 'Get 无法读取导出字段上的标签。' }, correct: false }
    explanation: { en: 'Get returns an empty string for both cases. Lookup adds a presence flag, while the consuming package still owns validation and tag semantics.', zh: '这两种情况中 Get 都返回空字符串。Lookup 额外返回存在标志；标签校验和语义仍由使用它的包负责。' }
    difficulty: intermediate
    tags: [struct-tag, lookup, metadata]

  - id: review-generated-settings-update
    title: { en: 'Review generated settings updater', zh: '审查生成的设置更新器' }
    type: review
    prompt: { en: 'Review this generated updater before it accepts fields from an external request.', zh: '在这段生成的更新器接受外部请求字段之前，对它进行审查。' }
    task: { en: 'Update a non-nil *Settings through edit tags only, reject unknown, nil, or incompatible values without panicking, and never expose AdminToken as writable input.', zh: '只通过 edit 标签更新非 nil 的 *Settings；遇到未知、nil 或不兼容值时返回错误且不能 panic，并且绝不能把 AdminToken 暴露为可写输入。' }
    code: |
      package config

      import "reflect"

      type Settings struct {
          Host       string `edit:"host"`
          Port       int    `edit:"port"`
          AdminToken string
      }

      func Apply(dst any, fields map[string]any) error {
          target := reflect.ValueOf(dst).Elem()
          for name, raw := range fields {
              field := target.FieldByName(name)
              if !field.IsValid() {
                  continue
              }
              value := reflect.ValueOf(raw)
              if value.Type().ConvertibleTo(field.Type()) {
                  field.Set(value.Convert(field.Type()))
              }
          }
          return nil
      }
    lang: go
    right: { en: 'The generated code keeps reflection in one helper, checks that a named field exists before using it, and mutates the destination only when Go defines a conversion.', zh: '生成代码把反射集中在一个辅助函数中，使用命名字段前检查其存在性，而且只在 Go 定义了转换时修改目标值。' }
    issues:
      - line: 12
        kind: correctness
        note: { en: 'Elem panics for nil, non-pointer, or nil-pointer dst, and the code never proves that the element is a struct.', zh: 'dst 为 nil、非指针或 nil 指针时，Elem 会 panic；代码也没有证明指针元素是结构体。' }
      - line: 14
        kind: security
        note: { en: 'FieldByName uses attacker-controlled Go names instead of edit tags, so AdminToken becomes writable despite having no edit tag.', zh: 'FieldByName 使用攻击者控制的 Go 字段名，而不是 edit 标签，因此没有 edit 标签的 AdminToken 也会变成可写字段。' }
      - line: 18
        kind: edge-case
        note: { en: 'A nil raw value produces an invalid Value, and calling Type on it panics; broad numeric conversions may also change an out-of-range value.', zh: 'raw 为 nil 时会产生无效 Value，调用 Type 随即 panic；宽泛的数值转换也可能改变越界值。' }
      - line: 14
        kind: performance
        note: { en: 'Every update repeats name lookup and type-policy discovery; a validated immutable plan keyed by reflect.Type can be reused for a real batch path.', zh: '每次更新都重复名称查找与类型策略发现；真实批处理路径可以复用以 reflect.Type 为键、经过验证的不可变计划。' }
    checklist:
      - { en: 'Pass nil, a value, a nil pointer, and pointers to non-struct and struct values; require errors instead of panics.', zh: '传入 nil、普通值、nil 指针、指向非结构体和结构体的指针，要求返回错误而不是 panic。' }
      - { en: 'Try tag names, Go field names, unknown names, and AdminToken; assert that only tagged fields change.', zh: '尝试标签名、Go 字段名、未知名称和 AdminToken，断言只有带标签字段发生变化。' }
      - { en: 'Test nil, named types, incompatible types, and numeric boundaries before allowing any explicit conversion.', zh: '在允许任何显式转换前，测试 nil、命名类型、不兼容类型与数值边界。' }
      - { en: 'Run a representative batch and confirm metadata is cached without retaining request Values.', zh: '运行有代表性的批次，确认元数据得到缓存，同时没有保留请求中的 Value。' }
    explanation: { en: 'Validate the destination first, build an allowlist from edit tags, and assign only values that pass explicit type and range policy. Cache that plan by type when the path processes many records.', zh: '应先验证目标，再根据 edit 标签建立允许清单，并且只赋入通过明确类型与范围策略的值。路径处理大量记录时，可按类型缓存这份计划。' }
    difficulty: advanced
    tags: [code-review, mass-assignment, panic-safety, metadata-cache]
