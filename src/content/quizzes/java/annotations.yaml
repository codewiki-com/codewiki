topic: java/annotations
items:
  - id: predict-repeatable-query
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      import java.lang.annotation.*;

      @Retention(RetentionPolicy.RUNTIME)
      @Target(ElementType.TYPE)
      @Repeatable(Labels.class)
      @interface Label { String value(); }

      @Retention(RetentionPolicy.RUNTIME)
      @Target(ElementType.TYPE)
      @interface Labels { Label[] value(); }

      @Label("fast")
      @Label("stable")
      public class Main {
          public static void main(String[] args) {
              System.out.println(Main.class.getAnnotation(Label.class));
              System.out.println(Main.class.getAnnotationsByType(Label.class).length);
          }
      }
    lang: java
    options:
      - { text: { en: 'null, then 2', zh: '先输出null，再输出2' }, correct: true }
      - { text: { en: '@Label("fast"), then 2', zh: '先输出 @Label("fast")，再输出2' }, correct: false }
      - { text: { en: 'null, then 0', zh: '先输出null，再输出0' }, correct: false }
      - { text: { en: 'The class fails to compile because annotations cannot repeat.', zh: '编译失败，因为注解不能重复。' }, correct: false }
    explanation: { en: 'Two repeated annotations are represented through their container, so the singular query for `Label` returns null. The by-type query unfolds the container and returns both labels.', zh: '两个重复注解通过容器表示，因此针对`Label`的单数查询返回null；按类型查询会展开容器并返回两个标签。' }
    difficulty: intermediate
    tags: [repeatable-annotations, reflection, containers]

  - id: default-retention-policy
    type: mcq
    prompt: { en: 'Which retention policy applies when an annotation interface has no `@Retention`?', zh: '注解接口没有`@Retention`时采用哪种保留策略？' }
    options:
      - { text: { en: '`RetentionPolicy.CLASS`', zh: '`RetentionPolicy.CLASS`' }, correct: true }
      - { text: { en: '`RetentionPolicy.SOURCE`', zh: '`RetentionPolicy.SOURCE`' }, correct: false }
      - { text: { en: '`RetentionPolicy.RUNTIME`', zh: '`RetentionPolicy.RUNTIME`' }, correct: false }
      - { text: { en: 'The compiler selects a policy from `@Target`.', zh: '编译器根据`@Target`选择策略。' }, correct: false }
    explanation: { en: '`CLASS` is the default: the compiler records the annotation in the class file, but reflection is not required to expose it at runtime.', zh: '缺省策略是`CLASS`：编译器会把注解写入类文件，但运行时反射不需要公开它。' }
    difficulty: beginner
    tags: [retention, class-files, reflection]

  - id: spotbug-runtime-retention
    title: { en: 'Spot the bug in the scheduled job annotation', zh: '找出调度任务注解里的bug' }
    type: spotbug
    prompt: { en: 'Find why the runtime scheduler never recognizes this job.', zh: '找出运行时调度器始终无法识别这个任务的原因。' }
    code: |
      import java.lang.annotation.*;

      @Retention(RetentionPolicy.CLASS)
      @Target(ElementType.METHOD)
      @interface Scheduled {}

      class CleanupJob {
          @Scheduled
          public void run() {}
      }

      public class Main {
          public static void main(String[] args) throws Exception {
              var method = CleanupJob.class.getDeclaredMethod("run");
              System.out.println(method.isAnnotationPresent(Scheduled.class));
          }
      }
    lang: java
    issues:
      - line: 3
        kind: correctness
        note: { en: '`CLASS` retention stores `@Scheduled` in the class file but does not expose it through runtime reflection. Use `RUNTIME` for this scheduler contract.', zh: '`CLASS`会把`@Scheduled`存入类文件，但不会通过运行时反射公开它；该调度契约应使用`RUNTIME`。' }
    explanation: { en: 'The program prints false because the consumer runs through reflection. Retention must match the phase in which the consumer reads metadata.', zh: '程序会输出false，因为消费者使用运行时反射；保留策略必须匹配消费者读取元数据的阶段。' }
    difficulty: beginner
    tags: [retention, runtime, scheduler]

  - id: inherited-boundary
    type: mcq
    prompt: { en: 'What does `@Inherited` make a subclass query inherit?', zh: '`@Inherited`会让子类查询继承什么？' }
    options:
      - { text: { en: 'An eligible annotation declared on a superclass class declaration.', zh: '父类的类声明上符合条件的注解。' }, correct: true }
      - { text: { en: 'Annotations on every implemented interface.', zh: '所有已实现接口上的注解。' }, correct: false }
      - { text: { en: 'Annotations on overridden superclass methods.', zh: '父类中被覆盖方法上的注解。' }, correct: false }
      - { text: { en: 'All type-use annotations inside inherited signatures.', zh: '继承签名中的所有类型使用注解。' }, correct: false }
    explanation: { en: '`@Inherited` affects class annotation queries along the superclass chain. It does not define inheritance through interfaces, methods, fields, or type uses.', zh: '`@Inherited`只影响沿父类链进行的类注解查询，不会定义接口、方法、字段或类型使用位置的继承。' }
    difficulty: intermediate
    tags: [inherited, reflection, superclass]

  - id: review-generated-role-dispatcher
    title: { en: 'Review generated role dispatcher', zh: '审查生成的角色调度器' }
    type: review
    prompt: { en: 'Review this generated role-aware dispatcher before it protects administrative operations.', zh: '在这段生成的角色调度器用于保护管理操作前进行审查。' }
    task: { en: 'Dispatch annotated public methods, including inherited ones, enforce role values with a deny-by-default policy, preserve useful failures, and handle repeated calls efficiently.', zh: '调度带注解的public方法，包括继承方法；按拒绝优先策略校验角色值；保留有用的失败信息；并高效处理重复调用。' }
    code: |
      import java.lang.annotation.*;
      import java.lang.reflect.Method;

      @Retention(RetentionPolicy.CLASS)
      @Target(ElementType.METHOD)
      @interface RequiresRole { String value(); }

      class AccountAdmin {
          @RequiresRole("admin")
          public void closeAccount() {}
      }

      public class GeneratedDispatcher {
          static void dispatch(Object target, String methodName, String role)
                  throws Exception {
              Method method = target.getClass()
                      .getDeclaredMethod(methodName);
              RequiresRole required = method.getAnnotation(RequiresRole.class);
              if (required != null && role != required.value()) {
                  throw new SecurityException("wrong role");
              }
              method.setAccessible(true);
              method.invoke(target);
          }
      }
    lang: java
    right: { en: 'The code centralizes dispatch, restricts annotation placement to methods, resolves an exact no-argument signature, and separates authorization metadata from the operation body.', zh: '代码集中处理调度，把注解位置限制为方法，解析精确的无参数签名，并把授权元数据与操作主体分离。' }
    checklist:
      - { en: 'Compile and run a denied call, an allowed call, and a method with no annotation.', zh: '编译并执行拒绝调用、允许调用以及没有注解的方法。' }
      - { en: 'Test direct, inherited, overridden, private, missing, and overloaded methods.', zh: '测试直接声明、继承、覆盖、private、不存在和重载方法。' }
      - { en: 'Compare role values with distinct String objects containing equal text.', zh: '使用内容相同但对象不同的String比较角色值。' }
      - { en: 'Measure repeated dispatch and inspect the exception exposed to the caller.', zh: '测量重复调度，并检查暴露给调用方的异常。' }
    issues:
      - line: 4
        kind: security
        note: { en: '`CLASS` retention makes the role annotation invisible to reflection, and the null check then allows the call. Use `RUNTIME` and deny when required authorization metadata is missing.', zh: '`CLASS`让反射看不到角色注解，而null分支会放行调用。应使用`RUNTIME`，并在缺少必需授权元数据时拒绝调用。' }
      - line: 19
        kind: correctness
        note: { en: '`!=` compares String references, so equal role text in different objects can be rejected. Compare values with `required.value().equals(role)` after defining the null policy.', zh: '`!=`比较String引用，因此内容相同但对象不同的角色可能被拒绝。定义null策略后，应使用`required.value().equals(role)`比较值。' }
      - line: 17
        kind: edge-case
        note: { en: '`getDeclaredMethod` searches only the concrete class and misses inherited public methods promised by the task. Choose `getMethod` or an explicit hierarchy scan that matches the contract.', zh: '`getDeclaredMethod`只搜索具体类，会漏掉任务要求的继承public方法。应选择`getMethod`，或按契约显式扫描类型层次。' }
      - line: 15
        kind: readability
        note: { en: '`throws Exception` hides lookup, access, invocation-target, and authorization policies behind one broad contract. Translate reflection failures into a small domain-specific result or exception set.', zh: '`throws Exception`把查找、访问、调用目标与授权策略隐藏在一个宽泛契约后。应把反射失败转换为少量领域结果或异常。' }
      - line: 16
        lines: 3
        kind: performance
        note: { en: 'Every dispatch repeats method lookup and annotation parsing. Cache only validated method-and-policy pairs by concrete class and signature, with class-loader lifecycle in mind.', zh: '每次调度都重复查找方法并解析注解。可按具体类与签名缓存已经验证的方法和策略，同时考虑类加载器生命周期。' }
    explanation: { en: 'Make the annotation runtime-visible, reject missing policy, compare role values by content, and resolve methods according to the documented hierarchy rule. Keep reflection failures precise and cache validated dispatch metadata when measurements justify it.', zh: '应让注解在运行时可见，拒绝缺失策略，按内容比较角色值，并按约定的层次规则解析方法。反射失败应保持精确；测量证明必要时，再缓存已验证的调度元数据。' }
    difficulty: advanced
    tags: [code-review, authorization, reflection, retention]
