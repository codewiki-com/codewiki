topic: java/java17-features
items:
  - id: predict-pattern-guard
    type: predict
    prompt: { en: 'What does this Java 17 program print?', zh: '这段 Java 17 程序会输出什么？' }
    code: |
      public class Main {
          static String normalize(Object value) {
              if (!(value instanceof String text)) {
                  return "other";
              }
              return text.strip().toUpperCase();
          }

          public static void main(String[] args) {
              System.out.println(normalize(" Java "));
          }
      }
    lang: java
    options:
      - { text: { en: 'JAVA', zh: 'JAVA' }, correct: true }
      - { text: { en: ' Java ', zh: ' Java ' }, correct: false }
      - { text: { en: 'other', zh: 'other' }, correct: false }
      - { text: { en: 'It fails to compile because text is out of scope.', zh: '无法编译，因为 text 超出了作用域。' }, correct: false }
    explanation: { en: 'The negated branch returns for every non-String value, so flow scoping makes text available afterward. strip removes surrounding whitespace before toUpperCase runs.', zh: '所有非 String 值都会从取反分支返回，因此流作用域允许后续代码使用 text。strip 先删除两侧空白，toUpperCase 再转换大小写。' }
    difficulty: beginner
    tags: [instanceof, flow-scoping, predict-output]

  - id: predict-record-shallow-state
    type: predict
    prompt: { en: 'What does this program print about the record component?', zh: '这段程序会输出怎样的记录组件状态？' }
    code: |
      import java.util.ArrayList;
      import java.util.List;

      public class Main {
          record Tags(List<String> values) {}

          public static void main(String[] args) {
              var source = new ArrayList<>(List.of("java"));
              var tags = new Tags(source);
              source.add("jdk");
              System.out.println(tags.values().size());
          }
      }
    lang: java
    options:
      - { text: { en: '2', zh: '2' }, correct: true }
      - { text: { en: '1', zh: '1' }, correct: false }
      - { text: { en: '0', zh: '0' }, correct: false }
      - { text: { en: 'It throws UnsupportedOperationException.', zh: '抛出 UnsupportedOperationException。' }, correct: false }
    explanation: { en: 'The final component field stores the same mutable list reference, so adding through source is visible through the record accessor. A record is not deeply immutable by default.', zh: 'final 组件字段保存的是同一个可变列表引用，因此通过 source 添加的元素会从记录访问器中可见。记录类默认不是深度不可变对象。' }
    difficulty: intermediate
    tags: [records, mutability, aliasing]

  - id: spotbug-java21-switch-in-java17
    type: spotbug
    prompt: { en: 'Find why this generated method is not stable Java 17 source code.', zh: '找出这段生成方法为何不属于稳定的 Java 17 源码。' }
    code: |
      static String label(Object value) {
          return switch (value) {
              case String text when !text.isBlank() -> text.strip();
              case String text -> "blank";
              default -> "other";
          };
      }
    lang: java
    issues:
      - line: 3
        kind: correctness
        note: { en: 'A type-pattern switch with a when guard is final Java 21 syntax, not stable Java 17 syntax, so javac --release 17 rejects it.', zh: '带 when 守卫的类型模式 switch 是 Java 21 正式语法，不属于稳定的 Java 17 语法，因此 javac --release 17 会拒绝它。' }
    explanation: { en: 'For a Java 17 source boundary, use instanceof pattern matching and ordinary control flow, or explicitly raise the minimum release to Java 21. Enabling a Java 17 preview is not equivalent because the preview syntax and class files were version-bound.', zh: 'Java 17 源码边界应使用 instanceof 模式匹配和普通控制流，或明确把最低版本提高到 Java 21。启用 Java 17 预览并不等价，因为预览语法与类文件都绑定具体版本。' }
    difficulty: intermediate
    tags: [source-level, preview-features, pattern-switch]

  - id: feature-release-provenance
    type: mcq
    prompt: { en: 'Which feature in this topic became final specifically in Java 17?', zh: '本主题中的哪项特性是在 Java 17 正式发布的？' }
    options:
      - { text: { en: 'Sealed classes', zh: '密封类' }, correct: true }
      - { text: { en: 'Record classes', zh: '记录类' }, correct: false }
      - { text: { en: 'Text blocks', zh: '文本块' }, correct: false }
      - { text: { en: 'Switch expressions', zh: 'switch 表达式' }, correct: false }
    explanation: { en: 'Sealed classes were delivered in release 17. Records and instanceof patterns were final in 16, text blocks in 15, and switch expressions in 14.', zh: '密封类在 Java 17 正式交付。记录类与 instanceof 模式在 Java 16 转正，文本块在 Java 15 转正，switch 表达式在 Java 14 转正。' }
    difficulty: beginner
    tags: [java-17, release-history, final-features]

  - id: review-generated-row-importer
    type: review
    prompt: { en: 'Review this generated importer before it is accepted into a Java 17 service.', zh: '在这段生成的导入器进入 Java 17 服务前，对它进行审查。' }
    task: { en: 'Import unique IDs from untrusted two-column CSV rows, reject invalid rows without exposing their contents, return an immutable result, and compile as stable Java 17.', zh: '从不可信的两列 CSV 行导入唯一 ID；拒绝无效行但不暴露其内容；返回不可变结果；并以稳定 Java 17 源码编译。' }
    code: |
      import java.util.*;
      public class GeneratedImporter {
          sealed interface ImportResult permits Imported, Rejected {}
          record Imported(List<String> ids) implements ImportResult {}
          record Rejected(String message) implements ImportResult {}

          static ImportResult importRows(List<String> rows) {
              var ids = new ArrayList<String>();
              for (String row : rows) {
                  if (row.isBlank()) {
                      return new Rejected("Bad row: " + row);
                  }
                  String id = row.split(",")[0].trim();
                  if (!ids.contains(id)) ids.add(id);
              }
              return new Imported(ids);
          }
          static String message(ImportResult result) {
              return switch (result) {
                  case Imported imported -> "Imported " + imported.ids().size();
                  case Rejected rejected -> rejected.message();
              };
          }
      }
    lang: java
    right: { en: 'The generated code gives success and rejection distinct result types, trims IDs, and keeps the import loop local instead of mutating shared service state.', zh: '生成代码用不同结果类型表示成功与拒绝，清理了 ID 两侧空白，并把导入循环限制在局部范围，没有修改共享服务状态。' }
    checklist:
      - { en: 'Compile sources and tests with JDK 25 using --release 17 and no preview flag.', zh: '用 JDK 25 和 --release 17 编译源码与测试，不启用预览。' }
      - { en: 'Test empty, blank, missing-column, quoted-comma, duplicate, and very large inputs.', zh: '测试空输入、空白行、缺列、带引号逗号、重复项和超大输入。' }
      - { en: 'Attempt to mutate every collection returned through a record accessor.', zh: '尝试修改每个通过记录访问器返回的集合。' }
      - { en: 'Inspect all public errors and logs for raw rows or other sensitive input.', zh: '检查全部公开错误与日志，确认没有原始行或其他敏感输入。' }
    issues:
      - line: 4
        kind: edge-case
        note: { en: 'Imported keeps and exposes the mutable ArrayList, so callers can change a supposedly completed result through ids().', zh: 'Imported 保存并暴露可变 ArrayList，调用方可以通过 ids() 修改本应完成的结果。' }
      - line: 11
        kind: security
        note: { en: 'The rejection message includes the raw untrusted row, which can leak personal data, secrets, or forged control characters.', zh: '拒绝消息包含不可信的原始行，可能泄露个人数据、密钥，或携带伪造控制字符。' }
      - line: 13
        kind: readability
        note: { en: 'An inline split and magic index hide the required two-column schema and leave quoting, empty fields, and normalization policy unclear.', zh: '内联 split 与魔法索引隐藏了两列模式，也没有清楚表达引号、空字段和规范化策略。' }
      - line: 14
        kind: performance
        note: { en: 'Repeated ArrayList.contains makes duplicate filtering quadratic; a LinkedHashSet expresses uniqueness with expected constant-time lookup while preserving order.', zh: '反复调用 ArrayList.contains 会让去重变成平方复杂度；LinkedHashSet 既保留顺序，也能以期望常数时间查找。' }
      - line: 19
        kind: correctness
        note: { en: 'The type-pattern switch does not compile under stable --release 17; the service needs instanceof dispatch or a declared Java 21 minimum.', zh: '类型模式 switch 无法在稳定的 --release 17 下编译；该服务需要使用 instanceof 分派，或声明最低 Java 21。' }
    explanation: { en: 'A corrected Java 17 implementation should parse with an explicit CSV policy, collect IDs in an insertion-ordered set, copy the final collection, return a sanitized rejection, and dispatch sealed results with instanceof or polymorphism. The release check belongs in CI so newer local JDK defaults cannot hide drift.', zh: '修正版 Java 17 实现应采用明确的 CSV 策略解析，用保序集合收集 ID，复制最终集合，返回净化后的拒绝信息，并通过 instanceof 或多态分派密封结果。CI 必须执行版本检查，避免本地新 JDK 的默认值掩盖漂移。' }
    difficulty: advanced
    tags: [code-review, records, sealed-classes, source-level, security]
