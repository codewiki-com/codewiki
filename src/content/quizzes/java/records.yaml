topic: java/records
items:
  - id: predict-derived-record-members
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      public class Main {
          record Price(String sku, int cents) {}

          public static void main(String[] args) {
              var first = new Price("P-7", 250);
              var second = new Price("P-7", 250);
              System.out.println(first == second);
              System.out.println(first.equals(second));
              System.out.println(first.sku());
          }
      }
    lang: java
    options:
      - { text: { en: 'false, true, P-7', zh: 'false、true、P-7' }, correct: true }
      - { text: { en: 'true, true, P-7', zh: 'true、true、P-7' }, correct: false }
      - { text: { en: 'false, false, P-7', zh: 'false、false、P-7' }, correct: false }
      - { text: { en: 'It fails because the accessor must be getSku().', zh: '编译失败，因为访问器必须命名为 getSku()。' }, correct: false }
    explanation: { en: '`==` compares the two references, while the derived `equals()` compares same-type record components. The component accessor is named `sku()`.', zh: '`==` 比较两个引用，派生的 `equals()` 则比较同一记录类型的组件；组件访问器名为 `sku()`。' }
    difficulty: beginner
    tags: [records, equality, accessors]

  - id: compact-constructor-assignment
    type: mcq
    prompt: { en: 'What happens to a component parameter rebound inside a compact constructor?', zh: '在紧凑构造器中重新绑定组件参数后会发生什么？' }
    options:
      - { text: { en: 'The compiler assigns the rebound value to the component field after the body completes.', zh: '构造器体完成后，编译器把重新绑定的值赋给组件字段。' }, correct: true }
      - { text: { en: 'Rebinding is ignored and the original argument is always stored.', zh: '重新绑定会被忽略，字段始终保存原始实参。' }, correct: false }
      - { text: { en: 'Every rebound parameter creates an extra instance field.', zh: '每个重新绑定的参数都会创建额外实例字段。' }, correct: false }
      - { text: { en: 'A compact constructor may validate but may never rebind parameters.', zh: '紧凑构造器可以校验，但绝不能重新绑定参数。' }, correct: false }
    explanation: { en: 'Component names in a compact constructor denote implicit parameters. Normal completion triggers compiler-supplied assignments from their final values to the fields.', zh: '紧凑构造器中的组件名表示隐式参数；构造器体正常完成后，编译器把参数最终值赋给字段。' }
    difficulty: intermediate
    tags: [compact-constructor, normalization, invariants]

  - id: record-pattern-null
    type: mcq
    prompt: { en: 'Without `case null`, what happens when a pattern switch over records receives null?', zh: '对记录使用模式 switch 且没有 `case null` 时，选择器为 null 会怎样？' }
    options:
      - { text: { en: 'It throws NullPointerException.', zh: '抛出 NullPointerException。' }, correct: true }
      - { text: { en: 'It matches the first record pattern with null components.', zh: '匹配第一个记录模式，并把组件设为 null。' }, correct: false }
      - { text: { en: 'It always matches default.', zh: '始终匹配 default。' }, correct: false }
      - { text: { en: 'It returns the zero value of the switch result type.', zh: '返回 switch 结果类型的零值。' }, correct: false }
    explanation: { en: 'Null matches no record pattern, and `default` does not provide implicit null handling. Add `case null` or reject null before the switch.', zh: 'null 不匹配任何记录模式，`default` 也不会隐式处理 null；应添加 `case null`，或在 switch 前拒绝空值。' }
    difficulty: intermediate
    tags: [record-patterns, pattern-switch, 'null']

  - id: spotbug-mutable-record-key
    type: spotbug
    prompt: { en: 'Find why this record is unsafe as a HashMap key.', zh: '找出这个记录值不适合作为 HashMap 键的原因。' }
    code: |
      import java.util.HashMap;
      import java.util.List;

      public class Main {
          record Route(List<String> stops) {}

          public static void main(String[] args) {
              var stops = new java.util.ArrayList<>(List.of("A", "B"));
              var route = new Route(stops);
              var index = new HashMap<Route, String>();
              index.put(route, "morning");
              stops.add("C");
              System.out.println(index.get(route));
          }
      }
    lang: java
    issues:
      - line: 5
        kind: correctness
        note: { en: 'The record stores a caller-owned mutable list. Changing that list changes the derived hash after insertion, so lookup is no longer reliable; copy with `List.copyOf` in the canonical constructor.', zh: '记录直接保存调用方拥有的可变列表；插入后修改列表会改变派生哈希，查找不再可靠。应在规范构造器中使用 `List.copyOf`。' }
    explanation: { en: 'Final component fields do not make referenced objects immutable. Hash keys need equality and hash state that stays stable while they are stored.', zh: '组件字段为 final 并不会让引用对象不可变；哈希键存储期间，其相等性与哈希状态必须保持稳定。' }
    difficulty: intermediate
    tags: [mutability, hash-map, defensive-copy]

  - id: review-generated-archive-request
    type: review
    prompt: { en: 'Review this generated archive-request key before it reaches production.', zh: '在这段生成的归档请求键进入生产环境前进行审查。' }
    task: { en: 'Model an archive request as a stable value key, normalize IDs once, reject nulls, compare signature bytes by content, avoid leaking tokens, and index many large requests efficiently.', zh: '把归档请求建模为稳定值键；只规范化一次标识；拒绝空值；按内容比较签名字节；避免泄露 token；并高效索引大量大型请求。' }
    code: |
      import java.util.*;
      public class GeneratedArchive {
          record ArchiveRequest(String id, String accessToken,
                  List<String> paths, byte[] signature) {
              ArchiveRequest {
                  if (id.isBlank()) throw new IllegalArgumentException("blank id");
                  paths = new ArrayList<>(paths);
              }
              @Override public String id() {
                  return id.toUpperCase(Locale.ROOT);
              }
          }

          static Map<ArchiveRequest, String> index(List<ArchiveRequest> requests) {
              var index = new LinkedHashMap<ArchiveRequest, String>();
              for (var request : requests) {
                  index.put(request, request.id());
              }
              return index;
          }
      }
    lang: java
    right: { en: 'The record gives the request fields domain names, the compact constructor provides one validation point, and LinkedHashMap makes traversal order deterministic.', zh: '记录类型为请求字段提供了领域名称，紧凑构造器提供单一校验点，LinkedHashMap 则让遍历顺序确定。' }
    checklist:
      - { en: 'Mutate every caller-owned input and every accessor result after construction.', zh: '构造完成后，分别修改调用方拥有的输入和每个访问器结果。' }
      - { en: 'Test equality, hashing, and reconstruction with distinct arrays containing identical bytes.', zh: '使用内容相同但实例不同的数组测试相等性、哈希与重建。' }
      - { en: 'Inspect `toString()`, logs, exceptions, and map diagnostics for credentials.', zh: '检查 `toString()`、日志、异常和映射诊断中是否含凭据。' }
      - { en: 'Measure lookup cost with realistic path counts and compile with the target `--release`.', zh: '使用真实路径数量测量查找成本，并按目标 `--release` 编译。' }
    issues:
      - line: 3
        kind: security
        note: { en: '`accessToken` is a record component, so the derived `toString()` exposes it and routine map diagnostics can leak the credential. Keep credentials outside the printable value or provide a safer boundary type.', zh: '`accessToken` 是记录组件，因此派生的 `toString()` 会暴露它，普通映射诊断也可能泄露凭据。应把凭据移出可打印值，或提供更安全的边界类型。' }
      - line: 4
        kind: correctness
        note: { en: 'The array component uses identity-based equality and hashing, so two signatures with identical bytes do not form equal record keys. Use an immutable content value or implement equality and hashing deliberately.', zh: '数组组件按身份参与相等与哈希，因此内容相同的两个签名无法形成相等记录键。应使用不可变内容值，或明确实现相等与哈希。' }
      - line: 6
        kind: edge-case
        note: { en: '`id.isBlank()` throws an accidental NullPointerException for null, and null paths fail later without a domain message. Validate all required inputs explicitly.', zh: '`id.isBlank()` 遇到 null 会意外抛出 NullPointerException，空 paths 也会稍后失败且没有领域消息。应显式校验所有必需输入。' }
      - line: 9
        kind: readability
        note: { en: 'The accessor performs normalization on every read while equality and `toString()` use the original field. Normalize in the constructor so the exposed state has one meaning.', zh: '访问器每次读取都做规范化，而相等性与 `toString()` 使用原始字段。应在构造器中规范化，让公开状态只有一种含义。' }
      - line: 16
        kind: performance
        note: { en: 'Hashing the whole request walks the potentially large paths list for every uncached hash calculation. Index by a small immutable key that contains only the lookup identity.', zh: '每次未缓存的哈希计算都会遍历可能很大的 paths 列表。应使用只包含查找身份的小型不可变键进行索引。' }
    explanation: { en: 'Separate credentials from printable state, normalize and null-check in the compact constructor, take immutable ownership of collections, and represent signature content with an immutable value or digest. Use a small dedicated record as the map key, then keep the full request as its value.', zh: '应把凭据与可打印状态分开，在紧凑构造器中规范化并检查空值，取得集合的不可变所有权，并用不可变值或摘要表示签名内容。映射键应使用专门的小型记录，完整请求则作为值保存。' }
    difficulty: advanced
    tags: [code-review, records, security, equality, performance]
