topic: java/fundamentals
items:
  - id: predict-short-circuit-path
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      import java.util.ArrayList;
      import java.util.List;

      public class Main {
          static boolean test(List<String> calls, String name, boolean result) {
              calls.add(name);
              return result;
          }

          public static void main(String[] args) {
              List<String> calls = new ArrayList<>();
              boolean ready = test(calls, "first", false)
                      && test(calls, "second", true);
              System.out.println(calls + " " + ready);
          }
      }
    lang: java
    options:
      - { text: { en: '[first] false', zh: '[first] false' }, correct: true }
      - { text: { en: '[first, second] false', zh: '[first, second] false' }, correct: false }
      - { text: { en: '[second] true', zh: '[second] true' }, correct: false }
      - { text: { en: 'The program does not compile.', zh: '程序无法编译。' }, correct: false }
    explanation: { en: 'The first operand returns false, so && does not evaluate the second operand. Only first is recorded and the complete expression is false.', zh: '第一个操作数返回false，因此 && 不会对第二个操作数求值。列表只记录first，整个表达式为false。' }
    difficulty: beginner
    tags: [short-circuit, evaluation-order]

  - id: definite-assignment-branch
    type: mcq
    prompt: { en: 'Which change makes a later read of a local variable definitely assigned?', zh: '哪项修改能让后续读取的局部变量满足明确赋值？' }
    options:
      - { text: { en: 'Assign it on only the true branch of an if.', zh: '只在if的true分支赋值。' }, correct: false }
      - { text: { en: 'Assign it on both branches that can reach the read.', zh: '在所有能够到达读取点的分支中赋值。' }, correct: true }
      - { text: { en: 'Declare it final without an initializer.', zh: '把它声明为没有初始化器的final变量。' }, correct: false }
      - { text: { en: 'Move the declaration outside the method.', zh: '把声明移到方法外。' }, correct: false }
    explanation: { en: 'The compiler needs proof that every path reaching the read has assigned the local. A path that returns or throws before the read does not need to assign it.', zh: '编译器必须证明每条能够到达读取点的路径都已给局部变量赋值。在读取前已经return或抛出异常的路径不需要赋值。' }
    difficulty: beginner
    tags: [definite-assignment, control-flow]

  - id: spotbug-array-upper-bound
    title: { en: 'Spot the bug in the total loop', zh: '找出合计循环里的bug' }
    type: spotbug
    prompt: { en: 'Find the boundary bug in this total calculation.', zh: '找出这段合计计算中的边界错误。' }
    code: |
      static int total(int[] values) {
          int sum = 0;
          for (int index = 0; index <= values.length; index++) {
              sum = Math.addExact(sum, values[index]);
          }
          return sum;
      }
    lang: java
    issues:
      - line: 3
        kind: edge-case
        note: { en: 'The condition admits index == values.length, which is outside the array and also fails immediately for an empty array.', zh: '条件允许index等于values.length，而该索引位于数组外；空数组也会立即失败。' }
    explanation: { en: 'Array indices form the half-open range 0 through length - 1, so the condition must be index < values.length. Tests should include empty and one-element arrays.', zh: '数组索引采用从0到length - 1的半开区间，因此条件必须是index < values.length。测试应包含空数组和单元素数组。' }
    difficulty: beginner
    tags: [loops, arrays, off-by-one]

  - id: switch-expression-block-result
    type: mcq
    prompt: { en: 'How does a block rule return a value from a Java switch expression?', zh: 'Java switch表达式的块规则怎样产生值？' }
    options:
      - { text: { en: 'Use yield with the value.', zh: '使用yield携带该值。' }, correct: true }
      - { text: { en: 'Use break with the value.', zh: '使用break携带该值。' }, correct: false }
      - { text: { en: 'Assign to the switch keyword.', zh: '给switch关键字赋值。' }, correct: false }
      - { text: { en: 'Every block rule returns null automatically.', zh: '每个块规则都会自动返回null。' }, correct: false }
    explanation: { en: 'An expression rule supplies its value directly, while a block rule uses yield. Ordinary break does not carry a switch-expression result.', zh: '表达式规则直接提供值，块规则则使用yield。普通break不能携带switch表达式的结果。' }
    difficulty: beginner
    tags: [switch-expression, yield]

  - id: review-generated-batch-planner
    title: { en: 'Review generated batch label planner', zh: '审查生成的批次标签规划器' }
    type: review
    prompt: { en: 'Review this generated batch-label planner before it processes production orders.', zh: '在这段生成的批次标签规划代码处理生产订单前，对它进行审查。' }
    task: { en: 'Preserve input order; reject negative item counts; label zero as empty, 1-10 as small, and values above 10 as large; append -rush to priority orders.', zh: '保持输入顺序；拒绝负数商品数；把0标为empty、1到10标为small、大于10标为large；优先订单追加 -rush。' }
    code: |
      import java.util.List;

      record Order(String id, int itemCount, boolean priority) {}

      class BatchPlanner {
          static List<String> plan(List<Order> orders) {
              var labels = new java.util.ArrayList<String>();
              for (int index = 0; index <= orders.size(); index++) {
                  Order order = orders.get(index);
                  String band;
                  if (order.itemCount() > 0) {
                      band = "small";
                  } else if (order.itemCount() > 10) {
                      band = "large";
                  } else {
                      band = "empty";
                  }
                  labels.add(order.id() + ":" + band
                          + (order.priority() ? "-rush" : ""));
              }
              return labels;
          }
      }
    lang: java
    right: { en: 'The record gives the inputs domain names, the method returns a fresh result list, and the forward traversal shows an intention to preserve input order.', zh: '记录类型为输入提供了领域名称，方法返回新的结果列表，正向遍历也体现了保持输入顺序的意图。' }
    checklist:
      - { en: 'Test empty, one-order, negative, zero, 10, and 11-item inputs.', zh: '测试空输入、单订单、负数、0、10和11件商品。' }
      - { en: 'Trace branch reachability before accepting the category labels.', zh: '接受分类标签前，跟踪每个分支是否可达。' }
      - { en: 'Check loop bounds independently from branch correctness.', zh: '把循环边界与分支正确性分开检查。' }
      - { en: 'Run with both array-backed and linked List implementations when indexed access is used.', zh: '使用索引访问时，同时用数组型与链表型List实现运行。' }
    issues:
      - line: 8
        kind: edge-case
        note: { en: 'The <= bound performs one extra iteration and calls get(size), so every input eventually throws IndexOutOfBoundsException.', zh: '<= 上界会多执行一轮并调用get(size)，因此任何输入最终都会抛出IndexOutOfBoundsException。' }
      - line: 9
        kind: performance
        note: { en: 'Repeated indexed get on an arbitrary List can make traversal quadratic for a linked implementation; enhanced for expresses sequential traversal without that cost.', zh: '对任意List重复按索引get，可能让链表实现的遍历变成二次复杂度；增强for能表达顺序遍历并避开该代价。' }
      - line: 11
        kind: correctness
        note: { en: 'The first condition captures every positive count, so the > 10 branch is unreachable and large orders are mislabeled; negative counts also fall through as empty instead of being rejected.', zh: '第一个条件捕获了所有正数，因此 > 10分支不可达，大订单会被错误标记；负数也会落入empty，而不是被拒绝。' }
      - line: 18
        lines: 2
        kind: readability
        note: { en: 'Category formatting and the priority suffix are compressed into one concatenation, making the output contract harder to inspect and extend.', zh: '分类格式与优先后缀被压进同一个拼接表达式，使输出契约更难检查与扩展。' }
    explanation: { en: 'Use enhanced for, reject negatives with a guard clause, and classify the remaining values in ordered, non-overlapping branches or a switch expression. Compute the suffix or final label with a name when that keeps the contract visible.', zh: '应使用增强for，通过卫语句拒绝负数，再用有序且互不重叠的分支或switch表达式分类其余值。若具名后缀或最终标签能让契约更清楚，就应拆开计算。' }
    difficulty: intermediate
    tags: [code-review, loops, branches, boundaries]
