topic: java/interfaces
items:
  - id: predict-class-method-wins
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      public class Main {
          static class Parent {
              public String name() { return "class"; }
          }

          interface Named {
              default String name() { return "interface"; }
          }

          static final class Child extends Parent implements Named {}

          public static void main(String[] args) {
              Named value = new Child();
              System.out.println(value.name());
          }
      }
    lang: java
    options:
      - { text: { en: '`class`', zh: '`class`' }, correct: true }
      - { text: { en: '`interface`', zh: '`interface`' }, correct: false }
      - { text: { en: 'It fails to compile because both methods are candidates.', zh: '编译失败，因为两个方法都是候选。' }, correct: false }
      - { text: { en: 'It throws `IncompatibleClassChangeError`.', zh: '程序抛出 `IncompatibleClassChangeError`。' }, correct: false }
    explanation: { en: 'A concrete class or superclass instance method takes precedence over an interface default. The interface-typed reference does not change runtime dispatch.', zh: '类或父类中的具体实例方法优先于接口默认方法；接口类型的引用不会改变运行时分派。' }
    difficulty: beginner
    tags: [default-methods, dispatch, predict-output]

  - id: interface-field-mutability
    type: mcq
    prompt: { en: 'What is true of `List<String> EVENTS = new ArrayList<>();` declared in an interface?', zh: '在接口中声明 `List<String> EVENTS = new ArrayList<>();`，哪项描述正确？' }
    options:
      - { text: { en: 'The reference is public, static, and final, but callers can still mutate the list.', zh: '引用是 public、static、final，但调用方仍能修改该列表。' }, correct: true }
      - { text: { en: 'Every implementing object receives an independent list.', zh: '每个实现对象都会得到一份独立列表。' }, correct: false }
      - { text: { en: 'The declaration is illegal because interface fields cannot use constructors.', zh: '该声明非法，因为接口字段不能调用构造器。' }, correct: false }
      - { text: { en: 'The list and all of its elements become deeply immutable.', zh: '该列表及其中所有元素都会变成深度不可变。' }, correct: false }
    explanation: { en: '`final` prevents assigning another list to the field; it does not freeze the referenced object. The field is shared global state exposed through the interface.', zh: '`final` 只阻止字段改为引用另一份列表，不会冻结所指对象；该字段是接口公开的共享全局状态。' }
    difficulty: beginner
    tags: [interface-fields, final, mutability]

  - id: spotbug-conflicting-defaults
    type: spotbug
    prompt: { en: 'Find why this class does not compile.', zh: '找出这个类无法编译的原因。' }
    code: |
      public class Main {
          interface Fast {
              default String mode() { return "fast"; }
          }

          interface Safe {
              default String mode() { return "safe"; }
          }

          static final class Transfer implements Fast, Safe {}
      }
    lang: java
    issues:
      - line: 10
        kind: correctness
        note: { en: '`Fast` and `Safe` are unrelated and provide override-equivalent defaults. `Transfer` must override `mode()` and may delegate with `Fast.super.mode()` or `Safe.super.mode()`.', zh: '`Fast` 与 `Safe` 互不相关，却提供了覆盖等价的默认方法。`Transfer` 必须覆盖 `mode()`，覆盖体可用 `Fast.super.mode()` 或 `Safe.super.mode()` 委托。' }
    explanation: { en: 'Java does not choose an arbitrary default from unrelated interfaces. An explicit override makes the implementing class own the resolution.', zh: 'Java 不会在无关接口之间随意选择默认实现；显式覆盖让实现类负责解决冲突。' }
    difficulty: intermediate
    tags: [default-methods, conflict-resolution, compilation]

  - id: functional-interface-method-count
    type: mcq
    prompt: { en: 'Which change definitely makes a valid functional interface stop being a functional interface?', zh: '哪项改动一定会让有效的函数式接口不再是函数式接口？' }
    options:
      - { text: { en: 'Add a second abstract method with a different signature.', zh: '增加一个签名不同的第二抽象方法。' }, correct: true }
      - { text: { en: 'Add a default method.', zh: '增加一个默认方法。' }, correct: false }
      - { text: { en: 'Add a static factory method.', zh: '增加一个静态工厂方法。' }, correct: false }
      - { text: { en: 'Add the `@FunctionalInterface` annotation.', zh: '增加 `@FunctionalInterface` 注解。' }, correct: false }
    explanation: { en: 'A functional interface has one abstract method contract after the language rules merge equivalent methods and exclude relevant `Object` methods. Default and static methods do not add abstract contracts.', zh: '按语言规则合并等价方法并排除相关 `Object` 方法后，函数式接口只有一个抽象方法契约；默认方法与静态方法不会增加抽象契约。' }
    difficulty: intermediate
    tags: [functional-interface, sam, lambdas]

  - id: review-generated-token-authorizer
    type: review
    prompt: { en: 'Review this generated token-authorization abstraction before it is used at an API boundary.', zh: '审查这段生成的令牌授权抽象，判断它能否用于 API 边界。' }
    task: { en: 'Reject missing tokens, retain no token values, return whether any token in a batch is authorized, preserve operational failures, and remain efficient as traffic grows.', zh: '拒绝缺失令牌，不保留令牌值，返回批次中是否存在获授权令牌，保留运行故障信息，并在流量增长时保持效率。' }
    code: |
      import java.util.ArrayList;
      import java.util.List;

      public class GeneratedAccess {
          @FunctionalInterface
          interface TokenAuthorizer {
              List<String> SEEN_TOKENS = new ArrayList<>();
              boolean authorize(String token);
              default boolean authorizeSafely(String token) {
                  if (token == null || token.isBlank()) return true;
                  try {
                      if (!SEEN_TOKENS.contains(token)) SEEN_TOKENS.add(token);
                      return authorize(token);
                  } catch (RuntimeException ignored) {
                      return false;
                  }
              }
          }
          static boolean anyAuthorized(TokenAuthorizer authorizer, List<String> tokens) {
              boolean authorized = false;
              for (String token : tokens) {
                  authorized = authorizer.authorizeSafely(token);
              }
              return authorized;
          }
      }
    lang: java
    right: { en: 'The code depends on a narrow interface, keeps one abstract method so lambdas remain possible, and returns a Boolean result instead of printing from the batch method.', zh: '代码依赖范围较小的接口，只保留一个抽象方法以支持 Lambda，并从批处理方法返回布尔结果而不是直接输出。' }
    checklist:
      - { en: 'Test null, blank, valid, and invalid tokens without logging or retaining their values.', zh: '测试 null、空白、有效与无效令牌，并确认其值没有被记录或保留。' }
      - { en: 'Test batches whose authorized token appears first, middle, last, or not at all, plus an empty batch.', zh: '测试获授权令牌位于开头、中间、末尾和完全不存在的批次，并测试空批次。' }
      - { en: 'Inject an authorizer that throws and verify the failure reaches the owning error boundary with its cause intact.', zh: '注入会抛出异常的授权器，确认故障及其原因能到达负责处理错误的边界。' }
      - { en: 'Run concurrent requests and inspect every interface field and collection for shared mutable state.', zh: '运行并发请求，检查每个接口字段与集合是否形成共享可变状态。' }
    issues:
      - line: 7
        kind: security
        note: { en: '`SEEN_TOKENS` is a public, process-wide mutable list of raw credentials. Remove token retention entirely; `final` protects only the list reference.', zh: '`SEEN_TOKENS` 是公开的进程级可变列表，会保存原始凭据。应彻底删除令牌留存；`final` 只保护列表引用。' }
      - line: 10
        kind: edge-case
        note: { en: 'The missing-token branch authorizes null and blank credentials, the opposite of the task. It must return false or fail through the documented authentication path.', zh: '缺失令牌分支把 null 与空白凭据判为获授权，与任务要求相反；它必须返回 false，或进入文档规定的认证失败路径。' }
      - line: 12
        kind: performance
        note: { en: 'Linear `contains` followed by `add` makes retained-token processing grow with all prior traffic, and the list is unbounded. Removing retention fixes both the data leak and this cost.', zh: '线性 `contains` 再接 `add` 的成本会随全部历史流量增长，而且列表没有上限。删除令牌留存能同时修复数据泄漏与此处成本。' }
      - line: 14
        kind: readability
        note: { en: 'Catching every `RuntimeException` and discarding it hides verifier outages and programming defects behind an ordinary denial. Preserve or deliberately translate failures at the error boundary that owns the policy.', zh: '捕获所有 `RuntimeException` 并丢弃异常，会把验证器故障与编程缺陷伪装成普通拒绝；应在拥有策略的错误边界保留或明确转换故障。' }
      - line: 22
        kind: correctness
        note: { en: 'Each iteration overwrites the previous result, so the method reports only whether the last token is authorized. Return on the first true result or accumulate with logical OR.', zh: '每次迭代都会覆盖先前结果，因此方法只报告最后一个令牌是否获授权；应在首次得到 true 时返回，或使用逻辑或累积。' }
    explanation: { en: 'Keep credentials out of interface fields, make missing-input and exception policies explicit, and implement the requested any-match behavior. A narrow type alone does not make the default behavior safe.', zh: '应避免在接口字段中保存凭据，明确缺失输入与异常策略，并实现要求的任意匹配语义；类型范围较小并不能保证默认行为安全。' }
    difficulty: advanced
    tags: [code-review, interfaces, security, default-methods]
