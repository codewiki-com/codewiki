topic: java/inner-classes
items:
  - id: predict-enclosing-instance
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      public class Main {
          private final String region;

          Main(String region) { this.region = region; }

          class Label {
              String value() { return Main.this.region + "/live"; }
          }

          static class Snapshot {
              String value() { return "archive"; }
          }

          public static void main(String[] args) {
              Main owner = new Main("north");
              System.out.println(owner.new Label().value());
              System.out.println(new Main.Snapshot().value());
          }
      }
    lang: java
    options:
      - { text: { en: "north/live\narchive", zh: "north/live\narchive" }, correct: true }
      - { text: { en: "live\nnorth/archive", zh: "live\nnorth/archive" }, correct: false }
      - { text: { en: 'Compilation fails because Label cannot read a private field.', zh: '编译失败，因为 Label 不能读取 private 字段。' }, correct: false }
      - { text: { en: 'Compilation fails because Snapshot needs a Main object.', zh: '编译失败，因为 Snapshot 需要 Main 对象。' }, correct: false }
    explanation: { en: 'The Label object has owner as its enclosing instance and reads owner.region. Snapshot is static and can be created without a Main instance.', zh: 'Label 对象以 owner 为外围实例，并读取 owner.region。Snapshot 是静态嵌套类，不需要 Main 实例即可创建。' }
    difficulty: beginner
    tags: [enclosing-instance, creation-syntax]

  - id: distinguish-nested-and-inner
    type: mcq
    prompt: { en: 'Which statement uses the Java 25 specification terms correctly?', zh: '哪项陈述正确使用了 Java 25 规范术语？' }
    options:
      - { text: { en: 'A static member class is nested but is not an inner class.', zh: '静态成员类是嵌套类，但不是内部类。' }, correct: true }
      - { text: { en: 'Every nested class has an enclosing instance.', zh: '每个嵌套类都有外围实例。' }, correct: false }
      - { text: { en: 'A local normal class is never an inner class.', zh: '局部普通类从来不是内部类。' }, correct: false }
      - { text: { en: 'A nested record is a non-static member inner class.', zh: '嵌套记录类是非静态成员内部类。' }, correct: false }
    explanation: { en: 'Nested is the broad category. A class is inner only when it is not explicitly or implicitly static; nested records are implicitly static.', zh: '嵌套类是上位类别。只有没有显式或隐式 static 的嵌套类才是内部类；嵌套记录类隐式为 static。' }
    difficulty: beginner
    tags: [terminology, static-nested-class]

  - id: spotbug-missing-enclosing-instance
    title: { en: 'Spot the bug in the inner-class factory', zh: '找出内部类工厂里的 bug' }
    type: spotbug
    prompt: { en: 'Find why this static factory does not compile.', zh: '找出这个静态工厂无法编译的原因。' }
    code: |
      class Catalog {
          private final String name = "summer";

          class Entry {
              String label() { return name; }
          }

          static Entry first() {
              return new Entry();
          }
      }
    lang: java
    issues:
      - line: 9
        kind: correctness
        note: { en: 'Entry is a non-static member inner class, but this static context has no Catalog instance to use as its enclosing instance.', zh: 'Entry 是非静态成员内部类，但静态上下文中没有可作为外围实例的 Catalog 对象。' }
    explanation: { en: 'Accept a Catalog and use owner.new Entry(), make the factory an instance method, or make Entry static and pass the data it needs. The right choice depends on whether Entry belongs to one Catalog object.', zh: '可以接收 Catalog 并使用 owner.new Entry()，把工厂改为实例方法，或把 Entry 改成静态嵌套类并显式传入数据。应根据 Entry 是否属于某个 Catalog 对象作出选择。' }
    difficulty: intermediate
    tags: [static-context, compilation]

  - id: captured-mutable-object
    type: mcq
    prompt: { en: 'A local class captures List<String> events. Which operation is allowed while events remains effectively final?', zh: '局部类捕获 List<String> events 时，哪项操作在 events 保持实际 final 的情况下合法？' }
    options:
      - { text: { en: 'Call events.add("sent") without reassigning events.', zh: '调用 events.add("sent")，但不重新赋值 events。' }, correct: true }
      - { text: { en: 'Assign events = new ArrayList<>() after creating the local class.', zh: '创建局部类后执行 events = new ArrayList<>()。' }, correct: false }
      - { text: { en: 'Reassign events only inside an unreachable branch.', zh: '只在不可达分支中重新赋值 events。' }, correct: false }
      - { text: { en: 'Increment a captured int with count++ without a holder.', zh: '不使用容器，直接对捕获的 int 执行 count++。' }, correct: false }
    explanation: { en: 'Effectively final restricts assignment to the local variable, not mutation of the object it denotes. Any relevant reassignment makes the capture illegal at compile time.', zh: '实际 final 限制的是局部变量赋值，不是修改该变量所指对象。出现相关的重新赋值后，捕获会在编译期被拒绝。' }
    difficulty: intermediate
    tags: [effectively-final, mutation, capture]

  - id: review-generated-job-callbacks
    title: { en: 'Review generated job callback factory', zh: '审查生成的任务回调工厂' }
    type: review
    prompt: { en: 'Review this generated callback factory.', zh: '审查这个生成的回调工厂。' }
    task: { en: 'Build one repeatable Runnable per nonblank job ID, preserve input order, bind the tenant and ID at creation, avoid retaining the factory or source list, and return an unmodifiable result.', zh: '为每个非空白任务 ID 构建一个可重复调用的 Runnable，保持输入顺序，在创建时绑定租户和 ID，不保留工厂或源列表，并返回不可修改的结果。' }
    code: |
      import java.util.ArrayList;
      import java.util.List;
      class CallbackFactory {
          private final String tenant;
          CallbackFactory(String tenant) { this.tenant = tenant; }
          List<Runnable> callbacks(List<String> jobIds) {
              var result = new ArrayList<Runnable>();
              int[] cursor = {0};
              for (String jobId : jobIds) {
                  result.add(new Runnable() {
                      @Override
                      public void run() {
                          dispatch(tenant,
                                  jobIds.get(cursor[0]++));
                      }
                  });
              }
              return result;
          }
          static void dispatch(String tenant, String jobId) {
              System.out.println(tenant + ":" + jobId);
          }
      }
    lang: java
    right: { en: 'The code preserves registration order, returns the interface type Runnable, keeps dispatch in one helper, and uses @Override to let the compiler verify the callback method.', zh: '代码保留注册顺序，以接口类型 Runnable 返回回调，把派发集中在一个辅助方法中，并使用 @Override 让编译器检查回调方法。' }
    issues:
      - line: 14
        kind: correctness
        note: { en: 'Every callback shares one cursor, so the selected ID depends on invocation order; repeated calls eventually throw instead of dispatching the callback’s fixed ID.', zh: '所有回调共享一个 cursor，因此所选 ID 取决于调用顺序；重复调用最终会抛出异常，而不是派发该回调固定的 ID。' }
      - line: 9
        kind: edge-case
        note: { en: 'The loop accepts null and blank IDs even though the task requires rejection, and a null source list also fails without a stated boundary policy.', zh: '循环会接受 null 和空白 ID，与任务要求不符；源列表为 null 时也会在没有明确边界策略的情况下失败。' }
      - line: 8
        kind: readability
        note: { en: 'The one-element array exists only to evade effectively-final capture and hides mutable state shared by otherwise independent callbacks.', zh: '单元素数组只是为了绕过实际 final 捕获限制，并隐藏了本应彼此独立的回调所共享的可变状态。' }
      - line: 13
        lines: 2
        kind: performance
        note: { en: 'Reading the instance field retains CallbackFactory through the anonymous inner object, while indexing jobIds retains the entire mutable source list; both violate the requested lifetime.', zh: '读取实例字段会让匿名内部类保留 CallbackFactory，通过索引 jobIds 又会保留整个可变源列表；两者都违反要求的生命周期。' }
    checklist:
      - { en: 'Run callbacks out of order and invoke each callback twice.', zh: '打乱顺序运行回调，并把每个回调调用两次。' }
      - { en: 'Test null, blank, duplicate, and mutable job IDs and define the rejection policy.', zh: '测试 null、空白、重复和可变任务 ID，并明确拒绝策略。' }
      - { en: 'Trace enclosing-instance and captured-variable reference paths for each returned object.', zh: '跟踪每个返回对象的外围实例与捕获变量引用路径。' }
      - { en: 'Attempt to modify the returned list and mutate the source list after creation.', zh: '尝试修改返回列表，并在创建回调后修改源列表。' }
    explanation: { en: 'Validate IDs first, copy the tenant to a local value if needed, and create each callback from its loop-local jobId. Return List.copyOf(result); a static nested implementation can make the absence of an enclosing factory explicit.', zh: '应先校验 ID，必要时把 tenant 复制到局部值，并让每个回调捕获当轮 jobId。最后返回 List.copyOf(result)；静态嵌套实现还能明确表示不存在外围工厂对象。' }
    difficulty: advanced
    tags: [code-review, capture, lifecycle, anonymous-classes]
