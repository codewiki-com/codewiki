topic: java/type-erasure
items:
  - id: predict-shared-runtime-class
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      import java.util.ArrayList;

      public class Main {
          public static void main(String[] args) {
              var names = new ArrayList<String>();
              var counts = new ArrayList<Integer>();
              System.out.println(names.getClass() == counts.getClass());
              System.out.println(names.getClass().getSimpleName());
          }
      }
    lang: java
    options:
      - { text: { en: '`true`, then `ArrayList`', zh: '先输出 `true`，再输出 `ArrayList`' }, correct: true }
      - { text: { en: '`false`, then `ArrayList<String>`', zh: '先输出 `false`，再输出 `ArrayList<String>`' }, correct: false }
      - { text: { en: '`true`, then `List`', zh: '先输出 `true`，再输出 `List`' }, correct: false }
      - { text: { en: 'It does not compile because the types differ.', zh: '由于类型不同，代码无法编译。' }, correct: false }
    explanation: { en: 'Both parameterizations use the same runtime `ArrayList` class. The type arguments affect compile-time checks, not the identity returned by `getClass()`.', zh: '两种参数化形式使用同一个运行时 `ArrayList` 类。类型实参影响编译期检查，不影响 `getClass()` 返回的类身份。' }
    difficulty: beginner
    tags: [runtime-class, parameterized-types]

  - id: leftmost-bound-erasure
    type: mcq
    prompt: { en: 'What is the erasure of `T` in `T extends CharSequence & Comparable<T>`?', zh: '`T extends CharSequence & Comparable<T>` 中 `T` 的擦除类型是什么？' }
    options:
      - { text: { en: '`CharSequence`', zh: '`CharSequence`' }, correct: true }
      - { text: { en: '`Comparable`', zh: '`Comparable`' }, correct: false }
      - { text: { en: '`Object`', zh: '`Object`' }, correct: false }
      - { text: { en: 'A new intersection class generated by the compiler', zh: '编译器生成的一个新交叉类型类' }, correct: false }
    explanation: { en: 'A type variable erases to its leftmost bound. Later intersection bounds still constrain source typing but do not become the erased JVM type.', zh: '类型变量会擦除为最左边界。后续交叉边界仍约束源码类型，却不会成为擦除后的 JVM 类型。' }
    difficulty: intermediate
    tags: [bounds, erased-signature]

  - id: spotbug-unchecked-list-cast
    title: { en: 'Spot the bug in the generic list helper', zh: '找出泛型列表函数里的 bug' }
    type: spotbug
    prompt: { en: 'Find why this helper does not establish that every returned element is a `T`.', zh: '找出这个辅助函数为何无法保证返回列表的每个元素都是 `T`。' }
    code: |
      import java.util.List;

      public class Main {
          @SuppressWarnings("unchecked")
          static <T> List<T> castList(Object value) {
              if (!(value instanceof List<?>)) {
                  throw new IllegalArgumentException("not a list");
              }
              return (List<T>) value;
          }
      }
    lang: java
    issues:
      - line: 9
        kind: correctness
        note: { en: 'The cast checks only the raw `List` class and cannot validate `T` after erasure. Accept an element `Class<T>` or parser and validate every element before returning.', zh: '这个转换只检查原始 `List` 类，擦除后无法验证 `T`。应接收元素的 `Class<T>` 或解析器，并在返回前逐个验证元素。' }
    explanation: { en: 'An unchecked conversion can make a generic signature look precise without proving its element invariant. Failure is deferred until a caller reads an element through an inserted cast.', zh: '未经检查的转换能让泛型签名看起来很精确，却没有证明元素不变量。错误会延迟到调用方通过编译器插入的转换读取元素时。' }
    difficulty: intermediate
    tags: [unchecked-cast, heap-pollution]

  - id: bridge-method-reflection
    type: mcq
    prompt: { en: 'A class implements `Decoder<Integer>` by declaring `Integer decode(String)`. Why may reflection also report `Object decode(String)`?', zh: '某个类以 `Integer decode(String)` 实现 `Decoder<Integer>`。为什么反射还可能看到 `Object decode(String)`？' }
    options:
      - { text: { en: 'The compiler generated a bridge method to preserve dispatch through the erased interface signature.', zh: '编译器生成桥接方法，以保持通过擦除后接口签名进行的分派。' }, correct: true }
      - { text: { en: 'Reflection synthesizes an overload every time methods are queried.', zh: '反射每次查询方法时都会合成一个重载。' }, correct: false }
      - { text: { en: '`Object` is inferred from the string argument at runtime.', zh: '运行时根据字符串实参推断出了 `Object`。' }, correct: false }
      - { text: { en: 'Java permits overloading methods by return type alone.', zh: 'Java 允许只按返回类型重载方法。' }, correct: false }
    explanation: { en: 'The interface return type erases to `Object`, while the implementation has the covariant return `Integer`. The compiler emits a bridge entry and marks it as bridge and synthetic.', zh: '接口返回类型擦除为 `Object`，实现则使用协变返回类型 `Integer`。编译器会生成入口，并把它标记为 bridge 和 synthetic。' }
    difficulty: intermediate
    tags: [bridge-methods, reflection, dispatch]

  - id: review-generated-decoder
    type: review
    title: { en: 'Review a generated decoder adapter', zh: '审查生成的解码适配器' }
    prompt: { en: 'Review this generated adapter before it processes external payloads.', zh: '在这段生成的适配器处理外部载荷前进行审查。' }
    task: { en: 'Invoke one allowlisted decoder with an explicit input and complete output type, preserve useful failures, and reuse validated reflection metadata and stateless decoder instances.', zh: '调用允许列表中的一个解码器，显式表达输入类型与完整输出类型，保留有用的失败信息，并复用已验证的反射元数据和无状态解码器实例。' }
    code: |
      import java.lang.reflect.Method;
      import java.util.List;

      public class GeneratedDecoder {
          @SuppressWarnings("unchecked")
          static List<String> decodeNames(
                  String className, String methodName, Object input) {
              try {
                  Class<?> type = Class.forName(className);
                  Object codec = type.getDeclaredConstructor().newInstance();
                  Method method = type.getDeclaredMethod(methodName, input.getClass());
                  method.setAccessible(true);
                  Object result = method.invoke(codec, input);
                  return (List<String>) result;
              } catch (Exception error) {
                  return null;
              }
          }
      }
    lang: java
    right: { en: 'The code keeps reflection inside one adapter, asks for an exact one-argument method, stores the raw invocation result before conversion, and attempts to handle reflective failures at the boundary.', zh: '代码把反射集中在一个适配器中，查找精确的单参数方法，在转换前保存原始调用结果，并尝试在边界处理反射失败。' }
    checklist:
      - { en: 'Try unapproved class and method names and confirm the registry denies them.', zh: '尝试未获允许的类名和方法名，确认注册表会拒绝它们。' }
      - { en: 'Test null, interface-typed, primitive, overloaded, and nested generic values.', zh: '测试 null、接口类型、基本类型、重载和嵌套泛型值。' }
      - { en: 'Return a list containing one wrong element and follow the complete consumer path.', zh: '返回包含一个错误元素的列表，并执行完整消费路径。' }
      - { en: 'Make lookup and target code fail, then inspect public error categories and original causes.', zh: '让查找与目标代码失败，再检查公开错误类别和原始原因。' }
    issues:
      - line: 9
        kind: security
        note: { en: 'External class and method names can select arbitrary reachable code. Map a bounded decoder ID to a prevalidated class, method, and access policy.', zh: '外部类名和方法名可以选择任意可达代码。应把有限解码器 ID 映射到预先验证的类、方法和访问策略。' }
      - line: 10
        kind: performance
        note: { en: 'Every call constructs a decoder, even when its stateless contract permits reuse. Resolve method metadata and instance lifetime once when building the registry.', zh: '每次调用都会构造解码器，即使无状态契约允许复用。应在构建注册表时一次性解析方法元数据和实例生命周期。' }
      - line: 11
        kind: edge-case
        note: { en: '`input.getClass()` fails for null and cannot match a declared primitive, interface, or superclass parameter. Carry the exact allowed input signature in the registry.', zh: '`input.getClass()` 遇到 null 会失败，也无法匹配声明为基本类型、接口或父类的形参。应在注册表中携带精确且允许的输入签名。' }
      - line: 14
        kind: correctness
        note: { en: 'Casting to `List<String>` validates only the raw list class, not its elements. The decoder contract needs a complete `Type` plus element validation.', zh: '转换为 `List<String>` 只验证原始列表类，不验证元素。解码器契约需要完整 `Type` 和元素验证。' }
      - line: 16
        kind: readability
        note: { en: 'Returning null erases the difference between a valid null result, lookup failure, access denial, and target exception. Preserve the cause and translate failures explicitly.', zh: '返回 null 会抹去合法空结果、查找失败、访问拒绝和目标异常之间的区别。应保留原因并明确转换失败。' }
    explanation: { en: 'Replace string-selected reflection with a small registry of validated decoder plans. Each plan owns the exact method signature, complete output `Type`, instance lifetime, validation, and failure translation.', zh: '应以一组已验证的解码计划替代字符串选择的反射。每个计划负责精确方法签名、完整输出 `Type`、实例生命周期、验证和失败转换。' }
    difficulty: advanced
    tags: [code-review, type-tokens, reflection, unchecked-cast]
