topic: java/wildcards-pecs
items:
  - id: predict-pecs-append
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      import java.util.ArrayList;
      import java.util.List;

      public class Main {
          static <T> void append(
                  List<? super T> destination,
                  List<? extends T> source) {
              destination.addAll(source);
          }

          public static void main(String[] args) {
              List<Number> report = new ArrayList<>(List.of(0.5));
              append(report, List.of(2, 4));
              System.out.println(report);
          }
      }
    lang: java
    options:
      - { text: { en: '`[0.5, 2, 4]`', zh: '`[0.5, 2, 4]`' }, correct: true }
      - { text: { en: '`[2, 4]`', zh: '`[2, 4]`' }, correct: false }
      - { text: { en: '`[0.5, 2.0, 4.0]`', zh: '`[0.5, 2.0, 4.0]`' }, correct: false }
      - { text: { en: 'It fails to compile because the list element types differ.', zh: '编译失败，因为两个列表的元素类型不同。' }, correct: false }
    explanation: { en: 'The integer source produces values accepted by the Number destination. `addAll` preserves the existing element and does not convert the integers to doubles.', zh: '整数源列表生产的值可由 Number 目标列表接收。`addAll` 会保留已有元素，也不会把整数转换成浮点数。' }
    difficulty: intermediate
    tags: [pecs, predict-output, type-inference]

  - id: upper-bound-safe-read
    type: mcq
    prompt: { en: 'Given `List<? extends Number> values`, which operation is guaranteed to type-check?', zh: '给定 `List<? extends Number> values`，哪项操作一定能通过类型检查？' }
    options:
      - { text: { en: '`Number value = values.get(0);`', zh: '`Number value = values.get(0);`' }, correct: true }
      - { text: { en: '`values.add(1);`', zh: '`values.add(1);`' }, correct: false }
      - { text: { en: '`Integer value = values.get(0);`', zh: '`Integer value = values.get(0);`' }, correct: false }
      - { text: { en: '`List<Number> copy = values;`', zh: '`List<Number> copy = values;`' }, correct: false }
    explanation: { en: 'Every possible captured element type is a subtype of Number, so reads are safe as Number. The exact subtype is unknown, which blocks non-null writes and narrower reads.', zh: '所有可能的捕获元素类型都是 Number 的子类型，因此可安全读取为 Number。具体子类型未知，所以不能写入非 null 值，也不能按更窄类型读取。' }
    difficulty: beginner
    tags: [upper-bounded-wildcard, capabilities]

  - id: spotbug-reversed-pecs
    title: { en: 'Spot the bug in the wildcard copy method', zh: '找出通配符复制方法里的 bug' }
    type: spotbug
    prompt: { en: 'Find why this generated copy method cannot compile.', zh: '找出这段生成的复制方法无法编译的原因。' }
    code: |
      import java.util.List;

      public class GeneratedCopy {
          static <T> void copy(
                  List<? extends T> destination,
                  List<? super T> source) {
              destination.add(source.getFirst());
          }
      }
    lang: java
    issues:
      - line: 7
        kind: correctness
        note: { en: 'The bounds are reversed. The source can be read only as Object and the destination cannot accept a non-null T; declare the source with `extends` and the destination with `super`.', zh: '两个边界写反了。源列表只能读取为 Object，目标列表也不能接收非 null 的 T；源应使用 `extends`，目标应使用 `super`。' }
    explanation: { en: 'PECS describes data flow relative to the method: the source produces T and the destination consumes T. Reversing the bounds removes both required capabilities.', zh: 'PECS 描述参数相对于当前方法的数据流：源生产 T，目标消费 T。反转边界会同时删除两端所需能力。' }
    difficulty: intermediate
    tags: [spotbug, pecs, compiler-error]

  - id: capture-helper-purpose
    type: mcq
    prompt: { en: 'Why can a private `<T> void swap(List<T> values, ...)` helper accept a `List<?>` from a public method?', zh: '为什么私有的 `<T> void swap(List<T> values, ...)` 辅助方法能接收公开方法传入的 `List<?>`？' }
    options:
      - { text: { en: 'Invocation inference names the one captured element type for that helper call.', zh: '调用类型推断会为这次辅助调用命名同一个捕获元素类型。' }, correct: true }
      - { text: { en: 'The JVM inspects every list element and chooses their common runtime class.', zh: 'JVM 会检查列表中的每个元素，并选择共同的运行时类。' }, correct: false }
      - { text: { en: 'Every unbounded wildcard is replaced with Object before source checking.', zh: '源码检查前，每个无界通配符都会替换成 Object。' }, correct: false }
      - { text: { en: 'The helper silently performs an unchecked cast.', zh: '辅助方法会静默执行一次未检查转换。' }, correct: false }
    explanation: { en: 'Capture conversion introduces one fresh internal type for the wildcard expression. The helper names it as T and can safely write back values read from that same list.', zh: '捕获转换会为该通配符表达式引入一个新的内部类型。辅助方法把它命名为 T，因此能把从同一列表读出的值安全写回。' }
    difficulty: advanced
    tags: [wildcard-capture, type-inference]

  - id: review-generated-transfer
    type: review
    title: { en: 'Review a generated wildcard transfer', zh: '审查生成的通配符传输方法' }
    prompt: { en: 'Review this generated collection utility before it becomes a shared API.', zh: '在这段生成的集合工具成为共享 API 前进行审查。' }
    task: { en: 'Append accepted source values not already present in the destination, preserve source encounter order, never mutate the source, handle an empty source, and keep the method silent.', zh: '把目标中尚不存在且通过检查的源值追加到目标，保持源的出现顺序，不得修改源，支持空源，并让方法保持静默。' }
    code: |
      import java.util.List;
      import java.util.function.Predicate;

      public class GeneratedTransfer {
          static <T> int copyUnique(
                  List<? extends T> source,
                  List<? super T> destination,
                  Predicate<? super T> accepted) {
              T first = source.getFirst();
              source.sort(null);

              int copied = 0;
              for (T value : source) {
                  if (accepted.test(value)
                          && !destination.contains(value)) {
                      destination.add(value);
                      copied++;
                  }
              }
              System.out.println("first=" + first);
              return copied;
          }
      }
    lang: java
    right: { en: 'The signature applies PECS correctly, accepts a predicate for a supertype of T, writes without raw types or unchecked casts, and returns a useful copy count.', zh: '签名正确应用了 PECS，可接收针对 T 父类型的谓词，不使用原始类型或未检查转换就能写入，并返回有用的复制数量。' }
    checklist:
      - { en: 'Run empty, singleton, duplicate-heavy, and already-populated destination cases.', zh: '运行空源、单元素、大量重复值和目标已有元素的用例。' }
      - { en: 'Snapshot source contents and order, then compare them after the call.', zh: '调用前保存源内容与顺序快照，调用后进行比较。' }
      - { en: 'Test mutable and unmodifiable source and destination implementations.', zh: '测试可修改与不可修改的源、目标实现。' }
      - { en: 'Compile with all generic warnings treated as errors.', zh: '启用全部泛型警告，并把警告当作错误。' }
    issues:
      - line: 9
        kind: edge-case
        note: { en: '`getFirst()` throws on an empty source even though the task requires that input, and `first` is unrelated to copying. Remove this read.', zh: '空源调用 `getFirst()` 会抛出异常，而任务要求支持该输入；`first` 与复制也无关，应删除这次读取。' }
      - line: 10
        kind: correctness
        note: { en: '`sort(null)` mutates and reorders the caller-owned source, may reject an unmodifiable list, and imposes an undeclared natural-order requirement. Iterate in the existing order.', zh: '`sort(null)` 会修改并重排调用方持有的源列表，可能拒绝不可修改列表，还引入未声明的自然顺序要求；应按现有顺序迭代。' }
      - line: 15
        kind: performance
        note: { en: 'Scanning the destination with `contains` for every source value can become quadratic. Track existing values in a set when collection sizes justify the extra storage.', zh: '对每个源值都用 `contains` 扫描目标可能退化为平方复杂度。集合规模较大时，应使用集合记录已有值。' }
      - line: 20
        kind: readability
        note: { en: 'A reusable utility should not print an unrelated first value. This hidden side effect surprises callers and couples tests to standard output.', zh: '可复用工具不应输出无关的首个值。这个隐藏副作用会让调用方意外，并使测试耦合标准输出。' }
    explanation: { en: 'Keep the sound wildcard relationships, remove the empty-input failure and source mutation, make membership checks scale, and remove hidden console output.', zh: '应保留正确的通配符关系，删除空输入失败与源修改，让成员检查可扩展，并移除隐藏的控制台输出。' }
    difficulty: advanced
    minutes: 8
    tags: [code-review, wildcards, pecs, api-contract]
