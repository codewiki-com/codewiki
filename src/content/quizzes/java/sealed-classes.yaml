topic: java/sealed-classes
items:
  - id: predict-exhaustive-result
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      public class Main {
          sealed interface Result permits Ok, Failed {}
          record Ok(int value) implements Result {}
          record Failed(String reason) implements Result {}

          static String show(Result result) {
              return switch (result) {
                  case Ok ok -> "value=" + ok.value();
                  case Failed failed -> "error=" + failed.reason();
              };
          }

          public static void main(String[] args) {
              System.out.println(show(new Ok(7)));
              System.out.println(show(new Failed("timeout")));
          }
      }
    lang: java
    options:
      - { text: { en: 'value=7, then error=timeout', zh: '先输出 value=7，再输出 error=timeout' }, correct: true }
      - { text: { en: 'Ok[value=7], then Failed[reason=timeout]', zh: '先输出 Ok[value=7]，再输出 Failed[reason=timeout]' }, correct: false }
      - { text: { en: 'Compilation fails because switch needs default.', zh: '编译失败，因为 switch 需要 default。' }, correct: false }
      - { text: { en: 'Compilation fails because records cannot implement sealed interfaces.', zh: '编译失败，因为记录类不能实现密封接口。' }, correct: false }
    explanation: { en: 'The two record patterns cover every permitted subtype, so the switch is exhaustive without default. Each branch formats the record component.', zh: '两个记录类型模式覆盖全部获准子类型，因此 switch 无需 default 也具备穷尽性；每个分支会格式化对应的记录组件。' }
    difficulty: beginner
    tags: [sealed-classes, pattern-switch, predict-output]

  - id: direct-subtype-modifier
    type: mcq
    prompt: { en: 'Which declarations can an ordinary class directly permitted by a sealed class use?', zh: '一个被密封类直接许可的普通子类可以使用哪些声明？' }
    options:
      - { text: { en: 'Exactly one of final, sealed, or non-sealed', zh: '必须从 final、sealed 和 non-sealed 中选择一种' }, correct: true }
      - { text: { en: 'Only public or protected', zh: '只能使用 public 或 protected' }, correct: false }
      - { text: { en: 'Any declaration, because permits is sufficient', zh: '可以使用任意声明，因为 permits 已经足够' }, correct: false }
      - { text: { en: 'Only abstract', zh: '只能使用 abstract' }, correct: false }
    explanation: { en: 'A direct permitted ordinary subclass must close its branch, keep it controlled, or reopen it. Record subclasses satisfy the rule because record classes are implicitly final.', zh: '直接获准的普通子类必须终止分支、继续控制分支或重新开放分支；记录类隐式为 final，因此自动满足该规则。' }
    difficulty: beginner
    tags: [permits, final, non-sealed]

  - id: module-location-rule
    type: mcq
    prompt: { en: 'Where may a directly permitted subtype be declared?', zh: '直接获准子类型可以声明在哪里？' }
    options:
      - { text: { en: 'In the same named module, or in the same package when the root is in an unnamed module', zh: '根类型位于具名模块时在同一模块；位于未命名模块时在同一包' }, correct: true }
      - { text: { en: 'Only in the same source file in every build', zh: '任何构建中都只能位于同一源文件' }, correct: false }
      - { text: { en: 'In any exported package of any module', zh: '可以位于任意模块导出的任意包' }, correct: false }
      - { text: { en: 'Only as a nested class of the sealed root', zh: '只能作为密封根类型的嵌套类' }, correct: false }
    explanation: { en: 'Named modules establish the co-evolution boundary and permit different packages inside that module. Without a named module, the boundary narrows to one package.', zh: '具名模块构成共同演进边界，因此允许其中的不同包；没有具名模块时，该边界缩小到同一个包。' }
    difficulty: intermediate
    tags: [modules, packages, permits]

  - id: spotbug-unmarked-branch
    type: spotbug
    prompt: { en: 'Find why this sealed hierarchy does not compile.', zh: '找出这个密封层次无法编译的原因。' }
    code: |
      public class Main {
          sealed interface Result permits Success, Failure {}
          record Success(String id) implements Result {}
          static class Failure implements Result {
              private final String reason;
              Failure(String reason) { this.reason = reason; }
              String reason() { return reason; }
          }
      }
    lang: java
    issues:
      - line: 4
        kind: correctness
        note: { en: '`Failure` is an ordinary directly permitted class but declares none of `final`, `sealed`, or `non-sealed`. Mark it `final` if the branch should end.', zh: '`Failure` 是直接获准的普通类，却没有声明 final、sealed 或 non-sealed；若该分支应终止，就应标记为 final。' }
    explanation: { en: 'The permits clause chooses which types enter the hierarchy, while each direct subtype modifier chooses what happens below that branch. Both declarations are required.', zh: 'permits 子句决定哪些类型进入层次，直接子类型的修饰符则决定该分支之后如何扩展；两处声明都不可缺少。' }
    difficulty: intermediate
    tags: [compiler-error, direct-subtype, modifiers]

  - id: review-generated-event-audit
    type: review
    prompt: { en: 'Review this generated event-audit hierarchy before it becomes a shared API.', zh: '在这段生成的事件审计层次成为共享 API 前进行审查。' }
    task: { en: 'Model a controlled event root with an intentional plugin branch, keep credentials out of audit output, reject null explicitly, force review of new root variants, and preserve event order without unjustified parallel work.', zh: '建立受控事件根类型与刻意开放的插件分支；避免凭据进入审计输出；显式拒绝 null；让新增根变体触发审查；并在不进行无依据并行处理的前提下保持事件顺序。' }
    code: |
      import java.util.List;
      public class GeneratedEvents {
          sealed interface Event permits Login, Payment, PluginEvent {}
          record Login(String userId, String accessToken) implements Event {}
          record Payment(String id, int cents) implements Event {}
          non-sealed interface PluginEvent extends Event {}
          static String audit(Event event) {
              return switch (event) {
                  case Login login -> "login " + login;
                  case Payment payment when payment.cents() > 0 -> "paid " + payment.id();
                  case Payment payment -> "ignored " + payment.id();
                  default -> "other";
              };
          }
          static List<String> auditAll(List<Event> events) {
              return events.parallelStream()
                      .map(GeneratedEvents::audit)
                      .sorted()
                      .toList();
          }
      }
    lang: java
    right: { en: 'The root explicitly names its direct variants, records give built-in events compact data shapes, and the plugin branch is visibly marked as an extension point.', zh: '根类型显式列出直接变体，记录类为内建事件提供紧凑的数据形状，插件分支也被清楚标记为扩展点。' }
    checklist:
      - { en: 'Inspect record components and every audit path for secrets or personal data.', zh: '检查记录组件与每条审计路径是否包含秘密或个人数据。' }
      - { en: 'Exercise null and every direct root branch, including an external plugin implementation.', zh: '测试 null 与根类型的每个直接分支，包括外部插件实现。' }
      - { en: 'Add a temporary root variant and confirm the intended consumers fail to compile.', zh: '临时增加一个根变体，确认预期消费者无法编译。' }
      - { en: 'Verify encounter order and benchmark before introducing parallel streams.', zh: '引入并行流之前验证遇见顺序并执行基准测试。' }
    issues:
      - line: 4
        kind: security
        note: { en: '`accessToken` is a record component, so the derived `toString()` used on line 9 writes the credential into the audit message. Keep credentials outside printable event state and format only approved fields.', zh: '`accessToken` 是记录组件，因此第 9 行使用派生 `toString()` 时会把凭据写入审计消息；应把凭据移出可打印事件状态，并只格式化获准字段。' }
      - line: 8
        kind: edge-case
        note: { en: 'A null event throws an incidental NullPointerException at the switch. Validate with a named boundary or add an explicit `case null` matching the API contract.', zh: '空事件会在 switch 处意外抛出 NullPointerException；应使用命名清楚的边界校验，或按 API 契约显式添加 `case null`。' }
      - line: 12
        kind: correctness
        note: { en: '`default` hides a future direct root variant and treats every plugin event as an unexplained fallback. Match `PluginEvent` explicitly and omit default so new root variants trigger recompilation failures.', zh: '`default` 会隐藏未来新增的根类型直接变体，也把所有插件事件当成不明兜底；应显式匹配 `PluginEvent` 并省略 default，让新增根变体触发重新编译失败。' }
      - line: 16
        kind: performance
        note: { en: '`parallelStream()` adds splitting and coordination without evidence that the small formatting work benefits. Use a sequential stream and preserve encounter order unless a representative benchmark justifies parallel execution.', zh: '`parallelStream()` 在没有证据表明小型格式化任务能受益时增加了拆分与协调开销；除非代表性基准证明并行执行有效，否则应使用顺序流并保持遇见顺序。' }
    explanation: { en: 'Separate credentials from printable records, define null at the boundary, match the open plugin branch explicitly, and let omission of default preserve the root evolution check. A sequential map keeps input order and avoids speculative parallel overhead.', zh: '应把凭据与可打印记录分离，在边界定义 null 策略，显式匹配开放的插件分支，并通过省略 default 保留根类型演进检查；顺序映射既保持输入顺序，也避免推测性的并行开销。' }
    difficulty: advanced
    tags: [code-review, sealed-classes, security, evolution]
