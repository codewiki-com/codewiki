topic: java/oop
items:
  - id: predict-runtime-dispatch
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      public class Main {
          static class Base {
              String label() { return "base"; }
          }

          static final class Child extends Base {
              @Override
              String label() { return "child"; }
          }

          public static void main(String[] args) {
              Base value = new Child();
              System.out.println(value.label());
          }
      }
    lang: java
    options:
      - { text: { en: '`child`', zh: '`child`' }, correct: true }
      - { text: { en: '`base`', zh: '`base`' }, correct: false }
      - { text: { en: 'It fails to compile because `value` has type `Base`.', zh: '编译失败，因为`value`的类型是`Base`。' }, correct: false }
      - { text: { en: 'It throws `ClassCastException`.', zh: '程序抛出`ClassCastException`。' }, correct: false }
    explanation: { en: 'The compiler accepts `label()` through the static type `Base`, then runtime dispatch selects `Child.label()` from the actual object.', zh: '编译器通过静态类型`Base`接受`label()`调用，运行时分派再根据实际对象选择`Child.label()`。' }
    difficulty: beginner
    tags: [overriding, dynamic-dispatch, predict-output]

  - id: encapsulation-preserves-invariants
    type: mcq
    prompt: { en: 'Which design best preserves an account invariant that the balance never becomes negative?', zh: '哪种设计最能保持账户余额永不为负的不变量？' }
    options:
      - { text: { en: 'Keep the balance private and expose validated deposit and withdrawal operations.', zh: '把余额设为private，并公开经过校验的存款和取款操作。' }, correct: true }
      - { text: { en: 'Keep the balance private but provide an unrestricted setter.', zh: '把余额设为private，但提供不受限制的setter。' }, correct: false }
      - { text: { en: 'Make the balance public and document that callers should be careful.', zh: '把余额设为public，并用文档提醒调用方小心。' }, correct: false }
      - { text: { en: 'Return a mutable balance holder so callers can update it efficiently.', zh: '返回可变余额容器，让调用方高效更新。' }, correct: false }
    explanation: { en: 'Encapsulation is about controlling state transitions, not merely changing field visibility. Domain operations give one owner responsibility for validation.', zh: '封装的关键是控制状态转换，而不只是改变字段可见性；领域操作让一个所有者集中负责校验。' }
    difficulty: beginner
    tags: [encapsulation, invariants, state]

  - id: spotbug-overridable-constructor-call
    title: { en: 'Spot the bug in the constructor hierarchy', zh: '找出构造函数层次里的bug' }
    type: spotbug
    prompt: { en: 'Find the construction bug in this hierarchy.', zh: '找出这个继承层次中的构造缺陷。' }
    code: |
      public class Main {
          static class Report {
              Report() {
                  System.out.println(title());
              }

              String title() { return "report"; }
          }

          static final class MonthlyReport extends Report {
              private String month = "September";

              @Override
              String title() { return month.toUpperCase(); }
          }

          public static void main(String[] args) {
              new MonthlyReport();
          }
      }
    lang: java
    issues:
      - line: 4
        kind: correctness
        note: { en: 'The base constructor dispatches to `MonthlyReport.title()` before `month` is initialized, so the override dereferences `null` and construction fails.', zh: '父类构造器会在`month`初始化前分派到`MonthlyReport.title()`，因此覆盖方法解引用`null`，构造失败。' }
    explanation: { en: 'Avoid overridable calls during construction. Use private or final initialization logic, or run extensible behavior only after the complete object is valid.', zh: '构造期间应避免可覆盖调用。应使用private或final初始化逻辑，或者等完整对象有效后再运行可扩展行为。' }
    difficulty: intermediate
    tags: [constructors, overriding, partial-initialization]

  - id: reference-identity-versus-value
    type: mcq
    prompt: { en: 'Which statement correctly distinguishes reference identity from value equality?', zh: '哪项陈述正确区分了引用标识与值相等？' }
    options:
      - { text: { en: '`==` compares object identity; `equals()` uses the value relation defined by the receiver’s type.', zh: '`==`比较对象标识；`equals()`使用接收者类型定义的值关系。' }, correct: true }
      - { text: { en: '`==` always delegates to `equals()` for reference types.', zh: '对引用类型，`==`总会委托给`equals()`。' }, correct: false }
      - { text: { en: 'Two objects with the same field values are always identical.', zh: '字段值相同的两个对象一定具有相同标识。' }, correct: false }
      - { text: { en: 'Overriding `equals()` makes `hashCode()` update automatically.', zh: '覆盖`equals()`后，`hashCode()`会自动同步更新。' }, correct: false }
    explanation: { en: 'Identity asks whether two references denote one object. Value equality is a type contract, and a matching `hashCode()` implementation remains the author’s responsibility.', zh: '标识判断两个引用是否指向同一对象；值相等是类型契约，而一致的`hashCode()`实现仍由作者负责。' }
    difficulty: intermediate
    tags: [identity, equality, hash-code]

  - id: review-generated-member-account
    title: { en: 'Review generated member account', zh: '审查生成的会员账户' }
    type: review
    prompt: { en: 'Review this generated member-account class against the stated task.', zh: '根据任务要求审查这个生成的会员账户类。' }
    task: { en: 'Represent a member with a nonblank stable ID, nonnegative credits, privately owned roles, safe debit behavior, and ID-based equality that works in hash collections.', zh: '表示一个会员：ID非空白且稳定，积分非负，角色由对象私有拥有，扣减操作安全，并且基于ID的相等性可用于哈希集合。' }
    code: |
      import java.util.List;

      public class MemberAccount {
          public String id;
          public int credits;
          private final List<String> roles;

          public MemberAccount(String id, int credits, List<String> roles) {
              this.id = id;
              this.credits = credits;
              this.roles = roles;
          }

          public void debit(int amount) {
              credits -= amount;
          }

          public List<String> roles() {
              return roles;
          }

          @Override
          public boolean equals(Object value) { return value instanceof MemberAccount account && id.equals(account.id); }
      }
    lang: java
    right: { en: 'The class groups member data with a debit operation, keeps the roles field itself private and final, and attempts to define domain equality from the member ID.', zh: '这个类把会员数据与扣减操作放在一起，角色字段本身是private final，并尝试根据会员ID定义领域相等性。' }
    checklist:
      - { en: 'Construct with null, blank, negative, and boundary values and verify every invariant.', zh: '使用null、空白、负数和边界值构造对象，并验证每条不变量。' }
      - { en: 'Trace every state-changing path, including public fields and returned mutable objects.', zh: '追踪每条状态修改路径，包括公开字段和返回的可变对象。' }
      - { en: 'Exercise equal objects in `HashSet` and mutate all fields that participate in equality.', zh: '在`HashSet`中测试相等对象，并尝试修改参与相等判断的所有字段。' }
      - { en: 'Mutate the input and returned role lists and inspect the account afterward.', zh: '修改传入和返回的角色列表，再检查账户状态。' }
    issues:
      - line: 4
        kind: readability
        note: { en: 'The public mutable `id` and `credits` fields erase the ownership boundary and let callers bypass the class operations.', zh: '公开可变的`id`与`credits`字段抹去了所有权边界，让调用方可以绕过类操作。' }
      - line: 8
        kind: edge-case
        note: { en: 'The constructor accepts a null or blank ID, negative credits, and a null roles list, so it can create an invalid object immediately.', zh: '构造器接受null或空白ID、负积分和null角色列表，因此可以直接创建无效对象。' }
      - line: 19
        kind: security
        note: { en: 'Returning the live roles list lets outside code add privileged roles without passing through an authorization boundary; the constructor also retains the caller’s alias.', zh: '返回实时角色列表会让外部代码绕过授权边界添加高权限角色；构造器还保留了调用方的别名。' }
      - line: 23
        kind: correctness
        note: { en: 'ID-based `equals()` has no matching `hashCode()`, and the public mutable ID can change equality after insertion into a hash collection.', zh: '基于ID的`equals()`没有匹配的`hashCode()`，而公开可变ID还会在对象加入哈希集合后改变相等性。' }
    explanation: { en: 'Make the ID private and final, validate all constructor inputs, copy roles on input and expose an unmodifiable view or copy, reject invalid debits, and implement `hashCode()` from the same stable ID as `equals()`.', zh: '应把ID设为private final，校验全部构造输入，传入时复制角色并公开不可修改视图或副本，拒绝非法扣减，并让`hashCode()`与`equals()`使用同一个稳定ID。' }
    difficulty: advanced
    tags: [code-review, invariants, ownership, equality]
    tests: javac --release 21 MemberAccount.java
    minutes: 12
