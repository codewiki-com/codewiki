topic: java/data-types
items:
  - id: predict-compound-narrowing
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      public class Main {
          public static void main(String[] args) {
              byte count = 127;
              count += 2;
              System.out.println(count);
          }
      }
    lang: java
    options:
      - { text: { en: '-127', zh: '-127' }, correct: true }
      - { text: { en: '129', zh: '129' }, correct: false }
      - { text: { en: '-128', zh: '-128' }, correct: false }
      - { text: { en: 'It does not compile because addition produces int.', zh: '无法编译，因为加法会产生int。' }, correct: false }
    explanation: { en: 'Compound assignment includes an implicit cast back to byte. The low eight bits of 129 represent -127.', zh: '复合赋值包含隐式的byte缩小转换。129的低8位按byte解释为 -127。' }
    difficulty: intermediate
    tags: [byte, compound-assignment, narrowing]

  - id: widening-can-lose-precision
    type: mcq
    prompt: { en: 'Which widening primitive conversion can lose numeric precision?', zh: '哪一种扩大基本类型转换可能丢失数值精度？' }
    options:
      - { text: { en: 'int to long', zh: 'int转long' }, correct: false }
      - { text: { en: 'char to int', zh: 'char转int' }, correct: false }
      - { text: { en: 'long to double', zh: 'long转double' }, correct: true }
      - { text: { en: 'byte to short', zh: 'byte转short' }, correct: false }
    explanation: { en: 'A double has fewer precision bits than a long has value bits, so some long values round even though the conversion is classified as widening.', zh: 'double的有效精度位少于long的数值位，因此有些long值会被舍入，尽管该转换被归类为扩大转换。' }
    difficulty: intermediate
    tags: [widening, floating-point, precision]

  - id: spotbug-intermediate-overflow
    title: { en: 'Spot the bug in the storage estimate', zh: '找出存储量估算里的bug' }
    type: spotbug
    prompt: { en: 'Find the overflow bug in this storage estimate.', zh: '找出这个存储量估算中的溢出问题。' }
    code: |
      static long estimatedBytes(int fileCount, int averageBytes) {
          return fileCount * averageBytes;
      }
    lang: java
    issues:
      - line: 2
        kind: correctness
        note: { en: 'Both operands are int, so multiplication can overflow before the damaged result is widened to long.', zh: '两个操作数都是int，因此乘法可能先溢出，随后才把已经错误的结果扩大为long。' }
    explanation: { en: 'Widen one operand before multiplication, for example Math.multiplyExact((long) fileCount, averageBytes), so the operation itself uses long range and reports long overflow.', zh: '应在乘法前扩大一个操作数，例如使用Math.multiplyExact((long) fileCount, averageBytes)，让运算本身使用long范围，并在long溢出时报告错误。' }
    difficulty: beginner
    tags: [overflow, numeric-promotion, long]

  - id: char-versus-code-point
    type: mcq
    prompt: { en: 'Why can a Java String containing one displayed symbol have length 2?', zh: '为什么只显示一个符号的Java String，其length() 可能为2？' }
    options:
      - { text: { en: 'String.length counts UTF-16 code units, and a supplementary code point uses a surrogate pair.', zh: 'String.length统计UTF-16代码单元，而补充码点需要一对代理代码单元。' }, correct: true }
      - { text: { en: 'Every Java character is stored twice for error correction.', zh: '每个Java字符都会为纠错而存储两次。' }, correct: false }
      - { text: { en: 'String.length includes a terminating null character.', zh: 'String.length会包含结尾的空字符。' }, correct: false }
    explanation: { en: 'A char is one UTF-16 code unit, not every possible Unicode code point. Use codePointCount when the requirement is code-point count.', zh: 'char是一个UTF-16代码单元，并不能表示所有Unicode码点。需求针对码点数量时，应使用codePointCount。' }
    difficulty: beginner
    tags: [char, unicode, utf-16]

  - id: review-generated-invoice-total
    title: { en: 'Review generated invoice total', zh: '审查生成的发票合计' }
    type: review
    prompt: { en: 'Review this generated invoice-total implementation before it handles customer input.', zh: '在这个生成的发票合计实现处理客户输入前，对它进行审查。' }
    task: { en: 'Parse decimal unit prices, require a non-null quantity, calculate an exact cent total, and reject any input or total outside the supported range.', zh: '解析十进制单价，要求数量非空，精确计算以分为单位的合计，并拒绝任何超出支持范围的输入或总额。' }
    code: |
      import java.util.List;

      record InvoiceLine(String unitPrice, Integer quantity) {}

      class InvoiceTotals {
          static int totalCents(List<InvoiceLine> lines) {
              Integer total = 0;
              for (InvoiceLine line : lines) {
                  double unitPrice = Double.parseDouble(line.unitPrice());
                  int cents = (int) (unitPrice * 100);
                  total += cents * line.quantity();
              }
              return total;
          }

          static boolean matches(Integer expected, Integer actual) {
              return expected == actual;
          }
      }
    lang: java
    right: { en: 'The record names the price and quantity fields, and the calculation is kept in one small method whose boundary can be tested.', zh: '记录类型明确命名单价和数量字段，计算也集中在一个便于测试边界的小方法中。' }
    checklist:
      - { en: 'Test missing, malformed, non-finite, negative, fractional-cent, and out-of-range values.', zh: '测试缺失、格式错误、非有限、负数、不足一分和超范围的值。' }
      - { en: 'Trace the type and overflow behavior of every intermediate arithmetic result.', zh: '跟踪每个算术中间结果的类型和溢出行为。' }
      - { en: 'Require an explicit decimal scale and rounding or rejection policy.', zh: '要求明确规定十进制小数位数，以及舍入或拒绝策略。' }
      - { en: 'Use value equality for wrappers and test null on both sides.', zh: '对包装类型使用值相等比较，并测试两侧为null的情况。' }
    issues:
      - line: 7
        kind: performance
        note: { en: 'The boxed Integer accumulator is unboxed and boxed on each addition even though the method never needs a nullable total.', zh: 'Integer累加器在每次相加时都会拆箱再装箱，但这个方法并不需要可空的合计值。' }
      - line: 9
        kind: correctness
        note: { en: 'Parsing through double loses exact decimal semantics; the cast truncates fractional cents and turns NaN or infinities into integer values instead of rejecting them.', zh: '通过double解析会丢失精确十进制语义；强制转换会截断不足一分的部分，还会把NaN或无穷转换为整数，而不是拒绝输入。' }
      - line: 11
        kind: edge-case
        note: { en: 'A null quantity is implicitly unboxed and throws NullPointerException instead of producing the required validation result.', zh: '数量为null时会发生隐式拆箱并抛出NullPointerException，而不是产生要求的校验结果。' }
      - line: 11
        kind: security
        note: { en: 'Customer-controlled multiplication and accumulation can wrap int, allowing a large invoice to become a smaller or negative total.', zh: '客户可控的乘法与累加可能发生int回绕，使大额发票变成更小甚至负数的合计。' }
    explanation: { en: 'Parse with BigDecimal, validate scale and quantity, convert with exact operations, accumulate in a deliberately sized primitive, and compare nullable wrappers with Objects.equals. Boundary tests should prove the rejection policy.', zh: '应使用BigDecimal解析，校验小数位数和数量，用精确运算完成转换，在有意选择范围的基本类型中累加，并用Objects.equals比较可空包装值。边界测试要证明拒绝策略确实生效。' }
    difficulty: advanced
    tags: [code-review, bigdecimal, overflow, unboxing]
