topic: java/generics
items:
  - id: predict-pecs-copy
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      import java.util.ArrayList;
      import java.util.List;

      public class Main {
          static <T> void copy(
                  List<? super T> destination,
                  List<? extends T> source) {
              destination.addAll(source);
          }

          public static void main(String[] args) {
              List<Integer> source = List.of(2, 4);
              List<Number> destination = new ArrayList<>(List.of(1.5));
              copy(destination, source);
              System.out.println(destination);
          }
      }
    lang: java
    options:
      - { text: { en: '`[1.5, 2, 4]`', zh: '`[1.5, 2, 4]`' }, correct: true }
      - { text: { en: '`[2, 4]`', zh: '`[2, 4]`' }, correct: false }
      - { text: { en: '`[1.5, 2.0, 4.0]`', zh: '`[1.5, 2.0, 4.0]`' }, correct: false }
      - { text: { en: 'It fails to compile because `List<Integer>` is not `List<Number>`.', zh: '编译失败，因为 `List<Integer>` 不是 `List<Number>`。' }, correct: false }
    explanation: { en: 'The source produces `Integer` values and the destination can consume them as `Number`; `addAll` preserves the existing element and does not convert integer objects to doubles.', zh: '源列表生产 `Integer` 值，目标列表能以 `Number` 身份接收这些值；`addAll` 会保留已有元素，也不会把整数对象转换成浮点数。' }
    difficulty: intermediate
    tags: [pecs, wildcards, inference]

  - id: choose-flexible-copy-signature
    type: mcq
    prompt: { en: 'Which signature accepts an `Integer` source and a `Number` destination while preserving type safety?', zh: '哪个签名既能接收 `Integer` 源列表和 `Number` 目标列表，又保留类型安全？' }
    options:
      - { text: { en: '`<T> void copy(List<? super T> destination, List<? extends T> source)`', zh: '`<T> void copy(List<? super T> destination, List<? extends T> source)`' }, correct: true }
      - { text: { en: '`<T> void copy(List<? extends T> destination, List<? super T> source)`', zh: '`<T> void copy(List<? extends T> destination, List<? super T> source)`' }, correct: false }
      - { text: { en: '`void copy(List<Number> destination, List<Number> source)`', zh: '`void copy(List<Number> destination, List<Number> source)`' }, correct: false }
      - { text: { en: '`void copy(List<?> destination, List<?> source)`', zh: '`void copy(List<?> destination, List<?> source)`' }, correct: false }
    explanation: { en: 'The source is a producer, so it uses `extends`; the destination is a consumer, so it uses `super`. The named `T` connects their element types.', zh: '源列表是生产者，因此使用 `extends`；目标列表是消费者，因此使用 `super`。命名的 `T` 把两端元素类型连接起来。' }
    difficulty: intermediate
    tags: [pecs, api-design, wildcards]

  - id: spotbug-raw-list-pollution
    type: spotbug
    prompt: { en: 'Find why this program compiles with warnings but throws `ClassCastException` when it reads the name.', zh: '找出这段程序为何带警告通过编译，却在读取名称时抛出 `ClassCastException`。' }
    code: |
      import java.util.ArrayList;
      import java.util.List;

      public class Main {
          public static void main(String[] args) {
              List<String> names = new ArrayList<>();
              List raw = names;
              raw.add(42);
              System.out.println(names.getFirst().length());
          }
      }
    lang: java
    issues:
      - line: 7
        lines: 8
        kind: correctness
        note: { en: 'Assigning through raw `List` removes the element check and lets an `Integer` pollute an object still read as `List<String>`. Keep the reference parameterized and treat both raw-type and unchecked-call warnings as failures.', zh: '通过原始 `List` 赋值会删除元素检查，使 `Integer` 污染仍按 `List<String>` 读取的对象。引用应保持参数化，并把原始类型与未检查调用警告都当作失败。' }
    explanation: { en: 'The raw alias and unchecked `add` create heap pollution. The compiler-inserted cast to `String` fails on the later read, away from the unsafe write.', zh: '原始类型别名与未检查的 `add` 造成堆污染；之后读取时，编译器插入的 `String` 转换才在远离危险写入的位置失败。' }
    difficulty: intermediate
    tags: [raw-types, heap-pollution, unchecked-warning]

  - id: identify-reifiable-operation
    type: mcq
    prompt: { en: 'Which operation is legal because the tested type is reifiable?', zh: '哪项操作合法，其原因是被检查的类型可具体化？' }
    options:
      - { text: { en: '`candidate instanceof List<?>`', zh: '`candidate instanceof List<?>`' }, correct: true }
      - { text: { en: '`candidate instanceof List<String>`', zh: '`candidate instanceof List<String>`' }, correct: false }
      - { text: { en: '`new T()` inside `class Box<T>`', zh: '在 `class Box<T>` 中写 `new T()`' }, correct: false }
      - { text: { en: '`new List<String>[10]`', zh: '`new List<String>[10]`' }, correct: false }
    explanation: { en: '`List<?>` only asks the runtime to check the raw `List` identity. The other forms require a concrete type argument or component type that erasure does not preserve.', zh: '`List<?>` 只要求运行时检查原始 `List` 身份；其他形式需要擦除后没有保留的具体类型实参或组件类型。' }
    difficulty: intermediate
    tags: [reifiable-types, erasure, instanceof]

  - id: review-generated-reading-merge
    type: review
    prompt: { en: 'Review this generated reading merge before it becomes a shared collection utility.', zh: '在这段生成的读数合并代码成为共享集合工具前进行审查。' }
    task: { en: 'Append a same-typed source to the caller-owned destination, return all destination readings without duplicates in original encounter order, never mutate the source, handle an empty source, and keep the library method silent.', zh: '把同类型源列表追加到调用方持有的目标列表，按原始出现顺序返回目标中的去重读数；不得修改源列表，要处理空源列表，并让库方法保持静默。' }
    code: |
      import java.util.ArrayList;
      import java.util.List;

      public class GeneratedReadings {
          static <T extends Number & Comparable<? super T>> List<T> mergeDistinct(
                  List<T> destination, List<T> source) {
              source.sort(null);
              destination.addAll(source);
              T max = source.getLast();
              List<T> unique = new ArrayList<>();
              for (T value : destination) {
                  if (!unique.contains(value)) {
                      unique.add(value);
                  }
              }
              System.out.println("max: " + max);
              return unique;
          }
      }
    lang: java
    right: { en: 'The code keeps one named element type across both inputs and the result, avoids raw types and unchecked casts, appends through the caller-provided destination, and returns a separate result list.', zh: '代码让两个输入和返回值共享一个命名元素类型，没有使用原始类型或未检查转换，会向调用方提供的目标列表追加数据，并返回独立结果列表。' }
    checklist:
      - { en: 'Test empty, singleton, duplicate-heavy, already-populated destination, and unmodifiable-source cases.', zh: '测试空源、单元素、大量重复、已有元素的目标列表，以及不可修改源列表。' }
      - { en: 'Snapshot the source before the call and verify both contents and encounter order afterward.', zh: '调用前保存源列表快照，调用后检查内容和出现顺序都未变化。' }
      - { en: 'Capture standard output and benchmark duplicate-heavy inputs at increasing sizes.', zh: '捕获标准输出，并用逐渐增大的大量重复输入测量性能。' }
      - { en: 'Compile representative `Integer`, `BigDecimal`, and custom-number calls against the declared bound.', zh: '用 `Integer`、`BigDecimal` 与自定义数值类型的代表性调用检查声明边界。' }
    issues:
      - line: 7
        kind: correctness
        note: { en: '`source.sort(null)` mutates the source and changes its encounter order, violating two explicit task requirements. Iterate over the source without sorting it.', zh: '`source.sort(null)` 会修改源列表并改变其出现顺序，违反两项明确要求；应在不排序的情况下遍历源列表。' }
      - line: 9
        kind: edge-case
        note: { en: '`getLast()` throws on an empty source even though the task requires that case, and the computed maximum is not part of the result. Remove this unrelated operation.', zh: '空源列表调用 `getLast()` 会抛出异常，而任务要求处理该情况；算出的最大值也不属于返回结果，应删除这项无关操作。' }
      - line: 12
        lines: 14
        kind: performance
        note: { en: 'Calling linear `contains` for every destination element makes duplicate removal quadratic. Use a `LinkedHashSet<T>` to preserve encounter order with expected constant-time membership checks, then build the result list.', zh: '对每个目标元素调用线性 `contains` 会使去重达到平方复杂度。可使用 `LinkedHashSet<T>` 保持出现顺序并获得期望常数时间的成员检查，再构造结果列表。' }
      - line: 16
        kind: readability
        note: { en: 'A reusable collection method should not print an unrelated maximum. This hidden side effect surprises callers and couples tests to standard output; remove it or return explicitly requested diagnostics through the API.', zh: '可复用集合方法不应输出无关的最大值。这个隐藏副作用会让调用方意外，并使测试耦合标准输出；应删除它，或通过 API 返回明确要求的诊断信息。' }
    explanation: { en: 'Preserve the source and encounter order, remove the empty-list failure and hidden output, and use an order-preserving set when input size justifies it. The generic relationship itself is sound but does not validate these behavioral properties.', zh: '应保留源列表及出现顺序，删除空列表失败路径与隐藏输出，并在输入规模需要时使用保序集合。泛型关系本身正确，但不会验证这些行为属性。' }
    difficulty: advanced
    tags: [code-review, generics, collections, api-contract]
