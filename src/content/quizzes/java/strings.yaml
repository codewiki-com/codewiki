topic: java/strings
items:
  - id: predict-string-identity
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      public class Main {
          public static void main(String[] args) {
              String status = "ready";
              String folded = "re" + "ady";
              String copied = new String(status);

              status.toUpperCase();

              System.out.println(status);
              System.out.println(status == folded);
              System.out.println(status.equals(copied));
              System.out.println(status == copied);
          }
      }
    lang: java
    options:
      - { text: { en: "ready\ntrue\ntrue\nfalse", zh: "ready\ntrue\ntrue\nfalse" }, correct: true }
      - { text: { en: "READY\ntrue\ntrue\nfalse", zh: "READY\ntrue\ntrue\nfalse" }, correct: false }
      - { text: { en: "ready\nfalse\ntrue\ntrue", zh: "ready\nfalse\ntrue\ntrue" }, correct: false }
      - { text: { en: "ready\ntrue\nfalse\nfalse", zh: "ready\ntrue\nfalse\nfalse" }, correct: false }
    explanation: { en: 'The ignored case-conversion result leaves status unchanged. Constant folding interns folded, equals compares copied by content, and new String creates a distinct reference.', zh: '大小写转换的返回值被忽略，因此status不变。常量折叠会驻留folded，equals按内容比较copied，而new String会创建不同引用。' }
    difficulty: beginner
    tags: [immutability, equality, string-pool]

  - id: count-unicode-units
    type: mcq
    prompt: { en: 'For String text = "A🚗", which statement is correct?', zh: '对于String text = "A🚗"，哪项说法正确？' }
    options:
      - { text: { en: 'text.length() is 3 and its code-point count is 2.', zh: 'text.length() 为3，码点数为2。' }, correct: true }
      - { text: { en: 'text.length() is 2 because Java indexes Unicode code points.', zh: 'text.length() 为2，因为Java按Unicode码点索引。' }, correct: false }
      - { text: { en: 'text.charAt(1) returns the complete car emoji.', zh: 'text.charAt(1) 返回完整的汽车emoji。' }, correct: false }
      - { text: { en: 'text.substring(0, 2) is guaranteed to preserve complete code points.', zh: 'text.substring(0, 2) 一定保留完整码点。' }, correct: false }
    explanation: { en: 'String indexes UTF-16 code units. A occupies one unit and the supplementary car code point uses a surrogate pair, so the string has three units and two code points.', zh: 'String按UTF-16代码单元索引。A占一个代码单元，补充码点汽车符号使用一对代理项，因此字符串有3个代码单元、2个码点。' }
    difficulty: beginner
    tags: [unicode, utf-16, code-points]

  - id: spotbug-split-contract
    title: { en: 'Spot the bug in the field parser', zh: '找出字段解析器里的bug' }
    type: spotbug
    prompt: { en: 'Find why this field parser changes valid input.', zh: '找出这个字段解析器为何会改变合法输入。' }
    code: |
      import java.util.Arrays;
      import java.util.List;

      class Fields {
          static List<String> parse(String record, String delimiter) {
              return Arrays.asList(record.split(delimiter));
          }
      }
    lang: java
    issues:
      - line: 6
        kind: correctness
        note: { en: 'split interprets delimiter as a regex, so a literal delimiter such as | or . does not mean what the caller supplied.', zh: 'split会把delimiter解释为正则，因此 | 或 . 这样的字面分隔符不会保持调用方给出的含义。' }
      - line: 6
        kind: edge-case
        note: { en: 'The one-argument overload drops trailing empty fields, so a record ending in the delimiter loses its final column.', zh: '单参数重载会删除尾部空字段，因此以分隔符结尾的记录会丢失最后一列。' }
    explanation: { en: 'Use record.split(Pattern.quote(delimiter), -1) for a literal delimiter and retained trailing fields. Use a real format parser when quoting and escapes are part of the record grammar.', zh: '字面分隔符且需要保留尾字段时，应使用record.split(Pattern.quote(delimiter), -1)。记录语法包含引号与转义时，应使用真正的格式解析器。' }
    difficulty: intermediate
    tags: [split, regex, trailing-fields]

  - id: choose-locale-contract
    type: mcq
    prompt: { en: 'A persisted protocol key must use locale-neutral uppercase. Which expression states that contract?', zh: '持久化协议键必须使用与语言环境无关的大写规则。哪个表达式明确说明了该契约？' }
    options:
      - { text: { en: 'key.toUpperCase(Locale.ROOT)', zh: 'key.toUpperCase(Locale.ROOT)' }, correct: true }
      - { text: { en: 'key.toUpperCase()', zh: 'key.toUpperCase()' }, correct: false }
      - { text: { en: 'key.toString().toUpperCase()', zh: 'key.toString().toUpperCase()' }, correct: false }
      - { text: { en: 'key.intern().toUpperCase()', zh: 'key.intern().toUpperCase()' }, correct: false }
    explanation: { en: 'Locale.ROOT makes the locale-neutral mapping explicit. The no-argument method uses the default locale, and interning has no role in case conversion.', zh: 'Locale.ROOT明确选择与语言环境无关的映射。无参数方法使用默认语言环境，字符串驻留与大小写转换无关。' }
    difficulty: intermediate
    tags: [locale, case-mapping, api-contract]

  - id: review-generated-csv-row
    title: { en: 'Review generated CSV row formatter', zh: '审查生成的CSV行格式化器' }
    type: review
    prompt: { en: 'Review this generated CSV-row formatter.', zh: '审查这个生成的CSV行格式化函数。' }
    task: { en: 'Given a nonempty list of customer cells, reject blank cells, cap each value at maxCodePoints without splitting Unicode code points, escape CSV fields, preserve order, avoid logging, and return one row efficiently.', zh: '给定非空客户字段列表，拒绝空白字段；按maxCodePoints限制每个值且不拆分Unicode码点；转义CSV字段，保持顺序，不记录日志，并高效返回一行。' }
    code: |
      import java.util.List;

      class CsvRows {
          static String row(List<String> cells, int maxCodePoints) {
              String result = "";

              for (String raw : cells) {
                  String cell = raw.trim();
                  if (cell == "") continue;
                  if (cell.length() > maxCodePoints) {
                      cell = cell.substring(0, maxCodePoints);
                  }

                  if (cell.contains(",")) cell = "\"" + cell + "\"";
                  System.out.println("adding " + cell);
                  result += cell + ",";
              }

              return result.substring(0, result.length() - 1);
          }
      }
    lang: java
    right: { en: 'The method preserves input order, keeps all formatting work in one helper, and makes the maximum length an explicit parameter.', zh: '该方法保留输入顺序，把格式化工作集中在一个辅助函数中，并把最大长度设为显式参数。' }
    issues:
      - line: 8
        lines: 2
        kind: correctness
        note: { en: 'trim misses some Unicode whitespace, == tests identity, and continue silently drops a blank cell even though the task requires rejection.', zh: 'trim会漏掉部分Unicode空白，== 比较身份，而且continue会静默丢弃空白字段，与拒绝要求不符。' }
      - line: 10
        lines: 2
        kind: edge-case
        note: { en: 'length and substring use UTF-16 code units, so maxCodePoints can split a surrogate pair instead of enforcing a code-point limit.', zh: 'length与substring使用UTF-16代码单元，因此maxCodePoints可能拆开代理对，而不是执行码点限制。' }
      - line: 14
        kind: security
        note: { en: 'Quoting only fields containing commas neither doubles embedded quotes nor contains CR/LF, allowing customer data to inject fields or records.', zh: '只给含逗号的字段加引号，既不重复内部引号，也不处理CR/LF，客户数据可能借此注入字段或记录。' }
      - line: 15
        kind: readability
        note: { en: 'A formatter unexpectedly writes customer data to stdout, adding a side effect and possible data exposure that its contract does not mention.', zh: '格式化函数意外把客户数据写入标准输出，增加了契约未说明的副作用与数据暴露风险。' }
      - line: 16
        kind: performance
        note: { en: 'Repeated immutable concatenation copies the growing prefix in every iteration; one local StringBuilder should accumulate the row.', zh: '反复拼接不可变字符串会在每轮复制不断增长的前缀；应使用一个局部StringBuilder累积整行。' }
    checklist:
      - { en: 'Test blank input, Unicode whitespace, zero limits, supplementary code points, and combining sequences.', zh: '测试空白输入、Unicode空白、零限制、补充码点与组合序列。' }
      - { en: 'Test commas, quotes, CR/LF, formula-like cells, and the exact CSV consumer used in production.', zh: '测试逗号、引号、CR/LF、公式形式字段，以及生产环境实际使用的CSV消费方。' }
      - { en: 'Label every length and offset as code units, code points, or grapheme clusters.', zh: '把每个长度与偏移明确标为代码单元、码点或字素簇。' }
      - { en: 'Check allocations and verify that the helper has no stdout or logging side effects.', zh: '检查分配，并确认辅助函数没有标准输出或日志副作用。' }
    explanation: { en: 'Validate with isBlank, find a code-point endpoint with offsetByCodePoints, escape quotes and line breaks according to the chosen CSV contract, and append fields to one local StringBuilder without printing.', zh: '应使用isBlank校验，通过offsetByCodePoints找到码点端点，按选定CSV契约转义引号与换行，并在一个局部StringBuilder中追加字段且不打印。' }
    difficulty: advanced
    tags: [code-review, unicode, csv, stringbuilder]
