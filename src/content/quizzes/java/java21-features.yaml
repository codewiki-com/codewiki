topic: java/java21-features
items:
  - id: predict-guarded-record-pattern
    type: predict
    prompt: { en: 'What does this stable Java 21 program print?', zh: '这段稳定的Java 21程序会输出什么？' }
    code: |
      public class PredictPattern {
          record Parcel(String city, int days) {}

          static String label(Object value) {
              return switch (value) {
                  case Parcel(String city, int days) when days <= 2 -> city + ": express";
                  case Parcel(String city, int days) -> city + ": " + days + " days";
                  case null -> "missing";
                  default -> "other";
              };
          }

          public static void main(String[] args) {
              System.out.println(label(new Parcel("Paris", 3)));
          }
      }
    lang: java
    options:
      - { text: { en: 'Paris: express', zh: 'Paris: express' }, correct: false }
      - { text: { en: 'Paris: 3 days', zh: 'Paris: 3 days' }, correct: true }
      - { text: { en: 'other', zh: 'other' }, correct: false }
      - { text: { en: 'It fails because record patterns are preview in Java 21.', zh: '编译失败，因为记录模式在Java 21中仍是预览特性。' }, correct: false }
    explanation: { en: 'The guarded case matches the record type but its days <= 2 condition is false, so evaluation continues to the unguarded Parcel pattern.', zh: '带守卫的分支匹配记录类型，但days <= 2为false，因此继续选择无守卫的Parcel模式。' }
    difficulty: beginner
    tags: [record-patterns, guards, predict-output]

  - id: stable-source-boundary
    type: mcq
    prompt: { en: 'Which command proves that source uses only stable Java 21 language and Java SE APIs?', zh: '哪个命令能够证明源码只使用稳定的Java 21语言与Java SE API？' }
    options:
      - { text: { en: 'javac --release 21 App.java', zh: 'javac --release 21 App.java' }, correct: true }
      - { text: { en: 'javac --enable-preview App.java', zh: 'javac --enable-preview App.java' }, correct: false }
      - { text: { en: 'java App', zh: 'java App' }, correct: false }
      - { text: { en: 'javac -target 21 App.java', zh: 'javac -target 21 App.java' }, correct: false }
    explanation: { en: '`--release 21` selects the Java 21 language level, documented Java SE 21 API, and class-file target. Enabling preview would admit non-final features.', zh: '`--release 21`同时选择Java 21语言级别、对应的Java SE 21 API与类文件目标；启用预览反而会允许非正式特性。' }
    difficulty: beginner
    tags: [source-level, release, preview-features]

  - id: virtual-thread-capacity
    type: mcq
    prompt: { en: 'A service starts one virtual thread per request, but its database accepts only 30 concurrent queries. What should bound database access?', zh: '服务为每个请求创建一个虚拟线程，但数据库只能接受30个并发查询。什么机制应限制数据库访问？' }
    options:
      - { text: { en: 'A 30-permit semaphore or a 30-connection pool', zh: '30个许可的信号量或30个连接的连接池' }, correct: true }
      - { text: { en: 'A fixed pool of 30 virtual threads for the whole application', zh: '整个应用共用一个大小为30的虚拟线程池' }, correct: false }
      - { text: { en: 'The virtual-thread scheduler automatically reads the database limit', zh: '虚拟线程调度器会自动读取数据库限额' }, correct: false }
    explanation: { en: 'Virtual threads schedule tasks; they do not grant downstream capacity. Bound the scarce resource directly so unrelated waiting tasks can still use virtual threads.', zh: '虚拟线程负责调度任务，不会提供下游容量。应直接限制稀缺资源，让其他等待型任务仍可使用虚拟线程。' }
    difficulty: intermediate
    tags: [virtual-threads, backpressure, resource-limits]

  - id: reversed-is-a-view
    type: mcq
    prompt: { en: 'What does `list.reversed()` return in the Java 21 sequenced-collection API?', zh: 'Java 21有序集合API中的`list.reversed()`返回什么？' }
    options:
      - { text: { en: 'A reverse-ordered view backed by the list', zh: '由原列表支持的反向顺序视图' }, correct: true }
      - { text: { en: 'An immutable deep copy', zh: '不可修改的深拷贝' }, correct: false }
      - { text: { en: 'An iterator that can be consumed only once', zh: '只能消费一次的迭代器' }, correct: false }
    explanation: { en: 'The view and original observe each other’s permitted changes. Take an explicit copy when ownership or snapshot timing matters.', zh: '视图与原集合会看到对方允许的修改。所有权或快照时点很重要时，应显式复制。' }
    difficulty: beginner
    tags: [sequenced-collections, views, mutability]

  - id: spot-swallowed-interrupt
    title: { en: 'Spot the bug in the virtual-thread task', zh: '找出虚拟线程任务里的bug' }
    type: spotbug
    prompt: { en: 'Find the cancellation bug in this virtual-thread task.', zh: '找出这个虚拟线程任务中的取消缺陷。' }
    code: |
      public class StockWait {
          static void waitForStock() {
              try {
                  Thread.sleep(1_000);
              } catch (InterruptedException ignored) {
                  System.out.println("retrying");
              }
          }

          public static void main(String[] args) throws Exception {
              var worker = Thread.startVirtualThread(StockWait::waitForStock);
              worker.interrupt();
              worker.join();
          }
      }
    lang: java
    issues:
      - line: 5
        kind: correctness
        note: { en: 'The catch block swallows interruption, so callers cannot rely on interrupt as a cancellation signal. Propagate it or restore the interrupt status when the signature cannot throw.', zh: 'catch块吞掉了中断，调用方无法再把中断用作取消信号。应继续传播；签名无法抛出时则恢复中断状态。' }
    explanation: { en: 'Virtual threads use Java’s ordinary interruption model. Their low cost does not make ignored cancellation safe.', zh: '虚拟线程沿用Java的普通中断模型；线程成本低并不代表可以安全忽略取消。' }
    difficulty: intermediate
    tags: [virtual-threads, interruption, cancellation]

  - id: review-generated-order-loader
    title: { en: 'Review generated Java 21 order loader', zh: '审查生成的Java 21订单加载器' }
    type: review
    prompt: { en: 'Review this generated Java 21 order loader before merging it.', zh: '在合并前审查这段生成的Java 21订单加载器。' }
    task: { en: 'Load orders concurrently on stable Java 21, cap the remote service at 20 calls, preserve input order, avoid secret disclosure, expose failures, and return an immutable result.', zh: '在稳定Java 21上并发加载订单；把远端调用限制为20个；保留输入顺序；不泄露密钥；暴露失败；并返回不可修改结果。' }
    code: |
      import java.util.*;
      import java.util.concurrent.*;
      public class GeneratedLoader {
          record Request(String id, String token) {}
          record Result(String id, String body) {}
          static List<Result> load(List<Request> requests) {
              var results = new ArrayList<Result>();
              var executor = Executors.newFixedThreadPool(100, Thread.ofVirtual().factory());
              for (var request : requests) {
                  executor.submit(() -> {
                      try {
                          String body = call(request);
                          results.add(new Result(request.id(), body));
                      } catch (RuntimeException error) {
                          System.out.println("failed token=" + request.token() + ": " + error);
                      }
                  });
              }
              executor.close();
              return results;
          }
          static String call(Request request) {
              return "ok:" + request.id();
          }
      }
    lang: java
    right: { en: 'The code models requests and results with records, scopes task submission in one method, closes the executor so work is joined, and isolates remote-call logic behind a method.', zh: '代码用记录类建模请求与结果，把任务提交限制在一个方法中，关闭执行器以等待任务，并把远端调用逻辑隔离到单独方法。' }
    checklist:
      - { en: 'Compile with `--release 21 -Xlint:all` and no preview flag.', zh: '使用`--release 21 -Xlint:all`且不带预览开关进行编译。' }
      - { en: 'Stress completion order, concurrent writes, interruption, and one-call failure.', zh: '对完成顺序、并发写入、中断和单次调用失败进行压力测试。' }
      - { en: 'Verify that logs and exceptions never contain tokens or raw credentials.', zh: '确认日志与异常从不包含token或原始凭据。' }
      - { en: 'Attempt to mutate the returned list and measure the real remote-call concurrency.', zh: '尝试修改返回列表，并测量真实的远端调用并发量。' }
    issues:
      - line: 8
        kind: performance
        note: { en: 'A fixed pool of virtual workers reintroduces a 100-task scheduling bottleneck yet does not express the required 20-call remote limit.', zh: '固定虚拟工作线程池重新引入了100个任务的调度瓶颈，却没有表达远端调用必须限制为20个的要求。' }
      - line: 13
        kind: correctness
        note: { en: 'Concurrent tasks mutate one ArrayList without synchronization, and completion order cannot preserve request order.', zh: '并发任务在没有同步的情况下修改同一个ArrayList，而且完成顺序无法保留请求顺序。' }
      - line: 15
        kind: security
        note: { en: 'The failure log discloses the request token and may also expose details from the exception string.', zh: '失败日志泄露请求token，还可能暴露异常字符串中的内部细节。' }
      - line: 14
        lines: 3
        kind: readability
        note: { en: 'A leaf task turns failure into a print side effect, hiding the partial-result policy from the method contract and caller.', zh: '叶子任务把失败变成打印副作用，使方法契约和调用方都看不到部分结果策略。' }
      - line: 20
        kind: edge-case
        note: { en: 'The method returns its mutable accumulation list directly, violating the required immutable result even when no task fails.', zh: '方法直接返回可变的累积列表，即使所有任务成功，也违反了返回不可修改结果的要求。' }
    explanation: { en: 'Use one virtual thread per lookup, gate only the remote call with 20 permits, retain a future per input position, propagate or model failures, sanitize diagnostics, and return `List.copyOf` after joining. This separates task scheduling from resource capacity and result ownership.', zh: '应为每次查询创建一个虚拟线程，只用20个许可限制远端调用，并按输入位置保存Future；随后传播或建模失败、净化诊断信息，等待完成后返回`List.copyOf`。这样能分离任务调度、资源容量与结果所有权。' }
    difficulty: advanced
    tags: [code-review, virtual-threads, concurrency, security, immutability]
