topic: java/reflection
items:
  - id: predict-public-member-origin
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      interface Tagged {
          default String tag() { return "stock"; }
      }

      class Product implements Tagged {
          private int tax() { return 2; }
      }

      public class Main {
          public static void main(String[] args) throws Exception {
              var method = Product.class.getMethod("tag");
              System.out.println(method.getDeclaringClass().getSimpleName());
          }
      }
    lang: java
    options:
      - { text: { en: '`Tagged`', zh: '`Tagged`' }, correct: true }
      - { text: { en: '`Product`', zh: '`Product`' }, correct: false }
      - { text: { en: '`Object`', zh: '`Object`' }, correct: false }
      - { text: { en: 'It throws NoSuchMethodException.', zh: '抛出 NoSuchMethodException。' }, correct: false }
    explanation: { en: '`getMethod()` searches the public invocation view, including inherited interface defaults. The returned method is declared by `Tagged`.', zh: '`getMethod()` 搜索包含继承接口默认方法的 public 调用视图；返回的方法由 `Tagged` 声明。' }
    difficulty: beginner
    tags: [lookup, inheritance, default-methods]

  - id: exact-primitive-lookup
    type: mcq
    prompt: { en: 'A class declares `void setLimit(int value)`. What happens when code calls `getMethod("setLimit", Integer.class)`?', zh: '某个类声明了 `void setLimit(int value)`。调用 `getMethod("setLimit", Integer.class)` 会怎样？' }
    options:
      - { text: { en: 'It throws NoSuchMethodException.', zh: '抛出 NoSuchMethodException。' }, correct: true }
      - { text: { en: 'It finds the method and unboxes during lookup.', zh: '查找阶段会拆箱并找到该方法。' }, correct: false }
      - { text: { en: 'It finds the method only if an Integer argument is non-null.', zh: '只有 Integer 实参非 null 时才会找到该方法。' }, correct: false }
      - { text: { en: 'It selects every overload compatible with Integer.', zh: '返回与 Integer 兼容的全部重载。' }, correct: false }
    explanation: { en: 'Reflective lookup uses exact declared parameter classes; `int.class` and `Integer.class` are different keys. Invocation conversions happen only after a method has been selected.', zh: '反射查找使用精确的声明形参类型，`int.class` 与 `Integer.class` 是不同的键；调用转换发生在方法选定之后。' }
    difficulty: beginner
    tags: [lookup, primitives, boxing]

  - id: spotbug-inferred-signature
    title: { en: 'Spot the bug in reflective method lookup', zh: '找出反射方法查找里的 bug' }
    type: spotbug
    prompt: { en: 'Find why this helper cannot reliably invoke methods selected by name.', zh: '找出这个辅助函数无法可靠按名称调用方法的原因。' }
    code: |
      import java.lang.reflect.Method;

      public class Main {
          static Object call(Object target, String name, Object argument)
                  throws Exception {
              Method method = target.getClass().getDeclaredMethod(
                      name, argument.getClass());
              method.setAccessible(true);
              return method.invoke(target, argument);
          }
      }
    lang: java
    issues:
      - line: 7
        kind: correctness
        note: { en: '`argument.getClass()` does not reproduce a declared signature: wrappers do not match primitive parameters, implementations do not match interface parameters, and null has no runtime class. Carry an explicit allowed signature instead.', zh: '`argument.getClass()` 无法复现声明签名：包装类不匹配基本类型形参，实现类不匹配接口形参，null 也没有运行时类。应传递明确且允许的签名。' }
    explanation: { en: 'Method lookup is exact and separate from invocation conversion. A safe dispatcher maps a bounded operation to a validated signature instead of guessing from one argument object.', zh: '方法查找要求精确匹配，并与调用转换分离；安全调度器应把有限操作映射到已验证签名，而不是根据一个实参对象猜测。' }
    difficulty: intermediate
    tags: [lookup, overloads, 'null']

  - id: invocation-target-cause
    type: mcq
    prompt: { en: 'Where is an exception thrown normally by a method invoked through `Method.invoke()`?', zh: '通过 `Method.invoke()` 调用的方法正常抛出的异常位于哪里？' }
    options:
      - { text: { en: 'It is the cause of InvocationTargetException.', zh: '它是 InvocationTargetException 的 cause。' }, correct: true }
      - { text: { en: 'It is always converted to IllegalAccessException.', zh: '它始终转换为 IllegalAccessException。' }, correct: false }
      - { text: { en: 'It is returned as the invocation result.', zh: '它会作为调用结果返回。' }, correct: false }
      - { text: { en: 'Reflection suppresses it unless the interface declares throws.', zh: '除非接口声明 throws，否则反射会抑制它。' }, correct: false }
    explanation: { en: '`Method.invoke()` wraps an exception from target code in `InvocationTargetException`. Inspect `getCause()` and preserve that cause when translating the failure.', zh: '`Method.invoke()` 会用 `InvocationTargetException` 包装目标代码的异常；转换失败时应检查并保留 `getCause()`。' }
    difficulty: intermediate
    tags: [invocation, exceptions, error-handling]

  - id: review-generated-command-dispatcher
    type: review
    title: { en: 'Review a generated command dispatcher', zh: '审查生成的命令调度器' }
    prompt: { en: 'Review this generated dispatcher before it accepts application commands.', zh: '在这段生成的调度器接收应用命令前进行审查。' }
    task: { en: 'Dispatch a small allowlisted set of one-argument commands, support declared primitive or interface parameters, preserve useful failures, and reuse validated plans and service instances safely.', zh: '调度一组小型允许列表中的单参数命令，支持声明为基本类型或接口的形参，保留有用失败，并安全复用已验证计划与服务实例。' }
    code: |
      import java.lang.reflect.Method;
      import java.util.HashMap;
      import java.util.Map;

      public class GeneratedDispatcher {
          private static final Map<String, Method> CACHE = new HashMap<>();

          static Object dispatch(String className, String methodName,
                  Object argument) throws Exception {
              Class<?> type = Class.forName(className);
              Object target = type.getDeclaredConstructor().newInstance();
              String key = className + "#" + methodName;
              Method method = CACHE.computeIfAbsent(key, unused -> {
                  try {
                      return type.getDeclaredMethod(methodName, argument.getClass());
                  } catch (ReflectiveOperationException error) {
                      throw new RuntimeException(error);
                  }
              });
              method.setAccessible(true);
              try { return method.invoke(target, argument); }
              catch (Exception error) { return null; }
          }
      }
    lang: java
    right: { en: 'The code centralizes reflective dispatch, attempts to reuse method metadata, requests an exact one-argument method, and keeps construction plus invocation in one adapter.', zh: '代码集中处理反射调度，尝试复用方法元数据，查询精确的单参数方法，并把构造与调用放在同一个适配器内。' }
    checklist:
      - { en: 'Try an unapproved class and method, then verify a deny-by-default result.', zh: '尝试未获允许的类和方法，并确认结果遵循默认拒绝。' }
      - { en: 'Test primitive, interface, null, inherited, and overloaded parameter cases.', zh: '测试基本类型、接口、null、继承和重载形参场景。' }
      - { en: 'Make the target throw and inspect the exception and cause exposed to the caller.', zh: '让目标抛出异常，并检查调用方看到的异常及 cause。' }
      - { en: 'Exercise concurrent calls and a reloadable class loader against the cache lifecycle.', zh: '并发调用并使用可重载类加载器，检查缓存生命周期。' }
    issues:
      - line: 10
        kind: security
        note: { en: 'Untrusted names can select any reachable class and method. Map a bounded command identifier to a prevalidated target instead of accepting reflective names directly.', zh: '不可信名称可以选择任何可达类和方法。应把有限命令标识映射到预先验证的目标，而不是直接接受反射名称。' }
      - line: 12
        kind: correctness
        note: { en: 'The cache key omits parameter types and policy, so overloads and commands with different contracts can reuse the wrong Method. Key a validated plan by the complete command contract.', zh: '缓存键遗漏形参类型与策略，因此重载或契约不同的命令可能复用错误 Method。应按完整命令契约为已验证计划建立键。' }
      - line: 15
        kind: edge-case
        note: { en: '`argument.getClass()` fails for null and cannot match primitive or interface parameters. Resolve the signature from the allowlisted command declaration.', zh: '`argument.getClass()` 遇到 null 会失败，也无法匹配基本类型或接口形参。应从允许列表中的命令声明解析签名。' }
      - line: 22
        kind: readability
        note: { en: 'Returning null for every failure hides whether null was a valid target result and discards diagnostics. Translate lookup, access, and target failures explicitly.', zh: '所有失败都返回 null，会混淆合法空结果并删除诊断。应明确转换查找、访问与目标失败。' }
      - line: 11
        kind: performance
        note: { en: 'Every dispatch constructs a fresh service before using the cached method. Define service lifetime explicitly and reuse only instances whose state and concurrency contract permit it.', zh: '每次调度都会在使用缓存方法前创建新服务。应明确定义服务生命周期，只复用状态与并发契约允许复用的实例。' }
    explanation: { en: 'Replace reflective names with an allowlisted command registry whose entries hold the exact signature, access policy, target lifetime, and failure translation. Use a concurrency-safe cache scoped so it does not retain obsolete class loaders.', zh: '应以允许列表命令注册表替代反射名称；每个条目保存精确签名、访问策略、目标生命周期和失败转换。缓存需要并发安全，并限制作用域，避免保留过期类加载器。' }
    difficulty: advanced
    tags: [code-review, dispatch, security, caching]
