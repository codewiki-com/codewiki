topic: java/exceptions
items:
  - id: predict-first-compatible-catch
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      public class Main {
          public static void main(String[] args) {
              try {
                  Integer.parseInt("many");
              } catch (NumberFormatException error) {
                  System.out.println("number");
              } catch (IllegalArgumentException error) {
                  System.out.println("argument");
              }
          }
      }
    lang: java
    options:
      - { text: { en: 'number', zh: 'number' }, correct: true }
      - { text: { en: 'argument', zh: 'argument' }, correct: false }
      - { text: { en: 'Both lines, in that order', zh: '按顺序输出两行' }, correct: false }
      - { text: { en: 'The code does not compile because the catches overlap.', zh: '代码无法编译，因为两个catch有重叠。' }, correct: false }
    explanation: { en: 'NumberFormatException is a subclass of IllegalArgumentException, and the runtime selects the first compatible catch. The broader handler is legal because it follows the narrower one.', zh: 'NumberFormatException是IllegalArgumentException的子类，运行时会选择第一个兼容的catch。较宽的处理器放在较窄处理器之后，因此代码合法。' }
    difficulty: beginner
    tags: [catch-order, runtime-type, predict-output]

  - id: checked-exception-contract
    type: mcq
    prompt: { en: 'What must a method do when it calls code that may throw a checked exception?', zh: '方法调用可能抛出检查型异常的代码时，必须怎么做？' }
    options:
      - { text: { en: 'Catch it with a compatible handler or cover it with the method’s throws clause', zh: '用兼容的处理器捕获，或在方法的throws子句中覆盖它' }, correct: true }
      - { text: { en: 'Convert it to RuntimeException in every case', zh: '在所有情况下都把它转换为RuntimeException' }, correct: false }
      - { text: { en: 'Add throws Throwable, because checked types cannot be named individually', zh: '添加throws Throwable，因为检查型异常不能逐个声明' }, correct: false }
      - { text: { en: 'Do nothing; exception checking happens only at runtime', zh: '无需处理；异常检查只在运行时发生' }, correct: false }
    explanation: { en: 'Java performs compile-time catch-or-declare checking for checked exceptions. The chosen handler or throws type may be a compatible supertype.', zh: 'Java会在编译期对检查型异常执行“捕获或声明”检查。处理器或throws中的类型可以是兼容的父类型。' }
    difficulty: beginner
    tags: [checked-exception, throws, compiler]

  - id: spotbug-swallowed-interruption
    title: { en: 'Spot the bug in the blocking worker', zh: '找出阻塞任务里的bug' }
    type: spotbug
    prompt: { en: 'Find the cancellation bug in this blocking worker helper.', zh: '找出这个阻塞式worker辅助方法中的取消错误。' }
    code: |
      import java.util.concurrent.BlockingQueue;

      class Worker {
          static String awaitResult(BlockingQueue<String> results) {
              try {
                  return results.take();
              } catch (InterruptedException ignored) {
                  return "timeout";
              }
          }
      }
    lang: java
    issues:
      - line: 7
        kind: correctness
        note: { en: 'take() clears interrupted status when it throws; returning “timeout” loses the cancellation signal and mislabels it as a timeout.', zh: 'take() 抛出异常时会清除中断状态；返回“timeout”既丢失取消信号，又把中断误报为超时。' }
    explanation: { en: 'Prefer declaring InterruptedException. If this boundary cannot propagate it, perform necessary cleanup, restore status with Thread.currentThread().interrupt(), and return or throw only as its contract specifies.', zh: '优先声明并传播InterruptedException。如果当前边界不能传播，就先完成必要清理，再调用Thread.currentThread().interrupt() 恢复状态，最后严格按方法契约返回或抛出异常。' }
    difficulty: intermediate
    tags: [interrupted-exception, cancellation, blocking]

  - id: suppressed-exception-priority
    type: mcq
    prompt: { en: 'In try-with-resources, the body throws A and close() then throws B. What normally propagates?', zh: '在try-with-resources中，主体抛出A，随后close() 抛出B。通常会传播什么？' }
    options:
      - { text: { en: 'A propagates and B appears in A.getSuppressed().', zh: '传播A，B出现在A.getSuppressed() 中。' }, correct: true }
      - { text: { en: 'B replaces A, which is discarded.', zh: 'B替换A，A被丢弃。' }, correct: false }
      - { text: { en: 'A becomes the cause of B.', zh: 'A成为B的原因。' }, correct: false }
      - { text: { en: 'Neither propagates because resources close automatically.', zh: '两者都不传播，因为资源会自动关闭。' }, correct: false }
    explanation: { en: 'The body failure remains primary, and the later closing failure is suppressed onto it. If the body succeeds, a close failure can itself become primary.', zh: '主体失败保持为主异常，之后的关闭失败作为被抑制异常附加到它。若主体成功，关闭失败本身可以成为主异常。' }
    difficulty: intermediate
    tags: [try-with-resources, suppressed-exception, cleanup]

  - id: review-generated-order-import
    title: { en: 'Review generated order importer', zh: '审查生成的订单导入器' }
    type: review
    prompt: { en: 'Review this generated order-import boundary before it handles uploaded files.', zh: '在这段生成的订单导入边界处理上传文件前，对它进行审查。' }
    task: { en: 'Read UTF-8 order lines, fail the whole import on the first invalid line, return a count only on success, preserve an I/O cause for the caller, and never expose the input path.', zh: '读取UTF-8订单行，遇到第一条无效记录时让整个导入失败，只在成功时返回数量，为调用方保留I/O原因，并且绝不暴露输入路径。' }
    code: |
      static String importOrders(Path path) {
          BufferedReader reader = null;
          int imported = 0;
          try {
              reader = Files.newBufferedReader(path);
              for (String line; (line = reader.readLine()) != null;) {
                  try {
                      save(parse(line));
                      imported++;
                  } catch (RuntimeException ignored) {}
              }
              return "Imported " + imported;
          } catch (Exception error) {
              return "Import failed: " + error;
          } finally {
              try { reader.close(); } catch (Exception ignored) {}
          }
      }
    lang: java
    right: { en: 'The code reads incrementally instead of loading the entire upload, and it increments the count only after parse and save both return.', zh: '代码采用逐行读取，没有把整个上传文件载入内存；而且只在解析与保存都返回后才增加计数。' }
    checklist:
      - { en: 'Inject failures while opening, reading, parsing, saving, and closing.', zh: '分别注入打开、读取、解析、保存和关闭失败。' }
      - { en: 'Assert whether each failure propagates, translates, or becomes a public result.', zh: '断言每种失败会传播、转换，还是变成公开结果。' }
      - { en: 'Inspect cause and suppressed-exception relationships after combined failures.', zh: '组合失败发生后，检查原因与被抑制异常的关系。' }
      - { en: 'Check returned text and logs for paths, payload data, credentials, and duplicate records.', zh: '检查返回文本和日志中是否存在路径、载荷数据、凭据或重复记录。' }
    issues:
      - line: 10
        kind: correctness
        note: { en: 'The empty RuntimeException handler silently skips an invalid order, so the method reports partial success instead of failing the whole import.', zh: '空的RuntimeException处理器会静默跳过无效订单，使方法报告部分成功，而不是让整个导入失败。' }
      - line: 14
        kind: security
        note: { en: 'Returning error.toString() can expose the uploaded file path and implementation type to an untrusted caller.', zh: '返回error.toString() 可能向不受信任的调用方暴露上传文件路径和实现类型。' }
      - line: 16
        kind: edge-case
        note: { en: 'If opening the reader fails, reader is null; close() then throws NullPointerException, which the nested catch silently discards.', zh: '如果打开reader失败，reader就是null；随后close() 会抛出NullPointerException，又被内层catch静默丢弃。' }
      - line: 16
        kind: readability
        note: { en: 'Manual cleanup plus another broad catch obscures the primary-versus-close failure policy that try-with-resources expresses directly.', zh: '手工清理再配合一个宽泛catch，掩盖了主失败与关闭失败的优先级；try-with-resources能直接表达该策略。' }
    explanation: { en: 'Use try-with-resources, let validation failures abort the operation, and translate IOException to a domain exception with its cause. Return a success value only on success, while mapping sanitized public errors at the outer boundary.', zh: '应使用try-with-resources，让校验失败终止操作，并把IOException转换为保留原因的领域异常。只有成功时才返回成功值，经过净化的公开错误则在更外层边界映射。' }
    difficulty: advanced
    tags: [code-review, exception-translation, resource-cleanup, security]
