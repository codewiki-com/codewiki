topic: python/scope
items:
  - id: predict-enclosing-before-global
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      status = "global"

      def outer():
          status = "enclosing"

          def inner():
              print(status)

          inner()

      outer()
    lang: python
    options:
      - { text: { en: 'global', zh: 'global' }, correct: false }
      - { text: { en: 'enclosing', zh: 'enclosing' }, correct: true }
      - { text: { en: 'It raises NameError.', zh: '程序抛出 NameError。' }, correct: false }
      - { text: { en: 'It prints nothing.', zh: '程序不输出任何内容。' }, correct: false }
    explanation: { en: 'inner has no local status binding, so lexical lookup finds status in the nearest enclosing function before checking the module.', zh: 'inner 没有绑定局部名称 status，因此词法查找会先在最近的外层函数中找到 status，而不会继续查找模块。' }
    difficulty: beginner
    tags: [scope, legb, predict-output]

  - id: assignment-classifies-local
    type: mcq
    prompt: { en: 'Why can a read near the start of a function raise UnboundLocalError even when a global with that name exists?', zh: '函数开头的读取为何可能抛出 UnboundLocalError，即使模块中存在同名全局变量？' }
    options:
      - { text: { en: 'A binding operation elsewhere in the function classifies the name as local throughout that block.', zh: '函数其他位置的绑定操作会让该名称在整个代码块中被归类为局部名称。' }, correct: true }
      - { text: { en: 'Python always forbids functions from reading module globals.', zh: 'Python 一律禁止函数读取模块全局名称。' }, correct: false }
      - { text: { en: 'LEGB searches built-ins before globals.', zh: 'LEGB 会先查找内置命名空间，再查找全局命名空间。' }, correct: false }
      - { text: { en: 'The global value must be immutable.', zh: '全局值必须是不可变对象。' }, correct: false }
    explanation: { en: 'The compiler scans the whole function for binding operations. An earlier read then targets the not-yet-bound local rather than falling back to the global.', zh: '编译器会扫描整个函数中的绑定操作，因此更早的读取指向尚未绑定的局部名称，不会回退到全局名称。' }
    difficulty: intermediate
    tags: [scope, unboundlocalerror, name-binding]

  - id: spotbug-module-limit
    type: spotbug
    prompt: { en: 'The task is to update the module limit. Find why the printed value remains 10.', zh: '任务要求更新模块级上限。找出为何打印结果仍是 10。' }
    code: |
      limit = 10

      def set_limit(value):
          limit = value

      set_limit(20)
      print(limit)
    lang: python
    issues:
      - line: 4
        kind: correctness
        note: { en: 'The assignment creates a local binding in set_limit, so the module-level limit is unchanged.', zh: '这条赋值会在 set_limit 中建立局部绑定，因此模块级 limit 没有变化。' }
    explanation: { en: 'Declare global limit only if the module truly owns this mutable setting; otherwise return the new value and assign it explicitly at the call site.', zh: '只有该可变设置确实属于模块时才应声明 global limit；否则应返回新值，并在调用处明确赋值。' }
    difficulty: beginner
    tags: [global, shadowing, code-review]

  - id: locals-optimized-scope
    type: mcq
    prompt: { en: 'On Python 3.14, what happens when a function assigns through the dictionary returned by locals()?', zh: '在 Python 3.14 中，函数修改 locals() 返回的字典会发生什么？' }
    options:
      - { text: { en: 'It always creates or rebinds a real local variable.', zh: '它一定会创建或重新绑定真实的局部变量。' }, correct: false }
      - { text: { en: 'It changes only that snapshot dictionary, not the function’s real local bindings.', zh: '它只修改该快照字典，不会修改函数的真实局部绑定。' }, correct: true }
      - { text: { en: 'It updates the module global namespace.', zh: '它会更新模块全局命名空间。' }, correct: false }
      - { text: { en: 'It raises SyntaxError at compile time.', zh: '它会在编译阶段抛出 SyntaxError。' }, correct: false }
    explanation: { en: 'Functions are optimized scopes. Python 3.14 defines each locals() call there as a fresh snapshot whose mapping mutations are not written back.', zh: '函数属于优化作用域。Python 3.14 规定，其中每次 locals() 调用都返回新快照，对映射的修改不会写回局部绑定。' }
    difficulty: intermediate
    tags: [locals, namespace, python-3-14]

  - id: review-generated-tenant-handlers
    type: review
    title: { en: 'Review generated tenant handlers', zh: '审查生成的租户处理器' }
    prompt: { en: 'Review the generated handlers against the task and identify four distinct scope-related risks.', zh: '根据任务要求审查生成的处理器，并找出四类不同的作用域风险。' }
    task: { en: 'Build one authorized order handler per tenant, with an independent processed count and a bounded private record of recent orders.', zh: '为每个租户创建一个经过授权的订单处理器；处理数量互相独立，并私有保存有界的近期订单记录。' }
    code: |
      processed = 0


      def build_handlers(tenants, allowed_tenants):
          handlers = []

          for tenant in tenants:
              recent = {}

              def handle(order):
                  global processed
                  if tenant not in allowed_tenants:
                      raise PermissionError(tenant)
                  processed += 1
                  recent[order["id"]] = order
                  return tenant, processed, recent

              handlers.append(handle)

          return handlers
    lang: python
    issues:
      - line: 12
        kind: security
        note: { en: 'Every handler reads the same late-bound tenant, so authorization is checked against the final tenant rather than the handler’s intended tenant.', zh: '所有处理器都读取同一个延迟绑定的 tenant，因此授权检查针对最后一个租户，而不是处理器应绑定的租户。' }
      - line: 14
        kind: correctness
        note: { en: 'global processed makes every tenant and every factory call share one count instead of keeping an independent count per handler.', zh: 'global processed 让所有租户和所有工厂调用共享一个计数，而不是让每个处理器拥有独立计数。' }
      - line: 15
        kind: performance
        note: { en: 'The captured recent dictionary grows without a bound, retaining every order for as long as its handler remains reachable.', zh: '捕获的 recent 字典没有容量上限，只要处理器仍可达，就会保留所有订单。' }
      - line: 16
        kind: readability
        note: { en: 'Returning the private mutable dictionary inside a positional tuple leaks implementation state and makes the result contract hard to read.', zh: '在位置元组中返回私有可变字典会泄漏实现状态，也让返回值契约难以理解。' }
    right: { en: 'The generated code separates handler construction from order processing and rejects a tenant when its authorization check fails.', zh: '生成代码把处理器构造与订单处理分开，并会在租户授权检查失败时拒绝请求。' }
    checklist:
      - { en: 'Bind each handler to the tenant from its own factory invocation.', zh: '让每个处理器绑定到各自工厂调用中的租户。' }
      - { en: 'Keep counters in per-handler state and interleave two handlers in tests.', zh: '把计数保存在每个处理器自己的状态中，并在测试中交错调用两个处理器。' }
      - { en: 'Set and test a capacity or eviction rule for retained orders.', zh: '为保留的订单设置容量或淘汰规则，并编写对应测试。' }
      - { en: 'Return a named, immutable result instead of exposing internal storage.', zh: '返回具名的不可变结果，不要暴露内部存储。' }
    explanation: { en: 'Call a helper factory once per tenant so tenant, count, and recent storage have the right owner; bound the retained records and expose a narrow result.', zh: '应为每个租户调用一次辅助工厂，让 tenant、计数和近期记录拥有正确的所有者；同时限制记录容量，并返回更窄的结果。' }
    difficulty: advanced
    minutes: 8
    tags: [scope, code-review, global, late-binding]
