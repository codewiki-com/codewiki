topic: python/checkpoint-5
items:
  - id: checkpoint-5-runtime-enforcement
    type: mcq
    prompt: { en: 'What happens by default when a function annotated def total(count: int) is called with "3"?', zh: '默认情况下，带注解的函数def total(count: int) 收到 "3" 时会怎样？' }
    options:
      - { text: { en: 'Python binds the string normally; the annotation alone performs no runtime check', zh: 'Python会正常绑定这个字符串；类型注解本身不执行运行时检查' }, correct: true }
      - { text: { en: 'Python converts the string to int before entering the function', zh: 'Python会在进入函数前把字符串转换为int' }, correct: false }
      - { text: { en: 'The call always raises TypeError at the annotated boundary', zh: '调用一定会在带注解的边界抛出TypeError' }, correct: false }
    explanation: { en: 'Annotations provide metadata for static tools and frameworks. Ordinary Python calls do not enforce or coerce them automatically.', zh: '类型注解为静态工具和框架提供元数据。普通Python调用不会自动执行类型检查或类型转换。' }
    difficulty: beginner
    tags: [checkpoint]

  - id: checkpoint-5-structural-contract
    type: fill
    prompt: { en: 'Name the typing construct that describes structural subtyping without requiring explicit inheritance.', zh: '写出无需显式继承即可描述结构子类型的typing构造。' }
    answer: Protocol
    explanation: { en: 'A Protocol states the required members; static compatibility can follow from an object’s structure rather than its base classes.', zh: 'Protocol声明所需成员；静态兼容性可以由对象结构决定，而不必依赖其基类。' }
    difficulty: beginner
    tags: [checkpoint]

  - id: checkpoint-5-callable-signature
    type: fill
    prompt: { en: 'Which typing construct captures a callable’s complete parameter signature so a decorator can preserve it?', zh: '哪个typing构造可以捕获可调用对象的完整参数签名，让装饰器保留该签名？' }
    answer: ParamSpec
    explanation: { en: 'ParamSpec carries positional and keyword parameter types together through higher-order callable annotations.', zh: 'ParamSpec会在高阶可调用对象注解中一起传递位置参数与关键字参数的类型。' }
    difficulty: intermediate
    tags: [checkpoint]

  - id: checkpoint-5-coroutine-call
    type: mcq
    prompt: { en: 'What does calling an async def function return before it is awaited?', zh: '调用async def函数后、对其执行await之前，会返回什么？' }
    options:
      - { text: { en: 'A coroutine object whose body has not yet run', zh: '函数体尚未运行的协程对象' }, correct: true }
      - { text: { en: 'The function’s final result after blocking the current thread', zh: '阻塞当前线程后得到的函数最终结果' }, correct: false }
      - { text: { en: 'A new operating-system thread', zh: '一个新的操作系统线程' }, correct: false }
    explanation: { en: 'Calling async def creates a coroutine object. Awaiting it or scheduling it as a task lets its body execute on the event loop.', zh: '调用async def会创建协程对象。对它执行await或把它调度为任务后，函数体才会在事件循环上运行。' }
    difficulty: intermediate
    tags: [checkpoint]

  - id: checkpoint-5-taskgroup-failure
    type: mcq
    prompt: { en: 'What normally happens when one child in an active asyncio.TaskGroup raises ValueError?', zh: '活动的asyncio.TaskGroup中有一个子任务抛出ValueError时，通常会怎样？' }
    options:
      - { text: { en: 'Unfinished siblings are cancelled and awaited, then the group raises an exception group', zh: '未完成的兄弟任务会被取消并等待结束，随后任务组抛出异常组' }, correct: true }
      - { text: { en: 'The failure is discarded and every sibling continues silently', zh: '该失败会被丢弃，所有兄弟任务都静默继续' }, correct: false }
      - { text: { en: 'Only the failed task stops; leaving the context never reports it', zh: '只有失败任务停止；退出上下文时也不会报告失败' }, correct: false }
    explanation: { en: 'TaskGroup provides structured ownership: a non-cancellation child failure triggers sibling cancellation, waits for cleanup, and is reported on exit.', zh: 'TaskGroup提供结构化所有权：非取消类的子任务失败会触发兄弟任务取消，等待清理完成，并在退出时报告失败。' }
    difficulty: intermediate
    tags: [checkpoint]

  - id: checkpoint-5-workload-choice
    type: mcq
    prompt: { en: 'On a standard GIL-enabled CPython build, which default choice best matches the workload?', zh: '在启用GIL的标准CPython构建中，哪项默认选择最符合工作负载？' }
    options:
      - { text: { en: 'Threads for overlapping blocking I/O; processes for parallel pure-Python CPU work', zh: '用线程重叠阻塞I/O；用进程并行执行纯Python的CPU密集任务' }, correct: true }
      - { text: { en: 'Threads for parallel pure-Python CPU work; processes only for sleeping', zh: '用线程并行执行纯Python的CPU密集任务；进程只用于休眠' }, correct: false }
      - { text: { en: 'Always asyncio, because it automatically moves CPU work to other cores', zh: '始终使用asyncio，因为它会自动把CPU工作移到其他核心' }, correct: false }
    explanation: { en: 'Blocking I/O can release or wait outside the GIL, while separate processes provide independent interpreters for CPU-bound Python code. Workload and deployment measurements still decide the final choice.', zh: '阻塞I/O可以释放GIL，或在GIL之外等待；独立进程则为CPU密集型Python代码提供独立解释器。最终仍应根据实际工作负载与部署测量结果作出选择。' }
    difficulty: intermediate
    tags: [checkpoint]

  - id: checkpoint-5-shared-state
    type: fill
    prompt: { en: 'Name the threading primitive commonly used to make a multi-step shared-state update mutually exclusive.', zh: '写出一种常用的threading原语，它能让多步骤共享状态更新互斥执行。' }
    answer: Lock
    explanation: { en: 'A Lock protects the whole read-modify-write invariant. The GIL does not make an arbitrary sequence of Python operations atomic.', zh: 'Lock用于保护完整的读取、修改、写入不变量。GIL并不能让任意一组Python操作自动具备原子性。' }
    difficulty: advanced
    tags: [checkpoint]

  - id: checkpoint-5-future-results
    type: mcq
    prompt: { en: 'Which statement about concurrent.futures is correct?', zh: '关于concurrent.futures，哪项陈述正确？' }
    options:
      - { text: { en: 'as_completed() yields futures as they finish, and future.result() re-raises a worker exception', zh: 'as_completed() 按完成顺序产生Future，而future.result() 会重新抛出工作任务中的异常' }, correct: true }
      - { text: { en: 'as_completed() preserves submission order, and result() converts failures to None', zh: 'as_completed() 保持提交顺序，而result() 会把失败转换为None' }, correct: false }
      - { text: { en: 'Calling submit() blocks until the function has returned', zh: '调用submit() 会一直阻塞到函数返回' }, correct: false }
    explanation: { en: 'submit returns a Future immediately. as_completed observes completion order, while result transfers either the return value or the captured exception to the caller.', zh: 'submit会立即返回Future。as_completed观察完成顺序，而result会把返回值或捕获到的异常传递给调用方。' }
    difficulty: advanced
    tags: [checkpoint]
