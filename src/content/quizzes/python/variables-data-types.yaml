topic: python/variables-data-types
items:
  - id: predict-alias-rebinding
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      items = ["pen"]
      alias = items
      alias.append("paper")
      items = [*items, "tape"]

      print(alias)
      print(items)
      print(alias is items)
    lang: python
    options:
      - { text: { en: "['pen', 'paper']\n['pen', 'paper', 'tape']\nFalse", zh: "['pen', 'paper']\n['pen', 'paper', 'tape']\nFalse" }, correct: true }
      - { text: { en: "['pen', 'paper', 'tape']\n['pen', 'paper', 'tape']\nTrue", zh: "['pen', 'paper', 'tape']\n['pen', 'paper', 'tape']\nTrue" }, correct: false }
      - { text: { en: "['pen']\n['pen', 'tape']\nFalse", zh: "['pen']\n['pen', 'tape']\nFalse" }, correct: false }
      - { text: { en: 'It raises TypeError during rebinding.', zh: '程序在重新绑定时抛出TypeError。' }, correct: false }
    explanation: { en: 'append mutates the shared list, but the starred expression creates another list and rebinds only items. alias still points to the first list.', zh: 'append修改共享列表，而星号表达式创建另一个列表，只重新绑定items。alias仍指向第一个列表。' }
    difficulty: beginner
    tags: [assignment, aliasing, rebinding, predict-output]
    tests: python3 alias_rebinding.py
    minutes: 3

  - id: predict-false-default
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      configured_limit = 0
      effective_limit = configured_limit or 100

      print(effective_limit)
      print(bool("false"))
      print(isinstance(True, int))
    lang: python
    options:
      - { text: { en: "100\nTrue\nTrue", zh: "100\nTrue\nTrue" }, correct: true }
      - { text: { en: "0\nFalse\nFalse", zh: "0\nFalse\nFalse" }, correct: false }
      - { text: { en: "100\nFalse\nTrue", zh: "100\nFalse\nTrue" }, correct: false }
      - { text: { en: 'It raises TypeError on the last line.', zh: '最后一行抛出TypeError。' }, correct: false }
    explanation: { en: 'or returns its second operand because zero is false; a non-empty string is true; and bool is a subclass of int.', zh: '零为假，因此or返回第二个操作数；非空字符串为真；同时bool是int的子类。' }
    difficulty: beginner
    tags: [truth-value, bool, integers, predict-output]
    tests: python3 false_default.py
    minutes: 3

  - id: dynamic-typing-contract
    type: mcq
    prompt: { en: 'Which statement about dynamic typing and annotations is accurate?', zh: '关于动态类型与类型注解，哪项说法准确？' }
    options:
      - { text: { en: 'Names can be rebound to objects of different types, while ordinary calls do not enforce annotations.', zh: '名称可以重新绑定到不同类型的对象，普通函数调用不会强制执行注解。' }, correct: true }
      - { text: { en: 'Objects can change their own type whenever their names are reassigned.', zh: '只要名称被重新赋值，对象就能改变自身类型。' }, correct: false }
      - { text: { en: 'Annotations automatically convert every argument before a function body runs.', zh: '函数体运行前，注解会自动转换每个参数。' }, correct: false }
      - { text: { en: 'Dynamic typing means incompatible operations never raise TypeError.', zh: '动态类型表示不兼容操作不会抛出TypeError。' }, correct: false }
    explanation: { en: 'A type belongs to an object, and rebinding changes which object a name denotes. Annotations describe a contract for tools unless runtime code explicitly acts on them.', zh: '类型属于对象，重新绑定会改变名称所指的对象。除非运行时代码显式处理注解，否则注解只是供工具使用的契约说明。' }
    difficulty: beginner
    tags: [dynamic-typing, annotations, rebinding]
    minutes: 2

  - id: spotbug-cents-validation
    title: { en: 'Spot the bug in the cents parser', zh: '找出分币解析器里的bug' }
    type: spotbug
    prompt: { en: 'Find why this helper accepts values outside its integer-cents contract.', zh: '找出这个辅助函数为什么会接受不符合整数分值契约的值。' }
    code: |
      def record_cents(record: dict[str, object]) -> int:
          cents = record.get("cents") or 0
          if not isinstance(cents, int):
              raise ValueError("cents must be an integer")
          return cents
    lang: python
    issues:
      - line: 2
        kind: edge-case
        note: { en: 'or 0 turns a missing field, None, False, and other false values into a valid-looking zero instead of rejecting them.', zh: 'or 0会把字段缺失、None、False与其他假值变成看似有效的零，而不是拒绝它们。' }
      - line: 3
        kind: correctness
        note: { en: 'isinstance(True, int) is true, so a Boolean passes an integer-only domain check.', zh: 'isinstance(True, int) 为真，因此布尔值会通过仅允许整数的领域检查。' }
    explanation: { en: 'Read the field without a truth-value fallback, require its presence, and accept int only when the value is not bool. Check the non-negative range afterward.', zh: '读取字段时不要用真值回退，应要求字段存在，并且只在值为int且不是bool时接受。之后还要检查非负范围。' }
    difficulty: intermediate
    tags: [runtime-validation, bool, missing-values, code-review]
    tests: python3 -m py_compile cents_validation.py
    minutes: 5

  - id: integer-conversion-boundary
    type: mcq
    prompt: { en: 'What is the safest description of int() at an input boundary?', zh: '怎样描述输入边界处的int() 最准确？' }
    options:
      - { text: { en: 'It converts according to the source type, but format and range still need an explicit contract.', zh: '它会根据源类型进行转换，但格式与范围仍需明确契约。' }, correct: true }
      - { text: { en: 'It validates every number-like input without losing information.', zh: '它能验证所有类似数字的输入，而且不会丢失信息。' }, correct: false }
      - { text: { en: 'It rounds floating-point values to the nearest integer.', zh: '它会把浮点数四舍五入到最近的整数。' }, correct: false }
      - { text: { en: 'It returns None whenever text cannot be parsed.', zh: '文本无法解析时，它会返回None。' }, correct: false }
    explanation: { en: 'int() truncates floats toward zero and raises ValueError for invalid integer text. Conversion must be followed by the domain range checks the constructor cannot know.', zh: 'int() 会把浮点数向零截断，并对无效整数文本抛出ValueError。转换后仍需执行构造器无法知道的领域范围检查。' }
    difficulty: beginner
    tags: [conversion, integers, validation]
    minutes: 2

  - id: review-generated-order-total
    title: { en: 'Review generated order total', zh: '审查生成的订单总额' }
    type: review
    prompt: { en: 'Review this generated order-total helper before it handles an API request.', zh: '在这个生成的订单汇总函数处理API请求前，对它进行审查。' }
    task: { en: 'Parse untrusted order JSON, validate active and cents fields, total active non-negative integer cents, retain no records, and perform no ordering work.', zh: '解析不可信的订单JSON，验证active与cents字段，汇总启用订单的非负整数分值，不保留记录，也不执行排序。' }
    code: |
      def active_total(raw: str, seen=[]):
          """Return cents for active orders."""
          try:
              records = eval(raw)
              records = sorted(records, key=lambda record: record["id"])
              total = 0

              for record in records:
                  if not record.get("active"):
                      continue
                  cents = record.get("cents", 0)
                  if isinstance(cents, int):
                      total += cents
                  seen.append(record)

              return total
          except Exception:
              return 0
    lang: python
    right: { en: 'The generated code keeps the accumulator local, gives the function a return annotation, and makes the active-record filter visible before adding cents.', zh: '生成代码把累加器保留在局部作用域，给函数添加了返回注解，并在累加分值前明确筛选启用记录。' }
    checklist:
      - { en: 'Use a format-specific parser, then validate the top-level shape and every field before arithmetic.', zh: '使用针对格式的解析器，再在计算前验证顶层结构与每个字段。' }
      - { en: 'Test missing fields, wrong types, booleans used as integers, negatives, zero, and malformed JSON.', zh: '测试字段缺失、类型错误、用布尔值冒充整数、负数、零和格式错误的JSON。' }
      - { en: 'Remove sorting or retention when the requested result consumes neither.', zh: '如果请求结果不需要顺序或记录留存，就删除排序与保留操作。' }
      - { en: 'Make invalid input observably different from a real zero total.', zh: '让无效输入与真实的零总额具有可观察的区别。' }
    issues:
      - line: 1
        kind: correctness
        note: { en: 'seen is one mutable default shared across calls, so complete records accumulate in hidden process state.', zh: 'seen是跨调用共享的可变默认值，因此完整记录会在隐藏的进程状态中累积。' }
      - line: 4
        kind: security
        note: { en: 'eval executes arbitrary Python from the request instead of parsing JSON, allowing code execution.', zh: 'eval会执行请求中的任意Python代码，而不是解析JSON，因此可能造成代码执行。' }
      - line: 5
        kind: performance
        note: { en: 'Sorting every record is unnecessary because the requested result is only a total and has no ordering requirement.', zh: '请求结果只是总额，没有顺序要求，因此对所有记录排序是无用工作。' }
      - line: 11
        kind: edge-case
        note: { en: 'A missing cents field becomes zero, booleans pass the int check, and negative integers are accepted.', zh: '缺失的cents字段会变成零，布尔值能通过int检查，负整数也会被接受。' }
      - line: 17
        kind: readability
        note: { en: 'Catching every ordinary exception and returning 0 hides whether input was invalid, evaluation failed, or the total was genuinely zero.', zh: '捕获所有普通异常并返回0，会掩盖输入无效、求值失败与真实零总额之间的区别。' }
    explanation: { en: 'Use json.loads(), validate the list and each record explicitly, then sum only checked cents. Remove the sort and retained records, and report malformed input through a specific boundary error.', zh: '应使用json.loads()，显式验证列表与每条记录，再只汇总检查过的分值。删除排序与记录留存，并通过具体的边界错误报告无效输入。' }
    difficulty: intermediate
    tags: [code-review, validation, aliasing, types]
    tests: python3 -m py_compile active_total.py
    minutes: 12
