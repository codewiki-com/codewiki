topic: python/checkpoint-2
items:
  - id: checkpoint-2-default-lifetime
    type: mcq
    prompt: { en: 'A function appends to a default parameter items=[]. What happens across calls that omit items?', zh: '函数会向默认形参items=[] 追加元素。多次调用都省略items时会怎样？' }
    options:
      - { text: { en: 'The calls reuse one list created when the def statement ran', zh: '这些调用复用def语句执行时创建的同一个列表' }, correct: true }
      - { text: { en: 'Each call receives a newly created empty list', zh: '每次调用都会得到一个新建的空列表' }, correct: false }
      - { text: { en: 'Python copies the list after each return', zh: 'Python会在每次返回后复制这个列表' }, correct: false }
    explanation: { en: 'Default expressions are evaluated when the function is defined, not on each call. Use a None sentinel when each call needs fresh mutable state.', zh: '默认值表达式在函数定义时求值，而不是每次调用时求值。若每次调用都需要新的可变状态，应使用None哨兵值。' }
    difficulty: beginner
    tags: [checkpoint]

  - id: checkpoint-2-parameter-markers
    type: mcq
    prompt: { en: 'For def render(source, /, *, compact=False), which call is valid?', zh: '对于def render(source, /, *, compact=False)，哪种调用有效？' }
    options:
      - { text: { en: 'render("report", compact=True)', zh: 'render("report", compact=True)' }, correct: true }
      - { text: { en: 'render(source="report", compact=True)', zh: 'render(source="report", compact=True)' }, correct: false }
      - { text: { en: 'render("report", True)', zh: 'render("report", True)' }, correct: false }
    explanation: { en: 'A name before / is positional-only, while a name after bare * is keyword-only. The valid call respects both boundaries.', zh: '位于 / 之前的名称仅限位置传入，位于单独 * 之后的名称仅限关键字传入。有效调用同时遵守这两个边界。' }
    difficulty: beginner
    tags: [checkpoint]

  - id: checkpoint-2-variadic-containers
    type: mcq
    prompt: { en: 'Inside def collect(*values, **labels), which container types are values and labels?', zh: '在def collect(*values, **labels) 内部，values和labels分别是什么容器类型？' }
    options:
      - { text: { en: 'values is a tuple and labels is a dictionary', zh: 'values是元组，labels是字典' }, correct: true }
      - { text: { en: 'values is a list and labels is a set', zh: 'values是列表，labels是集合' }, correct: false }
      - { text: { en: 'Both are dictionaries keyed by parameter position', zh: '二者都是以形参位置为键的字典' }, correct: false }
    explanation: { en: '*values collects unmatched positional arguments into a tuple; **labels collects unmatched keyword arguments into a dictionary.', zh: '*values把未匹配的位置实参收集为元组；**labels把未匹配的关键字实参收集为字典。' }
    difficulty: intermediate
    tags: [checkpoint]

  - id: checkpoint-2-resolution-order
    type: fill
    prompt: { en: 'Enter the four-letter name for Python’s Local, Enclosing, Global, Built-in lookup order.', zh: '写出Python按局部、外层、全局、内置顺序查找名称时使用的四字母名称。' }
    answer: LEGB
    explanation: { en: 'LEGB names the lexical search order Python uses when resolving a name.', zh: 'LEGB表示Python解析名称时采用的词法查找顺序。' }
    difficulty: intermediate
    tags: [checkpoint]

  - id: checkpoint-2-enclosing-rebind
    type: fill
    prompt: { en: 'Which keyword lets an inner function rebind a name in its nearest enclosing function scope?', zh: '哪个关键字允许内部函数重新绑定最近一层外层函数作用域中的名称？' }
    answer: nonlocal
    explanation: { en: 'nonlocal targets an existing binding in an enclosing function scope; global instead targets module scope.', zh: 'nonlocal指向外层函数作用域中的现有绑定；global指向的则是模块作用域。' }
    difficulty: intermediate
    tags: [checkpoint]

  - id: checkpoint-2-late-binding
    type: mcq
    prompt: { en: 'What does [f() for f in [lambda: i for i in range(3)]] produce?', zh: '[f() for f in [lambda: i for i in range(3)]] 会产生什么？' }
    options:
      - { text: { en: '[2, 2, 2]', zh: '[2, 2, 2]' }, correct: true }
      - { text: { en: '[0, 1, 2]', zh: '[0, 1, 2]' }, correct: false }
      - { text: { en: 'It raises NameError because i leaves the comprehension scope', zh: '抛出NameError，因为i已离开推导式作用域' }, correct: false }
    explanation: { en: 'The lambdas close over one cell and look up its final value when called. Binding i as a default parameter in each lambda would capture each iteration’s value.', zh: '这些lambda闭包引用同一个单元格，并在调用时读取其最终值。把i绑定为每个lambda的默认形参，才能捕获每次迭代的值。' }
    difficulty: intermediate
    tags: [checkpoint]

  - id: checkpoint-2-generator-start
    type: mcq
    prompt: { en: 'What does calling a generator function do before next() or iteration begins?', zh: '在调用next() 或开始迭代之前，调用生成器函数会做什么？' }
    options:
      - { text: { en: 'It creates a generator object without running the function body', zh: '创建生成器对象，但不运行函数体' }, correct: true }
      - { text: { en: 'It runs the whole body and stores every yielded value in a list', zh: '运行完整函数体，并把所有yield值存入列表' }, correct: false }
      - { text: { en: 'It runs through the first yield and discards that value', zh: '运行到第一个yield，并丢弃该值' }, correct: false }
    explanation: { en: 'A generator function call is lazy. Execution starts only when the generator is advanced.', zh: '生成器函数调用是惰性的。只有推进生成器时，函数体才开始执行。' }
    difficulty: advanced
    tags: [checkpoint]

  - id: checkpoint-2-exhaustion
    type: fill
    prompt: { en: 'Name the exception raised when next() advances an exhausted iterator.', zh: 'next() 推进已经耗尽的迭代器时会抛出哪种异常？' }
    answer: StopIteration
    explanation: { en: 'The iterator protocol signals exhaustion with StopIteration; a for loop consumes that signal internally.', zh: '迭代器协议使用StopIteration表示耗尽；for循环会在内部处理这个信号。' }
    difficulty: advanced
    tags: [checkpoint]
