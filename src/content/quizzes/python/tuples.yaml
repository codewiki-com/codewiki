topic: python/tuples
items:
  - id: predict-shallow-immutability
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      route = (["home"], "ready")
      snapshot = route
      route[0].append("catalog")

      print(snapshot)
      print(route is snapshot)
    lang: python
    options:
      - { text: { en: "(['home'], 'ready') then False", zh: "先输出 (['home'], 'ready')，再输出 False" }, correct: false }
      - { text: { en: "(['home', 'catalog'], 'ready') then True", zh: "先输出 (['home', 'catalog'], 'ready')，再输出 True" }, correct: true }
      - { text: { en: 'It raises TypeError at append().', zh: '程序在 append() 处抛出 TypeError。' }, correct: false }
      - { text: { en: "(['home', 'catalog'], 'ready') then False", zh: "先输出 (['home', 'catalog'], 'ready')，再输出 False" }, correct: false }
    explanation: { en: 'The tuple slot still points to the same list, and append mutates that list. Assignment also made snapshot refer to the same tuple object.', zh: '元组槽位仍指向同一个列表，append 修改的是该列表。赋值也让 snapshot 指向同一个元组对象。' }
    difficulty: beginner
    tags: [tuples, shallow-immutability, aliasing]

  - id: one-item-construction
    type: mcq
    prompt: { en: 'Which expression wraps the string "Paris" in a one-item tuple without iterating over its characters?', zh: '哪个表达式会把字符串 "Paris" 包装成单元素元组，而不是遍历其中的字符？' }
    options:
      - { text: { en: '("Paris",)', zh: '("Paris",)' }, correct: true }
      - { text: { en: '("Paris")', zh: '("Paris")' }, correct: false }
      - { text: { en: 'tuple("Paris")', zh: 'tuple("Paris")' }, correct: false }
      - { text: { en: '(tuple, "Paris")', zh: '(tuple, "Paris")' }, correct: false }
    explanation: { en: 'The comma creates the tuple. Parentheses alone group the string, while tuple("Paris") consumes the string as an iterable of characters.', zh: '逗号才会创建元组。圆括号本身只对字符串分组，tuple("Paris") 则会把字符串作为字符可迭代对象消费。' }
    difficulty: beginner
    tags: [tuple-literal, tuple-packing]

  - id: spotbug-composite-key
    title: { en: 'Spot the bug in the tuple key', zh: '找出元组键里的 bug' }
    type: spotbug
    prompt: { en: 'Find why storing this location record fails before the final print.', zh: '找出为什么存储这条位置记录时会在最后一次 print 前失败。' }
    code: |
      locations = {}
      coordinates = [48.86, 2.35]
      key = ("Paris", coordinates)

      locations[key] = "warehouse"
      print(locations[key])
    lang: python
    issues:
      - line: 3
        kind: correctness
        note: { en: 'The tuple contains a list, so hashing the composite key raises TypeError. Use an immutable coordinate value such as (48.86, 2.35) when that snapshot matches the domain contract.', zh: '该元组包含列表，因此计算复合键哈希时会抛出 TypeError。如果快照符合领域契约，应使用 (48.86, 2.35) 这样的不可变坐标值。' }
    explanation: { en: 'A tuple is hashable only when every element is hashable. Making the outer container a tuple does not change the list inside it.', zh: '只有所有元素都可哈希时，元组才可哈希。把外层容器改成元组不会改变其中的列表。' }
    difficulty: beginner
    tags: [hashability, dictionary-key, nested-mutable]

  - id: starred-target-result
    type: mcq
    prompt: { en: 'After first, *middle, last = (10, 20, 30, 40), what are middle and its type?', zh: '执行 first, *middle, last = (10, 20, 30, 40) 后，middle 的值和类型是什么？' }
    options:
      - { text: { en: '(20, 30), a tuple', zh: '(20, 30)，元组' }, correct: false }
      - { text: { en: '[20, 30], a list', zh: '[20, 30]，列表' }, correct: true }
      - { text: { en: '20, an integer', zh: '20，整数' }, correct: false }
      - { text: { en: '[10, 20, 30], a list', zh: '[10, 20, 30]，列表' }, correct: false }
    explanation: { en: 'The fixed targets consume the first and last values. A starred assignment target collects the remaining values into a new list.', zh: '固定目标会消费首尾两个值。赋值中的星号目标会把其余值收集到一个新列表中。' }
    difficulty: beginner
    tags: [sequence-unpacking, starred-target]

  - id: review-generated-reading-index
    title: { en: 'Review generated reading index', zh: '审查生成的读数索引' }
    type: review
    prompt: { en: 'Review this generated reading-index implementation.', zh: '审查这个生成的读数索引实现。' }
    task: { en: 'Build an index keyed by normalized station and tag set. Reject empty readings, store an immutable reading tuple with its mean, and support mean lookup.', zh: '构建以规范化站点和标签集合为键的索引。拒绝空读数，存储不可变读数元组及平均值，并支持查询平均值。' }
    code: |
      def build_reading_index(rows):
          index = {}
          for row in rows:
              station = row["station"].strip().lower()
              key = (station, row["tags"])
              readings = ()
              for raw in row["readings"]:
                  readings += (float(raw),)
              average = sum(readings) / len(readings)
              index[key] = (readings, average)
          return index


      def lookup_average(index, station, tags):
          key = (station, tags)
          record = index[key]
          return record[1]
    lang: python
    right: { en: 'The code trims and lowercases station names, converts raw readings with float(), stores readings in a tuple, and separates index construction from lookup.', zh: '代码会清理站点名称并转成小写，用 float() 转换原始读数，把读数存为元组，并把索引构建与查询分开。' }
    checklist:
      - { en: 'Test empty, malformed, and single-reading rows.', zh: '测试空读数、格式错误读数和单条读数。' }
      - { en: 'Define one normalization function and apply it on both insertion and lookup.', zh: '定义一个规范化函数，并在写入和查询时共同使用。' }
      - { en: 'Verify every component of a composite key is hashable and semantically stable.', zh: '验证复合键的每个组成部分都可哈希且语义稳定。' }
      - { en: 'Check construction cost with representative row sizes.', zh: '用有代表性的行大小检查构造成本。' }
    issues:
      - line: 5
        kind: correctness
        note: { en: 'row["tags"] is commonly a list and is neither hashable nor normalized as a set. Convert validated tags to a canonical tuple, for example by sorting a deduplicated collection.', zh: 'row["tags"] 通常是列表，既不可哈希，也没有按集合语义规范化。应把验证后的标签转换为规范元组，例如对去重集合排序。' }
      - line: 8
        kind: performance
        note: { en: 'Repeated tuple concatenation rebuilds the accumulated tuple on every iteration. Parse into a list once and convert to a tuple after the loop.', zh: '重复拼接元组会在每次迭代时重建累计结果。应先把读数解析到列表中，再在循环结束后转换一次。' }
      - line: 9
        kind: edge-case
        note: { en: 'An empty readings collection divides by zero instead of raising the task’s deliberate ValueError with useful context.', zh: '读数集合为空时会发生除零，而不是按任务要求抛出包含有效上下文的 ValueError。' }
      - line: 17
        kind: readability
        note: { en: 'The numeric record[1] access hides the stored tuple shape. Unpack it into named local variables or use a named record so the selected field is explicit.', zh: '数字索引 record[1] 隐藏了所存元组的形状。应解包到有意义的局部变量，或使用具名记录，让所选字段清楚可见。' }
    explanation: { en: 'Normalize both key components in one helper, collect parsed readings in a list, reject an empty list, then convert once to a tuple. Reuse the helper during lookup so equivalent input addresses the same entry.', zh: '应在一个辅助函数中规范化键的两个部分，先用列表收集解析后的读数，拒绝空列表，再统一转换为元组。查询时复用该函数，确保等价输入指向同一条目。' }
    difficulty: advanced
    tags: [code-review, tuples, hashability, normalization]
