topic: python/closures
items:
  - id: predict-loop-binding
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      def make_readers():
          readers = []
          for value in range(3):
              readers.append(lambda: value)
          return readers

      print([read() for read in make_readers()])
    lang: python
    options:
      - { text: { en: '[0, 1, 2]', zh: '[0, 1, 2]' }, correct: false }
      - { text: { en: '[2, 2, 2]', zh: '[2, 2, 2]' }, correct: true }
      - { text: { en: '[0, 0, 0]', zh: '[0, 0, 0]' }, correct: false }
      - { text: { en: 'It raises NameError.', zh: '程序抛出 NameError。' }, correct: false }
    explanation: { en: 'All three lambdas share the same value cell. They run after the loop, when that cell contains 2.', zh: '三个 lambda 共享同一个 value cell。调用发生在循环结束后，此时 cell 中是 2。' }
    difficulty: beginner
    tags: [late-binding, predict-output]

  - id: captures-binding-not-snapshot
    type: mcq
    prompt: { en: 'What does a Python closure capture for a free variable?', zh: 'Python 闭包会为自由变量捕获什么？' }
    options:
      - { text: { en: 'The variable binding, whose current object is looked up when the closure runs', zh: '变量绑定；闭包运行时会查找它当前指向的对象' }, correct: true }
      - { text: { en: 'An immutable copy of the value at function creation time', zh: '创建函数时，该值的一份不可变副本' }, correct: false }
      - { text: { en: 'The entire local namespace of every caller', zh: '每个调用者的完整局部命名空间' }, correct: false }
    explanation: { en: 'A closure retains a binding through a cell, not a frozen snapshot. Rebinding that cell changes what later calls observe.', zh: '闭包通过 cell 保留变量绑定，而不是冻结的快照。重新绑定该 cell 会改变后续调用看到的对象。' }
    difficulty: intermediate
    tags: [closures, free-variable]

  - id: nonlocal-rebinding
    type: mcq
    prompt: { en: 'An inner function executes count += 1, but count is bound only in the enclosing function. What happens without nonlocal count?', zh: '内层函数执行 count += 1，但 count 只在外层函数中绑定。省略 nonlocal count 会怎样？' }
    options:
      - { text: { en: 'Python updates the enclosing binding automatically.', zh: 'Python 自动更新外层绑定。' }, correct: false }
      - { text: { en: 'Python treats count as local, so the read raises UnboundLocalError.', zh: 'Python 把 count 视为局部名称，因此读取时抛出 UnboundLocalError。' }, correct: true }
      - { text: { en: 'Python creates or updates a module global named count.', zh: 'Python 创建或更新名为 count 的模块全局变量。' }, correct: false }
    explanation: { en: 'Assignment makes count local to the inner function unless nonlocal changes its scope classification. The += operation reads that uninitialized local before assigning it.', zh: '赋值会让 count 成为内层函数的局部名称，除非 nonlocal 改变其作用域分类。+= 在赋值前先读取这个尚未初始化的局部名称。' }
    difficulty: intermediate
    tags: [nonlocal, scope]

  - id: review-retry-handlers
    type: review
    prompt: { en: 'Review this generated retry-handler factory. Each job should have its own target and retry count.', zh: '审查这段生成的重试处理器工厂。每个任务都应有独立的目标和重试次数。' }
    code: |
      def build_retry_handlers(jobs):
          handlers = []
          for job in jobs:
              attempts = 0
              def retry():
                  nonlocal attempts
                  attempts += 1
                  return job.run(attempts)
              handlers.append(retry)
          return handlers
    lang: python
    issues:
      - line: 4
        kind: correctness
        note: { en: 'Every retry function closes over the same attempts cell in build_retry_handlers, so retry counts are shared.', zh: '所有 retry 函数都捕获 build_retry_handlers 中的同一个 attempts cell，因此会共享重试次数。' }
      - line: 8
        kind: correctness
        note: { en: 'job is one late-bound loop variable, so every handler calls the final job in the iterable.', zh: 'job 是同一个延迟绑定的循环变量，因此每个处理器都会调用迭代中的最后一个任务。' }
    explanation: { en: 'Move attempts and retry into a helper factory called once per job. Each call then creates separate cells for both the job and its retry count.', zh: '把 attempts 和 retry 移入一个辅助工厂，并为每个 job 调用一次。这样每次调用都会为任务及其重试次数创建独立的 cell。' }
    difficulty: advanced
    tags: [code-review, late-binding, nonlocal]

  - id: review-config-loader
    type: review
    title: { en: 'Review a generated config loader', zh: '审查一段生成的配置加载器' }
    prompt: { en: 'Review this generated configuration loader for correctness, safety, and maintainability.', zh: '请从正确性、安全性和可维护性角度审查这段生成的配置加载器。' }
    task: { en: 'Load a YAML config with defaults and allow an environment variable to override the port.', zh: '加载带默认值的 YAML 配置，并允许环境变量覆盖端口。' }
    code: |
      import os
      import yaml

      DEFAULTS = {"host": "127.0.0.1", "port": 8000}

      def load_config(path):
          with open(path) as stream:
              supplied = yaml.load(stream, Loader=yaml.Loader) or {}
          config = DEFAULTS
          config.update(supplied)
          if "APP_PORT" in os.environ:
              config["port"] = os.environ["APP_PORT"]
          return config
    lang: python
    issues:
      - line: 8
        kind: security
        note: { en: 'yaml.Loader can construct arbitrary Python objects; use yaml.safe_load for untrusted configuration.', zh: 'yaml.Loader 可以构造任意 Python 对象；对于不受信任的配置应使用 yaml.safe_load。' }
      - line: 9
        lines: 10
        kind: correctness
        note: { en: 'config aliases DEFAULTS, so update mutates the shared defaults for every later call.', zh: 'config 与 DEFAULTS 指向同一对象，因此 update 会修改共享默认值并影响后续调用。' }
      - line: 12
        kind: correctness
        note: { en: 'The environment override remains a string instead of the integer expected for a port.', zh: '环境变量覆盖值仍是字符串，而端口应为整数。' }
    right: { en: 'The function handles an empty YAML document and keeps the override logic in one place.', zh: '该函数能处理空 YAML 文档，并将覆盖逻辑集中在一处。' }
    checklist:
      - { en: 'Use safe parsers at trust boundaries.', zh: '在信任边界使用安全解析器。' }
      - { en: 'Copy shared defaults before merging user data.', zh: '合并用户数据前复制共享默认值。' }
      - { en: 'Validate and convert values from the environment.', zh: '校验并转换来自环境变量的值。' }
    explanation: { en: 'Use safe_load, merge into a fresh dictionary, and parse APP_PORT as a validated integer.', zh: '应使用 safe_load，将配置合并到新字典中，并把 APP_PORT 解析为经过校验的整数。' }
    difficulty: intermediate
    minutes: 6
    tags: [calibration]
