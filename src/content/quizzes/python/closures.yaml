topic: python/closures
items:
  - id: predict-loop-binding
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      def make_readers():
          readers = []
          for value in range(3):
              readers.append(lambda: value)
          return readers

      print([read() for read in make_readers()])
    lang: python
    options:
      - { text: { en: '[0, 1, 2]', zh: '[0, 1, 2]' }, correct: false }
      - { text: { en: '[2, 2, 2]', zh: '[2, 2, 2]' }, correct: true }
      - { text: { en: '[0, 0, 0]', zh: '[0, 0, 0]' }, correct: false }
      - { text: { en: 'It raises NameError.', zh: '程序抛出 NameError。' }, correct: false }
    explanation: { en: 'All three lambdas share one value cell and run after the loop, when that cell refers to 2.', zh: '三个 lambda 共享同一个 value cell，而且都在循环结束后运行；此时该 cell 指向 2。' }
    difficulty: beginner
    tags: [late-binding, loop, predict-output]
    tests: python3 predict_loop_binding.py
    minutes: 2

  - id: choose-nonlocal-meaning
    type: mcq
    prompt: { en: 'What does nonlocal count mean inside a nested function?', zh: '嵌套函数中的 nonlocal count 表示什么？' }
    options:
      - { text: { en: 'Reads and writes use the nearest enclosing function binding named count.', zh: '读取与写入使用最近外层函数中名为 count 的已有绑定。' }, correct: true }
      - { text: { en: 'Python creates count in the module global namespace.', zh: 'Python 会在模块全局命名空间中创建 count。' }, correct: false }
      - { text: { en: 'Python copies the current value into a new local variable.', zh: 'Python 会把当前值复制到新的局部变量。' }, correct: false }
      - { text: { en: 'Python searches the caller stack for the first count variable.', zh: 'Python 会沿调用栈查找第一个 count 变量。' }, correct: false }
    explanation: { en: 'nonlocal changes compile-time name classification and must resolve to an existing enclosing function binding. It neither searches callers nor targets module globals.', zh: 'nonlocal 会改变编译期名称分类，而且必须解析到外层函数中已有的绑定。它不会搜索调用方，也不指向模块全局名称。' }
    difficulty: intermediate
    tags: [nonlocal, scope, binding]
    minutes: 3

  - id: spot-reset-rebinding
    type: spotbug
    prompt: { en: 'Find why complete() does not update the status observed by read().', zh: '找出 complete() 为何没有更新 read() 看到的状态。' }
    code: |
      def make_status():
          status = "pending"

          def complete():
              status = "done"
              return status

          def read():
              return status

          return complete, read

      complete, read = make_status()
      print(complete(), read())
    lang: python
    issues:
      - line: 5
        kind: correctness
        note: { en: 'Assignment makes status local to complete(), so it creates a separate local binding instead of updating the cell read() uses.', zh: '赋值让 status 成为 complete() 的局部名称，因此它创建了单独的局部绑定，没有更新 read() 使用的 cell。' }
    explanation: { en: 'Add nonlocal status before the assignment when both functions should share the enclosing binding. The output then changes from done pending to done done.', zh: '两个函数需要共享外层绑定时，应在赋值前添加 nonlocal status。输出随后会从 done pending 变为 done done。' }
    difficulty: intermediate
    tags: [nonlocal, rebinding, code-review]
    tests: python3 reset_rebinding.py
    minutes: 4

  - id: default-binding-storage
    type: mcq
    prompt: { en: 'Why does lambda item=item: item avoid the usual loop late-binding bug?', zh: '为什么 lambda item=item: item 能避开常见的循环延迟绑定问题？' }
    options:
      - { text: { en: 'The current object is evaluated at function creation and stored as a parameter default.', zh: '当前对象在创建函数时求值，并保存为形参默认值。' }, correct: true }
      - { text: { en: 'The lambda deep-copies item into a private closure cell.', zh: 'lambda 会把 item 深拷贝进私有闭包 cell。' }, correct: false }
      - { text: { en: 'Python creates a new loop scope for every iteration.', zh: 'Python 会为每轮迭代创建新的循环作用域。' }, correct: false }
      - { text: { en: 'Default arguments are reevaluated on every call.', zh: '默认参数会在每次调用时重新求值。' }, correct: false }
    explanation: { en: 'The left item is a local parameter; the right item is evaluated as the lambda is created. This stores a reference, not an automatic shallow or deep copy.', zh: '左侧 item 是局部形参，右侧 item 在创建 lambda 时求值。这里保存的是引用，不会自动进行浅拷贝或深拷贝。' }
    difficulty: intermediate
    tags: [late-binding, defaults, lambda]
    minutes: 3

  - id: review-generated-retry-callbacks
    type: review
    prompt: { en: 'Review this generated retry-callback factory.', zh: '审查这个生成的重试回调工厂。' }
    task: { en: 'Build one callback per job with an independent retry count, reject non-positive limits, never log credentials, avoid retaining payload history, and return None after that job reaches its limit.', zh: '为每个任务创建具有独立重试计数的回调，拒绝非正限制，不记录凭据，不保留载荷历史，并在该任务达到限制后返回 None。' }
    code: |
      def build_retry_callbacks(client, jobs):
          callbacks = []
          payload_history = []
          attempts = 0

          for job in jobs:
              def retry():
                  nonlocal attempts
                  attempts += 1
                  payload_history.append(job.payload)
                  print(f"retry {job.id} token={job.token}")
                  if attempts > job.max_attempts:
                      return None
                  return client.submit(
                      job.id,
                      job.payload,
                      attempt=attempts,
                  )

              callbacks.append(retry)

          return callbacks
    lang: python
    right: { en: 'The code returns ordinary callables, keeps submission in one place, uses a bounded check before each submit, and preserves exceptions from client.submit() instead of hiding them.', zh: '代码返回普通可调用对象，把提交逻辑集中在一处，在每次提交前进行上限检查，并让 client.submit() 的异常继续传播，而不是隐藏异常。' }
    checklist:
      - { en: 'Map every free variable to the factory invocation and consumer that should own it.', zh: '把每个自由变量映射到应拥有它的工厂调用与使用方。' }
      - { en: 'Run callbacks after construction and interleave calls for at least two jobs.', zh: '在构造结束后运行回调，并交错调用至少两个任务的回调。' }
      - { en: 'Trace credentials and payloads through logs, containers, exceptions, and retained cells.', zh: '跟踪凭据与载荷是否进入日志、容器、异常和长期保留的 cell。' }
      - { en: 'Exercise zero, negative, one, and repeated retry limits.', zh: '覆盖零、负数、一和重复调用等重试限制情况。' }
    issues:
      - line: 4
        lines: 9
        kind: correctness
        note: { en: 'attempts is one cell for the whole factory call and job is one late-bound loop cell, so callbacks share a counter and all target the final job.', zh: 'attempts 是整次工厂调用共享的一个 cell，job 也是一个延迟绑定的循环 cell，因此回调会共享计数，并且全部指向最后一个任务。' }
      - line: 11
        kind: security
        note: { en: 'The print exposes each job token to any process or service that captures standard output.', zh: '这条打印会向任何捕获标准输出的进程或服务暴露任务令牌。' }
      - line: 3
        lines: 8
        kind: performance
        note: { en: 'payload_history grows on every call and keeps every payload reachable even though the stated task requires no history.', zh: 'payload_history 会在每次调用时增长，并让所有载荷保持可达，但任务明确不需要历史记录。' }
      - line: 12
        kind: edge-case
        note: { en: 'A zero or negative max_attempts value is silently treated as an already exhausted job instead of being rejected at construction.', zh: '零或负数 max_attempts 会被静默视为已经耗尽的任务，而不是在构造时遭到拒绝。' }
    explanation: { en: 'Call a helper factory once per job so job and attempts belong to that callback, validate max_attempts before returning callbacks, remove payload_history, and omit credential-bearing logs. Then defer calls until every callback has been constructed and interleave two jobs in the test.', zh: '应为每个任务调用一次辅助工厂，让 job 与 attempts 属于对应回调；返回回调前验证 max_attempts，删除 payload_history，并去掉包含凭据的日志。测试时要等所有回调构造完再调用，并交错执行两个任务。' }
    difficulty: advanced
    tags: [code-review, closures, late-binding, state-ownership]
    tests: python3 -m py_compile retry_callbacks.py
    minutes: 12
