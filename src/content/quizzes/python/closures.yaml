topic: python/closures
items:
  - id: predict-loop-binding
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      def make_readers():
          readers = []
          for value in range(3):
              readers.append(lambda: value)
          return readers

      print([read() for read in make_readers()])
    lang: python
    options:
      - { text: { en: '[0, 1, 2]', zh: '[0, 1, 2]' }, correct: false }
      - { text: { en: '[2, 2, 2]', zh: '[2, 2, 2]' }, correct: true }
      - { text: { en: '[0, 0, 0]', zh: '[0, 0, 0]' }, correct: false }
      - { text: { en: 'It raises NameError.', zh: '程序抛出NameError。' }, correct: false }
    explanation: { en: 'All three lambdas share the same value cell. They run after the loop, when that cell contains 2.', zh: '三个lambda共享同一个value cell。调用发生在循环结束后，此时cell中是2。' }
    difficulty: beginner
    tags: [late-binding, predict-output]

  - id: captures-binding-not-snapshot
    type: mcq
    prompt: { en: 'What does a Python closure capture for a free variable?', zh: 'Python闭包会为自由变量捕获什么？' }
    options:
      - { text: { en: 'The variable binding, whose current object is looked up when the closure runs', zh: '变量绑定；闭包运行时会查找它当前指向的对象' }, correct: true }
      - { text: { en: 'An immutable copy of the value at function creation time', zh: '创建函数时，该值的一份不可变副本' }, correct: false }
      - { text: { en: 'The entire local namespace of every caller', zh: '每个调用者的完整局部命名空间' }, correct: false }
    explanation: { en: 'A closure retains a binding through a cell, not a frozen snapshot. Rebinding that cell changes what later calls observe.', zh: '闭包通过cell保留变量绑定，而不是冻结的快照。重新绑定该cell会改变后续调用看到的对象。' }
    difficulty: intermediate
    tags: [closures, free-variable]

  - id: nonlocal-rebinding
    type: mcq
    prompt: { en: 'An inner function executes count += 1, but count is bound only in the enclosing function. What happens without nonlocal count?', zh: '内层函数执行count += 1，但count只在外层函数中绑定。省略nonlocal count会怎样？' }
    options:
      - { text: { en: 'Python updates the enclosing binding automatically.', zh: 'Python自动更新外层绑定。' }, correct: false }
      - { text: { en: 'Python treats count as local, so the read raises UnboundLocalError.', zh: 'Python把count视为局部名称，因此读取时抛出UnboundLocalError。' }, correct: true }
      - { text: { en: 'Python creates or updates a module global named count.', zh: 'Python创建或更新名为count的模块全局变量。' }, correct: false }
    explanation: { en: 'Assignment makes count local to the inner function unless nonlocal changes its scope classification. The += operation reads that uninitialized local before assigning it.', zh: '赋值会让count成为内层函数的局部名称，除非nonlocal改变其作用域分类。+= 在赋值前先读取这个尚未初始化的局部名称。' }
    difficulty: intermediate
    tags: [nonlocal, scope]

  - id: review-retry-handlers
    type: review
    title: { en: 'Review generated retry handlers', zh: '审查生成的重试处理器' }
    prompt: { en: 'Review this generated code before it is used by the job runner.', zh: '请在任务运行器使用这段生成的代码前进行审查。' }
    task: { en: 'Create one retry handler per job, track attempts independently, enforce max_attempts, and expose a read-only failure history.', zh: '为每个任务创建一个重试处理器，独立记录尝试次数，执行max_attempts限制，并提供只读失败记录。' }
    code: |
      def build_retry_handlers(jobs, max_attempts):
          handlers = []
          failures = []

          for job in jobs:
              attempts = 0

              def retry():
                  nonlocal attempts, failures
                  if attempts > max_attempts:
                      raise RuntimeError("retry limit reached")

                  attempts += 1
                  try:
                      return job.run(attempts)
                  except Exception as error:
                      failures = failures + [(job.name, str(error))]
                      raise

              handlers.append(retry)

          def failure_history():
              return tuple(failures)

          return handlers, failure_history
    lang: python
    issues:
      - line: 8
        kind: correctness
        note: { en: 'A loop does not create a new scope: every retry closure shares the attempts cell and resolves job to the final loop value. Call a helper factory once per job.', zh: '循环不会创建新作用域：所有retry闭包共享同一个attempts cell，并把job解析为循环的最终值。应为每个任务调用一次辅助工厂。' }
      - line: 10
        kind: edge-case
        note: { en: 'The > check permits one call beyond max_attempts; compare with >= before incrementing.', zh: '> 判断会允许一次超出max_attempts的调用；递增前应使用 >= 比较。' }
      - line: 17
        kind: performance
        note: { en: 'Each failure copies every previous record into a new list, making repeated failures quadratic in total; append the new tuple instead.', zh: '每次失败都会把所有旧记录复制到新列表中，因此多次失败的总开销呈二次增长；应直接append新元组。' }
    right: { en: 'The factory exposes a small callback-based API, re-raises job failures, and returns an immutable snapshot of recorded entries.', zh: '该工厂提供了精简的回调式API，会重新抛出任务异常，并以不可变快照返回已有记录。' }
    checklist:
      - { en: 'Map each closure to the exact cells it captures.', zh: '确认每个闭包具体捕获了哪些cell。' }
      - { en: 'Test max_attempts at zero and one, plus the final permitted call.', zh: '测试max_attempts为0和1的情况，以及最后一次允许的调用。' }
      - { en: 'Check the update cost of growing captured collections.', zh: '检查持续增长的捕获集合所需的更新成本。' }
    explanation: { en: 'Move the per-job state into a helper factory, reject a retry when attempts reaches the limit, and append each failure record in place. These changes preserve the callback API while isolating each closure''s state.', zh: '应把每个任务的状态移入辅助工厂，在attempts达到限制时拒绝重试，并原地追加每条失败记录。这些修改既保留回调API，也能隔离每个闭包的状态。' }
    difficulty: intermediate
    minutes: 8
    tags: [code-review, closures, late-binding, nonlocal]
