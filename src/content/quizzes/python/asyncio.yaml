topic: python/asyncio
items:
  - id: predict-task-order
    type: predict
    prompt: { en: 'In what order does this program print its four lines?', zh: '这段程序的四行输出按什么顺序出现？' }
    code: |
      import asyncio

      async def worker(label, delay):
          print(f"start {label}")
          await asyncio.sleep(delay)
          print(f"done {label}")

      async def main():
          await asyncio.gather(worker("A", 0.02), worker("B", 0.01))

      asyncio.run(main())
    lang: python
    options:
      - { text: { en: 'start A, start B, done B, done A', zh: 'start A、start B、done B、done A' }, correct: true }
      - { text: { en: 'start A, done A, start B, done B', zh: 'start A、done A、start B、done B' }, correct: false }
      - { text: { en: 'start B, done B, start A, done A', zh: 'start B、done B、start A、done A' }, correct: false }
      - { text: { en: 'start A, start B, done A, done B', zh: 'start A、start B、done A、done B' }, correct: false }
    explanation: { en: 'Both workers start before either sleep completes. B has the shorter timer, so it resumes and finishes before A.', zh: '两个 worker 都会在任一 sleep 完成前启动。B 的计时更短，因此会先恢复并完成。' }
    difficulty: beginner
    tags: [asyncio, scheduling, predict-output]

  - id: taskgroup-first-failure
    type: mcq
    prompt: { en: 'What normally happens when one child in an active TaskGroup raises ValueError?', zh: '活动 TaskGroup 中的一个子任务抛出 ValueError 时，通常会发生什么？' }
    options:
      - { text: { en: 'The group cancels unfinished siblings, waits for them, then raises an exception group.', zh: '任务组取消未完成的兄弟任务，等待它们结束，再抛出异常组。' }, correct: true }
      - { text: { en: 'The group returns the ValueError as an ordinary result and leaves siblings untouched.', zh: '任务组把 ValueError 当作普通结果返回，并且不处理兄弟任务。' }, correct: false }
      - { text: { en: 'The event loop stops immediately without running any finally blocks.', zh: '事件循环立即停止，不执行任何 finally 块。' }, correct: false }
    explanation: { en: 'TaskGroup gives the operation one failure boundary. A non-cancellation failure cancels unfinished siblings, waits for cleanup, and reports remaining failures together.', zh: 'TaskGroup 为整项操作建立一个失败边界。非取消失败会取消未完成的兄弟任务，等待清理，再统一报告剩余失败。' }
    difficulty: intermediate
    tags: [taskgroup, structured-concurrency, exceptions]

  - id: timeout-conversion
    type: mcq
    prompt: { en: 'Where should code catch the TimeoutError produced by asyncio.timeout()?', zh: '代码应在哪里捕获 asyncio.timeout() 产生的 TimeoutError？' }
    options:
      - { text: { en: 'Outside the async with block', zh: '在 async with 块外' }, correct: true }
      - { text: { en: 'Only inside the protected coroutine', zh: '只能在受保护的协程内部' }, correct: false }
      - { text: { en: 'Inside a callback registered with call_soon()', zh: '在通过 call_soon() 注册的回调中' }, correct: false }
    explanation: { en: 'The timeout context cancels internally and converts that cancellation to TimeoutError as the context exits. Catch it around the async with statement.', zh: '超时上下文会在内部发起取消，并在退出上下文时把取消转换成 TimeoutError。因此应在 async with 语句外捕获。' }
    difficulty: intermediate
    tags: [timeout, cancellation]

  - id: spot-unbounded-batch
    type: spotbug
    prompt: { en: 'This batch must stop on the first failure and run at most ten jobs at once. Find the two design bugs.', zh: '这批任务必须在首次失败时停止，并且最多同时运行十项。找出两个设计错误。' }
    code: |
      import asyncio

      async def run_jobs(jobs):
          tasks = [asyncio.create_task(job()) for job in jobs]
          return await asyncio.gather(*tasks, return_exceptions=True)
    lang: python
    issues:
      - line: 4
        kind: performance
        note: { en: 'The comprehension creates one task per input with no concurrency limit, so a large iterable can overwhelm local and downstream resources.', zh: '列表推导为每项输入创建一个任务，却没有并发上限；大量输入可能压垮本地资源和下游服务。' }
      - line: 5
        kind: correctness
        note: { en: 'return_exceptions=True turns failures into result values and allows siblings to continue, violating the required fail-fast behavior.', zh: 'return_exceptions=True 把失败变成结果值，并允许兄弟任务继续运行，违反了快速失败要求。' }
    explanation: { en: 'Use a TaskGroup for one failure boundary and put a ten-slot semaphore around each job, or feed ten workers from a bounded queue.', zh: '应使用 TaskGroup 建立统一失败边界，并用十个槽位的信号量限制每项任务，或让十个 worker 从有界队列取任务。' }
    difficulty: intermediate
    tags: [gather, bounded-concurrency, code-review]

  - id: review-generated-url-fetcher
    type: review
    prompt: { en: 'Review this generated async URL fetcher against the stated task and identify five distinct risks.', zh: '根据任务要求审查这段生成的异步 URL 获取器，找出五类不同的风险。' }
    task: { en: 'Fetch user-supplied URLs with an async client, preserve input order, allow at most five in-flight requests, apply a two-second deadline to each request, and fail the operation if any request fails.', zh: '使用异步客户端获取用户提供的 URL，保持输入顺序，最多允许五个请求同时进行，为每个请求设置两秒截止时间，并在任一请求失败时让整项操作失败。' }
    right: { en: 'The generated code uses the client asynchronously and separates one-request behavior into a small helper.', zh: '生成代码以异步方式使用客户端，并把单个请求的行为拆进了一个小型辅助函数。' }
    code: |
      import asyncio

      async def fetch_all(client, urls):
          results = []

          async def fetch_one(url):
              response = await client.get(url)
              results.append(response.text)

          for url in urls:
              asyncio.create_task(fetch_one(url))

          await asyncio.sleep(2)
          return results


      async def handler(request, client):
          urls = request.query.getall("url")
          payloads = await fetch_all(client, urls)
          return {"items": payloads}
    lang: python
    issues:
      - line: 7
        kind: security
        note: { en: 'A user-controlled URL is fetched without an allowlist or network-boundary validation, enabling server-side request forgery against internal services.', zh: '代码没有按允许列表或网络边界验证用户控制的 URL，可能造成针对内部服务的服务端请求伪造。' }
      - line: 7
        kind: edge-case
        note: { en: 'The request has no per-request deadline, so one stalled peer can leave a task alive indefinitely.', zh: '请求没有单项截止时间，因此一个无响应的对端可能让任务无限存活。' }
      - line: 8
        kind: readability
        note: { en: 'Mutating a shared outer list hides result ownership and makes completion order, rather than input order, determine the response.', zh: '修改外层共享列表会模糊结果所有权，并让完成顺序而不是输入顺序决定响应顺序。' }
      - line: 10
        kind: performance
        note: { en: 'The loop has no five-request capacity gate and can create an unbounded number of in-flight requests.', zh: '循环没有设置五个请求的容量门槛，可能创建无限多的在途请求。' }
      - line: 11
        kind: correctness
        note: { en: 'The task handles are discarded, and sleeping for two seconds neither proves completion nor propagates task exceptions.', zh: '任务句柄被丢弃，而固定等待两秒既不能证明任务已完成，也不会传播任务异常。' }
    checklist:
      - { en: 'Map every created task to an owner and an await point.', zh: '把每个创建的任务对应到明确的所有者和等待点。' }
      - { en: 'Test input ordering with deliberately reversed completion times.', zh: '故意让完成顺序反转，以测试输入顺序是否保持。' }
      - { en: 'Exercise per-request timeout and first-failure cancellation paths.', zh: '执行单项超时和首次失败取消两条路径。' }
      - { en: 'Validate destinations and measure the maximum in-flight request count.', zh: '验证请求目标，并测量最大在途请求数。' }
    explanation: { en: 'A safe design validates destinations, returns values from indexed tasks, and owns them in a TaskGroup. Put a five-slot semaphore and a two-second timeout around each request so capacity, deadlines, ordering, and failure propagation are explicit.', zh: '安全设计应验证请求目标，让带索引的任务返回值，并由 TaskGroup 统一拥有这些任务。在每个请求外设置五槽信号量和两秒超时，使容量、截止时间、顺序与失败传播都清晰可见。' }
    difficulty: advanced
    tags: [asyncio, code-review, task-ownership, ssrf]
