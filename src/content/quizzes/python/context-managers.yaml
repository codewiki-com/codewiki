topic: python/context-managers
items:
  - id: predict-exit-suppression
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      class Gate:
          def __enter__(self):
              print("enter")
              return 7

          def __exit__(self, exc_type, exc_value, traceback):
              print("exit", exc_type.__name__)
              return exc_type is LookupError


      with Gate() as value:
          print(value)
          raise LookupError("missing")
      print("after")
    lang: python
    options:
      - { text: { en: "enter\n7\nexit LookupError\nafter", zh: "enter\n7\nexit LookupError\nafter" }, correct: true }
      - { text: { en: "enter\n7\nexit LookupError\nLookupError: missing", zh: "enter\n7\nexit LookupError\nLookupError: missing" }, correct: false }
      - { text: { en: "enter\nGate\nexit None\nafter", zh: "enter\nGate\nexit None\nafter" }, correct: false }
      - { text: { en: "enter\n7\nLookupError: missing", zh: "enter\n7\nLookupError: missing" }, correct: false }
    explanation: { en: 'The enter result is 7, and __exit__() receives LookupError. Its true return suppresses that exception, so execution reaches the final print.', zh: '进入结果是 7，`__exit__()` 收到 LookupError。它返回真值并抑制该异常，因此程序会执行最后一次打印。' }
    difficulty: intermediate
    tags: [with, exception-suppression, predict-output]
    tests: python3 predict_exit_suppression.py
    minutes: 3

  - id: choose-entry-failure
    type: mcq
    prompt: { en: 'What must a context manager do if __enter__() fails after acquiring its first subresource?', zh: '上下文管理器的 `__enter__()` 获取第一个子资源后失败，应怎样处理？' }
    options:
      - { text: { en: 'Undo the partial acquisition before propagating, because Python will not call its __exit__().', zh: '传播异常前撤销部分获取，因为 Python 不会调用它的 `__exit__()`。' }, correct: true }
      - { text: { en: 'Return True so Python calls __exit__() without exception details.', zh: '返回 True，让 Python 调用不带异常信息的 `__exit__()`。' }, correct: false }
      - { text: { en: 'Rely on garbage collection to run __exit__() immediately.', zh: '依靠垃圾回收立即运行 `__exit__()`。' }, correct: false }
      - { text: { en: 'Store the resource in the as target so the caller can close it.', zh: '把资源放进 `as` 目标，让调用方关闭它。' }, correct: false }
    explanation: { en: 'The protected region begins only after __enter__() returns. Entry code must clean up its own partial failure, often with an internal ExitStack.', zh: '受保护区域只在 `__enter__()` 返回后建立。进入代码必须自行清理部分失败，常用内部 ExitStack 完成。' }
    difficulty: intermediate
    tags: [enter, partial-acquisition, cleanup]
    minutes: 3

  - id: spot-generator-cleanup
    title: { en: 'Spot the bug in the report context manager', zh: '找出报告上下文管理器里的 bug' }
    type: spotbug
    prompt: { en: 'Find why this report file remains open after the block fails.', zh: '找出代码块失败后报表文件仍保持打开的原因。' }
    code: |
      from contextlib import contextmanager

      @contextmanager
      def open_report(path):
          handle = open(path, "w", encoding="utf-8")
          yield handle
          handle.close()

      try:
          with open_report("report.txt") as report:
              report.write("draft")
              raise ValueError("invalid report")
      except ValueError:
          print(report.closed)
    lang: python
    issues:
      - line: 7
        kind: correctness
        note: { en: 'An exception is thrown at yield, so execution skips the following close call. Put yield in try and close the handle in finally.', zh: '异常会在 yield 位置抛回生成器，因此后面的关闭调用被跳过。应把 yield 放进 try，并在 finally 中关闭文件。' }
    explanation: { en: 'A contextmanager generator must place unconditional cleanup in finally. Code after yield is not automatically a finally suite.', zh: '`contextmanager` 生成器必须把无条件清理放进 finally；yield 后的代码不会自动成为 finally 块。' }
    difficulty: intermediate
    tags: [contextmanager, generator, finally]
    tests: python3 spot_generator_cleanup.py
    minutes: 5

  - id: choose-exitstack-acquisition
    type: mcq
    prompt: { en: 'Why should dynamic acquisition call stack.enter_context() immediately for each resource?', zh: '动态获取资源时，为什么应立即为每项资源调用 `stack.enter_context()`？' }
    options:
      - { text: { en: 'Each successful entry registers cleanup before a later acquisition can fail.', zh: '每次成功进入都会先登记清理，之后的获取才可能失败。' }, correct: true }
      - { text: { en: 'It changes cleanup order from LIFO to FIFO.', zh: '它会把清理顺序从后进先出改为先进先出。' }, correct: false }
      - { text: { en: 'It makes every context manager reentrant.', zh: '它会让每个上下文管理器变得可重入。' }, correct: false }
      - { text: { en: 'It causes callback() functions to receive exception details.', zh: '它会让 `callback()` 函数收到异常信息。' }, correct: false }
    explanation: { en: 'Immediate registration gives earlier resources an owner if a later enter call fails. ExitStack still unwinds in LIFO order.', zh: '立即登记可确保后续进入失败时，较早的资源已经有明确所有者。ExitStack 仍按后进先出顺序展开。' }
    difficulty: intermediate
    tags: [exitstack, ownership, lifo]
    minutes: 3

  - id: review-generated-publish-batch
    type: review
    title: { en: 'Review a generated batch publisher', zh: '审查生成的批量发布器' }
    prompt: { en: 'Review this generated publishing context manager.', zh: '审查这个生成的发布上下文管理器。' }
    task: { en: 'Open a dynamic set of input files safely, expose handles without loading all contents, commit only after success, roll back any failing operation, close every opened file, preserve exceptions, and never log the transaction token.', zh: '安全打开动态数量的输入文件，在不一次性加载全部内容的前提下提供句柄；仅在成功后提交，任何操作失败都要回滚，关闭所有已打开文件，保留异常，且绝不记录事务令牌。' }
    code: |
      from contextlib import contextmanager


      @contextmanager
      def publish_batch(client, paths):
          files = [open(path, encoding="utf-8") for path in paths]
          token = client.begin()
          payloads = [file.read() for file in files]

          try:
              yield payloads
              client.commit(token)
          except Exception as error:
              print(f"publish failed token={token}: {error}")
              return

          for file in files:
              file.close()
    lang: python
    right: { en: 'The code uses a named contextmanager, starts the transaction before handing control to the caller, and places commit after the caller returns successfully.', zh: '代码使用了具名的 contextmanager，在把控制权交给调用方之前启动事务，并把提交放在调用方成功返回之后。' }
    checklist:
      - { en: 'Fail each acquisition position and map every acquired resource to an already-registered cleanup.', zh: '让每个获取位置分别失败，并把每项已获取资源映射到已经登记的清理。' }
      - { en: 'Exercise body, commit, rollback, and close failures and inspect the final exception chain.', zh: '覆盖代码块、提交、回滚和关闭失败，并检查最终异常链。' }
      - { en: 'Measure whether input is streamed or retained as full in-memory payloads.', zh: '检查输入是流式处理，还是以完整载荷形式保留在内存中。' }
      - { en: 'Trace credentials and transaction identifiers through logs and raised errors.', zh: '跟踪凭据和事务标识是否进入日志与抛出的错误。' }
    issues:
      - line: 6
        kind: edge-case
        note: { en: 'The list comprehension registers no cleanup as it goes, so a later open failure leaks every earlier file.', zh: '列表推导式在获取过程中没有登记清理，因此后续打开失败会泄漏之前的所有文件。' }
      - line: 8
        kind: performance
        note: { en: 'Reading every file before yield retains the entire batch in memory and violates the streaming requirement.', zh: '在 yield 前读取所有文件会把整批内容保留在内存中，违反流式处理要求。' }
      - line: 14
        kind: security
        note: { en: 'The error log exposes the transaction token to every sink that captures standard output.', zh: '错误日志会把事务令牌暴露给所有捕获标准输出的接收方。' }
      - line: 15
        kind: correctness
        note: { en: 'Returning from the exception handler suppresses the failure, never rolls back, and skips the file-closing loop.', zh: '从异常处理分支返回会抑制失败，既不回滚，也会跳过文件关闭循环。' }
    explanation: { en: 'Use ExitStack to enter each file immediately, yield the handles, commit in the success branch, roll back and re-raise on failure, and keep closing in an unconditional stack exit. Logging must omit the token.', zh: '应使用 ExitStack 逐个立即进入文件，产生文件句柄，在成功分支提交，在失败分支回滚并重新抛出，再由无条件的栈退出完成关闭。日志必须省略令牌。' }
    difficulty: advanced
    tags: [code-review, contextmanager, exitstack, transactions]
    tests: python3 -m py_compile publish_batch.py
    minutes: 12
