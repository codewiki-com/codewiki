topic: python/map-filter-reduce
items:
  - id: predict-lazy-exhaustion
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      def double(value):
          print(f"double {value}")
          return value * 2

      results = map(double, [1, 2])
      print("ready")
      print(next(results))
      print(list(results))
      print(list(results))
    lang: python
    options:
      - text:
          en: "ready\ndouble 1\n2\ndouble 2\n[4]\n[]"
          zh: "ready\ndouble 1\n2\ndouble 2\n[4]\n[]"
        correct: true
      - text:
          en: "double 1\ndouble 2\nready\n2\n[4]\n[2, 4]"
          zh: "double 1\ndouble 2\nready\n2\n[4]\n[2, 4]"
        correct: false
      - text:
          en: "ready\n2\n[4]\n[4]"
          zh: "ready\n2\n[4]\n[4]"
        correct: false
    explanation: { en: 'Creating map calls nothing. next consumes the first item, the first list call consumes the second, and the exhausted iterator then yields no values.', zh: '创建map时不会调用函数。next消费第一个元素，第一次list调用消费第二个元素，耗尽后的迭代器不再产出值。' }
    difficulty: beginner
    tags: [map, lazy-evaluation, iterator-exhaustion]

  - id: predict-reduce-order
    type: predict
    prompt: { en: 'What value does this left-to-right reduction print?', zh: '这段从左到右的归约会输出什么值？' }
    code: |
      from functools import reduce

      result = reduce(lambda left, right: left - right, [10, 3, 2])
      print(result)
    lang: python
    options:
      - { text: { en: '5', zh: '5' }, correct: true }
      - { text: { en: '9', zh: '9' }, correct: false }
      - { text: { en: '-15', zh: '-15' }, correct: false }
      - { text: { en: 'It raises TypeError.', zh: '程序抛出TypeError。' }, correct: false }
    explanation: { en: 'reduce associates this call from the left: (10 - 3) - 2 is 5. It does not regroup the operation as 10 - (3 - 2).', zh: 'reduce从左侧开始组合，因此计算的是 (10 - 3) - 2，结果为5；它不会改写成10 - (3 - 2)。' }
    difficulty: intermediate
    tags: [reduce, accumulator, evaluation-order]

  - id: map-strict-contract
    type: mcq
    prompt: { en: 'On Python 3.14, when should multi-input map use strict=True?', zh: '在Python 3.14中，多输入map何时应使用strict=True？' }
    options:
      - { text: { en: 'When unequal input lengths violate the data contract and should raise during consumption', zh: '输入长度不一致违反数据契约，应在消费时抛出异常' }, correct: true }
      - { text: { en: 'When the mapping function should run in parallel', zh: '需要让转换函数并发运行时' }, correct: false }
      - { text: { en: 'When map should return a list instead of an iterator', zh: '需要让map返回列表而不是迭代器时' }, correct: false }
      - { text: { en: 'When false mapped values should be removed', zh: '需要删除转换结果中的假值时' }, correct: false }
    explanation: { en: 'Python 3.14 adds strict length checking to map. A mismatch raises ValueError while the iterator is consumed; strict does not add concurrency or materialization.', zh: 'Python 3.14为map增加严格长度检查。长度不一致会在迭代器消费期间抛出ValueError；strict不会增加并发或物化结果。' }
    difficulty: intermediate
    tags: [map, strict, python-3-14]

  - id: spotbug-filter-none
    title: { en: 'Spot the bug in sensor filtering', zh: '找出传感器过滤里的bug' }
    type: spotbug
    prompt: { en: 'This function should remove only None from a sensor stream. Find the bug.', zh: '这个函数只应删除传感器数据中的None。请找出错误。' }
    code: |
      def keep_readings(values):
          return list(filter(None, values))

      print(keep_readings([0, None, 4, False]))
    lang: python
    issues:
      - line: 2
        kind: correctness
        note: { en: 'filter(None, values) removes every false value, so it wrongly discards the valid readings 0 and False; use a predicate that checks value is not None.', zh: 'filter(None, values) 会删除所有假值，因此合法的0和False也被误删；应使用检查value is not None的判断函数。' }
    explanation: { en: 'Truth-value filtering is broader than missing-value filtering. The predicate must encode the field contract explicitly.', zh: '按真值筛选比删除缺失值范围更大。判断函数必须明确表达字段契约。' }
    difficulty: beginner
    tags: [filter, truth-value, missing-values]

  - id: review-payment-summary
    type: review
    title: { en: 'Review a generated payment summary', zh: '审查生成的付款汇总' }
    prompt: { en: 'Review this generated lazy pipeline for correctness, boundary handling, readability, and data movement.', zh: '从正确性、边界处理、可读性和数据移动角度审查这条生成的惰性管道。' }
    task: { en: 'Parse order_id,amount,status CSV lines, retain paid rows, and return their amount total and count.', zh: '解析order_id,amount,status格式的CSV行，保留已付款记录，并返回金额总计与数量。' }
    code: |
      from functools import reduce

      def summarize_payments(lines):
          cleaned = map(str.strip, lines)
          rows = map(lambda line: line.split(","), cleaned)
          paid_rows = filter(lambda row: row[2] == "paid", rows)
          amounts = map(lambda row: float(row[1]), paid_rows)

          def append_amount(acc, amount):
              return acc + [amount]

          paid_amounts = reduce(append_amount, amounts, [])
          total = reduce(lambda acc, amount: acc + amount, paid_amounts)
          return {
              "total": round(total, 2),
              "count": len(paid_amounts),
          }
    lang: python
    issues:
      - line: 5
        kind: readability
        note: { en: 'Anonymous positional fields hide the CSV schema and make later indexes hard to audit; use a named parser that validates and names fields.', zh: '匿名的位置字段掩盖了CSV模式，后续下标难以审查；应使用会校验并命名字段的解析函数。' }
      - line: 6
        kind: edge-case
        note: { en: 'A blank or malformed row with fewer than three fields raises IndexError before the function can report which input was invalid.', zh: '空行或不足三个字段的畸形记录会抛出IndexError，函数无法说明哪条输入无效。' }
      - line: 10
        kind: performance
        note: { en: 'acc + [amount] copies the growing list on every step; a clear loop with append avoids repeated full-list copying.', zh: 'acc + [amount] 每轮都会复制不断增长的列表；使用带append的清晰循环可以避免反复复制整个列表。' }
      - line: 13
        kind: correctness
        note: { en: 'The second reduce has no initializer, so a valid input with zero paid rows raises TypeError instead of returning a zero total.', zh: '第二个reduce没有初始值，因此没有已付款记录的合法输入会抛出TypeError，而不是返回零总计。' }
    right: { en: 'The code separates cleaning, selection, and conversion into lazy stages, keeps source data inline, and gives the collection reduction an explicit list initializer.', zh: '代码把清理、筛选和转换拆成惰性阶段，输入数据路径清楚，并为收集列表的归约显式提供了初始值。' }
    checklist:
      - { en: 'Validate and name parsed fields before filtering by position.', zh: '按位置筛选前，先校验字段并赋予名称。' }
      - { en: 'Define empty-input behavior for every reduction.', zh: '为每个归约定义空输入行为。' }
      - { en: 'Use a money representation whose rounding contract is explicit.', zh: '使用舍入契约明确的金额表示。' }
      - { en: 'Reject repeated copying or hidden side effects in accumulators.', zh: '避免累加器反复复制数据或隐藏副作用。' }
    explanation: { en: 'Use a named CSV parser with validation, represent money according to the domain contract, collect with a straightforward loop, and define zero paid rows as an explicit empty case.', zh: '应使用带校验的具名CSV解析函数，按领域契约表示金额，用直接循环收集结果，并明确处理零条已付款记录。' }
    difficulty: advanced
    minutes: 8
    tags: [map, filter, reduce, code-review]
