topic: python/singledispatch
items:
  - id: predict-bool-inherits-int
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      from functools import singledispatch

      @singledispatch
      def kind(value):
          return "default"

      @kind.register(int)
      def kind_integer(value):
          return "integer"

      print(kind(True))
    lang: python
    options:
      - { text: { en: 'integer', zh: 'integer' }, correct: true }
      - { text: { en: 'default', zh: 'default' }, correct: false }
      - { text: { en: 'bool', zh: 'bool' }, correct: false }
      - { text: { en: 'It raises TypeError.', zh: '抛出 TypeError。' }, correct: false }
    explanation: { en: 'There is no exact bool registration, so dispatch follows inheritance and finds int because bool is an int subclass.', zh: '没有精确的 bool 注册，因此分派器沿继承关系找到 int，因为 bool 是 int 的子类。' }
    difficulty: beginner
    tags: [singledispatch, inheritance, predict-output]

  - id: union-annotation-registration
    type: mcq
    prompt: { en: 'What does @convert.register on a value: int | float implementation register in Python 3.14?', zh: 'Python 3.14 中，对首参注解为 value: int | float 的实现使用 @convert.register，会注册什么？' }
    options:
      - { text: { en: 'Separate int and float entries pointing to that implementation', zh: '分别建立 int 与 float 条目，并指向该实现' }, correct: true }
      - { text: { en: 'One runtime Union object checked on every call', zh: '一个在每次调用时检查的运行时 Union 对象' }, correct: false }
      - { text: { en: 'Only int because it appears first', zh: '只注册排在前面的 int' }, correct: false }
      - { text: { en: 'Nothing; unions are ignored by register', zh: '什么也不注册，因为 register 会忽略联合类型' }, correct: false }
    explanation: { en: 'Annotation-based union registration expands the union into registrations for each member class. It still dispatches on one runtime argument.', zh: '基于联合注解的注册会展开联合，为每个成员类建立条目；运行时仍然只根据一个实参分派。' }
    difficulty: intermediate
    tags: [singledispatch, union, registration]

  - id: spot-second-argument
    title: { en: 'Spot the bug in singledispatch routing', zh: '找出首参数分派里的 bug' }
    type: spotbug
    prompt: { en: 'The text handler is intended to run whenever destination is a string. Find why this call misses it.', zh: '只要 destination 是字符串，就应运行文本处理器。请找出这次调用没有命中的原因。' }
    code: |
      from functools import singledispatch

      @singledispatch
      def ship(payload, destination):
          return f"default:{payload}:{destination}"

      @ship.register(str)
      def ship_text(payload, destination):
          return f"text:{payload}:{destination}"

      print(ship(100, "Paris"))
    lang: python
    issues:
      - line: 11
        kind: correctness
        note: { en: 'Dispatch checks payload, the first argument, whose type is int; move the intended dispatch object first or use explicit two-value logic.', zh: '分派器检查首个实参 payload，而它的类型是 int；应把预期的分派对象移到首位，或显式编写双值判断。' }
    explanation: { en: 'singledispatch never considers the second argument. Registering str affects calls whose first argument is a string, not calls with a later string.', zh: 'singledispatch 从不检查第二个实参。注册 str 只影响首个实参为字符串的调用，不影响后续实参为字符串的调用。' }
    difficulty: beginner
    tags: [singledispatch, first-argument, spotbug]

  - id: abc-ambiguity
    type: mcq
    prompt: { en: 'What happens when two registered, unrelated ABCs both recognize an argument class and neither is more specific?', zh: '两个已注册且互不相关的 ABC 都认可某个实参类，同时没有一方更具体时，会发生什么？' }
    options:
      - { text: { en: 'The call raises RuntimeError for ambiguous dispatch.', zh: '调用因分派歧义抛出 RuntimeError。' }, correct: true }
      - { text: { en: 'The implementation registered last always wins.', zh: '最后注册的实现总是胜出。' }, correct: false }
      - { text: { en: 'The implementation registered first always wins.', zh: '最先注册的实现总是胜出。' }, correct: false }
      - { text: { en: 'Both implementations run in registration order.', zh: '两个实现按注册顺序依次运行。' }, correct: false }
    explanation: { en: 'Registration order cannot establish subtype specificity between unrelated ABCs. Add a more specific registration or narrow the abstractions.', zh: '注册顺序无法在互不相关的 ABC 之间建立子类型优先级；应增加更具体的注册，或缩小抽象范围。' }
    difficulty: advanced
    tags: [singledispatch, abc, ambiguity]

  - id: method-decorator-order
    type: mcq
    prompt: { en: 'How should singledispatchmethod and classmethod be stacked on the generic method?', zh: '泛型方法上的 singledispatchmethod 与 classmethod 应按什么顺序堆叠？' }
    options:
      - { text: { en: 'singledispatchmethod outermost, classmethod directly above def', zh: 'singledispatchmethod 在最外层，classmethod 紧贴 def' }, correct: true }
      - { text: { en: 'classmethod outermost, singledispatchmethod directly above def', zh: 'classmethod 在最外层，singledispatchmethod 紧贴 def' }, correct: false }
      - { text: { en: 'Either order is identical because both preserve register', zh: '两种顺序相同，因为两者都会保留 register' }, correct: false }
      - { text: { en: 'classmethod is forbidden with singledispatchmethod', zh: 'singledispatchmethod 不能与 classmethod 合用' }, correct: false }
    explanation: { en: 'singledispatchmethod must be outermost so its register attribute remains available in the class body. Registered variants retain their own classmethod decorator.', zh: 'singledispatchmethod 必须位于最外层，才能在类体中暴露 register 属性；各注册变体也要保留自己的 classmethod 装饰器。' }
    difficulty: intermediate
    tags: [singledispatchmethod, classmethod, decorators]

  - id: review-generated-plugin-encoder
    type: review
    title: { en: 'Review a generated plugin encoder', zh: '审查生成的插件编码器' }
    prompt: { en: 'Review this generated encoder before it is used by a high-volume plugin export.', zh: '在这段生成的编码器用于高吞吐插件导出前，请审查它。' }
    task: { en: 'Encode text, integer lists, and plugin payloads through one extensible function while keeping dispatch predictable and efficient.', zh: '通过一个可扩展函数编码文本、整数列表与插件载荷，同时保持分派可预测且高效。' }
    code: |
      from collections.abc import Sequence
      from functools import singledispatch

      @singledispatch
      def encode(value):
          return str(value)

      @encode.register(Sequence)
      def encode_sequence(value):
          return [encode(item) for item in value]

      @encode.register
      def encode_numbers(value: list[int]):
          return ",".join(str(item) for item in value)

      def install_plugin(plugin):
          @encode.register(plugin.payload_type)
          def encode_plugin(value):
              return plugin.dump(value)
          return encode_plugin

      def export(records):
          return [encode(record) for record in records]
    lang: python
    issues:
      - line: 13
        kind: correctness
        note: { en: 'list[int] is a parameterized generic rather than a runtime dispatch class, so this registration raises TypeError while the module loads; register list explicitly.', zh: 'list[int] 是参数化泛型，不是运行时分派类，因此模块加载时这项注册会抛出 TypeError；应显式注册 list。' }
      - line: 10
        kind: edge-case
        note: { en: 'str is a Sequence, so text recursively dispatches one-character strings back into the same handler until RecursionError; add an exact str implementation.', zh: 'str 是 Sequence，因此文本会把单字符字符串再次分派给同一处理器，直至抛出 RecursionError；应增加精确的 str 实现。' }
      - line: 16
        kind: readability
        note: { en: 'The installer hides a process-wide registry mutation and has no duplicate-type policy; make startup registration and conflict handling explicit.', zh: '安装函数隐藏了进程级注册表修改，也没有重复类型策略；应明确启动注册过程与冲突处理。' }
      - line: 23
        kind: performance
        note: { en: 'A proven-homogeneous large batch repeats the same dispatch for every record; after validating homogeneity, resolve its handler once and reuse it.', zh: '已确认同质的大批量数据会为每条记录重复相同分派；验证同质性后，可只解析一次处理器并复用。' }
    right: { en: 'The code defines one generic entry point, gives the sequence handler a descriptive name, and returns plugin implementations so they can be tested directly.', zh: '代码定义了单一泛型入口，为序列处理器使用了描述性名称，并返回插件实现，便于直接测试。' }
    checklist:
      - { en: 'Register runtime classes, then validate parameterized contents inside handlers.', zh: '注册运行时类，再在处理器内部验证参数化内容。' }
      - { en: 'Test exact classes, subclasses, ABC matches, and the default path.', zh: '测试精确类、子类、ABC 匹配与默认路径。' }
      - { en: 'Make plugin loading order and duplicate registration policy explicit.', zh: '明确插件加载顺序与重复注册策略。' }
      - { en: 'Optimize repeated dispatch only after profiling and proving batch homogeneity.', zh: '只在性能分析并确认批次同质后，优化重复分派。' }
    explanation: { en: 'A robust extension point separates runtime dispatch classes from static element types, handles broad ABC matches deliberately, and treats registry mutation as startup configuration.', zh: '可靠的扩展点会区分运行时分派类与静态元素类型，谨慎处理宽泛 ABC 匹配，并把注册表修改视为启动配置。' }
    difficulty: advanced
    minutes: 8
    tags: [singledispatch, code-review, plugins, abc]
