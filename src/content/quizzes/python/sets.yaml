topic: python/sets
items:
  - id: predict-equal-numeric-members
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      values = {True, 1, 1.0}
      print(len(values))
      print(True in values)
    lang: python
    options:
      - { text: { en: "1 then True", zh: "先输出 1，再输出 True" }, correct: true }
      - { text: { en: "3 then True", zh: "先输出 3，再输出 True" }, correct: false }
      - { text: { en: "3 then False", zh: "先输出 3，再输出 False" }, correct: false }
      - { text: { en: 'It raises TypeError because the types differ.', zh: '程序抛出 TypeError，因为元素类型不同。' }, correct: false }
    explanation: { en: 'True, 1, and 1.0 compare equal and have compatible hashes, so they represent one set member. Membership then finds that member.', zh: 'True、1 和 1.0 比较相等，并且哈希值满足相等约束，因此只形成一个集合成员；成员测试随后能找到它。' }
    difficulty: beginner
    tags: [sets, equality, predict-output]

  - id: method-versus-operator-operands
    type: mcq
    prompt: { en: 'Which expression accepts a list on the right without converting it first?', zh: '哪个表达式可以直接接受右侧列表，而无需先转换？' }
    options:
      - { text: { en: '{1, 2}.intersection([2, 3])', zh: '{1, 2}.intersection([2, 3])' }, correct: true }
      - { text: { en: '{1, 2} & [2, 3]', zh: '{1, 2} & [2, 3]' }, correct: false }
      - { text: { en: '{1, 2} | [2, 3]', zh: '{1, 2} | [2, 3]' }, correct: false }
      - { text: { en: '{1, 2} - [2, 3]', zh: '{1, 2} - [2, 3]' }, correct: false }
    explanation: { en: 'Set methods accept general iterables, while binary set operators require set-like operands. The method returns {2}; each operator form shown with a list raises TypeError.', zh: '集合方法接受一般可迭代对象，二元集合运算符则要求集合类型的操作数。方法返回 {2}，其余使用列表的运算符形式都会抛出 TypeError。' }
    difficulty: beginner
    tags: [sets, operators, iterables]

  - id: spot-unstable-customer-export
    title: { en: 'Spot the bug in customer ID export', zh: '找出客户 ID 导出里的 bug' }
    type: spotbug
    prompt: { en: 'Find why this generated helper does not reliably return first-occurrence customer IDs and can fail on incomplete records.', zh: '找出这个生成的辅助函数为何不能可靠保留客户 ID 的首次出现顺序，并且会在记录不完整时失败。' }
    code: |
      def unique_customer_ids(records):
          ids = {record["customer_id"] for record in records}
          return list(ids)
    lang: python
    issues:
      - line: 2
        kind: edge-case
        note: { en: 'A record without customer_id raises KeyError; the function has no stated missing-key policy or useful record-level diagnostic.', zh: '缺少 customer_id 的记录会触发 KeyError；函数没有声明缺失键策略，也没有提供具体到记录的诊断。' }
      - line: 3
        kind: correctness
        note: { en: 'Converting the set to a list uses unspecified set iteration order, so it does not preserve first occurrence.', zh: '把集合转换为列表会采用未规定的集合迭代顺序，因此无法保留首次出现顺序。' }
    explanation: { en: 'Validate each record, then traverse the source while keeping a result list and a seen-ID set. Add an ID to both only on its first valid occurrence.', zh: '应先验证每条记录，再遍历原序列，同时维护结果列表和已见 ID 集合；只有有效 ID 首次出现时才把它加入两者。' }
    difficulty: intermediate
    tags: [sets, order-preserving-deduplication, code-review]

  - id: remove-versus-discard
    type: mcq
    prompt: { en: 'A cleanup operation may run repeatedly, and an already-absent member is valid. Which operation best expresses that contract?', zh: '清理操作可能重复执行，而且成员已经不存在属于有效状态。哪个操作最符合这一契约？' }
    options:
      - { text: { en: 'members.discard(value)', zh: 'members.discard(value)' }, correct: true }
      - { text: { en: 'members.remove(value)', zh: 'members.remove(value)' }, correct: false }
      - { text: { en: 'members.pop()', zh: 'members.pop()' }, correct: false }
      - { text: { en: 'del members[value]', zh: 'del members[value]' }, correct: false }
    explanation: { en: 'discard removes the member when present and otherwise does nothing, which makes repeated cleanup idempotent. remove instead raises KeyError on absence.', zh: 'discard 会在成员存在时删除它，不存在时不执行操作，适合幂等清理；remove 在成员缺失时会抛出 KeyError。' }
    difficulty: beginner
    tags: [sets, mutation, idempotency]

  - id: review-generated-permission-plan
    title: { en: 'Review generated permission plan', zh: '审查生成的权限方案' }
    type: review
    prompt: { en: 'Review this generated permission reconciliation before it handles production access data.', zh: '在这段生成的权限协调代码处理生产访问数据前，对它进行审查。' }
    task: { en: 'Return stable added and removed permission lists, ignore blank permissions, leave both inputs unchanged, avoid repeated set construction, and never expose the actor token.', zh: '返回稳定的新增与删除权限列表，忽略空白权限，不修改两个输入，避免重复构造集合，并且绝不暴露操作者令牌。' }
    code: |
      def build_permission_plan(current, desired, actor_token):
          current_set = set(current)
          desired_set = set(desired)

          for permission in desired_set:
              if not permission.strip():
                  desired_set.remove(permission)

          added = {
              permission
              for permission in current
              if permission not in set(desired)
          }
          removed = {
              permission
              for permission in desired
              if permission not in set(current)
          }

          return {
              "added": list(added),
              "removed": list(removed),
              "actor_token": actor_token,
          }
    lang: python
    issues:
      - line: 7
        kind: edge-case
        note: { en: 'Removing a blank permission changes desired_set during iteration and raises RuntimeError instead of ignoring the value.', zh: '删除空白权限会在迭代期间改变 desired_set 的大小，触发 RuntimeError，而不是忽略该值。' }
      - line: 9
        lines: 9
        kind: correctness
        note: { en: 'The difference directions are reversed: added reads current-only members and removed reads desired-only members; both also use the unnormalized inputs.', zh: '差集方向写反了：added 读取只在 current 中的成员，removed 读取只在 desired 中的成员；两边还使用了未经规范化的输入。' }
      - line: 12
        lines: 6
        kind: performance
        note: { en: 'set(desired) and set(current) are rebuilt for every comprehension iteration even though current_set and desired_set already exist.', zh: '推导式每轮都会重新构造 set(desired) 和 set(current)，尽管 current_set 与 desired_set 已经存在。' }
      - line: 23
        kind: security
        note: { en: 'The returned plan exposes actor_token even though the task explicitly forbids returning the credential.', zh: '返回计划泄露了 actor_token，而任务明确禁止返回该凭据。' }
    right: { en: 'The code gives the two input roles domain names, creates local set copies instead of mutating caller-owned containers, and returns a structured plan with separate added and removed fields.', zh: '代码为两类输入使用了领域化名称，创建本地集合副本而没有修改调用方容器，并返回了分别包含 added 和 removed 字段的结构化计划。' }
    checklist:
      - { en: 'Test empty, blank-only, duplicate, and already-equal permission collections.', zh: '测试空集合、只有空白值、存在重复项以及两边已经相等的权限集合。' }
      - { en: 'Derive added as desired minus current and removed as current minus desired.', zh: '确认新增项是 desired 减 current，删除项是 current 减 desired。' }
      - { en: 'Assert deterministic output order and verify both inputs remain unchanged.', zh: '断言输出顺序确定，并验证两个输入保持不变。' }
      - { en: 'Compare returned keys with an allowlist that excludes tokens and other credentials.', zh: '把返回键与允许列表比较，确保排除令牌和其他凭据。' }
    explanation: { en: 'Normalize into fresh sets without mutating during iteration, compute each directional difference once, and sort both outputs. Return only allowlisted plan fields and keep the token outside the result.', zh: '应在不边迭代边修改的前提下规范化为新集合，只计算一次两个方向的差集并排序输出；返回值只包含允许字段，把令牌留在结果之外。' }
    difficulty: advanced
    tags: [sets, code-review, permissions, security]
