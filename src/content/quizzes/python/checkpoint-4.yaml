topic: python/checkpoint-4
items:
  - id: checkpoint-4-enter-value
    type: mcq
    prompt: { en: 'In with manager as resource, where does resource come from?', zh: '在 with manager as resource 中，resource 来自哪里？' }
    options:
      - { text: { en: 'The value returned by manager.__enter__()', zh: 'manager.__enter__() 的返回值' }, correct: true }
      - { text: { en: 'The manager object in every case', zh: '始终是 manager 对象本身' }, correct: false }
      - { text: { en: 'The value returned by manager.__exit__()', zh: 'manager.__exit__() 的返回值' }, correct: false }
    explanation: { en: 'The with statement calls __enter__ before the body and binds its return value after as. That value need not be the manager itself.', zh: 'with 语句会在进入代码块前调用 __enter__，并把其返回值绑定到 as 后面的名称。这个值不一定是管理器本身。' }
    difficulty: beginner
    tags: [checkpoint]

  - id: checkpoint-4-exception-suppression
    type: fill
    prompt: { en: 'Which boolean value returned by __exit__ suppresses an exception from the with block?', zh: '__exit__ 返回哪个布尔值时，会抑制 with 代码块中的异常？' }
    answer: 'True'
    explanation: { en: 'A truthy __exit__ result tells the with statement that the exception was handled. False or None lets it propagate.', zh: '__exit__ 返回真值表示异常已经处理。返回 False 或 None 时，异常会继续传播。' }
    difficulty: beginner
    tags: [checkpoint]

  - id: checkpoint-4-path-composition
    type: mcq
    prompt: { en: 'What does Path("reports") / "daily.json" do?', zh: 'Path("reports") / "daily.json" 会做什么？' }
    options:
      - { text: { en: 'It creates a new Path representing the joined path without touching the filesystem', zh: '创建表示拼接路径的新 Path，不会访问文件系统' }, correct: true }
      - { text: { en: 'It creates the reports directory and an empty daily.json file', zh: '创建 reports 目录和空的 daily.json 文件' }, correct: false }
      - { text: { en: 'It opens daily.json for division-style streaming', zh: '以类似除法的流模式打开 daily.json' }, correct: false }
    explanation: { en: 'The / operator composes Path objects. Creating or opening filesystem entries requires a separate operation.', zh: '/ 运算符用于组合 Path 对象。创建或打开文件系统条目需要另行调用相应操作。' }
    difficulty: beginner
    tags: [checkpoint]

  - id: checkpoint-4-write-boundary
    type: mcq
    prompt: { en: 'What happens when Path("notes.txt").write_text("new") targets an existing file?', zh: '当 Path("notes.txt").write_text("new") 指向已有文件时会怎样？' }
    options:
      - { text: { en: 'It replaces the file contents with "new"', zh: '用 "new" 替换文件内容' }, correct: true }
      - { text: { en: 'It appends "new" to the existing contents', zh: '把 "new" 追加到现有内容之后' }, correct: false }
      - { text: { en: 'It refuses to write unless overwrite=True is passed', zh: '除非传入 overwrite=True，否则拒绝写入' }, correct: false }
    explanation: { en: 'Path.write_text opens the path for text writing and truncates an existing regular file. Appending needs an explicit append-mode open.', zh: 'Path.write_text 会以文本写入方式打开路径，并截断已有普通文件。若要追加内容，必须显式使用追加模式打开文件。' }
    difficulty: intermediate
    tags: [checkpoint]

  - id: checkpoint-4-json-destinations
    type: mcq
    prompt: { en: 'Which statement correctly distinguishes json.dumps() from json.dump()?', zh: '哪项陈述正确区分了 json.dumps() 与 json.dump()？' }
    options:
      - { text: { en: 'dumps returns a JSON string; dump writes JSON to a file-like object', zh: 'dumps 返回 JSON 字符串；dump 把 JSON 写入类文件对象' }, correct: true }
      - { text: { en: 'dump returns bytes; dumps always writes to disk', zh: 'dump 返回字节；dumps 总是写入磁盘' }, correct: false }
      - { text: { en: 'They differ only in indentation defaults', zh: '二者只在默认缩进方式上有区别' }, correct: false }
    explanation: { en: 'The s form serializes to a string, while dump needs a destination object with write(). Neither validates a domain schema.', zh: '带 s 的形式会序列化为字符串，而 dump 需要一个具有 write() 的目标对象。二者都不会验证领域数据结构。' }
    difficulty: intermediate
    tags: [checkpoint]

  - id: checkpoint-4-parse-failure
    type: fill
    prompt: { en: 'By default, what SystemExit status does argparse use for an invalid value such as --count nope when type=int?', zh: '默认情况下，当 type=int 却收到 --count nope 这样的无效值时，argparse 使用哪个 SystemExit 状态码？' }
    answer: '2'
    explanation: { en: 'ArgumentParser reports a command-line usage error and exits with status 2 before normal application logic runs.', zh: 'ArgumentParser 会报告命令行用法错误，并在正常应用逻辑运行前以状态码 2 退出。' }
    difficulty: intermediate
    tags: [checkpoint]

  - id: checkpoint-4-handler-threshold
    type: mcq
    prompt: { en: 'A logger accepts DEBUG and above, but its only handler is set to WARNING. What happens to an INFO record?', zh: '一个 logger 接受 DEBUG 及以上级别，但唯一的 handler 设为 WARNING。INFO 记录会怎样？' }
    options:
      - { text: { en: 'The logger creates it, but the handler filters it out', zh: 'logger 会创建该记录，但 handler 会将其过滤掉' }, correct: true }
      - { text: { en: 'The handler emits it because the logger accepted it', zh: 'handler 会输出，因为 logger 已经接受它' }, correct: false }
      - { text: { en: 'Python automatically lowers the handler threshold to DEBUG', zh: 'Python 会自动把 handler 阈值降为 DEBUG' }, correct: false }
    explanation: { en: 'A record must pass both the logger’s effective level and the receiving handler’s level. Passing the first threshold does not bypass the second.', zh: '日志记录必须同时通过 logger 的有效级别和接收它的 handler 级别。通过第一道阈值并不会绕过第二道。' }
    difficulty: advanced
    tags: [checkpoint]

  - id: checkpoint-4-missing-exception
    type: mcq
    prompt: { en: 'What does pytest do if code inside with pytest.raises(ValueError) completes normally?', zh: '如果 with pytest.raises(ValueError) 中的代码正常结束，pytest 会怎样？' }
    options:
      - { text: { en: 'It fails the test because the expected exception was not raised', zh: '测试失败，因为预期异常没有抛出' }, correct: true }
      - { text: { en: 'It passes because completing normally is always acceptable', zh: '测试通过，因为正常结束始终可以接受' }, correct: false }
      - { text: { en: 'It raises ValueError on behalf of the tested code', zh: 'pytest 会替被测代码抛出 ValueError' }, correct: false }
    explanation: { en: 'pytest.raises asserts that the selected exception crosses the context boundary. No exception is an assertion failure, not a success.', zh: 'pytest.raises 断言指定异常会越过上下文边界。没有异常意味着断言失败，而不是测试成功。' }
    difficulty: advanced
    tags: [checkpoint]
