topic: python/functions
items:
  - id: predict-shared-default
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      def record(event, events=[]):
          events.append(event)
          return len(events)

      print(record("created"), record("paid"))
    lang: python
    options:
      - { text: { en: '1 1', zh: '1 1' }, correct: false }
      - { text: { en: '1 2', zh: '1 2' }, correct: true }
      - { text: { en: '2 2', zh: '2 2' }, correct: false }
      - { text: { en: 'It raises TypeError.', zh: '程序抛出 TypeError。' }, correct: false }
    explanation: { en: 'The list default is created once and shared. Calls are evaluated left to right, so the first append makes the length 1 and the second makes it 2.', zh: '列表默认值只创建一次，并由两次调用共享。调用从左到右求值，因此第一次追加后长度为 1，第二次追加后长度为 2。' }
    difficulty: beginner
    tags: [defaults, mutable-state, predict-output]
    tests: python3 shared_default.py
    minutes: 2

  - id: predict-implicit-none
    type: predict
    prompt: { en: 'What two lines does this program print?', zh: '这段程序会输出哪两行？' }
    code: |
      def announce(name):
          print(f"hello {name}")

      result = announce("Mina")
      print(result)
    lang: python
    options:
      - { text: { en: 'hello Mina, then None', zh: '先输出 hello Mina，再输出 None' }, correct: true }
      - { text: { en: 'hello Mina twice', zh: '输出两次 hello Mina' }, correct: false }
      - { text: { en: 'None only', zh: '只输出 None' }, correct: false }
      - { text: { en: 'It raises NameError.', zh: '程序抛出 NameError。' }, correct: false }
    explanation: { en: 'announce prints during its body and then reaches the end, so the call returns None. The final print displays that return value.', zh: 'announce 在函数体中先打印，然后执行到末尾，因此调用返回 None。最后一个 print 会显示这个返回值。' }
    difficulty: beginner
    tags: [return, none, side-effect]
    tests: python3 implicit_none.py
    minutes: 2

  - id: choose-parameter-kind
    type: mcq
    prompt: { en: 'Which signature makes order_id positional-only and timeout keyword-only?', zh: '哪个签名会让 order_id 仅限位置传入，并让 timeout 仅限关键字传入？' }
    options:
      - { text: { en: 'def load(order_id, /, *, timeout=5):', zh: 'def load(order_id, /, *, timeout=5):' }, correct: true }
      - { text: { en: 'def load(*, order_id, timeout=5):', zh: 'def load(*, order_id, timeout=5):' }, correct: false }
      - { text: { en: 'def load(order_id, timeout=5, /):', zh: 'def load(order_id, timeout=5, /):' }, correct: false }
      - { text: { en: 'def load(order_id, *timeout):', zh: 'def load(order_id, *timeout):' }, correct: false }
    explanation: { en: 'Parameters before / are positional-only, and parameters after a bare * are keyword-only. The default makes timeout optional but does not change its parameter kind.', zh: '/ 之前的形参仅限位置传入，裸 * 之后的形参仅限关键字传入。默认值让 timeout 成为可选形参，但不会改变其种类。' }
    difficulty: beginner
    tags: [signature, positional-only, keyword-only]
    minutes: 2

  - id: spot-mutable-default
    type: spotbug
    prompt: { en: 'Find the state leak in this tag helper.', zh: '找出这个标签辅助函数中的状态泄漏。' }
    code: |
      def add_tag(tag: str, tags: list[str] = []) -> list[str]:
          tags.append(tag)
          return tags

      first = add_tag("urgent")
      second = add_tag("gift")
      print(first, second)
    lang: python
    issues:
      - line: 1
        kind: edge-case
        note: { en: 'The list default is one shared object, so the second call mutates the result retained by the first call as well.', zh: '列表默认值是同一个共享对象，因此第二次调用也会修改第一次调用保留的结果。' }
    explanation: { en: 'Use None as the default and allocate a list inside the function when no list is supplied. That preserves explicit caller-owned lists while isolating omitted arguments.', zh: '应使用 None 作为默认值，并在调用方没有提供列表时于函数体内创建列表。这样既保留显式传入的列表，也能隔离省略实参的调用。' }
    difficulty: beginner
    tags: [mutable-default, state-leak, code-review]
    tests: python3 tag_helper.py
    minutes: 3

  - id: review-generated-order-pricer
    type: review
    prompt: { en: 'Review this generated order-pricing function.', zh: '审查这个生成的订单计价函数。' }
    task: { en: 'Price an order in integer cents, reject non-positive quantities, apply the best supplied discount, keep customer email out of logs, and return the total plus the average item value.', zh: '以整数分为单位计算订单价格，拒绝非正数量，应用给出的最佳折扣，不在日志中暴露客户邮箱，并返回总额及商品平均金额。' }
    code: |
      def price_order(
          items: list[dict[str, int]],
          customer_email: str,
          discounts: list[int] = [],
      ) -> dict[str, int]:
          discounts.append(0)
          subtotal = sum(
              item["unit_cents"] * item["quantity"]
              for item in items
          )
          discounted = subtotal - max(discounts)
          tax = int(discounted * 0.2)
          print(f"priced {customer_email}: {subtotal}")

          if len(items) == 0:
              average = 0
          else:
              average = sum(
                  item["unit_cents"] * item["quantity"]
                  for item in items
              ) // len(items)

          return {"total_cents": discounted + tax, "average_cents": average}
    lang: python
    right: { en: 'The generated code uses integer cents, returns a structured mapping, incorporates the best supplied discount, and handles the empty-order average without dividing by zero.', zh: '生成代码使用整数分，返回结构化映射，应用给出的最佳折扣，并在空订单中避免计算平均值时除以零。' }
    checklist:
      - { en: 'Classify every default as immutable, intentionally shared, or allocated per call.', zh: '把每个默认值归类为不可变、刻意共享或每次调用新建。' }
      - { en: 'Exercise empty, zero, negative, and threshold inputs.', zh: '覆盖空值、零值、负值和阈值输入。' }
      - { en: 'Trace sensitive data through prints, logs, exceptions, and returns.', zh: '跟踪敏感数据是否进入打印、日志、异常和返回值。' }
      - { en: 'Name policy inputs and avoid repeating completed calculations.', zh: '为策略输入命名，并避免重复已经完成的计算。' }
    issues:
      - line: 4
        kind: edge-case
        note: { en: 'discounts is a mutable default, and appending to it leaks state across calls that omit the argument.', zh: 'discounts 是可变默认值，对它执行追加会在省略该实参的调用之间泄漏状态。' }
      - line: 8
        kind: correctness
        note: { en: 'The calculation accepts zero and negative quantities even though the task requires rejecting them.', zh: '计算会接受零数量和负数量，但任务要求拒绝这些值。' }
      - line: 12
        kind: readability
        note: { en: 'The unexplained 0.2 embeds tax policy and its units in the body instead of naming that input or rule.', zh: '未说明的 0.2 把税务策略及其单位藏在函数体中，没有为输入或规则命名。' }
      - line: 13
        kind: security
        note: { en: 'Printing the customer email exposes personal data to whichever process captures standard output.', zh: '打印客户邮箱会把个人数据暴露给任何捕获标准输出的进程。' }
      - line: 18
        lines: 4
        kind: performance
        note: { en: 'The generator repeats the subtotal traversal even though subtotal already contains the same completed calculation.', zh: 'subtotal 已经保存同一计算结果，这个生成器却再次遍历商品并重复计算。' }
    explanation: { en: 'Use an immutable or None default, validate quantities before arithmetic, make tax policy explicit, omit personal-data printing, and derive the average from the existing subtotal. Then test repeated calls as well as empty and invalid orders.', zh: '应改用不可变默认值或 None，在计算前验证数量，显式表达税务策略，删除个人数据打印，并用现有 subtotal 计算平均值。随后测试连续调用、空订单和无效订单。' }
    difficulty: advanced
    tags: [code-review, defaults, contracts, side-effects]
    tests: python3 -m py_compile order_pricer.py
    minutes: 12
