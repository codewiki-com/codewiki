topic: python/scope-namespaces
items:
  - id: predict-legb-resolution
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      region = "global"

      def make_reader():
          region = "enclosing"

          def read(prefix):
              return f"{prefix}:{region}:{len(prefix)}"

          return read

      print(make_reader()("EU"))
    lang: python
    options:
      - { text: { en: 'EU:global:2', zh: 'EU:global:2' }, correct: false }
      - { text: { en: 'EU:enclosing:2', zh: 'EU:enclosing:2' }, correct: true }
      - { text: { en: 'EU:enclosing:8', zh: 'EU:enclosing:8' }, correct: false }
      - { text: { en: 'It raises NameError.', zh: '程序抛出 NameError。' }, correct: false }
    explanation: { en: 'prefix is local, region comes from the nearest enclosing function, and len comes from built-ins. The same-named module binding is shadowed.', zh: 'prefix 是局部名称，region 来自最近的外层函数，len 来自内置命名空间；模块中的同名绑定被遮蔽。' }
    difficulty: beginner
    tags: [legb, predict-output]

  - id: predict-unbound-local
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      rate = 10

      def quote():
          try:
              print(rate)
          except UnboundLocalError:
              print("unbound")
          rate = 5
          print(rate)

      quote()
      print(rate)
    lang: python
    options:
      - { text: { en: '10, then 5, then 5', zh: '依次输出 10、5、5' }, correct: false }
      - { text: { en: 'unbound, then 5, then 10', zh: '依次输出 unbound、5、10' }, correct: true }
      - { text: { en: 'unbound, then 5, then 5', zh: '依次输出 unbound、5、5' }, correct: false }
      - { text: { en: 'The first read prints 10 without an exception.', zh: '第一次读取直接输出 10，不会抛出异常。' }, correct: false }
    explanation: { en: 'The later assignment classifies rate as local throughout quote, so the first read is unbound. The local assignment does not change the module binding.', zh: '后面的赋值让 rate 在整个 quote 中都属于局部名称，因此首次读取尚未绑定；局部赋值不会改变模块绑定。' }
    difficulty: intermediate
    tags: [unboundlocalerror, name-binding]

  - id: binding-operations
    type: mcq
    prompt: { en: 'Which construct binds a name in the current code block?', zh: '下列哪种结构会在当前代码块中绑定名称？' }
    options:
      - { text: { en: 'import decimal as money', zh: 'import decimal as money' }, correct: true }
      - { text: { en: 'invoice.total = 10', zh: 'invoice.total = 10' }, correct: false }
      - { text: { en: 'records[0] = item', zh: 'records[0] = item' }, correct: false }
      - { text: { en: 'customer.refresh()', zh: 'customer.refresh()' }, correct: false }
    explanation: { en: 'The import binds money in the current block. Attribute assignment, item assignment, and a method call operate on already resolved objects.', zh: 'import 会在当前代码块中绑定 money；属性赋值、元素赋值和方法调用都作用于已经解析出的对象。' }
    difficulty: intermediate
    tags: [binding, imports]

  - id: spot-class-namespace
    title: { en: 'Spot the bug in the invoice renderer', zh: '找出发票渲染器里的 bug' }
    type: spotbug
    prompt: { en: 'Find the scope error in this invoice class.', zh: '找出这个发票类中的作用域错误。' }
    code: |
      currency = "EUR"

      class Invoice:
          currency = "USD"

          def render(self):
              return f"{currency} {self.total}"
    lang: python
    issues:
      - line: 7
        kind: correctness
        note: { en: 'Bare currency resolves to the module binding, not the class attribute. Use self.currency or type(self).currency.', zh: '裸名称 currency 会解析到模块绑定，而不是类属性；应使用 self.currency 或 type(self).currency。' }
    explanation: { en: 'A class namespace is not an ordinary enclosing function scope for its methods. Attribute access makes the intended owner explicit.', zh: '类命名空间不是方法的普通外层函数作用域；属性访问能明确表达预期所有者。' }
    difficulty: intermediate
    tags: [class-namespace, shadowing]

  - id: locals-python-314
    type: mcq
    prompt: { en: 'In a Python 3.14 function, what happens after locals()["count"] = 3?', zh: '在 Python 3.14 的函数中执行 locals()["count"] = 3 后会怎样？' }
    options:
      - { text: { en: 'A local variable named count is created.', zh: '创建名为 count 的局部变量。' }, correct: false }
      - { text: { en: 'Only the returned snapshot changes; no local binding is created.', zh: '只有返回的快照发生变化，不会创建局部绑定。' }, correct: true }
      - { text: { en: 'A module-global count is created.', zh: '创建模块全局变量 count。' }, correct: false }
    explanation: { en: 'Optimized scopes return fresh locals() dictionaries whose mutation is not written back to local bindings. Use an explicit dictionary for dynamic fields.', zh: '优化作用域中的 locals() 会返回新字典，对它的修改不会写回局部绑定；动态字段应放在显式字典中。' }
    difficulty: advanced
    tags: [locals, python-3-14]

  - id: review-tenant-pricing-handlers
    type: review
    title: { en: 'Review generated tenant pricing handlers', zh: '审查生成的租户定价处理器' }
    prompt: { en: 'Review this generated handler factory for isolation, safety, and clear name ownership.', zh: '从隔离性、安全性和名称所有权角度审查这个生成的处理器工厂。' }
    task: { en: 'Create one pricing handler per tenant, with an independent attempt count and a tenant-specific discount.', zh: '为每个租户创建定价处理器，并保存独立的尝试次数和租户专属折扣。' }
    code: |
      attempts = 0

      def build_handlers(tenants):
          handlers = []
          for tenant in tenants:
              rate = tenant["discount"]
              formula = tenant["formula"]

              def handle(order):
                  global attempts
                  attempts += 1
                  if order["total"] <= 0:
                      return None
                  locals()["rate"] = rate
                  price = eval(formula)
                  return {
                      "tenant": tenant["name"],
                      "attempt": attempts,
                      "price": price,
                  }

              handlers.append(handle)
          return handlers
    lang: python
    issues:
      - line: 10
        kind: correctness
        note: { en: 'global attempts makes every tenant and every factory call share one module counter instead of owning an independent count.', zh: 'global attempts 让所有租户和所有工厂调用共享同一个模块计数器，而不是各自拥有独立计数。' }
      - line: 15
        kind: security
        note: { en: 'Evaluating a tenant-supplied formula as Python code permits arbitrary code execution. Use explicit arithmetic or a validated strategy.', zh: '把租户提供的公式当作 Python 代码求值会允许任意代码执行；应使用显式运算或经过校验的策略。' }
      - line: 5
        kind: edge-case
        note: { en: 'The handlers close over shared loop bindings, so delayed calls use the final tenant, rate, and formula.', zh: '这些处理器捕获了共享的循环绑定，延迟调用时都会使用最后一个 tenant、rate 和 formula。' }
      - line: 14
        kind: readability
        note: { en: 'Writing through locals() hides data flow and does not create a function-local binding in Python 3.14. Refer to an explicit value instead.', zh: '通过 locals() 写入会隐藏数据流，而且在 Python 3.14 中不会创建函数局部绑定；应直接引用显式值。' }
    right: { en: 'The code rejects non-positive totals before pricing and returns a compact result containing the tenant, attempt number, and price.', zh: '这段代码会在定价前拒绝非正数金额，并返回包含租户、尝试次数和价格的紧凑结果。' }
    checklist:
      - { en: 'Map every read and binding to its owning scope.', zh: '把每次读取和绑定对应到实际所有作用域。' }
      - { en: 'Call all handlers after the construction loop.', zh: '在构造循环结束后再调用所有处理器。' }
      - { en: 'Interleave handlers and verify their counters stay independent.', zh: '交错调用处理器，确认各自计数保持独立。' }
      - { en: 'Reject dynamic code execution at the configuration boundary.', zh: '在配置边界拒绝动态代码执行。' }
    explanation: { en: 'Use a helper factory once per tenant so the tenant, rate, and counter receive separate bindings. Replace eval with a small validated operation chosen from explicit functions.', zh: '应为每个租户调用一次辅助工厂，让 tenant、rate 和计数器获得独立绑定；再用从显式函数中选择的受控操作替代 eval。' }
    difficulty: advanced
    minutes: 8
    tags: [code-review, scope, isolation, security]
