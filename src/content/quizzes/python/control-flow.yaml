topic: python/control-flow
items:
  - id: predict-loop-else
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      values = [2, 4, 7]

      for value in values:
          if value % 2 == 0:
              continue
          if value > 10:
              break
      else:
          print("complete")
    lang: python
    options:
      - { text: { en: 'complete', zh: 'complete' }, correct: true }
      - { text: { en: 'It prints nothing because continue skips else.', zh: '没有输出，因为continue会跳过else。' }, correct: false }
      - { text: { en: '7', zh: '7' }, correct: false }
      - { text: { en: 'It raises RuntimeError.', zh: '程序抛出RuntimeError。' }, correct: false }
    explanation: { en: 'No iteration executes break. continue skips only its current iteration, so the loop exhausts the list and runs else.', zh: '所有迭代都没有执行break。continue只跳过当前一轮，因此循环耗尽列表后会执行else。' }
    difficulty: beginner
    tags: [loop-else, continue, predict-output]

  - id: boolean-operators-return-operands
    type: mcq
    prompt: { en: 'What is the value of result after result = [] or "fallback"?', zh: '执行result = [] or "fallback" 后，result的值是什么？' }
    options:
      - { text: { en: 'False', zh: 'False' }, correct: false }
      - { text: { en: '[]', zh: '[]' }, correct: false }
      - { text: { en: '"fallback"', zh: '"fallback"' }, correct: true }
      - { text: { en: 'True', zh: 'True' }, correct: false }
    explanation: { en: 'The empty list is false, so or evaluates and returns its right operand. Boolean operators do not always return a bool.', zh: '空列表为假，因此or会计算并返回右操作数。布尔运算符不一定返回bool。' }
    difficulty: beginner
    tags: [truth-value, short-circuit]

  - id: spotbug-remove-during-iteration
    title: { en: 'Spot the bug in archived-record removal', zh: '找出归档记录删除里的bug' }
    type: spotbug
    prompt: { en: 'Find the bug in this function that should remove every archived record.', zh: '找出这个函数中的错误；它应删除所有已归档记录。' }
    code: |
      def remove_archived(records):
          for record in records:
              if record["archived"]:
                  records.remove(record)
          return records
    lang: python
    issues:
      - line: 4
        kind: correctness
        note: { en: 'Removing from the list shifts later elements while its iterator advances, so adjacent archived records can be skipped.', zh: '迭代器前进时删除列表元素会移动后续位置，因此相邻的已归档记录可能被跳过。' }
    explanation: { en: 'Build a filtered list, such as [record for record in records if not record["archived"]]. This also makes the input-mutation decision explicit.', zh: '应构造过滤后的新列表，例如[record for record in records if not record["archived"]]。这样也能明确是否修改输入。' }
    difficulty: beginner
    tags: [iteration, mutation, code-review]

  - id: match-bare-name
    type: mcq
    prompt: { en: 'Inside match status, what does case READY: normally mean?', zh: '在match status中，case READY: 通常表示什么？' }
    options:
      - { text: { en: 'Compare status with the existing variable READY', zh: '把status与现有变量READY比较' }, correct: false }
      - { text: { en: 'Capture status in a new binding named READY', zh: '把status捕获到名为READY的新绑定中' }, correct: true }
      - { text: { en: 'Compare status with the string "READY"', zh: '把status与字符串 "READY" 比较' }, correct: false }
      - { text: { en: 'Test whether status has an attribute named READY', zh: '测试status是否有名为READY的属性' }, correct: false }
    explanation: { en: 'A bare name is a capture pattern and normally matches any subject. Use a literal or a qualified constant such as State.READY for value matching.', zh: '裸名称是捕获模式，通常会匹配任何主题。需要按值匹配时，应使用字面量或State.READY这样的限定常量。' }
    difficulty: intermediate
    tags: [pattern-matching, capture-pattern]

  - id: review-command-dispatch
    type: review
    title: { en: 'Review a generated command dispatcher', zh: '审查生成的命令分派器' }
    prompt: { en: 'Review this generated command dispatcher before it handles a large queue.', zh: '在这段生成的命令分派器处理大型队列前审查它。' }
    task: { en: 'Dispatch at most limit commands, permit only admin and operator roles, and stop on any quit command, including one with a payload. The handlers mapping contains every non-quit action.', zh: '最多分派limit条命令，只允许admin和operator角色，并在任何quit命令处停止，包括带payload的quit。handlers映射包含所有非quit动作。' }
    code: |
      def dispatch_commands(commands, role, handlers, limit):
          completed = []
          dispatched = 0

          while commands and dispatched <= limit:
              command = commands.pop(0)

              match command:
                  case {"action": action, "payload": payload}:
                      if role == "admin" or "operator":
                          result = handlers[action](payload)
                          completed.append(result)
                          dispatched += 1
                  case {"action": "quit"}:
                      break
                  case _:
                      continue
          else:
              print("all commands processed")

          return completed
    lang: python
    right: { en: 'The generated code uses a mapping pattern to extract command data, keeps completed results in input order, and includes an explicit fallback for malformed commands.', zh: '生成代码使用映射模式提取命令数据，按输入顺序保存完成结果，并为格式错误的命令提供了明确的默认分支。' }
    issues:
      - line: 5
        kind: edge-case
        note: { en: 'The <= comparison allows limit + 1 commands; a zero limit can still dispatch one command.', zh: '<= 会允许分派limit + 1条命令；limit为零时仍可能分派一条。' }
      - line: 6
        kind: performance
        note: { en: 'Repeated pop(0) shifts the remaining list on every iteration, making a large queue quadratic to consume.', zh: '反复执行pop(0) 会在每轮移动列表中的剩余元素，消费大型队列时会形成二次复杂度。' }
      - line: 9
        kind: correctness
        note: { en: 'The general action-and-payload pattern precedes the quit case, so a quit command with a payload is dispatched instead of stopping.', zh: '一般的action与payload模式位于quit分支之前，因此带payload的quit会被分派，而不是停止。' }
      - line: 10
        kind: security
        note: { en: 'The nonempty string "operator" is always true, so every role is authorized.', zh: '非空字符串 "operator" 始终为真，因此任何角色都会通过授权。' }
    checklist:
      - { en: 'Test limits of zero, one, and the queue length.', zh: '测试零、一和队列长度这三种上限。' }
      - { en: 'Exercise every role with both permitted and denied commands.', zh: '让每种角色分别执行允许和拒绝的命令。' }
      - { en: 'Test specific control commands both with and without optional fields.', zh: '测试带有和不带可选字段的具体控制命令。' }
      - { en: 'Measure or inspect the cost of the queue operation used in the loop.', zh: '测量或检查循环所用队列操作的成本。' }
    explanation: { en: 'Fix the bound, use an iterator or deque, put the quit pattern first, and test role membership explicitly. Each finding concerns a different review dimension.', zh: '应修正上限，使用迭代器或deque，把quit模式放在前面，并显式测试角色成员关系。每项问题属于不同的审查维度。' }
    difficulty: advanced
    tags: [code-review, authorization, pattern-matching, loops]
