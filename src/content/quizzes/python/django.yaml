topic: python/django
items:
  - id: predict-queryset-evaluation
    type: predict
    prompt: { en: 'After three orders already exist and query logging is reset, what does this code print?', zh: '已有三条订单记录并重置查询日志后，这段代码会输出什么？' }
    code: |
      reset_queries()
      paid_orders = Order.objects.filter(status="paid").order_by("-total_cents")
      print(len(connection.queries))
      print(list(paid_orders.values_list("total_cents", flat=True)))
      print(len(connection.queries))
    lang: python
    options:
      - { text: { en: '0, then [4200, 2500], then 1', zh: '依次为 0、[4200, 2500]、1' }, correct: true }
      - { text: { en: '1, then [4200, 2500], then 1', zh: '依次为 1、[4200, 2500]、1' }, correct: false }
      - { text: { en: '0, then [2500, 4200], then 2', zh: '依次为 0、[2500, 4200]、2' }, correct: false }
      - { text: { en: '0, then a QuerySet object, then 0', zh: '依次为 0、一个 QuerySet 对象、0' }, correct: false }
    explanation: { en: 'Filtering and ordering only compose the QuerySet. Converting its projected values to a list evaluates one SQL query, and descending order puts 4200 first.', zh: '过滤与排序只是在组合 QuerySet。把投影结果转成列表时才执行一次 SQL 查询，降序排序会把 4200 放在前面。' }
    difficulty: intermediate
    tags: [django, queryset, lazy-evaluation]

  - id: url-pattern-order
    type: mcq
    prompt: { en: 'Two URL patterns can both match /reports/latest/. Which one does Django use?', zh: '两个 URL 模式都能匹配 /reports/latest/ 时，Django 会使用哪一个？' }
    options:
      - { text: { en: 'The first matching pattern in urlpatterns', zh: 'urlpatterns 中第一个匹配的模式' }, correct: true }
      - { text: { en: 'The pattern with the most path converters', zh: '路径转换器最多的模式' }, correct: false }
      - { text: { en: 'The pattern whose view has the shortest name', zh: '视图名称最短的模式' }, correct: false }
      - { text: { en: 'Both views run and Django merges their responses', zh: '两个视图都会运行，Django 再合并响应' }, correct: false }
    explanation: { en: 'Django checks URL patterns in order and stops at the first match. Put a specific literal route before a broader converter route when both can match.', zh: 'Django 按顺序检查 URL 模式，并在首次匹配时停止。当具体字面量路由与宽泛转换器路由可能同时匹配时，应把前者放在前面。' }
    difficulty: beginner
    tags: [django, urlconf, routing]

  - id: spotbug-generated-edit-view
    type: spotbug
    prompt: { en: 'This generated view should let a user edit only their own order and only its delivery note. Find the two exposure bugs.', zh: '这个生成视图应只允许用户编辑自己的订单，而且只能编辑配送备注。找出两个暴露问题。' }
    code: |
      from django import forms
      from django.contrib.auth.decorators import login_required
      from django.shortcuts import render
      from .models import Order

      class OrderForm(forms.ModelForm):
          class Meta:
              model = Order
              fields = "__all__"

      @login_required
      def edit_order(request, order_id):
          order = Order.objects.get(pk=order_id)
          form = OrderForm(request.POST or None, instance=order)
          if form.is_valid():
              form.save()
          return render(request, "orders/edit.html", {"form": form})
    lang: python
    issues:
      - line: 9
        kind: security
        note: { en: 'fields = "__all__" lets submitted data bind every editable model field, including fields such as owner or status if the model exposes them.', zh: 'fields = "__all__" 会让提交数据绑定所有可编辑模型字段，其中可能包括所有者或状态。' }
      - line: 13
        kind: security
        note: { en: 'The lookup is not scoped to request.user, so any logged-in user who can guess an order ID can edit another user''s order.', zh: '查询没有按 request.user 限制，因此任何能猜到订单 ID 的登录用户都可能编辑他人的订单。' }
    explanation: { en: 'Use an explicit field allowlist containing only delivery_note, and load the order through an owner-scoped QuerySet before binding the form.', zh: '应使用只包含 delivery_note 的显式字段允许列表，并先通过按所有者限制的 QuerySet 加载订单，再绑定表单。' }
    difficulty: intermediate
    tags: [django, modelform, authorization, code-review]

  - id: async-transaction-boundary
    type: mcq
    prompt: { en: 'In Django 6.0, an async view needs several writes in one transaction. What is the supported design?', zh: '在 Django 6.0 中，异步视图需要让多次写入处于同一事务，应采用哪种受支持设计？' }
    options:
      - { text: { en: 'Put the transactional unit in one synchronous function and call it with sync_to_async()', zh: '把事务单元放进一个同步函数，再通过 sync_to_async() 调用' }, correct: true }
      - { text: { en: 'Use async with transaction.atomic() around each individual query', zh: '在每条查询外分别使用 async with transaction.atomic()' }, correct: false }
      - { text: { en: 'Set DJANGO_ALLOW_ASYNC_UNSAFE and use the synchronous ORM directly', zh: '设置 DJANGO_ALLOW_ASYNC_UNSAFE，再直接调用同步 ORM' }, correct: false }
      - { text: { en: 'Create an unreferenced asyncio task for every write', zh: '为每次写入创建一个无人持有的 asyncio 任务' }, correct: false }
    explanation: { en: 'Django 6.0 does not support async transactions. Keeping all transactional work in one synchronous function preserves the transaction and thread-sensitive database boundary.', zh: 'Django 6.0 不支持异步事务。把全部事务工作放在一个同步函数中，可以保留事务边界与线程敏感的数据库边界。' }
    difficulty: advanced
    tags: [django, async, transactions]

  - id: review-generated-reservation-view
    type: review
    prompt: { en: 'Review this generated reservation endpoint against the task and identify five distinct risks.', zh: '根据任务要求审查这个生成的预留端点，找出五类不同的风险。' }
    task: { en: 'Return order lines on GET. On POST, reserve a positive quantity only for an order owned by the current tenant, never oversell under concurrent requests, and send confirmation only after a successful commit.', zh: 'GET 时返回订单行；POST 时只为当前租户拥有的订单预留正数数量，并发请求下不得超卖，而且只在成功提交后发送确认。' }
    right: { en: 'The generated code returns structured JSON, separates the mutation behind a POST branch, and reuses the loaded order for the response.', zh: '生成代码返回结构化 JSON，把写入放在 POST 分支中，并复用已加载的订单生成响应。' }
    code: |
      from django.http import JsonResponse
      from .models import Order
      from .mail import send_confirmation_email

      def reserve_order(request, order_id):
          order = Order.objects.get(pk=order_id)
          items = []

          for line in order.lines.all():
              items.append({
                  "name": line.product.name,
                  "quantity": line.quantity,
              })

          if request.method == "POST":
              amount = int(request.POST["amount"])
              if order.stock >= amount:
                  order.stock -= amount
                  order.save()
                  send_confirmation_email(request.user.email, order)

          return JsonResponse(
              {"items": items, "remaining_stock": order.stock}
          )
    lang: python
    issues:
      - line: 6
        kind: security
        note: { en: 'The lookup does not filter by the current tenant or check object-level permission, so an identifier can cross the tenant boundary.', zh: '查询没有按当前租户过滤，也没有检查对象级权限，因此对象标识可能跨越租户边界。' }
      - line: 9
        kind: performance
        note: { en: 'Accessing line.product inside the loop can issue one product query per line unless the relation is loaded with select_related().', zh: '如果没有通过 select_related() 加载关系，在循环中访问 line.product 可能为每个订单行各发一次产品查询。' }
      - line: 16
        kind: edge-case
        note: { en: 'A missing, nonnumeric, zero, or negative amount is not validated; a negative value would increase stock.', zh: '代码没有验证数量缺失、非数字、零或负数的情况；负数反而会增加库存。' }
      - line: 17
        kind: correctness
        note: { en: 'The read-check-write sequence has no transaction or row lock, so concurrent requests can both pass the stock check and oversell.', zh: '读取、检查、写入序列没有事务或行锁，因此并发请求可能同时通过库存检查并造成超卖。' }
      - line: 5
        lines: 19
        kind: readability
        note: { en: 'One view mixes response projection, reservation policy, persistence, and notification, hiding the operation boundary and making focused tests harder.', zh: '一个视图混合了响应投影、预留策略、持久化和通知，掩盖操作边界，也让针对性测试更难编写。' }
    checklist:
      - { en: 'Trace tenant and object authorization before the first database mutation.', zh: '在第一次数据库写入前，跟踪租户授权与对象授权。' }
      - { en: 'Validate missing, malformed, zero, negative, exact-stock, and over-stock quantities.', zh: '验证缺失、格式错误、零、负数、刚好等于库存和超过库存的数量。' }
      - { en: 'Run concurrent reservation tests against the production database backend.', zh: '针对生产数据库后端运行并发预留测试。' }
      - { en: 'Assert query counts and verify that notification runs through on_commit().', zh: '断言查询次数，并确认通知通过 on_commit() 运行。' }
    explanation: { en: 'Fix it by scoping the order lookup, validating input with a form, loading products deliberately, and moving reservation into an atomic service that locks the row. Register confirmation with transaction.on_commit() so rollback cannot send a false success message.', zh: '修复时应限制订单查询范围，用表单验证输入，明确加载产品，并把预留逻辑移入会锁定行的原子服务。确认通知应通过 transaction.on_commit() 注册，避免回滚后仍发送错误的成功消息。' }
    difficulty: advanced
    tags: [django, code-review, authorization, concurrency, n-plus-one]
