topic: python/generators-iterators
items:
  - id: predict-single-pass
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      squares = (number * number for number in range(3))

      print(next(squares))
      print(list(squares))
      print(list(squares))
    lang: python
    options:
      - { text: { en: '0, then [1, 4], then []', zh: '先输出0，再输出[1, 4]，最后输出 []' }, correct: true }
      - { text: { en: '0, then [0, 1, 4], then [0, 1, 4]', zh: '先输出0，再输出两次[0, 1, 4]' }, correct: false }
      - { text: { en: '0, then [1, 4], then [1, 4]', zh: '先输出0，再输出两次[1, 4]' }, correct: false }
      - { text: { en: 'It raises StopIteration on the second list() call.', zh: '第二次调用list() 时抛出StopIteration。' }, correct: false }
    explanation: { en: 'next() consumes 0, the first list() consumes the two remaining items, and the exhausted generator then produces an empty list.', zh: 'next() 先消费0，第一次list() 消费剩余两项；生成器耗尽后，第二次list() 得到空列表。' }
    difficulty: beginner
    tags: [generators, exhaustion, predict-output]

  - id: iterable-versus-iterator
    type: mcq
    prompt: { en: 'Which statement correctly distinguishes an iterable from an iterator?', zh: '下列哪项正确区分了可迭代对象和迭代器？' }
    options:
      - { text: { en: 'An iterable can provide an iterator; an iterator returns itself from iter() and advances through next().', zh: '可迭代对象能提供迭代器；迭代器的iter() 返回自身，并通过next() 推进。' }, correct: true }
      - { text: { en: 'Every iterable is single-pass, while every iterator can restart.', zh: '每个可迭代对象都只能单遍读取，而每个迭代器都能重新开始。' }, correct: false }
      - { text: { en: 'Only generators implement the iterator protocol.', zh: '只有生成器实现迭代器协议。' }, correct: false }
      - { text: { en: 'An iterator must support len() and integer indexing.', zh: '迭代器必须支持len() 和整数索引。' }, correct: false }
    explanation: { en: 'The iterable protocol obtains an iterator, while an iterator carries consumption state and returns itself from iter(). Sizing and indexing are separate protocols.', zh: '可迭代协议负责取得迭代器；迭代器携带消费状态，其iter() 返回自身。长度和索引属于其他协议。' }
    difficulty: beginner
    tags: [iterable, iterator, protocol]

  - id: predict-lazy-start
    type: predict
    prompt: { en: 'Which lines appear, and in what order?', zh: '程序会按什么顺序输出哪些行？' }
    code: |
      def produce():
          print("start")
          yield 7
          print("end")

      stream = produce()
      print("made")
      print(next(stream))
    lang: python
    options:
      - { text: { en: 'made, start, 7', zh: '依次为made、start、7' }, correct: true }
      - { text: { en: 'start, end, made, 7', zh: '依次为start、end、made、7' }, correct: false }
      - { text: { en: 'made, start, 7, end', zh: '依次为made、start、7、end' }, correct: false }
      - { text: { en: 'made, 7', zh: '依次为made、7' }, correct: false }
    explanation: { en: 'Calling produce() creates the generator without running its body. next() prints start and suspends at yield, so end is not reached.', zh: '调用produce() 只创建生成器，不执行函数体。next() 输出start后暂停在yield，因此不会执行到end。' }
    difficulty: beginner
    tags: [generators, lazy-evaluation, yield]

  - id: spot-closed-file-generator
    title: { en: 'Spot the bug in the file-line generator', zh: '找出文件行生成器里的bug' }
    type: spotbug
    prompt: { en: 'Find why this helper fails only when its result is consumed.', zh: '找出这个辅助函数为何要到消费返回值时才失败。' }
    code: |
      def read_lines(path):
          with open(path, encoding="utf-8") as source:
              return (line.rstrip() for line in source)
    lang: python
    issues:
      - line: 3
        kind: correctness
        note: { en: 'The generator expression is lazy, but source closes when the with block returns; iteration later reads a closed file.', zh: '生成器表达式是惰性的，但source会在with块返回时关闭；之后迭代会读取已关闭文件。' }
    explanation: { en: 'Make read_lines() a generator and yield inside the with block so the context remains active during consumption. The caller must still close the generator after stopping early.', zh: '应让read_lines() 成为生成器，并在with块内逐项yield，使上下文在消费期间保持有效。调用方提前停止时仍须关闭生成器。' }
    difficulty: intermediate
    tags: [generators, files, resource-lifetime, code-review]

  - id: stop-iteration-inside-generator
    type: mcq
    prompt: { en: 'What happens when StopIteration escapes directly from a generator function body in Python 3.14?', zh: '在Python 3.14中，StopIteration直接逸出生成器函数体时会怎样？' }
    options:
      - { text: { en: 'It becomes RuntimeError at the generator-frame boundary.', zh: '它会在生成器帧边界转换成RuntimeError。' }, correct: true }
      - { text: { en: 'It always ends the generator silently.', zh: '它总会静默结束生成器。' }, correct: false }
      - { text: { en: 'It becomes GeneratorExit.', zh: '它会转换成GeneratorExit。' }, correct: false }
      - { text: { en: 'Python yields the exception object as the next item.', zh: 'Python会把异常对象作为下一项产出。' }, correct: false }
    explanation: { en: 'PEP 479 prevents an accidental StopIteration from silently truncating a generator. Use return for normal completion or catch helper exhaustion locally.', zh: 'PEP 479防止意外的StopIteration静默截断生成器。正常结束应使用return，辅助迭代器耗尽则应在局部捕获。' }
    difficulty: intermediate
    tags: [stopiteration, runtimeerror, generators]

  - id: review-generated-order-reader
    type: review
    title: { en: 'Review a generated lazy order reader', zh: '审查生成的惰性订单读取器' }
    prompt: { en: 'Review this generated reader against the task and identify four distinct risks.', zh: '根据任务要求审查这个生成的读取器，找出四类不同风险。' }
    task: { en: 'Lazily read positive order totals from an untrusted filename under data_root, skip an optional header, and release the file on errors or early termination.', zh: '从data_root下不可信的文件名惰性读取正数订单金额，跳过可选表头，并在错误或提前结束时释放文件。' }
    right: { en: 'The code uses a generator-shaped API, converts totals to integers, and returns named order records instead of raw lines.', zh: '代码采用了生成器形式的API，把金额转换为整数，并返回具名订单记录而不是原始文本行。' }
    code: |
      from pathlib import Path

      def iter_orders(data_root, filename):
          path = Path(data_root) / filename
          source = path.open(encoding="utf-8")
          rows = (line.rstrip().split(",") for line in source)
          next(rows)

          cache = []
          for fields in rows:
              order_id, total_text = fields
              total_cents = int(total_text)
              if total_cents:
                  cache.append((order_id, total_cents))

          source.close()

          for order in cache:
              yield order
    lang: python
    issues:
      - line: 4
        kind: security
        note: { en: 'An absolute filename or .. segments can escape data_root; resolve the candidate and verify it remains beneath the allowed root.', zh: '绝对文件名或 .. 路径段可以逃出data_root；应解析候选路径，并验证它仍位于允许的根目录下。' }
      - line: 5
        kind: correctness
        note: { en: 'The file has no with or finally owner, so a split, unpacking, or conversion failure can leave it open.', zh: '文件没有with或finally所有者，因此切分、解包或转换失败时可能无法关闭。' }
      - line: 7
        kind: edge-case
        note: { en: 'next(rows) assumes a header exists; an empty file makes StopIteration escape the generator and become RuntimeError.', zh: 'next(rows) 假定表头存在；空文件会让StopIteration逸出生成器并转换成RuntimeError。' }
      - line: 9
        kind: performance
        note: { en: 'Collecting every record in cache defeats the requested lazy behavior and makes memory grow with the whole file.', zh: '把全部记录收集进cache违背了惰性读取要求，并让内存随整个文件增长。' }
    checklist:
      - { en: 'Constrain resolved paths to the permitted root.', zh: '把解析后的路径限制在允许的根目录内。' }
      - { en: 'Keep acquisition, yielding, and cleanup in one with or finally scope.', zh: '把资源获取、产出和清理放在同一个with或finally作用域内。' }
      - { en: 'Exercise empty, headerless, malformed, and negative-total rows.', zh: '覆盖空文件、无表头、格式错误和负金额记录。' }
      - { en: 'Verify the first result arrives before the whole file is read.', zh: '验证首个结果会在读取完整文件之前到达。' }
    explanation: { en: 'Resolve and validate the path, open it inside the generator with a context manager, detect the optional header without leaking StopIteration, and yield validated positive rows directly.', zh: '应解析并验证路径，在生成器内用上下文管理器打开文件，检测可选表头时避免泄漏StopIteration，并直接产出经过校验的正金额记录。' }
    difficulty: advanced
    minutes: 8
    tags: [code-review, generators, files, security]
