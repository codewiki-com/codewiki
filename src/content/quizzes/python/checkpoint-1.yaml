topic: python/checkpoint-1
items:
  - id: checkpoint-1-truthiness
    type: mcq
    prompt: { en: 'What is bool("False")?', zh: 'bool("False") 的结果是什么？' }
    options:
      - { text: { en: 'True, because the string is non-empty', zh: 'True，因为这个字符串非空' }, correct: true }
      - { text: { en: 'False, because Python parses the word inside the string', zh: 'False，因为Python会解析字符串中的单词' }, correct: false }
      - { text: { en: 'It raises ValueError because "False" is not numeric', zh: '抛出ValueError，因为 "False" 不是数字' }, correct: false }
    explanation: { en: 'Truth testing does not parse a string’s text. Every non-empty string is truthy, including "False" and "0".', zh: '真值测试不会解析字符串内容。任何非空字符串都为真，包括 "False" 和 "0"。' }
    difficulty: beginner
    tags: [checkpoint]

  - id: checkpoint-1-name-binding
    type: mcq
    prompt: { en: 'After a = [1], b = a, and b.append(2), what is a?', zh: '依次执行a = [1]、b = a和b.append(2) 后，a的值是什么？' }
    options:
      - { text: { en: '[1, 2], because both names refer to the same list', zh: '[1, 2]，因为两个名称引用同一个列表' }, correct: true }
      - { text: { en: '[1], because assignment copies a list', zh: '[1]，因为赋值会复制列表' }, correct: false }
      - { text: { en: 'It is undefined because b replaced a', zh: 'a未定义，因为b替换了a' }, correct: false }
    explanation: { en: 'Assignment binds another name to the existing list; it does not copy the object. Mutating through b is therefore visible through a.', zh: '赋值只是把另一个名称绑定到现有列表，并不会复制对象。因此，通过b完成的修改也能从a看到。' }
    difficulty: beginner
    tags: [checkpoint]

  - id: checkpoint-1-division-output
    type: mcq
    prompt: { en: 'Which pair is produced by (7 // 3, 7 % 3)?', zh: '(7 // 3, 7 % 3) 会产生哪一对值？' }
    options:
      - { text: { en: '(2, 1)', zh: '(2, 1)' }, correct: true }
      - { text: { en: '(2.3333333333333335, 1)', zh: '(2.3333333333333335, 1)' }, correct: false }
      - { text: { en: '(3, 0)', zh: '(3, 0)' }, correct: false }
    explanation: { en: '// performs floor division and % returns the corresponding remainder, so 7 equals 3 × 2 + 1.', zh: '// 执行向下取整除法，% 返回对应余数，因此7等于3 × 2 + 1。' }
    difficulty: beginner
    tags: [checkpoint]

  - id: checkpoint-1-range-boundary
    type: fill
    prompt: { en: 'In range(2, 5), enter the first excluded stop value.', zh: '对于range(2, 5)，写出第一个被排除的停止值。' }
    answer: '5'
    explanation: { en: 'range includes the start but excludes the stop, so it yields 2, 3, and 4.', zh: 'range包含起点但不包含终点，因此会产生2、3和4。' }
    difficulty: beginner
    tags: [checkpoint]

  - id: checkpoint-1-loop-else
    type: mcq
    prompt: { en: 'When does an else clause attached to a for loop run?', zh: 'for循环所带的else子句会在何时运行？' }
    options:
      - { text: { en: 'When the loop finishes without executing break, including zero iterations', zh: '循环未执行break而结束时，包括一次也未迭代的情况' }, correct: true }
      - { text: { en: 'Only when the iterable contains at least one item', zh: '仅当可迭代对象至少包含一项时' }, correct: false }
      - { text: { en: 'Whenever the loop body raises an exception', zh: '只要循环体抛出异常就会运行' }, correct: false }
    explanation: { en: 'Loop else is tied to normal completion, not to whether the body ran. A break skips it; exhaustion and an empty iterable do not.', zh: '循环的else取决于是否正常结束，而不是循环体是否运行过。break会跳过else；正常耗尽和空可迭代对象都不会跳过。' }
    difficulty: intermediate
    tags: [checkpoint]

  - id: checkpoint-1-comprehension-order
    type: mcq
    prompt: { en: 'What does [n * n for n in range(6) if n % 2] produce?', zh: '[n * n for n in range(6) if n % 2] 会产生什么？' }
    options:
      - { text: { en: '[1, 9, 25]', zh: '[1, 9, 25]' }, correct: true }
      - { text: { en: '[0, 4, 16]', zh: '[0, 4, 16]' }, correct: false }
      - { text: { en: '[1, 3, 5]', zh: '[1, 3, 5]' }, correct: false }
    explanation: { en: 'The trailing if filters first by truthiness of n % 2, keeping odd values; the leading expression then squares them.', zh: '末尾的if先根据n % 2的真值保留奇数，前面的表达式再对这些数求平方。' }
    difficulty: intermediate
    tags: [checkpoint]

  - id: checkpoint-1-empty-set
    type: fill
    prompt: { en: 'Enter the Python expression that creates an empty set.', zh: '写出创建空集合的Python表达式。' }
    answer: set()
    explanation: { en: '{} creates an empty dictionary. An empty set requires the set() constructor.', zh: '{} 创建的是空字典；空集合必须使用set() 构造。' }
    difficulty: intermediate
    tags: [checkpoint]

  - id: checkpoint-1-unhashable-failure
    type: fill
    prompt: { en: 'Name the exception raised by {[]}, where a list is used as a set element.', zh: '当列表作为集合元素写成 {[]} 时，会抛出哪种异常？' }
    answer: TypeError
    explanation: { en: 'Set elements must be hashable. A mutable list is unhashable, so construction fails with TypeError.', zh: '集合元素必须可哈希。可变列表不可哈希，因此构造时会抛出TypeError。' }
    difficulty: advanced
    tags: [checkpoint]
