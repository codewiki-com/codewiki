topic: python/functools
items:
  - id: predict-partial-keyword-override
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      from functools import partial

      def endpoint(host, *, scheme="https"):
          return f"{scheme}://{host}"

      internal = partial(endpoint, "api.internal", scheme="http")
      print(internal())
      print(internal(scheme="https"))
    lang: python
    options:
      - { text: { en: "http://api.internal, then https://api.internal", zh: "先输出 http://api.internal，再输出 https://api.internal" }, correct: true }
      - { text: { en: "http://api.internal twice", zh: "输出两次 http://api.internal" }, correct: false }
      - { text: { en: "https://api.internal twice", zh: "输出两次 https://api.internal" }, correct: false }
      - { text: { en: 'The second call raises TypeError for a duplicate keyword.', zh: '第二次调用因关键字重复而抛出TypeError。' }, correct: false }
    explanation: { en: 'A call-time keyword extends and overrides the keywords stored by partial(). The stored value is a default configuration, not a locked argument.', zh: '调用时关键字会扩展并覆盖partial() 保存的关键字。保存值属于默认配置，不是锁定实参。' }
    difficulty: beginner
    tags: [partial, keyword-override, predict-output]

  - id: predict-reduce-initializer
    type: predict
    prompt: { en: 'What are the two output lines?', zh: '这段程序会输出哪两行？' }
    code: |
      from functools import reduce

      def append_digit(total, digit):
          return total * 10 + digit

      print(reduce(append_digit, [], 7))
      print(reduce(append_digit, [2, 3], 1))
    lang: python
    options:
      - { text: { en: '7, then 123', zh: '先输出7，再输出123' }, correct: true }
      - { text: { en: '0, then 23', zh: '先输出0，再输出23' }, correct: false }
      - { text: { en: 'TypeError, then 123', zh: '先抛出TypeError，再输出123' }, correct: false }
      - { text: { en: '7, then 33', zh: '先输出7，再输出33' }, correct: false }
    explanation: { en: 'An empty iterable returns the initializer unchanged. For the second call, the accumulator proceeds from 1 to 12 and then 123.', zh: '空可迭代对象直接返回初始值。第二次调用的累积值从1变为12，再变为123。' }
    difficulty: intermediate
    tags: [reduce, initializer, empty-input]

  - id: spotbug-boolean-comparator
    title: { en: 'Spot the bug in the comparator', zh: '找出比较器里的bug' }
    type: spotbug
    prompt: { en: 'Find why this comparator does not implement the contract required by cmp_to_key().', zh: '找出这个比较函数为何不满足cmp_to_key() 要求的契约。' }
    code: |
      from functools import cmp_to_key

      def compare_priority(left, right):
          return left["priority"] < right["priority"]

      tickets = [{"priority": 2}, {"priority": 1}]
      print(sorted(tickets, key=cmp_to_key(compare_priority)))
    lang: python
    issues:
      - line: 4
        kind: correctness
        note: { en: 'The comparator returns only False or True, numerically 0 or 1, so it never returns a negative value when left is less than right.', zh: '该比较函数只返回False或True，也就是数值0或1，因此left小于right时永远不会返回负数。' }
    explanation: { en: 'Return a negative, zero, or positive number, for example by comparing canonical keys in both directions. A direct key function is clearer for this simple field.', zh: '比较函数应返回负数、零或正数，例如双向比较规范键。这里只涉及简单字段，直接使用键函数更清楚。' }
    difficulty: intermediate
    tags: [cmp-to-key, comparator, code-review]

  - id: wraps-behavior-boundary
    type: mcq
    prompt: { en: 'Which guarantee does functools.wraps() provide?', zh: 'functools.wraps() 提供哪项保证？' }
    options:
      - { text: { en: 'It copies selected metadata and sets __wrapped__ to the wrapped callable.', zh: '它复制选定元数据，并把 __wrapped__ 指向被包装的可调用对象。' }, correct: true }
      - { text: { en: 'It verifies that every argument and return value is forwarded.', zh: '它会验证所有实参与返回值都已转发。' }, correct: false }
      - { text: { en: 'It turns a synchronous wrapper into an asynchronous function when needed.', zh: '它会在需要时把同步包装器转换成异步函数。' }, correct: false }
      - { text: { en: 'It prevents callers from accessing the original function.', zh: '它会阻止调用方访问原函数。' }, correct: false }
    explanation: { en: 'wraps() maintains an introspection chain and selected metadata. Forwarding, async boundaries, and access control remain the wrapper author’s responsibility.', zh: 'wraps() 维护检查链与选定元数据。实参转发、异步边界和访问控制仍由包装器作者负责。' }
    difficulty: beginner
    tags: [wraps, metadata, wrapper]

  - id: review-generated-audited-total
    type: review
    title: { en: 'Review a generated audited total', zh: '审查生成的带审计求和函数' }
    prompt: { en: 'Review this generated functools-based implementation against the task.', zh: '根据任务要求审查这个使用functools的生成实现。' }
    task: { en: 'Return the integer total for any iterable of integer-like charges, including an empty iterable; preserve function metadata; audit the call without logging the token; and avoid avoidable repeated copying.', zh: '对任意由整数式收费项组成的可迭代对象返回整数总额，包括空输入；保留函数元数据；记录调用但不记录令牌；并避免不必要的重复复制。' }
    code: |
      from functools import partial, reduce

      def audit(log, func):
          def wrapper(*args, **kwargs):
              log(f"calling {func.__name__}: {kwargs!r}")
              func(*args, **kwargs)
          return wrapper

      def normalize_charges(charges):
          return reduce(
              lambda acc, charge: acc + [int(charge)],
              charges,
              [],
          )

      def total_cents(charges, *, token):
          return reduce(lambda left, right: left + right,
                        normalize_charges(charges))

      def emit(message, *, sink):
          sink.append(message)

      events = []
      audit_log = partial(emit, sink=events)
      charge_total = partial(audit, audit_log)(total_cents)
    lang: python
    issues:
      - line: 4
        kind: readability
        note: { en: 'The wrapper omits @wraps(func), so its name, documentation, annotations, and __wrapped__ chain describe wrapper rather than total_cents.', zh: '包装函数省略了 @wraps(func)，因此名称、文档、注解与 __wrapped__ 链描述的是wrapper，而不是total_cents。' }
      - line: 5
        kind: security
        note: { en: 'Formatting all keyword arguments into the audit message records the token value.', zh: '把全部关键字实参格式化进审计消息会记录令牌值。' }
      - line: 6
        kind: correctness
        note: { en: 'The wrapper discards the wrapped function’s return value, so charge_total() returns None instead of the total.', zh: '包装函数丢弃了被包装函数的返回值，因此charge_total() 返回None，而不是总额。' }
      - line: 11
        kind: performance
        note: { en: 'Each acc + [value] copies the accumulated list; a list comprehension converts every charge without repeated prefix copies.', zh: '每次acc + [value] 都会复制已经累积的列表；列表推导可以转换所有收费项，而不用重复复制前缀。' }
      - line: 17
        kind: edge-case
        note: { en: 'The final reduce() has no initializer, so an empty iterable raises TypeError instead of returning zero.', zh: '最后一次reduce() 没有初始值，因此空输入会抛出TypeError，而不是返回零。' }
    right: { en: 'The code separates auditing, normalization, and totaling, and it uses partial() to configure one reusable audit sink.', zh: '代码分开了审计、规范化与求和职责，并使用partial() 配置了可复用的审计接收端。' }
    checklist:
      - { en: 'Check wrapper metadata and every forwarded result and exception.', zh: '检查包装器元数据，以及每个被转发的结果与异常。' }
      - { en: 'Allowlist audit fields and redact credentials.', zh: '为审计字段设置允许列表，并脱敏凭据。' }
      - { en: 'Define and test the reduction identity for empty input.', zh: '定义并测试空输入的归约单位元。' }
      - { en: 'Inspect reducer mutations and allocation growth.', zh: '检查归约函数中的修改与分配增长。' }
    explanation: { en: 'Add @wraps, log only approved fields, return the wrapped result, normalize with a comprehension, and total with sum() or reduce(..., 0).', zh: '应添加 @wraps，只记录获准字段，返回被包装结果，用推导式规范化，再用sum() 或reduce(..., 0) 求和。' }
    difficulty: advanced
    minutes: 8
    tags: [functools, code-review, wrappers, reduce]
