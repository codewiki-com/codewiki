topic: python/list-comprehensions
items:
  - id: predict-filter-and-conditional
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      numbers = [0, 1, 2, 3, 4]
      labels = [
          "high" if number >= 3 else "low"
          for number in numbers
          if number % 2 == 0
      ]
      print(labels)
    lang: python
    options:
      - { text: { en: "['low', 'low', 'high']", zh: "['low', 'low', 'high']" }, correct: true }
      - { text: { en: "['low', 'low', 'low', 'high', 'high']", zh: "['low', 'low', 'low', 'high', 'high']" }, correct: false }
      - { text: { en: "['low', 'high']", zh: "['low', 'high']" }, correct: false }
      - { text: { en: 'It raises SyntaxError because both forms of if are present.', zh: '程序抛出SyntaxError，因为其中同时出现两种if。' }, correct: false }
    explanation: { en: 'The trailing filter keeps 0, 2, and 4. The leading conditional then labels those retained values low, low, and high.', zh: '末尾过滤器保留0、2和4，开头的条件表达式再依次把它们标为low、low和high。' }
    difficulty: beginner
    tags: [list-comprehensions, filtering, conditional-expression]

  - id: clause-order
    type: mcq
    prompt: { en: 'Which loop has the same order as [(team, member) for team in teams for member in team.members if member.active]?', zh: '哪个循环与 [(team, member) for team in teams for member in team.members if member.active] 的顺序相同？' }
    options:
      - { text: { en: 'Loop over teams, then that team’s members, then append active pairs.', zh: '先遍历团队，再遍历该团队的成员，最后追加启用成员的配对。' }, correct: true }
      - { text: { en: 'Loop over all members globally, then loop over teams for every member.', zh: '先全局遍历所有成员，再为每个成员遍历团队。' }, correct: false }
      - { text: { en: 'Filter teams by member.active before member has been bound.', zh: '在member绑定前，先用member.active过滤团队。' }, correct: false }
    explanation: { en: 'Comprehension clauses expand into nested statements from left to right. A later clause may depend on a name bound by an earlier for clause.', zh: '推导式子句从左到右展开为嵌套语句。后面的子句可以依赖前一个for子句绑定的名称。' }
    difficulty: beginner
    tags: [list-comprehensions, evaluation-order, nesting]

  - id: spot-repeated-parser
    title: { en: 'Spot the bug in reading normalization', zh: '找出读数规范化里的bug' }
    type: spotbug
    prompt: { en: 'Find why this generated function does extra work and loses a valid reading.', zh: '找出这个生成函数为什么做了重复工作，并丢失一个有效读数。' }
    code: |
      def normalized_readings(rows):
          return [
              parse_reading(row["value"])
              for row in rows
              if parse_reading(row["value"])
          ]
    lang: python
    issues:
      - line: 3
        kind: performance
        note: { en: 'Every retained row calls parse_reading again in the result expression after the filter has already called it.', zh: '每个保留行先在过滤器中调用parse_reading，又在结果表达式中调用一次。' }
      - line: 5
        kind: edge-case
        note: { en: 'Truth-value filtering rejects a valid numeric result of 0 along with missing or invalid values.', zh: '真值过滤会把有效数值0与缺失值、无效值一起丢掉。' }
    explanation: { en: 'Parse once, compare the result explicitly with the invalid sentinel, and retain zero. A small loop is clearest when parsing can raise or needs per-row diagnostics.', zh: '应只解析一次，显式比较无效哨兵值，并保留0。若解析可能抛出异常或需要逐行诊断，小型循环最清楚。' }
    difficulty: intermediate
    tags: [list-comprehensions, repeated-work, truth-value]

  - id: assignment-expression-scope
    type: mcq
    prompt: { en: 'After values = [parsed for raw in rows if (parsed := parse(raw)) is not None] succeeds, where is parsed bound?', zh: 'values = [parsed for raw in rows if (parsed := parse(raw)) is not None] 成功执行后，parsed绑定在哪里？' }
    options:
      - { text: { en: 'In the scope containing the comprehension, with the last assigned value', zh: '在包含该推导式的作用域中，值为最后一次赋值结果' }, correct: true }
      - { text: { en: 'Only in the comprehension’s implicit iteration scope', zh: '只在推导式的隐式迭代作用域中' }, correct: false }
      - { text: { en: 'In the builtins namespace', zh: '在内置名称空间中' }, correct: false }
      - { text: { en: 'Nowhere; assignment expressions are forbidden in filters', zh: '没有绑定；过滤器中禁止赋值表达式' }, correct: false }
    explanation: { en: 'An assignment-expression target inside a comprehension is a special case: it binds in the containing scope. The for target raw remains local to the comprehension.', zh: '推导式中的赋值表达式目标采用特殊规则，会绑定到包含该推导式的作用域；for目标raw仍是推导式的局部名称。' }
    difficulty: intermediate
    tags: [list-comprehensions, assignment-expression, scope]

  - id: review-generated-order-export
    title: { en: 'Review generated order export', zh: '审查生成的订单导出' }
    type: review
    prompt: { en: 'Review this generated order export before it receives production customer records.', zh: '在这段生成的订单导出代码接收生产客户记录前，对它进行审查。' }
    task: { en: 'Return one flat row per matching order, normalize each total once, retain a zero total, treat a missing email as empty, leave inputs unchanged, and never export API tokens.', zh: '为每笔匹配订单返回一个扁平行；每个总额只规范化一次；保留零总额；缺失邮箱按空字符串处理；不修改输入，也绝不导出API令牌。' }
    code: |
      def build_export_rows(customers, batches):
          rows = [
              [
                  {
                      "customer_id": customer["id"],
                      "email": customer["email"].strip().lower(),
                      "order_id": order["id"],
                      "total": normalize_total(order["total"]),
                      "api_token": customer["api_token"],
                  }
                  for order in batch["orders"]
                  if order["customer_id"] == customer["id"]
                  and normalize_total(order["total"])
              ]
              for batch in batches
              for customer in customers
          ]
          return rows
    lang: python
    issues:
      - line: 2
        kind: readability
        note: { en: 'The nested comprehension combines a join, validation, transformation, and output-shape decision, obscuring how many rows each input produces.', zh: '嵌套推导式混合了连接、验证、转换和输出形状决策，让每个输入会产生多少行变得难以看清。' }
      - line: 6
        kind: edge-case
        note: { en: 'A missing email raises KeyError and a None email raises AttributeError instead of becoming an empty string.', zh: '缺失邮箱会触发KeyError，值为None则会触发AttributeError，而不是得到空字符串。' }
      - line: 9
        kind: security
        note: { en: 'The export includes api_token, exposing a credential that the task explicitly excludes.', zh: '导出结果包含api_token，泄露了任务明确要求排除的凭据。' }
      - line: 13
        kind: correctness
        note: { en: 'Using a normalized total as a truth test drops a valid total of zero.', zh: '把规范化总额当作真值条件，会丢掉有效的零总额。' }
      - line: 13
        kind: performance
        note: { en: 'A retained nonzero order calls normalize_total in the filter and again in the result dictionary.', zh: '保留的非零订单会在过滤器和结果字典中各调用一次normalize_total。' }
    right: { en: 'The code constructs new result dictionaries, matches orders to customer ids, normalizes email text, and does not mutate either input collection.', zh: '代码构造了新的结果字典，按客户id匹配订单，统一邮箱文本，并且没有修改任一输入集合。' }
    checklist:
      - { en: 'Assert a flat result shape with several batches, customers, and unmatched orders.', zh: '使用多个批次、客户和未匹配订单，断言结果是扁平结构。' }
      - { en: 'Test missing, None, empty, and ordinary email values.', zh: '测试邮箱缺失、为None、为空以及普通值的情况。' }
      - { en: 'Retain zero totals and count one normalization call per considered order.', zh: '保留零总额，并确认每笔被检查的订单只调用一次规范化函数。' }
      - { en: 'Compare exported keys with an allowlist that excludes every credential field.', zh: '把导出键与允许列表比较，确保排除所有凭据字段。' }
    explanation: { en: 'Use explicit loops or a small helper to join records, normalize once, handle missing email, and append one safe row. Tests should assert both required values and the absence of credentials.', zh: '应使用显式循环或小型辅助函数连接记录，只规范化一次，处理缺失邮箱，并追加一个安全行。测试既要断言必需值，也要断言凭据不存在。' }
    difficulty: advanced
    tags: [list-comprehensions, code-review, data-shaping, security]
