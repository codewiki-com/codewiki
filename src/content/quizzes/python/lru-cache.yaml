topic: python/lru-cache
items:
  - id: predict-lru-eviction
    type: predict
    prompt: { en: 'How many times does this program print compute?', zh: '这段程序会打印多少次compute？' }
    code: |
      from functools import lru_cache

      @lru_cache(maxsize=2)
      def read(key):
          print("compute")
          return key

      for key in ["A", "B", "A", "C", "B"]:
          read(key)
    lang: python
    options:
      - { text: { en: '2 times', zh: '2次' }, correct: false }
      - { text: { en: '3 times', zh: '3次' }, correct: false }
      - { text: { en: '4 times', zh: '4次' }, correct: true }
      - { text: { en: '5 times', zh: '5次' }, correct: false }
    explanation: { en: 'The second A is a hit and refreshes A. Adding C evicts B, so the final B is a miss; there are four misses in total.', zh: '第二次读取A命中，并刷新了A。加入C时会淘汰B，因此最后一次读取B未命中；总计有4次未命中。' }
    difficulty: beginner
    tags: [lru-cache, eviction, predict-output]

  - id: key-call-patterns
    type: mcq
    prompt: { en: 'Which statement about lru_cache keys is correct?', zh: '关于lru_cache缓存键，哪项说法正确？' }
    options:
      - { text: { en: 'The wrapper always normalizes f(1) and f(value=1) into one entry.', zh: '包装器总会把f(1) 与f(value=1) 规范化为同一条目。' }, correct: false }
      - { text: { en: 'All direct positional and keyword arguments must be hashable.', zh: '所有直接位置实参与关键字实参都必须可哈希。' }, correct: true }
      - { text: { en: 'typed=True recursively inspects the type of every container element.', zh: 'typed=True会递归检查容器内每个元素的类型。' }, correct: false }
      - { text: { en: 'Changing a default value automatically invalidates existing entries.', zh: '改变默认值会自动使已有条目失效。' }, correct: false }
    explanation: { en: 'The wrapper uses hash-based keys from the call arguments. Call spellings can remain distinct, and typed applies to immediate arguments rather than recursively inspecting containers.', zh: '包装器根据调用实参构造哈希键。不同调用写法可以保持独立，typed只作用于直接实参，不会递归检查容器。' }
    difficulty: intermediate
    tags: [cache-key, hashable, typed]

  - id: spotbug-stale-catalog
    title: { en: 'Spot the bug in the LRU cache', zh: '找出LRU缓存里的bug' }
    type: spotbug
    prompt: { en: 'Find why the second call can return a stale price.', zh: '找出第二次调用为何会返回陈旧价格。' }
    code: |
      from functools import lru_cache

      catalog = {"paper": 5}

      @lru_cache(maxsize=32)
      def price(sku):
          return catalog[sku]

      print(price("paper"))
      catalog["paper"] = 6
      print(price("paper"))
    lang: python
    issues:
      - line: 10
        kind: correctness
        note: { en: 'The catalog changes without clearing the cache or changing the key, so the second call still returns the cached value 5.', zh: 'catalog改变后既没有清空缓存，也没有改变缓存键，因此第二次调用仍返回缓存值5。' }
    explanation: { en: 'Invalidate after a successful catalog update or include a reliably propagated catalog version in the cached function arguments.', zh: '应在目录更新成功后触发失效，或者把可靠传播的目录版本放入缓存函数实参。' }
    difficulty: beginner
    tags: [cache-invalidation, stale-data, code-review]

  - id: thread-safety-boundary
    type: mcq
    prompt: { en: 'What does lru_cache thread safety guarantee for two concurrent calls with the same cold key?', zh: '两个线程并发调用同一个冷键时，lru_cache的线程安全保证是什么？' }
    options:
      - { text: { en: 'The original function is guaranteed to run exactly once.', zh: '原函数保证只运行一次。' }, correct: false }
      - { text: { en: 'The cache data remains coherent, but the original function may run more than once.', zh: '缓存数据保持一致，但原函数可能运行多次。' }, correct: true }
      - { text: { en: 'One call always raises RuntimeError.', zh: '其中一次调用一定抛出RuntimeError。' }, correct: false }
      - { text: { en: 'Both calls bypass the cache permanently.', zh: '两次调用都会永久绕过缓存。' }, correct: false }
    explanation: { en: 'The wrapper protects its internal structure, not a once-per-key business guarantee. Overlapping misses can duplicate the underlying work.', zh: '包装器保护的是内部结构，不是业务层的同键唯一执行保证。重叠的未命中可能重复执行底层工作。' }
    difficulty: intermediate
    tags: [thread-safety, concurrency, cache-miss]

  - id: review-generated-invoice-cache
    type: review
    title: { en: 'Review a generated invoice cache', zh: '审查生成的发票缓存' }
    prompt: { en: 'Review this generated invoice renderer against the task and identify four distinct risks.', zh: '根据任务要求审查这段生成的发票渲染器，并找出四类不同风险。' }
    task: { en: 'Render invoices in a long-running service with a bounded cache, authorize against allowed_tenants, fall back to English for an unknown locale, and show template updates immediately.', zh: '在长期运行的服务中用有界缓存渲染发票；根据allowed_tenants授权；未知语言回退到英语；模板更新后立即可见。' }
    code: |
      from functools import cache

      templates = {
          "en": "Invoice {invoice_id}",
          "zh": "发票 {invoice_id}",
      }

      @cache
      def render_invoice(invoice_id, tenant_id, locale):
          template = templates[locale]
          return template.format(invoice_id=invoice_id)

      def get_invoice(invoice_id, tenant_id, locale, allowed_tenants):
          if tenant_id == "public" or "admin":
              return render_invoice(invoice_id, tenant_id, locale)
          raise PermissionError(tenant_id)

      def update_template(locale, template):
          templates[locale] = template
    lang: python
    issues:
      - line: 8
        kind: performance
        note: { en: '@cache is unbounded, so arbitrary invoice, tenant, and locale combinations remain reachable for the process lifetime.', zh: '@cache没有容量上限，因此任意发票、租户与语言组合都会在进程生命周期内保持可达。' }
      - line: 10
        kind: edge-case
        note: { en: 'Indexing templates directly raises KeyError for an unknown locale instead of falling back to English.', zh: '直接索引templates会让未知语言抛出KeyError，而不是回退到英语。' }
      - line: 14
        kind: security
        note: { en: 'The nonempty string "admin" is always true, and allowed_tenants is ignored, so every tenant is authorized.', zh: '非空字符串 "admin" 始终为真，而且allowed_tenants被忽略，因此所有租户都会通过授权。' }
      - line: 19
        kind: correctness
        note: { en: 'Updating templates does not clear or version cached renderings, so previously rendered invoices stay stale.', zh: '更新templates后没有清空缓存或推进版本，因此以前渲染的发票会保持陈旧。' }
    right: { en: 'The cache key includes invoice, tenant, and locale, and the code separates authorization, rendering, and template updates into named functions.', zh: '缓存键包含发票、租户和语言，而且代码把授权、渲染与模板更新拆成了具名函数。' }
    checklist:
      - { en: 'Prove authorization uses the supplied tenant set before any cached result is returned.', zh: '证明返回任何缓存结果前，授权逻辑都会使用传入的租户集合。' }
      - { en: 'Exercise unknown locales and define the fallback explicitly.', zh: '测试未知语言，并明确规定回退行为。' }
      - { en: 'Bound the key space and observe cache size under representative traffic.', zh: '限制键空间，并在代表性流量下观察缓存大小。' }
      - { en: 'Map every template write to a cache invalidation event.', zh: '把每次模板写入映射到缓存失效事件。' }
    explanation: { en: 'Use a finite lru_cache, test membership in allowed_tenants, normalize unknown locales to en, and clear or version the cache after template updates.', zh: '应使用有限lru_cache，检查tenant_id是否属于allowed_tenants，把未知语言规范化为en，并在模板更新后清空缓存或推进版本。' }
    difficulty: advanced
    minutes: 8
    tags: [lru-cache, code-review, authorization, invalidation]
