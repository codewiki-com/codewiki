topic: python/copy
items:
  - id: predict-nested-mutation
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      import copy

      source = {"items": [["pen"]]}
      shallow = source.copy()
      deep = copy.deepcopy(source)

      shallow["items"][0].append("pencil")
      deep["items"].append(["book"])

      print(len(source["items"]), source["items"][0])
      print(len(deep["items"]), deep["items"][0])
    lang: python
    options:
      - { text: { en: "1 ['pen', 'pencil'] then 2 ['pen']", zh: "先输出 1 ['pen', 'pencil']，再输出 2 ['pen']" }, correct: true }
      - { text: { en: "1 ['pen'] then 2 ['pen']", zh: "先输出 1 ['pen']，再输出 2 ['pen']" }, correct: false }
      - { text: { en: "2 ['pen', 'pencil'] then 2 ['pen', 'pencil']", zh: "先输出 2 ['pen', 'pencil']，再输出 2 ['pen', 'pencil']" }, correct: false }
      - { text: { en: 'It raises TypeError because dictionaries cannot be copied.', zh: '程序抛出 TypeError，因为字典无法复制。' }, correct: false }
    explanation: { en: 'The shallow dictionary shares its nested lists with source, so pencil appears there. The deep graph is independent and gains a second inner list without changing source.', zh: '浅拷贝字典与源对象共享嵌套列表，因此 pencil 会出现在源对象中。深拷贝对象图相互独立，所以新增第二个内部列表不会改变源对象。' }
    difficulty: beginner
    tags: [shallow-copy, deep-copy, predict-output]

  - id: choose-shallow-boundary
    type: mcq
    prompt: { en: 'A function will only add and remove keys in a dictionary; it will not mutate any values. Which operation expresses the narrowest required copy boundary?', zh: '一个函数只会增删字典的键，不会修改任何值。哪种操作最准确地表达所需的最窄复制边界？' }
    options:
      - { text: { en: 'A shallow dictionary copy', zh: '字典的浅拷贝' }, correct: true }
      - { text: { en: 'Assignment to another name', zh: '赋值给另一个名称' }, correct: false }
      - { text: { en: 'An unconditional deep copy of every reachable object', zh: '无条件深拷贝每个可达对象' }, correct: false }
      - { text: { en: 'Serializing and deserializing the dictionary', zh: '序列化再反序列化该字典' }, correct: false }
    explanation: { en: 'A shallow copy gives the function independent dictionary slots while intentionally reusing the values it will not mutate. Assignment would share the slots, while deeper operations exceed the stated boundary.', zh: '浅拷贝会提供独立的字典槽位，同时有意复用不会被修改的值。赋值会共享槽位，更深层的操作则超出题目给出的边界。' }
    difficulty: beginner
    tags: [copy-boundary, shallow-copy]

  - id: replace-keeps-unchanged-fields
    type: mcq
    prompt: { en: 'After copy.replace(record, status="sent"), what should you assume about an unchanged mutable field named tags?', zh: '执行 copy.replace(record, status="sent") 后，应怎样理解未变的可变字段 tags？' }
    options:
      - { text: { en: 'It may still reference the same object and must be checked against the type’s replacement semantics.', zh: '它可能仍引用同一个对象，必须按该类型的替换语义检查。' }, correct: true }
      - { text: { en: 'It is always recursively copied.', zh: '它总会被递归复制。' }, correct: false }
      - { text: { en: 'It is converted to an immutable tuple.', zh: '它会转换为不可变元组。' }, correct: false }
      - { text: { en: 'The operation is invalid whenever a record has a mutable field.', zh: '只要记录含有可变字段，这项操作就无效。' }, correct: false }
    explanation: { en: 'copy.replace() performs named structural replacement, not deep copying. Unchanged fields can remain shared, so copy a field explicitly when its ownership must change.', zh: 'copy.replace() 执行具名结构化替换，不是深拷贝。未变字段可能保持共享；如果字段的所有权必须改变，就要显式复制。' }
    difficulty: intermediate
    tags: [copy-replace, structural-replacement]

  - id: spot-broken-deepcopy
    title: { en: 'Spot the bug in the deep-copy hook', zh: '找出深拷贝钩子里的 bug' }
    type: spotbug
    prompt: { en: 'Find the two memo mistakes in this generated deep-copy hook.', zh: '找出这个生成的深拷贝钩子中两处与 memo 有关的错误。' }
    code: |
      import copy

      class Node:
          def __init__(self, name):
              self.name = name
              self.children = []

          def __deepcopy__(self, memo):
              clone = type(self)(self.name)
              clone.children = [copy.deepcopy(child) for child in self.children]
              return clone
    lang: python
    issues:
      - line: 9
        kind: correctness
        note: { en: 'The hook never records memo[id(self)] = clone before descending, so a child edge back to this node recurses again instead of resolving to the clone.', zh: '钩子在递归前没有执行 memo[id(self)] = clone，因此子节点指回当前节点时会再次递归，无法解析到副本。' }
      - line: 10
        kind: edge-case
        note: { en: 'Each child deepcopy starts with a fresh memo, so repeated child references become separate copies and cycles cannot reuse the active traversal.', zh: '每个子节点的 deepcopy 都从新的 memo 开始，因此重复子引用会变成多个副本，循环也无法复用当前遍历。' }
    explanation: { en: 'Register the empty clone in the supplied memo first, then call copy.deepcopy(self.children, memo). One shared memo preserves aliases and closes cycles.', zh: '应先在传入的 memo 中登记空副本，再调用 copy.deepcopy(self.children, memo)。共享同一个 memo 才能保留别名并闭合循环。' }
    difficulty: intermediate
    tags: [deep-copy, memo, code-review]

  - id: review-generated-work-order-copy
    title: { en: 'Review generated work-order copier', zh: '审查生成的工单复制器' }
    type: review
    prompt: { en: 'Review this generated work-order copier against the stated ownership policy and identify four distinct risks.', zh: '根据给定的所有权策略审查这个生成的工单复制器，找出 4 类不同风险。' }
    task: { en: 'Duplicate a work order, preserve aliases and cycles among mutable steps, share the read-only catalog, create a fresh lock, and allow callers to change only the order ID.', zh: '复制工单时，应保留可变步骤之间的别名与循环，共享只读目录，创建新锁，并且只允许调用方修改工单 ID。' }
    right: { en: 'The code allocates a new WorkOrder instead of mutating the template, accepts the memo argument, and keeps copying logic next to the owning class.', zh: '代码创建了新的 WorkOrder，没有修改模板；它接收 memo 参数，并把复制逻辑放在拥有该状态的类中。' }
    code: |
      import copy
      import threading

      class WorkOrder:
          def __init__(self, order_id, steps, catalog):
              self.order_id = order_id
              self.steps = steps
              self.catalog = catalog
              self.lock = threading.Lock()

          def __deepcopy__(self, memo):
              clone = type(self)(
                  self.order_id,
                  [copy.deepcopy(step) for step in self.steps],
                  copy.deepcopy(self.catalog, memo),
              )
              clone.lock = copy.deepcopy(self.lock, memo)
              return clone

      def duplicate_order(template, changes):
          clone = copy.deepcopy(template)
          clone.__dict__.update(changes)
          return clone
    lang: python
    issues:
      - line: 14
        kind: correctness
        note: { en: 'The per-step calls omit the active memo and the clone is not registered before descent, so repeated steps split apart and a cycle back to the order can recurse indefinitely.', zh: '逐步骤调用没有传入当前 memo，而且递归前没有登记副本，因此重复步骤会被拆成多个副本，指回工单的循环也可能无限递归。' }
      - line: 15
        kind: performance
        note: { en: 'The read-only catalog is recursively copied even though the task requires all work orders to share it, expanding the copied graph without changing ownership.', zh: '任务要求所有工单共享只读目录，但代码仍递归复制它，扩大了复制对象图，却没有改变所需所有权。' }
      - line: 17
        kind: edge-case
        note: { en: 'A threading lock does not support deep copying and raises TypeError; the constructor has already created the fresh lock the policy requires.', zh: '线程锁不支持深拷贝，会抛出 TypeError；构造函数其实已经创建了策略所需的新锁。' }
      - line: 22
        kind: security
        note: { en: 'Unrestricted mass assignment lets a caller replace steps, catalog, lock, or arbitrary internal attributes instead of changing only order_id.', zh: '不受限制的批量赋值让调用方可以替换 steps、catalog、lock 或任意内部属性，而不只是修改 order_id。' }
    checklist:
      - { en: 'Map every field to copy, share, reset, or reject before implementing the hook.', zh: '实现钩子前，把每个字段归入复制、共享、重置或拒绝之一。' }
      - { en: 'Test one repeated child and one cycle with identity assertions.', zh: '用标识断言测试一个重复子对象和一个循环。' }
      - { en: 'Exercise every resource-bearing field under the chosen policy.', zh: '按选定策略执行每个持有资源的字段。' }
      - { en: 'Allowlist caller-controlled replacement fields.', zh: '为调用方可控制的替换字段设置允许列表。' }
    explanation: { en: 'Register the clone before recursively copying steps with the same memo, reuse catalog, and retain the fresh constructor-created lock. Replace order_id explicitly rather than updating __dict__ from caller data.', zh: '应先登记副本，再用同一个 memo 递归复制 steps；catalog 保持共享，并保留构造函数创建的新锁。应显式替换 order_id，不能用调用方数据更新 __dict__。' }
    difficulty: advanced
    tags: [deep-copy, memo, code-review, object-ownership]
