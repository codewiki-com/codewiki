topic: python/checkpoint-3
items:
  - id: checkpoint-3-bound-method
    type: mcq
    prompt: { en: 'For an ordinary instance method, what does Python do when code calls account.deposit(10)?', zh: '对于普通实例方法，代码调用 account.deposit(10) 时 Python 会做什么？' }
    options:
      - { text: { en: 'It binds account as the first argument and passes 10 as the next argument', zh: '把 account 绑定为第一个实参，再把 10 作为下一个实参传入' }, correct: true }
      - { text: { en: 'It copies every account attribute into local variables', zh: '把 account 的所有属性复制为局部变量' }, correct: false }
      - { text: { en: 'It calls the method without an instance because self is optional', zh: '不传实例就调用方法，因为 self 可选' }, correct: false }
    explanation: { en: 'Attribute lookup produces a bound method, so account.deposit(10) behaves like type(account).deposit(account, 10).', zh: '属性查找会产生绑定方法，因此 account.deposit(10) 的行为类似 type(account).deposit(account, 10)。' }
    difficulty: beginner
    tags: [checkpoint]

  - id: checkpoint-3-attribute-shadowing
    type: mcq
    prompt: { en: 'Two instances initially read the class attribute status = "new". What does first.status = "paid" change?', zh: '两个实例最初都读取类属性 status = "new"。执行 first.status = "paid" 会改变什么？' }
    options:
      - { text: { en: 'It creates or replaces an instance attribute on first; the other instance still reads "new"', zh: '在 first 上创建或替换实例属性；另一个实例仍读取 "new"' }, correct: true }
      - { text: { en: 'It changes the class attribute for every instance', zh: '修改类属性，因此影响每个实例' }, correct: false }
      - { text: { en: 'It raises AttributeError because class attributes are read-only', zh: '抛出 AttributeError，因为类属性只读' }, correct: false }
    explanation: { en: 'Normal assignment through an instance writes to that instance. Its new attribute shadows the class attribute during later lookup.', zh: '通过实例进行普通赋值时，值会写入该实例。后续查找时，这个新实例属性会遮蔽类属性。' }
    difficulty: beginner
    tags: [checkpoint]

  - id: checkpoint-3-super-mro
    type: mcq
    prompt: { en: 'In cooperative multiple inheritance, which implementation does zero-argument super() search for next?', zh: '在协作式多重继承中，无参数 super() 接下来会查找哪个实现？' }
    options:
      - { text: { en: 'The next class after the current class in the instance type’s MRO', zh: '实例类型的方法解析顺序中位于当前类之后的类' }, correct: true }
      - { text: { en: 'Always the first base class written in the current class definition', zh: '始终是当前类定义中写在最前面的基类' }, correct: false }
      - { text: { en: 'Every direct base class simultaneously', zh: '同时查找所有直接基类' }, correct: false }
    explanation: { en: 'super() follows the method resolution order (MRO). This lets each cooperative implementation delegate exactly once through a diamond.', zh: 'super() 遵循方法解析顺序（MRO）。这样，在菱形继承中，每个协作式实现都能恰好委托一次。' }
    difficulty: intermediate
    tags: [checkpoint]

  - id: checkpoint-3-developer-representation
    type: fill
    prompt: { en: 'Name the magic method that defines an object’s developer-oriented representation.', zh: '写出定义对象开发者可读表示形式的魔术方法。' }
    answer: __repr__
    explanation: { en: '__repr__ supplies the representation used by repr() and commonly seen in containers and debugging.', zh: '__repr__ 提供 repr() 使用的表示形式，也常出现在容器显示与调试过程中。' }
    difficulty: intermediate
    tags: [checkpoint]

  - id: checkpoint-3-mutable-field
    type: fill
    prompt: { en: 'Which dataclasses field() argument creates a fresh list for every instance?', zh: 'dataclasses 的 field() 使用哪个参数，才能为每个实例创建新的列表？' }
    answer: default_factory
    explanation: { en: 'field(default_factory=list) calls list separately for each instance instead of sharing one mutable default.', zh: 'field(default_factory=list) 会为每个实例分别调用 list，避免共享同一个可变默认值。' }
    difficulty: intermediate
    tags: [checkpoint]

  - id: checkpoint-3-frozen-boundary
    type: mcq
    prompt: { en: 'A frozen dataclass has a field values: list[int]. Which statement is correct?', zh: '一个冻结的数据类包含字段 values: list[int]。哪项陈述正确？' }
    options:
      - { text: { en: 'Rebinding values is blocked, but the list object can still be mutated', zh: '不能重新绑定 values，但列表对象本身仍可修改' }, correct: true }
      - { text: { en: 'Both rebinding and every mutation inside the list are blocked', zh: '重新绑定以及列表内部的任何修改都会被阻止' }, correct: false }
      - { text: { en: 'frozen=True converts the list to a tuple automatically', zh: 'frozen=True 会自动把列表转换为元组' }, correct: false }
    explanation: { en: 'Frozen dataclasses prevent normal field assignment; they do not recursively freeze objects stored in those fields.', zh: '冻结的数据类会阻止普通字段赋值，但不会递归冻结字段中保存的对象。' }
    difficulty: intermediate
    tags: [checkpoint]

  - id: checkpoint-3-abstract-instantiation
    type: fill
    prompt: { en: 'Name the exception raised when a subclass still has an unimplemented abstract method and is instantiated.', zh: '子类仍有未实现的抽象方法，却尝试实例化时会抛出哪种异常？' }
    answer: TypeError
    explanation: { en: 'ABCMeta permits the class definition but blocks instantiation while abstract methods remain.', zh: 'ABCMeta 允许完成类定义，但只要仍有抽象方法，就会阻止实例化并抛出 TypeError。' }
    difficulty: advanced
    tags: [checkpoint]

  - id: checkpoint-3-abstract-body
    type: mcq
    prompt: { en: 'May a method decorated with @abstractmethod contain a concrete implementation?', zh: '使用 @abstractmethod 装饰的方法可以包含具体实现吗？' }
    options:
      - { text: { en: 'Yes; subclasses must still override it, and may call the base implementation with super()', zh: '可以；子类仍必须重写它，也可以通过 super() 调用基类实现' }, correct: true }
      - { text: { en: 'No; any statement other than pass makes class creation fail', zh: '不可以；除 pass 外的任何语句都会导致类创建失败' }, correct: false }
      - { text: { en: 'Yes; providing a body automatically removes its abstract status', zh: '可以；只要提供方法体，就会自动取消其抽象状态' }, correct: false }
    explanation: { en: '@abstractmethod marks an implementation requirement independently of whether the base method has reusable code.', zh: '@abstractmethod 标记的是实现要求，与基类方法是否包含可复用代码无关。' }
    difficulty: advanced
    tags: [checkpoint]
