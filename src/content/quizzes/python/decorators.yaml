topic: python/decorators
items:
  - id: predict-stacked-phases
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      def mark(label):
          print(f"make {label}")
          def decorate(func):
              print(f"apply {label}")
              def wrapper():
                  print(f"call {label}")
                  return func()
              return wrapper
          return decorate

      @mark("A")
      @mark("B")
      def run():
          print("body")

      run()
    lang: python
    options:
      - text: { en: "make A\nmake B\napply B\napply A\ncall A\ncall B\nbody", zh: "make A\nmake B\napply B\napply A\ncall A\ncall B\nbody" }
        correct: true
      - text: { en: "make B\nmake A\napply B\napply A\ncall A\ncall B\nbody", zh: "make B\nmake A\napply B\napply A\ncall A\ncall B\nbody" }
        correct: false
      - text: { en: "make A\nmake B\napply A\napply B\ncall B\ncall A\nbody", zh: "make A\nmake B\napply A\napply B\ncall B\ncall A\nbody" }
        correct: false
    explanation: { en: 'Decorator expressions evaluate top to bottom, decorators apply bottom to top, and the resulting wrappers run from the outside in.', zh: '装饰器表达式从上到下求值，装饰器从下到上应用，生成的包装器则从外到内调用。' }
    difficulty: intermediate
    tags: [decorators, stacking, predict-output]

  - id: wraps-guarantees
    type: mcq
    prompt: { en: 'What does functools.wraps() guarantee for a wrapper?', zh: 'functools.wraps() 能为包装函数保证什么？' }
    options:
      - { text: { en: 'It copies selected metadata and adds a __wrapped__ link.', zh: '它复制选定元数据，并添加 __wrapped__ 链接。' }, correct: true }
      - { text: { en: 'It proves that every argument and result is forwarded correctly.', zh: '它能证明所有实参与返回值都被正确转发。' }, correct: false }
      - { text: { en: 'It makes a synchronous wrapper become asynchronous when needed.', zh: '它会在需要时把同步包装器变成异步包装器。' }, correct: false }
      - { text: { en: 'It makes the wrapper and wrapped function the same object.', zh: '它会让包装函数与被包装函数成为同一个对象。' }, correct: false }
    explanation: { en: 'wraps() delegates to update_wrapper(), copying metadata and setting __wrapped__. Runtime behavior and static type correctness still depend on the implementation.', zh: 'wraps() 通过update_wrapper() 复制元数据并设置 __wrapped__。运行时行为与静态类型是否正确，仍取决于具体实现。' }
    difficulty: beginner
    tags: [functools, wraps, metadata]

  - id: spot-lost-return
    title: { en: 'Spot the bug in the decorator wrapper', zh: '找出装饰器包装里的bug' }
    type: spotbug
    prompt: { en: 'The decorated function should still return the subtotal. Find the bug.', zh: '被装饰函数仍应返回小计。请找出错误。' }
    code: |
      from functools import wraps

      def announce(func):
          @wraps(func)
          def wrapper(*args, **kwargs):
              print(f"calling {func.__name__}")
              func(*args, **kwargs)
          return wrapper

      @announce
      def subtotal(price, quantity):
          return price * quantity

      print(subtotal(8, 3))
    lang: python
    issues:
      - line: 7
        kind: correctness
        note: { en: 'The wrapper discards the original result; return func(*args, **kwargs) so subtotal() produces 24 instead of None.', zh: '包装函数丢弃了原结果；应写成return func(*args, **kwargs)，让subtotal() 返回24，而不是None。' }
    explanation: { en: 'Forwarding arguments is only half of a transparent wrapper. It must also return the original result unless changing that contract is deliberate.', zh: '透明包装不只要转发实参，还要返回原结果；只有明确改变契约时才应例外。' }
    difficulty: beginner
    tags: [decorators, return-value, spotbug]

  - id: factory-layers
    type: mcq
    prompt: { en: 'For @retry_on(ConnectionError, attempts=3), what must retry_on(...) return?', zh: '对于 @retry_on(ConnectionError, attempts=3)，retry_on(...) 必须返回什么？' }
    options:
      - { text: { en: 'A decorator that accepts the newly defined function', zh: '一个接收刚定义函数的装饰器' }, correct: true }
      - { text: { en: 'The result of calling the business function three times', zh: '业务函数调用三次后的结果' }, correct: false }
      - { text: { en: 'A tuple containing the function and its configuration', zh: '包含函数与配置的元组' }, correct: false }
      - { text: { en: 'A context manager that Python enters during every call', zh: 'Python在每次调用时进入的上下文管理器' }, correct: false }
    explanation: { en: 'The first call configures a decorator factory. Its result receives the function during definition and returns the object bound to the function name.', zh: '第一次调用配置装饰器工厂。工厂结果在定义阶段接收函数，并返回最终绑定到函数名称的对象。' }
    difficulty: intermediate
    tags: [decorator-factory, definition-time]

  - id: async-wrapper-shape
    type: mcq
    prompt: { en: 'Why should a transparent decorator for async def usually return an async def wrapper?', zh: '为什么async def的透明装饰器通常应返回async def包装函数？' }
    options:
      - { text: { en: 'So the wrapper can await execution inside its exception and cleanup boundary', zh: '让包装器能在自己的异常与清理边界内等待原函数执行' }, correct: true }
      - { text: { en: 'Because functools.wraps() works only on async functions', zh: '因为functools.wraps() 只能用于异步函数' }, correct: false }
      - { text: { en: 'Because async wrappers execute at module import time', zh: '因为异步包装函数会在模块导入时执行' }, correct: false }
      - { text: { en: 'So callers no longer need to await the decorated function', zh: '让调用方不再需要等待被装饰函数' }, correct: false }
    explanation: { en: 'A sync wrapper merely returning func(...) receives a coroutine object and does not surround its later execution. An async wrapper can await it while preserving coroutine-function identity.', zh: '同步包装器只返回func(...) 时，拿到的是协程对象，无法包围之后的执行。异步包装器可以等待它，并保留协程函数身份。' }
    difficulty: intermediate
    tags: [decorators, async, coroutine]

  - id: review-generated-payment-decorator
    type: review
    title: { en: 'Review a generated payment decorator', zh: '审查生成的支付装饰器' }
    prompt: { en: 'Review this generated decorator before it wraps a payment capture function.', zh: '在这段生成的装饰器用于包装支付扣款函数前，请审查它。' }
    task: { en: 'Add bounded retries and audit logging while preserving the function contract and keeping distinct payment requests separate.', zh: '增加有界重试与审计日志，同时保持函数契约，并隔离不同的支付请求。' }
    code: |
      import time
      from functools import wraps
      def audited_retry(attempts=3):
          cache = {}
          def decorate(func):
              def wrapper(user, amount, **kwargs):
                  print(f"calling {func.__name__}: {user=}, {kwargs=}")
                  key = (user["id"], amount)
                  if key in cache:
                      return cache[key]
                  for attempt in range(attempts):
                      try:
                          result = func(user, amount, **kwargs)
                          cache[key] = result
                          return result
                      except Exception:
                          time.sleep(2 ** attempt)
                  return None
              return wrapper
          return decorate
      @audited_retry()
      def capture_payment(user, amount, *, request_id):
          return gateway.charge(user, amount, request_id=request_id)
    lang: python
    issues:
      - line: 7
        kind: security
        note: { en: 'Logging the complete user and keyword dictionary can expose credentials, tokens, or payment identifiers; log an allowlist of redacted fields.', zh: '记录完整user与关键字实参字典可能泄露凭据、令牌或支付标识；应只记录经过脱敏的字段白名单。' }
      - line: 8
        kind: correctness
        note: { en: 'The cache key omits request_id and other keyword inputs, so distinct captures with the same user and amount can be treated as one request.', zh: '缓存键遗漏request_id与其他关键字输入，因此同一用户、同一金额的不同扣款可能被当作同一个请求。' }
      - line: 6
        kind: readability
        note: { en: 'The returned wrapper lacks @wraps(func), hiding the public name, documentation, annotations, signature chain, and __wrapped__ link.', zh: '返回的包装函数缺少 @wraps(func)，会隐藏公开名称、文档、注解、签名链与 __wrapped__ 链接。' }
      - line: 17
        kind: performance
        note: { en: 'time.sleep() blocks the executing thread on every retry; the delay policy should be injectable, and async targets need a nonblocking await.', zh: 'time.sleep() 会在每次重试时阻塞执行线程；等待策略应可注入，异步目标则需要非阻塞等待。' }
      - line: 18
        kind: edge-case
        note: { en: 'attempts <= 0 and exhausted retries both return None silently; validate the count and re-raise the final accepted exception.', zh: 'attempts <= 0与重试耗尽都会静默返回None；应校验次数，并重新抛出最后一个允许重试的异常。' }
    right: { en: 'The code separates configuration, decoration, and invocation, and it returns successful results from the wrapped function.', zh: '代码区分了配置、装饰与调用三个阶段，并会返回被包装函数的成功结果。' }
    checklist:
      - { en: 'Preserve metadata, signature, result, and exception behavior.', zh: '保持元数据、签名、返回值与异常行为。' }
      - { en: 'Classify retryable failures and preserve the final exception.', zh: '区分可重试故障，并保留最终异常。' }
      - { en: 'Treat idempotency and request identity as business contracts.', zh: '把幂等性与请求身份作为业务契约处理。' }
      - { en: 'Redact audit fields and choose sync or async waiting explicitly.', zh: '对审计字段脱敏，并明确选择同步或异步等待。' }
    explanation: { en: 'A safe retry decorator needs a narrow exception policy, explicit request identity, metadata preservation, and a waiting strategy matched to the execution model.', zh: '安全的重试装饰器需要窄化异常策略、明确请求身份、保留元数据，并采用符合执行模型的等待方式。' }
    difficulty: advanced
    minutes: 8
    tags: [decorators, code-review, retry, payment]
