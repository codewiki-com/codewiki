topic: python/python-fundamentals
items:
  - id: predict-alias-and-rebinding
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      items = ["mouse"]
      alias = items
      snapshot = items.copy()
      alias.append("cable")
      items = snapshot

      print(alias)
      print(items)
      print(alias is items)
    lang: python
    options:
      - { text: { en: "['mouse', 'cable']\n['mouse']\nFalse", zh: "['mouse', 'cable']\n['mouse']\nFalse" }, correct: true }
      - { text: { en: "['mouse', 'cable']\n['mouse', 'cable']\nTrue", zh: "['mouse', 'cable']\n['mouse', 'cable']\nTrue" }, correct: false }
      - { text: { en: "['mouse']\n['mouse']\nFalse", zh: "['mouse']\n['mouse']\nFalse" }, correct: false }
      - { text: { en: 'It raises TypeError during assignment.', zh: '程序在赋值时抛出TypeError。' }, correct: false }
    explanation: { en: 'alias still refers to the original list and mutates it. snapshot is a different list, and rebinding items to snapshot does not change alias.', zh: 'alias始终引用原列表，并修改了该列表。snapshot是另一个列表；把items重新绑定到snapshot不会改变alias。' }
    difficulty: beginner
    tags: [names, aliasing, rebinding, predict-output]
    tests: python3 aliasing.py
    minutes: 3

  - id: boolean-operators-return-operands
    type: mcq
    prompt: { en: 'What does configured_port or 8000 return when configured_port is 0?', zh: 'configured_port为0时，configured_port or 8000返回什么？' }
    options:
      - { text: { en: '8000, because 0 is false and or returns its second operand', zh: '8000，因为0为假，or返回第二个操作数' }, correct: true }
      - { text: { en: '0, because configured_port is an integer', zh: '0，因为configured_port是整数' }, correct: false }
      - { text: { en: 'False, because or always returns bool', zh: 'False，因为or总是返回bool' }, correct: false }
      - { text: { en: 'It raises ValueError because ports cannot be zero', zh: '程序抛出ValueError，因为端口不能为零' }, correct: false }
    explanation: { en: 'or short-circuits and returns one operand, not necessarily a bool. It treats every false first operand, including a potentially meaningful zero, as a reason to choose the second.', zh: 'or会短路并返回某个操作数，不保证返回bool。第一个操作数为假时都会选择第二个，可能有意义的零值也不例外。' }
    difficulty: beginner
    tags: [truth-value, short-circuit, zero]
    minutes: 2

  - id: spotbug-mutable-default
    title: { en: 'Spot the bug in the mutable default', zh: '找出可变默认值里的bug' }
    type: spotbug
    prompt: { en: 'Find why the second result contains a tag from the first call.', zh: '找出为什么第二次调用的结果包含第一次调用的标签。' }
    code: |
      def add_tag(tag, tags=[]):
          tags.append(tag)
          return tags


      print(add_tag("new"))
      print(add_tag("sale"))
    lang: python
    issues:
      - line: 1
        kind: correctness
        note: { en: 'The list default is created when def executes and reused by calls that omit tags, so both calls mutate one list.', zh: '列表默认值在执行def时创建，省略tags的调用会复用它，因此两次调用修改的是同一个列表。' }
    explanation: { en: 'Use tags=None and allocate a new list inside the function when tags is None. Shared state should have an explicit owner instead of hiding in a default.', zh: '应使用tags=None，并在tags is None时于函数体内创建新列表。共享状态应有明确所有者，不应藏在默认参数里。' }
    difficulty: beginner
    tags: [functions, mutable-default, code-review]
    tests: python3 tags.py
    minutes: 4

  - id: exception-boundary
    type: mcq
    prompt: { en: 'Which try suite best handles conversion of one user-supplied quantity?', zh: '处理一个用户输入数量的转换时，哪种try语句组最合适？' }
    options:
      - { text: { en: 'Wrap only int(raw_quantity) and catch ValueError at the input boundary.', zh: '只包住int(raw_quantity)，并在输入边界捕获ValueError。' }, correct: true }
      - { text: { en: 'Wrap the whole request and catch Exception, returning zero for every failure.', zh: '包住整个请求并捕获Exception，对所有失败都返回零。' }, correct: false }
      - { text: { en: 'Parse the exception message to decide whether conversion failed.', zh: '解析异常消息，以判断转换是否失败。' }, correct: false }
      - { text: { en: 'Catch BaseException so cancellation and process-exit signals become invalid input.', zh: '捕获BaseException，把取消与进程退出信号也当成无效输入。' }, correct: false }
    explanation: { en: 'A narrow try suite and specific exception type keep unrelated defects visible. Error-message text is not a stable API and should not drive control flow.', zh: '范围小的try语句组与具体异常类型能让无关缺陷继续暴露。错误消息文本不是稳定API，不应控制程序流程。' }
    difficulty: beginner
    tags: [exceptions, boundaries, error-handling]
    minutes: 2

  - id: review-generated-order-total
    title: { en: 'Review generated order total', zh: '审查生成的订单总额' }
    type: review
    prompt: { en: 'Review this generated order-total helper before it handles an API response.', zh: '在这个生成的订单汇总函数处理API响应前，对它进行审查。' }
    task: { en: 'Parse untrusted order JSON, validate active and cents fields, total active non-negative integer cents, avoid retaining customer records, and do no ordering work.', zh: '解析不可信的订单JSON，验证active与cents字段，汇总启用订单的非负整数分值，不保留客户记录，也不执行排序工作。' }
    code: |
      import json

      def active_total(raw, audit_log=[]):
          try:
              records = json.loads(raw)
              records.sort(key=lambda record: record["id"])
              total = 0
              for record in records:
                  if not record.get("active"):
                      continue
                  cents = record.get("cents") or 0
                  total += cents
                  audit_log.append(record)
              return total
          except Exception:
              return 0
    lang: python
    right: { en: 'The generated code uses the standard JSON parser, keeps the accumulator local, works in integer units rather than floating-point currency, and names the active filter directly.', zh: '生成代码使用标准JSON解析器，把累加器保留为局部状态，以整数单位而不是浮点货币计算，并直接命名了启用状态筛选。' }
    checklist:
      - { en: 'Validate the top-level shape and every required field before arithmetic or logging.', zh: '在计算或记录前，验证顶层结构与每个必需字段。' }
      - { en: 'Test missing fields, wrong types, booleans used as integers, negatives, zero, and malformed JSON.', zh: '测试字段缺失、类型错误、用布尔值冒充整数、负数、零和格式错误的JSON。' }
      - { en: 'Remove sorting, copying, or collection when the requested result does not consume it.', zh: '如果请求的结果不使用排序、复制或收集结果，就删除这些操作。' }
      - { en: 'Check defaults, logs, and error paths for state or sensitive data retained across calls.', zh: '检查默认值、日志与错误路径，确认状态或敏感数据不会跨调用保留。' }
    issues:
      - line: 3
        kind: correctness
        note: { en: 'audit_log is one mutable default shared across calls, so retained records accumulate even when callers provide no log.', zh: 'audit_log是跨调用共享的可变默认值；即使调用方没有提供日志，保留的记录也会不断累积。' }
      - line: 6
        kind: performance
        note: { en: 'Sorting every record is unnecessary because the requested result is only a total and has no ordering requirement.', zh: '请求的结果只是总额，没有顺序要求，因此对所有记录排序是无用工作。' }
      - line: 11
        kind: edge-case
        note: { en: 'or 0 accepts missing cents and other false values as zero instead of requiring a present, non-negative integer that excludes bool.', zh: 'or 0会把缺少的cents与其他假值当成零，而没有要求字段必须存在、是排除bool的非负整数。' }
      - line: 13
        kind: security
        note: { en: 'Appending each complete untrusted record retains fields the task does not need and can keep customer data in a process-wide list.', zh: '追加完整的不可信记录会保留任务不需要的字段，还可能把客户数据留在进程级列表中。' }
      - line: 15
        kind: readability
        note: { en: 'Catching every ordinary exception and returning 0 erases the difference between a real zero total, invalid input, and a programming defect.', zh: '捕获所有普通异常并返回0，会抹掉真实零总额、无效输入与编程缺陷之间的区别。' }
    explanation: { en: 'Parse to a value, validate the list and each record explicitly, then sum only checked integer cents. Remove the sort and audit retention, and let malformed input produce a specific boundary error.', zh: '应先解析，再显式验证列表与每条记录，最后只汇总检查过的整数分值。删除排序与审计保留，并让格式错误的输入产生具体的边界错误。' }
    difficulty: intermediate
    tags: [code-review, validation, mutable-default, exceptions]
    tests: python3 -m py_compile order_total.py
    minutes: 12
