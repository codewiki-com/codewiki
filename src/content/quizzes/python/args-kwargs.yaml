topic: python/args-kwargs
items:
  - id: predict-packed-arguments
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      def collect(batch, /, *values, scale=1, **labels):
          print(batch)
          print(values)
          print(scale)
          print(labels)

      collect("night", 2, 3, scale=10, owner="Lin")
    lang: python
    options:
      - { text: { en: "night, then (2, 3), then 10, then {'owner': 'Lin'}", zh: "依次输出 night、(2, 3)、10、{'owner': 'Lin'}" }, correct: true }
      - { text: { en: "night, then [2, 3], then 10, then {'owner': 'Lin'}", zh: "依次输出 night、[2, 3]、10、{'owner': 'Lin'}" }, correct: false }
      - { text: { en: "night, then (2, 3, 10), then 1, then {'owner': 'Lin'}", zh: "依次输出 night、(2, 3, 10)、1、{'owner': 'Lin'}" }, correct: false }
      - { text: { en: 'It raises TypeError because scale follows *values.', zh: '程序抛出 TypeError，因为 scale 位于 *values 之后。' }, correct: false }
    explanation: { en: 'Extra positional values form the values tuple. scale is keyword-only and binds before the unmatched owner keyword enters labels.', zh: '额外的位置值组成 values 元组。scale 仅限关键字传入，而且会先完成绑定；未匹配的 owner 随后进入 labels。' }
    difficulty: beginner
    tags: [args, kwargs, keyword-only, predict-output]
    tests: python3 packed_arguments.py
    minutes: 2

  - id: classify-full-signature
    type: mcq
    prompt: { en: 'In def route(path, /, version, *parts, strict=True, **metadata), which classification is correct?', zh: '对于 def route(path, /, version, *parts, strict=True, **metadata)，哪项分类正确？' }
    options:
      - { text: { en: 'path is positional-only; version is positional-or-keyword; parts is variadic positional; strict is keyword-only; metadata is variadic keyword.', zh: 'path 仅限位置传入；version 可按位置或关键字传入；parts 是可变位置形参；strict 仅限关键字传入；metadata 是可变关键字形参。' }, correct: true }
      - { text: { en: 'path and version are positional-only; strict is collected in metadata.', zh: 'path 与 version 都仅限位置传入；strict 会被收集进 metadata。' }, correct: false }
      - { text: { en: 'parts collects every argument after version, including strict.', zh: 'parts 会收集 version 之后的所有实参，包括 strict。' }, correct: false }
      - { text: { en: 'metadata may also collect surplus positional arguments.', zh: 'metadata 也可以收集多余的位置实参。' }, correct: false }
    explanation: { en: 'The separators and star prefixes determine parameter kinds. A named parameter after *parts is keyword-only and binds before unmatched keywords reach metadata.', zh: '分隔符与星号前缀决定形参种类。位于 *parts 后面的具名形参仅限关键字传入，并在未匹配关键字进入 metadata 前完成绑定。' }
    difficulty: intermediate
    tags: [signature, parameter-kinds, binding]
    minutes: 3

  - id: spot-silent-option-typo
    type: spotbug
    prompt: { en: 'Find why this connection helper silently ignores a caller mistake.', zh: '找出这个连接辅助函数为何会静默忽略调用方错误。' }
    code: |
      def connect(host, **options):
          timeout = options.get("timeout", 5)
          return f"{host}: timeout={timeout}"

      print(connect("db.internal", timeuot=1))
    lang: python
    issues:
      - line: 2
        kind: correctness
        note: { en: 'The catch-all accepts timeuot, then get() misses it and silently selects 5 instead of rejecting the unsupported name.', zh: '全盘接收器接受了 timeuot，get() 随后找不到 timeout，于是静默选择 5，而不是拒绝不支持的名称。' }
    explanation: { en: 'Declare timeout as a keyword-only parameter, or remove recognized options and raise TypeError when keys remain. Add a misspelled-key test so the default cannot mask drift.', zh: '应把 timeout 声明为仅限关键字的形参，或者移除已识别选项，并在仍有剩余键时抛出 TypeError。还要添加拼错键的测试，避免默认值掩盖接口漂移。' }
    difficulty: intermediate
    tags: [kwargs, typo, validation, code-review]
    tests: python3 silent_option.py
    minutes: 4

  - id: non-identifier-keyword-key
    type: mcq
    prompt: { en: 'What happens when capture is defined as def capture(**metadata) and called as capture(**{"content-type": "json"})?', zh: 'capture 定义为 def capture(**metadata)，再调用 capture(**{"content-type": "json"}) 时会发生什么？' }
    options:
      - { text: { en: "metadata becomes {'content-type': 'json'} because the mapping key is a string.", zh: "metadata 变为 {'content-type': 'json'}，因为映射键是字符串。" }, correct: true }
      - { text: { en: 'It raises SyntaxError because the key contains a hyphen.', zh: '程序抛出 SyntaxError，因为键中含有连字符。' }, correct: false }
      - { text: { en: 'It raises TypeError because every keyword key must be a valid identifier.', zh: '程序抛出 TypeError，因为每个关键字键都必须是有效标识符。' }, correct: false }
      - { text: { en: "metadata becomes {'content': 'json'} after normalization.", zh: "键会被规范化，因此 metadata 变为 {'content': 'json'}。" }, correct: false }
    explanation: { en: 'A ** mapping needs string keys, but a variadic keyword parameter can receive strings that direct keyword syntax cannot spell. Python does not normalize the key.', zh: '** 映射必须使用字符串键，但可变关键字形参可以接收直接关键字语法无法写出的字符串。Python 不会规范化这个键。' }
    difficulty: advanced
    tags: [kwargs, unpacking, mapping-keys]
    minutes: 3

  - id: review-generated-retry-wrapper
    type: review
    prompt: { en: 'Review this generated HTTP retry wrapper.', zh: '审查这个生成的 HTTP 重试包装器。' }
    task: { en: 'Support timeout, retries, and headers; keep caller-owned headers unchanged; never log credentials; reject unknown options; and re-raise the final retryable failure.', zh: '支持 timeout、retries 与 headers；不修改调用方拥有的标头；绝不记录凭据；拒绝未知选项；并在最后一次可重试失败时重新抛出异常。' }
    code: |
      def request_with_retry(client, url, /, **options):
          timeout = options.get("timeout", 5)
          retries = options.get("retries", 3)
          headers = options.get("headers", {})
          headers["X-Retry-Count"] = str(retries)
          print(f"request {url} with {options}")

          for attempt in range(retries):
              request_options = dict(options)
              request_options["headers"] = headers
              try:
                  return client.get(
                      url,
                      timeout=timeout,
                      **request_options,
                  )
              except Exception:
                  if attempt == retries - 1:
                      return None
    lang: python
    right: { en: 'The generated code makes url positional-only, gives controls local names, uses a bounded retry loop, and keeps construction of the downstream call in one place.', zh: '生成代码让 url 仅限位置传入，为控制项使用局部名称，采用有上限的重试循环，并把下游调用集中在一个位置构造。' }
    checklist:
      - { en: 'Partition options into wrapper-owned, forwarded, rejected, and sensitive names.', zh: '把选项划分为包装器拥有、继续转发、明确拒绝和含敏感数据四类。' }
      - { en: 'Check every explicitly supplied keyword against every unpacked mapping for duplicates.', zh: '检查每个显式关键字是否与各个解包映射中的键重复。' }
      - { en: 'Trace nested mutable identities back to caller-owned inputs.', zh: '沿嵌套可变对象的标识追踪到调用方拥有的输入。' }
      - { en: 'Exercise misspellings, final failure, redaction, and zero or invalid retry counts.', zh: '覆盖拼写错误、最终失败、敏感信息删除，以及零次或无效重试次数。' }
    issues:
      - line: 5
        kind: edge-case
        note: { en: 'headers may be a caller-owned nested dictionary, so adding X-Retry-Count mutates input despite options itself being a fresh outer dictionary.', zh: 'headers 可能是调用方拥有的嵌套字典，因此添加 X-Retry-Count 会修改输入，尽管 options 本身是新的外层字典。' }
      - line: 6
        kind: security
        note: { en: 'Logging all options can expose Authorization, cookies, or other credentials contained in headers.', zh: '记录全部选项可能暴露 headers 中的 Authorization、Cookie 或其他凭据。' }
      - line: 14
        lines: 2
        kind: correctness
        note: { en: 'request_options still contains timeout when the caller supplied it, so the explicit timeout and **request_options provide the same keyword twice and raise TypeError.', zh: '调用方提供 timeout 时，request_options 仍包含该键，因此显式 timeout 与 **request_options 会重复提供同一关键字并引发 TypeError。' }
      - line: 17
        lines: 3
        kind: readability
        note: { en: 'The broad catch hides the retryable-exception policy and converts the final failure to an ambiguous None instead of honoring the stated contract.', zh: '宽泛捕获隐藏了可重试异常策略，还把最终失败转换成含义不明的 None，没有遵守既定契约。' }
    explanation: { en: 'Copy nested headers, redact logs, pop wrapper-owned keys, reject leftovers, and catch only documented retryable exceptions. Re-raise on the final attempt so callers can distinguish exhaustion from a successful None result.', zh: '应复制嵌套标头、删除日志中的敏感信息、弹出包装器拥有的键、拒绝剩余项，并且只捕获文档明确的可重试异常。最后一次尝试应重新抛出，让调用方能区分重试耗尽与成功返回 None。' }
    difficulty: advanced
    tags: [code-review, kwargs, forwarding, ownership, security]
    tests: python3 -m py_compile retry_wrapper.py
    minutes: 12
