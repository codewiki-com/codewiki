topic: swift/fundamentals
items:
  - id: predict-collection-value-copy
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      var current = [2, 4]
      let snapshot = current
      current.append(6)

      print(current)
      print(snapshot)
    lang: swift
    options:
      - { text: { en: "[2, 4, 6]\n[2, 4]", zh: "[2, 4, 6]\n[2, 4]" }, correct: true }
      - { text: { en: "[2, 4, 6]\n[2, 4, 6]", zh: "[2, 4, 6]\n[2, 4, 6]" }, correct: false }
      - { text: { en: "[2, 4]\n[2, 4]", zh: "[2, 4]\n[2, 4]" }, correct: false }
    explanation: { en: 'Array has value semantics. Mutating current after assignment does not change the logically independent snapshot value.', zh: 'Array 具有值语义。赋值后修改 current，不会改变逻辑上独立的 snapshot 值。' }
    difficulty: beginner
    tags: [array, value-semantics, predict-output]

  - id: choose-inference-contract
    type: mcq
    prompt: { en: 'Which statement about var retryCount = 0 is correct?', zh: '关于 var retryCount = 0，哪项说法正确？' }
    options:
      - { text: { en: 'The compiler infers Int, and later assignments must still be compatible with Int.', zh: '编译器会推断为 Int，之后的赋值仍必须与 Int 兼容。' }, correct: true }
      - { text: { en: 'var makes the declaration dynamically typed, so it can later hold a String.', zh: 'var 会让声明变成动态类型，因此之后可以保存 String。' }, correct: false }
      - { text: { en: 'The declaration has no type until its first read.', zh: '该声明要等到第一次读取时才有类型。' }, correct: false }
      - { text: { en: 'Swift infers Double for every numeric literal.', zh: 'Swift 会把每个数值字面量都推断为 Double。' }, correct: false }
    explanation: { en: 'Type inference supplies a static type; var permits reassignment but does not permit the binding type to change.', zh: '类型推断会提供静态类型；var 允许重新赋值，但不允许改变绑定的类型。' }
    difficulty: beginner
    tags: [type-inference, binding, static-type]

  - id: spot-untrusted-region-index
    title: { en: 'Spot the bug in the region lookup', zh: '找出地区查询里的 bug' }
    type: spotbug
    prompt: { en: 'Find why this function can trap when its record comes from external data.', zh: '找出记录来自外部数据时，这个函数为何可能触发运行时错误。' }
    code: |
      func regionName(
          _ record: [String: String],
          regions: [String]
      ) -> String {
          let rawIndex = record["region"]!
          let index = Int(rawIndex)!
          return regions[index]
      }
    lang: swift
    issues:
      - line: 5
        kind: edge-case
        note: { en: 'A record without region makes the forced dictionary unwrap trap.', zh: '记录缺少 region 时，强制解包字典查找结果会触发错误。' }
      - line: 6
        kind: correctness
        note: { en: 'A noninteger region string makes Int return nil, which is then forced instead of being rejected as invalid input.', zh: 'region 不是整数文本时，Int 会返回 nil；代码却强制解包，而没有把它作为无效输入拒绝。' }
      - line: 7
        kind: edge-case
        note: { en: 'Even a parsed integer may be negative or outside regions.indices, and array subscripting then traps.', zh: '即使整数解析成功，它仍可能为负数或超出 regions.indices，数组下标访问会随即触发错误。' }
    explanation: { en: 'Use optional binding for lookup and parsing, then require regions.indices.contains(index) before subscripting. The API should represent invalid external data instead of trapping.', zh: '应通过可选绑定完成查找和解析，再要求 regions.indices.contains(index) 成立后才能访问下标。API 应表示无效外部数据，而不是触发错误。' }
    difficulty: intermediate
    tags: [optional-binding, array-index, input-validation]

  - id: choose-string-index-model
    type: mcq
    prompt: { en: 'Why does Swift not accept text[0] for a String?', zh: '为什么 Swift 不允许对 String 使用 text[0]？' }
    options:
      - { text: { en: 'A Character can span multiple Unicode scalars or bytes, so valid positions use String.Index rather than arbitrary integers.', zh: '一个 Character 可能跨越多个 Unicode 标量或字节，因此有效位置使用 String.Index，而不是任意整数。' }, correct: true }
      - { text: { en: 'String values are reference types and cannot be subscripted.', zh: 'String 是引用类型，因此不能访问下标。' }, correct: false }
      - { text: { en: 'Swift strings are always stored in reverse order.', zh: 'Swift 字符串总是逆序存储。' }, correct: false }
    explanation: { en: 'String indexing follows valid boundaries in a chosen string view. Iterate Characters or derive a String.Index from the string itself.', zh: 'String 索引遵循所选字符串视图中的有效边界。应遍历 Character，或从字符串自身取得 String.Index。' }
    difficulty: beginner
    tags: [string-index, grapheme-cluster, unicode]

  - id: review-generated-check-in-summary
    title: { en: 'Review generated check-in summary', zh: '审查生成的签到汇总' }
    type: review
    prompt: { en: 'Review this generated check-in summarizer against its input and privacy contract.', zh: '根据输入与隐私契约审查这段生成的签到汇总代码。' }
    task: { en: 'Aggregate minutes by a nonblank user id. Reject missing or malformed fields and values outside 1...1440, never log complete input rows, and process each row without rebuilding the key collection.', zh: '按非空用户 id 汇总分钟数：拒绝缺失或格式错误的字段以及不在 1...1440 内的值；绝不记录完整输入行；处理每行时不得重新构造键集合。' }
    code: |
      func summarizeCheckIns(
          _ rows: [[String: String]]
      ) -> [String: Int] {
          var totals: [String: Int] = [:]

          for row in rows {
              let user = row["user"]!
              let minutes = Int(row["minutes"] ?? "0")!
              if minutes < 0 { continue }

              print("accepted: \(row)")
              if Array(totals.keys).contains(user) {
                  totals[user] = totals[user]! + minutes
              } else {
                  totals[user] = minutes
              }
          }

          return totals
      }
    lang: swift
    issues:
      - line: 7
        kind: edge-case
        note: { en: 'A missing user field is force-unwrapped, and a blank user is accepted as a dictionary key.', zh: '缺少 user 字段时会发生强制解包错误，而且空 user 也会被当作字典键接受。' }
      - line: 8
        kind: correctness
        note: { en: 'Missing minutes becomes zero while malformed text traps; neither behavior satisfies the requirement to reject invalid fields explicitly.', zh: 'minutes 缺失时会变成零，格式错误时则触发错误；两种行为都没有按要求明确拒绝无效字段。' }
      - line: 11
        kind: security
        note: { en: 'The log interpolates the complete row, which can expose user ids and any additional unapproved fields.', zh: '日志插入了完整输入行，可能泄露用户 id 以及其他未经批准的字段。' }
      - line: 12
        kind: performance
        note: { en: 'Converting all keys to an array for every row allocates repeatedly and performs a linear search instead of using direct dictionary lookup.', zh: '每处理一行都把所有键转换成数组，会反复分配并执行线性查找，而不是直接查字典。' }
    right: { en: 'The generated code chooses a dictionary for aggregation, keeps the accumulator local, and returns a typed summary instead of exposing mutable state.', zh: '生成代码选择字典执行聚合，把累加器限制在局部作用域，并返回带类型的汇总，没有暴露可变状态。' }
    checklist:
      - { en: 'Test absent, blank, malformed, zero, negative, 1440, and above-limit fields.', zh: '测试字段缺失、空白、格式错误、零、负数、1440 以及超过上限的情况。' }
      - { en: 'Use guard binding and a 1...1440 range check before mutating totals.', zh: '修改 totals 前，使用 guard 绑定并检查 1...1440 范围。' }
      - { en: 'Aggregate with totals[user, default: 0] += minutes and inspect the loop for avoidable allocations.', zh: '使用 totals[user, default: 0] += minutes 聚合，并检查循环中的可避免分配。' }
      - { en: 'Capture logs in tests and confirm that raw rows and user identifiers are absent.', zh: '在测试中捕获日志，确认其中没有原始行和用户标识。' }
    explanation: { en: 'Validate and bind all fields before aggregation, use the dictionary default-value subscript for direct accumulation, and log only approved metadata. Force unwraps turn ordinary bad input into process-level failure.', zh: '应在聚合前验证并绑定所有字段，使用字典带默认值的下标直接累加，而且只记录获准元数据。强制解包会把普通错误输入变成进程级失败。' }
    difficulty: advanced
    tags: [code-review, input-validation, privacy, dictionary]
