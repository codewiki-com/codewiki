topic: swift/enums-pattern-matching
items:
  - id: predict-failable-raw-value
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      enum Channel: String {
          case email
          case push
      }

      for token in ["email", "sms", "push"] {
          print(Channel(rawValue: token)?.rawValue ?? "unknown")
      }
    lang: swift
    options:
      - { text: { en: "email\nunknown\npush", zh: "email\nunknown\npush" }, correct: true }
      - { text: { en: "email\nsms\npush", zh: "email\nsms\npush" }, correct: false }
      - { text: { en: 'The program traps on sms.', zh: '程序在 sms 处触发运行时错误。' }, correct: false }
    explanation: { en: 'The raw-value initializer is failable. sms has no matching case, so optional chaining produces nil and the nil-coalescing expression prints unknown.', zh: '原始值初始化器可能失败。sms 没有对应 case，因此可选链得到 nil，空值合并表达式输出 unknown。' }
    difficulty: beginner
    tags: [raw-value, optional, predict-output]

  - id: choose-associated-value
    type: mcq
    prompt: { en: 'Which model correctly stores a different server message in every failure value?', zh: '哪种模型能在每个失败值中保存不同的服务端消息？' }
    options:
      - { text: { en: 'enum Result { case failure(message: String) }', zh: 'enum Result { case failure(message: String) }' }, correct: true }
      - { text: { en: 'enum Result: String { case failure = "message" }', zh: 'enum Result: String { case failure = "message" }' }, correct: false }
      - { text: { en: 'enum Result: Error { case failure }', zh: 'enum Result: Error { case failure }' }, correct: false }
    explanation: { en: 'An associated value is supplied for each instance. A raw value is fixed once in the case declaration and cannot hold a different message per failure.', zh: '关联值在创建每个实例时提供。原始值在 case 声明中已经固定，不能为每次失败保存不同消息。' }
    difficulty: beginner
    tags: [associated-value, raw-value, modeling]

  - id: spot-shadowed-where-branch
    title: { en: 'Spot the bug in the .copying branch', zh: '找出 .copying 分支里的 bug' }
    type: spotbug
    prompt: { en: 'Find why low progress never receives its specific message.', zh: '找出低进度为何永远得不到专用提示。' }
    code: |
      enum TransferState {
          case waiting
          case copying(progress: Double)
          case finished
      }

      func message(for state: TransferState) -> String {
          switch state {
          case .waiting:
              return "Waiting"
          case .copying(let progress):
              return "Copying \(Int(progress * 100))%"
          case .copying(let progress) where progress < 0.1:
              return "Starting"
          case .finished:
              return "Done"
          }
      }
    lang: swift
    issues:
      - line: 13
        kind: correctness
        note: { en: 'The earlier .copying branch already matches every progress value, so this guarded branch is unreachable. Put the guarded branch first.', zh: '前面的 .copying 分支已经匹配所有进度值，因此这个带条件的分支不可达。应把带条件的分支放在前面。' }
    explanation: { en: 'Switch selects the first matching branch. Conditions for a case must precede the unguarded pattern for that same case.', zh: 'switch 会选择第一个匹配分支。同一个 case 的条件模式必须写在无条件模式之前。' }
    difficulty: intermediate
    tags: [where-clause, branch-order, code-review]

  - id: choose-unknown-default
    type: mcq
    prompt: { en: 'When is @unknown default preferable to an ordinary default?', zh: '什么情况下应优先使用 @unknown default，而不是普通 default？' }
    options:
      - { text: { en: 'When switching over a nonfrozen enum from another module that can add future cases.', zh: '对来自其他模块、将来可能增加 case 的非冻结枚举进行 switch 时。' }, correct: true }
      - { text: { en: 'Whenever an enum has associated values.', zh: '只要枚举带有关联值。' }, correct: false }
      - { text: { en: 'Whenever several current cases share one implementation.', zh: '只要多个当前 case 共用一段实现。' }, correct: false }
    explanation: { en: '@unknown default leaves a runtime path for future cases while still diagnosing current SDK cases that were not named. Owned enums should normally remain fully explicit.', zh: '@unknown default 为未来 case 保留运行路径，同时仍会诊断当前 SDK 中未明确列出的 case。自有枚举通常应保持完全显式。' }
    difficulty: advanced
    tags: [exhaustiveness, library-evolution, unknown-default]

  - id: review-generated-order-update
    title: { en: 'Review generated order-state update', zh: '审查生成的订单状态更新' }
    type: review
    prompt: { en: 'Review this generated order-state update against its boundary contract.', zh: '根据边界契约审查这段生成的订单状态更新代码。' }
    task: { en: 'Apply a server status to an order. Unknown status strings must be preserved, paid requires a nonempty receipt, failure reasons are sensitive, and dispatch should make the complete state mapping obvious.', zh: '把服务端状态应用到订单：必须保留未知状态字符串；paid 要求非空收据；失败原因属于敏感数据；分派逻辑应清楚展示完整状态映射。' }
    code: |
      enum ServerStatus: String {
          case pending
          case paid
          case failed
      }

      enum OrderState {
          case pending
          case paid(receipt: String)
          case failed(reason: String)
          case unknown(String)
      }

      func apply(statusText: String, receipt: String?, reason: String?,
                 to state: inout OrderState) {
          let status = ServerStatus(rawValue: statusText)!
          if case .paid = status {
              state = .paid(receipt: receipt ?? "")
          }
          if case .failed = status {
              print("failure reason:", reason ?? "none")
              state = .failed(reason: reason ?? "unknown")
          }
          if case .pending = status { state = .pending }
      }
    lang: swift
    issues:
      - line: 16
        kind: correctness
        note: { en: 'Force-unwrapping rejects an unknown server status with a trap instead of preserving the string in .unknown.', zh: '强制解包会让未知服务端状态触发运行时错误，而不是把原字符串保存在 .unknown 中。' }
      - line: 18
        kind: edge-case
        note: { en: 'A missing or empty receipt becomes a valid-looking .paid state even though the contract requires a nonempty receipt.', zh: '收据缺失或为空时仍会生成看似有效的 .paid 状态，但契约要求收据非空。' }
      - line: 21
        kind: security
        note: { en: 'Printing the raw failure reason can copy sensitive server or customer data into logs.', zh: '输出原始失败原因可能把敏感的服务端或客户数据复制到日志。' }
      - line: 17
        kind: readability
        note: { en: 'Three independent if case checks obscure that this is total dispatch. One switch would show the mapping and bind inputs in one place.', zh: '三个独立的 if case 掩盖了这是完整分派。一个 switch 能在同一处展示映射并绑定输入。' }
    right: { en: 'The generated code uses enums for the finite server and domain states, and it keeps state mutation inside one function.', zh: '生成代码用枚举表示有限的服务端状态和领域状态，并把状态修改集中在一个函数中。' }
    checklist:
      - { en: 'Test every known status plus an unknown raw string.', zh: '测试每个已知状态以及一个未知原始字符串。' }
      - { en: 'Test paid with a present, missing, and empty receipt.', zh: '分别测试收据存在、缺失和为空的 paid 状态。' }
      - { en: 'Inspect logs for associated values that may contain sensitive data.', zh: '检查日志中是否出现可能包含敏感数据的关联值。' }
      - { en: 'Confirm one exhaustive dispatch site maps every input to one result.', zh: '确认一个穷尽分派点把每种输入映射到唯一结果。' }
    explanation: { en: 'Use the failable raw-value result to preserve unknown text, validate payloads before constructing a case, avoid raw sensitive logging, and express the complete mapping with one switch.', zh: '使用可能失败的原始值结果保留未知文本；构造 case 前校验载荷；不要记录原始敏感数据；用一个 switch 表达完整映射。' }
    difficulty: advanced
    tags: [code-review, raw-value, associated-value, exhaustiveness]
