topic: swift/codable
items:
  - id: predict-property-default
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      import Foundation

      struct Score: Decodable {
          var points = 0
      }

      do {
          _ = try JSONDecoder().decode(Score.self, from: Data("{}".utf8))
          print("default 0")
      } catch DecodingError.keyNotFound(let key, _) {
          print("missing", key.stringValue)
      }
    lang: swift
    options:
      - { text: { en: 'default 0', zh: 'default 0' }, correct: false }
      - { text: { en: 'missing points', zh: 'missing points' }, correct: true }
      - { text: { en: 'The program does not compile.', zh: '程序无法编译。' }, correct: false }
    explanation: { en: 'A declaration initializer is not a fallback for synthesized decoding. The synthesized initializer still requests the points key and receives keyNotFound.', zh: '属性声明中的初始值不是合成解码的回退值。合成初始化器仍会读取 points 键，并得到 keyNotFound。' }
    difficulty: intermediate
    tags: [synthesis, missing-key, predict-output]

  - id: choose-minimal-conformance
    type: mcq
    prompt: { en: 'A transport model only consumes server responses and must never be emitted. Which conformance states that contract most precisely?', zh: '一个传输模型只读取服务端响应，而且绝不能输出。哪种一致性最准确地表达这个契约？' }
    options:
      - { text: { en: 'Decodable', zh: 'Decodable' }, correct: true }
      - { text: { en: 'Encodable', zh: 'Encodable' }, correct: false }
      - { text: { en: 'Codable', zh: 'Codable' }, correct: false }
    explanation: { en: 'Decodable promises only construction from an external representation. Codable also promises Encodable and can accidentally expose fields through generic encoding code.', zh: 'Decodable 只承诺从外部表示构造值。Codable 还承诺 Encodable，可能让字段通过通用编码代码意外输出。' }
    difficulty: beginner
    tags: [decodable, api-contract]

  - id: spot-missing-date-strategy
    title: { en: 'Spot the bug in the Event decoder', zh: '找出 Event 解码器里的 bug' }
    type: spotbug
    prompt: { en: 'Find why this valid-looking server response fails to decode.', zh: '找出这份看似有效的服务端响应为何解码失败。' }
    code: |
      import Foundation

      struct Event: Decodable {
          let eventId: Int
          let startsAt: Date
      }

      let data = Data(#"{"event_id":7,"starts_at":"2026-06-01T10:00:00Z"}"#.utf8)
      let decoder = JSONDecoder()
      decoder.keyDecodingStrategy = .convertFromSnakeCase
      let event = try decoder.decode(Event.self, from: data)
      print(event.eventId)
    lang: swift
    issues:
      - line: 11
        kind: correctness
        note: { en: 'The JSON date is an ISO 8601 string, but the decoder retains its default date strategy. Set dateDecodingStrategy to .iso8601 before decoding.', zh: 'JSON 日期是 ISO 8601 字符串，但解码器仍使用默认日期策略。解码前应把 dateDecodingStrategy 设为 .iso8601。' }
    explanation: { en: 'The key strategy maps both field names, but it does not configure value formats. Date representation is a separate part of the boundary contract.', zh: '键策略能映射两个字段名，却不会配置值格式。日期表示是边界契约中的独立部分。' }
    difficulty: intermediate
    tags: [date-strategy, type-mismatch, code-review]

  - id: distinguish-missing-and-null
    type: mcq
    prompt: { en: 'Which sequence preserves the distinction between an absent key and an explicit JSON null?', zh: '哪组调用能保留“键缺失”与“JSON 显式 null”之间的区别？' }
    options:
      - { text: { en: 'Check contains(_:), then decodeNil(forKey:), then decode(_:forKey:).', zh: '先调用 contains(_:)；再调用 decodeNil(forKey:)；最后调用 decode(_:forKey:)。' }, correct: true }
      - { text: { en: 'Call decodeIfPresent(_:forKey:) once and inspect whether the result is nil.', zh: '只调用一次 decodeIfPresent(_:forKey:)，再检查结果是否为 nil。' }, correct: false }
      - { text: { en: 'Give the Swift property a declaration default and use synthesized decoding.', zh: '给 Swift 属性写声明默认值，再使用合成解码。' }, correct: false }
    explanation: { en: 'decodeIfPresent returns nil for both states. Presence and explicit null require separate container queries before decoding a nonnull value.', zh: 'decodeIfPresent 对两种状态都会返回 nil。解码非空值前，必须分别查询键是否存在以及它是否为显式空值。' }
    difficulty: intermediate
    tags: ['null', missing-key, keyed-container]

  - id: review-generated-order-decoder
    title: { en: 'Review generated order decoder', zh: '审查生成的订单解码器' }
    type: review
    prompt: { en: 'Review this generated order decoder against its boundary contract.', zh: '根据边界契约审查这段生成的订单解码代码。' }
    task: { en: 'Decode orders whose id and total are required and whose date is ISO 8601. A missing coupon becomes empty, explicit null is rejected, failures retain diagnostic paths, and raw payloads are never logged.', zh: '解码订单：id 与 total 必须存在，日期使用 ISO 8601；coupon 缺失时为空字符串，但显式 null 必须拒绝；失败要保留诊断路径，而且绝不记录原始载荷。' }
    code: |
      import Foundation

      struct IncomingOrder: Decodable {
          let id: Int
          let coupon: String
          let createdAt: Date
          let totalCents: Int
          enum CodingKeys: String, CodingKey { case id, coupon, createdAt, totalCents }

          init(from decoder: Decoder) throws {
              let values = try decoder.container(keyedBy: CodingKeys.self)
              id = (try? values.decode(Int.self, forKey: .id)) ?? 0
              coupon = try values.decodeIfPresent(String.self, forKey: .coupon) ?? ""
              createdAt = try values.decode(Date.self, forKey: .createdAt)
              totalCents = try values.decode(Int.self, forKey: .totalCents)
          }
      }

      func decodeOrder(_ data: Data) -> IncomingOrder? {
          let decoder = JSONDecoder()
          decoder.dateDecodingStrategy = .iso8601
          print("order payload:", String(decoding: data, as: UTF8.self))
          return try? decoder.decode(IncomingOrder.self, from: data)
      }
    lang: swift
    issues:
      - line: 12
        kind: correctness
        note: { en: 'try? converts a missing or malformed required id into 0, so invalid identity can enter the domain as if it were valid.', zh: 'try? 会把缺失或格式错误的必需 id 变成 0，使无效身份像有效值一样进入领域层。' }
      - line: 13
        kind: edge-case
        note: { en: 'decodeIfPresent maps both absence and explicit null to nil, but the task accepts only absence. Check contains and decodeNil separately.', zh: 'decodeIfPresent 会把缺失和显式 null 都变成 nil，但任务只接受缺失。应分别检查 contains 与 decodeNil。' }
      - line: 22
        kind: security
        note: { en: 'Logging the complete payload can copy customer data or credentials into a longer-lived log system.', zh: '记录完整载荷可能把客户数据或凭据复制到保留时间更长的日志系统。' }
      - line: 23
        kind: readability
        note: { en: 'The outer try? erases the DecodingError case and codingPath, leaving callers with an unexplained nil.', zh: '外层 try? 会抹掉 DecodingError 类别与 codingPath，只给调用方留下无法解释的 nil。' }
    right: { en: 'The generated code uses typed CodingKeys, keeps required total decoding strict, and configures the ISO 8601 date strategy at the boundary.', zh: '生成代码使用了带类型的 CodingKeys，对必需的 total 保持严格解码，并在边界配置了 ISO 8601 日期策略。' }
    checklist:
      - { en: 'Classify every field as required, nullable, defaulted, or forward-compatible.', zh: '把每个字段分类为必需、可空、有默认值或向前兼容。' }
      - { en: 'Test absence, explicit null, wrong scalar type, and an unknown enum value separately.', zh: '分别测试缺失、显式 null、错误标量类型和未知枚举值。' }
      - { en: 'Assert the DecodingError case and codingPath for invalid payloads.', zh: '对无效载荷断言 DecodingError 类别与 codingPath。' }
      - { en: 'Inspect logs and telemetry for raw or reconstructable payload data.', zh: '检查日志和遥测中是否存在原始或可还原的载荷数据。' }
    explanation: { en: 'Keep required fields strict, distinguish coupon presence from null, return or throw an error that preserves context, and log only approved metadata such as a request identifier and redacted path.', zh: '必需字段应保持严格；coupon 的缺失与空值要分开；返回或抛出能保留上下文的错误；日志只记录请求标识和脱敏路径等获准元数据。' }
    difficulty: advanced
    tags: [code-review, decoding-error, privacy, 'null']
