topic: swift/closures
items:
  - id: predict-shared-and-snapshot-capture
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      func demonstrateCapture() {
          var multiplier = 2
          let live = { (value: Int) in value * multiplier }
          let snapshot = { [multiplier] (value: Int) in
              value * multiplier
          }

          multiplier = 4
          print(live(3))
          print(snapshot(3))
      }

      demonstrateCapture()
    lang: swift
    options:
      - { text: { en: "12\n6", zh: "12\n6" }, correct: true }
      - { text: { en: "6\n12", zh: "6\n12" }, correct: false }
      - { text: { en: "12\n12", zh: "12\n12" }, correct: false }
      - { text: { en: "6\n6", zh: "6\n6" }, correct: false }
    explanation: { en: 'live reads shared capture storage after multiplier changes. The capture-list entry for snapshot was initialized when that closure was created.', zh: 'live 会在 multiplier 改变后读取共享的捕获存储；snapshot 的捕获列表项则在创建闭包时完成初始化。' }
    difficulty: intermediate
    tags: [capture-list, snapshot, predict-output]

  - id: escaping-is-permission
    type: mcq
    prompt: { en: 'Which statement about @escaping is accurate?', zh: '关于 @escaping，哪项说法准确？' }
    options:
      - { text: { en: 'It permits a closure parameter to outlive the receiving function call, but does not imply asynchronous or exactly-once execution.', zh: '它允许闭包参数比接收它的函数调用活得更久，但不表示异步执行，也不保证恰好调用一次。' }, correct: true }
      - { text: { en: 'It schedules the closure on a background executor after the function returns.', zh: '它会在函数返回后把闭包调度到后台执行器。' }, correct: false }
      - { text: { en: 'It makes every captured class reference weak.', zh: '它会把捕获的每个类引用都变成弱引用。' }, correct: false }
    explanation: { en: '@escaping is a lifetime capability. Storage or later invocation may require it, while scheduling, call count, and capture ownership remain separate contracts.', zh: '@escaping 表达的是生命周期能力；存储或延后调用可能需要它，而调度、调用次数和捕获所有权仍是独立契约。' }
    difficulty: beginner
    tags: [escaping-closure, api-contract]

  - id: spot-missing-escaping
    type: spotbug
    prompt: { en: 'Find why this queue does not compile.', zh: '找出这个队列无法编译的原因。' }
    code: |
      final class JobQueue {
          private var jobs: [() -> Void] = []

          func enqueue(_ job: () -> Void) {
              jobs.append(job)
          }
      }
    lang: swift
    issues:
      - line: 4
        kind: correctness
        note: { en: 'job is nonescaping by default, but appending it stores the function value beyond enqueue(_:) and therefore requires @escaping.', zh: 'job 默认是非逃逸参数，但追加到数组会让函数值活过 enqueue(_:) 调用，因此需要 @escaping。' }
    explanation: { en: 'Declare the parameter as job: @escaping () -> Void. The annotation permits storage; the API should separately document when and how often queued jobs run.', zh: '应把参数声明为 job: @escaping () -> Void。这个标记允许存储；API 仍需另外说明任务何时运行以及会运行几次。' }
    difficulty: intermediate
    tags: [escaping-closure, compiler-error, code-review]

  - id: swift-loop-binding
    type: mcq
    prompt: { en: 'Three closures are appended inside for index in 0..<3 and invoked after the loop. Which capture description is correct?', zh: '在 for index in 0..<3 中追加三个闭包，并在循环后调用。哪项捕获说明正确？' }
    options:
      - { text: { en: 'Each closure retains its iteration binding, so the values are 0, 1, and 2.', zh: '每个闭包保留各自迭代的绑定，因此结果是 0、1、2。' }, correct: true }
      - { text: { en: 'All closures share one loop binding, so every value is 2.', zh: '所有闭包共享同一个循环绑定，因此结果全是 2。' }, correct: false }
      - { text: { en: 'Capturing an iteration binding is forbidden unless [index] is present.', zh: '除非写出 [index]，否则不能捕获迭代绑定。' }, correct: false }
    explanation: { en: 'Swift binds the for-in item for each iteration. A different result arises when closures capture one mutable variable declared outside and reassigned by the loop.', zh: 'Swift 会为每轮迭代绑定 for-in 元素。只有闭包捕获循环外声明、又被循环反复赋值的同一个可变变量时，结果才不同。' }
    difficulty: intermediate
    tags: [capture, for-in, language-migration]

  - id: review-generated-search-handler
    type: review
    prompt: { en: 'Review this generated reusable search handler.', zh: '审查这段生成的可复用搜索处理器。' }
    task: { en: 'Install a reusable search callback that ignores blank input, reports one result array per accepted query, does not retain the controller after external ownership ends, avoids exposing queries, and stays efficient across repeated searches.', zh: '安装一个可复用搜索回调：忽略空白输入；每个接受的查询只报告一次结果数组；外部所有权结束后不保留控制器；不泄露查询内容；重复搜索时保持高效。' }
    code: |
      final class SearchController {
          var onSubmit: ((String) -> Void)?
          var onResults: (([String]) -> Void)?
          private let catalog = ["Swift", "Kotlin", "Rust"]

          func installSearch(minLength: Int) {
              onSubmit = { query in
                  guard query.count >= minLength else { return }
                  let normalized = query.lowercased()
                  let matches = self.catalog.filter {
                      $0.lowercased().contains(normalized)
                  }
                  print("search query:", query)
                  self.onResults?(matches)
              }
          }
      }
    lang: swift
    issues:
      - line: 7
        kind: correctness
        note: { en: 'The controller strongly stores onSubmit, and the closure strongly captures self, forming a reference cycle.', zh: '控制器强持有 onSubmit，而闭包又强捕获 self，形成引用循环。' }
      - line: 8
        kind: edge-case
        note: { en: 'Length is checked before trimming, so a whitespace-only query can pass minLength and be treated as a real search.', zh: '长度检查发生在去除空白之前，因此纯空白查询可能通过 minLength 并被当成真实搜索。' }
      - line: 10
        kind: performance
        note: { en: 'Every accepted query lowercases every catalog entry again; a reusable handler should precompute normalized searchable values.', zh: '每个接受的查询都会重新把所有目录项转成小写；可复用处理器应预先计算规范化的可搜索值。' }
      - line: 13
        kind: security
        note: { en: 'Logging the raw query can expose personal, secret, or otherwise sensitive search text.', zh: '记录原始查询可能泄露个人信息、秘密或其他敏感搜索内容。' }
    right: { en: 'The generated code gives the handler a clear entry point, keeps the catalog immutable, and emits one result array on its ordinary accepted-query path.', zh: '生成代码为处理器提供了清晰入口，保持目录不可变，并在普通的已接受查询路径上只发送一个结果数组。' }
    checklist:
      - { en: 'Draw the storage and capture edges between the controller and both callbacks.', zh: '画出控制器与两个回调之间的存储边和捕获边。' }
      - { en: 'Test empty, whitespace-only, shorter-than-minimum, and Unicode input.', zh: '测试空字符串、纯空白、短于最小长度以及 Unicode 输入。' }
      - { en: 'Inspect logs and telemetry for raw query text or derived sensitive values.', zh: '检查日志和遥测中是否包含原始查询文本或派生敏感值。' }
      - { en: 'Measure or count repeated catalog normalization across several submissions.', zh: '测量或统计多次提交时目录规范化重复执行的次数。' }
    explanation: { en: 'Use a weak capture when searches should stop with the controller, normalize and validate the query before matching, precompute normalized catalog entries, and log only approved aggregate metadata.', zh: '如果搜索应随控制器消失而停止，就使用弱捕获；匹配前先规范化并校验查询；预先计算目录项的规范化形式；日志只记录获准的聚合元数据。' }
    difficulty: advanced
    tags: [code-review, capture-list, privacy, performance]
