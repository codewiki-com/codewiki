topic: swift/generics
items:
  - id: predict-inferred-output-type
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      func transformed<Input, Output>(
          _ values: [Input],
          using transform: (Input) -> Output
      ) -> [Output] {
          values.map(transform)
      }

      let counts = transformed(["build", "test"]) { $0.count }
      print(counts)
    lang: swift
    options:
      - { text: { en: '[5, 4]', zh: '[5, 4]' }, correct: true }
      - { text: { en: '["build", "test"]', zh: '["build", "test"]' }, correct: false }
      - { text: { en: '[String, String]', zh: '[String, String]' }, correct: false }
      - { text: { en: 'The compiler cannot infer Output.', zh: '编译器无法推断 Output。' }, correct: false }
    explanation: { en: 'The input array fixes Input as String, and the closure result fixes Output as Int. The returned value is therefore [Int] with the two string lengths.', zh: '输入数组把 Input 确定为 String，闭包结果把 Output 确定为 Int，因此返回值是包含两个字符串长度的 [Int]。' }
    difficulty: beginner
    tags: [type-inference, generic-function, predict-output]

  - id: same-type-requirement-meaning
    type: mcq
    prompt: { en: 'What does `where Left.Element == Right.Element` require?', zh: '`where Left.Element == Right.Element` 要求什么？' }
    options:
      - { text: { en: 'The two container types may differ, but their element types must be identical.', zh: '两个容器类型可以不同，但元素类型必须相同。' }, correct: true }
      - { text: { en: 'Left and Right must be exactly the same container type.', zh: 'Left 与 Right 必须是完全相同的容器类型。' }, correct: false }
      - { text: { en: 'Both element types are converted to Any at runtime.', zh: '两个元素类型会在运行时转换成 Any。' }, correct: false }
      - { text: { en: 'The elements only need to share one method name.', zh: '两种元素只需拥有一个同名方法。' }, correct: false }
    explanation: { en: 'This is a same-type requirement on dependent member types. Array<String> and ArraySlice<String> can satisfy it even though the containers themselves differ.', zh: '这是针对依赖成员类型的同类型要求。Array<String> 与 ArraySlice<String> 的容器类型不同，但仍可满足该要求。' }
    difficulty: intermediate
    tags: [where-clause, same-type-requirement, associated-type]

  - id: spot-missing-comparable-constraint
    type: spotbug
    prompt: { en: 'Find why this generic function cannot call `min()`.', zh: '找出这个泛型函数无法调用 `min()` 的原因。' }
    code: |
      func smallest<Value>(_ values: [Value]) -> Value? {
          values.min()
      }
    lang: swift
    issues:
      - line: 1
        kind: correctness
        note: { en: 'Value has no comparison ability. Declare Value: Comparable, or add `where Value: Comparable`, because Array.min() needs comparable elements.', zh: 'Value 没有比较能力。应声明 Value: Comparable，或添加 `where Value: Comparable`，因为 Array.min() 要求元素可比较。' }
    explanation: { en: 'An unconstrained type parameter exposes only operations valid for every type. Add the narrow constraint required by this algorithm rather than casting elements at runtime.', zh: '无约束类型参数只能使用所有类型都具备的操作。应添加算法需要的最窄约束，而不是在运行时转换元素。' }
    difficulty: beginner
    tags: [generic-constraint, comparable, compiler-error]

  - id: primary-associated-type-role
    type: mcq
    prompt: { en: 'What does the `Item` in `protocol Catalog<Item>` represent?', zh: '`protocol Catalog<Item>` 中的 `Item` 表示什么？' }
    options:
      - { text: { en: 'A primary associated type that must also be declared with `associatedtype Item` and is selected by each conformer.', zh: '一个主关联类型，还必须用 `associatedtype Item` 声明，并由每个遵循类型确定。' }, correct: true }
      - { text: { en: 'A stored protocol property created for every conforming value.', zh: '为每个遵循值创建的协议存储属性。' }, correct: false }
      - { text: { en: 'An ordinary generic argument chosen when the protocol declaration executes.', zh: '协议声明执行时选择的普通泛型实参。' }, correct: false }
      - { text: { en: 'An existential box that can contain several item types at once.', zh: '一个可以同时容纳多种元素类型的存在类型盒。' }, correct: false }
    explanation: { en: 'The angle-bracket list names primary associated types for concise constraints such as Catalog<Product>. The conforming type still establishes its Item witness.', zh: '尖括号列表为主关联类型命名，便于写出 Catalog<Product> 等简洁约束；遵循类型仍需确定自己的 Item 见证。' }
    difficulty: intermediate
    tags: [primary-associated-type, protocol, conformance]

  - id: review-generated-generic-store
    type: review
    prompt: { en: 'Review this generated generic store against the stated task.', zh: '根据任务要求审查这段生成的泛型存储。' }
    task: { en: 'Build a keyed in-memory store that replaces existing values, returns nil for missing keys, preserves first-insertion order in listings, avoids logging stored values, and provides average constant-time lookup.', zh: '构建一个键控内存存储：替换已有值；键缺失时返回 nil；列表保持首次插入顺序；不记录存储值；平均查找时间为常数。' }
    code: |
      struct Customer {
          let id: Int
          let email: String
      }
      struct Store<Key: Hashable, Value> {
          private var entries: [(Key, Value)] = []
          mutating func put(_ value: Value, for key: Key) {
              entries.append((key, value))
          }
          func value(for key: Key) -> Value {
              entries.first(where: { $0.0 == key })!.1
          }
          func allValues() -> [Value] {
              entries.map(\.1)
          }
          func debugDump() {
              for (key, value) in entries {
                  print("\(key): \(value)")
              }
          }
      }
    lang: swift
    issues:
      - line: 8
        kind: correctness
        note: { en: 'put always appends, so writing an existing key creates a duplicate instead of replacing its value.', zh: 'put 总是追加，因此再次写入已有键会产生重复项，而不是替换原值。' }
      - line: 11
        kind: edge-case
        note: { en: 'The forced unwrap traps for a missing key. The signature and implementation must return Value? as the task requires.', zh: '键缺失时强制解包会触发运行时错误。签名与实现必须按任务要求返回 Value?。' }
      - line: 11
        kind: performance
        note: { en: 'Scanning the tuple array makes every lookup linear even though Key is Hashable; use a dictionary for average constant-time lookup and track order separately.', zh: '扫描元组数组会让每次查找变成线性时间，尽管 Key 已符合 Hashable；应使用字典进行平均常数时间查找，并单独记录顺序。' }
      - line: 18
        kind: security
        note: { en: 'Printing each stored value can expose fields such as Customer.email. Diagnostics should use approved aggregate metadata instead.', zh: '打印每个存储值可能暴露 Customer.email 等字段。诊断信息应只使用获准的聚合元数据。' }
    right: { en: 'The code keeps key and value types related through Store, requires hashable keys, and retains insertion order in its underlying sequence for keys that are inserted once.', zh: '代码通过 Store 保留键和值的类型关系，要求键可哈希，并在每个键只插入一次时通过底层序列保留插入顺序。' }
    checklist:
      - { en: 'Insert the same key twice and verify replacement without changing its first-listing position.', zh: '连续插入同一键两次，验证值被替换且首次列表位置不变。' }
      - { en: 'Look up a missing key and confirm the API returns nil without trapping.', zh: '查找缺失键，确认 API 返回 nil 且不会触发运行时错误。' }
      - { en: 'Measure lookup work as the store grows and inspect whether Hashable is used by the storage.', zh: '随着存储增长测量查找工作量，并检查底层存储是否真正使用 Hashable。' }
      - { en: 'Capture diagnostics and verify that keys, values, and customer fields are absent unless explicitly approved.', zh: '捕获诊断信息，确认其中不含键、值或客户字段，除非这些内容已被明确批准。' }
    explanation: { en: 'Use a dictionary for lookup plus a separate ordered key array, update in place for existing keys, return an optional, and report only safe counts or operation names.', zh: '应使用字典查找并单独保存有序键数组；已有键原位更新；查找返回可选值；诊断只报告安全的数量或操作名称。' }
    difficulty: advanced
    tags: [code-review, generic-container, lookup, privacy, performance]
