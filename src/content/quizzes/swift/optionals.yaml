topic: swift/optionals
items:
  - id: predict-optional-binding
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      let raw: String? = "12"

      if let raw, let value = Int(raw) {
          print(value * 2)
      } else {
          print("invalid")
      }
    lang: swift
    options:
      - { text: { en: '24', zh: '24' }, correct: true }
      - { text: { en: 'Optional(24)', zh: 'Optional(24)' }, correct: false }
      - { text: { en: 'invalid', zh: 'invalid' }, correct: false }
      - { text: { en: 'It does not compile because raw remains optional.', zh: '代码无法编译，因为raw仍是可选值。' }, correct: false }
    explanation: { en: 'The first binding unwraps the string, and the second unwraps the successful integer parse. The body therefore multiplies an ordinary Int.', zh: '第一次绑定解包字符串，第二次绑定解包成功解析出的整数，因此函数体中参与乘法的是普通Int。' }
    difficulty: beginner
    tags: [optional-binding, predict-output]

  - id: optional-type-contract
    type: mcq
    prompt: { en: 'Which statement accurately describes String? in Swift?', zh: '关于Swift中的String?，哪项说法准确？' }
    options:
      - { text: { en: 'It is shorthand for Optional<String>, with .some(String) and .none states.', zh: '它是Optional<String>的简写，包含 .some(String) 与 .none两种状态。' }, correct: true }
      - { text: { en: 'It is a String whose empty value is automatically treated as nil.', zh: '它是String，空字符串会自动当成nil。' }, correct: false }
      - { text: { en: 'It is an untyped pointer that can be assigned to any variable.', zh: '它是无类型指针，可以赋给任意变量。' }, correct: false }
    explanation: { en: 'Optional is a generic enum. Empty strings remain present String values and are distinct from nil.', zh: 'Optional是泛型枚举。空字符串仍是存在的String值，与nil不同。' }
    difficulty: beginner
    tags: [optional-value, type-system]

  - id: map-versus-flatmap
    type: mcq
    prompt: { en: 'Why does input.flatMap { Int($0) } return Int? instead of Int???', zh: '为什么input.flatMap { Int($0) } 返回Int?，而不是Int??？' }
    options:
      - { text: { en: 'flatMap accepts an optional-returning transform and flattens the resulting optional layer.', zh: 'flatMap接受返回可选值的转换，并展平结果中的可选层。' }, correct: true }
      - { text: { en: 'Int(_:) always returns a non-optional integer inside flatMap.', zh: 'Int(_:) 在flatMap内总会返回非可选整数。' }, correct: false }
      - { text: { en: 'Swift removes every nested optional at compile time.', zh: 'Swift会在编译期删除所有嵌套可选层。' }, correct: false }
    explanation: { en: 'Optional.flatMap propagates a nil receiver or a nil transform result as one nil. Nested optionals still exist elsewhere when their layers carry distinct state.', zh: 'Optional.flatMap会把接收值缺失或转换失败传播为一个nil。其他场景中的嵌套可选值仍然存在，并可让不同层承载不同状态。' }
    difficulty: intermediate
    tags: [flatmap, nested-optional]

  - id: spot-force-unwrap
    title: { en: 'Spot the bug in the email lookup', zh: '找出邮箱查询里的bug' }
    type: spotbug
    prompt: { en: 'Find why this helper can trap for ordinary input.', zh: '找出这个辅助函数为何会因普通输入触发运行时错误。' }
    code: |
      struct User {
          let email: String?
      }

      func normalizedEmail(for users: [String: User], id: String) -> String {
          let user = users[id]!
          return user.email!.lowercased()
      }
    lang: swift
    issues:
      - line: 6
        kind: correctness
        note: { en: 'Dictionary lookup returns nil for an unknown id, so forcing users[id] traps before the function can return.', zh: '未知id的字典查询结果是nil，因此强制解包users[id] 会在函数返回前触发错误。' }
      - line: 7
        kind: edge-case
        note: { en: 'A user may exist without an email, and forcing that independent optional also traps.', zh: '用户可能存在但没有邮箱，强制解包这个独立可选值同样会触发错误。' }
    explanation: { en: 'The two optionals represent separate missing states. Return String?, throw a domain error, or handle each state explicitly instead of asserting both away.', zh: '两个可选值表示不同的缺失状态。应返回String?、抛出领域错误或分别处理状态，而不是用断言同时消除它们。' }
    difficulty: intermediate
    tags: [force-unwrapping, dictionary, code-review]

  - id: predict-nested-dictionary
    type: predict
    prompt: { en: 'Which three states are printed for these dictionary lookups?', zh: '这些字典查询会依次输出哪三种状态？' }
    code: |
      let scores: [String: Int?] = ["ready": 8, "waiting": nil]

      func state(_ value: Int??) -> String {
          switch value {
          case .none: return "missing"
          case .some(.none): return "waiting"
          case .some(.some(let score)): return "score=\(score)"
          }
      }

      print(state(scores["ready"]))
      print(state(scores["waiting"]))
      print(state(scores["unknown"]))
    lang: swift
    options:
      - text:
          en: "score=8\nwaiting\nmissing"
          zh: "score=8\nwaiting\nmissing"
        correct: true
      - text:
          en: "score=8\nmissing\nmissing"
          zh: "score=8\nmissing\nmissing"
        correct: false
      - text:
          en: "Optional(8)\nnil\nnil"
          zh: "Optional(8)\nnil\nnil"
        correct: false
    explanation: { en: 'Dictionary lookup adds an outer optional for key presence. The waiting key exists with an inner nil, while unknown has no outer value.', zh: '字典查询用外层可选值表示键是否存在。waiting键存在且内层为nil，unknown则没有外层值。' }
    difficulty: intermediate
    tags: [nested-optional, dictionary, pattern-matching]

  - id: review-generated-account-import
    type: review
    title: { en: 'Review a generated account importer', zh: '审查生成的账户导入器' }
    prompt: { en: 'Review this generated dictionary parser for optional-state correctness and maintainability.', zh: '审查这个生成的字典解析器，检查可选状态的正确性与可维护性。' }
    task: { en: 'Import an account only when id is a positive integer. Preserve a missing nickname as nil and an explicitly empty nickname as an empty string. A missing credit limit is allowed, but malformed or negative limits must reject the row.', zh: '仅在id是正整数时导入账户。昵称缺失时保留nil，显式空昵称保留空字符串。信用额度可以缺失，但格式错误或负数必须拒绝整行。' }
    code: |
      struct ImportedAccount {
          let id: Int
          let nickname: String?
          let creditLimit: Int?
      }

      func importAccount(_ fields: [String: String]) -> ImportedAccount? {
          let id = Int(fields["id"]!)!
          let nickname = fields["nickname"] ?? ""

          let rawLimit = fields["creditLimit"] ?? "-1"
          let creditLimit = Int(rawLimit) ?? -1

          if Int(rawLimit) == nil {
              print("using default credit limit")
          }

          return ImportedAccount(
              id: id,
              nickname: nickname,
              creditLimit: creditLimit < 0 ? nil : creditLimit
          )
      }
    lang: swift
    issues:
      - line: 8
        kind: correctness
        note: { en: 'Two force unwraps trap for a missing or malformed id, and the code never rejects zero or a negative id.', zh: '两次强制解包会因id缺失或格式错误触发运行时错误，而且代码没有拒绝零或负数id。' }
      - line: 9
        kind: edge-case
        note: { en: 'Coalescing to an empty string erases the required distinction between an absent nickname and a present empty nickname.', zh: '空合并到空字符串会删除“昵称缺失”与“昵称存在但为空”之间必须保留的区别。' }
      - line: 11
        kind: readability
        note: { en: 'The -1 sentinel makes missing, malformed, and negative limits share one implicit convention across several later lines.', zh: '-1哨兵值让缺失、格式错误与负数额度依赖分散在后续多行中的隐式约定。' }
      - line: 14
        kind: performance
        note: { en: 'The code parses rawLimit again after already computing creditLimit; parse once, retain the optional result, and validate it.', zh: '代码已经算出creditLimit，却再次解析rawLimit；应只解析一次，保留可选结果后再验证。' }
    right: { en: 'The generated code gives the imported value a typed structure and keeps all field conversion inside one boundary function.', zh: '生成代码为导入结果使用了带类型的结构体，并把字段转换集中在一个边界函数中。' }
    checklist:
      - { en: 'Exercise missing, malformed, zero, negative, and valid identifiers.', zh: '覆盖缺失、格式错误、零、负数与有效标识符。' }
      - { en: 'Keep absent and explicitly empty optional text distinct.', zh: '区分缺失文本与显式空文本。' }
      - { en: 'Parse each field once and validate every nil source separately.', zh: '每个字段只解析一次，并分别验证每个nil来源。' }
      - { en: 'Reject malformed domain data instead of replacing it with a sentinel.', zh: '拒绝格式错误的领域数据，不要用哨兵值替换。' }
    explanation: { en: 'Use guarded parsing for a positive id, assign fields["nickname"] directly, and branch on whether creditLimit is absent or parses to a nonnegative integer.', zh: '应通过guard解析正整数id，直接保存fields["nickname"]，并分别处理creditLimit缺失与解析为非负整数的情况。' }
    difficulty: advanced
    minutes: 8
    tags: [code-review, force-unwrapping, nil-coalescing, validation]
