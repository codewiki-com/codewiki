topic: swift/error-handling
items:
  - id: predict-specific-catch
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      enum LoadError: Error {
          case missing(Int)
      }

      func load(id: Int) throws -> String {
          guard id > 0 else { throw LoadError.missing(id) }
          return "order-\(id)"
      }

      for id in [4, 0] {
          do {
              print(try load(id: id))
          } catch LoadError.missing(let value) {
              print("missing: \(value)")
          } catch {
              print("other")
          }
      }
    lang: swift
    options:
      - { text: { en: "order-4\nmissing: 0", zh: "order-4\nmissing: 0" }, correct: true }
      - { text: { en: "order-4\nother", zh: "order-4\nother" }, correct: false }
      - { text: { en: 'The program stops after printing order-4.', zh: '程序输出 order-4 后就终止。' }, correct: false }
    explanation: { en: 'The first call returns normally. The second throws LoadError.missing, whose associated value is bound by the first matching catch.', zh: '第一次调用正常返回。第二次调用抛出 LoadError.missing，其关联值由第一个匹配的 catch 绑定。' }
    difficulty: beginner
    tags: [do-catch, associated-value, predict-output]

  - id: choose-try-optional
    type: mcq
    prompt: { en: 'When is try? the most accurate API choice?', zh: '什么情况下使用 try? 最能准确表达 API 语义？' }
    options:
      - { text: { en: 'Failure and ordinary absence intentionally have the same meaning, and no recovery needs the cause.', zh: '失败与正常缺失有意采用相同语义，而且任何恢复动作都不需要错误原因。' }, correct: true }
      - { text: { en: 'A decoding failure should be logged later with its exact coding path.', zh: '之后需要用准确编码路径记录解码失败。' }, correct: false }
      - { text: { en: 'A disk write must either finish or tell the caller why it failed.', zh: '磁盘写入必须完成，否则要告诉调用方失败原因。' }, correct: false }
    explanation: { en: 'try? maps every thrown error to nil, so it fits only when that information loss is part of the contract. Diagnostic or recoverable failures need try and an error boundary.', zh: 'try? 会把所有抛出的错误映射为 nil，因此只适合这种信息丢失本来就是契约的一部分。需要诊断或恢复的失败应使用 try 与错误边界。' }
    difficulty: beginner
    tags: [try-optional, optional, information-loss]

  - id: spot-false-success
    title: { en: 'Spot the bug in the profile fallback', zh: '找出资料回退里的 bug' }
    type: spotbug
    prompt: { en: 'Find why this function can report a successful guest profile after an account load failed.', zh: '找出账户加载失败后，这个函数为何仍会报告成功的访客资料。' }
    code: |
      func displayProfile(id: Int) -> String {
          do {
              return try loadProfile(id: id)
          } catch {
              print("profile load failed: \(error)")
              return "Guest"
          }
      }
    lang: swift
    issues:
      - line: 6
        kind: correctness
        note: { en: 'The broad catch converts every failure into a normal Guest result, so callers cannot distinguish an allowed missing profile from permission, corruption, or transport failure.', zh: '宽泛 catch 把所有失败都转换成正常的 Guest 结果，调用方无法区分允许的资料缺失、权限错误、数据损坏或传输失败。' }
    explanation: { en: 'Recover only a documented missing-profile case as Guest, and propagate or translate other errors. Logging does not make the returned fallback truthful.', zh: '只有文档明确允许的资料缺失才能恢复为 Guest，其他错误应传播或转换。仅仅记录日志并不能让后备返回值变得真实。' }
    difficulty: intermediate
    tags: [broad-catch, fallback, error-propagation]

  - id: choose-typed-throws
    type: mcq
    prompt: { en: 'What guarantee does throws(ParseError) add to a function declaration?', zh: '函数声明中的 throws(ParseError) 增加了什么保证？' }
    options:
      - { text: { en: 'The function can propagate only ParseError, and the concrete failure type is part of its function type.', zh: '函数只能传播 ParseError，而且具体失败类型属于函数类型的一部分。' }, correct: true }
      - { text: { en: 'Every ParseError is caught automatically at the call site.', zh: '每个 ParseError 都会在调用点被自动捕获。' }, correct: false }
      - { text: { en: 'The function can return ParseError without using throw.', zh: '函数可以不使用 throw 就返回 ParseError。' }, correct: false }
      - { text: { en: 'The runtime retries ParseError once before propagation.', zh: '运行时会在传播 ParseError 前自动重试一次。' }, correct: false }
    explanation: { en: 'Typed throws constrains and preserves the failure type; callers still choose whether to catch or propagate it. It adds no automatic recovery behavior.', zh: '类型化 throws 会约束并保留失败类型；调用方仍需选择捕获或传播。它不会添加任何自动恢复行为。' }
    difficulty: intermediate
    tags: [typed-throws, function-type, api-contract]

  - id: review-generated-order-import
    title: { en: 'Review generated order importer', zh: '审查生成的订单导入器' }
    type: review
    prompt: { en: 'Review this generated order importer against its transaction and data-handling contract.', zh: '根据事务与数据处理契约审查这段生成的订单导入代码。' }
    task: { en: 'Import CSV rows atomically. Reject malformed rows and invalid amounts with a useful category, propagate persistence failure, and never log complete customer rows.', zh: '以原子方式导入 CSV 行：用有用的类别拒绝格式错误与金额无效的行；传播持久化失败；绝不记录完整客户数据行。' }
    code: |
      enum ImportError: Error {
          case malformedRow(Int)
          case invalidAmount(Int)
      }

      struct ImportSummary { let imported: Int }

      func importOrders(_ lines: [String]) throws -> ImportSummary {
          var imported = 0
          for (index, line) in lines.enumerated() {
              do {
                  let fields = line.split(separator: ",")
                  let amount = try parseAmount(String(fields[1]))
                  try? saveOrder(email: String(fields[0]), amount: amount)
                  imported += 1
              } catch {
                  print("bad row \(index): \(line), \(error)")
                  continue
              }
          }
          return ImportSummary(imported: imported)
      }
    lang: swift
    issues:
      - line: 13
        kind: edge-case
        note: { en: 'Indexing fields[1] before checking the field count traps on an empty or one-column row instead of throwing malformedRow.', zh: '在检查字段数量前访问 fields[1]，会让空行或单列行触发运行时错误，而不是抛出 malformedRow。' }
      - line: 15
        kind: correctness
        note: { en: 'try? discards persistence failure, yet imported is incremented, so the summary can claim an order was saved when it was not.', zh: 'try? 丢弃持久化失败，随后 imported 仍然增加，因此汇总可能声称订单已保存，实际却没有。' }
      - line: 18
        kind: security
        note: { en: 'The log emits the complete CSV row, which can expose customer email and other unapproved fields.', zh: '日志输出完整 CSV 行，可能泄露客户邮箱以及其他未经批准的字段。' }
      - line: 17
        kind: readability
        note: { en: 'One broad catch plus continue hides which failures are intentionally recoverable and makes the all-or-nothing contract impossible to see.', zh: '一个宽泛 catch 加 continue 掩盖了哪些失败可以恢复，也让全有或全无契约无法从代码中看出。' }
    right: { en: 'The generated code defines domain error cases, keeps parsing and saving in one import function, and returns an explicit summary type.', zh: '生成代码定义了领域错误 case，把解析与保存集中在一个导入函数中，并返回明确的汇总类型。' }
    checklist:
      - { en: 'Test empty, short, extra-column, and invalid-amount rows without subscripting traps.', zh: '测试空行、字段不足、多余字段和金额无效的行，确认不会发生下标越界。' }
      - { en: 'Inject save failure after earlier rows and inspect whether the transaction rolls back.', zh: '在前面已有成功行后注入保存失败，检查事务是否回滚。' }
      - { en: 'Verify that every failure remains observable to the caller with a useful category.', zh: '确认每种失败都以有用类别对调用方可见。' }
      - { en: 'Inspect logs for raw rows, emails, and arbitrary error descriptions.', zh: '检查日志中是否出现原始数据行、邮箱和任意错误描述。' }
    explanation: { en: 'Validate shape before indexing, preserve parse and persistence failures, commit atomically, and log only approved metadata. Continuing after every error contradicts the stated transaction contract.', zh: '应在访问下标前校验结构，保留解析与持久化失败，以原子方式提交，并且只记录获准元数据。遇到所有错误都继续执行，与既定事务契约相矛盾。' }
    difficulty: advanced
    tags: [code-review, transaction, error-propagation, logging]
