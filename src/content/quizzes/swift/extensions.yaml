topic: swift/extensions
items:
  - id: predict-protocol-extension-dispatch
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      protocol Named {
          func requiredLabel() -> String
      }

      extension Named {
          func requiredLabel() -> String { "default requirement" }
          func extraLabel() -> String { "default extra" }
      }

      struct Record: Named {
          func requiredLabel() -> String { "record requirement" }
          func extraLabel() -> String { "record extra" }
      }

      let value: any Named = Record()
      print(value.requiredLabel())
      print(value.extraLabel())
    lang: swift
    options:
      - { text: { en: "record requirement\ndefault extra", zh: "record requirement\ndefault extra" }, correct: true }
      - { text: { en: "record requirement\nrecord extra", zh: "record requirement\nrecord extra" }, correct: false }
      - { text: { en: "default requirement\ndefault extra", zh: "default requirement\ndefault extra" }, correct: false }
      - { text: { en: "default requirement\nrecord extra", zh: "default requirement\nrecord extra" }, correct: false }
    explanation: { en: 'requiredLabel() is a protocol requirement, so Record supplies its witness. extraLabel() exists only in the extension and is selected from the existential value’s static type.', zh: 'requiredLabel() 是协议要求，因此由Record提供见证；extraLabel() 只存在于扩展中，会根据存在类型值的静态类型选择。' }
    difficulty: intermediate
    tags: [protocol-extension, static-dispatch, predict-output]

  - id: extension-capability-boundary
    type: mcq
    prompt: { en: 'Which declaration can a Swift extension validly add?', zh: 'Swift扩展可以合法添加哪种声明？' }
    options:
      - { text: { en: 'A computed instance property derived from existing state.', zh: '从现有状态派生的计算实例属性。' }, correct: true }
      - { text: { en: 'A stored instance property with a default value.', zh: '带默认值的存储实例属性。' }, correct: false }
      - { text: { en: 'A designated initializer to an existing class.', zh: '为现有类添加指定构造器。' }, correct: false }
      - { text: { en: 'An override of an existing class method.', zh: '覆盖类中已有的方法。' }, correct: false }
    explanation: { en: 'Extensions can add computed properties, methods, convenience initializers for classes, subscripts, nested types, and conformances. They cannot change stored layout or override existing behavior.', zh: '扩展可以添加计算属性、方法、类的便利构造器、下标、嵌套类型与协议遵循，但不能改变存储布局或覆盖已有行为。' }
    difficulty: beginner
    tags: [computed-property, storage, initializer]

  - id: spot-collection-index-type
    title: { en: 'Spot the bug in the safe subscript', zh: '找出安全下标里的bug' }
    type: spotbug
    prompt: { en: 'Find why this supposedly generic safe subscript does not compile for Collection.', zh: '找出这个所谓通用的安全下标为何无法用于Collection。' }
    code: |
      extension Collection {
          subscript(safe index: Int) -> Element? {
              indices.contains(index) ? self[index] : nil
          }
      }
    lang: swift
    issues:
      - line: 2
        kind: correctness
        note: { en: 'Collection.Index is not necessarily Int. The parameter must be Index for indices.contains(index) and self[index] to use the collection’s actual index type.', zh: 'Collection.Index不一定是Int。参数必须使用Index，indices.contains(index) 与self[index] 才会采用集合真实的索引类型。' }
    explanation: { en: 'Declare subscript(safe index: Index) instead. If an API specifically accepts integer offsets, name them as offsets and advance from startIndex with a documented complexity cost.', zh: '应改为subscript(safe index: Index)。如果API确实接收整数偏移，应把参数命名为offset，并从startIndex前进，同时说明复杂度成本。' }
    difficulty: intermediate
    tags: [collection-index, generic-extension, compiler-error]

  - id: retroactive-conformance-meaning
    type: mcq
    prompt: { en: 'What does @retroactive mean on a Swift protocol conformance?', zh: 'Swift协议遵循上的 @retroactive表示什么？' }
    options:
      - { text: { en: 'The module acknowledges that it owns neither the type nor protocol and accepts the conformance-conflict risk.', zh: '当前模块确认类型与协议都不归自己所有，并接受遵循冲突风险。' }, correct: true }
      - { text: { en: 'The conformance is visible only inside the declaring source file.', zh: '该遵循只在声明它的源文件内可见。' }, correct: false }
      - { text: { en: 'The runtime dynamically removes the conformance if an upstream module adds one.', zh: '如果上游模块新增遵循，运行时会动态移除当前遵循。' }, correct: false }
      - { text: { en: 'The compiler gives this conformance priority over all other implementations.', zh: '编译器会让该遵循优先于其他所有实现。' }, correct: false }
    explanation: { en: '@retroactive acknowledges and silences the Swift 6 warning; it does not namespace, prioritize, or make the conformance local, so future duplicate conformances remain a design risk.', zh: '@retroactive表示接受并消除Swift 6警告，但不会提供命名空间、优先级或局部可见性，因此未来的重复遵循仍是设计风险。' }
    difficulty: advanced
    tags: [retroactive-conformance, module-ownership, library-evolution]

  - id: review-generated-customer-extensions
    title: { en: 'Review generated customer extensions', zh: '审查生成的客户扩展' }
    type: review
    prompt: { en: 'Review these generated collection extensions against the stated task.', zh: '根据任务要求审查这段生成的集合扩展。' }
    task: { en: 'Add reusable customer-list operations that preserve first-seen order, return nil for an invalid index, avoid exposing email addresses, and remain efficient for large duplicate-heavy lists.', zh: '添加可复用的客户列表操作：保留首次出现顺序；索引无效时返回nil；不暴露邮箱地址；在含大量重复项的长列表中保持高效。' }
    code: |
      struct Customer {
          let id: Int
          let email: String
      }
      extension Array where Element == Customer {
          var cachedUnique: [Customer] = []
          func customer(at index: Int) -> Customer? {
              self[index]
          }
          func uniqueCustomers() -> [Customer] {
              var result: [Customer] = []
              for customer in self {
                  if !result.contains(where: { $0.id == customer.id }) {
                      result.append(customer)
                  }
              }
              return result
          }
          func debugDump() {
              for customer in self {
                  print(customer.email)
              }
          }
      }
    lang: swift
    issues:
      - line: 6
        kind: correctness
        note: { en: 'An extension cannot add the stored cachedUnique property, so the generated code does not compile.', zh: '扩展不能添加存储属性cachedUnique，因此生成代码无法编译。' }
      - line: 8
        kind: edge-case
        note: { en: 'Direct subscripting traps for a negative or out-of-range index instead of returning nil as the task requires.', zh: '负数或越界索引会让直接下标访问触发运行时错误，而不是按任务要求返回nil。' }
      - line: 13
        kind: performance
        note: { en: 'Scanning result for every customer makes deduplication quadratic on duplicate-heavy input; track seen IDs in a Set while appending first occurrences.', zh: '为每个客户扫描result，会让大量重复输入下的去重变成二次复杂度；应在追加首次出现项时用Set记录已见ID。' }
      - line: 20
        kind: security
        note: { en: 'Printing every raw email address exposes customer data and violates the logging requirement.', zh: '打印每个原始邮箱地址会暴露客户数据，并违反日志要求。' }
    right: { en: 'The code constrains the extension to customer arrays, uses customer IDs as the deduplication key, and preserves first-seen order in its ordinary result path.', zh: '代码把扩展限制在客户数组上，使用客户ID作为去重键，并在普通结果路径中保留首次出现顺序。' }
    checklist:
      - { en: 'Compile the extension and reject any declaration that attempts to add stored layout.', zh: '编译扩展，并拒绝任何试图添加存储布局的声明。' }
      - { en: 'Test indexes -1, 0, count - 1, and count on empty and nonempty arrays.', zh: '分别在空数组和非空数组上测试 -1、0、count - 1与count。' }
      - { en: 'Count comparisons on a large duplicate-heavy list and verify stable first-seen ordering.', zh: '统计大量重复项下的比较次数，并验证首次出现顺序稳定。' }
      - { en: 'Capture logs and confirm that raw email addresses and other customer fields are absent.', zh: '捕获日志，确认其中没有原始邮箱地址或其他客户字段。' }
    explanation: { en: 'Remove the invalid stored property, validate indexes with indices.contains, keep a local Set<Int> of seen IDs, and emit only approved aggregate diagnostics rather than customer data.', zh: '应删除无效存储属性，用indices.contains校验索引，以局部Set<Int>记录已见ID，并且只输出获准的聚合诊断信息，不记录客户数据。' }
    difficulty: advanced
    tags: [code-review, stored-property, bounds-checking, privacy, performance]
