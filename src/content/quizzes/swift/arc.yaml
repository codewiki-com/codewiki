topic: swift/arc
items:
  - id: predict-last-strong-reference
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      final class Token {
          let id: String

          init(id: String) {
              self.id = id
              print("created", id)
          }

          deinit {
              print("released", id)
          }
      }

      var primary: Token? = Token(id: "T1")
      var backup = primary
      primary = nil
      print(backup?.id ?? "none")
      backup = nil
    lang: swift
    options:
      - text:
          en: "created T1\nreleased T1\nT1"
          zh: "created T1\nreleased T1\nT1"
        correct: false
      - text:
          en: "created T1\nT1\nreleased T1"
          zh: "created T1\nT1\nreleased T1"
        correct: true
      - text:
          en: "created T1\nnone\nreleased T1"
          zh: "created T1\nnone\nreleased T1"
        correct: false
    explanation: { en: 'backup remains a strong reference after primary becomes nil. Token is deallocated only after backup is cleared.', zh: 'primary变为nil后，backup仍是强引用。只有清空backup后，Token才会释放。' }
    difficulty: beginner
    tags: [arc, strong-reference, predict-output]

  - id: arc-scope
    type: mcq
    prompt: { en: 'Which statement about the scope of ARC is accurate?', zh: '关于ARC的作用范围，哪项说法准确？' }
    options:
      - { text: { en: 'ARC reference-counts class instances; value types follow value semantics even when they contain references.', zh: 'ARC对类实例进行引用计数；值类型遵循值语义，即使内部包含引用。' }, correct: true }
      - { text: { en: 'ARC reference-counts every struct value separately.', zh: 'ARC会分别对每个结构体值进行引用计数。' }, correct: false }
      - { text: { en: 'ARC finds and collects every unreachable strong-reference cycle.', zh: 'ARC会找到并回收所有不可达的强引用循环。' }, correct: false }
    explanation: { en: 'Reference counting applies to class instances. Structures and enumerations are values, although a value can contain a reference that affects a class instance lifetime.', zh: '引用计数适用于类实例。结构体和枚举是值，但值可以包含引用，从而影响类实例的生命周期。' }
    difficulty: beginner
    tags: [arc, value-semantics]

  - id: choose-weak-or-unowned
    type: mcq
    prompt: { en: 'A cached child may outlive its parent, and callers can handle a missing parent. Which declaration best models the back-reference?', zh: '缓存中的子对象可能比父对象活得更久，而且调用方能处理父对象缺失。哪种声明最适合这个回指？' }
    options:
      - { text: { en: 'weak var parent: Parent?', zh: 'weak var parent: Parent?' }, correct: true }
      - { text: { en: 'unowned let parent: Parent', zh: 'unowned let parent: Parent' }, correct: false }
      - { text: { en: 'var parent: Parent', zh: 'var parent: Parent' }, correct: false }
    explanation: { en: 'The parent is allowed to disappear first, so the reference must not own it and must represent absence. weak provides both behaviors.', zh: '父对象可以先消失，因此该引用不能拥有父对象，还必须能表示缺失；weak同时提供这两种语义。' }
    difficulty: intermediate
    tags: [weak-reference, unowned-reference, lifetime]

  - id: spot-object-cycle
    title: { en: 'Spot the bug in the object cycle', zh: '找出对象循环引用里的bug' }
    type: spotbug
    prompt: { en: 'Find why neither deinitializer runs after the local variables are cleared.', zh: '找出清空局部变量后两个析构器都不运行的原因。' }
    code: |
      final class Playlist {
          var current: Song?
          deinit { print("playlist released") }
      }

      final class Song {
          var playlist: Playlist?
          deinit { print("song released") }
      }

      var playlist: Playlist? = Playlist()
      var song: Song? = Song()
      playlist?.current = song
      song?.playlist = playlist
      playlist = nil
      song = nil
    lang: swift
    issues:
      - line: 7
        kind: correctness
        note: { en: 'Song.playlist is strong while Playlist.current is also strong, so the two property edges form a cycle.', zh: 'Song.playlist与Playlist.current都是强引用，两条属性边因此形成循环。' }
    explanation: { en: 'Make the nonowning back-reference weak, for example weak var playlist: Playlist?. Then clearing the external references can release both instances.', zh: '把非所有权回指改为弱引用，例如weak var playlist: Playlist?。这样清空外部引用后，两个实例都能释放。' }
    difficulty: intermediate
    tags: [strong-reference-cycle, weak-reference, code-review]

  - id: predict-zeroing-weak
    type: predict
    prompt: { en: 'What two Boolean values does this program print?', zh: '这段程序会输出哪两个布尔值？' }
    code: |
      final class Owner {}

      final class Worker {
          weak var owner: Owner?
      }

      var owner: Owner? = Owner()
      let worker = Worker()
      worker.owner = owner

      print(worker.owner == nil)
      owner = nil
      print(worker.owner == nil)
    lang: swift
    options:
      - { text: { en: "false\ntrue", zh: "false\ntrue" }, correct: true }
      - { text: { en: "false\nfalse", zh: "false\nfalse" }, correct: false }
      - { text: { en: "true\ntrue", zh: "true\ntrue" }, correct: false }
    explanation: { en: 'The initial strong owner variable keeps the instance alive. Clearing it deallocates the instance, and ARC zeroes worker.owner.', zh: '起初，强引用变量owner让实例存活。清空它后实例释放，ARC会把worker.owner自动置为nil。' }
    difficulty: intermediate
    tags: [weak-reference, zeroing-weak, predict-output]

  - id: review-generated-dashboard-binding
    title: { en: 'Review generated dashboard binding', zh: '审查生成的仪表板绑定' }
    type: review
    prompt: { en: 'Review this generated dashboard binding for lifetime safety and repeatable rebinding.', zh: '审查这段生成的仪表盘绑定代码，检查生命周期安全以及重复绑定行为。' }
    task: { en: 'Bind a controller to a data source. Refreshing must stop safely when either object is released, rebinding must detach the old source, and the relationship must not form a cycle.', zh: '把控制器绑定到数据源。任一对象释放后都应安全停止刷新；重新绑定必须断开旧数据源，而且对象关系不能成环。' }
    code: |
      final class DataSource {
          var onChange: (() -> Void)?
          func load() -> [String] { ["open", "closed"] }
      }

      final class DashboardController {
          var rows: [String] = []
          var refreshHandler: (() -> Void)?

          func bind(to source: DataSource) {
              refreshHandler = { [unowned self] in
                  self.rows = source.load()
                  print("rows", self.rows.count)
              }
              source.onChange = self.refresh
          }

          func refresh() {
              refreshHandler?()
          }
      }
    lang: swift
    issues:
      - line: 11
        kind: correctness
        note: { en: 'unowned self can trap if an external owner copies refreshHandler and invokes it after the controller is released.', zh: '如果外部复制refreshHandler，并在控制器释放后调用它，unowned self会触发运行时错误。' }
      - line: 12
        kind: performance
        note: { en: 'The stored refreshHandler strongly captures source, extending the data source lifetime even though the task says refreshing should stop when it is released.', zh: '存储的refreshHandler强捕获source，会延长数据源生命周期，不符合“数据源释放后停止刷新”的任务要求。' }
      - line: 15
        kind: edge-case
        note: { en: 'The bound method strongly captures the controller, and rebinding never clears the previous source onChange; an old source can retain the controller and close a cycle.', zh: '绑定方法会强捕获控制器，而且重新绑定不会清空旧数据源的onChange；旧数据源可能继续持有控制器并闭合引用循环。' }
    right: { en: 'The code gives the callback a clear name, keeps refresh logic in one method, and replaces refreshHandler instead of appending handlers without a bound.', zh: '代码为回调使用了明确名称，把刷新逻辑集中在一个方法中，并且替换refreshHandler，而不是无限追加处理器。' }
    checklist:
      - { en: 'Draw both directions of storage, including bound method references.', zh: '画出两个方向的存储关系，包括绑定方法引用。' }
      - { en: 'Retain a callback externally, release each object in turn, and invoke it.', zh: '在外部保留回调，依次释放每个对象，再调用回调。' }
      - { en: 'Bind to a second source and verify the first source no longer retains a callback.', zh: '绑定第二个数据源，确认第一个数据源不再保留回调。' }
      - { en: 'Exercise normal completion, failure, and cancellation cleanup.', zh: '覆盖正常完成、失败和取消时的清理。' }
    explanation: { en: 'Use weak captures for both objects when disappearance should stop work, and return or store a cancellation handle that clears the previous source callback before rebinding.', zh: '当任一对象消失都应停止工作时，应对两者使用弱捕获；同时返回或保存取消句柄，在重新绑定前清空旧数据源的回调。' }
    difficulty: advanced
    tags: [code-review, capture-list, rebinding, ownership-graph]
