topic: swift/property-wrappers
items:
  - id: predict-clamped-initial-and-set
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      @propertyWrapper
      struct Clamped {
          private var value: Int
          let range: ClosedRange<Int>

          var wrappedValue: Int {
              get { value }
              set {
                  value = min(max(newValue, range.lowerBound), range.upperBound)
              }
          }

          init(wrappedValue: Int, _ range: ClosedRange<Int>) {
              self.range = range
              self.value = min(max(wrappedValue, range.lowerBound), range.upperBound)
          }
      }

      struct Player {
          @Clamped(0...100) var health = 120
      }

      var player = Player()
      print(player.health)
      player.health = -5
      print(player.health)
    lang: swift
    options:
      - { text: { en: "100\n0", zh: "100\n0" }, correct: true }
      - { text: { en: "120\n-5", zh: "120\n-5" }, correct: false }
      - { text: { en: "120\n0", zh: "120\n0" }, correct: false }
      - { text: { en: "100\n-5", zh: "100\n-5" }, correct: false }
    explanation: { en: 'The declaration value goes through init(wrappedValue:_:), and later assignment goes through the wrappedValue setter, so both values are clamped.', zh: '声明处的值经过init(wrappedValue:_:)；后续赋值经过wrappedValue setter，因此两个值都会被限制到范围内。' }
    difficulty: beginner
    tags: [initialization, wrapped-value, predict-output]

  - id: synthesized-name-mapping
    type: mcq
    prompt: { en: 'For @Rule var score: Int, which synthesized-name description is accurate?', zh: '对于 @Rule var score: Int，哪项合成名称说明准确？' }
    options:
      - { text: { en: 'score exposes wrappedValue, _score stores the wrapper privately, and $score exists only when Rule defines projectedValue.', zh: 'score暴露wrappedValue，_score私有保存包装器；只有Rule定义projectedValue时才有 $score。' }, correct: true }
      - { text: { en: 'score stores Rule, _score stores Int, and $score is always a Binding<Int>.', zh: 'score保存Rule，_score保存Int，而且 $score总是Binding<Int>。' }, correct: false }
      - { text: { en: '_score and $score are both public aliases for the wrapper instance.', zh: '_score与 $score都是包装器实例的公开别名。' }, correct: false }
    explanation: { en: 'The compiler synthesizes private backing storage and wrapped accessors. Projection is optional, and its type is selected by the wrapper.', zh: '编译器会合成私有后备存储与包装访问器。投影是可选能力，其类型由包装器决定。' }
    difficulty: beginner
    tags: [backing-storage, projected-value, compiler-synthesis]

  - id: spot-nonatomic-increment
    title: { en: 'Spot the bug in Atomic increment', zh: '找出Atomic自增里的bug' }
    type: spotbug
    prompt: { en: 'Find why this wrapper does not make increment() atomic.', zh: '找出这个包装器为什么不能让increment() 成为原子操作。' }
    code: |
      @propertyWrapper
      final class Atomic<Value> {
          private var value: Value
          private let lock = NSLock()

          var wrappedValue: Value {
              get { lock.withLock { value } }
              set { lock.withLock { value = newValue } }
          }

          init(wrappedValue: Value) { value = wrappedValue }
      }

      final class Counter {
          @Atomic var count = 0

          func increment() {
              count += 1
          }
      }
    lang: swift
    issues:
      - line: 18
        kind: correctness
        note: { en: 'The compound assignment performs a locked read and a separate locked write, so concurrent increments can overwrite one another.', zh: '复合赋值会先执行一次加锁读取，再执行另一次加锁写入；并发递增可能互相覆盖。' }
    explanation: { en: 'Expose one operation that holds the lock across the complete read-modify-write, or isolate the counter in an actor. Accessor-level locking is not transaction-level locking.', zh: '应公开一个在完整读改写期间持锁的操作，或把计数器隔离在actor中。访问器级加锁不等于事务级加锁。' }
    difficulty: intermediate
    tags: [concurrency, atomicity, read-modify-write]

  - id: observers-and-isolation
    type: mcq
    prompt: { en: 'Which statement is correct in Swift 6 language mode?', zh: '在Swift 6语言模式中，哪项说法正确？' }
    options:
      - { text: { en: 'A wrapped property may have willSet or didSet, but cannot define its own get or set, and a global-actor wrappedValue does not isolate the whole enclosing type by outward inference.', zh: '被包装属性可以有willSet或didSet，但不能自定义get或set；带全局actor的wrappedValue不会通过向外推断隔离整个外围类型。' }, correct: true }
      - { text: { en: 'A wrapped property cannot have observers, and @MainActor on wrappedValue always isolates the enclosing type.', zh: '被包装属性不能有观察器，而且wrappedValue上的 @MainActor总会隔离外围类型。' }, correct: false }
      - { text: { en: 'A wrapped property may replace the synthesized getter, but only inside a structure.', zh: '被包装属性可以替换合成getter，但只能在结构体中这样做。' }, correct: false }
    explanation: { en: 'Observers can accompany a wrapped property, while explicit get and set cannot. SE-0401 removed property-wrapper-based outward actor isolation inference in Swift 6 mode.', zh: '被包装属性可以带观察器，但不能显式声明get或set。SE-0401在Swift 6模式中移除了由属性包装器触发的actor隔离向外推断。' }
    difficulty: advanced
    tags: [property-observer, actor-isolation, swift-6]

  - id: review-generated-json-setting
    type: review
    title: { en: 'Review a generated JSON setting wrapper', zh: '审查生成的JSON设置包装器' }
    prompt: { en: 'Review this generated property wrapper against the task.', zh: '根据任务审查这个生成的属性包装器。' }
    task: { en: 'Persist Codable settings without leaking secrets, distinguish missing data from corrupt data, preserve the last good value when encoding fails, and avoid repeated decoding on unchanged reads.', zh: '持久化Codable设置，不泄露秘密；区分缺失与损坏数据；编码失败时保留最后的有效值；未变化的重复读取不反复解码。' }
    code: |
      import Foundation
      @propertyWrapper
      struct JSONSetting<Value: Codable> {
          let key: String
          let defaultValue: Value

          var wrappedValue: Value {
              get {
                  guard let data = UserDefaults.standard.data(forKey: key) else { return defaultValue }
                  return (try? JSONDecoder().decode(Value.self, from: data)) ?? defaultValue
              }
              set {
                  let data = try? JSONEncoder().encode(newValue)
                  print("saving \(key): \(newValue)")
                  UserDefaults.standard.set(data, forKey: key)
              }
          }

          init(wrappedValue: Value, _ key: String) {
              self.key = key
              self.defaultValue = wrappedValue
          }
      }
    lang: swift
    issues:
      - line: 10
        kind: edge-case
        note: { en: 'A corrupt or incompatible payload is collapsed into the same default as a missing key, so migration and damage are invisible.', zh: '损坏或不兼容的数据与缺失键都被折叠成同一默认值，迁移问题与数据损坏无法观察。' }
      - line: 10
        kind: performance
        note: { en: 'Every read constructs a decoder and decodes the same unchanged payload again; the requested wrapper needs an explicit cache and invalidation policy.', zh: '每次读取都会创建解码器并重新解码同一份未变化数据；任务要求包装器具备明确的缓存与失效策略。' }
      - line: 13
        kind: correctness
        note: { en: 'try? turns an encoding failure into nil, and setting nil can remove the previous stored value instead of preserving the last good data.', zh: 'try? 会把编码失败变成nil，写入nil可能删除先前存储值，而不是保留最后的有效数据。' }
      - line: 14
        kind: security
        note: { en: 'Logging the generic value can disclose tokens, personal data, or other secrets stored through this wrapper.', zh: '记录泛型值可能泄露通过此包装器保存的令牌、个人数据或其他秘密。' }
    right: { en: 'The generated code keeps the key and default explicit, constrains values to Codable, and uses Data rather than assuming every value is a native property-list type.', zh: '生成代码显式保存键与默认值，把值约束为Codable，并使用Data，而没有假定每种值都是属性列表原生类型。' }
    checklist:
      - { en: 'Test missing, corrupt, old-schema, valid, and encoder-failure paths independently.', zh: '分别测试缺失、损坏、旧模式、有效数据与编码器失败路径。' }
      - { en: 'Inspect logs, errors, and projections for secrets or personal data.', zh: '检查日志、错误与投影是否含有秘密或个人数据。' }
      - { en: 'Verify that failed writes leave the last successfully stored bytes intact.', zh: '验证写入失败后，最后一次成功保存的字节仍保持不变。' }
      - { en: 'Count decodes across repeated reads and define when cached state is invalidated.', zh: '统计重复读取期间的解码次数，并定义缓存状态何时失效。' }
    explanation: { en: 'A production wrapper needs explicit error and cache behavior. Decode failures should be distinguishable, encode before replacing stored data, and never log an unconstrained setting value.', zh: '生产包装器需要明确的错误与缓存行为。解码失败应可区分；替换存储数据前应先成功编码；任何未受约束的设置值都不应直接写入日志。' }
    difficulty: advanced
    tags: [code-review, persistence, security, error-handling]
