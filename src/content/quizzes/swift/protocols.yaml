topic: swift/protocols
items:
  - id: predict-extension-dispatch
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      protocol Labeled {}

      extension Labeled {
          func label() -> String { "default" }
      }

      struct Job: Labeled {
          func label() -> String { "job" }
      }

      let concrete = Job()
      let erased: any Labeled = concrete
      print(concrete.label())
      print(erased.label())
    lang: swift
    options:
      - { text: { en: "job\ndefault", zh: "job\ndefault" }, correct: true }
      - { text: { en: "job\njob", zh: "job\njob" }, correct: false }
      - { text: { en: "default\ndefault", zh: "default\ndefault" }, correct: false }
      - { text: { en: 'The program does not compile.', zh: '程序无法编译。' }, correct: false }
    explanation: { en: 'label() is not a protocol requirement, so the concrete call sees Job.label() while the existential call selects the extension member from its static interface.', zh: 'label() 不是协议要求，因此具体类型调用使用Job.label()，存在类型调用则从静态接口选择扩展成员。' }
    difficulty: intermediate
    tags: [protocol-extension, static-dispatch, predict-output]

  - id: choose-some-any-generic
    type: mcq
    prompt: { en: 'Which boundary should hold Circle and Rectangle values in the same array while exposing only Shape requirements?', zh: '哪个边界适合在同一数组中保存Circle与Rectangle，同时只公开Shape要求？' }
    options:
      - { text: { en: '[any Shape]', zh: '[any Shape]' }, correct: true }
      - { text: { en: '[some Shape]', zh: '[some Shape]' }, correct: false }
      - { text: { en: 'Array<T> where T changes for each element', zh: '让T随每个元素变化的Array<T>' }, correct: false }
      - { text: { en: 'Shape.Type', zh: 'Shape.Type' }, correct: false }
    explanation: { en: 'An existential array can box different concrete conformers. A generic or opaque element type represents one fixed underlying type rather than one type per element.', zh: '存在类型数组可以装入不同具体遵循类型；泛型或不透明元素类型表示一个固定底层类型，而不是每个元素各选一种类型。' }
    difficulty: beginner
    tags: [existential-type, heterogeneous-collection, any]

  - id: spot-missing-mutating-requirement
    title: { en: 'Spot the bug in the Incrementable protocol', zh: '找出自增协议里的bug' }
    type: spotbug
    prompt: { en: 'Find why the structure cannot satisfy and implement this state-changing protocol method.', zh: '找出这个结构体为何无法满足并实现协议中的状态修改方法。' }
    code: |
      protocol Incrementable {
          var count: Int { get }
          func increment()
      }

      struct Counter: Incrementable {
          private(set) var count = 0
          func increment() {
              count += 1
          }
      }
    lang: swift
    issues:
      - line: 3
        kind: correctness
        note: { en: 'The requirement must be declared mutating so a value-type conformer is permitted to change self; the structure implementation on line 8 must also use mutating.', zh: '协议要求必须声明为mutating，值类型遵循者才可修改self；第8行的结构体实现也必须使用mutating。' }
    explanation: { en: 'Declare `mutating func increment()` in both the protocol and the structure. Class conformers implement that requirement without the keyword.', zh: '应在协议与结构体中都声明`mutating func increment()`；类遵循者实现该要求时不写这个关键字。' }
    difficulty: beginner
    tags: [mutating, value-type, compiler-error]

  - id: property-access-requirement
    type: mcq
    prompt: { en: 'What does `var token: String { get }` require from a conforming type?', zh: '`var token: String { get }`要求遵循类型提供什么？' }
    options:
      - { text: { en: 'Readable access; the implementation may still be a mutable stored or computed property.', zh: '可读访问；实现仍可以是可变的存储属性或计算属性。' }, correct: true }
      - { text: { en: 'An immutable stored let property only.', zh: '只能是不可变的let存储属性。' }, correct: false }
      - { text: { en: 'A read-write property through every protocol value.', zh: '通过任何协议值都可读写的属性。' }, correct: false }
      - { text: { en: 'A static property on the conforming type.', zh: '遵循类型上的静态属性。' }, correct: false }
    explanation: { en: '`{ get }` states the minimum capability visible to protocol consumers. It does not prescribe storage or forbid the concrete implementation from also supporting writes.', zh: '`{ get }`声明协议使用方可见的最小能力；它不规定存储方式，也不禁止具体实现同时支持写入。' }
    difficulty: beginner
    tags: [property-requirement, get, api-contract]

  - id: review-generated-processor-registry
    type: review
    title: { en: 'Review a generated processor registry', zh: '审查生成的处理器注册表' }
    prompt: { en: 'Review this generated registry against the stated task.', zh: '根据任务要求审查这段生成的注册表。' }
    task: { en: 'Register heterogeneous processors under unique IDs, return missing for unknown IDs, honor each processor’s payload support rule, avoid exposing payloads, and keep repeated lookup average constant time.', zh: '按唯一ID注册异构处理器；未知ID返回missing；遵守每个处理器的载荷支持规则；不泄露载荷；重复查找保持平均常数时间。' }
    code: |
      protocol Processor {
          var id: String { get }
          func process(_ payload: String) -> String
      }
      extension Processor {
          func supports(_ payload: String) -> Bool { true }
      }
      struct JSONProcessor: Processor {
          let id = "json"
          func supports(_ payload: String) -> Bool { payload.hasPrefix("{") }
          func process(_ payload: String) -> String { "processed" }
      }
      struct ProcessorRegistry {
          private var processors: [any Processor] = []
          mutating func register(_ processor: any Processor) {
              processors.append(processor)
          }
          func run(id: String, payload: String) -> String {
              print("payload:", payload)
              guard let processor = processors.first(where: { $0.id == id }) else { return "missing" }
              guard processor.supports(payload) else { return "unsupported" }
              return processor.process(payload)
          }
      }
    lang: swift
    issues:
      - line: 16
        kind: edge-case
        note: { en: 'register allows duplicate IDs, so lookup silently uses whichever matching processor was inserted first instead of enforcing uniqueness.', zh: 'register允许重复ID，因此查找会静默使用最先插入的匹配处理器，而没有强制唯一性。' }
      - line: 19
        kind: security
        note: { en: 'Logging the raw payload can disclose credentials, personal data, or document contents; diagnostics should use approved metadata only.', zh: '记录原始载荷可能泄露凭据、个人数据或文档内容；诊断信息只能使用获准的元数据。' }
      - line: 20
        kind: performance
        note: { en: 'Scanning the array makes every repeated ID lookup linear; index processors in a dictionary after validating uniqueness.', zh: '扫描数组会让每次重复ID查找都是线性时间；应在验证唯一性后用字典建立索引。' }
      - line: 21
        kind: correctness
        note: { en: 'supports is extension-only, so calling through any Processor selects the always-true default instead of JSONProcessor.supports(_:) for invalid payloads.', zh: 'supports只存在于扩展中，因此通过any Processor调用时会选择恒为true的默认实现，而不是对无效载荷调用JSONProcessor.supports(_:)。' }
    right: { en: 'The code defines a narrow processing requirement, supports heterogeneous storage explicitly with any Processor, keeps the processor list private, and handles an unknown ID without trapping.', zh: '代码定义了窄小的处理要求，明确用any Processor支持异构存储，保持处理器列表私有，并且遇到未知ID时不会触发运行时错误。' }
    checklist:
      - { en: 'Register the same ID twice and verify that the API rejects or deliberately replaces it.', zh: '用同一ID注册两次，验证API会拒绝或有意替换。' }
      - { en: 'Call support checks through both JSONProcessor and any Processor with valid and invalid payloads.', zh: '分别通过JSONProcessor与any Processor对有效和无效载荷执行支持检查。' }
      - { en: 'Inspect logs and telemetry for raw payloads, credentials, and personal data.', zh: '检查日志与遥测是否包含原始载荷、凭据和个人数据。' }
      - { en: 'Measure lookup work as the registry grows and confirm that the ID index is actually used.', zh: '随着注册表增长测量查找工作量，并确认ID索引确实被使用。' }
    explanation: { en: 'Make supports(_:) a protocol requirement with a default witness, validate ID uniqueness during registration, store processors by ID, and log only safe operation metadata.', zh: '应把supports(_:) 声明为带默认见证的协议要求，在注册时验证ID唯一性，按ID存储处理器，并且只记录安全的操作元数据。' }
    difficulty: advanced
    tags: [code-review, existential-type, protocol-extension, security, performance]
