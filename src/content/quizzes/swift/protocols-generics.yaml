topic: swift/protocols-generics
items:
  - id: predict-generic-relationship
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      func selected<Value>(_ first: Value, _ second: Value, useFirst: Bool) -> Value {
          useFirst ? first : second
      }

      let number = selected(3, 8, useFirst: false)
      let word = selected("left", "right", useFirst: true)
      print(number)
      print(word)
    lang: swift
    options:
      - { text: { en: "8, then left", zh: '先输出8，再输出left' }, correct: true }
      - { text: { en: "3, then right", zh: '先输出3，再输出right' }, correct: false }
      - { text: { en: "The compiler rejects two different Value types across the two calls.", zh: '两次调用的Value类型不同，因此编译器拒绝代码。' }, correct: false }
      - { text: { en: "Both results have type Any.", zh: '两个结果的类型都是Any。' }, correct: false }
    explanation: { en: 'Each call independently chooses one concrete Value. The first call uses Int and selects 8; the second uses String and selects left.', zh: '每次调用都会独立选择一个具体Value。第一次选择Int并返回8，第二次选择String并返回left。' }
    difficulty: beginner
    tags: [generic-parameter, type-relationship, predict-output]

  - id: associated-type-owner
    type: mcq
    prompt: { en: 'Who determines the `Item` in a conformance to `protocol Catalog<Item>`?', zh: '遵循`protocol Catalog<Item>`时，谁决定其中的`Item`？' }
    options:
      - { text: { en: 'The conforming type, through the witnesses that satisfy the protocol.', zh: '遵循类型通过满足协议要求的见证来决定。' }, correct: true }
      - { text: { en: 'Every method caller chooses a new Item.', zh: '每个方法调用方都选择一个新的Item。' }, correct: false }
      - { text: { en: 'The first existential value stored at runtime chooses it globally.', zh: '运行时保存的第一个存在值会为全局决定它。' }, correct: false }
      - { text: { en: 'The protocol extension always fixes it as Any.', zh: '协议扩展总会把它固定为Any。' }, correct: false }
    explanation: { en: 'A primary associated type remains an associated type. Its angle-bracket position makes constraints concise, while each conformer still establishes the concrete witness.', zh: '主关联类型仍是关联类型。尖括号位置让约束写法更简洁，具体类型仍由每个遵循类型的见证确定。' }
    difficulty: intermediate
    tags: [associated-type, primary-associated-type, conformance]

  - id: choose-generic-some-any
    type: mcq
    prompt: { en: 'Which form fits a returned value whose implementation chooses one hidden concrete type?', zh: '返回值由实现方选择一种隐藏的具体类型时，哪种形式最合适？' }
    options:
      - { text: { en: '`-> some P`', zh: '`-> some P`' }, correct: true }
      - { text: { en: '`any P`', zh: '`any P`' }, correct: false }
      - { text: { en: '`<T: P>` chosen independently by the implementation', zh: '由实现方独立选择的`<T: P>`' }, correct: false }
      - { text: { en: '`Any` followed by `as! P`', zh: '`Any`后接`as! P`' }, correct: false }
    explanation: { en: 'An opaque result type lets the implementation select one underlying conformer while callers rely on the protocol. An existential allows runtime heterogeneity instead.', zh: '不透明返回类型让实现选择一个底层遵循类型，调用方只依赖协议；存在类型表达的则是运行时异构性。' }
    difficulty: intermediate
    tags: [opaque-type, existential-type, api-boundary]

  - id: spot-extension-only-member
    title: { en: 'Spot the bug in protocol labeling', zh: '找出协议标签里的bug' }
    type: spotbug
    prompt: { en: 'The generic helper should print `invoice`, but it prints `default`. Find the contract bug.', zh: '泛型辅助函数应输出`invoice`，实际却输出`default`。找出契约错误。' }
    code: |
      protocol Labeled {}
      extension Labeled {
          func label() -> String { "default" }
      }
      struct Invoice: Labeled {
          func label() -> String { "invoice" }
      }
      func show<Value: Labeled>(_ value: Value) {
          print(value.label())
      }
      show(Invoice())
    lang: swift
    issues:
      - line: 1
        kind: correctness
        note: { en: '`label()` is absent from the protocol requirements, so generic code statically selects the extension member. Declare the requirement in Labeled and keep the extension implementation as its default.', zh: '`label()`没有出现在协议要求中，因此泛型代码静态选择扩展成员。应在Labeled中声明该要求，并保留扩展实现作为默认见证。' }
    explanation: { en: 'A same-named concrete method does not dynamically replace an extension-only convenience member. Polymorphic behavior must begin with a protocol requirement.', zh: '具体类型上的同名方法不会动态替换只存在于扩展中的便利成员。需要多态行为时，必须先声明协议要求。' }
    difficulty: intermediate
    tags: [protocol-extension, static-dispatch, witness]

  - id: narrowest-constraint-boundary
    type: mcq
    prompt: { en: 'Only `sortedValues()` compares a container’s elements. Where should `Element: Comparable` usually go?', zh: '容器中只有`sortedValues()`会比较元素。`Element: Comparable`通常应放在哪里？' }
    options:
      - { text: { en: 'On `sortedValues()` or a constrained extension containing it.', zh: '放在`sortedValues()`或包含该方法的受约束扩展上。' }, correct: true }
      - { text: { en: 'On the entire container declaration in every case.', zh: '无论情况如何都放在整个容器声明上。' }, correct: false }
      - { text: { en: 'Nowhere; cast every element to Comparable at runtime.', zh: '不添加约束，在运行时把每个元素转换为Comparable。' }, correct: false }
      - { text: { en: 'On every caller that reads the container count.', zh: '放在每个读取容器数量的调用方上。' }, correct: false }
    explanation: { en: 'A method-level or constrained-extension requirement keeps unrelated operations available to noncomparable elements. Type-wide constraints should support a type-wide invariant.', zh: '方法级或受约束扩展的要求能让不可比较元素继续使用无关操作。类型级约束应当服务于整个类型的不变量。' }
    difficulty: intermediate
    tags: [generic-constraint, constrained-extension, api-design]

  - id: review-generated-registry
    type: review
    title: { en: 'Review a generated generic registry', zh: '审查生成的泛型注册表' }
    prompt: { en: 'Review this generated registry against the stated task.', zh: '根据任务要求审查这段生成的注册表。' }
    task: { en: 'Build a generic keyed registry that replaces an existing value without changing first-insertion order, returns nil for a missing key, never logs stored data, and provides average constant-time lookup.', zh: '构建泛型键控注册表：替换已有值时不改变首次插入顺序；键缺失时返回nil；绝不记录存储数据；平均查找时间为常数。' }
    code: |
      protocol Lookup<Key, Value> {
          associatedtype Key: Hashable
          associatedtype Value
          func value(for key: Key) -> Value?
      }
      struct Registry<Key: Hashable, Value>: Lookup {
          private var entries: [(Key, Value)] = []
          mutating func put(_ value: Value, for key: Key) {
              print("storing \(key): \(value)")
              entries.append((key, value))
          }
          func value(for key: Key) -> Value? {
              entries.first(where: { $0.0 == key })!.1
          }
          func allValues() -> [Value] {
              entries.map(\.1)
          }
      }
    lang: swift
    issues:
      - line: 9
        kind: security
        note: { en: 'The log includes arbitrary keys and values, which may contain tokens or personal data. Remove value logging and expose only approved aggregate diagnostics.', zh: '日志包含任意键和值，其中可能有令牌或个人数据。应移除值日志，只暴露获准的聚合诊断信息。' }
      - line: 10
        kind: correctness
        note: { en: '`put` always appends, so an existing key creates a duplicate rather than replacing its value while retaining the original position.', zh: '`put`总是追加，因此已有键会产生重复项，而不是在保留原位置的同时替换值。' }
      - line: 13
        kind: edge-case
        note: { en: 'The forced unwrap traps for a missing key even though the signature promises an optional result.', zh: '键缺失时强制解包会触发运行时错误，尽管签名承诺返回可选值。' }
      - line: 13
        kind: performance
        note: { en: 'Scanning an array makes lookup linear. Use a dictionary for average constant-time lookup and keep first-insertion order in a separate key array.', zh: '扫描数组会让查找变成线性时间。应使用字典获得平均常数时间查找，并用单独的键数组保存首次插入顺序。' }
    right: { en: 'The protocol and generic type preserve the Key and Value relationships, constrain keys with Hashable, and expose missing results as Value? at the API boundary.', zh: '协议与泛型类型保留了Key和Value的关系，用Hashable约束键，并在API边界把缺失结果表达为Value?。' }
    checklist:
      - { en: 'Insert one key twice and verify replacement without a second listing position.', zh: '连续插入同一键两次，验证值被替换且列表中没有第二个位置。' }
      - { en: 'Look up a missing key and confirm the result is nil without a trap.', zh: '查找缺失键，确认结果为nil且不会触发运行时错误。' }
      - { en: 'Inspect storage and growth behavior to confirm hashing powers the lookup path.', zh: '检查存储与增长行为，确认查找路径真正使用哈希。' }
      - { en: 'Capture diagnostics with a secret-shaped value and verify no key or value is emitted.', zh: '使用类似秘密数据的值捕获诊断信息，确认没有输出键或值。' }
    explanation: { en: 'Pair a dictionary with an ordered key array, update existing entries in place, return the dictionary optional directly, and keep diagnostics independent of stored data.', zh: '应组合字典与有序键数组，原位更新已有项，直接返回字典产生的可选值，并让诊断信息与存储数据分离。' }
    difficulty: advanced
    tags: [code-review, protocols, generics, lookup, privacy]
