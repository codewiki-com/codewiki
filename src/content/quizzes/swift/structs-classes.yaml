topic: swift/structs-classes
items:
  - id: predict-outer-copy-inner-alias
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      final class Box {
          var count: Int
          init(count: Int) { self.count = count }
      }

      struct Packet {
          var label: String
          var box: Box
      }

      var first = Packet(label: "A", box: Box(count: 1))
      var second = first
      second.label = "B"
      second.box.count += 1

      print(first.label, second.label)
      print(first.box.count, second.box.count)
    lang: swift
    options:
      - text:
          en: "A B\n2 2"
          zh: "A B\n2 2"
        correct: true
      - text:
          en: "A B\n1 2"
          zh: "A B\n1 2"
        correct: false
      - text:
          en: "B B\n2 2"
          zh: "B B\n2 2"
        correct: false
      - text:
          en: "A A\n1 1"
          zh: "A A\n1 1"
        correct: false
    explanation: { en: 'The outer Packet values are independent, so their labels differ. Both box fields copy the same class reference, so mutating the Box is visible through both values.', zh: '外层 Packet 值彼此独立，所以标签不同；两个 box 字段复制的是同一个类引用，因此通过任一值修改 Box，另一值也能观察到。' }
    difficulty: intermediate
    tags: [value-semantics, reference-semantics, predict-output]

  - id: let-class-reference
    type: mcq
    prompt: { en: 'What does let session = Session() guarantee when Session is a class with mutable properties?', zh: '当 Session 是含可变属性的类时，let session = Session() 保证什么？' }
    options:
      - { text: { en: 'session cannot be rebound to another instance, but the referenced instance can still mutate through its var properties.', zh: 'session 不能改指向其他实例，但仍可通过 var 属性修改所引用的实例。' }, correct: true }
      - { text: { en: 'Every property reachable from session becomes deeply immutable.', zh: '从 session 可达的每个属性都会变成深层不可变。' }, correct: false }
      - { text: { en: 'The instance is copied before every mutating method call.', zh: '每次调用修改方法前都会复制该实例。' }, correct: false }
    explanation: { en: 'let constrains the binding. For a class, the binding keeps pointing to one instance while that instance can still expose mutable state.', zh: 'let 约束的是绑定。对于类，绑定会一直指向同一个实例，但该实例仍可暴露可变状态。' }
    difficulty: beginner
    tags: [let, class, mutation]

  - id: memberwise-public-contract
    type: mcq
    prompt: { en: 'How should a public library treat a structure’s synthesized memberwise initializer?', zh: '公共库应如何对待结构体合成的成员初始化器？' }
    options:
      - { text: { en: 'Declare the promised initializer explicitly because synthesis and access can change with stored properties and custom initializers.', zh: '显式声明要承诺的初始化器，因为存储属性和自定义初始化器会改变合成结果与访问级别。' }, correct: true }
      - { text: { en: 'Treat it as permanently public whenever the structure is public.', zh: '只要结构体是 public，就把它视为永久公开。' }, correct: false }
      - { text: { en: 'Replace the structure with a class because classes always synthesize the same initializer.', zh: '改用类，因为类总会合成相同的初始化器。' }, correct: false }
    explanation: { en: 'Memberwise synthesis is a convenience, not a stable public construction contract. Classes do not synthesize a memberwise initializer either.', zh: '成员初始化器的合成是实现便利，不是稳定的公开构造契约；类也不会合成成员初始化器。' }
    difficulty: intermediate
    tags: [memberwise-initializer, api-design, access-control]

  - id: spot-let-struct-mutation
    type: spotbug
    prompt: { en: 'Find why this code does not compile.', zh: '找出这段代码无法编译的原因。' }
    code: |
      struct Counter {
          private(set) var value = 0

          mutating func increment() {
              value += 1
          }
      }

      let requestCount = Counter()
      requestCount.increment()
    lang: swift
    issues:
      - line: 10
        kind: correctness
        note: { en: 'increment() mutates the Counter value, but requestCount is a let binding and cannot provide write access to self.', zh: 'increment() 会修改 Counter 值，但 requestCount 是 let 绑定，无法为 self 提供写访问。' }
    explanation: { en: 'Declare requestCount with var when this binding owns changing counter state. Removing mutating or changing to a class would alter the API semantics rather than fix the binding mismatch.', zh: '如果该绑定确实拥有会变化的计数状态，应把 requestCount 声明为 var。移除 mutating 或改成类会改变 API 语义，而不是修复绑定不匹配。' }
    difficulty: beginner
    tags: [mutating, let, compiler-error]

  - id: review-generated-invoice-copy
    type: review
    prompt: { en: 'Review this generated invoice model against its copy, validation, privacy, and lookup requirements.', zh: '根据复制、校验、隐私与查找要求审查这段生成的发票模型。' }
    task: { en: 'Return an independently discounted invoice without changing the original, accept only percentages from 0 through 100, never log customer names, and total requested SKUs without a fresh linear scan for each SKU.', zh: '返回独立折扣后的发票且不改变原件；只接受 0 到 100 的百分比；绝不记录客户姓名；汇总指定 SKU 时不得为每个 SKU 重新线性扫描。' }
    code: |
      final class LineItem {
          let sku: String
          var cents: Int
          init(sku: String, cents: Int) { self.sku = sku; self.cents = cents }
      }

      struct Invoice {
          let customerName: String
          var items: [LineItem]

          func discounted(percent: Int) -> Invoice {
              let copy = self
              for item in copy.items {
                  item.cents -= item.cents * percent / 100
              }
              print("discounted", customerName)
              return copy
          }

          func total(for skus: [String]) -> Int {
              skus.reduce(0) { sum, sku in
                  sum + (items.first { $0.sku == sku }?.cents ?? 0)
              }
          }
      }
    lang: swift
    issues:
      - line: 14
        kind: correctness
        note: { en: 'copy.items contains the same LineItem class references, so changing their cents also changes the original invoice.', zh: 'copy.items 中仍是相同的 LineItem 类引用，因此修改 cents 也会改变原始发票。' }
      - line: 11
        kind: edge-case
        note: { en: 'percent is not validated; negative or above-100 values can increase prices or make them negative.', zh: 'percent 未经校验；负数或大于 100 的值可能抬高价格或产生负价格。' }
      - line: 16
        kind: security
        note: { en: 'The log includes customerName, exposing customer data even though logging names is forbidden.', zh: '日志包含 customerName，会在明确禁止记录姓名的情况下暴露客户数据。' }
      - line: 22
        kind: performance
        note: { en: 'items.first performs a new linear scan for every requested SKU; build one SKU-to-price index before the reduction.', zh: 'items.first 会为每个指定 SKU 重新线性扫描；应在归并前构建一次 SKU 到价格的索引。' }
    right: { en: 'The generated code uses integer minor units, gives the transformation a result-returning API, and keeps SKU and amount fields explicit.', zh: '生成代码使用整数最小货币单位，让转换 API 返回结果，并明确声明了 SKU 与金额字段。' }
    checklist:
      - { en: 'Mutate the returned invoice and assert that every field of the original remains unchanged.', zh: '修改返回的发票，并断言原始发票的每个字段都保持不变。' }
      - { en: 'Test percentages -1, 0, 100, and 101, including rounding expectations.', zh: '测试 -1、0、100 与 101，并检查舍入预期。' }
      - { en: 'Capture logs and confirm that customer names and invoice contents are absent.', zh: '捕获日志，确认其中没有客户姓名和发票内容。' }
      - { en: 'Count item inspections for many requested SKUs and require a single indexing pass.', zh: '统计大量指定 SKU 下的条目检查次数，并要求只执行一次索引遍历。' }
    explanation: { en: 'Use value-type line items or explicitly clone each reference, validate the percentage before transformation, remove sensitive logging, and index items once for repeated lookup.', zh: '应使用值类型条目或显式复制每个引用，在转换前校验百分比，移除敏感日志，并为重复查找一次性建立条目索引。' }
    difficulty: advanced
    tags: [code-review, shallow-copy, validation, privacy, performance]
