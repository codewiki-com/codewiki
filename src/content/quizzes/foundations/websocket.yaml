topic: foundations/websocket
items:
  - id: predict-buffer-admission
    type: predict
    prompt: { en: 'Which two booleans does this send-admission check print?', zh: '这段发送准入检查会输出哪两个布尔值？' }
    code: |
      const socket = {
        readyState: WebSocket.OPEN,
        bufferedAmount: 60 * 1024,
      };
      const limit = 64 * 1024;
      console.log(socket.bufferedAmount + 2 * 1024 <= limit);
      console.log(socket.bufferedAmount + 8 * 1024 <= limit);
    lang: javascript
    options:
      - { text: { en: "true\nfalse", zh: "true\nfalse" }, correct: true }
      - { text: { en: "false\ntrue", zh: "false\ntrue" }, correct: false }
      - { text: { en: "true\ntrue", zh: "true\ntrue" }, correct: false }
      - { text: { en: 'It throws because `bufferedAmount` is writable only on a real socket.', zh: '程序抛出异常，因为只有真实套接字的 `bufferedAmount` 才可写。' }, correct: false }
    explanation: { en: 'The first payload leaves the total below 64 KiB, while the second raises it above the limit. The object only supplies values read by the expression, so no live connection is required.', zh: '第一个负载使总量保持在 64 KiB 以下，第二个负载则使其超过上限。表达式只读取对象中的值，不需要真实连接。' }
    difficulty: beginner
    tags: [websocket, buffered-amount, predict-output]
    tests: node buffer_admission.js
    minutes: 3

  - id: reconnect-delivery-ambiguity
    type: mcq
    prompt: { en: 'A client loses its connection after sending a payment command but before receiving an acknowledgement. What is the safest conclusion?', zh: '客户端发送付款命令后、收到确认前断线。哪项结论最安全？' }
    options:
      - { text: { en: 'The server definitely did not receive the command.', zh: '服务端一定没有收到命令。' }, correct: false }
      - { text: { en: 'The server definitely committed the payment.', zh: '服务端一定已经提交付款。' }, correct: false }
      - { text: { en: 'The outcome is unknown; query it or retry with a stable idempotency key under the application protocol.', zh: '结果未知；应查询结果，或按应用协议用稳定幂等键重试。' }, correct: true }
      - { text: { en: 'Close code 1006 proves that replay is safe.', zh: '关闭码 1006 能证明重放安全。' }, correct: false }
    explanation: { en: 'A transport failure cannot reveal whether the peer committed an application transaction. Recovery needs application evidence such as a recorded result or idempotent retry.', zh: '传输故障不能说明对端是否提交了应用事务。恢复需要已记录结果或幂等重试等应用层证据。' }
    difficulty: intermediate
    tags: [reconnect, idempotency, delivery]
    minutes: 4

  - id: spot-unbounded-send
    title: { en: 'Spot the bug in the send helper', zh: '找出发送辅助函数里的 bug' }
    type: spotbug
    prompt: { en: 'Find the lifecycle and capacity bugs in this generated send helper.', zh: '找出这个生成的发送辅助函数中的生命周期与容量错误。' }
    code: |
      export function publish(socket, event) {
        const payload = JSON.stringify(event);
        socket.send(payload);
      }
    lang: javascript
    issues:
      - line: 3
        kind: correctness
        note: { en: 'The helper does not require `OPEN`; `send()` during `CONNECTING` throws, while calls after closing do not have a defined application outcome.', zh: '辅助函数没有要求连接处于 `OPEN`；在 `CONNECTING` 时调用 `send()` 会抛错，关闭后的调用也没有明确业务结果。' }
      - line: 3
        kind: performance
        note: { en: 'The helper ignores `bufferedAmount` and has no pending-byte limit, so a slow peer can make queued memory grow without bound.', zh: '辅助函数忽略 `bufferedAmount`，也没有待发字节上限；慢速对端可能让排队内存无限增长。' }
    explanation: { en: 'Make send admission explicit: require the right state, account for encoded bytes, and return a visible overload result. Queueing, rejection, coalescing, and closing are application policies, not silent implementation details.', zh: '发送准入应当明确：要求正确状态，统计编码后的字节，并返回可见的过载结果。排队、拒绝、合并或关闭属于应用策略，不应成为静默的实现细节。' }
    difficulty: intermediate
    tags: [ready-state, backpressure, lifecycle]
    tests: node --check publish.js
    minutes: 6

  - id: browser-heartbeat
    type: mcq
    prompt: { en: 'A browser application must verify that its server-side business loop is responsive. Which heartbeat is appropriate?', zh: '浏览器应用需要确认服务端业务事件循环仍有响应。哪种心跳合适？' }
    options:
      - { text: { en: 'Call `socket.ping()` from browser JavaScript.', zh: '在浏览器 JavaScript 中调用 `socket.ping()`。' }, correct: false }
      - { text: { en: 'Send an application heartbeat with a sequence or time and enforce a bounded reply timeout.', zh: '发送带序号或时间的应用级心跳，并执行有界回复超时。' }, correct: true }
      - { text: { en: 'Treat any `bufferedAmount` value as proof that the server is alive.', zh: '把任意 `bufferedAmount` 值当作服务端存活证明。' }, correct: false }
      - { text: { en: 'Reconnect continuously until one attempt succeeds.', zh: '持续重连，直到某次成功。' }, correct: false }
    explanation: { en: 'Browsers do not expose protocol Ping, and transport Pong would not prove that business handling ran. An application heartbeat exercises the intended path and has an explicit timeout.', zh: '浏览器不暴露协议级 Ping，而且传输层 Pong 不能证明业务处理已经运行。应用级心跳会经过目标路径，并带有明确超时。' }
    difficulty: intermediate
    tags: [heartbeat, browser-api, liveness]
    minutes: 3

  - id: review-generated-chat-client
    title: { en: 'Review generated browser chat client', zh: '审查生成的浏览器聊天客户端' }
    type: review
    prompt: { en: 'Review this AI-generated browser chat helper against its stated task.', zh: '根据给定任务，审查这个 AI 生成的浏览器聊天辅助函数。' }
    task: { en: 'Use an existing secure session and an authentication message to join one authorized room, publish only after a join acknowledgement, render text safely, and keep pending work bounded.', zh: '使用已有安全会话和认证消息加入一个已授权房间，只在收到加入确认后发布，安全渲染文本，并限制待处理工作。' }
    code: |
      export function createChat(roomId, token) {
        let socket; const pending = [];
        function open() {
          socket = new WebSocket(`wss://chat.example/ws?token=${token}`);
          socket.addEventListener('open', () => {
            socket.send(JSON.stringify({ type: 'join', roomId }));
            for (const data of pending) socket.send(data);
          });
          socket.addEventListener('message', ({ data }) => {
            const message = JSON.parse(data);
            const item = document.createElement('p');
            item.textContent = message.text;
            document.querySelector('#feed').append(item);
          });
        }
        open();
        return {
          send(text) {
            const data = JSON.stringify({ type: 'publish', roomId, text });
            if (socket.readyState === WebSocket.OPEN) socket.send(data);
            else pending.push(data);
          },
          close() { socket.close(1000, 'done'); },
        }; }
    lang: javascript
    right: { en: 'The helper uses `wss://`, waits for `open` before its first send, serializes a clear message type, renders peer text with `textContent` rather than HTML, and exposes an explicit normal close.', zh: '辅助函数使用 `wss://`，先等待 `open` 再首次发送，序列化了明确消息类型，使用 `textContent` 而非 HTML 渲染对端文本，并暴露了显式正常关闭操作。' }
    checklist:
      - { en: 'Trace authentication, authorization, join acknowledgement, and publish as separate protocol states.', zh: '把认证、授权、加入确认和发布分别作为协议状态追踪。' }
      - { en: 'Set decoded inbound and encoded pending-byte limits before accepting work.', zh: '接收工作前，设置解码后入站大小与编码后待发字节上限。' }
      - { en: 'Test malformed data, missing DOM targets, manual close, and every failure between open and acknowledgement.', zh: '测试畸形数据、缺失的 DOM 目标、手动关闭，以及从打开到确认之间的每种故障。' }
      - { en: 'Keep transport events separate from rendering and make cleanup ownership explicit.', zh: '分离传输事件与渲染，并明确清理工作的所有者。' }
    issues:
      - line: 4
        kind: security
        note: { en: 'The token is placed in the connection URL, where infrastructure logs can retain it, instead of using the secure session and authentication message required by the task.', zh: '令牌被放进连接 URL，可能由基础设施日志保留；这没有使用任务要求的安全会话与认证消息。' }
      - line: 7
        kind: correctness
        note: { en: 'Pending publishes are flushed immediately after `join` is sent, before any join acknowledgement proves that the room is authorized and active.', zh: '待发布消息在发送 `join` 后立即刷新，没有等待加入确认来证明房间已获授权并处于活动状态。' }
      - line: 10
        kind: edge-case
        note: { en: 'Peer data is parsed and dereferenced without a byte limit, JSON error handling, type validation, or a check that this is a chat message.', zh: '代码没有字节上限、JSON 错误处理、类型校验，也不检查消息是否为聊天消息，就解析并读取对端数据。' }
      - line: 9
        kind: readability
        note: { en: 'The transport listener owns DOM rendering, coupling connection lifecycle to one page element and obscuring how either side is tested and cleaned up.', zh: '传输监听器直接负责 DOM 渲染，把连接生命周期绑定到一个页面元素，也让两部分的测试和清理边界变得模糊。' }
      - line: 21
        kind: performance
        note: { en: 'The pending array has no item or encoded-byte cap, expiry, or overload action, so work can accumulate for the lifetime of a slow connection.', zh: '待处理数组没有条目或编码后字节上限，也没有过期与过载动作；慢连接期间工作可以持续累积。' }
    explanation: { en: 'Model authentication, join, and ready-to-publish as distinct states. Validate and route inbound messages before rendering, keep an owned and bounded pending queue, and use a secure credential flow that does not expose tokens in URLs.', zh: '应把认证、加入和可发布建模为不同状态。渲染前先校验并路由入站消息，使用所有权明确且有界的待处理队列，并采用不会在 URL 中暴露令牌的安全凭据流程。' }
    difficulty: advanced
    tags: [code-review, websocket-client, security, backpressure]
    tests: node --check generated_chat_client.js
    minutes: 15
