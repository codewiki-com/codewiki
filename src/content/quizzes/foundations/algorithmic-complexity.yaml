topic: foundations/algorithmic-complexity
items:
  - id: predict-pair-count
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      function pairCount(size) {
        let comparisons = 0;
        for (let left = 0; left < size; left += 1) {
          for (let right = left + 1; right < size; right += 1) {
            comparisons += 1;
          }
        }
        return comparisons;
      }

      console.log(pairCount(5));
    lang: javascript
    options:
      - { text: { en: '5', zh: '5' }, correct: false }
      - { text: { en: '10', zh: '10' }, correct: true }
      - { text: { en: '20', zh: '20' }, correct: false }
      - { text: { en: '25', zh: '25' }, correct: false }
    explanation: { en: 'The loops visit each unordered pair once, so the count is 5 × 4 / 2 = 10. For size n, that count is Θ(n²).', zh: '循环对每一对无序元素访问一次，所以计数为5 × 4 / 2 = 10。规模为n时，计数是 Θ(n²)。' }
    difficulty: beginner
    tags: [complexity, predict-output, nested-loops]

  - id: dominant-term
    type: mcq
    prompt: { en: 'A function performs 4n² + 20n + 300 modeled operations. What is its tight asymptotic time bound?', zh: '某函数执行4n² + 20n + 300次模型操作。它的紧确渐近时间界限是什么？' }
    options:
      - { text: { en: 'Θ(1)', zh: 'Θ(1)' }, correct: false }
      - { text: { en: 'Θ(n)', zh: 'Θ(n)' }, correct: false }
      - { text: { en: 'Θ(n²)', zh: 'Θ(n²)' }, correct: true }
      - { text: { en: 'Θ(4n² + 20n + 300) only', zh: '只能写成 Θ(4n² + 20n + 300)' }, correct: false }
    explanation: { en: 'The quadratic term dominates as n grows; constant factors and lower-order terms do not change the asymptotic class.', zh: 'n增长后，二次项占主导；常数因子和低阶项不会改变渐近类别。' }
    difficulty: beginner
    tags: [asymptotic-notation, dominant-term]

  - id: scan-cases
    type: mcq
    prompt: { en: 'A linear scan stops when it finds its target. Which statement is precise?', zh: '线性扫描找到目标后立即停止。哪项陈述最准确？' }
    options:
      - { text: { en: 'Its time is always Θ(1).', zh: '它的时间始终是 Θ(1)。' }, correct: false }
      - { text: { en: 'Its best case is Θ(1), while its worst case is Θ(n).', zh: '最好情形是 Θ(1)，最坏情形是 Θ(n)。' }, correct: true }
      - { text: { en: 'Its average case is automatically Θ(n / 2).', zh: '平均情形自动等于 Θ(n / 2)。' }, correct: false }
      - { text: { en: 'Its worst case is Θ(n²).', zh: '最坏情形是 Θ(n²)。' }, correct: false }
    explanation: { en: 'A first-position match takes constant work, while an absent or last-position target requires a full scan. Any average claim needs a distribution assumption.', zh: '目标位于首位时只需常数工作，目标不存在或位于末尾时则要完整扫描。任何平均情况结论都需要分布假设。' }
    difficulty: beginner
    tags: [best-case, worst-case, linear-search]

  - id: spot-hidden-linear-work
    title: { en: 'Spot the bug in the duplicate check', zh: '找出重复项检查里的bug' }
    type: spotbug
    prompt: { en: 'Find the complexity bug in this duplicate check.', zh: '找出这段重复项检查中的复杂度缺陷。' }
    code: |
      function hasDuplicate(orderIds) {
        const seen = [];
        for (const orderId of orderIds) {
          if (seen.includes(orderId)) {
            return true;
          }
          seen.push(orderId);
        }
        return false;
      }
    lang: javascript
    issues:
      - line: 4
        kind: performance
        note: { en: 'Array.includes scans up to all previously seen IDs on every iteration, so unique input makes the function Θ(n²). Use a Set for expected Θ(n) time with Θ(n) auxiliary space.', zh: 'Array.includes每轮最多扫描所有已见标识符，因此唯一输入会让函数达到 Θ(n²)。可使用Set，以 Θ(n) 辅助空间换取期望 Θ(n) 时间。' }
    explanation: { en: 'The visible loop is linear, but its body performs a growing linear scan. Complexity review must include library calls inside loops.', zh: '可见循环是线性的，但循环体每次都会执行不断增长的线性扫描。复杂度审查必须包含循环内的库函数调用。' }
    difficulty: beginner
    tags: [code-review, hidden-loop, set]

  - id: amortized-append
    type: mcq
    prompt: { en: 'Why can append to a geometrically growing dynamic array be amortized O(1) even though one append may be O(n)?', zh: '按几何倍数增长的动态数组中，为什么单次追加可能是O(n)，摊还成本却是O(1)？' }
    options:
      - { text: { en: 'Resizing never copies existing elements.', zh: '扩容从不复制已有元素。' }, correct: false }
      - { text: { en: 'The total copying across n appends is O(n), so it spreads to O(1) per append.', zh: 'n次追加的总复制量是O(n)，分摊后每次为O(1)。' }, correct: true }
      - { text: { en: 'Average-case and amortized analysis mean the same thing.', zh: '平均情况分析与摊还分析含义相同。' }, correct: false }
      - { text: { en: 'The array reserves infinite memory on its first append.', zh: '数组在第一次追加时预留无限内存。' }, correct: false }
    explanation: { en: 'Geometric capacities make copied counts form a geometric sum below a constant multiple of n. The argument bounds every relevant sequence and needs no input probability.', zh: '容量按几何级数增长，使复制次数的总和小于n的某个常数倍。这个论证限制任意相关序列，不需要输入概率。' }
    difficulty: intermediate
    tags: [amortized-complexity, dynamic-array]

  - id: review-dispatch-batches
    type: review
    title: { en: 'Review generated dispatch batching', zh: '审查生成的派单分批代码' }
    prompt: { en: 'Review this generated implementation before it handles an unbounded import.', zh: '请在这段生成代码处理无界导入前进行审查。' }
    task: { en: 'Deduplicate orders by ID, keep the lowest numeric priority, sort by priority then ID, and return batches without mutating caller-owned data.', zh: '按ID去重订单，保留数值最小的优先级，依次按优先级和ID排序，再返回批次，并且不修改调用方拥有的数据。' }
    code: |
      function buildDispatchBatches(orders, batchSize) {
        const unique = [];
        for (const order of orders) {
          const existingIndex = unique.findIndex((item) => item.id === order.id);
          if (existingIndex === -1) {
            unique.push({ ...order });
          } else if (order.priority < unique[existingIndex].priority) {
            unique[existingIndex] = { ...order };
          }
        }
        unique.sort((left, right) => left.priority - right.priority);
        const batches = [];
        while (unique.length > 0) {
          batches.push(unique.splice(0, batchSize));
        }
        return batches;
      }
    lang: javascript
    issues:
      - line: 4
        kind: performance
        note: { en: 'findIndex scans a growing array for every order, making unique input Θ(n²). Index selected orders in a Map for expected Θ(n) deduplication.', zh: 'findIndex会为每个订单扫描不断增长的数组，因此唯一输入会达到 Θ(n²)。应使用Map索引已选订单，实现期望 Θ(n) 去重。' }
      - line: 11
        kind: correctness
        note: { en: 'The comparator omits the required ID tie-breaker, so equal-priority output does not follow the stated ordering contract.', zh: '比较器遗漏了任务要求的ID决胜条件，因此相同优先级的输出不符合指定排序约定。' }
      - line: 13
        kind: edge-case
        note: { en: 'A zero or negative batchSize lets splice remove nothing, so the loop never makes progress. Validate a positive integer before entering the loop.', zh: 'batchSize为零或负数时，splice不会移除元素，循环因而永不推进。进入循环前应验证它是正整数。' }
    right: { en: 'The code keeps caller objects untouched by copying selected orders, implements the lowest-priority replacement rule, and returns explicit batches.', zh: '代码会复制选中的订单，不修改调用方对象；它实现了保留较小优先级的替换规则，并返回明确的批次数组。' }
    checklist:
      - { en: 'Derive time and auxiliary-space bounds for maximum unique input.', zh: '为最大唯一输入推导时间与辅助空间界限。' }
      - { en: 'Test duplicate IDs, equal priorities, and deterministic ordering.', zh: '测试重复ID、相同优先级和确定性排序。' }
      - { en: 'Test batchSize at zero, one, and above the input length.', zh: '测试batchSize为零、一，以及大于输入长度的情况。' }
      - { en: 'Verify that neither the input array nor its order objects are mutated.', zh: '确认输入数组及其中的订单对象都未被修改。' }
    explanation: { en: 'Use a Map keyed by ID, validate batchSize, sort selected copies with both comparator keys, and slice batches by index. This keeps the stated behavior while avoiding quadratic scans and non-progress.', zh: '应使用按ID索引的Map，验证batchSize，用两个比较键排序选中副本，再按索引切分批次。这样既保留指定行为，也避免二次扫描和无法推进。' }
    difficulty: intermediate
    minutes: 10
    tags: [code-review, algorithmic-complexity, batching]
