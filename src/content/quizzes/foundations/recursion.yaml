topic: foundations/recursion
items:
  - id: predict-descent-and-unwind
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      def trace(count):
          if count == 0:
              return ["base"]
          return [f"down {count}", *trace(count - 1), f"up {count}"]

      print(trace(2))
    lang: python
    options:
      - { text: { en: "['down 2', 'down 1', 'base', 'up 1', 'up 2']", zh: "['down 2', 'down 1', 'base', 'up 1', 'up 2']" }, correct: true }
      - { text: { en: "['down 2', 'up 2', 'down 1', 'up 1', 'base']", zh: "['down 2', 'up 2', 'down 1', 'up 1', 'base']" }, correct: false }
      - { text: { en: "['base', 'down 1', 'up 1', 'down 2', 'up 2']", zh: "['base', 'down 1', 'up 1', 'down 2', 'up 2']" }, correct: false }
    explanation: { en: 'The down entries are built during descent. The base result arrives first during unwinding, and each suspended caller then appends its up entry.', zh: 'down 条目在下降阶段构造。栈展开时先得到基本情况结果，随后每个暂停的调用方依次追加自己的 up 条目。' }
    difficulty: beginner
    tags: [recursion, predict-output, call-stack]

  - id: termination-measure
    type: mcq
    prompt: { en: 'Which argument proves that recursive binary search on [low, high) terminates?', zh: '以下哪项论证能证明针对 [low, high) 的递归二分查找会终止？' }
    options:
      - { text: { en: 'The interval width is nonnegative and strictly decreases on every recursive branch.', zh: '区间宽度非负，而且在每条递归分支上都严格减小。' }, correct: true }
      - { text: { en: 'The target usually occurs near the middle of real data.', zh: '真实数据中的目标通常靠近中间。' }, correct: false }
      - { text: { en: 'Every call has fewer local variables than its caller.', zh: '每次调用的局部变量都少于调用方。' }, correct: false }
      - { text: { en: 'The runtime eventually removes old call frames.', zh: '运行时最终会移除旧调用栈帧。' }, correct: false }
    explanation: { en: 'A nonnegative integer cannot decrease strictly forever. The proof must cover every recursive edge, not only the expected branch.', zh: '非负整数无法无限严格下降。证明必须覆盖每条递归边，而不只是预期会执行的分支。' }
    difficulty: intermediate
    tags: [termination, invariant, binary-search]

  - id: balanced-tree-bounds
    type: mcq
    prompt: { en: 'A recursive depth-first traversal visits every node in a balanced binary tree with n nodes. What are its usual time and call-depth bounds?', zh: '递归深度优先遍历会访问一棵含 n 个节点的平衡二叉树中的每个节点。它通常具有怎样的时间与调用深度边界？' }
    options:
      - { text: { en: 'O(n) time and O(log n) call depth', zh: 'O(n) 时间，O(log n) 调用深度' }, correct: true }
      - { text: { en: 'O(log n) time and O(n) call depth', zh: 'O(log n) 时间，O(n) 调用深度' }, correct: false }
      - { text: { en: 'O(n log n) time and O(1) call depth', zh: 'O(n log n) 时间，O(1) 调用深度' }, correct: false }
      - { text: { en: 'O(n) time and O(n) call depth for every tree shape', zh: '对任何树形状都是 O(n) 时间和 O(n) 调用深度' }, correct: false }
    explanation: { en: 'Every node contributes constant work, while a balanced tree has logarithmic height. A chain-shaped tree keeps linear time but raises call depth to O(n).', zh: '每个节点贡献常量工作，而平衡树的高度为对数级。链状树仍为线性时间，但调用深度会升至 O(n)。' }
    difficulty: intermediate
    tags: [complexity, trees, recursion-depth]

  - id: spotbug-persistent-seen-set
    type: spotbug
    prompt: { en: 'Find the state-lifetime bug in this graph search.', zh: '找出这段图搜索中的状态生命周期缺陷。' }
    code: |
      def contains(node, target, seen=set()):
          if node["id"] in seen:
              return False
          seen.add(node["id"])
          if node["id"] == target:
              return True
          return any(contains(child, target, seen) for child in node["children"])
    lang: python
    issues:
      - line: 1
        kind: correctness
        note: { en: 'The default set is created once and reused by later top-level searches, so an earlier search can make a later one skip nodes. Use None at the public entry and create one set per traversal.', zh: '默认集合只创建一次，并被后续顶层搜索复用，因此先前搜索会让后续搜索跳过节点。公开入口应使用 None，并为每次遍历创建一个集合。' }
    explanation: { en: 'One visited set should be shared by recursive calls within a traversal, but not across independent traversals. A helper function can make that ownership boundary explicit.', zh: '一次遍历内的递归调用应共享同一个已访问集合，但彼此独立的遍历不能共享。可以用辅助函数明确这个所有权边界。' }
    difficulty: intermediate
    tags: [spotbug, mutable-default, graph-search]

  - id: explicit-stack-order
    type: mcq
    prompt: { en: 'A recursive pre-order traversal visits children from left to right. How should an equivalent LIFO stack push those children?', zh: '递归前序遍历从左到右访问子节点。等价的后进先出栈应按什么顺序压入子节点？' }
    options:
      - { text: { en: 'Right to left, so the leftmost child is popped first', zh: '从右到左，使最左子节点最先弹出' }, correct: true }
      - { text: { en: 'Left to right, because push order always equals visit order', zh: '从左到右，因为压入顺序总是等于访问顺序' }, correct: false }
      - { text: { en: 'Any order, because depth-first traversal has no observable order', zh: '任意顺序，因为深度优先遍历没有可观察顺序' }, correct: false }
    explanation: { en: 'A LIFO stack reverses push order. Pushing rightmost first leaves the leftmost child on top and preserves the recursive visitation order.', zh: '后进先出栈会反转压入顺序。先压入最右子节点，会让最左子节点位于栈顶，从而保持递归访问顺序。' }
    difficulty: intermediate
    tags: [explicit-stack, traversal-order]

  - id: review-generated-category-indexer
    type: review
    title: { en: 'Review a generated category indexer', zh: '审查生成的分类索引器' }
    prompt: { en: 'Review this generated code before it processes external category trees.', zh: '在这段生成代码处理外部分类树之前，对它进行审查。' }
    task: { en: 'Build an insertion-ordered ID-to-path index, reject cycles or duplicate IDs, and enforce both maximum depth and maximum node count.', zh: '构建保持插入顺序的 ID 到路径索引，拒绝环或重复 ID，并同时限制最大深度与最大节点数。' }
    code: |
      def index_categories(root, max_depth=100):
          index = {}
          visited = set()
          path = []

          def visit(node, depth=0):
              if depth > max_depth:
                  raise ValueError("category tree is too deep")
              if node["id"] in visited:
                  return
              path.append(node["name"])
              index[node["id"]] = "/".join(path)

              for child in node.get("children", []):
                  visit(child, depth + 1)

              path.pop()
              visited.add(node["id"])

          visit(root)
          return index
    lang: python
    issues:
      - line: 9
        kind: correctness
        note: { en: 'A node is marked only after all children return, so a back edge reaches the same active node before it is in visited and recurses until a depth failure. Mark it before descent.', zh: '节点要等所有子节点返回后才被标记，因此反向边会在活动节点进入 visited 前再次抵达它，并持续递归到深度失败。应在下降前标记。' }
      - line: 10
        kind: edge-case
        note: { en: 'Returning silently for an already-seen ID violates the requirement to reject cycles and duplicate IDs. Raise a domain error and distinguish an active-path cycle if callers need that detail.', zh: '遇到已见 ID 时静默返回，违反了拒绝环与重复 ID 的要求。应抛出领域错误；调用方需要时，还应区分活动路径中的环。' }
      - line: 12
        kind: security
        note: { en: 'Maximum depth does not bound a very wide external tree, so index can grow until memory is exhausted. Count admitted nodes and reject the operation before the configured maximum is exceeded.', zh: '最大深度无法约束非常宽的外部树，因此 index 可能持续增长直至耗尽内存。应统计接纳节点，并在超过配置上限前拒绝操作。' }
    right: { en: 'The code defines a focused output contract, uses a path stack to produce readable paths, checks depth before descending, and preserves pre-order insertion for ordinary trees.', zh: '代码给出了明确的输出契约，用路径栈生成可读路径，在下降前检查深度，并能对普通树保持前序插入顺序。' }
    checklist:
      - { en: 'Prove that every recursive edge is bounded and cycle-safe.', zh: '证明每条递归边都受限且能安全处理环。' }
      - { en: 'Test duplicate IDs, a self-cycle, the exact depth boundary, and a wide tree.', zh: '测试重复 ID、自环、准确深度边界和宽树。' }
      - { en: 'Place every mutation and cleanup so exceptions cannot corrupt shared traversal state.', zh: '安排每次修改与清理的位置，确保异常不会破坏共享遍历状态。' }
      - { en: 'Apply independent budgets to depth, node count, and path data.', zh: '分别限制深度、节点数和路径数据。' }
    explanation: { en: 'Mark identities before traversing children, raise on repeated IDs, and enforce a node budget as well as a depth budget. For truly untrusted depth, an explicit stack also avoids relying on Python frame limits.', zh: '应在遍历子节点前标记身份，遇到重复 ID 时抛出错误，并同时限制节点数与深度。面对真正不受信任的深度，还应使用显式栈，避免依赖 Python 栈帧限制。' }
    difficulty: intermediate
    minutes: 10
    tags: [code-review, recursion, cycle-detection, resource-limits]
