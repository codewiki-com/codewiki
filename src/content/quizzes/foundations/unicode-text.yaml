topic: foundations/unicode-text
items:
  - id: predict-code-units-and-points
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      const value = "e\u0301💡";
      console.log(value.length, [...value].length);
    lang: javascript
    options:
      - { text: { en: '2 2', zh: '2 2' }, correct: false }
      - { text: { en: '3 2', zh: '3 2' }, correct: false }
      - { text: { en: '4 3', zh: '4 3' }, correct: true }
      - { text: { en: '4 2', zh: '4 2' }, correct: false }
    explanation: { en: 'JavaScript length counts four UTF-16 code units: two for the decomposed accent sequence and two for the supplementary emoji. String iteration yields three code points, while grapheme segmentation would find two clusters.', zh: 'JavaScript的length计算四个UTF-16代码单元：分解重音序列占两个，补充平面emoji占两个。字符串迭代得到三个码点，而字素分段会得到两个簇。' }
    difficulty: intermediate
    tags: [utf-16, code-points, predict-output]
    tests: node predict_code_units.js
    minutes: 2

  - id: choose-byte-boundary
    type: mcq
    prompt: { en: 'A protocol allows at most 64 UTF-8 bytes for a display label. Which check enforces that contract?', zh: '某协议要求显示标签最多占64个UTF-8字节。哪项检查符合契约？' }
    options:
      - { text: { en: 'text.length <= 64', zh: 'text.length <= 64' }, correct: false }
      - { text: { en: '[...text].length <= 64', zh: '[...text].length <= 64' }, correct: false }
      - { text: { en: 'new TextEncoder().encode(text).length <= 64', zh: 'new TextEncoder().encode(text).length <= 64' }, correct: true }
      - { text: { en: '[...new Intl.Segmenter("en", { granularity: "grapheme" }).segment(text)].length <= 64', zh: '[...new Intl.Segmenter("en", { granularity: "grapheme" }).segment(text)].length <= 64' }, correct: false }
    explanation: { en: 'The limit names the serialized UTF-8 representation, so the program must encode before counting. Code units, code points, and graphemes can all have different lengths.', zh: '限制明确针对序列化后的UTF-8表示，因此程序必须先编码再计数。代码单元、码点和字素数量都可能不同。' }
    difficulty: beginner
    tags: [utf-8, byte-limit, encoding]
    minutes: 3

  - id: spot-code-unit-truncation
    title: { en: 'Spot the bug in the text preview', zh: '找出文本预览里的bug' }
    type: spotbug
    prompt: { en: 'Find why this preview function can corrupt user-perceived text.', zh: '找出这个预览函数会破坏用户感知文本的原因。' }
    code: |
      function preview(message, maximumCharacters) {
        if (message.length <= maximumCharacters) {
          return message;
        }

        return `${message.slice(0, maximumCharacters)}…`;
      }
    lang: javascript
    issues:
      - line: 6
        kind: correctness
        note: { en: 'slice uses UTF-16 code-unit offsets, so the boundary can split a surrogate pair or a grapheme cluster. Segment with Intl.Segmenter and join only complete segments.', zh: 'slice使用UTF-16代码单元偏移，因此边界可能拆开代理项对或字素簇。应使用Intl.Segmenter分段，只拼接完整分段。' }
    explanation: { en: 'The check and slice must use the same declared unit. For a user-visible character limit, segment into grapheme clusters first; if a byte limit also exists, encode and validate the finished preview separately.', zh: '检查与切片必须使用同一种明确单位。面向用户的字符限制应先按字素簇分段；若同时存在字节限制，还要另外编码并验证最终预览。' }
    difficulty: intermediate
    tags: [grapheme-clusters, truncation, spotbug]
    tests: node --check preview.js
    minutes: 4

  - id: normalization-form-policy
    type: mcq
    prompt: { en: 'Why should a program not replace NFC with NFKC everywhere?', zh: '为什么程序不应在所有位置用NFKC取代NFC？' }
    options:
      - { text: { en: 'NFKC adds compatibility mappings that can merge distinctions such as circled and plain digits.', zh: 'NFKC会增加兼容映射，可能合并带圈数字与普通数字等差异。' }, correct: true }
      - { text: { en: 'NFKC cannot process non-ASCII text.', zh: 'NFKC无法处理非ASCII文本。' }, correct: false }
      - { text: { en: 'NFKC always produces invalid UTF-16.', zh: 'NFKC总会生成无效UTF-16。' }, correct: false }
      - { text: { en: 'NFC and NFKC are guaranteed to produce identical output.', zh: 'NFC与NFKC保证产生相同输出。' }, correct: false }
    explanation: { en: 'NFC resolves canonical equivalence, while NFKC also applies compatibility decomposition. The broader equality can be intentional for one search policy but destructive for stored display text or identifiers.', zh: 'NFC处理规范等价，NFKC还会执行兼容分解。更宽的等价关系可能适合某项搜索策略，却会破坏存储的显示文本或标识符。' }
    difficulty: intermediate
    tags: [normalization, nfc, nfkc]
    minutes: 3

  - id: collation-is-not-identity
    type: mcq
    prompt: { en: 'A French Intl.Collator with sensitivity: "base" returns 0 for two account names. What can the application conclude?', zh: '使用sensitivity: "base" 的法语Intl.Collator比较两个账户名称并返回0。应用可以得出什么结论？' }
    options:
      - { text: { en: 'They compare as equivalent for that display collation policy only.', zh: '它们只在该显示排序策略下比较等价。' }, correct: true }
      - { text: { en: 'They are the same account and may be merged.', zh: '它们属于同一账户，可以合并。' }, correct: false }
      - { text: { en: 'Their UTF-8 byte sequences are identical.', zh: '它们的UTF-8字节序列完全相同。' }, correct: false }
      - { text: { en: 'They are canonically equivalent under NFC.', zh: '它们在NFC下规范等价。' }, correct: false }
    explanation: { en: 'Collation equality depends on locale and options and can ignore case or accents. Identity and authorization need a separate, specification-defined comparison key.', zh: '排序等价取决于区域与选项，可能忽略大小写或重音。身份与授权需要另一套由规范定义的比较键。' }
    difficulty: intermediate
    tags: [collation, identity, intl]
    minutes: 3

  - id: review-generated-customer-import
    type: review
    title: { en: 'Review a generated customer importer', zh: '审查生成的客户导入器' }
    prompt: { en: 'Review this generated code before importing customer names.', zh: '在导入客户姓名前审查这段生成代码。' }
    task: { en: 'Strictly decode UTF-8 payloads, preserve each original display name, enforce a 30-grapheme limit, deduplicate by an NFC comparison key, sort for French display, and render names as text.', zh: '严格解码UTF-8载荷，保留每个原始显示名称，执行30字素限制，按NFC比较键去重，按法语显示顺序排序，并把姓名作为文本渲染。' }
    code: |
      function importCustomers(payloads, container) {
        const customers = [];

        for (const payload of payloads) {
          const name = new TextDecoder().decode(payload);
          if (name.length > 30) throw new Error("name too long");
          const key = name.toLocaleLowerCase().normalize("NFKC");

          if (customers.some((customer) => customer.key === key)) continue;
          customers.push({ name: key, key });
        }

        const collator = new Intl.Collator();
        customers.sort((left, right) => collator.compare(left.name, right.name));

        container.innerHTML = customers
          .map((customer) => `<li>${customer.name}</li>`)
          .join("");

        return customers;
      }
    lang: javascript
    issues:
      - line: 5
        kind: edge-case
        note: { en: 'The default decoder replaces malformed UTF-8. Use TextDecoder with fatal: true and surface or quarantine invalid payloads.', zh: '默认解码器会替换畸形UTF-8。应使用设置fatal: true的TextDecoder，并报告或隔离无效载荷。' }
      - line: 6
        kind: correctness
        note: { en: 'length counts UTF-16 code units instead of grapheme clusters, so valid names can be rejected under the stated 30-grapheme contract.', zh: 'length计算UTF-16代码单元而不是字素簇，因此符合30字素契约的姓名也可能被错误拒绝。' }
      - line: 9
        kind: performance
        note: { en: 'Scanning all prior customers for every payload makes deduplication quadratic. Keep normalized keys in a Set or Map.', zh: '每个载荷都扫描之前的所有客户，使去重成本呈二次增长。应把规范化键保存在Set或Map中。' }
      - line: 16
        kind: security
        note: { en: 'Customer-controlled text reaches innerHTML, allowing markup injection. Create elements and assign textContent instead.', zh: '客户可控文本进入innerHTML，可能造成标记注入。应创建元素并设置textContent。' }
    right: { en: 'The code keeps import, deduplication, sorting, and rendering stages visible, uses a derived key rather than comparing raw names, and returns structured customer records.', zh: '代码清楚展示了导入、去重、排序与渲染阶段，使用派生键而不是直接比较原始姓名，并返回结构化客户记录。' }
    checklist:
      - { en: 'Name the unit used by every limit, slice, and offset.', zh: '写明每项限制、切片和偏移使用的单位。' }
      - { en: 'Verify decoding failure and normalization collision policies with adversarial fixtures.', zh: '用对抗性夹具验证解码失败与规范化碰撞策略。' }
      - { en: 'Keep original text, comparison keys, and display collation as separate values or policies.', zh: '把原始文本、比较键和显示排序保留为不同值或策略。' }
      - { en: 'Trace untrusted text to a text-only rendering sink.', zh: '跟踪不可信文本，确保它进入纯文本渲染接收点。' }
    explanation: { en: 'Use fatal UTF-8 decoding, count segments from a French grapheme Segmenter, store the original name beside an NFC key in a Map, construct a French Collator explicitly, and render through textContent. These changes preserve data while making every equivalence boundary explicit.', zh: '应使用严格失败的UTF-8解码，借助法语字素Segmenter计数，把原始姓名与NFC键一起存入Map，明确创建法语Collator，并通过textContent渲染。这些修改能保留数据，也让每个等价边界清晰可见。' }
    difficulty: advanced
    tags: [code-review, unicode, normalization, xss]
    tests: node --check generated_customer_import.js
    minutes: 12
