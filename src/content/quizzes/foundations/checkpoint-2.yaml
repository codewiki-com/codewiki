topic: foundations/checkpoint-2
items:
  - id: checkpoint-2-text-unit
    type: mcq
    prompt: { en: 'A UI limits a display name to 20 user-perceived characters. Which unit should it count?', zh: '界面把显示名称限制为20个用户感知字符。应按哪种单位计数？' }
    options:
      - { text: { en: 'Extended grapheme clusters', zh: '扩展字素簇' }, correct: true }
      - { text: { en: 'UTF-8 bytes', zh: 'UTF-8字节' }, correct: false }
      - { text: { en: 'UTF-16 code units', zh: 'UTF-16代码单元' }, correct: false }
    explanation: { en: 'A visible character can contain multiple code points and storage units. Grapheme segmentation approximates the boundaries users perceive for editing and counting.', zh: '一个可见字符可能包含多个码点和多个存储单元。字素分割能近似得到用户在编辑和计数时感知的字符边界。' }
    difficulty: beginner
    tags: [checkpoint]
  - id: checkpoint-2-normalization
    type: fill
    prompt: { en: 'Name the Unicode normalization form that canonically decomposes and then recomposes text where possible.', zh: '写出先进行规范分解、再尽可能重新组合文本的Unicode规范化形式。' }
    answer: 'NFC'
    explanation: { en: 'NFC produces a canonical composed form. It can align canonically equivalent spellings, but it is not sanitization or a universal identity policy.', zh: 'NFC会生成规范组合形式。它可以统一规范等价的写法，但不能替代清理流程，也不是通用的身份判定策略。' }
    difficulty: beginner
    tags: [checkpoint]
  - id: checkpoint-2-full-match
    type: mcq
    prompt: { en: 'Which validation rule prevents a regular expression from accepting a valid-looking substring inside otherwise invalid input?', zh: '哪条验证规则能防止正则表达式在整体无效的输入中仅匹配一个看似有效的子串？' }
    options:
      - { text: { en: 'Require the match to consume the entire input.', zh: '要求匹配消费整个输入。' }, correct: true }
      - { text: { en: 'Add more capturing groups around the existing pattern.', zh: '在现有模式外添加更多捕获组。' }, correct: false }
      - { text: { en: 'Run the same unanchored search twice.', zh: '把同一个未锚定搜索运行两次。' }, correct: false }
    explanation: { en: 'Validation is an whole-input contract, so the pattern or matching API must reject unmatched prefixes and suffixes.', zh: '验证是针对完整输入的约定，因此模式或匹配API必须拒绝未匹配的前缀和后缀。' }
    difficulty: beginner
    tags: [checkpoint]
  - id: checkpoint-2-backtracking
    type: fill
    prompt: { en: 'Name the failure mode in which ambiguous nested repetition makes a backtracking regular-expression engine explore exponentially many paths.', zh: '写出这种失败模式：含糊的嵌套重复使回溯型正则表达式引擎探索指数级数量的路径。' }
    answer: 'catastrophic backtracking'
    explanation: { en: 'Catastrophic backtracking is triggered especially by long near-misses; removing ambiguous alternatives and bounding input reduces the risk.', zh: '灾难性回溯尤其容易被很长的近似匹配输入触发；消除含糊分支并限制输入长度可以降低风险。' }
    difficulty: intermediate
    tags: [checkpoint]
  - id: checkpoint-2-float-output
    type: mcq
    prompt: { en: 'In JavaScript, which result does `0.1 + 0.2 === 0.3` produce?', zh: '在JavaScript中，`0.1 + 0.2 === 0.3`会得到什么结果？' }
    options:
      - { text: { en: '`false`, because these decimal fractions are rounded to binary floating-point approximations.', zh: '`false`，因为这些十进制小数会舍入为二进制浮点近似值。' }, correct: true }
      - { text: { en: '`true`, because all literals have one decimal place.', zh: '`true`，因为所有字面量都只有一位小数。' }, correct: false }
      - { text: { en: '`NaN`, because decimal fractions are unsupported.', zh: '`NaN`，因为系统不支持十进制小数。' }, correct: false }
    explanation: { en: 'Most decimal fractions are not exactly representable in binary floating point, and rounding across the two operations leaves unequal stored values.', zh: '大多数十进制小数无法用二进制浮点数精确表示，两次运算产生的舍入使最终存储值并不相等。' }
    difficulty: intermediate
    tags: [checkpoint]
  - id: checkpoint-2-nonfinite-check
    type: fill
    prompt: { en: 'Name the JavaScript predicate that accepts only finite numbers without coercing its argument.', zh: '写出JavaScript中只接受有限数值且不会强制转换参数的判断函数。' }
    answer: 'Number.isFinite'
    explanation: { en: '`Number.isFinite` rejects `NaN`, infinities, and non-number values, making the numeric boundary explicit.', zh: '`Number.isFinite`会拒绝`NaN`、无穷值和非数值类型，从而明确数值边界。' }
    difficulty: intermediate
    tags: [checkpoint]
  - id: checkpoint-2-time-contract
    type: mcq
    prompt: { en: 'Which design correctly handles elapsed deadlines and future local appointments?', zh: '哪种设计能正确处理经过时长截止时间和未来的本地预约？' }
    options:
      - { text: { en: 'Use a monotonic clock for elapsed deadlines and retain a named time zone plus civil-time intent for appointments.', zh: '经过时长截止时间使用单调时钟，预约则保留命名时区与民用时间意图。' }, correct: true }
      - { text: { en: 'Use the current UTC offset as a permanent time zone for both.', zh: '把当前UTC偏移量当作永久时区，同时用于两者。' }, correct: false }
      - { text: { en: 'Assume every local calendar day is exactly 24 elapsed hours.', zh: '假设每个本地日历日都恰好经过24小时。' }, correct: false }
    explanation: { en: 'Monotonic time cannot jump with wall-clock corrections, while a named zone retains daylight-saving and rule-change context for civil appointments.', zh: '单调时间不会随墙上时钟校正而跳变；命名时区则能为民用预约保留夏令时和规则变更信息。' }
    difficulty: advanced
    tags: [checkpoint]
  - id: checkpoint-2-message-grammar
    type: mcq
    prompt: { en: 'Which localization approach preserves grammar across languages with different plural rules and word order?', zh: '面对复数规则和语序不同的语言，哪种本地化方式能保留正确语法？' }
    options:
      - { text: { en: 'Translate complete parameterized messages and select them with locale-aware plural rules.', zh: '翻译完整的参数化消息，并使用区域设置感知的复数规则选择消息。' }, correct: true }
      - { text: { en: 'Translate fragments independently and concatenate them in source-language order.', zh: '分别翻译各个片段，再按源语言语序拼接。' }, correct: false }
      - { text: { en: 'Store already formatted dates and numbers as the canonical data.', zh: '把已经格式化的日期和数字作为规范数据存储。' }, correct: false }
    explanation: { en: 'Complete messages give translators control over grammar and order, while locale-aware selection handles categories that are not a simple singular/plural split.', zh: '完整消息让译者能够控制语法与语序；区域设置感知的选择规则可以处理并非简单单复数二分的类别。' }
    difficulty: advanced
    tags: [checkpoint]
