topic: foundations/pipes-and-redirection
items:
  - id: predict-redirection-order
    type: predict
    prompt: { en: 'What does this Bash script print?', zh: '这段Bash脚本会输出什么？' }
    code: |
      emit() {
        printf '%s\n' 'result'
        printf '%s\n' 'warning' >&2
      }
      emit 2>&1 >/dev/null | sed 's/^/seen: /'
    lang: bash
    options:
      - { text: { en: 'seen: result', zh: 'seen: result' }, correct: false }
      - { text: { en: 'seen: warning', zh: 'seen: warning' }, correct: true }
      - { text: { en: "seen: result\nseen: warning", zh: "seen: result\nseen: warning" }, correct: false }
      - { text: { en: 'It prints nothing.', zh: '没有任何输出。' }, correct: false }
    explanation: { en: '`2>&1` first attaches standard error to the pipe that is currently standard output. `>/dev/null` then moves only standard output, so the pipe receives `warning`.', zh: '`2>&1`先把标准错误接到标准输出当时指向的管道，`>/dev/null`随后只移动标准输出，因此管道收到`warning`。' }
    difficulty: intermediate
    tags: [redirection, file-descriptors, predict-output]
    tests: bash predict_redirection_order.sh
    minutes: 4

  - id: pipeline-status-policy
    type: mcq
    prompt: { en: 'In Bash, `producer | consumer` runs with `pipefail` disabled. The producer exits 7 and the consumer exits 0. What is the pipeline status?', zh: '在未启用`pipefail`的Bash中运行`producer | consumer`。生产者以7退出，消费者以0退出，管道状态是什么？' }
    options:
      - { text: { en: '0, because the last stage succeeded', zh: '0，因为最后一个阶段成功' }, correct: true }
      - { text: { en: '7, because the first failure always wins', zh: '7，因为总是采用第一个失败' }, correct: false }
      - { text: { en: '1, because every pipeline normalizes failures', zh: '1，因为每条管道都会归一化失败' }, correct: false }
      - { text: { en: '14, because the two statuses are added', zh: '14，因为两个状态会相加' }, correct: false }
    explanation: { en: 'Without `pipefail`, Bash uses the last stage status for the pipeline. With `pipefail`, this case would produce 7.', zh: '未启用`pipefail`时，Bash使用最后一个阶段的状态；启用后，这个例子的结果才会是7。' }
    difficulty: intermediate
    tags: [pipeline, pipefail, exit-status]
    minutes: 3

  - id: spot-mixed-export-streams
    title: { en: 'Spot the bug in the export pipeline', zh: '找出导出管道里的bug' }
    type: spotbug
    prompt: { en: 'Find the data-integrity and status bugs in this generated export pipeline.', zh: '找出这段生成的导出管道在数据完整性和状态处理上的错误。' }
    code: |
      set -o pipefail
      export_rows() {
        printf '%s\n' '{"id":104}'
        printf '%s\n' 'warning: stale replica' >&2
        return 6
      }
      export_rows 2>&1 | tee export.log | jq -s '.' > export.json
      printf 'saved %s\n' "$?"
      stages=("${PIPESTATUS[@]}")
    lang: bash
    issues:
      - line: 7
        kind: correctness
        note: { en: '`2>&1` inserts the warning into the JSON data stream, so `jq` receives a non-JSON record.', zh: '`2>&1`把警告插入JSON数据流，导致`jq`收到一条非JSON记录。' }
      - line: 8
        kind: edge-case
        note: { en: 'Printing `$?` runs another pipeline before `PIPESTATUS` is copied, so the individual stage statuses are lost.', zh: '打印`$?`会在复制`PIPESTATUS`前运行另一条管道，因此各阶段状态已经丢失。' }
    explanation: { en: 'Keep diagnostics separate from the JSON channel and copy `PIPESTATUS` as the first command after the pipeline. Report or publish the artifact only after applying the declared stage-status policy.', zh: '应让诊断与JSON通道保持分离，并把复制`PIPESTATUS`作为管道后的第一条命令；只有按既定阶段状态策略检查成功后，才能报告或发布产物。' }
    difficulty: intermediate
    tags: [standard-error, pipestatus, data-integrity]
    tests: bash -n mixed_export_streams.sh
    minutes: 7

  - id: command-substitution-contract
    type: mcq
    prompt: { en: 'Which statement about `value=$(command)` in Bash is correct?', zh: '关于Bash中的`value=$(command)`，哪项说法正确？' }
    options:
      - { text: { en: 'It preserves every trailing newline and NUL byte.', zh: '它会保留每个末尾换行符和NUL字节。' }, correct: false }
      - { text: { en: 'It captures standard error and discards standard output.', zh: '它捕获标准错误并丢弃标准输出。' }, correct: false }
      - { text: { en: 'It captures standard output but removes trailing newlines; later expansions still need quoting.', zh: '它捕获标准输出但删除末尾换行符，之后展开时仍需引用。' }, correct: true }
      - { text: { en: 'It automatically fails if the output is empty.', zh: '输出为空时，它会自动失败。' }, correct: false }
    explanation: { en: 'Command substitution is suitable for a small documented text value, not exact or binary data. Standard error remains separate unless it is explicitly redirected.', zh: '命令替换适合契约明确的小型文本值，不适合精确或二进制数据；除非显式重定向，否则标准错误仍保持独立。' }
    difficulty: intermediate
    tags: [command-substitution, quoting, data-integrity]
    minutes: 3

  - id: pipe-eof-condition
    type: mcq
    prompt: { en: 'When does a blocking pipe reader observe end-of-file?', zh: '阻塞式管道读取方何时会观察到文件结束？' }
    options:
      - { text: { en: 'As soon as the first producer process exits', zh: '第一个生产者进程退出后立即发生' }, correct: false }
      - { text: { en: 'Whenever the pipe buffer is temporarily empty', zh: '管道缓冲区暂时为空时' }, correct: false }
      - { text: { en: 'After every descriptor referring to the write end has closed', zh: '引用写入端的每个描述符都关闭后' }, correct: true }
      - { text: { en: 'Only after the reader receives SIGPIPE', zh: '只有读取方收到SIGPIPE后' }, correct: false }
    explanation: { en: 'An empty buffer is not EOF while any write-end descriptor remains open. An inherited duplicate can therefore keep a reader blocked after the apparent producer exits.', zh: '只要仍有写入端描述符打开，空缓冲区就不代表EOF；因此，继承的副本可能让读取方在表面上的生产者退出后继续阻塞。' }
    difficulty: advanced
    tags: [pipe, eof, file-descriptors]
    minutes: 4

  - id: review-generated-export
    title: { en: 'Review a generated export pipeline', zh: '审查生成的导出管道' }
    type: review
    prompt: { en: 'Review this AI-generated script against its stated task.', zh: '根据给定任务审查这段AI生成的脚本。' }
    task: { en: 'Combine JSON event files from one allowlisted input directory into a gzip archive, keep diagnostics separate, publish atomically only after every stage succeeds, and print the verified record count.', zh: '把一个允许列表输入目录中的JSON事件文件合并为gzip归档，保持诊断独立，仅在每个阶段成功后原子发布，并打印经过验证的记录数。' }
    code: |
      #!/usr/bin/env bash
      set -e

      INPUT_DIR=$1
      OUTPUT=$2

      mkdir -p $(dirname $OUTPUT)

      collect() {
        for file in $(find $INPUT_DIR -type f -name '*.json'); do
          cat $file
        done
      }

      collect 2>&1 | jq -s '.' | gzip > $OUTPUT
      echo "archive ready" | tee -a $OUTPUT.log

      count=$(gzip -dc $OUTPUT | jq 'length')
      if [ $count -gt 0 ]; then
        printf 'published %s records\n' "$count"
      else
        printf 'no records\n'
      fi
    lang: bash
    right: { en: 'The script separates collection into a named function, uses `jq` to construct one JSON array, compresses the result, performs a read-back count, and quotes `count` in the final `printf`.', zh: '脚本把收集逻辑放进具名函数，使用`jq`构造一个JSON数组，压缩结果，随后回读计数，并在最终`printf`中引用了`count`。' }
    checklist:
      - { en: 'Validate and quote the allowlisted input root, output path, and every discovered filename.', zh: '验证并引用允许列表输入根目录、输出路径和每个发现的文件名。' }
      - { en: 'Keep diagnostics outside the JSON stream and define framing for every input file.', zh: '让诊断留在JSON流之外，并定义每个输入文件的分帧方式。' }
      - { en: 'Capture every pipeline stage status before another command and reject partial results.', zh: '在另一条命令运行前捕获每个管道阶段的状态，并拒绝部分结果。' }
      - { en: 'Write a same-filesystem temporary artifact, verify it, then atomically rename it into place.', zh: '先写入同一文件系统中的临时产物，验证后再原子重命名到目标位置。' }
    issues:
      - line: 4
        kind: security
        note: { en: 'The script accepts any readable input directory and any writable output path instead of enforcing the task’s allowlisted roots.', zh: '脚本接受任意可读输入目录和任意可写输出路径，没有强制执行任务要求的允许列表根目录。' }
      - line: 7
        kind: readability
        note: { en: 'Nested command substitution and unquoted path expansions hide the separate directory derivation and validation steps.', zh: '嵌套命令替换与未引用路径展开掩盖了目录推导和验证这两个独立步骤。' }
      - line: 11
        kind: performance
        note: { en: 'Starting one `cat` process per file adds avoidable process overhead for a large event set.', zh: '为每个文件启动一个`cat`进程，会在事件文件很多时产生可避免的进程开销。' }
      - line: 15
        kind: correctness
        note: { en: 'Merging diagnostics corrupts JSON, missing `pipefail` hides earlier failures, and writing the destination directly exposes a partial artifact.', zh: '合入诊断会破坏JSON，缺少`pipefail`会隐藏早期失败，直接写入目标还会暴露部分产物。' }
      - line: 18
        kind: edge-case
        note: { en: 'The verification pipeline can hide a failed `gzip`, produce an empty count, and then feed a missing operand to the numeric test.', zh: '验证管道可能隐藏失败的`gzip`，产生空计数，再把缺失的操作数交给数值测试。' }
    explanation: { en: 'Validate fixed roots and stream only selected files with a filename-safe mechanism. Keep standard error separate, enable and inspect stage-aware failure handling, write to a temporary file, verify decompression and count, then rename the complete artifact into place.', zh: '应验证固定根目录，并通过文件名安全的机制只传输选定文件。保持标准错误独立，启用并检查阶段感知的失败处理，写入临时文件，验证解压与计数，再把完整产物重命名到目标位置。' }
    difficulty: advanced
    tags: [code-review, pipelines, security, atomic-publish]
    tests: bash -n generated_export.sh
    minutes: 15
