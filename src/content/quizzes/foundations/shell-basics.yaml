topic: foundations/shell-basics
items:
  - id: predict-quoted-expansion
    type: predict
    prompt: { en: 'What does this Bash program print?', zh: '这段Bash程序会输出什么？' }
    code: |
      show_count() {
        printf 'count=%d first=<%s>\n' "$#" "$1"
      }

      label='Q1 report'
      show_count "$label"
      show_count $label
    lang: bash
    options:
      - { text: { en: 'count=1 first=<Q1 report>\ncount=2 first=<Q1>', zh: 'count=1 first=<Q1 report>\ncount=2 first=<Q1>' }, correct: true }
      - { text: { en: 'count=1 first=<Q1 report>\ncount=1 first=<Q1 report>', zh: 'count=1 first=<Q1 report>\ncount=1 first=<Q1 report>' }, correct: false }
      - { text: { en: 'count=2 first=<Q1>\ncount=2 first=<Q1>', zh: 'count=2 first=<Q1>\ncount=2 first=<Q1>' }, correct: false }
      - { text: { en: 'It raises a syntax error.', zh: '程序会产生语法错误。' }, correct: false }
    explanation: { en: 'Double quotes preserve the expanded label as one argument. Without quotes, default word splitting turns it into Q1 and report, so the function receives two arguments.', zh: '双引号让展开后的label保持为一个参数。没有引号时，默认单词拆分会生成Q1与report，因此函数收到两个参数。' }
    difficulty: beginner
    tags: [shell, quoting, predict-output]
    tests: bash predict_quoted_expansion.sh
    minutes: 3

  - id: forward-positional-parameters
    type: mcq
    prompt: { en: 'Which expansion forwards all positional parameters while preserving each original argument, including empty values?', zh: '哪种展开可以转发全部位置参数，并保留每个原始参数及其中的空值？' }
    options:
      - { text: { en: '"$@"', zh: '"$@"' }, correct: true }
      - { text: { en: '$@', zh: '$@' }, correct: false }
      - { text: { en: '"$*"', zh: '"$*"' }, correct: false }
      - { text: { en: '$*', zh: '$*' }, correct: false }
    explanation: { en: 'Inside double quotes, $@ expands each positional parameter as a separate word. The other forms either join parameters or expose them to splitting and pathname expansion.', zh: '位于双引号内时，$@ 会把每个位置参数展开成独立单词。其他形式会连接参数，或者让参数继续参与拆分与路径名展开。' }
    difficulty: beginner
    tags: [shell, positional-parameters, quoting]
    minutes: 3

  - id: capture-exit-status
    type: mcq
    prompt: { en: 'When should a script save the special parameter whose name is `$?`?', zh: '脚本应在什么时候保存名为`$?`的特殊参数？' }
    options:
      - { text: { en: 'Immediately after that command, before logging or testing anything else', zh: '紧跟在该命令之后，并且早于任何日志或其他测试' }, correct: true }
      - { text: { en: 'After printing a diagnostic message', zh: '打印诊断消息之后' }, correct: false }
      - { text: { en: 'Only at the end of the script', zh: '只在脚本末尾捕获' }, correct: false }
      - { text: { en: 'Before running the command', zh: '运行命令之前' }, correct: false }
    explanation: { en: '$? is replaced whenever another foreground pipeline completes. Capture it as the next simple command or put the checked command directly in an if condition.', zh: '每当另一条前台管道结束时，$? 都会被替换。应让捕获成为紧随其后的简单命令，或直接把待检查命令放入if条件。' }
    difficulty: beginner
    tags: [shell, exit-status, control-flow]
    minutes: 3

  - id: spot-command-string
    title: { en: 'Spot the bug in the copy helper', zh: '找出复制辅助函数里的bug' }
    type: spotbug
    prompt: { en: 'Find the argument-boundary and injection bugs in this generated copy helper.', zh: '找出这个生成的复制辅助函数中的参数边界与注入错误。' }
    code: |
      copy_project() {
        source_dir=$1
        backup_dir=$2
        command="cp -R $source_dir $backup_dir"
        printf 'running: %s\n' "$command"
        eval "$command"
      }

      copy_project "$1" "$2"
    lang: bash
    issues:
      - line: 2
        kind: edge-case
        note: { en: 'Missing arguments are not validated, so an unset or empty source can reach a mutating command with unintended meaning.', zh: '代码没有校验缺失参数，因此未设置或为空的源路径可能以意外含义进入修改命令。' }
      - line: 4
        kind: correctness
        note: { en: 'Flattening the two paths into one string loses their argument boundaries when either path contains whitespace.', zh: '把两个路径压成一个字符串后，只要路径包含空白，原有参数边界就会丢失。' }
      - line: 6
        kind: security
        note: { en: 'eval parses path data as shell source, so substitutions and operators in an input can execute commands.', zh: 'eval会把路径数据解析成Shell源代码，因此输入中的替换与运算符可能执行命令。' }
    explanation: { en: 'Validate both inputs, then execute an array such as command=(cp -R -- "$source_dir" "$backup_dir") with "${command[@]}". Logging should render arguments for diagnostics without re-executing that rendering.', zh: '应先校验两个输入，再构造command=(cp -R -- "$source_dir" "$backup_dir")，并通过 "${command[@]}" 执行。日志可以渲染参数用于诊断，但不能再次执行渲染结果。' }
    difficulty: intermediate
    tags: [shell, eval, command-injection, arguments]
    tests: bash -n generated_copy.sh
    minutes: 6

  - id: child-environment-change
    type: mcq
    prompt: { en: 'A script exports REGION=eu and starts a child process. The child changes REGION to us. What does the parent see afterward?', zh: '脚本导出REGION=eu并启动子进程，子进程把REGION改成us。之后父进程看到什么？' }
    options:
      - { text: { en: 'REGION remains eu in the parent.', zh: '父进程中的REGION仍然是eu。' }, correct: true }
      - { text: { en: 'REGION becomes us in the parent.', zh: '父进程中的REGION变成us。' }, correct: false }
      - { text: { en: 'REGION is deleted from the parent.', zh: '父进程中的REGION被删除。' }, correct: false }
      - { text: { en: 'The child cannot read REGION.', zh: '子进程无法读取REGION。' }, correct: false }
    explanation: { en: 'Export includes the value in the child''s inherited environment. The child owns its process state and cannot rewrite the parent''s variable after startup.', zh: '导出会把该值放入子进程继承的环境。子进程拥有自己的进程状态，启动后无法改写父进程变量。' }
    difficulty: beginner
    tags: [shell, environment, processes]
    minutes: 3

  - id: review-generated-report-archive
    type: review
    title: { en: 'Review a generated report archiver', zh: '审查生成的报告归档脚本' }
    prompt: { en: 'Review this generated Bash script against its stated task before it runs in CI.', zh: '在CI中运行前，请根据给定任务审查这个生成的Bash脚本。' }
    task: { en: 'Create one archive from CSV files under an allowlisted report directory, preserve filenames exactly, create a valid empty archive when no files match, and leave source data unchanged.', zh: '从允许列表内的报告目录中把CSV文件创建为一个归档，准确保留文件名；没有匹配项时也创建有效空归档，并保持源数据不变。' }
    code: |
      #!/usr/bin/env bash
      set -e

      report_dir=$1
      archive=$2
      files=""

      for file in $(find $report_dir -type f -name '*.csv'); do
        files="$files $file"
      done

      if [ -z "$files" ]; then
        echo "no reports"
        exit 0
      fi

      tar -czf $archive $files
      echo "created $archive"
      cache_dir="$report_dir/cache"
      rm -rf "$cache_dir"/*
      echo "cache cleared"
    lang: bash
    issues:
      - line: 4
        kind: security
        note: { en: 'The report directory is accepted without an allowlist or scope check before it influences both traversal and recursive deletion.', zh: '报告目录未经允许列表或范围校验，就同时影响遍历与递归删除。' }
      - line: 8
        kind: correctness
        note: { en: 'Unquoted command substitution and find output split filenames on whitespace and expand wildcard characters, so archive operands do not preserve names.', zh: '未引用的命令替换与find输出会按空白拆分文件名，并展开通配符字符，因此归档操作数无法保留名称。' }
      - line: 12
        kind: edge-case
        note: { en: 'The no-match branch exits without creating the required valid empty archive.', zh: '无匹配项分支直接退出，没有按要求创建有效的空归档。' }
      - line: 5
        kind: readability
        note: { en: 'Unnamed positional arguments provide no usage contract and make required validation and destination rules difficult to discover.', zh: '没有名称的位置参数不提供使用契约，使必需的校验与目标规则难以发现。' }
    right: { en: 'The script selects only regular CSV files, separates its discovery and archive phases, reports the archive destination, and stops when an unhandled simple command fails.', zh: '脚本只选择普通CSV文件，把发现阶段与归档阶段分开，会报告归档目标，并在未处理的简单命令失败时停止。' }
    checklist:
      - { en: 'Validate the source allowlist, output location, and empty or missing arguments before any traversal.', zh: '遍历前校验源目录允许列表、输出位置，以及空参数或缺失参数。' }
      - { en: 'Trace filenames through discovery and tar as NUL-safe, separately quoted arguments.', zh: '追踪文件名经过发现与tar的过程，确保使用NUL安全接口并保持独立引用参数。' }
      - { en: 'Test no matches, spaces, newlines, wildcard characters, and leading-hyphen names.', zh: '测试无匹配项、空格、换行、通配符字符与前导连字符名称。' }
      - { en: 'Verify failure status and confirm that no source or cache data is deleted.', zh: '验证失败状态，并确认没有删除任何源数据或缓存数据。' }
    explanation: { en: 'Validate the two locations, collect records with a NUL-safe interface or archive directly from a controlled working directory, and explicitly create the empty case. Remove the cache deletion because it is outside the task and turns an archive operation into destructive automation.', zh: '应校验两个位置，通过NUL安全接口收集记录，或者从受控工作目录直接归档，并显式处理空归档。还应删除清理缓存的逻辑，因为它超出任务范围，把归档操作变成了破坏性自动化。' }
    difficulty: intermediate
    minutes: 10
    tags: [code-review, shell, filenames, exit-status]
    tests: bash -n generated_report_archive.sh
