topic: foundations/git-deep-dive
items:
  - id: predict-three-git-states
    type: predict
    prompt: { en: 'After committing 10, staging 20, and editing 30, what does this script print?', zh: '提交 10、暂存 20，再编辑为 30 后，这段脚本输出什么？' }
    code: |
      repo=$(mktemp -d)
      trap 'rm -rf "$repo"' EXIT
      git -C "$repo" init -q --initial-branch=main
      git -C "$repo" config user.name CodeWiki
      git -C "$repo" config user.email editor@example.com
      printf '10\n' > "$repo/value.txt"
      git -C "$repo" add value.txt
      git -C "$repo" commit -qm initial
      printf '20\n' > "$repo/value.txt"
      git -C "$repo" add value.txt
      printf '30\n' > "$repo/value.txt"
      git -C "$repo" show HEAD:value.txt
      git -C "$repo" show :value.txt
      sed -n '1p' "$repo/value.txt"
    lang: bash
    options:
      - { text: { en: "10\n20\n30", zh: "10\n20\n30" }, correct: true }
      - { text: { en: "10\n30\n30", zh: "10\n30\n30" }, correct: false }
      - { text: { en: "20\n20\n30", zh: "20\n20\n30" }, correct: false }
      - { text: { en: "30\n30\n30", zh: "30\n30\n30" }, correct: false }
    explanation: { en: '`HEAD` contains the committed blob, the index keeps the content read by the last `git add`, and the working tree contains the later edit.', zh: '`HEAD` 包含已提交的 blob，索引保留最近一次 `git add` 读取的内容，工作树则包含之后的编辑。' }
    difficulty: beginner
    tags: [index, working-tree, predict-output]
    tests: sh three_git_states.sh
    minutes: 4

  - id: tree-stores-paths
    type: mcq
    prompt: { en: 'Which Git object associates `src/app.js` with its content object and file mode?', zh: '哪类 Git 对象把 `src/app.js` 与其内容对象和文件模式关联起来？' }
    options:
      - { text: { en: 'Blob', zh: 'Blob' }, correct: false }
      - { text: { en: 'Tree', zh: 'Tree' }, correct: true }
      - { text: { en: 'Commit', zh: 'Commit' }, correct: false }
      - { text: { en: 'Reflog', zh: 'Reflog' }, correct: false }
    explanation: { en: 'A blob stores content without a path. Tree entries carry names and modes and point to blobs, subtrees, or submodule commits.', zh: 'Blob 保存内容但不保存路径；tree 条目携带名称与模式，并指向 blob、子 tree 或子模块提交。' }
    difficulty: beginner
    tags: [objects, tree, blob]
    minutes: 3

  - id: spot-unsafe-sync
    type: spotbug
    prompt: { en: 'Find the scope and history-safety bugs in this generated synchronization snippet.', zh: '找出这段生成的同步脚本在范围与历史安全方面的问题。' }
    code: |
      git add .
      git commit -m "sync generated changes"
      git fetch origin
      git rebase origin/main
      git push --force origin HEAD:main
    lang: bash
    issues:
      - line: 1
        kind: security
        note: { en: 'Staging the whole worktree without reviewing the diff can include credentials, build artifacts, or unrelated user changes.', zh: '不审查差异就暂存整个工作树，可能把凭据、构建产物或用户的无关修改纳入提交。' }
      - line: 5
        kind: correctness
        note: { en: 'An unconditional force push can overwrite a newer remote main and removes the chance to inspect a lease failure.', zh: '无条件强制推送可能覆盖更新的远端 main，也失去了在租约失败时重新检查的机会。' }
    explanation: { en: 'Review and stage explicit paths, determine whether rewriting this branch is allowed, and publish with a verified expected old ref plus server protection. A fetch alone does not authorize rebasing or force-pushing `main`.', zh: '应审查并暂存明确路径，确认该分支是否允许重写，再结合已验证的旧引用与服务端保护进行发布。仅仅执行 fetch，并不构成变基或强推 `main` 的授权。' }
    difficulty: intermediate
    tags: [staging, rebase, force-push]
    tests: sh -n unsafe_sync.sh
    minutes: 7

  - id: choose-shared-undo
    type: mcq
    prompt: { en: 'A bad commit is already on a protected branch used by teammates. Which default recovery preserves shared history?', zh: '错误提交已经位于队友使用的受保护分支。默认采用哪种恢复方式可以保留共享历史？' }
    options:
      - { text: { en: 'Run `git reset --hard HEAD^` and force-push.', zh: '执行 `git reset --hard HEAD^` 并强制推送。' }, correct: false }
      - { text: { en: 'Delete and recreate the protected branch.', zh: '删除并重建受保护分支。' }, correct: false }
      - { text: { en: 'Create and review a `git revert` commit.', zh: '创建并审查一个 `git revert` 提交。' }, correct: true }
      - { text: { en: 'Expire all reflogs, then recommit the files.', zh: '让所有 reflog 过期，再重新提交文件。' }, correct: false }
    explanation: { en: '`git revert` adds an inverse change while keeping the published commit graph intact. It can still conflict and must be reviewed and tested.', zh: '`git revert` 新增反向修改，同时保持已发布提交图不变。它仍可能产生冲突，也必须经过审查和测试。' }
    difficulty: intermediate
    tags: [revert, shared-history, recovery]
    minutes: 3

  - id: review-generated-release-script
    type: review
    prompt: { en: 'Review this AI-generated release helper against its stated task.', zh: '根据给定任务，审查这个 AI 生成的发布辅助脚本。' }
    task: { en: 'Publish an already reviewed branch as a release candidate without staging unrelated files, overwriting collaborator work, or deleting local data.', zh: '把已审查分支发布为候选版本，不暂存无关文件，不覆盖协作者的工作，也不删除本地数据。' }
    code: |
      #!/bin/sh
      set -eu

      branch=$1
      remote=${2:-origin}

      git switch "$branch"
      git add .
      if ! git diff --cached --quiet; then
        git commit -m "Prepare release candidate"
      fi

      git fetch "$remote"
      git rebase "$remote/main"
      git tag -f release-candidate
      git push --force "$remote" "$branch"
      git push --force "$remote" release-candidate

      git clean -fd
      printf 'published %s\n' "$branch"
    lang: bash
    right: { en: 'The script enables fail-fast handling, accepts a branch and remote, quotes both values, fetches before integration, and avoids creating an empty commit.', zh: '脚本启用了快速失败处理，接收分支与远端参数并正确引用，在集成前执行 fetch，也避免创建空提交。' }
    checklist:
      - { en: 'Prove the worktree and index are clean, then stage only reviewed paths.', zh: '确认工作树与索引干净，再只暂存已经审查的路径。' }
      - { en: 'Resolve and verify the branch upstream, rewrite policy, expected remote old ID, and tag ownership.', zh: '解析并验证分支上游、重写策略、预期远端旧标识和标签所有权。' }
      - { en: 'Use protected or atomic ref updates where required, and stop on any lease or policy failure.', zh: '按需使用受保护或原子引用更新，并在任何租约或策略失败时停止。' }
      - { en: 'Keep untracked files intact and verify the final remote refs before reporting success.', zh: '保留未跟踪文件，并在报告成功前验证最终远端引用。' }
    issues:
      - line: 8
        kind: security
        note: { en: '`git add .` can stage secrets and unrelated files even though the task says the branch is already reviewed.', zh: '`git add .` 仍可能暂存密钥和无关文件，而且任务已经说明分支完成审查。' }
      - line: 14
        kind: readability
        note: { en: 'The helper hard-codes `main` and an implicit rebase policy instead of resolving the selected branch upstream and making the rewrite contract explicit.', zh: '辅助脚本硬编码 `main` 和隐含的变基策略，没有解析所选分支的上游，也没有明确重写约定。' }
      - line: 16
        kind: correctness
        note: { en: 'The unconditional force push can overwrite collaborator commits; it has no reviewed expected old ID or lease failure path.', zh: '无条件强制推送可能覆盖协作者提交，也没有经过审查的预期旧标识或租约失败路径。' }
      - line: 19
        kind: edge-case
        note: { en: '`git clean -fd` deletes all untracked files and directories, including valuable local data outside the release task.', zh: '`git clean -fd` 会删除所有未跟踪文件和目录，包括发布任务之外的有价值本地数据。' }
    explanation: { en: 'A safe publisher starts from a clean, reviewed commit, resolves configured upstreams, and uses protected conditional ref updates. It never stages or cleans broad worktree scope as a side effect of publishing, and it verifies the final remote branch and tag before claiming success.', zh: '安全的发布工具从干净且已审查的提交开始，解析配置的上游，并使用受保护的条件式引用更新。它不会把大范围暂存或清理工作树当作发布副作用，而且要在报告成功前验证最终远端分支与标签。' }
    difficulty: advanced
    tags: [code-review, release, references, safety]
    tests: sh -n generated_release.sh
    minutes: 15
