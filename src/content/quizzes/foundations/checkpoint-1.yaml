topic: foundations/checkpoint-1
items:
  - id: checkpoint-1-growth
    type: mcq
    prompt: { en: 'A routine compares every pair among `n` records once. Which time bound describes its dominant growth?', zh: '某例程对 `n` 条记录中的每一对记录比较一次。哪种时间界描述了它的主导增长趋势？' }
    options:
      - { text: { en: '`O(n²)`', zh: '`O(n²)`' }, correct: true }
      - { text: { en: '`O(n)` because each individual comparison is constant-time', zh: '`O(n)`，因为每次比较都是常数时间' }, correct: false }
      - { text: { en: '`O(2n)` because each pair contains two records', zh: '`O(2n)`，因为每一对包含两条记录' }, correct: false }
    explanation: { en: 'The number of distinct pairs is `n(n - 1) / 2`, whose dominant term grows quadratically. Constant-time work per pair does not make the number of pairs linear.', zh: '不同记录对的数量是 `n(n - 1) / 2`，其主导项按平方增长。每对记录上的工作是常数时间，并不意味着记录对的数量是线性的。' }
    difficulty: beginner
    tags: [checkpoint]
  - id: checkpoint-1-indexing
    type: fill
    prompt: { en: 'Give the asymptotic time for indexed access to an array element.', zh: '写出按索引访问数组元素的渐进时间复杂度。' }
    answer: 'O(1)'
    explanation: { en: 'An array computes the element location from its base, index, and stride without walking earlier elements.', zh: '数组根据起始位置、索引和步长直接计算元素位置，无需遍历前面的元素。' }
    difficulty: beginner
    tags: [checkpoint]
  - id: checkpoint-1-binary-search
    type: mcq
    prompt: { en: 'Which condition must hold before binary search can safely discard half of the remaining range?', zh: '二分查找要安全地排除一半剩余区间，必须先满足哪项条件？' }
    options:
      - { text: { en: 'The data is ordered under the same comparator used by the search.', zh: '数据已经按照查找所用的同一个比较器排序。' }, correct: true }
      - { text: { en: 'The collection contains no duplicate values.', zh: '集合中不存在重复值。' }, correct: false }
      - { text: { en: 'The target is known to be present.', zh: '已经知道目标一定存在。' }, correct: false }
    explanation: { en: 'Binary search relies on an ordering invariant shared by the stored data and the search comparisons. Duplicates and absent targets require an explicit result policy but do not invalidate binary search.', zh: '二分查找依赖存储数据与查找比较共享同一个顺序不变量。重复值和目标缺失需要明确结果约定，但不会使二分查找失效。' }
    difficulty: beginner
    tags: [checkpoint]
  - id: checkpoint-1-base-case
    type: fill
    prompt: { en: 'Name the recursive case that returns directly instead of making another recursive call.', zh: '写出递归中直接返回、不再发起递归调用的情形名称。' }
    answer: 'base case'
    explanation: { en: 'A base case stops descent; every recursive path must reach one through a decreasing, well-founded measure.', zh: '基本情形会停止继续深入；每条递归路径都必须通过不断减小的良基度量到达基本情形。' }
    difficulty: intermediate
    tags: [checkpoint]
  - id: checkpoint-1-hash-contract
    type: mcq
    prompt: { en: 'Which rule must a hash-map key implementation preserve?', zh: '哈希映射的键实现必须遵守哪条规则？' }
    options:
      - { text: { en: 'Keys considered equal must produce the same hash value.', zh: '判定为相等的键必须产生相同的哈希值。' }, correct: true }
      - { text: { en: 'Different keys must always produce different hash values.', zh: '不同的键必须始终产生不同的哈希值。' }, correct: false }
      - { text: { en: 'The hash value alone decides whether two keys are equal.', zh: '仅凭哈希值就能判断两个键是否相等。' }, correct: false }
    explanation: { en: 'Equal keys need equal hashes so lookup reaches the same bucket, while collisions between unequal keys are normal and must be resolved with equality checks.', zh: '相等的键需要具有相同哈希值，查找才能到达同一桶；不相等的键发生哈希冲突很正常，仍需通过相等性检查来区分。' }
    difficulty: intermediate
    tags: [checkpoint]
  - id: checkpoint-1-unweighted-route
    type: fill
    prompt: { en: 'Name the traversal that finds a minimum-edge path in an unweighted graph.', zh: '写出能在无权图中找到最少边路径的遍历方法。' }
    answer: 'breadth-first search'
    explanation: { en: 'Breadth-first search explores vertices by increasing distance in edges, so first discovery gives a shortest unweighted route.', zh: '广度优先搜索按边数递增的距离探索顶点，因此首次发现某顶点时得到的是无权最短路径。' }
    difficulty: intermediate
    tags: [checkpoint]
  - id: checkpoint-1-linked-insert
    type: mcq
    prompt: { en: 'When is insertion into a linked list genuinely constant-time?', zh: '在什么条件下，向链表插入元素才真正是常数时间？' }
    options:
      - { text: { en: 'When the caller already holds the node or link at the insertion position.', zh: '调用方已经持有插入位置对应的节点或链接时。' }, correct: true }
      - { text: { en: 'Whenever the list is singly linked, regardless of how the position is found.', zh: '只要是单向链表，无论如何查找位置都可以。' }, correct: false }
      - { text: { en: 'Only after copying the list into an array.', zh: '只有先把链表复制到数组后才可以。' }, correct: false }
    explanation: { en: 'Rewiring known links is constant-time, but locating an arbitrary position usually requires a linear traversal.', zh: '重连已知链接是常数时间操作，但定位任意插入位置通常需要线性遍历。' }
    difficulty: advanced
    tags: [checkpoint]
  - id: checkpoint-1-cycle-check
    type: fill
    prompt: { en: 'Name the state a graph traversal must maintain to avoid revisiting vertices indefinitely in a cycle.', zh: '写出图遍历为避免在环中无限重复访问顶点而必须维护的状态。' }
    answer: 'visited set'
    explanation: { en: 'A visited set records vertex identity across the traversal and keeps cyclic or converging paths from repeating work indefinitely.', zh: '已访问集合在整个遍历过程中记录顶点身份，避免环路或汇合路径导致无限重复工作。' }
    difficulty: advanced
    tags: [checkpoint]
