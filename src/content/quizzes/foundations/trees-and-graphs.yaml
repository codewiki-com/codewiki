topic: foundations/trees-and-graphs
items:
  - id: predict-iterative-dfs-order
    type: predict
    prompt: { en: 'What does this iterative DFS print?', zh: '这段迭代 DFS 会输出什么？' }
    code: |
      const graph = new Map([
        ["A", ["B", "C"]],
        ["B", ["D"]],
        ["C", ["D"]],
        ["D", []],
      ]);
      const seen = new Set();
      const order = [];
      const stack = ["A"];

      while (stack.length > 0) {
        const vertex = stack.pop();
        if (seen.has(vertex)) continue;
        seen.add(vertex);
        order.push(vertex);
        const neighbors = graph.get(vertex) ?? [];
        for (let index = neighbors.length - 1; index >= 0; index -= 1) {
          stack.push(neighbors[index]);
        }
      }

      console.log(order.join(" -> "));
    lang: js
    options:
      - { text: { en: 'A -> B -> D -> C', zh: 'A -> B -> D -> C' }, correct: true }
      - { text: { en: 'A -> C -> D -> B', zh: 'A -> C -> D -> B' }, correct: false }
      - { text: { en: 'A -> B -> D -> C -> D', zh: 'A -> B -> D -> C -> D' }, correct: false }
      - { text: { en: 'A -> B -> C -> D', zh: 'A -> B -> C -> D' }, correct: false }
    explanation: { en: 'Neighbors are pushed in reverse so B is popped before C. D is processed from B and skipped when C reaches it again.', zh: '邻居按逆序入栈，因此 B 先于 C 弹出。D 经由 B 被处理，C 再次到达它时会跳过。' }
    difficulty: intermediate
    tags: [dfs, stack, predict-output]

  - id: rooted-tree-invariant
    type: mcq
    prompt: { en: 'Which property distinguishes a rooted tree from a general directed graph?', zh: '哪项性质能区分有根树与一般有向图？' }
    options:
      - { text: { en: 'Every non-root node has exactly one parent, and every node is reachable from the root.', zh: '每个非根节点恰好有一个父节点，而且每个节点都能从根到达。' }, correct: true }
      - { text: { en: 'Every node has at least two outgoing edges.', zh: '每个节点都至少有两条出边。' }, correct: false }
      - { text: { en: 'Every edge carries the same numeric weight.', zh: '每条边都携带相同的数值权重。' }, correct: false }
      - { text: { en: 'Every node is stored in an adjacency matrix.', zh: '每个节点都存储在邻接矩阵中。' }, correct: false }
    explanation: { en: 'Unique parentage plus reachability from the root creates one root-to-node path and rules out cycles in a finite rooted tree.', zh: '唯一父节点和从根可达共同形成唯一的根到节点路径，并排除有限有根树中的环。' }
    difficulty: beginner
    tags: [tree, invariant, hierarchy]

  - id: bfs-shortest-path-contract
    type: mcq
    prompt: { en: 'When does ordinary BFS provide a shortest-path guarantee?', zh: '普通 BFS 在什么条件下能够保证最短路径？' }
    options:
      - { text: { en: 'When shortest means the fewest edges, equivalently when all edges have equal cost.', zh: '最短表示边数最少，也就是所有边成本相等时。' }, correct: true }
      - { text: { en: 'Whenever all edge weights are nonnegative but unequal.', zh: '只要所有边权重非负，即使权重不同也可以。' }, correct: false }
      - { text: { en: 'Only when the graph is represented by a matrix.', zh: '只有图用矩阵表示时。' }, correct: false }
      - { text: { en: 'Whenever DFS and BFS happen to visit the same first neighbor.', zh: '只要 DFS 与 BFS 恰好先访问同一个邻居。' }, correct: false }
    explanation: { en: 'BFS explores vertices by edge-count layers. Unequal costs require an algorithm whose frontier is ordered by accumulated weight.', zh: 'BFS 按边数分层探索顶点。成本不等时，需要用按累计权重组织前沿的算法。' }
    difficulty: intermediate
    tags: [bfs, shortest-path, weights]

  - id: spot-recursive-cycle
    title: { en: 'Spot the bug in the reachability helper', zh: '找出可达性函数里的 bug' }
    type: spotbug
    prompt: { en: 'Find the bug in this generated reachability helper.', zh: '找出这段生成的可达性辅助代码中的错误。' }
    code: |
      function collectReachable(graph, start) {
        const order = [];

        function visit(vertex) {
          order.push(vertex);
          for (const neighbor of graph.get(vertex) ?? []) {
            visit(neighbor);
          }
        }

        visit(start);
        return order;
      }
    lang: js
    issues:
      - line: 7
        kind: correctness
        note: { en: 'The recursive call has no visited guard. A self-loop or longer cycle recurses indefinitely, and shared destinations are processed repeatedly.', zh: '递归调用没有已访问保护。自环或更长的环会导致无限递归，共享目标也会被反复处理。' }
    explanation: { en: 'General graph traversal must track stable vertex identity. Mark a vertex before following its outgoing neighbors.', zh: '一般图遍历必须跟踪稳定顶点标识，并在跟随出边邻居前完成标记。' }
    difficulty: beginner
    tags: [spot-bug, dfs, cycle]

  - id: adjacency-list-cost
    type: mcq
    prompt: { en: 'Why does an adjacency list usually fit a sparse graph better than an adjacency matrix?', zh: '为什么邻接表通常比邻接矩阵更适合稀疏图？' }
    options:
      - { text: { en: 'It stores existing neighbor relationships instead of allocating a cell for every vertex pair.', zh: '它只存储实际邻接关系，不必为每一对顶点分配单元格。' }, correct: true }
      - { text: { en: 'It guarantees that the graph contains no cycle.', zh: '它能保证图中不存在环。' }, correct: false }
      - { text: { en: 'It makes every weighted shortest-path query constant time.', zh: '它能让所有带权最短路径查询变成常数时间。' }, correct: false }
      - { text: { en: 'It removes the need for stable vertex identities.', zh: '它消除了稳定顶点标识的需求。' }, correct: false }
    explanation: { en: 'An adjacency list uses space proportional to vertices and stored edges, while a matrix reserves space for all vertex pairs.', zh: '邻接表空间与顶点和已存储边成正比，而矩阵要为全部顶点对保留空间。' }
    difficulty: intermediate
    tags: [adjacency-list, adjacency-matrix, sparse-graph]

  - id: review-generated-install-order
    type: review
    title: { en: 'Review a generated dependency order', zh: '审查生成的依赖顺序' }
    prompt: { en: 'Review this generated helper before the deployment service accepts external dependency graphs.', zh: '请在部署服务接收外部依赖图之前，审查这段生成的辅助代码。' }
    task: { en: 'Return every reachable dependency before the service that needs it, support several roots, and reject missing services and cycles.', zh: '让每个可达依赖项都排在需要它的服务之前，支持多个根，并拒绝缺失服务和环。' }
    code: |
      function buildInstallOrder(graph, roots) {
        const visited = new Set();
        const order = [];

        function visit(service) {
          if (visited.has(service)) return;
          visited.add(service);

          const dependencies = graph.get(service);
          for (const dependency of dependencies) {
            visit(dependency);
          }

          if (!order.includes(service)) {
            order.push(service);
          }
        }

        for (const root of roots) {
          visit(root);
        }

        return order;
      }
    lang: js
    issues:
      - line: 1
        kind: readability
        note: { en: 'The function does not state whether an edge points to a dependency or a dependent, or what identifies a service. Name and document that contract at the boundary.', zh: '函数没有说明边指向依赖项还是依赖方，也没有说明如何标识服务。应在边界处命名并记录这份契约。' }
      - line: 7
        kind: correctness
        note: { en: 'One visited state conflates active and completed vertices, so a cycle is silently accepted. Track unseen, active, and completed states and reject an edge to an active service.', zh: '单一已访问状态混淆活跃与已完成顶点，因此会静默接受环。应跟踪未发现、活跃和已完成状态，并拒绝指向活跃服务的边。' }
      - line: 9
        kind: edge-case
        note: { en: 'A referenced service with no map entry makes dependencies undefined and the loop throws an incidental TypeError. Detect it and report the missing service ID.', zh: '被引用服务如果没有映射项，dependencies 就是 undefined，循环会意外抛出 TypeError。应主动检测并报告缺失的服务 ID。' }
      - line: 14
        kind: performance
        note: { en: 'order.includes() scans the growing result for every completed service even though visited already ensures one completion. Push directly after valid three-state traversal.', zh: '每完成一个服务，order.includes() 都会扫描不断增长的结果，但 visited 已保证只完成一次。有效的三状态遍历完成后可直接压入。' }
    right: { en: 'The helper keeps traversal state local, supports several roots, and appends dependencies before their dependents for acyclic complete input.', zh: '该辅助函数把遍历状态保持在局部，支持多个根，而且对于完整无环输入，会先加入依赖项再加入依赖方。' }
    checklist:
      - { en: 'Define edge direction and stable service identity.', zh: '定义边方向与稳定服务标识。' }
      - { en: 'Trace a self-loop, a longer cycle, and a missing referenced service.', zh: '跟踪自环、更长的环和缺失的被引用服务。' }
      - { en: 'Verify every dependency precedes each dependent across several roots.', zh: '验证多个根下每个依赖项都排在对应依赖方之前。' }
      - { en: 'Bound graph size and depth for externally supplied input.', zh: '为外部输入限制图规模与深度。' }
    explanation: { en: 'Use three-state DFS or an indegree-based topological sort, validate every referenced vertex, and return a concrete cycle path when ordering is impossible.', zh: '应使用三状态 DFS 或基于入度的拓扑排序，验证每个被引用顶点，并在无法排序时返回具体环路径。' }
    difficulty: intermediate
    minutes: 9
    tags: [code-review, dependencies, topological-sort, cycle-detection]
