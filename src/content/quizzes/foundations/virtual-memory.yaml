topic: foundations/virtual-memory
items:
  - id: predict-pages-touched
    type: predict
    prompt: { en: 'What does this page-stride loop print?', zh: '这段按页步进的循环会输出什么？' }
    code: |
      #include <cstddef>
      #include <iostream>
      #include <vector>

      int main() {
          constexpr std::size_t page_size = 4096;
          std::vector<unsigned char> region(page_size * 4);
          std::size_t touched = 0;
          for (std::size_t offset = 0; offset < region.size(); offset += page_size) {
              region[offset] = 1;
              ++touched;
          }
          std::cout << region.size() << " " << touched << '\n';
      }
    lang: cpp
    options:
      - { text: { en: '4096 1', zh: '4096 1' }, correct: false }
      - { text: { en: '4096 4', zh: '4096 4' }, correct: false }
      - { text: { en: '16384 4', zh: '16384 4' }, correct: true }
      - { text: { en: '16384 4096', zh: '16384 4096' }, correct: false }
    explanation: { en: 'The vector contains four 4096-byte regions, for 16384 bytes total. Offsets 0, 4096, 8192, and 12288 make four loop iterations.', zh: '向量包含 4 段 4096 字节区域，总计 16384 字节；偏移 0、4096、8192 和 12288 使循环执行 4 次。' }
    difficulty: beginner
    tags: [pages, first-touch, predict-output]
    minutes: 3

  - id: page-fault-meaning
    type: mcq
    prompt: { en: 'Which statement about a page fault is correct?', zh: '关于缺页，哪项说法正确？' }
    options:
      - { text: { en: 'Every page fault reads data from a physical disk.', zh: '每次缺页都会从物理磁盘读取数据。' }, correct: false }
      - { text: { en: 'Every page fault terminates the process.', zh: '每次缺页都会终止进程。' }, correct: false }
      - { text: { en: 'The kernel may resolve a permitted access by installing a mapping and retrying the instruction.', zh: '对于权限允许的访问，内核可以安装映射并重试指令。' }, correct: true }
      - { text: { en: 'A TLB miss and a page fault are always the same event.', zh: 'TLB 未命中与缺页总是同一事件。' }, correct: false }
    explanation: { en: 'Demand-zero, cached file, and copy-on-write faults can be resolved without terminating the process. A TLB miss can also complete after a successful page-table walk.', zh: '请求填零、已缓存文件页和写时复制缺页都可以在不终止进程的情况下解决；TLB 未命中也可能在成功遍历页表后完成。' }
    difficulty: intermediate
    tags: [page-faults, demand-paging, tlb]
    minutes: 3

  - id: virtual-versus-resident
    type: mcq
    prompt: { en: 'A process reserves a 2 GiB anonymous range but touches only 8 MiB. Which conclusion is justified?', zh: '进程预留了 2 GiB 匿名范围，却只接触 8 MiB。哪项结论有依据？' }
    options:
      - { text: { en: 'It must already consume 2 GiB of private RAM.', zh: '它一定已经占用 2 GiB 私有 RAM。' }, correct: false }
      - { text: { en: 'Its virtual size can grow by 2 GiB without a matching 2 GiB increase in resident memory.', zh: '它的虚拟大小可以增加 2 GiB，而驻留内存不必相应增加 2 GiB。' }, correct: true }
      - { text: { en: 'The untouched pages can never fail when written later.', zh: '未接触的页以后写入时绝不可能失败。' }, correct: false }
      - { text: { en: 'The range cannot count toward any cgroup policy.', zh: '该范围不可能计入任何 cgroup 策略。' }, correct: false }
    explanation: { en: 'Reservation and residency are different sets. Future first-touch behavior still depends on commit policy, reclaim, and the applicable process or cgroup limits.', zh: '预留与驻留描述不同集合；未来的首次触页仍取决于提交策略、回收，以及适用的进程或 cgroup 限制。' }
    difficulty: intermediate
    tags: [virtual-size, rss, allocation]
    minutes: 3

  - id: spot-unmapped-buffer
    type: spotbug
    prompt: { en: 'Find the correctness and lifetime bugs in this generated mapping helper.', zh: '找出这个生成的映射辅助函数中的正确性与生命周期错误。' }
    code: |
      Record* copy_records(const Record* input, std::size_t count) {
          const std::size_t bytes = count * sizeof(Record);
          void* region = mmap(nullptr, bytes, PROT_READ | PROT_WRITE,
                              MAP_PRIVATE | MAP_ANONYMOUS, -1, 0);
          std::memcpy(region, input, bytes);
          munmap(region, bytes);
          return static_cast<Record*>(region);
      }
    lang: cpp
    issues:
      - line: 2
        kind: correctness
        note: { en: 'The byte-count multiplication can wrap, creating a mapping smaller than the later copy.', zh: '字节数乘法可能回绕，导致映射小于之后复制的数据。' }
      - line: 3
        lines: 2
        kind: edge-case
        note: { en: 'The code does not define zero-count behavior or check mmap against MAP_FAILED before using the result.', zh: '代码既没有定义 count 为 0 时的行为，也没有在使用结果前检查 mmap 是否返回 MAP_FAILED。' }
      - line: 7
        kind: security
        note: { en: 'The returned pointer refers to an unmapped range, so any caller access is a use-after-unmap.', zh: '返回的指针指向已经解除映射的范围，调用方一旦访问就会发生解除映射后使用。' }
    explanation: { en: 'Use checked size arithmetic, define the empty case, validate every mapping result, and return an owning object whose destructor unmaps only after callers finish.', zh: '应使用经过检查的大小计算，定义空输入行为，验证每次映射结果，并返回拥有映射的对象，由析构函数在调用方用完后解除映射。' }
    difficulty: intermediate
    tags: [mmap, overflow, lifetime]
    minutes: 7

  - id: copy-on-write-after-fork
    type: mcq
    prompt: { en: 'After fork, why can a child write a private mapping without changing the parent’s value?', zh: '调用 fork 后，为什么子进程写入私有映射不会改变父进程的值？' }
    options:
      - { text: { en: 'The pipe automatically restores the parent page.', zh: '管道会自动恢复父进程页面。' }, correct: false }
      - { text: { en: 'The child receives a new virtual address for every page.', zh: '子进程会为每个页取得新的虚拟地址。' }, correct: false }
      - { text: { en: 'Copy-on-write preserves private semantics by separating backing when a shared page is written.', zh: '写时复制会在共享页被写入时分离后备，从而保持私有语义。' }, correct: true }
      - { text: { en: 'Private mappings are always copied eagerly before fork returns.', zh: '私有映射总会在 fork 返回前全部立即复制。' }, correct: false }
    explanation: { en: 'Parent and child can initially share physical backing while their mappings promise private writes. A write fault lets the kernel preserve separate contents without eagerly copying every page.', zh: '父子进程的映射承诺私有写入时，最初仍可共享物理后备；写入缺页让内核保持不同内容，而不必立即复制每个页。' }
    difficulty: intermediate
    tags: [copy-on-write, fork, process-isolation]
    minutes: 3

  - id: review-generated-mapped-index
    type: review
    title: { en: 'Review a generated mapped index', zh: '审查生成的映射索引' }
    prompt: { en: 'Review this AI-generated file-backed index against its stated task.', zh: '根据给定任务，审查这个 AI 生成的文件后备索引。' }
    task: { en: 'Open a trusted index file read-only, validate its header and record extent, answer lookups, and release every operating-system resource safely.', zh: '以只读方式打开可信索引文件，校验文件头与记录范围，响应查询，并安全释放每项操作系统资源。' }
    code: |
      class MappedIndex {
      public:
          explicit MappedIndex(const char* path) {
              fd_ = open(path, O_RDWR);
              size_ = static_cast<std::size_t>(lseek(fd_, 0, SEEK_END));
              data_ = static_cast<std::byte*>(mmap(nullptr, size_, PROT_READ | PROT_WRITE, MAP_SHARED, fd_, 0));
              records_ = reinterpret_cast<Record*>(data_ + sizeof(Header));
              count_ = (size_ - sizeof(Header)) / sizeof(Record);
          }
          Record* find(std::uint64_t id) {
              for (std::size_t i = 0; i < count_; ++i)
                  if (records_[i].id == id) return &records_[i];
              return nullptr;
          }
          void warm() {
              for (std::size_t offset = 0; offset < size_; offset += 4096)
                  data_[offset] = data_[offset];
          }
          ~MappedIndex() { munmap(data_, size_); close(fd_); }
      private:
          int fd_;
          std::size_t size_, count_;
          std::byte* data_; Record* records_;
      };
    lang: cpp
    right: { en: 'The code puts descriptor and mapping teardown in one owner, derives a record count from file size, keeps lookup bounded by that count, and avoids copying the whole file into a second buffer.', zh: '代码把描述符与映射的清理集中到一个所有者中，根据文件大小推导记录数，用该数量限制查询范围，也没有把整个文件复制到第二个缓冲区。' }
    checklist:
      - { en: 'Check every open, size query, mapping result, and cleanup path, including partial construction.', zh: '检查每次打开、大小查询、映射结果和清理路径，包括构造只完成一部分的情况。' }
      - { en: 'Validate minimum size, header identity and version, complete record extent, and checked size arithmetic before pointer derivation.', zh: '推导指针前，校验最小大小、文件头身份与版本、完整记录范围，以及经过检查的大小计算。' }
      - { en: 'Request read-only descriptor and mapping permissions, then expose const records rather than writable pointers.', zh: '只请求只读描述符与映射权限，并暴露 const 记录，而不是可写指针。' }
      - { en: 'Warm only a measured working set with the runtime page size and a bounded latency or cancellation policy.', zh: '只使用运行时页大小预热经过测量的工作集，并设置有界延迟或取消策略。' }
    issues:
      - line: 4
        kind: security
        note: { en: 'The task is read-only, but O_RDWR grants unnecessary write authority over the trusted index.', zh: '任务要求只读，但 O_RDWR 对可信索引授予了不必要的写入权限。' }
      - line: 6
        kind: correctness
        note: { en: 'The constructor checks neither failed open and size calls nor MAP_FAILED, then derives pointers from possible error sentinels.', zh: '构造函数没有检查 open、大小查询失败或 MAP_FAILED，随后可能从错误哨兵推导指针。' }
      - line: 8
        kind: edge-case
        note: { en: 'A short file underflows size minus Header, and a partial final record or invalid header is silently accepted.', zh: '文件短于 Header 时减法会下溢，末尾不完整记录或非法文件头也会被静默接受。' }
      - line: 16
        lines: 2
        kind: performance
        note: { en: 'The warmup hard-codes a page size and touches the entire file, which can cause a fault storm and displace the useful working set.', zh: '预热硬编码页大小并接触整个文件，可能造成缺页风暴，还会挤走真正有用的工作集。' }
      - line: 19
        kind: readability
        note: { en: 'A compressed destructor hides two independent cleanup operations and gives no safe representation for a partially constructed object.', zh: '压缩成一行的析构函数隐藏了两项独立清理，也没有为部分构造的对象提供安全表示。' }
    explanation: { en: 'Use RAII wrappers for the descriptor and mapping, validate the complete on-disk format before exposing records, and keep the view const. Treat prefaulting as a bounded, measured policy rather than touching every page unconditionally.', zh: '应使用 RAII 包装描述符与映射，在暴露记录前校验完整磁盘格式，并保持视图为 const；预先触页应是有界、经过测量的策略，不能无条件接触每个页。' }
    difficulty: advanced
    tags: [code-review, mmap, validation, resource-ownership]
    minutes: 15
