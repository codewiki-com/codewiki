topic: foundations/dates-and-time
items:
  - id: predict-overlap-subtraction
    type: predict
    prompt: { en: 'What does this program print for the two repeated New York times?', zh: '这段程序会为两个重复的纽约时间输出什么？' }
    code: |
      from datetime import datetime
      from zoneinfo import ZoneInfo

      zone = ZoneInfo("America/New_York")
      first = datetime(2026, 11, 1, 1, 30, tzinfo=zone, fold=0)
      second = datetime(2026, 11, 1, 1, 30, tzinfo=zone, fold=1)

      print(second - first)
      print(int(second.timestamp() - first.timestamp()))
    lang: python
    options:
      - { text: { en: '0:00:00, then 3600', zh: '先输出0:00:00，再输出3600' }, correct: true }
      - { text: { en: '1:00:00, then 3600', zh: '先输出1:00:00，再输出3600' }, correct: false }
      - { text: { en: '0:00:00, then 0', zh: '先输出0:00:00，再输出0' }, correct: false }
      - { text: { en: 'Python raises because 01:30 is ambiguous.', zh: 'Python会因01:30有歧义而抛错。' }, correct: false }
    explanation: { en: 'Same-zone datetime subtraction ignores offsets and fold, so the wall-field difference is zero. The two timeline timestamps identify distinct instants one hour apart.', zh: '同区datetime相减会忽略偏移与fold，因此钟表字段差为零；两个时间线时间戳标识不同时间点，相差一小时。' }
    difficulty: advanced
    tags: [datetime, fold, arithmetic, predict-output]
    minutes: 3

  - id: distinguish-instant-and-civil-date
    type: mcq
    prompt: { en: 'Which model best preserves a customer birthday entered as 2026-04-05?', zh: '哪种模型最适合保存客户输入的生日2026-04-05？' }
    options:
      - { text: { en: 'Calendar year, month, and day with no invented time or zone', zh: '只保存日历年、月、日，不擅自添加时间或时区' }, correct: true }
      - { text: { en: 'UTC midnight converted to an epoch timestamp', zh: '转换为UTC午夜对应的纪元时间戳' }, correct: false }
      - { text: { en: 'Host-local midnight on the server', zh: '服务器宿主本地时区的午夜' }, correct: false }
      - { text: { en: 'The current numeric UTC offset plus midnight', zh: '当前UTC数值偏移加午夜' }, correct: false }
    explanation: { en: 'A birthday is usually a civil date rather than an instant. Inventing midnight and a zone can display the previous or next date after conversion.', zh: '生日通常是民用日期，不是时间点。擅自添加午夜和时区后，转换展示可能落到前一天或后一天。' }
    difficulty: beginner
    tags: [civil-date, instant, data-model]
    minutes: 2

  - id: spot-zone-relabel
    title: { en: 'Spot the bug in the time-zone conversion', zh: '找出时区转换里的bug' }
    type: spotbug
    prompt: { en: 'Find why this conversion changes the instant instead of displaying it in Paris.', zh: '找出这次转换为什么改变了时间点，而不是在巴黎时区展示它。' }
    code: |
      from datetime import datetime
      from zoneinfo import ZoneInfo

      def show_in_paris(value):
          instant = datetime.fromisoformat(value)
          paris = instant.replace(tzinfo=ZoneInfo("Europe/Paris"))
          return paris.isoformat()

      print(show_in_paris("2026-07-01T10:00:00+00:00"))
    lang: python
    issues:
      - line: 6
        kind: correctness
        note: { en: 'replace(tzinfo=...) preserves the 10:00 fields and relabels them, creating another instant. astimezone() must preserve the parsed instant and project it into Paris.', zh: 'replace(tzinfo=...) 保留10:00字段并重新贴标签，因此创建了另一个时间点。应使用astimezone() 保留解析后的时间点并投影到巴黎。' }
    explanation: { en: 'Zone attachment and zone conversion are different operations. Use replace only when intentionally resolving naive civil fields under a stated transition policy.', zh: '附加时区与转换时区是两种操作。只有明确要按某项切换策略解析简单型民用字段时，才应使用replace。' }
    difficulty: intermediate
    tags: [zoneinfo, astimezone, conversion, code-review]
    minutes: 4

  - id: offset-versus-zone
    type: mcq
    prompt: { en: 'Why can -04:00 not replace America/New_York in a recurring schedule?', zh: '为什么重复日程不能用 -04:00代替America/New_York？' }
    options:
      - { text: { en: 'The offset describes one UTC relationship, while the zone supplies date-dependent regional rules.', zh: '偏移只描述一次与UTC的关系，时区则提供随日期变化的地区规则。' }, correct: true }
      - { text: { en: 'Numeric offsets can represent only times before the Unix epoch.', zh: '数值偏移只能表示Unix纪元以前的时间。' }, correct: false }
      - { text: { en: 'An IANA zone always has a constant offset but a friendlier name.', zh: 'IANA时区的偏移始终固定，只是名称更友好。' }, correct: false }
      - { text: { en: 'RFC 3339 forbids numeric offsets on resolved instants.', zh: 'RFC 3339禁止在已解析时间点上使用数值偏移。' }, correct: false }
    explanation: { en: 'A recurring local schedule needs rules for each future date. An explicit offset is still useful on a resolved wire timestamp, but it is not a regional rule set.', zh: '重复的本地日程需要每个未来日期对应的规则。已解析的传输时间戳仍适合带明确偏移，但偏移不是地区规则集。' }
    difficulty: intermediate
    tags: [utc-offset, time-zone, recurrence]
    minutes: 3

  - id: choose-timeout-clock
    type: mcq
    prompt: { en: 'Which clock should control a five-second in-process timeout?', zh: '进程内五秒超时应由哪种时钟控制？' }
    options:
      - { text: { en: 'A monotonic clock, with a separate UTC timestamp only if logging needs one', zh: '单调时钟；只有日志需要时才另记UTC时间戳' }, correct: true }
      - { text: { en: 'Repeated datetime.now(UTC) readings because UTC cannot jump', zh: '反复读取datetime.now(UTC)，因为UTC不会跳跃' }, correct: false }
      - { text: { en: 'A local calendar clock so daylight-saving changes are included', zh: '本地日历时钟，以便包含夏令时变化' }, correct: false }
      - { text: { en: 'Epoch milliseconds divided by the current UTC offset', zh: '纪元毫秒数除以当前UTC偏移' }, correct: false }
    explanation: { en: 'A monotonic clock cannot move backward and is intended for interval measurement. Wall-clock UTC can be corrected and should serve civil timestamps, not timeout progress.', zh: '单调时钟不会倒退，适合测量区间。UTC挂钟可能被校正，应服务于民用时间戳，而不是控制超时进度。' }
    difficulty: intermediate
    tags: [monotonic-clock, timeout, duration]
    minutes: 2

  - id: review-generated-booking
    type: review
    title: { en: 'Review a generated booking normalizer', zh: '审查生成的预订规范化函数' }
    prompt: { en: 'Review this generated booking normalizer before it handles appointment requests.', zh: '在这个生成的预订规范化函数处理预约请求前，对它进行审查。' }
    task: { en: 'Resolve input.local_start in input.zone with an explicit gap and overlap policy, require a positive elapsed-minute duration, derive expiry from an injected received instant, return canonical UTC instants, and never expose internal notes.', zh: '按照明确的空缺与重叠策略，在input.zone中解析input.local_start；要求经过分钟数为正；根据注入的接收时间点计算过期时间；返回规范UTC时间点，并且绝不暴露内部备注。' }
    code: |
      from datetime import UTC, datetime, timedelta
      from zoneinfo import ZoneInfo

      def prepare_booking(data):
          starts_at = datetime.fromisoformat(data["local_start"])
          starts_at = starts_at.replace(tzinfo=UTC)
          zone = ZoneInfo(data["zone"])
          display = starts_at.astimezone(zone)

          ends_at = starts_at + timedelta(minutes=data["duration_minutes"])
          if ends_at < starts_at:
              raise ValueError("negative duration")

          expires_at = datetime.now(UTC) + timedelta(minutes=15)
          return {
              "starts_at": starts_at.isoformat(),
              "ends_at": ends_at.isoformat(),
              "local_label": display.strftime("%Y-%m-%d %H:%M"),
              "zone": str(zone),
              "expires_at": expires_at.isoformat(),
              "internal_note": data["internal_note"],
          }
    lang: python
    right: { en: 'The function parses the start once, constructs a real ZoneInfo object, produces aware machine-facing values, derives a separate end, and does not mutate the input mapping.', zh: '函数只解析一次开始值，构造真实的ZoneInfo对象，生成感知型机器值，单独派生结束值，并且没有修改输入映射。' }
    checklist:
      - { en: 'Classify each input as civil fields, a zone, an instant, or a duration before tracing conversions.', zh: '跟踪转换前，先把各项输入归类为民用字段、时区、时间点或时长。' }
      - { en: 'Test one unique local time, a real gap, and both sides of a real overlap.', zh: '测试一个唯一的本地时间、一个真实空缺，以及一个真实重叠的两种解释。' }
      - { en: 'Check zero and negative durations and assert elapsed seconds across a transition.', zh: '检查零时长与负时长，并断言跨切换点时实际经过的秒数。' }
      - { en: 'Compare dependencies and returned keys with the task contract.', zh: '把依赖项与返回字段同任务契约逐项比较。' }
    issues:
      - line: 6
        kind: correctness
        note: { en: 'The code labels local civil fields as UTC, ignores data.zone during resolution, and has no gap or overlap policy. It must resolve candidates under the named zone before choosing an instant.', zh: '代码把本地民用字段标成UTC，解析时忽略data.zone，也没有空缺或重叠策略。它必须先在指定时区下解析候选项，再选择时间点。' }
      - line: 11
        kind: edge-case
        note: { en: 'The check accepts a zero duration. The contract requires a positive value, and elapsed addition must be tested across a zone transition after start is resolved correctly.', zh: '这项检查会接受零时长。契约要求正值；正确解析开始时间后，还必须跨时区切换测试经过时间加法。' }
      - line: 14
        kind: readability
        note: { en: 'Reading the current clock hides a dependency and makes retries and tests nondeterministic. Accept the received instant explicitly and derive expiry from it.', zh: '读取当前时钟隐藏了依赖，让重试与测试失去确定性。应明确接收传入的接收时间点，并据此派生过期时间。' }
      - line: 21
        kind: security
        note: { en: 'The response exposes internal_note even though the public contract forbids it. Construct the result from an allowlist of public fields.', zh: '响应暴露了公开契约禁止返回的internal_note。应按公开字段允许列表构造结果。' }
    explanation: { en: 'Resolve civil fields with the named zone and transition policy, add a validated positive duration on the timeline, inject the received instant, and return only allowed canonical fields.', zh: '应结合指定时区与切换策略解析民用字段，在时间线上增加验证过的正时长，注入接收时间点，并且只返回获准的规范字段。' }
    difficulty: advanced
    tags: [code-review, datetime, time-zone, security]
    minutes: 12
