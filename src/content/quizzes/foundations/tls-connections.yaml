topic: foundations/tls-connections
items:
  - id: predict-hostname-matches
    type: predict
    prompt: { en: 'What does this certificate-name check print?', zh: '这段证书名称检查会输出什么？' }
    code: |
      import { checkServerIdentity } from "node:tls";

      const cert = {
        subjectaltname: "DNS:api.internal, DNS:*.svc.internal",
      };

      for (const host of ["api.internal", "orders.svc.internal", "bad.internal"]) {
        const error = checkServerIdentity(host, cert);
        console.log(`${host}: ${error?.code ?? "ok"}`);
      }
    lang: javascript
    options:
      - text:
          en: "api.internal: ok\norders.svc.internal: ok\nbad.internal: ERR_TLS_CERT_ALTNAME_INVALID"
          zh: "api.internal: ok\norders.svc.internal: ok\nbad.internal: ERR_TLS_CERT_ALTNAME_INVALID"
        correct: true
      - text:
          en: "api.internal: ok\norders.svc.internal: ERR_TLS_CERT_ALTNAME_INVALID\nbad.internal: ERR_TLS_CERT_ALTNAME_INVALID"
          zh: "api.internal: ok\norders.svc.internal: ERR_TLS_CERT_ALTNAME_INVALID\nbad.internal: ERR_TLS_CERT_ALTNAME_INVALID"
        correct: false
      - text:
          en: "api.internal: ok\norders.svc.internal: ok\nbad.internal: ok"
          zh: "api.internal: ok\norders.svc.internal: ok\nbad.internal: ok"
        correct: false
    explanation: { en: 'The exact SAN and its one-label wildcard match. The unrelated name fails with the hostname-specific error code.', zh: '完整 SAN 与只覆盖一层标签的通配符都能匹配；无关名称会返回主机名专用错误码。' }
    difficulty: intermediate
    tags: [tls, san, hostname-verification]
    tests: node quiz_hostname.mjs
    minutes: 4

  - id: chain-and-name-separation
    type: mcq
    prompt: { en: 'A certificate builds successfully to a trusted root but names only payments.example. What should a client requesting login.example do?', zh: '一张证书可以成功构建到受信根，但只包含 payments.example。请求 login.example 的客户端应怎样处理？' }
    options:
      - { text: { en: 'Accept it because chain validation already authenticated every hostname.', zh: '接受，因为证书链校验已经认证了所有主机名。' }, correct: false }
      - { text: { en: 'Reject it because the trusted chain and requested service identity are separate checks.', zh: '拒绝，因为受信证书链与请求服务身份是两项独立检查。' }, correct: true }
      - { text: { en: 'Accept it only when both names resolve to the same IP address.', zh: '仅当两个名称解析到同一 IP 地址时接受。' }, correct: false }
      - { text: { en: 'Retry with certificate verification disabled.', zh: '关闭证书校验后重试。' }, correct: false }
    explanation: { en: 'A trusted issuer path does not grant the leaf every DNS identity. The reference name must independently match an allowed certificate identity.', zh: '受信签发路径不会赋予叶证书所有 DNS 身份；参考名称还必须独立匹配证书允许的身份。' }
    difficulty: beginner
    tags: [certificate-chain, hostname-verification]
    minutes: 3

  - id: key-agreement-versus-authentication
    type: mcq
    prompt: { en: 'What does ephemeral Diffie-Hellman key agreement establish by itself?', zh: '临时 Diffie-Hellman 密钥协商本身能确立什么？' }
    options:
      - { text: { en: 'That both endpoints derived a shared secret from their private keys and exchanged public shares', zh: '双方通过各自私钥和交换的公开份额派生出共同秘密' }, correct: true }
      - { text: { en: 'That the peer owns the requested DNS hostname', zh: '对端拥有请求的 DNS 主机名' }, correct: false }
      - { text: { en: 'That every later application request is authorized', zh: '之后每个应用请求都已经获得授权' }, correct: false }
      - { text: { en: 'That the certificate can never be revoked', zh: '证书永远不会被吊销' }, correct: false }
    explanation: { en: 'Unauthenticated key agreement can also happen with an attacker. TLS binds key shares to the authenticated handshake transcript and certificate proof.', zh: '攻击者也可以参与未经认证的密钥协商；TLS 会把密钥份额绑定到经过认证的握手记录和证书证明。' }
    difficulty: intermediate
    tags: [key-agreement, handshake, authentication]
    minutes: 4

  - id: spot-internal-tls-client
    type: spotbug
    prompt: { en: 'Find the security and lifecycle bugs in this generated TLS client.', zh: '找出这个生成的 TLS 客户端中的安全与生命周期错误。' }
    code: |
      import { connect } from "node:tls";

      export function openInternal(address, token) {
        return new Promise((resolve, reject) => {
          const socket = connect({
            host: address,
            port: 443,
            rejectUnauthorized: false,
          }, () => {
            socket.write(`Authorization: Bearer ${token}\n`);
            resolve(socket);
          });
          socket.on("error", reject);
        });
      }
    lang: javascript
    issues:
      - line: 8
        kind: security
        note: { en: 'Disabling authorization removes certificate-chain and hostname enforcement before the bearer token is sent.', zh: '关闭授权检查后，发送 bearer token 前不会强制执行证书链与主机名校验。' }
      - line: 6
        kind: correctness
        note: { en: 'If address is an IP selected for routing, no intended servername is preserved for SNI and hostname verification.', zh: '如果 address 是路由选出的 IP，代码没有保留用于 SNI 和主机名校验的目标 servername。' }
      - line: 5
        kind: edge-case
        note: { en: 'There is no bounded handshake deadline, so a peer that stalls can keep the promise and socket open indefinitely.', zh: '代码没有有限握手截止时间，对端停滞时，Promise 和套接字可能一直保持打开。' }
    explanation: { en: 'Route to the approved address while passing the original service name, keep verification enabled with the scoped CA policy, and destroy the socket on a bounded handshake timeout.', zh: '应路由到获准地址，同时传入原始服务名称；按限定 CA 策略保持校验开启，并在有限握手超时后销毁套接字。' }
    difficulty: intermediate
    tags: [tls, generated-code, timeout]
    tests: node --check spot_tls_client.mjs
    minutes: 8

  - id: early-data-replay
    type: mcq
    prompt: { en: 'Which operation is the best candidate for TLS 1.3 0-RTT early data?', zh: '哪项操作最适合作为 TLS 1.3 的 0-RTT 早期数据？' }
    options:
      - { text: { en: 'Charge a stored payment method once', zh: '对已保存支付方式扣款一次' }, correct: false }
      - { text: { en: 'Consume a one-time password', zh: '消费一次性密码' }, correct: false }
      - { text: { en: 'Fetch a cacheable public object with no replay-sensitive side effect', zh: '获取可缓存的公开对象，且没有重放敏感副作用' }, correct: true }
      - { text: { en: 'Create a new user account', zh: '创建新用户账户' }, correct: false }
    explanation: { en: 'TLS 1.3 early data may be replayed. It should be disabled or limited to operations whose complete application behavior is safe when repeated.', zh: 'TLS 1.3 早期数据可能被重放；它应保持关闭，或只用于完整应用行为可安全重复的操作。' }
    difficulty: advanced
    tags: [tls13, zero-rtt, replay]
    minutes: 4

  - id: review-generated-invoice-client
    type: review
    title: { en: 'Review a generated invoice TLS client', zh: '审查生成的发票 TLS 客户端' }
    prompt: { en: 'Review this AI-generated client against its stated task.', zh: '根据给定任务审查这个 AI 生成的客户端。' }
    task: { en: 'Send one length-prefixed JSON invoice to an approved IP, authenticate billing.internal with the supplied private CA, enforce a three-second overall deadline, reject failures, and close deterministically.', zh: '向获准 IP 发送一条长度前缀 JSON 发票，使用给定私有 CA 认证 billing.internal，执行三秒总体截止时间，拒绝失败并确定性关闭连接。' }
    code: |
      import { connect } from "node:tls";

      export function sendInvoice(ipAddress, invoice, privateCa) {
        return new Promise((resolve) => {
          const socket = connect({
            host: ipAddress,
            port: 443,
            ca: privateCa,
            rejectUnauthorized: false,
          }, () => {
            const payload = JSON.stringify(invoice);
            socket.write(payload);
            socket.end();
            resolve();
          });

          socket.on("error", () => resolve());
        });
      }
    lang: javascript
    right: { en: 'The code uses the maintained TLS client, scopes the supplied CA to this connection, serializes the invoice as JSON, and closes the write side on its success path.', zh: '代码使用成熟 TLS 客户端，把给定 CA 限定在本连接中，把发票序列化为 JSON，并在成功路径关闭写方向。' }
    checklist:
      - { en: 'Keep chain and service-name verification enabled while routing to the approved IP.', zh: '路由到获准 IP 时，保持证书链和服务名称校验开启。' }
      - { en: 'Frame the exact UTF-8 byte length and handle write completion or backpressure.', zh: '按准确 UTF-8 字节长度分帧，并处理写入完成或背压。' }
      - { en: 'Apply one three-second budget across connect, handshake, and write.', zh: '为连接、握手和写入执行同一个三秒预算。' }
      - { en: 'Reject every failure and prove deterministic socket cleanup.', zh: '拒绝每项失败，并证明套接字会确定性清理。' }
    issues:
      - line: 9
        kind: security
        note: { en: 'rejectUnauthorized disables both CA-path enforcement and hostname rejection; the code also supplies no billing.internal servername.', zh: 'rejectUnauthorized 会关闭 CA 路径与主机名拒绝逻辑，而且代码没有提供 billing.internal 作为 servername。' }
      - line: 12
        kind: correctness
        note: { en: 'The payload is written without the required byte-length prefix, so the receiver cannot recover the declared frame.', zh: '负载没有写入所需字节长度前缀，接收方无法还原约定帧。' }
      - line: 5
        kind: edge-case
        note: { en: 'No timer covers transport, handshake, and write, so a stalled peer can exceed the three-second overall deadline.', zh: '没有计时器覆盖传输、握手和写入，对端停滞时会超过三秒总体截止时间。' }
      - line: 17
        kind: readability
        note: { en: 'Resolving on every socket error makes a failed send indistinguishable from success to the caller.', zh: '遇到任何套接字错误都 resolve，会让调用方无法区分发送失败与成功。' }
    explanation: { en: 'Preserve billing.internal as servername, trust only the intended CA policy, and leave authorization enabled. Add bounded phase cleanup, a byte-length prefix, write-completion handling, and error rejection.', zh: '应保留 billing.internal 作为 servername，只采用预期 CA 策略并保持授权检查开启；还要增加有限的分阶段清理、字节长度前缀、写入完成处理和错误拒绝。' }
    difficulty: advanced
    tags: [tls, code-review, generated-code, framing]
    tests: node --check review_invoice_client.mjs
    minutes: 18
