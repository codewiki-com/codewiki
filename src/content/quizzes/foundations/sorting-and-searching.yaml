topic: foundations/sorting-and-searching
items:
  - id: predict-lower-bound
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      function lowerBound(values, target) {
        let low = 0;
        let high = values.length;

        while (low < high) {
          const middle = low + Math.floor((high - low) / 2);
          if (values[middle] < target) low = middle + 1;
          else high = middle;
        }

        return low;
      }

      const values = [10, 10, 20, 40];
      console.log([10, 25, 50].map((target) => lowerBound(values, target)));
    lang: js
    options:
      - { text: { en: '[0, 3, 4]', zh: '[0, 3, 4]' }, correct: true }
      - { text: { en: '[1, -1, -1]', zh: '[1, -1, -1]' }, correct: false }
      - { text: { en: '[0, 2, 3]', zh: '[0, 2, 3]' }, correct: false }
      - { text: { en: '[1, 3, 4]', zh: '[1, 3, 4]' }, correct: false }
    explanation: { en: 'Lower bound returns the first position whose value is at least the target, including a valid insertion position at values.length.', zh: '下界返回值大于或等于目标的第一处位置；数组长度也是一个有效插入位置。' }
    difficulty: beginner
    tags: [binary-search, lower-bound, predict-output]

  - id: choose-one-off-search
    type: mcq
    prompt: { en: 'You need the first matching record from a small unsorted array, and this query runs once. What is the best starting strategy?', zh: '你要从小型无序数组中查找第一条匹配记录，而且查询只执行一次。最合适的起点是什么？' }
    options:
      - { text: { en: 'Scan in input order and stop at the first match.', zh: '按输入顺序扫描，在首次匹配时停止。' }, correct: true }
      - { text: { en: 'Sort the entire array, then run binary search.', zh: '先对整个数组排序，再执行二分查找。' }, correct: false }
      - { text: { en: 'Build both a hash index and a balanced tree.', zh: '同时建立哈希索引与平衡树。' }, correct: false }
    explanation: { en: 'A scan has the weakest precondition and avoids an index-building cost that one query cannot reuse.', zh: '扫描所需前置条件最少，也避免了只执行一次的查询无法复用的索引构建成本。' }
    difficulty: beginner
    tags: [linear-search, workload]

  - id: stable-sort-guarantee
    type: mcq
    prompt: { en: 'What does a stable sort guarantee when two distinct records compare equal?', zh: '两条不同记录比较相等时，稳定排序保证什么？' }
    options:
      - { text: { en: 'Their relative input order is preserved.', zh: '保留它们在输入中的相对顺序。' }, correct: true }
      - { text: { en: 'A unique identifier is added automatically.', zh: '自动增加唯一标识作为排序条件。' }, correct: false }
      - { text: { en: 'The records become equal by value.', zh: '两条记录会变成值相等。' }, correct: false }
      - { text: { en: 'Their order is identical across all possible inputs.', zh: '它们在所有可能输入中的顺序都相同。' }, correct: false }
    explanation: { en: 'Stability preserves an existing relative order; it does not create a deterministic tie-breaker when the source order itself is unspecified.', zh: '稳定性只保留已有相对顺序；如果数据源本身没有顺序保证，它不会凭空生成确定的同值排序条件。' }
    difficulty: beginner
    tags: [stable-sort, comparator]

  - id: spot-default-number-sort
    title: { en: 'Spot the bug in response-time ranking', zh: '找出响应时间排名里的bug' }
    type: spotbug
    prompt: { en: 'Find the bug in this response-time ranking.', zh: '找出这段响应时间排名代码中的错误。' }
    code: |
      const responseTimes = [2, 11, 3];
      const ranked = responseTimes.sort();
      console.log(ranked);
    lang: js
    issues:
      - line: 2
        kind: correctness
        note: { en: 'Array.sort() without a comparator compares string forms, producing [11, 2, 3]. Supply a numeric comparator, and use toSorted() if the source must not be mutated.', zh: 'Array.sort() 不带比较函数时会比较字符串形式，结果为[11, 2, 3]。应提供数值比较函数；若不能修改源数组，还应使用toSorted()。' }
    explanation: { en: 'The default ordering is lexicographic, not numeric, and sort() also mutates responseTimes.', zh: '默认顺序是字典序而不是数值顺序，而且sort() 还会修改responseTimes。' }
    difficulty: beginner
    tags: [spot-bug, comparator, mutation]

  - id: sorted-array-insertion-cost
    type: mcq
    prompt: { en: 'Binary search finds an insertion position in a sorted array in O(log n). Why can the complete insertion still be O(n)?', zh: '二分查找能以O(log n) 找到有序数组的插入位置。为什么完整插入仍可能是O(n)？' }
    options:
      - { text: { en: 'Later elements may all need to shift to open one array slot.', zh: '后续元素可能都要移动，才能腾出一个数组槽位。' }, correct: true }
      - { text: { en: 'Binary search compares every array element after locating the position.', zh: '二分查找定位后还会比较数组中的每个元素。' }, correct: false }
      - { text: { en: 'Stable sorting requires rebuilding a hash table on every insertion.', zh: '稳定排序要求每次插入都重建哈希表。' }, correct: false }
    explanation: { en: 'Finding the boundary and changing the representation are separate costs. Contiguous arrays may move a linear suffix after a logarithmic search.', zh: '定位边界与修改表示是两项独立成本。连续数组在对数查找之后，仍可能移动线性长度的后缀。' }
    difficulty: intermediate
    tags: [binary-search, arrays, complexity]

  - id: review-generated-price-search
    type: review
    title: { en: 'Review a generated price search', zh: '审查生成的价格查找' }
    prompt: { en: 'Review this generated helper before the catalog service uses it.', zh: '请在目录服务使用这段生成的辅助代码前进行审查。' }
    task: { en: 'Build a reusable inclusive price-range lookup over products, preserve caller-owned input order, and return every duplicate boundary price.', zh: '为商品建立可复用的闭区间价格查找，保留调用方拥有的输入顺序，并返回边界价格上的全部重复项。' }
    code: |
      function createPriceSearch(products) {
        const source = products;

        function lowerBound(items, target) {
          let low = 0;
          let high = items.length;

          while (low < high) {
            const middle = low + Math.floor((high - low) / 2);
            if (items[middle].price < target) low = middle + 1;
            else high = middle;
          }

          return low;
        }

        return function search(minimum, maximum) {
          source.sort((left, right) => left.price > right.price);
          const start = lowerBound(source, minimum);
          const end = lowerBound(source, maximum);
          return source.slice(start, end);
        };
      }
    lang: js
    issues:
      - line: 2
        kind: readability
        note: { en: 'The name source hides that this is an alias to caller-owned mutable input. A copied, sorted snapshot with explicit ownership would state the lifetime more clearly.', zh: 'source这个名称掩盖了它只是调用方所拥有可变输入的别名。用名称明确、经过复制的有序快照，才能更清楚表达所有权与生命周期。' }
      - line: 18
        kind: correctness
        note: { en: 'The Boolean comparator never returns a negative result and does not define numeric ascending order. Return left.price - right.price or an explicit three-way comparison.', zh: '这个布尔比较函数永远不会返回负数，无法定义数值升序。应返回left.price - right.price或使用显式三路比较。' }
      - line: 18
        kind: performance
        note: { en: 'Every query sorts again. Build one valid sorted snapshot in createPriceSearch() and reuse it while its immutable-source contract holds.', zh: '每次查询都会重新排序。应在createPriceSearch() 中建立一个有效有序快照，并在不可变数据源契约成立期间复用。' }
      - line: 20
        kind: edge-case
        note: { en: 'A lower bound for maximum excludes products priced exactly at the inclusive upper endpoint. Use an upper-bound search for maximum.', zh: '对maximum执行下界查找，会排除价格恰好等于闭区间上端点的商品。maximum应使用上界查找。' }
    right: { en: 'The code separates boundary search into a helper, uses a terminating half-open loop, and returns a new result array through slice().', zh: '代码把边界查找提取成辅助函数，使用能够终止的半开区间循环，并通过slice() 返回新的结果数组。' }
    checklist:
      - { en: 'Verify comparator signs, stability needs, and duplicate tie policy.', zh: '检查比较函数符号、稳定性需求和重复项策略。' }
      - { en: 'Test inclusive endpoints, empty input, and duplicate prices at both boundaries.', zh: '测试闭区间端点、空输入，以及两个边界上的重复价格。' }
      - { en: 'Confirm who owns the source and whether sorting may mutate it.', zh: '确认谁拥有数据源，以及排序能否修改它。' }
      - { en: 'Count index construction and refresh work separately from query work.', zh: '分别计算索引构建、刷新与查询成本。' }
    explanation: { en: 'Copy and sort once with a valid comparator, retain the lower bound for minimum, and add an upper bound for the inclusive maximum. The resulting abstraction then owns one documented snapshot.', zh: '应先复制数据，再用有效比较函数排序一次；minimum继续使用下界，闭区间maximum则使用上界。这样得到的抽象会拥有一份契约明确的快照。' }
    difficulty: intermediate
    minutes: 9
    tags: [code-review, binary-search, comparator, mutation]
