topic: foundations/hash-maps
items:
  - id: predict-map-key-equality
    type: predict
    prompt: { en: 'What does this JavaScript program print?', zh: '这段 JavaScript 程序会输出什么？' }
    code: |
      const keys = new Map();
      const first = { id: 7 };
      keys.set(first, "first");
      keys.set({ id: 7 }, "second");
      keys.set(NaN, "old");
      keys.set(Number("bad"), "new");
      console.log(keys.size);
      console.log(keys.get({ id: 7 }));
      console.log(keys.get(NaN));
    lang: javascript
    options:
      - { text: { en: "3\nundefined\nnew", zh: "3\nundefined\nnew" }, correct: true }
      - { text: { en: "2\nsecond\nnew", zh: "2\nsecond\nnew" }, correct: false }
      - { text: { en: "4\nundefined\nold", zh: "4\nundefined\nold" }, correct: false }
      - { text: { en: 'It throws because NaN cannot be a key.', zh: '程序抛出异常，因为 NaN 不能作为键。' }, correct: false }
    explanation: { en: 'The object literals are distinct identity-based keys, while SameValueZero treats both NaN values as the same key and updates its value.', zh: '两个对象字面量是按标识区分的键，而 SameValueZero 把两个 NaN 视为同一个键，并更新其值。' }
    difficulty: intermediate
    tags: [map, key-equality, same-value-zero]
    tests: node predict_map_key_equality.js
    minutes: 3

  - id: collision-correctness
    type: mcq
    prompt: { en: 'Two unequal keys select the same bucket. What must a correct hash map do?', zh: '两个不相等的键选中了同一个桶。正确的哈希表必须怎样处理？' }
    options:
      - { text: { en: 'Keep both candidates and use key equality to distinguish them.', zh: '保留两个候选项，并用键相等规则区分它们。' }, correct: true }
      - { text: { en: 'Overwrite the older entry because a bucket can hold only one logical key.', zh: '覆盖较旧条目，因为一个桶只能保存一个逻辑键。' }, correct: false }
      - { text: { en: 'Treat the keys as equal because their bucket indices match.', zh: '因为桶索引相同，所以把两个键视为相等。' }, correct: false }
      - { text: { en: 'Increase the stored hash until it becomes unique.', zh: '持续增加保存的哈希值，直到它唯一。' }, correct: false }
    explanation: { en: 'A bucket or probe path only narrows the candidates. Full key equality confirms a match, because collisions between unequal keys are unavoidable.', zh: '桶或探测路径只会缩小候选范围。不同键之间的冲突不可避免，所以必须用完整键相等规则确认命中。' }
    difficulty: beginner
    tags: [collisions, equality, buckets]
    minutes: 3

  - id: spot-overwriting-collisions
    type: spotbug
    prompt: { en: 'Find the correctness bugs in this generated string map.', zh: '找出这个生成的字符串映射中的正确性缺陷。' }
    code: |
      class TinyMap {
        constructor() {
          this.buckets = Array(8);
        }
        index(key) {
          return [...key].reduce((sum, char) => sum + char.codePointAt(0), 0) % 8;
        }
        set(key, value) {
          this.buckets[this.index(key)] = { key, value };
        }
        get(key) {
          const entry = this.buckets[this.index(key)];
          return entry?.value;
        }
      }
    lang: javascript
    issues:
      - line: 9
        kind: correctness
        note: { en: 'A new key overwrites any unequal key at the same index instead of retaining a collision chain or probing another slot.', zh: '新键会覆盖同一索引处不相等的键，而不是保留冲突链或探测其他槽位。' }
      - line: 13
        kind: edge-case
        note: { en: 'Lookup returns the bucket value without checking that the stored key equals the requested key, so a colliding miss can return unrelated data.', zh: '查找没有确认已存键与请求键相等，发生冲突的未命中可能返回无关数据。' }
    explanation: { en: 'Retain full keys along a collision path and compare them during both set and get. An equal key updates; an unequal colliding key remains a separate entry.', zh: '应在冲突路径中保留完整键，并在 set 与 get 中比较。相等键执行更新，不相等的冲突键保留为独立条目。' }
    difficulty: intermediate
    tags: [spotbug, collision-resolution, equality]
    tests: node --check tiny_map.js
    minutes: 6

  - id: resize-rehash-reason
    type: mcq
    prompt: { en: 'Why must entries normally be relocated when a hash table changes capacity?', zh: '哈希表改变容量时，为什么通常必须移动已有条目？' }
    options:
      - { text: { en: 'The bucket index depends on capacity, so the same hash may select a different index after growth.', zh: '桶索引依赖容量，因此增长后，同一个哈希值可能选择不同索引。' }, correct: true }
      - { text: { en: 'Growth changes which keys compare equal.', zh: '增长会改变哪些键彼此相等。' }, correct: false }
      - { text: { en: 'Every value must be deep-copied so callers cannot mutate it.', zh: '必须深拷贝每个值，避免调用方修改。' }, correct: false }
      - { text: { en: 'A larger array automatically erases all stored hashes.', zh: '更大的数组会自动清除所有已存哈希值。' }, correct: false }
    explanation: { en: 'Index reduction such as hash modulo capacity changes when capacity changes. Reinsertion or an equivalent relocation preserves reachability under the new geometry.', zh: '哈希值对容量取模一类索引缩减会随容量变化。重新插入或等效移动能在新几何结构下保持条目可达。' }
    difficulty: intermediate
    tags: [resizing, rehashing, capacity]
    minutes: 3

  - id: equal-keys-hash-law
    type: mcq
    prompt: { en: 'Which statement is required by a valid hash-equality contract?', zh: '有效的哈希与相等契约必须满足哪项陈述？' }
    options:
      - { text: { en: 'Equal keys must have equal hashes; unequal keys may still collide.', zh: '相等键必须拥有相同哈希值；不相等的键仍然可以冲突。' }, correct: true }
      - { text: { en: 'Equal hashes prove that two keys are equal.', zh: '哈希值相等可以证明两个键相等。' }, correct: false }
      - { text: { en: 'Every unequal key must have a globally unique hash.', zh: '每个不相等的键都必须拥有全局唯一哈希值。' }, correct: false }
      - { text: { en: 'Hash values may change while a key remains stored.', zh: '键仍在表中时，其哈希值可以变化。' }, correct: false }
    explanation: { en: 'Equality implies matching hashes, but matching hashes do not imply equality. The table resolves that many-to-one result by comparing candidate keys.', zh: '相等可以推出哈希值相同，但哈希值相同不能推出相等。表通过比较候选键处理这种多对一结果。' }
    difficulty: intermediate
    tags: [hash-contract, equality, collisions]
    minutes: 3

  - id: review-generated-request-index
    type: review
    title: { en: 'Review an untrusted request index', zh: '审查不可信请求索引' }
    prompt: { en: 'Review this AI-generated request index against its stated task.', zh: '根据给定任务，审查这个 AI 生成的请求索引。' }
    task: { en: 'Index up to 100,000 public request payloads by case-insensitive tenant and arbitrary external ID, preserve stored null, bound each key field to 128 characters, and keep lookup work independent of payload size.', zh: '按不区分大小写的租户和任意外部 ID，为最多 100,000 个公开请求负载建立索引；保留已存 null，把每个键字段限制为 128 个字符，并让查找工作量与负载大小无关。' }
    code: |
      function createRequestIndex(maxEntries = 100_000) {
        const entries = new Map();
        function key(tenant, externalId) {
          return `${tenant.toLowerCase()}:${externalId}`;
        }
        return {
          set(tenant, externalId, payload) {
            const compound = key(tenant, externalId);
            if (!entries.has(compound) && entries.size >= maxEntries) {
              throw new RangeError("index is full");
            }
            entries.set(compound, payload);
          },
          get(tenant, externalId) {
            const compound = `${tenant.trim().toLowerCase()}:${externalId}`;
            return structuredClone(entries.get(compound) ?? null);
          },
          has(tenant, externalId) {
            return entries.has(key(tenant, externalId));
          },
        };
      }
    lang: javascript
    right: { en: 'The code uses Map rather than a prototype-bearing object, normalizes tenant case, enforces the total entry limit without rejecting updates, and exposes a separate membership operation.', zh: '代码使用 Map，而不是带原型的普通对象；它归一化租户大小写，执行总条目上限但不拒绝更新，还提供了独立的成员检查操作。' }
    checklist:
      - { en: 'Define one unambiguous canonical encoding and use it on every operation.', zh: '定义一种无歧义的规范编码，并在每种操作中使用。' }
      - { en: 'Test absent, stored-null, falsey, oversized, delimiter-containing, and differently cased keys.', zh: '测试缺失、已存 null、假值、超长、包含分隔符和大小写不同的键。' }
      - { en: 'Trace every untrusted allocation and enforce both entry-count and key-size limits.', zh: '跟踪每次由不可信输入触发的分配，同时执行条目数与键大小限制。' }
      - { en: 'Account for key hashing, equality, and returned-value work in the lookup cost.', zh: '在查找成本中计入键哈希、相等比较与返回值处理。' }
    issues:
      - line: 4
        kind: edge-case
        note: { en: 'Colon joining is ambiguous for arbitrary fields: pairs such as ("a:b", "c") and ("a", "b:c") produce the same key.', zh: '对任意字段使用冒号连接存在歧义，例如（"a:b", "c"）与（"a", "b:c"）会产生同一个键。' }
      - line: 8
        kind: security
        note: { en: 'Neither key field is checked against the 128-character boundary before hashing and storage, so public input can consume unbounded per-key work and memory.', zh: '求哈希并保存前，没有按 128 字符上限检查任何键字段，因此公开输入可消耗无界的单键工作与内存。' }
      - line: 15
        kind: readability
        note: { en: 'Get duplicates and changes the canonicalization rule by trimming tenant, while set and has call key(); one shared function should define identity.', zh: 'get 重复并改变了规范化规则，对 tenant 额外执行 trim，而 set 与 has 调用 key()；键标识应由同一个函数定义。' }
      - line: 16
        kind: correctness
        note: { en: 'Nullish coalescing makes a stored null indistinguishable from absence, contrary to the task; return a tagged presence result or check has().', zh: '空值合并让已存 null 与缺失无法区分，不符合任务要求；应返回带存在标签的结果，或检查 has()。' }
      - line: 16
        kind: performance
        note: { en: 'Deep-cloning every payload makes lookup proportional to the payload graph rather than independent of payload size.', zh: '每次都深拷贝负载，会让查找成本随负载对象图增长，不再与负载大小无关。' }
    explanation: { en: 'Use one length-prefixed or structured value-key encoding, reject oversized fields before storage, and return an explicit { found, value } result without unconditional deep cloning. Keep the existing entry cap and Map ownership.', zh: '应使用统一的长度前缀编码或结构化值键编码，在保存前拒绝超长字段，并返回明确的 { found, value } 结果，不要无条件深拷贝；现有条目上限与 Map 所有权可以保留。' }
    difficulty: advanced
    tags: [code-review, composite-keys, input-limits, performance]
    tests: node --check generated_request_index.js
    minutes: 18
