topic: foundations/checkpoint-4
items:
  - id: checkpoint-4-tcp-boundary
    type: mcq
    prompt: { en: 'A sender makes two TCP `send()` calls. What may the receiver observe?', zh: '发送方调用两次TCP `send()`。接收方可能观察到什么？' }
    options:
      - { text: { en: 'The bytes may arrive through one or many reads, so the application must define framing.', zh: '这些字节可能通过一次或多次读取到达，因此应用必须自行定义分帧。' }, correct: true }
      - { text: { en: 'Exactly two reads with boundaries matching the two sends.', zh: '恰好读取两次，边界与两次发送完全一致。' }, correct: false }
      - { text: { en: 'The bytes may be reordered even after TCP reports successful delivery.', zh: '即使TCP报告成功交付，字节仍可能乱序。' }, correct: false }
    explanation: { en: 'TCP preserves byte order but not application message boundaries. Receivers must parse a delimiter, length prefix, or another explicit framing contract.', zh: 'TCP保证字节顺序，但不保留应用消息边界。接收方必须按照分隔符、长度前缀或其他明确的分帧约定解析数据。' }
    difficulty: beginner
    tags: [checkpoint]
  - id: checkpoint-4-datagram-term
    type: fill
    prompt: { en: 'Name the transport unit whose message boundary UDP preserves.', zh: '写出UDP会保留消息边界的传输单位名称。' }
    answer: 'datagram'
    explanation: { en: 'UDP sends discrete datagrams, although it does not guarantee their delivery, ordering, or uniqueness.', zh: 'UDP发送离散的数据报，但不保证数据报一定送达、按序到达或仅到达一次。' }
    difficulty: beginner
    tags: [checkpoint]
  - id: checkpoint-4-dns-failure
    type: mcq
    prompt: { en: 'Which diagnostic statement about `NXDOMAIN` is correct?', zh: '关于`NXDOMAIN`，哪项诊断陈述是正确的？' }
    options:
      - { text: { en: 'It is a negative DNS answer about name existence, and it may be cached under negative-caching policy.', zh: '它是关于名称是否存在的DNS否定应答，并且可以按照否定缓存策略缓存。' }, correct: true }
      - { text: { en: 'It proves that the application server accepted and rejected a TCP connection.', zh: '它证明应用服务器接受后又拒绝了TCP连接。' }, correct: false }
      - { text: { en: 'It is always a transient resolver timeout that should be retried immediately.', zh: '它始终是暂时的解析器超时，应立即重试。' }, correct: false }
    explanation: { en: '`NXDOMAIN` is a DNS response code, not a transport timeout or an application result. Diagnostics should retain the queried name, record type, resolver, response code, and cache lifetime.', zh: '`NXDOMAIN`是DNS响应码，不是传输超时或应用结果。诊断信息应保留查询名称、记录类型、解析器、响应码和缓存期限。' }
    difficulty: beginner
    tags: [checkpoint]
  - id: checkpoint-4-dns-lifetime
    type: fill
    prompt: { en: 'Name the DNS record field that bounds how long a cache may ordinarily reuse the current answer.', zh: '写出DNS记录中用于限制缓存通常可以复用当前应答多长时间的字段。' }
    answer: 'TTL'
    explanation: { en: 'The time to live bounds cache reuse of the current record; it is not a promise that the underlying service remains reachable for that duration.', zh: '生存时间限制了缓存复用当前记录的时长，但不保证底层服务在此期间始终可达。' }
    difficulty: intermediate
    tags: [checkpoint]
  - id: checkpoint-4-tls-identity
    type: mcq
    prompt: { en: 'Which checks are required to authenticate the intended TLS service?', zh: '要认证预期的TLS服务，需要完成哪些检查？' }
    options:
      - { text: { en: 'Validate the certificate path against trusted roots and match the requested hostname.', zh: '根据受信任根证书验证证书路径，并匹配请求的主机名。' }, correct: true }
      - { text: { en: 'Accept any signed certificate as long as the bytes are encrypted.', zh: '只要字节已加密，就接受任何带签名的证书。' }, correct: false }
      - { text: { en: 'Match only the connected IP address and skip certificate validation.', zh: '只匹配连接的IP地址，并跳过证书验证。' }, correct: false }
    explanation: { en: 'Encryption, chain trust, and reference-identity matching are distinct properties. Skipping chain or hostname verification can establish encrypted communication with an impersonator.', zh: '加密、证书链信任与引用身份匹配是不同的属性。跳过证书链或主机名验证，可能会与冒充者建立加密通信。' }
    difficulty: intermediate
    tags: [checkpoint]
  - id: checkpoint-4-idempotency
    type: mcq
    prompt: { en: 'What does HTTP method idempotency mean for a retried request?', zh: '对于重试请求，HTTP方法的幂等性意味着什么？' }
    options:
      - { text: { en: 'Repeating the same intended request has the same intended server-side effect, though responses may differ.', zh: '重复同一个预期请求具有相同的预期服务端效果，但响应可能不同。' }, correct: true }
      - { text: { en: 'Every attempt must return byte-for-byte identical response bodies.', zh: '每次尝试都必须返回逐字节完全相同的响应正文。' }, correct: false }
      - { text: { en: 'A timeout proves the first attempt had no effect.', zh: '超时证明第一次尝试没有产生任何效果。' }, correct: false }
    explanation: { en: 'Idempotency constrains intended effects, not response identity. A transport failure leaves the result uncertain, so retries still need method, precondition, and application-contract analysis.', zh: '幂等性约束的是预期效果，而不是响应内容完全一致。传输失败会让结果处于不确定状态，因此是否重试仍需结合方法、前置条件与应用约定判断。' }
    difficulty: intermediate
    tags: [checkpoint]
  - id: checkpoint-4-http2-limit
    type: mcq
    prompt: { en: 'Which limitation remains after HTTP/2 multiplexes many streams over one TCP connection?', zh: 'HTTP/2在一条TCP连接上多路复用多个流之后，仍然存在哪项限制？' }
    options:
      - { text: { en: 'TCP packet loss can still delay progress across streams on that connection.', zh: 'TCP丢包仍可能延迟该连接上多个流的进展。' }, correct: true }
      - { text: { en: 'Only one HTTP request may be active at a time.', zh: '同一时间只能有一个HTTP请求处于活动状态。' }, correct: false }
      - { text: { en: 'HTTP methods and status codes no longer have meaning.', zh: 'HTTP方法和状态码不再具有含义。' }, correct: false }
    explanation: { en: 'HTTP/2 removes HTTP/1.1 response-order blocking at the HTTP layer, but all streams still share TCP ordering and recovery below it.', zh: 'HTTP/2消除了HTTP层的HTTP/1.1响应顺序阻塞，但所有流在下层仍共享TCP的顺序与恢复机制。' }
    difficulty: advanced
    tags: [checkpoint]
  - id: checkpoint-4-websocket-recovery
    type: mcq
    prompt: { en: 'Which recovery design handles uncertainty after a WebSocket connection drops during a side-effecting message?', zh: 'WebSocket连接在发送会产生副作用的消息时中断，哪种恢复设计能处理结果不确定性？' }
    options:
      - { text: { en: 'Use message IDs, acknowledgements, deduplication, resume cursors, and a bounded outbound queue.', zh: '使用消息ID、确认、去重、恢复游标和有容量上限的出站队列。' }, correct: true }
      - { text: { en: 'Reconnect and resend every buffered message without identity or limits.', zh: '重新连接后，不设消息身份和数量限制地重发所有缓冲消息。' }, correct: false }
      - { text: { en: 'Assume a successful reconnect restores the old connection and its delivery state.', zh: '假设重新连接成功就会恢复旧连接及其交付状态。' }, correct: false }
    explanation: { en: 'A new connection does not reveal whether the peer applied the last message. Application-level identity, acknowledgement, deduplication, and bounded backpressure make recovery explicit.', zh: '新连接无法说明对端是否已经处理最后一条消息。应用层的身份标识、确认、去重以及有界背压能把恢复行为明确下来。' }
    difficulty: advanced
    tags: [checkpoint]
