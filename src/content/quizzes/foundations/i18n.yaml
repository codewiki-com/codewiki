topic: foundations/i18n
items:
  - id: predict-french-zero
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      const rules = new Intl.PluralRules("fr");
      console.log(rules.select(0));
    lang: javascript
    options:
      - { text: { en: 'zero', zh: 'zero' }, correct: false }
      - { text: { en: 'one', zh: 'one' }, correct: true }
      - { text: { en: 'other', zh: 'other' }, correct: false }
      - { text: { en: 'It throws RangeError.', zh: '程序抛出 RangeError。' }, correct: false }
    explanation: { en: 'French cardinal rules select the one category for 0 in the verified Node 24 runtime. Plural categories are locale data, not a universal count-equals-one condition.', zh: '在已验证的 Node 24 运行时中，法语基数规则会为 0 选择 one 类别。复数类别来自区域数据，不是通用的 count 等于 1 判断。' }
    difficulty: intermediate
    tags: [intl, plural-rules, predict-output]
    tests: node predict_french_zero.js
    minutes: 2

  - id: separate-locale-and-currency
    type: mcq
    prompt: { en: 'Which inputs correctly describe formatting an order total?', zh: '哪些输入能正确描述订单总额的格式化？' }
    options:
      - { text: { en: 'A numeric amount, its currency code, and the display locale.', zh: '数值金额、对应货币代码和展示区域设置。' }, correct: true }
      - { text: { en: 'Only the display locale, because it uniquely determines the currency.', zh: '只提供展示区域设置，因为它能唯一决定货币。' }, correct: false }
      - { text: { en: 'Only a preformatted string such as $1,234.50.', zh: '只提供类似 $1,234.50 的预格式化字符串。' }, correct: false }
      - { text: { en: 'An IP-derived country and the browser language.', zh: '根据 IP 推断的国家和浏览器语言。' }, correct: false }
    explanation: { en: 'Currency is an order fact, while locale controls presentation conventions. Keeping the amount and currency structured also avoids parsing formatted output back into data.', zh: '货币属于订单事实，区域设置控制展示约定。把金额和货币保留为结构化数据，也能避免从格式化输出反向解析。' }
    difficulty: beginner
    tags: [currency, locale, data-model]
    minutes: 3

  - id: spot-rich-message-injection
    title: { en: 'Spot the bug in the localized welcome', zh: '找出本地化欢迎消息里的 bug' }
    type: spotbug
    prompt: { en: 'Find the security boundary broken by this localized welcome message.', zh: '找出这条本地化欢迎消息破坏的安全边界。' }
    code: |
      function showWelcome(container, messages, customerName) {
        const welcome = messages.welcome.replace(
          "{customerName}",
          customerName,
        );
        container.innerHTML = welcome;
      }
    lang: javascript
    issues:
      - line: 6
        kind: security
        note: { en: 'The translated template and customer name reach innerHTML without an allowlisted rich-text structure or text escaping, enabling markup injection.', zh: '翻译模板与客户姓名未经富文本结构允许列表或文本转义就进入 innerHTML，可能造成标记注入。' }
    explanation: { en: 'Render ordinary variables through textContent or framework text interpolation. If rich text is required, parse a restricted message format whose component slots and link targets are controlled by code.', zh: '普通变量应通过 textContent 或框架的文本插值渲染。确需富文本时，应解析受限消息格式，并由代码控制组件槽位和链接目标。' }
    difficulty: intermediate
    tags: [xss, messages, escaping]
    tests: node --check rich_message.js
    minutes: 4

  - id: choose-rtl-boundary
    type: mcq
    prompt: { en: 'What is the soundest way to adapt an HTML application to an RTL locale?', zh: '让 HTML 应用适配 RTL 区域设置时，哪种做法最可靠？' }
    options:
      - { text: { en: 'Update lang and dir together, use logical CSS properties, isolate unknown-direction fragments, and review icon semantics.', zh: '同步更新 lang 与 dir，使用逻辑 CSS 属性，隔离方向未知的片段，并审查图标语义。' }, correct: true }
      - { text: { en: 'Set text-align to right on the body and leave the rest unchanged.', zh: '只把 body 的 text-align 设为 right，其余不变。' }, correct: false }
      - { text: { en: 'Apply scaleX(-1) to the entire application.', zh: '对整个应用使用 scaleX(-1)。' }, correct: false }
      - { text: { en: 'Insert direction-control characters into every translated string.', zh: '在每条译文中插入方向控制字符。' }, correct: false }
    explanation: { en: 'Language metadata, base direction, layout axes, inline isolation, and icon meaning are separate concerns. A single alignment or transform rule cannot satisfy all of them.', zh: '语言元数据、基础方向、布局轴、行内隔离和图标含义是不同问题。单一的对齐或变换规则无法同时解决它们。' }
    difficulty: intermediate
    tags: [rtl, bidi, css-logical-properties]
    minutes: 3

  - id: review-generated-invoice
    title: { en: 'Review generated invoice renderer', zh: '审查生成的发票渲染器' }
    type: review
    prompt: { en: 'Review this generated invoice renderer.', zh: '审查这个生成的发票渲染器。' }
    task: { en: 'Render an invoice with an already resolved locale, explicit order currency and time zone, a localized item-count message, safe customer text, and consistent document language and direction.', zh: '使用已解析的区域设置、订单中明确的货币和时区、本地化的商品数量消息及安全的客户文本渲染发票，并保持文档语言与方向一致。' }
    code: |
      function renderInvoice(order, requestedLocale) {
        const locale = requestedLocale || navigator.language;
        const currency = locale.endsWith("-US") ? "USD" : "EUR";
        const amount = order.total.toLocaleString(locale);
        const placedAt = new Intl.DateTimeFormat(locale, {
          dateStyle: "medium",
          timeZone: order.timeZone,
        }).format(new Date(order.placedAt));
        const itemLabel =
          order.items.length === 1
            ? `${order.items.length} item`
            : `${order.items.length} items`;
        const customer = order.customerName;
        const html = `
          <h2>${customer}</h2>
          <p>${itemLabel}</p>
          <p>${amount} ${currency}</p>
          <time>${placedAt}</time>
        `;
        document.querySelector("#invoice").innerHTML = html;
        document.documentElement.dir = locale.startsWith("ar") ? "rtl" : "ltr";
        return html;
      }
    lang: javascript
    right: { en: 'The function accepts a locale input, keeps rendering in one function, leaves the order object unchanged, and attempts to update document direction when the presentation changes.', zh: '函数接收区域设置输入，把渲染集中在一个函数中，不修改订单对象，并在展示变化时尝试更新文档方向。' }
    checklist:
      - { en: 'Trace locale, currency, time zone, and numeric values to authoritative sources.', zh: '追踪区域设置、货币、时区和数值的权威来源。' }
      - { en: 'Run catalog validation for keys, placeholders, and every possible plural category.', zh: '对消息键、占位符和所有可能的复数类别运行目录校验。' }
      - { en: 'Test customer-controlled values as text and reject executable translation markup.', zh: '把客户可控值作为文本测试，并拒绝可执行的翻译标记。' }
      - { en: 'Compare server and client output under a nondefault time zone and an RTL locale.', zh: '在非默认时区与 RTL 区域设置下比较服务端和客户端输出。' }
    issues:
      - line: 3
        lines: 2
        kind: correctness
        note: { en: 'The code guesses currency from locale and formats the total as a decimal before appending that guess. It must use order.currency with currency style.', zh: '代码根据区域设置猜测货币，把总额格式化为十进制数后再拼接猜测值。它应使用 order.currency 和 currency 样式。' }
      - line: 9
        lines: 4
        kind: edge-case
        note: { en: 'The item message hard-codes an English binary plural and bypasses locale plural categories and the message catalog.', zh: '商品消息硬编码了英语二分复数，并绕过区域复数类别与消息目录。' }
      - line: 20
        kind: security
        note: { en: 'customerName reaches innerHTML without escaping, so customer-controlled markup can execute in the page.', zh: 'customerName 未经转义就进入 innerHTML，客户可控的标记可能在页面中执行。' }
      - line: 21
        kind: readability
        note: { en: 'The renderer re-resolves locale and embeds direction policy as an Arabic prefix check, while lang is never updated. Resolve locale metadata once and update lang and dir together.', zh: '渲染器重新解析区域设置，并把方向策略写成阿拉伯语前缀判断，而且从未更新 lang。应统一解析区域元数据，并同步更新 lang 与 dir。' }
    explanation: { en: 'Use the already resolved locale, format order.total with order.currency and order.timeZone, select a complete catalog message through Intl.PluralRules, and build DOM nodes with textContent or safe framework interpolation. Central locale metadata should drive both lang and dir.', zh: '应使用已解析的区域设置，结合 order.currency 与 order.timeZone 格式化 order.total，通过 Intl.PluralRules 选择完整目录消息，并用 textContent 或框架安全插值构建 DOM。lang 与 dir 都应由统一的区域元数据驱动。' }
    difficulty: advanced
    tags: [code-review, intl, xss, rtl]
    tests: node --check generated_invoice.js
    minutes: 12
