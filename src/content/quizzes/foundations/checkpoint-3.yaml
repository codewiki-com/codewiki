topic: foundations/checkpoint-3
items:
  - id: checkpoint-3-kernel-boundary
    type: mcq
    prompt: { en: 'Which statement correctly separates the Linux kernel from user space?', zh: '哪项陈述正确区分了 Linux 内核与用户空间？' }
    options:
      - { text: { en: 'The kernel manages protected resources, and user-space programs request operations through system calls.', zh: '内核管理受保护的资源，用户空间程序通过系统调用请求操作。' }, correct: true }
      - { text: { en: 'Every shell command runs inside the kernel with unrestricted access.', zh: '每条 Shell 命令都在内核中运行，并拥有不受限制的访问权限。' }, correct: false }
      - { text: { en: 'A Linux distribution and the kernel are the same executable.', zh: 'Linux 发行版与内核是同一个可执行文件。' }, correct: false }
    explanation: { en: 'The kernel enforces process, memory, device, and networking boundaries. Shells and most administration tools are ordinary user-space programs.', zh: '内核负责实施进程、内存、设备和网络边界；Shell 与大多数管理工具都是普通的用户空间程序。' }
    difficulty: beginner
    tags: [checkpoint]
  - id: checkpoint-3-stderr-descriptor
    type: fill
    prompt: { en: 'Give the conventional file-descriptor number for standard error.', zh: '写出标准错误所对应的常规文件描述符编号。' }
    answer: '2'
    explanation: { en: 'Processes conventionally start with standard input on 0, standard output on 1, and standard error on 2.', zh: '进程启动时通常把标准输入设为 0、标准输出设为 1、标准错误设为 2。' }
    difficulty: beginner
    tags: [checkpoint]
  - id: checkpoint-3-sharing-boundary
    type: mcq
    prompt: { en: 'Which statement describes the default memory relationship between threads in one process?', zh: '哪项陈述描述了同一进程内线程之间默认的内存关系？' }
    options:
      - { text: { en: 'They share the process address space, so mutable shared state needs synchronization.', zh: '它们共享进程地址空间，因此共享的可变状态需要同步。' }, correct: true }
      - { text: { en: 'Each thread receives an isolated copy of every process mapping.', zh: '每个线程都会获得所有进程映射的独立副本。' }, correct: false }
      - { text: { en: 'A context switch automatically commits all updates as one transaction.', zh: '上下文切换会自动把所有更新作为一个事务提交。' }, correct: false }
    explanation: { en: 'Threads have separate execution stacks but share process resources and mappings. Scheduling alone provides neither atomicity nor a safe publication order.', zh: '线程拥有各自的执行栈，但共享进程资源与映射。仅靠调度既不能提供原子性，也不能保证安全的发布顺序。' }
    difficulty: beginner
    tags: [checkpoint]
  - id: checkpoint-3-lifecycle
    type: fill
    prompt: { en: 'Name the lifecycle operation that waits for a worker thread or child process to finish and collects its completion.', zh: '写出等待工作线程或子进程结束并收集其完成状态的生命周期操作。' }
    answer: 'join'
    explanation: { en: 'Joining makes lifecycle ownership explicit and prevents the parent from silently abandoning completion or cleanup.', zh: 'join 操作明确了生命周期所有权，防止父执行单元悄然放弃完成状态或清理工作。' }
    difficulty: intermediate
    tags: [checkpoint]
  - id: checkpoint-3-page-fault
    type: mcq
    prompt: { en: 'What does a page fault prove by itself?', zh: '一次缺页异常本身能够证明什么？' }
    options:
      - { text: { en: 'The current address translation or access needs kernel handling.', zh: '当前地址转换或访问需要内核处理。' }, correct: true }
      - { text: { en: 'The process has exhausted all physical memory.', zh: '进程已经耗尽全部物理内存。' }, correct: false }
      - { text: { en: 'The requested page must be read from swap on disk.', zh: '请求的页一定要从磁盘交换空间读取。' }, correct: false }
    explanation: { en: 'A fault may materialize a zero-filled page, load file-backed data, perform copy-on-write, or report an invalid access; it does not imply disk I/O or OOM.', zh: '缺页异常可能用于创建零填充页、载入文件映射数据、执行写时复制，或报告非法访问；它并不必然意味着磁盘 I/O 或内存耗尽。' }
    difficulty: intermediate
    tags: [checkpoint]
  - id: checkpoint-3-argument-boundary
    type: fill
    prompt: { en: 'Write the Bash expansion that forwards all positional parameters while preserving each argument boundary.', zh: '写出 Bash 中转发全部位置参数且保留每个参数边界的展开形式。' }
    answer: '"$@"'
    explanation: { en: 'Inside double quotes, `"$@"` expands each positional parameter as a separate argument, including arguments containing spaces or glob characters.', zh: '在双引号内，`"$@"` 会把每个位置参数展开为独立参数，包括含空格或通配符的参数。' }
    difficulty: intermediate
    tags: [checkpoint]
  - id: checkpoint-3-redirection-order
    type: mcq
    prompt: { en: 'What happens in `command >out.log 2>&1`?', zh: '执行 `command >out.log 2>&1` 时会发生什么？' }
    options:
      - { text: { en: 'Standard output goes to `out.log`, then standard error is duplicated to that same destination.', zh: '标准输出先指向 `out.log`，随后标准错误复制到同一目标。' }, correct: true }
      - { text: { en: 'Standard error goes to the original terminal because redirection order never matters.', zh: '标准错误仍指向原终端，因为重定向顺序从不影响结果。' }, correct: false }
      - { text: { en: 'The shell writes descriptor 2 into a file named `&1`.', zh: 'Shell 会把文件描述符 2 写入名为 `&1` 的文件。' }, correct: false }
    explanation: { en: 'Redirections are applied from left to right. Descriptor 2 copies descriptor 1 only after descriptor 1 has been redirected to the file.', zh: '重定向按从左到右的顺序应用。文件描述符 1 指向文件后，文件描述符 2 才复制它的目标。' }
    difficulty: advanced
    tags: [checkpoint]
  - id: checkpoint-3-git-recovery
    type: mcq
    prompt: { en: 'A developer moved a local branch reference and can no longer see a recent commit in ordinary log output. What is the narrowest first recovery step?', zh: '开发者移动了本地分支引用，普通日志中不再显示最近的一次提交。最合适的第一步恢复操作是什么？' }
    options:
      - { text: { en: 'Inspect `git reflog`, verify the old object, and create a recovery reference to it.', zh: '检查 `git reflog`，核实旧对象，再为它创建恢复引用。' }, correct: true }
      - { text: { en: 'Run garbage collection immediately so unreachable objects are easier to find.', zh: '立即运行垃圾回收，让不可达对象更容易找到。' }, correct: false }
      - { text: { en: 'Rebase every shared branch onto the missing commit hash.', zh: '把所有共享分支都变基到丢失的提交哈希上。' }, correct: false }
    explanation: { en: 'The reflog records recent local reference movements. Creating a verified recovery reference restores reachability without rewriting unrelated shared history.', zh: 'reflog 会记录近期的本地引用移动。为核实后的旧对象创建恢复引用，可以在不改写无关共享历史的情况下恢复其可达性。' }
    difficulty: advanced
    tags: [checkpoint]
