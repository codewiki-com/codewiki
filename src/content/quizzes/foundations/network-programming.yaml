topic: foundations/network-programming
items:
  - id: predict-orderly-eof
    type: predict
    prompt: { en: 'What does this local stream-socket program print?', zh: '这个本地流式套接字程序会输出什么？' }
    code: |
      from socket import SHUT_WR, socketpair

      sender, receiver = socketpair()
      with sender, receiver:
          sender.sendall(b"ok")
          sender.shutdown(SHUT_WR)
          print(receiver.recv(2))
          print(receiver.recv(2))
    lang: python
    options:
      - { text: { en: "b'ok'\nb''", zh: "b'ok'\nb''" }, correct: true }
      - { text: { en: "b'ok'\nTimeoutError", zh: "b'ok'\nTimeoutError" }, correct: false }
      - { text: { en: "b'ok'\nb'ok'", zh: "b'ok'\nb'ok'" }, correct: false }
      - { text: { en: 'The first recv raises ConnectionResetError.', zh: '第一次 recv 抛出 ConnectionResetError。' }, correct: false }
    explanation: { en: 'The first read consumes the queued bytes. After an orderly write-side shutdown, the next read returns an empty byte string to signal EOF.', zh: '第一次读取取得已排队的字节。有序关闭写方向后，下一次读取返回空字节串，表示 EOF。' }
    difficulty: beginner
    tags: [tcp, eof, shutdown]
    tests: python3 predict_orderly_eof.py
    minutes: 3

  - id: tcp-write-boundaries
    type: mcq
    prompt: { en: 'A TCP sender calls sendall() twice with two application messages. What may the receiver observe?', zh: 'TCP 发送方用两次 sendall() 发送两条应用消息。接收方可能观察到什么？' }
    options:
      - { text: { en: 'Exactly two recv() results with the same boundaries', zh: '恰好两次 recv()，边界与发送时完全相同' }, correct: false }
      - { text: { en: 'One combined read, several partial reads, or other splits that preserve byte order', zh: '一次合并读取、多次部分读取，或其他保持字节顺序的切分' }, correct: true }
      - { text: { en: 'The two messages in reverse order when the network is congested', zh: '网络拥塞时，两条消息按相反顺序出现' }, correct: false }
      - { text: { en: 'Only the second message because TCP overwrites its send buffer', zh: '只收到第二条消息，因为 TCP 会覆盖发送缓冲区' }, correct: false }
    explanation: { en: 'TCP preserves byte order but exposes no application message boundaries. Framing must recover messages independently of recv() chunking.', zh: 'TCP 保证字节顺序，但不提供应用消息边界。消息分帧必须独立于 recv() 的切分方式恢复消息。' }
    difficulty: beginner
    tags: [tcp, byte-stream, framing]
    minutes: 3

  - id: spot-length-reader
    title: { en: 'Spot the bug in the framed message reader', zh: '找出分帧消息读取器里的 bug' }
    type: spotbug
    prompt: { en: 'Find the framing bugs in this generated reader.', zh: '找出这个生成的读取函数中的分帧错误。' }
    code: |
      from struct import Struct

      HEADER = Struct("!I")

      def receive_message(sock):
          header = sock.recv(HEADER.size)
          (size,) = HEADER.unpack(header)
          payload = sock.recv(size)
          return payload.decode("utf-8")
    lang: python
    issues:
      - line: 6
        kind: correctness
        note: { en: 'recv() may return fewer than four bytes, so unpacking the result can fail even though the connection remains valid.', zh: 'recv() 可能返回不足四字节的结果；即使连接仍然有效，随后解包也会失败。' }
      - line: 7
        kind: edge-case
        note: { en: 'The untrusted length has no upper bound before the function waits for or allocates work around the payload.', zh: '函数在等待或处理负载前，没有为不可信的长度设置上限。' }
      - line: 8
        kind: correctness
        note: { en: 'One recv(size) can return a partial payload, so decode may see an incomplete message.', zh: '一次 recv(size) 可能只返回部分负载，decode 因此会看到不完整消息。' }
    explanation: { en: 'Read exactly the fixed header, reject lengths above a configured maximum, and then read exactly that many payload bytes under an operation deadline. Treat early EOF as truncation.', zh: '应先完整读取固定头并拒绝超过配置上限的长度，再在操作截止时间内读满相应负载；提前 EOF 应视为截断。' }
    difficulty: intermediate
    tags: [framing, partial-read, limits]
    tests: python3 -m py_compile length_reader.py
    minutes: 7

  - id: udp-receive-buffer
    type: mcq
    prompt: { en: 'What happens when a UDP datagram is larger than the buffer passed to a basic recvfrom() call?', zh: 'UDP 数据报大于基础 recvfrom() 调用提供的缓冲区时会怎样？' }
    options:
      - { text: { en: 'The remainder is returned by the next recvfrom() call.', zh: '剩余部分会由下一次 recvfrom() 返回。' }, correct: false }
      - { text: { en: 'The call waits until the application provides a larger buffer.', zh: '调用会一直等待应用提供更大的缓冲区。' }, correct: false }
      - { text: { en: 'The returned payload is truncated; the remainder is not a second datagram fragment for the application to read.', zh: '返回的负载被截断；剩余内容不会成为应用下一次可读的数据报片段。' }, correct: true }
      - { text: { en: 'UDP transparently converts the datagram into a TCP stream.', zh: 'UDP 会透明地把该数据报转换为 TCP 字节流。' }, correct: false }
    explanation: { en: 'Datagram boundaries are preserved, but a too-small receive buffer loses the excess at this API boundary. Protocol size limits and truncation-aware APIs prevent silent corruption.', zh: '数据报边界会保留，但接收缓冲区过小时，多余部分会在 API 边界丢失。协议大小限制和可报告截断的 API 能避免静默损坏。' }
    difficulty: intermediate
    tags: [udp, datagram, truncation]
    minutes: 4

  - id: review-generated-command-server
    title: { en: 'Review generated JSON command server', zh: '审查生成的 JSON 命令服务器' }
    type: review
    prompt: { en: 'Review this AI-generated command server against its stated task.', zh: '根据给定任务，审查这个 AI 生成的命令服务器。' }
    task: { en: 'Serve public length-prefixed JSON commands with a 64 KiB message limit, a two-second operation deadline, bounded concurrency, and deterministic socket cleanup.', zh: '对外提供长度前缀 JSON 命令服务，消息上限为 64 KiB，操作截止时间为两秒，并限制并发且确定性清理套接字。' }
    code: |
      import json
      import pickle
      import socket
      import struct
      from threading import Thread

      def handle(connection):
          header = connection.recv(4)
          (size,) = struct.unpack("!I", header)
          body = connection.recv(size)
          command = pickle.loads(body)
          response = json.dumps({"accepted": command})
          connection.send(response.encode())
          connection.close()

      def serve():
          listener = socket.socket()
          listener.bind(("0.0.0.0", 9000))
          listener.listen()
          while True:
              connection, _ = listener.accept()
              Thread(target=handle, args=(connection,), daemon=True).start()

      serve()
    lang: python
    right: { en: 'The code separates connection handling from acceptance, uses a network-order length field, listens before accepting, and serializes its response with JSON.', zh: '代码把连接处理与接收连接分开，长度字段使用网络字节序，在 accept 前进入监听状态，并用 JSON 序列化响应。' }
    checklist:
      - { en: 'Trace exact-header, exact-payload, early-EOF, oversize, malformed-JSON, and partial-write paths.', zh: '跟踪完整头、完整负载、提前 EOF、超长消息、畸形 JSON 和部分写入路径。' }
      - { en: 'Enforce one overall deadline and a concurrency budget before accepting more work.', zh: '在接收更多工作前，执行一个整体截止时间和并发预算。' }
      - { en: 'Use a safe decoder for the declared wire format and keep authentication ahead of command execution.', zh: '使用符合声明线上格式的安全解码器，并在执行命令前完成认证。' }
      - { en: 'Prove that listener and connection sockets close on success, error, timeout, cancellation, and shutdown.', zh: '证明监听与连接套接字会在成功、错误、超时、取消和停机路径中关闭。' }
    issues:
      - line: 11
        kind: security
        note: { en: 'pickle can execute attacker-controlled constructors and does not match the task requirement to accept JSON from an untrusted network.', zh: 'pickle 可能执行攻击者控制的构造逻辑，也不符合任务要求的公网 JSON 输入格式。' }
      - line: 8
        kind: correctness
        note: { en: 'One recv(4) does not guarantee a complete header; an early EOF or partial read makes unpack fail.', zh: '一次 recv(4) 不保证得到完整头；提前 EOF 或部分读取会让 unpack 失败。' }
      - line: 9
        kind: edge-case
        note: { en: 'The declared size is not checked against 64 KiB, and no two-second deadline limits a slow or incomplete payload.', zh: '声明长度没有与 64 KiB 上限比较，也没有两秒截止时间限制缓慢或不完整的负载。' }
      - line: 22
        kind: performance
        note: { en: 'Every connection creates an unbounded daemon thread, so slow clients can exhaust threads and descriptors.', zh: '每条连接都会创建一个无界守护线程，慢速客户端可能耗尽线程与描述符。' }
      - line: 14
        kind: readability
        note: { en: 'Cleanup exists only on the success path; context managers or try/finally would make ownership and exceptional cleanup explicit.', zh: '清理只存在于成功路径；上下文管理器或 try/finally 能明确表达所有权与异常清理。' }
    explanation: { en: 'Use a bounded worker model and make one handler own each connection in a context manager. Read the header and payload exactly under one deadline, validate the size before buffering, decode JSON safely, authenticate, and use sendall() for the framed response.', zh: '应采用有界工作模型，并让单个处理器通过上下文管理器拥有连接。在同一截止时间内完整读取头与负载，缓冲前校验大小，安全解码 JSON 并完成认证，再用 sendall() 发送分帧响应。' }
    difficulty: advanced
    tags: [code-review, sockets, security, lifecycle]
    tests: python3 -m py_compile generated_command_server.py
    minutes: 18
