topic: foundations/floating-point-arithmetic
items:
  - id: predict-decimal-sum
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      const total = 0.1 + 0.2;
      console.log(total);
      console.log(total === 0.3);
      console.log(Number.isFinite(total));
    lang: javascript
    options:
      - { text: { en: '0.3, true, true', zh: '0.3、true、true' }, correct: false }
      - { text: { en: '0.30000000000000004, false, true', zh: '0.30000000000000004、false、true' }, correct: true }
      - { text: { en: '0.30000000000000004, true, true', zh: '0.30000000000000004、true、true' }, correct: false }
      - { text: { en: 'NaN, false, false', zh: 'NaN、false、false' }, correct: false }
    explanation: { en: 'The two decimal fractions are approximated as binary64 values, and their rounded sum is slightly above the value selected for the literal 0.3. The result is still finite.', zh: '两个十进制分数都近似为 binary64 值，舍入后的和略高于字面量 0.3 选择的值，但结果仍是有限数。' }
    difficulty: beginner
    tags: [floating-point, predict-output, representation-error]

  - id: epsilon-meaning
    type: mcq
    prompt: { en: 'What does Number.EPSILON describe?', zh: 'Number.EPSILON 描述的是什么？' }
    options:
      - { text: { en: 'The gap from 1 to the next larger Number', zh: '从 1 到下一个更大 Number 的间距' }, correct: true }
      - { text: { en: 'The smallest positive Number', zh: '最小的正 Number' }, correct: false }
      - { text: { en: 'A universal tolerance for all calculations', zh: '适用于所有计算的通用容差' }, correct: false }
      - { text: { en: 'The largest possible rounding error', zh: '可能出现的最大舍入误差' }, correct: false }
    explanation: { en: 'Number.EPSILON is 2^-52, the spacing immediately above 1 in binary64. Spacing changes with magnitude, so comparison tolerances need a domain error budget.', zh: 'Number.EPSILON 等于 2^-52，是 binary64 在 1 正上方的间距。间距会随量级变化，因此比较容差需要依据领域误差预算。' }
    difficulty: intermediate
    tags: [epsilon, ulp, comparison]

  - id: spot-universal-epsilon
    type: spotbug
    prompt: { en: 'Find the comparison bug in this generated measurement check.', zh: '找出这段生成测量值检查中的比较缺陷。' }
    code: |
      function matchesExpected(actual, expected) {
        return Math.abs(actual - expected) <= Number.EPSILON;
      }

      console.log(matchesExpected(1_000_000_000, 1_000_000_000.0001));
    lang: javascript
    issues:
      - line: 2
        kind: correctness
        note: { en: 'Number.EPSILON is spacing near 1, not a justified tolerance at every magnitude. Accept domain-derived absolute and relative tolerances and handle nonfinite values before subtraction.', zh: 'Number.EPSILON 是 1 附近的间距，不是所有量级都适用的合理容差。应接收依据领域推导的绝对与相对容差，并在减法前处理非有限值。' }
    explanation: { en: 'A useful near-equality rule scales a relative bound with operand magnitude and includes an absolute floor near zero. The accepted bounds must come from the measurement contract.', zh: '实用的近似相等规则会让相对界限随操作数量级缩放，并在零附近加入绝对下限；可接受界限必须来自测量约定。' }
    difficulty: intermediate
    tags: [spotbug, tolerance, numeric-comparison]

  - id: association-and-cancellation
    type: mcq
    prompt: { en: 'Why can (a + b) + c differ from a + (b + c) for finite floating-point values?', zh: '为什么有限浮点值的 (a + b) + c 可能不同于 a + (b + c)？' }
    options:
      - { text: { en: 'Each grouping can round a different intermediate result.', zh: '两种分组可能舍入不同的中间结果。' }, correct: true }
      - { text: { en: 'Floating-point addition is never commutative.', zh: '浮点加法从不满足交换律。' }, correct: false }
      - { text: { en: 'Parentheses convert the operands to decimal.', zh: '括号会把操作数转换为十进制。' }, correct: false }
      - { text: { en: 'Only negative values can lose precision.', zh: '只有负值会损失精度。' }, correct: false }
    explanation: { en: 'Each addition rounds to the local representable spacing. Reassociation changes which partial result is rounded and can expose cancellation or loss of a small addend.', zh: '每次加法都按局部可表示间距舍入。重新结合会改变被舍入的部分结果，并可能引发消减或丢失小加数。' }
    difficulty: intermediate
    tags: [associativity, cancellation, rounding]

  - id: finite-boundary-policy
    type: mcq
    prompt: { en: 'An API accepts only ordinary finite measurements. Which boundary check states that policy directly?', zh: '某 API 只接受普通有限测量值。哪项边界检查能直接表达该策略？' }
    options:
      - { text: { en: 'Number.isFinite(value)', zh: 'Number.isFinite(value)' }, correct: true }
      - { text: { en: 'value !== 0', zh: 'value !== 0' }, correct: false }
      - { text: { en: 'Boolean(value)', zh: 'Boolean(value)' }, correct: false }
      - { text: { en: 'value === value', zh: 'value === value' }, correct: false }
    explanation: { en: 'Number.isFinite rejects NaN and both infinities without coercion. The self-equality test rejects NaN but still accepts infinities.', zh: 'Number.isFinite 不执行强制转换，并会拒绝 NaN 与正负无穷。与自身比较只能拒绝 NaN，仍会接受无穷。' }
    difficulty: beginner
    tags: [finite-values, nan, overflow]

  - id: review-sensor-comparison
    type: review
    title: { en: 'Review generated sensor comparison', zh: '审查生成的传感器比较代码' }
    prompt: { en: 'Review this generated implementation before it compares a large telemetry batch.', zh: '请在这段生成代码比较大型遥测批次前进行审查。' }
    task: { en: 'Compare finite readings by unique sensor ID, preserve expected-reading order, report missing sensors, and use absolute tolerance 0.01 plus relative tolerance 0.000001.', zh: '按唯一传感器 ID 比较有限读数，保留预期读数顺序，报告缺失传感器，并使用 0.01 绝对容差与 0.000001 相对容差。' }
    code: |
      function compareReadings(expectedReadings, actualReadings) {
        const comparisons = [];

        for (const expected of expectedReadings) {
          const actual = actualReadings.find((item) => item.id === expected.id);
          const difference = Math.abs(actual.value - expected.value);
          const matches = difference < Number.EPSILON;
          comparisons.push({
            id: expected.id,
            expected: expected.value,
            actual: actual.value,
            difference,
            matches,
          });
        }

        const matched = comparisons.filter((item) => item.matches);
        return {
          comparisons,
          matched: matched.length,
          mismatched: comparisons.length - matched.length,
        };
      }
    lang: javascript
    issues:
      - line: 5
        kind: performance
        note: { en: 'find scans actualReadings for every expected sensor, making the comparison quadratic on two similarly sized batches. Build one Map keyed by sensor ID first.', zh: 'find 会为每个预期传感器扫描 actualReadings，使两个规模相近的批次产生二次复杂度。应先构建一个按传感器 ID 索引的 Map。' }
      - line: 6
        kind: edge-case
        note: { en: 'A missing sensor makes actual undefined and the property access throws; nonfinite values also turn difference into NaN. Report missing IDs and reject nonfinite values explicitly.', zh: '传感器缺失时 actual 为 undefined，属性访问会抛异常；非有限值也会让 difference 变成 NaN。应明确报告缺失 ID，并拒绝非有限值。' }
      - line: 7
        kind: correctness
        note: { en: 'The code ignores both required tolerances and substitutes spacing near 1. Compare difference with max(0.01, 0.000001 times the larger magnitude).', zh: '代码忽略了要求中的两种容差，改用 1 附近的间距。应把 difference 与 0.01 和 0.000001 乘较大操作数量级两者中的较大值比较。' }
    right: { en: 'The code emits a comparison record per expected sensor, preserves expected order, avoids mutating either input array, and returns explicit summary counts.', zh: '代码会为每个预期传感器生成比较记录，保留预期顺序，不修改任一输入数组，并返回明确的汇总计数。' }
    checklist:
      - { en: 'Test missing, duplicate, NaN, and infinite sensor values.', zh: '测试缺失、重复、NaN 和无穷传感器值。' }
      - { en: 'Check the absolute-plus-relative tolerance at zero and at maximum magnitude.', zh: '检查绝对与相对容差在零和最大量级处的行为。' }
      - { en: 'Confirm output order and input immutability.', zh: '确认输出顺序与输入不可变性。' }
      - { en: 'Measure lookup complexity for the largest expected batch.', zh: '评估最大预期批次的查找复杂度。' }
    explanation: { en: 'Index the actual batch once, validate unique IDs and finite values, preserve a record for each missing sensor, and apply the stated combined tolerance. This makes behavior and scaling match the task.', zh: '应先索引实际批次，验证唯一 ID 与有限值，为每个缺失传感器保留记录，再应用指定的组合容差。这样行为与扩展性才符合任务。' }
    difficulty: intermediate
    minutes: 10
    tags: [code-review, floating-point, tolerance, telemetry]
