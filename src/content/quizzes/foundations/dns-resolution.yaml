topic: foundations/dns-resolution
items:
  - id: predict-ttl-boundary
    type: predict
    prompt: { en: 'What does this cache-boundary check print?', zh: '这个缓存边界检查会输出什么？' }
    code: |
      const expiresAt = 30;

      function source(now) {
        return now < expiresAt ? "cache" : "refresh";
      }

      console.log(`t=29 ${source(29)}`);
      console.log(`t=30 ${source(30)}`);
    lang: javascript
    options:
      - { text: { en: "t=29 cache\nt=30 refresh", zh: "t=29 cache\nt=30 refresh" }, correct: true }
      - { text: { en: "t=29 cache\nt=30 cache", zh: "t=29 cache\nt=30 cache" }, correct: false }
      - { text: { en: "t=29 refresh\nt=30 refresh", zh: "t=29 refresh\nt=30 refresh" }, correct: false }
      - { text: { en: 'It throws because TTL 30 is invalid.', zh: '程序抛出异常，因为TTL 30无效。' }, correct: false }
    explanation: { en: 'An entry is reusable only before its expiry instant. At exactly 30, this policy refreshes instead of serving the expired value.', zh: '条目只能在过期时刻之前复用。时间恰好为30时，这项策略会刷新，而不是供应已过期值。' }
    difficulty: beginner
    tags: [dns, ttl, caching]
    tests: node predict_ttl_boundary.js
    minutes: 3

  - id: recursive-authoritative-roles
    type: mcq
    prompt: { en: 'Which statement correctly separates recursive and authoritative DNS roles?', zh: '哪项说法正确区分了递归DNS与权威DNS的角色？' }
    options:
      - { text: { en: 'An authoritative server normally walks the hierarchy for any client.', zh: '权威服务器通常会为任意客户端遍历整个层级。' }, correct: false }
      - { text: { en: 'A recursive resolver obtains an answer for a client; an authoritative server answers from zones it serves.', zh: '递归解析器为客户端取得答案；权威服务器根据自己负责的区域回答。' }, correct: true }
      - { text: { en: 'Both roles always run in the application process.', zh: '两种角色始终运行在应用进程中。' }, correct: false }
      - { text: { en: 'A recursive resolver can answer only from its cache.', zh: '递归解析器只能从缓存回答。' }, correct: false }
    explanation: { en: 'The recursive resolver serves the client and follows referrals on a miss. Authoritative servers publish data for specific zones and return answers or delegations from that authority.', zh: '递归解析器服务客户端，并在缓存未命中时跟随转介。权威服务器发布特定区域的数据，并根据该权威返回答案或委派。' }
    difficulty: beginner
    tags: [dns, recursive-resolver, authoritative-server]
    minutes: 4

  - id: nxdomain-versus-nodata
    type: mcq
    prompt: { en: 'A `NOERROR` response contains authority evidence but no `AAAA` record for an existing name. What does it mean?', zh: '某个`NOERROR`响应带有权威证据，但现有名称没有`AAAA`记录。它表示什么？' }
    options:
      - { text: { en: 'NXDOMAIN: the name cannot have any record type', zh: 'NXDOMAIN：该名称不能拥有任何类型的记录' }, correct: false }
      - { text: { en: 'NODATA: the name exists but has no data of the requested type', zh: 'NODATA：名称存在，但没有所请求类型的数据' }, correct: true }
      - { text: { en: 'SERVFAIL: every authoritative server timed out', zh: 'SERVFAIL：所有权威服务器都已超时' }, correct: false }
      - { text: { en: 'A referral that must never be cached', zh: '一项绝对不能缓存的转介' }, correct: false }
    explanation: { en: 'NODATA is scoped to the queried type, unlike NXDOMAIN, which says the name itself does not exist. A later `A` query may therefore succeed.', zh: 'NODATA只针对查询类型；NXDOMAIN则表示名称本身不存在。因此，之后的`A`查询仍可能成功。' }
    difficulty: intermediate
    tags: [dns, nxdomain, nodata, negative-caching]
    minutes: 4

  - id: spot-permanent-address-cache
    title: { en: 'Spot the bug in the DNS endpoint lookup', zh: '找出DNS端点查找里的bug' }
    type: spotbug
    prompt: { en: 'Find the DNS correctness bugs in this generated endpoint lookup.', zh: '找出这个生成端点查找函数中的DNS正确性问题。' }
    code: |
      import { promises as dns } from "node:dns";

      const cache = new Map();

      export async function endpoint(hostname) {
        if (cache.has(hostname)) return cache.get(hostname);
        try {
          const [address] = await dns.resolve4(hostname);
          cache.set(hostname, address);
          return address;
        } catch {
          return null;
        }
      }
    lang: javascript
    issues:
      - line: 6
        kind: edge-case
        note: { en: 'A cached address has no TTL or expiry, so the process can retain a retired endpoint indefinitely.', zh: '缓存地址没有TTL或过期时间，因此进程可能无限期保留已退役端点。' }
      - line: 8
        kind: correctness
        note: { en: 'The function requests only IPv4 and discards every candidate except the first, removing valid IPv6 and fallback paths.', zh: '函数只请求IPv4，并丢弃第一项以外的所有候选地址，因而移除了有效的IPv6和回退路径。' }
      - line: 11
        kind: readability
        note: { en: 'The catch collapses NXDOMAIN, NODATA, SERVFAIL, timeout, and local programming errors into the same null result.', zh: 'catch把NXDOMAIN、NODATA、SERVFAIL、超时和本地编程错误都压成了同一个null结果。' }
    explanation: { en: 'Return a typed result that preserves candidates, TTLs, and failure class. Apply an explicit expiry policy and let the connection layer try suitable IPv6 and IPv4 candidates under one deadline.', zh: '应返回保留候选地址、TTL和故障类别的类型化结果，执行明确的过期策略，并让连接层在同一截止时间内尝试合适的IPv6与IPv4候选地址。' }
    difficulty: intermediate
    tags: [dns, caching, ipv6, error-handling]
    tests: node --check permanent_address_cache.js
    minutes: 8

  - id: dns-migration-sequence
    type: mcq
    prompt: { en: 'Which sequence best supports a DNS address migration with a previous TTL of one hour?', zh: 'DNS地址迁移前的TTL是一小时，哪套步骤最稳妥？' }
    options:
      - { text: { en: 'Change the address and immediately shut down the old endpoint.', zh: '修改地址后立刻关闭旧端点。' }, correct: false }
      - { text: { en: 'Lower the TTL in advance, wait out the previous TTL, overlap healthy endpoints, then observe traffic before retirement.', zh: '提前降低TTL，等待旧TTL经过，让健康的新旧端点重叠运行，再观察流量后退役旧端点。' }, correct: true }
      - { text: { en: 'Set TTL to zero after the change and assume existing connections move.', zh: '变更后把TTL设为零，并假定现有连接会自动迁移。' }, correct: false }
      - { text: { en: 'Keep the one-hour TTL but ask clients to flush every cache simultaneously.', zh: '保留一小时TTL，但要求所有客户端同时清空缓存。' }, correct: false }
    explanation: { en: 'Caches may already hold the old one-hour answer, and live connections do not consult DNS again. Advance TTL reduction plus endpoint overlap accommodates both effects.', zh: '缓存中可能已有生存时间一小时的旧答案，现有连接也不会重新查询DNS。提前降低TTL并让端点重叠运行，才能兼顾两种影响。' }
    difficulty: intermediate
    tags: [dns, ttl, migration, operations]
    minutes: 5

  - id: review-user-url-resolver
    type: review
    title: { en: 'Review a generated URL resolver', zh: '审查生成的URL解析器' }
    prompt: { en: 'Review this AI-generated resolver and fetch helper against its stated task.', zh: '根据给定任务，审查这个AI生成的解析与请求辅助函数。' }
    task: { en: 'Fetch a user-supplied HTTPS URL with TTL-aware DNS caching, reject every non-public IPv4 or IPv6 destination, preserve TLS hostname verification, and bound lookup plus connection time.', zh: '请求用户提供的HTTPS URL，缓存须遵守DNS TTL，拒绝所有非公网IPv4或IPv6目标，保留TLS主机名验证，并限制查找与连接总时间。' }
    code: |
      import { Resolver } from "node:dns/promises";
      import { setTimeout as delay } from "node:timers/promises";

      const resolver = new Resolver();
      const cache = new Map();
      const ONE_HOUR = 60 * 60 * 1000;

      export async function fetchUserUrl(input) {
        const target = new URL(input);
        const cached = cache.get(target.hostname);
        if (cached) return fetch(input);

        const [address] = await resolver.resolve4(target.hostname);
        if (address.startsWith("127.")) throw new Error("blocked");
        cache.set(target.hostname, { address, expires: Date.now() + ONE_HOUR });
        return fetch(target);
      }

      setInterval(() => cache.clear(), ONE_HOUR);
    lang: javascript
    right: { en: 'The code parses input with `URL`, keeps resolver state outside the function, uses an asynchronous DNS API, and makes the intended deny check and cache visible for review.', zh: '代码用`URL`解析输入，把解析器状态放在函数外，使用异步DNS API，并明确展示了预期的拒绝检查与缓存，便于审查。' }
    checklist:
      - { en: 'Require HTTPS, normalize the hostname, resolve every relevant address family, and classify literal IP inputs.', zh: '要求使用HTTPS，规范化主机名，解析所有相关地址族，并对IP字面量输入分类。' }
      - { en: 'Validate every candidate against complete forbidden ranges and pin the accepted address to the connection while retaining hostname verification.', zh: '针对完整禁用范围验证每个候选地址，把获准地址固定到连接，同时保留主机名验证。' }
      - { en: 'Use authoritative TTL information, scoped negative caching, in-flight query coalescing, and a bounded cache.', zh: '使用权威TTL信息、限定作用域的否定缓存、进行中查询合并和有界缓存。' }
      - { en: 'Apply one deadline across DNS and connection attempts and test address changes between validation and use.', zh: '对DNS与连接尝试执行同一截止时间，并测试验证与使用之间地址发生变化的情况。' }
    issues:
      - line: 2
        kind: readability
        note: { en: 'The unused delay import suggests a timeout was intended, but no deadline is actually applied to lookup or fetch.', zh: '未使用的delay导入说明原本可能打算设置超时，但查找和请求实际上都没有截止时间。' }
      - line: 13
        kind: edge-case
        note: { en: 'resolve4 ignores IPv6 and destructuring retains only one IPv4 candidate, so valid fallback paths and forbidden IPv6 destinations are not handled.', zh: 'resolve4忽略IPv6，解构又只保留一个IPv4候选地址，因此没有处理有效回退路径和禁用的IPv6目标。' }
      - line: 14
        kind: security
        note: { en: 'Checking only the `127.` prefix misses private, link-local, unspecified, metadata, mapped, and encoded address forms.', zh: '只检查`127.`前缀会漏掉私有、链路本地、未指定、元数据、映射及编码地址形式。' }
      - line: 16
        kind: correctness
        note: { en: 'fetch resolves the original hostname again instead of connecting to the validated address, creating a DNS-rebinding time-of-check/time-of-use gap.', zh: 'fetch会再次解析原主机名，而不是连接已经验证的地址，形成可被DNS重绑定利用的检查时与使用时差异。' }
      - line: 19
        kind: performance
        note: { en: 'Clearing every entry on one fixed interval ignores individual TTLs and can synchronize many cache misses into an upstream query spike.', zh: '按固定周期同时清空所有条目既忽略各自TTL，也可能让大量缓存未命中同步发生，形成上游查询尖峰。' }
    explanation: { en: 'A safe design resolves under a deadline, preserves per-record TTL and failure state, validates all IPv4 and IPv6 candidates, and makes the HTTP client connect to one validated address while still checking the original HTTPS hostname. Cache entries expire individually and concurrent misses are coalesced.', zh: '安全设计应在截止时间内解析，保留每条记录的TTL与故障状态，验证全部IPv4和IPv6候选地址，并让HTTP客户端连接已验证地址，同时继续检查原HTTPS主机名。缓存条目应分别过期，并合并并发未命中。' }
    difficulty: advanced
    tags: [dns, code-review, ssrf, caching, deadlines]
    tests: node --check generated_url_resolver.js
    minutes: 20
