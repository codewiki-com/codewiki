topic: foundations/processes-and-threads
items:
  - id: predict-atomic-counter
    type: predict
    prompt: { en: 'What does this shared-memory code print?', zh: '这段共享内存代码会输出什么？' }
    code: |
      const bytes = new SharedArrayBuffer(Int32Array.BYTES_PER_ELEMENT);
      const counter = new Int32Array(bytes);
      Atomics.store(counter, 0, 2);
      const previous = Atomics.add(counter, 0, 3);
      console.log(previous, Atomics.load(counter, 0));
    lang: javascript
    options:
      - { text: { en: '2 5', zh: '2 5' }, correct: true }
      - { text: { en: '3 5', zh: '3 5' }, correct: false }
      - { text: { en: '5 5', zh: '5 5' }, correct: false }
      - { text: { en: '2 3', zh: '2 3' }, correct: false }
    explanation: { en: 'Atomics.add returns the value that existed before its indivisible update. It changes the stored value from 2 to 5, which the following load observes.', zh: 'Atomics.add 会返回不可分割更新之前的值。它把存储值从 2 改成 5，随后的读取会观察到 5。' }
    difficulty: beginner
    tags: [threads, atomics, predict-output]
    tests: node predict_atomic_counter.mjs
    minutes: 3

  - id: process-thread-boundary
    type: mcq
    prompt: { en: 'Which statement most accurately distinguishes a process from a thread?', zh: '哪项陈述最准确地区分了进程与线程？' }
    options:
      - { text: { en: 'Every thread has a separate virtual address space.', zh: '每个线程都有独立虚拟地址空间。' }, correct: false }
      - { text: { en: 'A process is a resource and isolation context; a thread is a schedulable execution path inside one.', zh: '进程是资源与隔离上下文，线程是其中可被调度的执行路径。' }, correct: true }
      - { text: { en: 'Processes can never share memory.', zh: '进程绝不可能共享内存。' }, correct: false }
      - { text: { en: 'A thread is always cheaper than a process for every workload.', zh: '对所有工作负载而言，线程总是比进程成本更低。' }, correct: false }
    explanation: { en: 'Threads normally share their process resources while keeping separate execution state. Processes are isolated by default but can deliberately share mappings and external resources.', zh: '线程通常共享所属进程的资源，同时保留独立执行状态。进程默认隔离，但可以主动共享内存映射与外部资源。' }
    difficulty: beginner
    tags: [processes, threads, isolation]
    minutes: 3

  - id: spot-check-then-update
    type: spotbug
    prompt: { en: 'This function receives a shared Int32Array and can run in several workers. Find the synchronization bug.', zh: '该函数接收共享 Int32Array，并可能在多个工作线程中运行。请找出同步缺陷。' }
    code: |
      function claimSlot(state) {
        const claimed = state[0];
        const capacity = state[1];
        if (claimed >= capacity) return false;
        state[0] = claimed + 1;
        return true;
      }
    lang: javascript
    issues:
      - line: 2
        lines: 4
        kind: correctness
        note: { en: 'The capacity check and increment are separate unsynchronized operations. Two workers can read the same count and both claim the final slot; use one lock-protected invariant or an atomic compare-and-exchange loop.', zh: '容量检查与递增是两个未经同步的操作。两个工作线程可能读到同一计数并同时取得最后一个槽位；应使用同一把锁保护完整不变量，或采用原子比较交换循环。' }
    explanation: { en: 'Atomic visibility of individual array elements would not make this check-then-act sequence atomic. The decision and update must be coordinated as one state transition.', zh: '即使每个数组元素都能原子可见，也不会让先检查后操作序列整体具备原子性。决策与更新必须作为一次状态转换协调。' }
    difficulty: intermediate
    tags: [race-condition, shared-memory, check-then-act]
    minutes: 6

  - id: blocked-to-runnable
    type: mcq
    prompt: { en: 'A thread blocked on socket input receives data. What is the most accurate next-state claim?', zh: '一个因等待套接字输入而阻塞的线程收到数据。对其下一状态最准确的描述是什么？' }
    options:
      - { text: { en: 'It must run immediately before every other thread.', zh: '它必须立即先于所有其他线程运行。' }, correct: false }
      - { text: { en: 'It normally becomes runnable; scheduler policy decides when it actually runs.', zh: '它通常变为可运行状态；何时真正运行由调度策略决定。' }, correct: true }
      - { text: { en: 'It creates a new process to read the data.', zh: '它会创建新进程读取数据。' }, correct: false }
      - { text: { en: 'It remains blocked until its process exits.', zh: '它会保持阻塞，直到所属进程退出。' }, correct: false }
    explanation: { en: 'The event removes the wait condition and makes the thread eligible for processor time. Processor availability and other runnable work still affect dispatch.', zh: '事件消除了等待条件，使线程具备获取处理器时间的资格。处理器可用性与其他可运行工作仍会影响实际调度。' }
    difficulty: intermediate
    tags: [scheduling, lifecycle, blocking]
    minutes: 3

  - id: join-versus-cancel
    type: mcq
    prompt: { en: 'What does joining a thread guarantee that requesting cancellation alone does not?', zh: '等待线程结束能提供哪项保证，而仅请求取消不能？' }
    options:
      - { text: { en: 'The thread receives a higher scheduling priority.', zh: '线程会获得更高调度优先级。' }, correct: false }
      - { text: { en: 'The caller waits until the thread has terminated and may then consume its final result under the API contract.', zh: '调用方等待线程终止，之后可以按 API 契约读取最终结果。' }, correct: true }
      - { text: { en: 'Every external side effect is rolled back.', zh: '所有外部副作用都会回滚。' }, correct: false }
      - { text: { en: 'The thread becomes a separate process.', zh: '线程会变成独立进程。' }, correct: false }
    explanation: { en: 'Cancellation is a request and may be cooperative; it does not itself prove termination. A join observes the termination point, although it still needs a deadline when work can block forever.', zh: '取消是一项请求，而且可能需要协作，不会自行证明线程已经终止。等待操作会观察终止点，但工作可能永久阻塞时仍需设置截止时间。' }
    difficulty: intermediate
    tags: [join, cancellation, lifecycle]
    minutes: 3

  - id: review-generated-report-workers
    type: review
    title: { en: 'Review generated report workers', zh: '审查生成的报表工作线程' }
    prompt: { en: 'Review this AI-generated worker implementation against its stated task.', zh: '根据给定任务，审查这段 AI 生成的工作线程实现。' }
    task: { en: 'Run only allowlisted CPU-bound report calculations with at most four workers, preserve input order, reject any failed batch, and tear down every worker.', zh: '只运行允许列表中的 CPU 密集报表计算，工作线程最多四个，保持输入顺序，任一工作失败时拒绝整批，并关闭所有工作线程。' }
    code: |
      import { Worker } from "node:worker_threads";

      export function runReports(reports) {
        const results = [];

        return new Promise((resolve) => {
          for (const [index, report] of reports.entries()) {
            const worker = new Worker(report.source, {
              eval: true,
              workerData: report.input,
            });

            worker.once("message", (result) => {
              results[index] = result;
              resolve(results);
            });
            worker.once("error", (error) => console.error(error));
          }
        });
      }
    lang: javascript
    right: { en: 'The code selects worker threads for CPU-bound work, keeps a result slot associated with each input index, and attaches both result and error listeners.', zh: '代码为 CPU 密集工作选择了工作线程，为每个输入索引保留结果槽位，并同时注册了结果与错误监听器。' }
    checklist:
      - { en: 'Validate an allowlisted report identifier and structured input instead of executable source.', zh: '校验允许列表中的报表标识与结构化输入，不能接收可执行源码。' }
      - { en: 'Prove a hard bound of four live workers and define queue backpressure.', zh: '证明存活工作线程硬上限为四个，并定义队列背压。' }
      - { en: 'Test empty input, creation failure, worker error, timeout, and out-of-order completion.', zh: '测试空输入、创建失败、工作线程错误、超时与乱序完成。' }
      - { en: 'Resolve only after every result and terminate all remaining workers on any failure.', zh: '只在全部结果就绪后兑现，并在任何失败后终止所有剩余工作线程。' }
    issues:
      - line: 8
        kind: security
        note: { en: 'The function evaluates caller-provided source inside a thread that shares the process authority. A thread is not a sandbox; select fixed worker code by an allowlisted report identifier.', zh: '函数在线程中执行调用方提供的源码，而线程共享进程权限。线程不是沙箱；应按允许列表中的报表标识选择固定工作代码。' }
      - line: 7
        kind: performance
        note: { en: 'The loop creates one worker per report without the required concurrency bound, so a large batch can exhaust memory and scheduler capacity.', zh: '循环为每份报表创建一个工作线程，没有遵守并发上限，因此大批量输入可能耗尽内存与调度容量。' }
      - line: 15
        kind: correctness
        note: { en: 'The promise resolves after the first message, returning a partial sparse result instead of waiting for the whole batch.', zh: 'Promise 在第一条消息后就兑现，返回的是部分稀疏结果，没有等待整批完成。' }
      - line: 6
        kind: edge-case
        note: { en: 'An empty report list starts no worker and never calls resolve, so the returned promise remains pending forever.', zh: '空报表列表不会启动工作线程，也不会调用 resolve，因此返回的 Promise 会永久等待。' }
    explanation: { en: 'Use fixed worker code and validated job data, feed it through a four-worker pool, count completions, and resolve ordered results only after all workers succeed. Reject on creation, execution, or timeout failure and terminate every still-live worker in cleanup.', zh: '应使用固定工作代码与经过校验的任务数据，通过四线程池投递，统计完成数量，并只在全部成功后兑现有序结果。创建、执行或超时失败时应拒绝任务，并在清理阶段终止所有仍存活的工作线程。' }
    difficulty: advanced
    tags: [code-review, worker-pool, lifecycle, security]
    tests: node --check generated_report_workers.mjs
    minutes: 15
