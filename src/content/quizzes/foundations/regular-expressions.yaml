topic: foundations/regular-expressions
items:
  - id: predict-match-indices
    type: predict
    prompt: { en: 'What does this global search print?', zh: '这次全局搜索会输出什么？' }
    code: |
      const input = "A12 B345";
      const digits = /\d+/g;
      const found = [...input.matchAll(digits)]
        .map((match) => `${match[0]}@${match.index}`)
        .join(", ");

      console.log(found);
    lang: javascript
    options:
      - { text: { en: '12@1, 345@5', zh: '12@1, 345@5' }, correct: true }
      - { text: { en: '12@0, 345@1', zh: '12@0, 345@1' }, correct: false }
      - { text: { en: '1@1, 3@5', zh: '1@1, 3@5' }, correct: false }
      - { text: { en: 'A12@0, B345@4', zh: 'A12@0, B345@4' }, correct: false }
    explanation: { en: 'The greedy plus consumes each complete ASCII digit run. Match indices are zero-based UTF-16 code-unit offsets in the original string.', zh: '贪婪加号会消费每一段完整的ASCII数字。匹配索引是原字符串中从零开始的UTF-16代码单元偏移。' }
    difficulty: beginner
    tags: [regex, match-all, indices]
    tests: node predict_matches.js
    minutes: 3

  - id: choose-full-consumption
    type: mcq
    prompt: { en: 'Which approach explicitly requires an order-reference match to consume the entire JavaScript string?', zh: '哪种写法明确要求订单引用匹配消费整个JavaScript字符串？' }
    options:
      - { text: { en: 'Test `/[A-Z]{2}-\d{6}/u` and accept any successful substring.', zh: '测试`/[A-Z]{2}-\d{6}/u`，接受任意成功子串。' }, correct: false }
      - { text: { en: 'Test `/^[A-Z]{2}-\d{6}$/u` and assume `$` means only absolute end.', zh: '测试`/^[A-Z]{2}-\d{6}$/u`，并假定`$`只表示绝对末尾。' }, correct: false }
      - { text: { en: 'Execute `/^[A-Z]{2}-\d{6}/u`, then require `match[0].length === input.length`.', zh: '执行`/^[A-Z]{2}-\d{6}/u`，再要求`match[0].length === input.length`。' }, correct: true }
      - { text: { en: 'Add the `g` flag and call `test()` twice.', zh: '添加`g`标志，再调用两次`test()`。' }, correct: false }
    explanation: { en: 'Comparing the overall span with the input makes full consumption explicit and rejects trailing text or a final newline. JavaScript `$` may match before a final line terminator.', zh: '把整体匹配范围与输入比较，能够明确要求完整消费，并拒绝尾随文本或末尾换行符。JavaScript的`$`可以在末尾行终止符之前匹配。' }
    difficulty: beginner
    tags: [regex, validation, anchors]
    minutes: 4

  - id: spot-stateful-global-validator
    title: { en: 'Spot the bug in the global email validator', zh: '找出邮箱校验器里的bug' }
    type: spotbug
    prompt: { en: 'Why does the second valid address print false?', zh: '为什么第二个有效地址会输出false？' }
    code: |
      const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/g;

      function validEmail(input) {
        return emailPattern.test(input);
      }

      console.log(validEmail("one@example.com"));
      console.log(validEmail("two@example.com"));
    lang: javascript
    issues:
      - line: 1
        kind: correctness
        note: { en: 'The `g` flag makes `test()` advance `lastIndex`; the next call begins partway through a new string. Remove `g` from a single-value validator.', zh: '`g`标志会让`test()`推进`lastIndex`；下一次调用会从新字符串的中间开始。单值校验器应移除`g`。' }
    explanation: { en: 'The shared RegExp object carries iteration state between calls. Global search is useful for iteration, but it is the wrong state model for one independent Boolean validation at a time.', zh: '共享的RegExp对象会在调用之间保留迭代状态。全局搜索适合迭代，却不适合每次相互独立的布尔校验。' }
    difficulty: intermediate
    tags: [regex, global-flag, last-index]
    tests: node spotbug_stateful_test.js
    minutes: 5

  - id: unicode-decimal-contract
    type: mcq
    prompt: { en: 'A field permits decimal digits from every Unicode script. Which ECMAScript atom expresses that repertoire?', zh: '某字段允许所有Unicode书写系统中的十进制数字。哪个ECMAScript原子表达了这个字符范围？' }
    options:
      - { text: { en: '`\d` without flags', zh: '不带标志的`\d`' }, correct: false }
      - { text: { en: '`\d` with the `u` flag', zh: '带`u`标志的`\d`' }, correct: false }
      - { text: { en: '`\p{Decimal_Number}` with the `u` flag', zh: '带`u`标志的`\p{Decimal_Number}`' }, correct: true }
      - { text: { en: '`.` with the `s` flag', zh: '带`s`标志的`.`' }, correct: false }
    explanation: { en: 'ECMAScript `\d` remains ASCII-only under `u`. A Unicode property escape names the broader decimal-number category, although later numeric parsing still needs its own policy.', zh: '即使启用`u`，ECMAScript的`\d`仍只匹配ASCII。Unicode属性转义可以指定更广的十进制数字类别，但后续数值解析仍需要自己的策略。' }
    difficulty: intermediate
    tags: [regex, unicode, property-escapes]
    minutes: 4

  - id: replacement-callback-boundary
    type: mcq
    prompt: { en: 'Why is a replacement callback safer when untrusted replacement text may contain dollar signs?', zh: '当不可信替换文本可能含有美元符号时，为什么替换回调更安全？' }
    options:
      - { text: { en: 'The callback returns literal text instead of letting the replacement-template mini-language interpret `$&`, `$1`, or `$<name>`.', zh: '回调返回字面文本，不会让替换模板小语言解释`$&`、`$1`或`$<name>`。' }, correct: true }
      - { text: { en: 'The callback automatically makes the regex linear time.', zh: '回调会自动让正则表达式在线性时间内完成。' }, correct: false }
      - { text: { en: 'The callback changes UTF-16 indices into byte offsets.', zh: '回调会把UTF-16索引转换成字节偏移。' }, correct: false }
      - { text: { en: 'The callback validates every captured value semantically.', zh: '回调会验证每个捕获值的领域语义。' }, correct: false }
    explanation: { en: 'Replacement strings have syntax separate from pattern syntax. A function can return the intended text directly, while matching cost and semantic validation remain separate concerns.', zh: '替换字符串拥有独立于模式语法的解释规则。函数可以直接返回预期文本，但匹配开销与语义校验仍是另外的问题。' }
    difficulty: intermediate
    tags: [regex, replacement, callbacks]
    minutes: 4

  - id: review-generated-ticket-scanner
    type: review
    title: { en: 'Review a generated ticket scanner', zh: '审查生成的工单扫描器' }
    prompt: { en: 'Review this AI-generated scanner against its stated task.', zh: '根据给定任务审查这个AI生成的扫描器。' }
    task: { en: 'Scan at most 10,000 uploaded lines of at most 120 code units each. Treat the supplied project name literally, accept only full IDs with 1–12 ASCII digits, and return matches in numeric order.', zh: '扫描最多10,000行上传文本，每行最多120个代码单元。把项目名称按字面量处理，只接受带1–12位ASCII数字的完整ID，并按编号数值顺序返回匹配项。' }
    code: |
      export function collectTicketIds(lines, project) {
        const ticketPattern = new RegExp(
          `^(${project})-(\\d+)$`,
          "g",
        );
        const tickets = [];

        for (const line of lines) {
          if (!ticketPattern.test(line)) continue;
          const match = ticketPattern.exec(line);
          tickets.push({
            raw: line,
            project: match[1],
            number: Number(match[2]),
          });
        }

        return tickets.sort(
          (left, right) => left.number - right.number,
        );
      }
    lang: javascript
    issues:
      - line: 3
        kind: security
        note: { en: 'The project value is inserted as regex source, so punctuation can change the pattern. Use `RegExp.escape(project)` before composition.', zh: '项目值被直接插入正则源码，标点可以改变模式。组合前应使用`RegExp.escape(project)`。' }
      - line: 9
        kind: correctness
        note: { en: 'With `g`, `test()` advances `lastIndex`, so the following `exec()` starts after the match and returns null. Remove `g` and execute once per line.', zh: '带`g`时，`test()`会推进`lastIndex`，后面的`exec()`从匹配末尾开始并返回null。应移除`g`，每行只执行一次。' }
      - line: 14
        kind: edge-case
        note: { en: 'The unbounded digit run can exceed the 12-digit contract and lose precision when converted to Number. Use `{1,12}` and retain validated text or convert under an explicit range check.', zh: '无界数字串可能超过12位契约，转换成Number时还会损失精度。应使用`{1,12}`，并保留校验后的文本或在明确范围检查后转换。' }
      - line: 8
        kind: performance
        note: { en: 'The function enforces neither the 10,000-line cap nor the per-line length cap before matching, leaving total work outside the stated bound.', zh: '函数在匹配前既未执行10,000行上限，也未执行单行长度上限，使总工作量超出既定边界。' }
    right: { en: 'The code compiles one pattern per operation, keeps match records structured, preserves each raw line for diagnostics, and makes sorting an explicit final stage.', zh: '代码每次操作只编译一次模式，使用结构化匹配记录，保留原始行便于诊断，并把排序明确设为最后阶段。' }
    checklist:
      - { en: 'Separate trusted regex source from dynamic literal fragments and verify the target dialect.', zh: '分离可信正则源码与动态字面片段，并确认目标方言。' }
      - { en: 'Check anchors, stateful flags, capture nullability, and the exact accepted digit count.', zh: '检查锚点、有状态标志、捕获可空性和准确的数字位数。' }
      - { en: 'Enforce collection and string bounds before matching uploaded text.', zh: '匹配上传文本前执行集合与字符串边界。' }
      - { en: 'Test punctuation in project names, boundary lengths, repeated calls, and numeric ordering.', zh: '测试项目名称中的标点、边界长度、重复调用与数值排序。' }
    explanation: { en: 'Validate input bounds first, escape the project with `RegExp.escape()`, use one non-global exact match with a `{1,12}` digit bound, and sort with a numeric comparator. One `exec()` call supplies both the decision and captures.', zh: '应先校验输入边界，用`RegExp.escape()`转义项目名称，再通过带`{1,12}`数字边界的非全局模式执行一次完整匹配，并使用数值比较器排序。一次`exec()`调用即可同时提供判断与捕获。' }
    difficulty: advanced
    tags: [regex, code-review, injection, backtracking]
    tests: node --check generated_ticket_scanner.js
    minutes: 18
