topic: foundations/http2
items:
  - id: predict-frame-header
    type: predict
    prompt: { en: 'What does this frame-header inspection print?', zh: '这段帧头检查代码会输出什么？' }
    code: |
      const header = Buffer.from([0, 0, 0, 4, 1, 0, 0, 0, 0]);
      console.log(header.readUIntBE(0, 3));
      console.log(header[3]);
      console.log(header[4] & 1);
    lang: javascript
    options:
      - { text: { en: "0\n4\n1", zh: "0\n4\n1" }, correct: true }
      - { text: { en: "4\n1\n0", zh: "4\n1\n0" }, correct: false }
      - { text: { en: "0\n1\n4", zh: "0\n1\n4" }, correct: false }
      - { text: { en: 'It throws because a frame header cannot contain zero bytes.', zh: '程序抛出异常，因为帧头不能包含零字节。' }, correct: false }
    explanation: { en: 'The first three bytes encode a zero payload length, byte 3 is frame type 4 (SETTINGS), and the low flag bit is set.', zh: '前三个字节编码长度为零的负载，第 3 号字节表示类型 4（SETTINGS），标志字节的最低位为 1。' }
    difficulty: beginner
    tags: [frame, binary-format, predict-output]
    tests: node frame_header.js
    minutes: 3

  - id: flow-control-scope
    type: mcq
    prompt: { en: 'A sender has stream-window credit but no connection-window credit. May it send another DATA frame on that stream?', zh: '发送方的流窗口仍有额度，但连接窗口没有额度。它能否继续在该流上发送 DATA 帧？' }
    options:
      - { text: { en: 'Yes; only the stream window applies to DATA.', zh: '能；DATA 只受流窗口约束。' }, correct: false }
      - { text: { en: 'No; both the stream and connection windows need enough credit.', zh: '不能；流窗口与连接窗口都必须有足够额度。' }, correct: true }
      - { text: { en: 'Yes, after adding an END_STREAM flag.', zh: '能，只要加上 END_STREAM 标志。' }, correct: false }
      - { text: { en: 'No HTTP/2 frame can be sent until the connection window grows.', zh: '在连接窗口增加前，任何 HTTP/2 帧都不能发送。' }, correct: false }
    explanation: { en: 'DATA consumes both windows, so either can block it. Control frames are not governed by these flow-control windows.', zh: 'DATA 会同时消耗两级窗口，任一级都能阻塞它。控制帧不受这两个流量控制窗口约束。' }
    difficulty: intermediate
    tags: [flow-control, window-update]
    minutes: 3

  - id: spot-response-lifecycle
    title: { en: 'Spot the bug in the HTTP/2 response helper', zh: '找出 HTTP/2 响应里的 bug' }
    type: spotbug
    prompt: { en: 'Find the lifecycle bugs in this generated helper.', zh: '找出这个生成的辅助函数中的生命周期错误。' }
    code: |
      function getStatus(session, path) {
        return new Promise((resolve) => {
          const request = session.request({ ':path': path });
          request.on('response', (headers) => {
            resolve(headers[':status']);
          });
          request.end();
        });
      }
    lang: javascript
    issues:
      - line: 2
        kind: correctness
        note: { en: 'The Promise has no rejection path for stream or session errors, so callers can wait forever or see an unhandled error.', zh: 'Promise 没有处理流错误或会话错误的拒绝路径，调用方可能永久等待，或遇到未处理错误。' }
      - line: 4
        kind: performance
        note: { en: 'Resolving when headers arrive neither consumes nor cancels the body, leaving stream resources and flow-control credit occupied.', zh: '收到响应头就完成 Promise，既不消费也不取消正文，会继续占用流资源和流量控制额度。' }
    explanation: { en: 'Wait for and consume the body when it is needed, or cancel the stream explicitly when only headers matter. In both cases, reject on errors and remove listeners during cleanup.', zh: '需要正文时应等待并消费正文；只需要响应头时应显式取消流。两种路径都要在错误时拒绝 Promise，并在清理时移除监听器。' }
    difficulty: intermediate
    tags: [stream-lifecycle, cancellation, backpressure]
    tests: node --check response_lifecycle.js
    minutes: 6

  - id: goaway-retry-boundary
    type: mcq
    prompt: { en: 'After receiving GOAWAY, what is the safest general retry rule?', zh: '收到 GOAWAY 后，哪条通用重试规则最安全？' }
    options:
      - { text: { en: 'Replay every active request on a new session.', zh: '在新会话上重放所有活动请求。' }, correct: false }
      - { text: { en: 'Never retry any request from that connection.', zh: '绝不重试该连接上的任何请求。' }, correct: false }
      - { text: { en: 'Use the last-stream-id to find unprocessed streams, then retry only when policy and body replayability allow it.', zh: '用最后流标识找出未处理的流，再只重试策略允许且正文可重放的请求。' }, correct: true }
      - { text: { en: 'Retry only streams with even identifiers.', zh: '只重试标识为偶数的流。' }, correct: false }
    explanation: { en: 'GOAWAY supplies protocol evidence about which streams the peer could have processed. Application semantics, idempotency protection, and body ownership still decide whether replay is safe.', zh: 'GOAWAY 提供对端可能处理到哪些流的协议证据；是否能安全重放，仍由应用语义、幂等保护和正文所有权决定。' }
    difficulty: advanced
    tags: [goaway, retry, idempotency]
    minutes: 4

  - id: review-generated-batch-client
    title: { en: 'Review generated HTTP/2 batch client', zh: '审查生成的 HTTP/2 批量客户端' }
    type: review
    prompt: { en: 'Review this AI-generated HTTP/2 batch client against its stated task.', zh: '根据给定任务，审查这个 AI 生成的 HTTP/2 批量客户端。' }
    task: { en: 'Fetch a bounded list of JSON documents from one allowlisted origin over a reusable HTTP/2 session, carrying a bearer token and cleaning up every stream.', zh: '通过可复用的 HTTP/2 会话，从一个允许列表内的源站获取数量受限的 JSON 文档，携带 bearer token，并清理每条流。' }
    code: |
      import { connect } from 'node:http2';

      export async function fetchBatch(origin, paths, token) {
        const session = connect(origin);
        const requests = paths.map((path) =>
          new Promise((resolve) => {
            const request = session.request({
              ':method': 'GET',
              ':path': path,
              connection: 'keep-alive',
              authorization: `Bearer ${token}`,
            });
            let body = '';
            request.on('data', (chunk) => (body += chunk));
            request.on('end', () => resolve(JSON.parse(body)));
            request.end();
          }),
        );
        const results = await Promise.all(requests);
        session.close();
        return results;
      }
    lang: javascript
    right: { en: 'The code uses one session for the batch, emits explicit method and path pseudo-fields, collects response data before parsing it, and closes the session after the successful batch.', zh: '代码为整批请求使用一个会话，显式发送方法与路径伪字段，收集完响应数据后再解析，并在整批成功后关闭会话。' }
    checklist:
      - { en: 'Validate origin, path count, path shape, token handling, and decoded response limits before opening streams.', zh: '打开流之前，校验源站、路径数量、路径形式、令牌处理和解码后响应上限。' }
      - { en: 'Bound in-flight streams against local and remote capacity.', zh: '根据本地与远端容量限制在途流数量。' }
      - { en: 'Cover response status, malformed JSON, reset, timeout, GOAWAY, and session-error paths.', zh: '覆盖响应状态、畸形 JSON、重置、超时、GOAWAY 和会话错误路径。' }
      - { en: 'Assert that every outcome removes listeners and drains or cancels each stream and session.', zh: '断言每种结果都会移除监听器，并排空或取消每条流与会话。' }
    issues:
      - line: 4
        kind: security
        note: { en: 'The unvalidated origin controls where the bearer token is sent, despite the task requiring an allowlisted peer.', zh: '未经校验的 origin 决定 bearer token 的发送目标，不符合任务要求的源站允许列表。' }
      - line: 5
        kind: performance
        note: { en: 'Mapping every path immediately creates unbounded in-flight work without considering peer stream limits or downstream capacity.', zh: '立即映射所有路径会创建无界在途工作，没有考虑对端流上限或下游容量。' }
      - line: 6
        kind: readability
        note: { en: 'The ad hoc Promise handles only success, obscuring who owns error, cancellation, listener removal, and stream cleanup.', zh: '临时 Promise 只处理成功路径，没有清楚表达错误、取消、监听器移除和流清理的所有者。' }
      - line: 10
        kind: correctness
        note: { en: 'Connection is a forbidden connection-specific field in HTTP/2 and makes the message malformed.', zh: 'Connection 是 HTTP/2 禁止的连接专用字段，会使消息格式错误。' }
      - line: 15
        kind: edge-case
        note: { en: 'Every ended body is parsed as JSON without checking response status, size, encoding, or an empty or malformed body.', zh: '代码不检查响应状态、大小、编码、空正文或畸形正文，就把每个结束的正文都按 JSON 解析。' }
    explanation: { en: 'Validate the destination before attaching credentials, reuse an owned session, and feed a bounded worker queue. A request helper should validate status and size, parse safely, reject on every failure, and make stream cancellation plus listener cleanup idempotent.', zh: '应先校验目标再附加凭证，复用所有权明确的会话，并使用有界工作队列。请求辅助函数应校验状态与大小，安全解析，在所有失败路径拒绝 Promise，并让流取消和监听器清理可重复执行。' }
    difficulty: advanced
    tags: [code-review, http2-client, security, lifecycle]
    tests: node --check generated_batch_client.js
    minutes: 15
