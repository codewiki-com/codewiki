topic: foundations/arrays-and-linked-lists
items:
  - id: predict-array-and-list-access
    type: predict
    prompt: { en: 'What does this access comparison print?', zh: '这段访问对比会输出什么？' }
    code: |
      const array = ["A", "B", "C"];
      const head = {
        value: "A",
        next: { value: "B", next: { value: "C", next: null } },
      };

      let node = head;
      let visited = 1;
      while (node.value !== "C") {
        node = node.next;
        visited += 1;
      }

      console.log(`${array[2]} ${node.value} ${visited}`);
    lang: javascript
    options:
      - { text: { en: 'C C 1', zh: 'C C 1' }, correct: false }
      - { text: { en: 'C C 2', zh: 'C C 2' }, correct: false }
      - { text: { en: 'C C 3', zh: 'C C 3' }, correct: true }
      - { text: { en: 'B C 3', zh: 'B C 3' }, correct: false }
    explanation: { en: 'The array reads slot 2 directly. The linked traversal visits A, B, and C before it can return C.', zh: '数组直接读取槽位 2；链表遍历则依次访问 A、B 与 C，之后才能得到 C。' }
    difficulty: beginner
    tags: [arrays, linked-lists, predict-output]
    minutes: 3

  - id: known-node-insertion
    type: mcq
    prompt: { en: 'When is insertion into a singly linked list truly O(1)?', zh: '单向链表的插入在什么条件下才真正是 O(1)？' }
    options:
      - { text: { en: 'Whenever the list is unsorted', zh: '只要链表没有排序' }, correct: false }
      - { text: { en: 'When the insertion index is near the middle', zh: '当插入索引接近中部' }, correct: false }
      - { text: { en: 'When the required predecessor node is already known', zh: '当所需前驱节点已经确定' }, correct: true }
      - { text: { en: 'When the inserted value is small', zh: '当插入值很小' }, correct: false }
    explanation: { en: 'A known predecessor lets the implementation update a fixed number of links. Finding that predecessor by index or value can still take O(n).', zh: '已知前驱时，实现只需更新固定数量的链接；按索引或值寻找前驱仍可能需要 O(n)。' }
    difficulty: beginner
    tags: [linked-lists, insertion, complexity]
    minutes: 3

  - id: amortized-array-append
    type: mcq
    prompt: { en: 'What does amortized O(1) append mean for a geometrically growing dynamic array?', zh: '对按几何比例增长的动态数组来说，追加操作摊还为 O(1) 表示什么？' }
    options:
      - { text: { en: 'Every append performs exactly one assignment.', zh: '每次追加都恰好执行一次赋值。' }, correct: false }
      - { text: { en: 'Average cost over a long operation sequence is constant, although one resize may copy O(n) elements.', zh: '在很长的操作序列中平均成本为常数，但某次扩容仍可能复制 O(n) 个元素。' }, correct: true }
      - { text: { en: 'The array never allocates more storage.', zh: '数组永远不会分配更多存储。' }, correct: false }
      - { text: { en: 'The worst single append is O(1).', zh: '单次追加的最坏成本是 O(1)。' }, correct: false }
    explanation: { en: 'Spare capacity makes most appends cheap, while occasional growth moves existing elements. Geometric growth spreads those moves across the sequence.', zh: '空余容量让多数追加成本很低，偶发扩容则需要移动已有元素；几何增长把这些移动成本分摊到整个操作序列。' }
    difficulty: beginner
    tags: [dynamic-array, amortized-complexity, capacity]
    minutes: 3

  - id: locality-and-layout
    type: mcq
    prompt: { en: 'Why can an array traverse faster than a linked list even though both traversals are O(n)?', zh: '为什么数组与链表的遍历都是 O(n)，数组仍可能更快？' }
    options:
      - { text: { en: 'Big-O guarantees arrays use fewer CPU instructions.', zh: 'Big-O 保证数组使用更少的 CPU 指令。' }, correct: false }
      - { text: { en: 'Nearby array slots can have better cache locality than separately allocated nodes.', zh: '相邻数组槽位的缓存局部性可能优于单独分配的节点。' }, correct: true }
      - { text: { en: 'Linked lists must sort nodes during traversal.', zh: '链表必须在遍历时对节点排序。' }, correct: false }
      - { text: { en: 'Arrays always store every language value inline.', zh: '数组总会内联存储语言中的每一种值。' }, correct: false }
    explanation: { en: 'Asymptotic notation does not capture physical locality or dependent pointer reads. The exact difference remains runtime- and workload-dependent.', zh: '渐进记号不会体现物理局部性和依赖前一节点的指针读取；具体差异仍取决于运行时与工作负载。' }
    difficulty: intermediate
    tags: [cache-locality, traversal, memory]
    minutes: 3

  - id: spot-linked-queue-boundaries
    type: spotbug
    prompt: { en: 'Find the boundary bugs in this generated linked queue.', zh: '找出这个生成的链式队列中的边界错误。' }
    code: |
      class Queue {
        constructor() {
          this.head = null;
          this.tail = null;
          this.size = 0;
        }
        enqueue(value) {
          const node = { value, next: null };
          if (this.tail) this.tail.next = node;
          else this.head = node;
          this.tail = node;
          this.size += 1;
        }
        dequeue() {
          const value = this.head.value;
          this.head = this.head.next;
          this.size -= 1;
          return value;
        }
      }
    lang: javascript
    issues:
      - line: 15
        kind: edge-case
        note: { en: 'An empty dequeue dereferences null instead of returning or throwing according to an explicit empty-queue contract.', zh: '空队列出队时会解引用 null，而不是按明确的空队列契约返回结果或抛出异常。' }
      - line: 16
        kind: correctness
        note: { en: 'After the last node is removed, head becomes null but tail still points at the detached node.', zh: '移除最后一个节点后，head 变成 null，但 tail 仍指向已经脱离队列的节点。' }
    explanation: { en: 'Check for an empty head before reading it, and clear tail whenever advancing head makes the queue empty. Then size and both endpoints describe the same state.', zh: '读取 head 前应先检查空状态，并在 head 前移后队列变空时清空 tail；这样大小与两个端点才会描述同一状态。' }
    difficulty: intermediate
    tags: [linked-lists, queue, invariants]
    minutes: 6

  - id: review-recent-documents-list
    type: review
    title: { en: 'Review a generated recent-document list', zh: '审查生成的最近文档链表' }
    prompt: { en: 'Review this generated collection against its stated task.', zh: '根据给定任务审查这个生成的集合。' }
    task: { en: 'Store untrusted document IDs most-recent-first, move a reopened ID to the front without duplicates, enforce a positive limit, support bounds-checked positional reads, and return a most-recent-first snapshot.', zh: '按最近优先顺序存储不可信文档 ID，重新打开时把 ID 移到头部且不重复，执行正数容量限制，支持带边界检查的按位置读取，并返回最近优先快照。' }
    code: |
      class RecentDocuments {
        constructor(limit) {
          this.limit = limit;
          this.byId = {};
          this.head = null;
        }
        open(id) {
          if (this.byId[id]) return;
          const node = { id, next: this.head };
          this.byId[id] = node;
          this.head = node;
        }
        at(index) {
          let node = this.head;
          for (let step = 0; step <= index; step += 1) node = node.next;
          return node.id;
        }
        toArray() {
          const result = [];
          for (let node = this.head; node; node = node.next) {
            result.unshift(node.id);
          }
          return result;
        }
      }
    lang: javascript
    right: { en: 'The code encapsulates the head, represents order with explicit links, walks iteratively rather than recursively, and returns a new array instead of exposing link mutation.', zh: '代码封装了头部，用明确链接表示顺序，以迭代方式遍历而没有递归，并返回新数组而不是暴露链接修改。' }
    checklist:
      - { en: 'Validate the limit, index, and untrusted identifier representation.', zh: '校验容量、索引与不可信标识符的表示方式。' }
      - { en: 'Trace new, reopened, over-limit, empty, and one-item transitions.', zh: '跟踪新文档、重复打开、超出容量、空集合和单元素转换。' }
      - { en: 'Check that the linked order, lookup index, and stored size remain consistent.', zh: '检查链式顺序、查找索引与存储大小是否始终一致。' }
      - { en: 'Measure snapshot construction and confirm its output order.', zh: '测量快照构造成本，并确认输出顺序。' }
    issues:
      - line: 4
        kind: security
        note: { en: 'A plain object keyed by untrusted IDs is vulnerable to special property names such as __proto__; use Map or a null-prototype object with explicit validation.', zh: '用不可信 ID 作为普通对象的键，会受到 __proto__ 等特殊属性名影响；应使用 Map，或使用无原型对象并显式校验。' }
      - line: 8
        kind: correctness
        note: { en: 'A reopened ID is left in its old position, and the unused limit allows the list to grow without the required bound.', zh: '重复打开的 ID 仍留在原位置，而且未使用的 limit 让链表突破规定容量持续增长。' }
      - line: 15
        kind: edge-case
        note: { en: 'The <= loop advances once too far and has no checks for negative, non-integer, or out-of-range indices before dereferencing node.', zh: '<= 循环会多前进一步，而且代码在解引用 node 前没有拒绝负数、非整数或越界索引。' }
      - line: 21
        kind: performance
        note: { en: 'Repeated unshift moves the growing result on every node, making snapshot construction O(n²); append during the head-to-tail walk instead.', zh: '对不断增长的结果反复执行 unshift 会在每个节点上移动元素，使快照构造达到 O(n²)；从头到尾遍历时应直接追加。' }
    explanation: { en: 'Use Map for the ID index, validate a positive integer limit, detach and move existing nodes, evict beyond the limit, and bounds-check at(). A head-to-tail traversal can push IDs directly into a correctly ordered O(n) snapshot.', zh: '应使用 Map 建立 ID 索引，校验正整数容量，分离并前移已有节点，淘汰超限节点，并为 at() 做边界检查；从头到尾遍历时直接 push ID，就能用 O(n) 构造顺序正确的快照。' }
    difficulty: advanced
    tags: [code-review, linked-lists, invariants, performance]
    minutes: 15
