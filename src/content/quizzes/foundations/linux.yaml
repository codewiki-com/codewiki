topic: foundations/linux
items:
  - id: predict-permission-mode
    type: predict
    prompt: { en: 'What does this permission script print?', zh: '这段权限脚本会输出什么？' }
    code: |
      sandbox=$(mktemp -d)
      trap 'rm -rf "$sandbox"' EXIT
      umask 077
      : > "$sandbox/report"
      chmod g+r "$sandbox/report"
      stat -c '%a' "$sandbox/report"
    lang: bash
    options:
      - { text: { en: '600', zh: '600' }, correct: false }
      - { text: { en: '640', zh: '640' }, correct: true }
      - { text: { en: '644', zh: '644' }, correct: false }
      - { text: { en: '777', zh: '777' }, correct: false }
    explanation: { en: 'The umask removes all group and other bits at creation, producing 600. chmod then adds group read, producing 640.', zh: 'umask 在创建时移除了组和其他用户的所有权限，先得到 600；chmod 再增加组读取权限，最终得到 640。' }
    difficulty: beginner
    tags: [permissions, umask, predict-output]
    tests: bash permission_mode.sh
    minutes: 3

  - id: directory-delete-permission
    type: mcq
    prompt: { en: 'Which permission most directly controls removing a file name from a directory?', zh: '哪项权限最直接控制从目录中删除一个文件名？' }
    options:
      - { text: { en: 'Read permission on the file', zh: '文件的读取权限' }, correct: false }
      - { text: { en: 'Write and search permission on the parent directory, subject to sticky-bit rules', zh: '父目录的写入与搜索权限，同时还要满足 sticky bit 规则' }, correct: true }
      - { text: { en: 'Execute permission on the file', zh: '文件的执行权限' }, correct: false }
      - { text: { en: 'Ownership of the filesystem mount', zh: '文件系统挂载点的所有权' }, correct: false }
    explanation: { en: 'Unlinking changes the parent directory entry rather than reading or executing file contents. Sticky directories add an ownership restriction.', zh: '删除链接修改的是父目录项，不需要读取或执行文件内容；带 sticky bit 的目录还会增加所有权限制。' }
    difficulty: intermediate
    tags: [permissions, directories, unlink]
    minutes: 3

  - id: spot-unsafe-cleanup
    type: spotbug
    prompt: { en: 'Find the safety and correctness bugs in this generated cleanup function.', zh: '找出这个生成的清理函数中的安全与正确性问题。' }
    code: |
      cleanup() {
        target=$1
        for file in $(find $target -type f -name '*.tmp'); do
          rm $file
        done
        echo "cleaned $target"
      }
      cleanup "$1"
    lang: bash
    issues:
      - line: 2
        kind: security
        note: { en: 'The function accepts an empty, relative, root, or out-of-scope target without validation before deletion.', zh: '函数在删除前没有拒绝空路径、相对路径、根目录或允许范围之外的目标。' }
      - line: 3
        kind: correctness
        note: { en: 'Command substitution splits find output on whitespace and glob characters, so valid filenames are changed into different arguments.', zh: '命令替换会按空白与通配字符拆分 find 输出，使合法文件名变成不同参数。' }
      - line: 4
        kind: edge-case
        note: { en: 'The unquoted name can be split again and a leading hyphen can be parsed by rm as an option.', zh: '未引用的名称会再次被拆分，前导连字符还可能被 rm 解析成选项。' }
    explanation: { en: 'Validate an absolute target under an allowlisted root, inspect the matched set, and consume find -print0 with a NUL-safe loop. Quote each path and pass -- before operands.', zh: '应校验目标为允许根目录下的绝对路径，先检查匹配集合，再用 NUL 安全循环读取 find -print0；每条路径都要引用，并在操作数前传入 --。' }
    difficulty: intermediate
    tags: [shell, deletion, filenames]
    tests: bash -n unsafe_cleanup.sh
    minutes: 7

  - id: graceful-termination
    type: mcq
    prompt: { en: 'Why should a service controller normally send SIGTERM before SIGKILL?', zh: '服务控制器通常为什么要先发送 SIGTERM，再考虑 SIGKILL？' }
    options:
      - { text: { en: 'SIGTERM is always delivered faster.', zh: 'SIGTERM 总是传递得更快。' }, correct: false }
      - { text: { en: 'SIGTERM can be handled for bounded cleanup; SIGKILL cannot be caught or ignored.', zh: 'SIGTERM 可被处理以执行有界清理；SIGKILL 无法被捕获或忽略。' }, correct: true }
      - { text: { en: 'SIGKILL affects only one thread.', zh: 'SIGKILL 只影响一个线程。' }, correct: false }
      - { text: { en: 'SIGTERM guarantees every transaction commits.', zh: 'SIGTERM 能保证每个事务都完成提交。' }, correct: false }
    explanation: { en: 'SIGTERM gives application code a chance to stop admission and clean up within a deadline. SIGKILL is a final enforcement mechanism, not a cleanup protocol.', zh: 'SIGTERM 让应用有机会停止接收工作，并在期限内清理；SIGKILL 是最终强制手段，不是清理协议。' }
    difficulty: beginner
    tags: [signals, shutdown, lifecycle]
    minutes: 3

  - id: review-generated-deploy
    type: review
    prompt: { en: 'Review this AI-generated deployment script against its stated task.', zh: '根据给定任务，审查这个 AI 生成的部署脚本。' }
    task: { en: 'Deploy a signed release archive for one allowlisted systemd service, preserve the previous release, stop gracefully, and fail safely if health verification does not pass.', zh: '为一个允许列表内的 systemd 服务部署带签名的发布归档，保留上一版本，优雅停止，并在健康验证不通过时安全失败。' }
    code: |
      #!/usr/bin/env bash
      set -e

      SERVICE=$1
      ARCHIVE_URL=$2
      RELEASE_DIR=/opt/apps/$SERVICE

      sudo mkdir -p $RELEASE_DIR
      curl -sL $ARCHIVE_URL | sudo tar -xz -C $RELEASE_DIR
      sudo chmod -R 777 $RELEASE_DIR
      for pid in $(pgrep -f $SERVICE); do
        sudo kill -9 $pid
      done
      sudo cp $RELEASE_DIR/$SERVICE.service /etc/systemd/system/
      sudo systemctl daemon-reload
      sudo systemctl start $SERVICE
      curl -s http://localhost:8080/health
      echo "deployed $SERVICE"
    lang: bash
    right: { en: 'The script uses one named service and release directory, asks systemd to reload unit files, starts the service through its manager, and includes a post-start health request.', zh: '脚本围绕一个具名服务与发布目录操作，要求 systemd 重新加载单元文件，通过服务管理器启动服务，并包含启动后的健康请求。' }
    checklist:
      - { en: 'Validate the allowlisted service, arguments, destination ownership, archive signature, and extraction paths before mutation.', zh: '修改前校验服务允许列表、参数、目标所有权、归档签名与解压路径。' }
      - { en: 'Stage a versioned release and keep an atomic, tested rollback pointer.', zh: '暂存带版本的发布目录，并保留经过测试、可原子切换的回滚指针。' }
      - { en: 'Use the service manager for bounded graceful stop, start, status, and log collection.', zh: '通过服务管理器执行有界优雅停止、启动、状态检查与日志收集。' }
      - { en: 'Verify health with timeouts and strict response checks, then roll back on failure.', zh: '使用超时与严格响应检查验证健康状态，并在失败时回滚。' }
    issues:
      - line: 4
        kind: readability
        note: { en: 'Unnamed positional inputs hide required validation and make the service allowlist and archive contract invisible.', zh: '无名称的位置参数隐藏了必要校验，也没有表达服务允许列表与归档契约。' }
      - line: 9
        kind: security
        note: { en: 'Remote bytes are streamed into privileged extraction without a pinned digest or signature check, and archive paths are not screened.', zh: '远端字节未经固定摘要或签名校验就进入高权限解压，归档路径也没有过滤。' }
      - line: 10
        kind: performance
        note: { en: 'Every deployment recursively walks the entire release tree, even when most mode bits are already correct.', zh: '每次部署都会递归遍历整个发布树，即使大多数权限位已经正确。' }
      - line: 11
        kind: correctness
        note: { en: 'pgrep -f can match unrelated command lines, and command substitution corrupts process selection rather than identifying the managed unit.', zh: 'pgrep -f 可能匹配无关命令行，命令替换也会破坏进程选择，没有准确定位受管单元。' }
      - line: 17
        kind: edge-case
        note: { en: 'The health request has no deadline and accepts error HTTP statuses, so it can hang or report a failed deployment as successful.', zh: '健康请求没有截止时间，还接受错误 HTTP 状态，因此可能永久挂起或把失败部署报告为成功。' }
    explanation: { en: 'Download to an unprivileged staging area, verify identity and signature, inspect extraction paths, and atomically switch a versioned release. Let systemd own the process, use bounded stop and health checks, and restore the previous pointer on any failed verification.', zh: '应下载到非特权暂存区，校验身份与签名，检查解压路径，再原子切换带版本的发布目录。让 systemd 管理进程，采用有界停止与健康检查，并在任何验证失败时恢复上一指针。' }
    difficulty: advanced
    tags: [code-review, deployment, security, rollback]
    tests: bash -n generated_deploy.sh
    minutes: 15
