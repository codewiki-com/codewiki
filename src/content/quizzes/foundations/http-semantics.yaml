topic: foundations/http-semantics
items:
  - id: predict-repeated-put
    type: predict
    prompt: { en: 'What does this simplified PUT contract print?', zh: '这个简化的 PUT 约定会输出什么？' }
    code: |
      const profiles = new Set();

      function putProfile(id) {
        const created = !profiles.has(id);
        profiles.add(id);
        return created ? 201 : 204;
      }

      console.log(putProfile("7"), putProfile("7"), profiles.size);
    lang: javascript
    options:
      - { text: { en: '201 201 2', zh: '201 201 2' }, correct: false }
      - { text: { en: '201 204 1', zh: '201 204 1' }, correct: true }
      - { text: { en: '204 204 1', zh: '204 204 1' }, correct: false }
      - { text: { en: 'The second call throws.', zh: '第二次调用抛出异常。' }, correct: false }
    explanation: { en: 'The first PUT creates the target, while the repeat leaves the same intended state and can return a different success status. Idempotency concerns effect, not identical responses.', zh: '第一次 PUT 创建目标，重复请求保持相同预期状态，却可以返回不同的成功状态。幂等性针对效果，不要求响应完全相同。' }
    difficulty: beginner
    tags: [put, idempotency, predict-output]

  - id: conditional-304
    type: mcq
    prompt: { en: 'A cache sends `If-None-Match` for a stored GET response and receives `304 Not Modified`. What should it do?', zh: '缓存为已存 GET 响应发送 `If-None-Match`，并收到 `304 Not Modified`。它应怎样处理？' }
    options:
      - { text: { en: 'Replace the stored representation with an empty body.', zh: '用空主体替换已存表示。' }, correct: false }
      - { text: { en: 'Keep the stored content and update permitted metadata from the 304 response.', zh: '保留已存内容，并用 304 响应更新允许更新的元数据。' }, correct: true }
      - { text: { en: 'Follow the `Location` field with POST.', zh: '用 POST 跟随 `Location` 字段。' }, correct: false }
      - { text: { en: 'Treat 304 as a server failure.', zh: '把 304 当作服务端故障。' }, correct: false }
    explanation: { en: 'A 304 validates a representation the client already holds and carries no new representation content. It is not an empty 200 response.', zh: '304 验证客户端已经持有的表示，不携带新的表示内容。它不是主体为空的 200 响应。' }
    difficulty: beginner
    tags: [etag, conditional-request, caching]

  - id: no-cache-meaning
    type: mcq
    prompt: { en: 'What does `Cache-Control: no-cache` require for a stored response?', zh: '`Cache-Control: no-cache` 对已存响应提出什么要求？' }
    options:
      - { text: { en: 'The response must never be stored.', zh: '绝对不能存储该响应。' }, correct: false }
      - { text: { en: 'The response must be validated successfully before reuse.', zh: '复用响应前必须成功验证。' }, correct: true }
      - { text: { en: 'Only a shared cache may store it.', zh: '只有共享缓存可以存储它。' }, correct: false }
      - { text: { en: 'The response remains fresh forever.', zh: '该响应永远保持新鲜。' }, correct: false }
    explanation: { en: '`no-cache` permits storage but requires validation before reuse. `no-store` is the directive that asks caches not to store the response.', zh: '`no-cache` 允许存储，但要求复用前先验证。要求缓存不存储响应的指令是 `no-store`。' }
    difficulty: beginner
    tags: [cache-control, validation]

  - id: spot-unsafe-payment-retry
    type: spotbug
    prompt: { en: 'Find the semantic bug in this generated payment retry.', zh: '找出这段生成式支付重试代码中的语义缺陷。' }
    code: |
      async function createPayment(payment) {
        for (let attempt = 0; attempt < 3; attempt += 1) {
          try {
            return await fetch("https://payments.example/charges", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payment),
            });
          } catch (error) {
            if (attempt === 2) throw error;
          }
        }
      }
    lang: javascript
    issues:
      - line: 4
        kind: correctness
        note: { en: 'A lost response can make fetch reject after the server committed the charge. Replaying POST without a stable, server-enforced idempotency key can charge twice.', zh: '服务端提交扣款后若响应丢失，fetch 仍可能拒绝。没有稳定且由服务端强制执行的幂等键就重放 POST，可能重复扣款。' }
    explanation: { en: 'A transport exception leaves the application outcome unknown. Automatic replay needs a documented idempotency contract, reproducible content, and a bounded retry policy.', zh: '传输异常会让应用结果处于未知状态。自动重放需要明确的幂等约定、可重现内容和有界重试策略。' }
    difficulty: intermediate
    tags: [post, retry, ambiguous-commit, idempotency]

  - id: reset-outcome
    type: mcq
    prompt: { en: 'A connection resets after a client finishes sending a write but before it reads a response. What can the client conclude?', zh: '客户端发送完写请求后、读取响应前连接被重置。客户端可以得出什么结论？' }
    options:
      - { text: { en: 'The server definitely rolled back the write.', zh: '服务端肯定回滚了写操作。' }, correct: false }
      - { text: { en: 'The server definitely committed the write.', zh: '服务端肯定提交了写操作。' }, correct: false }
      - { text: { en: 'The application outcome is unknown without additional evidence.', zh: '没有额外证据时，应用结果未知。' }, correct: true }
      - { text: { en: 'The method automatically becomes idempotent.', zh: '该方法会自动变成幂等方法。' }, correct: false }
    explanation: { en: 'A transport event reports connection state, not transaction state. The client needs idempotency, an operation-status query, or other application evidence before deciding how to recover.', zh: '传输事件报告的是连接状态，不是事务状态。客户端需要幂等机制、操作状态查询或其他应用证据，才能决定如何恢复。' }
    difficulty: beginner
    tags: [connection-reset, retry, uncertainty]

  - id: review-generated-profile-handler
    type: review
    title: { en: 'Review a generated conditional profile handler', zh: '审查生成的条件式资料处理器' }
    prompt: { en: 'Review this generated handler before it serves private profile data through a proxy.', zh: '在这个生成式处理器通过代理提供私有资料前，对它进行审查。' }
    task: { en: 'Serve GET requests for one private profile, support standards-compliant ETag validation, return no content on 304, reject other methods before storage work, and prevent shared-cache reuse.', zh: '为一份私有资料处理 GET 请求，支持符合标准的 ETag 验证，在 304 中不返回内容，先拒绝其他方法再访问存储，并防止共享缓存复用。' }
    code: |
      import { createHash } from "node:crypto";
      async function sendProfile(request, response, profileId) {
        const profile = await store.find(profileId);
        if (request.method !== "GET") {
          response.writeHead(405, { Allow: "GET" }).end();
          return;
        }
        if (!profile) {
          response.writeHead(404).end();
          return;
        }
        const body = JSON.stringify(profile);
        const digest = createHash("sha256").update(body).digest("hex");
        const etag = `"${digest}"`;
        if (request.headers["if-none-match"] === etag) {
          response.writeHead(304, { ETag: etag });
          response.end(body);
          return;
        }
        response.writeHead(200, {
          ETag: etag,
          "Content-Type": "application/json",
          "Cache-Control": "public, max-age=3600",
        }).end(body);
      }
    lang: javascript
    right: { en: 'The generated code uses a deterministic strong ETag, returns explicit 404 and 405 statuses, includes `Allow` for the unsupported method, and labels the successful representation as JSON.', zh: '生成代码使用确定性的强 ETag，明确返回 404 和 405，为不支持的方法提供 `Allow`，并把成功响应的表示标记为 JSON。' }
    checklist:
      - { en: 'Exercise an unsupported method and verify no storage call occurs.', zh: '执行不支持的方法，并确认不会访问存储。' }
      - { en: 'Test one tag, a tag list, a wildcard, and a nonmatching validator.', zh: '测试单个标签、标签列表、通配符和不匹配的验证器。' }
      - { en: 'Assert that 304 carries no content and that the client retains stored content.', zh: '断言 304 不携带内容，而且客户端保留已存内容。' }
      - { en: 'Send two identities through the shared proxy and inspect cache keys and policy.', zh: '让两个身份经过共享代理，并检查缓存键与策略。' }
    issues:
      - line: 3
        kind: performance
        note: { en: 'The handler performs the storage lookup before rejecting unsupported methods. Check the method first so invalid traffic cannot consume profile-store capacity.', zh: '处理器在拒绝不支持的方法前访问了存储。应先检查方法，避免无效流量消耗资料存储容量。' }
      - line: 15
        kind: edge-case
        note: { en: 'Literal equality does not implement the `If-None-Match` grammar, including tag lists and `*`. Use the HTTP library’s conditional-request parser.', zh: '直接按字符串相等比较没有实现 `If-None-Match` 的标签列表和 `*` 等语法。应使用 HTTP 库的条件式请求解析器。' }
      - line: 17
        kind: correctness
        note: { en: 'A 304 response cannot contain content. End the response after its fields and let the client reuse the stored representation.', zh: '304 响应不能包含内容。应在字段之后结束响应，让客户端复用已存表示。' }
      - line: 23
        kind: security
        note: { en: 'Marking private profile data `public` permits shared-cache reuse. Use an explicit private policy and verify that authorization and cache selection cannot cross users.', zh: '把私有资料标为 `public` 会允许共享缓存复用。应采用明确的私有策略，并确认认证与缓存选择不会跨用户。' }
    explanation: { en: 'Move method validation before I/O, delegate conditional-field parsing to a conforming HTTP implementation, end 304 without content, and mark the personalized response private. Then test through the same intermediary path used in production.', zh: '应把方法验证移到 I/O 之前，由符合规范的 HTTP 实现解析条件字段，让 304 不带内容结束，并把个性化响应标为私有。随后经由生产环境使用的同一中间节点路径进行测试。' }
    difficulty: intermediate
    minutes: 10
    tags: [code-review, etag, caching, status-codes, privacy]
