topic: csharp/properties
items:
  - id: predict-accessor-execution
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      using System;

      var meter = new Meter { Level = 3 };
      Console.WriteLine($"{meter.Level}:{meter.Reads}");

      public sealed class Meter
      {
          private int _level;
          public int Reads { get; private set; }

          public int Level
          {
              get
              {
                  Reads++;
                  return _level;
              }
              set => _level = value * 2;
          }
      }
    lang: csharp
    options:
      - { text: { en: '6:1', zh: '6:1' }, correct: true }
      - { text: { en: '3:0', zh: '3:0' }, correct: false }
      - { text: { en: '6:0', zh: '6:0' }, correct: false }
      - { text: { en: '3:1', zh: '3:1' }, correct: false }
    explanation: { en: 'The object initializer invokes the setter, which stores 6. Interpolation then invokes the getter once before reading Reads, so the second value is 1.', zh: '对象初始化器调用 setter 并存入 6。字符串插值随后调用一次 getter，再读取 Reads，所以第二个值为 1。' }
    difficulty: beginner
    tags: [accessors, getters, setters, side-effects]

  - id: spotbug-recursive-setter
    type: spotbug
    prompt: { en: 'Find the property implementation bug.', zh: '找出这个属性实现中的错误。' }
    code: |
      public sealed class Customer
      {
          private string _name = string.Empty;

          public string Name
          {
              get => _name;
              set => Name = value.Trim();
          }
      }
    lang: csharp
    issues:
      - line: 8
        kind: correctness
        note: { en: 'The setter assigns Name, which calls the same setter recursively until a StackOverflowException occurs; it should validate and assign _name or field.', zh: 'setter 给 Name 赋值，会递归调用自身，直到发生 StackOverflowException；它应验证后写入 _name 或 field。' }
    explanation: { en: 'Field-like syntax still invokes an accessor inside the declaring type. Use the backing field explicitly, or the field keyword in C# 14.', zh: '即使在声明类型内部，字段式语法仍会调用访问器。应显式使用幕后字段，或使用 C# 14 的 field 关键字。' }
    difficulty: beginner
    tags: [accessors, recursion, backing-fields]

  - id: init-and-required-contracts
    type: mcq
    prompt: { en: 'Which statement about `public required string Name { get; init; }` is correct?', zh: '关于 `public required string Name { get; init; }`，哪项说法正确？' }
    options:
      - { text: { en: 'Normal C# creation code must assign Name, and ordinary assignment is rejected after construction, but runtime null validation is still separate.', zh: '普通 C# 创建代码必须给 Name 赋值，构造结束后普通赋值会被拒绝，但运行时空值验证仍是另一回事。' }, correct: true }
      - { text: { en: 'The runtime guarantees Name can never be null.', zh: '运行时保证 Name 永远不为 null。' }, correct: false }
      - { text: { en: 'The declaring type can never modify any object referenced by Name.', zh: '声明类型永远不能修改 Name 引用的任何对象。' }, correct: false }
      - { text: { en: 'Every constructor body is verified to assign Name.', zh: '每个构造函数体都会被验证已给 Name 赋值。' }, correct: false }
    explanation: { en: '`required` checks creation expressions, while `init` restricts later assignment. Neither keyword performs domain validation or makes a referenced object deeply immutable.', zh: '`required` 检查创建表达式，`init` 限制之后的赋值。两个关键字都不执行领域验证，也不会让引用对象深度不可变。' }
    difficulty: intermediate
    tags: [init, required, nullability, immutability]

  - id: spotbug-mutable-collection-property
    type: spotbug
    prompt: { en: 'Why does this property fail to protect team membership?', zh: '为什么这个属性不能保护团队成员列表？' }
    code: |
      using System.Collections.Generic;

      var team = new Team();
      team.Members.Add("unreviewed-user");

      public sealed class Team
      {
          public List<string> Members { get; private set; } = [];
      }
    lang: csharp
    issues:
      - line: 8
        kind: security
        note: { en: 'A private setter prevents replacing the List reference but the public getter still returns a mutable List, so any caller can change membership.', zh: '私有 setter 只能阻止替换 List 引用，公开 getter 仍返回可变 List，因此任何调用方都能修改成员。' }
    explanation: { en: 'Keep the mutable list private, expose an immutable collection or read-only wrapper, and provide methods that enforce membership rules.', zh: '应把可变列表保留为私有状态，对外提供不可变集合或只读包装，并通过方法执行成员规则。' }
    difficulty: intermediate
    tags: [collections, ownership, private-set, encapsulation]

  - id: review-generated-user-profile
    type: review
    prompt: { en: 'Review this generated profile model before it controls application roles.', zh: '在这个生成的资料模型用于控制应用角色前，对它进行审查。' }
    task: { en: 'Store nonblank names and slugs, keep role changes under the type’s control, and make repeated biography reads use in-memory state.', zh: '保存非空白名称与 slug，由类型控制角色变更，并让重复读取简介时使用内存状态。' }
    code: |
      using System;
      using System.Collections.Generic;
      using System.IO;

      public sealed class UserProfile
      {
          public required string Name { get; set; }
          public List<string> Roles { get; init; } = [];

          private string _slug = string.Empty;
          public string Slug
          {
              get => _slug;
              set
              {
                  _slug = value.Trim();
                  if (_slug.Length == 0)
                      throw new ArgumentException("Slug is required");
              }
          }

          public string Biography => File.ReadAllText("bio.txt");
          public bool IsAdmin => Roles.Contains("admin");
      }
    lang: csharp
    right: { en: 'The generated type uses a named backing field for custom slug behavior, gives the role decision a readable property, and marks Name as required for ordinary creation sites.', zh: '生成类型为 slug 的自定义行为使用了命名幕后字段，以可读属性表达角色判断，并把 Name 标为普通创建位置的必需成员。' }
    checklist:
      - { en: 'Create instances with omitted, null, empty, whitespace, and normalized text values.', zh: '分别用遗漏、null、空字符串、空白和待规范化文本创建实例。' }
      - { en: 'After every rejected assignment, read the property again and verify the old valid state remains.', zh: '每次赋值被拒绝后再次读取属性，确认原来的有效状态仍然保留。' }
      - { en: 'Attempt mutation through every returned collection and through each mutable element.', zh: '尝试通过每个返回集合及其中的可变元素修改状态。' }
      - { en: 'Count file, network, clock, and allocation work caused by repeated getter evaluation.', zh: '统计重复执行 getter 引起的文件、网络、时钟与分配操作。' }
    issues:
      - line: 7
        kind: edge-case
        note: { en: '`required` only demands an assignment, so explicit null or whitespace can enter Name without the runtime validation required by the task.', zh: '`required` 只要求发生赋值，因此显式 null 或空白值仍可进入 Name，没有执行任务要求的运行时验证。' }
      - line: 8
        kind: security
        note: { en: 'Callers receive the mutable Roles list and can add `admin` directly, bypassing any authorization rule the type is meant to enforce.', zh: '调用方拿到可变 Roles 列表后可以直接添加 `admin`，绕过该类型本应执行的授权规则。' }
      - line: 16
        kind: correctness
        note: { en: 'The setter commits the trimmed value before checking it, so a rejected whitespace assignment leaves _slug empty instead of preserving the old valid value.', zh: 'setter 在检查前就提交裁剪结果，因此空白赋值被拒绝后，_slug 会变成空字符串，而不是保留原来的有效值。' }
      - line: 22
        kind: performance
        note: { en: 'Every Biography read performs synchronous file I/O; debuggers and serializers may trigger that getter repeatedly.', zh: '每次读取 Biography 都会执行同步文件 I/O，调试器与序列化器还可能重复触发这个 getter。' }
    explanation: { en: 'Validate local candidates before assigning fields, enforce Name at runtime, keep the role list private behind controlled methods, and load biography data explicitly before exposing an in-memory property.', zh: '应先验证局部候选值再写字段，在运行时验证 Name，把角色列表保留为私有状态并通过受控方法修改，同时显式加载简介数据后再通过内存属性公开。' }
    difficulty: intermediate
    tags: [code-review, properties, validation, ownership, side-effects]
