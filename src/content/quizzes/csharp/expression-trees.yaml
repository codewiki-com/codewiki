topic: csharp/expression-trees
items:
  - id: predict-compiler-tree-node
    type: predict
    prompt: { en: 'Which node kind does this program print?', zh: '这段程序会输出哪种节点？' }
    code: |
      using System;
      using System.Linq.Expressions;

      Expression<Func<int, bool>> test = value => value > 10 && value < 20;
      Console.WriteLine(test.Body.NodeType);
    lang: csharp
    options:
      - { text: { en: 'AndAlso', zh: 'AndAlso' }, correct: true }
      - { text: { en: 'And', zh: 'And' }, correct: false }
      - { text: { en: 'Lambda', zh: 'Lambda' }, correct: false }
      - { text: { en: 'Call', zh: 'Call' }, correct: false }
    explanation: { en: 'The body is the short-circuiting `&&` operation, represented by `AndAlso`; the enclosing object is the lambda node.', zh: '函数体是短路 `&&` 运算，对应 `AndAlso`；外层对象才是 lambda 节点。' }
    difficulty: beginner
    tags: [node-type, binary-expression, short-circuiting]

  - id: predict-captured-threshold
    type: predict
    prompt: { en: 'What does the program print after the captured variable changes?', zh: '捕获变量变化后，这段程序会输出什么？' }
    code: |
      using System;
      using System.Linq.Expressions;

      decimal minimum = 100m;
      Expression<Func<decimal, bool>> accepts = price => price >= minimum;
      minimum = 200m;

      Console.WriteLine(accepts.Compile()(150m));
    lang: csharp
    options:
      - { text: { en: 'False', zh: 'False' }, correct: true }
      - { text: { en: 'True', zh: 'True' }, correct: false }
      - { text: { en: 'It fails to compile because expression trees cannot capture locals.', zh: '无法编译，因为表达式树不能捕获局部变量。' }, correct: false }
      - { text: { en: 'It throws when `Compile()` is called.', zh: '调用 `Compile()` 时抛出异常。' }, correct: false }
    explanation: { en: 'The tree retains access to the captured variable rather than freezing `100m`; the compiled delegate reads `200m` when invoked.', zh: '树保留对捕获变量的访问，而不是冻结 `100m`；委托调用时读取的是 `200m`。' }
    difficulty: intermediate
    tags: [capture, deferred-execution, constant-expression]

  - id: spotbug-unbound-parameter
    type: spotbug
    prompt: { en: 'Find why constructing or compiling the combined predicate fails.', zh: '找出组合谓词在创建或编译时失败的原因。' }
    code: |
      using System;
      using System.Linq.Expressions;

      Expression<Func<Order, bool>> paid = order => order.IsPaid;
      Expression<Func<Order, bool>> large = item => item.Total >= 100m;

      var body = Expression.AndAlso(paid.Body, large.Body);
      var combined = Expression.Lambda<Func<Order, bool>>(
          body, paid.Parameters[0]);

      public sealed record Order(decimal Total, bool IsPaid);
    lang: csharp
    issues:
      - line: 7
        kind: correctness
        note: { en: '`large.Body` refers to a different parameter object, but the new lambda binds only `paid`''s parameter.', zh: '`large.Body` 引用另一个参数对象，新 lambda 却只绑定了 `paid` 的参数。' }
    explanation: { en: 'Use an `ExpressionVisitor` to replace both source parameters with one canonical `ParameterExpression` before combining the bodies.', zh: '组合函数体前，应使用 `ExpressionVisitor` 把两个源参数替换成同一个规范 `ParameterExpression`。' }
    difficulty: intermediate
    tags: [parameter-identity, predicate-composition, expression-visitor]

  - id: queryable-needs-expression
    type: mcq
    prompt: { en: 'A repository must let its database provider translate a caller-supplied filter. Which parameter type preserves that option?', zh: '仓储需要让数据库提供程序翻译调用方传入的筛选条件，哪种参数类型能保留这一能力？' }
    options:
      - { text: { en: '`Expression<Func<Product, bool>>`', zh: '`Expression<Func<Product, bool>>`' }, correct: true }
      - { text: { en: '`Func<Product, bool>`', zh: '`Func<Product, bool>`' }, correct: false }
      - { text: { en: '`Predicate<Product>`', zh: '`Predicate<Product>`' }, correct: false }
      - { text: { en: '`Action<Product>`', zh: '`Action<Product>`' }, correct: false }
    explanation: { en: 'A query provider can inspect an expression tree. The delegate forms expose executable code but not a portable node structure for translation.', zh: '查询提供程序可以检查表达式树；其他委托形式只暴露可执行代码，没有可供翻译的节点结构。' }
    difficulty: beginner
    tags: [iqueryable, delegate, translation]

  - id: spotbug-string-constant-type
    type: spotbug
    prompt: { en: 'Why does this dynamic comparison fail during construction?', zh: '为什么这个动态比较会在构造阶段失败？' }
    code: |
      using System;
      using System.Linq.Expressions;

      var product = Expression.Parameter(typeof(Product), "product");
      var price = Expression.Property(product, nameof(Product.Price));
      var supplied = Expression.Constant("100");
      var comparison = Expression.GreaterThanOrEqual(price, supplied);

      public sealed record Product(decimal Price);
    lang: csharp
    issues:
      - line: 6
        kind: correctness
        note: { en: 'The constant has type `string`, while `Price` has type `decimal`; the factory does not parse text or invent a comparison conversion.', zh: '常量类型是 `string`，`Price` 类型是 `decimal`；工厂不会解析文本，也不会自行添加比较转换。' }
    explanation: { en: 'Parse and validate the input using the approved member type, then create a typed constant and an explicit conversion only when the contract permits it.', zh: '应按允许成员的类型解析并验证输入，再创建有明确类型的常量；只有契约允许时才添加显式转换。' }
    difficulty: intermediate
    tags: [constant-expression, type-conversion, dynamic-filter]

  - id: review-generated-dynamic-filter
    type: review
    prompt: { en: 'Review this generated filter builder before exposing it through a public search endpoint.', zh: '在这个生成的筛选器构建器用于公开搜索接口前，对它进行审查。' }
    task: { en: 'Build allowlisted equality filters for `IQueryable<T>`, convert text to the exact nullable or non-nullable property type, report unknown input consistently, preserve remote translation, and define bounded cache ownership.', zh: '为 `IQueryable<T>` 构建有白名单的等值筛选；把文本转换成准确的可空或非可空属性类型；统一报告未知输入；保留远程翻译，并定义有界缓存所有权。' }
    code: |
      using System;
      using System.Collections.Generic;
      using System.Linq;
      using System.Linq.Expressions;

      public static class DynamicFilter
      {
          public static Expression<Func<T, bool>> Build<T>(string propertyName, string rawValue)
          {
              var parameter = Expression.Parameter(typeof(T), "item");
              var property = Expression.Property(parameter, propertyName);
              var constant = Expression.Constant(rawValue);
              var comparison = Expression.Equal(property, constant);
              return Expression.Lambda<Func<T, bool>>(comparison, parameter);
          }

          public static IEnumerable<T> Apply<T>(IQueryable<T> source, string propertyName, string rawValue)
          {
              var predicate = Build<T>(propertyName, rawValue);
              return source.AsEnumerable().Where(predicate.Compile());
          }

          public static string CacheKey<T>(Expression<Func<T, bool>> predicate)
              => predicate.ToString();
      }
    lang: csharp
    right: { en: 'The generated code keeps construction in one generic helper, returns a strongly typed expression, and separates predicate construction from application.', zh: '生成代码把构造逻辑集中在一个泛型辅助方法中，返回强类型表达式，并把谓词构造与应用分开。' }
    checklist:
      - { en: 'Test approved, forbidden, missing, inherited, nullable, enum, and differently cased properties.', zh: '测试允许、禁止、缺失、继承、可空、枚举和大小写不同的属性。' }
      - { en: 'Verify parsing under the specified culture and distinguish `null`, empty text, and invalid text.', zh: '按指定区域设置验证解析，并区分 `null`、空文本与无效文本。' }
      - { en: 'Run the filter through the real provider and locate every materialization or `IEnumerable` boundary.', zh: '通过真实提供程序运行筛选，并定位每个物化或 `IEnumerable` 边界。' }
      - { en: 'If caching is required, test structural keys, capture lifetimes, capacity, and invalidation.', zh: '如果需要缓存，应测试结构键、捕获对象生命周期、容量和失效策略。' }
    issues:
      - line: 11
        kind: security
        note: { en: 'The caller can select any public property, including fields the endpoint did not intend to expose for filtering or inference.', zh: '调用方可以选择任意公开属性，包括接口本不打算开放筛选或推断的字段。' }
      - line: 12
        kind: correctness
        note: { en: 'Every value remains a `string`, so comparisons against numbers, enums, dates, and nullable properties fail or have the wrong semantics.', zh: '所有值都保持为 `string`，与数字、枚举、日期和可空属性比较时会失败或产生错误语义。' }
      - line: 11
        kind: edge-case
        note: { en: 'A missing or differently cased property throws from `Expression.Property` without the endpoint''s stable validation error.', zh: '属性缺失或大小写不同时，`Expression.Property` 会直接抛出异常，无法提供接口约定的稳定校验错误。' }
      - line: 20
        kind: performance
        note: { en: '`AsEnumerable()` and `Compile()` move filtering into the application, potentially retrieving the unfiltered remote result first.', zh: '`AsEnumerable()` 与 `Compile()` 把筛选移到应用进程，可能先取回未经筛选的远程结果。' }
      - line: 24
        kind: readability
        note: { en: '`ToString()` is a diagnostic rendering, but `CacheKey` presents it as a stable structural identity without defining equivalence or captured-value policy.', zh: '`ToString()` 是诊断表示，`CacheKey` 却把它包装成稳定结构标识，没有定义等价关系或捕获值策略。' }
    explanation: { en: 'Map external names to an allowlisted `PropertyInfo`, parse with an explicit nullable and culture policy, build a typed constant, return `source.Where(predicate)`, and cache only under a bounded structural-key contract.', zh: '应把外部名称映射到白名单中的 `PropertyInfo`，按明确的可空与区域策略解析，创建有类型的常量，返回 `source.Where(predicate)`，并只在有界结构键契约下缓存。' }
    difficulty: advanced
    tags: [code-review, dynamic-filter, iqueryable, validation, client-evaluation]
