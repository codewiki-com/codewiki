topic: csharp/exceptions
items:
  - id: predict-filter-and-finally
    type: predict
    prompt: { en: 'Which two lines does this program print?', zh: '这段程序会输出哪两行？' }
    code: |
      using System;

      try
      {
          throw new ArgumentOutOfRangeException("quantity");
      }
      catch (ArgumentException error) when (error.ParamName == "other")
      {
          Console.WriteLine("filtered");
      }
      catch (ArgumentOutOfRangeException)
      {
          Console.WriteLine("range");
      }
      finally
      {
          Console.WriteLine("finished");
      }
    lang: csharp
    options:
      - { text: { en: 'range, then finished', zh: '先输出 range，再输出 finished' }, correct: true }
      - { text: { en: 'filtered, then finished', zh: '先输出 filtered，再输出 finished' }, correct: false }
      - { text: { en: 'range only', zh: '只输出 range' }, correct: false }
      - { text: { en: 'The exception is unhandled.', zh: '异常未被处理。' }, correct: false }
    explanation: { en: 'The first handler has a compatible type, but its filter is false, so search continues. The specific handler runs and finally follows it.', zh: '第一个处理器的类型兼容，但筛选器结果为 false，因此搜索继续。随后运行具体类型的处理器，最后执行 finally。' }
    difficulty: intermediate
    tags: [exception-filter, handler-selection, finally]

  - id: predict-whenall-stored-failures
    type: predict
    prompt: { en: 'What count does the program print after awaiting the combined task?', zh: '等待组合任务后，程序会输出哪个计数？' }
    code: |
      using System;
      using System.IO;
      using System.Threading.Tasks;

      Task first = Task.FromException(new IOException("disk"));
      Task second = Task.FromException(new InvalidOperationException("state"));
      Task all = Task.WhenAll(first, second);

      try
      {
          await all;
      }
      catch (Exception)
      {
          Console.WriteLine(all.Exception!.InnerExceptions.Count);
      }
    lang: csharp
    options:
      - { text: { en: '2', zh: '2' }, correct: true }
      - { text: { en: '1', zh: '1' }, correct: false }
      - { text: { en: '0', zh: '0' }, correct: false }
      - { text: { en: 'It prints nothing because await cannot be caught.', zh: '没有输出，因为无法捕获 await 的异常。' }, correct: false }
    explanation: { en: 'Await throws one stored failure into the catch, while the combined task retains both input failures in its AggregateException.', zh: 'await 会把一个已存储的失败抛入 catch，而组合任务的 AggregateException 仍保留两个输入任务的失败。' }
    difficulty: advanced
    tags: [task-whenall, aggregate-exception, async]

  - id: spotbug-catch-all-default
    title: { en: 'Spot the bug in customer lookup', zh: '找出客户查找里的 bug' }
    type: spotbug
    prompt: { en: 'Find why this method can report a missing customer when the real failure is unrelated.', zh: '找出为什么真实故障与客户缺失无关时，这个方法仍可能报告客户不存在。' }
    code: |
      public async Task<Customer?> FindCustomerAsync(
          string id, CancellationToken token)
      {
          try
          {
              return await _store.FindAsync(id, token);
          }
          catch (Exception)
          {
              return null;
          }
      }
    lang: csharp
    issues:
      - line: 8
        kind: correctness
        note: { en: 'The broad catch converts database faults, programming errors, and cancellation into the same null result as a genuine miss.', zh: '这个宽泛的 catch 把数据库故障、编程错误和取消都转换成与确实未找到相同的 null。' }
    explanation: { en: 'Let the store return null for a documented miss and allow unrelated exceptions to propagate. Catch only a specific failure when this layer has a valid fallback.', zh: '应让存储按契约对确实未找到返回 null，并让无关异常继续传播。只有当前层存在有效回退时，才捕获具体故障。' }
    difficulty: intermediate
    tags: [catch-all, cancellation, error-boundary]

  - id: preserve-stack-on-rethrow
    type: mcq
    prompt: { en: 'A catch block records a failure and must propagate the same exception. Which statement preserves its existing stack trace?', zh: 'catch 块记录失败后必须继续传播同一个异常。哪条语句会保留已有堆栈跟踪？' }
    options:
      - { text: { en: '`throw;`', zh: '`throw;`' }, correct: true }
      - { text: { en: '`throw error;`', zh: '`throw error;`' }, correct: false }
      - { text: { en: '`throw new Exception(error.Message);`', zh: '`throw new Exception(error.Message);`' }, correct: false }
      - { text: { en: '`return;`', zh: '`return;`' }, correct: false }
    explanation: { en: 'A bare rethrow continues the current exception without resetting its stack starting point. Throwing the caught variable is a new throw.', zh: '无操作数的重新抛出会继续传播当前异常，不会重置堆栈起点；抛出已捕获变量则是一次新的抛出。' }
    difficulty: beginner
    tags: [rethrow, stack-trace]

  - id: review-generated-price-client
    title: { en: 'Review generated price client', zh: '审查生成的价格客户端' }
    type: review
    prompt: { en: 'Review this generated client before it reads prices from a production endpoint.', zh: '在这段生成的客户端从生产端点读取价格前，对它进行审查。' }
    task: { en: 'Read an invariant-culture decimal, return null for an invalid body, preserve transport failures, honor cancellation, avoid leaking URL secrets, and reuse connections.', zh: '读取按固定区域性表示的 decimal；正文无效时返回 null；保留传输失败；遵守取消；避免泄露 URL 中的秘密；并复用连接。' }
    code: |
      using System;
      using System.Globalization;
      using System.Net.Http;
      using System.Threading;
      using System.Threading.Tasks;

      public sealed class PriceClient
      {
          public async Task<decimal?> ReadAsync(string url, CancellationToken token)
          {
              try
              {
                  using var client = new HttpClient();
                  string text = await client.GetStringAsync(url, token);
                  return decimal.Parse(text);
              }
              catch (Exception error)
              {
                  Console.WriteLine($"failed {url}: {error}");
                  throw error;
              }
          }
      }
    lang: csharp
    right: { en: 'The generated method returns Task instead of async void, forwards the caller''s token to the HTTP operation, and keeps invalid input distinct in its nullable return type.', zh: '生成的方法返回 Task 而非 async void，把调用方令牌传给 HTTP 操作，并通过可空返回类型为无效输入保留了独立状态。' }
    checklist:
      - { en: 'Test invariant decimal text, locale-sensitive text, malformed text, and overflow.', zh: '测试固定区域性小数文本、受区域设置影响的文本、格式错误文本和溢出。' }
      - { en: 'Cancel before and during the request and verify the task remains canceled.', zh: '分别在请求前和请求中取消，并确认任务仍处于取消状态。' }
      - { en: 'Force a transport failure and trace its stack back to the HTTP call.', zh: '制造传输失败，并沿堆栈追溯到 HTTP 调用。' }
      - { en: 'Inspect logs with a URL containing a secret query value.', zh: '使用查询参数含秘密值的 URL 检查日志。' }
    issues:
      - line: 13
        kind: performance
        note: { en: 'Creating and disposing HttpClient per call prevents deliberate connection-pool ownership and can cause connection churn; inject or retain a suitable client.', zh: '每次调用都创建并释放 HttpClient，无法明确复用连接池，还可能造成连接抖动；应注入或保留合适的客户端。' }
      - line: 15
        kind: edge-case
        note: { en: 'decimal.Parse uses the current culture and throws for malformed or overflowing bodies; TryParse with InvariantCulture matches the stated input contract.', zh: 'decimal.Parse 使用当前区域性，并会对格式错误或溢出正文抛异常；带 InvariantCulture 的 TryParse 才符合任务契约。' }
      - line: 19
        kind: security
        note: { en: 'Logging the raw URL and full exception can expose query credentials or sensitive response context.', zh: '记录原始 URL 和完整异常可能泄露查询参数中的凭据或敏感响应上下文。' }
      - line: 20
        kind: correctness
        note: { en: 'throw error resets the stack starting point; use a bare throw after any permitted boundary logging.', zh: 'throw error 会重置堆栈起点；若边界允许记录日志，随后应使用无操作数的 throw。' }
    explanation: { en: 'Use an owned or injected HttpClient, parse with decimal.TryParse and InvariantCulture, and keep logs structured and scrubbed. Let transport and cancellation exceptions propagate with throw; so their type, token, and stack survive.', zh: '应使用统一管理或注入的 HttpClient，通过 decimal.TryParse 与 InvariantCulture 解析，并让日志保持结构化且经过脱敏。传输与取消异常应通过 throw; 继续传播，以保留类型、令牌和堆栈。' }
    difficulty: advanced
    tags: [code-review, http-client, parsing, rethrow, sensitive-data]
