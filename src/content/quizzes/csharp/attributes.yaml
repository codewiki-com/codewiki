topic: csharp/attributes
items:
  - id: predict-metadata-versus-instance
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      using System;
      using System.Reflection;

      var data = typeof(Report).GetCustomAttributesData();
      Console.WriteLine($"{ProbeAttribute.Created}:{data.Count}");

      _ = typeof(Report).GetCustomAttribute<ProbeAttribute>();
      Console.WriteLine(ProbeAttribute.Created);

      [Probe]
      public sealed class Report;

      public sealed class ProbeAttribute : Attribute
      {
          public static int Created { get; private set; }
          public ProbeAttribute() => Created++;
      }
    lang: csharp
    options:
      - { text: { en: "0:1, then 1", zh: '先输出0:1，再输出1' }, correct: true }
      - { text: { en: "1:1, then 1", zh: '先输出1:1，再输出1' }, correct: false }
      - { text: { en: "0:0, then 1", zh: '先输出0:0，再输出1' }, correct: false }
      - { text: { en: 'It throws before printing.', zh: '程序在输出前抛出异常。' }, correct: false }
    explanation: { en: '`GetCustomAttributesData` sees the record without invoking the attribute constructor. `GetCustomAttribute` then creates one instance and increments the counter.', zh: '`GetCustomAttributesData`不调用特性构造函数也能看到记录；随后`GetCustomAttribute`创建一个实例，计数器才递增。' }
    difficulty: intermediate
    tags: [custom-attribute-data, instantiation, predict-output]

  - id: marker-needs-consumer
    type: mcq
    prompt: { en: 'A project defines `[Cache(60)]` and applies it to a method, but no framework component reads `CacheAttribute`. What does the attribute do?', zh: '项目定义`[Cache(60)]`并把它用于方法，但没有任何框架组件读取`CacheAttribute`。这个特性会做什么？' }
    options:
      - { text: { en: 'It stores metadata but does not cache calls by itself.', zh: '它会保存元数据，但不会自行缓存调用。' }, correct: true }
      - { text: { en: 'The CLR caches the return value for 60 seconds.', zh: 'CLR会把返回值缓存60秒。' }, correct: false }
      - { text: { en: 'The compiler generates a dictionary around the method.', zh: '编译器会在方法外生成一个字典。' }, correct: false }
      - { text: { en: 'Reflection automatically intercepts each call.', zh: '反射会自动拦截每次调用。' }, correct: false }
    explanation: { en: 'An ordinary custom attribute is declarative data. A consumer such as middleware, an interceptor, or a source generator must implement the behavior.', zh: '普通自定义特性只是声明式数据；必须由中间件、拦截器或源码生成器等消费者实现行为。' }
    difficulty: beginner
    tags: [consumer, metadata, declarative]

  - id: spotbug-field-target
    title: { en: 'Spot the bug in the property attribute', zh: '找出属性特性里的bug' }
    type: spotbug
    prompt: { en: 'Why does this property scanner report `False`?', zh: '为什么这个属性扫描器会输出`False`？' }
    code: |
      using System;
      using System.Reflection;

      var property = typeof(Customer).GetProperty(nameof(Customer.Id))!;
      Console.WriteLine(property.IsDefined(typeof(ColumnAttribute), false));

      public sealed class Customer
      {
          [field: Column]
          public string Id { get; init; } = string.Empty;
      }

      [AttributeUsage(AttributeTargets.Field)]
      public sealed class ColumnAttribute : Attribute;
    lang: csharp
    issues:
      - line: 9
        kind: correctness
        note: { en: '`field:` attaches the record to the compiler-generated backing field, while the scanner asks the `PropertyInfo`. Target the property and allow `AttributeTargets.Property`, or scan fields deliberately.', zh: '`field:`把记录附到编译器生成的幕后字段，而扫描器查询的是`PropertyInfo`。应允许并使用属性目标，或者明确扫描字段。' }
    explanation: { en: 'An auto-property and its backing field are distinct metadata entities. Reflection does not move an attribute between them.', zh: '自动属性与幕后字段是不同的元数据实体，反射不会在两者之间移动特性。' }
    difficulty: intermediate
    tags: [attribute-target, auto-properties, reflection]

  - id: legal-attribute-argument
    type: mcq
    prompt: { en: 'Which value can be used directly as a C# attribute argument?', zh: '下面哪个值可以直接用作C#特性实参？' }
    options:
      - { text: { en: '`typeof(OrderHandler)`', zh: '`typeof(OrderHandler)`' }, correct: true }
      - { text: { en: '`DateTime.Now`', zh: '`DateTime.Now`' }, correct: false }
      - { text: { en: '`new HttpClient()`', zh: '`new HttpClient()`' }, correct: false }
      - { text: { en: '`new Dictionary<string, int>()`', zh: '`new Dictionary<string, int>()`' }, correct: false }
    explanation: { en: '`System.Type` is a permitted attribute-parameter type, and `typeof(...)` is metadata-compatible. The other values require runtime object creation or evaluation.', zh: '`System.Type`是允许的特性参数类型，`typeof(...)`也能写入元数据；其他值都需要运行时求值或创建对象。' }
    difficulty: beginner
    tags: [attribute-arguments, type, compile-time]

  - id: spotbug-single-retrieval
    title: { en: 'Spot the bug in repeated attributes', zh: '找出重复特性里的bug' }
    type: spotbug
    prompt: { en: 'Find the mismatch between this attribute contract and its consumer.', zh: '找出这个特性契约与消费者之间的不一致。' }
    code: |
      using System;
      using System.Reflection;

      var tag = typeof(BillingService).GetCustomAttribute<TagAttribute>();
      Console.WriteLine(tag!.Name);

      [Tag("billing"), Tag("critical")]
      public sealed class BillingService;

      [AttributeUsage(AttributeTargets.Class, AllowMultiple = true)]
      public sealed class TagAttribute(string name) : Attribute
      {
          public string Name { get; } = name;
      }
    lang: csharp
    issues:
      - line: 4
        kind: correctness
        note: { en: '`GetCustomAttribute<TagAttribute>()` assumes at most one match, but the contract and declaration allow two; this call throws `AmbiguousMatchException`. Read the sequence and define merge semantics.', zh: '`GetCustomAttribute<TagAttribute>()`假定最多一个匹配项，但契约与声明允许两个，因此会抛出`AmbiguousMatchException`。应读取序列并定义合并语义。' }
    explanation: { en: '`AllowMultiple = true` requires consumers to handle a collection, including its ordering and conflict policy.', zh: '`AllowMultiple = true`要求消费者处理集合，并明确顺序与冲突策略。' }
    difficulty: intermediate
    tags: [allow-multiple, ambiguous-match, reflection]

  - id: review-generated-command-catalog
    title: { en: 'Review generated command catalog', zh: '审查生成的命令目录' }
    type: review
    prompt: { en: 'Review this generated command catalog before it scans application assemblies.', zh: '在这个生成的命令目录扫描应用程序集前，对它进行审查。' }
    task: { en: 'Build a catalog once at startup, preserve every direct and inherited alias, safely handle unmarked types, and keep discovery free of external side effects.', zh: '在启动时构建一次目录，保留所有直接与继承别名，安全处理未标记类型，并让发现过程没有外部副作用。' }
    code: |
      using System;
      using System.IO;
      using System.Linq;
      using System.Reflection;

      [AttributeUsage(AttributeTargets.Class, AllowMultiple = true, Inherited = true)]
      public sealed class CommandAttribute : Attribute
      {
          public string Name { get; }
          public CommandAttribute(string name)
          {
              File.AppendAllText("command-discovery.log", name + Environment.NewLine);
              Name = name;
          }
      }

      public static class CommandCatalog
      {
          public static string[] Build(Type[] handlerTypes)
          {
              return handlerTypes.Select(type =>
                  type.GetCustomAttribute<CommandAttribute>(inherit: false)!.Name).ToArray();
          }
      }
    lang: csharp
    right: { en: 'The generated code constrains the attribute to classes, gives aliases a typed representation, and centralizes discovery behind one catalog method that accepts an explicit type set.', zh: '生成代码把特性限制到类，为别名提供了带类型的表示，并把发现逻辑集中到一个接收明确类型集合的目录方法中。' }
    checklist:
      - { en: 'Run discovery with unmarked, directly marked, multiply marked, and derived handler types.', zh: '分别用未标记、直接标记、多重标记和派生处理器类型运行发现。' }
      - { en: 'Count constructor, setter, file, network, and service calls caused by metadata inspection.', zh: '统计元数据检查触发的构造函数、setter、文件、网络与服务调用。' }
      - { en: 'Define alias conflict, ordering, normalization, and duplicate rules before building the lookup table.', zh: '构建查找表前，明确别名冲突、顺序、规范化与重复规则。' }
      - { en: 'Verify that catalog construction happens once per intended assembly set and has a clear failure report.', zh: '确认目录针对预期程序集集合只构建一次，并提供清楚的失败报告。' }
    issues:
      - line: 12
        kind: security
        note: { en: 'Instance-based discovery executes attribute code that writes to the scanner process’s working directory. Inspection should not grant metadata declarations an implicit file-system side effect.', zh: '实例化发现会执行特性代码，并写入扫描进程的工作目录。元数据检查不应隐式授予声明代码文件系统副作用。' }
      - line: 22
        kind: correctness
        note: { en: 'A single-value query cannot preserve multiple aliases and `inherit: false` drops base-class aliases, contradicting both `AllowMultiple` and `Inherited` in the contract.', zh: '单值查询无法保留多个别名，`inherit: false`还会丢弃基类别名，与契约中的`AllowMultiple`和`Inherited`都冲突。' }
      - line: 22
        kind: edge-case
        note: { en: 'An unmarked type returns null, and the null-forgiving operator only hides the warning; dereferencing `Name` then throws.', zh: '未标记类型会返回null，null宽容运算符只隐藏警告，随后读取`Name`仍会抛出异常。' }
      - line: 22
        kind: performance
        note: { en: 'The query instantiates attribute objects and triggers their I/O for every match. Metadata-only discovery should read `CustomAttributeData`, validate it, and cache the resulting catalog.', zh: '查询会为每个匹配项实例化特性并触发其中的I/O。纯元数据发现应读取`CustomAttributeData`，验证后缓存目录结果。' }
    explanation: { en: 'Use metadata-only inspection during startup, collect every valid direct and inherited alias, skip or diagnose unmarked types explicitly, and keep all effects in the catalog builder rather than attribute constructors.', zh: '应在启动时使用纯元数据检查，收集所有有效的直接与继承别名，明确跳过或报告未标记类型，并把所有副作用留在目录构建器中，而不是放进特性构造函数。' }
    difficulty: advanced
    tags: [code-review, custom-attribute-data, inheritance, allow-multiple, side-effects]
