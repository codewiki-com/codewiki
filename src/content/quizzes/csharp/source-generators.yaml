topic: csharp/source-generators
items:
  - id: predict-generated-regex
    type: predict
    prompt: { en: 'What does this program print when the platform source generator is available?', zh: '平台源生成器可用时，这段程序会输出什么？' }
    code: |
      using System;
      using System.Text.RegularExpressions;

      Console.WriteLine(CodeRules.IsValid("AB123"));
      Console.WriteLine(CodeRules.IsValid("ab123"));

      public static partial class CodeRules
      {
          [GeneratedRegex("^[A-Z]{2}[0-9]{3}$", RegexOptions.CultureInvariant)]
          private static partial Regex CodePattern();

          public static bool IsValid(string value) => CodePattern().IsMatch(value);
      }
    lang: csharp
    options:
      - { text: { en: '`True`, then `False`', zh: '先输出 `True`，再输出 `False`' }, correct: true }
      - { text: { en: '`False`, then `True`', zh: '先输出 `False`，再输出 `True`' }, correct: false }
      - { text: { en: '`True`, then `True`', zh: '先输出 `True`，再输出 `True`' }, correct: false }
      - { text: { en: 'It compiles but throws on the first call.', zh: '能够编译，但第一次调用时会抛出异常。' }, correct: false }
    explanation: { en: 'The generated implementation uses the declared case-sensitive pattern. The first value has two uppercase letters and three digits; the second does not.', zh: '生成的实现使用声明的区分大小写模式。第一个值由两个大写字母和三个数字组成，第二个值不符合。' }
    difficulty: beginner
    tags: [generated-regex, partial-method, generated-code]

  - id: incremental-model-equality
    type: mcq
    prompt: { en: 'Which pipeline model gives Roslyn the clearest stable value boundary?', zh: '哪种管道模型能为 Roslyn 提供最清楚的稳定值边界？' }
    options:
      - { text: { en: 'A record containing the needed strings and Boolean options', zh: '只包含所需字符串与布尔选项的 record' }, correct: true }
      - { text: { en: 'A record containing the target `INamedTypeSymbol`', zh: '包含目标 `INamedTypeSymbol` 的 record' }, correct: false }
      - { text: { en: 'A class containing the complete `Compilation`', zh: '包含完整 `Compilation` 的 class' }, correct: false }
      - { text: { en: 'A fresh array of every syntax node in the project', zh: '每次新建并包含项目全部语法节点的数组' }, correct: false }
    explanation: { en: 'Small value-equatable data lets unchanged results stop invalidation. Symbols, compilations, syntax nodes, and reference-equal collections make reuse broader and less reliable.', zh: '小型值相等数据能让未变化的结果停止失效传播。符号、编译、语法节点和按引用比较的集合会扩大变化范围，降低复用可靠性。' }
    difficulty: intermediate
    tags: [incremental-pipeline, value-equality, caching]

  - id: spotbug-attribute-text-match
    title: { en: 'Spot the bug in the attribute filter', zh: '找出特性筛选器里的 bug' }
    type: spotbug
    prompt: { en: 'Find why this candidate filter misses valid uses and can match the wrong attribute.', zh: '找出这个候选筛选器为什么会漏掉合法用法，并可能匹配错误特性。' }
    code: |
      using System.Linq;
      using Microsoft.CodeAnalysis;
      using Microsoft.CodeAnalysis.CSharp.Syntax;

      var targets = context.SyntaxProvider.CreateSyntaxProvider(
          static (node, _) => node is ClassDeclarationSyntax declaration &&
              declaration.AttributeLists.SelectMany(list => list.Attributes)
                  .Any(attribute => attribute.Name.ToString() == "Describe"),
          static (match, _) => (ClassDeclarationSyntax)match.Node);
    lang: csharp
    issues:
      - line: 8
        lines: 2
        kind: correctness
        note: { en: 'Text comparison does not establish attribute identity and mishandles aliases, qualified names, the optional `Attribute` suffix, and unrelated same-named types.', zh: '文本比较无法确定特性身份，还会错误处理别名、限定名、可省略的 `Attribute` 后缀以及无关的同名类型。' }
    explanation: { en: 'Use `ForAttributeWithMetadataName` with the full metadata name, then extract the target symbol and attribute data from its semantic callback.', zh: '应使用带完整元数据名的 `ForAttributeWithMetadataName`，再从其语义回调中提取目标符号与特性数据。' }
    difficulty: intermediate
    tags: [attribute-matching, syntax-provider, semantic-model]

  - id: generator-output-order
    type: mcq
    prompt: { en: 'Generator A emits a type that generator B wants to inspect. What is safe for ordinary source-generator output?', zh: '生成器 A 发射一个供生成器 B 检查的类型。对于普通源生成输出，哪种做法安全？' }
    options:
      - { text: { en: 'Give both generators a shared declared input or combine the phases in one supported pipeline.', zh: '让两个生成器读取共同的声明输入，或在一个受支持的管道中合并阶段。' }, correct: true }
      - { text: { en: 'Name generator A first in the project file.', zh: '在项目文件中先列出生成器 A。' }, correct: false }
      - { text: { en: 'Add a delay before generator B reads the compilation.', zh: '让生成器 B 延迟一段时间再读取编译。' }, correct: false }
      - { text: { en: 'Use `Collect()` so generator B waits for generator A.', zh: '使用 `Collect()` 让生成器 B 等待生成器 A。' }, correct: false }
    explanation: { en: 'Ordinary generators run without a dependency order and see the same input compilation. Project order, delays, and `Collect()` do not create a cross-generator data dependency.', zh: '普通生成器没有可依赖的执行顺序，并且看到同一份输入编译。项目顺序、延迟与 `Collect()` 都不能建立跨生成器数据依赖。' }
    difficulty: advanced
    tags: [generator-order, compilation, architecture]

  - id: review-generated-route-generator
    title: { en: 'Review a generated route source generator', zh: '审查生成的路由源生成器' }
    type: review
    prompt: { en: 'Review this generated implementation before it is packaged as an analyzer.', zh: '在这个生成的实现被打包为分析器之前，对它进行审查。' }
    task: { en: 'Generate one deterministic route class per marked controller, preserve valid C# identities, avoid build-time side effects, and retain per-controller incrementality.', zh: '为每个带标记的控制器生成一份确定性路由类，保留合法 C# 身份，避免构建期副作用，并维持逐控制器增量性。' }
    code: |
      using Microsoft.CodeAnalysis;
      using Microsoft.CodeAnalysis.CSharp.Syntax;

      [Generator]
      public sealed class RouteGenerator : IIncrementalGenerator
      {
          public void Initialize(IncrementalGeneratorInitializationContext context)
          {
              var classes = context.SyntaxProvider.CreateSyntaxProvider(
                  static (node, _) => node is ClassDeclarationSyntax,
                  static (match, _) => (ClassDeclarationSyntax)match.Node)
                  .Collect();
              context.RegisterSourceOutput(context.CompilationProvider.Combine(classes),
                  static (output, pair) =>
                  {
                      foreach (var declaration in pair.Right)
                      {
                          var symbol = pair.Left.GetSemanticModel(declaration.SyntaxTree).GetDeclaredSymbol(declaration)!;
                          string route = symbol.Name.Replace("Controller", "");
                          string source = $"public static class {symbol.Name}Routes {{ public const string Path = \"/{route}\"; }}";
                          System.IO.File.AppendAllText("generator.log", source);
                          output.AddSource("Routes.g.cs", source);
                      }
                  });
          } }
    lang: csharp
    right: { en: 'The code uses an incremental generator entry point, centralizes emission in `RegisterSourceOutput`, and derives a predictable default route from a declared type name.', zh: '代码使用增量生成器入口点，把发射集中在 `RegisterSourceOutput` 中，并根据声明类型名推导出可预测的默认路由。' }
    checklist:
      - { en: 'Test aliases, same-named attributes, keyword identifiers, namespaces, nesting, generics, and two same-named controllers.', zh: '测试别名、同名特性、关键字标识符、命名空间、嵌套、泛型以及两个同名控制器。' }
      - { en: 'Edit one controller body and confirm unrelated route outputs remain cached and byte-identical.', zh: '只修改一个控制器的方法体，确认无关路由输出仍被缓存并保持逐字节相同。' }
      - { en: 'Compile all generated trees and assert diagnostic ids, severities, and source locations for invalid inputs.', zh: '编译全部生成树，并断言无效输入对应的诊断 id、严重级别与源码位置。' }
      - { en: 'Search emission for file, network, clock, random, environment, and machine-path dependencies.', zh: '检查发射过程是否依赖文件、网络、时钟、随机值、环境变量或机器路径。' }
    issues:
      - line: 12
        kind: performance
        note: { en: '`Collect()` plus `CompilationProvider` turns every syntax or compilation change into a batch regeneration instead of preserving one-controller output granularity.', zh: '`Collect()` 与 `CompilationProvider` 的组合会让每次语法或编译变化触发整批重新生成，无法保持逐控制器输出粒度。' }
      - line: 20
        lines: 2
        kind: correctness
        note: { en: 'Bare symbol names are inserted without namespace, containing-type, generic, accessibility, or identifier escaping rules, so many valid declarations produce invalid or colliding source.', zh: '代码直接插入符号短名，没有处理命名空间、包含类型、泛型、可访问性或标识符转义，因此许多合法声明会产生无效或冲突源码。' }
      - line: 22
        kind: security
        note: { en: 'The generator writes derived project source to its working directory, an undeclared build-time side effect that can disclose code and fails in read-only or remote hosts.', zh: '生成器把派生的项目源码写入工作目录，形成未声明的构建期副作用，既可能泄露代码，也会在只读或远程宿主中失败。' }
      - line: 23
        kind: edge-case
        note: { en: 'Every target uses the same hint name, so two matching classes cause duplicate-output failure instead of producing independent files.', zh: '每个目标都使用同一提示名称，因此两个匹配类会造成重复输出失败，而不是生成独立文件。' }
    explanation: { en: 'Use semantic attribute matching, project each symbol into one equatable model, emit a unique stable hint per model, encode valid source deliberately, and report located diagnostics without writing files.', zh: '应使用语义特性匹配，把每个符号投影成独立的值相等模型，以唯一稳定的提示名称发射，明确编码合法源码，并用带位置的诊断替代文件写入。' }
    difficulty: advanced
    tags: [code-review, incrementality, deterministic-output, source-emission]
