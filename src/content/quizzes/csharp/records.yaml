topic: csharp/records
items:
  - id: predict-record-equality-and-copy
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      using System;

      Price first = new("EUR", 10m);
      Price second = new("EUR", 10m);
      Price copied = first with { };

      Console.WriteLine(first == second);
      Console.WriteLine(ReferenceEquals(first, copied));

      public sealed record Price(string Currency, decimal Amount);
    lang: csharp
    options:
      - { text: { en: "True\nFalse", zh: "True\nFalse" }, correct: true }
      - { text: { en: "False\nFalse", zh: "False\nFalse" }, correct: false }
      - { text: { en: "True\nTrue", zh: "True\nTrue" }, correct: false }
      - { text: { en: "False\nTrue", zh: "False\nTrue" }, correct: false }
    explanation: { en: 'The two independently allocated records have equal member values. An empty with expression creates a distinct outer record object, so ReferenceEquals is false.', zh: '两个分别分配的记录具有相等的成员值。空的 with 表达式仍创建不同的外层记录对象，因此 ReferenceEquals 为 false。' }
    difficulty: beginner
    tags: [value-equality, with-expression, reference-identity]

  - id: predict-shallow-with-copy
    type: predict
    prompt: { en: 'What does this shallow-copy example print?', zh: '这个浅拷贝示例会输出什么？' }
    code: |
      using System;
      using System.Collections.Generic;

      Bundle original = new(["draft"]);
      Bundle copy = original with { };
      copy.Labels.Add("reviewed");

      Console.WriteLine(original.Labels.Count);
      Console.WriteLine(ReferenceEquals(original.Labels, copy.Labels));

      public sealed record Bundle(List<string> Labels);
    lang: csharp
    options:
      - { text: { en: "2\nTrue", zh: "2\nTrue" }, correct: true }
      - { text: { en: "1\nFalse", zh: "1\nFalse" }, correct: false }
      - { text: { en: "2\nFalse", zh: "2\nFalse" }, correct: false }
      - { text: { en: "1\nTrue", zh: "1\nTrue" }, correct: false }
    explanation: { en: 'with copies the Labels reference, not the list contents. Both records therefore expose the same list and observe the added element.', zh: 'with 只复制 Labels 引用，不复制列表内容。因此两个记录暴露同一个列表，也都会看到新增元素。' }
    difficulty: intermediate
    tags: [shallow-copy, mutable-reference, with-expression]

  - id: spotbug-mutated-dictionary-key
    type: spotbug
    prompt: { en: 'Find why lookup of the inserted record key is no longer reliable.', zh: '找出已插入记录键的查找不再可靠的原因。' }
    code: |
      using System;
      using System.Collections.Generic;

      SearchKey key = new("shoes") { Page = 1 };
      Dictionary<SearchKey, string> cache = new()
      {
          [key] = "result"
      };

      key.Page = 2;
      Console.WriteLine(cache.ContainsKey(key));

      public sealed record SearchKey(string Query)
      {
          public int Page { get; set; }
      }
    lang: csharp
    issues:
      - line: 10
        kind: correctness
        note: { en: 'Page participates in generated equality and hashing. Mutating it after insertion can send lookup to a different hash bucket, so the key must remain stable while stored.', zh: 'Page 参与生成的相等与哈希。插入后修改它可能让查找转到另一个哈希桶，因此键在集合中必须保持稳定。' }
    explanation: { en: 'Hash collections require residence-time hash stability. Make Page init-only and construct a new key before insertion instead of mutating a stored key.', zh: '哈希集合要求键在存放期间保持哈希稳定。应把 Page 设为 init-only，并在插入前构造新键，不要修改已存键。' }
    difficulty: intermediate
    tags: [hash-stability, dictionary-key, mutability]

  - id: record-struct-positional-properties
    type: mcq
    prompt: { en: 'Which statement about positional record structs is correct?', zh: '关于位置记录结构体，哪项说法正确？' }
    options:
      - { text: { en: 'A record struct has read-write positional properties by default; readonly record struct makes them init-only.', zh: 'record struct 的位置属性默认可读写；readonly record struct 会让它们仅能初始化。' }, correct: true }
      - { text: { en: 'Every positional record form generates init-only properties.', zh: '所有位置记录形式都会生成仅初始化属性。' }, correct: false }
      - { text: { en: 'record struct is a reference type that supports record inheritance.', zh: 'record struct 是支持记录继承的引用类型。' }, correct: false }
      - { text: { en: 'Declaring a constructor prevents default(T) from existing.', zh: '声明构造函数会阻止 default(T) 存在。' }, correct: false }
    explanation: { en: 'An ordinary positional record struct follows mutable struct property defaults. The readonly form changes generated positional properties to init-only, but both still have a zero-initialized default value.', zh: '普通位置 record struct 遵循可变结构体的属性默认行为。readonly 形式会让生成的位置属性仅能初始化，但两者仍都有全零默认值。' }
    difficulty: intermediate
    tags: [record-struct, readonly, default-value]

  - id: derived-record-equality
    type: mcq
    prompt: { en: 'Why does a base record not compare equal to a derived record with the same shared values?', zh: '为什么基记录不会与共有值相同的派生记录比较为相等？' }
    options:
      - { text: { en: 'Generated record equality includes the runtime record type through its equality contract.', zh: '生成的记录相等性会通过相等契约包含运行时记录类型。' }, correct: true }
      - { text: { en: 'Derived records always use reference equality.', zh: '派生记录始终使用引用相等性。' }, correct: false }
      - { text: { en: 'Only sealed records support value equality.', zh: '只有密封记录支持值相等性。' }, correct: false }
      - { text: { en: 'The comparison throws whenever inheritance is present.', zh: '只要存在继承，比较就会抛出异常。' }, correct: false }
    explanation: { en: 'Runtime type is part of generated record-class equality, which keeps comparisons symmetric when a derived record adds state. Shared base members alone are insufficient.', zh: '运行时类型属于生成的记录类相等契约，可在派生记录增加状态时保持比较对称。仅共有的基类成员相同还不够。' }
    difficulty: intermediate
    tags: [record-inheritance, equality-contract, symmetry]

  - id: review-generated-search-cache-key
    type: review
    title: { en: 'Review a generated search cache key', zh: '审查生成的搜索缓存键' }
    prompt: { en: 'Review this generated record against the cache-key contract.', zh: '根据缓存键契约审查这个生成的记录。' }
    task: { en: 'Build a stable cache key that isolates tenants, compares filter contents in order, normalizes the current query, requires a positive page, and stays safe in a dictionary.', zh: '构建稳定的缓存键：隔离租户；按顺序比较筛选项内容；规范化当前查询；页码必须为正；放入字典后保持安全。' }
    code: |
      using System.Collections.Generic;

      public sealed record SearchKey(
          string Query,
          List<string> Filters)
      {
          public int Page { get; set; } = 1;
          public string Normalized { get; } = Query.Trim().ToUpperInvariant();
      }

      public static class SearchCache
      {
          private static readonly Dictionary<SearchKey, string> Cache = new();
          private static readonly SearchKey Template = new("", []);

          public static string Load(string tenantId, string query, List<string> filters, int page)
          {
              SearchKey key = Template with { Query = query, Filters = filters, Page = page };
              if (Cache.TryGetValue(key, out string? hit)) return hit;
              string value = $"{tenantId}:{key.Normalized}:{filters.Count}:{page}";
              Cache[key] = value;
              return value;
          }
      }
    lang: csharp
    right: { en: 'The generated code uses a typed key instead of concatenating an opaque key string, applies invariant case conversion, and keeps cache access behind one method.', zh: '生成代码使用有类型的键，而不是拼接不透明的键字符串；它采用固定区域性大小写转换，并把缓存访问集中在一个方法中。' }
    checklist:
      - { en: 'Construct logically equal filters in separate list instances and compare the keys.', zh: '用不同列表实例构造逻辑相同的筛选项，再比较键。' }
      - { en: 'Copy the template with two queries and verify each normalized value.', zh: '用两个查询复制模板，并验证各自的规范化值。' }
      - { en: 'Vary tenant ID independently and test zero, negative, and positive pages.', zh: '独立改变租户 ID，并测试零、负数与正数页码。' }
      - { en: 'Insert a key, perform every permitted mutation, and confirm dictionary lookup.', zh: '插入键后执行每种允许的修改，并确认字典查找结果。' }
    issues:
      - line: 3
        kind: security
        note: { en: 'TenantId is absent from SearchKey, so identical requests from different tenants can collide and return data across the isolation boundary.', zh: 'SearchKey 没有 TenantId，不同租户的相同请求可能碰撞，并跨隔离边界返回数据。' }
      - line: 8
        kind: correctness
        note: { en: 'Normalized is computed for Template once, then shallow-copied. Changing Query with with does not recompute this stored property, so every copied key keeps the stale empty value.', zh: 'Normalized 只为 Template 计算一次，随后被浅拷贝。with 修改 Query 不会重新计算这个存储属性，因此每个副本都保留过期的空值。' }
      - line: 5
        kind: performance
        note: { en: 'List<string> uses reference equality here, so separately created lists with equal filter contents produce cache misses and duplicate entries.', zh: '这里的 List<string> 使用引用相等性，因此内容相同但分别创建的筛选列表会造成缓存未命中与重复条目。' }
      - line: 7
        kind: readability
        note: { en: 'The public setter makes a supposedly stable key mutable after insertion and hides the residence-time hash invariant from callers.', zh: '公开 setter 让本应稳定的键在插入后仍可变，也向调用方隐藏了存放期间的哈希不变量。' }
      - line: 16
        kind: edge-case
        note: { en: 'Load accepts blank tenant IDs and queries and nonpositive pages without defining rejection or normalization behavior.', zh: 'Load 接受空白租户 ID、空白查询与非正页码，却没有定义拒绝或规范化行为。' }
    explanation: { en: 'Put tenant and a validated positive page in immutable key state, normalize from the current query, and use a sequence-value wrapper or explicit comparer for filters. Avoid a mutable template when copied stored properties can go stale.', zh: '应把租户与验证为正的页码放入不可变键状态，根据当前查询做规范化，并为筛选项使用序列值包装或显式比较器。复制的存储属性可能过期时，不要使用可变模板。' }
    difficulty: advanced
    minutes: 10
    tags: [code-review, cache-key, shallow-copy, hash-stability]
