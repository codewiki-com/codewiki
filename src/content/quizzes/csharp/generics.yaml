topic: csharp/generics
items:
  - id: predict-generic-pick
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      using System;

      Console.WriteLine(Pick(3, 7));
      Console.WriteLine(Pick("queued", "sent"));

      static T Pick<T>(T first, T second) => first;
    lang: csharp
    options:
      - { text: { en: '3, then queued', zh: '先输出3，再输出queued' }, correct: true }
      - { text: { en: '7, then sent', zh: '先输出7，再输出sent' }, correct: false }
      - { text: { en: 'The calls require explicit type arguments.', zh: '两次调用都必须明确写出类型实参。' }, correct: false }
      - { text: { en: 'Both calls return object.', zh: '两次调用都返回object。' }, correct: false }
    explanation: { en: 'The arguments let method type inference choose int for the first call and string for the second. Pick returns its first argument while preserving that inferred type.', zh: '编译器根据实参推断出第一次调用的类型是int，第二次是string。Pick保留推断出的类型，并返回第一个实参。' }
    difficulty: beginner
    tags: [generics, method-type-inference, predict-output]

  - id: predict-static-per-constructed-type
    type: predict
    prompt: { en: 'What values are printed by these generic static fields?', zh: '这些泛型静态字段会输出什么值？' }
    code: |
      using System;

      TypeCounter<int>.Count++;
      TypeCounter<string>.Count += 2;

      Console.WriteLine(TypeCounter<int>.Count);
      Console.WriteLine(TypeCounter<string>.Count);

      static class TypeCounter<T>
      {
          public static int Count;
      }
    lang: csharp
    options:
      - { text: { en: '1, then 2', zh: '先输出1，再输出2' }, correct: true }
      - { text: { en: '3, then 3', zh: '先输出3，再输出3' }, correct: false }
      - { text: { en: '1, then 3', zh: '先输出1，再输出3' }, correct: false }
      - { text: { en: 'The second access resets the first field.', zh: '第二次访问会重置第一个字段。' }, correct: false }
    explanation: { en: 'TypeCounter<int> and TypeCounter<string> are separate closed constructed types, so each owns a separate static field.', zh: 'TypeCounter<int>与TypeCounter<string>是两个不同的封闭构造类型，因此各自拥有独立的静态字段。' }
    difficulty: intermediate
    tags: [constructed-type, static-field, runtime]

  - id: infer-from-return-type
    type: mcq
    prompt: { en: 'Can C# infer T in Create<T>() from assigning its result to Customer customer?', zh: '把Create<T>() 的结果赋给Customer customer时，C#能否据此推断T？' }
    options:
      - { text: { en: 'No. Method type inference does not use the return type; write Create<Customer>().', zh: '不能。方法类型推断不使用返回类型；应写Create<Customer>()。' }, correct: true }
      - { text: { en: 'Yes. The target variable always determines every method type argument.', zh: '能。目标变量总能确定方法的所有类型实参。' }, correct: false }
      - { text: { en: 'Only when Customer is a value type.', zh: '只有Customer是值类型时才能推断。' }, correct: false }
      - { text: { en: 'Only when T has a new() constraint.', zh: '只有T带有new() 约束时才能推断。' }, correct: false }
    explanation: { en: 'Generic method type inference uses the method arguments and related parameter types, not the destination type of the call expression. A new() constraint does not change that rule.', zh: '泛型方法类型推断使用方法实参与相关形参类型，不使用调用表达式的目标类型。new() 约束不会改变这条规则。' }
    difficulty: intermediate
    tags: [method-type-inference, return-type, constraints]

  - id: spotbug-default-sentinel
    title: { en: 'Spot the bug in the generic search', zh: '找出泛型查找里的bug' }
    type: spotbug
    prompt: { en: 'Find the two generic correctness problems in this search helper.', zh: '找出这个泛型查找辅助方法中的两个正确性问题。' }
    code: |
      using System.Collections.Generic;

      static T Find<T>(IEnumerable<T> items, T target)
      {
          foreach (T item in items)
          {
              if (item!.Equals(target))
                  return item;
          }
          return default!;
      }
    lang: csharp
    issues:
      - line: 7
        kind: edge-case
        note: { en: 'The null-forgiving operator only suppresses a warning; a null item still throws when Equals is called. Use EqualityComparer<T>.Default.', zh: '空包容运算符只会抑制警告；item为null时调用Equals仍会抛出异常。应使用EqualityComparer<T>.Default。' }
      - line: 10
        kind: correctness
        note: { en: 'default(T) may be a valid element, so the caller cannot distinguish a miss from a found default value.', zh: 'default(T) 可能是合法元素，因此调用方无法区分未找到与找到了默认值。' }
    explanation: { en: 'Use the generic equality comparer and return a separate success signal, index, or result type. The null-forgiving operator changes analysis, not runtime behavior.', zh: '应使用泛型相等比较器，并通过独立的成功标记、索引或结果类型报告查找状态。空包容运算符只改变分析，不改变运行时行为。' }
    difficulty: intermediate
    tags: [default-value, equality-comparer, nullable, code-review]

  - id: variance-direction
    type: mcq
    prompt: { en: 'Given Dog : Animal, which assignment is valid because of generic variance?', zh: '已知Dog派生自Animal，哪项赋值会因泛型变体而成立？' }
    options:
      - { text: { en: 'IEnumerable<Animal> animals = dogs;', zh: 'IEnumerable<Animal> animals = dogs;' }, correct: true }
      - { text: { en: 'List<Animal> animals = dogList;', zh: 'List<Animal> animals = dogList;' }, correct: false }
      - { text: { en: 'IEnumerable<object> values = integers;', zh: 'IEnumerable<object> values = integers;' }, correct: false }
      - { text: { en: 'List<object> values = strings;', zh: 'List<object> values = strings;' }, correct: false }
    explanation: { en: 'IEnumerable<out T> is covariant and Dog-to-Animal is an implicit reference conversion. Generic classes are invariant, and int-to-object requires boxing rather than a reference conversion.', zh: 'IEnumerable<out T>是协变接口，而且Dog到Animal存在隐式引用转换。泛型类不变；int到object需要装箱，不是引用转换。' }
    difficulty: intermediate
    tags: [variance, covariance, invariance]

  - id: review-generated-token-deduplicator
    title: { en: 'Review generated token deduplicator', zh: '审查生成的令牌去重器' }
    type: review
    prompt: { en: 'Review this generated generic token deduplicator before it handles production credentials.', zh: '在这段生成的泛型令牌去重方法处理生产凭据前，对它进行审查。' }
    task: { en: 'Deduplicate caller-supplied API tokens, preserve first occurrence, use the supplied comparer, accept a one-pass sequence, reject null input, and never log token values.', zh: '对调用方提供的API令牌去重，保留第一次出现的项目，使用传入的比较器，支持只能遍历一次的序列，拒绝null输入，并且绝不记录令牌值。' }
    code: |
      using System;
      using System.Collections.Generic;
      using System.Linq;

      public static class TokenTools
      {
          public static IReadOnlyList<T> Unique<T>(
              IEnumerable<T> source,
              IEqualityComparer<T>? comparer = null)
          {
              var result = new List<T>();

              for (int index = 0; index < source.Count(); index++)
              {
                  T item = source.ElementAt(index);
                  Console.WriteLine($"accepted: {item}");

                  if (!result.Contains(item))
                      result.Add(item);
              }

              return result;
          }
      }
    lang: csharp
    issues:
      - line: 8
        kind: edge-case
        note: { en: 'The method does not reject a null source at its boundary, so failure occurs later through an incidental NullReferenceException.', zh: '方法没有在边界拒绝null source，之后只会偶然抛出NullReferenceException。' }
      - line: 13
        kind: performance
        note: { en: 'Count and ElementAt repeatedly enumerate the source; a one-pass sequence may fail or change, and a linked sequence can make the loop quadratic.', zh: 'Count与ElementAt会反复遍历source；只能遍历一次的序列可能失败或变化，链式序列还可能让循环变成二次复杂度。' }
      - line: 16
        kind: security
        note: { en: 'Logging item calls ToString on each credential and can disclose API tokens to application logs.', zh: '记录item会对每个凭据调用ToString，可能把API令牌泄露到应用日志。' }
      - line: 18
        kind: correctness
        note: { en: 'List.Contains ignores the supplied comparer and always uses EqualityComparer<T>.Default, so caller-defined token equality is lost.', zh: 'List.Contains忽略传入的comparer，只使用EqualityComparer<T>.Default，因此调用方定义的令牌相等规则没有生效。' }
    right: { en: 'The signature preserves the element type without object casts, and the method builds a fresh result in first-seen order.', zh: '该签名无需object强制转换就能保留元素类型，而且方法会按首次出现顺序构造新的结果。' }
    checklist:
      - { en: 'Validate source and comparer defaults at the method boundary.', zh: '在方法边界验证source，并处理comparer默认值。' }
      - { en: 'Enumerate an IEnumerable<T> no more than the contract permits.', zh: '遍历IEnumerable<T>的次数不能超过契约允许范围。' }
      - { en: 'Use one equality policy consistently for membership and deduplication.', zh: '成员判断与去重必须始终使用同一套相等规则。' }
      - { en: 'Keep secrets and arbitrary ToString output out of logs.', zh: '不要把秘密或任意ToString输出写入日志。' }
    explanation: { en: 'Validate source, create a HashSet<T> with the supplied or default comparer, and add each value to the result only when the set accepts it. Do not log credential values.', zh: '应先验证source，再用传入或默认比较器创建HashSet<T>，只有集合接受某个值时才把它加入结果。不要记录凭据值。' }
    difficulty: advanced
    minutes: 8
    tags: [code-review, generics, equality-comparer, security, enumeration]
