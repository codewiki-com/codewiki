topic: csharp/linq
items:
  - id: predict-deferred-versus-snapshot
    type: predict
    prompt: { en: 'What does this program print after the source list changes?', zh: '源列表变化后，这段程序会输出什么？' }
    code: |
      using System;
      using System.Collections.Generic;
      using System.Linq;

      var values = new List<int> { 1, 2 };
      IEnumerable<int> query = values.Where(value => value > 1);
      int[] snapshot = query.ToArray();

      values.Add(3);

      Console.WriteLine(string.Join(",", query));
      Console.WriteLine(string.Join(",", snapshot));
    lang: csharp
    options:
      - { text: { en: "2,3 followed by 2", zh: '先输出 2,3，再输出 2' }, correct: true }
      - { text: { en: "2 followed by 2", zh: '先输出 2，再输出 2' }, correct: false }
      - { text: { en: "2,3 followed by 2,3", zh: '先输出 2,3，再输出 2,3' }, correct: false }
      - { text: { en: 'It throws because the list changed.', zh: '因为列表变化而抛出异常。' }, correct: false }
    explanation: { en: 'The deferred query reads the list when it is enumerated and sees 3. The array was materialized before the addition, so its membership stays unchanged.', zh: '延迟查询在枚举时读取列表，因此能看到 3。数组在新增前已经物化，成员不会随源列表变化。' }
    difficulty: beginner
    tags: [deferred-execution, materialization, snapshot]

  - id: predict-second-orderby
    type: predict
    prompt: { en: 'Which name order does this program print?', zh: '这段程序会按什么名称顺序输出？' }
    code: |
      using System;
      using System.Linq;

      Row[] rows =
      [
          new("A", "Red", 70),
          new("B", "Blue", 80),
          new("C", "Red", 90)
      ];

      var sorted = rows
          .OrderBy(row => row.Team)
          .OrderByDescending(row => row.Score);

      Console.WriteLine(string.Join(",", sorted.Select(row => row.Name)));

      public sealed record Row(string Name, string Team, int Score);
    lang: csharp
    options:
      - { text: { en: 'C,B,A', zh: 'C,B,A' }, correct: true }
      - { text: { en: 'B,C,A', zh: 'B,C,A' }, correct: false }
      - { text: { en: 'A,C,B', zh: 'A,C,B' }, correct: false }
      - { text: { en: 'C,A,B', zh: 'C,A,B' }, correct: false }
    explanation: { en: 'The second OrderByDescending establishes a new primary ordering, so score decides the result. ThenByDescending would preserve team as the primary key.', zh: '第二个 OrderByDescending 会建立新的主排序，所以结果由分数决定。若要保留团队为主键，应使用 ThenByDescending。' }
    difficulty: intermediate
    tags: [ordering, orderby, thenby]

  - id: spotbug-enumerates-generator-twice
    title: { en: 'Spot the bug in report enumeration', zh: '找出报告枚举里的 bug' }
    type: spotbug
    prompt: { en: 'Find the execution bug in this generated report code.', zh: '找出这段生成报表代码中的执行错误。' }
    code: |
      using System;
      using System.Collections.Generic;
      using System.Linq;

      IEnumerable<int> orderIds = ReadOrderIds();

      Console.WriteLine($"count: {orderIds.Count()}");
      Console.WriteLine($"ids: {string.Join(",", orderIds)}");

      static IEnumerable<int> ReadOrderIds()
      {
          foreach (int id in new[] { 101, 102 })
          {
              Console.WriteLine($"read {id}");
              yield return id;
          }
      }
    lang: csharp
    issues:
      - line: 7
        lines: 2
        kind: correctness
        note: { en: 'Count and string.Join each enumerate the deferred generator, so every read and its side effect happen twice.', zh: 'Count 与 string.Join 会分别枚举延迟生成器，因此每次读取及其副作用都会发生两遍。' }
    explanation: { en: 'Materialize once when the report needs one stable set, then use the concrete collection count and contents. A genuinely streaming API should instead have a single consumer.', zh: '报表需要一组稳定数据时，应先物化一次，再读取具体集合的数量与内容。真正的流式 API 则应设计成只有一个消费者。' }
    difficulty: intermediate
    tags: [multiple-enumeration, iterator, side-effects]

  - id: choose-single-for-unique-result
    type: mcq
    prompt: { en: 'A validated email must identify exactly one account. Which operator best enforces that result cardinality?', zh: '经过验证的邮箱必须准确标识一个账户。哪个运算符最适合强制这一结果基数？' }
    options:
      - { text: { en: 'Single', zh: 'Single' }, correct: true }
      - { text: { en: 'FirstOrDefault', zh: 'FirstOrDefault' }, correct: false }
      - { text: { en: 'Last', zh: 'Last' }, correct: false }
      - { text: { en: 'Take(1)', zh: 'Take(1)' }, correct: false }
    explanation: { en: 'Single returns the one element and throws when the query is empty or duplicated, matching the stated invariant. First or Take(1) would hide duplicates.', zh: 'Single 在恰好一项时返回该元素，空结果或重复结果都会抛出异常，与既定不变量一致。First 或 Take(1) 会隐藏重复数据。' }
    difficulty: beginner
    tags: [single, cardinality, invariants]

  - id: choose-asenumerable-meaning
    type: mcq
    prompt: { en: 'What does AsEnumerable do in an IQueryable pipeline?', zh: 'AsEnumerable 在 IQueryable 管道中有什么作用？' }
    options:
      - { text: { en: 'It makes later operators bind to Enumerable without materializing by itself.', zh: '它让后续运算符绑定到 Enumerable，但本身不执行物化。' }, correct: true }
      - { text: { en: 'It immediately loads all rows into a List.', zh: '它会立即把所有行加载到 List。' }, correct: false }
      - { text: { en: 'It makes every C# method translatable by the provider.', zh: '它会让提供程序能够翻译所有 C# 方法。' }, correct: false }
      - { text: { en: 'It turns an in-memory source into a database query.', zh: '它会把内存数据源变成数据库查询。' }, correct: false }
    explanation: { en: 'AsEnumerable changes the compile-time extension-method boundary for later calls. Enumeration is still deferred until a consumer requests results.', zh: 'AsEnumerable 改变的是后续调用在编译期绑定的扩展方法边界。查询仍会延迟到消费者请求结果时才枚举。' }
    difficulty: advanced
    tags: [iqueryable, enumerable, translation-boundary]

  - id: review-generated-customer-totals
    type: review
    title: { en: 'Review a generated customer totals query', zh: '审查生成的客户汇总查询' }
    prompt: { en: 'Review this LINQ helper against the stated reporting contract.', zh: '根据既定报表契约审查这个 LINQ 辅助方法。' }
    task: { en: 'Enumerate caller data once, reject input beyond 100,000 orders, include signed refunds, group customer names case-insensitively, and return a materialized top ten ordered by total descending then name.', zh: '调用方数据只能枚举一次；超过 100,000 笔订单时拒绝处理；汇总包含负数退款；客户名称按大小写不敏感规则分组；返回已物化的前十项，先按总额降序，再按名称排序。' }
    code: |
      using System;
      using System.Collections.Generic;
      using System.Linq;

      public sealed record Order(string Customer, decimal Amount);
      public sealed record CustomerTotal(string Customer, decimal Amount);

      public static class Reports
      {
          public static IReadOnlyList<CustomerTotal> Get(IEnumerable<Order> orders)
          {
              if (!orders.Any()) return [];

              return orders
                  .Where(order => order.Amount > 0m)
                  .GroupBy(order => order.Customer)
                  .Select(group => new CustomerTotal(
                      group.Key,
                      group.Sum(order => order.Amount)))
                  .OrderByDescending(total => total.Amount)
                  .ThenBy(total => total.Customer, StringComparer.OrdinalIgnoreCase)
                  .Take(10)
                  .ToList();
          }
      }
    lang: csharp
    right: { en: 'The generated code projects into a typed result, materializes before returning, limits output to ten entries, and correctly uses ThenBy for deterministic secondary ordering.', zh: '生成代码投影到有类型的结果，返回前完成物化，把输出限制为十项，并正确使用 ThenBy 建立确定的次级顺序。' }
    checklist:
      - { en: 'Use a source that fails on a second enumeration and count every MoveNext call.', zh: '使用第二次枚举就失败的数据源，并统计每次 MoveNext 调用。' }
      - { en: 'Test refunds, empty input, case variants, equal totals, and more than 100,000 orders.', zh: '测试退款、空输入、大小写变体、总额相同以及超过 100,000 笔订单的情况。' }
      - { en: 'Assert the complete ordered result rather than only its count.', zh: '断言完整的有序结果，而不只是结果数量。' }
      - { en: 'Verify that the returned list no longer depends on the caller source.', zh: '验证返回列表不再依赖调用方数据源。' }
    issues:
      - line: 10
        kind: readability
        note: { en: 'Get hides that the method aggregates and materializes a ranked report; a name such as BuildTopCustomerTotals states its behavior.', zh: 'Get 隐藏了方法会执行聚合、物化并建立排名；BuildTopCustomerTotals 之类的名称更能表达行为。' }
      - line: 12
        kind: performance
        note: { en: 'Any enumerates the source once before the query enumerates it again, violating the single-pass contract and repeating upstream work.', zh: 'Any 会先枚举一次数据源，随后查询再次枚举，违反单遍契约并重复上游工作。' }
      - line: 15
        kind: correctness
        note: { en: 'Filtering to positive amounts discards refunds, so customer totals can be overstated.', zh: '只保留正数金额会丢弃退款，导致客户总额被高估。' }
      - line: 16
        kind: edge-case
        note: { en: 'The default string comparer splits case variants of one customer into separate groups.', zh: '默认字符串比较器会把同一客户的大小写变体拆成不同分组。' }
      - line: 16
        kind: security
        note: { en: 'GroupBy buffers unbounded caller input before Take limits output, so the required 100,000-order resource limit is absent.', zh: 'GroupBy 会在 Take 限制输出前缓冲无界的调用方输入，缺少任务要求的 100,000 笔资源上限。' }
    explanation: { en: 'Use one bounded enumeration that detects the 100,001st item, then group with StringComparer.OrdinalIgnoreCase without dropping signed amounts. Sort with OrderByDescending followed by ThenBy and materialize once.', zh: '应使用一次有界枚举，在读取第 100,001 项时拒绝处理；随后以 StringComparer.OrdinalIgnoreCase 分组，并保留负数金额。排序使用 OrderByDescending 与 ThenBy，最后只物化一次。' }
    difficulty: advanced
    tags: [code-review, deferred-execution, grouping, resource-limits, ordering]
