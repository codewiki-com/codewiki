topic: csharp/events
items:
  - id: predict-remove-one-duplicate-handler
    type: predict
    prompt: { en: 'What does this program print after the same handler is added twice and removed once?', zh: '同一个处理器添加两次、移除一次后，这段程序会输出什么？' }
    code: |
      using System;

      var signal = new Signal();
      EventHandler handler = (_, _) => Console.WriteLine("called");

      signal.Changed += handler;
      signal.Changed += handler;
      signal.Changed -= handler;
      signal.Raise();

      public sealed class Signal
      {
          public event EventHandler? Changed;
          public void Raise() => Changed?.Invoke(this, EventArgs.Empty);
      }
    lang: csharp
    options:
      - { text: { en: 'called', zh: 'called' }, correct: true }
      - { text: { en: 'called twice', zh: '输出两次 called' }, correct: false }
      - { text: { en: 'No output', zh: '没有输出' }, correct: false }
      - { text: { en: 'It throws because duplicate subscriptions are forbidden.', zh: '抛出异常，因为不允许重复订阅。' }, correct: false }
    explanation: { en: 'The invocation list permits duplicates, and -= removes the last matching entry. One registration remains, so the handler runs once.', zh: '调用列表允许重复项，-= 会移除最后一个匹配项。因此还剩一次注册，处理器会运行一次。' }
    difficulty: intermediate
    tags: [invocation-list, unsubscribe, delegate-identity]

  - id: predict-handler-exception-order
    type: predict
    prompt: { en: 'Which lines does this program print?', zh: '这段程序会输出哪些行？' }
    code: |
      using System;

      var signal = new Signal();
      signal.Changed += (_, _) => Console.WriteLine("first");
      signal.Changed += (_, _) => throw new Exception("failed");
      signal.Changed += (_, _) => Console.WriteLine("third");

      try { signal.Raise(); }
      catch (Exception) { Console.WriteLine("caught"); }

      public sealed class Signal
      {
          public event EventHandler? Changed;
          public void Raise() => Changed?.Invoke(this, EventArgs.Empty);
      }
    lang: csharp
    options:
      - { text: { en: 'first, then caught', zh: '先输出 first，再输出 caught' }, correct: true }
      - { text: { en: 'first, third, then caught', zh: '依次输出 first、third、caught' }, correct: false }
      - { text: { en: 'caught only', zh: '只输出 caught' }, correct: false }
      - { text: { en: 'first only', zh: '只输出 first' }, correct: false }
    explanation: { en: 'Handlers run in invocation-list order. The second handler throws, so the third is skipped and the outer catch prints caught.', zh: '处理器按调用列表顺序运行。第二个处理器抛出异常，第三个会被跳过，外层 catch 随后输出 caught。' }
    difficulty: intermediate
    tags: [exceptions, invocation-order, multicast-delegate]

  - id: spotbug-new-lambda-unsubscribe
    type: spotbug
    prompt: { en: 'Find why this dashboard keeps receiving updates after Disconnect runs.', zh: '找出为什么调用 Disconnect 后，这个面板仍会收到更新。' }
    code: |
      public sealed class Dashboard
      {
          private readonly PriceFeed _feed;

          public Dashboard(PriceFeed feed)
          {
              _feed = feed;
              _feed.Changed += (_, price) => Show(price);
          }

          public void Disconnect()
          {
              _feed.Changed -= (_, price) => Show(price);
          }

          private void Show(decimal price) { }
      }
    lang: csharp
    issues:
      - line: 13
        kind: correctness
        note: { en: 'This is a new lambda expression and doesn''t identify the delegate instance added on line 8, so the original handler remains subscribed.', zh: '这里是新的 lambda 表达式，无法标识第 8 行添加的委托实例，因此原处理器仍留在订阅列表中。' }
    explanation: { en: 'Store one EventHandler<decimal> in a field, or subscribe and unsubscribe the same named method. Then raise the event after Disconnect in a test.', zh: '应把同一个 EventHandler<decimal> 保存在字段中，或者添加和移除同一个命名方法；测试还要在 Disconnect 后再次触发事件。' }
    difficulty: intermediate
    tags: [lambda, unsubscribe, lifetime]

  - id: event-raising-access
    type: mcq
    prompt: { en: 'Given a public field-like event, what can ordinary code outside its declaring type do?', zh: '对于公开的字段式事件，声明类型之外的普通代码可以做什么？' }
    options:
      - { text: { en: 'Add and remove handlers with += and -=.', zh: '使用 += 和 -= 添加、移除处理器。' }, correct: true }
      - { text: { en: 'Invoke the event with arbitrary arguments.', zh: '使用任意参数调用该事件。' }, correct: false }
      - { text: { en: 'Assign null to clear every subscriber.', zh: '赋值 null，清空所有订阅者。' }, correct: false }
      - { text: { en: 'Replace the invocation list with another delegate.', zh: '用另一个委托替换调用列表。' }, correct: false }
    explanation: { en: 'The event member exposes subscription operations outside the declaring type, not delegate assignment or invocation. The publisher retains control over when notification occurs.', zh: '在声明类型之外，事件成员只公开订阅操作，不公开委托赋值或调用；发布者仍控制通知何时发生。' }
    difficulty: beginner
    tags: [encapsulation, event-keyword]

  - id: review-generated-price-notification
    type: review
    prompt: { en: 'Review this generated event code before the feed and dashboard are used in a long-running process.', zh: '在价格源和面板用于长期运行的进程前，审查这段生成的事件代码。' }
    task: { en: 'Notify the dashboard after each price change, finish persistence before Publish returns, allow zero subscribers, and stop notifications when the dashboard is disposed.', zh: '每次价格变化后通知面板，在 Publish 返回前完成持久化，允许零个订阅者，并在面板释放后停止通知。' }
    code: |
      using System; using System.Threading.Tasks;
      public sealed record PriceChangedEventArgs(decimal Price) : EventArgs;
      public sealed class PriceFeed
      {
          public event EventHandler<PriceChangedEventArgs>? PriceChanged;
          public void Publish(decimal price) =>
              PriceChanged!.Invoke(this, new PriceChangedEventArgs(price));
      }
      public sealed class Dashboard : IDisposable
      {
          private readonly PriceFeed _feed;
          public Dashboard(PriceFeed feed)
          {
              _feed = feed;
              _feed.PriceChanged += async (_, e) =>
              {
                  await SaveAsync(e.Price);
                  Console.WriteLine($"saved: {e.Price}");
              };
          }
          public void Dispose() =>
              _feed.PriceChanged -= async (_, e) => await SaveAsync(e.Price);
          private async Task SaveAsync(decimal price) =>
              await Task.Delay(10);
      }
    lang: csharp
    right: { en: 'The generated code uses a typed EventArgs record and keeps event ownership inside PriceFeed. Dashboard also exposes a visible cleanup boundary through IDisposable.', zh: '生成代码使用了类型明确的 EventArgs 记录，并把事件所有权留在 PriceFeed 内；Dashboard 也通过 IDisposable 暴露了清晰的清理边界。' }
    checklist:
      - { en: 'Raise with zero, one, and several subscribers, including a handler that throws.', zh: '分别以零个、一个和多个订阅者触发事件，并包含一个会抛异常的处理器。' }
      - { en: 'Prove that the publisher observes asynchronous completion and failure before returning.', zh: '证明发布者在返回前能够观察异步完成与失败。' }
      - { en: 'Raise after disposal and confirm that the original delegate is absent.', zh: '释放后再次触发事件，确认原委托已经移除。' }
      - { en: 'Compare publisher and subscriber lifetimes and inspect captured targets.', zh: '比较发布者与订阅者的生命周期，并检查委托捕获的目标。' }
    issues:
      - line: 7
        kind: edge-case
        note: { en: 'The null-forgiving operator doesn''t handle a feed with zero subscribers; Invoke throws NullReferenceException.', zh: '空包容运算符不能处理零订阅者；此时 Invoke 会抛出 NullReferenceException。' }
      - line: 15
        kind: correctness
        note: { en: 'The async lambda converts to async void because EventHandler returns void, so Publish can''t wait for SaveAsync or receive its asynchronous exception.', zh: 'EventHandler 返回 void，因此这个异步 lambda 会转换为 async void；Publish 无法等待 SaveAsync，也收不到其异步异常。' }
      - line: 21
        kind: performance
        note: { en: 'Dispose creates a different lambda and removes nothing. A long-lived feed can retain each disposed Dashboard through the original captured handler.', zh: 'Dispose 创建了另一个 lambda，因而没有移除原处理器；长期存活的价格源会通过原捕获处理器保留每个已释放面板。' }
    explanation: { en: 'Use ?.Invoke for an ordinary synchronous event, or replace the contract with an awaitable delegate when persistence must finish first. Store one named or field-backed handler and remove that exact delegate in Dispose.', zh: '普通同步事件应使用 ?.Invoke；若必须先完成持久化，则应换成可等待的委托契约。把处理器保存为命名方法或字段，并在 Dispose 中移除同一个委托。' }
    difficulty: advanced
    tags: [code-review, async-void, delegate-identity, retention]
