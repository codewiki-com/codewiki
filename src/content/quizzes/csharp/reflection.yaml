topic: csharp/reflection
items:
  - id: predict-declared-and-runtime-type
    type: predict
    prompt: { en: 'What two type names does this program print?', zh: '这段程序会输出哪两个类型名称？' }
    code: |
      using System;

      IMessage message = new AlertMessage();

      Console.WriteLine(typeof(IMessage).Name);
      Console.WriteLine(message.GetType().Name);

      public interface IMessage { }
      public sealed class AlertMessage : IMessage { }
    lang: csharp
    options:
      - { text: { en: 'IMessage, then AlertMessage', zh: '先输出 IMessage，再输出 AlertMessage' }, correct: true }
      - { text: { en: 'AlertMessage, then IMessage', zh: '先输出 AlertMessage，再输出 IMessage' }, correct: false }
      - { text: { en: 'IMessage twice', zh: '两次都输出 IMessage' }, correct: false }
      - { text: { en: 'AlertMessage twice', zh: '两次都输出 AlertMessage' }, correct: false }
    explanation: { en: '`typeof(IMessage)` names the compile-time interface, while `GetType()` returns the object''s actual runtime type.', zh: '`typeof(IMessage)` 表示编译期接口，`GetType()` 则返回对象的实际运行时类型。' }
    difficulty: beginner
    tags: [type, runtime-type, typeof]

  - id: predict-declared-only-properties
    type: predict
    prompt: { en: 'How many properties does this lookup print?', zh: '这次查找会输出多少个属性？' }
    code: |
      using System;
      using System.Reflection;

      BindingFlags flags = BindingFlags.Public
          | BindingFlags.Instance
          | BindingFlags.DeclaredOnly;

      Console.WriteLine(typeof(Invoice).GetProperties(flags).Length);

      public class Document
      {
          public string Code { get; init; } = "";
      }

      public sealed class Invoice : Document
      {
          public decimal Total { get; init; }
      }
    lang: csharp
    options:
      - { text: { en: '1', zh: '1' }, correct: true }
      - { text: { en: '0', zh: '0' }, correct: false }
      - { text: { en: '2', zh: '2' }, correct: false }
      - { text: { en: '3', zh: '3' }, correct: false }
    explanation: { en: '`DeclaredOnly` excludes the inherited `Code` property, leaving only `Total` from `Invoice`.', zh: '`DeclaredOnly` 排除继承的 `Code` 属性，只留下 `Invoice` 自己声明的 `Total`。' }
    difficulty: beginner
    tags: [binding-flags, declared-only, inheritance]

  - id: spotbug-name-only-overload
    type: spotbug
    prompt: { en: 'Find why method resolution fails after the second overload is added.', zh: '找出增加第二个重载后方法解析失败的原因。' }
    code: |
      using System;
      using System.Reflection;

      Type type = typeof(Formatter);
      MethodInfo format = type.GetMethod("Format")!;
      Console.WriteLine(format.Invoke(new Formatter(), [12m]));

      public sealed class Formatter
      {
          public string Format(decimal value) => $"{value:F2}";
          public string Format(decimal value, string unit) => $"{value:F2} {unit}";
      }
    lang: csharp
    issues:
      - line: 5
        kind: correctness
        note: { en: 'The name does not identify one overload, so `GetMethod` can throw `AmbiguousMatchException`; supply the parameter type array.', zh: '名称不能唯一标识重载，因此 `GetMethod` 可能抛出 `AmbiguousMatchException`；应提供形参类型数组。' }
    explanation: { en: 'Resolve with `GetMethod("Format", [typeof(decimal)])` and handle a missing result explicitly instead of applying the null-forgiving operator.', zh: '应使用 `GetMethod("Format", [typeof(decimal)])` 解析，并明确处理空结果，不要用 null 包容运算符掩盖它。' }
    difficulty: intermediate
    tags: [method-info, overload-resolution, ambiguous-match]

  - id: public-setter-contract
    type: mcq
    prompt: { en: 'A mapper may write only properties with public setters. Which test expresses that contract?', zh: '映射器只允许写入具有公开 setter 的属性，哪个检查表达了这项契约？' }
    options:
      - { text: { en: '`property.SetMethod?.IsPublic == true`', zh: '`property.SetMethod?.IsPublic == true`' }, correct: true }
      - { text: { en: '`property.CanWrite`', zh: '`property.CanWrite`' }, correct: false }
      - { text: { en: '`property.GetMethod is not null`', zh: '`property.GetMethod is not null`' }, correct: false }
      - { text: { en: '`property.MemberType == MemberTypes.Property`', zh: '`property.MemberType == MemberTypes.Property`' }, correct: false }
    explanation: { en: '`CanWrite` only proves that some setter exists. Inspecting `SetMethod.IsPublic` checks the visibility required by this mapper.', zh: '`CanWrite` 只证明存在某个 setter；检查 `SetMethod.IsPublic` 才能验证映射器要求的可见性。' }
    difficulty: intermediate
    tags: [property-info, setter, visibility]

  - id: metadata-without-attribute-construction
    type: mcq
    prompt: { en: 'A scanner needs recorded attribute arguments but must not instantiate the attribute. Which API fits?', zh: '扫描器需要读取特性中记录的实参，但不能实例化特性，应使用哪个 API？' }
    options:
      - { text: { en: '`CustomAttributeData.GetCustomAttributes(member)`', zh: '`CustomAttributeData.GetCustomAttributes(member)`' }, correct: true }
      - { text: { en: '`member.GetCustomAttributes()`', zh: '`member.GetCustomAttributes()`' }, correct: false }
      - { text: { en: '`member.GetCustomAttribute<Attribute>()`', zh: '`member.GetCustomAttribute<Attribute>()`' }, correct: false }
      - { text: { en: '`Activator.CreateInstance(attributeType)`', zh: '`Activator.CreateInstance(attributeType)`' }, correct: false }
    explanation: { en: '`CustomAttributeData` exposes constructor and named argument descriptors from metadata without constructing the attribute object.', zh: '`CustomAttributeData` 从元数据公开构造实参和命名实参描述，不会构造特性对象。' }
    difficulty: intermediate
    tags: [custom-attribute-data, metadata, side-effects]

  - id: review-generated-command-router
    title: { en: 'Review a generated reflection command router', zh: '审查生成的反射命令路由器' }
    type: review
    prompt: { en: 'Review this generated router before it accepts commands from an HTTP endpoint.', zh: '在这个生成的路由器接收 HTTP 端点命令前，对它进行审查。' }
    task: { en: 'Dispatch allowlisted one-argument commands, resolve exact signatures once, parse values by an explicit contract, preserve target exceptions, and bound registry ownership.', zh: '分派白名单内的单参数命令，只解析一次精确签名，按明确契约解析值，保留目标异常，并限制注册表的所有权与大小。' }
    code: |
      using System;
      using System.Reflection;

      public static class CommandRouter
      {
          public static object? Dispatch(object target, string methodName, string rawValue)
          {
              Type type = target.GetType();
              MethodInfo method = type.GetMethod(methodName,
                  BindingFlags.Public | BindingFlags.NonPublic | BindingFlags.Instance)!;
              Type parameterType = method.GetParameters()[0].ParameterType;
              object? argument = Convert.ChangeType(rawValue, parameterType);

              try
              {
                  return method.Invoke(target, [argument]);
              }
              catch (Exception error)
              {
                  Console.WriteLine(error.Message);
                  return null;
              }
          }
      }
    lang: csharp
    right: { en: 'The generated code keeps reflection in one helper, uses the target''s runtime type, and marks the invocation boundary with an explicit catch block.', zh: '生成代码把反射集中在一个辅助方法中，使用目标的运行时类型，并用明确的 catch 块标出了调用边界。' }
    checklist:
      - { en: 'Test unknown, duplicated, inherited, overloaded, non-public, and differently cased command names.', zh: '测试未知、重复、继承、重载、非公开和大小写不同的命令名。' }
      - { en: 'Test nullable, enum, date, empty, invalid, and culture-sensitive argument values.', zh: '测试可空、枚举、日期、空值、无效值和受区域设置影响的实参。' }
      - { en: 'Separate resolution, conversion, binding, and target exceptions while preserving the original target stack.', zh: '区分解析、转换、绑定和目标异常，并保留目标异常的原始堆栈。' }
      - { en: 'Build a bounded immutable registry at startup and validate its behavior in trimmed publish output.', zh: '启动时构建有界不可变注册表，并在裁剪发布产物中验证其行为。' }
    issues:
      - line: 9
        lines: 2
        kind: security
        note: { en: 'Caller-controlled names can select non-public instance methods, exposing internal operations outside an application allowlist.', zh: '调用方控制的名称可以选择非公开实例方法，把应用白名单外的内部操作暴露出来。' }
      - line: 9
        kind: correctness
        note: { en: 'Name-only lookup is ambiguous for overloads, and `!` hides the missing-member path instead of producing a stable resolution error.', zh: '只按名称查找会在重载时产生歧义，`!` 还掩盖成员缺失路径，无法提供稳定解析错误。' }
      - line: 11
        lines: 2
        kind: edge-case
        note: { en: 'The code assumes exactly one parameter and delegates nullable, enum, date, and culture policy to `Convert.ChangeType`, which does not define that protocol.', zh: '代码假定恰好有一个参数，并把可空、枚举、日期和区域策略交给 `Convert.ChangeType`，但该 API 并未定义这套协议。' }
      - line: 18
        lines: 4
        kind: readability
        note: { en: 'One broad catch collapses infrastructure and target failures, logs only an outer message, and turns every failure into an ambiguous `null` result.', zh: '一个宽泛 catch 混合了基础设施与目标失败，只记录外层消息，并把所有失败都变成含义不明的 `null`。' }
      - line: 9
        kind: performance
        note: { en: 'Every dispatch repeats member lookup instead of using a startup-validated, bounded registry keyed by the external command identifier.', zh: '每次分派都重复查找成员，没有使用按外部命令标识建立、在启动时验证且有界的注册表。' }
    explanation: { en: 'Map external command ids to prevalidated delegates or exact `MethodInfo` entries, parse through per-command rules, and unwrap only `TargetInvocationException` while preserving its inner stack.', zh: '应把外部命令 id 映射到预验证的委托或精确 `MethodInfo`，按每条命令的规则解析，并只解包 `TargetInvocationException`，同时保留内部异常堆栈。' }
    difficulty: advanced
    tags: [code-review, command-router, allowlist, overload-resolution, exception-boundary]
