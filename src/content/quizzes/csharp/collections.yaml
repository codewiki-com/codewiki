topic: csharp/collections
items:
  - id: predict-case-insensitive-dictionary
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      using System;
      using System.Collections.Generic;

      var stock = new Dictionary<string, int>(
          StringComparer.OrdinalIgnoreCase)
      {
          ["BK-1"] = 5
      };

      bool added = stock.TryAdd("bk-1", 9);
      Console.WriteLine($"{added}, {stock["BK-1"]}");
    lang: csharp
    options:
      - { text: { en: 'False, 5', zh: 'False, 5' }, correct: true }
      - { text: { en: 'True, 9', zh: 'True, 9' }, correct: false }
      - { text: { en: 'False, 9', zh: 'False, 9' }, correct: false }
      - { text: { en: 'It throws ArgumentException.', zh: '抛出 ArgumentException。' }, correct: false }
    explanation: { en: 'The comparer treats the two spellings as one key. TryAdd reports the duplicate with false and leaves the existing value unchanged.', zh: '比较器把两种写法视为同一个键。TryAdd 用 false 报告重复，并保留已有值。' }
    difficulty: beginner
    tags: [dictionary, equality-comparer, try-add]

  - id: predict-view-versus-copy
    type: predict
    prompt: { en: 'What counts are printed after the source list changes?', zh: '源列表变化后会输出哪两个计数？' }
    code: |
      using System;
      using System.Collections.Generic;

      var source = new List<string> { "Book" };
      IReadOnlyList<string> view = source.AsReadOnly();
      string[] copy = source.ToArray();

      source.Add("Pen");
      Console.WriteLine($"{view.Count}, {copy.Length}");
    lang: csharp
    options:
      - { text: { en: '2, 1', zh: '2, 1' }, correct: true }
      - { text: { en: '1, 1', zh: '1, 1' }, correct: false }
      - { text: { en: '2, 2', zh: '2, 2' }, correct: false }
      - { text: { en: 'It throws because the view is read-only.', zh: '因为视图只读而抛出异常。' }, correct: false }
    explanation: { en: 'AsReadOnly creates a wrapper over the same list, so it observes the added item. ToArray creates a separate container snapshot whose length stays one.', zh: 'AsReadOnly 创建的是同一列表上的包装器，因此能看到新增元素。ToArray 创建独立的容器快照，长度仍为 1。' }
    difficulty: intermediate
    tags: [read-only-view, snapshot, ownership]

  - id: spotbug-remove-during-foreach
    title: { en: 'Spot the bug in stock cleanup', zh: '找出库存清理里的 bug' }
    type: spotbug
    prompt: { en: 'Find the collection bug in this stock cleanup.', zh: '找出这段库存清理代码中的集合错误。' }
    code: |
      using System.Collections.Generic;

      var stock = new List<int> { 4, 0, 7, 0 };

      foreach (int quantity in stock)
      {
          if (quantity == 0)
          {
              stock.Remove(quantity);
          }
      }
    lang: csharp
    issues:
      - line: 9
        kind: correctness
        note: { en: 'Removing from the list structurally modifies it while its enumerator is active, so a later MoveNext throws InvalidOperationException.', zh: '枚举器仍在使用时删除列表元素会产生结构修改，后续 MoveNext 会抛出 InvalidOperationException。' }
    explanation: { en: 'Use stock.RemoveAll(quantity => quantity == 0), or collect changes separately and apply them after enumeration.', zh: '应使用 stock.RemoveAll(quantity => quantity == 0)，或者先单独收集修改，再在遍历结束后应用。' }
    difficulty: beginner
    tags: [list, enumeration, mutation]

  - id: choose-queue-for-arrival-order
    type: mcq
    prompt: { en: 'Which collection best expresses processing restock requests in arrival order?', zh: '哪种集合最适合表达按到达顺序处理补货请求？' }
    options:
      - { text: { en: 'Queue<RestockRequest>', zh: 'Queue<RestockRequest>' }, correct: true }
      - { text: { en: 'Stack<RestockRequest>', zh: 'Stack<RestockRequest>' }, correct: false }
      - { text: { en: 'HashSet<RestockRequest>', zh: 'HashSet<RestockRequest>' }, correct: false }
      - { text: { en: 'SortedSet<RestockRequest>', zh: 'SortedSet<RestockRequest>' }, correct: false }
    explanation: { en: 'Queue<T> exposes first-in-first-out operations directly. The other choices express reverse order, uniqueness, or comparer order instead of arrival order.', zh: 'Queue<T> 直接提供先进先出操作。其余选项表达的是反向顺序、唯一性或比较器顺序，并非到达顺序。' }
    difficulty: beginner
    tags: [queue, fifo, collection-choice]

  - id: hash-key-stability
    type: mcq
    prompt: { en: 'Which property must hold while an object is a Dictionary key?', zh: '对象作为 Dictionary 键期间必须满足哪项条件？' }
    options:
      - { text: { en: 'Data used by equality and hashing must remain stable.', zh: '相等性与哈希使用的数据必须保持稳定。' }, correct: true }
      - { text: { en: 'Every key must return a globally unique hash code.', zh: '每个键都必须返回全局唯一的哈希码。' }, correct: false }
      - { text: { en: 'The key must be a reference type.', zh: '键必须是引用类型。' }, correct: false }
      - { text: { en: 'Equals may disagree with the supplied comparer.', zh: 'Equals 可以与传入的比较器不一致。' }, correct: false }
    explanation: { en: 'A changed hash can make an existing key unreachable in its old bucket. Hash collisions are allowed, and both value and reference types can be valid keys.', zh: '哈希变化后，已有键可能无法再从原桶中找到。哈希碰撞是允许的，值类型与引用类型都可以成为有效键。' }
    difficulty: intermediate
    tags: [dictionary, hash-code, equality]

  - id: review-generated-product-catalog
    title: { en: 'Review generated product catalog', zh: '审查生成的产品目录' }
    type: review
    prompt: { en: 'Review this generated product catalog before it is shared by request handlers.', zh: '在多个请求处理器共享这个生成的商品目录前，对它进行审查。' }
    task: { en: 'Build a case-insensitive catalog for caller-supplied SKUs, cap it at 1,000 entries, load each logical SKU at most once under concurrency, and return a stable immutable snapshot sorted by SKU.', zh: '为调用方提供的 SKU 构建不区分大小写的目录，把容量限制为 1,000 项，在并发下每个逻辑 SKU 最多加载一次，并返回按 SKU 排序的稳定不可变快照。' }
    code: |
      using System.Collections.Generic;

      public sealed record Product(string Sku, string Name);

      public sealed class ProductCatalog
      {
          private readonly Dictionary<string, Product> _bySku = new();

          public Product Get(string sku)
          {
              if (!_bySku.ContainsKey(sku))
              {
                  _bySku[sku] = LoadProduct(sku);
              }
              return _bySku[sku];
          }

          public IReadOnlyCollection<Product> Snapshot() => _bySku.Values;

          private static Product LoadProduct(string sku) => new(sku, "loaded");
      }
    lang: csharp
    right: { en: 'The generated code keeps storage private, uses a typed Product record, and isolates loading behind one method instead of exposing dictionary mutation to callers.', zh: '生成代码把存储保持为私有状态，使用类型明确的 Product 记录，并把加载集中在一个方法后面，没有向调用方暴露字典修改。' }
    checklist:
      - { en: 'Race several callers using case variants of the same SKU and count loader executions.', zh: '让多个调用方并发使用同一 SKU 的大小写变体，并统计加载器执行次数。' }
      - { en: 'Send more than 1,000 distinct untrusted keys and verify the defined rejection or eviction policy.', zh: '发送超过 1,000 个不同的不可信键，验证既定的拒绝或淘汰策略。' }
      - { en: 'Mutate the catalog after taking a snapshot and verify its content and order stay unchanged.', zh: '取得快照后修改目录，验证快照内容与顺序保持不变。' }
      - { en: 'Profile the hot lookup path and confirm that each request performs only the required lookup.', zh: '分析高频查找路径，确认每次请求只执行必要的查找。' }
    issues:
      - line: 7
        kind: correctness
        note: { en: 'The default Dictionary is case-sensitive and unsafe for concurrent reads mixed with writes, so it violates both identity and concurrency requirements.', zh: '默认 Dictionary 区分大小写，而且并发读取与写入并不安全，因此同时违反身份与并发要求。' }
      - line: 9
        kind: readability
        note: { en: 'The name Get hides that the method can perform a load and mutate shared state; a name such as GetOrLoad makes the side effect visible.', zh: 'Get 这个名称隐藏了方法可能执行加载并修改共享状态；GetOrLoad 等名称能明确表达副作用。' }
      - line: 11
        kind: performance
        note: { en: 'ContainsKey followed by the indexer repeats hash lookup on both the hit path and the final return path.', zh: 'ContainsKey 后再使用索引器，会在命中路径与最终返回路径中重复执行哈希查找。' }
      - line: 13
        kind: security
        note: { en: 'Every distinct caller-supplied key is retained with no 1,000-entry bound, allowing untrusted input to grow process memory indefinitely.', zh: '每个不同的调用方输入键都会被无限保留，没有 1,000 项上限，因此不可信输入可以持续增加进程内存。' }
      - line: 18
        kind: edge-case
        note: { en: 'Values is a live, unsorted view over mutable storage, not the stable immutable snapshot required by the task.', zh: 'Values 是可变存储上的实时未排序视图，不是任务要求的稳定不可变快照。' }
    explanation: { en: 'Choose a concurrency design with an explicit ordinal-ignore-case comparer, a bounded admission or eviction policy, and a repeatable loader whose call count is tested. Materialize values in SKU order into an immutable collection before returning them.', zh: '应选择带有明确 ordinal 忽略大小写比较器的并发设计，定义有界准入或淘汰策略，并让加载器可重复执行且对调用次数进行测试。返回前按 SKU 顺序把值物化为不可变集合。' }
    difficulty: advanced
    tags: [code-review, dictionary, concurrency, bounded-cache, immutable-snapshot]
