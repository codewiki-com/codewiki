topic: csharp/fundamentals
items:
  - id: predict-integer-division
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      using System;

      int completed = 5;
      int total = 2;
      double ratio = completed / total;

      Console.WriteLine(ratio);
    lang: csharp
    options:
      - { text: { en: '2', zh: '2' }, correct: true }
      - { text: { en: '2.5', zh: '2.5' }, correct: false }
      - { text: { en: '2.0 followed by 5', zh: '先输出 2.0，再输出 5' }, correct: false }
      - { text: { en: 'It does not compile because ratio is double.', zh: '无法编译，因为 ratio 是 double。' }, correct: false }
    explanation: { en: 'Both operands are int, so division produces the int value 2 before that result is converted to double. Cast an operand before division to preserve the fraction.', zh: '两个操作数都是 int，所以除法先产生整数 2，再把结果转换成 double。要保留小数，应在除法前转换一个操作数。' }
    difficulty: beginner
    tags: [expressions, integer-division, conversions]

  - id: predict-short-circuit
    type: predict
    prompt: { en: 'Which lines does this program print?', zh: '这段程序会输出哪些行？' }
    code: |
      using System;

      bool Check()
      {
          Console.WriteLine("checked");
          return true;
      }

      bool ready = true;
      Console.WriteLine(ready || Check());
    lang: csharp
    options:
      - { text: { en: 'True only', zh: '只输出 True' }, correct: true }
      - { text: { en: 'checked, then True', zh: '先输出 checked，再输出 True' }, correct: false }
      - { text: { en: 'False only', zh: '只输出 False' }, correct: false }
    explanation: { en: 'The left operand of || is already true, so short-circuit evaluation skips Check(). Console.WriteLine receives true.', zh: '|| 的左操作数已经为 true，因此短路求值会跳过 Check()，Console.WriteLine 收到 true。' }
    difficulty: beginner
    tags: [short-circuit, control-flow, side-effects]

  - id: spotbug-array-loop-bound
    title: { en: 'Spot the bug in the array sum', zh: '找出数组求和里的 bug' }
    type: spotbug
    prompt: { en: 'Find the boundary error in this array loop.', zh: '找出这个数组循环中的边界错误。' }
    code: |
      static int Sum(int[] values)
      {
          int total = 0;
          for (int index = 0; index <= values.Length; index++)
          {
              total += values[index];
          }
          return total;
      }
    lang: csharp
    issues:
      - line: 4
        kind: edge-case
        note: { en: 'The <= condition admits index == values.Length, which is one past the last valid index and also fails immediately for an empty array.', zh: '<= 条件允许 index 等于 values.Length，这比最后一个有效索引多 1；数组为空时也会立即失败。' }
    explanation: { en: 'Use index < values.Length, or use foreach when the code needs every element and not the index itself.', zh: '应使用 index < values.Length；如果代码只需遍历所有元素而不需要索引，则可以使用 foreach。' }
    difficulty: beginner
    tags: [loops, arrays, boundaries]

  - id: var-is-static
    type: mcq
    prompt: { en: 'What does var mean in var amount = 12.5m;?', zh: 'var amount = 12.5m; 中的 var 表示什么？' }
    options:
      - { text: { en: 'The compiler infers decimal, and amount keeps that static type.', zh: '编译器推断出 decimal，amount 会保持这个静态类型。' }, correct: true }
      - { text: { en: 'amount can later hold a value of any type.', zh: 'amount 之后可以保存任意类型的值。' }, correct: false }
      - { text: { en: 'The runtime chooses amount’s type on every assignment.', zh: '运行时会在每次赋值时选择 amount 的类型。' }, correct: false }
      - { text: { en: 'amount has the runtime type object.', zh: 'amount 的运行时类型是 object。' }, correct: false }
    explanation: { en: 'var asks the compiler to infer a type from the initializer; it does not weaken static typing. The m suffix makes the initializer a decimal.', zh: 'var 让编译器根据初始化表达式推断类型，并不会削弱静态类型。m 后缀使初始化值成为 decimal。' }
    difficulty: beginner
    tags: [var, type-inference, static-types]

  - id: review-generated-order-summary
    title: { en: 'Review generated order summary', zh: '审查生成的订单汇总' }
    type: review
    prompt: { en: 'Review this generated order helper before it handles customer-controlled quantities.', zh: '在这个生成的订单辅助类处理客户可控的数量前，对它进行审查。' }
    task: { en: 'Accept an array of quantity strings, ignore malformed or nonpositive values, return an exact total without overflow, and load a customer name at most once.', zh: '接收数量字符串数组，忽略格式错误或非正数，在不溢出的情况下返回准确合计，并且最多加载一次客户名称。' }
    code: |
      using System;

      public static class OrderSummary
      {
          public static int CountUnits(string[] values)
          {
              int total = 0;
              for (int index = 0; index <= values.Length; index++)
              {
                  int quantity = int.Parse(values[index]);
                  if (quantity < 0) continue;
                  total += quantity;
              }
              return total;
          }

          public static string CustomerName(Func<string?> load)
          {
              return load() is null ? "guest" : load()!;
          }
      }
    lang: csharp
    right: { en: 'The generated code separates quantity aggregation from name lookup, uses descriptive method names, and keeps accumulator state local to CountUnits.', zh: '生成代码把数量聚合与名称读取分开，方法名称清楚，并把累加状态限制在 CountUnits 内部。' }
    checklist:
      - { en: 'Exercise empty, one-item, malformed, zero, negative, maximum, and combined-maximum inputs.', zh: '测试空数组、单项、格式错误、零、负数、最大值和组合最大值。' }
      - { en: 'Trace every index against the collection length before evaluating the element access.', zh: '在执行元素访问前，逐个检查索引与集合长度的关系。' }
      - { en: 'Require explicit parse-failure, range, and overflow behavior at the method boundary.', zh: '要求方法边界明确规定解析失败、范围和溢出行为。' }
      - { en: 'Count calls to delegates and methods that can return changing values or cause side effects.', zh: '统计可能返回变化值或产生副作用的委托与方法调用次数。' }
    issues:
      - line: 8
        kind: edge-case
        note: { en: 'The <= bound accesses values[values.Length], so every input eventually throws and an empty array fails on the first iteration.', zh: '<= 边界会访问 values[values.Length]，因此任何输入最终都会抛出异常，空数组还会在第一轮失败。' }
      - line: 10
        kind: correctness
        note: { en: 'int.Parse throws for malformed text instead of implementing the task’s instruction to ignore it; TryParse makes that branch explicit.', zh: 'int.Parse 会对格式错误文本抛出异常，没有实现任务要求的忽略行为；TryParse 可以明确表达该分支。' }
      - line: 12
        kind: security
        note: { en: 'Customer-controlled positive values can overflow the int accumulator and wrap when overflow checking is disabled, corrupting the returned total.', zh: '客户可控的正数可能使 int 累加器溢出；关闭溢出检查时结果会回绕，破坏返回的合计。' }
      - line: 19
        kind: performance
        note: { en: 'The delegate runs twice for a non-null result; duplicate I/O wastes work and can return a different value on the second call.', zh: '委托在结果非 null 时会执行两次；重复 I/O 浪费工作，第二次调用还可能返回不同值。' }
    explanation: { en: 'Use a strict < loop bound or foreach, TryParse and reject values <= 0, aggregate in a checked wide type, and store load() in one local before testing it. Boundary tests should fix the exact failure policy.', zh: '应使用严格的 < 循环边界或 foreach，通过 TryParse 拒绝小于等于 0 的值，在 checked 的宽类型中累加，并把 load() 的一次调用存入局部变量后再检查。边界测试应固定具体失败策略。' }
    difficulty: intermediate
    tags: [code-review, control-flow, parsing, overflow, side-effects]
