topic: csharp/span-memory
items:
  - id: predict-shared-array-slice
    type: predict
    prompt: { en: 'What does this program print after writing through the slice?', zh: '通过切片写入后，这段程序会输出什么？' }
    code: |
      using System;

      int[] values = [10, 20, 30, 40];
      Span<int> middle = values.AsSpan(1, 2);
      middle[0] += 5;
      middle[1] = values[0];

      Console.WriteLine(string.Join(",", values));
      Console.WriteLine(string.Join(",", middle.ToArray()));
    lang: csharp
    options:
      - { text: { en: "10,25,10,40\n25,10", zh: "10,25,10,40\n25,10" }, correct: true }
      - { text: { en: "10,20,30,40\n25,10", zh: "10,20,30,40\n25,10" }, correct: false }
      - { text: { en: "10,25,30,40\n25,10", zh: "10,25,30,40\n25,10" }, correct: false }
      - { text: { en: 'The first assignment throws because slices are read-only.', zh: '第一次赋值就抛错，因为切片是只读的。' }, correct: false }
    explanation: { en: 'A span slice aliases the original array. Writes through middle update elements 1 and 2 of values; ToArray copies only when formatting the final view.', zh: 'span 切片与原数组共享存储。通过 middle 写入会更新 values 的第 1、2 个元素；最后用于显示的 ToArray 才执行复制。' }
    difficulty: beginner
    tags: [span, slicing, aliasing]

  - id: predict-readonly-span-owner
    type: predict
    prompt: { en: 'What does the read-only view print after the variable is rebound?', zh: '变量重新绑定后，只读视图会输出什么？' }
    code: |
      using System;

      string text = "abc:def";
      ReadOnlySpan<char> prefix = text.AsSpan(0, 3);
      text = "xyz";

      Console.WriteLine(prefix.ToString());
      Console.WriteLine(text);
    lang: csharp
    options:
      - { text: { en: "abc\nxyz", zh: "abc\nxyz" }, correct: true }
      - { text: { en: "xyz\nxyz", zh: "xyz\nxyz" }, correct: false }
      - { text: { en: "abc\nabc:def", zh: "abc\nabc:def" }, correct: false }
      - { text: { en: 'The view becomes empty when text is rebound.', zh: 'text 重新绑定后，视图会变为空。' }, correct: false }
    explanation: { en: 'Reassigning text changes that variable, not the string object referenced by prefix. The span still views the original immutable string until the span leaves its safe lifetime.', zh: '重新给 text 赋值只改变该变量，不会改变 prefix 引用的字符串对象。span 在安全生命周期结束前仍指向原来的不可变字符串。' }
    difficulty: intermediate
    tags: [readonly-span, lifetime, string]

  - id: spotbug-returned-pooled-memory
    title: { en: 'Spot the bug in pooled memory', zh: '找出池化内存里的 bug' }
    type: spotbug
    prompt: { en: 'Find the lifetime bug in this pooled-memory helper.', zh: '找出这个池化内存辅助方法中的生命周期错误。' }
    code: |
      using System;
      using System.Buffers;

      static ReadOnlyMemory<byte> RentHeader()
      {
          byte[] buffer = ArrayPool<byte>.Shared.Rent(3);
          try
          {
              buffer[0] = 72;
              buffer[1] = 68;
              buffer[2] = 82;
              return buffer.AsMemory(0, 3);
          }
          finally
          {
              ArrayPool<byte>.Shared.Return(buffer);
          }
      }
    lang: csharp
    issues:
      - line: 16
        kind: correctness
        note: { en: 'The finally block returns the array before the caller can consume the returned memory. A later renter may overwrite the same storage.', zh: 'finally 在调用方使用返回的 memory 之前就归还数组；下一位租用者可能覆盖同一存储。' }
    explanation: { en: 'Memory<T> is storable, but it does not own or extend the lifetime of a pooled array. Consume inside the rental scope, return an owner that the caller disposes, or return an independent copy.', zh: 'Memory<T> 可以存储，但不会拥有池化数组，也不会延长其生命周期。应在租期内消费、返回由调用方释放的所有者，或返回独立副本。' }
    difficulty: intermediate
    tags: [memory, array-pool, ownership, lifetime]

  - id: choose-view-for-async-retention
    type: mcq
    prompt: { en: 'A method stores caller data, awaits I/O, then reads the data. Which parameter best expresses that contract?', zh: '某方法保存调用方数据，等待 I/O 后再读取。哪个参数最能表达该契约？' }
    options:
      - { text: { en: '`ReadOnlyMemory<byte>` with a documented retention period', zh: '带有保留期限说明的 `ReadOnlyMemory<byte>`' }, correct: true }
      - { text: { en: '`ReadOnlySpan<byte>` kept in a class field', zh: '保存在类字段中的 `ReadOnlySpan<byte>`' }, correct: false }
      - { text: { en: '`Span<byte>` captured by the async continuation', zh: '被异步延续捕获的 `Span<byte>`' }, correct: false }
      - { text: { en: '`byte*` because pointers provide automatic ownership', zh: '`byte*`，因为指针会自动提供所有权' }, correct: false }
    explanation: { en: 'ReadOnlyMemory<byte> is storable and can cross await while denying writes through the provided view. The API must still define how long it retains caller-owned storage.', zh: 'ReadOnlyMemory<byte> 可以存储并跨越 await，同时禁止通过所提供的视图写入。API 仍必须说明会把调用方存储保留多久。' }
    difficulty: intermediate
    tags: [memory, async, api-design]

  - id: review-generated-pooled-frame-reader
    type: review
    title: { en: 'Review a generated pooled frame reader', zh: '审查生成的池化帧读取器' }
    prompt: { en: 'Review this generated helper against the buffer-lifetime contract.', zh: '根据缓冲区生命周期契约审查这个生成的辅助方法。' }
    task: { en: 'Fill a rented buffer asynchronously, expose exactly the initialized bytes, prevent stale-data disclosure, and keep the result valid until its consumer finishes.', zh: '异步填充租用缓冲区，只暴露已初始化字节，防止陈旧数据泄漏，并让结果在消费者完成前保持有效。' }
    code: |
      using System;
      using System.Buffers;
      using System.Threading.Tasks;

      public static class FrameReader
      {
          public static async Task<ReadOnlyMemory<byte>> ReadAsync(
              int requested,
              Func<Memory<byte>, Task<int>> fill)
          {
              byte[] buffer = ArrayPool<byte>.Shared.Rent(requested);
              try
              {
                  int written = await fill(buffer);
                  Memory<byte> result = buffer;
                  return result;
              }
              finally
              {
                  ArrayPool<byte>.Shared.Return(buffer);
              }
          }
      }
    lang: csharp
    right: { en: 'The code uses ArrayPool<byte> instead of allocating a fresh maximum-size array, passes Memory<byte> across the asynchronous fill, and protects the return path with finally.', zh: '代码使用 ArrayPool<byte>，没有每次分配新的最大尺寸数组；它用 Memory<byte> 跨越异步填充，并用 finally 保护归还路径。' }
    checklist:
      - { en: 'Make fill return 0, requested, a negative value, and a value above requested.', zh: '让 fill 分别返回 0、requested、负数和大于 requested 的值。' }
      - { en: 'Compare the requested length, rented capacity, and returned memory length.', zh: '比较请求长度、租用容量与返回 memory 的长度。' }
      - { en: 'Force another renter to reuse the array before reading the result.', zh: '在读取结果前，强制下一位租用者复用该数组。' }
      - { en: 'Seed bytes beyond written and verify that no caller can observe them.', zh: '预置 written 之后的字节，并验证调用方无法观察这些内容。' }
    issues:
      - line: 7
        kind: readability
        note: { en: 'Returning bare ReadOnlyMemory<byte> gives the caller no owner to keep alive or dispose, so the signature cannot express the promised pooled lease.', zh: '只返回 ReadOnlyMemory<byte>，调用方没有可保活或释放的所有者，因此签名无法表达承诺的池化租期。' }
      - line: 14
        kind: edge-case
        note: { en: 'The fill result is not checked for a negative value or a value beyond the requested region, so the valid-length contract is undefined.', zh: '代码没有检查 fill 结果是否为负数或超出请求区域，因此有效长度契约没有定义。' }
      - line: 15
        kind: security
        note: { en: 'The result covers the rented capacity instead of buffer.AsMemory(0, written), exposing uninitialized bytes that may contain data from a previous renter.', zh: '结果覆盖整个租用容量，而不是 buffer.AsMemory(0, written)，可能暴露前一位租用者留下的未初始化字节。' }
      - line: 20
        kind: correctness
        note: { en: 'The array is returned before the task result is consumed. The returned memory aliases storage that the pool may immediately hand to another caller.', zh: '数组在任务结果被消费前就已归还；返回的 memory 与池可能立即交给其他调用方的存储共享别名。' }
    explanation: { en: 'Keep consumption inside the rental scope, or return a disposable owner whose Memory is sliced to written and whose disposal returns the array. Validate requested and written, and clear sensitive data according to policy.', zh: '应在租期内完成消费，或返回可释放的所有者：其 Memory 切到 written，释放时再归还数组。还要验证 requested 与 written，并按策略清除敏感数据。' }
    difficulty: advanced
    minutes: 10
    tags: [code-review, memory, array-pool, ownership]
