topic: csharp/data-types
items:
  - id: predict-copy-semantics
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      using System;
      using System.Collections.Generic;

      var firstPoint = new Point(2);
      var secondPoint = firstPoint;
      secondPoint.X = 8;

      var firstList = new List<int> { 2 };
      var secondList = firstList;
      secondList[0] = 8;

      Console.WriteLine($"{firstPoint.X}, {firstList[0]}");

      public struct Point
      {
          public Point(int x) => X = x;
          public int X { get; set; }
      }
    lang: csharp
    options:
      - { text: { en: '2, 8', zh: '2, 8' }, correct: true }
      - { text: { en: '8, 8', zh: '8, 8' }, correct: false }
      - { text: { en: '2, 2', zh: '2, 2' }, correct: false }
      - { text: { en: '8, 2', zh: '8, 2' }, correct: false }
    explanation: { en: 'Assigning the struct copies its value, so firstPoint stays unchanged. Assigning List<int> copies a reference, so both variables observe the changed element.', zh: '结构体赋值复制值，因此 firstPoint 不变。List<int> 赋值复制引用，所以两个变量都能看到修改后的元素。' }
    difficulty: beginner
    tags: [value-types, reference-types, copying]

  - id: predict-nullable-boxing
    type: predict
    prompt: { en: 'What does this program print when a nullable value is boxed?', zh: '可空值装箱后，这段程序会输出什么？' }
    code: |
      using System;

      int? count = null;
      object? boxed = count;
      Console.WriteLine(boxed is null);

      count = 7;
      boxed = count;
      Console.WriteLine(boxed.GetType().Name);
    lang: csharp
    options:
      - { text: { en: 'True, then Int32', zh: '先输出 True，再输出 Int32' }, correct: true }
      - { text: { en: 'True, then Nullable`1', zh: '先输出 True，再输出 Nullable`1' }, correct: false }
      - { text: { en: 'False, then Int32', zh: '先输出 False，再输出 Int32' }, correct: false }
    explanation: { en: 'A nullable value with HasValue false boxes to a null reference. With a value, it boxes the underlying int, so the runtime type is Int32.', zh: 'HasValue 为 false 的可空值装箱后是空引用；存在值时会装箱底层 int，因此运行时类型是 Int32。' }
    difficulty: intermediate
    tags: [nullable-value-types, boxing]

  - id: spotbug-intermediate-overflow
    type: spotbug
    prompt: { en: 'Find the overflow bug in this order-total calculation.', zh: '找出这个订单合计计算中的溢出错误。' }
    code: |
      static long TotalCents(int quantity, int unitCents)
      {
          return quantity * unitCents;
      }
    lang: csharp
    issues:
      - line: 3
        kind: correctness
        note: { en: 'Both operands are int, so multiplication can overflow before the damaged result is converted to long.', zh: '两个操作数都是 int，乘法可能先溢出，随后才把已经错误的结果转换为 long。' }
    explanation: { en: 'Widen before multiplying and use a checked context when overflow must be rejected: checked((long)quantity * unitCents).', zh: '应在乘法前扩大类型，并在必须拒绝溢出时使用 checked 上下文：checked((long)quantity * unitCents)。' }
    difficulty: beginner
    tags: [numeric-conversions, overflow, checked]

  - id: nullable-reference-runtime
    type: mcq
    prompt: { en: 'What runtime guarantee does string? add compared with string?', zh: '与 string 相比，string? 增加了什么运行时保证？' }
    options:
      - { text: { en: 'None; it expresses nullable intent for compiler analysis.', zh: '没有；它为编译器分析表达可空意图。' }, correct: true }
      - { text: { en: 'It inserts a null check at every member access.', zh: '它会在每次成员访问时插入空值检查。' }, correct: false }
      - { text: { en: 'It wraps the reference in Nullable<string>.', zh: '它会用 Nullable<string> 包装引用。' }, correct: false }
      - { text: { en: 'It prevents reflection from assigning null.', zh: '它会阻止反射赋入 null。' }, correct: false }
    explanation: { en: 'Nullable reference annotations guide warnings and null-state flow analysis. string and string? use the same runtime reference type, so validation is still needed at boundaries.', zh: '可空引用注解用于警告和空状态流分析。string 与 string? 使用相同的运行时引用类型，因此边界处仍需验证。' }
    difficulty: beginner
    tags: [nullable-reference-types, null-state-analysis]

  - id: review-generated-invoice-importer
    type: review
    prompt: { en: 'Review this generated invoice importer before it handles customer-controlled input.', zh: '在这个生成的发票导入器处理客户输入前，对它进行审查。' }
    task: { en: 'Parse invariant decimal unit prices, require a quantity, produce an exact checked total in cents, and return totals without object boxing.', zh: '按固定区域格式解析十进制单价，要求数量存在，生成精确且检查溢出的分单位合计，并在返回合计时避免 object 装箱。' }
    code: |
      using System;
      using System.Collections;
      using System.Collections.Generic;
      public static class InvoiceImporter
      {
          public static object TotalCents(string? unitPrice, int? quantity)
          {
              double price = double.Parse(unitPrice!);
              int cents = (int)(price * 100);
              int total = unchecked(cents * quantity!.Value);
              return total;
          }
          public static ArrayList BuildTotals(
              IEnumerable<(string? Price, int? Quantity)> lines)
          {
              var totals = new ArrayList();
              foreach (var line in lines)
                  totals.Add(TotalCents(line.Price, line.Quantity));
              return totals;
          }
      }
    lang: csharp
    right: { en: 'The generated code keeps parsing and multiplication in one small function, and the tuple fields give the two inputs meaningful names.', zh: '生成代码把解析与乘法集中在一个小函数中，元组字段也为两个输入提供了有意义的名称。' }
    checklist:
      - { en: 'Test null, malformed, negative, fractional-cent, and out-of-range inputs.', zh: '测试 null、格式错误、负数、不足一分和超范围输入。' }
      - { en: 'Trace the type and overflow behavior of every arithmetic intermediate.', zh: '跟踪每个算术中间值的类型与溢出行为。' }
      - { en: 'Require an explicit culture, decimal-scale, and rounding or rejection policy.', zh: '要求明确区域性、小数位数以及舍入或拒绝策略。' }
      - { en: 'Inspect object and nongeneric collection boundaries for boxing.', zh: '检查 object 与非泛型集合边界是否发生装箱。' }
    issues:
      - line: 8
        kind: edge-case
        note: { en: 'The null-forgiving operator suppresses a warning but does not validate missing text; Parse then throws instead of returning a controlled rejection.', zh: '空包容运算符只抑制警告，不会验证缺失文本；Parse 会抛出异常，而不是产生受控的拒绝结果。' }
      - line: 9
        kind: correctness
        note: { en: 'Parsing through double and truncating after multiplication can lose decimal cents, and the code never states a scale or rounding policy.', zh: '通过 double 解析并在乘法后截断可能丢失十进制分值，而且代码没有规定小数位数或舍入策略。' }
      - line: 10
        kind: security
        note: { en: 'Customer-controlled multiplication is explicitly unchecked, so a large total can wrap to a smaller or negative int.', zh: '客户可控的乘法被显式设为 unchecked，因此大额合计可能回绕成更小或负的 int。' }
      - line: 11
        kind: performance
        note: { en: 'Returning int as object boxes every total; ArrayList keeps that object-based path for the whole batch.', zh: '把 int 作为 object 返回会装箱每个合计；ArrayList 让整批数据都沿用这条基于 object 的路径。' }
    explanation: { en: 'Validate both inputs, parse decimal with invariant culture, enforce scale, convert and multiply in a checked wide integer, and return List<long>. Tests should establish the exact rejection policy.', zh: '应验证两个输入，使用固定区域格式解析 decimal，约束小数位数，在 checked 的宽整数中转换并相乘，再返回 List<long>。测试要证明具体的拒绝策略。' }
    difficulty: advanced
    tags: [code-review, decimal, nullability, overflow, boxing]
