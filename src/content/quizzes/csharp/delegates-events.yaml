topic: csharp/delegates-events
items:
  - id: predict-remove-one-multicast-entry
    type: predict
    prompt: { en: 'What does this program print after one duplicate handler is removed?', zh: '重复处理器移除一次后，这段程序会输出什么？' }
    code: |
      using System;

      Action write = () => Console.Write("W");
      Action handlers = write;
      handlers += write;
      handlers -= write;
      handlers();
    lang: csharp
    options:
      - { text: { en: 'W', zh: 'W' }, correct: true }
      - { text: { en: 'WW', zh: 'WW' }, correct: false }
      - { text: { en: 'No output', zh: '没有输出' }, correct: false }
      - { text: { en: 'It throws because duplicate entries are invalid.', zh: '抛出异常，因为调用列表不允许重复项。' }, correct: false }
    explanation: { en: '`-=` removes the last matching invocation-list entry. One copy remains, so the handler runs once.', zh: '`-=` 会移除调用列表中最后一个匹配项。列表仍保留一份，因此处理器运行一次。' }
    difficulty: intermediate
    tags: [multicast-delegate, removal, invocation-list]

  - id: predict-multicast-return-value
    type: predict
    prompt: { en: 'Which value does this multicast delegate call print?', zh: '这次多播委托调用会输出哪个值？' }
    code: |
      using System;

      Func<int, int> transform = value => value + 1;
      transform += value => value * 3;

      Console.WriteLine(transform(4));
    lang: csharp
    options:
      - { text: { en: '12', zh: '12' }, correct: true }
      - { text: { en: '5', zh: '5' }, correct: false }
      - { text: { en: '15', zh: '15' }, correct: false }
      - { text: { en: 'Both 5 and 12', zh: '同时输出 5 和 12' }, correct: false }
    explanation: { en: 'Both entries run with the original argument, but direct multicast invocation returns only the last entry''s result.', zh: '两个项目都会收到原始参数并运行，但直接调用多播委托只返回最后一个项目的结果。' }
    difficulty: intermediate
    tags: [multicast-delegate, return-value]

  - id: spotbug-for-loop-capture
    type: spotbug
    prompt: { en: 'Find why every callback prints the same value after the loop.', zh: '找出为什么循环结束后，每个回调都会输出同一个值。' }
    code: |
      using System;
      using System.Collections.Generic;

      var callbacks = new List<Action>();
      for (int i = 0; i < 3; i++)
          callbacks.Add(() => Console.WriteLine(i));

      foreach (Action callback in callbacks)
          callback();
    lang: csharp
    issues:
      - line: 6
        kind: correctness
        note: { en: 'Every lambda captures the same `i` variable, which equals 3 when the callbacks run.', zh: '每个 lambda 都捕获同一个 `i` 变量；回调运行时，它的值已经是 3。' }
    explanation: { en: 'Create `int index = i;` inside the loop body and capture `index`, or pass the value into a factory. Invoke all callbacks after the loop in the regression test.', zh: '应在循环体内创建 `int index = i;` 并捕获 `index`，或者把值传入工厂。回归测试要在循环结束后调用全部回调。' }
    difficulty: intermediate
    tags: [lambda, captured-variable, loop]

  - id: delegate-versus-event-access
    type: mcq
    prompt: { en: 'What extra restriction does a public event impose compared with a public delegate field?', zh: '与公开委托字段相比，公开事件增加了什么限制？' }
    options:
      - { text: { en: 'Outside code can add or remove handlers but cannot replace or invoke the event.', zh: '外部代码可以添加或移除处理器，但不能替换或触发事件。' }, correct: true }
      - { text: { en: 'An event can contain only one handler.', zh: '一个事件只能包含一个处理器。' }, correct: false }
      - { text: { en: 'An event always invokes handlers asynchronously.', zh: '事件总是异步调用处理器。' }, correct: false }
      - { text: { en: 'An event cannot use a generic delegate type.', zh: '事件不能使用泛型委托类型。' }, correct: false }
    explanation: { en: 'The event member exposes subscription operations outside its declaring type while the publisher retains assignment and invocation control.', zh: '事件成员在声明类型之外只公开订阅操作，赋值与触发权仍由发布者控制。' }
    difficulty: beginner
    tags: [event, delegate, encapsulation]

  - id: review-generated-report-notifier
    type: review
    prompt: { en: 'Review this generated notifier before it handles confidential reports in a long-running process.', zh: '在这段生成的通知代码用于长期进程中的机密报告前，对它进行审查。' }
    task: { en: 'Allow zero listeners, await each dashboard save before PublishAsync returns, preserve failures, avoid logging report contents, and release the dashboard on disposal.', zh: '允许零个监听器；在 PublishAsync 返回前等待每次面板保存；保留失败；不记录报告内容；并在释放面板时解除订阅。' }
    code: |
      using System;
      using System.Threading.Tasks;
      public sealed class ReportSource
      {
          public event EventHandler<string>? Ready;
          public async Task PublishAsync(string report)
          {
              Ready!.Invoke(this, report);
              await Task.CompletedTask;
          }
      }
      public sealed class Dashboard : IDisposable
      {
          private readonly ReportSource _source;
          public Dashboard(ReportSource source) {
              _source = source;
              _source.Ready += async (_, report) =>
              {
                  Console.WriteLine($"saving {report}");
                  await SaveAsync(report);
              };
          }
          public void Dispose() => _source.Ready -= async (_, report) => await SaveAsync(report);
          private static Task SaveAsync(string report) => Task.Delay(10);
      }
    lang: csharp
    right: { en: 'The generated API keeps notification ownership inside ReportSource, returns Task from its publishing method, and exposes an IDisposable cleanup boundary.', zh: '生成的 API 把通知触发权留在 ReportSource 内部，发布方法返回 Task，并通过 IDisposable 暴露清理边界。' }
    checklist:
      - { en: 'Publish with zero, one, and several listeners, including one that fails.', zh: '分别以零个、一个和多个监听器发布，并让其中一个失败。' }
      - { en: 'Prove that every asynchronous handler finishes before PublishAsync returns.', zh: '证明每个异步处理器都在 PublishAsync 返回前完成。' }
      - { en: 'Inspect logs with a report containing a unique secret marker.', zh: '使用包含唯一秘密标记的报告检查日志。' }
      - { en: 'Publish after disposal and confirm that the dashboard is no longer retained or called.', zh: '释放后再次发布，确认面板不再被保留，也不会被调用。' }
    issues:
      - line: 8
        kind: edge-case
        note: { en: '`Ready!` only suppresses a warning; invoking with zero listeners throws NullReferenceException.', zh: '`Ready!` 只会抑制警告；零监听器时调用会抛出 NullReferenceException。' }
      - line: 17
        kind: correctness
        note: { en: 'EventHandler returns void, so this async lambda is async void; PublishAsync cannot await its save or receive its asynchronous failure.', zh: 'EventHandler 返回 void，因此这个异步 lambda 是 async void；PublishAsync 无法等待保存，也收不到异步失败。' }
      - line: 19
        kind: security
        note: { en: 'Logging the raw report can disclose confidential report contents.', zh: '记录原始报告会泄露机密报告内容。' }
      - line: 23
        kind: performance
        note: { en: 'Dispose creates a different lambda and removes nothing, so the long-lived source can retain every disposed Dashboard.', zh: 'Dispose 创建了另一个 lambda，没有移除原处理器；长期存活的来源可能保留每个已释放面板。' }
    explanation: { en: 'Use `?.Invoke` only for a truly synchronous event. Because publishing must await saves, define a Task-returning handler contract, enumerate its invocation list under an explicit sequential or concurrent policy, store the subscribed delegate, and remove that exact instance.', zh: '真正同步的事件才适合使用 `?.Invoke`。这里发布流程必须等待保存，因此应定义返回 Task 的处理器契约，按明确的顺序或并发策略遍历调用列表，保存订阅用的委托，并移除同一个实例。' }
    difficulty: advanced
    tags: [code-review, async-void, delegate-identity, sensitive-data, lifetime]
