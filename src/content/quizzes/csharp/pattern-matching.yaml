topic: csharp/pattern-matching
items:
  - id: predict-first-guarded-arm
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      using System;

      Purchase order = new(1_500m);

      string label = order switch
      {
          Purchase item when item.Total > 0m => "positive",
          { Total: >= 1_000m } => "large",
          _ => "invalid"
      };

      Console.WriteLine(label);

      public sealed record Purchase(decimal Total);
    lang: csharp
    options:
      - { text: { en: 'positive', zh: 'positive' }, correct: true }
      - { text: { en: 'large', zh: 'large' }, correct: false }
      - { text: { en: 'invalid', zh: 'invalid' }, correct: false }
      - { text: { en: 'Both positive and large', zh: '同时输出 positive 和 large' }, correct: false }
    explanation: { en: 'Both conditions describe the order, but the first pattern matches and its guard is true. A switch expression returns the first successful arm in text order.', zh: '两个条件都能描述该订单，但第一个模式匹配且守卫为真。switch 表达式会返回文本顺序中第一个成功分支的结果。' }
    difficulty: intermediate
    tags: [switch-expression, case-guard, arm-order]

  - id: predict-list-shape
    type: predict
    prompt: { en: 'Which label does this three-element command produce?', zh: '这个三元素命令会产生哪个标签？' }
    code: |
      using System;

      string[] args = ["ship", "A-17", "--priority"];

      string result = args switch
      {
          ["ship", var id] => $"standard {id}",
          ["ship", var id, "--priority"] => $"priority {id}",
          [var command, ..] => $"unknown {command}"
      };

      Console.WriteLine(result);
    lang: csharp
    options:
      - { text: { en: 'priority A-17', zh: 'priority A-17' }, correct: true }
      - { text: { en: 'standard A-17', zh: 'standard A-17' }, correct: false }
      - { text: { en: 'unknown ship', zh: 'unknown ship' }, correct: false }
      - { text: { en: 'The first two arms are ambiguous.', zh: '前两个分支存在歧义。' }, correct: false }
    explanation: { en: 'A list pattern without a slice matches the exact length, so the two-element arm fails. The three-element priority arm is then selected.', zh: '不含切片的列表模式要求长度完全一致，因此二元素分支匹配失败，随后三元素优先命令分支被选中。' }
    difficulty: intermediate
    tags: [list-pattern, exact-length, predict-output]

  - id: spotbug-logical-range
    title: { en: 'Spot the bug in the age classifier', zh: '找出年龄分类器里的 bug' }
    type: spotbug
    prompt: { en: 'Find the logical-pattern bug in this age classifier.', zh: '找出这个年龄分类器中的逻辑模式错误。' }
    code: |
      using System;

      Console.WriteLine(Classify(12));
      Console.WriteLine(Classify(80));

      static string Classify(int age) => age switch
      {
          >= 18 or < 65 => "working-age",
          < 18 => "minor",
          _ => "senior"
      };
    lang: csharp
    issues:
      - line: 8
        kind: correctness
        note: { en: 'The or pattern is true for nearly every integer, so it captures minors and seniors. The contiguous interval must use >= 18 and < 65.', zh: 'or 模式对几乎所有整数都为真，因此会捕获未成年人和老年人。连续区间必须写成 >= 18 and < 65。' }
    explanation: { en: 'Use and to express simultaneous lower and upper bounds. Test both boundary values and their neighbors so this mistake cannot hide behind an in-range example.', zh: '同时限制上下界时应使用 and。测试两个边界及其相邻值，避免错误被区间内部样例掩盖。' }
    difficulty: beginner
    tags: [logical-pattern, relational-pattern, boundaries]

  - id: type-pattern-null
    type: mcq
    prompt: { en: 'What does value is string text establish when the match succeeds?', zh: 'value is string text 匹配成功时建立了哪些事实？' }
    options:
      - { text: { en: 'value has a compatible string runtime type, and text is non-null.', zh: 'value 的运行时类型与 string 兼容，而且 text 非 null。' }, correct: true }
      - { text: { en: 'value may be null, and text receives an empty string.', zh: 'value 可以为 null，而 text 会得到空字符串。' }, correct: false }
      - { text: { en: 'value is converted by calling ToString.', zh: '会调用 ToString 转换 value。' }, correct: false }
      - { text: { en: 'Only the compile-time type is checked.', zh: '只会检查编译时类型。' }, correct: false }
    explanation: { en: 'Declaration and type patterns never match null. A successful declaration pattern tests runtime compatibility and binds the converted non-null value.', zh: '声明模式与类型模式不会匹配 null。声明模式成功时，会验证运行时类型兼容性并绑定转换后的非空值。' }
    difficulty: beginner
    tags: [declaration-pattern, 'null', type-narrowing]

  - id: list-pattern-input-contract
    type: mcq
    prompt: { en: 'Why can an arbitrary IEnumerable<string> not be matched directly with ["run", var file]?', zh: '为什么任意 IEnumerable<string> 不能直接用 ["run", var file] 匹配？' }
    options:
      - { text: { en: 'List patterns require a count and an indexer; IEnumerable only promises enumeration.', zh: '列表模式需要计数与索引器，而 IEnumerable 只承诺枚举。' }, correct: true }
      - { text: { en: 'List patterns accept numeric elements only.', zh: '列表模式只能接收数值元素。' }, correct: false }
      - { text: { en: 'A list pattern always mutates its input.', zh: '列表模式总会修改输入。' }, correct: false }
      - { text: { en: 'The syntax is limited to collection expressions.', zh: '该语法只能用于集合表达式。' }, correct: false }
    explanation: { en: 'List-pattern compatibility is structural: the static input type must be countable and indexable. Materializing a stream changes its lifetime and resource contract, so that choice must be explicit.', zh: '列表模式按结构判断兼容性：输入的静态类型必须可计数、可索引。物化流会改变生命周期与资源契约，因此必须明确作出这个选择。' }
    difficulty: intermediate
    tags: [list-pattern, ienumerable, structural-protocol]

  - id: review-generated-command-router
    type: review
    title: { en: 'Review a generated command router', zh: '审查生成的命令路由器' }
    prompt: { en: 'Review this generated switch against the command-routing contract.', zh: '根据命令路由契约审查这个生成的 switch。' }
    task: { en: 'Reject null commands, require a positive refund amount, authorize admin commands only with the trusted method parameter, require a nonempty user ID for ordinary commands, and reject unknown input explicitly.', zh: '拒绝 null 命令；退款金额必须为正；管理命令只能使用受信任的方法参数授权；普通命令必须带非空用户 ID；未知输入必须明确拒绝。' }
    code: |
      using System;

      public sealed record Command(
          string Name,
          string? UserId,
          decimal Amount,
          bool IsAdmin);

      public static class CommandRouter
      {
          public static string Route(Command command, bool isAuthorizedAdmin)
          {
              ArgumentNullException.ThrowIfNull(command);

              return command switch
              {
                  { Name: "refund", Amount: >= 0m } => "refund",
                  { Name: "admin", IsAdmin: true } => "admin",
                  { UserId: not null } => "user",
                  _ => "ignored"
              };
          }
      }
    lang: csharp
    right: { en: 'The generated code checks command for null at the method boundary, uses a typed record, and keeps routing branches visible in one switch expression.', zh: '生成代码在方法边界检查了 command 是否为 null，使用有类型的记录，并把路由分支集中显示在一个 switch 表达式中。' }
    checklist:
      - { en: 'Test zero, negative, and positive refund amounts.', zh: '测试零、负数和正数退款金额。' }
      - { en: 'Vary the trusted authorization parameter independently from payload fields.', zh: '让受信任的授权参数与载荷字段独立变化。' }
      - { en: 'Test null, empty, whitespace, and ordinary user IDs.', zh: '测试 null、空字符串、纯空白和普通用户 ID。' }
      - { en: 'Assert the failure result for unknown and malformed command names.', zh: '断言未知与格式错误命令名称的失败结果。' }
    issues:
      - line: 17
        kind: correctness
        note: { en: 'The >= 0m pattern accepts a zero refund even though the contract requires a positive amount.', zh: '>= 0m 模式会接受零金额退款，但契约要求金额为正。' }
      - line: 18
        kind: security
        note: { en: 'The admin arm trusts the caller-controlled IsAdmin field and ignores the trusted isAuthorizedAdmin parameter.', zh: '管理分支信任调用方可控的 IsAdmin 字段，却忽略受信任的 isAuthorizedAdmin 参数。' }
      - line: 19
        kind: edge-case
        note: { en: 'not null still accepts empty and whitespace-only user IDs, so malformed identities enter the normal route.', zh: 'not null 仍会接受空字符串和纯空白用户 ID，导致格式错误的身份进入正常路径。' }
      - line: 20
        kind: readability
        note: { en: 'Returning ignored conflates unknown commands with a successful no-op and hides the required rejection contract.', zh: '返回 ignored 会把未知命令与成功的无操作混在一起，隐藏契约要求的拒绝语义。' }
    explanation: { en: 'Use > 0m for refunds, combine the admin name with the trusted authorization value, validate meaningful user IDs before matching, and make the catch-all return or throw an explicit failure.', zh: '退款应使用 > 0m；管理命令名称要与受信任授权值组合；匹配前验证有效用户 ID；兜底分支应返回或抛出明确失败。' }
    difficulty: advanced
    minutes: 8
    tags: [code-review, property-pattern, authorization, failure-contract]
