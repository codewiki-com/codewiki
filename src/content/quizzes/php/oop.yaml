topic: php/oop
items:
  - id: predict-object-assignment-clone
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      final class Counter
      {
          public function __construct(public int $value) {}
      }

      $first = new Counter(1);
      $alias = $first;
      $copy = clone $first;
      $alias->value++;
      $copy->value++;

      echo "{$first->value},{$copy->value}\n";
    lang: php
    options:
      - { text: { en: '1,2', zh: '1,2' }, correct: false }
      - { text: { en: '2,2', zh: '2,2' }, correct: true }
      - { text: { en: '2,3', zh: '2,3' }, correct: false }
      - { text: { en: '3,3', zh: '3,3' }, correct: false }
    explanation: { en: '$alias and $first locate the same object, so the first increment changes their shared instance. clone creates a second top-level object whose increment is independent.', zh: '$alias 与 $first 定位同一个对象，所以第一次递增会修改两者共享的实例。clone 创建新的顶层对象，其递增操作相互独立。' }
    difficulty: beginner
    tags: [object-identity, clone, predict-output]

  - id: constructor-promotion-invariant
    type: mcq
    prompt: { en: 'What does constructor property promotion guarantee by itself?', zh: '构造器属性提升本身能保证什么？' }
    options:
      - { text: { en: 'It declares and assigns a property from a visibility-marked constructor parameter.', zh: '它通过带可见性修饰符的构造器参数声明并赋值属性。' }, correct: true }
      - { text: { en: 'It validates every business rule attached to the property.', zh: '它会验证与属性相关的所有业务规则。' }, correct: false }
      - { text: { en: 'It makes the promoted property deeply immutable.', zh: '它会让提升后的属性深度不可变。' }, correct: false }
      - { text: { en: 'It calls the parent constructor automatically.', zh: '它会自动调用父类构造器。' }, correct: false }
    explanation: { en: 'Promotion removes declaration-and-assignment repetition. Validation, parent initialization, and the mutability of nested objects remain separate design responsibilities.', zh: '属性提升只减少声明与赋值的重复语法。校验、父类初始化和嵌套对象可变性仍是独立的设计责任。' }
    difficulty: beginner
    tags: [constructor-property-promotion, invariants]

  - id: interface-composition-boundary
    type: mcq
    prompt: { en: 'Why would Checkout accept a ShippingPolicy interface in its constructor?', zh: '为什么 Checkout 应在构造器中接收 ShippingPolicy 接口？' }
    options:
      - { text: { en: 'So callers can select an implementation without Checkout depending on its concrete class.', zh: '让调用方选择实现，而 Checkout 不依赖具体类。' }, correct: true }
      - { text: { en: 'So PHP recursively validates every value held by the implementation.', zh: '让 PHP 递归验证实现内部保存的每个值。' }, correct: false }
      - { text: { en: 'So the implementation may ignore the interface return type.', zh: '让实现可以忽略接口返回类型。' }, correct: false }
      - { text: { en: 'So Checkout can inherit from several shipping classes.', zh: '让 Checkout 可以继承多个运费类。' }, correct: false }
    explanation: { en: 'The interface is a substitution boundary. It narrows what Checkout knows, while startup or test code supplies a compatible implementation.', zh: '接口建立替换边界，缩小 Checkout 所知的表面；启动代码或测试代码负责提供兼容实现。' }
    difficulty: intermediate
    tags: [interfaces, composition, dependency-injection]

  - id: spot-parent-constructor
    type: spotbug
    prompt: { en: 'Find the initialization bug in this generated subclass.', zh: '找出这段生成子类中的初始化错误。' }
    code: |
      class Job
      {
          public function __construct(private string $id) {}

          public function id(): string
          {
              return $this->id;
          }
      }

      final class EmailJob extends Job
      {
          public function __construct(private string $address) {}
      }

      echo (new EmailJob('ops@example.com'))->id();
    lang: php
    issues:
      - line: 13
        kind: correctness
        note: { en: 'The child constructor overrides construction but never calls parent::__construct(), so Job::$id remains uninitialized and id() raises Error.', zh: '子类构造器覆盖了构造过程，却没有调用 parent::__construct()，因此 Job::$id 保持未初始化，id() 会抛出 Error。' }
    explanation: { en: 'Give EmailJob the ID it needs and call parent::__construct($id), or redesign construction so a child cannot skip required parent state.', zh: '应让 EmailJob 接收所需 ID 并调用 parent::__construct($id)，或者重新设计构造过程，使子类不能跳过父类必需状态。' }
    difficulty: intermediate
    tags: [inheritance, constructors, typed-properties]

  - id: review-generated-wallet
    type: review
    title: { en: 'Review a generated wallet object', zh: '审查一个生成的钱包对象' }
    prompt: { en: 'Review this generated class before it holds account balances.', zh: '在这个生成类保存账户余额前进行审查。' }
    task: { en: 'Model a wallet whose integer-cent balance never becomes negative, inject a narrow audit interface, and expose one validated withdrawal operation.', zh: '建立一个使用整数分保存余额且永不为负的钱包，注入窄小审计接口，并公开一个经过校验的取款操作。' }
    code: |
      final class Wallet
      {
          public int $balanceCents;

          public function __construct(int $balanceCents, $audit)
          {
              $this->balanceCents = $balanceCents;
              $this->audit = $audit;
          }

          public function withdraw(int $cents): bool
          {
              if ($cents > $this->balanceCents) {
                  return false;
              }
              $this->balanceCents -= $cents;
              $this->audit->record("withdrew {$cents}");
              return true;
          }

          public function __call(string $name, array $arguments): mixed
          {
              return $this->audit->$name(...$arguments);
          }
      }
    lang: php
    issues:
      - line: 3
        kind: correctness
        note: { en: 'The public writable balance lets callers make it negative without using withdraw, so the class cannot preserve its invariant.', zh: '公开可写余额允许调用方绕过 withdraw 把余额改成负数，因此类无法维护不变量。' }
      - line: 8
        kind: readability
        note: { en: 'audit is an undeclared dynamic property with no interface type, hiding the dependency and producing a deprecation on PHP 8.2 and later.', zh: 'audit 是没有接口类型的未声明动态属性，既隐藏依赖，也会在 PHP 8.2 及以后产生弃用诊断。' }
      - line: 13
        kind: edge-case
        note: { en: 'Zero or negative withdrawals pass the check; a negative value increases the balance and records a misleading withdrawal.', zh: '零或负数取款会通过检查；负数还会增加余额，并记录误导性的取款事件。' }
      - line: 23
        kind: security
        note: { en: 'Forwarding any unknown public method name to the audit object exposes operations that Wallet never intended to authorize.', zh: '把任意未知公开方法名转发给审计对象，会暴露 Wallet 从未打算授权的操作。' }
    right: { en: 'The generated code stores money as integer cents, rejects a withdrawal larger than the current balance, and keeps audit recording beside the successful state change.', zh: '生成代码使用整数分保存金额，拒绝超过当前余额的取款，并把审计记录放在成功状态修改旁边。' }
    checklist:
      - { en: 'Establish a nonnegative balance in the constructor and keep the property private.', zh: '在构造器中建立非负余额，并把属性设为私有。' }
      - { en: 'Inject a declared, narrowly typed audit interface.', zh: '注入已声明且类型窄小的审计接口。' }
      - { en: 'Reject nonpositive and over-balance withdrawal amounts.', zh: '拒绝非正数和超过余额的取款金额。' }
      - { en: 'Expose only named wallet operations; remove unrestricted dynamic forwarding.', zh: '只公开具名钱包操作，移除不受限制的动态转发。' }
    explanation: { en: 'Make balanceCents private, validate constructor and withdrawal values, promote an AuditSink dependency, and delete __call so the object has a closed public contract.', zh: '应把 balanceCents 设为私有，校验构造值和取款值，提升 AuditSink 依赖，并删除 __call，使对象具有封闭的公开契约。' }
    difficulty: advanced
    minutes: 8
    tags: [code-review, encapsulation, invariants, interfaces]
