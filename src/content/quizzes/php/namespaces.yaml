topic: php/namespaces
items:
  - id: predict-import-aliases
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      <?php
      namespace Domain { final class User {} }
      namespace Admin { final class User {} }
      namespace {
          use Admin\User as AdminUser;
          use Domain\User;
          echo User::class, "\n", AdminUser::class, "\n";
      }
    lang: php
    options:
      - { text: { en: 'Domain\User, then Admin\User', zh: '先输出 Domain\User，再输出 Admin\User' }, correct: true }
      - { text: { en: 'User, then AdminUser', zh: '先输出 User，再输出 AdminUser' }, correct: false }
      - { text: { en: 'Admin\User, then Domain\User', zh: '先输出 Admin\User，再输出 Domain\User' }, correct: false }
      - { text: { en: 'A duplicate-class fatal error', zh: '发生类重复声明的致命错误' }, correct: false }
    explanation: { en: 'Each declaration has a different complete name. The two imports choose local spellings, while ::class returns each resolved complete name.', zh: '两个声明拥有不同的完整名称。两条导入只选择本地拼写，::class 返回各自解析后的完整名称。' }
    difficulty: beginner
    tags: [namespaces, aliases, predict-output]

  - id: import-versus-autoload
    type: mcq
    prompt: { en: 'What does use Vendor\Mail\Client; do in a PHP file?', zh: 'PHP 文件中的 use Vendor\Mail\Client; 会做什么？' }
    options:
      - { text: { en: 'It creates a file-local class-name alias used during name resolution.', zh: '它建立当前文件内的类名别名，供名称解析使用。' }, correct: true }
      - { text: { en: 'It immediately requires the file that declares Client.', zh: '它立即 require 声明 Client 的文件。' }, correct: false }
      - { text: { en: 'It installs the Composer package that owns Client.', zh: '它安装拥有 Client 的 Composer 包。' }, correct: false }
      - { text: { en: 'It makes Client available as a global class alias in every file.', zh: '它让 Client 成为所有文件都能使用的全局类别名。' }, correct: false }
    explanation: { en: 'A namespace import is compile-time, file-local notation. Loading is a separate require or autoload operation after PHP has resolved the complete name.', zh: '命名空间导入是编译期、文件级的记法。PHP 解析出完整名称后，require 或自动加载才负责载入，两者是不同操作。' }
    difficulty: beginner
    tags: [imports, autoloading, name-resolution]

  - id: dynamic-name-resolution
    type: mcq
    prompt: { en: 'A file imports App\Models\Invoice, then sets $class = "Invoice" and executes new $class(). Which name is requested?', zh: '文件导入 App\Models\Invoice 后，设置 $class = "Invoice" 并执行 new $class()。PHP 会请求哪个名称？' }
    options:
      - { text: { en: 'The global name Invoice', zh: '全局名称 Invoice' }, correct: true }
      - { text: { en: 'App\Models\Invoice because the import rewrites strings', zh: 'App\Models\Invoice，因为导入会改写字符串' }, correct: false }
      - { text: { en: 'The current namespace followed by App\Models\Invoice', zh: '当前命名空间再加 App\Models\Invoice' }, correct: false }
    explanation: { en: 'Dynamic strings do not go through static import resolution. Store Invoice::class or another explicitly allowlisted complete name instead.', zh: '动态字符串不会经过静态导入解析。应保存 Invoice::class，或允许列表中另一个明确的完整名称。' }
    difficulty: intermediate
    tags: [dynamic-class-name, imports, class-string]

  - id: spot-psr4-path-drift
    title: { en: 'Spot the bug in the PSR-4 mapping', zh: '找出 PSR-4 映射里的 bug' }
    type: spotbug
    prompt: { en: 'Composer maps App\ to src/. Find the namespace and case mismatches that can break PSR-4 loading.', zh: 'Composer 把 App\ 映射到 src/。找出会破坏 PSR-4 加载的命名空间与大小写不匹配。' }
    code: |
      <?php
      // File: src/Service/TaxCalculator.php
      namespace App\Services;

      final class TaxCalculator {}

      namespace App\Checkout;

      use app\Services\TaxCalculator;

      final class Checkout
      {
          public function tax(): TaxCalculator
          {
              return new TaxCalculator();
          }
      }
    lang: php
    issues:
      - line: 2
        kind: correctness
        note: { en: 'The declared remainder Services\TaxCalculator maps to src/Services/TaxCalculator.php, not the singular src/Service path shown by the file comment.', zh: '声明余下的 Services\TaxCalculator 应映射到 src/Services/TaxCalculator.php，而不是文件注释中的单数 src/Service 路径。' }
      - line: 9
        kind: edge-case
        note: { en: 'The imported prefix is lowercase app, while the registered prefix is App. A case-insensitive development setup may hide the mismatch before deployment.', zh: '导入前缀写成小写 app，而注册前缀是 App。大小写不敏感的开发环境可能在部署前掩盖这个问题。' }
    explanation: { en: 'Under PSR-4, the namespace remainder determines the directory and filename with matching case. Keep the prefix, namespace segments, and filesystem path exact.', zh: '在 PSR-4 中，命名空间余下部分按相同大小写确定目录与文件名。前缀、命名空间段和文件系统路径必须准确一致。' }
    difficulty: intermediate
    tags: [psr-4, composer, case-sensitivity]

  - id: review-generated-exporter-factory
    title: { en: 'Review generated exporter factory', zh: '审查生成的导出器工厂' }
    type: review
    prompt: { en: 'Review this generated exporter factory before connecting it to a request parameter.', zh: '在把这段生成的导出器工厂连接到请求参数前，对它进行审查。' }
    task: { en: 'Accept only the keys csv and json, map each key to a PSR-4-loaded exporter that implements Exporter, reject unknown keys before autoloading, and return the selected instance.', zh: '只接受 csv 与 json 两个键；把它们映射到由 PSR-4 加载且实现 Exporter 的导出器；在自动加载前拒绝未知键；并返回选中的实例。' }
    code: |
      <?php

      declare(strict_types=1);

      namespace App\Reports;

      use App\Contracts\Exporter;
      use App\Reports\Exporters;

      final class ExporterFactory
      {
          public function create(string $format): Exporter
          {
              $class = 'Exporters\\' . ucfirst($format) . 'Exporter';
              if (!class_exists($class)) {
                  throw new \InvalidArgumentException('Unknown export format');
              }

              return new $class();
          }
      }
    lang: php
    right: { en: 'The generated code centralizes construction, declares the Exporter return contract, reports a missing class instead of using eval, and does not silently return null.', zh: '生成代码集中管理构造过程，声明了 Exporter 返回契约，在类不存在时报告错误，没有使用 eval，也不会静默返回 null。' }
    issues:
      - line: 8
        kind: readability
        note: { en: 'The Exporters namespace import looks relevant but is never referenced statically. It misleads readers into thinking the dynamic string uses the alias.', zh: 'Exporters 命名空间导入看似相关，却没有被静态引用。它会误导读者，以为动态字符串使用了这个别名。' }
      - line: 14
        kind: correctness
        note: { en: 'Dynamic strings do not apply imports or the current namespace. This value names Exporters\CsvExporter, not App\Reports\Exporters\CsvExporter.', zh: '动态字符串不会套用导入或当前命名空间。这个值表示 Exporters\CsvExporter，而不是 App\Reports\Exporters\CsvExporter。' }
      - line: 14
        kind: edge-case
        note: { en: 'ucfirst is not a protocol mapping: casing, separators, and a key such as json-lines do not reliably produce the intended class name.', zh: 'ucfirst 不是协议映射：大小写、分隔符和 json-lines 这样的键都无法可靠生成预期类名。' }
      - line: 15
        kind: security
        note: { en: 'class_exists autoloads a class derived from untrusted input before checking an allowlist. Map csv and json explicitly to class constants and reject every other key first.', zh: 'class_exists 在检查允许列表前，就会自动加载由不可信输入派生的类。应先把 csv 与 json 明确映射到类常量，并拒绝其他所有键。' }
    checklist:
      - { en: 'Enumerate accepted external keys and reject an unknown key before any autoload attempt.', zh: '列出接受的外部键，并在任何自动加载尝试前拒绝未知键。' }
      - { en: 'Store targets as ExporterType::class constants rather than concatenated class strings.', zh: '把目标保存为 ExporterType::class 常量，不要拼接类名字符串。' }
      - { en: 'Instantiate each allowlisted target through Composer and assert it implements Exporter.', zh: '通过 Composer 实例化允许列表中的每个目标，并断言它实现 Exporter。' }
      - { en: 'Test key casing, empty input, separators, and an unknown value without triggering unrelated constructors.', zh: '测试键的大小写、空输入、分隔符与未知值，并确认不会触发无关构造器。' }
    explanation: { en: 'Use an explicit map such as ["csv" => CsvExporter::class, "json" => JsonExporter::class], reject before construction, and retain the Exporter return type. That makes both the input protocol and autoload targets reviewable.', zh: '应使用 ["csv" => CsvExporter::class, "json" => JsonExporter::class] 这样的显式映射，在构造前拒绝未知值，并保留 Exporter 返回类型。这样才能审查输入协议和自动加载目标。' }
    difficulty: advanced
    tags: [namespaces, code-review, dynamic-class-name, security]
