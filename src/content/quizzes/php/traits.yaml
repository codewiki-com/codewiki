topic: php/traits
items:
  - id: predict-trait-conflict-alias
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      <?php
      trait ShortLabel
      {
          public function label(): string { return 'short'; }
      }
      trait DetailedLabel
      {
          public function label(): string { return 'detailed'; }
      }
      final class Labeler
      {
          use ShortLabel, DetailedLabel {
              DetailedLabel::label insteadof ShortLabel;
              ShortLabel::label as compactLabel;
          }
      }
      $labeler = new Labeler();
      echo $labeler->label(), PHP_EOL;
      echo $labeler->compactLabel(), PHP_EOL;
    lang: php
    options:
      - { text: { en: 'detailed, then short', zh: '先输出detailed，再输出short' }, correct: true }
      - { text: { en: 'short, then detailed', zh: '先输出short，再输出detailed' }, correct: false }
      - { text: { en: 'detailed twice', zh: '输出两次detailed' }, correct: false }
      - { text: { en: 'A fatal method-collision error', zh: '发生方法冲突的致命错误' }, correct: false }
    explanation: { en: 'insteadof selects DetailedLabel for the original name, while as retains the excluded ShortLabel implementation under compactLabel.', zh: 'insteadof为原名称选择DetailedLabel，as则用compactLabel保留被排除的ShortLabel实现。' }
    difficulty: intermediate
    tags: [conflict-resolution, insteadof, alias]

  - id: trait-public-contract
    type: mcq
    prompt: { en: 'A service must accept any object that can produce a reference, whether or not it uses FormatsReference. What should its parameter require?', zh: '服务需要接收任何能生成引用编号的对象，无论它是否使用FormatsReference。参数应该要求什么？' }
    options:
      - { text: { en: 'A Referenceable interface implemented by each accepted class', zh: '由每个可接受类实现的Referenceable接口' }, correct: true }
      - { text: { en: 'The FormatsReference trait name as the parameter type', zh: '把FormatsReference这个Trait名称用作参数类型' }, correct: false }
      - { text: { en: 'ReflectionClass::getTraits() at every call site', zh: '在每个调用位置执行ReflectionClass::getTraits()' }, correct: false }
      - { text: { en: 'A common parent class used only to share the formatter', zh: '只为共享格式化器而创建的公共父类' }, correct: false }
    explanation: { en: 'An interface defines the substitutable runtime capability. A trait is one implementation-reuse choice and should not become the caller contract.', zh: '接口定义可替换的运行时能力。Trait只是一种实现复用方式，不应成为调用方契约。' }
    difficulty: beginner
    tags: [interfaces, contracts, substitution]

  - id: trait-static-property-php83
    type: mcq
    prompt: { en: 'On PHP 8.3, when does a child get static trait storage distinct from the parent shown in the article?', zh: '在PHP 8.3中，文章所示子类何时会得到与父类不同的Trait静态存储？' }
    options:
      - { text: { en: 'When the child uses the same trait again', zh: '子类再次使用同一个Trait时' }, correct: true }
      - { text: { en: 'Whenever the child inherits the trait method', zh: '只要子类继承了Trait方法' }, correct: false }
      - { text: { en: 'Only when two child objects are constructed', zh: '只有构造两个子类对象时' }, correct: false }
      - { text: { en: 'Never; trait static properties are global to the process', zh: '永远不会；Trait静态属性在进程内全局共享' }, correct: false }
    explanation: { en: 'An inheritance-only child sees the inherited storage. Since PHP 8.3, a child that uses the trait again receives a distinct static property from the parent.', zh: '只继承的子类看到继承来的存储。从PHP 8.3起，再次使用该Trait的子类会获得与父类不同的静态属性。' }
    difficulty: advanced
    tags: [static-properties, inheritance, php-8-3]

  - id: trait-property-conflict
    type: mcq
    prompt: { en: 'Can insteadof resolve a same-named property declared by a trait and its consuming class?', zh: 'insteadof能否解决Trait与使用方类声明的同名属性冲突？' }
    options:
      - { text: { en: 'No. Adaptation handles methods; the property declarations themselves must be compatible.', zh: '不能。适配语法只处理方法；属性声明本身必须兼容。' }, correct: true }
      - { text: { en: 'Yes. The class property always wins.', zh: '能。类属性总是获胜。' }, correct: false }
      - { text: { en: 'Yes, but only for private properties.', zh: '能，但只适用于私有属性。' }, correct: false }
      - { text: { en: 'No, because traits cannot declare properties.', zh: '不能，因为Trait不能声明属性。' }, correct: false }
    explanation: { en: 'insteadof and as adapt methods only. Same-named properties need compatible visibility, type, readonly status, and initial value in PHP 8.3.', zh: 'insteadof与as只适配方法。PHP 8.3要求同名属性的可见性、类型、readonly状态和初始值兼容。' }
    difficulty: intermediate
    tags: [properties, compatibility, conflict-resolution]

  - id: spot-as-keeps-original
    title: { en: 'Spot the bug in the trait alias', zh: '找出Trait别名里的bug' }
    type: spotbug
    prompt: { en: 'The author intended to expose only run(), but callers can still invoke delete(). Find the mistake.', zh: '作者只想公开run()，但调用方仍能调用delete()。请找出错误。' }
    code: |
      <?php
      trait DeletesRecord
      {
          public function delete(): string
          {
              return 'deleted';
          }
      }
      final class AdminTool
      {
          use DeletesRecord {
              DeletesRecord::delete as private remove;
          }
          public function run(): string
          {
              return $this->remove();
          }
      }
      echo (new AdminTool())->delete();
    lang: php
    issues:
      - line: 12
        kind: correctness
        note: { en: 'as private remove creates a private alias but leaves the original public delete method unchanged. Adapt the original visibility separately or avoid exposing it from the trait.', zh: 'as private remove只创建私有别名，原来的public delete方法保持不变。应另行调整原入口可见性，或避免由Trait公开它。' }
    explanation: { en: 'A trait alias is an additional entry point, not a rename. Review the visibility of both the original method and the alias.', zh: 'Trait别名是新增入口，不是重命名。应同时审查原方法与别名的可见性。' }
    difficulty: intermediate
    tags: [alias, visibility, public-api]

  - id: review-generated-audit-trait
    title: { en: 'Review generated audit trait', zh: '审查生成的审计Trait' }
    type: review
    prompt: { en: 'Review this generated audit trait before it is shared by payment classes.', zh: '在多个支付类共享这段生成的审计Trait前，对它进行审查。' }
    task: { en: 'Produce an interface-backed audit label, make every host requirement explicit, let each consuming class own construction, and collect only encodable events independently per object.', zh: '生成由接口约束的审计标签，显式声明全部宿主需求，由使用方类负责构造，并让每个对象独立收集可编码事件。' }
    code: |
      <?php
      interface Auditable
      {
          public function auditLabel(): string;
      }
      trait HasAudit
      {
          private static array $events = [];
          public function __construct(private string $accountId) {}
          public function auditLabel(): string
          {
              return $this->prefix . ':' . $this->accountId;
          }
          public function record(array $context): void
          {
              self::$events[] = json_encode($context);
          }
          public function events(): array { return self::$events; }
      }
      final class Payment implements Auditable
      {
          use HasAudit;
          private string $prefix = 'payment';
      }
    lang: php
    right: { en: 'The generated code uses a small public interface, supplies a typed auditLabel return, keeps the reusable code compact, and does not fetch a logger or serializer from a global container.', zh: '生成代码使用了小型公开接口，为auditLabel提供明确返回类型，复用代码保持紧凑，也没有从全局容器获取日志器或序列化器。' }
    checklist:
      - { en: 'Construct two consumers and interleave record calls to verify instance isolation.', zh: '构造两个使用方并交错调用record，验证实例隔离。' }
      - { en: 'Add a consumer constructor and confirm all trait state remains initialized.', zh: '为使用方增加构造器，确认所有Trait状态仍被初始化。' }
      - { en: 'Pass malformed UTF-8 or a recursive structure and assert the encoding policy.', zh: '传入非法UTF-8或递归结构，并断言编码失败政策。' }
      - { en: 'List every $this member referenced by the trait and map it to an abstract requirement or trait-owned field.', zh: '列出Trait引用的每个 $this成员，并映射到抽象需求或Trait自有字段。' }
    issues:
      - line: 8
        kind: security
        note: { en: 'One static array mixes event context across every Payment instance, so one account can observe another account data through events().', zh: '一个静态数组会混合全部Payment实例的事件上下文，因此一个账户可通过events() 看到另一个账户的数据。' }
      - line: 8
        kind: performance
        note: { en: 'The process-wide event array grows without a bound or release point, which is especially harmful in a persistent worker.', zh: '进程级事件数组没有容量边界或释放点，在常驻Worker中尤其容易持续增长。' }
      - line: 9
        kind: correctness
        note: { en: 'The trait constructor owns accountId initialization. A later constructor in Payment overrides it and can leave the promoted property uninitialized.', zh: 'Trait构造器负责初始化accountId；Payment以后增加构造器会覆盖它，并可能让提升属性保持未初始化。' }
      - line: 12
        kind: readability
        note: { en: 'The trait silently requires a prefix property with the right visibility and type. Require a prefix() method instead of depending on an undeclared host layout.', zh: 'Trait暗中要求宿主提供可见性与类型合适的prefix属性。应要求prefix() 方法，不要依赖未声明的宿主布局。' }
      - line: 16
        kind: edge-case
        note: { en: 'json_encode can return false here, so events() can contain a non-string after malformed UTF-8 or recursion. Use JSON_THROW_ON_ERROR or define explicit failure handling.', zh: '遇到非法UTF-8或递归结构时，json_encode可能返回false，导致events() 包含非字符串。应使用JSON_THROW_ON_ERROR，或定义明确的失败处理。' }
    explanation: { en: 'Move accountId and construction into Payment, use abstract accessors for host requirements, store a bounded instance event list, and make JSON failure explicit. Then a second interface implementation can choose a different reuse strategy.', zh: '应把accountId与构造职责移入Payment，用抽象访问器声明宿主需求，保存有边界的实例事件列表，并明确处理JSON失败。这样，第二个接口实现也能选择不同的复用方式。' }
    difficulty: advanced
    tags: [code-review, host-contract, static-state, composition]
