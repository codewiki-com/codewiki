topic: php/enums
items:
  - id: predict-pure-case-identity
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      <?php
      enum Direction
      {
          case North;
          case South;
      }
      $first = Direction::North;
      $listed = Direction::cases()[0];
      echo $first->name, ':', $first === $listed ? 'same' : 'different', PHP_EOL;
    lang: php
    options:
      - { text: { en: 'North:same', zh: 'North:same' }, correct: true }
      - { text: { en: 'North:different', zh: 'North:different' }, correct: false }
      - { text: { en: '0:same', zh: '0:same' }, correct: false }
      - { text: { en: 'It throws because a pure enum has no scalar value.', zh: '程序会抛出异常，因为纯枚举没有标量值。' }, correct: false }
    explanation: { en: 'Every case is a singleton object, and cases() returns those existing cases in declaration order. A pure case still has name even though it has no value.', zh: '每个case都是单例对象，cases() 会按声明顺序返回这些已有case。纯枚举没有value，但仍有name。' }
    difficulty: beginner
    tags: [pure-enum, case-identity, cases]

  - id: predict-backed-conversion-json
    type: predict
    prompt: { en: 'Which three lines are printed?', zh: '程序会输出哪三行？' }
    code: |
      <?php
      enum Status: string
      {
          case Draft = 'draft';
          case Published = 'published';
      }
      echo Status::from('draft')->name, PHP_EOL;
      var_export(Status::tryFrom('Draft'));
      echo PHP_EOL, json_encode(Status::Published), PHP_EOL;
    lang: php
    options:
      - { text: { en: 'Draft, NULL, then "published"', zh: 'Draft、NULL，然后是 "published"' }, correct: true }
      - { text: { en: 'draft, Draft, then {}', zh: 'draft、Draft，然后是 {}' }, correct: false }
      - { text: { en: 'Draft, Status::Draft, then "Published"', zh: 'Draft、Status::Draft，然后是 "Published"' }, correct: false }
      - { text: { en: 'It stops with ValueError on tryFrom().', zh: '程序会在tryFrom() 处因ValueError停止。' }, correct: false }
    explanation: { en: 'Conversion looks up the case-sensitive backing value, so Draft is unknown and tryFrom returns null. A backed enum encodes to its scalar value by default.', zh: '转换会按区分大小写的backing value查找，所以Draft是未知值，tryFrom返回null。带值枚举默认编码为其标量值。' }
    difficulty: intermediate
    tags: [backed-enum, try-from, json]

  - id: match-exhaustiveness-timing
    type: mcq
    prompt: { en: 'A new enum case reaches a match expression that has no matching arm and no default. What does PHP itself do?', zh: '新增枚举case进入一个没有对应分支、也没有default的match表达式时，PHP本身会怎样处理？' }
    options:
      - { text: { en: 'It throws UnhandledMatchError when that path executes.', zh: '执行到该路径时抛出UnhandledMatchError。' }, correct: true }
      - { text: { en: 'It rejects the enum declaration at compile time.', zh: '编译时拒绝该枚举声明。' }, correct: false }
      - { text: { en: 'It returns null from the match expression.', zh: 'match表达式返回null。' }, correct: false }
      - { text: { en: 'It automatically selects the last arm.', zh: '自动选择最后一个分支。' }, correct: false }
    explanation: { en: 'A match without a matching arm fails at runtime. Static analyzers may diagnose missing enum cases earlier, but that is not a PHP compile-time guarantee.', zh: 'match没有匹配分支时会在运行时失败。静态分析器可能更早诊断遗漏的枚举case，但这不是PHP的编译时保证。' }
    difficulty: intermediate
    tags: [match, exhaustiveness, runtime-errors]

  - id: pure-enum-json
    type: mcq
    prompt: { en: 'What is the default JSON behavior of a pure enum?', zh: '纯枚举默认如何进行JSON编码？' }
    options:
      - { text: { en: 'It has no default JSON representation; JSON_THROW_ON_ERROR produces JsonException.', zh: '它没有默认JSON表示；使用JSON_THROW_ON_ERROR时会产生JsonException。' }, correct: true }
      - { text: { en: 'It encodes to its case name as a JSON string.', zh: '它会把case名称编码为JSON字符串。' }, correct: false }
      - { text: { en: 'It encodes to an empty object.', zh: '它会编码为空对象。' }, correct: false }
      - { text: { en: 'It encodes to the case index from cases().', zh: '它会编码为case在cases() 中的索引。' }, correct: false }
    explanation: { en: 'Only a backed enum has a built-in scalar JSON form. A pure enum needs an explicit projection or a JsonSerializable implementation.', zh: '只有带值枚举拥有内建的标量JSON形式。纯枚举需要显式投影，或实现JsonSerializable。' }
    difficulty: intermediate
    tags: [pure-enum, json, serialization]

  - id: spot-unit-enum-value
    title: { en: 'Spot the bug in the UnitEnum helper', zh: '找出纯枚举取值里的bug' }
    type: spotbug
    prompt: { en: 'Find why this helper fails for Mode::Read.', zh: '找出这个助手函数为何无法处理Mode::Read。' }
    code: |
      <?php
      function externalValue(UnitEnum $case): int|string
      {
          return $case->value;
      }
      enum Mode
      {
          case Read;
      }
      echo externalValue(Mode::Read);
    lang: php
    issues:
      - line: 4
        kind: correctness
        note: { en: 'UnitEnum also accepts pure enum cases, which have name but no value. Require BackedEnum or branch after an instanceof BackedEnum check.', zh: 'UnitEnum也接受纯枚举case，而纯枚举只有name，没有value。应要求BackedEnum，或在instanceof BackedEnum检查后分支处理。' }
    explanation: { en: 'Choose the narrowest interface that supports the member you use. UnitEnum describes every enum; BackedEnum describes only enums with scalar values.', zh: '应选择能支持所用成员的最窄接口。UnitEnum描述所有枚举，BackedEnum只描述带标量值的枚举。' }
    difficulty: intermediate
    tags: [unit-enum, backed-enum, type-narrowing]

  - id: review-generated-status-parser
    title: { en: 'Review generated status parser', zh: '审查生成的状态解析器' }
    type: review
    prompt: { en: 'Review this generated status parser before it handles API requests.', zh: '在这段生成的状态解析器处理API请求前，对它进行审查。' }
    task: { en: 'Require a status field containing an exact lowercase backing value, reject missing, malformed, or unknown input, and state cancellation policy explicitly for every case so new cases require a deliberate decision.', zh: '要求status字段包含完全匹配的小写backing value，拒绝缺失、格式错误或未知输入，并显式写出每个case的取消政策，使新增case必须经过有意决策。' }
    code: |
      <?php
      enum OrderStatus: string
      {
          case Pending = 'pending';
          case Paid = 'paid';
          case Shipped = 'shipped';
      }
      final class StatusParser {
          public static function fromPayload(array $payload): OrderStatus {
              foreach (OrderStatus::cases() as $case) {
                  if (strtolower((string) ($payload['status'] ?? '')) === $case->value) {
                      return $case;
                  }
              }
              return OrderStatus::Pending;
          }
          public static function canCancel(OrderStatus $status): bool {
              return match ($status) {
                  OrderStatus::Shipped => false,
                  default => true,
              };
          }
      }
    lang: php
    right: { en: 'The generated code returns a concrete OrderStatus, compares against declared backing values, and keeps cancellation logic typed to the enum.', zh: '生成代码返回具体的OrderStatus，使用已声明的backing value比较，并让取消逻辑接收枚举类型。' }
    checklist:
      - { en: 'Test a missing field, an array, an unknown string, and an exact valid value.', zh: '测试字段缺失、数组、未知字符串和完全匹配的合法值。' }
      - { en: 'Test uppercase and whitespace variants against the stated exact-input policy.', zh: '根据精确输入政策测试大写形式与带空白形式。' }
      - { en: 'Iterate cases() through canCancel() and require one asserted result per case.', zh: '让cases() 中每个case都经过canCancel()，并逐一断言结果。' }
      - { en: 'Add a temporary case and confirm the review or test suite forces a policy decision.', zh: '临时新增一个case，确认审查或测试套件会强制要求决定政策。' }
    issues:
      - line: 10
        kind: performance
        note: { en: 'The loop scans every case for a lookup already provided by tryFrom(). Use validated string input with OrderStatus::tryFrom($raw).', zh: '这段循环扫描每个case，而tryFrom() 已经提供相同查找。应先得到验证过的字符串，再调用OrderStatus::tryFrom($raw)。' }
      - line: 11
        kind: correctness
        note: { en: 'Lowercasing silently accepts uppercase input even though the task requires an exact backing value; the string cast also hides malformed scalar types.', zh: '任务要求完全匹配backing value，但转小写会静默接受大写输入；字符串转换还会掩盖错误的标量类型。' }
      - line: 15
        kind: edge-case
        note: { en: 'Missing, malformed, and unknown input all become Pending, manufacturing a valid business state instead of rejecting the request.', zh: '缺失、格式错误与未知输入都会变成Pending，代码没有拒绝请求，反而制造出合法业务状态。' }
      - line: 20
        kind: readability
        note: { en: 'The default arm hides the policies for Pending and Paid and automatically accepts any future case. List all cases and omit default.', zh: 'default分支隐藏了Pending与Paid的政策，还会自动接受未来case。应列出全部case并省略default。' }
    explanation: { en: 'Validate presence and raw type before conversion, use tryFrom for the exact lookup, reject null explicitly, and enumerate every case in the policy match.', zh: '应在转换前验证字段存在性与原始类型，使用tryFrom完成精确查找，明确拒绝null，并在政策match中列出每个case。' }
    difficulty: advanced
    tags: [code-review, boundary-parsing, match, enum-evolution]
