topic: php/error-handling
items:
  - id: predict-owned-user-warning
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      <?php
      set_error_handler(
          static function (int $severity, string $message): bool {
              echo "handler: $message\n";
              return true;
          },
          E_USER_WARNING,
      );
      trigger_error('low stock', E_USER_WARNING);
      echo "continued\n";
    lang: php
    options:
      - { text: { en: "handler: low stock\ncontinued", zh: "handler: low stock\ncontinued" }, correct: true }
      - { text: { en: 'Only handler: low stock, because the script stops', zh: '只输出 handler: low stock，因为脚本随后停止' }, correct: false }
      - { text: { en: 'Only a default PHP warning', zh: '只输出 PHP 默认警告' }, correct: false }
      - { text: { en: 'Nothing, because handlers suppress all output', zh: '没有输出，因为处理器会抑制全部输出' }, correct: false }
    explanation: { en: 'The handler owns E_USER_WARNING and returns true, so PHP does not run its default handler. E_USER_WARNING is continuable, so the next echo still runs.', zh: '处理器接管 E_USER_WARNING 并返回 true，因此 PHP 不再运行默认处理器。E_USER_WARNING 可以继续执行，所以下一条 echo 仍会运行。' }
    difficulty: beginner
    tags: [errors, handler-return, predict-output]

  - id: predict-engine-error-class
    type: predict
    prompt: { en: 'Which class name does this program print?', zh: '这段程序会输出哪个类名？' }
    code: |
      <?php
      try {
          strlen([]);
      } catch (Throwable $failure) {
          echo $failure::class, PHP_EOL;
      }
    lang: php
    options:
      - { text: { en: 'E_ERROR', zh: 'E_ERROR' }, correct: false }
      - { text: { en: 'ErrorException', zh: 'ErrorException' }, correct: false }
      - { text: { en: 'TypeError', zh: 'TypeError' }, correct: true }
      - { text: { en: 'Exception', zh: 'Exception' }, correct: false }
    explanation: { en: 'Passing an array to strlen() violates its parameter type and the engine throws TypeError. E_ERROR is an integer diagnostic level, not a class name.', zh: '向 strlen() 传入数组违反参数类型，PHP 引擎会抛出 TypeError。E_ERROR 是整数诊断级别，不是类名。' }
    difficulty: beginner
    tags: [throwable, type-error, predict-output]

  - id: default-handler-fallback
    type: mcq
    prompt: { en: 'What must a custom error handler return when PHP default display or logging should still process the diagnostic?', zh: '仍需让 PHP 默认展示或日志机制处理诊断时，自定义错误处理器必须返回什么？' }
    options:
      - { text: { en: 'true', zh: 'true' }, correct: false }
      - { text: { en: 'false', zh: 'false' }, correct: true }
      - { text: { en: 'null', zh: 'null' }, correct: false }
      - { text: { en: 'The original message', zh: '原始消息' }, correct: false }
    explanation: { en: 'Returning false delegates the diagnostic to PHP standard handling. Any other result means the custom handler has handled it and the standard path does not continue.', zh: '返回 false 会把诊断交回 PHP 标准处理机制。其他返回结果都表示自定义处理器已经完成处理，标准路径不会继续。' }
    difficulty: beginner
    tags: [errors, default-handler, logging]

  - id: spot-leaking-conversion-handler
    type: spotbug
    prompt: { en: 'Find why a suppressed warning still throws and why later tests inherit this conversion policy.', zh: '找出被抑制的警告为何仍会抛出，以及后续测试为何会继承这项转换政策。' }
    code: |
      <?php
      function withStrictWarnings(callable $operation): mixed
      {
          set_error_handler(
              static function (int $severity, string $message, string $file, int $line): bool {
                  throw new ErrorException($message, 0, $severity, $file, $line);
              },
          );
          return $operation();
      }
    lang: php
    issues:
      - line: 6
        kind: edge-case
        note: { en: 'The handler converts a diagnostic even when the current error_reporting mask excludes its severity. Check error_reporting() & $severity and return false when it is zero.', zh: '当前 error_reporting 掩码排除该级别时，处理器仍会转换诊断。应检查 error_reporting() & $severity，结果为零时返回 false。' }
      - line: 9
        kind: correctness
        note: { en: 'The function never restores the previous process-wide handler. Put the operation in try/finally and call restore_error_handler() in finally.', zh: '函数从未恢复此前的进程级处理器。应把操作放入 try/finally，并在 finally 中调用 restore_error_handler()。' }
    explanation: { en: 'A converting handler must respect the active mask and have a bounded lifetime. Both behaviors need tests on success, exception, and early-return paths.', zh: '转换处理器必须尊重当前掩码，并且拥有有限生命周期。成功、异常和提前返回路径都应测试这两项行为。' }
    difficulty: intermediate
    tags: [error-exception, suppression, handler-scope, code-review]

  - id: production-reporting-policy
    type: mcq
    prompt: { en: 'Which production baseline preserves diagnostics without exposing them in HTTP responses?', zh: '哪项生产环境基线既保留诊断，又不会在 HTTP 响应中暴露诊断？' }
    options:
      - { text: { en: 'E_ALL, display_errors Off, log_errors On', zh: 'E_ALL、display_errors Off、log_errors On' }, correct: true }
      - { text: { en: 'error_reporting 0, display_errors Off, log_errors Off', zh: 'error_reporting 0、display_errors Off、log_errors Off' }, correct: false }
      - { text: { en: 'E_ERROR only, display_errors On, log_errors Off', zh: '只启用 E_ERROR、display_errors On、log_errors Off' }, correct: false }
      - { text: { en: 'E_ALL, display_errors On, log_errors On', zh: 'E_ALL、display_errors On、log_errors On' }, correct: false }
    explanation: { en: 'Keep E_ALL so warnings, notices, and deprecations remain observable, disable display to protect the response, and retain logging. The destination still needs access control, retention, and redaction.', zh: '保留 E_ALL 才能观察警告、通知和弃用信息；关闭展示以保护响应，同时保留日志。日志目标还需要访问控制、保留期和脱敏政策。' }
    difficulty: intermediate
    tags: [production, error-reporting, information-disclosure]

  - id: review-generated-endpoint-boundary
    type: review
    prompt: { en: 'Review this generated endpoint boundary before deploying it in a long-lived PHP worker.', zh: '在长生命周期 PHP 工作进程中部署这段生成的端点边界前，对它进行审查。' }
    task: { en: 'Run one endpoint action, convert reportable diagnostics while respecting suppression, handle every Throwable, log only allowlisted context, return a generic error, and restore prior handler state.', zh: '运行一次端点操作；在尊重抑制的前提下转换可报告诊断；处理所有 Throwable；只记录允许的上下文；返回通用错误；并恢复此前的处理器状态。' }
    code: |
      <?php
      function runEndpoint(callable $action, array $request): string
      {
          set_error_handler(
              static function (
                  int $severity,
                  string $message,
                  string $file,
                  int $line,
              ): bool {
                  throw new ErrorException($message, 0, $severity, $file, $line);
              },
          );

          try {
              return $action();
          } catch (Exception $error) {
              error_log(json_encode([
                  'event' => 'endpoint_failure',
                  'password' => $request['password'] ?? null,
                  'trace' => $error->getTraceAsString(),
              ]));
              return 'Internal server error';
          }
      }
    lang: php
    right: { en: 'The generated code centralizes endpoint failure handling, creates the built-in ErrorException with original location metadata, writes a structured event, and returns a generic client message.', zh: '生成代码集中处理端点失败，使用原始位置信息创建内建 ErrorException，写入结构化事件，并向客户端返回通用消息。' }
    issues:
      - line: 4
        kind: readability
        note: { en: 'Handler ownership is hidden because no finally restores the previous registration. Make installation and restoration one visible lexical scope.', zh: '代码没有通过 finally 恢复此前注册，处理器所有权因而不清楚。应让安装与恢复处于同一个可见词法作用域。' }
      - line: 11
        kind: edge-case
        note: { en: 'The conversion ignores error_reporting(), so a diagnostic excluded by the active mask can still throw. Return false when the severity bit is not selected.', zh: '转换没有检查 error_reporting()，当前掩码排除的诊断仍可能抛出。未选中严重级别位时应返回 false。' }
      - line: 17
        kind: correctness
        note: { en: 'Catching Exception misses engine Error objects such as TypeError. The task requires a Throwable boundary.', zh: '捕获 Exception 会漏掉 TypeError 等引擎 Error 对象。任务要求建立 Throwable 边界。' }
      - line: 20
        kind: security
        note: { en: 'The log copies a request password. Use an explicit context allowlist and never record credentials, tokens, cookies, or authorization headers.', zh: '日志复制了请求密码。应使用明确的上下文允许列表，绝不能记录凭据、令牌、Cookie 或授权头。' }
    checklist:
      - { en: 'Exercise a selected warning and a warning excluded by the current mask.', zh: '分别触发当前掩码选中和排除的警告。' }
      - { en: 'Throw both an Exception and an engine Error from the action.', zh: '让操作分别抛出 Exception 和引擎 Error。' }
      - { en: 'Assert that the prior handler is restored after success and failure.', zh: '断言成功与失败后，此前的处理器都会恢复。' }
      - { en: 'Assert exact log fields and the absence of secrets and raw request data.', zh: '断言准确的日志字段，并确认不存在秘密和原始请求数据。' }
    explanation: { en: 'A safe boundary respects the current mask, catches Throwable, restores process-wide state in finally, and allowlists log context. A generic response is necessary but does not make unsafe internal logging acceptable.', zh: '安全边界会尊重当前掩码，捕获 Throwable，在 finally 中恢复进程级状态，并按允许列表记录上下文。通用响应不可缺少，但它不能抵消内部日志的不安全做法。' }
    difficulty: advanced
    tags: [error-handling, code-review, security, worker-lifecycle]
