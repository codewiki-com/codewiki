topic: php/magic-methods
items:
  - id: predict-property-hooks
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      <?php
      final class CodeBox
      {
          public function __construct(private array $values) {}
          public function __get(string $name): mixed
          {
              echo "get:{$name}\n";
              return $this->values[$name];
          }
      }
      $box = new CodeBox(['code' => 'A7']);
      echo $box->code, PHP_EOL;
    lang: php
    options:
      - { text: { en: 'get:code, then A7', zh: '先输出 get:code，再输出 A7' }, correct: true }
      - { text: { en: 'Only A7', zh: '只输出 A7' }, correct: false }
      - { text: { en: 'It reports that code is a private property.', zh: '程序报告 code 是私有属性。' }, correct: false }
      - { text: { en: 'It prints get:values, then A7.', zh: '先输出 get:values，再输出 A7。' }, correct: false }
    explanation: { en: 'code is undefined and therefore inaccessible, so __get receives that name before echo receives the returned value. Access to the declared values property happens inside its own class and does not trigger __get.', zh: 'code 没有定义，因此不可访问；__get 会先收到该名称，再把返回值交给 echo。对已声明 values 属性的访问发生在类内部，不会触发 __get。' }
    difficulty: beginner
    tags: [property-overloading, trigger]

  - id: predict-clone-owned-object
    type: predict
    prompt: { en: 'Which two city names are printed?', zh: '程序会输出哪两个城市名？' }
    code: |
      <?php
      final class Address
      {
          public function __construct(public string $city) {}
      }
      final class Draft
      {
          public function __construct(public Address $address) {}
          public function __clone(): void
          {
              $this->address = clone $this->address;
          }
      }
      $original = new Draft(new Address('Paris'));
      $copy = clone $original;
      $copy->address->city = 'Lyon';
      echo $original->address->city, PHP_EOL;
      echo $copy->address->city, PHP_EOL;
    lang: php
    options:
      - { text: { en: 'Paris, then Lyon', zh: '先输出 Paris，再输出 Lyon' }, correct: true }
      - { text: { en: 'Lyon, then Lyon', zh: '先输出 Lyon，再输出 Lyon' }, correct: false }
      - { text: { en: 'Paris, then Paris', zh: '先输出 Paris，再输出 Paris' }, correct: false }
    explanation: { en: '__clone runs on the copy after the initial shallow copy and replaces its Address reference with a cloned Address. The later mutation therefore does not reach the original.', zh: '__clone 会在初始浅复制后对副本运行，并用克隆出的 Address 替换副本中的引用，因此之后的修改不会影响原对象。' }
    difficulty: intermediate
    tags: [clone, object-references, deep-copy]

  - id: property-hook-trigger-boundary
    type: mcq
    prompt: { en: 'When does an external read call __get()?', zh: '外部读取在什么情况下会调用 __get()？' }
    options:
      - { text: { en: 'When the requested property is undefined or inaccessible from the calling scope.', zh: '请求的属性未定义，或当前调用作用域无法访问它时。' }, correct: true }
      - { text: { en: 'Before every public property read.', zh: '每次读取公开属性前。' }, correct: false }
      - { text: { en: 'Only when the property exists and contains null.', zh: '仅当属性存在且值为 null 时。' }, correct: false }
      - { text: { en: 'Only when the class is marked final.', zh: '仅当类声明为 final 时。' }, correct: false }
    explanation: { en: 'Ordinary lookup wins for an accessible declared property. __get is a fallback for an undefined property or one whose visibility prevents access from that scope.', zh: '可访问的已声明属性会先按普通规则读取。属性未定义，或可见性阻止当前作用域访问时，__get 才作为后备入口。' }
    difficulty: beginner
    tags: [property-overloading, visibility]

  - id: serialization-hook-precedence
    type: mcq
    prompt: { en: 'A class defines both __serialize() and __sleep(). Which hook does serialize() use on PHP 8.3?', zh: '一个类同时定义 __serialize() 与 __sleep()。PHP 8.3 的 serialize() 会使用哪个钩子？' }
    options:
      - { text: { en: '__serialize() only', zh: '只使用 __serialize()' }, correct: true }
      - { text: { en: '__sleep() only', zh: '只使用 __sleep()' }, correct: false }
      - { text: { en: '__sleep() followed by __serialize()', zh: '先使用 __sleep()，再使用 __serialize()' }, correct: false }
      - { text: { en: 'Neither; defining both is a syntax error.', zh: '两者都不用；同时定义会导致语法错误。' }, correct: false }
    explanation: { en: 'The modern __serialize hook takes precedence, so __sleep is ignored. Maintaining both as separate formats invites migration drift.', zh: '新式 __serialize 钩子优先，因此 __sleep 会被忽略。把两者维护成独立格式容易造成迁移漂移。' }
    difficulty: intermediate
    tags: [serialization, hook-precedence]

  - id: spot-unrestricted-call-forwarding
    type: spotbug
    prompt: { en: 'Find the interface and authorization defect in this proxy.', zh: '找出这个代理中的接口与授权缺陷。' }
    code: |
      <?php
      final class AdminProxy
      {
          public function __construct(private object $service) {}
          public function __call(string $name, array $arguments): mixed
          {
              return $this->service->$name(...$arguments);
          }
      }
    lang: php
    issues:
      - line: 7
        kind: security
        note: { en: 'Every caller-chosen name is forwarded to the service, so any public method the service gains can become reachable. Map an explicit allowlist to fixed operations and validate each argument list.', zh: '调用方选择的任意名称都会转发给服务，因此服务后来新增的任何公开方法都可能变得可达。应把明确允许列表映射到固定操作，并分别验证实参。' }
    explanation: { en: '__call defines the proxy public surface even though those names do not appear as declarations. Existence checks alone would still expose implementation rather than enforce capability policy.', zh: '__call 实际定义了代理的公开范围，即使这些名称没有出现在声明中。只做存在性检查仍会暴露实现，不能实施能力政策。' }
    difficulty: intermediate
    tags: [method-overloading, allowlist, authorization]

  - id: review-generated-order-proxy
    type: review
    prompt: { en: 'Review this generated order proxy before it reaches production.', zh: '在这个生成的订单代理进入生产环境前，对它进行审查。' }
    task: { en: 'Expose only read-only id and status fields plus a typed cancel action, keep the service and API token out of persistent state, and release resources through an explicit control-flow boundary.', zh: '只暴露只读的 id 与 status 字段以及带类型的 cancel 操作，不把服务与 API 令牌写入持久状态，并通过显式控制流边界释放资源。' }
    code: |
      <?php
      final class OrderProxy
      {
          public function __construct(
              private object $service,
              private array $data,
              private string $apiToken,
          ) {}
          public function __get(string $name): mixed
          {
              return $this->data[$name] ?? null;
          }
          public function __set(string $name, mixed $value): void
          {
              $this->data[$name] = $value;
          }
          public function __call(string $name, array $arguments): mixed
          {
              return $this->service->$name(...$arguments);
          }
          public function __serialize(): array {
              return get_object_vars($this);
          }
          public function __destruct() { $this->service->flush(); }
      }
    lang: php
    right: { en: 'The generated code keeps dynamic field data in a declared array, supplies the required magic-method parameter types, and collects serialization behavior in one visible method.', zh: '生成代码把动态字段数据放在已声明数组中，为魔术方法提供了必要的形参类型，并把序列化行为集中在一个可见方法中。' }
    checklist:
      - { en: 'Read id, status, an unknown name, and a present null value; then attempt every write.', zh: '读取 id、status、未知名称与值为 null 的已存在字段，再尝试各种写入。' }
      - { en: 'Call cancel with valid and invalid arguments, then try a service method that the proxy must not expose.', zh: '用合法与非法实参调用 cancel，再尝试一个代理不应暴露的服务方法。' }
      - { en: 'Inspect serialized bytes for the token and service, and restore a fixed old-state fixture.', zh: '检查序列化字节中是否出现令牌与服务，并恢复一个固定的旧状态夹具。' }
      - { en: 'Force normal and exceptional exits and assert explicit cleanup happens exactly once.', zh: '制造正常与异常退出，并断言显式清理恰好发生一次。' }
    issues:
      - line: 5
        kind: readability
        note: { en: 'The object type erases the service contract, so readers and tools cannot see which operation and cleanup method are required. Depend on a narrow named interface.', zh: 'object 类型抹去了服务契约，读者与工具看不到所需操作和清理方法。应依赖窄小的具名接口。' }
      - line: 11
        lines: 5
        kind: correctness
        note: { en: 'Unknown fields collapse into null and __set makes the supposedly read-only projection writable. Use one id/status allowlist, distinguish unknown names, and reject writes.', zh: '未知字段会被压成 null，__set 又让本应只读的投影可以写入。应为 id 与 status 使用同一允许列表，区分未知名称并拒绝写入。' }
      - line: 19
        kind: security
        note: { en: 'Caller-controlled names reach every public service method. Replace dynamic forwarding with a typed cancel method or an exact one-entry dispatch map.', zh: '调用方控制的名称能到达服务的每个公开方法。应改用带类型的 cancel 方法，或只含一个入口的精确分派映射。' }
      - line: 22
        kind: edge-case
        note: { en: 'The state includes the token and service; a service containing a Closure or resource may also make the round trip fail. Return only versioned id and status data and validate it on restoration.', zh: '状态包含令牌与服务；服务若含 Closure 或资源，还可能让往返失败。应只返回带版本的 id 与 status 数据，并在恢复时验证。' }
      - line: 24
        kind: performance
        note: { en: 'A flush in __destruct adds potentially blocking work at unpredictable collection or shutdown time. Provide an explicit idempotent close method and use finally.', zh: '__destruct() 中的 flush 会在不可预测的回收或关闭时刻增加可能阻塞的工作。应提供显式、幂等的 close 方法，并在 finally 中调用。' }
    explanation: { en: 'Turn the implicit surface into a narrow contract: strict field reads, no writes, one typed action, a minimal versioned state array, and explicit idempotent cleanup.', zh: '应把隐式范围改成窄小契约：严格读取字段、禁止写入、只保留一个带类型动作、使用最小版本化状态数组，并显式执行幂等清理。' }
    difficulty: advanced
    tags: [code-review, magic-methods, serialization, lifecycle]
