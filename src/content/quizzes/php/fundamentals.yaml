topic: php/fundamentals
items:
  - id: predict-truthiness-and-precedence
    type: predict
    prompt: { en: 'What two values does this program print?', zh: '这段程序会输出哪两个值？' }
    code: |
      <?php
      $quantity = '0';
      var_export((bool) $quantity);
      echo PHP_EOL;

      $allowed = true and false;
      var_export($allowed);
      echo PHP_EOL;
    lang: php
    options:
      - { text: { en: 'false, then true', zh: '先输出 false，再输出 true' }, correct: true }
      - { text: { en: 'true, then false', zh: '先输出 true，再输出 false' }, correct: false }
      - { text: { en: 'false, then false', zh: '先输出 false，再输出 false' }, correct: false }
      - { text: { en: 'true, then true', zh: '先输出 true，再输出 true' }, correct: false }
    explanation: { en: "The string '0' is false in Boolean context. Assignment has higher precedence than and, so true is assigned before the complete logical expression becomes false.", zh: "字符串 '0' 在布尔上下文中为 false。赋值的优先级高于 and，因此代码先把 true 赋给变量，完整逻辑表达式才得到 false。" }
    difficulty: beginner
    tags: [truthiness, precedence, assignment]

  - id: predict-match-strictness
    type: predict
    prompt: { en: 'Which label does this match expression print?', zh: '这个 match 表达式会输出哪个标签？' }
    code: |
      <?php
      $statusCode = '0';

      $label = match ($statusCode) {
          0 => 'integer-zero',
          '0' => 'string-zero',
          default => 'other',
      };

      echo $label, PHP_EOL;
    lang: php
    options:
      - { text: { en: 'string-zero', zh: 'string-zero' }, correct: true }
      - { text: { en: 'integer-zero', zh: 'integer-zero' }, correct: false }
      - { text: { en: 'other', zh: 'other' }, correct: false }
    explanation: { en: "match uses strict comparison, so the string '0' does not select the integer 0 arm. It selects the string arm.", zh: "match 使用严格比较，因此字符串 '0' 不会选择整数 0 分支，而会选择字符串分支。" }
    difficulty: beginner
    tags: [match, strict-comparison, control-flow]

  - id: spotbug-switch-fallthrough
    type: spotbug
    prompt: { en: 'Why does labelStatus paid return closed?', zh: '为什么 labelStatus 传入 paid 时会返回 closed？' }
    code: |
      <?php
      function labelStatus(string $status): string
      {
          $label = 'unknown';
          switch ($status) {
              case 'paid':
                  $label = 'ready';
              case 'cancelled':
                  $label = 'closed';
                  break;
          }
          return $label;
      }
    lang: php
    issues:
      - line: 8
        kind: correctness
        note: { en: "The paid case has no break, so execution falls through and overwrites ready with closed in the cancelled case.", zh: "paid 分支缺少 break，因此执行会贯穿到 cancelled 分支，用 closed 覆盖 ready。" }
    explanation: { en: 'Add break after the paid assignment, return directly from each case, or use a match expression when the construct should produce one value.', zh: '可以在 paid 赋值后添加 break、从每个分支直接返回，或在结构需要产生一个值时改用 match。' }
    difficulty: beginner
    tags: [switch, fall-through, control-flow]

  - id: evaluation-order-contract
    type: mcq
    prompt: { en: 'What does PHP operator precedence guarantee?', zh: 'PHP 的运算符优先级能保证什么？' }
    options:
      - { text: { en: 'It determines how operators and operands are grouped, not the general order in which subexpressions run.', zh: '它决定运算符与操作数如何分组，不决定子表达式的一般运行顺序。' }, correct: true }
      - { text: { en: 'It guarantees that every subexpression runs from left to right.', zh: '它保证所有子表达式都从左到右运行。' }, correct: false }
      - { text: { en: 'It affects only arithmetic and never assignment or logic.', zh: '它只影响算术，不影响赋值或逻辑运算。' }, correct: false }
      - { text: { en: 'It is ignored whenever parentheses appear anywhere in the expression.', zh: '表达式中只要出现括号，所有优先级规则都会被忽略。' }, correct: false }
    explanation: { en: 'Precedence and associativity define grouping. Side effects that require an order should be split into separate statements, except where an operator explicitly promises conditional evaluation.', zh: '优先级与结合方向定义表达式分组。除了运算符明确承诺条件求值的情况，需要固定顺序的副作用应拆成独立语句。' }
    difficulty: intermediate
    tags: [operator-precedence, evaluation-order, side-effects]

  - id: review-generated-order-list
    type: review
    prompt: { en: 'Review this generated HTML renderer before it receives customer-controlled orders.', zh: '在这个生成的 HTML 渲染函数接收客户订单前，对它进行审查。' }
    task: { en: "Render only paid orders as an HTML list, preserve the valid ID '0', do not mutate the input or global state, and encode customer-controlled IDs for HTML text.", zh: "只把已付款订单渲染成 HTML 列表，保留合法 ID '0'，不修改输入或全局状态，并按 HTML 文本规则编码客户提供的 ID。" }
    code: |
      <?php
      function renderPaidOrders(array $orders): string
      {
          global $published;

          $html = '<ul>';
          foreach ($orders as &$order) {
              if (!$order['id']) {
                  continue;
              }

              if ($order['state'] = 'paid') {
                  $published[] = $order['id'];
                  $html .= '<li>' . $order['id'] . '</li>';
              }
          }

          return $html . '</ul>';
      }

      $published = [];
      echo renderPaidOrders($orders);
    lang: php
    right: { en: 'The generated function has a named string result, keeps markup construction in one place, and uses a loop that makes the intended per-order decision visible.', zh: '生成函数有明确的字符串返回类型，把标记构造集中在一处，并用循环展示逐个订单作出决定的意图。' }
    checklist:
      - { en: "Test IDs '0', an empty string, ordinary text, and text containing <, >, &, and quotes.", zh: "测试 ID '0'、空字符串、普通文本，以及包含 <、>、& 和引号的文本。" }
      - { en: 'Snapshot the input and global state before the call, then assert that neither changes.', zh: '调用前保存输入与全局状态快照，再断言两者都没有变化。' }
      - { en: 'Test paid, cancelled, missing, and unknown state values.', zh: '测试 paid、cancelled、缺失和未知状态值。' }
      - { en: 'Parse the returned HTML and verify that only paid IDs appear as text nodes.', zh: '解析返回的 HTML，并确认只有已付款订单 ID 作为文本节点出现。' }
    issues:
      - line: 4
        kind: readability
        note: { en: 'The hidden global write is absent from the function signature and gives the renderer a second, unrelated responsibility.', zh: '隐藏的全局写入没有出现在函数签名中，也让渲染函数承担了第二项无关职责。' }
      - line: 7
        kind: edge-case
        note: { en: 'Reference iteration is unnecessary and leaves the loop variable bound to the final element; the assignment below also mutates caller data through that reference.', zh: '这里不需要引用遍历，而且循环变量会继续绑定最后一个元素；后面的赋值还会通过引用修改调用方数据。' }
      - line: 8
        lines: 5
        kind: correctness
        note: { en: "The truthiness check drops valid ID '0', while the assignment in the state condition changes every remaining order to paid instead of comparing its state.", zh: "真值检查会丢弃合法 ID '0'，状态条件中的赋值则会把其余每个订单都改成 paid，而不是比较状态。" }
      - line: 14
        kind: security
        note: { en: 'A customer-controlled ID is inserted into HTML without context-appropriate encoding, so markup can be injected.', zh: '客户提供的 ID 未经符合上下文的编码就进入 HTML，因此可能注入标记。' }
    explanation: { en: 'Use value iteration, strict state comparison, explicit ID validation, and htmlspecialchars with ENT_QUOTES and a declared UTF-8 encoding. Remove the global publication list from this renderer.', zh: '应使用值遍历、严格状态比较、明确的 ID 验证，并以 ENT_QUOTES 和指定的 UTF-8 编码调用 htmlspecialchars；同时从渲染函数中移除全局发布列表。' }
    difficulty: advanced
    tags: [code-review, control-flow, references, html-encoding]
