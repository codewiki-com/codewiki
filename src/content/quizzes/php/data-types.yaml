topic: php/data-types
items:
  - id: predict-truthiness-and-equality
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      <?php
      var_export((bool) '0');
      echo PHP_EOL;
      var_export((bool) '00');
      echo PHP_EOL;
      var_export('10' == 10);
      echo PHP_EOL;
      var_export('10' === 10);
      echo PHP_EOL;
    lang: php
    options:
      - { text: { en: 'false, true, true, false', zh: 'false、true、true、false' }, correct: true }
      - { text: { en: 'true, true, true, false', zh: 'true、true、true、false' }, correct: false }
      - { text: { en: 'false, false, false, false', zh: 'false、false、false、false' }, correct: false }
      - { text: { en: 'false, true, false, true', zh: 'false、true、false、true' }, correct: false }
    explanation: { en: "String '0' is false in Boolean context, while '00' is true. Loose equality converts the numeric string, but strict equality also compares its type.", zh: "字符串 '0' 在布尔上下文中为 false，而 '00' 为 true。宽松比较会转换数字字符串，全等比较还会检查类型。" }
    difficulty: beginner
    tags: [truthiness, comparison, coercion]

  - id: predict-dynamic-variable-type
    type: predict
    prompt: { en: 'Which two type names are printed?', zh: '程序会输出哪两个类型名称？' }
    code: |
      <?php
      $reference = 42;
      echo get_debug_type($reference), PHP_EOL;
      $reference = '42';
      echo get_debug_type($reference), PHP_EOL;
    lang: php
    options:
      - { text: { en: 'int, then string', zh: '先输出 int，再输出 string' }, correct: true }
      - { text: { en: 'int, then int', zh: '先输出 int，再输出 int' }, correct: false }
      - { text: { en: 'integer, then numeric-string', zh: '先输出 integer，再输出 numeric-string' }, correct: false }
    explanation: { en: 'The current value carries the runtime type; a variable name is not permanently typed. get_debug_type uses int for the first value and string for the second.', zh: '运行时类型属于当前值，变量名不会永久绑定一种类型。get_debug_type 对第一个值返回 int，对第二个值返回 string。' }
    difficulty: beginner
    tags: [runtime-types, dynamic-typing]

  - id: spotbug-cast-before-validation
    title: { en: 'Spot the bug in the quantity parser', zh: '找出数量解析器里的 bug' }
    type: spotbug
    prompt: { en: 'Find why this request parser accepts missing and malformed quantities as valid data.', zh: '找出这个请求解析器为何会把缺失和格式错误的数量当作有效数据。' }
    code: |
      <?php
      function requestQuantity(array $input): int
      {
          return (int) ($input['quantity'] ?? null);
      }
    lang: php
    issues:
      - line: 4
        kind: correctness
        note: { en: 'The null coalescing expression and integer cast collapse a missing value and many invalid representations to 0, so the original error cannot be detected afterward.', zh: '空合并表达式与整数强制转换会把缺失值和多种非法表示压成 0，之后已经无法识别原始错误。' }
    explanation: { en: 'Check key presence, accepted raw types, integer syntax, and range before returning an int. Casting produces a type; it does not validate the source representation.', zh: '应先检查键存在性、允许的原始类型、整数格式和范围，再返回 int。强制转换只产生一种类型，不会验证来源表示。' }
    difficulty: beginner
    tags: [casting, input-validation, missing-values]

  - id: strict-types-call-site
    type: mcq
    prompt: { en: 'A function is declared in a file that has strict_types=1, but a non-strict file calls it with numeric strings for int parameters. Which rule applies?', zh: '函数定义在启用 strict_types=1 的文件中，但一个非严格文件用数字字符串调用其 int 参数。此时采用哪条规则？' }
    options:
      - { text: { en: "The caller's coercive rule applies, so the strings may be converted before entry.", zh: '采用调用方的强制转换规则，因此字符串可能在进入函数前被转换。' }, correct: true }
      - { text: { en: 'The declaration file forces strict arguments for every caller.', zh: '定义文件会强制所有调用方使用严格参数检查。' }, correct: false }
      - { text: { en: 'strict_types affects return values only.', zh: 'strict_types 只影响返回值。' }, correct: false }
      - { text: { en: 'PHP ignores scalar declarations across files.', zh: 'PHP 会忽略跨文件的标量声明。' }, correct: false }
    explanation: { en: 'For user-defined function arguments, strictness follows the file where the call occurs. Libraries still need explicit parsing at external boundaries.', zh: '对于用户定义函数的参数，严格性取决于调用发生的文件。库仍需在外部边界执行明确解析。' }
    difficulty: intermediate
    tags: [strict-types, call-site, scalar-types]

  - id: iterable-runtime-type
    type: mcq
    prompt: { en: 'What does an iterable parameter declaration guarantee?', zh: 'iterable 参数声明能保证什么？' }
    options:
      - { text: { en: 'The value is an array or implements Traversable.', zh: '该值是数组，或实现了 Traversable。' }, correct: true }
      - { text: { en: 'get_debug_type will return iterable.', zh: 'get_debug_type 会返回 iterable。' }, correct: false }
      - { text: { en: 'Every yielded element has the same runtime type.', zh: '每个产出元素都有相同的运行时类型。' }, correct: false }
      - { text: { en: 'The iterator can be rewound more than once.', zh: '该迭代器可以多次回退到开头。' }, correct: false }
    explanation: { en: 'iterable is a declaration-level capability set covering arrays and Traversable objects. It does not constrain element types or iterator reuse.', zh: 'iterable 是声明层面的能力集合，覆盖数组与 Traversable 对象；它不约束元素类型，也不保证迭代器可重复使用。' }
    difficulty: beginner
    tags: [iterable, declarations, traversable]

  - id: review-generated-order-input
    title: { en: 'Review generated order input mapper', zh: '审查生成的订单输入映射器' }
    type: review
    prompt: { en: 'Review this generated request mapper before it handles customer-controlled data.', zh: '在这个生成的请求映射器处理客户数据前，对它进行审查。' }
    task: { en: "Accept only quantity, express, and coupon_id; require a nonnegative integer quantity, parse a Boolean or the strings 'true'/'false', preserve a missing coupon as null, and reject unknown fields.", zh: "只接受 quantity、express 和 coupon_id；要求 quantity 是非负整数，解析布尔值或字符串 'true'/'false'，让缺失的优惠券保持 null，并拒绝未知字段。" }
    code: |
      <?php
      final class OrderInput
      {
          public int $quantity;
          public bool $express;
          public ?int $couponId = null;

          public static function fromArray(array $input): self
          {
              $order = new self();
              foreach ($input as $field => $value) {
                  $order->$field = $value;
              }

              $order->quantity = (int) ($input['quantity'] ?? null);
              $order->express = (bool) ($input['express'] ?? false);
              $order->couponId = (int) ($input['coupon_id'] ?? null);
              return $order;
          }
      }
    lang: php
    right: { en: 'The generated class names its three intended values with typed properties and keeps the boundary mapping in one factory method.', zh: '生成代码用带类型的属性为三个目标值命名，并把边界映射集中在一个工厂方法中。' }
    checklist:
      - { en: 'Test missing, malformed, zero, negative, and out-of-range quantities.', zh: '测试缺失、格式错误、零值、负值和越界的数量。' }
      - { en: "Test Boolean true/false and strings 'true', 'false', '0', and '1'.", zh: "测试布尔值 true、false，以及字符串 'true'、'false'、'0' 和 '1'。" }
      - { en: 'Assert that missing coupon_id remains null and an invalid one is rejected.', zh: '断言缺失的 coupon_id 保持 null，非法值会被拒绝。' }
      - { en: 'Send an unknown or privileged field and verify that it is rejected.', zh: '发送未知字段或特权字段，并验证它会被拒绝。' }
    issues:
      - line: 11
        kind: readability
        note: { en: 'Iterating over a broad array hides the accepted input shape and duplicates the explicit mapping that follows.', zh: '遍历宽泛数组会隐藏允许的输入形状，也与后面的显式映射重复。' }
      - line: 12
        kind: security
        note: { en: 'Dynamic assignment accepts every customer-supplied field instead of enforcing the allowlist, enabling over-posting and dynamic properties.', zh: '动态赋值接受客户提供的所有字段，没有执行允许列表，可能造成过度提交与动态属性。' }
      - line: 15
        kind: correctness
        note: { en: 'A missing or malformed quantity can become 0, and the required nonnegative-integer contract is never validated.', zh: '缺失或格式错误的 quantity 可能变成 0，而且代码从未验证必填的非负整数契约。' }
      - line: 16
        lines: 2
        kind: edge-case
        note: { en: "Boolean casting turns string 'false' into true, while casting a missing coupon turns null into 0 instead of preserving absence.", zh: "布尔强制转换会把字符串 'false' 变成 true，而对缺失优惠券的强制转换会把 null 变成 0，未能保留缺失状态。" }
    explanation: { en: 'Allowlist keys first, validate each raw representation without lossy casts, and construct the typed object only after every field has a defined domain value.', zh: '应先执行键允许列表，不使用丢失信息的强制转换来验证每种原始表示，并且只在所有字段都有明确领域值后构造带类型对象。' }
    difficulty: advanced
    tags: [code-review, input-validation, casting, over-posting]
