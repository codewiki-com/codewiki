topic: php/exceptions
items:
  - id: predict-first-matching-catch
    type: predict
    prompt: { en: 'Which line does this program print?', zh: '这段程序会输出哪一行？' }
    code: |
      <?php
      final class StockFailure extends RuntimeException {}
      try {
          throw new StockFailure('empty');
      } catch (StockFailure $error) {
          echo "specific\n";
      } catch (RuntimeException $error) {
          echo "broad\n";
      }
    lang: php
    options:
      - { text: { en: 'specific', zh: 'specific' }, correct: true }
      - { text: { en: 'broad', zh: 'broad' }, correct: false }
      - { text: { en: 'specific, then broad', zh: '先输出specific，再输出broad' }, correct: false }
      - { text: { en: 'Nothing; the exception remains uncaught.', zh: '没有输出，异常仍未捕获。' }, correct: false }
    explanation: { en: 'PHP runs only the first compatible catch. StockFailure matches its own handler before the RuntimeException parent handler is considered.', zh: 'PHP只运行第一个匹配的catch。StockFailure先匹配自身类型的处理器，不会再进入RuntimeException父类处理器。' }
    difficulty: beginner
    tags: [catch-order, inheritance, predict-output]

  - id: predict-finally-before-return
    type: predict
    prompt: { en: 'In what order are the three words printed?', zh: '三个单词会按什么顺序输出？' }
    code: |
      <?php
      function result(): string
      {
          try {
              echo "try\n";
              return 'done';
          } finally {
              echo "finally\n";
          }
      }
      echo result(), "\n";
    lang: php
    options:
      - { text: { en: 'try, finally, done', zh: 'try、finally、done' }, correct: true }
      - { text: { en: 'try, done, finally', zh: 'try、done、finally' }, correct: false }
      - { text: { en: 'finally, try, done', zh: 'finally、try、done' }, correct: false }
      - { text: { en: 'try, done', zh: 'try、done' }, correct: false }
    explanation: { en: 'The return expression is evaluated in try, but the function does not return until finally has run. Because finally has no return, the pending value remains done.', zh: 'return表达式在try中求值，但函数要等finally执行后才真正返回。finally没有return，因此待返回值仍是done。' }
    difficulty: beginner
    tags: [finally, return, predict-output]

  - id: throwable-covers-two-branches
    type: mcq
    prompt: { en: 'Which catch type can receive both a thrown RuntimeException and an engine TypeError?', zh: '哪个catch类型既能接收抛出的RuntimeException，也能接收引擎产生的TypeError？' }
    options:
      - { text: { en: 'Exception', zh: 'Exception' }, correct: false }
      - { text: { en: 'RuntimeException', zh: 'RuntimeException' }, correct: false }
      - { text: { en: 'Error', zh: 'Error' }, correct: false }
      - { text: { en: 'Throwable', zh: 'Throwable' }, correct: true }
    explanation: { en: 'Exception and Error are the two direct branches under Throwable. RuntimeException belongs only to the Exception branch, while TypeError belongs to Error.', zh: 'Exception与Error是Throwable之下的两个直接分支。RuntimeException只属于Exception分支，TypeError则属于Error分支。' }
    difficulty: beginner
    tags: [throwable, exception, error]

  - id: spot-missed-error-and-cleanup
    title: { en: 'Spot the bug in import cleanup', zh: '找出导入清理里的bug' }
    type: spotbug
    prompt: { en: 'Find why the TypeError escapes the handler and why cleanup is not guaranteed.', zh: '找出TypeError为何逃过处理器，以及清理为何没有保证。' }
    code: |
      <?php
      function importRow(array $row): void
      {
          $stream = fopen('php://temp', 'w+');
          try {
              strlen($row);
          } catch (Exception $error) {
              echo "invalid row\n";
          }
          fwrite($stream, 'done');
          fclose($stream);
      }
    lang: php
    issues:
      - line: 7
        kind: correctness
        note: { en: 'strlen(array) throws TypeError, which is an Error rather than an Exception. Catch TypeError if it is expected, or catch Throwable only at a genuine outer boundary.', zh: 'strlen(array) 抛出TypeError，它属于Error而不是Exception。若这是预期失败，应捕获TypeError；只有真正的外层边界才应捕获Throwable。' }
      - line: 11
        kind: edge-case
        note: { en: 'fclose is after code that can throw, so this scope does not close its stream on failure. Put resource release in finally after confirming acquisition succeeded.', zh: 'fclose位于可能抛出的代码之后，因此失败时本作用域不会关闭流。确认资源取得成功后，应在finally中释放它。' }
    explanation: { en: 'Catch scope and resource cleanup are separate decisions. A narrow handler can coexist with a finally block that always releases the resource owned by the function.', zh: '捕获范围与资源清理是两个独立决定。函数可以使用窄类型处理器，同时用finally始终释放自己拥有的资源。' }
    difficulty: intermediate
    tags: [type-error, finally, resource-ownership, code-review]

  - id: preserve-original-cause
    type: mcq
    prompt: { en: 'Which expression wraps $error while preserving it as the programmatic cause?', zh: '哪个表达式会包装 $error，并把它保留为可编程访问的原因？' }
    options:
      - { text: { en: 'throw new OrderException($error->getMessage());', zh: 'throw new OrderException($error->getMessage());' }, correct: false }
      - { text: { en: 'throw new OrderException("Order failed", 0, $error);', zh: 'throw new OrderException("Order failed", 0, $error);' }, correct: true }
      - { text: { en: 'throw new OrderException((string) $error);', zh: 'throw new OrderException((string) $error);' }, correct: false }
      - { text: { en: 'throw new OrderException("Order failed", $error->getCode());', zh: 'throw new OrderException("Order failed", $error->getCode());' }, correct: false }
    explanation: { en: 'The third Exception constructor argument is $previous. Copying text or an integer code does not retain the original object, type, and cause link.', zh: 'Exception构造器的第三个参数是 $previous。复制文本或整数代码，并不会保留原对象、类型与原因关系。' }
    difficulty: intermediate
    tags: [exception-chain, previous, wrapping]

  - id: review-generated-payment-boundary
    title: { en: 'Review generated payment boundary', zh: '审查生成的支付边界' }
    type: review
    prompt: { en: 'Review this generated checkout boundary before it handles payment requests.', zh: '在这段生成的结账边界处理支付请求前，对它进行审查。' }
    task: { en: 'Require a positive integer amount, avoid holding a database transaction during the gateway call, roll back on every Throwable after the transaction starts, log no secrets, and preserve the cause when translating failure.', zh: '要求金额为正整数；调用网关时不要持有数据库事务；事务开始后遇到任何Throwable都要回滚；日志不得包含秘密；转换失败时要保留原因。' }
    code: |
      <?php
      final class PaymentGateway {
          public function charge(int $cents, string $token): string {
              return 'PAY-7';
          }
      }
      function checkout(PDO $db, PaymentGateway $gateway, array $request): string
      {
          $db->beginTransaction();
          try {
              $amount = (int) ($request['amount_cents'] ?? 0);
              $paymentId = $gateway->charge($amount, $request['token']);
              $db->commit();
              return $paymentId;
          } catch (Exception $error) {
              $db->rollBack();
              error_log($error->getMessage() . ' token=' . $request['token']);
              throw new RuntimeException('Checkout failed');
          }
      }
    lang: php
    right: { en: 'The generated code has one visible transaction scope, commits only after the charge succeeds, returns an opaque payment identifier, and translates the low-level failure before it leaves checkout.', zh: '生成代码给出了可见的事务范围，只在扣款成功后提交，返回不透明的支付标识，并在底层失败离开checkout前进行转换。' }
    issues:
      - line: 11
        kind: edge-case
        note: { en: 'The cast merges missing, malformed, zero, and negative amounts into values passed to the gateway. Validate that the raw field is an integer greater than zero before opening the transaction.', zh: '强制转换会把字段缺失、格式错误、零值与负数金额变成继续传给网关的值。开始事务前应验证原始字段是大于零的整数。' }
      - line: 12
        kind: performance
        note: { en: 'The external gateway call runs while the database transaction is open, extending lock time across network latency. Charge before the narrow database transaction or use an explicit durable payment workflow.', zh: '调用外部网关时数据库事务仍然打开，网络延迟会延长锁持有时间。应在短数据库事务前完成扣款，或使用明确的持久化支付工作流。' }
      - line: 15
        kind: correctness
        note: { en: 'Catching Exception misses Error subclasses such as TypeError, so they bypass rollback after the transaction starts. This transaction boundary must catch Throwable.', zh: '捕获Exception会漏掉TypeError等Error子类，使它们在事务开始后绕过回滚。这个事务边界必须捕获Throwable。' }
      - line: 17
        kind: security
        note: { en: 'The log records a payment token. Log an allowlisted event code, correlation ID, exception class, and safe identifiers; never include credentials or raw request fields.', zh: '日志记录了支付令牌。应只记录允许列表中的事件码、关联ID、异常类和安全标识，绝不能包含凭据或原始请求字段。' }
      - line: 18
        kind: readability
        note: { en: 'The wrapper omits $error as its third argument, so the diagnostic chain disappears from the public failure object. Pass the original cause to make the translation visible and traceable.', zh: '包装器没有把 $error作为第三个参数，公开失败对象中的诊断链因此消失。应传入原始原因，让转换关系可见且可追踪。' }
    checklist:
      - { en: 'Test missing, string, zero, negative, and positive-integer amounts before any side effect.', zh: '在发生任何副作用前，测试金额缺失、字符串、零值、负数和正整数。' }
      - { en: 'Make the gateway throw both an Exception and a TypeError, then assert transaction state.', zh: '让网关分别抛出Exception和TypeError，再断言事务状态。' }
      - { en: 'Assert the exact log fields and the absence of tokens and raw request data.', zh: '断言准确的日志字段，并确认令牌与原始请求数据均不存在。' }
      - { en: 'Traverse getPrevious() and confirm the translated exception retains the gateway failure.', zh: '遍历getPrevious()，确认转换后的异常仍保留网关失败。' }
    explanation: { en: 'Validate before side effects, keep database transactions short, catch Throwable at the transaction boundary, redact logs, and pass the original failure as $previous. These are independent properties and need separate tests.', zh: '应在副作用前验证输入，缩短数据库事务，在事务边界捕获Throwable，对日志脱敏，并把原始失败作为 $previous。它们是相互独立的属性，需要分别测试。' }
    difficulty: advanced
    tags: [exceptions, transactions, code-review, security, payment]
