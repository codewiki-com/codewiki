topic: php/php8-features
items:
  - id: predict-match-strict-types
    type: predict
    prompt: { en: 'What four lines does this program print?', zh: '这段程序会输出哪四行？' }
    code: |
      <?php
      declare(strict_types=1);
      function label(int|string $value): string
      {
          return match ($value) {
              0 => 'integer-zero',
              '0' => 'string-zero',
              default => 'other',
          };
      }
      echo label(0), PHP_EOL;
      echo label('0'), PHP_EOL;
      echo label(1), PHP_EOL;
      echo label('1'), PHP_EOL;
    lang: php
    options:
      - { text: { en: 'integer-zero, string-zero, other, other', zh: 'integer-zero、string-zero、other、other' }, correct: true }
      - { text: { en: 'integer-zero, integer-zero, other, other', zh: 'integer-zero、integer-zero、other、other' }, correct: false }
      - { text: { en: 'string-zero, string-zero, other, other', zh: 'string-zero、string-zero、other、other' }, correct: false }
      - { text: { en: 'It throws TypeError for the string calls.', zh: '字符串调用会抛出 TypeError。' }, correct: false }
    explanation: { en: 'The union accepts both types, and match compares each subject with arm conditions using ===. Acceptance by a union does not coerce the two representations into one.', zh: '联合类型接受两种类型，而 match 使用 === 比较主题值与分支条件。联合类型允许两种表示，不会把它们转换成同一种表示。' }
    difficulty: beginner
    tags: [union-type, match, strict-comparison]

  - id: named-argument-compatibility
    type: mcq
    prompt: { en: 'A public method changes its parameter from $includeTax to $withTax without changing position or type. Which existing call can break?', zh: '公开方法把形参从 $includeTax 改名为 $withTax，但位置和类型不变。哪个现有调用可能失败？' }
    options:
      - { text: { en: 'total(includeTax: true)', zh: 'total(includeTax: true)' }, correct: true }
      - { text: { en: 'total(true)', zh: 'total(true)' }, correct: false }
      - { text: { en: 'call_user_func([$invoice, ''total''], true)', zh: 'call_user_func([$invoice, ''total''], true)' }, correct: false }
      - { text: { en: '$callback(true)', zh: '$callback(true)' }, correct: false }
    explanation: { en: 'A named call binds the textual parameter name, so a rename changes that call contract. Positional calls bind by order and remain unaffected by this rename alone.', zh: '命名调用按形参的文本名称绑定，因此改名会改变调用契约。位置调用按顺序绑定，仅改名不会影响这些调用。' }
    difficulty: intermediate
    tags: [named-arguments, compatibility, api-design]

  - id: spot-nullsafe-middle-hop
    title: { en: 'Spot the bug in the optional chain', zh: '找出可选链里的 bug' }
    type: spotbug
    prompt: { en: 'Find why destination() can still warn when an Order object exists.', zh: '找出 destination() 在 Order 对象存在时仍可能产生警告的原因。' }
    code: |
      <?php
      final class Address
      {
          public function __construct(public string $city) {}
      }
      final class Customer
      {
          public function __construct(public ?Address $address = null) {}
      }
      final class Order
      {
          public function __construct(public ?Customer $customer = null) {}
      }
      function destination(?Order $order): string
      {
          return $order?->customer->address?->city ?? 'pickup';
      }
    lang: php
    issues:
      - line: 16
        kind: correctness
        note: { en: 'customer is independently nullable, so accessing ->address on null is not protected. Use $order?->customer?->address?->city before applying the business default.', zh: 'customer 本身也可以为 null，直接在 null 上访问 ->address 不受保护。应先写成 $order?->customer?->address?->city，再应用业务默认值。' }
    explanation: { en: 'Each independently nullable hop needs its own ?->. A nullsafe operator earlier in the expression does not make every later ordinary dereference safe.', zh: '每个独立可空的步骤都需要自己的 ?->。表达式前方出现 nullsafe 运算符，不会自动保护后续每次普通解引用。' }
    difficulty: intermediate
    tags: [nullsafe-operator, nullable, object-chain]

  - id: attributes-execution-model
    type: mcq
    prompt: { en: 'What makes #[RequiresRole(''admin'')] enforce authorization in PHP?', zh: '在 PHP 中，什么会让 #[RequiresRole(''admin'')] 真正执行授权？' }
    options:
      - { text: { en: 'Application code that reflects, instantiates, and applies the metadata', zh: '通过反射读取、实例化并应用元数据的应用代码' }, correct: true }
      - { text: { en: 'The PHP engine immediately calling the attribute constructor on every request', zh: 'PHP 引擎在每次请求中自动调用特性构造器' }, correct: false }
      - { text: { en: 'The Attribute::TARGET_METHOD flag by itself', zh: '仅靠 Attribute::TARGET_METHOD 标志' }, correct: false }
      - { text: { en: 'The presence of any ReflectionMethod object', zh: '只要存在任意 ReflectionMethod 对象' }, correct: false }
    explanation: { en: 'An attribute is metadata. A consumer must read and interpret it; target flags constrain placement but do not implement the policy.', zh: '特性只是元数据，必须由消费者读取并解释。目标标志只约束放置位置，不会实现策略。' }
    difficulty: beginner
    tags: [attributes, reflection, authorization]

  - id: promoted-property-assignment
    type: mcq
    prompt: { en: 'When can a promoted property be read through $this inside its constructor?', zh: '提升属性何时可以在构造器主体中通过 $this 读取？' }
    options:
      - { text: { en: 'From the start of the constructor body, after automatic assignment', zh: '构造器主体开始执行时，此时自动赋值已经完成' }, correct: true }
      - { text: { en: 'Only after assigning it manually in the constructor body', zh: '只有在构造器主体中手动赋值后' }, correct: false }
      - { text: { en: 'Only after the constructor returns', zh: '只有构造器返回后' }, correct: false }
      - { text: { en: 'Only when the property is public', zh: '只有属性为 public 时' }, correct: false }
    explanation: { en: 'Promotion declares the property and assigns the argument before the constructor body executes. The body can therefore validate invariants using the promoted property.', zh: '属性提升会声明属性，并在构造器主体执行前把实参赋给属性。因此，主体可以使用提升属性校验不变量。' }
    difficulty: intermediate
    tags: [constructor-property-promotion, initialization, invariants]

  - id: review-generated-shipping-quote
    title: { en: 'Review generated shipping quote', zh: '审查生成的运费报价' }
    type: review
    prompt: { en: 'Review this generated shipping quote handler before it is used by an HTTP endpoint.', zh: '在这段生成的运费报价处理器用于 HTTP 端点前，对它进行审查。' }
    task: { en: 'Accept a validated positive weight and a known local or remote zone, enforce the staff role declared in metadata, and return a quote without repeated reflection on every request.', zh: '接收经过验证的正数重量与已知的 local 或 remote 区域，执行元数据声明的 staff 角色，并返回报价，同时避免每次请求重复反射。' }
    code: |
      <?php
      #[Attribute(Attribute::TARGET_METHOD)]
      final class RequiresRole {
          public function __construct(public string $role) {}
      }
      final class QuoteRequest {
          public function __construct(public int|float $weight, public string $zone) {}
      }
      final class ShippingController {
          #[RequiresRole('staff')]
          public function quote(array $payload, string $actorRole): string {
              $method = new ReflectionMethod($this, __FUNCTION__);
              $required = $method->getAttributes(RequiresRole::class)[0]->newInstance();
              $request = new QuoteRequest(weight: $payload['weight'], zone: $payload['zone']);
              $rate = match ($request->zone) {
                  'local' => 1.2,
                  default => 2.0,
              };
              return number_format($request->weight * $rate, 2, '.', '');
          }
      }
    lang: php
    right: { en: 'The generated code uses a typed request object, a target-restricted attribute, named construction, strict match semantics, and a deterministic decimal output format.', zh: '生成代码使用了带类型请求对象、受目标限制的特性、命名构造、严格的 match 语义和确定的小数输出格式。' }
    checklist:
      - { en: 'Test missing, wrong-type, zero, negative, infinite, and valid weights at the HTTP boundary.', zh: '在 HTTP 边界测试重量缺失、类型错误、零、负数、无穷值和合法值。' }
      - { en: 'Test local, remote, missing, case-varied, and unknown zone values.', zh: '测试 local、remote、缺失、大小写变化和未知区域值。' }
      - { en: 'Call through the real dispatcher with allowed and denied actor roles.', zh: '通过真实调度器分别使用允许和拒绝的调用者角色进行调用。' }
      - { en: 'Measure or cache reflection during dispatcher compilation, not inside the business method.', zh: '在调度器编译阶段测量或缓存反射，不要在业务方法内部重复执行。' }
    issues:
      - line: 7
        kind: edge-case
        note: { en: 'The union accepts zero, negative, INF, and NAN weights. Validate a finite positive value before constructing the request.', zh: '联合类型仍接受零、负数、INF 和 NAN。构造请求前必须校验为有限正数。' }
      - line: 12
        kind: performance
        note: { en: 'The hot method reflects and instantiates identical metadata on every call. The dispatcher can compile or cache role metadata once.', zh: '这个热点方法在每次调用时都反射并实例化相同元数据。调度器可以只编译或缓存一次角色元数据。' }
      - line: 13
        kind: security
        note: { en: 'The code reads the required role but never compares it with actorRole, so the attribute provides no authorization.', zh: '代码读取了所需角色，却从未与 actorRole 比较，因此这个特性没有提供任何授权。' }
      - line: 14
        kind: correctness
        note: { en: 'Raw payload fields are passed directly into strict typed parameters. Missing keys warn, and form-style numeric strings produce TypeError instead of a deliberate validation response.', zh: '原始载荷字段被直接传给严格类型形参。字段缺失会产生警告，表单中的数字字符串会触发 TypeError，而不是明确的校验响应。' }
      - line: 17
        kind: readability
        note: { en: 'default silently combines remote, misspelled, missing, and future zones. List local and remote explicitly and reject unknown input before match.', zh: 'default 静默合并了 remote、拼写错误、缺失和未来区域。应显式列出 local 与 remote，并在进入 match 前拒绝未知输入。' }
    explanation: { en: 'Validate and normalize the HTTP payload first, enforce role metadata in the dispatcher, cache compiled reflection metadata, and keep match arms explicit for the closed zone set.', zh: '应先验证并规范化 HTTP 载荷，在调度器中执行角色元数据，缓存编译后的反射元数据，并为封闭的区域集合显式列出 match 分支。' }
    difficulty: advanced
    tags: [code-review, attributes, union-types, match, security]
