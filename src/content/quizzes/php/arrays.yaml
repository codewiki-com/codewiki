topic: php/arrays
items:
  - id: predict-normalized-keys
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      <?php
      $labels = [];
      $labels['8'] = 'string';
      $labels[8] = 'integer';
      $labels['08'] = 'leading';
      echo count($labels), ':', $labels[8], ':', $labels['08'], PHP_EOL;
    lang: php
    options:
      - { text: { en: '3:string:leading', zh: '3:string:leading' }, correct: false }
      - { text: { en: '3:integer:leading', zh: '3:integer:leading' }, correct: false }
      - { text: { en: '2:integer:leading', zh: '2:integer:leading' }, correct: true }
      - { text: { en: 'It throws because string keys cannot contain digits.', zh: '程序会抛出异常，因为字符串键不能包含数字。' }, correct: false }
    explanation: { en: "The valid decimal key '8' normalizes to integer 8, so the second write replaces it. The leading-zero key '08' remains a distinct string.", zh: "有效十进制键 '8' 会规范化为整数8，因此第二次写入会覆盖它；带前导零的键 '08' 仍是独立字符串。" }
    difficulty: beginner
    tags: [arrays, keys, normalization, predict-output]

  - id: predict-unset-and-append
    type: predict
    prompt: { en: 'What JSON does this program print?', zh: '这段程序会输出什么JSON？' }
    code: |
      <?php
      $steps = ['draft', 'review', 'publish'];
      unset($steps[1]);
      $steps[] = 'archive';
      echo json_encode($steps), PHP_EOL;
    lang: php
    options:
      - { text: { en: '["draft","publish","archive"]', zh: '["draft","publish","archive"]' }, correct: false }
      - { text: { en: '{"0":"draft","2":"publish","3":"archive"}', zh: '{"0":"draft","2":"publish","3":"archive"}' }, correct: true }
      - { text: { en: '{"0":"draft","1":"archive","2":"publish"}', zh: '{"0":"draft","1":"archive","2":"publish"}' }, correct: false }
    explanation: { en: 'unset leaves keys 0 and 2, and append uses key 3 instead of filling the gap. Because the result is not a PHP list, json_encode emits an object.', zh: 'unset会留下键0和2，追加使用键3而不会填补空档。结果不是PHP列表，因此json_encode输出对象。' }
    difficulty: beginner
    tags: [arrays, unset, append, json, predict-output]

  - id: nullable-key-existence
    type: mcq
    prompt: { en: 'Which expression returns true when key email exists with value null?', zh: '键email存在且值为null时，哪个表达式返回true？' }
    options:
      - { text: { en: "isset($profile['email'])", zh: "isset($profile['email'])" }, correct: false }
      - { text: { en: "array_key_exists('email', $profile)", zh: "array_key_exists('email', $profile)" }, correct: true }
      - { text: { en: "$profile['email'] ?? false", zh: "$profile['email'] ?? false" }, correct: false }
      - { text: { en: "empty($profile['email']) === false", zh: "empty($profile['email']) === false" }, correct: false }
    explanation: { en: 'array_key_exists tests for the key itself. isset and null coalescing treat an existing null value like a missing key.', zh: 'array_key_exists检查键本身。isset与空合并运算都会把已有的null值当作键缺失处理。' }
    difficulty: beginner
    tags: [arrays, 'null', key-existence]

  - id: spot-lingering-foreach-reference
    title: { en: 'Spot the bug in the foreach reference', zh: '找出foreach引用里的bug' }
    type: spotbug
    prompt: { en: 'Find why the final array contains 1300 twice.', zh: '找出最终数组为何出现两个1300。' }
    code: |
      <?php
      function discountedPrices(array $prices): array
      {
          foreach ($prices as &$price) {
              $price -= 500;
          }

          foreach ($prices as $price) {
              // A later read-only loop should not change the array.
          }
          return $prices;
      }
    lang: php
    issues:
      - line: 8
        kind: correctness
        note: { en: 'The first loop leaves $price referencing the last element, so assignments by the second loop overwrite that element. Call unset($price) between the loops.', zh: '第一个循环结束后，$price仍引用最后一个元素，因此第二个循环的赋值会覆盖该元素。两个循环之间应调用unset($price)。' }
    explanation: { en: 'A foreach reference survives the loop. Detach it immediately with unset($price), even when the next use appears to be an ordinary by-value loop.', zh: 'foreach引用会在循环结束后继续存在。即使下一次看似是普通的按值循环，也应立即用unset($price) 解除引用。' }
    difficulty: intermediate
    tags: [arrays, foreach, references, code-review]

  - id: array-copy-with-object
    type: mcq
    prompt: { en: 'After $copy = $original, which later change can still be visible through both arrays?', zh: '执行 $copy = $original后，哪种后续修改仍可能同时从两个数组观察到？' }
    options:
      - { text: { en: 'Appending a scalar to $copy', zh: '向 $copy追加一个标量' }, correct: false }
      - { text: { en: 'Removing a key from $copy', zh: '从 $copy删除一个键' }, correct: false }
      - { text: { en: 'Changing a property on an object stored in both arrays', zh: '修改两个数组共同保存的对象属性' }, correct: true }
      - { text: { en: 'Replacing a nested array in $copy', zh: '替换 $copy中的嵌套数组' }, correct: false }
    explanation: { en: 'The array structures have value semantics, but an object element is an object handle. Copying the outer array does not clone that object.', zh: '数组结构遵循值语义，但对象元素保存对象句柄。复制外层数组不会克隆该对象。' }
    difficulty: intermediate
    tags: [arrays, copy-on-write, objects]

  - id: review-generated-catalog-index
    title: { en: 'Review generated catalog index', zh: '审查生成的目录索引' }
    type: review
    prompt: { en: 'Review this generated catalog-index function before using it in an API.', zh: '在API中使用这段生成的目录索引函数前，对它进行审查。' }
    task: { en: 'Given products with unique SKUs, apply defaults while letting each product override them, preserve zero stock, return a map keyed by SKU, and expose only sku, name, and stock.', zh: '输入商品的SKU保证唯一；应用默认值但让每个商品覆盖默认值，保留零库存，返回以SKU为键的映射，并且只公开sku、name和stock。' }
    code: |
      <?php
      function buildCatalog(array $products, array $defaults): array
      {
          $catalog = [];
          foreach ($products as $product) {
              $sameSkuCount = count(array_filter(
                  $products,
                  fn(array $candidate): bool => $candidate['sku'] === $product['sku'],
              ));
              if ($sameSkuCount !== 1) {
                  throw new InvalidArgumentException('Duplicate SKU');
              }
              $row = $defaults + $product;
              $row['stock'] = max(1, (int) $row['stock']);
              $catalog[$row['sku']] = [
                  'sku' => $row['sku'],
                  'name' => $row['name'],
                  'stock' => $row['stock'],
                  'internal_cost' => $row['internal_cost'],
              ];
          }
          return $catalog;
      }
    lang: php
    right: { en: 'The generated code keeps the result keyed by SKU, uses strict equality in its duplicate check, and projects named output fields instead of returning every input field.', zh: '生成代码保留了以SKU为键的结果，在重复检查中使用全等比较，并显式投影具名输出字段，没有直接返回全部输入字段。' }
    issues:
      - line: 6
        kind: performance
        note: { en: 'The input contract already guarantees unique SKUs, yet each iteration scans the full product list with array_filter. Remove this repeated work or validate uniqueness once before the loop if the boundary cannot guarantee it.', zh: '输入契约已经保证SKU唯一，但每轮仍用array_filter扫描全部商品。应删除重复工作；若边界无法保证唯一，则在循环前统一验证一次。' }
      - line: 13
        kind: correctness
        note: { en: 'Array union keeps values from its left operand, so defaults override product fields. Use array_merge($defaults, $product) for product values to win.', zh: '数组联合会保留左操作数的值，因此默认值覆盖了商品字段。要让商品值优先，应使用array_merge($defaults, $product)。' }
      - line: 14
        kind: edge-case
        note: { en: 'max(1, ...) silently changes legitimate zero stock to one, violating the task and advertising unavailable inventory.', zh: 'max(1, ...) 会把合法的零库存静默改为1，既违反任务要求，也会把无库存商品显示为有货。' }
      - line: 19
        kind: security
        note: { en: 'The public row exposes internal_cost even though the allowlist permits only sku, name, and stock.', zh: '公开数据包含internal_cost，而允许列表只包含sku、name和stock。' }
    checklist:
      - { en: 'Test one field that conflicts between defaults and a product.', zh: '测试默认值与商品值发生冲突的字段。' }
      - { en: 'Test stock values of zero, null, a numeric string, and a positive integer.', zh: '测试库存为0、null、数字字符串和正整数的情况。' }
      - { en: 'Assert the exact output keys and public fields.', zh: '断言输出的准确键集合与公开字段。' }
      - { en: 'Look for nested full-array scans inside every loop.', zh: '检查每个循环中是否嵌套了全数组扫描。' }
    explanation: { en: 'Merge in the correct direction, validate stock instead of forcing a minimum, and allowlist only public fields. Trust a validated uniqueness contract or perform one linear precheck rather than an array-wide scan per product.', zh: '应按正确方向合并，校验库存而不是强制最小值，并且只允许公开字段。应信任已经验证的唯一性契约，或执行一次线性预检，不要为每个商品扫描整个数组。' }
    difficulty: advanced
    tags: [arrays, code-review, security, data-shape]
