topic: php/array-functions
items:
  - id: predict-filtered-json-shape
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      <?php
      $values = [0, '0', '', null, 7];
      echo json_encode(array_filter($values)), PHP_EOL;
    lang: php
    options:
      - { text: { en: '[7]', zh: '[7]' }, correct: false }
      - { text: { en: '{"4":7}', zh: '{"4":7}' }, correct: true }
      - { text: { en: '[0,"0",7]', zh: '[0,"0",7]' }, correct: false }
      - { text: { en: 'It throws because no callback was supplied.', zh: '程序会因为没有回调而抛出异常。' }, correct: false }
    explanation: { en: 'Without a callback, array_filter removes every PHP-empty value but preserves key 4. A non-sequential integer key makes json_encode emit an object.', zh: '省略回调时，array_filter会删除所有PHP空值，但保留键4。整数键不连续，因此json_encode输出对象。' }
    difficulty: beginner
    tags: [array-filter, keys, json, predict-output]

  - id: map-key-contract
    type: mcq
    prompt: { en: 'When does array_map preserve the input array keys?', zh: 'array_map在什么情况下会保留输入数组的键？' }
    options:
      - { text: { en: 'When exactly one input array is passed', zh: '只传入一个输入数组时' }, correct: true }
      - { text: { en: 'Whenever every input uses the same string keys', zh: '所有输入都使用相同字符串键时' }, correct: false }
      - { text: { en: 'Only when the callback returns the original value', zh: '只有回调返回原值时' }, correct: false }
      - { text: { en: 'Never; array_map always renumbers keys', zh: '从不保留；array_map总会重新编号' }, correct: false }
    explanation: { en: 'The one-array form preserves that array’s keys. With two or more arrays, values align by position and the result receives sequential integer keys.', zh: '单数组形式会保留该数组的键。传入两个或更多数组时，值按位置对齐，结果使用连续整数键。' }
    difficulty: intermediate
    tags: [array-map, keys]

  - id: reduce-initial-value
    type: mcq
    prompt: { en: 'What is the first accumulator passed by array_reduce($values, $callback) when the initial argument is omitted?', zh: '省略初始参数时，array_reduce($values, $callback) 第一次传给回调的累加器是什么？' }
    options:
      - { text: { en: 'null', zh: 'null' }, correct: true }
      - { text: { en: 'The first array value', zh: '数组的第一个值' }, correct: false }
      - { text: { en: '0', zh: '0' }, correct: false }
      - { text: { en: 'An empty array', zh: '空数组' }, correct: false }
    explanation: { en: 'PHP uses null as the default initial accumulator and processes the first value normally. Supplying an identity value defines both the empty result and accumulator type.', zh: 'PHP默认用null作为初始累加器，并正常处理第一个值。显式提供单位值可以同时定义空输入结果与累加器类型。' }
    difficulty: intermediate
    tags: [array-reduce, accumulator, empty-input]

  - id: spot-filter-argument-order
    title: { en: 'Spot the bug in the filter callback', zh: '找出过滤回调里的bug' }
    type: spotbug
    prompt: { en: 'Find why this filter does not inspect configuration keys as intended.', zh: '找出这段筛选为何没有按预期检查配置键。' }
    code: |
      <?php
      function publicConfig(array $config): array
      {
          return array_filter(
              $config,
              fn(string $key): bool => str_starts_with($key, 'public_'),
              ARRAY_FILTER_USE_BOTH,
          );
      }
    lang: php
    issues:
      - line: 6
        kind: correctness
        note: { en: 'ARRAY_FILTER_USE_BOTH passes value first and key second, so the one-parameter callback receives a value instead of the key.', zh: 'ARRAY_FILTER_USE_BOTH先传值、再传键，因此这个单参数回调收到的是值，不是键。' }
    explanation: { en: 'Use ARRAY_FILTER_USE_KEY for a key-only predicate, or accept parameters as function ($value, $key) when both are needed. The result preserves the original keys in either mode.', zh: '只按键筛选时应使用ARRAY_FILTER_USE_KEY；同时需要两者时，参数应写成function ($value, $key)。两种模式都会保留原键。' }
    difficulty: intermediate
    tags: [array-filter, callback, code-review]

  - id: choose-preserving-union
    type: mcq
    prompt: { en: 'Which operation keeps left-side values on duplicate keys and preserves non-sequential integer keys?', zh: '哪个操作会在键重复时保留左侧值，并保留不连续的整数键？' }
    options:
      - { text: { en: '$left + $right', zh: '$left + $right' }, correct: true }
      - { text: { en: 'array_merge($left, $right)', zh: 'array_merge($left, $right)' }, correct: false }
      - { text: { en: 'array_values($left + $right)', zh: 'array_values($left + $right)' }, correct: false }
      - { text: { en: 'usort($left, $right)', zh: 'usort($left, $right)' }, correct: false }
    explanation: { en: 'Array union keeps every key already present on the left and does not renumber integer keys. array_merge lets later string values win and renumbers integer keys.', zh: '数组联合保留左侧已有键的值，也不会重排整数键。array_merge会让后方字符串键的值覆盖前方，并重排整数键。' }
    difficulty: beginner
    tags: [array-merge, array-union, keys]

  - id: review-generated-product-feed
    title: { en: 'Review generated product feed', zh: '审查生成的产品信息流' }
    type: review
    prompt: { en: 'Review this generated product-feed function before it serves production data.', zh: '在这段生成的商品数据函数用于生产环境前，对它进行审查。' }
    task: { en: 'Apply defaults while letting each product override them, keep zero-stock products, sort by normalized name, and return public JSON without internal cost.', zh: '应用默认值但让商品值覆盖默认值，保留零库存商品，按规范化名称排序，并返回不含内部成本的公开JSON。' }
    code: |
      <?php
      function buildProductFeed(array $products, array $defaults): string
      {
          $visible = array_filter(
              $products,
              fn(array $product): bool => $product['stock'],
          );
          $rows = array_map(
              function (array $product) use ($defaults): array {
                  $row = array_merge($product, $defaults);
                  return [
                      'sku' => $row['sku'],
                      'name' => $row['name'],
                      'stock' => $row['stock'],
                      'cost' => $row['cost'],
                  ];
              },
              $visible,
          );
          usort(
              $rows,
              fn(array $a, array $b): int => strtolower($a['name']) <=> strtolower($b['name']),
          );
          return json_encode($rows, JSON_THROW_ON_ERROR);
      }
    lang: php
    issues:
      - line: 6
        kind: edge-case
        note: { en: 'The truthy stock predicate removes legitimate zero-stock products and emits a warning when stock is missing.', zh: '按库存真值筛选会误删合法的零库存商品，缺少stock键时还会产生警告。' }
      - line: 10
        kind: correctness
        note: { en: 'The merge order lets defaults overwrite product fields. array_merge($defaults, $product) is required for product values to win.', zh: '这个合并顺序会让默认值覆盖商品字段。要让商品值优先，应使用array_merge($defaults, $product)。' }
      - line: 15
        kind: security
        note: { en: 'The public response exposes the internal cost field, which the task explicitly excludes.', zh: '公开响应暴露了任务明确要求排除的内部cost字段。' }
      - line: 22
        kind: performance
        note: { en: 'strtolower runs repeatedly during comparison. Normalize each name once before sorting when feeds are large enough for this cost to matter.', zh: '排序比较期间会重复调用strtolower。数据规模足以让该成本显现时，应在排序前只规范化一次名称。' }
    right: { en: 'The function declares array and string boundaries, builds local rows instead of sorting the caller’s array, and uses JSON_THROW_ON_ERROR rather than hiding encoding failure.', zh: '函数声明了数组与字符串边界，在局部结果上排序而不修改调用方数组，并用JSON_THROW_ON_ERROR避免隐藏编码失败。' }
    checklist:
      - { en: 'Test zero, missing, null, and positive stock values.', zh: '测试库存为0、缺失、null和正数的情况。' }
      - { en: 'Verify override direction with one conflicting default and product field.', zh: '用一组冲突的默认字段与商品字段验证覆盖方向。' }
      - { en: 'List every field allowed in the public response.', zh: '列出公开响应允许包含的每个字段。' }
      - { en: 'Check comparator correctness and avoid repeated normalization in its hot path.', zh: '检查比较函数的正确性，并避免在其热点路径中重复规范化。' }
    explanation: { en: 'Use an explicit visibility predicate, merge defaults before the product, project only public fields, and precompute the normalized sort key when needed. Tests should assert the key shape and confirm the caller’s input remains unchanged.', zh: '应使用明确的可见性条件，先放默认值、后放商品值，只投影公开字段，并在需要时预先计算规范化排序键。测试还应断言键形状，并确认调用方输入没有改变。' }
    difficulty: advanced
    tags: [arrays, code-review, security, sorting]
