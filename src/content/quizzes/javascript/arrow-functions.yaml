topic: javascript/arrow-functions
items:
  - id: predict-block-body-return
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      const makeLabel = (id) => { id };
      console.log(makeLabel('A-17'));
    lang: javascript
    options:
      - { text: { en: "{ id: 'A-17' }", zh: "{ id: 'A-17' }" }, correct: false }
      - { text: { en: "'A-17'", zh: "'A-17'" }, correct: false }
      - { text: { en: 'undefined', zh: 'undefined' }, correct: true }
      - { text: { en: 'It throws SyntaxError.', zh: '程序抛出 SyntaxError。' }, correct: false }
    explanation: { en: 'The braces select a block body, and id is only an expression statement. With no return statement, the arrow returns undefined.', zh: '花括号选择了块函数体，id 只是一条表达式语句。函数没有 return 语句，因此返回 undefined。' }
    difficulty: beginner
    tags: [arrow-functions, block-body, implicit-return, predict-output]

  - id: predict-lexical-this-call
    type: predict
    prompt: { en: 'Which name does this program print?', zh: '这段程序会输出哪个名称？' }
    code: |
      function makeReader() {
        return () => this.name;
      }

      const reader = makeReader.call({ name: 'outer' });
      console.log(reader.call({ name: 'inner' }));
    lang: javascript
    options:
      - { text: { en: 'outer', zh: 'outer' }, correct: true }
      - { text: { en: 'inner', zh: 'inner' }, correct: false }
      - { text: { en: 'undefined', zh: 'undefined' }, correct: false }
      - { text: { en: 'It throws because arrows have no call method.', zh: '程序抛错，因为箭头函数没有 call 方法。' }, correct: false }
    explanation: { en: 'The factory call gives makeReader its receiver. The returned arrow keeps resolving that outer this, while its own call receives only a normal argument list.', zh: '工厂调用为 makeReader 提供接收者。返回的箭头继续解析这层外部 this；之后的 call 只能正常传递实参。' }
    difficulty: intermediate
    tags: [arrow-functions, lexical-this, call, predict-output]

  - id: spot-object-method-receiver
    title: { en: 'Spot the bug in the account label', zh: '找出账户标签里的 bug' }
    type: spotbug
    prompt: { en: 'Find why label reads the builder receiver instead of the account.', zh: '找出 label 为何读取了构建函数的接收者，而不是 account。' }
    code: |
      function buildAccount(name) {
        return {
          name,
          label: () => this.name,
        };
      }

      const account = buildAccount.call({ name: 'builder' }, 'west');
      console.log(account.label());
    lang: javascript
    issues:
      - line: 4
        kind: correctness
        note: { en: 'The arrow captures buildAccount’s this, so account.label() returns builder. Use concise method syntax when the account must be the dynamic receiver.', zh: '箭头函数捕获 buildAccount 的 this，因此 account.label() 返回 builder。需要让 account 成为动态接收者时，应使用简写方法语法。' }
    explanation: { en: 'Putting an arrow in an object property does not make that object its receiver. An arrow resolves this at its definition site.', zh: '把箭头函数放进对象属性，不会让该对象成为函数接收者。箭头函数在定义位置解析 this。' }
    difficulty: intermediate
    tags: [arrow-functions, object-methods, this, code-review]

  - id: arrow-bind-semantics
    type: mcq
    prompt: { en: 'What does bind change when applied to an arrow function?', zh: '对箭头函数调用 bind 时，bind 会改变什么？' }
    options:
      - { text: { en: 'It replaces the lexical this and preserves the original identity.', zh: '它替换词法 this，并保留原函数标识。' }, correct: false }
      - { text: { en: 'It can preset arguments and returns a new function, but its thisArg does not replace lexical this.', zh: '它可以预置实参并返回新函数，但 thisArg 不会替换词法 this。' }, correct: true }
      - { text: { en: 'It makes the arrow constructible with new.', zh: '它让箭头函数可以通过 new 构造。' }, correct: false }
      - { text: { en: 'It converts the arrow into a prototype method.', zh: '它把箭头函数转换成原型方法。' }, correct: false }
    explanation: { en: 'Function.prototype.bind still creates a wrapper and can bind leading arguments. Because the target arrow has no own this binding, the supplied thisArg cannot change its lookup.', zh: 'Function.prototype.bind 仍会创建包装函数，也能绑定前置实参。目标箭头没有自身 this 绑定，所以提供的 thisArg 不能改变其查找结果。' }
    difficulty: intermediate
    tags: [arrow-functions, bind, lexical-this, function-identity]

  - id: review-generated-order-feed
    type: review
    title: { en: 'Review a generated order feed', zh: '审查生成的订单订阅器' }
    prompt: { en: 'Review this generated subscription before it handles production orders.', zh: '在这段生成的订阅代码处理生产订单前，对它进行审查。' }
    task: { en: 'Register at most once, format valid string ids with the instance prefix, never log tokens, and make stop remove the exact registered callback.', zh: '最多注册一次；用实例前缀格式化合法字符串 id；绝不记录 token；确保 stop 移除注册时的同一个回调。' }
    code: |
      class OrderFeed {
        constructor(bus, prefix) {
          this.bus = bus;
          this.prefix = prefix;
        }

        start() {
          this.bus.on('order', (order) => {
            const id = order.id.trim();
            console.log(`${this.prefix}:${id}:${order.token}`);
          });
        }

        stop() {
          this.bus.off('order', (order) => {
            const id = order.id.trim();
            console.log(`${this.prefix}:${id}:${order.token}`);
          });
        }
      }
    lang: javascript
    issues:
      - line: 8
        kind: performance
        note: { en: 'start has no idempotence guard, so repeated calls add listeners and duplicate work for every order.', zh: 'start 没有幂等保护，重复调用会增加监听器，并对每个订单重复处理。' }
      - line: 9
        kind: edge-case
        note: { en: 'A missing or non-string id makes trim throw. Validate the event shape before formatting it.', zh: 'id 缺失或不是字符串时，trim 会抛错。格式化前应校验事件结构。' }
      - line: 10
        kind: security
        note: { en: 'The log exposes order.token even though the task forbids it. Build output from an explicit allowlist.', zh: '日志暴露了任务明确禁止记录的 order.token。应按显式允许列表构造输出。' }
      - line: 15
        kind: correctness
        note: { en: 'This arrow is a new function, so off cannot match the arrow created in start. Create and retain one handler identity.', zh: '这里的箭头是新函数，因此 off 无法匹配 start 中创建的箭头。应创建并保存唯一的处理器标识。' }
    right: { en: 'The start callback deliberately uses an arrow, so it preserves the OrderFeed instance while formatting, and the id normalization uses a local instead of mutating the event.', zh: 'start 回调有意使用箭头函数，因此格式化时会保留 OrderFeed 实例；id 规范化结果也存入局部变量，没有修改事件。' }
    checklist:
      - { en: 'Validate order shape before calling string methods.', zh: '调用字符串方法前校验订单结构。' }
      - { en: 'Construct logs from allowlisted non-secret fields.', zh: '只用允许的非秘密字段构造日志。' }
      - { en: 'Store one callback identity and make start idempotent.', zh: '保存一个回调标识，并让 start 保持幂等。' }
      - { en: 'Test start twice, emit, stop, and emit again.', zh: '测试两次 start、触发、stop 和再次触发。' }
    explanation: { en: 'Store one arrow handler on the instance, validate into local values, log only approved fields, and track whether registration is active. A lifecycle test should prove that duplicate starts do not duplicate work and stop removes the listener.', zh: '应在实例上保存一个箭头处理器，把输入校验到局部变量，只记录允许字段，并跟踪注册状态。生命周期测试应证明重复启动不会重复处理，且 stop 能移除监听器。' }
    difficulty: advanced
    minutes: 8
    tags: [arrow-functions, callbacks, lifecycle, security, code-review]
