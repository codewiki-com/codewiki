topic: javascript/memory-management
items:
  - id: predict-map-retention
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      const jobs = new Map();
      let job = { id: 'J-1' };
      jobs.set(job.id, job);
      job = null;

      console.log(jobs.has('J-1'));
      jobs.delete('J-1');
      console.log(jobs.has('J-1'));
    lang: javascript
    options:
      - { text: { en: 'true, then false', zh: '先输出 true，再输出 false' }, correct: true }
      - { text: { en: 'false, then false', zh: '先输出 false，再输出 false' }, correct: false }
      - { text: { en: 'true, then true', zh: '先输出 true，再输出 true' }, correct: false }
      - { text: { en: 'It throws when job becomes null.', zh: 'job 变为 null 时抛出异常。' }, correct: false }
    explanation: { en: 'Assigning null changes one binding, but the Map still strongly retains the object. Deleting the entry removes that particular path.', zh: '赋值 null 只改变一个绑定，Map 仍然强持有对象；删除条目才会移除这条特定路径。' }
    difficulty: beginner
    tags: [reachability, map, predict-output]

  - id: weakmap-object-identity
    type: predict
    prompt: { en: 'What does this WeakMap lookup print?', zh: '这次 WeakMap 查询会输出什么？' }
    code: |
      const roles = new WeakMap();
      const session = { id: 'S-1' };
      roles.set(session, 'admin');

      console.log(roles.get({ id: 'S-1' }));
      console.log(roles.get(session));
    lang: javascript
    options:
      - { text: { en: 'undefined, then admin', zh: '先输出 undefined，再输出 admin' }, correct: true }
      - { text: { en: 'admin, then admin', zh: '两次都输出 admin' }, correct: false }
      - { text: { en: 'undefined, then undefined', zh: '两次都输出 undefined' }, correct: false }
      - { text: { en: 'It throws because WeakMap cannot store objects.', zh: '程序抛出异常，因为 WeakMap 不能存储对象。' }, correct: false }
    explanation: { en: 'WeakMap keys use object identity, not structural equality. The new object is a different key even though its id property matches.', zh: 'WeakMap 的键按对象标识匹配，而不是按结构相等匹配；新对象的 id 即使相同，也不是原来的键。' }
    difficulty: beginner
    tags: [weakmap, object-identity, predict-output]

  - id: unreachable-cycle
    type: mcq
    prompt: { en: 'What happens to a cycle of two objects when no GC root can reach either object?', zh: '两个对象互相引用，但任何 GC 根都无法到达它们时，会发生什么？' }
    options:
      - { text: { en: 'The cycle is eligible for garbage collection.', zh: '这个循环有资格被垃圾回收。' }, correct: true }
      - { text: { en: 'The cycle must remain because both reference counts are nonzero.', zh: '它们的引用计数都不为零，因此循环必须保留。' }, correct: false }
      - { text: { en: 'JavaScript immediately calls a destructor on both objects.', zh: 'JavaScript 会立即调用两个对象的析构函数。' }, correct: false }
    explanation: { en: 'Tracing collectors determine reachability from roots, so an unreachable cycle is collectible. JavaScript does not promise when collection occurs.', zh: '追踪式垃圾回收器从根判断可达性，因此不可达循环可以回收；JavaScript 不保证具体回收时机。' }
    difficulty: intermediate
    tags: [garbage-collection, reachability, cycles]

  - id: spot-listener-cleanup
    type: spotbug
    prompt: { en: 'Find why stopping this ticker does not release every registration created by mountTicker.', zh: '找出为什么停止这个 ticker 后，mountTicker 创建的注册仍未全部释放。' }
    code: |
      function mountTicker(feed) {
        const history = [];
        feed.addEventListener('price', (event) => {
          history.push(event.value);
        });
        const timerId = setInterval(() => feed.refresh(), 1000);

        return {
          history,
          stop() {
            clearInterval(timerId);
          },
        };
      }
    lang: javascript
    issues:
      - line: 3
        lines: 3
        kind: correctness
        note: { en: 'The anonymous price listener is never removed, so a long-lived feed can retain the callback and its captured history after stop.', zh: '匿名 price 监听器从未移除，因此长期存在的 feed 会在 stop 后继续保留回调及其捕获的 history。' }
    explanation: { en: 'Keep the handler identity and remove it in stop, or register with an AbortSignal that stop aborts. Cleanup must cover both the timer and the listener.', zh: '应保存处理器标识并在 stop 中移除，或用由 stop 中止的 AbortSignal 注册；清理必须同时覆盖计时器和监听器。' }
    difficulty: intermediate
    tags: [event-listeners, cleanup, closures]

  - id: review-generated-profile-store
    type: review
    title: { en: 'Review a generated profile store', zh: '审查生成的资料存储器' }
    prompt: { en: 'Review this generated store before it is shared by several authenticated views.', zh: '在多个已认证视图共享这段生成的存储器之前，对它进行审查。' }
    task: { en: 'Cache at most 100 public profiles per store, coalesce concurrent loads, invalidate on refresh, never retain credentials, and release registrations on dispose.', zh: '每个存储器最多缓存 100 份公开资料，合并并发加载，收到 refresh 时失效，绝不保留凭据，并在 dispose 时解除注册。' }
    code: |
      const cache = new Map();

      export function createProfileStore(api, events) {
        events.addEventListener('refresh', (event) => {
          cache.delete(event.detail.id);
        });

        async function getProfile(id, token) {
          if (cache.has(id)) return cache.get(id);
          const response = await api.load(id, token);
          const profile = {
            ...response,
            token,
          };
          cache.set(id, profile);
          return profile;
        }

        return {
          getProfile,
          dispose() {
            cache.clear();
          },
        };
      }
    lang: javascript
    issues:
      - line: 1
        kind: performance
        note: { en: 'The process-level Map has no 100-entry bound and is shared by every store instance, so distinct ids can grow retained memory without limit.', zh: '进程级 Map 没有 100 条上限，而且由所有存储器实例共享，因此不同 id 会让保留内存无限增长。' }
      - line: 4
        lines: 3
        kind: correctness
        note: { en: 'The anonymous refresh listener cannot be removed by dispose, so events keeps the store callback registered after its lifecycle ends.', zh: '匿名 refresh 监听器无法由 dispose 移除，因此生命周期结束后，events 仍会保留存储器回调。' }
      - line: 9
        lines: 2
        kind: edge-case
        note: { en: 'Two concurrent misses for one id both start api.load; store one in-flight Promise and remove it after settlement to coalesce work.', zh: '同一 id 的两个并发未命中都会启动 api.load；应保存一个进行中的 Promise，并在结束后删除，以合并工作。' }
      - line: 11
        lines: 5
        kind: security
        note: { en: 'Spreading the response and adding token retains and returns credentials instead of constructing the requested allowlisted public profile.', zh: '展开响应并加入 token 会保留并返回凭据；应按允许字段构造所需的公开资料。' }
    right: { en: 'The code uses Map.has so cached falsy values are distinguishable from misses, invalidates an id on refresh, and exposes a lifecycle method.', zh: '代码使用 Map.has 区分缓存中的假值与未命中，会在 refresh 时让 id 失效，并且公开了生命周期方法。' }
    checklist:
      - { en: 'Verify the cache owner, entry or weight bound, and eviction behavior.', zh: '核对缓存所有者、条目或权重上限，以及淘汰行为。' }
      - { en: 'Test two simultaneous misses and both fulfilled and rejected loads.', zh: '测试两个同时发生的未命中，以及成功和失败的加载。' }
      - { en: 'Compare cached and returned fields with a public-data allowlist.', zh: '把缓存和返回字段与公开数据允许列表逐项比较。' }
      - { en: 'Dispose twice and confirm every external listener is removed.', zh: '连续调用两次 dispose，并确认所有外部监听器都已移除。' }
    explanation: { en: 'Use an instance-owned bounded cache plus an in-flight map, construct a public value explicitly, and keep a removable handler or AbortController for disposal.', zh: '应使用实例拥有的有界缓存和进行中请求 Map，显式构造公开值，并保存可移除处理器或用于释放的 AbortController。' }
    difficulty: advanced
    minutes: 8
    tags: [memory-management, code-review, cache, lifecycle]
