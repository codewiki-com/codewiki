topic: javascript/destructuring
items:
  - id: predict-default-trigger
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      const {
        missing = 'fallback',
        empty = 'fallback',
        count = 7,
        note = 'fallback',
      } = { empty: '', count: 0, note: null };

      console.log(JSON.stringify([missing, empty, count, note]));
    lang: javascript
    options:
      - { text: { en: '["fallback","",0,null]', zh: '["fallback","",0,null]' }, correct: true }
      - { text: { en: '["fallback","fallback",7,"fallback"]', zh: '["fallback","fallback",7,"fallback"]' }, correct: false }
      - { text: { en: '[null,"",0,null]', zh: '[null,"",0,null]' }, correct: false }
      - { text: { en: 'It throws when note is null.', zh: '程序在note为null时抛错。' }, correct: false }
    explanation: { en: 'Only an extracted value of undefined triggers a destructuring default. The missing property does; the empty string, zero, and null remain unchanged.', zh: '只有取出的值为undefined时才触发解构默认值；缺失属性会触发，而空字符串、0和null都保持不变。' }
    difficulty: beginner
    tags: [destructuring, defaults, undefined, predict-output]

  - id: predict-object-rest-alias
    type: predict
    prompt: { en: 'What does this program print after the rest object is changed?', zh: '修改剩余属性对象后，这段程序会输出什么？' }
    code: |
      const source = {
        secret: undefined,
        settings: { theme: 'dark' },
      };

      const { secret = 'none', ...copy } = source;
      copy.settings.theme = 'light';

      console.log(secret, source.settings.theme);
    lang: javascript
    options:
      - { text: { en: 'none light', zh: 'none light' }, correct: true }
      - { text: { en: 'undefined dark', zh: 'undefined dark' }, correct: false }
      - { text: { en: 'none dark', zh: 'none dark' }, correct: false }
      - { text: { en: 'undefined light', zh: 'undefined light' }, correct: false }
    explanation: { en: 'The explicit undefined activates the default. Object rest creates a new outer object but shares the nested settings object, so the source observes the mutation.', zh: '显式的undefined会触发默认值；对象剩余属性创建新的外层对象，却与源对象共享嵌套的settings，因此源对象也会看到修改。' }
    difficulty: intermediate
    tags: [destructuring, object-rest, shallow-copy, predict-output]

  - id: array-elision-consumption
    type: mcq
    prompt: { en: 'What does the empty position in const [first, , third] = iterable do?', zh: 'const [first, , third] = iterable中的空位置会做什么？' }
    options:
      - { text: { en: 'It requests and discards the next iterator value.', zh: '它会请求并丢弃下一个迭代值。' }, correct: true }
      - { text: { en: 'It jumps to numeric property 2 without advancing the iterator.', zh: '它不推进迭代器，直接跳到数字属性2。' }, correct: false }
      - { text: { en: 'It binds an implicit variable whose value is undefined.', zh: '它会绑定一个值为undefined的隐式变量。' }, correct: false }
      - { text: { en: 'It closes the iterator before third is read.', zh: '它会在读取third之前关闭迭代器。' }, correct: false }
    explanation: { en: 'Array patterns follow the iteration protocol. An elision omits the binding, not the call that obtains the value for that position.', zh: '数组模式遵循迭代协议；空位置省略的是绑定，而不是为该位置取得值的调用。' }
    difficulty: intermediate
    tags: [destructuring, iterators, elision]

  - id: spot-null-intermediate
    title: { en: 'Spot the bug in the order label', zh: '找出订单标签里的bug' }
    type: spotbug
    prompt: { en: 'Find why the claimed defaults do not make this formatter accept every missing customer shape.', zh: '找出这些默认值为何不能让格式化函数接受所有缺失的客户数据形状。' }
    code: |
      function orderLabel({
        id = 'untracked',
        customer: { name = 'guest' } = {},
      } = {}) {
        return `${id}:${name}`;
      }

      console.log(orderLabel({ id: 'A-17', customer: null }));
    lang: javascript
    issues:
      - line: 3
        kind: edge-case
        note: { en: 'The intermediate default applies only when customer is undefined. An explicit null is still destructured as an object and throws TypeError; normalize null deliberately or reject it.', zh: '中间层默认值只在customer为undefined时生效；显式的null仍会作为对象参与解构并抛出TypeError，应明确规范化null或拒绝它。' }
    explanation: { en: 'Defaults are layered and undefined-only. The whole-parameter default, intermediate object default, and leaf default each protect a different read.', zh: '默认值按层级工作，而且只处理undefined；整个参数、中间对象和叶子字段的默认值分别保护不同的读取。' }
    difficulty: intermediate
    tags: [destructuring, 'null', nested-patterns, code-review]

  - id: review-generated-public-account
    type: review
    title: { en: 'Review a generated account normalizer', zh: '审查生成的账户规范化函数' }
    prompt: { en: 'Review this generated code before it handles API accounts.', zh: '在这段生成的代码处理API账户前，对它进行审查。' }
    task: { en: 'Accept an omitted account or missing preferences, preserve a retry count of zero, return only id, displayName, theme, and retries, and never mutate the input.', zh: '接受省略的账户参数或缺失的preferences，保留值为0的重试次数，只返回id、displayName、theme和retries，并且绝不修改输入。' }
    code: |
      function prepareAccount(input = {}) {
        const {
          id,
          name: displayName,
          preferences: { theme = 'light', retries = 3 },
          password,
          ...remaining
        } = input;

        return {
          ...remaining,
          id,
          displayName,
          theme,
          retries: retries || 3,
        };
      }

      const account = {
        id: 'U-3',
        name: 'Mira',
        token: 'secret',
        preferences: { theme: 'dark', retries: 0 },
      };
      console.log(prepareAccount(account));
    lang: javascript
    issues:
      - line: 5
        kind: edge-case
        note: { en: 'The parameter default produces {}, but this nested pattern still throws when preferences is missing. Default that layer with = {} as well.', zh: '参数默认值会产生 {}，但preferences缺失时，这个嵌套模式仍会抛错。该层也应使用 = {} 设置默认值。' }
      - line: 11
        kind: security
        note: { en: 'Spreading a denylisted remainder exposes token and any future enumerable credential. Construct the result from the four allowlisted fields instead.', zh: '展开按排除列表得到的剩余属性会泄露token以及未来新增的可枚举凭据。应只用四个允许字段构造结果。' }
      - line: 15
        kind: correctness
        note: { en: 'The || fallback replaces the valid retry count 0 with 3. The destructuring default already handles undefined, so return retries directly.', zh: '|| 回退会把合法的重试次数0替换为3。解构默认值已经处理undefined，应直接返回retries。' }
    right: { en: 'The generated code renames name to displayName, supplies leaf defaults for undefined values, builds a new outer result object, and does not assign through the input.', zh: '生成代码把name重命名为displayName，为值为undefined的叶子字段提供默认值，构造了新的外层结果对象，也没有通过输入对象赋值。' }
    checklist:
      - { en: 'Call the function with no argument, {}, and a partially populated preferences object.', zh: '分别不传参数、传入 {} 以及字段不完整的preferences对象来调用函数。' }
      - { en: 'Test missing, undefined, and zero retry counts through every default or fallback.', zh: '让缺失、undefined和值为0的重试次数经过每个默认或回退表达式。' }
      - { en: 'Add a new credential to the input and compare returned keys with the allowlist.', zh: '向输入新增凭据，再把返回键与允许列表比较。' }
      - { en: 'Snapshot the input before the call and confirm that nested values remain unchanged.', zh: '调用前快照记录输入，并确认嵌套值保持不变。' }
    explanation: { en: 'Default the preferences layer separately, return retries without a truthiness fallback, and construct the result from an explicit allowlist. These changes satisfy missing-input, zero-value, and data-exposure requirements without changing the input.', zh: '应单独为preferences层设置默认值，不使用假值回退而直接返回retries，并按明确的允许列表构造结果。这些修改能在不改动输入的前提下，满足缺失输入、保留零值与防止数据泄露的要求。' }
    difficulty: intermediate
    minutes: 8
    tags: [destructuring, code-review, defaults, security]
