topic: javascript/destructuring
items:
  - id: predict-default-trigger
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      const {
        missing = 'fallback',
        empty = 'fallback',
        count = 7,
        note = 'fallback',
      } = { empty: '', count: 0, note: null };

      console.log(JSON.stringify([missing, empty, count, note]));
    lang: javascript
    options:
      - { text: { en: '["fallback","",0,null]', zh: '["fallback","",0,null]' }, correct: true }
      - { text: { en: '["fallback","fallback",7,"fallback"]', zh: '["fallback","fallback",7,"fallback"]' }, correct: false }
      - { text: { en: '[null,"",0,null]', zh: '[null,"",0,null]' }, correct: false }
      - { text: { en: 'It throws when note is null.', zh: '程序在 note 为 null 时抛错。' }, correct: false }
    explanation: { en: 'Only an extracted value of undefined triggers a destructuring default. The missing property does; the empty string, zero, and null remain unchanged.', zh: '只有取出的值为 undefined 时才触发解构默认值；缺失属性会触发，而空字符串、0 和 null 都保持不变。' }
    difficulty: beginner
    tags: [destructuring, defaults, undefined, predict-output]

  - id: predict-object-rest-alias
    type: predict
    prompt: { en: 'What does this program print after the rest object is changed?', zh: '修改剩余属性对象后，这段程序会输出什么？' }
    code: |
      const source = {
        secret: undefined,
        settings: { theme: 'dark' },
      };

      const { secret = 'none', ...copy } = source;
      copy.settings.theme = 'light';

      console.log(secret, source.settings.theme);
    lang: javascript
    options:
      - { text: { en: 'none light', zh: 'none light' }, correct: true }
      - { text: { en: 'undefined dark', zh: 'undefined dark' }, correct: false }
      - { text: { en: 'none dark', zh: 'none dark' }, correct: false }
      - { text: { en: 'undefined light', zh: 'undefined light' }, correct: false }
    explanation: { en: 'The explicit undefined activates the default. Object rest creates a new outer object but shares the nested settings object, so the source observes the mutation.', zh: '显式的 undefined 会触发默认值；对象剩余属性创建新的外层对象，却与源对象共享嵌套的 settings，因此源对象也会看到修改。' }
    difficulty: intermediate
    tags: [destructuring, object-rest, shallow-copy, predict-output]

  - id: array-elision-consumption
    type: mcq
    prompt: { en: 'What does the empty position in const [first, , third] = iterable do?', zh: 'const [first, , third] = iterable 中的空位置会做什么？' }
    options:
      - { text: { en: 'It requests and discards the next iterator value.', zh: '它会请求并丢弃下一个迭代值。' }, correct: true }
      - { text: { en: 'It jumps to numeric property 2 without advancing the iterator.', zh: '它不推进迭代器，直接跳到数字属性 2。' }, correct: false }
      - { text: { en: 'It binds an implicit variable whose value is undefined.', zh: '它会绑定一个值为 undefined 的隐式变量。' }, correct: false }
      - { text: { en: 'It closes the iterator before third is read.', zh: '它会在读取 third 之前关闭迭代器。' }, correct: false }
    explanation: { en: 'Array patterns follow the iteration protocol. An elision omits the binding, not the call that obtains the value for that position.', zh: '数组模式遵循迭代协议；空位置省略的是绑定，而不是为该位置取得值的调用。' }
    difficulty: intermediate
    tags: [destructuring, iterators, elision]

  - id: spot-null-intermediate
    type: spotbug
    prompt: { en: 'Find why the claimed defaults do not make this formatter accept every missing customer shape.', zh: '找出这些默认值为何不能让格式化函数接受所有缺失的客户数据形状。' }
    code: |
      function orderLabel({
        id = 'untracked',
        customer: { name = 'guest' } = {},
      } = {}) {
        return `${id}:${name}`;
      }

      console.log(orderLabel({ id: 'A-17', customer: null }));
    lang: javascript
    issues:
      - line: 3
        kind: edge-case
        note: { en: 'The intermediate default applies only when customer is undefined. An explicit null is still destructured as an object and throws TypeError; normalize null deliberately or reject it.', zh: '中间层默认值只在 customer 为 undefined 时生效；显式的 null 仍会作为对象参与解构并抛出 TypeError，应明确规范化 null 或拒绝它。' }
    explanation: { en: 'Defaults are layered and undefined-only. The whole-parameter default, intermediate object default, and leaf default each protect a different read.', zh: '默认值按层级工作，而且只处理 undefined；整个参数、中间对象和叶子字段的默认值分别保护不同的读取。' }
    difficulty: intermediate
    tags: [destructuring, 'null', nested-patterns, code-review]

  - id: review-generated-public-account
    type: review
    prompt: { en: 'Review this generated account normalizer before it is used at an API boundary.', zh: '在 API 边界使用这段生成的账户规范化代码前，对它进行审查。' }
    task: { en: 'Accept an omitted account and missing preferences, preserve a retry count of zero, return only id, displayName, theme, retries, and locale, and never mutate the input.', zh: '接受省略的账户与缺失的 preferences，保留值为 0 的重试次数，只返回 id、displayName、theme、retries 和 locale，并且绝不修改输入。' }
    code: |
      function prepareAccount(input) {
        const {
          id,
          name: displayName,
          preferences: { theme = 'light', retries = 3 },
          password,
          ...publicFields
        } = input;
        const result = {
          ...publicFields,
          id,
          displayName,
          theme,
          retries: retries || 3,
        };

        result.profile.locale = result.profile.locale.toLowerCase();
        return result;
      }

      const account = {
        id: 'U-3', name: 'Mira', token: 'secret',
        preferences: { theme: 'dark', retries: 0 }, profile: { locale: 'EN' },
      };
      console.log(prepareAccount(account));
    lang: javascript
    issues:
      - line: 5
        kind: edge-case
        note: { en: 'Neither input nor preferences has a default. An omitted input fails at line 8, and an object without preferences fails at this nested pattern.', zh: 'input 与 preferences 都没有默认值；省略 input 会在第 8 行失败，而不含 preferences 的对象会在这个嵌套模式处失败。' }
      - line: 10
        kind: security
        note: { en: 'Spreading a denylisted remainder forwards token and any future enumerable credential. Construct the result from the five allowlisted fields instead.', zh: '展开按排除列表得到的剩余属性会转发 token 以及未来新增的可枚举凭据；应只用五个允许字段构造结果。' }
      - line: 14
        kind: correctness
        note: { en: 'The || fallback replaces the valid retry count 0 with 3. The destructured default already handles undefined, so return retries directly after validation.', zh: '|| 回退会把合法的重试次数 0 替换为 3；解构默认值已经处理 undefined，验证后应直接返回 retries。' }
      - line: 17
        kind: readability
        note: { en: 'Mutating through result hides that profile is a shallow alias of input.profile, so this also violates the no-mutation task. Derive locale without mutating either object.', zh: '通过 result 修改属性掩盖了 profile 是 input.profile 的浅层别名，因此也违反了不得修改输入的任务；应在不修改任一对象的情况下派生 locale。' }
    right: { en: 'The generated code renames name to the requested displayName, gives undefined theme and retries values explicit defaults, and builds a separate outer result object.', zh: '生成代码把 name 重命名为所需的 displayName，为值为 undefined 的 theme 与 retries 设置了明确默认值，并构造了独立的外层结果对象。' }
    checklist:
      - { en: 'Test omitted, undefined, null, and partially populated inputs at every nested level.', zh: '在每个嵌套层级测试省略、undefined、null 和字段不完整的输入。' }
      - { en: 'Run valid falsy values through each default and fallback expression.', zh: '让合法的假值经过每个默认表达式与回退表达式。' }
      - { en: 'Compare returned keys with the allowlist after adding a new credential to the input.', zh: '向输入新增凭据后，把返回键与允许列表比较。' }
      - { en: 'Snapshot nested input values before and after the call to detect shallow-alias mutation.', zh: '调用前后分别记录嵌套输入值，以发现浅层别名导致的修改。' }
    explanation: { en: 'Normalize or reject the whole input first, default preferences at its own layer, keep zero by avoiding ||, and build an allowlisted object whose locale is derived without mutation.', zh: '应先规范化或拒绝整个输入，在 preferences 所在层设置默认值，避免使用 || 以保留 0，并按允许列表构造对象，在不修改输入的情况下派生 locale。' }
    difficulty: advanced
    tags: [destructuring, code-review, defaults, security, shallow-copy]
