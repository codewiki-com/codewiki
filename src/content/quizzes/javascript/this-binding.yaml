topic: javascript/this-binding
items:
  - id: predict-call-bind-receiver
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      'use strict';

      function readName() {
        return this.name;
      }

      const primary = { name: 'primary', readName };
      const bound = readName.bind({ name: 'bound' });

      console.log([
        primary.readName(),
        readName.call({ name: 'called' }),
        bound.call({ name: 'ignored' }),
      ].join(', '));
    lang: javascript
    options:
      - { text: { en: 'primary, called, ignored', zh: 'primary, called, ignored' }, correct: false }
      - { text: { en: 'primary, called, bound', zh: 'primary, called, bound' }, correct: true }
      - { text: { en: 'undefined, called, bound', zh: 'undefined, called, bound' }, correct: false }
      - { text: { en: 'The program throws before printing.', zh: '程序在输出前抛出异常。' }, correct: false }
    explanation: { en: 'The property call uses primary, call supplies called, and call cannot override the receiver already stored by bind.', zh: '属性调用使用 primary，call 提供 called，而 call 无法覆盖 bind 已保存的接收者。' }
    difficulty: beginner
    tags: [this-binding, call, bind, predict-output]

  - id: spot-detached-map-method
    title: { en: 'Spot the bug in the order formatter', zh: '找出订单格式化器里的 bug' }
    type: spotbug
    prompt: { en: 'Find why this generated formatter throws when map invokes it.', zh: '找出这段生成的格式化代码为何在 map 调用时抛错。' }
    code: |
      'use strict';

      const formatter = {
        prefix: 'ORD',
        format(id) {
          return `${this.prefix}-${id}`;
        },
      };

      console.log(['7', '8'].map(formatter.format));
    lang: javascript
    issues:
      - line: 10
        kind: correctness
        note: { en: 'Passing formatter.format extracts the function. map calls it without formatter as the receiver, so strict-mode this is undefined; use a wrapper or one retained bound function.', zh: '传入 formatter.format 会提取函数。map 调用它时不会以 formatter 为接收者，因此严格模式下 this 是 undefined；应使用包装器或保存一次绑定后的函数。' }
    explanation: { en: 'A method call gets its receiver from the call expression, not from the object where the function was found earlier. Callback APIs also pass extra arguments, so a wrapper makes forwarding explicit.', zh: '方法接收者来自调用表达式，不来自之前找到函数的对象。回调 API 还会传入额外实参，因此包装器能明确控制转发。' }
    difficulty: beginner
    tags: [this-binding, callbacks, method-extraction, code-review]

  - id: arrow-call-rebinding
    type: mcq
    prompt: { en: 'An arrow created inside a method reads this.id. What does arrow.call(other) do?', zh: '方法内部创建的箭头函数读取 this.id。arrow.call(other) 会怎样？' }
    options:
      - { text: { en: 'It reads other.id because call always has highest precedence.', zh: '它读取 other.id，因为 call 的优先级总是最高。' }, correct: false }
      - { text: { en: 'It reads the id from the this captured when the arrow was created.', zh: '它读取箭头函数创建时捕获的 this 上的 id。' }, correct: true }
      - { text: { en: 'It throws because arrows have no call method.', zh: '它抛出异常，因为箭头函数没有 call 方法。' }, correct: false }
      - { text: { en: 'It creates a shallow copy of other before reading id.', zh: '它先浅拷贝 other，再读取 id。' }, correct: false }
    explanation: { en: 'An arrow has lexical this. Function.prototype.call can invoke it and pass arguments, but its thisArg cannot replace the captured value.', zh: '箭头函数使用词法 this。Function.prototype.call 可以调用它并传参，但 thisArg 不能替换已捕获的值。' }
    difficulty: intermediate
    tags: [arrow-functions, lexical-this, call]

  - id: bound-constructor-receiver
    type: mcq
    prompt: { en: 'What happens to a bound this when a constructible bound function is called with new?', zh: '对可构造的绑定函数使用 new 时，绑定的 this 会怎样？' }
    options:
      - { text: { en: 'The bound object is initialized and returned.', zh: '绑定对象被初始化并返回。' }, correct: false }
      - { text: { en: 'A new receiver is created; bound leading arguments still apply.', zh: '创建新的接收者；绑定的前置实参仍然生效。' }, correct: true }
      - { text: { en: 'new always throws for every bound function.', zh: '任何绑定函数与 new 一起使用都会抛错。' }, correct: false }
      - { text: { en: 'The call uses undefined as this in strict mode.', zh: '严格模式下，该调用使用 undefined 作为 this。' }, correct: false }
    explanation: { en: 'Construction forwards to the bound target with a new receiver and the saved leading arguments. It throws only when the target itself is not constructible.', zh: '构造调用以新接收者和已保存的前置实参转发给绑定目标。只有目标本身不可构造时才会抛错。' }
    difficulty: advanced
    tags: [bind, constructor, new, precedence]

  - id: review-generated-audit-subscriber
    type: review
    title: { en: 'Review a generated audit subscriber', zh: '审查生成的审计订阅器' }
    prompt: { en: 'Review this generated subscriber before it processes audit events.', zh: '在这段生成的订阅器处理审计事件前，对它进行审查。' }
    task: { en: 'Register at most once, format valid event ids with the instance prefix, ignore malformed ids, never log tokens, leave input unchanged, and remove the exact callback on stop.', zh: '最多注册一次；用实例前缀格式化合法事件 id；忽略畸形 id；绝不记录 token；不修改输入；停止时移除同一个回调。' }
    code: |
      class AuditSubscriber {
        constructor(bus, prefix) {
          this.bus = bus;
          this.prefix = prefix;
        }

        handle(event) {
          const id = event.id.trim();
          console.log(`${this.prefix}:${id}:${event.token}`);
        }

        start() {
          this.bus.on('audit', this.handle.bind(this));
        }

        stop() {
          this.bus.off('audit', this.handle.bind(this));
        }
      }
    lang: javascript
    issues:
      - line: 8
        kind: edge-case
        note: { en: 'A missing or non-string id makes trim throw. Validate the payload and ignore malformed ids before formatting.', zh: 'id 缺失或不是字符串时，trim 会抛错。格式化前应校验载荷并忽略畸形 id。' }
      - line: 9
        kind: security
        note: { en: 'The log includes event.token even though the task forbids exposing it. Build the message from an allowlist of fields.', zh: '日志包含 event.token，违反了禁止暴露它的要求。应只用允许列表中的字段构造消息。' }
      - line: 13
        kind: readability
        note: { en: 'Creating the bound callback inline hides its ownership and gives stop no stable reference to reuse. Store one clearly named callback field.', zh: '内联创建绑定回调会隐藏其所有权，也不给 stop 留下可复用的稳定引用。应保存一个命名清楚的回调字段。' }
      - line: 13
        kind: performance
        note: { en: 'start has no idempotence guard, so repeated calls accumulate listeners and repeat work for every event.', zh: 'start 没有幂等保护，重复调用会累积监听器，并让每个事件触发重复工作。' }
      - line: 17
        kind: correctness
        note: { en: 'This bind creates a new function, so off cannot remove the function registered by start. Bind once and store that reference.', zh: '这里的 bind 创建了新函数，因此 off 无法移除 start 注册的函数。应只绑定一次并保存该引用。' }
    right: { en: 'The class keeps its bus and prefix dependencies explicit, and it exposes a stop method that makes the intended subscription lifetime visible.', zh: '这个类明确保存了 bus 与 prefix 依赖，并提供 stop 方法来表达预期的订阅生命周期。' }
    checklist:
      - { en: 'Validate event shape before calling string methods.', zh: '调用字符串方法前校验事件结构。' }
      - { en: 'Log only allowlisted, non-secret fields without mutating input.', zh: '只记录允许的非秘密字段，并且不修改输入。' }
      - { en: 'Make start idempotent and keep one bound callback reference.', zh: '让 start 保持幂等，并保存一个绑定回调引用。' }
      - { en: 'Exercise start, emit, stop, and emit again in a lifecycle test.', zh: '在生命周期测试中执行 start、触发、stop、再次触发。' }
    explanation: { en: 'Bind handle once, track subscription state, and validate into local values before logging an allowlisted message. A lifecycle test should prove that repeated start calls do not duplicate work and stop removes the listener.', zh: '应只绑定一次 handle，跟踪订阅状态，并在记录允许字段前把输入校验到局部变量中。生命周期测试应证明重复 start 不会产生重复工作，且 stop 能移除监听器。' }
    difficulty: advanced
    minutes: 8
    tags: [this-binding, callbacks, lifecycle, security, code-review]
