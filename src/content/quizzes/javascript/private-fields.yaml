topic: javascript/private-fields
items:
  - id: predict-private-brand
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      class TokenBox {
        #token = 'inside';

        static hasBrand(value) {
          return #token in value;
        }
      }

      const box = new TokenBox();
      console.log(Object.keys(box));
      console.log(box['#token']);
      console.log(TokenBox.hasBrand(box));
    lang: javascript
    options:
      - { text: { en: "[]\nundefined\ntrue", zh: "[]\nundefined\ntrue" }, correct: true }
      - { text: { en: "['#token']\ninside\ntrue", zh: "['#token']\ninside\ntrue" }, correct: false }
      - { text: { en: "[]\ninside\nfalse", zh: "[]\ninside\nfalse" }, correct: false }
      - { text: { en: 'It throws when bracket notation reads the field.', zh: '方括号访问字段时会抛错。' }, correct: false }
    explanation: { en: 'A private element is not an enumerable string-keyed property. The bracket expression reads a different ordinary property, while the class-scoped brand check sees the real private field.', zh: '私有元素不是可枚举的字符串键属性；方括号表达式读取的是另一个普通属性，而类作用域内的标记检查能识别真正的私有字段。' }
    difficulty: intermediate
    tags: [private-fields, reflection, brand-check]

  - id: predict-static-derived-receiver
    type: predict
    prompt: { en: 'What does calling the inherited static method print?', zh: '调用继承来的静态方法会输出什么？' }
    code: |
      class Sequence {
        static #next = 1;

        static take() {
          return this.#next++;
        }
      }

      class RegionalSequence extends Sequence {}

      console.log(Sequence.take());
      try {
        RegionalSequence.take();
      } catch (error) {
        console.log(error.name);
      }
    lang: javascript
    options:
      - { text: { en: "1\nTypeError", zh: "1\nTypeError" }, correct: true }
      - { text: { en: "1\n2", zh: "1\n2" }, correct: false }
      - { text: { en: "1\n1", zh: "1\n1" }, correct: false }
      - { text: { en: 'The class declaration is a syntax error.', zh: '类声明会产生语法错误。' }, correct: false }
    explanation: { en: 'The inherited method receives RegionalSequence as this, but that constructor lacks the private static brand declared by Sequence. Public static method inheritance does not transfer the private field.', zh: '继承方法中的this是RegionalSequence，但该构造函数没有Sequence声明的静态私有标记。公开静态方法可以继承，私有字段却不会随之转移。' }
    difficulty: advanced
    tags: [private-fields, static, inheritance, receiver]

  - id: spot-proxy-receiver
    title: { en: 'Spot the bug in SecretBox proxying', zh: '找出私有字段代理里的bug' }
    type: spotbug
    prompt: { en: 'Find why the proxy cannot call reveal even though the target can.', zh: '找出目标对象可以调用reveal，而代理不能调用的原因。' }
    code: |
      class SecretBox {
        #secret;

        constructor(secret) {
          this.#secret = secret;
        }

        reveal() {
          return this.#secret;
        }
      }

      const target = new SecretBox('ready');
      const proxy = new Proxy(target, {});
      console.log(proxy.reveal());
    lang: javascript
    issues:
      - line: 15
        kind: correctness
        note: { en: 'Method-call syntax makes proxy the receiver, and the proxy does not carry target’s private brand. Forward this operation explicitly or bind reveal to target at the boundary.', zh: '方法调用语法把proxy作为接收者，而代理不带target的私有标记。应显式转发该操作，或在边界把reveal绑定到target。' }
    explanation: { en: 'A Proxy can forward the public method lookup but cannot transfer a private brand. The failure occurs when reveal evaluates this.#secret.', zh: 'Proxy能转发公开方法查找，却不能转移私有标记；reveal求值this.#secret时才会失败。' }
    difficulty: intermediate
    tags: [private-fields, proxy, receiver, code-review]

  - id: private-fields-and-freeze
    type: mcq
    prompt: { en: 'Which statement about Object.freeze(instance) and private fields is correct?', zh: '关于Object.freeze(instance) 与私有字段，哪项说法正确？' }
    options:
      - { text: { en: 'A class method may still reassign a private field because freeze governs ordinary own properties.', zh: '类方法仍可给私有字段重新赋值，因为freeze管理的是普通自有属性。' }, correct: true }
      - { text: { en: 'The call converts every private field into a non-writable property.', zh: '该调用会把每个私有字段转换成不可写属性。' }, correct: false }
      - { text: { en: 'The call removes the private brand from the instance.', zh: '该调用会移除实例的私有标记。' }, correct: false }
      - { text: { en: 'The call makes Reflect.ownKeys return private names.', zh: '该调用会让Reflect.ownKeys返回私有名称。' }, correct: false }
    explanation: { en: 'Private elements have no property descriptors, so object integrity levels do not govern them. Logical immutability must come from the class interface.', zh: '私有元素没有属性描述符，因此对象完整性级别不管理它们。逻辑不可变性必须由类接口保证。' }
    difficulty: intermediate
    tags: [private-fields, object-freeze, immutability]

  - id: review-generated-profile-store
    type: review
    title: { en: 'Review a generated profile store', zh: '审查生成的档案存储类' }
    prompt: { en: 'Review this generated class before it backs a user directory.', zh: '在用户目录采用这段生成代码前，对它进行审查。' }
    task: { en: 'Store profiles by id, accept save as a callback, validate boundary input, return no token or internal mutable reference, and serve frequently requested sorted summaries.', zh: '按id存储档案，允许把save注册为回调，校验边界输入，不返回令牌或内部可变引用，并支持频繁读取排序摘要。' }
    code: |
      class ProfileStore {
        #profiles = new Map();

        save(profile) {
          this.#profiles.set(profile.id, profile);
          return profile;
        }

        find(id) {
          return this.#profiles.get(id);
        }

        summaries() {
          return [...this.#profiles.values()]
            .sort((left, right) => left.name.localeCompare(right.name))
            .map(({ token, ...profile }) => profile);
        }
      }

      const store = new ProfileStore();
      const save = store.save;
      [{ id: 'a', name: 'Ada', token: 'secret', roles: ['admin'] }]
        .forEach(save);
      console.log(store.summaries());
    lang: javascript
    issues:
      - line: 5
        kind: edge-case
        note: { en: 'Null, non-object, or missing-id input is not rejected. It can throw at profile.id or silently overwrite the Map entry under undefined.', zh: '代码没有拒绝null、非对象或缺少id的输入，可能在profile.id处抛错，也可能静默覆盖Map中以undefined为键的条目。' }
      - line: 6
        kind: security
        note: { en: 'save returns the original record with its token and mutable roles array; find does the same on line 10. Return a redacted projection with the required copy depth.', zh: 'save返回含令牌和可变roles数组的原记录，第10行的find也一样。应按所需复制深度返回隐藏敏感字段的投影。' }
      - line: 15
        kind: performance
        note: { en: 'Every summary request copies and sorts every profile. For the stated frequent-read workload, cache a sorted public projection and invalidate it on successful writes, then measure.', zh: '每次摘要请求都会复制并排序全部档案。针对题目中的高频读取，应缓存排序后的公开投影，在成功写入时失效缓存，并用测量验证。' }
      - line: 23
        kind: correctness
        note: { en: 'forEach invokes the detached save function without store as its receiver, so this is undefined when save accesses #profiles. Register a wrapper or bind once.', zh: 'forEach调用脱离实例的save时不会把store作为接收者，因此save访问 #profiles时this为undefined。应注册包装函数，或只绑定一次。' }
    right: { en: 'The generated code chose a Map for direct id lookup, kept the collection in a true private field, and removed token from the summary projection. Those are useful foundations once the callback, validation, exposure, and repeated-sort problems are fixed.', zh: '生成代码使用Map支持按id直接查询，把集合保存在真正的私有字段中，并从摘要投影移除了token。修复回调、校验、暴露引用和重复排序问题后，这些设计可以保留。' }
    checklist:
      - { en: 'Invoke save through the exact callback registration path.', zh: '通过实际的回调注册路径调用save。' }
      - { en: 'Test null, missing-id, duplicate-id, and non-string-name records.', zh: '测试null、缺少id、重复id和非字符串name的记录。' }
      - { en: 'Mutate every returned object and nested collection, then inspect stored state.', zh: '修改每个返回对象及其嵌套集合，再检查内部存储状态。' }
      - { en: 'Measure summary reads and verify cache invalidation if a cache is added.', zh: '测量摘要读取，并在加入缓存后验证失效逻辑。' }
    explanation: { en: 'Private storage does not repair an unbound callback or make returned records safe. Validate on entry, bind the receiver deliberately, expose redacted copies, and optimize the measured read path without weakening those boundaries.', zh: '私有存储不会修复未绑定回调，也不会让返回记录自动安全。应在入口校验，显式绑定接收者，公开隐藏敏感字段的副本，并在不削弱边界的前提下优化经过测量的读取路径。' }
    difficulty: advanced
    tags: [private-fields, code-review, receiver, data-exposure, performance]
