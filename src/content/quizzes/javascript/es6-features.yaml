topic: javascript/es6-features
items:
  - id: predict-nullish-configuration
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      const defaults = { enabled: true, retries: 3 };
      const input = { enabled: false, retries: 0 };

      const config = {
        ...defaults,
        ...input,
        label: input.meta?.label ?? 'none',
      };

      console.log(config.enabled, config.retries, config.label);
    lang: javascript
    options:
      - { text: { en: 'false 0 none', zh: 'false 0 none' }, correct: true }
      - { text: { en: 'true 3 none', zh: 'true 3 none' }, correct: false }
      - { text: { en: 'false 3 undefined', zh: 'false 3 undefined' }, correct: false }
      - { text: { en: 'It throws while reading meta.', zh: '读取meta时抛错。' }, correct: false }
    explanation: { en: 'The later input spread preserves false and zero while overriding the defaults. Optional chaining produces undefined for the missing meta object, so nullish coalescing supplies none.', zh: '后出现的input展开会用false和0覆盖默认值。meta缺失时，可选链得到undefined，因此空值合并会提供none。' }
    difficulty: beginner
    tags: [object-spread, optional-chaining, nullish-coalescing, predict-output]

  - id: const-binding-semantics
    type: mcq
    prompt: { en: 'What does const guarantee for const settings = { theme: "light" }?', zh: '对于const settings = { theme: "light" }，const保证了什么？' }
    options:
      - { text: { en: 'The settings binding cannot be assigned a different value.', zh: 'settings绑定不能重新赋成另一个值。' }, correct: true }
      - { text: { en: 'Every property of the object is immutable.', zh: '对象的每个属性都不可变。' }, correct: false }
      - { text: { en: 'The object and every nested object are frozen.', zh: '对象及所有嵌套对象都会被冻结。' }, correct: false }
      - { text: { en: 'The binding can be reassigned once outside its block.', zh: '离开所在块后，绑定可以重新赋值一次。' }, correct: false }
    explanation: { en: 'const controls reassignment of one lexical binding. It does not change the mutability of an object stored in that binding.', zh: 'const控制的是一个词法绑定能否重新赋值，不会改变该绑定中对象的可变性。' }
    difficulty: beginner
    tags: [const, bindings, mutation]

  - id: spot-incomplete-optional-chain
    title: { en: 'Spot the bug in the optional chain', zh: '找出可选链里的bug' }
    type: spotbug
    prompt: { en: 'Find why this generated helper still throws for a partially populated profile.', zh: '找出这段生成的辅助函数为何仍会在资料字段不完整时抛错。' }
    code: |
      function cityLabel(account) {
        return account?.profile.address.city ?? 'missing';
      }

      console.log(cityLabel({ profile: {} }));
    lang: javascript
    issues:
      - line: 2
        kind: edge-case
        note: { en: 'Only account is optional. When profile exists but address is undefined, reading city throws; use account?.profile?.address?.city only if all three hops are legitimately optional.', zh: '只有account被标为可选。profile存在而address为undefined时，读取city会抛错；只有三层都确实可选时，才应写成account?.profile?.address?.city。' }
    explanation: { en: 'An optional chain does not make every later property read independently optional. Mark nullable hops deliberately and validate fields that are required.', zh: '可选链不会自动让后面的每次属性读取都各自变成可选。应明确标记可空层级，并验证必需字段。' }
    difficulty: intermediate
    tags: [optional-chaining, nullish-coalescing, code-review]

  - id: transform-versus-runtime
    type: mcq
    prompt: { en: 'A build transforms optional chaining for an older target. What compatibility fact does that prove?', zh: '构建为旧目标转换了可选链。这能证明哪项兼容性事实？' }
    options:
      - { text: { en: 'That transformed expression no longer requires the target parser to recognize optional-chain syntax.', zh: '转换后的表达式不再要求目标解析器识别可选链语法。' }, correct: true }
      - { text: { en: 'The target now provides Promise, Map, and every newer built-in.', zh: '目标现在会提供Promise、Map和所有较新的内置对象。' }, correct: false }
      - { text: { en: 'Browser and Node host APIs are now interchangeable.', zh: '浏览器与Node的宿主API现在可以互换。' }, correct: false }
      - { text: { en: 'Every observable property access is removed.', zh: '所有可观察的属性访问都被移除了。' }, correct: false }
    explanation: { en: 'A syntax transform can let an older parser accept the emitted form. Runtime built-ins, methods, and host APIs remain separate requirements.', zh: '语法转换可以让旧解析器接受输出形式。运行时内置对象、方法和宿主API仍是彼此独立的要求。' }
    difficulty: intermediate
    tags: [compatibility, transpilation, polyfills]

  - id: review-generated-dashboard-loader
    title: { en: 'Review generated dashboard loader', zh: '审查生成的仪表板加载器' }
    type: review
    prompt: { en: 'Review this generated dashboard loader before it reaches an account boundary.', zh: '在这段生成的面板加载代码进入账户边界前，对它进行审查。' }
    task: { en: 'Accept an omitted account, preserve zero retries, return only id, email, retries, theme, and orderCount, never expose credentials, never mutate API data, and load the account and orders concurrently.', zh: '接受省略的账户，保留值为0的重试次数，只返回id、email、retries、theme和orderCount，绝不暴露凭据或修改API数据，并发加载账户与订单。' }
    code: |
      function prepareAccount(input) {
        const { password, ...account } = input;
        const output = {
          ...account,
          retries: input.retries || 3,
        };
        output.preferences.theme ??= 'light';
        return output;
      }

      async function loadDashboard(api, id) {
        const [account, orders] = await Promise.all([
          api.account(id),
          api.orders(id),
        ]);

        return {
          ...prepareAccount(account),
          orderCount: orders.length,
        };
      }
    lang: javascript
    issues:
      - line: 2
        kind: edge-case
        note: { en: 'Destructuring throws when input is omitted, and line 7 also assumes preferences exists. Normalize or reject each nullable layer according to the task.', zh: '省略input时解构会抛错，第7行还假设preferences一定存在。应按照任务要求规范化或拒绝每个可空层级。' }
      - line: 4
        kind: security
        note: { en: 'Spreading a denylisted remainder exposes token and any future enumerable credential. Build the result from the five allowed fields.', zh: '展开按排除列表得到的剩余属性会暴露token以及未来新增的可枚举凭据。应只用五个允许字段构造结果。' }
      - line: 5
        kind: correctness
        note: { en: 'The || fallback replaces the valid retry count zero with 3. Use an undefined-only default or ?? after validating null semantics.', zh: '|| 回退会把合法的重试次数0替换为3。应使用只处理undefined的默认值，或在验证null语义后使用 ??。' }
      - line: 7
        kind: readability
        note: { en: 'The outer spread hides that output.preferences aliases input.preferences, so this assignment also mutates API data. Derive theme while constructing the allowed output.', zh: '外层展开掩盖了output.preferences与input.preferences互为别名，因此这次赋值也修改了API数据。应在构造允许输出时派生theme。' }
    right: { en: 'The generated code gives the normalization step a name, starts the two independent API calls together with Promise.all, and computes orderCount from the returned order collection.', zh: '生成代码为规范化步骤起了明确名称，用Promise.all同时启动两项独立API调用，并从返回的订单集合计算orderCount。' }
    checklist:
      - { en: 'Test omitted and partially populated objects at every nested boundary.', zh: '在每个嵌套边界测试省略对象与字段不完整的对象。' }
      - { en: 'Run zero, false, and an empty string through defaults before accepting a fallback.', zh: '接受回退逻辑前，让0、false和空字符串分别经过默认值处理。' }
      - { en: 'Compare returned keys with the allowlist after adding a new credential to the input.', zh: '向输入新增凭据后，把返回键与允许列表比较。' }
      - { en: 'Snapshot nested API data before and after the call, and verify both requests start before either settles.', zh: '调用前后分别记录嵌套API数据，并验证两个请求都在任一请求落定前启动。' }
    explanation: { en: 'Construct an allowlisted result, default each optional layer deliberately, preserve valid falsy values, and derive nested output without mutating shared references. Promise.all already provides concurrent observation for the two independent calls.', zh: '应按允许列表构造结果，明确处理每个可选层级的默认值，保留合法假值，并在不修改共享引用的前提下派生嵌套输出。Promise.all已能并发观察两项独立调用。' }
    difficulty: advanced
    tags: [code-review, object-spread, defaults, security, promises]
