topic: javascript/currying-composition
items:
  - id: predict-configured-formatter
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      const join = separator => left => right => `${left}${separator}${right}`;
      const joinPath = join('/');
      const apiPath = joinPath('api');

      console.log(apiPath('users'));
      console.log(apiPath('orders'));
    lang: javascript
    options:
      - { text: { en: 'api/users, then api/orders', zh: '先输出 api/users，再输出 api/orders' }, correct: true }
      - { text: { en: 'users/api, then orders/api', zh: '先输出 users/api，再输出 orders/api' }, correct: false }
      - { text: { en: 'api/users, then users/orders', zh: '先输出 api/users，再输出 users/orders' }, correct: false }
      - { text: { en: 'It throws because apiPath can be called only once.', zh: '程序抛出异常，因为 apiPath 只能调用一次。' }, correct: false }
    explanation: { en: 'Each partial call closes over its supplied value. Calling apiPath twice reuses the captured separator and left side without changing them.', zh: '每次部分调用都通过闭包保存已传入的值。两次调用 apiPath 会复用分隔符和左侧值，不会修改它们。' }
    difficulty: beginner
    tags: [currying, closures, predict-output]

  - id: predict-pipe-direction
    type: predict
    prompt: { en: 'What value is printed by this left-to-right pipeline?', zh: '这条从左到右的管道会输出什么值？' }
    code: |
      const pipe = (...steps) => input =>
        steps.reduce((value, step) => step(value), input);

      const double = value => value * 2;
      const subtractOne = value => value - 1;

      console.log(pipe(double, subtractOne)(3));
    lang: javascript
    options:
      - { text: { en: '4', zh: '4' }, correct: false }
      - { text: { en: '5', zh: '5' }, correct: true }
      - { text: { en: '6', zh: '6' }, correct: false }
      - { text: { en: 'The pipeline returns a function.', zh: '管道返回一个函数。' }, correct: false }
    explanation: { en: 'pipe applies double first, producing 6, and subtractOne then produces 5. Reversing the stages would produce 4.', zh: 'pipe 先执行 double 得到 6，再由 subtractOne 得到 5。交换阶段顺序才会得到 4。' }
    difficulty: beginner
    tags: [pipe, composition, predict-output]

  - id: function-length-default
    type: mcq
    prompt: { en: 'Why is fn.length unsafe as the only completion rule for a universal curry helper?', zh: '为什么不能只用 fn.length 作为万能 curry 的完成条件？' }
    options:
      - { text: { en: 'It stops counting at the first default parameter and excludes rest parameters.', zh: '它在首个默认参数处停止计数，也不计算剩余参数。' }, correct: true }
      - { text: { en: 'It counts every argument ever passed to the function.', zh: '它会统计函数曾经收到的所有实参。' }, correct: false }
      - { text: { en: 'It is available only on arrow functions.', zh: '它只存在于箭头函数上。' }, correct: false }
      - { text: { en: 'It always returns the number of required business fields.', zh: '它始终返回业务必填字段的数量。' }, correct: false }
    explanation: { en: 'Function.length reflects a limited part of the declared parameter list, not the target operation’s full business contract. Helpers need an explicit arity when that reflection value is insufficient.', zh: 'Function.length 只反映声明参数列表的一部分，不代表目标操作的完整业务契约。该值不够时，辅助函数需要显式参数数量。' }
    difficulty: intermediate
    tags: [arity, function-length, defaults]

  - id: currying-versus-partial-application
    type: mcq
    prompt: { en: 'Which statement distinguishes strict currying from partial application?', zh: '哪项陈述准确区分了严格柯里化与偏应用？' }
    options:
      - { text: { en: 'Strict currying rewrites the call into unary layers; partial application pre-binds some arguments and returns a function for the rest.', zh: '严格柯里化把调用改写成一元层级；偏应用预先绑定部分实参，并返回接收剩余实参的函数。' }, correct: true }
      - { text: { en: 'Partial application always binds exactly one argument.', zh: '偏应用每次只能绑定一个实参。' }, correct: false }
      - { text: { en: 'Currying requires an asynchronous target function.', zh: '柯里化要求目标函数必须是异步函数。' }, correct: false }
      - { text: { en: 'The two terms always describe identical call contracts.', zh: '两个术语始终表示完全相同的调用契约。' }, correct: false }
    explanation: { en: 'Strict currying defines a sequence of one-argument calls. A partial application can bind several arguments at once without converting the whole signature into unary layers.', zh: '严格柯里化规定一串单实参调用。偏应用可以一次绑定多个实参，不必把完整签名转换成一元层级。' }
    difficulty: intermediate
    tags: [currying, partial-application, terminology]

  - id: spot-sync-pipe-promise
    type: spotbug
    prompt: { en: 'Find the contract error in this generated account-name pipeline.', zh: '找出这段生成的账户名称管道中的契约错误。' }
    code: |
      const pipe = (...steps) => input =>
        steps.reduce((value, step) => step(value), input);

      const load = async id => ({ id, name: 'Ada' });
      const getName = account => account.name;

      const loadName = pipe(load, getName);
      loadName(7).then(console.log);
    lang: javascript
    issues:
      - line: 5
        kind: correctness
        note: { en: 'getName receives the Promise returned by load, not its fulfilled account, because pipe is synchronous.', zh: 'pipe 是同步的，因此 getName 收到的是 load 返回的 Promise，而不是兑现后的账户对象。' }
    explanation: { en: 'Use an async-aware pipeline that awaits every stage, or write the two awaits explicitly. Merely marking load async does not change the reducer’s contract.', zh: '应使用会等待每个阶段的异步管道，或显式写出 await。仅把 load 标记为 async 不会改变 reducer 的契约。' }
    difficulty: intermediate
    tags: [async, promises, pipe, spotbug]

  - id: review-generated-order-report
    type: review
    title: { en: 'Review a generated order-report pipeline', zh: '审查生成的订单报告管道' }
    prompt: { en: 'Review this generated currying and composition code against the stated task.', zh: '根据任务要求审查这段生成的柯里化与组合代码。' }
    task: { en: 'Build a reusable report function that filters by a minimum, keeps caller input unchanged, emits only public order data, defaults the label prefix to an empty string, and serializes after async metadata is ready.', zh: '构建可复用报告函数：按最低金额筛选，不修改调用方输入，只输出公开订单数据，标签前缀默认为空字符串，并在异步元数据就绪后再序列化。' }
    code: |
      function curry(fn) {
        return function curried(...args) {
          if (args.length >= fn.length) return fn(...args);
          return (...next) => curried(...args, ...next);
        };
      }

      const pipe = (...steps) => input =>
        steps.reduce((value, step) => step(value), input);

      const selectOrders = curry((minimum, options = {}, orders) => {
        const kept = orders.filter(order => order.total >= minimum);
        kept.sort((a, b) => b.total - a.total);
        return kept.map(order => ({
          ...order,
          label: options.prefix + order.id,
        }));
      });

      const buildReport = minimum => pipe(
        selectOrders(minimum),
        async orders => ({ orders, generatedAt: Date.now() }),
        report => JSON.stringify(report),
      );
    lang: javascript
    issues:
      - line: 3
        kind: correctness
        note: { en: 'fn.length is 1 because options has a default, so selectOrders(minimum) executes before orders exists.', zh: 'options 带有默认值，因此 fn.length 是 1；selectOrders(minimum) 会在 orders 存在前提前执行。' }
      - line: 15
        kind: security
        note: { en: 'Spreading each complete order can expose non-public fields such as payment tokens; construct the allowed public shape instead.', zh: '展开完整订单可能泄露支付令牌等非公开字段；应显式构造允许输出的公开结构。' }
      - line: 16
        kind: edge-case
        note: { en: 'When prefix is omitted, options.prefix is undefined and labels begin with the text undefined instead of an empty prefix.', zh: '省略 prefix 时，options.prefix 是 undefined，标签会以 undefined 文本开头，而不是使用空前缀。' }
      - line: 22
        kind: readability
        note: { en: 'An anonymous async stage hides the Promise boundary inside a helper whose name and implementation claim synchronous value passing.', zh: '匿名异步阶段把 Promise 边界藏进名称与实现都表示同步传值的辅助函数中。' }
    right: { en: 'Filtering creates a new array before sort, so the caller’s array order is not mutated, and the minimum predicate is easy to identify.', zh: '筛选会在排序前创建新数组，因此不会修改调用方数组顺序，而且最低金额谓词很容易识别。' }
    checklist:
      - { en: 'Compare declared parameters with fn.length and any explicit arity.', zh: '比较声明形参与 fn.length，以及显式参数数量。' }
      - { en: 'Trace every stage’s value-or-Promise contract.', zh: '跟踪每个阶段的普通值或 Promise 契约。' }
      - { en: 'Allowlist public output fields and test omitted options.', zh: '采用公开输出字段白名单，并测试省略选项的情况。' }
      - { en: 'Check both array identity and nested object exposure.', zh: '同时检查数组标识与嵌套对象暴露。' }
    explanation: { en: 'Use an explicit arity or configuration factory, map to an allowlisted public shape with a real prefix default, and compose the metadata step through an async-aware pipeline before serialization.', zh: '应使用显式参数数量或配置工厂，把订单映射成字段白名单中的公开结构并提供真实的前缀默认值，再通过异步管道等待元数据后序列化。' }
    difficulty: advanced
    minutes: 8
    tags: [code-review, currying, composition, async]
