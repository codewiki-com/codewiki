topic: javascript/weakmap-weakset
items:
  - id: predict-stored-undefined
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      const key = {};
      const cache = new WeakMap([[key, undefined]]);

      console.log(cache.has(key), cache.get(key));
      console.log(cache.has({}), cache.get({}));
    lang: javascript
    options:
      - { text: { en: "true undefined\nfalse undefined", zh: "true undefined\nfalse undefined" }, correct: true }
      - { text: { en: "false undefined\nfalse undefined", zh: "false undefined\nfalse undefined" }, correct: false }
      - { text: { en: "true null\ntrue null", zh: "true null\ntrue null" }, correct: false }
      - { text: { en: 'It throws because WeakMap cannot store undefined.', zh: '程序抛错，因为 WeakMap 不能保存 undefined。' }, correct: false }
    explanation: { en: 'The original key has an entry whose value is undefined, so has distinguishes it from absence. Each {} expression creates a different object identity.', zh: '原键存在一个值为 undefined 的条目，因此 has 可以把它与缺失区分开。每个 {} 表达式都会创建不同的对象标识。' }
    difficulty: intermediate
    tags: [weakmap, object-identity, predict-output]

  - id: choose-eligible-weak-keys
    type: mcq
    prompt: { en: 'Which list contains only values accepted as WeakMap keys in Node 24?', zh: '哪一组值都能在 Node 24 中作为 WeakMap 键？' }
    options:
      - { text: { en: 'An object, a function, and Symbol("local")', zh: '对象、函数和 Symbol("local")' }, correct: true }
      - { text: { en: 'An object, "user-1", and Symbol("local")', zh: '对象、"user-1" 和 Symbol("local")' }, correct: false }
      - { text: { en: 'A function, Symbol.for("shared"), and an array', zh: '函数、Symbol.for("shared") 和数组' }, correct: false }
      - { text: { en: 'An array, null, and Symbol.iterator', zh: '数组、null 和 Symbol.iterator' }, correct: false }
    explanation: { en: 'Objects, including functions, and non-registered symbols are collectable keys. Strings, null, registered symbols, and well-known symbols are not.', zh: '对象（包括函数）和未注册符号是可回收键。字符串、null、注册符号与知名符号都不是。' }
    difficulty: intermediate
    tags: [weak-keys, symbol, node-24]

  - id: spot-shared-child-as-cycle
    title: { en: 'Spot the bug in cycle detection', zh: '找出环检测里的 bug' }
    type: spotbug
    prompt: { en: 'Find why this generated cycle detector reports a shared child as a cycle.', zh: '找出这个生成式循环检测器为何把共享子对象报告成循环。' }
    code: |
      function containsCycle(root) {
        const seen = new WeakSet();
        function visit(value) {
          if (value === null || typeof value !== 'object') return false;
          if (seen.has(value)) return true;
          seen.add(value);
          return Object.values(value).some(visit);
        }
        return visit(root);
      }

      const address = { country: 'FR' };
      const order = { billing: address, shipping: address };
      console.log(containsCycle(order));
    lang: javascript
    issues:
      - line: 5
        kind: correctness
        note: { en: 'seen means every object visited anywhere, so the second path to address returns true even though no edge returns to an ancestor. Track current ancestors and delete a node when its recursive visit finishes.', zh: 'seen 表示整次遍历中见过的所有对象，因此第二条到 address 的路径会返回 true，尽管没有边回到祖先。应记录当前祖先，并在节点递归访问结束时删除它。' }
    explanation: { en: 'Repeated identity and a graph cycle are different conditions. A cycle detector needs recursion-stack membership, while a deduplicating traversal needs all previously seen objects.', zh: '重复对象标识与图中的循环是不同条件。循环检测需要递归栈成员关系，去重遍历才需要全部已见对象。' }
    difficulty: advanced
    tags: [weakset, cycle-detection, object-graph, code-review]

  - id: reason-for-no-enumeration
    type: mcq
    prompt: { en: 'Why do WeakMap and WeakSet omit iteration and size?', zh: 'WeakMap 与 WeakSet 为什么不提供迭代和 size？' }
    options:
      - { text: { en: 'Enumeration would expose garbage-collection-dependent liveness and make ordinary program results nondeterministic.', zh: '枚举会暴露依赖垃圾回收的存活状态，使普通程序结果出现不确定性。' }, correct: true }
      - { text: { en: 'Weak collections store entries in insertion order but hide that order only for speed.', zh: '弱集合按插入顺序保存条目，只是为了速度而隐藏顺序。' }, correct: false }
      - { text: { en: 'JavaScript objects cannot be iterated by any built-in collection.', zh: '任何内建 JavaScript 集合都不能迭代对象。' }, correct: false }
      - { text: { en: 'Calling size would force every value to become a primitive.', zh: '读取 size 会迫使每个值变成原始值。' }, correct: false }
    explanation: { en: 'The set of live weak keys may change when the collector runs. The API avoids exposing that schedule through keys, entries, iterators, or a count.', zh: '垃圾回收器运行时，仍存活的弱键集合可能变化。API 不通过键、条目、迭代器或计数暴露这种调度。' }
    difficulty: intermediate
    tags: [non-enumerable, garbage-collection, reachability]

  - id: review-generated-request-cache
    type: review
    title: { en: 'Review a generated request cache', zh: '审查生成的请求缓存' }
    prompt: { en: 'Review this generated summary cache before it handles application requests.', zh: '在这个生成式摘要缓存处理应用请求前，对它进行审查。' }
    task: { en: 'Cache a public payload summary by request identity without keeping requests alive, reject invalid request shapes, never expose tokens or mutable cached data, and do not promise an entry count.', zh: '按请求对象标识缓存公开的载荷摘要，不让缓存阻止请求回收；拒绝无效请求形状，不暴露令牌或可变缓存数据，也不承诺条目计数。' }
    code: |
      const summaries = new WeakMap();

      function summarizeRequest(request) {
        const cacheKey = { id: request.id };
        if (summaries.has(cacheKey)) {
          return summaries.get(cacheKey);
        }

        const fields = Object.keys(request.payload).sort();
        const summary = {
          id: String(request.id),
          fields,
          token: request.token,
        };
        summaries.set(cacheKey, summary);
        return summary;
      }

      function cachedCount() {
        return summaries.size || 0;
      }
    lang: javascript
    issues:
      - line: 4
        kind: correctness
        note: { en: 'Every call creates a new key that no caller retains, so the cache never hits and its entry can become collectable immediately. Use request itself as the key.', zh: '每次调用都会创建调用方不保留的新键，因此缓存永远无法命中，条目也可能立即变得可回收。应直接使用 request 作为键。' }
      - line: 9
        kind: edge-case
        note: { en: 'Null, primitive, or missing payload input is not rejected and can fail inside Object.keys with an incidental error. Validate the request shape at the boundary.', zh: '代码没有拒绝 null、原始值或缺少 payload 的输入，可能在 Object.keys 中偶然报错。应在边界校验请求形状。' }
      - line: 13
        kind: security
        note: { en: 'The supposedly public summary copies request.token. Build the result from an explicit allowlist that excludes secrets.', zh: '本应公开的摘要复制了 request.token。应通过明确允许列表构造结果并排除秘密。' }
      - line: 20
        kind: readability
        note: { en: 'cachedCount advertises an unsupported capability and silently turns undefined size into zero. Remove the function or choose Map if exact entry management is a real requirement.', zh: 'cachedCount 宣称了不受支持的能力，还把 undefined 的 size 静默变成零。应删除该函数；若确实需要精确管理条目，则改用 Map。' }
    right: { en: 'The generated code chose a WeakMap for request-owned lifetime, checks has before get, copies payload key names into a separate array, and gives the summarization boundary a clear name.', zh: '生成代码为跟随请求的生命周期选择了 WeakMap，在 get 前调用 has，把载荷键名复制到独立数组，并清楚命名了摘要边界。' }
    checklist:
      - { en: 'Call twice with the same request and once with an equal-looking request, then count actual computations.', zh: '用同一请求调用两次，再用内容相同的新请求调用一次，并统计实际计算次数。' }
      - { en: 'Test null, primitive, missing-payload, and accessor-bearing inputs at the boundary.', zh: '在边界测试 null、原始值、缺少 payload 和带访问器的输入。' }
      - { en: 'Compare every returned key with a public allowlist and mutate nested returned values.', zh: '把每个返回键与公开允许列表比较，并尝试修改返回的嵌套值。' }
      - { en: 'Search consumers for enumeration, count, serialization, expiration, and ID-lookup requirements.', zh: '搜索使用方是否有枚举、计数、序列化、过期和按 ID 查询需求。' }
    explanation: { en: 'Key the WeakMap by the original request, validate before property access, and return an immutable allowlisted projection. If callers need to inspect every cached entry, the design requires an explicitly managed Map instead.', zh: '应以原请求作为 WeakMap 键，在属性访问前校验，并返回不可变的允许列表投影。若调用方必须检查每个缓存条目，设计就需要改用显式管理的 Map。' }
    difficulty: advanced
    minutes: 9
    tags: [weakmap, code-review, object-identity, security, cache]
