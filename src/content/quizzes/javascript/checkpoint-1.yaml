topic: javascript/checkpoint-1
items:
  - id: checkpoint-1-typeof-null
    type: mcq
    prompt: { en: 'What does `typeof null` evaluate to?', zh: '`typeof null`的求值结果是什么？' }
    options:
      - { text: { en: '`"object"`', zh: '`"object"`' }, correct: true }
      - { text: { en: '`"null"`', zh: '`"null"`' }, correct: false }
      - { text: { en: '`"undefined"`', zh: '`"undefined"`' }, correct: false }
    explanation: { en: '`typeof null` returns `"object"` because of a historical JavaScript behavior; test for `null` directly when that distinction matters.', zh: '由于JavaScript的历史行为，`typeof null`返回`"object"`；需要区分时应直接判断值是否为`null`。' }
    difficulty: beginner
    tags: [checkpoint]
  - id: checkpoint-1-const
    type: fill
    prompt: { en: 'Name the declaration keyword for a block-scoped binding that cannot be reassigned.', zh: '写出用于声明块级作用域且不可重新赋值绑定的关键字。' }
    answer: const
    explanation: { en: '`const` prevents rebinding, although properties of a referenced object may still be mutated.', zh: '`const`阻止重新绑定，但它所引用对象的属性仍可能被修改。' }
    difficulty: beginner
    tags: [checkpoint]
  - id: checkpoint-1-map-output
    type: mcq
    prompt: { en: 'What is the value of `[1, 2, 3].map(n => n * 2)`?', zh: '`[1, 2, 3].map(n => n * 2)`的值是什么？' }
    options:
      - { text: { en: '`[2, 4, 6]`', zh: '`[2, 4, 6]`' }, correct: true }
      - { text: { en: '`[1, 2, 3]`', zh: '`[1, 2, 3]`' }, correct: false }
      - { text: { en: '`12`', zh: '`12`' }, correct: false }
    explanation: { en: '`map` returns a new array containing the callback result for each source element.', zh: '`map`会为源数组的每个元素保存一次回调结果，并返回新数组。' }
    difficulty: beginner
    tags: [checkpoint]
  - id: checkpoint-1-destructuring-default
    type: fill
    prompt: { en: 'Which exact value triggers a destructuring default initializer?', zh: '哪一个确切的值会触发解构默认值？' }
    answer: undefined
    explanation: { en: 'A destructuring default runs for `undefined`, but not for `null`, `false`, `0`, or an empty string.', zh: '解构默认值只会在值为`undefined`时生效，不会因`null`、`false`、`0`或空字符串而生效。' }
    difficulty: intermediate
    tags: [checkpoint]
  - id: checkpoint-1-object-keys
    type: mcq
    prompt: { en: 'Which properties does `Object.keys(value)` return?', zh: '`Object.keys(value)`会返回哪些属性？' }
    options:
      - { text: { en: 'Own enumerable string-keyed properties', zh: '对象自身的可枚举字符串键属性' }, correct: true }
      - { text: { en: 'Own and inherited enumerable properties', zh: '对象自身及继承的全部可枚举属性' }, correct: false }
      - { text: { en: 'All own properties, including symbols and non-enumerable keys', zh: '对象自身的全部属性，包括Symbol键和不可枚举键' }, correct: false }
    explanation: { en: '`Object.keys` excludes inherited properties, symbol keys, and non-enumerable own properties.', zh: '`Object.keys`不包含继承属性、Symbol键和对象自身的不可枚举属性。' }
    difficulty: intermediate
    tags: [checkpoint]
  - id: checkpoint-1-empty-reduce
    type: fill
    prompt: { en: 'Name the error class thrown when `[].reduce(callback)` has no initial value.', zh: '写出`[].reduce(callback)`未提供初始值时抛出的错误类型。' }
    answer: TypeError
    explanation: { en: 'Without an initial accumulator, an empty array has no first element from which `reduce` can start.', zh: '没有初始累加值时，空数组也没有可供`reduce`开始计算的首个元素，因此会抛出`TypeError`。' }
    difficulty: intermediate
    tags: [checkpoint]
  - id: checkpoint-1-nullish-fallback
    type: mcq
    prompt: { en: 'Which expression uses `fallback` only when `count` is `null` or `undefined`, while preserving `0`?', zh: '哪个表达式只在`count`为`null`或`undefined`时使用`fallback`，并保留`0`？' }
    options:
      - { text: { en: '`count ?? fallback`', zh: '`count ?? fallback`' }, correct: true }
      - { text: { en: '`count || fallback`', zh: '`count || fallback`' }, correct: false }
      - { text: { en: '`Boolean(count) && fallback`', zh: '`Boolean(count) && fallback`' }, correct: false }
    explanation: { en: 'Nullish coalescing treats only `null` and `undefined` as missing; logical OR also replaces other falsy values.', zh: '空值合并运算符只把`null`和`undefined`视为缺失；逻辑或还会替换其他假值。' }
    difficulty: advanced
    tags: [checkpoint]
  - id: checkpoint-1-rest-position
    type: fill
    prompt: { en: 'Name the kind of function parameter that must appear last in the parameter list.', zh: '写出必须位于函数形参列表末尾的形参类型。' }
    answer: rest parameter
    explanation: { en: 'A rest parameter collects all remaining arguments, so no parameter may follow it.', zh: '剩余参数会收集后续所有实参，因此它后面不能再有其他形参。' }
    difficulty: advanced
    tags: [checkpoint]
