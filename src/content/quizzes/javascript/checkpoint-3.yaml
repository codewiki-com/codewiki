topic: javascript/checkpoint-3
items:
  - id: checkpoint-3-event-loop-order
    type: mcq
    prompt: { en: 'A script queues a zero-delay timer, queues `Promise.resolve().then(() => log.push("microtask"))`, and then pushes `"sync"`. Which final order is correct?', zh: '脚本依次安排零延时定时器、安排 `Promise.resolve().then(() => log.push("microtask"))`，再压入 `"sync"`。最终顺序是哪一项？' }
    options:
      - { text: { en: '`["sync", "microtask", "timer"]`', zh: '`["sync", "microtask", "timer"]`' }, correct: true }
      - { text: { en: '`["sync", "timer", "microtask"]`', zh: '`["sync", "timer", "microtask"]`' }, correct: false }
      - { text: { en: '`["microtask", "sync", "timer"]`', zh: '`["microtask", "sync", "timer"]`' }, correct: false }
    explanation: { en: 'Synchronous code finishes first, the microtask queue drains next, and the timer task runs afterward.', zh: '同步代码先执行完毕，随后清空微任务队列，最后才执行定时器任务。' }
    difficulty: beginner
    tags: [checkpoint]
  - id: checkpoint-3-promise-initial-state
    type: fill
    prompt: { en: 'Name the initial state of a newly created Promise before it settles.', zh: '写出新建 Promise 在敲定前的初始状态。' }
    answer: pending
    explanation: { en: 'A Promise starts as `pending` and settles once as either fulfilled or rejected.', zh: 'Promise 初始为 `pending`，之后只能敲定为 fulfilled 或 rejected，且只会敲定一次。' }
    difficulty: beginner
    tags: [checkpoint]
  - id: checkpoint-3-all-order
    type: mcq
    prompt: { en: '`slow` fulfills with `"slow"` after `fast` fulfills with `"fast"`. What does `await Promise.all([slow, fast])` produce?', zh: '`slow` 在 `fast` 以 `"fast"` 兑现后才以 `"slow"` 兑现。`await Promise.all([slow, fast])` 会产生什么？' }
    options:
      - { text: { en: '`["slow", "fast"]`', zh: '`["slow", "fast"]`' }, correct: true }
      - { text: { en: '`["fast", "slow"]`', zh: '`["fast", "slow"]`' }, correct: false }
      - { text: { en: 'Only `"fast"`', zh: '只有 `"fast"`' }, correct: false }
    explanation: { en: '`Promise.all` preserves input order in its result, regardless of completion order.', zh: '`Promise.all` 的结果保持输入顺序，不受各 Promise 完成顺序影响。' }
    difficulty: beginner
    tags: [checkpoint]
  - id: checkpoint-3-any-failure
    type: fill
    prompt: { en: 'Name the error class with which `Promise.any` rejects when every input rejects.', zh: '当所有输入都被拒绝时，`Promise.any` 会以哪种错误类型拒绝？' }
    answer: AggregateError
    explanation: { en: '`Promise.any` collects all rejection reasons in an `AggregateError` when no input fulfills.', zh: '当没有任何输入兑现时，`Promise.any` 会把全部拒绝原因收集到 `AggregateError` 中。' }
    difficulty: intermediate
    tags: [checkpoint]
  - id: checkpoint-3-async-return
    type: mcq
    prompt: { en: 'What does calling `async function value() { return 7 }` return?', zh: '调用 `async function value() { return 7 }` 会返回什么？' }
    options:
      - { text: { en: 'A Promise fulfilled with `7`', zh: '一个以 `7` 兑现的 Promise' }, correct: true }
      - { text: { en: 'The number `7` directly', zh: '直接返回数字 `7`' }, correct: false }
      - { text: { en: 'A pending Promise that never settles', zh: '一个永远不会敲定的 pending Promise' }, correct: false }
    explanation: { en: 'Every async function call returns a Promise; a plain returned value becomes its fulfillment value.', zh: '每次调用异步函数都会返回 Promise；普通返回值会成为该 Promise 的兑现值。' }
    difficulty: intermediate
    tags: [checkpoint]
  - id: checkpoint-3-async-iterator-symbol
    type: fill
    prompt: { en: 'Name the well-known symbol method that an asynchronous iterable exposes.', zh: '写出异步可迭代对象需要提供的内置 Symbol 方法。' }
    answer: Symbol.asyncIterator
    explanation: { en: '`for await...of` obtains an asynchronous iterator through `Symbol.asyncIterator`.', zh: '`for await...of` 会通过 `Symbol.asyncIterator` 获取异步迭代器。' }
    difficulty: intermediate
    tags: [checkpoint]
  - id: checkpoint-3-concurrent-await
    type: mcq
    prompt: { en: 'Two requests are independent. Which form starts both before waiting and preserves both results?', zh: '两个请求互不依赖。哪种写法会先启动两者，再等待并保留两项结果？' }
    options:
      - { text: { en: '`const [user, prefs] = await Promise.all([fetchUser(), fetchPrefs()])`', zh: '`const [user, prefs] = await Promise.all([fetchUser(), fetchPrefs()])`' }, correct: true }
      - { text: { en: '`const user = await fetchUser(); const prefs = await fetchPrefs()`', zh: '`const user = await fetchUser(); const prefs = await fetchPrefs()`' }, correct: false }
      - { text: { en: '`const [user, prefs] = await Promise.race([fetchUser(), fetchPrefs()])`', zh: '`const [user, prefs] = await Promise.race([fetchUser(), fetchPrefs()])`' }, correct: false }
    explanation: { en: '`Promise.all` starts from both already-created request Promises and waits for both; consecutive awaits serialize them.', zh: '`Promise.all` 接收两个已经创建的请求 Promise 并等待两者；连续使用 `await` 会让请求串行执行。' }
    difficulty: advanced
    tags: [checkpoint]
  - id: checkpoint-3-stream-pressure
    type: fill
    prompt: { en: 'Name the flow-control condition that prevents a fast stream producer from overwhelming a slow consumer.', zh: '写出防止快速流生产者压垮慢速消费者的流量控制机制。' }
    answer: backpressure
    explanation: { en: 'Backpressure signals that a consumer cannot currently accept data at the producer’s rate, so production must pause or slow down.', zh: '背压（backpressure）表示消费者暂时跟不上生产速度，因此生产端需要暂停或降速。' }
    difficulty: advanced
    tags: [checkpoint]
