topic: javascript/event-loop
items:
  - id: predict-nested-microtask-order
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      console.log('start');
      queueMicrotask(() => {
        console.log('A');
        queueMicrotask(() => console.log('C'));
      });
      Promise.resolve().then(() => console.log('B'));
      console.log('end');
    lang: javascript
    options:
      - { text: { en: 'start, end, A, B, C', zh: 'start、end、A、B、C' }, correct: true }
      - { text: { en: 'start, A, C, B, end', zh: 'start、A、C、B、end' }, correct: false }
      - { text: { en: 'start, end, A, C, B', zh: 'start、end、A、C、B' }, correct: false }
      - { text: { en: 'start, end, B, A, C', zh: 'start、end、B、A、C' }, correct: false }
    explanation: { en: 'The script finishes first. A and B then run in enqueue order, and C is appended behind the already queued B.', zh: '脚本会先执行完。之后A与B按入队顺序运行，C则追加到已经排队的B后面。' }
    difficulty: beginner
    tags: [microtask, scheduling, predict-output]

  - id: timer-delay-contract
    type: mcq
    prompt: { en: 'What does a 20 ms setTimeout delay guarantee?', zh: 'setTimeout的20 ms延迟保证了什么？' }
    options:
      - { text: { en: 'The callback cannot become eligible before the threshold, but it may run later.', zh: '回调不会在阈值之前满足执行条件，但可能更晚运行。' }, correct: true }
      - { text: { en: 'The callback begins exactly 20 ms after registration.', zh: '回调会在注册20 ms后精确开始。' }, correct: false }
      - { text: { en: 'The callback interrupts any JavaScript currently on the stack after 20 ms.', zh: '20 ms后，回调会打断调用栈上正在运行的JavaScript。' }, correct: false }
    explanation: { en: 'A timer delay is a minimum threshold. A busy stack, microtasks, phase work, and operating-system scheduling can postpone the callback.', zh: '定时器延迟是最小阈值。繁忙的调用栈、微任务、阶段工作和操作系统调度都可能推迟回调。' }
    difficulty: beginner
    tags: [timers, threshold]

  - id: spot-detached-promise
    title: { en: 'Spot the bug in notification delivery', zh: '找出通知投递里的bug' }
    type: spotbug
    prompt: { en: 'Find why this function reports completion before every notification is sent.', zh: '找出为什么这个函数会在所有通知发出前就报告完成。' }
    code: |
      async function notifyAll(client, recipients) {
        recipients.forEach(async (recipient) => {
          await client.send(recipient);
        });
        return { sent: recipients.length };
      }
    lang: javascript
    issues:
      - line: 2
        lines: 3
        kind: correctness
        note: { en: 'forEach ignores the Promises returned by its async callback, so notifyAll returns without waiting and cannot propagate send failures.', zh: 'forEach会忽略异步回调返回的Promise，因此notifyAll不等待发送完成，也无法传播发送失败。' }
    explanation: { en: 'Map recipients to Promises and await the chosen combinator, or use a bounded worker pool when the list can be large.', zh: '应把recipients映射成Promise并等待所选组合器；列表可能很大时，则使用有界worker池。' }
    difficulty: intermediate
    tags: [promises, task-ownership, code-review]

  - id: review-generated-profile-loader
    type: review
    title: { en: 'Review a generated profile loader', zh: '审查生成的资料加载器' }
    prompt: { en: 'Review this generated Node.js loader against the task and identify five distinct risks.', zh: '根据任务要求审查这段生成的Node.js加载器，找出五类不同的风险。' }
    task: { en: 'Load user-selected JSON profiles concurrently, preserve input order, reject invalid or missing files, and allow no more than four reads at once.', zh: '并发加载用户选择的JSON资料，保持输入顺序，在文件无效或缺失时拒绝，并且最多同时读取四个文件。' }
    code: |
      const { readFile } = require('node:fs');

      async function loadProfiles(ids) {
        const profiles = [];
        ids.forEach(async (id) => {
          const profile = await readProfile(id);
          profiles.push(profile);
        });
        setTimeout(() => console.log('loaded'), 100);
        return profiles;
      }

      function readProfile(id) {
        return new Promise((resolve) => {
          readFile(`profiles/${id}.json`, 'utf8', (error, text) => {
            if (error) {
              resolve(null);
              return;
            }
            resolve(JSON.parse(text));
          });
        });
      }

      loadProfiles(process.argv.slice(2)).then(console.log);
    lang: javascript
    issues:
      - line: 5
        lines: 4
        kind: correctness
        note: { en: 'forEach discards the callback Promises, so the function returns an incomplete array and cannot propagate read failures.', zh: 'forEach丢弃了回调Promise，因此函数会返回尚未完成的数组，也无法传播读取失败。' }
      - line: 5
        kind: performance
        note: { en: 'One read starts for every id with no four-operation capacity gate.', zh: '代码为每个id启动一次读取，却没有设置最多四项操作的容量门槛。' }
      - line: 9
        kind: readability
        note: { en: 'A 100 ms timer is an unrelated completion guess and the loaded message can disagree with actual state.', zh: '100 ms定时器只是与完成条件无关的猜测，loaded消息可能与实际状态不符。' }
      - line: 15
        kind: security
        note: { en: 'Interpolating an unvalidated id into a path permits traversal outside the intended profiles directory.', zh: '把未经验证的id插入路径，可能允许读取预期资料目录之外的文件。' }
      - line: 20
        kind: edge-case
        note: { en: 'JSON.parse can throw inside the later file callback, where this Promise constructor no longer catches it, leaving the Promise unsettled.', zh: 'JSON.parse可能在稍后的文件回调中抛出异常；此时Promise构造器不再捕获它，Promise会一直没有结束状态。' }
    right: { en: 'The code uses non-blocking file I/O and isolates one-profile loading in a helper with a Promise interface.', zh: '代码使用非阻塞文件I/O，并把单项资料加载隔离到一个采用Promise接口的辅助函数中。' }
    checklist:
      - { en: 'Map every started operation to an owner and an await point.', zh: '把每项已启动操作对应到明确的所有者和等待点。' }
      - { en: 'Validate path components and confirm the resolved path stays under the allowed root.', zh: '验证路径组成部分，并确认解析后的路径仍位于允许的根目录下。' }
      - { en: 'Exercise missing files and malformed JSON through the rejection path.', zh: '让缺失文件和格式错误的JSON走过拒绝路径。' }
      - { en: 'Measure peak concurrency and reverse completion order in a test.', zh: '在测试中测量并发峰值，并故意反转完成顺序。' }
    explanation: { en: 'Use validated paths, a four-worker pool or limiter, and indexed Promise results. Reject read and parse failures explicitly instead of using a timer as a completion signal.', zh: '应使用经过验证的路径、四worker池或限流器，以及带索引的Promise结果。读取和解析失败应显式拒绝，不能用定时器作为完成信号。' }
    difficulty: advanced
    minutes: 8
    tags: [event-loop, code-review, bounded-concurrency, filesystem]
