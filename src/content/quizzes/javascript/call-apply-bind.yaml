topic: javascript/call-apply-bind
items:
  - id: predict-three-invocation-modes
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      'use strict';

      function show(label) {
        return `${label}:${this.id}`;
      }

      const base = { id: 'base' };
      const first = show.bind({ id: 'one' }, 'bound');
      const second = first.bind({ id: 'two' }, 'later');

      console.log(show.call(base, 'call'));
      console.log(show.apply(base, ['apply']));
      console.log(second());
    lang: javascript
    options:
      - { text: { en: 'call:base, apply:base, bound:one', zh: 'call:base、apply:base、bound:one' }, correct: true }
      - { text: { en: 'call:base, apply:base, later:two', zh: 'call:base、apply:base、later:two' }, correct: false }
      - { text: { en: 'call:base, apply:base, bound:two', zh: 'call:base、apply:base、bound:two' }, correct: false }
      - { text: { en: 'The third call throws TypeError.', zh: '第三次调用抛出 TypeError。' }, correct: false }
    explanation: { en: 'call and apply use base immediately. The first bind keeps both its receiver and first argument; the second receiver is ignored, and show ignores the extra later argument.', zh: 'call 与 apply 立即使用 base。第一次 bind 保存接收者和首个实参；第二个接收者被忽略，而 show 不使用额外的 later 实参。' }
    difficulty: intermediate
    tags: [call, apply, bind, predict-output]

  - id: spot-listener-bind-identity
    type: spotbug
    prompt: { en: 'Find why stop does not remove the listener registered by start.', zh: '找出 stop 无法移除 start 所注册监听器的原因。' }
    code: |
      'use strict';

      class Dashboard {
        constructor(bus) {
          this.bus = bus;
          this.total = 0;
        }

        render(value) {
          this.total += value;
        }

        start() {
          this.bus.on('data', this.render.bind(this));
        }

        stop() {
          this.bus.off('data', this.render.bind(this));
        }
      }
    lang: javascript
    issues:
      - line: 18
        kind: correctness
        note: { en: 'This bind creates a different function from the one passed in start. Bind once, save the result, and use that exact reference in both methods.', zh: '这里的 bind 与 start 中的 bind 创建了不同函数。应只绑定一次、保存结果，并在两个方法中使用同一引用。' }
    explanation: { en: 'Listener registries normally compare callback identity. Equal targets and receivers do not make two bound function objects identical.', zh: '监听器注册表通常比较回调标识。目标和接收者相同，也不会让两个绑定函数对象拥有相同标识。' }
    difficulty: beginner
    tags: [bind, callback-identity, cleanup, code-review]

  - id: apply-array-like-protocol
    type: mcq
    prompt: { en: 'Which statement correctly distinguishes apply from argument spread?', zh: '哪项陈述正确区分了 apply 与实参展开？' }
    options:
      - { text: { en: 'Both require Symbol.iterator and ignore length.', zh: '两者都要求 Symbol.iterator，并忽略 length。' }, correct: false }
      - { text: { en: 'apply reads length and indexed properties; spread consumes an iterable.', zh: 'apply 读取 length 与索引属性；展开语法消费可迭代对象。' }, correct: true }
      - { text: { en: 'apply accepts only real arrays, while spread accepts any object.', zh: 'apply 只接受真正数组，展开语法接受任意对象。' }, correct: false }
      - { text: { en: 'Spread changes this, while apply cannot.', zh: '展开语法会改变 this，而 apply 不能。' }, correct: false }
    explanation: { en: 'An array supports both protocols, which hides the distinction. A custom array-like object or Set exposes it.', zh: '数组同时支持两种协议，因此容易掩盖差异。自定义类数组对象或 Set 能把差异暴露出来。' }
    difficulty: intermediate
    tags: [apply, spread, array-like, iterable]

  - id: arrow-bind-behavior
    type: mcq
    prompt: { en: 'What can bind change when its target is an arrow function?', zh: '目标是箭头函数时，bind 能改变什么？' }
    options:
      - { text: { en: 'It changes lexical this and makes the arrow constructible.', zh: '它改变词法 this，并让箭头函数可构造。' }, correct: false }
      - { text: { en: 'It changes lexical this but cannot prefill arguments.', zh: '它改变词法 this，但不能预置实参。' }, correct: false }
      - { text: { en: 'It can prefill arguments, but cannot replace lexical this or add construction behavior.', zh: '它能预置实参，但不能替换词法 this，也不能增加构造能力。' }, correct: true }
      - { text: { en: 'It has no effect and returns the original function object.', zh: '它完全没有作用，并返回原函数对象。' }, correct: false }
    explanation: { en: 'bind always creates a new function and can store leading arguments. An arrow still gets this lexically and remains non-constructible.', zh: 'bind 总会创建新函数，也能保存前置实参。箭头函数仍从词法环境取得 this，并且仍不可构造。' }
    difficulty: intermediate
    tags: [bind, arrow-functions, lexical-this]

  - id: bound-function-construction
    type: mcq
    prompt: { en: 'What happens when new invokes a bound function whose target is constructible?', zh: 'new 调用目标可构造的绑定函数时会发生什么？' }
    options:
      - { text: { en: 'The bound receiver becomes the new object.', zh: '绑定接收者直接成为新对象。' }, correct: false }
      - { text: { en: 'A new receiver is created; bound leading arguments are still prepended.', zh: '运行时创建新接收者；绑定的前置实参仍放在最前。' }, correct: true }
      - { text: { en: 'All bound state is ignored, including leading arguments.', zh: '所有绑定状态都被忽略，包括前置实参。' }, correct: false }
      - { text: { en: 'Every bound function throws when used with new.', zh: '任何绑定函数与 new 一起使用都会抛错。' }, correct: false }
    explanation: { en: 'Construction supplies its own receiver and forwards to the target, but keeps the saved argument prefix. It throws only when the target is not constructible.', zh: '构造调用提供自己的接收者并转发给目标，但保留已保存的实参前缀。只有目标不可构造时才会抛错。' }
    difficulty: advanced
    tags: [bind, constructor, new, leading-arguments]

  - id: review-generated-webhook-client
    type: review
    title: { en: 'Review a generated webhook client', zh: '审查生成的 Webhook 客户端' }
    prompt: { en: 'Review this generated client before it subscribes to production events.', zh: '在这段生成的客户端订阅生产事件前进行审查。' }
    task: { en: 'Register at most once, ignore malformed payloads, add tenant without mutating input, never log tokens, post one request per event, and remove the exact callback on stop.', zh: '最多注册一次；忽略畸形 payload；添加 tenant 且不修改输入；绝不记录 token；每个事件只发送一次请求；停止时移除同一个回调。' }
    code: |
      class WebhookClient {
        constructor(transport, tenant) {
          this.transport = transport;
          this.tenant = tenant;
        }
        format(event) {
          event.payload.tenant = this.tenant;
          return JSON.stringify(event.payload);
        }

        start(bus) {
          bus.on('event', this.send.bind(this));
          bus.on('event', this.send.bind(this));
        }

        send(event) {
          console.log(`token=${event.token}`);
          const body = this.format(event);
          this.transport.post(body);
        }

        stop(bus) {
          bus.off('event', this.send.bind(this));
        }
      }
    lang: javascript
    issues:
      - line: 7
        kind: edge-case
        note: { en: 'A missing or non-object payload throws, and a valid payload is mutated. Validate first and serialize a new object with tenant added.', zh: 'payload 缺失或不是对象时会抛错，合法 payload 还会被修改。应先校验，再序列化添加 tenant 后的新对象。' }
      - line: 12
        kind: readability
        note: { en: 'Inline binding hides the callback owner and leaves no named identity for cleanup. Store one bound callback field during initialization.', zh: '内联绑定隐藏了回调所有者，也没有为清理留下命名标识。应在初始化时保存一个绑定回调字段。' }
      - line: 13
        kind: performance
        note: { en: 'The event is registered twice, so every emission performs duplicate serialization and network work. Guard start against repeated setup.', zh: '事件被注册两次，因此每次触发都会重复序列化和网络工作。应防止 start 重复初始化。' }
      - line: 17
        kind: security
        note: { en: 'The token is written to logs despite the task. Log only allowlisted operational fields and never interpolate credentials.', zh: '代码违反任务要求，把 token 写入日志。日志只应包含允许的运行字段，绝不能插入凭据。' }
      - line: 23
        kind: correctness
        note: { en: 'This new bound function cannot match either listener registered by start. Cleanup must reuse the exact saved callback.', zh: '这个新绑定函数无法匹配 start 注册的任何监听器。清理必须复用准确保存的回调。' }
    right: { en: 'The class makes the transport and tenant dependencies explicit, separates formatting from sending, and exposes a stop method that states the intended subscription lifecycle.', zh: '这个类明确保存 transport 与 tenant 依赖，分开格式化与发送，并用 stop 方法表达预期的订阅生命周期。' }
    checklist:
      - { en: 'Validate the event shape and keep caller-owned input unchanged.', zh: '校验事件结构，并保持调用方拥有的输入不变。' }
      - { en: 'Build logs from an allowlist that excludes credentials.', zh: '按允许列表构造日志，并排除凭据。' }
      - { en: 'Make start idempotent and retain one bound callback.', zh: '让 start 保持幂等，并保存一个绑定回调。' }
      - { en: 'Test start, emit, stop, and emit again with a counted transport.', zh: '使用可计数 transport 测试 start、触发、stop 和再次触发。' }
    explanation: { en: 'Bind send once, track whether the client is started, validate into local values, and serialize a fresh object containing only intended fields. A lifecycle test should prove one post per event and none after stop.', zh: '应只绑定一次 send，跟踪客户端是否已启动，把校验结果保存到局部值，并只用预期字段序列化新对象。生命周期测试应证明每个事件只发送一次，并且 stop 后不再发送。' }
    difficulty: advanced
    minutes: 8
    tags: [bind, callback-identity, lifecycle, security, code-review]

