topic: javascript/fundamentals
items:
  - id: predict-bindings-and-defaults
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      const settings = { retries: 0 };
      const alias = settings;
      alias.retries += 1;

      console.log(settings.retries);
      console.log(settings === alias);
      console.log(settings.label ?? 'none');
    lang: javascript
    options:
      - { text: { en: '1, true, none', zh: '1、true、none' }, correct: true }
      - { text: { en: '0, false, none', zh: '0、false、none' }, correct: false }
      - { text: { en: 'It throws because settings is const.', zh: '代码会抛错，因为 settings 使用 const。' }, correct: false }
      - { text: { en: '1, true, undefined', zh: '1、true、undefined' }, correct: false }
    explanation: { en: 'Both bindings hold the same mutable object, so the property update is visible through settings. The missing label is undefined, which makes ?? select none.', zh: '两个绑定保存同一个可变对象，所以通过 settings 能看到属性修改。缺失的 label 为 undefined，因此 ?? 会选择 none。' }
    difficulty: beginner
    tags: [const, object-identity, nullish-coalescing, predict-output]

  - id: lexical-declaration-semantics
    type: mcq
    prompt: { en: 'Which statement correctly compares let and const?', zh: '关于 let 与 const，哪项说法正确？' }
    options:
      - { text: { en: 'Both create block-scoped bindings, but only let permits reassignment.', zh: '两者都创建块级绑定，但只有 let 允许重新赋值。' }, correct: true }
      - { text: { en: 'const recursively freezes any object assigned to it.', zh: 'const 会递归冻结赋给它的任何对象。' }, correct: false }
      - { text: { en: 'let is initialized to undefined before its declaration executes.', zh: 'let 会在声明执行前初始化为 undefined。' }, correct: false }
      - { text: { en: 'const is function-scoped while let is block-scoped.', zh: 'const 是函数作用域，let 是块级作用域。' }, correct: false }
    explanation: { en: 'let and const are lexical, block-scoped declarations and both have a temporal dead zone. const restricts reassignment of its binding, not mutation of an object value.', zh: 'let 和 const 都是带暂时性死区的词法块级声明。const 限制的是绑定重新赋值，不是对象值修改。' }
    difficulty: beginner
    tags: [let, const, scope, temporal-dead-zone]

  - id: spot-falsy-page-size
    type: spotbug
    prompt: { en: 'Find why this generated helper rejects a valid page size of zero.', zh: '找出这段生成的辅助函数为何无法保留合法的零页大小。' }
    code: |
      function pageSize(input) {
        const size = Number(input.pageSize);
        return size || 20;
      }

      console.log(pageSize({ pageSize: '0' }));
    lang: javascript
    issues:
      - line: 3
        kind: correctness
        note: { en: 'Number converts the text to 0, then || treats that valid result as falsy and replaces it with 20. Validate the range and use ?? only if nullish values mean missing.', zh: 'Number 把文本转换为 0，随后 || 把这个合法结果当作假值并替换成 20。应验证范围；只有 nullish 值表示缺失时才使用 ??。' }
    explanation: { en: 'Fallback behavior must follow the input contract. Truthiness cannot distinguish a valid zero from a missing value.', zh: '回退行为必须遵循输入契约。真假判断无法区分合法的 0 与缺失值。' }
    difficulty: beginner
    tags: [coercion, falsy, defaults, code-review]

  - id: typeof-null-boundary
    type: mcq
    prompt: { en: 'Which condition accepts an ordinary non-null object but rejects arrays?', zh: '哪个条件会接受普通非 null 对象，同时拒绝数组？' }
    options:
      - { text: { en: 'value !== null && typeof value === "object" && !Array.isArray(value)', zh: 'value !== null && typeof value === "object" && !Array.isArray(value)' }, correct: true }
      - { text: { en: 'typeof value === "object"', zh: 'typeof value === "object"' }, correct: false }
      - { text: { en: 'Boolean(value)', zh: 'Boolean(value)' }, correct: false }
      - { text: { en: 'value instanceof Object || value === null', zh: 'value instanceof Object || value === null' }, correct: false }
    explanation: { en: 'typeof reports object for null and arrays, so both require separate handling. Even the correct condition only narrows the category; required properties still need validation.', zh: 'typeof 对 null 和数组都会返回 object，因此必须分别处理。即使正确条件也只是缩小类别，必需属性仍要验证。' }
    difficulty: intermediate
    tags: [typeof, 'null', arrays, validation]

  - id: review-generated-order-normalizer
    type: review
    prompt: { en: 'Review this generated order normalizer before it handles API input.', zh: '在这段生成的订单规范化函数处理 API 输入前，对它进行审查。' }
    task: { en: 'Require a positive integer quantity, preserve a zero discount, expose only customer id and name, keep the input unchanged, and retain only allowed item SKUs efficiently for large allowlists.', zh: '要求 quantity 为正整数，保留零折扣，只公开客户 id 与 name，不修改输入，并在允许列表很大时高效保留获准商品 SKU。' }
    code: |
      function prepareOrder(input, allowedSkus) {
        const quantity = Number(input.quantity);
        const { cardNumber, ...publicCustomer } = input.customer;

        const order = {
          id: String(input.id),
          quantity,
          discountPercent: input.discountPercent || 10,
          customer: publicCustomer,
          items: input.items.filter((item) => allowedSkus.includes(item.sku)),
        };

        order.customer.preferences.theme ??= 'system';

        if (quantity < 0) {
          throw new RangeError('quantity must be positive');
        }

        return order;
      }
    lang: javascript
    issues:
      - line: 2
        kind: edge-case
        note: { en: 'Whitespace converts to zero, NaN passes the later less-than check, and zero is not positive. Check Number.isInteger(quantity) and quantity >= 1 after defining the accepted text grammar.', zh: '空白会转换为 0，NaN 能通过后面的“小于”检查，而 0 也不是正数。定义可接受的文本语法后，应检查 Number.isInteger(quantity) 和 quantity >= 1。' }
      - line: 3
        kind: security
        note: { en: 'Removing only cardNumber exposes every other current or future customer field, including tokens. Construct customer from the explicit id and name allowlist.', zh: '只移除 cardNumber 会暴露当前及未来的其他客户字段，包括 token。应使用明确的 id 与 name 允许列表构造 customer。' }
      - line: 8
        kind: correctness
        note: { en: 'The || fallback replaces the valid discount zero with 10. Preserve zero and decide explicitly whether null is absent or invalid.', zh: '|| 回退会把合法的零折扣替换成 10。应保留 0，并明确决定 null 表示缺失还是无效。' }
      - line: 10
        kind: performance
        note: { en: 'Array.includes scans the allowlist for every item. For a large allowlist, build a Set once and use has during filtering.', zh: 'Array.includes 会为每件商品扫描允许列表。允许列表很大时，应先构造一次 Set，再在过滤时使用 has。' }
      - line: 13
        kind: readability
        note: { en: 'The shallow remainder copy hides that publicCustomer.preferences aliases the input object. This assignment mutates API input; derive theme while constructing the allowed customer shape.', zh: '浅层剩余复制掩盖了 publicCustomer.preferences 与输入对象互为别名。这次赋值会修改 API 输入；应在构造允许的客户形状时派生 theme。' }
    right: { en: 'The generated code names the normalization boundary, converts the order id explicitly, keeps quantity conversion near the boundary, and filters items through the supplied allowlist.', zh: '生成代码明确命名了规范化边界，显式转换订单 id，把 quantity 转换放在边界附近，并通过传入的允许列表过滤商品。' }
    checklist:
      - { en: 'Test missing, null, whitespace, non-numeric, zero, fractional, and out-of-range numeric inputs.', zh: '测试缺失、null、空白、非数字、零、小数和超范围数字输入。' }
      - { en: 'Pass every valid falsy value through each fallback expression.', zh: '让每个合法假值都经过所有回退表达式。' }
      - { en: 'Compare returned keys with an allowlist after adding a credential to the input.', zh: '向输入新增凭据后，把返回键与允许列表比较。' }
      - { en: 'Snapshot nested input objects and exercise the largest expected allowlist.', zh: '记录嵌套输入对象，并使用预期最大的允许列表执行测试。' }
    explanation: { en: 'A safe normalizer validates after conversion, builds public output from allowed fields, preserves valid falsy values, and avoids hidden mutation. Data size determines whether repeated linear allowlist scans are acceptable.', zh: '安全的规范化函数会在转换后验证，按允许字段构造公开输出，保留合法假值，并避免隐藏修改。数据规模决定了重复线性扫描允许列表是否可以接受。' }
    difficulty: advanced
    tags: [code-review, validation, defaults, security, performance]
