topic: javascript/math-object
items:
  - id: predict-negative-rounding
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      console.log(Math.floor(-2.3));
      console.log(Math.trunc(-2.3));
      console.log(Math.round(-2.5));
      console.log(Object.is(Math.round(-0.5), -0));
    lang: javascript
    options:
      - { text: { en: '-3, -2, -2, true', zh: '-3、-2、-2、true' }, correct: true }
      - { text: { en: '-2, -2, -3, false', zh: '-2、-2、-3、false' }, correct: false }
      - { text: { en: '-3, -3, -3, true', zh: '-3、-3、-3、true' }, correct: false }
      - { text: { en: '-2, -2, -2, false', zh: '-2、-2、-2、false' }, correct: false }
    explanation: { en: 'floor moves toward negative infinity, trunc moves toward zero, and round sends an exact midpoint toward positive infinity. Rounding -0.5 preserves a negative zero that Object.is can detect.', zh: 'floor 朝负无穷取整，trunc 朝零取整，round 则把精确中点朝正无穷取整。对 -0.5 取整会保留负零，Object.is 可以识别它。' }
    difficulty: beginner
    tags: [math, rounding, negative-zero, predict-output]

  - id: inclusive-random-integer-formula
    type: mcq
    prompt: { en: 'Which expression maps Math.random() to an integer in the closed interval [minimum, maximum] when both bounds are valid integers?', zh: 'minimum 与 maximum 都是合法整数时，哪个表达式会把 Math.random() 映射为闭区间 [minimum, maximum] 内的整数？' }
    options:
      - { text: { en: 'minimum + Math.floor(Math.random() * (maximum - minimum + 1))', zh: 'minimum + Math.floor(Math.random() * (maximum - minimum + 1))' }, correct: true }
      - { text: { en: 'minimum + Math.round(Math.random() * (maximum - minimum))', zh: 'minimum + Math.round(Math.random() * (maximum - minimum))' }, correct: false }
      - { text: { en: 'Math.floor(Math.random() * maximum) + minimum', zh: 'Math.floor(Math.random() * maximum) + minimum' }, correct: false }
      - { text: { en: 'minimum + Math.ceil(Math.random() * (maximum - minimum + 1))', zh: 'minimum + Math.ceil(Math.random() * (maximum - minimum + 1))' }, correct: false }
    explanation: { en: 'The span of a closed integer interval is maximum - minimum + 1. Multiplying a [0, 1) value by that span, flooring it, and adding minimum reaches both bounds without overweighting endpoints.', zh: '闭整数区间的跨度是 maximum - minimum + 1。把 [0, 1) 值乘以跨度、向下取整并加上 minimum，可以到达两个端点，也不会让端点获得额外权重。' }
    difficulty: beginner
    tags: [math-random, intervals, off-by-one]

  - id: spot-array-extrema-call
    title: { en: 'Spot the bug in highestTemperature', zh: '找出最高温度函数里的 bug' }
    type: spotbug
    prompt: { en: 'Find why highestTemperature returns NaN for an ordinary numeric array.', zh: '找出 highestTemperature 为普通数值数组返回 NaN 的原因。' }
    code: |
      function highestTemperature(readings) {
        return Math.max(readings);
      }

      console.log(highestTemperature([18.5, 21, 19.25]));
    lang: javascript
    issues:
      - line: 2
        kind: correctness
        note: { en: 'Math.max expects separate numeric arguments, so the array is converted as one value and becomes NaN. Spread only a known-small validated array; use an item-by-item aggregate for unbounded input.', zh: 'Math.max 接收独立数值实参；数组作为一个值转换时会变成 NaN。只对已知较小且验证过的数组使用展开；规模不受控时应逐项聚合。' }
    explanation: { en: 'Math.max is variadic rather than array-aware. The fix also depends on input size because spreading a very large array can exceed the engine call-argument limit.', zh: 'Math.max 是可变参数函数，不会直接识别数组。修复方式还取决于输入规模，因为展开超大数组可能超过引擎的调用参数上限。' }
    difficulty: beginner
    tags: [math-max, arrays, spread, code-review]

  - id: epsilon-scale
    type: mcq
    prompt: { en: 'What does Number.EPSILON represent?', zh: 'Number.EPSILON 表示什么？' }
    options:
      - { text: { en: 'The gap between 1 and the next larger representable Number', zh: '1 与下一个更大可表示 Number 之间的间隔' }, correct: true }
      - { text: { en: 'The maximum error of every JavaScript calculation', zh: '每次 JavaScript 计算的最大误差' }, correct: false }
      - { text: { en: 'The smallest positive Number greater than zero', zh: '大于零的最小正 Number' }, correct: false }
      - { text: { en: 'A built-in tolerance that scales automatically with both operands', zh: '会随两个操作数自动缩放的内置容差' }, correct: false }
    explanation: { en: 'Number.EPSILON describes spacing near 1. Approximate equality at other magnitudes needs a domain-derived absolute or relative tolerance rather than one universal constant.', zh: 'Number.EPSILON 描述的是 1 附近的数值间隔。其他量级的近似相等需要来自领域的绝对或相对容差，不能依赖一个通用常量。' }
    difficulty: intermediate
    tags: [floating-point, number-epsilon, tolerance]

  - id: review-generated-reading-summary
    title: { en: 'Review generated reading summary', zh: '审查生成的读数汇总' }
    type: review
    prompt: { en: 'Review this generated reading summarizer before it processes a large telemetry batch.', zh: '在这段生成的读数汇总函数处理大型遥测批次前，对它进行审查。' }
    task: { en: 'Accept a non-empty array containing only finite Number values, leave input unchanged, return the raw average and a two-decimal display label, find extrema for up to one million readings, generate an unpredictable six-digit verification code, and expose only sourceId plus computed fields.', zh: '接收只含有限 Number 值的非空数组，不修改输入，返回原始平均值与两位小数展示标签，为最多一百万条读数求极值，生成不可预测的六位验证码，并且只公开 sourceId 与计算字段。' }
    code: |
      function summarizeReadings(input) {
        const values = input.readings.map(Number);
        const average = values.reduce((total, value) => total + value, 0) / values.length;
        const displayedAverage = Math.round(average * 100) / 100;
        const verificationCode = Math.floor(Math.random() * 900000) + 100000;

        return {
          sourceId: input.source.id,
          minimum: Math.min(...values),
          maximum: Math.max(...values),
          average: displayedAverage,
          label: displayedAverage,
          verificationCode,
        };
      }
    lang: javascript
    issues:
      - line: 2
        kind: correctness
        note: { en: 'map(Number) accepts forbidden coercible values such as strings and turns an empty string into zero. Require typeof value === "number" and Number.isFinite(value) for every element.', zh: 'map(Number) 会接受本应禁止的可转换值，例如字符串，还会把空字符串变成 0。应逐项要求 typeof value === "number" 且 Number.isFinite(value)。' }
      - line: 3
        kind: edge-case
        note: { en: 'An empty readings array is not rejected, so division by zero produces NaN. Validate the non-empty invariant before aggregation.', zh: '代码没有拒绝空 readings 数组，因此除以零会产生 NaN。应在聚合前验证非空不变量。' }
      - line: 4
        kind: readability
        note: { en: 'One rounded number is reused as both the raw average and display label, obscuring two different contracts. Keep average unchanged and derive a clearly named string with average.toFixed(2).', zh: '同一个舍入数值同时充当原始平均值和展示标签，掩盖了两种不同契约。应保留 average，并用 average.toFixed(2) 派生名称清楚的字符串。' }
      - line: 5
        kind: security
        note: { en: 'Math.random has no cryptographic unpredictability guarantee. Generate the verification code with a secure platform API and unbiased range mapping.', zh: 'Math.random 不保证密码学不可预测性。验证码应使用安全的平台 API 和无偏区间映射生成。' }
      - line: 9
        lines: 2
        kind: performance
        note: { en: 'Spreading as many as one million elements into each call can exceed the argument limit. Track minimum and maximum during the same item-by-item pass used for validation and summation.', zh: '把最多一百万个元素分别展开到两个调用中可能超过参数上限。应在逐项验证与求和的同一次遍历中同时记录最小值和最大值。' }
    right: { en: 'The code creates a new values array instead of mutating input.readings, seeds reduction with zero, keeps the transformation in one named boundary function, and constructs an allow-listed result rather than spreading input.', zh: '代码创建新的 values 数组，没有修改 input.readings；reduce 使用 0 作为初值，把转换集中在一个有名称的边界函数中，并按允许列表构造结果，没有展开 input。' }
    checklist:
      - { en: 'Test empty input, strings, NaN, infinities, negative zero, and valid boundary values.', zh: '测试空输入、字符串、NaN、无穷值、负零和合法边界值。' }
      - { en: 'Separate raw numeric results from localized or fixed-decimal display strings.', zh: '把原始数值结果与本地化或固定小数位的展示字符串分开。' }
      - { en: 'Exercise the largest allowed collection without spread-based function calls.', zh: '用允许的最大集合执行测试，避免基于展开的函数调用。' }
      - { en: 'Trace every random value to a documented ordinary, reproducible, or security contract.', zh: '把每个随机值追溯到有文档说明的普通、可复现或安全契约。' }
    explanation: { en: 'Validate types and finiteness before one aggregation pass, preserve the raw average, derive display text separately, and use a secure range API for the code. This meets both the numeric and operational size contracts.', zh: '应先验证类型与有限性，再用一次遍历完成聚合；保留原始平均值并单独派生展示文本，同时用安全区间 API 生成验证码。这样才能同时满足数值契约与运行规模要求。' }
    difficulty: advanced
    tags: [math, code-review, floating-point, security, performance]
