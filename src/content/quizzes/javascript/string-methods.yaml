topic: javascript/string-methods
items:
  - id: predict-immutable-cleanup
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      const source = "  Alpha  ";
      source.trim();
      console.log(JSON.stringify(source));
      console.log(JSON.stringify(source.trim()));
    lang: javascript
    options:
      - { text: { en: '"  Alpha  " then "Alpha"', zh: '先输出 "  Alpha  "，再输出 "Alpha"' }, correct: true }
      - { text: { en: '"Alpha" then "Alpha"', zh: '先输出 "Alpha"，再输出 "Alpha"' }, correct: false }
      - { text: { en: '"  Alpha  " twice', zh: '两次都输出 "  Alpha  "' }, correct: false }
    explanation: { en: 'trim returns a new string and does not change source. Only the second console call uses that returned value.', zh: 'trim 返回新字符串，不会修改 source。只有第二次 console 调用使用了该返回值。' }
    difficulty: beginner
    tags: [strings, immutability, predict-output]

  - id: predict-code-unit-length
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      const icon = "😀";
      console.log(icon.length, [...icon].length);
    lang: javascript
    options:
      - { text: { en: '1 1', zh: '1 1' }, correct: false }
      - { text: { en: '2 1', zh: '2 1' }, correct: true }
      - { text: { en: '2 2', zh: '2 2' }, correct: false }
      - { text: { en: 'It throws because spread cannot iterate strings.', zh: '程序抛错，因为扩展语法不能迭代字符串。' }, correct: false }
    explanation: { en: 'length counts two UTF-16 code units. The string iterator used by spread recognizes the surrogate pair as one Unicode code point.', zh: 'length 计算两个 UTF-16 码元；扩展语法使用的字符串迭代器把这对代理项识别为一个 Unicode 码点。' }
    difficulty: intermediate
    tags: [strings, unicode, utf-16, predict-output]

  - id: literal-replacement-data
    type: mcq
    prompt: { en: 'Which call replaces every {{amount}} marker with the literal external value, even when that value contains $& or $1?', zh: '即使外部值包含 $& 或 $1，哪个调用仍能把每个 {{amount}} 标记替换成该值的字面内容？' }
    options:
      - { text: { en: 'template.replaceAll("{{amount}}", value)', zh: 'template.replaceAll("{{amount}}", value)' }, correct: false }
      - { text: { en: 'template.replaceAll("{{amount}}", () => value)', zh: 'template.replaceAll("{{amount}}", () => value)' }, correct: true }
      - { text: { en: 'template.replace("{{amount}}", value)', zh: 'template.replace("{{amount}}", value)' }, correct: false }
    explanation: { en: 'A replacement string interprets dollar substitution markers. A replacer function returns data that is inserted without a second pass over that syntax.', zh: '替换字符串会解释美元符号替换标记；替换函数返回的数据不会再次按这套语法处理。' }
    difficulty: intermediate
    tags: [strings, replacement, replacer-function]

  - id: spot-grapheme-truncation
    type: spotbug
    prompt: { en: 'Find why this user-visible label truncator can return broken text.', zh: '找出这个用户可见标签截断函数为何可能返回损坏文本。' }
    code: |
      function shortLabel(input) {
        if (input.length <= 8) return input;
        return `${input.slice(0, 8)}…`;
      }
    lang: javascript
    issues:
      - line: 3
        kind: edge-case
        note: { en: 'slice counts UTF-16 code units, so index 8 may split a surrogate pair or a multi-code-point grapheme cluster.', zh: 'slice 按 UTF-16 码元计数，因此索引 8 可能切开代理对或由多个码点组成的字素簇。' }
    explanation: { en: 'Segment user-visible text with Intl.Segmenter at grapheme granularity, then truncate the resulting segments. A code-unit limit is valid only when the interface contract explicitly requires it.', zh: '用户可见文本应先用 Intl.Segmenter 按字素簇分段，再截取分段结果。只有接口契约明确要求码元限制时，直接按码元截取才成立。' }
    difficulty: intermediate
    tags: [strings, unicode, grapheme-cluster, code-review]

  - id: review-generated-name-list
    type: review
    title: { en: 'Review a generated name list', zh: '审查生成的姓名列表' }
    prompt: { en: 'Review this generated formatter before its HTML is rendered in a customer-search page.', zh: '在客户搜索页渲染这段生成代码返回的 HTML 前，对格式化函数进行审查。' }
    task: { en: 'Trim customer names, keep at most 12 visible symbols, highlight a literal query, sort for the chosen locale, and return safe HTML.', zh: '清理客户姓名，最多保留 12 个可见符号，高亮字面查询，按指定区域排序，并返回安全 HTML。' }
    code: |
      function buildNameMatches(names, query, locale) {
        const output = [];
        for (const rawName of names) {
          const segmenter = new Intl.Segmenter(locale, { granularity: "grapheme" });
          const name = rawName.trim();
          const parts = [...segmenter.segment(name)].map(({ segment }) => segment);
          const shortened = parts.length > 12 ? `${parts.slice(0, 12).join("")}…` : name;
          const highlighted = shortened.replaceAll(
            query,
            () => `<mark>${query}</mark>`,
          );
          output.push(`<li>${highlighted}</li>`);
        }
        output.sort((a, b) => a.localeCompare(b, locale) === -1);
        return output.join("");
      }
    lang: javascript
    issues:
      - line: 4
        kind: performance
        note: { en: 'The loop constructs an identical Intl.Segmenter for every name; create it once per function call and reuse it.', zh: '循环为每个姓名重复构造配置相同的 Intl.Segmenter；应在函数调用中只创建一次并复用。' }
      - line: 9
        kind: edge-case
        note: { en: 'An empty query makes replaceAll insert a marker at every code-unit boundary, so the contract needs an explicit empty-query branch.', zh: '空查询会让 replaceAll 在每个码元边界插入标记，因此契约需要明确处理空查询分支。' }
      - line: 12
        kind: security
        note: { en: 'The customer name and query reach an HTML string without context-aware escaping, allowing markup injection when rendered as HTML.', zh: '客户姓名与查询未经上下文相关转义就进入 HTML 字符串，按 HTML 渲染时可能造成标记注入。' }
      - line: 14
        kind: correctness
        note: { en: 'The comparator returns a Boolean rather than a negative, positive, or zero ordering result, and it sorts generated markup instead of the customer name.', zh: '比较函数返回布尔值，而不是负数、正数或零；它比较的还是生成标记，而不是客户姓名。' }
    right: { en: 'The code trims names, uses grapheme segmentation for the visible-length limit, and uses a replacer function so dollar markers in the query are not reinterpreted.', zh: '代码清理了姓名，按字素簇执行可见长度限制，并使用替换函数避免查询中的美元标记被再次解释。' }
    checklist:
      - { en: 'Define behavior for empty names, empty queries, and no matches.', zh: '定义空姓名、空查询和无匹配时的行为。' }
      - { en: 'Reuse one segmenter and one collator configured for the requested locale.', zh: '复用按目标区域配置的一个分段器和一个排序器。' }
      - { en: 'Keep raw text separate from markup and escape at the HTML insertion context.', zh: '把原始文本与标记分开，并在 HTML 插入位置执行转义。' }
      - { en: 'Test comparator signs and grapheme boundaries with locale-specific data.', zh: '用区域相关数据测试比较函数符号与字素边界。' }
    explanation: { en: 'Create Intl.Segmenter and Intl.Collator once, branch on an empty query, sort structured records by their text field, and render through an escaping template or DOM API. Keep highlighting as structured ranges when possible.', zh: '应只创建一次 Intl.Segmenter 与 Intl.Collator，单独处理空查询，按结构化记录的文本字段排序，并通过自动转义模板或 DOM API 渲染。条件允许时，应把高亮保留为结构化区间。' }
    difficulty: advanced
    minutes: 7
    tags: [strings, code-review, unicode, html, sorting]
