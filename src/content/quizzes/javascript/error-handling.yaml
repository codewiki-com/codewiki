topic: javascript/error-handling
items:
  - id: predict-finally-completion
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      function outcome() {
        try {
          throw new Error('payment failed');
        } catch {
          return 'recovered';
        } finally {
          return 'cleanup';
        }
      }

      console.log(outcome());
    lang: javascript
    options:
      - { text: { en: 'recovered', zh: 'recovered' }, correct: false }
      - { text: { en: 'cleanup', zh: 'cleanup' }, correct: true }
      - { text: { en: 'payment failed', zh: 'payment failed' }, correct: false }
      - { text: { en: 'It prints nothing because the Error escapes.', zh: '没有输出，因为 Error 会继续向外传播。' }, correct: false }
    explanation: { en: 'The return in finally replaces the return already pending from catch. Cleanup code should normally complete without returning or throwing.', zh: 'finally 中的 return 会替换 catch 中已经待处理的返回结果。清理代码通常应正常结束，不应返回或抛出。' }
    difficulty: intermediate
    tags: [try-catch, finally, control-flow]

  - id: error-cause-purpose
    type: mcq
    prompt: { en: 'Why pass a caught failure as the cause option when creating a higher-level Error?', zh: '创建高层 Error 时，为什么要把捕获的失败作为 cause 选项传入？' }
    options:
      - { text: { en: 'It preserves the original failure for diagnosis while the new Error adds operation context.', zh: '它保留原始失败供诊断，同时让新 Error 添加操作上下文。' }, correct: true }
      - { text: { en: 'It guarantees that the new Error has the same class as the original.', zh: '它保证新 Error 与原始错误属于同一个类。' }, correct: false }
      - { text: { en: 'It automatically retries the failed operation once.', zh: '它会自动重试失败操作一次。' }, correct: false }
      - { text: { en: 'It converts every thrown value into a TypeError.', zh: '它会把所有抛出值转换为 TypeError。' }, correct: false }
    explanation: { en: 'Error cause records a machine-accessible link to the lower-level failure. Callers need not parse a concatenated message to recover that context.', zh: 'Error cause 记录了指向底层失败的机器可读链接。调用方无需解析拼接后的消息就能取得该上下文。' }
    difficulty: beginner
    tags: [error-cause, error-wrapping]

  - id: spot-missing-await
    title: { en: 'Spot the bug in the Promise fallback', zh: '找出 Promise 回退里的 bug' }
    type: spotbug
    prompt: { en: 'Find why this fallback does not handle a rejected Promise returned by load.', zh: '找出为什么这个回退逻辑无法处理 load 返回的 Promise 拒绝。' }
    code: |
      async function getPreferences(load) {
        try {
          return load();
        } catch (error) {
          return { theme: 'system' };
        }
      }
    lang: javascript
    issues:
      - line: 3
        kind: correctness
        note: { en: 'Returning the Promise leaves the try block before it rejects, so this catch cannot observe that rejection. Use return await load() when this boundary owns the fallback.', zh: '直接返回 Promise 会让代码在它拒绝前离开 try 块，因此该 catch 无法观察拒绝。此边界拥有回退策略时应使用 return await load()。' }
    explanation: { en: 'A synchronous throw from calling load would be caught, but a later Promise rejection follows the returned Promise. Awaiting inside try reconnects that rejection to the local handler.', zh: '调用 load 时同步抛出的错误可以被捕获，但稍后的拒绝会沿返回的 Promise 传播。在 try 中等待，才能把该拒绝重新连接到本地处理器。' }
    difficulty: intermediate
    tags: [async-await, rejection, catch-boundary]

  - id: promise-all-failure-policy
    type: mcq
    prompt: { en: 'One input to Promise.all rejects. What happens to the other operations?', zh: 'Promise.all 的一个输入拒绝后，其他操作会怎样？' }
    options:
      - { text: { en: 'They continue unless their own APIs receive and honor a cancellation request.', zh: '它们会继续运行，除非各自的 API 收到并执行取消请求。' }, correct: true }
      - { text: { en: 'JavaScript cancels every remaining Promise automatically.', zh: 'JavaScript 会自动取消所有剩余 Promise。' }, correct: false }
      - { text: { en: 'They are converted to fulfilled Promises with undefined.', zh: '它们会变成以 undefined 兑现的 Promise。' }, correct: false }
      - { text: { en: 'They pause until the rejected input is retried.', zh: '它们会暂停，直到被拒绝的输入完成重试。' }, correct: false }
    explanation: { en: 'Promise.all reports the first rejection to its caller but has no generic way to stop underlying work. Cancellation must be designed with the operations that perform that work.', zh: 'Promise.all 会向调用方报告首个拒绝，却没有停止底层工作的通用方式。取消必须与实际执行工作的操作共同设计。' }
    difficulty: intermediate
    tags: [promise-all, cancellation, concurrency]

  - id: review-generated-profile-loader
    title: { en: 'Review generated profile loader', zh: '审查生成的资料加载器' }
    type: review
    prompt: { en: 'Review this generated concurrent profile loader before using it in a service.', zh: '在服务中使用这段生成的并发资料加载器之前，对它进行审查。' }
    task: { en: 'Load profiles concurrently in input order, fail the batch if any request fails, preserve the original cause, stop outstanding requests when possible, never expose the API token, and always close the client.', zh: '并发加载资料并保持输入顺序；任一请求失败时让批次失败，保留原始原因，尽可能停止未完成请求，绝不暴露 API token，并始终关闭客户端。' }
    code: |
      async function loadProfiles(ids, client, apiToken) {
        const results = [];
        try {
          await Promise.all(
            ids.map(async (id) => {
              try {
                const profile = await client.get(`/profiles/${id}`, { apiToken });
                results.push({ ...profile, apiToken });
              } catch (error) {
                console.log(error.message);
                return null;
              }
            }),
          );
          return results;
        } catch (error) {
          throw new Error(`Profile load failed: ${error.message}`);
        } finally {
          await client.close();
        }
      }
    lang: javascript
    issues:
      - line: 4
        lines: 10
        kind: performance
        note: { en: 'The batch creates all requests without a shared cancellation signal, so outstanding work cannot be stopped after a failure even though the task requires it.', zh: '批次创建所有请求时没有共享取消信号，因此失败后无法按任务要求停止未完成工作。' }
      - line: 8
        kind: security
        note: { en: 'The result copies apiToken into every returned profile, exposing a credential that callers do not need.', zh: '结果把 apiToken 复制到每个返回资料中，暴露了调用方不需要的凭据。' }
      - line: 10
        kind: edge-case
        note: { en: 'A rejection reason may be a string, null, or another non-Error value, so reading error.message can produce undefined or throw.', zh: '拒绝原因可能是字符串、null 或其他非 Error 值，因此读取 error.message 可能得到 undefined 或再次抛错。' }
      - line: 11
        kind: correctness
        note: { en: 'Returning null from the inner catch converts rejection to fulfillment, so Promise.all succeeds and the required batch failure never reaches the outer catch.', zh: '从内层 catch 返回 null 会把拒绝转换成兑现，因此 Promise.all 成功，任务要求的批次失败永远到不了外层 catch。' }
    right: { en: 'The code starts requests concurrently, awaits the combined operation before returning, and puts client cleanup in an awaited finally block.', zh: '代码会并发启动请求，在返回前等待组合操作，并把客户端清理放在可等待的 finally 块中。' }
    checklist:
      - { en: 'Make one request reject with an Error and another reject with a non-Error value.', zh: '让一个请求以 Error 拒绝，再让另一个请求以非 Error 值拒绝。' }
      - { en: 'Verify result ordering with requests that finish in reverse input order.', zh: '让请求按输入的相反顺序结束，验证结果顺序。' }
      - { en: 'Inspect returned data and diagnostics for the API token.', zh: '检查返回数据和诊断信息中是否出现 API token。' }
      - { en: 'Confirm cancellation reaches outstanding requests and client.close runs once.', zh: '确认取消请求到达未完成操作，并且 client.close 只运行一次。' }
    explanation: { en: 'Return the array produced by Promise.all instead of pushing by completion order, let failures reach one boundary, wrap there with cause after narrowing the value, and pass a shared cancellation signal to client.get. Build returned profiles from an allowlist and keep cleanup in finally.', zh: '应返回 Promise.all 产生的数组，而不是按完成顺序 push；让失败到达同一个边界，收窄捕获值后用 cause 包装，并向 client.get 传入共享取消信号。按允许列表构造返回资料，同时保留 finally 中的清理。' }
    difficulty: advanced
    tags: [code-review, promises, error-cause, cancellation, security]
