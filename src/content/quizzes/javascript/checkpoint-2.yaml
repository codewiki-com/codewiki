topic: javascript/checkpoint-2
items:
  - id: checkpoint-2-arrow-this
    type: mcq
    prompt: { en: 'How does an arrow function obtain `this`?', zh: '箭头函数如何获得 `this`？' }
    options:
      - { text: { en: 'It captures `this` from its enclosing lexical scope.', zh: '它从外层词法作用域捕获 `this`。' }, correct: true }
      - { text: { en: 'It binds `this` to the object literal that contains it.', zh: '它会把 `this` 绑定到包含它的对象字面量。' }, correct: false }
      - { text: { en: 'It chooses `this` from its first argument.', zh: '它会把第一个实参用作 `this`。' }, correct: false }
    explanation: { en: 'Arrow functions have no own `this`; `call`, `apply`, and `bind` cannot replace their captured receiver.', zh: '箭头函数没有自己的 `this`；`call`、`apply` 和 `bind` 都不能替换它捕获的接收者。' }
    difficulty: beginner
    tags: [checkpoint]
  - id: checkpoint-2-closure-term
    type: fill
    prompt: { en: 'Name the mechanism by which a function retains access to variables from its defining scope after that outer call finishes.', zh: '函数在外层调用结束后仍可访问其定义作用域变量，这一机制叫什么？' }
    answer: closure
    explanation: { en: 'A closure combines a function with access to the lexical environment in which it was created.', zh: '闭包（closure）让函数继续访问其创建时的词法环境。' }
    difficulty: beginner
    tags: [checkpoint]
  - id: checkpoint-2-call-output
    type: mcq
    prompt: { en: 'Given `function read() { return this.name }`, what does `read.call({ name: "Lin" })` return?', zh: '已知 `function read() { return this.name }`，`read.call({ name: "Lin" })` 返回什么？' }
    options:
      - { text: { en: '`"Lin"`', zh: '`"Lin"`' }, correct: true }
      - { text: { en: '`undefined`, because detached functions cannot receive `this`', zh: '`undefined`，因为独立函数不能接收 `this`' }, correct: false }
      - { text: { en: 'The function object itself', zh: '函数对象本身' }, correct: false }
    explanation: { en: '`call` invokes the function immediately and explicitly supplies its `this` value.', zh: '`call` 会立即调用函数，并显式提供它的 `this` 值。' }
    difficulty: beginner
    tags: [checkpoint]
  - id: checkpoint-2-apply
    type: fill
    prompt: { en: 'Name the explicit-binding method that invokes a function with arguments supplied as an array-like value.', zh: '写出以类数组值提供实参并立即调用函数的显式绑定方法。' }
    answer: apply
    explanation: { en: '`apply` takes a `thisArg` and one array-like argument collection, while `call` takes arguments individually.', zh: '`apply` 接收一个 `thisArg` 和一个类数组实参集合，而 `call` 逐个接收实参。' }
    difficulty: intermediate
    tags: [checkpoint]
  - id: checkpoint-2-prototype-lookup
    type: mcq
    prompt: { en: 'When reading `object.label`, where does JavaScript look first?', zh: '读取 `object.label` 时，JavaScript 首先在哪里查找？' }
    options:
      - { text: { en: 'On `object` itself, then along its prototype chain', zh: '先查找 `object` 自身，再沿其原型链查找' }, correct: true }
      - { text: { en: 'On `Object.prototype`, then on `object`', zh: '先查找 `Object.prototype`，再查找 `object`' }, correct: false }
      - { text: { en: 'Only on the constructor that created `object`', zh: '只在创建 `object` 的构造函数上查找' }, correct: false }
    explanation: { en: 'An own property shadows a property with the same name higher in the prototype chain.', zh: '对象自身的属性会遮蔽原型链上同名的属性。' }
    difficulty: intermediate
    tags: [checkpoint]
  - id: checkpoint-2-super-boundary
    type: fill
    prompt: { en: 'Name the error class raised when a derived class constructor reads `this` before calling `super()`.', zh: '派生类构造函数在调用 `super()` 前读取 `this` 时，会抛出哪种错误？' }
    answer: ReferenceError
    explanation: { en: 'A derived constructor must call `super()` before it can use `this`.', zh: '派生类构造函数必须先调用 `super()`，之后才能使用 `this`。' }
    difficulty: intermediate
    tags: [checkpoint]
  - id: checkpoint-2-preserve-receiver
    type: mcq
    prompt: { en: 'A method is passed directly as a callback and loses its receiver. Which narrow change preserves the original receiver without changing the method body?', zh: '把方法直接作为回调传递后丢失了接收者。哪项最小改动能保留原接收者，且无需修改方法体？' }
    options:
      - { text: { en: 'Pass `controller.handle.bind(controller)`.', zh: '传入 `controller.handle.bind(controller)`。' }, correct: true }
      - { text: { en: 'Pass `controller.handle.call(controller)` as the callback.', zh: '把 `controller.handle.call(controller)` 作为回调传入。' }, correct: false }
      - { text: { en: 'Assign `controller.handle` to a new variable and pass that variable.', zh: '把 `controller.handle` 赋给新变量，再传入该变量。' }, correct: false }
    explanation: { en: '`bind` creates a callable with a fixed receiver; `call` invokes immediately, and assignment alone still detaches the method.', zh: '`bind` 会创建固定接收者的新函数；`call` 会立即调用，而单纯赋值仍会让方法脱离对象。' }
    difficulty: advanced
    tags: [checkpoint]
  - id: checkpoint-2-class-method-storage
    type: fill
    prompt: { en: 'Where are methods declared in a class body normally stored for instances to share?', zh: '类体中声明的方法通常存放在哪里，供各实例共享？' }
    answer: prototype
    explanation: { en: 'Class instance methods are defined on the class prototype rather than copied onto every instance.', zh: '类的实例方法定义在类的原型上，而不是复制到每个实例自身。' }
    difficulty: advanced
    tags: [checkpoint]
