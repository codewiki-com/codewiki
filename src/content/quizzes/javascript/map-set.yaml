topic: javascript/map-set
items:
  - id: predict-samevaluezero-and-identity
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      const first = { id: 1 };
      const values = new Set([first, { id: 1 }, NaN, NaN, -0, +0]);

      console.log(values.size);
    lang: javascript
    options:
      - { text: { en: '3', zh: '3' }, correct: false }
      - { text: { en: '4', zh: '4' }, correct: true }
      - { text: { en: '5', zh: '5' }, correct: false }
      - { text: { en: '6', zh: '6' }, correct: false }
    explanation: { en: 'The two objects have different identities, while the two NaN values compare equal and -0 equals +0 under SameValueZero.', zh: '两个对象的标识不同；SameValueZero 则把两个 NaN 视为相等，也把 -0 与 +0 视为相等。' }
    difficulty: intermediate
    tags: [set, samevaluezero, object-identity, predict-output]

  - id: distinguish-missing-from-undefined
    type: mcq
    prompt: { en: 'A Map may explicitly store undefined. Which check distinguishes that entry from an absent key?', zh: 'Map 可以明确存储 undefined。哪项检查能区分该条目与缺失键？' }
    options:
      - { text: { en: 'Call map.has(key).', zh: '调用 map.has(key)。' }, correct: true }
      - { text: { en: 'Check Boolean(map.get(key)).', zh: '检查 Boolean(map.get(key))。' }, correct: false }
      - { text: { en: 'Compare map.get(key) with undefined.', zh: '把 map.get(key) 与 undefined 比较。' }, correct: false }
      - { text: { en: 'Use map.get(key) || undefined.', zh: '使用 map.get(key) || undefined。' }, correct: false }
    explanation: { en: 'get returns undefined for both states. has reports key presence independently of the stored value.', zh: 'get 在两种状态下都返回 undefined；has 不受存储值影响，直接报告键是否存在。' }
    difficulty: beginner
    tags: [map, has, undefined, missing-values]

  - id: spot-object-deduplication
    title: { en: 'Spot the bug in customer deduplication', zh: '找出客户去重里的 bug' }
    type: spotbug
    prompt: { en: 'Find why customers with the same ID remain duplicated.', zh: '找出相同 ID 的客户为何仍未去重。' }
    code: |
      function uniqueCustomers(customers) {
        return [...new Set(customers)];
      }

      const customers = [{ id: 'U-1' }, { id: 'U-1' }];
      console.log(uniqueCustomers(customers).length);
    lang: javascript
    issues:
      - line: 2
        kind: correctness
        note: { en: 'Set compares these objects by identity, so both remain. Use a Map keyed by customer.id and define whether the first or last record wins.', zh: 'Set 按对象标识比较，因此两个对象都会保留；应使用以 customer.id 为键的 Map，并明确保留第一条还是最后一条记录。' }
    explanation: { en: 'Set enforces uniqueness under SameValueZero; it does not compare object fields. Business-key deduplication needs an explicit key extraction rule.', zh: 'Set 只按 SameValueZero 保证唯一性，不会比较对象字段；按业务键去重需要明确的键提取规则。' }
    difficulty: intermediate
    tags: [set, object-identity, deduplication, code-review]

  - id: choose-weakmap-boundary
    type: mcq
    prompt: { en: 'Which requirement makes WeakMap the wrong cache structure?', zh: '哪项需求意味着 WeakMap 不适合作为缓存结构？' }
    options:
      - { text: { en: 'Evict the oldest entry when the cache reaches 500 keys.', zh: '缓存达到 500 个键时淘汰最旧条目。' }, correct: true }
      - { text: { en: 'Attach parsed metadata to schema objects.', zh: '把解析后的元数据关联到模式对象。' }, correct: false }
      - { text: { en: 'Look up metadata while the exact object key is available.', zh: '在持有准确对象键时查询元数据。' }, correct: false }
      - { text: { en: 'Avoid changing the schema object itself.', zh: '避免修改模式对象本身。' }, correct: false }
    explanation: { en: 'Capacity eviction requires size, enumeration, and deterministic ordering, none of which WeakMap exposes. An ordinary Map can implement that policy.', zh: '容量淘汰需要大小、枚举和确定顺序，而 WeakMap 都不提供；普通 Map 可以实现这项策略。' }
    difficulty: intermediate
    tags: [weakmap, cache, lifetime, eviction]

  - id: review-generated-access-index
    title: { en: 'Review generated access index', zh: '审查生成的访问索引' }
    type: review
    prompt: { en: 'Review this generated authorization-event index before it processes production logs.', zh: '在这段生成的授权事件索引处理生产日志前，对它进行审查。' }
    task: { en: 'Build a Map keyed by stable user ID. For each user, retain unique public role names, count only records whose allowed field is exactly false, and do not retain full events or access tokens.', zh: '构建以稳定用户 ID 为键的 Map。为每个用户保留唯一的公开角色名，只统计 allowed 严格等于 false 的记录，并且不保留完整事件或访问令牌。' }
    code: |
      function indexAccess(events) {
        const byUser = new Map();

        for (const event of events) {
          const userKey = { id: event.userId };
          const summary = byUser.get(userKey) ?? {
            roles: [],
            denied: 0,
            events: [],
          };
          if (!event.allowed) summary.denied += 1;
          summary.roles.push(event.role);
          summary.events.push(event);
          byUser.set(userKey, summary);
        }

        return byUser;
      }
    lang: javascript
    issues:
      - line: 5
        lines: 10
        kind: correctness
        note: { en: 'A fresh object key is created for every event, so records for one user never share a summary. Key the Map directly by event.userId.', zh: '每条事件都创建新的对象键，因此同一用户的记录永远不会共用摘要；应直接以 event.userId 作为 Map 键。' }
      - line: 11
        kind: edge-case
        note: { en: 'The falsy test counts missing, undefined, null, zero, and empty-string values as denials. The task requires event.allowed === false.', zh: '假值检查会把缺失、undefined、null、零和空字符串都计为拒绝；任务要求使用 event.allowed === false。' }
      - line: 12
        kind: performance
        note: { en: 'The roles array retains every duplicate and grows with event count. A Set enforces the required uniqueness and bounds growth by distinct roles.', zh: 'roles 数组会保留所有重复项，并随事件数增长；Set 能保证所需唯一性，让增长取决于不同角色数。' }
      - line: 13
        kind: security
        note: { en: 'Retaining each full event also retains access tokens and other log secrets. Keep only the public role and denial count required by the task.', zh: '保留完整事件也会保留访问令牌和其他日志秘密；只应保存任务要求的公开角色与拒绝次数。' }
    right: { en: 'The function uses a Map for explicit indexing, builds summaries in one pass, uses nullish defaulting rather than falsy defaulting for the summary object, and leaves input events unmodified.', zh: '函数使用 Map 建立明确索引，单次遍历构建摘要，用空值合并而不是假值判断创建摘要对象，并且没有修改输入事件。' }
    checklist:
      - { en: 'Name the canonical key and test two records with the same business ID.', zh: '写出规范键，并用两条业务 ID 相同的记录测试。' }
      - { en: 'Test false, true, missing, null, zero, and empty-string allowed values.', zh: '分别测试 false、true、缺失、null、零和空字符串形式的 allowed。' }
      - { en: 'Feed repeated roles and verify that retained state grows only for distinct roles.', zh: '输入重复角色，确认保留状态只随不同角色增长。' }
      - { en: 'Inspect the returned object graph for tokens and other original event fields.', zh: '检查返回对象图中是否存在令牌和其他原始事件字段。' }
    explanation: { en: 'Use event.userId as the Map key and a Set for each summary roles collection. Increment only on allowed === false, and never retain the original event object.', zh: '应以 event.userId 作为 Map 键，并让每个摘要使用 Set 保存角色；只有 allowed === false 时才增加计数，而且不能保留原始事件对象。' }
    difficulty: advanced
    tags: [map, set, code-review, authorization, data-minimization]
