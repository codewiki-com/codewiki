topic: javascript/checkpoint-4
items:
  - id: checkpoint-4-dynamic-import
    type: mcq
    prompt: { en: 'What does `import("./feature.js")` return?', zh: '`import("./feature.js")` 返回什么？' }
    options:
      - { text: { en: 'A Promise that fulfills with the module namespace object', zh: '一个以模块命名空间对象兑现的 Promise' }, correct: true }
      - { text: { en: 'The default export synchronously', zh: '同步返回默认导出' }, correct: false }
      - { text: { en: 'A CommonJS `module.exports` object in every runtime', zh: '在所有运行时都返回 CommonJS 的 `module.exports` 对象' }, correct: false }
    explanation: { en: 'Dynamic import is asynchronous and resolves to the loaded module namespace, including its available exports.', zh: '动态导入是异步操作，会解析为已加载模块的命名空间对象，其中包含可用导出。' }
    difficulty: beginner
    tags: [checkpoint]
  - id: checkpoint-4-finally
    type: fill
    prompt: { en: 'Name the `try` statement block that runs for cleanup even when the `try` block returns.', zh: '写出 `try` 语句中即使 `try` 块执行 `return` 也会运行的清理代码块。' }
    answer: finally
    explanation: { en: 'The `finally` block runs after `try` or `catch` completion, including completion by `return`.', zh: '`finally` 块会在 `try` 或 `catch` 完成后运行，包括通过 `return` 完成的情况。' }
    difficulty: beginner
    tags: [checkpoint]
  - id: checkpoint-4-json-undefined
    type: mcq
    prompt: { en: 'What does `JSON.stringify({ kept: 1, skipped: undefined })` return?', zh: '`JSON.stringify({ kept: 1, skipped: undefined })` 返回什么？' }
    options:
      - { text: { en: '`{"kept":1}`', zh: '`{"kept":1}`' }, correct: true }
      - { text: { en: '`{"kept":1,"skipped":null}`', zh: '`{"kept":1,"skipped":null}`' }, correct: false }
      - { text: { en: '`{"kept":1,"skipped":"undefined"}`', zh: '`{"kept":1,"skipped":"undefined"}`' }, correct: false }
    explanation: { en: '`JSON.stringify` omits object properties whose values are `undefined`; this differs from `undefined` array elements, which become `null`.', zh: '`JSON.stringify` 会省略值为 `undefined` 的对象属性；数组中的 `undefined` 元素则会变成 `null`。' }
    difficulty: beginner
    tags: [checkpoint]
  - id: checkpoint-4-clear-validity
    type: fill
    prompt: { en: 'Write the exact call that clears a custom validation error on `input`.', zh: '写出清除 `input` 自定义校验错误的准确调用。' }
    answer: "input.setCustomValidity('')"
    explanation: { en: 'A non-empty custom validity message keeps the control invalid; setting the message to an empty string clears that error.', zh: '非空的自定义校验消息会让控件持续处于无效状态；把消息设为空字符串才能清除该错误。' }
    difficulty: intermediate
    tags: [checkpoint]
  - id: checkpoint-4-vitest-rejection
    type: mcq
    prompt: { en: 'Which Vitest assertion correctly waits for `loadUser()` to reject with `"Not found"`?', zh: '哪条 Vitest 断言会正确等待 `loadUser()` 以 `"Not found"` 拒绝？' }
    options:
      - { text: { en: '`await expect(loadUser()).rejects.toThrow("Not found")`', zh: '`await expect(loadUser()).rejects.toThrow("Not found")`' }, correct: true }
      - { text: { en: '`expect(loadUser()).rejects.toThrow("Not found")` without awaiting or returning it', zh: '使用 `expect(loadUser()).rejects.toThrow("Not found")`，但不等待也不返回' }, correct: false }
      - { text: { en: '`expect(await loadUser()).toThrow("Not found")`', zh: '`expect(await loadUser()).toThrow("Not found")`' }, correct: false }
    explanation: { en: 'Awaiting the `rejects` assertion keeps the test open until the Promise settles and the matcher runs.', zh: '等待 `rejects` 断言可让测试保持运行，直到 Promise 敲定并完成匹配。' }
    difficulty: intermediate
    tags: [checkpoint]
  - id: checkpoint-4-alpine-if-host
    type: fill
    prompt: { en: 'Name the HTML element on which Alpine’s `x-if` directive must be placed.', zh: '写出 Alpine 的 `x-if` 指令必须放置的 HTML 元素。' }
    answer: template
    explanation: { en: '`x-if` belongs on a `<template>` so Alpine can add or remove the template content from the DOM.', zh: '`x-if` 应放在 `<template>` 上，Alpine 才能向 DOM 添加或从中移除模板内容。' }
    difficulty: intermediate
    tags: [checkpoint]
  - id: checkpoint-4-validation-boundary
    type: mcq
    prompt: { en: 'A browser form passes every Constraint Validation API check. Which statement still holds at the server boundary?', zh: '浏览器表单已通过 Constraint Validation API 的全部检查。到达服务端边界后，哪项陈述仍然成立？' }
    options:
      - { text: { en: 'The server must validate the submitted data independently.', zh: '服务端仍须独立校验提交的数据。' }, correct: true }
      - { text: { en: 'The server may trust the data because browser validation cannot be bypassed.', zh: '浏览器校验无法绕过，因此服务端可以信任这些数据。' }, correct: false }
      - { text: { en: 'The server only needs to repeat checks created with `setCustomValidity`.', zh: '服务端只需重复通过 `setCustomValidity` 创建的检查。' }, correct: false }
    explanation: { en: 'Client-side validation improves feedback but can be bypassed, so the server remains the authoritative validation boundary.', zh: '客户端校验能改善反馈，但可以被绕过，因此服务端仍是权威校验边界。' }
    difficulty: advanced
    tags: [checkpoint]
  - id: checkpoint-4-runtime-boundary
    type: fill
    prompt: { en: 'Before migrated code trusts API data returned by `JSON.parse` and exposes it to an Alpine component, name the check that must still verify its shape at execution time.', zh: '迁移后的代码在信任 `JSON.parse` 返回的 API 数据并交给 Alpine 组件前，还必须在执行时用哪种检查验证其结构？' }
    answer: runtime validation
    explanation: { en: 'Static annotations do not inspect external JSON at execution time; runtime validation must establish that the parsed value satisfies the expected contract.', zh: '静态类型标注不会在执行时检查外部 JSON；必须通过运行时校验确认解析结果符合预期约定。' }
    difficulty: advanced
    tags: [checkpoint]
