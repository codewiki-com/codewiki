topic: javascript/modules
items:
  - id: predict-dynamic-namespace-binding
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      const source = `
      export let count = 1;
      export function increment() { count += 1; }
      `;

      const url = `data:text/javascript,${encodeURIComponent(source)}`;
      const counter = await import(url);
      const { count } = counter;

      counter.increment();
      console.log(counter.count, count);
    lang: javascript
    options:
      - { text: { en: '2 1', zh: '2 1' }, correct: true }
      - { text: { en: '2 2', zh: '2 2' }, correct: false }
      - { text: { en: '1 1', zh: '1 1' }, correct: false }
      - { text: { en: 'It throws because imports cannot change.', zh: '程序抛错，因为导入值不能变化。' }, correct: false }
    explanation: { en: 'The namespace property reflects the live export, but object destructuring assigned the old number to a new local variable. A static named import would itself stay live.', zh: '命名空间属性反映实时导出，但对象解构把旧数字赋给了新的局部变量。静态具名导入本身则会保持实时。' }
    difficulty: intermediate
    tags: [modules, live-binding, dynamic-import, predict-output]
    tests: node dynamic_namespace.mjs
    minutes: 3

  - id: predict-module-identity
    type: predict
    prompt: { en: 'How many times is evaluated printed, and what Boolean follows?', zh: 'evaluated 会输出几次，后面是哪个布尔值？' }
    code: |
      const source = `
      console.log("evaluated");
      export const marker = {};
      `;

      const url = `data:text/javascript,${encodeURIComponent(source)}`;
      const first = await import(url);
      const second = await import(url);

      console.log(first.marker === second.marker);
    lang: javascript
    options:
      - { text: { en: 'evaluated once, then true', zh: 'evaluated 输出一次，然后输出 true' }, correct: true }
      - { text: { en: 'evaluated twice, then false', zh: 'evaluated 输出两次，然后输出 false' }, correct: false }
      - { text: { en: 'evaluated twice, then true', zh: 'evaluated 输出两次，然后输出 true' }, correct: false }
      - { text: { en: 'No output because the second import is invalid', zh: '没有输出，因为第二次导入无效' }, correct: false }
    explanation: { en: 'Both imports resolve to the same module identity, so top-level code evaluates once and both namespace objects expose the same marker object.', zh: '两次导入解析为同一个模块标识，所以顶层代码只求值一次，两个命名空间也暴露同一个 marker 对象。' }
    difficulty: intermediate
    tags: [modules, identity, cache, predict-output]
    tests: node module_identity.mjs
    minutes: 3

  - id: node-js-format-boundary
    type: mcq
    prompt: { en: 'In Node 24, what primarily determines whether app.js is ESM or CommonJS?', zh: '在 Node 24 中，什么主要决定 app.js 是 ESM 还是 CommonJS？' }
    options:
      - { text: { en: 'The type field in the nearest parent package.json', zh: '最近父级 package.json 中的 type 字段' }, correct: true }
      - { text: { en: 'Whether the file contains an import declaration', zh: '文件是否包含 import 声明' }, correct: false }
      - { text: { en: 'Whether package-lock.json exists', zh: '是否存在 package-lock.json' }, correct: false }
      - { text: { en: 'The current working directory name', zh: '当前工作目录名称' }, correct: false }
    explanation: { en: 'For .js files, the nearest package scope and its explicit type field define the format in the normal case. The .mjs and .cjs extensions are always explicit.', zh: '对于 .js 文件，通常由最近的包作用域及其显式 type 字段决定格式。.mjs 与 .cjs 扩展名则始终明确指定格式。' }
    difficulty: beginner
    tags: [modules, node, package-json, esm, commonjs]
    minutes: 2

  - id: spotbug-request-plugin-import
    type: spotbug
    prompt: { en: 'Find why this request-driven plugin loader has an unsafe module boundary.', zh: '找出这个由请求驱动的插件加载器为何具有不安全的模块边界。' }
    code: |
      export async function loadPlugin(request) {
        const name = new URL(request.url).searchParams.get("plugin");
        const plugin = await import(`./plugins/${name}.js`);
        return plugin.default;
      }
    lang: javascript
    issues:
      - line: 3
        kind: security
        note: { en: 'Untrusted input controls the module specifier instead of selecting from an explicit allowlist of authorized plugins.', zh: '不可信输入直接控制模块说明符，而不是从明确授权的插件允许列表中选择。' }
    explanation: { en: 'Map public plugin names to fixed loader functions, reject unknown or missing keys before import, and define one export contract for every approved target.', zh: '应把公开插件名映射到固定加载函数，在导入前拒绝未知或缺失的键，并为每个获准目标定义同一个导出契约。' }
    difficulty: intermediate
    tags: [modules, dynamic-import, allowlist, security, code-review]
    tests: node --check plugin_loader.mjs
    minutes: 4

  - id: review-generated-report-loader
    title: { en: 'Review a generated report loader', zh: '审查生成的报表加载器' }
    type: review
    prompt: { en: 'Review this generated module loader against the stated task.', zh: '根据任务要求审查这个生成的模块加载器。' }
    task: { en: 'Load only approved reports through the provided loaders; each module default-exports a render function. Preserve module caching, return results in input order, and propagate genuine loading or evaluation failures.', zh: '只能通过给定加载函数加载获准报表；每个模块默认导出 render 函数。保留模块缓存，按输入顺序返回结果，并传播真实的加载或求值失败。' }
    code: |
      const reportLoaders = {
        sales: () => import("./reports/sales.js"),
        inventory: () => import("./reports/inventory.js"),
      };

      export async function runReport(name, context) {
        try {
          const report = await import(
            `./reports/${name}.js?reload=${Date.now()}`,
          );
          console.info("loaded report", report);
          return report.render(context);
        } catch (error) {
          console.warn(`report ${name} failed`, error);
          return null;
        }
      }

      export async function runDashboard(names, context) {
        const results = [];
        for (const name of names) {
          results.push(await runReport(name, context));
        }
        return results;
      }
    lang: javascript
    right: { en: 'The generated code uses async functions consistently, preserves input order in the returned array, gives the report name and context clear roles, and keeps loading behind a small interface.', zh: '生成代码一致使用 async 函数，在返回数组中保留输入顺序，为报表名称与上下文赋予清楚职责，并把加载过程封装在一个小接口后。' }
    checklist:
      - { en: 'Trace every public key to one fixed, approved module specifier.', zh: '把每个公开键追踪到一个固定且获准的模块说明符。' }
      - { en: 'Compare default and named export use with the target modules.', zh: '根据目标模块核对默认导出与具名导出的使用方式。' }
      - { en: 'Check whether specifier variation changes cache identity or reruns side effects.', zh: '检查说明符变化是否改变缓存标识或重新执行副作用。' }
      - { en: 'Distinguish unknown names, load failures, evaluation failures, and render failures.', zh: '区分未知名称、加载失败、求值失败与渲染失败。' }
    issues:
      - line: 8
        lines: 3
        kind: security
        note: { en: 'The import bypasses reportLoaders and lets name control the resolved path, so the approved report boundary is not enforced.', zh: '该导入绕过 reportLoaders，让 name 控制解析路径，因此没有执行获准报表边界。' }
      - line: 9
        kind: performance
        note: { en: 'A timestamp creates unbounded module identities, defeats normal cache reuse, and can repeat expensive top-level initialization.', zh: '时间戳会制造无界的模块标识，破坏正常缓存复用，并可能重复执行昂贵的顶层初始化。' }
      - line: 12
        kind: correctness
        note: { en: 'The task says the render function is the default export, but the code calls a named render property.', zh: '任务说明 render 函数是默认导出，但代码调用了具名 render 属性。' }
      - line: 13
        lines: 4
        kind: readability
        note: { en: 'One broad catch collapses unknown reports, resolution errors, evaluation errors, and render failures into an unexplained null result.', zh: '一个宽泛 catch 把未知报表、解析错误、求值错误与渲染失败全部压成含义不明的 null。' }
    explanation: { en: 'Look up reportLoaders[name], reject missing keys, await that fixed loader, and call module.default. Reusing the fixed specifier preserves module identity, while allowing real failures to reject keeps diagnostics and retry policy with the caller.', zh: '应查找 reportLoaders[name]，拒绝缺失键，等待该固定加载函数，再调用 module.default。复用固定说明符可以保留模块标识；让真实错误保持拒绝状态，则能把诊断与重试策略交给调用方。' }
    difficulty: advanced
    tags: [modules, dynamic-import, code-review, security, caching]
    tests: node --check report_loader.mjs
    minutes: 12
