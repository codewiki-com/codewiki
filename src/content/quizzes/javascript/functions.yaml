topic: javascript/functions
items:
  - id: predict-declaration-and-const-timing
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      console.log(label('A7'));

      function label(id) {
        return `order:${id}`;
      }

      try {
        console.log(total([2, 3]));
      } catch (error) {
        console.log(error.name);
      }

      const total = (values) => values.reduce((sum, value) => sum + value, 0);
    lang: javascript
    options:
      - { text: { en: 'order:A7, then 5', zh: '先输出 order:A7，再输出 5' }, correct: false }
      - { text: { en: 'order:A7, then ReferenceError', zh: '先输出 order:A7，再输出 ReferenceError' }, correct: true }
      - { text: { en: 'ReferenceError before either line prints', zh: '尚未输出任何一行就抛出 ReferenceError' }, correct: false }
      - { text: { en: 'order:A7, then TypeError', zh: '先输出 order:A7，再输出 TypeError' }, correct: false }
    explanation: { en: 'The declaration binding is initialized when the scope is instantiated. The const binding exists but stays in its temporal dead zone until its initializer runs.', zh: '函数声明的绑定在作用域实例化时已经初始化。const 绑定虽然已经存在，但在初始化器运行前仍处于暂时性死区。' }
    difficulty: beginner
    tags: [function-declaration, temporal-dead-zone, predict-output]

  - id: predict-default-undefined-null
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      function read(value = 'fallback') {
        return String(value);
      }

      console.log([
        read(),
        read(undefined),
        read(null),
        read(''),
      ].join('|'));
    lang: javascript
    options:
      - { text: { en: 'fallback|fallback|fallback|fallback', zh: 'fallback|fallback|fallback|fallback' }, correct: false }
      - { text: { en: 'fallback|fallback|null|', zh: 'fallback|fallback|null|' }, correct: true }
      - { text: { en: 'undefined|undefined|null|', zh: 'undefined|undefined|null|' }, correct: false }
      - { text: { en: 'fallback|undefined|null|fallback', zh: 'fallback|undefined|null|fallback' }, correct: false }
    explanation: { en: 'Omission and explicit undefined trigger the default. Null and the empty string are supplied values, so the function preserves and stringifies them.', zh: '省略实参与显式 undefined 都会触发默认值。null 与空字符串是已经提供的值，因此函数会保留它们并转换为字符串。' }
    difficulty: beginner
    tags: [default-parameters, undefined, 'null', predict-output]

  - id: spot-missing-callback-return
    title: { en: 'Spot the bug in the order projection', zh: '找出订单投影里的 bug' }
    type: spotbug
    prompt: { en: 'Why does this generated projection produce only undefined values?', zh: '这段生成的映射代码为什么只产生 undefined？' }
    code: |
      const orders = [{ id: 'A7' }, { id: 'B2' }];
      const ids = orders.map((order) => {
        order.id;
      });

      console.log(ids);
    lang: javascript
    issues:
      - line: 2
        lines: 3
        kind: correctness
        note: { en: 'Braces create a block-bodied arrow, which has no implicit return. Add return order.id or use the expression body (order) => order.id.', zh: '花括号创建的是块体箭头函数，不会隐式返回。应写 return order.id，或改用表达式体 (order) => order.id。' }
    explanation: { en: 'A block-bodied arrow follows ordinary return rules. Evaluating order.id as a statement does not make it the callback result.', zh: '块体箭头函数遵循普通返回规则。把 order.id 作为语句求值，不会让它成为回调结果。' }
    difficulty: beginner
    tags: [arrow-functions, callbacks, return, code-review]

  - id: callback-removal-identity
    type: mcq
    prompt: { en: 'A subscription API removes a callback by strict identity. Which pattern can remove the registered wrapper?', zh: '某订阅 API 按严格标识移除回调。哪种写法可以移除已经注册的包装函数？' }
    options:
      - { text: { en: 'Call off with a newly written event => handle(event) wrapper.', zh: '调用 off 时重新写一个 event => handle(event) 包装器。' }, correct: false }
      - { text: { en: 'Store one wrapper in a variable and pass that same value to on and off.', zh: '把一个包装器存入变量，并将同一个值传给 on 和 off。' }, correct: true }
      - { text: { en: 'Use two separate handle.bind(service) calls because their source is identical.', zh: '分别调用两次 handle.bind(service)，因为两者源码相同。' }, correct: false }
    explanation: { en: 'Every evaluation of an arrow or bind creates a new function object. Identity-based removal requires the exact object used during registration.', zh: '每次求值箭头函数或调用 bind 都会创建新的函数对象。按标识移除时，必须使用注册时的同一个对象。' }
    difficulty: intermediate
    tags: [function-identity, callbacks, lifecycle]

  - id: review-generated-invoice-exporter
    type: review
    title: { en: 'Review a generated invoice exporter', zh: '审查生成的发票导出器' }
    prompt: { en: 'Review this generated function factory before it exports production invoices.', zh: '在这段生成的函数工厂导出生产发票前，对它进行审查。' }
    task: { en: 'Export JSON or text invoices, preserve input, support empty item lists, avoid logging secrets, and handle large catalogs efficiently.', zh: '把发票导出为 JSON 或文本，保持输入不变，支持空项目列表，不记录秘密，并高效处理大型目录。' }
    code: |
      function createInvoiceExporter(catalog, writeAudit) {
        return function exportInvoice(invoice, format = 'json') {
          const items = invoice.items.map((line) => {
            const product = catalog.find((entry) => entry.sku === line.sku);
            line.label = product.name;
            return { ...line, subtotal: line.quantity * line.price };
          });

          const total = items.reduce((sum, line) => sum + line.subtotal);
          writeAudit(`export:${invoice.id}:${invoice.paymentToken}`);
          if (format === 'json') {
            return JSON.stringify({ id: invoice.id, items, total });
          }
          if (format === 'text') {
            const total = items.map((line) => `${line.label}: ${line.subtotal}`).join('\n');
            return total;
          }
          return undefined;
        };
      }
    lang: javascript
    issues:
      - line: 4
        kind: performance
        note: { en: 'Calling catalog.find for every line makes lookup scale with items times catalog size. Build a SKU-indexed Map once in the factory.', zh: '每个项目都调用 catalog.find，查找成本会随项目数与目录大小的乘积增长。应在工厂中一次构建按 SKU 索引的 Map。' }
      - line: 5
        kind: correctness
        note: { en: 'Assigning line.label mutates an object from invoice.items even though the task requires preserving input. Put label only on the returned object.', zh: '给 line.label 赋值会修改 invoice.items 中的对象，违反保持输入不变的要求。应只把 label 放进返回的新对象。' }
      - line: 9
        kind: edge-case
        note: { en: 'reduce without an initial value throws on an empty item list. Seed the numeric total with 0.', zh: 'reduce 没有初始值时会在空项目列表上抛错。数值总额应以 0 为初始值。' }
      - line: 10
        kind: security
        note: { en: 'The audit message exposes paymentToken. Construct logs from an explicit allowlist such as invoice id and selected format.', zh: '审计消息暴露了 paymentToken。日志应只由发票 id 和所选格式等明确允许的字段构造。' }
      - line: 15
        lines: 2
        kind: readability
        note: { en: 'The inner total shadows the numeric total with text content, giving one name two meanings. Use a name such as lines or text.', zh: '内部 total 用文本内容遮蔽了数值 total，让同一名称表达两种含义。应改用 lines 或 text 等名称。' }
    right: { en: 'The factory keeps catalog and audit dependencies explicit, and the exporter returns fresh top-level output objects for the normal nonempty case.', zh: '工厂明确接收目录与审计依赖；对于普通的非空输入，导出器也会返回新的顶层输出对象。' }
    checklist:
      - { en: 'Trace mutation and secret flow from every input field.', zh: '跟踪每个输入字段的修改路径与秘密数据流。' }
      - { en: 'Exercise empty, missing-product, JSON, text, and unsupported-format cases.', zh: '覆盖空列表、产品缺失、JSON、文本与不支持格式等情况。' }
      - { en: 'Move repeated catalog lookup into a factory-owned index.', zh: '把重复的目录查找移入工厂拥有的索引。' }
      - { en: 'Keep numeric totals and rendered text under distinct names.', zh: '分别命名数值总额与渲染文本。' }
    explanation: { en: 'Index the catalog once, map each line into a new validated object, seed the reduction, and audit only allowlisted metadata. Distinct names should separate computed values from rendered output.', zh: '应一次建立目录索引，把每个项目映射为经过校验的新对象，为归约提供初始值，并且只审计允许的元数据。计算值与渲染输出应使用不同名称。' }
    difficulty: advanced
    minutes: 8
    tags: [functions, code-review, callbacks, security, performance]
