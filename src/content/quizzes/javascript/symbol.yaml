topic: javascript/symbol
items:
  - id: predict-local-and-registered-identity
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      const local = Symbol('job');
      const registered = Symbol.for('job');

      console.log(JSON.stringify([
        local === Symbol('job'),
        registered === Symbol.for('job'),
        Symbol.keyFor(local),
      ]));
    lang: javascript
    options:
      - { text: { en: '[false,true,null]', zh: '[false,true,null]' }, correct: true }
      - { text: { en: '[true,true,"job"]', zh: '[true,true,"job"]' }, correct: false }
      - { text: { en: '[false,false,null]', zh: '[false,false,null]' }, correct: false }
      - { text: { en: 'It throws because JSON cannot serialize any array that mentions a Symbol.', zh: '程序会抛错，因为JSON无法序列化任何涉及Symbol的数组。' }, correct: false }
    explanation: { en: 'A fresh ordinary Symbol never equals another call, while one registry key returns one identity. keyFor returns undefined for the local Symbol, and undefined becomes null in a JSON array.', zh: '普通Symbol每次调用都会产生新标识，同一个注册表键则返回同一标识。keyFor对局部Symbol返回undefined，而JSON数组中的undefined会变成null。' }
    difficulty: intermediate
    tags: [symbol, identity, registry, predict-output]

  - id: enumerable-symbol-selection
    type: mcq
    prompt: { en: 'An object literal has an enumerable Symbol-keyed property. Which statement is correct?', zh: '对象字面量含有一个可枚举的Symbol键属性。下列哪项正确？' }
    options:
      - { text: { en: 'Object spread copies it, Object.keys omits it, and default JSON serialization omits it.', zh: '对象展开会复制它，Object.keys会忽略它，默认JSON序列化也会忽略它。' }, correct: true }
      - { text: { en: 'Object.keys includes it because its descriptor is enumerable.', zh: '因为描述符可枚举，所以Object.keys会包含它。' }, correct: false }
      - { text: { en: 'Object spread omits every Symbol key regardless of its descriptor.', zh: '无论描述符如何，对象展开都会忽略所有Symbol键。' }, correct: false }
      - { text: { en: 'JSON.stringify emits the Symbol description as the member name.', zh: 'JSON.stringify会把Symbol描述作为成员名称输出。' }, correct: false }
    explanation: { en: 'Key type and enumerability are separate filters. Spread includes enumerable own strings and Symbols, while Object.keys and default JSON object serialization select string keys only.', zh: '键类型与可枚举性是两层独立筛选。对象展开包含可枚举自有字符串键与Symbol键，而Object.keys和默认JSON对象序列化只选择字符串键。' }
    difficulty: intermediate
    tags: [symbol, enumerability, object-spread, json]

  - id: spot-recreated-symbol-key
    title: { en: 'Spot the bug in the cache Symbol', zh: '找出缓存Symbol里的bug' }
    type: spotbug
    prompt: { en: 'Find why readCache never retrieves the value written by writeCache.', zh: '找出readCache为什么始终读不到writeCache写入的值。' }
    code: |
      const cacheKey = Symbol('cache');

      function writeCache(record, value) {
        record[cacheKey] = value;
      }

      function readCache(record) {
        return record[Symbol('cache')];
      }

      const order = {};
      writeCache(order, 7);
      console.log(readCache(order));
    lang: javascript
    issues:
      - line: 8
        kind: correctness
        note: { en: 'Calling Symbol again creates a different property key even with the same description. readCache must use the shared cacheKey constant.', zh: '即使描述相同，再次调用Symbol也会创建不同的属性键。readCache必须使用共享的cacheKey常量。' }
    explanation: { en: 'A description is debugging metadata, not an identity lookup key. Share an ordinary Symbol by sharing the original value, or deliberately define a registry contract.', zh: '描述只是调试元数据，不是标识查询键。共享普通Symbol必须共享原值，或者有意定义注册表契约。' }
    difficulty: beginner
    tags: [symbol, property-key, identity, code-review]

  - id: registry-boundary
    type: mcq
    prompt: { en: 'When is Symbol.for the appropriate choice?', zh: '什么情况下适合使用Symbol.for？' }
    options:
      - { text: { en: 'When separately loaded components intentionally share a documented runtime key namespace.', zh: '彼此独立加载的组件有意共享一套已记录的运行时键命名空间时。' }, correct: true }
      - { text: { en: 'When a field must survive JSON serialization without an encoder.', zh: '字段必须在没有编码器的情况下通过JSON序列化时。' }, correct: false }
      - { text: { en: 'When object state must be inaccessible to reflection.', zh: '对象状态必须无法被反射发现时。' }, correct: false }
      - { text: { en: 'Whenever a key string comes from untrusted user input.', zh: '每当键字符串来自不可信用户输入时。' }, correct: false }
    explanation: { en: 'The registry reuses identity for an agreed string key in the runtime. It is neither a serialization format nor an access-control boundary, and registry keys should come from controlled conventions.', zh: '注册表会在运行时按约定字符串复用标识。它既不是序列化格式，也不是访问控制边界，注册表键应来自受控约定。' }
    difficulty: intermediate
    tags: [symbol-for, registry, ownership, api-contract]

  - id: predict-to-primitive-hints
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      const balance = {
        [Symbol.toPrimitive](hint) {
          return hint === 'string' ? '12 credits' : 12;
        },
      };

      console.log(String(balance), balance + 3);
    lang: javascript
    options:
      - { text: { en: '12 credits 15', zh: '12 credits 15' }, correct: true }
      - { text: { en: '12 credits 123', zh: '12 credits 123' }, correct: false }
      - { text: { en: '12 15', zh: '12 15' }, correct: false }
      - { text: { en: 'It throws because Symbol.toPrimitive cannot return different primitive types.', zh: '程序会抛错，因为Symbol.toPrimitive不能返回不同的基本类型。' }, correct: false }
    explanation: { en: 'String requests the string hint, while addition requests the default hint and receives the number 12. The hook may return different primitive types, but it may not return an object.', zh: 'String请求string提示，加法请求default提示并得到数字12。钩子可以返回不同的基本类型，但不能返回对象。' }
    difficulty: intermediate
    tags: [well-known-symbol, coercion, to-primitive, predict-output]

  - id: review-generated-plugin-normalizer
    title: { en: 'Review a generated plugin normalizer', zh: '审查生成的插件规范化函数' }
    type: review
    prompt: { en: 'Review this generated boundary before it accepts untrusted plugin records.', zh: '在这段生成的边界代码接收不可信插件记录前，对它进行审查。' }
    task: { en: 'Accept exactly a name string plus the trusted RUN Symbol hook, reject every other own key, attach non-enumerable internal metadata, emit public JSON containing only name, and log either string or Symbol keys safely.', zh: '只接受name字符串与可信的RUN Symbol钩子，拒绝其他所有自有键，附加不可枚举内部元数据，只输出含name的公开JSON，并安全记录字符串键或Symbol键。' }
    code: |
      const RUN = Symbol('plugin.run');
      const INTERNAL = Symbol('plugin.internal');

      function preparePlugin(input) {
        const plugin = {};
        for (const key of Object.keys(input)) {
          plugin[key] = input[key];
        }
        plugin[INTERNAL] = { loadedAt: Date.now() };
        return plugin;
      }

      function publicJson(plugin) {
        return JSON.stringify({ ...plugin });
      }

      function logKey(key) {
        return `plugin key: ${key}`;
      }

      const input = { name: 'search', debug: true, [RUN]: () => 'ok' };
      const plugin = preparePlugin(input);
      console.log(publicJson(plugin));
      console.log(logKey(INTERNAL));
    lang: javascript
    issues:
      - line: 6
        kind: correctness
        note: { en: 'Object.keys omits the trusted RUN Symbol, so the normalized plugin loses the required hook. Compare Reflect.ownKeys(input) against an allowlist containing name and RUN.', zh: 'Object.keys会忽略可信的RUN Symbol，因此规范化结果丢失了必需钩子。应把Reflect.ownKeys(input) 的结果与包含name和RUN的允许列表比较。' }
      - line: 7
        kind: security
        note: { en: 'Every own string key is copied without an allowlist; extra fields reach public output, and a __proto__ key can invoke the ordinary target setter. Validate name and construct only approved fields.', zh: '所有自有字符串键都在没有允许列表的情况下被复制；额外字段会进入公开输出，__proto__ 键还可能触发普通目标的setter。应验证name，并且只构造获准字段。' }
      - line: 9
        kind: readability
        note: { en: 'Plain assignment silently makes internal metadata enumerable, contradicting the task and obscuring the intended descriptor. Use Object.defineProperty with an explicit descriptor.', zh: '普通赋值会悄悄让内部元数据变成可枚举属性，既违反任务要求，也掩盖了预期描述符。应使用Object.defineProperty并写出明确描述符。' }
      - line: 18
        kind: edge-case
        note: { en: 'Template interpolation throws when key is a Symbol, even though ordinary string-key tests pass. Use String(key) for this diagnostic path.', zh: 'key为Symbol时，模板插值会抛错，即使普通字符串键测试已经通过。这个诊断路径应使用String(key)。' }
    right: { en: 'The generated code keeps normalization and public encoding in named functions, creates fresh output instead of mutating input, declares stable Symbol constants once, and includes a concrete sample that exposes the boundary to testing.', zh: '生成代码把规范化与公开编码放在具名函数中，创建新输出而不修改输入，只声明一次稳定Symbol常量，并提供了可用于测试边界的具体样例。' }
    checklist:
      - { en: 'Compare all own keys with an allowlist containing the exact string and Symbol identities.', zh: '把所有自有键与包含准确字符串和Symbol标识的允许列表比较。' }
      - { en: 'Validate the name type and the RUN value before constructing a fresh result.', zh: '构造新结果前验证name类型与RUN值。' }
      - { en: 'Inspect descriptors for internal keys and assert the exact public JSON members.', zh: '检查内部键的描述符，并断言公开JSON的准确成员。' }
      - { en: 'Run logging with both strings and Symbols, including Symbols without descriptions.', zh: '分别用字符串与Symbol运行日志路径，并覆盖没有描述的Symbol。' }
    explanation: { en: 'Use Reflect.ownKeys for the boundary check, build the approved object explicitly, define INTERNAL as non-enumerable, serialize an allowlisted public projection, and convert diagnostic keys with String.', zh: '应使用Reflect.ownKeys检查边界，显式构造获准对象，把INTERNAL定义为不可枚举，序列化按允许列表生成的公开投影，并用String转换诊断键。' }
    difficulty: advanced
    tags: [symbol, code-review, allowlist, property-keys]
