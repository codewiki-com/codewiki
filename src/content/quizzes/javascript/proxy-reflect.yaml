topic: javascript/proxy-reflect
items:
  - id: proxy-predict-ownkeys-invariant
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      const target = {};
      Object.defineProperty(target, "id", {
        value: 7,
        configurable: false,
      });

      const proxy = new Proxy(target, {
        ownKeys() {
          return [];
        },
      });

      try {
        console.log(Object.keys(proxy));
      } catch (error) {
        console.log(error.name);
      }
    lang: javascript
    options:
      - { text: { en: 'TypeError', zh: 'TypeError' }, correct: true }
      - { text: { en: '[]', zh: '[]' }, correct: false }
      - { text: { en: '["id"]', zh: '["id"]' }, correct: false }
      - { text: { en: 'ReferenceError', zh: 'ReferenceError' }, correct: false }
    explanation: { en: 'The target has a non-configurable own key, so ownKeys may not omit it. The engine rejects the trap result with TypeError before Object.keys can filter descriptors.', zh: '目标含有不可配置的自有键，ownKeys不能省略它。Object.keys尚未按描述符筛选，引擎就会用TypeError拒绝该trap的结果。' }
    difficulty: intermediate
    tags: [proxy, ownkeys, invariants]
    tests: node predict-ownkeys.js
    minutes: 3

  - id: proxy-choose-reflect-receiver
    type: mcq
    prompt: { en: 'Why does a forwarding get trap usually call Reflect.get(target, key, receiver)?', zh: '转发型get trap通常为什么要调用Reflect.get(target, key, receiver)？' }
    options:
      - { text: { en: 'It preserves the original receiver as this for accessors, including reads through objects inheriting from the proxy', zh: '它为访问器保留原始接收者作为this，也覆盖通过代理子对象发起的读取' }, correct: true }
      - { text: { en: 'It prevents every getter on the target from executing', zh: '它会阻止目标上的所有getter执行' }, correct: false }
      - { text: { en: 'It makes proxy and target strictly equal', zh: '它会让代理与目标严格相等' }, correct: false }
      - { text: { en: 'It converts Symbol keys to strings before lookup', zh: '它会在查找前把Symbol键转换成字符串' }, correct: false }
    explanation: { en: 'The receiver controls this inside an accessor and matters for inheritance. Reflect.get still executes getters, preserves property keys, and does not change object identity.', zh: 'receiver决定访问器中的this，并会影响继承行为。Reflect.get仍会执行getter，保留属性键，也不会改变对象标识。' }
    difficulty: intermediate
    tags: [reflect-get, receiver, accessors]
    minutes: 2

  - id: proxy-spot-validation-bypasses
    title: { en: 'Spot the bug in proxy validation', zh: '找出代理校验里的bug' }
    type: spotbug
    prompt: { en: 'Find the bypasses and forwarding bug in this generated validator.', zh: '找出这个生成式校验器中的绕过路径与转发错误。' }
    code: |
      function createValidatedUser(target) {
        return new Proxy(target, {
          set(target, key, value) {
            if (key === "age" && (!Number.isInteger(value) || value < 0)) {
              throw new TypeError("invalid age");
            }
            target[key] = value;
            return true;
          },
        });
      }

      const rawUser = { age: 20 };
      const user = createValidatedUser(rawUser);
      Object.defineProperty(user, "age", { value: -1, writable: true });
      rawUser.age = -2;
    lang: javascript
    issues:
      - line: 7
        kind: correctness
        note: { en: 'Direct assignment drops receiver semantics and the fixed true result can misreport a failed write. Return Reflect.set(target, key, value, receiver).', zh: '直接赋值会丢失receiver语义，固定返回true还可能把失败写入报告为成功。应返回Reflect.set(target, key, value, receiver)。' }
      - line: 15
        kind: correctness
        note: { en: 'Object.defineProperty uses the defineProperty trap, not set. With no such trap, the invalid age bypasses validation.', zh: 'Object.defineProperty使用defineProperty trap，而不是set。handler没有该trap，因此非法年龄会绕过校验。' }
      - line: 16
        kind: security
        note: { en: 'The raw target remains an unrestricted alias. A proxy policy cannot protect state while callers retain direct access to that target.', zh: '原始目标仍是无限制别名。调用方保留目标的直接访问时，代理策略无法保护状态。' }
    explanation: { en: 'A write policy must preserve receiver semantics, cover every mutation operation in scope, and control target aliases. A set trap alone provides none of those guarantees.', zh: '写入策略必须保留receiver语义，覆盖范围内的每种修改操作，并控制目标别名。只实现set trap无法提供这些保证。' }
    difficulty: advanced
    tags: [validation, defineproperty, target-alias]
    tests: node --check validation-bypasses.js
    minutes: 7

  - id: proxy-choose-revocation-semantics
    type: mcq
    prompt: { en: 'What does calling revoke() on a revocable proxy guarantee?', zh: '对可撤销代理调用revoke() 能保证什么？' }
    options:
      - { text: { en: 'Later fundamental operations through that proxy throw TypeError', zh: '之后通过该代理执行基本操作会抛出TypeError' }, correct: true }
      - { text: { en: 'The target is erased and all its aliases become unusable', zh: '目标会被擦除，所有别名都无法继续使用' }, correct: false }
      - { text: { en: 'Resources held by the target are closed automatically', zh: '目标持有的资源会自动关闭' }, correct: false }
      - { text: { en: 'Only writes fail while reads continue to work', zh: '只有写入失败，读取仍可继续' }, correct: false }
    explanation: { en: 'Revocation disables the proxy, not the target or its resources. Cleanup and control of other target references require separate protocols.', zh: '撤销禁用的是代理，不是目标或目标持有的资源。资源清理与其他目标引用的控制需要独立协议。' }
    difficulty: intermediate
    tags: [revocable-proxy, lifetime, cleanup]
    minutes: 2

  - id: proxy-review-generated-readonly-view
    title: { en: 'Review generated read-only invoice view', zh: '审查生成的只读发票视图' }
    type: review
    prompt: { en: 'Review this generated read-only invoice proxy.', zh: '审查这个生成式只读发票代理。' }
    task: { en: 'Expose a read-only invoice view with an enumerable virtual total while preserving ordinary receiver behavior and proxy invariants.', zh: '提供带可枚举虚拟total的只读发票视图，同时保留普通receiver行为与代理不变量。' }
    code: |
      function createReadonlyInvoice(target) {
        return new Proxy(target, {
          get(target, key) {
            console.log(`read ${key}`);
            if (key === "raw") return target;
            const value = Reflect.get(target, key, target);
            return typeof value === "function" ? value.bind(target) : value;
          },
          set() {
            throw new TypeError("read only");
          },
          ownKeys(target) {
            return [...Reflect.ownKeys(target), "total"];
          },
          getOwnPropertyDescriptor(target, key) {
            if (key === "total") {
              return { configurable: true, enumerable: true };
            }
            return Reflect.getOwnPropertyDescriptor(target, key);
          },
        });
      }
    lang: javascript
    right: { en: 'The code rejects ordinary assignment explicitly, starts key enumeration from Reflect.ownKeys, marks the virtual key enumerable, and forwards real descriptor queries through Reflect.', zh: '代码明确拒绝普通赋值，基于Reflect.ownKeys开始枚举，把虚拟键标记为可枚举，并通过Reflect转发真实属性的描述符查询。' }
    checklist:
      - { en: 'Map every read, mutation, enumeration, and descriptor path to a trap and expected result.', zh: '把每条读取、修改、枚举与描述符路径映射到trap和预期结果。' }
      - { en: 'Test accessors through an inheriting object and include string and Symbol keys.', zh: '通过继承对象测试访问器，并覆盖字符串键与Symbol键。' }
      - { en: 'Repeat enumeration after adding total and after preventing target extensions.', zh: '加入真实total后以及禁止目标扩展后，重复测试枚举。' }
      - { en: 'Check that neither a raw target nor a bound method crosses the read-only boundary.', zh: '检查原始目标和绑定方法都不会越过只读边界。' }
    issues:
      - line: 4
        kind: edge-case
        note: { en: 'Interpolating some Symbol keys directly throws TypeError, so logging can break an otherwise valid read. Use String(key).', zh: '直接插入某些Symbol键会抛出TypeError，导致日志破坏原本有效的读取。应使用String(key)。' }
      - line: 5
        kind: security
        note: { en: 'The raw escape returns the target and lets callers bypass every read-only trap.', zh: 'raw逃生口返回目标，使调用方能够绕过全部只读trap。' }
      - line: 7
        kind: performance
        note: { en: 'Every method read allocates a new bound function. Besides allocation cost, repeated reads lose method identity and can break listener removal.', zh: '每次读取方法都会分配新的绑定函数。除了分配成本，重复读取还会丢失方法标识，并可能破坏监听器移除。' }
      - line: 13
        kind: correctness
        note: { en: 'Appending total can duplicate a real key and becomes illegal when a non-extensible target has no such key. Both cases violate ownKeys invariants.', zh: '追加total可能与真实键重复；不可扩展目标没有该键时，额外键也不合法。两种情况都会违反ownKeys不变量。' }
    explanation: { en: 'A correct view needs receiver-preserving reads, an explicit virtual-key collision policy, complete mutation coverage, and invariant tests across extensibility states. It must not leak the target through data or bound behavior.', zh: '正确视图需要保留receiver的读取、明确的虚拟键冲突策略、完整的修改路径覆盖，以及跨可扩展状态的不变量测试。它不能通过数据或绑定行为泄漏目标。' }
    difficulty: advanced
    tags: [code-review, readonly-view, invariants, receiver]
    tests: node --check readonly-invoice.js
    minutes: 12
