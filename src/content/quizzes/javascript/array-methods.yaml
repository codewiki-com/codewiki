topic: javascript/array-methods
items:
  - id: predict-sparse-map
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      const values = [2, , 4];
      const seen = [];
      const doubled = values.map((value, index) => {
        seen.push(index);
        return value * 2;
      });

      console.log(seen.join(','));
      console.log(doubled.length, 1 in doubled);
    lang: javascript
    options:
      - { text: { en: "0,1,2\n3 true", zh: "0,1,2\n3 true" }, correct: false }
      - { text: { en: "0,2\n3 false", zh: "0,2\n3 false" }, correct: true }
      - { text: { en: "0,2\n2 false", zh: "0,2\n2 false" }, correct: false }
      - { text: { en: 'It throws when map reaches the empty slot.', zh: 'map 遇到空槽时会抛出异常。' }, correct: false }
    explanation: { en: 'map skips the empty slot, so the callback sees indexes 0 and 2. The result keeps the source length and a hole at index 1.', zh: 'map 跳过空槽，因此回调只看到索引 0 和 2。结果保留原长度，并在索引 1 保留空槽。' }
    difficulty: intermediate
    tags: [arrays, sparse-array, predict-output]

  - id: choose-copying-sort
    type: mcq
    prompt: { en: 'Which expression returns a numeric ascending order without changing scores?', zh: '哪个表达式能返回数值升序结果，同时不修改 scores？' }
    options:
      - { text: { en: 'scores.toSorted((a, b) => a - b)', zh: 'scores.toSorted((a, b) => a - b)' }, correct: true }
      - { text: { en: 'scores.sort()', zh: 'scores.sort()' }, correct: false }
      - { text: { en: 'scores.sort((a, b) => a - b)', zh: 'scores.sort((a, b) => a - b)' }, correct: false }
      - { text: { en: 'scores.toSorted()', zh: 'scores.toSorted()' }, correct: false }
    explanation: { en: 'toSorted returns a shallow-copied array, and the numeric comparator avoids default string ordering. sort mutates its receiver.', zh: 'toSorted 返回浅拷贝数组，数值比较函数可避开默认的字符串排序；sort 会修改接收者。' }
    difficulty: beginner
    tags: [sorting, mutation, comparator]

  - id: spot-async-foreach
    title: { en: 'Spot the bug in async deliveries', zh: '找出异步投递里的 bug' }
    type: spotbug
    prompt: { en: 'Find why this function returns before deliveries are recorded.', zh: '找出这个函数为何会在记录投递结果前返回。' }
    code: |
      async function sendAll(messages) {
        const delivered = [];
        messages.forEach(async (message) => {
          const result = await send(message);
          delivered.push(result.id);
        });
        return delivered;
      }
    lang: javascript
    issues:
      - line: 3
        kind: correctness
        note: { en: 'forEach ignores the Promises returned by its async callbacks, so sendAll reaches return without awaiting them.', zh: 'forEach 会忽略异步回调返回的 Promise，因此 sendAll 没有等待它们就执行到 return。' }
    explanation: { en: 'Use await Promise.all(messages.map(send)) when parallel work is safe, or a for...of loop with await for sequential delivery. The outer function must own completion and rejection.', zh: '可以在并行安全时使用 await Promise.all(messages.map(send))，需要顺序投递时则使用带 await 的 for...of。外层函数必须负责完成与拒绝。' }
    difficulty: intermediate
    tags: [arrays, async, foreach, code-review]

  - id: reduce-empty-input
    type: mcq
    prompt: { en: 'Why should a sum over a possibly empty array usually pass 0 to reduce?', zh: '为什么对可能为空的数组求和时，通常应向 reduce 传入 0？' }
    options:
      - { text: { en: 'It defines the empty result and prevents reduce from throwing on an empty array.', zh: '它定义空输入的结果，并避免 reduce 在空数组上抛错。' }, correct: true }
      - { text: { en: 'It makes reduce mutate the array in place.', zh: '它会让 reduce 原地修改数组。' }, correct: false }
      - { text: { en: 'It makes the callback run twice for every value.', zh: '它会让每个值触发两次回调。' }, correct: false }
    explanation: { en: 'Without an initial value, reduce needs a first existing element and throws TypeError when none exists. A 0 seed also makes the accumulator numeric from the start.', zh: '没有初始值时，reduce 需要找到首个已有元素；找不到就会抛出 TypeError。传入 0 还能让累加器从一开始就是数字。' }
    difficulty: beginner
    tags: [reduce, empty-array, accumulator]

  - id: review-generated-order-report
    type: review
    title: { en: 'Review a generated order report', zh: '审查生成的订单报告' }
    prompt: { en: 'Review this generated order-report function before it handles production data.', zh: '在这段生成的订单报告函数处理生产数据前，对它进行审查。' }
    task: { en: 'Fetch customers, total each order, sort highest totals first, and return a safe HTML list without overrunning the customer service.', zh: '获取客户信息，汇总每笔订单，按总额降序排列，并返回安全的 HTML 列表，同时不能压垮客户服务。' }
    code: |
      async function renderOrderReport(orders) {
        const rows = await Promise.all(
          orders.map(async (order) => {
            const customer = await fetchCustomer(order.customerId);
            const total = order.lines
              .map((line) => line.price * line.quantity)
              .reduce((sum, value) => sum + value);
            return { customer: customer.name, total };
          }),
        );

        rows.sort((a, b) => a.total < b.total);
        return rows
          .map((row) => `<li>${row.customer}: ${row.total}</li>`)
          .join('');
      }
    lang: javascript
    issues:
      - line: 2
        kind: performance
        note: { en: 'Promise.all starts one customer request per order without a capacity limit, so a large batch can overwhelm the dependency.', zh: 'Promise.all 会为每笔订单启动客户请求，却没有容量上限；大批量数据可能压垮依赖服务。' }
      - line: 7
        kind: edge-case
        note: { en: 'reduce has no initial value and throws TypeError for an order with no lines; an empty order should have a defined total such as 0.', zh: 'reduce 没有初始值，遇到没有明细的订单会抛出 TypeError；空订单应有明确总额，例如 0。' }
      - line: 12
        kind: correctness
        note: { en: 'The Boolean comparator returns only 0 or 1 and does not define a valid descending order. Use (a, b) => b.total - a.total.', zh: '布尔比较函数只返回 0 或 1，无法定义正确的降序；应使用 (a, b) => b.total - a.total。' }
      - line: 14
        kind: security
        note: { en: 'A customer name is interpolated into HTML without escaping, so untrusted text can inject markup or script-capable content.', zh: '客户名称未经转义就插入 HTML；不可信文本可能注入标记或可执行脚本的内容。' }
    right: { en: 'The code awaits its mapped Promises, creates a separate result object per order, and keeps customer lookup separate from total calculation.', zh: '代码会等待映射出的 Promise，为每笔订单创建独立结果对象，并把客户查询与总额计算分开。' }
    checklist:
      - { en: 'Test empty orders, empty line arrays, and rejected customer lookups.', zh: '测试空订单、空明细数组和客户查询被拒绝的情况。' }
      - { en: 'Bound external request concurrency to a measured service capacity.', zh: '根据服务容量限制外部请求的并发数。' }
      - { en: 'Verify comparator signs with less-than, equal, and greater-than pairs.', zh: '用小于、等于和大于三类元素对验证比较函数符号。' }
      - { en: 'Escape every untrusted value for its HTML insertion context.', zh: '按 HTML 插入位置对每个不可信值进行转义。' }
    explanation: { en: 'Use a bounded request pool, seed the total with 0, return a numeric comparator result, and render through an escaping template or DOM API. Test failures as well as ordinary non-empty orders.', zh: '应使用有界请求池，以 0 初始化总额，让比较函数返回数值，并通过自动转义模板或 DOM API 渲染。测试既要覆盖普通非空订单，也要覆盖失败路径。' }
    difficulty: advanced
    tags: [arrays, code-review, async, sorting, html]
