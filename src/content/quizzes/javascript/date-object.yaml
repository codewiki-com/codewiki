topic: javascript/date-object
items:
  - id: predict-month-overflow
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      const renewal = new Date('2026-01-31T00:00:00.000Z');
      renewal.setUTCMonth(renewal.getUTCMonth() + 1);
      console.log(renewal.toISOString());
    lang: javascript
    options:
      - { text: { en: '2026-02-28T00:00:00.000Z', zh: '2026-02-28T00:00:00.000Z' }, correct: false }
      - { text: { en: '2026-03-03T00:00:00.000Z', zh: '2026-03-03T00:00:00.000Z' }, correct: true }
      - { text: { en: '2026-03-31T00:00:00.000Z', zh: '2026-03-31T00:00:00.000Z' }, correct: false }
      - { text: { en: 'It throws because February 31 does not exist.', zh: '程序会抛错，因为二月三十一日不存在。' }, correct: false }
    explanation: { en: 'The setter first targets February while retaining day 31, then normalizes the three overflow days into March. Date setters do not clamp to month end.', zh: 'setter 在保留日期数字 31 的同时先把月份设为二月，再把溢出的三天规范化到三月；Date setter 不会截断到月末。' }
    difficulty: intermediate
    tags: [date, mutation, overflow, predict-output]

  - id: date-stored-state
    type: mcq
    prompt: { en: 'What information does a valid Date object retain?', zh: '一个有效的 Date 对象会保留什么信息？' }
    options:
      - { text: { en: 'A millisecond time value identifying an instant', zh: '用于标识时间点的毫秒时间值' }, correct: true }
      - { text: { en: 'A time value and the IANA zone used to construct it', zh: '时间值，以及构造时使用的 IANA 时区' }, correct: false }
      - { text: { en: 'Separate stored UTC and local calendar fields', zh: '分别存储的 UTC 与本地日历字段' }, correct: false }
      - { text: { en: 'The original input string and its locale', zh: '原始输入字符串及其区域设置' }, correct: false }
    explanation: { en: 'Date retains one numeric time value. UTC, local, and named-zone fields are projections produced later, and the original text is not preserved.', zh: 'Date 只保留一个数值时间值；UTC、本地和指定时区字段都是之后生成的投影视图，原始文本不会保留。' }
    difficulty: beginner
    tags: [date, instant, time-value]

  - id: spot-invalid-date-truthiness
    title: { en: 'Spot the bug in timestamp serialization', zh: '找出时间戳序列化里的 bug' }
    type: spotbug
    prompt: { en: 'Find why invalid input reaches toISOString and throws.', zh: '找出无效输入为何会进入 toISOString 并抛错。' }
    code: |
      function serializeTimestamp(value) {
        const date = new Date(value);
        if (!date) return null;
        return date.toISOString();
      }

      console.log(serializeTimestamp('not-a-date'));
    lang: javascript
    issues:
      - line: 3
        kind: correctness
        note: { en: 'An invalid Date is still a truthy object, so this branch never detects its NaN time value. Check Number.isNaN(date.getTime()) before serialization.', zh: '无效 Date 仍是真值对象，因此这个分支无法发现其 NaN 时间值；序列化前应检查 Number.isNaN(date.getTime())。' }
    explanation: { en: 'Construction does not throw for an unparseable string. The failure appears later because toISOString throws RangeError for an invalid date.', zh: '无法解析字符串时，构造过程不会抛错；无效日期调用 toISOString 会抛出 RangeError，因此失败出现在后续流程。' }
    difficulty: beginner
    tags: [date, validation, invalid-date, code-review]

  - id: calendar-day-versus-duration
    type: mcq
    prompt: { en: 'A daily meeting must remain at 09:00 in America/New_York. Why is adding 86,400,000 milliseconds insufficient?', zh: '每日会议必须固定在 America/New_York 的 09:00。为什么不能只增加 86,400,000 毫秒？' }
    options:
      - { text: { en: 'It adds an elapsed 24 hours, which can land at a different local hour across a daylight-saving transition.', zh: '它增加的是经过的 24 小时，跨越夏令时切换后可能落在不同的本地小时。' }, correct: true }
      - { text: { en: 'Date stores timestamps in seconds, so the constant uses the wrong unit.', zh: 'Date 以秒存储时间戳，所以该常量单位错误。' }, correct: false }
      - { text: { en: 'UTC days always contain either 23 or 25 hours.', zh: 'UTC 日期总是包含 23 或 25 小时。' }, correct: false }
      - { text: { en: 'Intl.DateTimeFormat changes the underlying Date when it formats it.', zh: 'Intl.DateTimeFormat 在格式化时会改变底层 Date。' }, correct: false }
    explanation: { en: 'Elapsed duration and named-zone calendar recurrence are different operations. The recurrence must retain the zone and apply its rules for the target date.', zh: '经过时长与指定时区的日历重复是两种操作；重复日程必须保留时区，并对目标日期应用该时区的规则。' }
    difficulty: intermediate
    tags: [date, daylight-saving-time, duration, recurrence]

  - id: review-generated-meeting-normalizer
    type: review
    title: { en: 'Review a generated meeting normalizer', zh: '审查生成的会议规范化函数' }
    prompt: { en: 'Review this generated meeting normalizer before it handles calendar API payloads.', zh: '在这段生成的会议规范化函数处理日历 API 载荷前，对它进行审查。' }
    task: { en: 'Accept canonical UTC start and end timestamps, reject invalid or non-positive intervals, preserve both instants, compute a reminder 15 minutes before start, format start in input.timeZone, and never return internal notes.', zh: '接收规范 UTC 开始与结束时间戳，拒绝无效或非正区间，保留两个时间点，计算开始前 15 分钟的提醒时间，按 input.timeZone 格式化开始时间，并且绝不返回内部备注。' }
    code: |
      function prepareMeeting(input, locale) {
        const start = new Date(input.start);
        const end = new Date(input.end);

        if (!start || !end) {
          throw new Error('invalid meeting');
        }

        start.setTime(start.getTime() - 15 * 60_000);
        const durationMinutes = Math.round((end - start) / 60_000);
        const label = start.toLocaleString(locale, {
          timeZone: input.timeZone,
        });

        return {
          start: start.toISOString(),
          end: end.toISOString(),
          reminderAt: start.toISOString(),
          durationMinutes,
          label,
          notes: input.internalNotes,
        };
      }
    lang: javascript
    issues:
      - line: 5
        kind: edge-case
        note: { en: 'An invalid Date is still truthy, so malformed values reach toISOString. Check canonical UTC syntax, getTime(), and the ISO round trip for both inputs.', zh: '无效 Date 仍是真值，因此格式错误的值会进入 toISOString。应对两个输入检查规范 UTC 语法、getTime() 与 ISO 往返结果。' }
      - line: 9
        kind: readability
        note: { en: 'The variable named start is repurposed as reminder storage, making every later use misleading. Derive a separate reminderAt value and leave start unchanged.', zh: '名为 start 的变量被改用为提醒时间存储，让后续每次使用都产生误导。应单独派生 reminderAt 值，并保持 start 不变。' }
      - line: 10
        kind: correctness
        note: { en: 'The duration uses the shifted start and is inflated by 15 minutes; the function also never rejects end at or before start. Validate and subtract the preserved time values.', zh: '时长使用了已提前的 start，因此会多出 15 分钟；函数也从未拒绝早于或等于开始时间的 end。应验证并相减保留的时间值。' }
      - line: 21
        kind: security
        note: { en: 'The result exposes internalNotes even though the task forbids returning it. Construct the response from an explicit allowlist of public fields.', zh: '结果泄露了任务禁止返回的 internalNotes。应根据明确的公开字段允许列表构造响应。' }
    right: { en: 'The generated code parses each endpoint once, keeps the transformation in one function, passes an explicit locale and named time zone to the formatter, and uses ISO strings for machine-facing times.', zh: '生成的代码对每个端点只解析一次，把转换集中在一个函数中，向 formatter 传入明确的区域设置与指定时区，并对面向机器的时间使用 ISO 字符串。' }
    checklist:
      - { en: 'Verify exact timestamp syntax, impossible dates, and invalid Date behavior.', zh: '验证准确的时间戳语法、不可能的日期和无效 Date 行为。' }
      - { en: 'Trace each Date mutation through every later calculation and output.', zh: '追踪每次 Date 修改对后续所有计算与输出的影响。' }
      - { en: 'Test valid, equal, and reversed endpoints and assert the exact duration.', zh: '测试有效、相等和倒置的端点，并断言精确时长。' }
      - { en: 'Compare returned keys with a public-field allowlist and verify named-zone display.', zh: '将返回的键与公开字段允许列表比较，并验证指定时区的显示结果。' }
    explanation: { en: 'Validate both canonical inputs and the interval before deriving values. Preserve start and end, create reminderAt separately, format the original start, and return only approved fields.', zh: '派生其他值前，应验证两个规范输入与时间区间。保留 start 和 end，单独创建 reminderAt，格式化原始 start，并且只返回获准字段。' }
    difficulty: advanced
    minutes: 8
    tags: [date, code-review, validation, time-zone, security]
