topic: javascript/object-methods
items:
  - id: predict-enumeration-boundaries
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      const parent = { inherited: 1 };
      const symbolKey = Symbol('key');
      const record = Object.create(parent);
      record.visible = 2;
      Object.defineProperty(record, 'hidden', { value: 3 });
      record[symbolKey] = 4;

      console.log(Object.keys(record).join(','));
      console.log(Reflect.ownKeys(record).map(String).join(','));
    lang: javascript
    options:
      - { text: { en: 'visible,hidden followed by visible,hidden,Symbol(key)', zh: '先输出visible,hidden，再输出visible,hidden,Symbol(key)' }, correct: false }
      - { text: { en: 'visible followed by visible,hidden,Symbol(key)', zh: '先输出visible，再输出visible,hidden,Symbol(key)' }, correct: true }
      - { text: { en: 'inherited,visible followed by inherited,visible,hidden,Symbol(key)', zh: '先输出inherited,visible，再输出inherited,visible,hidden,Symbol(key)' }, correct: false }
      - { text: { en: 'visible,Symbol(key) followed by visible,hidden,Symbol(key)', zh: '先输出visible,Symbol(key)，再输出visible,hidden,Symbol(key)' }, correct: false }
    explanation: { en: 'Object.keys selects enumerable own string keys. Reflect.ownKeys also includes the non-enumerable string and Symbol key, but neither operation includes the inherited key.', zh: 'Object.keys只选择可枚举的自有字符串键。Reflect.ownKeys还包含不可枚举字符串键与Symbol键，但两者都不包含继承键。' }
    difficulty: intermediate
    tags: [enumeration, own-properties, symbol, predict-output]

  - id: assign-shallow-identity
    type: mcq
    prompt: { en: 'After const copy = Object.assign({}, source), what is guaranteed about a nested object at source.settings?', zh: '执行const copy = Object.assign({}, source) 后，关于source.settings处的嵌套对象可以确定什么？' }
    options:
      - { text: { en: 'copy.settings and source.settings refer to the same object unless a later source overwrites the property.', zh: '除非后面的来源覆盖该属性，否则copy.settings与source.settings指向同一个对象。' }, correct: true }
      - { text: { en: 'Object.assign recursively clones settings and preserves no shared identity.', zh: 'Object.assign会递归克隆settings，不会保留共享标识。' }, correct: false }
      - { text: { en: 'Object.assign freezes settings before placing it in copy.', zh: 'Object.assign会先冻结settings，再把它放入copy。' }, correct: false }
      - { text: { en: 'The result depends only on whether source was declared with const.', zh: '结果只取决于source是否用const声明。' }, correct: false }
    explanation: { en: 'Object.assign copies the property value, which is the nested object reference. It creates a new outer target but does not recursively copy the object graph.', zh: 'Object.assign复制的是属性值，也就是嵌套对象引用。它创建新的外层目标，但不会递归复制对象图。' }
    difficulty: beginner
    tags: [object-assign, shallow-copy, identity]

  - id: spot-shadowed-hasownproperty
    title: { en: 'Spot the bug in hasOwnProperty', zh: '找出自有属性检查里的bug' }
    type: spotbug
    prompt: { en: 'Find why this helper fails for a valid null-prototype settings object.', zh: '找出这个辅助函数为何无法处理合法的无原型设置对象。' }
    code: |
      function owns(settings, key) {
        return settings.hasOwnProperty(key);
      }

      const settings = Object.create(null);
      settings.mode = 'dark';
      console.log(owns(settings, 'mode'));
    lang: javascript
    issues:
      - line: 2
        kind: edge-case
        note: { en: 'A null-prototype object does not inherit hasOwnProperty, and an ordinary object may shadow it. Use Object.hasOwn(settings, key).', zh: '无原型对象不会继承hasOwnProperty，普通对象也可能覆盖它。应使用Object.hasOwn(settings, key)。' }
    explanation: { en: 'Object.hasOwn works with ordinary and null-prototype objects and does not trust a method supplied by the input.', zh: 'Object.hasOwn同时适用于普通对象与无原型对象，而且不会信任输入自身提供的方法。' }
    difficulty: intermediate
    tags: [object-hasown, null-prototype, code-review]

  - id: freeze-integrity-scope
    type: mcq
    prompt: { en: 'What does Object.freeze(config) guarantee when config has a nested preferences object?', zh: 'config含有嵌套preferences对象时，Object.freeze(config) 能保证什么？' }
    options:
      - { text: { en: 'The own data properties of config cannot be written, removed, or reconfigured, but preferences is not frozen automatically.', zh: 'config的自有数据属性不能改写、删除或重新配置，但preferences不会自动冻结。' }, correct: true }
      - { text: { en: 'Every object reachable from config becomes deeply immutable.', zh: '从config可达的每个对象都会深度不可变。' }, correct: false }
      - { text: { en: 'Existing getters are evaluated once and replaced by fixed values.', zh: '已有getter会执行一次，并被固定值替代。' }, correct: false }
      - { text: { en: 'The config binding can no longer be assigned a different object.', zh: 'config绑定不能再赋成另一个对象。' }, correct: false }
    explanation: { en: 'Freeze changes the integrity level of one object. It neither follows nested references nor controls reassignment of the variable that holds the object.', zh: 'freeze改变的是一个对象的完整性级别，既不会沿嵌套引用递归，也不控制保存该对象的变量能否重新赋值。' }
    difficulty: intermediate
    tags: [object-freeze, integrity-level, shallow-operation]

  - id: review-generated-config-projection
    type: review
    title: { en: 'Review a generated configuration projection', zh: '审查生成的配置投影' }
    prompt: { en: 'Review this generated configuration helper before it handles request data.', zh: '在这段生成的配置辅助代码处理请求数据前，对它进行审查。' }
    task: { en: 'Merge request options without changing shared defaults, accept only mode and nested.retries, keep the returned data independent, and expose no credentials.', zh: '合并请求选项且不修改共享默认值，只接受mode与nested.retries，使返回数据保持独立，并且不暴露凭据。' }
    code: |
      function buildConfig(defaults, input) {
        const config = Object.assign(defaults, input);
        for (const key in input) {
          config[key] = input[key];
        }
        Object.freeze(config);
        return config;
      }

      function publicConfig(config) {
        const output = { ...config };
        delete output.apiToken;
        return output;
      }

      const defaults = {
        mode: 'safe',
        nested: { retries: 3 },
        apiToken: 'server-secret',
      };

      console.log(publicConfig(buildConfig(defaults, {})));
    lang: javascript
    issues:
      - line: 2
        kind: correctness
        note: { en: 'defaults is the Object.assign target, so request data mutates shared defaults and affects later calls.', zh: 'defaults是Object.assign的目标，因此请求数据会修改共享默认值并影响后续调用。' }
      - line: 3
        kind: performance
        note: { en: 'The loop repeats writes already performed by Object.assign and adds a second pass over the input without serving the task.', zh: '该循环重复Object.assign已完成的写入，无助于任务，却再次遍历输入。' }
      - line: 4
        kind: security
        note: { en: 'for...in accepts inherited and attacker-chosen keys; assignment of __proto__ to an ordinary target can change its prototype. Construct the two allowed fields instead.', zh: 'for...in会接受继承键与攻击者选择的键；向普通目标赋值 __proto__ 可能改变其原型。应直接构造两个允许字段。' }
      - line: 6
        kind: edge-case
        note: { en: 'Freezing config is shallow, so config.nested remains shared and mutable instead of satisfying independent returned data.', zh: '冻结config只是浅层操作，因此config.nested仍会共享且可变，不符合返回数据独立的要求。' }
      - line: 11
        kind: readability
        note: { en: 'Spreading everything and deleting one known secret leaves the public shape implicit. An allowlist makes the output contract reviewable and prevents future internal fields from leaking.', zh: '先展开全部字段再删除一个已知秘密，会让公开形状保持隐式。允许列表使输出契约可审查，也能避免未来新增内部字段泄漏。' }
    right: { en: 'The generated code gives construction and public projection separate names, returns values explicitly, and recognizes that credentials should not appear in public output.', zh: '生成代码把构造与公开投影分成两个具名步骤，显式返回结果，也意识到凭据不应出现在公开输出中。' }
    checklist:
      - { en: 'Snapshot shared defaults before and after two calls with different inputs.', zh: '使用不同输入调用两次，并比较调用前后的共享默认值快照。' }
      - { en: 'Test own, inherited, __proto__, and unexpected credential keys against the allowlist.', zh: '用自有键、继承键、__proto__ 和意外凭据键测试允许列表。' }
      - { en: 'Mutate the returned nested object and verify no source or earlier result changes.', zh: '修改返回的嵌套对象，确认来源和之前的结果都不变化。' }
      - { en: 'Inspect descriptors and identities instead of treating freeze as recursive.', zh: '检查描述符与对象标识，不要把freeze当成递归操作。' }
    explanation: { en: 'Build a fresh object from the allowed fields, validate nested input, and create a new nested record. Do not add a redundant enumeration pass or depend on a denylist for secrets.', zh: '应从允许字段构造新对象，校验嵌套输入，并创建新的嵌套记录。不要重复枚举，也不要依赖秘密字段排除列表。' }
    difficulty: advanced
    minutes: 8
    tags: [code-review, object-assign, enumeration, security, immutability]
