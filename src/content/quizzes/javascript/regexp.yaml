topic: javascript/regexp
items:
  - id: predict-global-test-state
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      const pattern = /cat/g;

      console.log(pattern.test('cat'), pattern.lastIndex);
      console.log(pattern.test('cat'), pattern.lastIndex);
      console.log(pattern.test('cat'), pattern.lastIndex);
    lang: javascript
    options:
      - { text: { en: "true 3\ntrue 3\ntrue 3", zh: "true 3\ntrue 3\ntrue 3" }, correct: false }
      - { text: { en: "true 3\nfalse 0\ntrue 3", zh: "true 3\nfalse 0\ntrue 3" }, correct: true }
      - { text: { en: "true 0\ntrue 0\ntrue 0", zh: "true 0\ntrue 0\ntrue 0" }, correct: false }
      - { text: { en: 'It throws because test cannot use a global pattern.', zh: '程序会抛错，因为test不能使用全局模式。' }, correct: false }
    explanation: { en: 'The first global test ends at index 3. The second starts there, fails, and resets lastIndex to 0; the third then succeeds again.', zh: '第一次全局测试在索引3结束；第二次从该处开始，失败后把lastIndex重置为0，因此第三次又会成功。' }
    difficulty: intermediate
    tags: [regexp, lastindex, global, predict-output]

  - id: choose-all-captures
    type: mcq
    prompt: { en: 'Which API returns every match with each match’s named captures and indices?', zh: '哪个API会返回全部匹配，并保留每项匹配的命名捕获与索引？' }
    options:
      - { text: { en: 'Spread text.matchAll(/pattern/gd) into an array.', zh: '把text.matchAll(/pattern/gd) 展开成数组。' }, correct: true }
      - { text: { en: 'Call text.match(/pattern/gd), which always preserves every capture.', zh: '调用text.match(/pattern/gd)，它总会保留每项捕获。' }, correct: false }
      - { text: { en: 'Call /pattern/d.test(text), which returns a detailed result.', zh: '调用 /pattern/d.test(text)，它会返回详细结果。' }, correct: false }
      - { text: { en: 'Call text.search(/pattern/d), which returns every matching range.', zh: '调用text.search(/pattern/d)，它会返回全部匹配范围。' }, correct: false }
    explanation: { en: 'matchAll with a global pattern yields one detailed result per match. Global match returns only the full matched strings, while test and search return a Boolean and one index.', zh: 'matchAll配合全局模式会为每项匹配产生详细结果；全局match只返回完整匹配文本，test与search则分别返回布尔值和一个索引。' }
    difficulty: intermediate
    tags: [regexp, matchall, captures, indices]

  - id: spot-stateful-order-validator
    title: { en: 'Spot the bug in order-ID validation', zh: '找出订单ID校验里的bug' }
    type: spotbug
    prompt: { en: 'Find why this order-ID validator rejects every second valid value.', zh: '找出这个订单编号校验器为何会拒绝每隔一个出现的合法值。' }
    code: |
      const ORDER_ID = /^ORD-\d{4}$/g;

      function isOrderId(value) {
        return ORDER_ID.test(value);
      }

      console.log(['ORD-1001', 'ORD-1002', 'ORD-1003'].map(isOrderId));
    lang: javascript
    issues:
      - line: 1
        kind: correctness
        note: { en: 'The g flag makes test start from the previous lastIndex. A whole-value Boolean validator needs no global state, so remove g.', zh: 'g标志让test从上次留下的lastIndex开始；完整值的布尔校验不需要全局状态，应移除g。' }
    explanation: { en: 'A successful test sets lastIndex to the string end. The next call begins there, fails, and resets the cursor, creating an alternating result that depends on call history.', zh: '成功测试会把lastIndex设到字符串末尾；下一次调用从末尾开始并失败，再重置游标，于是结果随调用历史交替变化。' }
    difficulty: intermediate
    tags: [regexp, validation, lastindex, code-review]

  - id: escape-dynamic-literal
    type: mcq
    prompt: { en: 'A search term must be treated as literal text inside a larger Node 24 pattern. What should the code do?', zh: '搜索词必须在Node 24的更大模式中按字面文本处理。代码应该怎么做？' }
    options:
      - { text: { en: 'Insert RegExp.escape(term) into the pattern source.', zh: '把RegExp.escape(term) 插入模式源文本。' }, correct: true }
      - { text: { en: 'Insert term directly and add the i flag.', zh: '直接插入term，再添加i标志。' }, correct: false }
      - { text: { en: 'Apply encodeURIComponent(term) before insertion.', zh: '插入前对term调用encodeURIComponent。' }, correct: false }
      - { text: { en: 'Wrap term in a capturing group; parentheses make it literal.', zh: '用捕获组包住term；圆括号会让它按字面解释。' }, correct: false }
    explanation: { en: 'RegExp.escape produces source text that remains literal even in tricky concatenation contexts. Case folding, URL encoding, and grouping do not neutralize regex syntax.', zh: 'RegExp.escape生成的源文本即使处于复杂拼接上下文也会保持字面含义；大小写折叠、URL编码和分组都不会消除正则语法。' }
    difficulty: beginner
    tags: [regexp, dynamic-pattern, escaping, security]

  - id: review-generated-release-redactor
    type: review
    title: { en: 'Review a generated release-note redactor', zh: '审查生成的发布说明脱敏器' }
    prompt: { en: 'Review this generated redactor before it processes untrusted release notes.', zh: '在这段生成的脱敏器处理不可信发布说明前，对它进行审查。' }
    task: { en: 'Replace every configured term as literal text, leave messages unchanged when the term list is empty, insert the caller’s replacement literally, and reject messages over maxLength.', zh: '把每个配置词按字面文本替换；词表为空则保持消息不变；调用方的替换文本必须原样插入，并拒绝超过maxLength的消息。' }
    code: |
      function createReleaseRedactor(terms, maxLength = 10_000) {
        const source = terms.join('|');
        const pattern = new RegExp(source, 'gi');

        return function redact(message, replacement = '[hidden]') {
          return message.replace(pattern, replacement);
        };
      }

      const redact = createReleaseRedactor(['C++', 'C+', '[draft]']);
      const notes = [
        'Move [draft] C++ code; keep C+ notes.',
        'Keep JavaScript release notes visible.',
      ];
      for (const note of notes) {
        console.log(redact(note, '$& removed'));
      }
    lang: javascript
    issues:
      - line: 2
        kind: security
        note: { en: 'The configured terms are inserted as regex syntax. Escape each term with RegExp.escape before joining so metacharacters cannot alter or invalidate the pattern.', zh: '配置词被当作正则语法插入；连接前应逐项调用RegExp.escape，避免元字符改变或破坏模式。' }
      - line: 2
        kind: edge-case
        note: { en: 'An empty term list produces an empty pattern, which matches at every position instead of leaving the message unchanged.', zh: '空词表会产生空模式，在每个位置匹配，而不是保持消息不变。' }
      - line: 6
        kind: correctness
        note: { en: 'A string replacement interprets $& and capture tokens instead of inserting the caller’s value literally. Return replacement from a function.', zh: '字符串替换值会解释 $& 和捕获记号，无法原样插入调用方的值；应从函数返回replacement。' }
      - line: 1
        kind: performance
        note: { en: 'maxLength is never enforced, so arbitrarily large untrusted messages enter synchronous matching. Reject oversize input before calling replace or test.', zh: 'maxLength从未生效，任意大的不可信消息都会进入同步匹配；应在调用replace或test前拒绝超长输入。' }
    right: { en: 'The factory creates one reusable pattern instead of recompiling it for each message, requests global case-insensitive replacement, and returns a narrow function rather than the mutable matcher itself.', zh: '工厂只创建一次可复用模式，没有为每条消息重新编译；它要求全局、大小写不敏感替换，并返回单一职责函数而不暴露可变匹配器。' }
    checklist:
      - { en: 'Classify every interpolated fragment as trusted regex syntax or escaped literal text.', zh: '把每个插入片段分类为可信正则语法或已转义的字面文本。' }
      - { en: 'Test empty, overlapping, metacharacter-containing, and duplicate term lists.', zh: '测试空词表、重叠词、含元字符的词以及重复词。' }
      - { en: 'Use replacements containing $&, $1, and $$ to verify literal insertion.', zh: '使用包含 $&、$1和 $$ 的替换文本，验证是否原样插入。' }
      - { en: 'Exercise maxLength boundaries and long near-matches to inspect synchronous cost.', zh: '测试maxLength边界和长近似匹配输入，检查同步开销。' }
    explanation: { en: 'Handle an empty list before construction, escape each configured term, enforce maxLength before matching, and return dynamic replacement text from a function. These changes preserve the factory’s narrow interface while making its input contracts explicit.', zh: '构造前先处理空词表，转义每个配置词，在匹配前执行maxLength，并从函数返回动态替换文本。这些修改既保留工厂的单一接口，也明确了输入契约。' }
    difficulty: advanced
    tags: [regexp, code-review, escaping, replacement, redos]
