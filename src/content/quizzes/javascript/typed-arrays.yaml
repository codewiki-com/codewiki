topic: javascript/typed-arrays
items:
  - id: predict-shared-subarray
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      const source = new Uint8Array([10, 20, 30]);
      const view = source.subarray(1);
      const copy = source.slice(1);

      source[1] = 99;
      console.log([...view].join(','));
      console.log([...copy].join(','));
    lang: javascript
    options:
      - { text: { en: "99,30\n20,30", zh: "99,30\n20,30" }, correct: true }
      - { text: { en: "20,30\n20,30", zh: "20,30\n20,30" }, correct: false }
      - { text: { en: "99,30\n99,30", zh: "99,30\n99,30" }, correct: false }
      - { text: { en: 'It throws because typed arrays cannot share storage.', zh: '程序抛出异常，因为类型化数组不能共享存储。' }, correct: false }
    explanation: { en: 'subarray creates a view over the source buffer, so it sees 99. slice copied the elements before the write and still contains 20,30.', zh: 'subarray在源缓冲区上建立视图，因此会读到99。slice在写入前已经复制元素，仍保存20,30。' }
    difficulty: beginner
    tags: [typed-arrays, aliasing, predict-output]

  - id: predict-integer-conversion
    type: predict
    prompt: { en: 'How do the two arrays print these out-of-range and fractional values?', zh: '两个数组会怎样输出这些越界值和小数？' }
    code: |
      const wrapped = new Uint8Array([256, -1, 3.9]);
      const clamped = new Uint8ClampedArray([256, -1, 3.9]);

      console.log([...wrapped].join(','));
      console.log([...clamped].join(','));
    lang: javascript
    options:
      - { text: { en: "0,255,3\n255,0,4", zh: "0,255,3\n255,0,4" }, correct: true }
      - { text: { en: "255,0,4\n0,255,3", zh: "255,0,4\n0,255,3" }, correct: false }
      - { text: { en: "256,-1,3.9\n256,-1,3.9", zh: "256,-1,3.9\n256,-1,3.9" }, correct: false }
      - { text: { en: 'Both constructors throw RangeError.', zh: '两个构造函数都会抛出RangeError。' }, correct: false }
    explanation: { en: 'Uint8Array applies unsigned 8-bit conversion, while Uint8ClampedArray saturates to the byte range and rounds the fractional value.', zh: 'Uint8Array执行无符号8位转换；Uint8ClampedArray把结果限制在字节范围内，并对小数进行舍入。' }
    difficulty: intermediate
    tags: [typed-arrays, numeric-conversion, predict-output]

  - id: spot-backing-buffer-offset
    title: { en: 'Spot the bug in Uint8Array ID reading', zh: '找出类型数组ID读取里的bug' }
    type: spotbug
    prompt: { en: 'Find why this helper can read the wrong message ID from a Uint8Array window.', zh: '找出这个辅助函数为何可能从Uint8Array窗口读到错误的消息ID。' }
    code: |
      function readMessageId(bytes) {
        if (bytes.byteLength < 4) throw new RangeError('Truncated ID');
        const view = new DataView(bytes.buffer);
        return view.getUint32(0, false);
      }
    lang: javascript
    issues:
      - line: 3
        kind: correctness
        note: { en: 'The DataView starts at backing-buffer offset 0 and ignores the input view offset and boundary. Pass bytes.byteOffset and bytes.byteLength to the constructor.', zh: 'DataView从底层缓冲区偏移0开始，忽略了输入视图的偏移和边界。构造时应传入bytes.byteOffset与bytes.byteLength。' }
    explanation: { en: 'A subarray or pooled Node.js Buffer can begin inside a larger buffer. The parser must preserve the geometry of the input view.', zh: 'subarray或池化的Node.js Buffer可以从更大缓冲区内部开始。解析器必须保留输入视图的几何范围。' }
    difficulty: intermediate
    tags: [data-view, byte-offset, code-review]

  - id: choose-big-endian-field
    type: mcq
    prompt: { en: 'Which expression safely reads a big-endian Uint32 at byte offset 1 of an arbitrary packet view?', zh: '哪个表达式能从任意packet视图的字节偏移1安全读取大端Uint32？' }
    options:
      - { text: { en: 'new DataView(packet.buffer, packet.byteOffset, packet.byteLength).getUint32(1, false)', zh: 'new DataView(packet.buffer, packet.byteOffset, packet.byteLength).getUint32(1, false)' }, correct: true }
      - { text: { en: 'new Uint32Array(packet.buffer, 1, 1)[0]', zh: 'new Uint32Array(packet.buffer, 1, 1)[0]' }, correct: false }
      - { text: { en: 'new DataView(packet.buffer).getUint32(1, true)', zh: 'new DataView(packet.buffer).getUint32(1, true)' }, correct: false }
      - { text: { en: 'packet.slice(1, 5)[0]', zh: 'packet.slice(1, 5)[0]' }, correct: false }
    explanation: { en: 'DataView permits an unaligned field offset, preserves the packet window, and false selects big-endian. Uint32Array requires aligned offsets and uses native byte order.', zh: 'DataView允许字段偏移不对齐，可以保留packet窗口，而且false选择大端序。Uint32Array要求偏移对齐，并使用本机字节序。' }
    difficulty: intermediate
    tags: [data-view, endianness, alignment]

  - id: review-generated-telemetry-parser
    type: review
    title: { en: 'Review a generated telemetry parser', zh: '审查生成的遥测数据解析器' }
    prompt: { en: 'Review this generated parser before it handles uploaded binary frames.', zh: '在这段生成的解析器处理上传二进制帧之前，对它进行审查。' }
    task: { en: 'Parse an aligned Uint8Array window containing an 8-byte little-endian header and Float32 samples, cap untrusted counts, and return a borrowed sample view.', zh: '解析对齐的Uint8Array窗口，其中包含8字节小端头部和Float32样本；限制不可信计数，并返回借用的样本视图。' }
    code: |
      function decodeTelemetry(bytes) {
        const view = new DataView(bytes.buffer);
        const version = view.getUint8(0);
        const flags = view.getUint8(1);
        const sampleCount = view.getUint32(4, true);
        const copied = new Float32Array(sampleCount);
        const samples = new Float32Array(
          bytes.buffer,
          bytes.byteOffset + 8,
          sampleCount,
        );
        copied.set(samples);

        return { version, flags, samples: copied };
      }
    lang: javascript
    issues:
      - line: 2
        kind: correctness
        note: { en: 'The DataView ignores bytes.byteOffset and bytes.byteLength, so it can read a header outside the supplied view.', zh: 'DataView忽略了bytes.byteOffset与bytes.byteLength，因此可能读取输入视图之外的头部。' }
      - line: 3
        kind: edge-case
        note: { en: 'The parser reads header fields before proving that the input view contains the complete 8-byte header.', zh: '解析器在确认输入视图包含完整的8字节头部之前，就开始读取头部字段。' }
      - line: 5
        kind: readability
        note: { en: 'Bare offsets and the Boolean byte-order flag leave the frame layout implicit; named header and field constants would expose the contract.', zh: '裸偏移与布尔字节序参数让帧布局保持隐式；具名的头部与字段常量能直接表达契约。' }
      - line: 6
        kind: security
        note: { en: 'An untrusted sample count drives allocation before a business cap or remaining-byte check, allowing a tiny frame to request excessive memory.', zh: '不可信样本数在业务上限和剩余字节检查之前驱动分配，小型输入也能请求过量内存。' }
      - line: 12
        kind: performance
        note: { en: 'The task calls for a borrowed sample view, but copied.set duplicates every sample into a second buffer.', zh: '任务要求返回借用视图，但copied.set会把每个样本复制到第二个缓冲区。' }
    right: { en: 'The code uses an unsigned count, states little-endian explicitly, and gives the result a stable object shape.', zh: '代码使用无符号计数，明确指定小端序，并让结果具有稳定的对象结构。' }
    checklist:
      - { en: 'Validate the input type and full header before any field read.', zh: '读取任何字段前，验证输入类型与完整头部。' }
      - { en: 'Preserve the view offset and bound every field to its local byte length.', zh: '保留视图偏移，并把每个字段限制在局部字节长度内。' }
      - { en: 'Cap sample count and prove count times element width fits the remaining bytes.', zh: '限制样本数，并证明样本数乘元素宽度不超过剩余字节。' }
      - { en: 'Return a shared view or owned copy according to the stated ownership contract.', zh: '按照已声明的所有权契约返回共享视图或独立副本。' }
    explanation: { en: 'Build the DataView over the input window, validate the 8-byte header and a capped count, then construct one aligned Float32Array view only after its byte range is proven.', zh: '应在输入窗口上建立DataView，验证8字节头部和受限计数，再在证明字节范围有效后构造唯一的对齐Float32Array视图。' }
    difficulty: advanced
    minutes: 8
    tags: [typed-arrays, code-review, binary-parser, ownership]
