topic: javascript/objects-prototypes
items:
  - id: predict-shadowed-property
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      const defaults = { currency: 'EUR' };
      const order = Object.create(defaults);
      order.currency = 'USD';
      delete order.currency;

      console.log(Object.hasOwn(order, 'currency'));
      console.log('currency' in order);
      console.log(order.currency);
    lang: javascript
    options:
      - { text: { en: "false\ntrue\nEUR", zh: "false\ntrue\nEUR" }, correct: true }
      - { text: { en: "false\nfalse\nundefined", zh: "false\nfalse\nundefined" }, correct: false }
      - { text: { en: "true\ntrue\nUSD", zh: "true\ntrue\nUSD" }, correct: false }
      - { text: { en: 'It throws when the own property is deleted.', zh: '删除自有属性时会抛错。' }, correct: false }
    explanation: { en: 'Deleting the own property reveals the inherited value. The key is no longer own, but it is still found through the prototype chain.', zh: '删除自有属性后，继承值会再次显现。该键不再是自有属性，但仍能通过原型链找到。' }
    difficulty: beginner
    tags: [prototype-chain, shadowing, predict-output]

  - id: descriptor-omitted-flags
    type: mcq
    prompt: { en: "What flags does Object.defineProperty(record, 'id', { value: 7 }) give the new property?", zh: "Object.defineProperty(record, 'id', { value: 7 }) 会为新属性设置哪些标志？" }
    options:
      - { text: { en: 'writable, enumerable, and configurable are all false.', zh: 'writable、enumerable 与 configurable 都是 false。' }, correct: true }
      - { text: { en: 'All three flags are true, like ordinary assignment.', zh: '三个标志都像普通赋值一样是 true。' }, correct: false }
      - { text: { en: 'Only writable is true.', zh: '只有 writable 是 true。' }, correct: false }
      - { text: { en: 'The flags are inherited from Object.prototype.', zh: '这些标志从 Object.prototype 继承。' }, correct: false }
    explanation: { en: 'Boolean descriptor fields omitted from defineProperty default to false. Ordinary assignment creates a property with all three flags true.', zh: 'defineProperty 中省略的布尔描述符字段默认为 false；普通赋值创建的属性则会把三个标志都设为 true。' }
    difficulty: intermediate
    tags: [property-descriptor, define-property]

  - id: spot-shared-prototype-array
    title: { en: 'Spot the bug in Cart items', zh: '找出 Cart 项目列表里的 bug' }
    type: spotbug
    prompt: { en: 'Find why adding an item to one cart changes the other cart.', zh: '找出为什么给一个购物车添加商品会改变另一个购物车。' }
    code: |
      function Cart() {}
      Cart.prototype.items = [];
      Cart.prototype.add = function add(item) {
        this.items.push(item);
      };

      const first = new Cart();
      const second = new Cart();
      first.add('book');
      console.log(second.items);
    lang: javascript
    issues:
      - line: 2
        kind: correctness
        note: { en: 'The prototype holds one shared array. Initialize this.items = [] inside Cart so every instance owns its mutable state.', zh: '原型只保存一个共享数组。应在 Cart 内初始化 this.items = []，让每个实例拥有自己的可变状态。' }
    explanation: { en: 'Method lookup may be shared, but per-instance mutable collections must normally be own properties. push mutates the inherited array instead of creating an own property.', zh: '方法查找可以共享，但每实例可变集合通常必须是自有属性。push 修改了继承数组，并不会创建自有属性。' }
    difficulty: intermediate
    tags: [prototype, shared-state, code-review]

  - id: function-prototype-relationships
    type: mcq
    prompt: { en: 'For an ordinary constructable function C and const value = new C(), which relationship normally holds?', zh: '对于普通可构造函数 C 与 const value = new C()，通常成立的是哪种关系？' }
    options:
      - { text: { en: 'Object.getPrototypeOf(value) === C.prototype', zh: 'Object.getPrototypeOf(value) === C.prototype' }, correct: true }
      - { text: { en: 'Object.getPrototypeOf(C) === C.prototype', zh: 'Object.getPrototypeOf(C) === C.prototype' }, correct: false }
      - { text: { en: 'value.prototype === C', zh: 'value.prototype === C' }, correct: false }
      - { text: { en: 'C.prototype === Function.prototype', zh: 'C.prototype === Function.prototype' }, correct: false }
    explanation: { en: "new normally links the fresh object's [[Prototype]] to C.prototype. The function C has its own, separate prototype link, usually to Function.prototype.", zh: 'new 通常把新对象的 [[Prototype]] 链接到 C.prototype。函数 C 自身还有独立的原型链接，通常通向 Function.prototype。' }
    difficulty: intermediate
    tags: [constructor, prototype, new]

  - id: review-generated-session-builder
    type: review
    title: { en: 'Review a generated session builder', zh: '审查生成的会话构造器' }
    prompt: { en: 'Review this generated object-building code before it handles request payloads.', zh: '在这段生成的对象构造代码处理请求载荷前，对它进行审查。' }
    task: { en: 'Build a public session from own userId and preferences.theme fields, default the role to viewer, keep nested data independent, and give each Session its own tags.', zh: '从自有 userId 与 preferences.theme 字段构造公开会话，把角色默认为 viewer，使嵌套数据保持独立，并让每个 Session 拥有自己的 tags。' }
    code: |
      function buildSession(payload) {
        const session = {};
        for (const key in payload) {
          session[key] = payload[key];
        }
        if (!session.role) session.role = 'viewer';
        Object.freeze(session);
        return session;
      }

      function Session(data) {
        Object.assign(this, data);
      }
      Session.prototype.tags = [];
      Session.prototype.addTag = function addTag(tag) {
        this.tags.push(tag);
      };

      const inherited = { role: 'admin' };
      const payload = Object.create(inherited);
      payload.userId = 'u-7';
      payload.preferences = { theme: 'dark' };
      const first = new Session(buildSession(payload));
      const second = new Session(buildSession(payload));
      first.addTag('new');
    lang: javascript
    issues:
      - line: 3
        kind: security
        note: { en: 'for...in accepts inherited and attacker-controlled keys, including keys that can affect ordinary assignment semantics. Select the named own fields with Object.hasOwn instead.', zh: 'for...in 会接受继承键与攻击者控制的键，其中还可能包含改变普通赋值语义的键。应使用 Object.hasOwn 选择具名自有字段。' }
      - line: 3
        kind: performance
        note: { en: 'The loop copies every enumerable input field even though the output contract needs only two named fields. A direct projection bounds work to the schema.', zh: '输出契约只需要两个具名字段，该循环却复制每个可枚举输入字段。直接投影可以把工作量限制在模式内。' }
      - line: 7
        kind: edge-case
        note: { en: 'Object.freeze is shallow, so the returned preferences object remains aliased to payload and mutable. Validate and construct a new nested record.', zh: 'Object.freeze 只作用于一层，因此返回的 preferences 仍与 payload 共享且可变。应校验并构造新的嵌套记录。' }
      - line: 14
        kind: correctness
        note: { en: 'tags is one mutable array on the prototype, so first.addTag also changes second.tags. Initialize an own array in the constructor.', zh: 'tags 是原型上的同一个可变数组，因此 first.addTag 也会改变 second.tags。应在构造函数中初始化自有数组。' }
    right: { en: 'The generated code separates projection from instance behavior, gives the shared addTag method a name, and attempts to establish an explicit default and integrity boundary.', zh: '生成代码把数据投影与实例行为分开，为共享的 addTag 方法命名，并尝试建立明确的默认值与完整性边界。' }
    checklist:
      - { en: 'Test inherited, __proto__, missing, and wrong-typed input fields.', zh: '测试继承字段、__proto__、缺失字段和类型错误字段。' }
      - { en: 'Mutate the input and returned nested records in both directions.', zh: '分别从输入与返回结果两侧修改嵌套记录。' }
      - { en: 'Create two instances and interleave mutations of every object-valued field.', zh: '创建两个实例，交错修改每个对象值字段。' }
      - { en: 'Inspect own descriptors and the prototype chain after construction.', zh: '构造后检查自有描述符与原型链。' }
    explanation: { en: 'Project and validate the two allowed fields into fresh records, then initialize tags as an own property in Session. Freezing may be added after ownership is correct, but it is not validation or deep isolation.', zh: '应把两个允许字段校验并投影到新记录中，再在 Session 内把 tags 初始化为自有属性。所有权正确后可以再冻结，但冻结既不是校验，也不是深层隔离。' }
    difficulty: advanced
    minutes: 8
    tags: [code-review, prototype-pollution, shared-state, descriptors]
