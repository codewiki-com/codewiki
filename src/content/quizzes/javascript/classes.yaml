topic: javascript/classes
items:
  - id: predict-own-versus-prototype
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      class Counter {
        count = 0;

        increment() {
          this.count += 1;
        }
      }

      const first = new Counter();
      const second = new Counter();

      console.log(Object.hasOwn(first, 'count'), Object.hasOwn(first, 'increment'));
      console.log(first.increment === second.increment);
    lang: javascript
    options:
      - { text: { en: "true false\ntrue", zh: "true false\ntrue" }, correct: true }
      - { text: { en: "true true\nfalse", zh: "true true\nfalse" }, correct: false }
      - { text: { en: "false true\ntrue", zh: "false true\ntrue" }, correct: false }
      - { text: { en: 'It throws because increment is not an own property.', zh: '程序会抛错，因为increment不是自有属性。' }, correct: false }
    explanation: { en: 'The public field count is initialized as an own property on each instance. increment lives on Counter.prototype, where both instances find the same function.', zh: '公开字段count会在每个实例上初始化为自有属性；increment位于Counter.prototype，两个实例查找到的是同一个函数。' }
    difficulty: beginner
    tags: [classes, fields, prototype, predict-output]

  - id: predict-derived-field-order
    type: predict
    prompt: { en: 'What does constructing ChildPanel print?', zh: '构造ChildPanel时会输出什么？' }
    code: |
      class BasePanel {
        label = 'base';

        constructor() {
          console.log(this.label);
        }
      }

      class ChildPanel extends BasePanel {
        label = 'child';

        constructor() {
          super();
          console.log(this.label);
        }
      }

      new ChildPanel();
    lang: javascript
    options:
      - { text: { en: "base\nchild", zh: "base\nchild" }, correct: true }
      - { text: { en: "child\nchild", zh: "child\nchild" }, correct: false }
      - { text: { en: "undefined\nchild", zh: "undefined\nchild" }, correct: false }
      - { text: { en: 'It throws before either log call.', zh: '程序会在两次输出之前抛错。' }, correct: false }
    explanation: { en: 'Base fields initialize before the base constructor body, so the first value is base. The derived field initializes as super returns, before the second log call.', zh: '基类字段在基类构造函数体之前初始化，所以先输出base；派生类字段在super返回时、第二次输出前初始化。' }
    difficulty: intermediate
    tags: [classes, inheritance, initialization, predict-output]

  - id: spot-detached-method
    title: { en: 'Spot the bug in product labels', zh: '找出产品标签里的bug' }
    type: spotbug
    prompt: { en: 'Find why mapping products throws instead of producing labels.', zh: '找出映射商品时为何抛错，而没有生成标签。' }
    code: |
      class PriceList {
        constructor(currency) {
          this.currency = currency;
        }

        label(product) {
          return `${this.currency} ${product.price.toFixed(2)}`;
        }
      }

      const list = new PriceList('USD');
      const products = [{ price: 8 }, { price: 12.5 }];
      const labels = products.map(list.label);
      console.log(labels);
    lang: javascript
    issues:
      - line: 13
        kind: correctness
        note: { en: 'map calls the detached function without list as its receiver, so this is undefined inside label. Pass product => list.label(product), or bind once before mapping.', zh: 'map调用脱离实例的函数时不会把list作为接收者，因此label内的this是undefined。应传入product => list.label(product)，或在映射前绑定一次。' }
    explanation: { en: 'Class methods are not automatically bound. Method-call syntax supplies the receiver; passing the method as a value removes that call form.', zh: '类方法不会自动绑定实例。方法调用语法负责提供接收者；把方法作为普通值传递会丢失这种调用形式。' }
    difficulty: intermediate
    tags: [classes, this, callbacks, code-review]

  - id: private-field-brand
    type: mcq
    prompt: { en: 'Which statement about a field declared as #records is correct?', zh: '关于声明为 #records的字段，哪项说法正确？' }
    options:
      - { text: { en: 'Access inside the declaring class checks that the receiver has that class private brand.', zh: '在声明类内部访问时，运行时会检查接收者是否具有该类的私有标记。' }, correct: true }
      - { text: { en: 'Object spread copies it when the field value is enumerable.', zh: '当字段值可枚举时，对象展开会复制它。' }, correct: false }
      - { text: { en: 'A subclass can access it directly because private fields follow the prototype chain.', zh: '私有字段沿原型链继承，因此子类可以直接访问。' }, correct: false }
      - { text: { en: "Object.hasOwn(instance, '#records') detects it.", zh: "Object.hasOwn(instance, '#records') 可以检测到它。" }, correct: false }
    explanation: { en: 'Private fields are not ordinary string-keyed properties and are not found through the prototype chain. Their syntax is limited to the declaring class body and performs a brand check.', zh: '私有字段不是普通的字符串键属性，也不通过原型链查找。其语法只在声明它的类体内可用，访问时还会执行标记检查。' }
    difficulty: intermediate
    tags: [classes, private-fields, brand-check]

  - id: review-generated-session-store
    type: review
    title: { en: 'Review a generated session store', zh: '审查生成的会话存储' }
    prompt: { en: 'Review this generated session store before it is used by an authentication service.', zh: '在认证服务使用这段生成的会话存储代码前，对它进行审查。' }
    task: { en: 'Build an extensible session store whose create method can be registered as a callback, returns summaries without tokens, tolerates missing lookup input, and supports frequent name lookup.', zh: '实现可扩展的会话存储：create方法可注册为回调，返回不含令牌的摘要，能处理缺失的查询输入，并支持频繁按名称查询。' }
    code: |
      class SessionStore {
        static #nextId = 1;
        #sessions = [];
        constructor(audit) { this.audit = audit; }
        create(userName, token) {
          const session = { id: SessionStore.#nextId++, userName, token, roles: [] };
          this.#sessions.push(session);
          this.audit(`created ${session.id}`);
          return session;
        }
        get sessions() {
          return [...this.#sessions];
        }
        findByUser(name) {
          return this.#sessions.find((session) =>
            session.userName.toLowerCase() === name.toLowerCase(),
          );
        }
      }
      class AdminSessionStore extends SessionStore {}
      const store = new AdminSessionStore(console.log);
      const create = store.create;
      [['Ada', 'secret-a'], ['Lin', 'secret-b']].map(([name, token]) => create(name, token));
      console.log(store.sessions);
    lang: javascript
    issues:
      - line: 9
        kind: security
        note: { en: 'create returns a record containing the raw token, and the sessions getter exposes it again. Return redacted summaries from both paths.', zh: 'create返回的记录包含原始令牌，sessions getter又会将其暴露。两个返回路径都应提供已隐藏令牌的摘要。' }
      - line: 15
        kind: performance
        note: { en: 'Every lookup scans all sessions and lowercases each stored name again, which violates the frequent-lookup requirement. Maintain a normalized Map index if that requirement is real.', zh: '每次查询都会扫描全部会话，并重复转换每个已存名称的大小写，不符合频繁查询的要求。若需求确实如此，应维护规范化名称的Map索引。' }
      - line: 16
        kind: edge-case
        note: { en: 'A missing name or a session with a non-string userName makes toLowerCase throw. Validate at creation and define the missing-query result.', zh: 'name缺失或会话的userName不是字符串时，toLowerCase会抛错。应在创建时校验，并定义查询参数缺失时的结果。' }
      - line: 23
        kind: correctness
        note: { en: 'create is invoked as a detached callback, so this is undefined inside the method. Register a wrapper or a function bound once to store.', zh: 'create作为脱离实例的回调被调用，因此方法内的this为undefined。应注册包装函数，或注册一次性绑定到store的函数。' }
    right: { en: 'The code uses a true private field for storage, calls super implicitly through the default derived constructor, and names SessionStore when touching its base-owned static private counter, avoiding the subclass private-brand trap.', zh: '代码使用真正的私有字段保存数据；默认派生构造函数会隐式调用super；访问基类统一拥有的静态私有计数器时明确写出SessionStore，避开了子类私有标记陷阱。' }
    checklist:
      - { en: 'Invoke registered methods through the exact callback path used in production.', zh: '通过生产环境的实际回调路径调用已注册方法。' }
      - { en: 'Inspect every returned record for secrets and nested mutable references.', zh: '检查每条返回记录中的秘密与嵌套可变引用。' }
      - { en: 'Test missing, empty, and non-string names at creation and lookup boundaries.', zh: '在创建与查询边界测试缺失、空值和非字符串名称。' }
      - { en: 'Measure lookup volume before choosing a scan or a maintained index.', zh: '根据实际查询量决定线性扫描还是维护索引。' }
    explanation: { en: 'Bind callback receivers deliberately, validate names at the boundary, return redacted immutable projections, and use a normalized index when measured lookup traffic justifies it. Keep the explicit base-class reference for the one shared private counter.', zh: '应显式绑定回调接收者，在边界校验名称，返回已隐藏秘密的不可变投影，并在实测查询量需要时使用规范化索引。统一计数器应继续通过明确的基类名称访问。' }
    difficulty: advanced
    tags: [classes, code-review, this, private-fields, inheritance]
