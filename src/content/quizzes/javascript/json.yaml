topic: javascript/json
items:
  - id: predict-stringify-loss
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      const value = {
        missing: undefined,
        score: NaN,
        samples: [undefined, Infinity],
      };

      console.log(JSON.stringify(value));
    lang: javascript
    options:
      - { text: { en: '{"missing":null,"score":null,"samples":[null,null]}', zh: '{"missing":null,"score":null,"samples":[null,null]}' }, correct: false }
      - { text: { en: '{"score":null,"samples":[null,null]}', zh: '{"score":null,"samples":[null,null]}' }, correct: true }
      - { text: { en: '{"score":"NaN","samples":[null,"Infinity"]}', zh: '{"score":"NaN","samples":[null,"Infinity"]}' }, correct: false }
      - { text: { en: 'It throws TypeError.', zh: '它会抛出 TypeError。' }, correct: false }
    explanation: { en: 'An undefined object property is omitted. NaN, Infinity, and an undefined array position are represented as null.', zh: '值为 undefined 的对象属性会被省略；NaN、Infinity 和数组中的 undefined 位置都会表示为 null。' }
    difficulty: beginner
    tags: [json-stringify, unsupported-values, predict-output]

  - id: parse-before-validation
    type: mcq
    prompt: { en: 'An endpoint requires a JSON object with a string orderId. What must happen after JSON.parse succeeds?', zh: '接口要求 JSON 顶层为对象并包含字符串 orderId。JSON.parse 成功后还必须做什么？' }
    options:
      - { text: { en: 'Check that the result is a non-null, non-array object and that orderId is a string.', zh: '检查结果是非 null、非数组的对象，并确认 orderId 是字符串。' }, correct: true }
      - { text: { en: 'Nothing; valid JSON syntax guarantees the endpoint shape.', zh: '无需处理；有效 JSON 语法已经保证接口数据形状。' }, correct: false }
      - { text: { en: 'Call JSON.stringify on the parsed value and compare string lengths.', zh: '对解析值调用 JSON.stringify，再比较字符串长度。' }, correct: false }
      - { text: { en: 'Check only that typeof result is object.', zh: '只检查 typeof result 是否为 object。' }, correct: false }
    explanation: { en: 'Parsing validates grammar, not an application contract. The extra null and array checks matter because typeof null is object and arrays are objects too.', zh: '解析只验证语法，不验证应用契约。typeof null 的结果是 object，数组也属于对象，所以必须额外排除两者。' }
    difficulty: beginner
    tags: [json-parse, validation, data-contract]

  - id: predict-reviver-deletion
    type: predict
    prompt: { en: 'What do these two console calls print?', zh: '这两个 console 调用会输出什么？' }
    code: |
      const values = JSON.parse('[1,2,3]', (key, value) => {
        if (typeof value === 'number' && value % 2 === 0) {
          return undefined;
        }
        return value;
      });

      console.log(values.length, 1 in values);
      console.log(JSON.stringify(values));
    lang: javascript
    options:
      - { text: { en: "2 true\n[1,3]", zh: "2 true\n[1,3]" }, correct: false }
      - { text: { en: "3 false\n[1,null,3]", zh: "3 false\n[1,null,3]" }, correct: true }
      - { text: { en: "3 true\n[1,undefined,3]", zh: "3 true\n[1,undefined,3]" }, correct: false }
      - { text: { en: 'The reviver cannot delete array elements.', zh: '恢复函数不能删除数组元素。' }, correct: false }
    explanation: { en: 'Returning undefined deletes index 1 but does not shift later elements, leaving a hole in a length-three array. Stringifying an array hole writes null.', zh: '返回 undefined 会删除索引 1，但不会移动后续元素，因此数组长度仍为 3，并留下空槽；序列化数组空槽时会写出 null。' }
    difficulty: intermediate
    tags: [json-parse, reviver, sparse-array, predict-output]

  - id: spot-date-replacer-order
    title: { en: 'Spot the bug in the Date replacer', zh: '找出 Date 替换器里的 bug' }
    type: spotbug
    prompt: { en: 'Find why this replacer never emits the intended tagged Date object.', zh: '找出为什么这个替换函数始终不会输出预期的带标签 Date 对象。' }
    code: |
      const text = JSON.stringify(
        { placedAt: new Date('2026-09-04T10:30:00.000Z') },
        (key, value) => {
          if (value instanceof Date) {
            return { type: 'Date', value: value.toISOString() };
          }
          return value;
        },
      );

      console.log(text);
    lang: javascript
    issues:
      - line: 4
        kind: correctness
        note: { en: 'Date.toJSON runs before the replacer, so value is already an ISO string and the instanceof condition is false. Construct the wire representation explicitly, or use a normal function and inspect the original holder property with care.', zh: 'Date.toJSON 先于替换函数运行，因此 value 已经是 ISO 字符串，instanceof 条件不会成立。应显式构造线格式，或谨慎地用普通函数检查持有者中的原始属性。' }
    explanation: { en: 'The serialization order matters: toJSON chooses an intermediate value before a replacer sees it. A replacer is not guaranteed to receive the original application object.', zh: '序列化顺序决定了结果：toJSON 会先选择中间值，替换函数随后才看到它，因此替换函数不保证收到原始应用对象。' }
    difficulty: intermediate
    tags: [json-stringify, replacer, date, tojson]

  - id: review-generated-payment-json
    title: { en: 'Review generated payment normalizer', zh: '审查生成的支付规范化函数' }
    type: review
    prompt: { en: 'Review this generated payment normalizer before it handles API input.', zh: '在这段生成的支付数据规范化函数处理 API 输入前，对它进行审查。' }
    task: { en: 'Accept a JSON object with a decimal-string id, a non-negative safe-integer amountCents, and an optional string note; return JSON containing only those three fields, preserve zero, reject malformed and invalid input distinctly, and never apply untrusted keys to an object prototype.', zh: '接收一个 JSON 对象，其中 id 是十进制字符串，amountCents 是非负安全整数，note 是可选字符串；返回只包含这三个字段的 JSON，保留数值 0，区分语法错误与无效数据，并且绝不把不可信键应用到对象原型。' }
    code: |
      function normalizePayment(body) {
        try {
          const input = JSON.parse(body);
          const payment = Object.assign({}, input);

          payment.id = BigInt(Number(payment.id));
          payment.amountCents = payment.amountCents || 100;
          payment.note = payment.note || '';

          delete payment.password;
          return JSON.stringify(payment, null, 2);
        } catch {
          return JSON.stringify({});
        }
      }

      const body = JSON.stringify({
        id: '9007199254740993',
        amountCents: 0,
        note: '',
        token: 'internal-secret',
      });
      console.log(normalizePayment(body));
    lang: javascript
    issues:
      - line: 4
        lines: 10
        kind: security
        note: { en: 'Copying arbitrary keys into an ordinary object can invoke the legacy __proto__ setter, and deleting only password still returns token and future secret fields. Build a new result from the three allowed fields.', zh: '把任意键复制进普通对象可能触发旧式 __proto__ setter，而且只删除 password 仍会返回 token 和未来新增的秘密字段。应只用三个允许字段构造新结果。' }
      - line: 6
        kind: correctness
        note: { en: 'Converting the decimal string through Number rounds an unsafe integer before BigInt sees it. Validate the string grammar and call BigInt on the string directly.', zh: '先把十进制字符串转换为 Number，会在 BigInt 读取前舍入不安全整数。应验证字符串语法，再直接把字符串传给 BigInt。' }
      - line: 7
        kind: edge-case
        note: { en: 'The || fallback changes the valid amount 0 to 100 and never verifies that other values are non-negative safe integers.', zh: '|| 回退会把合法金额 0 改成 100，而且完全没有验证其他值是否为非负安全整数。' }
      - line: 2
        lines: 13
        kind: readability
        note: { en: 'One broad try and empty catch result collapse syntax, validation, conversion, and serialization failures into the same successful-looking empty JSON object, hiding the failure contract and diagnostics.', zh: '一个宽泛的 try 和空结果 catch 把语法、验证、转换及序列化失败都变成看似成功的空 JSON 对象，隐藏了失败契约和诊断信息。' }
    right: { en: 'The generated code uses JSON.parse and JSON.stringify instead of concatenating JSON text, keeps conversion inside one boundary function, and recognizes that the identifier needs an integer representation.', zh: '生成代码使用 JSON.parse 和 JSON.stringify，而不是拼接 JSON 文本；它把转换放在同一个边界函数中，并意识到标识需要整数表示。' }
    checklist:
      - { en: 'Test malformed JSON separately from syntactically valid values with the wrong top-level type or fields.', zh: '把格式错误的 JSON 与语法有效但顶层类型或字段错误的值分开测试。' }
      - { en: 'Run zero, the safe-integer boundaries, an unsafe decimal identifier, and invalid numeric strings.', zh: '测试 0、安全整数边界、不安全十进制标识以及无效数字字符串。' }
      - { en: 'Add token, nested credentials, and __proto__ to the input, then compare output keys with the allowlist.', zh: '向输入加入 token、嵌套凭据和 __proto__，再把输出键与允许列表比较。' }
      - { en: 'Assert the documented error category and retained diagnostic cause for every failure stage.', zh: '对每个失败阶段断言文档规定的错误类别以及保留的诊断原因。' }
    explanation: { en: 'Parse in a narrow syntax-error boundary, validate the resulting object and each field, convert id directly from its checked decimal string, preserve amountCents without a truthiness fallback, and stringify a new allowlisted object. Report syntax and contract failures through distinct documented results.', zh: '应在狭窄的语法错误边界中解析，验证结果对象及每个字段，直接从已检查的十进制字符串转换 id，不用真假值回退修改 amountCents，并序列化一个按允许列表新建的对象。语法错误与契约错误应通过不同的文档化结果报告。' }
    difficulty: advanced
    tags: [json, code-review, validation, precision, security]
