topic: javascript/closures
items:
  - id: predict-var-loop-binding
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      const readers = [];
      for (var index = 0; index < 3; index += 1) {
        readers.push(() => index);
      }

      console.log(readers.map((read) => read()).join(','));
    lang: javascript
    options:
      - { text: { en: '0,1,2', zh: '0,1,2' }, correct: false }
      - { text: { en: '2,2,2', zh: '2,2,2' }, correct: false }
      - { text: { en: '3,3,3', zh: '3,3,3' }, correct: true }
      - { text: { en: 'It throws because index is out of scope.', zh: '程序会抛错，因为index已超出作用域。' }, correct: false }
    explanation: { en: 'All three functions close over one var binding. They run after the loop has advanced that binding to 3.', zh: '三个函数捕获同一个var绑定；调用发生在循环把该绑定更新为3之后。' }
    difficulty: beginner
    tags: [closures, var, loop, predict-output]

  - id: captured-binding-not-snapshot
    type: mcq
    prompt: { en: 'A closure reads a let binding that is reassigned after the function is created. Which value does a later call normally observe?', zh: '闭包读取一个let绑定，而该绑定在函数创建后被重新赋值。稍后调用通常会看到哪个值？' }
    options:
      - { text: { en: 'The value currently held by the shared binding', zh: '共享绑定当前保存的值' }, correct: true }
      - { text: { en: 'An immutable copy made when the function was created', zh: '创建函数时生成的不可变副本' }, correct: false }
      - { text: { en: 'A same-named local variable from the caller', zh: '调用者中同名的局部变量' }, correct: false }
    explanation: { en: 'Lexical lookup retains access to the binding, not a frozen value snapshot. A caller local with the same name does not replace the definition-site binding.', zh: '词法查找保留的是对绑定的访问路径，不是冻结的值快照；调用者中的同名局部变量不会替换定义位置的绑定。' }
    difficulty: intermediate
    tags: [closures, lexical-scope, binding]

  - id: factory-call-ownership
    type: mcq
    prompt: { en: 'Two consumers need independent retry counts. Which design gives each one a separate captured binding?', zh: '两个消费者需要独立的重试次数。哪种设计会为二者提供不同的捕获绑定？' }
    options:
      - { text: { en: 'Call the counter factory once for each consumer.', zh: '为每个消费者分别调用一次计数器工厂。' }, correct: true }
      - { text: { en: 'Call the factory once and assign its result to two variable names.', zh: '只调用一次工厂，再把结果赋给两个变量名。' }, correct: false }
      - { text: { en: 'Call the factory once and copy the returned function with object spread.', zh: '只调用一次工厂，再用对象展开复制返回的函数。' }, correct: false }
      - { text: { en: 'Store one returned function in two different arrays.', zh: '把同一个返回函数存入两个不同数组。' }, correct: false }
    explanation: { en: 'Each factory call creates a new set of parameter and local bindings. Renaming or storing one returned function does not clone its environment.', zh: '每次工厂调用都会创建一组新的参数和局部绑定；给同一个返回函数改名或换个容器存放，都不会克隆其环境。' }
    difficulty: beginner
    tags: [closures, factory, state-ownership]

  - id: spot-shared-counter
    title: { en: 'Spot the bug in named counters', zh: '找出命名计数器里的bug' }
    type: spotbug
    prompt: { en: 'Find why these named counters do not keep independent counts.', zh: '找出这些具名计数器为何不能保持独立计数。' }
    code: |
      function makeCounters(names) {
        let count = 0;
        return names.map((name) =>
          () => `${name}:${++count}`,
        );
      }

      const [uploads, retries] = makeCounters(['uploads', 'retries']);
      console.log(uploads(), retries(), uploads());
    lang: javascript
    issues:
      - line: 2
        kind: correctness
        note: { en: 'count belongs to the one makeCounters call, so every returned function increments the same binding. Create count inside a per-name factory call.', zh: 'count属于唯一一次makeCounters调用，因此所有返回函数都会递增同一个绑定；应在为每个名称调用的工厂内部创建count。' }
    explanation: { en: 'The map callback gets a per-item name binding, but count remains in the shared outer environment. Per-iteration binding for one variable does not isolate every captured variable.', zh: 'map回调为每个元素得到独立的name绑定，但count仍位于共享的外层环境；一个变量按轮次绑定，不会让所有捕获变量都自动隔离。' }
    difficulty: intermediate
    tags: [closures, shared-state, code-review]

  - id: review-generated-upload-handlers
    type: review
    title: { en: 'Review generated upload handlers', zh: '审查生成的上传处理器' }
    prompt: { en: 'Review these generated upload handlers before they are registered in a long-lived worker.', zh: '在把这些生成的上传处理器注册到长期运行的worker前，对它们进行审查。' }
    task: { en: 'Create one handler per user with an independent successful-upload count, retain at most 100 recent successful file names, return no access tokens, and provide cleanup using the registered function identity.', zh: '为每个用户创建处理器，各自统计成功上传次数，只保留最近100个成功上传的文件名，不返回访问令牌，并用注册时的函数标识提供清理操作。' }
    code: |
      function registerUploadHandlers(users, bus, transport) {
        const controls = [];
        let completed = 0;

        for (const user of users) {
          const recentFiles = [];
          const handle = async (file) => {
            completed += 1;
            await transport.upload(user.endpoint, file, user.accessToken);
            recentFiles.push(file.name);
            return { user: user.name, token: user.accessToken, completed };
          };

          bus.on(user.id, handle);
          controls.push({
            run: handle,
            stop: () => bus.off(user.id, handle),
          });
        }

        return controls;
      }
    lang: javascript
    issues:
      - line: 3
        kind: correctness
        note: { en: 'completed is created once outside the loop, so every handler closes over the same counter. Create the counter inside a per-user factory or iteration.', zh: 'completed只在循环外创建一次，因此所有处理器都捕获同一个计数器；应在逐用户工厂或每轮迭代内创建计数器。' }
      - line: 10
        kind: performance
        note: { en: 'recentFiles grows for the full handler lifetime and never enforces the 100-name cap, so a busy long-lived worker retains an unbounded list.', zh: 'recentFiles会在处理器整个生命周期内增长，完全没有执行100个名称的上限，因此繁忙的长期worker会保留无界列表。' }
      - line: 8
        kind: edge-case
        note: { en: 'completed increments before upload settles, so a rejected upload is counted as successful. Increment only after the awaited operation succeeds.', zh: 'completed在上传结束前就递增，因此被拒绝的上传也会计入成功次数；只应在等待的操作成功后递增。' }
      - line: 11
        kind: security
        note: { en: 'The returned summary exposes the captured access token. Return only the user name and completed count required by the caller.', zh: '返回摘要泄露了捕获的访问令牌；只应返回调用方需要的用户名和完成次数。' }
    right: { en: 'The code gives each iteration its own user and recentFiles bindings, records a file only after upload succeeds, and retains the exact handle function for removal.', zh: '代码让每轮迭代拥有独立的user和recentFiles绑定，只在上传成功后记录文件，并保留了用于移除的原handle函数。' }
    checklist:
      - { en: 'List every free variable and mark whether the task requires shared or per-handler ownership.', zh: '列出每个自由变量，并标明任务要求它由所有处理器共享还是由单个处理器独占。' }
      - { en: 'Force transport.upload to reject and verify that success state does not advance.', zh: '让transport.upload主动拒绝，并验证成功状态不会增加。' }
      - { en: 'Run more than 100 uploads and inspect the retained history length.', zh: '运行超过100次上传，并检查保留的历史记录长度。' }
      - { en: 'Compare returned data and registration cleanup for secrets and exact function identity.', zh: '检查返回数据是否含秘密，并核对注册清理使用的函数标识是否完全一致。' }
    explanation: { en: 'Give each handler its own completed binding, update success state only after upload resolves, trim retained history to 100 names, and return a redacted summary. Keep the original handle identity for bus.off.', zh: '应让每个处理器拥有独立的completed绑定，只在上传成功后更新成功状态，并把保留的历史限制为100个文件名，再返回脱敏摘要。bus.off应继续使用原handle函数标识。' }
    difficulty: advanced
    minutes: 8
    tags: [closures, code-review, async, lifecycle, security]
