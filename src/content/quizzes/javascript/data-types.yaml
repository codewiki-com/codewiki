topic: javascript/data-types
items:
  - id: predict-string-zero
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      const raw = "0";
      console.log(JSON.stringify([
        Boolean(raw),
        Number(raw),
        raw || "fallback",
        raw ?? "fallback",
      ]));
    lang: javascript
    options:
      - { text: { en: '[true,0,"0","0"]', zh: '[true,0,"0","0"]' }, correct: true }
      - { text: { en: '[false,0,"fallback","0"]', zh: '[false,0,"fallback","0"]' }, correct: false }
      - { text: { en: '[true,0,"fallback","fallback"]', zh: '[true,0,"fallback","fallback"]' }, correct: false }
      - { text: { en: '[true,null,"0","0"]', zh: '[true,null,"0","0"]' }, correct: false }
    explanation: { en: 'A non-empty string is truthy, even when its text is 0. Numeric conversion produces 0, and neither default operator replaces this truthy, non-nullish string.', zh: '非空字符串始终是真值，即使内容是0。数值转换得到0，而这个字符串既是真值也不是空值，所以两个默认运算符都不会替换它。' }
    difficulty: beginner
    tags: [coercion, truthy, nullish, predict-output]

  - id: predict-equality-algorithms
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      console.log(JSON.stringify([
        NaN === NaN,
        Object.is(NaN, NaN),
        [NaN].includes(NaN),
        new Set([+0, -0]).size,
      ]));
    lang: javascript
    options:
      - { text: { en: '[false,true,true,1]', zh: '[false,true,true,1]' }, correct: true }
      - { text: { en: '[false,true,false,2]', zh: '[false,true,false,2]' }, correct: false }
      - { text: { en: '[true,true,true,1]', zh: '[true,true,true,1]' }, correct: false }
      - { text: { en: '[false,false,true,2]', zh: '[false,false,true,2]' }, correct: false }
    explanation: { en: 'Strict equality does not equate NaN with itself. Object.is does, while includes and Set use SameValueZero, which also treats positive and negative zero as the same key.', zh: '严格相等不把NaN视为等于自身，Object.is则会。includes和Set使用SameValueZero，它还把正零与负零视为同一个键。' }
    difficulty: intermediate
    tags: [equality, nan, same-value-zero, predict-output]

  - id: validate-whole-decimal-integer
    type: mcq
    prompt: { en: 'A field must contain a complete non-negative decimal integer within the safe range. Which approach matches that contract?', zh: '字段必须是完整的非负十进制整数，并且位于安全范围内。哪种做法符合契约？' }
    options:
      - { text: { en: 'Validate String(value) with /^(0|[1-9]\\d*)$/, convert with Number, then call Number.isSafeInteger.', zh: '先用 /^(0|[1-9]\\d*)$/ 验证String(value)，再用Number转换并调用Number.isSafeInteger。' }, correct: true }
      - { text: { en: 'Call parseInt(value, 10) and accept any result that is not NaN.', zh: '调用parseInt(value, 10)，只要结果不是NaN就接受。' }, correct: false }
      - { text: { en: 'Call Number(value) and accept every finite result.', zh: '调用Number(value)，接受所有有限结果。' }, correct: false }
      - { text: { en: 'Use Boolean(value) before Number(value) to reject empty input.', zh: '在Number(value) 前使用Boolean(value) 来拒绝空输入。' }, correct: false }
    explanation: { en: 'The regular expression checks the whole grammar, Number performs the conversion, and isSafeInteger rejects fractions, infinities, and rounded integers outside the safe range.', zh: '正则检查完整语法，Number完成转换，isSafeInteger则拒绝小数、无穷值和超出安全范围后发生舍入的整数。' }
    difficulty: intermediate
    tags: [validation, number, safe-integer]

  - id: spot-generated-env-parser
    title: { en: 'Spot the bug in the environment parser', zh: '找出环境解析器里的bug' }
    type: spotbug
    prompt: { en: 'Find why this generated environment parser changes valid false and zero values.', zh: '找出这个生成的环境变量解析器为什么会改变有效的false与0。' }
    code: |
      function readWorkerOptions(env) {
        return {
          debug: Boolean(env.DEBUG),
          retries: Number(env.RETRIES || 3),
        };
      }

      console.log(readWorkerOptions({ DEBUG: "false", RETRIES: "0" }));
    lang: javascript
    issues:
      - line: 3
        kind: correctness
        note: { en: 'Boolean("false") is true because the string is non-empty; parse the accepted Boolean spellings explicitly.', zh: 'Boolean("false") 为true，因为该字符串非空；应显式解析允许的布尔拼写。' }
      - line: 4
        kind: edge-case
        note: { en: 'This happens to preserve the string "0" because it is truthy, but a numeric 0 would be replaced by 3; default on nullish absence and validate separately.', zh: '字符串 "0" 是真值，所以这里碰巧能保留；若输入是数字0，就会被3替换。应只对空值使用默认值，再单独验证。' }
    explanation: { en: 'Generic truthiness is not an input grammar. Give each field a parser and test both string inputs and already typed values when the boundary accepts both.', zh: '通用真值规则不是输入语法。应为每个字段编写解析器；若边界同时接受字符串与已有类型的值，就要测试这两类输入。' }
    difficulty: beginner
    tags: [code-review, boolean, defaults, environment]

  - id: review-generated-job-normalizer
    type: review
    title: { en: 'Review a generated job normalizer', zh: '审查生成的任务规范化函数' }
    prompt: { en: 'Review this generated normalizer before it handles untrusted job records.', zh: '在这段生成的规范化函数处理不可信任务记录前，对它进行审查。' }
    task: { en: 'Accept an own-property record with a Boolean or exact "true"/"false" enabled field, a complete decimal retries value from 0 to 10, a string-array labels field, and an optional name where an empty string is valid.', zh: '接收只含自有属性的记录：enabled为Boolean或准确的 "true"／"false"，retries为0到10的完整十进制值，labels为字符串数组，name可选且允许空字符串。' }
    code: |
      function normalizeJob(input) {
        const result = {};
        for (const key in input) {
          result[key] = input[key];
        }

        const enabled = Boolean(input.enabled);
        const retries = parseInt(input.retries, 10);
        if (!Number.isFinite(retries) || retries > 10) {
          throw new TypeError("invalid retries");
        }

        const labels = typeof input.labels === "object"
          ? [...input.labels]
          : [];

        result.enabled = enabled;
        result.retries = retries;
        result.labels = labels;
        result.name = input.name || "worker";
        return result;
      }
    lang: javascript
    issues:
      - line: 4
        kind: security
        note: { en: 'for...in copies inherited enumerable properties, and assignment to a normal object can trigger the __proto__ setter. Validate own allowlisted fields and construct the result explicitly.', zh: 'for...in会复制继承的可枚举属性，向普通对象赋值还可能触发 __proto__ setter。应验证允许列表中的自有字段，并显式构造结果。' }
      - line: 7
        kind: correctness
        note: { en: 'Boolean turns the accepted string "false" into true. Parse the two Boolean values and two permitted string spellings explicitly.', zh: 'Boolean会把允许的字符串 "false" 转成true。应显式解析两个布尔值以及两种允许的字符串拼写。' }
      - line: 8
        kind: edge-case
        note: { en: 'parseInt accepts prefixes such as "3jobs" and negative values are not rejected. Validate the complete decimal syntax and the full 0-to-10 range.', zh: 'parseInt会接受 "3jobs" 这类前缀，而且代码没有拒绝负数。应验证完整十进制语法及0到10的全部范围。' }
      - line: 20
        kind: readability
        note: { en: 'Using || hides the missing-value policy and discards the valid empty name. Use input.name ?? "worker" after validating that a supplied name is a string.', zh: '使用 || 会掩盖缺失值策略，并丢掉有效的空名称。验证已提供的name是字符串后，应使用input.name ?? "worker"。' }
    right: { en: 'The code returns a fresh outer object, has one named normalization boundary, caps retries at 10, and copies the labels iterable rather than returning the same outer container.', zh: '代码返回新的外层对象，把规范化集中在一个具名边界中，将重试次数上限设为10，并复制labels可迭代对象而不是返回同一个外层容器。' }
    checklist:
      - { en: 'Restrict input to own allowlisted fields before constructing output.', zh: '构造输出前，把输入限制为允许列表中的自有字段。' }
      - { en: 'Define complete parsers for Boolean and integer fields.', zh: '为布尔字段与整数字段定义完整解析器。' }
      - { en: 'Require labels to be an array and validate every element as a string.', zh: '要求labels是数组，并验证每个元素都是字符串。' }
      - { en: 'Test nullish names separately from valid empty strings.', zh: '分别测试空值名称与有效的空字符串。' }
    explanation: { en: 'Build a fresh allowlisted object, parse enabled without truthiness, validate retries before conversion, require Array.isArray plus string elements, and default name only when it is nullish.', zh: '应构造新的允许列表对象，不用真值规则解析enabled，在转换前验证retries，使用Array.isArray并检查字符串元素，只在name为空值时使用默认值。' }
    difficulty: advanced
    minutes: 7
    tags: [code-review, coercion, validation, prototype-pollution]
