topic: javascript/iterators-generators
items:
  - id: predict-generator-input-and-return
    type: predict
    prompt: { en: 'What does this program print?', zh: '这段程序会输出什么？' }
    code: |
      function* sequence() {
        const amount = yield 'ready';
        return amount * 2;
      }

      const iterator = sequence();
      const results = [iterator.next(10), iterator.next(7)];
      console.log(JSON.stringify(results));
    lang: javascript
    options:
      - { text: { en: '[{"value":"ready","done":false},{"value":14,"done":true}]', zh: '[{"value":"ready","done":false},{"value":14,"done":true}]' }, correct: true }
      - { text: { en: '[{"value":20,"done":false},{"done":true}]', zh: '[{"value":20,"done":false},{"done":true}]' }, correct: false }
      - { text: { en: '[{"value":"ready","done":false},{"value":20,"done":true}]', zh: '[{"value":"ready","done":false},{"value":20,"done":true}]' }, correct: false }
      - { text: { en: 'It throws because the first next call has an argument.', zh: '程序会抛错，因为第一次调用next时传入了参数。' }, correct: false }
    explanation: { en: 'The first next argument is ignored because no yield is suspended yet. The second call makes the previous yield evaluate to 7, and return produces the final done result.', zh: '第一次调用next时还没有暂停中的yield，因此实参会被忽略；第二次调用让上一个yield求值为7，return随后产生最终完成结果。' }
    difficulty: intermediate
    tags: [generators, next, yield, predict-output]

  - id: iterable-versus-iterator
    type: mcq
    prompt: { en: 'Which implementation gives a collection independent repeatable traversals?', zh: '哪种实现能让集合支持相互独立的重复遍历？' }
    options:
      - { text: { en: 'Create and return a fresh iterator on every Symbol.iterator call.', zh: '每次调用Symbol.iterator时创建并返回新的迭代器。' }, correct: true }
      - { text: { en: 'Store one iterator on the instance and return it every time.', zh: '在实例上保存一个迭代器，并在每次调用时返回它。' }, correct: false }
      - { text: { en: 'Return the collection itself even though it has no next method.', zh: '直接返回集合自身，即使它没有next方法。' }, correct: false }
      - { text: { en: 'Clone each iterator result after next returns it.', zh: '在next返回迭代结果后复制该结果。' }, correct: false }
    explanation: { en: 'Traversal state belongs to the iterator. Fresh iterators keep nested or interleaved consumers from sharing one cursor.', zh: '遍历状态属于迭代器；返回新迭代器可以避免嵌套或交错的消费者共享同一个游标。' }
    difficulty: beginner
    tags: [iterable, iterator, state, symbol-iterator]

  - id: spot-shared-catalog-cursor
    title: { en: 'Spot the bug in catalog traversal', zh: '找出目录遍历里的bug' }
    type: spotbug
    prompt: { en: 'Find why the second traversal of this catalog is empty.', zh: '找出第二次遍历这个目录时结果为空的原因。' }
    code: |
      function makeCatalog(items) {
        const iterator = items.values();
        return {
          [Symbol.iterator]() {
            return iterator;
          },
        };
      }

      const catalog = makeCatalog(['pen', 'book']);
      console.log([...catalog]);
      console.log([...catalog]);
    lang: javascript
    issues:
      - line: 5
        kind: correctness
        note: { en: 'Every traversal receives the same exhausted array iterator. Create items.values() inside Symbol.iterator so each call gets independent state.', zh: '每次遍历拿到的都是同一个已耗尽数组迭代器；应在Symbol.iterator内调用items.values()，让每次调用得到独立状态。' }
    explanation: { en: 'The returned object looks iterable, but its iterable method does not restart traversal. Repeatability depends on creating a fresh iterator, not merely exposing Symbol.iterator.', zh: '返回对象看起来可迭代，但它的可迭代方法不会重新开始遍历；能否重复遍历取决于是否创建新迭代器，而不只是公开Symbol.iterator。' }
    difficulty: intermediate
    tags: [iterable, shared-state, exhausted-iterator, code-review]

  - id: for-of-early-close
    type: mcq
    prompt: { en: 'What happens when break leaves a for...of loop before its generator finishes?', zh: '生成器尚未完成时，break离开for...of循环会发生什么？' }
    options:
      - { text: { en: 'The loop calls the iterator return method, allowing a surrounding finally block to run.', zh: '循环会调用迭代器的return方法，使包围产出点的finally块有机会运行。' }, correct: true }
      - { text: { en: 'The loop waits for garbage collection to run the generator finally block.', zh: '循环会等待垃圾回收执行生成器的finally块。' }, correct: false }
      - { text: { en: 'The generator restarts and consumes its remaining values in the background.', zh: '生成器会重新启动，并在后台消费剩余值。' }, correct: false }
      - { text: { en: 'The loop converts every remaining value into an array before exiting.', zh: '循环会在退出前把所有剩余值转换成数组。' }, correct: false }
    explanation: { en: 'Early loop exit performs iterator closing on an unfinished iterator. A generator return resumes its cleanup path synchronously; this is not a garbage-collection hook.', zh: '循环提前退出时会关闭尚未完成的迭代器；生成器的return会同步恢复清理路径，这不是垃圾回收钩子。' }
    difficulty: intermediate
    tags: [iterator-closing, for-of, return, cleanup]

  - id: review-generated-approved-collector
    title: { en: 'Review generated approved-ID collector', zh: '审查生成的获批ID收集器' }
    type: review
    prompt: { en: 'Review this generated collector before it consumes a long-lived order source.', zh: '在这段生成的收集函数消费长生命周期订单源前，对它进行审查。' }
    task: { en: 'Collect at most a finite positive limit of approved order IDs from a possibly long single-pass iterable, stop without reading an extra item, and close the source when the limit ends consumption early.', zh: '从可能很长的单次可迭代订单源中收集不超过有限正整数上限的已批准订单ID，不多读取一项，并在达到上限而提前结束时关闭数据源。' }
    code: |
      function collectApproved(source, limit) {
        const iterator = source[Symbol.iterator]();
        const approved = [];

        while (approved.length < limit) {
          const { value } = iterator.next();
          if (value === undefined) break;
          if (value.status === 'approved') approved.push(value.id);
        }

        return approved;
      }

      function* readOrders(rows) {
        try {
          for (const row of rows) yield row;
        } finally {
          console.log('closed');
        }
      }

      const rows = [{ id: 'A', status: 'approved' }];
      console.log(collectApproved(readOrders(rows), 1));
    lang: javascript
    issues:
      - line: 1
        kind: performance
        note: { en: 'The function never validates that limit is a finite positive integer. Infinity combined with an endless source containing no approved rows can keep the loop running forever.', zh: '函数没有验证limit是有限正整数；当limit为Infinity，而且无限数据源始终没有已批准订单时，循环可能永远运行。' }
      - line: 5
        kind: readability
        note: { en: 'The manual driver hides iterator-closing responsibility. A for...of loop with an explicit approved-count check expresses advancement and automatic early closing more clearly.', zh: '手动驱动隐藏了迭代器关闭责任；使用for...of并明确检查已批准数量，可以更清楚地表达推进过程与自动提前关闭。' }
      - line: 6
        kind: correctness
        note: { en: 'Destructuring only value discards done. A completed iterator can have a final value, while an active iterator may legally yield undefined; neither case is handled correctly.', zh: '只解构value会丢失done；已完成迭代器可以带最终值，未完成迭代器也可以合法产出undefined，这两种情况都没有被正确处理。' }
      - line: 11
        kind: edge-case
        note: { en: 'Reaching the limit returns without calling iterator.return(), leaving a suspended resource-owning source open. Close in a finally block or use for...of so early return performs IteratorClose.', zh: '达到上限后直接返回，没有调用iterator.return()，会让拥有资源的数据源保持暂停和开启；应在finally中关闭，或使用能在提前返回时执行IteratorClose的for...of。' }
    right: { en: 'The generated code requests values one at a time, keeps only approved IDs, avoids reading beyond the iteration performed by its loop body, and preserves the source behind a narrow collector interface.', zh: '生成代码每次只请求一个值，只保留已批准订单的ID，没有在循环体之外额外读取数据，并把数据源封装在范围明确的收集接口之后。' }
    checklist:
      - { en: 'Validate zero, negative, fractional, NaN, and infinite limits before touching the source.', zh: '接触数据源前验证0、负数、小数、NaN和无限上限。' }
      - { en: 'Keep value and done separate, including a test where the sequence yields undefined.', zh: '分别处理value与done，并加入序列产出undefined的测试。' }
      - { en: 'Count next calls to prove the collector does not read one item beyond the requested limit.', zh: '统计next调用次数，证明收集函数不会比请求上限多读取一项。' }
      - { en: 'Assert cleanup on normal completion, early limit, and a consumer-side exception.', zh: '分别断言正常完成、达到上限提前结束和消费方异常时的清理行为。' }
    explanation: { en: 'Validate the bound first, consume with for...of, return immediately after collecting the requested count, and rely on the loop closing its unfinished iterator while a generator finally releases the resource.', zh: '应先验证上限，再用for...of消费，收集到所需数量后立即返回，并让循环关闭未完成的迭代器，由生成器的finally释放资源。' }
    difficulty: advanced
    tags: [iterators, generators, code-review, cleanup, bounded-consumption]
