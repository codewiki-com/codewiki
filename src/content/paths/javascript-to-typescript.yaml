id: javascript-to-typescript
title: { en: 'JavaScript foundations for TypeScript', zh: '面向TypeScript的JavaScript基础' }
description:
  en: 'A migration-focused route through JavaScript values, object behavior, asynchronous control flow, and the runtime boundaries that static types cannot verify.'
  zh: '一条面向迁移的学习路径，依次掌握JavaScript的值、对象行为、异步控制流，以及静态类型无法验证的运行时边界。'
rationale:
  en: 'Start with JavaScript values and transformations because TypeScript describes those runtime operations rather than replacing them. Then make scope, receivers, prototypes, and classes explicit before modeling object contracts. Learn promises and streams next so asynchronous return and failure paths are clear. Finish with modules, runtime validation, tests, and a small Alpine.js boundary, where a staged migration needs its strongest safeguards.'
  zh: '先学习JavaScript的值与数据转换，因为TypeScript描述的是这些运行时操作，并不会取代它们。随后厘清作用域、接收者、原型与类，再为对象约定建模。接着掌握Promise与流，明确异步返回路径和失败路径。最后学习模块、运行时校验、测试和一个小型Alpine.js边界，因为分阶段迁移最需要在这些位置建立可靠保障。'
tracks: [javascript]
level: { from: beginner, to: intermediate }
hours: 22
outcomes:
  - { en: 'Trace coercion, closure capture, receiver binding, and prototype lookup before adding static types.', zh: '在添加静态类型前，能够追踪类型强制转换、闭包捕获、接收者绑定和原型查找。' }
  - { en: 'Specify synchronous and asynchronous success, failure, and streaming behavior as migration-ready contracts.', zh: '把同步与异步的成功、失败和流式行为写成适合迁移的约定。' }
  - { en: 'Prepare a modular Alpine.js feature for staged migration with runtime validation and focused Vitest coverage.', zh: '通过运行时校验和有针对性的Vitest测试，让模块化Alpine.js功能具备分阶段迁移条件。' }
milestones:
  - id: dynamic-core
    title: { en: 'Dynamic values and transformations', zh: '动态值与数据转换' }
    topics:
      - javascript/fundamentals
      - javascript/data-types
      - javascript/functions
      - javascript/array-methods
      - javascript/object-methods
      - javascript/destructuring
    checkpoint: javascript/checkpoint-1
  - id: scope-objects
    title: { en: 'Scope, receivers, and objects', zh: '作用域、接收者与对象' }
    topics:
      - javascript/arrow-functions
      - javascript/closures
      - javascript/this-binding
      - javascript/call-apply-bind
      - javascript/objects-prototypes
      - javascript/classes
    checkpoint: javascript/checkpoint-2
  - id: async-contracts
    title: { en: 'Asynchronous contracts', zh: '异步约定' }
    topics:
      - javascript/event-loop
      - javascript/promises
      - javascript/promise-methods
      - javascript/async-await
      - javascript/async-iterators
      - javascript/streams
    checkpoint: javascript/checkpoint-3
  - id: migration-boundaries
    title: { en: 'Migration boundaries and safeguards', zh: '迁移边界与保障' }
    topics:
      - javascript/modules
      - javascript/error-handling
      - javascript/json
      - javascript/form-validation
      - javascript/vitest
      - javascript/alpinejs
    checkpoint: javascript/checkpoint-4
edges:
  - { from: javascript/functions, to: javascript/closures }
  - { from: javascript/functions, to: javascript/arrow-functions }
  - { from: javascript/data-types, to: javascript/objects-prototypes }
  - { from: javascript/objects-prototypes, to: javascript/classes }
  - { from: javascript/functions, to: javascript/promises }
  - { from: javascript/event-loop, to: javascript/promises }
  - { from: javascript/promises, to: javascript/async-await }
  - { from: javascript/async-await, to: javascript/async-iterators }
  - { from: javascript/modules, to: javascript/vitest }
  - { from: javascript/error-handling, to: javascript/form-validation }
  - { from: javascript/json, to: javascript/alpinejs }
