# Structure follows the Path mockup (docs/design/mockups/Path.dc.html): 23 topics, 5 milestones,
# one checkpoint each. Topics that do not exist yet render as "coming soon" on the path page.
title: { en: 'Python from zero', zh: '从零开始学 Python' }
description:
  en: 'Twenty-three topics in five milestones, each closed by a checkpoint. By the end you can read real
    Python, write a small tool with tests, and know which parts of the language you have not met yet.'
  zh: '二十三个主题、五个里程碑，每个里程碑以一次检查点收尾。学完之后，你能读懂真实项目里的 Python，写出带测试的小工具，也清楚自己还有哪些部分没有接触过。'
rationale:
  en: 'Foundations establish scope, closures lead into decorators, objects support real programs, and concurrency and types come last once the core execution model is familiar.'
  zh: '先用基础知识建立作用域概念，再由闭包进入装饰器，以对象支撑真实程序，最后在熟悉核心执行模型后学习并发与类型。'
tracks: [python]
level: { from: beginner, to: intermediate }
hours: 14
outcomes:
  - { en: 'Read most Python in the wild without a dictionary.', zh: '读懂大多数真实项目里的 Python，不用边读边查。' }
  - { en: 'Write a CLI tool with tests, types and a lockfile.', zh: '写出带测试、类型标注和锁文件的命令行工具。' }
  - { en: 'Explain the GIL and pick asyncio or threads on purpose.', zh: '讲清楚 GIL，并且有依据地在 asyncio 和线程之间做选择。' }
milestones:
  - id: m1
    title: { en: 'Foundations', zh: '基础' }
    topics:
      - python/variables-types
      - python/control-flow
      - python/strings-fstrings
      - python/functions
      - python/scope-legb
      - python/lists-dicts-sets
    checkpoint: python/checkpoint-1
  - id: m2
    title: { en: 'Functions, deeper', zh: '函数进阶' }
    topics:
      - python/closures
      - python/decorators
      - python/args-kwargs
      - python/functools
      - python/generators
    checkpoint: python/checkpoint-2
  - id: m3
    title: { en: 'Objects', zh: '对象' }
    topics:
      - python/classes-objects
      - python/dataclasses
      - python/exceptions
      - python/protocols-abcs
    checkpoint: python/checkpoint-3
  - id: m4
    title: { en: 'Real programs', zh: '真实程序' }
    topics:
      - python/files-pathlib
      - python/json-http
      - python/testing-pytest
      - python/packaging-uv
    checkpoint: python/checkpoint-4
  - id: m5
    title: { en: 'Concurrency and types', zh: '并发与类型' }
    topics:
      - python/asyncio
      - python/threads-gil
      - python/type-hints
      - python/mypy
    checkpoint: python/checkpoint-5
edges:
  - { from: python/functions, to: python/closures }
  - { from: python/scope-legb, to: python/closures }
  - { from: python/closures, to: python/decorators }
  - { from: python/classes-objects, to: python/dataclasses }
  - { from: python/dataclasses, to: python/json-http }
