id: python-from-zero
title: { en: 'Python from zero', zh: 'Python从零起步' }
description: { en: 'A 26-topic route from Python syntax and data to tested command-line programs, explicit object contracts, static typing, and deliberate concurrency.', zh: '一条包含26个主题的学习路线：从Python语法与数据入门，逐步学会编写经过测试的命令行程序、明确对象约定，并掌握静态类型与并发选择。' }
rationale: { en: 'Values and control flow come first because every later example depends on them. Functions add binding, scope, closures, and lazy iteration before classes turn behavior into reusable object contracts. Resource handling, files, serialization, command-line parsing, logging, and tests then combine those mechanics in a small program. Type contracts and concurrency come last, when function boundaries, object ownership, failure propagation, and cleanup are already familiar.', zh: '先学习值与控制流，因为后续示例都依赖这些基础。接着通过函数掌握参数绑定、作用域、闭包与惰性迭代，再用类把行为组织成可复用的对象约定。随后将资源管理、文件、序列化、命令行解析、日志与测试组合成小型程序。最后学习类型约定与并发，此时已经熟悉函数边界、对象所有权、失败传播和资源清理。' }
tracks: [python]
level: { from: beginner, to: intermediate }
hours: 27
outcomes:
  - { en: 'Trace names, values, branches, function calls, iteration, and object method dispatch in unfamiliar Python code.', zh: '在陌生的Python代码中追踪名称、值、分支、函数调用、迭代过程和对象方法分派。' }
  - { en: 'Build and test a command-line program that reads files, validates JSON, manages resources, and emits useful logs.', zh: '构建并测试一个能够读取文件、验证JSON、管理资源并输出有效日志的命令行程序。' }
  - { en: 'Define typed object contracts and choose among asyncio, threads, and processes for a stated workload.', zh: '定义带类型的对象约定，并根据给定工作负载在asyncio、线程和进程之间作出选择。' }
milestones:
  - id: basics
    title: { en: 'Syntax, values, and control flow', zh: '语法、值与控制流' }
    topics: [python/python-fundamentals, python/variables-data-types, python/control-flow, python/list-comprehensions, python/sets]
    checkpoint: python/checkpoint-1
  - id: functions-deeper
    title: { en: 'Functions, scope, and iteration', zh: '函数、作用域与迭代' }
    topics: [python/functions, python/scope-namespaces, python/args-kwargs, python/closures, python/generators-iterators]
    checkpoint: python/checkpoint-2
  - id: objects
    title: { en: 'Objects and explicit interfaces', zh: '对象与显式接口' }
    topics: [python/classes-objects, python/inheritance-polymorphism, python/magic-methods, python/dataclasses, python/abc]
    checkpoint: python/checkpoint-3
  - id: practical-programs
    title: { en: 'Files, command lines, and tests', zh: '文件、命令行与测试' }
    topics: [python/context-managers, python/pathlib-file-handling, python/json, python/argparse, python/logging, python/pytest]
    checkpoint: python/checkpoint-4
  - id: types-concurrency
    title: { en: 'Types and concurrency', zh: '类型与并发' }
    topics: [python/type-hints, python/typing-advanced, python/asyncio, python/threading-multiprocessing, python/concurrent-futures]
    checkpoint: python/checkpoint-5
