id: go-for-backend
title: { en: 'Go for backend engineering', zh: 'Go后端工程路径' }
description: { en: 'Thirty topics take you from Go syntax and API design through concurrent HTTP services, database access, testing, and evidence-based performance work.', zh: '通过30个主题，从Go语法与API设计逐步学到并发HTTP服务、数据库访问、测试和基于证据的性能优化。' }
rationale: { en: 'Language and module rules come first so types and interfaces have a firm base. Collections and explicit error contracts then prepare you for cancellation-aware concurrency; those lifecycle rules carry into I/O, HTTP, and SQL boundaries. Tests, static analysis, benchmarks, profiles, and traces come last because optimization is useful only after service behavior is correct and observable.', zh: '先学习语言与模块规则，为类型和接口打牢基础；再掌握集合与显式错误契约，为支持取消的并发程序做好准备。并发生命周期规则随后贯穿I/O、HTTP与SQL边界。测试、静态分析、基准测试、性能剖析和执行跟踪放在最后，因为只有服务行为正确且可观测时，优化才有意义。' }
tracks: [go]
level: { from: beginner, to: advanced }
hours: 46
outcomes:
  - { en: 'Design Go APIs with structs, methods, small interfaces, generics, and inspectable error contracts.', zh: '使用结构体、方法、小接口、泛型和可检查的错误契约设计Go API。' }
  - { en: 'Build a cancellation-aware concurrent HTTP service with buffered I/O, structured logging, and safe SQL boundaries.', zh: '构建支持取消的并发HTTP服务，并正确处理缓冲I/O、结构化日志和安全的SQL边界。' }
  - { en: 'Verify correctness and performance with tests, fuzzing, static analysis, benchmarks, profiles, and execution traces.', zh: '使用测试、模糊测试、静态分析、基准测试、性能剖析和执行跟踪验证正确性与性能。' }
milestones:
  - id: language-foundations
    title: { en: 'Language and API foundations', zh: '语言与API基础' }
    topics:
      - go/fundamentals
      - go/modules
      - go/structs
      - go/methods
      - go/interfaces
    checkpoint: go/checkpoint-1
  - id: data-and-failures
    title: { en: 'Data and failure contracts', zh: '数据与失败契约' }
    topics:
      - go/slices
      - go/maps
      - go/generics
      - go/error-handling
      - go/error-wrapping
      - go/defer-panic-recover
    checkpoint: go/checkpoint-2
  - id: concurrency-lifecycle
    title: { en: 'Concurrency and lifecycle', zh: '并发与生命周期' }
    topics:
      - go/goroutines-channels
      - go/select
      - go/sync
      - go/context
      - go/concurrency-patterns
    checkpoint: go/checkpoint-3
  - id: service-boundaries
    title: { en: 'Service boundaries', zh: '服务边界' }
    topics:
      - go/io-package
      - go/bufio
      - go/json
      - go/http
      - go/http-server
      - go/database
      - go/sqlx
      - go/slog
    checkpoint: go/checkpoint-4
  - id: verification-performance
    title: { en: 'Verification and performance', zh: '验证与性能' }
    topics:
      - go/testing
      - go/go-vet
      - go/fuzzing
      - go/benchmark
      - go/pprof
      - go/trace
    checkpoint: go/checkpoint-5
edges:
  - { from: go/fundamentals, to: go/structs }
  - { from: go/structs, to: go/methods }
  - { from: go/methods, to: go/interfaces }
  - { from: go/interfaces, to: go/generics }
  - { from: go/error-handling, to: go/error-wrapping }
  - { from: go/goroutines-channels, to: go/select }
  - { from: go/sync, to: go/concurrency-patterns }
  - { from: go/context, to: go/http }
  - { from: go/io-package, to: go/bufio }
  - { from: go/json, to: go/http-server }
  - { from: go/database, to: go/sqlx }
  - { from: go/testing, to: go/benchmark }
  - { from: go/benchmark, to: go/pprof }
  - { from: go/pprof, to: go/trace }
