id: ai-native-developer
title: { en: 'AI-native developer', zh: 'AI原生开发者' }
description: { en: 'A practical route from model fundamentals to grounded agents, reliable tool use, evaluation, security, and local deployment.', zh: '一条从模型基础走向可信智能体、可靠工具调用、评估、安全与本地部署的实践路线。' }
rationale: { en: 'Start with language, neural-network, transformer, and prompt mechanics so model behavior is not a black box. Next, make provider responses and tool calls explicit contracts before adding retrieval. Build stateful and multimodal agents only after those boundaries are clear, then finish with evaluation, observability, security, reproducible artifacts, local serving, and adaptation.', zh: '先学习语言、神经网络、Transformer与提示词机制，避免把模型行为视为黑箱；再把服务商响应和工具调用落实为明确契约，然后引入检索。边界清晰后再构建有状态、多模态智能体，最后补齐评估、可观测性、安全、可复制制品、本地服务与模型适配。' }
tracks: [ai]
level: { from: beginner, to: advanced }
hours: 40
outcomes:
  - { en: 'Design an LLM feature with versioned prompts, explicit provider boundaries, and schema-validated outputs.', zh: '设计具备提示词版本管理、明确服务商边界和模式验证输出的大模型功能。' }
  - { en: 'Build a grounded, stateful agent that retrieves evidence, calls allowlisted tools, and pauses risky actions for approval.', zh: '构建能够检索证据、调用允许列表内工具，并在高风险操作前暂停审批的有状态智能体。' }
  - { en: 'Evaluate, trace, secure, and deploy an AI system with reproducible model artifacts and measured quality, latency, and cost.', zh: '使用可复制的模型制品部署AI系统，并对其质量、延迟和成本进行评估、追踪与安全治理。' }
milestones:
  - id: model-foundations
    title: { en: 'Model and prompt foundations', zh: '模型与提示词基础' }
    topics:
      - ai/getting-started
      - ai/nlp
      - ai/deep-learning-basics
      - ai/transformer-architecture
      - ai/prompt-engineering
    checkpoint: ai/checkpoint-1
  - id: reliable-interfaces
    title: { en: 'Reliable model interfaces', zh: '可靠的模型接口' }
    topics:
      - ai/openai-api
      - ai/claude-api
      - ai/structured-output
      - ai/function-calling
      - ai/mcp
    checkpoint: ai/checkpoint-2
  - id: grounded-knowledge
    title: { en: 'Grounded knowledge systems', zh: '知识增强系统' }
    topics:
      - ai/embeddings
      - ai/vector-database
      - ai/rag-retrieval-augmented-generation
      - ai/knowledge-graph
      - ai/langchain
    checkpoint: ai/checkpoint-3
  - id: agentic-systems
    title: { en: 'Stateful and multimodal agents', zh: '有状态多模态智能体' }
    topics:
      - ai/ai-agents
      - ai/langgraph
      - ai/multimodal-ai
      - ai/vlm
      - ai/claude-computer-use
    checkpoint: ai/checkpoint-4
  - id: production-adaptation
    title: { en: 'Production and adaptation', zh: '生产化与模型适配' }
    topics:
      - ai/llm-evaluation
      - ai/ai-observability
      - ai/llm-jailbreak-prevention
      - ai/huggingface
      - ai/local-llms
      - ai/llm-finetuning
    checkpoint: ai/checkpoint-5
edges:
  - { from: ai/deep-learning-basics, to: ai/transformer-architecture }
  - { from: ai/transformer-architecture, to: ai/embeddings }
  - { from: ai/prompt-engineering, to: ai/structured-output }
  - { from: ai/openai-api, to: ai/function-calling }
  - { from: ai/function-calling, to: ai/mcp }
  - { from: ai/embeddings, to: ai/vector-database }
  - { from: ai/vector-database, to: ai/rag-retrieval-augmented-generation }
  - { from: ai/rag-retrieval-augmented-generation, to: ai/langchain }
  - { from: ai/ai-agents, to: ai/langgraph }
  - { from: ai/multimodal-ai, to: ai/vlm }
  - { from: ai/vlm, to: ai/claude-computer-use }
  - { from: ai/llm-evaluation, to: ai/ai-observability }
  - { from: ai/huggingface, to: ai/local-llms }
  - { from: ai/llm-evaluation, to: ai/llm-finetuning }
