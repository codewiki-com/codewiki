id: frontend-foundations
title: { en: 'Frontend foundations', zh: '前端基础' }
description: { en: 'A practical route from browser-native structure and layout to accessible interfaces, reliable tests, and measured production delivery.', zh: '从浏览器原生结构与布局出发，逐步掌握无障碍界面、可靠测试与可度量的生产交付。' }
rationale: { en: 'Browser semantics and layout come first because every later abstraction renders onto that platform. Accessibility then constrains interaction and styling choices, component tooling makes those choices repeatable and testable, and build and performance work comes last so optimization is guided by verified behavior and measurements.', zh: '先学习浏览器语义与布局，因为后续抽象最终都要渲染到这一平台；再用无障碍要求约束交互与样式选择，通过组件工具让这些选择可复用、可测试，最后在行为已经验证的前提下依据测量结果完成构建与性能优化。' }
tracks: [frontend]
level: { from: beginner, to: intermediate }
hours: 32
outcomes:
  - { en: 'Build a semantic, responsive interface whose navigation, motion, and forms work with keyboards and assistive technology.', zh: '构建语义清晰的响应式界面，使导航、动效与表单能够通过键盘和辅助技术使用。' }
  - { en: 'Develop reusable component styles, document their states in Storybook, and test behavior at unit and browser levels.', zh: '开发可复用的组件样式，在 Storybook 中记录组件状态，并从单元与浏览器层面测试行为。' }
  - { en: 'Use Vite, code splitting, tree shaking, responsive images, and Web Vitals evidence to improve a production build.', zh: '使用 Vite、代码分割、Tree Shaking、响应式图片与 Web Vitals 数据改进生产构建。' }
milestones:
  - id: browser-foundations
    title: { en: 'Browser foundations', zh: '浏览器基础' }
    topics:
      - frontend/getting-started
      - frontend/html-semantic-tags
      - frontend/css-flexbox
      - frontend/css-grid
      - frontend/responsive-design
    checkpoint: frontend/checkpoint-1
  - id: accessible-interfaces
    title: { en: 'Accessible interfaces', zh: '无障碍界面' }
    topics:
      - frontend/accessibility
      - frontend/form-validation
      - frontend/css-animation
      - frontend/sass
      - frontend/tailwind-css
    checkpoint: frontend/checkpoint-2
  - id: component-confidence
    title: { en: 'Component confidence', zh: '可靠组件' }
    topics:
      - frontend/css-in-js
      - frontend/storybook
      - frontend/testing
      - frontend/vitest
      - frontend/playwright
    checkpoint: frontend/checkpoint-3
  - id: production-delivery
    title: { en: 'Production delivery', zh: '生产交付' }
    topics:
      - frontend/vite-guide
      - frontend/code-splitting
      - frontend/tree-shaking
      - frontend/image-optimization
      - frontend/performance
    checkpoint: frontend/checkpoint-4
edges:
  - { from: frontend/getting-started, to: frontend/html-semantic-tags }
  - { from: frontend/css-flexbox, to: frontend/responsive-design }
  - { from: frontend/css-grid, to: frontend/responsive-design }
  - { from: frontend/html-semantic-tags, to: frontend/accessibility }
  - { from: frontend/accessibility, to: frontend/form-validation }
  - { from: frontend/accessibility, to: frontend/css-animation }
  - { from: frontend/sass, to: frontend/css-in-js }
  - { from: frontend/tailwind-css, to: frontend/storybook }
  - { from: frontend/testing, to: frontend/vitest }
  - { from: frontend/testing, to: frontend/playwright }
  - { from: frontend/vite-guide, to: frontend/code-splitting }
  - { from: frontend/vite-guide, to: frontend/tree-shaking }
  - { from: frontend/image-optimization, to: frontend/performance }
  - { from: frontend/code-splitting, to: frontend/performance }
