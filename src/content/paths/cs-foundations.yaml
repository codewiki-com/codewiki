id: cs-foundations
title: { en: 'Computer science foundations', zh: '计算机科学基础' }
description: { en: 'A practical route through algorithms, data representation, operating systems, developer tools, and network protocols.', zh: '一条贯穿算法、数据表示、操作系统、开发工具与网络协议的实践学习路线。' }
rationale: { en: 'Complexity and core data structures come first because they supply the cost models and invariants used throughout the path. Text, numbers, and time follow so programs can represent real inputs without silent corruption. Linux, processes, memory, shell pipelines, and Git then make execution and debugging concrete. Networking comes last because sockets, DNS, TLS, HTTP/2, and WebSocket all depend on those resource, boundary, and failure models.', zh: '先学习复杂度与核心数据结构，因为它们提供贯穿整条路线的成本模型和不变量；随后学习文本、数字与时间，避免程序在表示真实输入时悄然出错。接着通过 Linux、进程、内存、Shell 管道与 Git 理解具体的执行和调试过程。最后学习网络，因为套接字、DNS、TLS、HTTP/2 与 WebSocket 都依赖前面建立的资源、边界与失败模型。' }
tracks: [foundations]
level: { from: beginner, to: intermediate }
hours: 46
outcomes:
  - { en: 'Analyze an operation workload, choose an appropriate algorithm and data structure, and justify its time, space, and correctness invariants.', zh: '分析操作负载，选择合适的算法与数据结构，并从时间、空间和正确性不变量三方面说明依据。' }
  - { en: 'Build and debug a Linux command-line workflow that preserves text, numeric, time, process, stream, memory, and Git-state boundaries.', zh: '构建并调试 Linux 命令行工作流，正确处理文本、数字、时间、进程、数据流、内存与 Git 状态边界。' }
  - { en: 'Trace a network exchange from socket and DNS resolution through TLS and HTTP, then design bounded retry, flow-control, and WebSocket recovery behavior.', zh: '从套接字与 DNS 解析开始，经由 TLS 与 HTTP 跟踪一次网络交换，并设计有边界的重试、流量控制与 WebSocket 恢复机制。' }
milestones:
  - id: algorithms-and-structures
    title: { en: 'Algorithms and structures', zh: '算法与数据结构' }
    topics:
      - foundations/algorithmic-complexity
      - foundations/arrays-and-linked-lists
      - foundations/sorting-and-searching
      - foundations/recursion
      - foundations/hash-maps
      - foundations/trees-and-graphs
    checkpoint: foundations/checkpoint-1
  - id: data-representation
    title: { en: 'Data representation', zh: '数据表示' }
    topics:
      - foundations/unicode-text
      - foundations/regular-expressions
      - foundations/floating-point-arithmetic
      - foundations/dates-and-time
      - foundations/i18n
    checkpoint: foundations/checkpoint-2
  - id: systems-and-tools
    title: { en: 'Systems and tools', zh: '系统与工具' }
    topics:
      - foundations/linux
      - foundations/processes-and-threads
      - foundations/virtual-memory
      - foundations/shell-basics
      - foundations/pipes-and-redirection
      - foundations/git-deep-dive
    checkpoint: foundations/checkpoint-3
  - id: network-stack
    title: { en: 'Network stack', zh: '网络栈' }
    topics:
      - foundations/network-programming
      - foundations/dns-resolution
      - foundations/tls-connections
      - foundations/http-semantics
      - foundations/http2
      - foundations/websocket
    checkpoint: foundations/checkpoint-4
